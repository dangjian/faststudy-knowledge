# prerequisite 方向金标（人工判定，2026-10-25）
#
# 用途：验证「先修边的方向和类型是否正确」。lint 只能保证图无环、端点合法、
# 档位已标；它回答不了「学 A 之前真的必须先学 B 吗」。这是补救路径的直接输入，
# 错一条就会让学生被指去补无关的知识点。
#
# 抽样：分层确定性取序 300 条（FNV-1a 哈希）
#   A audited  120 条（全库先修复核（2026-08） 结案时逐条复核过的存量，池 1,475）
#   B promoted 120 条（2026-10-25 抽样 30 条后整批升档，池 228；升档前冻结在 2d885506^ 快照）
#   C sampled   60 条（仍是 sampled 未升档，池 126，以英语为主）
#
# verdict: correct=方向与类型成立 / wrong=应转 part_of 或方向反了 / unsure=无法判定
# 实测基线（2026-10-25，可判定条目上算）：
#   A audited   102/116 = 87.9%（14 错：9 条应转 part_of、5 条方向/方法错）
#   B promoted 110/119 = 92.4%（9 错：全部方向错）
#   C sampled   51/60  = 85.0%（9 错：5 条应转 part_of、4 条方向或依赖错位）
# 结论：三档精度几乎持平（88/92/85），此前「两档差一个量级」的判断不成立。
# 判读口径：只看「学会 from 是否必须先会 to」，不因册次倒置判错（主锚册次常有假象）。

