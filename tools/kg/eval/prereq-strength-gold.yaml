# prerequisite 强度金标：198 条（hard / soft）
#
# 判据（见 rubric-cases.md 第十五节）：
#   hard = 不会 B 就学不下去 A——A 的推导或操作**直接调用** B
#   soft = 有帮助但非门槛——只是顺序在前、同领域、背景相关
#
# 抽样：按学科分层（数学 55 / 物理 26 / 历史 24 / 地理 20 / 英语 18 / 化学 16 /
#   语文 16 / 生物 10 / 科学 8 / 道法 5），确定性哈希取序；由独立 agent 盲判，不给既有结论。
# 结果：hard 135（68.2%）/ soft 63（31.8%）。
#
# 已知：两条便宜规则都远不达标，故不得用规则批量填——
#   「跨年级=hard」一致率 40.9%（同年级里仍有 95 条 hard）
#   「B 出现在 A 释义/正文=hard」一致率 56.6%

