# covered_by 归属金标（人工判定，2026-10-25）
#
# 用途：验证「概念挂在哪个节/章」这一层语义是否正确——lint 只能校验结构，
# 无法回答“这节真的讲了这个概念吗”。每次改动 covered_by 前后跑 eval_covered.ts 对照。
#
# 抽样：2026-10-25 分层抽 100 条（确定性哈希取序，见 tools/kg/eval/ 生成记录）；
#  2026-10-26 移除 3 条（换元法/林彪/第24届冬季奥运会）——三者不是教材知识点：
#  换元法在 99 册正文出现 0 次；林彪是人名（非课标知识点）；冬奥会只出现在 OCR 残句。
#  实体与全部关联边已一并删除，故金标 100 → 97 条。
#   A 章级 40（本轮两级化迁移的对象，用于验证迁移是否成立）
#   B 节级已锚定 40（对照组：字面命中是否等于真讲了）
#   C 节级未锚定 20（对照组：规则误报率）
#
# verdict: correct=归属正确 / wrong=归属错误 / unsure=无法判定
# 基线（本次抽样实测，2026-10-25；正确率只在可判定条目上算，另列待核比例）：
#   A 章级     : correct 28 / wrong 2 / unsure 10 → 可判定 30 条中 93.3% 正确，25% 待核
#   B 节级已锚定: correct 34 / wrong 1 / unsure 5  → 可判定 35 条中 97.1% 正确，12.5% 待核
#   C 节级未锚定: correct 15 / wrong 0 / unsure 5  → 可判定 15 条中 100% 正确（规则误报，全是假阴性）
# 判读口径：以节/章正文为准；「仅背景提及」「图注标注」「单元写作指导串入」不算该节主讲。
# 判据与仲裁案例见同目录 rubric-cases.md（标注前必读）。
#
# 2026-10-25 双人盲判复测：抽 40 条脱敏题包交独立判读者，一致率 72.5、Cohen kappa=0.429（中等）。
# 11 条分歧逐条仲裁后改判 5 条（人物形象→unsure、多感官描写→correct、换元法→wrong、
# 林彪→wrong、中外交通发展→correct），其余 6 条维持原判（其中 1 条确认是盲判判错）。
# 第二轮复测（2026-10-26，另抽 40 条新样本、用操作化判据）：一致率 77.5、kappa=0.436、AC1=0.720
#   （第一轮 72.5 / 0.429 / 0.639；kappa 受 80 percent correct 基率压低，判据可用性以 AC1 >= 0.70 为准）。
#   第二轮再改判 4 条：战时陪都→wrong、第24届冬季奥运会→wrong、卜算子·黄州定慧院寓居作→correct、人口问题→correct。
# 仲裁后全库分布：correct 77 / wrong 7 / unsure 16。
# 注意：仲裁后数字不等于一次独立测量——它包含了对盲判意见的采纳，会偏高；
#   要得到可信精度，需按 rubric-cases.md 的判据另抽新样本复测（目标 kappa ≥ 0.7）。

