#
# 用途：验证「A 属于 B」这一层语义。lint 只能校验端点类型与无环，回答不了
# 「A 到底是不是 B 的一种/一部分」。这是 5,163 条关系里唯一没有任何语义验证的一块。
#
# 抽样：分层确定性抽 100 条（FNV-1a 哈希）
#   A 标题含容 40（A、B 标题互相包含，最容易出事）
#   B 跨章      40（同科不同章）
#   C 同章      20
#
# 判定方式：先由独立 agent 盲判（不给任何既有结论），再由人工逐条核对 wrong/unsure 与
# 可疑 correct，修订 8 条（6 条 correct/unsure 上调、2 条 correct 下调）。
#
# verdict: correct=A 是 B 的一种/一部分 / wrong=并列、无隶属或方向反了 / unsure=需语境
# 第五轮（2026-10-26，另抽 100 条）：correct 82 / wrong 16 / unsure 2 → 可判定 83.7%
#   累计 500 条：correct 398 / wrong 88 / unsure 14 → 可判定 81.9%
# 第四轮（2026-10-26，另抽 100 条）：correct 85 / wrong 12 / unsure 3 → 可判定 87.6%
#   累计 400 条：correct 316 / wrong 72 / unsure 12 → 可判定 81.4%
# 第三轮（2026-10-26，另抽 100 条）：correct 82 / wrong 17 / unsure 1 → 可判定 82.8%
#   累计 300 条：correct 231 / wrong 60 / unsure 9 → 可判定 79.4%
# 第二轮（2026-10-26，另抽 100 条，排除已判）：correct 75 / wrong 19 / unsure 6 → 可判定 79.8%
#   累计 200 条：correct 149 / wrong 43 / unsure 8 → 可判定 77.6%
# 实测基线（第一轮 100 条）：correct 74 / wrong 24 / unsure 2
#   → 可判定 98 条中正确率 75.5%
