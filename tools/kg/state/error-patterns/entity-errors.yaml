# 实体类错误模式库:记录抽取产出的实体本身有系统性缺陷的模式(字段错/漏抽/误抽/粒度错)。
# 收录门槛:同类反思发现 ≥3 次才提炼为一条模式;每次巡检/修正循环后更新;
# 模式须写成针对抽取逻辑缺陷的通用描述,不针对特定实体。
# 字段说明:
#   id:          模式唯一标识,如 EP-E-001
#   type:        涉及的实体类型,如 Concept/Word
#   description: 模式的通用描述(抽取逻辑哪里错了)
#   detection:   如何发现/复检(lint 规则、脚本或人工检查方法)
#   fix:         修正办法(改 prompt/改脚本/补字段)
#   source:      提炼来源(哪几轮反思、哪些教材,≥3 个实例)
#   frequency:   累计命中次数
patterns: []
