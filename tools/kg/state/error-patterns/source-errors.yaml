# 源文本类错误模式库:记录教材原文/OCR 文本本身有问题的模式(印刷错误、OCR 识别错、原文歧义)。
# 此类问题不由抽取 prompt 修——只能标注为例外,并登记进对应教材的 gap。
# 收录门槛:同类反思发现 ≥3 次才提炼为一条模式;每次巡检/修正循环后更新;
# 模式须写成针对抽取逻辑缺陷的通用描述,不针对特定实体。
# 字段说明:
#   id:          模式唯一标识,如 EP-S-001
#   type:        问题来源类型,如 ocr/print/ambiguity
#   description: 模式的通用描述(源文本哪类问题)
#   detection:   如何发现/复检(lint 规则、脚本或人工检查方法)
#   fix:         处理办法(标注例外、登记 gap,不改抽取 prompt)
#   source:      提炼来源(哪几轮反思、哪些教材,≥3 个实例)
#   frequency:   累计命中次数
patterns: []
