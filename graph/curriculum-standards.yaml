# 义务教育课程标准（2022版 / 2011版）课程内容主题登记
# =============================================================================
# 字段说明：
#   id              - 标准唯一 ID（subject-edition-主题缩写），用于章节/概念对齐
#   subject         - 学科（中文），与 Textbook.subject 对齐
#   subjectEn       - 学科英文键（与 Textbook.subject 一致）
#   edition         - '2022版' 或 '2011版'
#   gradeBand       - 学段范围，如 '7-9' / '8-9' / '9'
#   theme           - 主题/学习主题（一级）
#   shortCode       - 主题简短英文缩写，便于引用
#   contentRequirement - 内容要求简述（来自 MOE 课程标准）
#   sourceUrl       - MOE 官方原文链接
# =============================================================================

# ========================= 数学 2022版 =========================
- id: std-math-2022-DA
  subject: 数学
  subjectEn: Math
  edition: '2022版'
  gradeBand: '7-9'
  theme: 数与代数
  shortCode: DA
  contentRequirement: |
    数与运算、式与方程、函数；数感、符号意识、运算能力、推理能力、模型思想。
    第三学段要求：实数、代数式、方程与不等式、函数（一次/反比例/二次）。
  sourceUrl: https://hudong.moe.gov.cn/srcsite/A26/s8001/202204/W020220420582344386498.pdf

- id: std-math-2022-GG
  subject: 数学
  subjectEn: Math
  edition: '2022版'
  gradeBand: '7-9'
  theme: 图形与几何
  shortCode: GG
  contentRequirement: |
    图形的性质（三角形、四边形、圆）、图形的变化（平移/旋转/轴对称/相似/投影/位似）、
    图形与坐标。空间观念、几何直观、推理能力。
  sourceUrl: https://hudong.moe.gov.cn/srcsite/A26/s8001/202204/W020220420582344386498.pdf

- id: std-math-2022-SP
  subject: 数学
  subjectEn: Math
  edition: '2022版'
  gradeBand: '7-9'
  theme: 统计与概率
  shortCode: SP
  contentRequirement: |
    数据收集整理、描述分析（平均数/中位数/众数/方差）、随机事件概率、
    抽样与推断。数据分析观念。
  sourceUrl: https://hudong.moe.gov.cn/srcsite/A26/s8001/202204/W020220420582344386498.pdf

- id: std-math-2022-IP
  subject: 数学
  subjectEn: Math
  edition: '2022版'
  gradeBand: '7-9'
  theme: 综合与实践
  shortCode: IP
  contentRequirement: |
    跨学科主题学习与项目式学习，每学期至少一次；综合运用数与代数、
    图形与几何、统计与概率知识解决真实问题。
  sourceUrl: https://hudong.moe.gov.cn/srcsite/A26/s8001/202204/W020220420582344386498.pdf

