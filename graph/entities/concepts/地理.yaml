- id: concept:地理:5G网络
  type: Concept
  subject: 地理
  title: 5G网络
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为5G网络只提升手机网速，不了解它在智能物流等产业的应用。
    - 能指出并纠正这一错误：把5G网络当成Wi-Fi，误认为无需基站即可覆盖。
  aliases: []
  category: 通信技术
  explanation: 第五代移动通信网络，具有高速率、低时延特点，应用于智能物流等。
  misconceptions:
    - 认为5G网络只提升手机网速，不了解它在智能物流等产业的应用。
    - 把5G网络当成Wi-Fi，误认为无需基站即可覆盖。
    - 以为5G只有高速率，忽略低时延对自动驾驶等的作用。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:一带一路倡议
  type: Concept
  subject: 地理
  title: 一带一路倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一带一路仅是古代丝绸之路的恢复，忽略其当代合作共赢内涵。
    - 能指出并纠正这一错误：画路线时只画陆上丝绸之路，漏掉海上丝绸之路（如东南亚、非洲航线）。
  aliases:
    - 一带一路
  category: 地理倡议
  explanation: 中国提出的共建“一带一路”倡议是促进全球共同发展繁荣的国际合作平台，强调合作共赢。
  misconceptions:
    - 认为一带一路仅是古代丝绸之路的恢复，忽略其当代合作共赢内涵。
    - 画路线时只画陆上丝绸之路，漏掉海上丝绸之路（如东南亚、非洲航线）。
    - 以为一带一路只连接亚洲国家，认为不经过欧洲或非洲。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:七大洲
  type: Concept
  subject: 地理
  title: 七大洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为面积最大的大洲是非洲，实际亚洲面积最大。
    - 能指出并纠正这一错误：在半球图上，将南美洲与非洲的东西位置颠倒，误以为南美洲在非洲东侧。
  aliases: []
  category: 地理事实
  explanation: 七大洲包括亚洲、欧洲、非洲、北美洲、南美洲、大洋洲和南极洲。
  misconceptions:
    - 误以为面积最大的大洲是非洲，实际亚洲面积最大。
    - 在半球图上，将南美洲与非洲的东西位置颠倒，误以为南美洲在非洲东侧。
    - 误认为南极洲位于北极地区，混淆了地球两极的大洲位置。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:三大丘陵
  type: Concept
  subject: 地理
  title: 三大丘陵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把辽东丘陵误认为在山东半岛，山东丘陵误认为在辽东半岛
    - 能指出并纠正这一错误：误认为山东丘陵是三大丘陵中面积最大的，实际东南丘陵最大
  aliases: []
  category: 中国地理
  explanation: 我国东部主要分布有辽东丘陵、山东丘陵和东南丘陵，其中东南丘陵面积最大。
  misconceptions:
    - 把辽东丘陵误认为在山东半岛，山东丘陵误认为在辽东半岛
    - 误认为山东丘陵是三大丘陵中面积最大的，实际东南丘陵最大
    - 认为三大丘陵都分布在西北内陆，实际集中在我国东部
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:三大产业
  type: Concept
  subject: 地理
  title: 三大产业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把采矿业归入第一产业，误以为采矿全靠农业，实际属第二产业。
    - 能指出并纠正这一错误：认为高新技术产业是第二产业，实际属于第三产业即服务业。
  aliases:
    - 产业结构
  category: 经济地理
  explanation: 第一产业指农业，第二产业指采矿业、制造业、建筑业等，第三产业即服务业。美国第三产业比重不断增加，高新技术产业成为重要支柱。
  misconceptions:
    - 把采矿业归入第一产业，误以为采矿全靠农业，实际属第二产业。
    - 认为高新技术产业是第二产业，实际属于第三产业即服务业。
    - 误以为第三产业比重增加等同于农业产值下降，实际是相对比重变化。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:三大平原
  type: Concept
  subject: 地理
  title: 三大平原
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为华北平原又称黄淮平原，漏掉海河，实际是黄淮海平原
    - 能指出并纠正这一错误：误认为东北平原面积小于华北平原，实际东北平原最大
  aliases: []
  category: 中国地理
  explanation: 我国有三大平原：东北平原、华北平原和长江中下游平原。东北平原是我国面积最大的平原，华北平原又称黄淮海平原。
  misconceptions:
    - 误认为华北平原又称黄淮平原，漏掉海河，实际是黄淮海平原
    - 误认为东北平原面积小于华北平原，实际东北平原最大
    - 把长江中下游平原划入北方地区，实际位于南方
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:三级阶梯
  type: Concept
  subject: 地理
  title: 三级阶梯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为第二级阶梯以平原丘陵为主，实际以高原盆地为主
    - 能指出并纠正这一错误：误认为第三级阶梯海拔在1000～2000米，实际多在500米以下
  aliases:
    - 地势三级阶梯
  category: 中国地理
  explanation: 我国地势自西向东分为三级阶梯：第一级阶梯为青藏高原，平均海拔4000米以上；第二级阶梯海拔1000～2000米，主要分布高原和盆地；第三级阶梯海拔500米以下，主要分布丘陵和平原。
  misconceptions:
    - 误认为第二级阶梯以平原丘陵为主，实际以高原盆地为主
    - 误认为第三级阶梯海拔在1000～2000米，实际多在500米以下
    - 将第一级阶梯平均海拔记成2000米，误认为低于第二级阶梯
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:三股势力
  type: Concept
  subject: 地理
  title: 三股势力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将三股势力错写为‘霸权主义、强权政治、新干涉主义’，遗漏分裂主义和极端主义
    - 能指出并纠正这一错误：认为恐怖主义与极端主义是独立无涉的概念，实际二者常相互交织
  aliases: []
  category: 安全概念
  explanation: 指恐怖主义、分裂主义和极端主义，是上合组织安全合作的重点打击对象。
  misconceptions:
    - 将三股势力错写为‘霸权主义、强权政治、新干涉主义’，遗漏分裂主义和极端主义
    - 认为恐怖主义与极端主义是独立无涉的概念，实际二者常相互交织
    - 误以为三股势力仅指某一地区的宗教极端势力，忽略民族分裂势力
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:上海合作组织
  type: Concept
  subject: 地理
  title: 上海合作组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将上合组织成立时间误记为‘上海五国’机制建立的1996年，而非2001年
    - 能指出并纠正这一错误：误以为上合组织是经济一体化组织（类似欧盟），忽视其安全合作核心功能
  aliases:
    - 上合组织
  category: 国际组织
  explanation: 由中国、俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦和乌兹别克斯坦于2001年6月在上海共同发起的政府间国际组织。
  misconceptions:
    - 将上合组织成立时间误记为‘上海五国’机制建立的1996年，而非2001年
    - 误以为上合组织是经济一体化组织（类似欧盟），忽视其安全合作核心功能
    - 误以为上合组织总部在上海，实际上常设机构秘书处在北京
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:上海精神
  type: Concept
  subject: 地理
  title: 上海精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将上海精神与和平共处五项原则混同，写为‘互相尊重主权和领土完整、互不侵犯’
    - 能指出并纠正这一错误：漏写‘尊重多样文明’或‘谋求共同发展’，把内容缩减为‘互信互通、平等协商’
  aliases: []
  category: 国际关系原则
  explanation: 上合组织对内遵循的准则，即“互信、互利、平等、协商，尊重多样文明、谋求共同发展”。
  misconceptions:
    - 将上海精神与和平共处五项原则混同，写为‘互相尊重主权和领土完整、互不侵犯’
    - 漏写‘尊重多样文明’或‘谋求共同发展’，把内容缩减为‘互信互通、平等协商’
    - 误认为上海精神是‘互利共赢、合作共赢’，缺少‘协商’与‘尊重多样文明’
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:世界三大人种
  type: Concept
  subject: 地理
  title: 世界三大人种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人种只靠肤色区分，忽略头发、眼睛、鼻子等特征差异
    - 能指出并纠正这一错误：把肤色浅的混血人种直接归为白色人种，忽视血统和特征
  aliases:
    - 三大人种
  category: 地理
  explanation: 根据肤色差异，世界人口分为黄色人种、白色人种和黑色人种，人种差异还体现在眼睛、头发、鼻子和嘴唇等特征上。
  misconceptions:
    - 认为人种只靠肤色区分，忽略头发、眼睛、鼻子等特征差异
    - 把肤色浅的混血人种直接归为白色人种，忽视血统和特征
    - 觉得人种是固定遗传不变的，混血人种不属于任何三大人种
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:世界三大宗教
  type: Concept
  subject: 地理
  title: 世界三大宗教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为世界三大宗教包括印度教和道教
    - 能指出并纠正这一错误：将佛教误认为世界信仰人数最多的宗教
  aliases:
    - 三大宗教
  category: 地理文化
  explanation: 目前世界上传播范围广、影响深刻的三大宗教是基督教、伊斯兰教和佛教。
  misconceptions:
    - 误以为世界三大宗教包括印度教和道教
    - 将佛教误认为世界信仰人数最多的宗教
    - 认为三大宗教的分布只集中在亚洲
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:世界主要语言
  type: Concept
  subject: 地理
  title: 世界主要语言
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把日语、德语、韩语误认为联合国六种工作语言之一
    - 能指出并纠正这一错误：混淆‘使用人数最多’和‘使用范围最广’，认为英语母语人数最多
  aliases:
    - 联合国工作语言
  category: 地理
  explanation: 汉语、英语、西班牙语、俄语、阿拉伯语和法语是世界主要语言，也是联合国的工作语言。
  misconceptions:
    - 把日语、德语、韩语误认为联合国六种工作语言之一
    - 混淆‘使用人数最多’和‘使用范围最广’，认为英语母语人数最多
    - 以为联合国工作语言只有五种，漏掉阿拉伯语或俄语
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:世界人口分布特点
  type: Concept
  subject: 地理
  title: 世界人口分布特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为世界人口均匀分布，如认为撒哈拉沙漠与长江中下游平原人口密度相同。
    - 能指出并纠正这一错误：把分布特点记反，误说成高纬度、内陆、高山地区人口密集。
  aliases:
    - 人口分布特征
  category: 地理规律
  explanation: 世界人口分布不均匀，集中在中低纬度、近海、低平地区，寒带、干旱地区和内陆人口稀少。
  misconceptions:
    - 误以为世界人口均匀分布，如认为撒哈拉沙漠与长江中下游平原人口密度相同。
    - 把分布特点记反，误说成高纬度、内陆、高山地区人口密集。
    - 认为低纬度必定人口稠密，忽略亚马孙热带雨林区人口稀少。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:世界人口增长趋势
  type: Concept
  subject: 地理
  title: 世界人口增长趋势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为18世纪以前人口增长迅速，如说古代人口数量快速增长。
    - 能指出并纠正这一错误：认为二战后人口增长已停止或减缓，如说目前人口总数在下降。
  aliases:
    - 人口增长特点
  category: 地理事实
  explanation: 世界人口在18世纪以前增长缓慢，工业革命后加快，二战后急剧增长，目前仍呈增长趋势。
  misconceptions:
    - 误以为18世纪以前人口增长迅速，如说古代人口数量快速增长。
    - 认为二战后人口增长已停止或减缓，如说目前人口总数在下降。
    - 混淆工业革命后与二战后的增长阶段，称二战后才是急剧增长，其实工业革命后已加快。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:世界地形分布大势
  type: Concept
  subject: 地理
  title: 世界地形分布大势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为各大陆地形分布特征完全相同，如以为非洲也有南北纵列的三大地形单元
    - 能指出并纠正这一错误：忽视南极大陆冰盖覆盖，误以为其基岩海拔就是世界最高
  aliases:
    - 地形大势
  category: 地理规律
  explanation: 世界地形分布具有整体特征，如各大陆地形分布各有特点，南极大陆海拔最高等。
  misconceptions:
    - 认为各大陆地形分布特征完全相同，如以为非洲也有南北纵列的三大地形单元
    - 忽视南极大陆冰盖覆盖，误以为其基岩海拔就是世界最高
    - 将世界地形大势理解为所有大陆地势都是中间高四周低
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:世界气候类型分布
  type: Concept
  subject: 地理
  title: 世界气候类型分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为气候类型分布只由纬度决定，忽略海陆和地形影响，如把内陆地区也归为同纬度海洋性气候。
    - 能指出并纠正这一错误：误以为世界气候分布毫无规律，或把气候类型与自然带完全等同，如把热带雨林气候等同于热带雨林带。
  aliases:
    - 气候类型分布
  category: 地理事实
  explanation: 世界气候类型受纬度、海陆、地形等因素影响，分布具有规律性。
  misconceptions:
    - 认为气候类型分布只由纬度决定，忽略海陆和地形影响，如把内陆地区也归为同纬度海洋性气候。
    - 误以为世界气候分布毫无规律，或把气候类型与自然带完全等同，如把热带雨林气候等同于热带雨林带。
    - 判断某地气候时，只看纬度不看海拔，如认为青藏高原属于热带气候。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:世界气温分布规律
  type: Concept
  subject: 地理
  title: 世界气温分布规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为同纬度大陆和海洋气温全年相同，如夏季海洋比大陆热
    - 能指出并纠正这一错误：记反海陆温差，说冬季大陆比海洋热、夏季大陆比海洋冷
  aliases:
    - 气温分布特点
  category: 分布规律
  explanation: 世界气温分布具有地带性：从低纬度向两极递减；同纬度大陆冬季比海洋冷，夏季比海洋热；南半球等温线较平直，北半球较弯曲。
  misconceptions:
    - 认为同纬度大陆和海洋气温全年相同，如夏季海洋比大陆热
    - 记反海陆温差，说冬季大陆比海洋热、夏季大陆比海洋冷
    - 以为南半球等温线弯曲、北半球平直，与事实相反
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:世界第一大洲
  type: Concept
  subject: 地理
  title: 世界第一大洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：从世界地图上直观感觉非洲很大，误判非洲面积超过亚洲。
    - 能指出并纠正这一错误：把俄罗斯亚洲部分面积归入欧洲，误以为欧洲是世界第一大洲。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 从世界地图上直观感觉非洲很大，误判非洲面积超过亚洲。
    - 把俄罗斯亚洲部分面积归入欧洲，误以为欧洲是世界第一大洲。
    - 认为北美洲面积大于亚洲，实际亚洲面积远超北美洲。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:世界贸易组织
  type: Concept
  subject: 地理
  title: 世界贸易组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为世贸组织总部在美国纽约，实际在瑞士日内瓦。
    - 能指出并纠正这一错误：把中国说成世贸组织创始成员国，忘记2001年才加入。
  aliases:
    - WTO
  category: 地理组织
  explanation: 世界贸易组织（WTO）成立于1995年，总部在日内瓦，旨在规范世界贸易和投资，解决贸易争端，中国于2001年加入。
  misconceptions:
    - 认为世贸组织总部在美国纽约，实际在瑞士日内瓦。
    - 把中国说成世贸组织创始成员国，忘记2001年才加入。
    - 将世贸组织与世界银行混为一谈，以为它提供贷款或援助。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:世界降水分布规律
  type: Concept
  subject: 地理
  title: 世界降水分布规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为降水只受纬度影响，忽略洋流和地形，如认为同纬度沿海降水一定多于内陆。
    - 能指出并纠正这一错误：把赤道多雨、两极少雨当成绝对规律，不知赤道附近的高原或受寒流影响区域降水也少。
  aliases:
    - 降水分布规律
  category: 地理规律
  explanation: 世界年降水量分布受纬度、海陆、洋流和地形影响，赤道附近降水多，两极降水少。
  misconceptions:
    - 认为降水只受纬度影响，忽略洋流和地形，如认为同纬度沿海降水一定多于内陆。
    - 把赤道多雨、两极少雨当成绝对规律，不知赤道附近的高原或受寒流影响区域降水也少。
    - 等降水量线密集仅表示降水变化大，却被误读为降水多。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:东南亚
  type: Concept
  subject: 地理
  title: 东南亚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为东南亚位于亚洲东部，忽略了‘东南’方位，如把中南半岛画在亚洲东北部。
    - 能指出并纠正这一错误：将中南半岛和马来群岛位置颠倒，误以为中南半岛在赤道以南。
  aliases:
    - Southeast Asia
  category: 地理区域
  explanation: 东南亚位于亚洲东南部，由中南半岛和马来群岛组成，地处亚洲与大洋洲、印度洋与太平洋的十字路口，地理位置重要。
  misconceptions:
    - 认为东南亚位于亚洲东部，忽略了‘东南’方位，如把中南半岛画在亚洲东北部。
    - 将中南半岛和马来群岛位置颠倒，误以为中南半岛在赤道以南。
    - 认为东南亚地处欧洲与大洋洲、太平洋与大西洋的十字路口，混淆了两大洋两洲。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:东南亚国家联盟（东盟）
  type: Concept
  subject: 地理
  title: 东南亚国家联盟（东盟）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为东盟现有10个成员国，忘记东帝汶已加入，少算了第11国。
    - 能指出并纠正这一错误：认为东盟是军事同盟组织，实际是以经济合作为主的区域性组织。
  aliases:
    - ASEAN
    - 东南亚国家联盟
    - 东盟
  category: 区域性组织
  explanation: 东南亚国家联盟是东南亚地区重要的区域性合作组织，成立于1967年，现有11个成员国，促进区域经济发展和合作。
  misconceptions:
    - 认为东盟现有10个成员国，忘记东帝汶已加入，少算了第11国。
    - 认为东盟是军事同盟组织，实际是以经济合作为主的区域性组织。
    - 把东盟成立时间记成1997年，误与东南亚金融危机关联。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:东南亚的人口分布
  type: Concept
  subject: 地理
  title: 东南亚的人口分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中南半岛人口主要分布在高山高原，忽略河流沿岸及河口三角洲。
    - 能指出并纠正这一错误：认为马来群岛人口集中在山区和雨林，实际沿海平原人口稠密。
  aliases: []
  category: 地理
  explanation: 东南亚人口稠密，中南半岛人口和城市主要分布在河流沿岸及河口三角洲，马来群岛主要分布在沿海平原，山区和雨林地区人口稀少。
  misconceptions:
    - 认为中南半岛人口主要分布在高山高原，忽略河流沿岸及河口三角洲。
    - 认为马来群岛人口集中在山区和雨林，实际沿海平原人口稠密。
    - 混淆‘河流沿岸’和‘河口三角洲’，误以为沿岸指山坡溪流旁。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S2.md
- id: concept:地理:东南亚的区域经济发展特点
  type: Concept
  subject: 地理
  title: 东南亚的区域经济发展特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新加坡经济落后，实际是东南亚较发达国家。
    - 能指出并纠正这一错误：认为东南亚各国经济水平均衡，忽略缅甸、柬埔寨仍较落后。
  aliases:
    - 东南亚经济
  category: 地理
  explanation: 东南亚曾长期受殖民统治，经济形式单一，独立后经济迅速发展，但各国发展不平衡，新加坡、马来西亚等较发达，缅甸、柬埔寨等较落后。
  misconceptions:
    - 认为新加坡经济落后，实际是东南亚较发达国家。
    - 认为东南亚各国经济水平均衡，忽略缅甸、柬埔寨仍较落后。
    - 误认为东南亚经济自独立后一直快速增长，忽视了殖民时期经济单一。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S2.md
- id: concept:地理:东南亚的华人和华侨
  type: Concept
  subject: 地理
  title: 东南亚的华人和华侨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将华人和华侨混为一谈，不知华人不具有中国国籍。
    - 能指出并纠正这一错误：认为华人和华侨主要分布在欧洲或北美，实际东南亚最集中。
  aliases:
    - 华人华侨
    - 华人和华侨
    - overseas Chinese
  category: 地理
  explanation: 东南亚是世界上华人和华侨最集中的地区，他们为当地建设和发展作出了重要贡献。
  misconceptions:
    - 将华人和华侨混为一谈，不知华人不具有中国国籍。
    - 认为华人和华侨主要分布在欧洲或北美，实际东南亚最集中。
    - 误以为华侨是已加入当地国籍的中国人，颠倒了两者定义。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:东南亚的地理位置
  type: Concept
  subject: 地理
  title: 东南亚的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把东南亚位置说成‘亚洲与大洋洲、大西洋与太平洋的十字路口’。
    - 能指出并纠正这一错误：认为东南亚位于亚洲东部而非东南部，方向偏差90度。
  aliases:
    - 东南亚位置
  category: 地理
  explanation: 东南亚位于亚洲东南部，由中南半岛和马来群岛组成，地处亚洲与大洋洲、印度洋与太平洋之间的十字路口，地理位置重要。
  misconceptions:
    - 误把东南亚位置说成‘亚洲与大洋洲、大西洋与太平洋的十字路口’。
    - 认为东南亚位于亚洲东部而非东南部，方向偏差90度。
    - 把中南半岛与马来群岛位置写反，如说马来群岛位于中南半岛以北。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:东南亚的物产
  type: Concept
  subject: 地理
  title: 东南亚的物产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为东南亚是小麦和玉米的主要出口区，实际粮食作物以稻谷为主。
    - 能指出并纠正这一错误：误以为天然橡胶最大产地在非洲或南美洲，忽略泰国、印尼等东南亚国家。
  aliases:
    - 东南亚资源
  category: 地理
  explanation: 东南亚湿热的气候和肥沃的土壤使其成为稻谷和热带经济作物的重要种植区，是世界天然橡胶、油棕、椰子、蕉麻等热带经济作物的最大产地，也是锡和石油的重要产区。
  misconceptions:
    - 认为东南亚是小麦和玉米的主要出口区，实际粮食作物以稻谷为主。
    - 误以为天然橡胶最大产地在非洲或南美洲，忽略泰国、印尼等东南亚国家。
    - 认为石油和锡主要分布在中南半岛，忽略了马来群岛的印尼、文莱等。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:东西半球分界线
  type: Concept
  subject: 地理
  title: 东西半球分界线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为0°经线和180°经线是东西半球分界线，如把20°W记成0°
    - 能指出并纠正这一错误：判断10°W时误以为在西半球，实际20°W以东为东半球
  aliases: []
  category: 地理概念
  explanation: 以20°W和160°E组成的经线圈为东西半球的分界线。
  misconceptions:
    - 误认为0°经线和180°经线是东西半球分界线，如把20°W记成0°
    - 判断10°W时误以为在西半球，实际20°W以东为东半球
    - 把160°E误写为160°W，导致东半球经度范围判断错误
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:东非大裂谷
  type: Concept
  subject: 地理
  title: 东非大裂谷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为东非大裂谷是河流侵蚀形成的，实为地壳断裂下陷。
    - 能指出并纠正这一错误：误以为东非大裂谷位于非洲西部，实际在东部高原。
  aliases: []
  category: 自然地理
  explanation: 位于非洲东部高原上的地壳断裂形成的裂谷带，全长约6500千米，是世界陆地上最长的裂谷带。
  misconceptions:
    - 认为东非大裂谷是河流侵蚀形成的，实为地壳断裂下陷。
    - 误以为东非大裂谷位于非洲西部，实际在东部高原。
    - 把东非大裂谷长度记成650千米，少写一个0，实际约6500千米。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S4.md
- id: concept:地理:中东
  type: Concept
  subject: 地理
  title: 中东
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中东就是西亚，忽略了埃及属于中东。
    - 能指出并纠正这一错误：误认为中东包括所有非洲北部国家，如把利比亚、阿尔及利亚算入。
  aliases:
    - Middle East
  category: 地理区域
  explanation: 中东指从地中海东部沿岸到波斯湾的广大区域，包括西亚的大部分和非洲的埃及，地理位置重要，石油资源丰富。
  misconceptions:
    - 认为中东就是西亚，忽略了埃及属于中东。
    - 误认为中东包括所有非洲北部国家，如把利比亚、阿尔及利亚算入。
    - 以为中东位于地中海东岸到波斯湾，但把红海西岸也划入中东。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中东农业类型
  type: Concept
  subject: 地理
  title: 中东农业类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中东农业以畜牧业为主，忽略其灌溉农业主体地位。
    - 能指出并纠正这一错误：误以为中东降水充足，农业无需灌溉，如种水稻靠天然降雨。
  aliases: []
  category: 农业地理
  explanation: 中东农业以灌溉农业为主，主要分布在尼罗河流域、两河流域和绿洲，并发展节水技术。
  misconceptions:
    - 认为中东农业以畜牧业为主，忽略其灌溉农业主体地位。
    - 误以为中东降水充足，农业无需灌溉，如种水稻靠天然降雨。
    - 将主要农业区误认为在沿海平原，实际是尼罗河流域、两河流域和绿洲。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中东多元文化
  type: Concept
  subject: 地理
  title: 中东多元文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中东居民都是阿拉伯人，忽略波斯人、土耳其人等民族。
    - 能指出并纠正这一错误：误认为耶路撒冷只是伊斯兰教圣城，忽略它也是基督教和犹太教圣城。
  aliases: []
  category: 人文地理
  explanation: 中东是多民族聚居区，居民有阿拉伯人、波斯人、土耳其人、犹太人等，是伊斯兰教、基督教和犹太教的发源地，耶路撒冷为圣城。
  misconceptions:
    - 认为中东居民都是阿拉伯人，忽略波斯人、土耳其人等民族。
    - 误认为耶路撒冷只是伊斯兰教圣城，忽略它也是基督教和犹太教圣城。
    - 把耶路撒冷认作麦加，表示‘穆斯林朝觐耶路撒冷’，混淆圣城。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中东水资源分布
  type: Concept
  subject: 地理
  title: 中东水资源分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中东水资源丰富，误以石油资源代替水资源。
    - 能指出并纠正这一错误：误以为主要河流是尼罗河和刚果河，忽略幼发拉底河、底格里斯河。
  aliases: []
  category: 地理分布
  explanation: 中东水资源分布不均，主要河流有幼发拉底河、底格里斯河和约旦河，人口多分布在河流、绿洲和泉水附近。
  misconceptions:
    - 认为中东水资源丰富，误以石油资源代替水资源。
    - 误以为主要河流是尼罗河和刚果河，忽略幼发拉底河、底格里斯河。
    - 认为人口集中分布在沙漠腹地，实际靠近河流、绿洲和泉水。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中东水资源匮乏
  type: Concept
  subject: 地理
  title: 中东水资源匮乏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将中东缺水等同于无河流，忽视约旦河和幼发拉底河的存在
    - 能指出并纠正这一错误：误以为中东全为热带沙漠气候，忽略地中海沿岸冬雨区
  aliases:
    - 中东缺水
  category: 地理事实
  explanation: 中东大部分地区气候炎热干燥，沙漠广布，河流稀少，水资源极其匮乏，严重影响生产生活。
  misconceptions:
    - 将中东缺水等同于无河流，忽视约旦河和幼发拉底河的存在
    - 误以为中东全为热带沙漠气候，忽略地中海沿岸冬雨区
    - 误认为解决缺水只能靠海水淡化，忽视节水技术
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中东畜牧业
  type: Concept
  subject: 地理
  title: 中东畜牧业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为乳畜业在中东很发达，实际以游牧为主
    - 能指出并纠正这一错误：把安卡拉羊当作普通乳用羊，忽略其毛用价值
  aliases: []
  category: 农业地理
  explanation: 中东高原地区草原广阔，以游牧为主，提供肉食、毛皮和乳制品，安卡拉羊等品种著名。
  misconceptions:
    - 误以为乳畜业在中东很发达，实际以游牧为主
    - 把安卡拉羊当作普通乳用羊，忽略其毛用价值
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中东的地理位置
  type: Concept
  subject: 地理
  title: 中东的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把里海当成真正的海，忽略它是内陆湖泊
    - 能指出并纠正这一错误：将中东与西亚混为一谈，未包括非洲的埃及
  aliases:
    - 五海三洲之地
  category: 地理
  explanation: 中东位于地中海东部沿岸到波斯湾的广大区域，包括西亚大部分和非洲的埃及，地处“五海三洲”之地，地理位置重要。
  misconceptions:
    - 误把里海当成真正的海，忽略它是内陆湖泊
    - 将中东与西亚混为一谈，未包括非洲的埃及
    - 在地图上把波斯湾与亚丁湾位置颠倒
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S2.md
- id: concept:地理:中东的水资源
  type: Concept
  subject: 地理
  title: 中东的水资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为河流是唯一水源，忽视地下水与淡化水
    - 能指出并纠正这一错误：把水资源矛盾全归因于以色列与阿拉伯国家，忽略两河流域内部争水
  aliases:
    - 中东水资源
  category: 地理
  explanation: 中东大部分地区气候炎热干燥，水资源极其匮乏，各国水资源分配矛盾突出，是导致冲突的原因之一。
  misconceptions:
    - 误认为河流是唯一水源，忽视地下水与淡化水
    - 把水资源矛盾全归因于以色列与阿拉伯国家，忽略两河流域内部争水
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S2.md
- id: concept:地理:中东的石油资源
  type: Concept
  subject: 地理
  title: 中东的石油资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为波斯湾沿岸所有国家石油储量都很大，忽视巴林等小储国
    - 能指出并纠正这一错误：把霍尔木兹海峡误认作曼德海峡，影响运输路线判断
  aliases:
    - 中东石油
    - 中东石油资源
  category: 地理
  explanation: 中东石油资源极其丰富，主要分布在波斯湾及其沿岸地区，是世界上石油储量最大、生产和输出石油最多的地区。
  misconceptions:
    - 误认为波斯湾沿岸所有国家石油储量都很大，忽视巴林等小储国
    - 把霍尔木兹海峡误认作曼德海峡，影响运输路线判断
    - 认为石油出口以输油管道为主，忽视海运占比
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中俄经贸合作
  type: Concept
  subject: 地理
  title: 中俄经贸合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误称中俄为军事同盟关系，实际是全面战略协作伙伴关系。
    - 能指出并纠正这一错误：认为俄罗斯最大贸易伙伴是欧洲某国，忽略中国自2010年起是最大贸易伙伴。
  aliases: []
  category: 地理
  explanation: 中俄是全面战略协作伙伴，共建“一带一路”与欧亚经济联盟对接，经贸合作成果丰硕。
  misconceptions:
    - 误称中俄为军事同盟关系，实际是全面战略协作伙伴关系。
    - 认为俄罗斯最大贸易伙伴是欧洲某国，忽略中国自2010年起是最大贸易伙伴。
    - 误以为“一带一路”仅指陆地通道，忽视与欧亚经济联盟的对接合作。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:中南半岛
  type: Concept
  subject: 地理
  title: 中南半岛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中南半岛与我国相邻的有七个国家，实际只有缅老越三国
    - 能指出并纠正这一错误：把湄公河流向误判为自南向北，实际自北向南
  aliases:
    - Indochinese Peninsula
  category: 地理区域
  explanation: 中南半岛是东南亚的一部分，与中国山水相连，地形山河纵列，人口和城市多分布在河流沿岸及河口三角洲。
  misconceptions:
    - 误认为中南半岛与我国相邻的有七个国家，实际只有缅老越三国
    - 把湄公河流向误判为自南向北，实际自北向南
    - 认为城市多分布在山地，忽略河流沿岸和三角洲
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中南半岛的地形特征
  type: Concept
  subject: 地理
  title: 中南半岛的地形特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为山河纵列是东西走向，导致方向判断错误
    - 能指出并纠正这一错误：把中南半岛地形说成山环水绕，忽视纵列特征
  aliases:
    - 山河相间
  category: 地理
  explanation: 中南半岛山脉和河流多自北向南延伸，形成山河纵列、山地与平原交错分布的地形，北部地势高，南部多冲积平原和河口三角洲。
  misconceptions:
    - 误认为山河纵列是东西走向，导致方向判断错误
    - 把中南半岛地形说成山环水绕，忽视纵列特征
    - 认为北部冲积平原广布，实际北部是山地高原
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中国农业分布
  type: Concept
  subject: 地理
  title: 中国农业分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为南方旱地、北方水田，把水田旱地分布搞反。
    - 能指出并纠正这一错误：认为我国林区主要分布在西部非季风区，忽略东部季风区山地。
  aliases:
    - 农业分布
    - 我国农业分布
  category: 地理分布
  explanation: 我国东部季风区以种植业为主，南方水田、北方旱地；林区分布在东部季风区的山地；牧区分布在西部非季风区的高原和高山。
  misconceptions:
    - 误以为南方旱地、北方水田，把水田旱地分布搞反。
    - 认为我国林区主要分布在西部非季风区，忽略东部季风区山地。
    - 误把牧区划到东部季风区，不知其分布在西部高原高山。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S2.md
- id: concept:地理:中国北极科考站
  type: Concept
  subject: 地理
  title: 中国北极科考站
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄河站位于北极点，实际上在斯瓦尔巴群岛
    - 能指出并纠正这一错误：把中冰北极科考站误认为是中国独建，实际是共建
  aliases:
    - 黄河站
  category: 地理事实
  explanation: 我国在北极建立了黄河站，并与冰岛共建中-冰北极科学考察站。
  misconceptions:
    - 误认为黄河站位于北极点，实际上在斯瓦尔巴群岛
    - 把中冰北极科考站误认为是中国独建，实际是共建
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S5.md
- id: concept:地理:中国南极昆仑站
  type: Concept
  subject: 地理
  title: 中国南极昆仑站
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为昆仑站是南极最早科考站，实际长城站最早
    - 能指出并纠正这一错误：认为昆仑站建在南极点，实际在冰盖最高点
  aliases: []
  category: 地理事实
  explanation: 2009年建立，位于南极内陆冰盖最高点，海拔4000多米，是首个南极内陆科考站。
  misconceptions:
    - 误认为昆仑站是南极最早科考站，实际长城站最早
    - 认为昆仑站建在南极点，实际在冰盖最高点
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S5.md
- id: concept:地理:中国南极科考站
  type: Concept
  subject: 地理
  title: 中国南极科考站
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为我国南极科考站只有四个，遗漏秦岭站
    - 能指出并纠正这一错误：把长城站画在南极圈内，实际位于圈外
  aliases:
    - 南极科考站
  category: 地理事实
  explanation: 我国在南极建立了长城站、中山站、昆仑站、泰山站和秦岭站等五个科学考察站。
  misconceptions:
    - 误认为我国南极科考站只有四个，遗漏秦岭站
    - 把长城站画在南极圈内，实际位于圈外
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:中国土地资源的特征
  type: Concept
  subject: 地理
  title: 中国土地资源的特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为我国土地资源总量多且人均多，忽略人口大国人均少。
    - 能指出并纠正这一错误：以为我国地形平原多山地少，与实际山地多平原少相反。
  aliases:
    - 我国土地资源特征
    - 中国土地资源特点
  category: 地理特征
  explanation: 我国土地资源总量多但人均占有量少，山地多平原少，高质量耕地少，后备耕地资源匮乏。
  misconceptions:
    - 误认为我国土地资源总量多且人均多，忽略人口大国人均少。
    - 以为我国地形平原多山地少，与实际山地多平原少相反。
    - 误认为后备耕地资源丰富，不知道高质量耕地少且匮乏。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S2.md
- id: concept:地理:中国工业分布
  type: Concept
  subject: 地理
  title: 中国工业分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为工业只分布在沿海地区，忽略沿江河沿铁路分布。
    - 能指出并纠正这一错误：把辽中南工业基地误放到南方，位置记混。
  aliases:
    - 工业分布
    - 我国工业分布
  category: 地理分布
  explanation: 我国工业主要分布在沿海、沿江河、沿铁路线地区，形成了辽中南、京津唐、沪宁杭、珠江三角洲等工业基地。
  misconceptions:
    - 误以为工业只分布在沿海地区，忽略沿江河沿铁路分布。
    - 把辽中南工业基地误放到南方，位置记混。
    - 认为所有工业基地都在沿海，忽视内地如武汉等工业城市。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:中国水资源的特征
  type: Concept
  subject: 地理
  title: 中国水资源的特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为我国水资源时间分配均匀，其实夏秋多、冬春少。
    - 能指出并纠正这一错误：认为空间分布从西北向东南递增，方向正好说反。
  aliases: []
  category: 地理特征
  explanation: 我国水资源总量较多但人均占有量少，时间分配不均匀（夏秋多、冬春少），空间分布不平衡（从东南沿海向西北内陆递减）。
  misconceptions:
    - 误以为我国水资源时间分配均匀，其实夏秋多、冬春少。
    - 认为空间分布从西北向东南递增，方向正好说反。
    - 将水资源总量与径流量混淆，忽略人均占有量少。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:中国的北极政策
  type: Concept
  subject: 地理
  title: 中国的北极政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北极政策白皮书主张主权扩张，实际强调参与治理
    - 能指出并纠正这一错误：把'认识北极'与'利用北极'的目标颠倒
  aliases: []
  category: 地理事实
  explanation: 2018年中国发表《中国的北极政策》白皮书，目标是认识北极、保护北极、利用北极和参与治理北极。
  misconceptions:
    - 误认为北极政策白皮书主张主权扩张，实际强调参与治理
    - 把'认识北极'与'利用北极'的目标颠倒
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:中国的地理位置
  type: Concept
  subject: 地理
  title: 中国的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为我国全部位于北温带，忽略热带范围
    - 能指出并纠正这一错误：判断半球时，把东经度都当东半球，如东经162°仍属于东半球（实际属西半球）
  aliases:
    - 我国地理位置
  category: 地理
  explanation: 我国位于北半球和东半球，海陆兼备，大部分地区位于北温带，一小部分地区位于热带，没有寒带。
  misconceptions:
    - 误认为我国全部位于北温带，忽略热带范围
    - 判断半球时，把东经度都当东半球，如东经162°仍属于东半球（实际属西半球）
    - 误认为我国有寒带，因为纬度较高地区冬季寒冷
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:中国的民族
  type: Concept
  subject: 地理
  title: 中国的民族
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把我国人口最多的少数民族误认为满族，实际是壮族。
    - 能指出并纠正这一错误：认为我国所有民族都有自己的语言文字，事实上部分民族无文字。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 把我国人口最多的少数民族误认为满族，实际是壮族。
    - 认为我国所有民族都有自己的语言文字，事实上部分民族无文字。
    - 误以为汉族和少数民族的界限分明，忽略长期杂居融合。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:中国的海域和岛屿
  type: Concept
  subject: 地理
  title: 中国的海域和岛屿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆内海与领海，误把黄海、东海也当内海
    - 能指出并纠正这一错误：认为台湾岛东面濒临南海，实际是太平洋
  aliases:
    - 海域
    - 南海诸岛
    - 钓鱼岛
  category: 地理
  explanation: 我国濒临渤海、黄海、东海和南海，台湾岛东面直接濒临太平洋，渤海和琼州海峡是内海。南海诸岛和钓鱼岛是我国的固有领土。
  misconceptions:
    - 混淆内海与领海，误把黄海、东海也当内海
    - 认为台湾岛东面濒临南海，实际是太平洋
    - 误认为钓鱼岛在东海，实际位于台湾岛东北部
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:中国的疆域
  type: Concept
  subject: 地理
  title: 中国的疆域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把陆地面积说成960万平方千米包括海洋面积
    - 能指出并纠正这一错误：混淆陆上边界长与大陆海岸线长，常将其互换
  aliases:
    - 我国疆域
  category: 地理
  explanation: 我国陆地面积约960万平方千米，居世界第三位，陆上边界长2.2万多千米，大陆海岸线长1.8万多千米。
  misconceptions:
    - 误把陆地面积说成960万平方千米包括海洋面积
    - 混淆陆上边界长与大陆海岸线长，常将其互换
    - 误认为我国面积居世界第二位，实际是第三位
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:中国的行政区划
  type: Concept
  subject: 地理
  title: 中国的行政区划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为省级行政区包括省、自治区、直辖市、特别行政区共34个，但漏掉省的数量
    - 能指出并纠正这一错误：混淆直辖市与特别行政区，如认为北京是特别行政区
  aliases:
    - 行政区划
    - 省级行政区
  category: 地理
  explanation: 我国实行省、县、乡三级行政区划，省级行政区包括23个省、5个自治区、4个直辖市和2个特别行政区。
  misconceptions:
    - 误认为省级行政区包括省、自治区、直辖市、特别行政区共34个，但漏掉省的数量
    - 混淆直辖市与特别行政区，如认为北京是特别行政区
    - 误认为我国实行省、市、县三级行政区划，实际是省、县、乡
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:中国的邻国
  type: Concept
  subject: 地理
  title: 中国的邻国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把日本、韩国当陆上邻国，实际是隔海相望
    - 能指出并纠正这一错误：误认为有15个陆上邻国，把老挝或锡金算入
  aliases:
    - 陆上邻国
    - 隔海相望的国家
  category: 地理
  explanation: 中国有14个陆上邻国和6个隔海相望的国家。
  misconceptions:
    - 误把日本、韩国当陆上邻国，实际是隔海相望
    - 误认为有15个陆上邻国，把老挝或锡金算入
    - 隔海相望的国家误包括文莱，实际文莱与我国隔海相望
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:中国载人航天工程
  type: Concept
  subject: 地理
  title: 中国载人航天工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国载人航天工程第一步是发射人造卫星，实际上第一步是载人飞船阶段。
    - 能指出并纠正这一错误：误将空间实验室与空间站混为一谈，认为天宫一号就是空间站。
  aliases: []
  category: 航天工程
  explanation: 中国载人航天工程发展战略分三步走，已实现载人飞船、空间实验室和空间站建设。
  misconceptions:
    - 误以为中国载人航天工程第一步是发射人造卫星，实际上第一步是载人飞船阶段。
    - 误将空间实验室与空间站混为一谈，认为天宫一号就是空间站。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:中部平原与大自流盆地
  type: Concept
  subject: 地理
  title: 中部平原与大自流盆地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中部平原气候湿润，实际气候干旱却地下水资源丰富。
    - 能指出并纠正这一错误：把大自流盆地当成地表大型湖泊，实际为自流井提供地下水。
  aliases:
    - 大自流盆地
    - 中部平原
  category: 地理
  explanation: 中部平原位于东部山地与西部高原之间，气候干旱，但地下水资源丰富，中部有世界最大的自流盆地。
  misconceptions:
    - 误认为中部平原气候湿润，实际气候干旱却地下水资源丰富。
    - 把大自流盆地当成地表大型湖泊，实际为自流井提供地下水。
    - 误以为大自流盆地位于西部高原，实际位于中部平原区域。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:习俗
  type: Concept
  subject: 地理
  title: 习俗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把习俗等同于个人日常习惯，忽略其社会文化属性
    - 能指出并纠正这一错误：认为习俗只包含饮食和节日，漏掉社交习俗
  aliases:
    - 风俗习惯
  category: 地理文化
  explanation: 习俗是特定自然地理环境和社会经济条件下形成并世代相传的文化现象，包括饮食习俗、节日习俗、社交习俗等。
  misconceptions:
    - 把习俗等同于个人日常习惯，忽略其社会文化属性
    - 认为习俗只包含饮食和节日，漏掉社交习俗
    - 误以为习俗是法律规定的行为准则
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:乡村
  type: Concept
  subject: 地理
  title: 乡村
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为乡村居民全部以务农为生，忽略乡村还有商业、手工业等非农活动
    - 能指出并纠正这一错误：把乡村完全等同于分散居住，忽视部分乡村呈集聚型分布
  aliases: []
  category: 聚落类型
  explanation: 乡村规模较小，人口分散，主要从事农业生产活动。
  misconceptions:
    - 认为乡村居民全部以务农为生，忽略乡村还有商业、手工业等非农活动
    - 把乡村完全等同于分散居住，忽视部分乡村呈集聚型分布
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:乡村景观特征
  type: Concept
  subject: 地理
  title: 乡村景观特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为乡村景观只有自然植被，忽略农田和房屋也是组成部分。
    - 能指出并纠正这一错误：认为乡村景观没有道路和基础设施，其实并非完全如此。
  aliases:
    - 农村景观
  category: 地理概念
  explanation: 乡村景观通常包括农田、分散的房屋、自然植被等，具有田园风光特征。
  misconceptions:
    - 误以为乡村景观只有自然植被，忽略农田和房屋也是组成部分。
    - 认为乡村景观没有道路和基础设施，其实并非完全如此。
    - 把乡村景观等同于荒野或森林，忘记有人工痕迹。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:乡村聚落的形态
  type: Concept
  subject: 地理
  title: 乡村聚落的形态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把团块状村误认为分散型，实际团块状属于集聚型
    - 能指出并纠正这一错误：认为带状村沿河分布就是分散型，实际它是集聚型的一种
  aliases: []
  category: 地理特征
  explanation: 乡村聚落可分为集聚型和分散型，集聚型又分为团块状村和带状村等。
  misconceptions:
    - 把团块状村误认为分散型，实际团块状属于集聚型
    - 认为带状村沿河分布就是分散型，实际它是集聚型的一种
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:二分二至日
  type: Concept
  subject: 地理
  title: 二分二至日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为夏至日太阳直射南回归线，实际是北回归线。
    - 能指出并纠正这一错误：混淆春分和秋分时直射点移动方向，如认为春分后直射点南移。
  aliases:
    - 春分
    - 夏至
    - 秋分
    - 冬至
  category: 地理概念
  explanation: 春分、夏至、秋分、冬至四个节气，是太阳直射点位于特殊纬度的时刻。
  misconceptions:
    - 认为夏至日太阳直射南回归线，实际是北回归线。
    - 混淆春分和秋分时直射点移动方向，如认为春分后直射点南移。
    - 认为二分日地球上只有赤道昼夜平分，实际全球昼夜等长。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:二十四节气
  type: Concept
  subject: 地理
  title: 二十四节气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为二十四节气按农历固定，如以为清明每年农历日期相同，实际公历日期基本固定。
    - 能指出并纠正这一错误：把立春等节气当作气候开始，以为立秋后立刻变凉，忽略气候滞后。
  aliases:
    - 节气
  category: 传统文化
  explanation: 中国古代劳动人民总结的指导农事的补充历法，反映季节变化，是中华民族悠久历史文化中的珍宝。
  misconceptions:
    - 认为二十四节气按农历固定，如以为清明每年农历日期相同，实际公历日期基本固定。
    - 把立春等节气当作气候开始，以为立秋后立刻变凉，忽略气候滞后。
    - 误以为二十四节气是依据月亮圆缺制定的，实际是根据太阳位置。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:五带的划分
  type: Concept
  subject: 地理
  title: 五带的划分
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为五带的分界线是赤道和南北回归线，忽略南、北极圈也是界线。
    - 能指出并纠正这一错误：误以为五带是按降水多少划分的，以为热带都湿润、寒带都干燥。
  aliases:
    - 五带
  category: 地理概念
  explanation: 根据太阳热量在地球表面的分布状况，将地球表面划分为热带、北温带、南温带、北寒带、南寒带五个温度带。
  misconceptions:
    - 误认为五带的分界线是赤道和南北回归线，忽略南、北极圈也是界线。
    - 误以为五带是按降水多少划分的，以为热带都湿润、寒带都干燥。
    - 把五带与气候类型对应，以为热带只包括热带雨林气候，忽略其他热带气候。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:亚欧大陆地形特点
  type: Concept
  subject: 地理
  title: 亚欧大陆地形特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将亚欧大陆地势特征误记为东高西低，忽视中间高、四周低
    - 能指出并纠正这一错误：以为亚欧大陆以平原为主，忽视高原和山地分布广泛
  aliases: []
  category: 地理事实
  explanation: 亚欧大陆地势中间高、四周低，中间以高原和山地为主，四周有丘陵和平原，地势起伏大。
  misconceptions:
    - 将亚欧大陆地势特征误记为东高西低，忽视中间高、四周低
    - 以为亚欧大陆以平原为主，忽视高原和山地分布广泛
    - 忽略亚欧大陆地势起伏大，误认为地形单调
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:亚洲
  type: Concept
  subject: 地理
  title: 亚洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为亚洲是跨经度最广的大洲，实际跨经度最广的是南极洲。
    - 能指出并纠正这一错误：误以为亚洲东临大西洋，实际亚洲东临太平洋。
  aliases: []
  category: 地理区域
  explanation: 亚洲是世界第一大洲。
  misconceptions:
    - 认为亚洲是跨经度最广的大洲，实际跨经度最广的是南极洲。
    - 误以为亚洲东临大西洋，实际亚洲东临太平洋。
    - 认为亚洲全部位于东半球，实际部分岛屿位于西半球。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:亚洲与欧洲的分界线
  type: Concept
  subject: 地理
  title: 亚洲与欧洲的分界线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只记住乌拉尔山脉而漏掉乌拉尔河、大高加索山脉和土耳其海峡。
    - 能指出并纠正这一错误：把苏伊士运河当作亚欧分界线，实际它是亚洲与非洲的分界线。
  aliases:
    - 亚欧分界线
  category: 地理事实
  explanation: 亚洲与欧洲以乌拉尔山脉、乌拉尔河、大高加索山脉和土耳其海峡为分界线。
  misconceptions:
    - 只记住乌拉尔山脉而漏掉乌拉尔河、大高加索山脉和土耳其海峡。
    - 把苏伊士运河当作亚欧分界线，实际它是亚洲与非洲的分界线。
    - 误以为亚欧分界线是白令海峡，实际白令海峡是亚洲与北美洲的分界线。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:亚洲的人口特征
  type: Concept
  subject: 地理
  title: 亚洲的人口特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把西亚波斯湾沿岸当作人口稠密区，实际那里气候干旱，人口稀少。
    - 能指出并纠正这一错误：误认为亚洲人口约占世界一半，实际约3/5。
  aliases:
    - 亚洲人口
  category: 人文特征
  explanation: 亚洲是世界上人口最多的大洲，总人口数约为46.9亿（2021年），约占世界总人口的3/5；人口分布很不均衡，人口稠密地区主要在南亚、东南亚、中国东部、朝鲜半岛和日本群岛，人口稀疏地区多位于自然环境较为恶劣的地区。
  misconceptions:
    - 误把西亚波斯湾沿岸当作人口稠密区，实际那里气候干旱，人口稀少。
    - 误认为亚洲人口约占世界一半，实际约3/5。
    - 把日本群岛归为南亚人口稠密区，实际属于东亚。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的人口老龄化
  type: Concept
  subject: 地理
  title: 亚洲的人口老龄化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为整个亚洲都出现严重老龄化，实际主要是东亚一些国家。
    - 能指出并纠正这一错误：误将人口老龄化归因于出生率高，实际是低出生率和寿命延长。
  aliases:
    - 老龄化
  category: 人文特征
  explanation: 东亚一些国家因劳动年龄人口减少和老年人口增加，出现较严重的人口老龄化问题。
  misconceptions:
    - 误认为整个亚洲都出现严重老龄化，实际主要是东亚一些国家。
    - 误将人口老龄化归因于出生率高，实际是低出生率和寿命延长。
    - 认为劳动力过剩导致老龄化，实则相反。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的区域经济合作
  type: Concept
  subject: 地理
  title: 亚洲的区域经济合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为亚洲经济一体化已完全形成，实际仍在推进中。
    - 能指出并纠正这一错误：误将APEC当作亚洲专属经济合作组织，实际包含美洲国家。
  aliases:
    - 亚洲经济合作
  category: 经济地理
  explanation: 亚洲各国通过加强经济合作，推动区域经济一体化，促进共同繁荣。
  misconceptions:
    - 误以为亚洲经济一体化已完全形成，实际仍在推进中。
    - 误将APEC当作亚洲专属经济合作组织，实际包含美洲国家。
    - 认为经济合作只包括贸易，忽略基础设施互联互通等。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的古代文明
  type: Concept
  subject: 地理
  title: 亚洲的古代文明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将两河流域文明定位于非洲，实际在西亚。
    - 能指出并纠正这一错误：误认为佛教发源于中国，实际发源于古印度。
  aliases:
    - 亚洲文明
  category: 人文特征
  explanation: 亚洲是世界古代文明的摇篮，在两河流域、印度河流域、黄河和长江流域先后出现过灿烂的古代文明；亚洲是世界三大宗教的发祥地，也是印度教、犹太教和道教等的发祥地。
  misconceptions:
    - 误将两河流域文明定位于非洲，实际在西亚。
    - 误认为佛教发源于中国，实际发源于古印度。
    - 误把道教列为世界三大宗教之一，实际三大宗教是佛教、基督教、伊斯兰教。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的地形特征
  type: Concept
  subject: 地理
  title: 亚洲的地形特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚洲地形以平原为主，实际以山地高原为主。
    - 能指出并纠正这一错误：把青藏高原当作世界最大高原，实际是巴西高原。
  aliases:
    - 亚洲地形
  category: 地理特征
  explanation: 亚洲地形以山地和高原为主，山地和高原面积约占亚洲总面积的3/4；地势中部高耸，青藏高原和帕米尔高原构成亚洲地形的“屋脊”，四周地势较低，平原多分布在大陆边缘的大河中下游地区。
  misconceptions:
    - 误认为亚洲地形以平原为主，实际以山地高原为主。
    - 把青藏高原当作世界最大高原，实际是巴西高原。
    - 误以为亚洲地势东高西低，实际是中部高、四周低。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的地理位置
  type: Concept
  subject: 地理
  title: 亚洲的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚洲全部位于东半球，实际超越西经170°，跨东西半球。
    - 能指出并纠正这一错误：误认为亚洲东临大西洋，实际东临太平洋。
  aliases:
    - 亚洲的位置
  category: 地理特征
  explanation: 亚洲主要位于北半球和东半球，最北约北纬81°，最南约南纬11°，经度范围大致为东经26°至西经170°。从海陆位置看，亚洲位于亚欧大陆东部，北、东、南三面分别濒临北冰洋、太平洋和印度洋，西与欧洲相连，西南与非洲相邻，东北隔白令海峡与北美洲相望。
  misconceptions:
    - 误认为亚洲全部位于东半球，实际超越西经170°，跨东西半球。
    - 误认为亚洲东临大西洋，实际东临太平洋。
    - 把亚洲与非洲的分界线说成红海，实际是苏伊士运河。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的地理分区
  type: Concept
  subject: 地理
  title: 亚洲的地理分区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将印度尼西亚归入南亚，实际属于东南亚。
    - 能指出并纠正这一错误：误将俄罗斯全部归入北亚，实际其欧洲部分属于欧洲。
  aliases:
    - 亚洲分区
    - 亚洲地理分区
  category: 地理特征
  explanation: 根据地理方位，人们通常把亚洲分为东亚、东南亚、南亚、西亚、中亚和北亚六个地区。
  misconceptions:
    - 误将印度尼西亚归入南亚，实际属于东南亚。
    - 误将俄罗斯全部归入北亚，实际其欧洲部分属于欧洲。
    - 误将巴基斯坦归入西亚，实际属于南亚。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的季风气候
  type: Concept
  subject: 地理
  title: 亚洲的季风气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为冬季风来自海洋带来降水，实际冬季风来自大陆，降水少。
    - 能指出并纠正这一错误：误认为南亚夏季风是东南季风，实际是西南季风。
  aliases:
    - 季风气候
  category: 气候类型
  explanation: 亚洲东部和南部受海陆分布影响，形成典型季风气候，冬季偏北风降水少，夏季偏南风降水多。
  misconceptions:
    - 误认为冬季风来自海洋带来降水，实际冬季风来自大陆，降水少。
    - 误认为南亚夏季风是东南季风，实际是西南季风。
    - 混淆东亚季风与南亚季风成因，前者主因海陆热力性质差异，后者还有气压带风带季节移动。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的气候特征
  type: Concept
  subject: 地理
  title: 亚洲的气候特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚洲以热带气候为主，实际温带气候面积更大。
    - 能指出并纠正这一错误：误认为温带海洋性气候在亚洲东部广泛分布，实际受地形影响，亚洲温带海洋性气候分布极少。
  aliases:
    - 亚洲气候
  category: 地理特征
  explanation: 亚洲气候复杂多样，季风气候显著，温带大陆性气候分布广。受纬度位置、海陆位置和地形等因素的综合影响，亚洲地跨北寒带、北温带和热带，大陆东西宽广，地形复杂。
  misconceptions:
    - 误认为亚洲以热带气候为主，实际温带气候面积更大。
    - 误认为温带海洋性气候在亚洲东部广泛分布，实际受地形影响，亚洲温带海洋性气候分布极少。
    - 误以为季风气候只分布在亚洲东部，忽略南亚。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的河流与湖泊
  type: Concept
  subject: 地理
  title: 亚洲的河流与湖泊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚洲河流都注入太平洋，实际还有北冰洋、印度洋。
    - 能指出并纠正这一错误：误认为贝加尔湖是世界面积最大的淡水湖，实际面积最大的是苏必利尔湖，贝加尔湖是蓄水量最大。
  aliases:
    - 亚洲的河湖
  category: 地理特征
  explanation: 亚洲是世界上大河最多的大洲，河流大多发源于中部高原山地，呈放射状向四周分流；内流区域面积广大，约占其总面积的30%；湖泊众多，里海是世界上面积最大的湖泊，贝加尔湖是世界上最深、蓄水量最大的淡水湖。
  misconceptions:
    - 误认为亚洲河流都注入太平洋，实际还有北冰洋、印度洋。
    - 误认为贝加尔湖是世界面积最大的淡水湖，实际面积最大的是苏必利尔湖，贝加尔湖是蓄水量最大。
    - 误认为里海是海洋的一部分，实际是湖泊。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的温带大陆性气候
  type: Concept
  subject: 地理
  title: 亚洲的温带大陆性气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为温带大陆性气候降水均匀，实际降水集中夏季。
    - 能指出并纠正这一错误：误认为气温年较差小，实际年较差大。
  aliases:
    - 温带大陆性气候
  category: 气候类型
  explanation: 亚洲温带大陆性气候分布广，特点是冬季严寒、夏季暖热、气温年较差大、降水集中夏季。
  misconceptions:
    - 误认为温带大陆性气候降水均匀，实际降水集中夏季。
    - 误认为气温年较差小，实际年较差大。
    - 误以为温带大陆性气候分布在亚洲沿海，实际分布在内陆地区。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的热量带
  type: Concept
  subject: 地理
  title: 亚洲的热量带
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚洲跨南北寒带，实际只跨北寒带，未跨南寒带。
    - 能指出并纠正这一错误：误认为亚洲最南端位于赤道以北，实际最南端为南纬11°，跨过赤道以南。
  aliases: []
  category: 气候
  explanation: 亚洲地跨北寒带、北温带和热带，因此热量带多样。
  misconceptions:
    - 误认为亚洲跨南北寒带，实际只跨北寒带，未跨南寒带。
    - 误认为亚洲最南端位于赤道以北，实际最南端为南纬11°，跨过赤道以南。
    - 误将热量带等同于温度带，实际两者划分依据不同。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的经济发展
  type: Concept
  subject: 地理
  title: 亚洲的经济发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为亚洲全是发展中国家，忽略日本是发达国家
    - 能指出并纠正这一错误：把西亚高收入国家当作发达国家，混淆经济水平与产业结构
  aliases:
    - 亚洲经济
  category: 人文特征
  explanation: 亚洲经济发展呈现整体崛起的态势，但各国经济发展水平存在较大差异，有的国家是发达国家，大部分是发展中国家；各国经济发展方式也存在明显差异，如中国、印度经济发展迅速，西亚产油国依靠出口石油成为高收入国家。
  misconceptions:
    - 认为亚洲全是发展中国家，忽略日本是发达国家
    - 把西亚高收入国家当作发达国家，混淆经济水平与产业结构
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的降水空间分布
  type: Concept
  subject: 地理
  title: 亚洲的降水空间分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为降水从西北向东南递增，实际相反
    - 能指出并纠正这一错误：认为内陆地区降水多，忽略内陆和极地降水少
  aliases:
    - 亚洲降水分布
  category: 气候
  explanation: 亚洲降水从东南部向西北部递减，赤道附近降水多，内陆和极地降水少。
  misconceptions:
    - 误以为降水从西北向东南递增，实际相反
    - 认为内陆地区降水多，忽略内陆和极地降水少
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚洲的面积
  type: Concept
  subject: 地理
  title: 亚洲的面积
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为非洲面积大于亚洲，实际亚洲最大
    - 能指出并纠正这一错误：把占世界陆地面积1/3写成占世界总面积1/3
  aliases:
    - 世界上最大的洲
  category: 地理特征
  explanation: 亚洲陆地总面积约4400万平方千米，占世界陆地面积的近1/3，是世界上面积最大的洲。
  misconceptions:
    - 误以为非洲面积大于亚洲，实际亚洲最大
    - 把占世界陆地面积1/3写成占世界总面积1/3
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:亚热带季风和亚热带湿润气候
  type: Concept
  subject: 地理
  title: 亚热带季风和亚热带湿润气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为亚热带季风气候分布在大陆西岸，实际在大陆东岸。
    - 能指出并纠正这一错误：把雨热同期记成雨热不同期，以为夏季少雨冬季多雨。
  aliases: []
  category: 气候类型
  explanation: 亚热带季风和亚热带湿润气候主要分布在南、北纬25°~35°的大陆东部，夏热冬温，降水充足，夏季降雨较多，雨热同期。
  misconceptions:
    - 误以为亚热带季风气候分布在大陆西岸，实际在大陆东岸。
    - 把雨热同期记成雨热不同期，以为夏季少雨冬季多雨。
    - 误认为降水全年均匀，忽略夏季降水更多。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:亚马孙平原
  type: Concept
  subject: 地理
  title: 亚马孙平原
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚马孙平原主要位于秘鲁，实际大部分在巴西境内。
    - 能指出并纠正这一错误：把亚马孙平原气候说成热带草原气候，实际是热带雨林气候。
  aliases: []
  category: 自然地理
  explanation: 亚马孙平原是世界上面积最大的平原，大部分位于巴西境内，属热带雨林气候。
  misconceptions:
    - 误认为亚马孙平原主要位于秘鲁，实际大部分在巴西境内。
    - 把亚马孙平原气候说成热带草原气候，实际是热带雨林气候。
    - 误将亚马孙平原与巴西高原混为一谈，平原位于高原以北。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:亚马孙河
  type: Concept
  subject: 地理
  title: 亚马孙河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚马孙河是世界最长河流，实际最长是尼罗河，亚马孙河水量最大。
    - 能指出并纠正这一错误：误以为亚马孙河发源于巴西内陆，实际发源于安第斯山脉。
  aliases: []
  category: 自然地理
  explanation: 亚马孙河是世界上流域面积最广、水量最大的河流，发源于安第斯山脉，注入大西洋。
  misconceptions:
    - 误认为亚马孙河是世界最长河流，实际最长是尼罗河，亚马孙河水量最大。
    - 误以为亚马孙河发源于巴西内陆，实际发源于安第斯山脉。
    - 误认为亚马孙河注入太平洋，实际注入大西洋。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:交通运输
  type: Concept
  subject: 地理
  title: 交通运输
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为交通运输只有公路和铁路，忽略水运、航空等。
    - 能指出并纠正这一错误：把交通运输工具等同于交通运输系统，不包含线路和站点。
  aliases: []
  category: 基础设施
  explanation: 人员和货物运输的通道和方式，包括铁路、公路、水运、航空等。
  misconceptions:
    - 误认为交通运输只有公路和铁路，忽略水运、航空等。
    - 把交通运输工具等同于交通运输系统，不包含线路和站点。
    - 以为交通运输只用于客运，忘记货物运输也是重要功能。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:交通运输分布特征
  type: Concept
  subject: 地理
  title: 交通运输分布特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为我国交通运输线东西均匀分布，实际东密西疏。
    - 能指出并纠正这一错误：认为高速铁路网由西向东拓展，方向说反。
  aliases: []
  category: 地理特征
  explanation: 我国交通运输线东密西疏，高速铁路网由东向西拓展。
  misconceptions:
    - 误以为我国交通运输线东西均匀分布，实际东密西疏。
    - 认为高速铁路网由西向东拓展，方向说反。
    - 只记住东部交通密，忽略西部也有交通线但较稀疏。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:交通运输在全球经济发展中的重要作用
  type: Concept
  subject: 地理
  title: 交通运输在全球经济发展中的重要作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为交通运输仅促进货物贸易，忽略其对人员与信息流动的带动作用
    - 能指出并纠正这一错误：将交通运输的作用局限于经济发达地区，忽视其对全球资源调配和落后地区发展的影响
  aliases:
    - 交通运输的作用
  category: 地理意义
  explanation: 国际交通运输促进全球商品、人员和信息流动，保障产业链供应链稳定，优化资源配置，促进国际贸易和合作。
  misconceptions:
    - 误认为交通运输仅促进货物贸易，忽略其对人员与信息流动的带动作用
    - 将交通运输的作用局限于经济发达地区，忽视其对全球资源调配和落后地区发展的影响
    - 认为国际交通只影响经济，不影响文化传播与国际合作
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S2.md
- id: concept:地理:交通运输对生产生活的影响
  type: Concept
  subject: 地理
  title: 交通运输对生产生活的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为交通运输只影响经济发展，不影响居民生活。
    - 能指出并纠正这一错误：以为便捷交通会延长城市间通行时间，与实际相反。
  aliases: []
  category: 交通运输影响
  explanation: 便捷的交通运输加速物资流通和人员流动，缩短城市间通行时间，促进社会经济发展和城乡居民生活水平提高。
  misconceptions:
    - 误认为交通运输只影响经济发展，不影响居民生活。
    - 以为便捷交通会延长城市间通行时间，与实际相反。
    - 忽视交通运输能加速物资流通和人员流动，误以为只方便出行。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:京味儿文化
  type: Concept
  subject: 地理
  title: 京味儿文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为京味儿文化仅限于京剧和北京小吃，丢掉了四合院、老字号和庙会。
    - 能指出并纠正这一错误：把庙会误解为宗教仪式，忽视其以商贸、游艺和民间工艺为主的市井文化。
  aliases: []
  category: 人文地理
  explanation: 北京独具地域特色的文化，包括京剧、京城饮食、四合院、老字号和庙会等。
  misconceptions:
    - 误以为京味儿文化仅限于京剧和北京小吃，丢掉了四合院、老字号和庙会。
    - 把庙会误解为宗教仪式，忽视其以商贸、游艺和民间工艺为主的市井文化。
    - 认为京味儿文化是清朝才形成的，忽略其历经辽金元明清的长期积淀。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:京杭运河
  type: Concept
  subject: 地理
  title: 京杭运河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为京杭运河沟通珠江，实际南至钱塘江，沟通海河、黄河、淮河、长江和钱塘江
    - 能指出并纠正这一错误：说京杭运河北起天津，实际北起北京
  aliases:
    - 大运河
  category: 地理事实
  explanation: 世界上最长的人工河，北起北京南至杭州，沟通五大水系。
  misconceptions:
    - 误认为京杭运河沟通珠江，实际南至钱塘江，沟通海河、黄河、淮河、长江和钱塘江
    - 说京杭运河北起天津，实际北起北京
    - 把京杭运河当作自然河流，实际是人工开凿的运河
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:京沪高速铁路
  type: Concept
  subject: 地理
  title: 京沪高速铁路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为京沪高铁经过石家庄，实际只连接北京和上海。
    - 能指出并纠正这一错误：认为京沪高铁主要货运，不知其客流量最大。
  aliases: []
  category: 交通线路
  explanation: 连接北京和上海的高速铁路，是我国客流量最大、最繁忙的高铁之一。
  misconceptions:
    - 误以为京沪高铁经过石家庄，实际只连接北京和上海。
    - 认为京沪高铁主要货运，不知其客流量最大。
    - 把京沪高铁与京广高铁混淆，以为途经武汉。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:人口增长与经济发展水平的关系
  type: Concept
  subject: 地理
  title: 人口增长与经济发展水平的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为经济发达国家人口增长快，如说美国自然增长率高于印度。
    - 能指出并纠正这一错误：误以为所有低收入国家人口都快速增长，忽视极端贫穷国家高死亡率导致增长慢。
  aliases:
    - 人口增长与经济关系
  category: 地理规律
  explanation: 经济发展水平较低的国家人口增长较快，经济发展水平较高的国家人口增长较慢，少数极端贫穷国家因高死亡率人口增长也慢。
  misconceptions:
    - 认为经济发达国家人口增长快，如说美国自然增长率高于印度。
    - 误以为所有低收入国家人口都快速增长，忽视极端贫穷国家高死亡率导致增长慢。
    - 把增长快慢与经济发展水平简单对应，认为经济越高增长越快。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:人口年龄结构
  type: Concept
  subject: 地理
  title: 人口年龄结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将人口年龄结构等同于人口密度，二者并无直接关系
    - 能指出并纠正这一错误：认为老年人口比重大意味着增长快，实际反映增长缓慢
  aliases:
    - 年龄结构
  category: 人口地理
  explanation: 人口年龄结构指各年龄组人口在总人口中的比例，常用以分析人口增长趋势和潜在问题。
  misconceptions:
    - 将人口年龄结构等同于人口密度，二者并无直接关系
    - 认为老年人口比重大意味着增长快，实际反映增长缓慢
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:人口特点
  type: Concept
  subject: 地理
  title: 人口特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人口自然增长率最高等同于每年增加的人口数最多，忽略人口基数差异（如非洲增长率高但净增人口少于亚…
    - 能指出并纠正这一错误：读人口分布图时只看图例颜色深浅，不看单位数值，将人口密度大的区域误判为人口总数多，如孟加拉国密度…
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 把人口自然增长率最高等同于每年增加的人口数最多，忽略人口基数差异（如非洲增长率高但净增人口少于亚洲）
    - 读人口分布图时只看图例颜色深浅，不看单位数值，将人口密度大的区域误判为人口总数多，如孟加拉国密度大但总量少于中国
    - 认为热带雨林气候区人口必然稠密，忽视湿热环境导致人口稀少，如亚马孙流域
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:人口自然增长率
  type: Concept
  subject: 地理
  title: 人口自然增长率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把自然增长率等同于出生率，如说自然增长率就是出生人口占总人口比例。
    - 能指出并纠正这一错误：认为自然增长率高则人口总量一定大，如说中国是人口自然增长率最高的国家。
  aliases:
    - 自然增长率
  category: 地理概念
  explanation: 人口自然增长率是衡量一个国家或地区人口自然增长速度的指标，由出生率和死亡率决定。
  misconceptions:
    - 把自然增长率等同于出生率，如说自然增长率就是出生人口占总人口比例。
    - 认为自然增长率高则人口总量一定大，如说中国是人口自然增长率最高的国家。
    - 计算自然增长率时只减出生率，如说出生率1.2%就是自然增长率。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:人工智能技术
  type: Concept
  subject: 地理
  title: 人工智能技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人工智能能完全取代人类，无需任何协作。
    - 能指出并纠正这一错误：以为AI只用于互联网软件，不用于制造业生产线。
  aliases:
    - AI
  category: 高新技术
  explanation: 模拟人类智能的技术，应用于制造业，减少人工干预，提高协作效率。
  misconceptions:
    - 误认为人工智能能完全取代人类，无需任何协作。
    - 以为AI只用于互联网软件，不用于制造业生产线。
    - 忽视AI减少人工干预，误以为会增加人工干预。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:人种
  type: Concept
  subject: 地理
  title: 人种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为美国人都是白色人种，忽略美国还有大量黑人和黄种人。
    - 能指出并纠正这一错误：误认为非洲人全部是黑色人种，忽略北非以白种人为主。
  aliases:
    - 种族
  category: 人文地理
  explanation: 根据体质特征划分的人群，如黄色人种、白色人种等。
  misconceptions:
    - 误认为美国人都是白色人种，忽略美国还有大量黑人和黄种人。
    - 误认为非洲人全部是黑色人种，忽略北非以白种人为主。
    - 认为人种有优劣之分，如说白种人比黑种人更高级。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:人种分布
  type: Concept
  subject: 地理
  title: 人种分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为黄色人种仅分布在东亚，忽略东南亚地区的黄色人种
    - 能指出并纠正这一错误：把白色人种说成只分布欧洲，忽略美洲、大洋洲的大量分布
  aliases: []
  category: 地理
  explanation: 黄色人种主要分布在亚洲东部和东南部，白色人种分布最广，黑色人种主要分布在非洲撒哈拉以南地区，混血人种分布在人种交界地带。
  misconceptions:
    - 认为黄色人种仅分布在东亚，忽略东南亚地区的黄色人种
    - 把白色人种说成只分布欧洲，忽略美洲、大洋洲的大量分布
    - 以为黑色人种分布在非洲全境，不清楚主要在撒哈拉以南
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:人种平等
  type: Concept
  subject: 地理
  title: 人种平等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为浅肤色人种比深肤色人种智力更高、更文明
    - 能指出并纠正这一错误：把人种差异归为能力高下，认为不同人种有优劣之分
  aliases: []
  category: 地理
  explanation: 人种的不同只表现为生理特征差异，人种没有优劣之分。
  misconceptions:
    - 认为浅肤色人种比深肤色人种智力更高、更文明
    - 把人种差异归为能力高下，认为不同人种有优劣之分
    - 用肤色判断个人性格或品行，忽略了人人平等这一常识
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:人种特征与自然环境的关系
  type: Concept
  subject: 地理
  title: 人种特征与自然环境的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为黑人黑色素和卷发是后天晒太阳形成的，而非适应环境
    - 能指出并纠正这一错误：以为白色人种高鼻梁是为了美观，与寒冷气候保暖无关
  aliases:
    - 人种特征的形成
  category: 地理
  explanation: 不同人种的体貌特征是人类长期适应不同自然环境的结果，如黑色人种的黑色素和卷发有助于防紫外线，白色人种的狭长鼻管有助于保暖。
  misconceptions:
    - 认为黑人黑色素和卷发是后天晒太阳形成的，而非适应环境
    - 以为白色人种高鼻梁是为了美观，与寒冷气候保暖无关
    - 将卷发看成装饰或民族习惯，不理解其防晒隔热作用
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:人类命运共同体
  type: Concept
  subject: 地理
  title: 人类命运共同体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人类命运共同体理解为一个超国家政府，认为各国会失去主权。
    - 能指出并纠正这一错误：认为构建人类命运共同体只是中国自己的事情，别国无关。
  aliases:
    - 构建人类命运共同体
  category: 全球治理理念
  explanation: 各国相互依存、休戚与共，共同建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。
  misconceptions:
    - 把人类命运共同体理解为一个超国家政府，认为各国会失去主权。
    - 认为构建人类命运共同体只是中国自己的事情，别国无关。
    - 将人类命运共同体等同于经济全球化，忽略安全与生态等维度。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:人类活动
  type: Concept
  subject: 地理
  title: 人类活动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把填海造陆归为自然原因，忽略其人为性质
    - 能指出并纠正这一错误：认为填海造陆不会破坏生态环境，盲目扩大规模
  aliases: []
  category: 地理概念
  explanation: 造成海陆变迁的第三个原因，如填海造陆等，但需注意保护生态环境。
  misconceptions:
    - 把填海造陆归为自然原因，忽略其人为性质
    - 认为填海造陆不会破坏生态环境，盲目扩大规模
    - 误将围湖造田与填海造陆混为一谈，同属人类活动
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:人类活动对气候的影响
  type: Concept
  subject: 地理
  title: 人类活动对气候的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人类活动要么改善气候要么恶化气候，忽略同一活动可能兼有正负影响。
    - 能指出并纠正这一错误：误以为砍伐森林只影响当地小气候，不会对全球气候产生作用。
  aliases: []
  category: 地理原理
  explanation: 合理的人类活动可改善气候，不合理活动如破坏植被会导致气候恶化。
  misconceptions:
    - 认为人类活动要么改善气候要么恶化气候，忽略同一活动可能兼有正负影响。
    - 误以为砍伐森林只影响当地小气候，不会对全球气候产生作用。
    - 把人工降雨当作改善气候，其实它只改变局地短时降水，并非气候调节。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:人类活动对海洋的影响
  type: Concept
  subject: 地理
  title: 人类活动对海洋的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海洋污染只影响鱼虾，不会通过食物链最终危及人类健康。
    - 能指出并纠正这一错误：觉得海洋自净能力无限，向海洋排放核废水没什么危害。
  aliases: []
  category: 人地关系
  explanation: 不合理的人类活动可能带来海洋污染和生态环境破坏，反过来影响人类。
  misconceptions:
    - 认为海洋污染只影响鱼虾，不会通过食物链最终危及人类健康。
    - 觉得海洋自净能力无限，向海洋排放核废水没什么危害。
    - 只想到污染，忽略过度捕捞、填海造陆等人类活动也会破坏海洋生态。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:以色列节水农业
  type: Concept
  subject: 地理
  title: 以色列节水农业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为滴灌技术是中国发明，实际以色列首创
    - 能指出并纠正这一错误：把水肥一体化理解为只灌溉不同时施肥
  aliases: []
  category: 农业技术
  explanation: 以色列通过水法管理、水肥一体化喷灌滴灌等技术，水资源利用率高达95%。
  misconceptions:
    - 误认为滴灌技术是中国发明，实际以色列首创
    - 把水肥一体化理解为只灌溉不同时施肥
    - 认为节水农业可完全消除水资源短缺，忽视成本限制
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S3.md
- id: concept:地理:伊斯兰教
  type: Concept
  subject: 地理
  title: 伊斯兰教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为伊斯兰教起源于古印度
    - 能指出并纠正这一错误：把穆斯林当作民族而非宗教信仰者
  aliases: []
  category: 地理文化
  explanation: 伊斯兰教起源于公元7世纪初的阿拉伯半岛，信仰者称为穆斯林，主要分布在亚洲西部和东南部、非洲北部和东部。
  misconceptions:
    - 误认为伊斯兰教起源于古印度
    - 把穆斯林当作民族而非宗教信仰者
    - 认为伊斯兰教徒主要分布在欧洲和美洲
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:伏尔加河
  type: Concept
  subject: 地理
  title: 伏尔加河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为伏尔加河流入北冰洋，实际是流入里海的内流河。
    - 能指出并纠正这一错误：误以为欧洲第一长河是多瑙河，实际是伏尔加河。
  aliases:
    - 伏尔加河
  category: 河流
  explanation: 伏尔加河发源于东欧平原，向南流入里海，是欧洲第一长河，航运发达，被誉为“母亲河”。
  misconceptions:
    - 误认为伏尔加河流入北冰洋，实际是流入里海的内流河。
    - 误以为欧洲第一长河是多瑙河，实际是伏尔加河。
    - 误认为伏尔加河发源于西西伯利亚平原，实际发源于东欧平原。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:休渔制度
  type: Concept
  subject: 地理
  title: 休渔制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为休渔期完全禁止捕鱼，其实只是限制捕捞。
    - 能指出并纠正这一错误：以为休渔制度只保护鱼类，忽略渔业资源整体养护。
  aliases:
    - 海洋休渔
  category: 渔业管理
  explanation: 依据《渔业法》建立的渔业资源养护制度，通过禁渔期、休渔期限制捕捞，保护渔业资源。
  misconceptions:
    - 误认为休渔期完全禁止捕鱼，其实只是限制捕捞。
    - 以为休渔制度只保护鱼类，忽略渔业资源整体养护。
    - 误将休渔期安排在冬季，实际根据渔业资源繁殖季节设定。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:传统村落保护
  type: Concept
  subject: 地理
  title: 传统村落保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为保护传统村落就是完全不许改造，连必要修缮也不行。
    - 能指出并纠正这一错误：只保护古建筑单体，却忽视了街巷、水系等整体风貌。
  aliases:
    - 乡村风貌保护
  category: 地理政策
  explanation: 保护传统村落和乡村风貌是乡村振兴战略的重要内容，旨在保留文化遗产。
  misconceptions:
    - 认为保护传统村落就是完全不许改造，连必要修缮也不行。
    - 只保护古建筑单体，却忽视了街巷、水系等整体风貌。
    - 误以为乡村振兴必须拆除旧村落，与保护是矛盾的。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:低温中心与高温中心
  type: Concept
  subject: 地理
  title: 低温中心与高温中心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把闭合等温线中心气温低于周围判为高温中心，概念弄反
    - 能指出并纠正这一错误：误认为低温中心只在冬季出现，忽略夏季青藏高原也可成低温中心
  aliases: []
  category: 地理概念
  explanation: 等温线闭合时，中心气温低于周围为低温中心，高于周围为高温中心。
  misconceptions:
    - 把闭合等温线中心气温低于周围判为高温中心，概念弄反
    - 误认为低温中心只在冬季出现，忽略夏季青藏高原也可成低温中心
    - 在等温线图上，中心气温高于周围却判为低温中心
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:低碳生活
  type: Concept
  subject: 地理
  title: 低碳生活
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为低碳生活就是少开车，把随手关灯、节约用水排除在外。
    - 能指出并纠正这一错误：觉得个人减排没用，认为只有工厂停产才算低碳。
  aliases: []
  category: 生活方式
  explanation: 通过节电、节油、节气、节水等绿色生活方式减少碳排放，助力实现碳达峰和碳中和。
  misconceptions:
    - 认为低碳生活就是少开车，把随手关灯、节约用水排除在外。
    - 觉得个人减排没用，认为只有工厂停产才算低碳。
    - 将低碳生活等同于不消费、不用电，误以为完全回到原始状态。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:佛教
  type: Concept
  subject: 地理
  title: 佛教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为佛教起源于中国或日本
    - 能指出并纠正这一错误：误以为佛教主要分布在中东和北非
  aliases: []
  category: 地理文化
  explanation: 佛教起源于公元前6世纪至前5世纪的古印度，主要分布在亚洲东部和东南部。
  misconceptions:
    - 认为佛教起源于中国或日本
    - 误以为佛教主要分布在中东和北非
    - 把佛教创始人混淆为耶稣或穆罕默德
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:俄罗斯四大工业区
  type: Concept
  subject: 地理
  title: 俄罗斯四大工业区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉乌拉尔工业区，只记住莫斯科和圣彼得堡。
    - 能指出并纠正这一错误：误认为新西伯利亚工业区位于欧洲部分，实际在亚洲。
  aliases:
    - 俄罗斯工业区
  category: 地理
  explanation: 俄罗斯工业主要集中分布在莫斯科工业区、圣彼得堡工业区、乌拉尔工业区和新西伯利亚工业区。
  misconceptions:
    - 漏掉乌拉尔工业区，只记住莫斯科和圣彼得堡。
    - 误认为新西伯利亚工业区位于欧洲部分，实际在亚洲。
    - 混淆圣彼得堡工业区与莫斯科工业区的相对位置，前者在西北沿海。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:俄罗斯对外贸易
  type: Concept
  subject: 地理
  title: 俄罗斯对外贸易
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为俄罗斯是亚洲国家，实际是传统欧洲国家。
    - 能指出并纠正这一错误：以为俄罗斯最大贸易伙伴是德国，实际中国自2010年起保持第一。
  aliases: []
  category: 地理
  explanation: 俄罗斯是传统欧洲国家，近年来扩大与亚洲国家经济合作，中国自2010年起成为其最大贸易伙伴。
  misconceptions:
    - 误认为俄罗斯是亚洲国家，实际是传统欧洲国家。
    - 以为俄罗斯最大贸易伙伴是德国，实际中国自2010年起保持第一。
    - 忽视俄罗斯近年与亚洲国家合作，误以为只面向欧洲市场。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:俄罗斯的交通
  type: Concept
  subject: 地理
  title: 俄罗斯的交通
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为俄罗斯公路运输占主导，实际长途运输以铁路为主。
    - 能指出并纠正这一错误：误以为西伯利亚大铁路连接莫斯科到摩尔曼斯克，实际是莫斯科到海参崴。
  aliases:
    - 俄罗斯交通
    - 俄罗斯的交通特点
  category: 交通
  explanation: 俄罗斯交通运输业发达，铁路运输在长途运输中占主导，西伯利亚大铁路连接东西。
  misconceptions:
    - 误认为俄罗斯公路运输占主导，实际长途运输以铁路为主。
    - 误以为西伯利亚大铁路连接莫斯科到摩尔曼斯克，实际是莫斯科到海参崴。
    - 忽视管道运输的重要性，误以为客货运输全靠铁路和公路。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:俄罗斯的人口分布
  type: Concept
  subject: 地理
  title: 俄罗斯的人口分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为俄罗斯亚洲部分人口稠密，实际欧洲部分人口约占4/5。
    - 能指出并纠正这一错误：误以为人口均匀分布在乌拉尔山脉两侧，实际西部远多于东部。
  aliases:
    - 俄罗斯人口
  category: 人口
  explanation: 俄罗斯人口分布极不均匀，欧洲部分人口约占4/5，亚洲部分地广人稀。
  misconceptions:
    - 误认为俄罗斯亚洲部分人口稠密，实际欧洲部分人口约占4/5。
    - 误以为人口均匀分布在乌拉尔山脉两侧，实际西部远多于东部。
    - 误认为亚洲部分地广人稀，却将西伯利亚地区与欧洲部分人口混为一谈。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:俄罗斯的农业
  type: Concept
  subject: 地理
  title: 俄罗斯的农业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为俄罗斯农业集中分布在亚洲部分，实际在东欧平原南部。
    - 能指出并纠正这一错误：误以为主要粮食作物是水稻，实际是小麦、黑麦等耐寒作物。
  aliases:
    - 俄罗斯农业
  category: 农业
  explanation: 俄罗斯农业集中分布在东欧平原南部，主要粮食作物有小麦、黑麦等。
  misconceptions:
    - 误认为俄罗斯农业集中分布在亚洲部分，实际在东欧平原南部。
    - 误以为主要粮食作物是水稻，实际是小麦、黑麦等耐寒作物。
    - 忽视纬度对农业的限制，误以为全国普遍种植谷物。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:俄罗斯的地形
  type: Concept
  subject: 地理
  title: 俄罗斯的地形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为乌拉尔山脉以西是西西伯利亚平原，实际为东欧平原。
    - 能指出并纠正这一错误：混淆中西伯利亚高原与东西伯利亚山地，前者在勒拿河以西，后者在东部。
  aliases:
    - 俄罗斯地形
    - 俄罗斯的地形特点
  category: 地形
  explanation: 以乌拉尔山脉为界，西部为东欧平原，东部自西向东为西西伯利亚平原、中西伯利亚高原和东西伯利亚山地。
  misconceptions:
    - 误认为乌拉尔山脉以西是西西伯利亚平原，实际为东欧平原。
    - 混淆中西伯利亚高原与东西伯利亚山地，前者在勒拿河以西，后者在东部。
    - 误以为东西伯利亚山地位于乌拉尔山脉以西，实际在远东地区。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:俄罗斯的地理位置
  type: Concept
  subject: 地理
  title: 俄罗斯的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄罗斯亚洲面积占3/4，所以属于亚洲国家
    - 能指出并纠正这一错误：误以为莫斯科位于亚洲部分，实际在欧洲
  aliases:
    - 俄罗斯位置
    - 俄罗斯的领土组成
    - 俄罗斯领土
  category: 地理位置
  explanation: 俄罗斯地跨亚、欧两大洲，陆地面积1/4在欧洲，3/4在亚洲，属于欧洲国家。
  misconceptions:
    - 误以为俄罗斯亚洲面积占3/4，所以属于亚洲国家
    - 误以为莫斯科位于亚洲部分，实际在欧洲
    - 误以为乌拉尔山完全在俄罗斯境内，忽视了亚欧分界线
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:俄罗斯的工业
  type: Concept
  subject: 地理
  title: 俄罗斯的工业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄罗斯轻工业发达，与重工业并重
    - 能指出并纠正这一错误：误以为俄罗斯工业以民用产品为主，因为常见消费品多进口
  aliases:
    - 俄罗斯工业
    - 俄罗斯的工业特点
  category: 工业
  explanation: 俄罗斯工业基础良好，重工业、核工业和航空航天工业突出，民用工业相对薄弱。
  misconceptions:
    - 误以为俄罗斯轻工业发达，与重工业并重
    - 误以为俄罗斯工业以民用产品为主，因为常见消费品多进口
    - 误把核工业和航空航天工业归为轻工业
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:俄罗斯的森林资源
  type: Concept
  subject: 地理
  title: 俄罗斯的森林资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为世界上森林面积最大的国家是巴西，忽视俄罗斯寒带针叶林
    - 能指出并纠正这一错误：误以为俄罗斯森林覆盖率超过一半，实际约1/2
  aliases:
    - 俄罗斯森林
  category: 自然资源
  explanation: 俄罗斯是世界上森林面积最大的国家，森林覆盖面积约占其陆地面积的1/2。
  misconceptions:
    - 误以为世界上森林面积最大的国家是巴西，忽视俄罗斯寒带针叶林
    - 误以为俄罗斯森林覆盖率超过一半，实际约1/2
    - 误以为森林面积大等于覆盖率世界第一，两者概念混淆
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:俄罗斯的民族
  type: Concept
  subject: 地理
  title: 俄罗斯的民族
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄罗斯是单一民族国家，认为俄罗斯族占100%
    - 能指出并纠正这一错误：误以为俄罗斯族人口比例超过90%，实际约77.7%
  aliases:
    - 俄罗斯民族
  category: 民族
  explanation: 俄罗斯是多民族国家，有194个民族，俄罗斯族约占总人口的77.7%。
  misconceptions:
    - 误以为俄罗斯是单一民族国家，认为俄罗斯族占100%
    - 误以为俄罗斯族人口比例超过90%，实际约77.7%
    - 误以为乌克兰族是俄罗斯最大少数民族，实际是鞑靼族等
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:俄罗斯的气候
  type: Concept
  subject: 地理
  title: 俄罗斯的气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄罗斯大部分地区属于寒带气候，因为冬季寒冷
    - 能指出并纠正这一错误：将温带大陆性气候误判为温带季风气候，以为夏季多雨
  aliases:
    - 俄罗斯气候
    - 俄罗斯的气候特征
  category: 气候
  explanation: 俄罗斯大部分地区属温带大陆性气候，冬季漫长而寒冷，夏季短促而温暖，北极圈以北有寒带苔原气候。
  misconceptions:
    - 误以为俄罗斯大部分地区属于寒带气候，因为冬季寒冷
    - 将温带大陆性气候误判为温带季风气候，以为夏季多雨
    - 误以为莫斯科是极地气候，实际是温带大陆性气候
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:俄罗斯的疆域
  type: Concept
  subject: 地理
  title: 俄罗斯的疆域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为世界面积最大国家是加拿大或中国，不是俄罗斯
    - 能指出并纠正这一错误：误记俄罗斯陆地面积为1000多万平方千米，实际1709.8万
  aliases:
    - 俄罗斯面积
  category: 领土
  explanation: 俄罗斯陆地面积1709.8万平方千米，是世界上面积最大的国家。
  misconceptions:
    - 误以为世界面积最大国家是加拿大或中国，不是俄罗斯
    - 误记俄罗斯陆地面积为1000多万平方千米，实际1709.8万
    - 误以为俄罗斯只跨亚欧两洲，忽略其跨东西半球
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:俄罗斯的矿产资源
  type: Concept
  subject: 地理
  title: 俄罗斯的矿产资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄罗斯矿产资源主要分布在欧洲部分，实际在乌拉尔山以东
    - 能指出并纠正这一错误：误以为俄罗斯矿产资源自给率低，需要大量进口
  aliases:
    - 俄罗斯矿产
  category: 自然资源
  explanation: 俄罗斯矿产资源种类多、储量大、自给程度高，大部分分布在乌拉尔山脉及其以东地区。
  misconceptions:
    - 误以为俄罗斯矿产资源主要分布在欧洲部分，实际在乌拉尔山以东
    - 误以为俄罗斯矿产资源自给率低，需要大量进口
    - 误以为乌拉尔山脉仅属于欧洲，矿产分布与山脉混淆
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:俄罗斯的自然资源
  type: Concept
  subject: 地理
  title: 俄罗斯的自然资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄罗斯自然资源贫乏，因气候寒冷不适宜开发
    - 能指出并纠正这一错误：误以为自然资源只指矿产，忽略森林和水资源
  aliases:
    - 俄罗斯资源
  category: 自然资源
  explanation: 俄罗斯矿产资源丰富，森林面积世界第一，自给程度高。
  misconceptions:
    - 误以为俄罗斯自然资源贫乏，因气候寒冷不适宜开发
    - 误以为自然资源只指矿产，忽略森林和水资源
    - 误以为俄罗斯森林资源丰富但矿产资源不足，自给程度低
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:俄语
  type: Concept
  subject: 地理
  title: 俄语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄语只通行于俄罗斯，忽略其在邻近国家广泛使用
    - 能指出并纠正这一错误：将俄语使用范围说成覆盖全部东欧国家，实际主要是俄罗斯及邻国
  aliases: []
  category: 地理
  explanation: 俄语主要在俄罗斯及邻近国家使用。
  misconceptions:
    - 误以为俄语只通行于俄罗斯，忽略其在邻近国家广泛使用
    - 将俄语使用范围说成覆盖全部东欧国家，实际主要是俄罗斯及邻国
    - 认为俄语不是联合国工作语言，漏答俄语
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:修建水库
  type: Concept
  subject: 地理
  title: 修建水库
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为修建水库解决水资源空间分布不均，实际是时间不均。
    - 能指出并纠正这一错误：认为水库丰水期放水、枯水期蓄水，蓄放时机说反。
  aliases:
    - 水库
  category: 地理措施
  explanation: 解决水资源时间分配不均匀的主要措施，利用大坝拦截径流，丰水期蓄水、枯水期放水，具有防洪、灌溉、发电等功能。
  misconceptions:
    - 误以为修建水库解决水资源空间分布不均，实际是时间不均。
    - 认为水库丰水期放水、枯水期蓄水，蓄放时机说反。
    - 忽视水库的防洪灌溉功能，只认为是蓄水工程。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:光年
  type: Concept
  subject: 地理
  title: 光年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把光年当作时间单位，例如说‘飞到某星需要5光年’。
    - 能指出并纠正这一错误：误以为1光年等于光走一年所经过的时间，实际是距离。
  aliases: []
  category: 天文学单位
  explanation: 光在真空中一年内所走过的距离，是一种长度单位。
  misconceptions:
    - 误把光年当作时间单位，例如说‘飞到某星需要5光年’。
    - 误以为1光年等于光走一年所经过的时间，实际是距离。
    - 计算光年数值时误用9.46万亿公里，忽略单位换算导致数量级错误。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:全球性社会问题
  type: Concept
  subject: 地理
  title: 全球性社会问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球性社会问题只包括环境污染和气候变化，忽略贫困、粮食安全等。
    - 能指出并纠正这一错误：看图表时只关注发达国家排放总量，忽视人均排放和发展中国家增量。
  aliases:
    - 全球性问题
  category: 地理概念
  explanation: 全球性社会问题包括气候变化、环境污染、能源危机、野生动物保护等，需要各国合作共同应对。
  misconceptions:
    - 认为全球性社会问题只包括环境污染和气候变化，忽略贫困、粮食安全等。
    - 看图表时只关注发达国家排放总量，忽视人均排放和发展中国家增量。
    - 将人口老龄化列为全球性社会问题，但它主要是区域性问题。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:全球气候变暖
  type: Concept
  subject: 地理
  title: 全球气候变暖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为全球变暖导致地球上每个地区气温都逐年升高，忽视气候波动和局地变冷。
    - 能指出并纠正这一错误：认为全球变暖完全由人类活动引起，忽略太阳辐射、火山活动等自然因素。
  aliases:
    - 温室效应
  category: 地理现象
  explanation: 工业革命以来大量排放温室气体导致全球气候变暖，需采取应对措施。
  misconceptions:
    - 误以为全球变暖导致地球上每个地区气温都逐年升高，忽视气候波动和局地变冷。
    - 认为全球变暖完全由人类活动引起，忽略太阳辐射、火山活动等自然因素。
    - 误以为应对全球变暖只需少开空调，不了解工业减排和能源转型是关键。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:公转周期
  type: Concept
  subject: 地理
  title: 公转周期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为地球公转一周的时间是24小时，混淆了自转周期。
    - 能指出并纠正这一错误：写公转周期直接写365天，忽略了约6小时累积的闰年。
  aliases: []
  category: 地理规律
  explanation: 地球公转的周期为一年。
  misconceptions:
    - 认为地球公转一周的时间是24小时，混淆了自转周期。
    - 写公转周期直接写365天，忽略了约6小时累积的闰年。
    - 认为公转周期就是太阳直射点回归周期，实际恒星年与回归年有差异。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:公转方向
  type: Concept
  subject: 地理
  title: 公转方向
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：画公转示意图时，把箭头标成自东向西。
    - 能指出并纠正这一错误：从北极上空看公转方向，错误认为是顺时针，实际是逆时针。
  aliases: []
  category: 地理规律
  explanation: 地球公转的方向是自西向东，与自转方向相同。
  misconceptions:
    - 画公转示意图时，把箭头标成自东向西。
    - 从北极上空看公转方向，错误认为是顺时针，实际是逆时针。
    - 认为公转方向与自转方向相反，实际两者都是自西向东。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:六大板块
  type: Concept
  subject: 地理
  title: 六大板块
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为印度洋板块只包括印度洋，实际上阿拉伯半岛、印度半岛也属于该板块
    - 能指出并纠正这一错误：将太平洋板块与太平洋海盆等面积，忽略它还包括加利福尼亚半岛等陆地边缘
  aliases: []
  category: 地理概念
  explanation: 亚欧板块、美洲板块、非洲板块、太平洋板块、印度洋板块和南极洲板块，构成全球岩石圈的基本单元。
  misconceptions:
    - 误以为印度洋板块只包括印度洋，实际上阿拉伯半岛、印度半岛也属于该板块
    - 将太平洋板块与太平洋海盆等面积，忽略它还包括加利福尼亚半岛等陆地边缘
    - 背不出六大板块完整名称，常漏掉南极洲板块，或把南美洲板块误作独立板块
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:共建“一带一路”倡议
  type: Concept
  subject: 地理
  title: 共建“一带一路”倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为一带一路只是陆上丝绸之路，忽略海上部分
    - 能指出并纠正这一错误：认为该倡议只对中国有利，忽视共商共建共享原则
  aliases:
    - 一带一路
  category: 经济概念
  explanation: 中国提出的共建“一带一路”倡议坚持共商、共建、共享的根本原则，创造了一个具有包容性的发展平台，已成为当今世界范围最广、规模最大的区域合作平台。
  misconceptions:
    - 误以为一带一路只是陆上丝绸之路，忽略海上部分
    - 认为该倡议只对中国有利，忽视共商共建共享原则
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:再生水
  type: Concept
  subject: 地理
  title: 再生水
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为再生水可直接饮用，如拿中水做饭，实际只能用于冲厕、绿化等非饮用
    - 能指出并纠正这一错误：把再生水当污水，忽视其处理后达到一定水质可重复利用的特点
  aliases:
    - 中水
  category: 地理概念
  explanation: 也叫中水，指污水经适当处理后达到一定水质指标，可在一定范围内重复使用的非饮用水，具有成本低、环保等优势。
  misconceptions:
    - 误认为再生水可直接饮用，如拿中水做饭，实际只能用于冲厕、绿化等非饮用
    - 把再生水当污水，忽视其处理后达到一定水质可重复利用的特点
    - 以为再生水成本高于自来水，实际因就近回用成本较低
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:农业生态环境问题
  type: Concept
  subject: 地理
  title: 农业生态环境问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为土地盐渍化仅由干旱自然形成，忽略大水漫灌等不合理灌溉也会导致
    - 能指出并纠正这一错误：把农田污染全归为工业污染，忽视过量施肥、滥用农药也是农业生态问题
  aliases:
    - 农业环境问题
  category: 环境问题
  explanation: 包括土地荒漠化、水土流失、土地盐渍化和农田污染等，不利于农业可持续发展。
  misconceptions:
    - 认为土地盐渍化仅由干旱自然形成，忽略大水漫灌等不合理灌溉也会导致
    - 把农田污染全归为工业污染，忽视过量施肥、滥用农药也是农业生态问题
    - 以为水土流失只发生在山区，平原农耕区植被破坏同样会引发
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S2.md
- id: concept:地理:冰芯研究
  type: Concept
  subject: 地理
  title: 冰芯研究
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为冰芯气泡中的CO2可直接代表当时大气CO2，忽略冰芯深度与年代对应关系
    - 能指出并纠正这一错误：把冰芯研究等同于化石研究，认为记录的是生物遗骸而非气候信息
  aliases:
    - 冰芯
  category: 地理概念
  explanation: 科学家钻取冰芯研究古气候和古环境信息，冰芯记录显示工业革命后大气二氧化碳含量迅速增加。
  misconceptions:
    - 误以为冰芯气泡中的CO2可直接代表当时大气CO2，忽略冰芯深度与年代对应关系
    - 把冰芯研究等同于化石研究，认为记录的是生物遗骸而非气候信息
    - 认为工业革命前大气CO2一直很高，与冰芯记录显示的迅速增加矛盾
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:凌汛
  type: Concept
  subject: 地理
  title: 凌汛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为凌汛发生在从高纬流向低纬的河段，实际为低纬流向高纬
    - 能指出并纠正这一错误：认为凌汛只发生在冬季封河时，忽略春季解冻也会发生
  aliases: []
  category: 地理现象
  explanation: 河流从低纬流向高纬河段，春季解冻时上游先融，浮冰堵塞河道导致水位上涨的现象。
  misconceptions:
    - 误认为凌汛发生在从高纬流向低纬的河段，实际为低纬流向高纬
    - 认为凌汛只发生在冬季封河时，忽略春季解冻也会发生
    - 把凌汛和洪水混为一谈，认为无结冰期的河流也会发生凌汛
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:分层设色地形图
  type: Concept
  subject: 地理
  title: 分层设色地形图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不看图例，误以为绿色永远代表陆地，蓝色永远代表海洋
    - 能指出并纠正这一错误：混淆分层设色地形图中海拔高度与颜色的对应关系，如将黄色误认为高海拔
  aliases:
    - 分层设色图
  category: 地理技能
  explanation: 分层设色地形图用不同颜色表示陆地海拔和海洋深度，通过图例和注记识别地形类型。
  misconceptions:
    - 不看图例，误以为绿色永远代表陆地，蓝色永远代表海洋
    - 混淆分层设色地形图中海拔高度与颜色的对应关系，如将黄色误认为高海拔
    - 忽视注记，无法从图中识别具体地形类型
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:劳动力需求转变
  type: Concept
  subject: 地理
  title: 劳动力需求转变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自动化只减少低端岗位，不增加任何新岗位，忽视高层次技术人员需求增加
    - 能指出并纠正这一错误：把劳动力需求转变理解成总人数减少，忽略低端减少、高端增加的结构变化
  aliases: []
  category: 劳动力市场
  explanation: 随着自动化发展，对低端作业工人的需求减少，对高层次技术人员的需求增加。
  misconceptions:
    - 认为自动化只减少低端岗位，不增加任何新岗位，忽视高层次技术人员需求增加
    - 把劳动力需求转变理解成总人数减少，忽略低端减少、高端增加的结构变化
    - 认为自动化只影响工业，农业和服务业的劳动力需求也在转变
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:北京市域空间结构
  type: Concept
  subject: 地理
  title: 北京市域空间结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把雄安新区当作北京的行政区，不知它属河北但承担北京功能疏解。
    - 能指出并纠正这一错误：将北京城市副中心的位置误写在雄安新区，实际副中心在通州。
  aliases: []
  category: 人文地理
  explanation: 北京构建了以首都功能核心区和中心城区为中心，北京城市副中心和雄安新区为两翼，平原地区新城为支撑，山区为生态涵养区的空间结构。
  misconceptions:
    - 把雄安新区当作北京的行政区，不知它属河北但承担北京功能疏解。
    - 将北京城市副中心的位置误写在雄安新区，实际副中心在通州。
    - 忽略山区生态涵养区的支撑作用，误以为平原地区新城是北京唯一支撑。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的世界文化遗产
  type: Concept
  subject: 地理
  title: 北京的世界文化遗产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为明十三陵在南京，实际是北京昌平的明代皇陵。
    - 能指出并纠正这一错误：把大运河排除在北京世界遗产之外，不知北京段也列入遗产。
  aliases: []
  category: 人文地理
  explanation: 北京拥有周口店北京人遗址、长城、故宫、颐和园、天坛、明十三陵和大运河等世界文化遗产。
  misconceptions:
    - 误以为明十三陵在南京，实际是北京昌平的明代皇陵。
    - 把大运河排除在北京世界遗产之外，不知北京段也列入遗产。
    - 将八达岭误认为唯一入选的长城地段，忽略长城作为整体遗产。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的两轴
  type: Concept
  subject: 地理
  title: 北京的两轴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把北京两轴说成中轴线和长安街，漏掉了各自的延长线。
    - 能指出并纠正这一错误：认为长安街及其延长线是南北向，实际长安街是东西向。
  aliases: []
  category: 人文地理
  explanation: 北京城市空间结构中的两轴指中轴线及其延长线和长安街及其延长线。
  misconceptions:
    - 误把北京两轴说成中轴线和长安街，漏掉了各自的延长线。
    - 认为长安街及其延长线是南北向，实际长安街是东西向。
    - 把中轴线只理解为传统皇城纵轴，忽略其向北向南延伸的延长线。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的历史文化传统
  type: Concept
  subject: 地理
  title: 北京的历史文化传统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把北京建城史说成5000多年，错把中华文明史当北京城建史。
    - 能指出并纠正这一错误：漏掉辽、金，只说北京是元明清三代古都。
  aliases:
    - 古都北京
  category: 人文地理
  explanation: 北京有3000多年历史，是辽、金、元、明、清等朝代的古都，保留有世界文化遗产和独特的京味儿文化。
  misconceptions:
    - 把北京建城史说成5000多年，错把中华文明史当北京城建史。
    - 漏掉辽、金，只说北京是元明清三代古都。
    - 误以为北京所有古建筑都始建于明朝，无视辽金元时期的遗存。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的地理位置
  type: Concept
  subject: 地理
  title: 北京的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为北京位于华北平原东北部，实际在西北端。
    - 能指出并纠正这一错误：将北京北部的燕山写成太行山，或将西山当作燕山。
  aliases: []
  category: 自然地理
  explanation: 北京位于华北平原西北端，北靠燕山，西临西山，东面和南面是华北平原。
  misconceptions:
    - 误以为北京位于华北平原东北部，实际在西北端。
    - 将北京北部的燕山写成太行山，或将西山当作燕山。
    - 认为北京东面濒临渤海，实际不临海，距渤海有一定距离。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的城市职能
  type: Concept
  subject: 地理
  title: 北京的城市职能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只写政治中心、文化中心，漏掉国际交往中心和科技创新中心。
    - 能指出并纠正这一错误：误以为北京城市职能包括经济中心，战略定位中没有经济中心。
  aliases:
    - 首都职能
  category: 人文地理
  explanation: 北京的城市战略定位是全国政治中心、文化中心、国际交往中心、科技创新中心。
  misconceptions:
    - 只写政治中心、文化中心，漏掉国际交往中心和科技创新中心。
    - 误以为北京城市职能包括经济中心，战略定位中没有经济中心。
    - 把国际交往中心错写为国际金融中心或国际贸易中心。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的气候
  type: Concept
  subject: 地理
  title: 北京的气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将北京气候归为温带大陆性气候，忽略降水集中于夏季的季风特征。
    - 能指出并纠正这一错误：认为北京夏季高温多雨是受台风影响，实际是受来自太平洋的东南季风影响。
  aliases: []
  category: 自然地理
  explanation: 北京属于温带季风气候，四季分明，夏季高温多雨，冬季寒冷干燥。
  misconceptions:
    - 误将北京气候归为温带大陆性气候，忽略降水集中于夏季的季风特征。
    - 认为北京夏季高温多雨是受台风影响，实际是受来自太平洋的东南季风影响。
    - 误以为北京冬季寒冷干燥是受寒潮影响，实际主要与蒙古-西伯利亚高压和冬季风有关。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的水系
  type: Concept
  subject: 地理
  title: 北京的水系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为永定河属黄河水系，实际永定河是海河水系中的主要河流。
    - 能指出并纠正这一错误：把潮白河误认为北京境内第一大河，第一大河是永定河。
  aliases: []
  category: 自然地理
  explanation: 北京的河流属海河水系，主要河流有永定河、潮白河、拒马河和温榆河，其中永定河是北京境内第一大河。
  misconceptions:
    - 误认为永定河属黄河水系，实际永定河是海河水系中的主要河流。
    - 把潮白河误认为北京境内第一大河，第一大河是永定河。
    - 误以为北京河流分属黄河、海河和长江水系，实际主要属海河水系。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北京的经济结构变化
  type: Concept
  subject: 地理
  title: 北京的经济结构变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：读折线图时把产业比重变化看成产业产值变化，二者不能等同。
    - 能指出并纠正这一错误：误以为第二产业占比下降说明北京工业在萎缩，实际占比下降不等于产值下降。
  aliases: []
  category: 经济地理
  explanation: 1980年至2020年，北京第一、第二产业占比下降，第三产业占比上升，经济结构不断转型升级。
  misconceptions:
    - 读折线图时把产业比重变化看成产业产值变化，二者不能等同。
    - 误以为第二产业占比下降说明北京工业在萎缩，实际占比下降不等于产值下降。
    - 误以为1980年北京第三产业占比最高，实际当时第二产业占比更高。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:北冰洋
  type: Concept
  subject: 地理
  title: 北冰洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北冰洋面积大于印度洋，实际北冰洋是四大洋中最小的。
    - 能指出并纠正这一错误：误以为北冰洋大部分位于北温带，实际大部分位于北寒带。
  aliases: []
  category: 地理区域
  explanation: 北冰洋是四大洋中面积最小的，面积不到太平洋的1/13，大部分位于北极圈内，温度很低。
  misconceptions:
    - 认为北冰洋面积大于印度洋，实际北冰洋是四大洋中最小的。
    - 误以为北冰洋大部分位于北温带，实际大部分位于北寒带。
    - 认为北冰洋是南极洲附近的大洋，实际它位于北极圈内。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:北回归线
  type: Concept
  subject: 地理
  title: 北回归线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把北回归线写成23.5°S，与南回归线混淆
    - 能指出并纠正这一错误：误认为北回归线是热带和北寒带的分界线，实际是热带与北温带分界
  aliases: []
  category: 地理概念
  explanation: 23.5°N纬线，是热带和北温带的分界线。
  misconceptions:
    - 把北回归线写成23.5°S，与南回归线混淆
    - 误认为北回归线是热带和北寒带的分界线，实际是热带与北温带分界
    - 认为北回归线穿过赤道，实际位于赤道以北23.5°
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:北方地区
  type: Concept
  subject: 地理
  title: 北方地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北方地区全部属于暖温带，忽略东北有中温带和寒温带
    - 能指出并纠正这一错误：误认为北方地区以水田为主，实际以旱地为主
  aliases: []
  category: 地理
  explanation: 位于秦岭—淮河线以北，以平原和高原为主，耕地以旱地为主，主要农作物有小麦、棉花等。
  misconceptions:
    - 误认为北方地区全部属于暖温带，忽略东北有中温带和寒温带
    - 误认为北方地区以水田为主，实际以旱地为主
    - 把北方地区与南方地区的分界误定为长城，实际是秦岭—淮河线
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:北极和南极
  type: Concept
  subject: 地理
  title: 北极和南极
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把北极点误认为是陆地，实际是北冰洋上的浮冰
    - 能指出并纠正这一错误：觉得南极是最北点，北极是最南点，把南北极位置搞反
  aliases:
    - 北极点
    - 南极点
  category: 地理概念
  explanation: 地轴与地球表面的两个交点，北极是最北点，南极是最南点。
  misconceptions:
    - 把北极点误认为是陆地，实际是北冰洋上的浮冰
    - 觉得南极是最北点，北极是最南点，把南北极位置搞反
    - 将北极点与北极圈混淆，认为北极圈内都是北极点
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:北极圈
  type: Concept
  subject: 地理
  title: 北极圈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把北极圈度数写成66.5°S，与南极圈混淆
    - 能指出并纠正这一错误：误认为北极圈是热带和北温带的分界线，实际是北温带和北寒带分界
  aliases: []
  category: 地理概念
  explanation: 66.5°N纬线，是北温带和北寒带的分界线。
  misconceptions:
    - 把北极圈度数写成66.5°S，与南极圈混淆
    - 误认为北极圈是热带和北温带的分界线，实际是北温带和北寒带分界
    - 认为北极圈内所有地方都有极昼极夜，实际只出现在极圈及其以北
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:北极地区
  type: Concept
  subject: 地理
  title: 北极地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北极地区是一块大陆，实际主体是北冰洋
    - 能指出并纠正这一错误：把北极圈理解为所有陆地都位于圈内，忽视周边陆地分属多国
  aliases: []
  category: 地理区域
  explanation: 北极圈以北的区域，主体是北冰洋，周边陆地分属8个国家。
  misconceptions:
    - 误认为北极地区是一块大陆，实际主体是北冰洋
    - 把北极圈理解为所有陆地都位于圈内，忽视周边陆地分属多国
    - 认为北极地区就是北极点附近，忽略北极圈以北的广大区域
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:北极地区气候
  type: Concept
  subject: 地理
  title: 北极地区气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北极地区比南极更冷，实际南极平均气温更低
    - 能指出并纠正这一错误：看到降水少就认为气候干旱，忽略低温蒸发弱仍属湿润
  aliases:
    - 北极地区气候特征
  category: 自然地理
  explanation: 北极地区气候寒冷，最热月气温仅0～6℃，年降水量100～200毫米，以雪为主。
  misconceptions:
    - 误认为北极地区比南极更冷，实际南极平均气温更低
    - 看到降水少就认为气候干旱，忽略低温蒸发弱仍属湿润
    - 认为最热月均温在0℃以下，与事实0～6℃不符
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S5.md
- id: concept:地理:北极地区生物
  type: Concept
  subject: 地理
  title: 北极地区生物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北极熊也生活在南极地区，实际南极没有北极熊
    - 能指出并纠正这一错误：认为北极地区无人居住，忽略因纽特人等原住民
  aliases:
    - 北极地区生物分布
  category: 自然地理
  explanation: 北极地区植物有地衣、苔藓、北极棉花、北极柳等，动物有北极熊、驯鹿等，并有因纽特人等居民。
  misconceptions:
    - 误认为北极熊也生活在南极地区，实际南极没有北极熊
    - 认为北极地区无人居住，忽略因纽特人等原住民
    - 把驯鹿误认为南极特有动物，实际南极没有驯鹿
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:北极地区生物与居民
  type: Concept
  subject: 地理
  title: 北极地区生物与居民
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为因纽特人至今仍只住冰屋，现代因纽特人已采用现代住房
    - 能指出并纠正这一错误：把萨米人误认为是南美洲原住民，实际分布在北欧北极地区
  aliases: []
  category: 地理事实
  explanation: 北极植物有地衣、苔藓、北极棉花等，动物有北极熊、驯鹿，居民有因纽特人、萨米人。
  misconceptions:
    - 认为因纽特人至今仍只住冰屋，现代因纽特人已采用现代住房
    - 把萨米人误认为是南美洲原住民，实际分布在北欧北极地区
    - 认为北极居民传统上以捕鱼为生，实际以狩猎驯鹿等为生
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:北极环境保护战略
  type: Concept
  subject: 地理
  title: 北极环境保护战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为我国是北极理事会正式成员，实际只是正式观察员
    - 能指出并纠正这一错误：认为《北极环境保护战略》具有法律约束力，实际多为合作框架
  aliases:
    - 北极理事会
  category: 地理事实
  explanation: 北极地区国家签署《北极环境保护战略》并成立北极理事会，我国2013年成为正式观察员。
  misconceptions:
    - 误认为我国是北极理事会正式成员，实际只是正式观察员
    - 认为《北极环境保护战略》具有法律约束力，实际多为合作框架
    - 认为非北极国家不能参与北极事务，忽视观察员身份
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:北海道渔场
  type: Concept
  subject: 地理
  title: 北海道渔场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为北海道渔场位于日本海，实际在太平洋侧
    - 能指出并纠正这一错误：误以为北海道渔场因上升流形成，实际是寒暖流交汇
  aliases:
    - 北海道渔场
  category: 渔业
  explanation: 北海道附近海域处于寒暖流交汇处，鱼类饵料丰富，是世界四大渔场之一。
  misconceptions:
    - 误以为北海道渔场位于日本海，实际在太平洋侧
    - 误以为北海道渔场因上升流形成，实际是寒暖流交汇
    - 误以为世界四大渔场都因寒暖流交汇形成，忽视了秘鲁渔场
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:北美洲
  type: Concept
  subject: 地理
  title: 北美洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北美洲面积仅次于亚洲，忘记非洲也大于北美洲，实际亚洲>非洲>北美洲。
    - 能指出并纠正这一错误：误以为北美洲东临太平洋、西临大西洋，实际方向相反。
  aliases: []
  category: 地理区域
  explanation: 北美洲面积仅次于亚洲和非洲，是世界第三大洲。
  misconceptions:
    - 误认为北美洲面积仅次于亚洲，忘记非洲也大于北美洲，实际亚洲>非洲>北美洲。
    - 误以为北美洲东临太平洋、西临大西洋，实际方向相反。
    - 将北美洲与南美洲的分界线误认为是苏伊士运河，实际是巴拿马运河。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:区域性组织
  type: Concept
  subject: 地理
  title: 区域性组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为联合国属于区域性组织，实际是全球性组织
    - 能指出并纠正这一错误：认为区域组织只处理经济事务，实际涉及政治、文化等领域
  aliases:
    - Regional organization
  category: 地理概念
  explanation: 区域性组织是由若干国家组成的合作组织，涉及政治、经济、文化等领域，促进区域合作与发展。
  misconceptions:
    - 误认为联合国属于区域性组织，实际是全球性组织
    - 认为区域组织只处理经济事务，实际涉及政治、文化等领域
    - 把欧盟当作唯一区域组织，忽视其他如非盟、东盟
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:区域经济合作
  type: Concept
  subject: 地理
  title: 区域经济合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为区域经济合作必须由相邻国家组成，如欧盟模式
    - 能指出并纠正这一错误：混淆区域经济合作与经济全球化，以为二者互不相干
  aliases:
    - 区域经济一体化
  category: 经济概念
  explanation: 区域经济合作是指某一个区域内两个或两个以上的国家，为了维护共同的经济和政治利益，实现专业化分工和进行产品交换而采取共同的经济政策，实行某种形式的经济联合或组成区域性经济团体。
  misconceptions:
    - 认为区域经济合作必须由相邻国家组成，如欧盟模式
    - 混淆区域经济合作与经济全球化，以为二者互不相干
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C1/sections/S1.md
- id: concept:地理:单一经济
  type: Concept
  subject: 地理
  title: 单一经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为单一经济指国家只发展一个产业，实际是依赖一两种初级产品出口
    - 能指出并纠正这一错误：认为单一经济能提高生产效率，实际抗风险能力差，发展受限
  aliases: []
  category: 经济模式
  explanation: 殖民统治时期形成的只生产一两种产品的经济模式，导致经济依赖初级产品出口，发展困难。
  misconceptions:
    - 误认为单一经济指国家只发展一个产业，实际是依赖一两种初级产品出口
    - 认为单一经济能提高生产效率，实际抗风险能力差，发展受限
    - 把单一经济与我国计划经济混为一谈，忽略其殖民统治根源
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S5.md
- id: concept:地理:南北半球分界线
  type: Concept
  subject: 地理
  title: 南北半球分界线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为0°经线是南北半球分界线，将东经归为北半球
    - 能指出并纠正这一错误：把赤道当成东西半球分界线，以为西经都在西半球
  aliases: []
  category: 地理概念
  explanation: 赤道是南北半球的分界线。
  misconceptions:
    - 误认为0°经线是南北半球分界线，将东经归为北半球
    - 把赤道当成东西半球分界线，以为西经都在西半球
    - 判断半球时只看经度不看纬度，如认为东经就属于东半球
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:南北对话
  type: Concept
  subject: 地理
  title: 南北对话
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“南北对话”理解为南半球与北半球国家间的对话，实际上它是发展中国家与发达国家的商谈。
    - 能指出并纠正这一错误：误以为南北对话只谈经济，而它也包括政治等方面问题。
  aliases: []
  category: 地理概念
  explanation: 发展中国家与发达国家之间有关经济、政治等方面问题的商谈。
  misconceptions:
    - 把“南北对话”理解为南半球与北半球国家间的对话，实际上它是发展中国家与发达国家的商谈。
    - 误以为南北对话只谈经济，而它也包括政治等方面问题。
    - 将“南北对话”与“南南合作”混淆，认为都是发展中国家间的合作。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S1.md
- id: concept:地理:南北纵列的三大地形单元
  type: Concept
  subject: 地理
  title: 南北纵列的三大地形单元
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把亚欧大陆也归入南北纵列的三大地形单元
    - 能指出并纠正这一错误：误以为南美洲西部是平原，东部是山地
  aliases:
    - 三大地形单元
  category: 地理规律
  explanation: 北美大陆、南美大陆和澳大利亚大陆均大致呈南北纵列的三大地形单元，即中部平原，东西两侧山地或高原。
  misconceptions:
    - 把亚欧大陆也归入南北纵列的三大地形单元
    - 误以为南美洲西部是平原，东部是山地
    - 混淆北美和南美地形单元的排列顺序
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:南南合作
  type: Concept
  subject: 地理
  title: 南南合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“南南合作”是南半球国家之间的合作，实际上指发展中国家之间的合作。
    - 能指出并纠正这一错误：误把发展中国家与发达国家的合作也看作南南合作，如中美合作。
  aliases: []
  category: 地理概念
  explanation: 发展中国家之间的合作。
  misconceptions:
    - 认为“南南合作”是南半球国家之间的合作，实际上指发展中国家之间的合作。
    - 误把发展中国家与发达国家的合作也看作南南合作，如中美合作。
    - 认为中国是发达国家，因而否定中国参与南南合作。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S1.md
- id: concept:地理:南回归线
  type: Concept
  subject: 地理
  title: 南回归线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把南回归线度数写成23.5°N，与北回归线混淆
    - 能指出并纠正这一错误：误认为南回归线是南温带和南寒带的分界线，实际是热带和南温带分界
  aliases: []
  category: 地理概念
  explanation: 23.5°S纬线，是热带和南温带的分界线。
  misconceptions:
    - 把南回归线度数写成23.5°N，与北回归线混淆
    - 误认为南回归线是南温带和南寒带的分界线，实际是热带和南温带分界
    - 认为南回归线不经过任何大陆，实际穿过澳大利亚、南美洲等
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:南方地区
  type: Concept
  subject: 地理
  title: 南方地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南方地区全是亚热带，忽略其还有热带分布
    - 能指出并纠正这一错误：误认为南方地区地形以平原为主，实际以丘陵和盆地为主
  aliases: []
  category: 地理
  explanation: 位于秦岭—淮河线以南，以丘陵和盆地为主，耕地以水田为主，主要农作物有水稻、甘蔗等。
  misconceptions:
    - 误认为南方地区全是亚热带，忽略其还有热带分布
    - 误认为南方地区地形以平原为主，实际以丘陵和盆地为主
    - 认为南方地区耕地以旱地为主，实际以水田为主
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:南极圈
  type: Concept
  subject: 地理
  title: 南极圈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把南极圈度数写成66.5°N，与北极圈混淆
    - 能指出并纠正这一错误：误认为南极圈是热带和南温带的分界线，实际是南温带和南寒带分界
  aliases: []
  category: 地理概念
  explanation: 66.5°S纬线，是南温带和南寒带的分界线。
  misconceptions:
    - 把南极圈度数写成66.5°N，与北极圈混淆
    - 误认为南极圈是热带和南温带的分界线，实际是南温带和南寒带分界
    - 认为南极圈内有常住人口，实际无常住居民
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:南极地区
  type: Concept
  subject: 地理
  title: 南极地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南极洲平均海拔不高，因为冰盖掩盖了真实地表，实际是最高的洲
    - 能指出并纠正这一错误：认为南极地区仅指南极点，忽略南纬60°以南的海洋和岛屿
  aliases: []
  category: 地理区域
  explanation: 南纬60°以南的区域，包括南极洲及其周边海域，南极洲是世界上平均海拔最高的大洲。
  misconceptions:
    - 误认为南极洲平均海拔不高，因为冰盖掩盖了真实地表，实际是最高的洲
    - 认为南极地区仅指南极点，忽略南纬60°以南的海洋和岛屿
    - 把南极洲误认为被冰雪覆盖的海洋，实际是陆地
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:南极地区生物
  type: Concept
  subject: 地理
  title: 南极地区生物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南极地区有北极熊，实际北极熊只在北极
    - 能指出并纠正这一错误：认为南极植物有高大树木，实际只有地衣、苔藓等低等植物
  aliases:
    - 南极地区生物分布
  category: 自然地理
  explanation: 南极地区自然环境严酷，生物多样性受限，植物主要为地衣、苔藓和藻类，动物有企鹅、海豹、磷虾等。
  misconceptions:
    - 误认为南极地区有北极熊，实际北极熊只在北极
    - 认为南极植物有高大树木，实际只有地衣、苔藓等低等植物
    - 把企鹅误认为只生活在陆地，实际企鹅也在海冰上活动
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:南极大陆海拔最高
  type: Concept
  subject: 地理
  title: 南极大陆海拔最高
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南极洲海拔高是因为有高山，而非冰盖覆盖
    - 能指出并纠正这一错误：混淆南极洲平均海拔与最高峰海拔
  aliases: []
  category: 地理事实
  explanation: 南极大陆是世界上海拔最高的大陆，平均海拔约2350米，主要地形为高原，因冰盖覆盖而海拔高。
  misconceptions:
    - 误认为南极洲海拔高是因为有高山，而非冰盖覆盖
    - 混淆南极洲平均海拔与最高峰海拔
    - 忽视冰盖下基岩低平，以为基岩也高海拔
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:南极条约
  type: Concept
  subject: 地理
  title: 南极条约
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为我国是《南极条约》的原始缔约国，实际1983年才加入
    - 能指出并纠正这一错误：认为南极条约允许各国占有领土，实际冻结领土主权要求
  aliases: []
  category: 地理事实
  explanation: 1959年12个国家签订《南极条约》，明确南极和平利用、科学考察与国际合作、环境保护等内容，我国于1983年加入。
  misconceptions:
    - 误认为我国是《南极条约》的原始缔约国，实际1983年才加入
    - 认为南极条约允许各国占有领土，实际冻结领土主权要求
    - 误以为条约禁止一切军事活动，实际允许用于和平目的的科学考察
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:南极洲
  type: Concept
  subject: 地理
  title: 南极洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为南极洲是世界上面积最小的大洲，实际大洋洲面积最小。
    - 能指出并纠正这一错误：以为南极洲有因纽特人等原住民定居，实际无常住人口。
  aliases: []
  category: 地理区域
  explanation: 南极洲是世界第五大洲，地处高纬度地区，气温很低，终年积雪，是世界上唯一没有定居居民的大洲。
  misconceptions:
    - 认为南极洲是世界上面积最小的大洲，实际大洋洲面积最小。
    - 以为南极洲有因纽特人等原住民定居，实际无常住人口。
    - 认为南极洲属于某个国家，实际是共有的大洲，不能划归任何国家。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:南极洲冰盖
  type: Concept
  subject: 地理
  title: 南极洲冰盖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南极洲冰盖漂浮在水面上，实际是覆盖在陆地表面的冰层
    - 能指出并纠正这一错误：认为南极冰盖厚度各处相同，实际平均约2000米且区域差异大
  aliases:
    - 南极冰盖
  category: 地理事实
  explanation: 南极洲覆盖着平均厚度约2000米的冰盖，若去除冰盖，南极大陆平均海拔仅400多米。
  misconceptions:
    - 误认为南极洲冰盖漂浮在水面上，实际是覆盖在陆地表面的冰层
    - 认为南极冰盖厚度各处相同，实际平均约2000米且区域差异大
    - 把冰盖与海冰混淆，认为南极洲没有陆地，实际基岩在海平面以上
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S5.md
- id: concept:地理:南极洲地形剖面
  type: Concept
  subject: 地理
  title: 南极洲地形剖面
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把冰盖厚度当海拔，如认为南极洲平均海拔2000米
    - 能指出并纠正这一错误：认为去除冰盖后南极洲仍是高原地形，实际平均海拔仅400多米
  aliases: []
  category: 地理事实
  explanation: 南极洲冰盖平均厚度约2000米，去除冰盖后平均海拔仅400多米，反映冰盖对地形的影响。
  misconceptions:
    - 误把冰盖厚度当海拔，如认为南极洲平均海拔2000米
    - 认为去除冰盖后南极洲仍是高原地形，实际平均海拔仅400多米
    - 将冰盖与冰川混为一谈，剖面图上分不清冰层和基岩
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:南极洲淡水资源
  type: Concept
  subject: 地理
  title: 南极洲淡水资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南极冰盖可直接饮用或开采，忽略其分布在南极大陆
    - 能指出并纠正这一错误：混淆'淡水'与'总水'，认为南极冰体占全球水资源的70%
  aliases: []
  category: 地理事实
  explanation: 南极洲巨大的冰体蕴藏着丰富的淡水资源，占全球淡水资源总量的近70%。
  misconceptions:
    - 误认为南极冰盖可直接饮用或开采，忽略其分布在南极大陆
    - 混淆'淡水'与'总水'，认为南极冰体占全球水资源的70%
    - 认为南极冰盖是液态淡水，实际是固体冰川
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:南美洲
  type: Concept
  subject: 地理
  title: 南美洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为南美洲全部位于南半球，忽略赤道穿过其北部，北部在北半球。
    - 能指出并纠正这一错误：认为南美洲面积大于北美洲，实际北美洲第三，南美洲第四。
  aliases: []
  category: 地理区域
  explanation: 南美洲是世界第四大洲。
  misconceptions:
    - 误以为南美洲全部位于南半球，忽略赤道穿过其北部，北部在北半球。
    - 认为南美洲面积大于北美洲，实际北美洲第三，南美洲第四。
    - 把巴拿马运河当作南美洲与非洲的分界线，实际它是南北美洲分界线。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:卫星云图
  type: Concept
  subject: 地理
  title: 卫星云图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为卫星云图中绿色表示云团，实际绿色表示陆地
    - 能指出并纠正这一错误：误认为云团越白说明云层越薄，实际越白越厚
  aliases: []
  category: 地理概念
  explanation: 卫星云图上绿色或棕色表示陆地，蓝色表示海洋，白色表示云团，云团越白云层越厚，常为阴雨区。
  misconceptions:
    - 误认为卫星云图中绿色表示云团，实际绿色表示陆地
    - 误认为云团越白说明云层越薄，实际越白越厚
    - 误认为蓝色表示陆地，实际蓝色表示海洋
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:印度洋
  type: Concept
  subject: 地理
  title: 印度洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为印度洋全部位于南半球，实际它跨越南北半球。
    - 能指出并纠正这一错误：误以为印度洋是四大洋中面积最小的，实际最小的是北冰洋。
  aliases: []
  category: 地理区域
  explanation: 印度洋是世界第三大洋，面积约占世界海洋总面积的1/5。
  misconceptions:
    - 认为印度洋全部位于南半球，实际它跨越南北半球。
    - 误以为印度洋是四大洋中面积最小的，实际最小的是北冰洋。
    - 以为印度洋因名称带“印度”就完全属于亚洲，实际它位于亚洲、非洲、大洋洲和南极洲之间。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:双奥之城
  type: Concept
  subject: 地理
  title: 双奥之城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为双奥指的是夏季奥运会和残奥会，实际双奥指夏奥和冬奥。
    - 能指出并纠正这一错误：误以为2022年冬奥会全部在北京举办，忽略河北张家口赛区。
  aliases: []
  category: 人文地理
  explanation: 北京于2008年和2022年分别举办夏季奥运会和冬季奥运会，成为世界上首个双奥之城。
  misconceptions:
    - 误以为双奥指的是夏季奥运会和残奥会，实际双奥指夏奥和冬奥。
    - 误以为2022年冬奥会全部在北京举办，忽略河北张家口赛区。
    - 误以为北京先后举办的是两次夏季奥运会，忽略了2022年冬奥会。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:发展中国家
  type: Concept
  subject: 地理
  title: 发展中国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：单凭人均国民收入高就认为是发达国家，如沙特阿拉伯仍是发展中国家。
    - 能指出并纠正这一错误：认为发展中国家人口一定多，或位于南半球，如印度虽人口多仍是发展中国家。
  aliases:
    - 南方国家
  category: 地理概念
  explanation: 经济与社会发展水平较低的国家，通常工农业和科技相对落后，人均国民收入偏低。
  misconceptions:
    - 单凭人均国民收入高就认为是发达国家，如沙特阿拉伯仍是发展中国家。
    - 认为发展中国家人口一定多，或位于南半球，如印度虽人口多仍是发展中国家。
    - 以为发展中国家在所有方面都落后，忽略其可能在某些产业先进，如中国航天。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S1.md
- id: concept:地理:发达国家
  type: Concept
  subject: 地理
  title: 发达国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为发达国家都位于北半球，忽略澳大利亚、新西兰是南半球发达国家。
    - 能指出并纠正这一错误：把人均收入高当作唯一标准，将科威特、阿联酋等国误判为发达国家。
  aliases:
    - 北方国家
  category: 地理概念
  explanation: 经济与社会发展水平较高的国家，通常工业发达、科技先进、人均国民收入高。
  misconceptions:
    - 认为发达国家都位于北半球，忽略澳大利亚、新西兰是南半球发达国家。
    - 把人均收入高当作唯一标准，将科威特、阿联酋等国误判为发达国家。
    - 以为发达国家只从事工业，农业完全机械化所以不存在农业，实际农业也很发达。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S1.md
- id: concept:地理:可再生资源
  type: Concept
  subject: 地理
  title: 可再生资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为可再生资源取之不尽，如过度放牧草场仍能恢复，实际也会退化荒漠化
    - 能指出并纠正这一错误：把煤、石油等矿产资源归入可再生资源，它们形成周期漫长属非可再生
  aliases: []
  category: 地理概念
  explanation: 可以被持续利用，利用后还能循环再生或不断更新的自然资源，如阳光、空气、水和生物等。
  misconceptions:
    - 认为可再生资源取之不尽，如过度放牧草场仍能恢复，实际也会退化荒漠化
    - 把煤、石油等矿产资源归入可再生资源，它们形成周期漫长属非可再生
    - 认为阳光、空气可再生就不需保护，水污染后可用可再生水也会减少
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:可持续发展
  type: Concept
  subject: 地理
  title: 可持续发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把可持续发展等同于环境保护，忽略经济和社会维度
    - 能指出并纠正这一错误：认为可持续发展就是停止开发资源，不追求经济增长
  aliases: []
  category: 地理概念
  explanation: 既满足当代人的需求，又不损害后代人满足其需求能力的发展模式。
  misconceptions:
    - 把可持续发展等同于环境保护，忽略经济和社会维度
    - 认为可持续发展就是停止开发资源，不追求经济增长
    - 将“当代人需求”理解为当代所有人的所有需求，忽视资源有限性
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S2.md
- id: concept:地理:可燃冰
  type: Concept
  subject: 地理
  title: 可燃冰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为可燃冰分布在陆地浅层，实际主要在深海沉积物和永久冻土中
    - 能指出并纠正这一错误：以为可燃冰可直接开采燃烧，实际开采难度大且易引发海底滑坡等灾害
  aliases:
    - 天然气水合物
  category: 海洋矿产
  explanation: 天然气水合物，分布在深海沉积物或永久冻土中，燃烧污染小，储量巨大但开采难度大。
  misconceptions:
    - 认为可燃冰分布在陆地浅层，实际主要在深海沉积物和永久冻土中
    - 以为可燃冰可直接开采燃烧，实际开采难度大且易引发海底滑坡等灾害
    - 把可燃冰当作固体酒精或冰块，其正式名称是天然气水合物
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:可观测宇宙
  type: Concept
  subject: 地理
  title: 可观测宇宙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为可观测宇宙的半径是137亿光年，忽略空间膨胀实际约465亿光年。
    - 能指出并纠正这一错误：误将可观测宇宙等同于整个宇宙，认为人类已能看到宇宙全貌。
  aliases: []
  category: 天文学概念
  explanation: 目前人类所知道的最大的天体系统，包括银河系和河外星系。
  misconceptions:
    - 误以为可观测宇宙的半径是137亿光年，忽略空间膨胀实际约465亿光年。
    - 误将可观测宇宙等同于整个宇宙，认为人类已能看到宇宙全貌。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:台风
  type: Concept
  subject: 地理
  title: 台风
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为台风中心风力最大，实际台风眼区反而风平浪静
    - 能指出并纠正这一错误：认为台风只会带来灾害，忽视其可缓解旱情的作用
  aliases: []
  category: 气象灾害
  explanation: 台风是指形成于西北太平洋较强的热带气旋，常引发狂风、暴雨和巨浪，威胁沿海地区生命财产安全，但也能缓解旱情。
  misconceptions:
    - 误以为台风中心风力最大，实际台风眼区反而风平浪静
    - 认为台风只会带来灾害，忽视其可缓解旱情的作用
    - 把台风形成于赤道附近，实际形成于西北太平洋热带洋面
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S2.md
- id: concept:地理:四大地理区域
  type: Concept
  subject: 地理
  title: 四大地理区域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为四大地理区域是东北、华北、华南、西南，实际为北方、南方、西北、青藏
    - 能指出并纠正这一错误：误认为青藏地区和南方地区以秦岭—淮河为界，实际以横断山脉为界
  aliases:
    - 四大区域
  category: 地理
  explanation: 根据自然条件、农业生产和居民生活等差异，将我国分为北方、南方、西北和青藏四大地理区域。
  misconceptions:
    - 误认为四大地理区域是东北、华北、华南、西南，实际为北方、南方、西北、青藏
    - 误认为青藏地区和南方地区以秦岭—淮河为界，实际以横断山脉为界
    - 误认为四大地理区域只按地形划分，实际还综合了气候、农业、生活等差异
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:四大洋
  type: Concept
  subject: 地理
  title: 四大洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为大西洋面积大于太平洋，记错四大洋面积排序。
    - 能指出并纠正这一错误：认为印度洋完全位于南半球，忽略其跨越赤道的特点。
  aliases: []
  category: 地理事实
  explanation: 四大洋包括太平洋、大西洋、印度洋和北冰洋。
  misconceptions:
    - 误以为大西洋面积大于太平洋，记错四大洋面积排序。
    - 认为印度洋完全位于南半球，忽略其跨越赤道的特点。
    - 在经纬网图中，误将北冰洋当作纬度最低的大洋，实际其位于高纬度。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:四大渔场
  type: Concept
  subject: 地理
  title: 四大渔场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为舟山渔场位于黄海，实际它在东海浙江近海
    - 能指出并纠正这一错误：把我国四大渔场与世界四大渔场混淆，写出北海道、北海等渔场
  aliases: []
  category: 海洋渔业
  explanation: 我国四大渔场：黄渤海渔场、舟山渔场、南海沿岸渔场和北部湾渔场，其中舟山渔场规模最大。
  misconceptions:
    - 误认为舟山渔场位于黄海，实际它在东海浙江近海
    - 把我国四大渔场与世界四大渔场混淆，写出北海道、北海等渔场
    - 以为黄渤海渔场是我国最大渔场，实际最大的是舟山渔场
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:四大盆地
  type: Concept
  subject: 地理
  title: 四大盆地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为四川盆地面积大于塔里木盆地，实际塔里木盆地最大
    - 能指出并纠正这一错误：误认为柴达木盆地位于第二级阶梯，实际位于第一级阶梯
  aliases: []
  category: 中国地理
  explanation: 我国有四大盆地：塔里木盆地、准噶尔盆地、柴达木盆地和四川盆地。塔里木盆地是我国面积最大的盆地，柴达木盆地海拔最高。
  misconceptions:
    - 误认为四川盆地面积大于塔里木盆地，实际塔里木盆地最大
    - 误认为柴达木盆地位于第二级阶梯，实际位于第一级阶梯
    - 把准噶尔盆地误以为在天山以南，实际准噶尔盆地在天山以北
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:四大高原
  type: Concept
  subject: 地理
  title: 四大高原
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄土高原是冰川广布，云贵高原是千沟万壑，特征互换
    - 能指出并纠正这一错误：误认为内蒙古高原是世界最高的高原，实际青藏高原有世界屋脊之称
  aliases: []
  category: 中国地理
  explanation: 我国有四大高原：青藏高原、云贵高原、黄土高原和内蒙古高原。青藏高原是世界最高的高原，有“世界屋脊”之称。
  misconceptions:
    - 误认为黄土高原是冰川广布，云贵高原是千沟万壑，特征互换
    - 误认为内蒙古高原是世界最高的高原，实际青藏高原有世界屋脊之称
    - 误认为四大高原都位于第二级阶梯，忽略青藏高原在第一级阶梯
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:四季更替
  type: Concept
  subject: 地理
  title: 四季更替
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为四季更替是由日地距离远近变化造成的，实际上近日点在1月但北半球是冬季。
    - 能指出并纠正这一错误：认为地球上所有地方都有明显的四季，实际赤道地区和极地四季变化不明显。
  aliases:
    - 四季
  category: 地理现象
  explanation: 由于太阳直射点的南北移动，地球表面各地在一年中接受阳光照射情况变化，形成春夏秋冬四季。
  misconceptions:
    - 误以为四季更替是由日地距离远近变化造成的，实际上近日点在1月但北半球是冬季。
    - 认为地球上所有地方都有明显的四季，实际赤道地区和极地四季变化不明显。
    - 以为南半球与北半球季节相同，实际月份相同但季节相反。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:四川省的交通
  type: Concept
  subject: 地理
  title: 四川省的交通
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为四川深处内陆，没有水运条件，实际长江及其支流可通航。
    - 能指出并纠正这一错误：误以为四川多山，只能靠公路运输，忽略铁路、航空和水运形成的立体交通。
  aliases: []
  category: 经济地理
  explanation: 四川省已形成铁路、公路、水运、航空相结合的现代化立体交通运输体系。
  misconceptions:
    - 误以为四川深处内陆，没有水运条件，实际长江及其支流可通航。
    - 误以为四川多山，只能靠公路运输，忽略铁路、航空和水运形成的立体交通。
    - 把成都双流国际机场和重庆江北国际机场混为一谈。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四川省的地形
  type: Concept
  subject: 地理
  title: 四川省的地形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为四川全部位于第二级阶梯，忽略川西高原山地属第一级阶梯
    - 能指出并纠正这一错误：把川西高原山地误称为青藏高原，混淆地形区划分
  aliases: []
  category: 自然地理
  explanation: 四川省地跨我国地势第一、二级阶梯，地势西高东低，分为川西高原山地和四川盆地两大部分。
  misconceptions:
    - 误认为四川全部位于第二级阶梯，忽略川西高原山地属第一级阶梯
    - 把川西高原山地误称为青藏高原，混淆地形区划分
    - 画地势剖面图时将四川盆地画得比川西高原高，违背西高东低
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四川省的地理位置
  type: Concept
  subject: 地理
  title: 四川省的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把四川归入长江中下游地区，忽略其地处上游
    - 能指出并纠正这一错误：认为四川属于西北内陆省份，实际是西南腹地
  aliases: []
  category: 自然地理
  explanation: 四川省地处我国西南腹地，位于长江上游地区。
  misconceptions:
    - 误把四川归入长江中下游地区，忽略其地处上游
    - 认为四川属于西北内陆省份，实际是西南腹地
    - 在地图上把四川位置填到黄河中游或东北地区
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四川省的气候
  type: Concept
  subject: 地理
  title: 四川省的气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全川都是亚热带季风气候，忽视川西高原的高原高山气候
    - 能指出并纠正这一错误：将川西高原气候错标为温带大陆性气候，成因写成海拔高但类型错误
  aliases: []
  category: 自然地理
  explanation: 四川省气候分为川西高原山地的高原高山气候和四川盆地的亚热带季风气候。
  misconceptions:
    - 认为全川都是亚热带季风气候，忽视川西高原的高原高山气候
    - 将川西高原气候错标为温带大陆性气候，成因写成海拔高但类型错误
    - 混淆亚热带季风与温带季风气候，误以为四川冬季寒冷干燥
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四川省的生态保护
  type: Concept
  subject: 地理
  title: 四川省的生态保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为退耕还林还草必致粮食产量下降，忽视坡地退耕不影响基本农田
    - 能指出并纠正这一错误：误以为天然林保护就是禁止一切采伐，包括人工林经营
  aliases: []
  category: 自然地理
  explanation: 四川省实施天然林保护、退耕还林还草，森林覆盖率提高，生态屏障作用增强。
  misconceptions:
    - 认为退耕还林还草必致粮食产量下降，忽视坡地退耕不影响基本农田
    - 误以为天然林保护就是禁止一切采伐，包括人工林经营
    - 将森林覆盖率提高等同于生态屏障完全形成，忽视局部水土流失
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四川省的经济
  type: Concept
  subject: 地理
  title: 四川省的经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为四川地处西部经济一定落后，忽视其是西部经济强省
    - 能指出并纠正这一错误：把电子信息产业归为传统轻工业，看不到高科技属性
  aliases: []
  category: 经济地理
  explanation: 四川省是我国西部经济强省，重点发展电子信息、航空航天等产业，地区生产总值逐年提高。
  misconceptions:
    - 认为四川地处西部经济一定落后，忽视其是西部经济强省
    - 把电子信息产业归为传统轻工业，看不到高科技属性
    - 误认为GDP主要靠矿产资源开采，忽视现代制造业与服务业
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四川省的经济发展差异
  type: Concept
  subject: 地理
  title: 四川省的经济发展差异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为盆地与高原差距主要由人口多少造成，忽视自然条件制约
    - 能指出并纠正这一错误：主张在川西高原大规模发展种植业来缩小差距，违背生态条件
  aliases: []
  category: 经济地理
  explanation: 四川省内经济发展不平衡，川西高原山地与四川盆地存在较大差距。
  misconceptions:
    - 以为盆地与高原差距主要由人口多少造成，忽视自然条件制约
    - 主张在川西高原大规模发展种植业来缩小差距，违背生态条件
    - 将地形差异等同为经济差异直接决定因素，忽略交通政策等
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四川省的自然灾害
  type: Concept
  subject: 地理
  title: 四川省的自然灾害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为四川气候湿润就不会发生干旱，忽视川西高原旱灾
    - 能指出并纠正这一错误：误以为泥石流只发生在山区，平原不会发生（忽略山前地带）
  aliases: []
  category: 自然地理
  explanation: 四川省主要自然灾害有干旱、洪涝、地震、滑坡和泥石流等，与区域自然环境密切相关。
  misconceptions:
    - 认为四川气候湿润就不会发生干旱，忽视川西高原旱灾
    - 误以为泥石流只发生在山区，平原不会发生（忽略山前地带）
    - 把地震滑坡与降雨滑坡成因完全等同，忽视触发机制差异
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S2.md
- id: concept:地理:四纵四横高速铁路网
  type: Concept
  subject: 地理
  title: 四纵四横高速铁路网
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为四纵四横高铁网覆盖所有县城，实际主要覆盖大中城市，百万人口城市覆盖率超95%并非全部
    - 能指出并纠正这一错误：只知纵贯南北，忽略横跨东西方向，误把四横当成南北走向
  aliases: []
  category: 交通网络
  explanation: 我国已建成的高速铁路网骨架，横跨东西、纵贯南北，覆盖百万人口城市超95%。
  misconceptions:
    - 认为四纵四横高铁网覆盖所有县城，实际主要覆盖大中城市，百万人口城市覆盖率超95%并非全部
    - 只知纵贯南北，忽略横跨东西方向，误把四横当成南北走向
    - 把高速铁路网与高速公路网混淆，高铁网以客运为主且不是公路
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:因地制宜发展农业
  type: Concept
  subject: 地理
  title: 因地制宜发展农业
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：认为气候湿润就适合种水稻，忽略地形排灌条件，如丘陵易缺水不宜种稻
    - 能指出并纠正这一错误：把因地制宜理解为只看市场需求，在干旱区改种高耗水作物，违背自然条件
  aliases: []
  category: 地理原则
  explanation: 根据各地的自然环境条件（如地形、水源、土壤等）合理布局农业生产，充分发挥自然条件的优势。
  misconceptions:
    - 认为气候湿润就适合种水稻，忽略地形排灌条件，如丘陵易缺水不宜种稻
    - 把因地制宜理解为只看市场需求，在干旱区改种高耗水作物，违背自然条件
    - 认为只有多种经营才叫因地制宜，忽略单一种植适应当地条件也是因地制宜
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S2.md
- id: concept:地理:固体废弃物污染
  type: Concept
  subject: 地理
  title: 固体废弃物污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为固体废弃物只污染土壤，忽略渗滤液会污染地下水，焚烧产生有害气体
    - 能指出并纠正这一错误：以为所有矿产资源都要限制开发，实际限制的是无法合理利用的矿产和尾矿
  aliases: []
  category: 环境问题
  explanation: 工业发展中产生的固体废弃物对环境的污染，需严格限制开发无法合理利用的矿产资源和尾矿资源。
  misconceptions:
    - 认为固体废弃物只污染土壤，忽略渗滤液会污染地下水，焚烧产生有害气体
    - 以为所有矿产资源都要限制开发，实际限制的是无法合理利用的矿产和尾矿
    - 把固体废弃物污染等同于生活垃圾，忽视工业废渣和尾矿的严重危害
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:国家矿山公园
  type: Concept
  subject: 地理
  title: 国家矿山公园
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家矿山公园仍在开采矿产，实际是利用矿山遗迹建成的公园，重在保护与科普
    - 能指出并纠正这一错误：将国家矿山公园与普通公园等同，忽略其科学考察和研究的独特价值
  aliases: []
  category: 生态旅游
  explanation: 以矿山遗迹为主体，集旅游、科学考察和研究于一体的公园，体现人与自然和谐共处。
  misconceptions:
    - 认为国家矿山公园仍在开采矿产，实际是利用矿山遗迹建成的公园，重在保护与科普
    - 将国家矿山公园与普通公园等同，忽略其科学考察和研究的独特价值
    - 以为它只是旅游景点，未体现人与自然和谐共处，如展示生态修复成果
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:国际交通运输方式
  type: Concept
  subject: 地理
  title: 国际交通运输方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为所有运输方式都能运输任意货物，如用航空运输大宗矿石
    - 能指出并纠正这一错误：混淆不同运输方式的优缺点，认为管道运输也可灵活调度
  aliases:
    - 国际运输方式
  category: 地理概念
  explanation: 国际交通运输方式主要包括国际航空运输、国际海洋运输、国际铁路运输、国际公路运输和国际管道运输等，每种方式各有特点。
  misconceptions:
    - 误以为所有运输方式都能运输任意货物，如用航空运输大宗矿石
    - 混淆不同运输方式的优缺点，认为管道运输也可灵活调度
    - 判断运输方式时忽略距离与时效，例如短途却选择海运
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S2.md
- id: concept:地理:国际公路运输
  type: Concept
  subject: 地理
  title: 国际公路运输
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公路运输运量大、成本低，适合远距离跨国干线运输
    - 能指出并纠正这一错误：忽视公路运输在联合运输中的衔接作用，只视为独立运输方式
  aliases:
    - 公路运输
  category: 交通运输方式
  explanation: 国际公路运输机动灵活、装卸方便，是邻国间边境货物运输的主要方式，也可实现多种运输方式的联合运输。
  misconceptions:
    - 认为公路运输运量大、成本低，适合远距离跨国干线运输
    - 忽视公路运输在联合运输中的衔接作用，只视为独立运输方式
    - 将公路运输与铁路运输的机动灵活性混为一谈
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:国际合作
  type: Concept
  subject: 地理
  title: 国际合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国际合作只发生在国家之间，排斥国际组织、企业、非政府组织参与。
    - 能指出并纠正这一错误：把国际合作等同于一国对另一国的单向援助，忽略双向协作。
  aliases:
    - 国际协作
  category: 地理概念
  explanation: 国际合作是指国家之间在经济、政治、文化、环境等领域进行的相互协作与交流，以应对全球性问题、促进共同发展。
  misconceptions:
    - 认为国际合作只发生在国家之间，排斥国际组织、企业、非政府组织参与。
    - 把国际合作等同于一国对另一国的单向援助，忽略双向协作。
    - 认为参与国际合作就必须放弃本国利益，误解合作共赢原则。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:国际海洋运输
  type: Concept
  subject: 地理
  title: 国际海洋运输
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为海运速度最快，因而适合易腐食品的紧急运输
    - 能指出并纠正这一错误：认为海运受自然条件影响小，可全年无休不间断航行
  aliases:
    - 海洋运输
    - 海运
  category: 交通运输方式
  explanation: 国际海洋运输运量大、运费低，是国际货物最主要的运输方式，承担了全球贸易的大部分货运量。
  misconceptions:
    - 误以为海运速度最快，因而适合易腐食品的紧急运输
    - 认为海运受自然条件影响小，可全年无休不间断航行
    - 混淆海洋运输与内河运输，认为内河船可随意进行远洋运输
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S2.md
- id: concept:地理:国际管道运输
  type: Concept
  subject: 地理
  title: 国际管道运输
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为管道运输可运输煤炭等固体货物，实则只能输送液态或气态能源
    - 能指出并纠正这一错误：以为管道运输建设成本低且线路灵活，实际投资大且固定
  aliases:
    - 管道运输
  category: 交通运输方式
  explanation: 国际管道运输用于输送天然气、石油等液态或气态能源，具有运量大、连续性强、安全可靠等特点。
  misconceptions:
    - 误认为管道运输可运输煤炭等固体货物，实则只能输送液态或气态能源
    - 以为管道运输建设成本低且线路灵活，实际投资大且固定
    - 忽略管道运输的连续性，误以为停运对供应链影响不大
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:国际经济合作
  type: Concept
  subject: 地理
  title: 国际经济合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国际经济合作只包括商品进出口贸易，忽略技术合作和劳务输出。
    - 能指出并纠正这一错误：将劳务合作简单理解为向海外移民，忽略工程承包中的劳务派遣。
  aliases:
    - 经济合作
  category: 地理概念
  explanation: 国际经济合作是各国通过优势互补、技术交流、投资等方式促进经济发展的合作形式，包括工程承包、劳务合作、技术合作、发展援助和国际投资等。
  misconceptions:
    - 认为国际经济合作只包括商品进出口贸易，忽略技术合作和劳务输出。
    - 将劳务合作简单理解为向海外移民，忽略工程承包中的劳务派遣。
    - 画图或填表时，把国际投资只当作引进外资，忽略对外直接投资。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:国际航空运输
  type: Concept
  subject: 地理
  title: 国际航空运输
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为航空运费低廉，适合大批量低值货物运输
    - 能指出并纠正这一错误：认为航空运输运量最大，可承担全球贸易主要货运量
  aliases:
    - 航空运输
  category: 交通运输方式
  explanation: 国际航空运输速度快、安全性高，主要用于人员流动和贵重、易腐、精密、应急物品的运输。
  misconceptions:
    - 误以为航空运费低廉，适合大批量低值货物运输
    - 认为航空运输运量最大，可承担全球贸易主要货运量
    - 混淆速度与时效，以为航空运输受天气限制比海运更严重
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:国际铁路运输
  type: Concept
  subject: 地理
  title: 国际铁路运输
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为铁路运输运量超过海运，是国际货物最主要的运输方式
    - 能指出并纠正这一错误：以为铁路运输速度最快，可用于紧急的跨洋运输
  aliases:
    - 铁路运输
  category: 交通运输方式
  explanation: 国际铁路运输速度较快、运量较大、成本相对较低，是仅次于海洋运输的主要运输方式。
  misconceptions:
    - 误认为铁路运输运量超过海运，是国际货物最主要的运输方式
    - 以为铁路运输速度最快，可用于紧急的跨洋运输
    - 忽视铁路运输受轨道网络限制，认为可任意覆盖全球各地
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:图例
  type: Concept
  subject: 地理
  title: 图例
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把图例和注记混淆，认为图例包括地图上的文字和数字
    - 能指出并纠正这一错误：误认为图例就是比例尺，或把比例尺当成图例的一部分
  aliases: []
  category: 地理概念
  explanation: 地图上表示各种地理事物的符号和颜色等。
  misconceptions:
    - 把图例和注记混淆，认为图例包括地图上的文字和数字
    - 误认为图例就是比例尺，或把比例尺当成图例的一部分
    - 读图时不看图例就直接猜测符号含义，导致判读错误
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:土地资源
  type: Concept
  subject: 地理
  title: 土地资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一切土地都是土地资源，如冰川、荒漠在可预见未来难利用，不符合定义
    - 能指出并纠正这一错误：认为土地资源只包括耕地和林地，忽略草地、建设用地等也是土地资源
  aliases: []
  category: 地理概念
  explanation: 已经被人类所利用以及在可预见的未来能被人类利用的土地，是人类赖以生存和发展的最基本的资源。
  misconceptions:
    - 认为一切土地都是土地资源，如冰川、荒漠在可预见未来难利用，不符合定义
    - 认为土地资源只包括耕地和林地，忽略草地、建设用地等也是土地资源
    - 认为土地资源取之不尽，实际后备耕地有限，需节约用地
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S2.md
- id: concept:地理:土地资源利用类型
  type: Concept
  subject: 地理
  title: 土地资源利用类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为建设用地不属于土地资源利用类型，实际它是重要类型之一
    - 能指出并纠正这一错误：将草地与耕地混淆，不理解种草养畜的草地和种农作物耕地的用途不同
  aliases:
    - 土地利用类型
  category: 地理概念
  explanation: 指土地的不同利用方式，如耕地、林地、草地、建设用地等，我国土地资源利用类型多样。
  misconceptions:
    - 误认为建设用地不属于土地资源利用类型，实际它是重要类型之一
    - 将草地与耕地混淆，不理解种草养畜的草地和种农作物耕地的用途不同
    - 以为土地利用类型固定不变，实际可随人类活动变化，如开垦林地变耕地
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S2.md
- id: concept:地理:土耳其海峡
  type: Concept
  subject: 地理
  title: 土耳其海峡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把土耳其海峡当作沟通大西洋和印度洋的通道，实际它连接黑海和地中海。
    - 能指出并纠正这一错误：误以为土耳其海峡是亚洲与非洲的分界线，实际它是欧亚分界线。
  aliases: []
  category: 地理事物
  explanation: 土耳其海峡是亚洲和欧洲之间的一道天然分界线。
  misconceptions:
    - 把土耳其海峡当作沟通大西洋和印度洋的通道，实际它连接黑海和地中海。
    - 误以为土耳其海峡是亚洲与非洲的分界线，实际它是欧亚分界线。
    - 以为土耳其海峡只指博斯普鲁斯海峡，忽略马尔马拉海和达达尼尔海峡也是其一部分。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:圣彼得堡
  type: Concept
  subject: 地理
  title: 圣彼得堡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为圣彼得堡是俄罗斯首都，实际首都是莫斯科
    - 能指出并纠正这一错误：误以为圣彼得堡位于太平洋沿岸，实际在波罗的海沿岸
  aliases: []
  category: 地理
  explanation: 俄罗斯第二大城市，重要海港，工业以造船、动力机械和精密仪器制造为主，是通往欧洲的门户。
  misconceptions:
    - 误以为圣彼得堡是俄罗斯首都，实际首都是莫斯科
    - 误以为圣彼得堡位于太平洋沿岸，实际在波罗的海沿岸
    - 误以为圣彼得堡是俄罗斯最大城市，实际最大是莫斯科
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:地上河
  type: Concept
  subject: 地理
  title: 地上河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为地上河是人工筑堤形成的，实质是泥沙淤积抬高河床
    - 能指出并纠正这一错误：认为地上河的河床高于地面，不易决堤，防洪压力小
  aliases:
    - 悬河
  category: 地理现象
  explanation: 黄河下游因泥沙沉积，河床抬高，形成高出两岸平地的河流。
  misconceptions:
    - 误认为地上河是人工筑堤形成的，实质是泥沙淤积抬高河床
    - 认为地上河的河床高于地面，不易决堤，防洪压力小
    - 把地上河说成只出现在黄河中游，忽略下游更为典型
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:地中海气候
  type: Concept
  subject: 地理
  title: 地中海气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为地中海气候夏季多雨，实际是冬季多雨。
    - 能指出并纠正这一错误：误认为分布在大陆东岸，实际主要分布在大陆西岸。
  aliases: []
  category: 气候类型
  explanation: 地中海气候是亚热带地区的一种气候类型，冬季多雨，夏季干燥。
  misconceptions:
    - 误以为地中海气候夏季多雨，实际是冬季多雨。
    - 误认为分布在大陆东岸，实际主要分布在大陆西岸。
    - 以为全年温和多雨，忽略夏季干燥炎热。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:地势
  type: Concept
  subject: 地理
  title: 地势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘地势’理解为地形，用平原、山地等地形类型回答地势特征
    - 能指出并纠正这一错误：认为我国地势东高西低，呈三级阶梯状分布
  aliases: []
  category: 地理概念
  explanation: 地表高低起伏的总趋势称为地势。我国地势西高东低，呈三级阶梯状分布。
  misconceptions:
    - 误将‘地势’理解为地形，用平原、山地等地形类型回答地势特征
    - 认为我国地势东高西低，呈三级阶梯状分布
    - 认为地势就是海拔高度，忽视其反映地表起伏总趋势
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:地名
  type: Concept
  subject: 地理
  title: 地名
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到‘洛阳’就认为在洛水之南，忽略‘山南水北为阳’的规律。
    - 能指出并纠正这一错误：认为所有地名都反映自然环境，忽略一些地名源于历史人物或事件。
  aliases: []
  category: 地理
  explanation: 地名是地理实体的名称，可反映当地的自然环境、经济和文化历史状况。
  misconceptions:
    - 看到‘洛阳’就认为在洛水之南，忽略‘山南水北为阳’的规律。
    - 认为所有地名都反映自然环境，忽略一些地名源于历史人物或事件。
    - 在判读地图时，把地名中的‘海’一律当成海洋，如‘中南海’误认为是海域。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:地图
  type: Concept
  subject: 地理
  title: 地图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为地图只能画在纸上，地球仪不属于地图
    - 能指出并纠正这一错误：认为所有地图都按上北下南定向，忽略有经纬网的需依经纬线定向
  aliases: []
  category: 地理工具
  explanation: 按一定比例，运用符号、颜色、文字等描述地球表面状况的图。
  misconceptions:
    - 误认为地图只能画在纸上，地球仪不属于地图
    - 认为所有地图都按上北下南定向，忽略有经纬网的需依经纬线定向
    - 把照片当成地图，认为比例尺和符号可有可无
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:地图三要素
  type: Concept
  subject: 地理
  title: 地图三要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为地图三要素是比例尺、方向、经纬网，漏掉图例
    - 能指出并纠正这一错误：把图例和注记当成两个要素，误以为地图有四要素
  aliases:
    - 地图基本要素
  category: 地理概念
  explanation: 方向、比例尺和图例是地图的基本要素。
  misconceptions:
    - 误认为地图三要素是比例尺、方向、经纬网，漏掉图例
    - 把图例和注记当成两个要素，误以为地图有四要素
    - 认为缺少比例尺的地图也能正确读出实际距离，不影响使用
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:地图上的方向
  type: Concept
  subject: 地理
  title: 地图上的方向
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：在指向标地图上仍用上北下南，把箭头指向误当东方
    - 能指出并纠正这一错误：在经纬网地图上沿经线走，误把经线方向当东西方向
  aliases: []
  category: 地理概念
  explanation: 一般地图上北下南左西右东，有指向标的地图用指向标定向，有经纬网的地图用经纬网定向。
  misconceptions:
    - 在指向标地图上仍用上北下南，把箭头指向误当东方
    - 在经纬网地图上沿经线走，误把经线方向当东西方向
    - 极地俯视图上认为最外圈是北方，实际最外圈是低纬度，中心为极点
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:地壳运动
  type: Concept
  subject: 地理
  title: 地壳运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把地壳运动说成是板块运动的结果，混淆因果关系
    - 能指出并纠正这一错误：误认为地壳运动只引起水平移动，忽略垂直升降
  aliases: []
  category: 地理概念
  explanation: 造成海陆变迁的首要原因，指地壳的变动导致海陆轮廓和分布发生变化。
  misconceptions:
    - 把地壳运动说成是板块运动的结果，混淆因果关系
    - 误认为地壳运动只引起水平移动，忽略垂直升降
    - 用地震、火山现象直接等同于地壳运动本身
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:地形对气温的影响
  type: Concept
  subject: 地理
  title: 地形对气温的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算山地气温时，直接用海拔乘0.6，忘了除以100，如20℃山脚爬升2000米算成-1180℃。
    - 能指出并纠正这一错误：误认为山顶离太阳近因此气温更高，不理解高度越高气温越低。
  aliases:
    - 海拔对气温的影响
  category: 影响因素
  explanation: 山地气温随海拔升高而降低，平均每升高100米，气温降低约0.6℃。
  misconceptions:
    - 计算山地气温时，直接用海拔乘0.6，忘了除以100，如20℃山脚爬升2000米算成-1180℃。
    - 误认为山顶离太阳近因此气温更高，不理解高度越高气温越低。
    - 将‘每升高100米降0.6℃’错记成‘每升高1千米降0.6℃’，算出的温差差10倍。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:地形对降水的影响
  type: Concept
  subject: 地理
  title: 地形对降水的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：判断迎风坡时不看风向，以为山地南坡一定是迎风坡，如我国华北夏季东南季风，误把西坡当迎风坡。
    - 能指出并纠正这一错误：将迎风坡降水多归因于海拔高，忽略气流抬升冷却，导致无法解释背风坡少雨。
  aliases:
    - 迎风坡与背风坡降水差异
  category: 影响因素
  explanation: 迎风坡降水多，背风坡降水少。
  misconceptions:
    - 判断迎风坡时不看风向，以为山地南坡一定是迎风坡，如我国华北夏季东南季风，误把西坡当迎风坡。
    - 将迎风坡降水多归因于海拔高，忽略气流抬升冷却，导致无法解释背风坡少雨。
    - 在盛行西风带中，误认为东坡是迎风坡，实际西坡才是。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:地形特点
