  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：从北极上空俯视，误认为自转方向是顺时针，实际为逆时针
    - 能指出并纠正这一错误：误以为地球自东向西转，导致时间差异方向判断错误
  aliases: []
  category: 地理规律
  explanation: 地球自转的方向是自西向东。
  misconceptions:
    - 从北极上空俯视，误认为自转方向是顺时针，实际为逆时针
    - 误以为地球自东向西转，导致时间差异方向判断错误
    - 判断方向时直接说向东转，未明确是从哪个地点或视角观察
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S1.md
