  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为地球仪上的地轴是真实存在的，实际是人们假想的
    - 能指出并纠正这一错误：把地球仪当成标准正球体，忽略两极稍扁的不规则形状
  aliases: []
  category: 地理工具
  explanation: 按一定比例缩小的地球模型，用于表示地球上的地理事物。
