- id: concept:地理:地球的公转
  type: Concept
  subject: 地理
  title: 地球的公转
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为昼夜长短变化和昼夜交替都由公转引起，把自转和公转的作用混淆。
    - 能指出并纠正这一错误：认为地球公转轨道是正圆形，实际是近似椭圆的轨道。
  aliases:
    - 公转
    - 地球公转
  category: 地理概念
  explanation: 地球按一定轨道围绕太阳运动，叫作地球的公转。
  misconceptions:
    - 认为昼夜长短变化和昼夜交替都由公转引起，把自转和公转的作用混淆。
    - 认为地球公转轨道是正圆形，实际是近似椭圆的轨道。
    - 误认为地球公转速度恒定不变，实际近日点快、远日点慢。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:地球的形状和大小
  type: Concept
  subject: 地理
  title: 地球的形状和大小
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为地球是正球体，忽略两极稍扁、赤道略鼓的特征
    - 能指出并纠正这一错误：把地球形状说成‘赤道稍扁、两极略鼓’，恰好说反
  aliases:
