  type: Concept
  subject: 地理
  title: 坐在矿车上的国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“坐在矿车上的国家”指俄罗斯，因为矿产丰富
    - 能指出并纠正这一错误：误以为该称号指澳大利亚畜牧业发达，混淆矿车与羊背
  aliases: []
  category: 地理
  explanation: 澳大利亚矿产资源丰富，品种多、储量大、质量好，矿产品大量出口，因此得名。
  misconceptions:
    - 误以为“坐在矿车上的国家”指俄罗斯，因为矿产丰富
    - 误以为该称号指澳大利亚畜牧业发达，混淆矿车与羊背
    - 误以为澳大利亚矿产品主要销往欧洲，实际主要销往亚洲
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:埃及人口分布
  type: Concept
  subject: 地理
  title: 埃及人口分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为埃及人口集中在红海或地中海沿岸，实际在尼罗河谷
    - 能指出并纠正这一错误：误以为尼罗河三角洲是最大人口区，却忽略尼罗河谷也密集
  aliases: []
  category: 地理
  explanation: 埃及约96%的人口集中于尼罗河谷和尼罗河三角洲，经济重心也集中于此。
  misconceptions:
    - 误以为埃及人口集中在红海或地中海沿岸，实际在尼罗河谷
    - 误以为尼罗河三角洲是最大人口区，却忽略尼罗河谷也密集
    - 误以为埃及大部分地区有绿洲可居住，忽视沙漠占比
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:埃及农业
  type: Concept
  subject: 地理
  title: 埃及农业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为埃及农业主要分布在沙漠绿洲，忽视尼罗河河谷和三角洲的作用
    - 能指出并纠正这一错误：将棉花当作粮食作物，认为埃及主要种植玉米而非长绒棉
  aliases: []
  category: 地理
  explanation: 埃及耕地面积小，主要农作物有棉花、小麦、水稻、甘蔗等，以盛产优质长绒棉著称，农业集中在尼罗河谷地和三角洲。
  misconceptions:
    - 误认为埃及农业主要分布在沙漠绿洲，忽视尼罗河河谷和三角洲的作用
    - 将棉花当作粮食作物，认为埃及主要种植玉米而非长绒棉
    - 以为埃及农业依赖地下水灌溉，不是尼罗河泛滥区
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:埃及农业分布
  type: Concept
  subject: 地理
  title: 埃及农业分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为埃及农业区集中于地中海沿岸和红海沿岸
    - 能指出并纠正这一错误：把尼罗河三角洲与河谷混为一谈，认为两者气候完全不同
  aliases: []
  category: 地理
  explanation: 埃及农业主要分布在尼罗河谷地和三角洲，因尼罗河灌溉和肥沃土壤，主要农作物有棉花、小麦、水稻等，以长绒棉著称。
  misconceptions:
    - 误以为埃及农业区集中于地中海沿岸和红海沿岸
    - 把尼罗河三角洲与河谷混为一谈，认为两者气候完全不同
    - 认为农业分布均匀，忽略集中分布特征
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:埃及地理位置
  type: Concept
  subject: 地理
  title: 埃及地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为埃及全境位于非洲，忽略西奈半岛属于亚洲
    - 能指出并纠正这一错误：将埃及四邻方位记错，如以为西临红海、东临利比亚
  aliases: []
  category: 地理
  explanation: 埃及位于非洲东北部，西奈半岛位于亚洲，西临利比亚，南接苏丹，东临红海，北濒地中海，是亚非陆路交通要冲和大西洋与印度洋海上航线捷径。
  misconceptions:
    - 误认为埃及全境位于非洲，忽略西奈半岛属于亚洲
    - 将埃及四邻方位记错，如以为西临红海、东临利比亚
    - 认为埃及濒临大西洋而不是地中海和红海
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:埃及新行政首都
  type: Concept
  subject: 地理
  title: 埃及新行政首都
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为新行政首都建于尼罗河西岸，实际在开罗以东沙漠
    - 能指出并纠正这一错误：认为新行政首都的目的是扩大耕地面积，而非缓解人口与交通压力
  aliases: []
  category: 地理
  explanation: 埃及在开罗以东沙漠地带规划新行政首都，以减轻人口压力、扩大交通网络、吸引投资。
  misconceptions:
    - 误以为新行政首都建于尼罗河西岸，实际在开罗以东沙漠
    - 认为新行政首都的目的是扩大耕地面积，而非缓解人口与交通压力
    - 把新行政首都与开罗老城混为一谈，以为迁都后开罗消失
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C4/sections/S1.md
- id: concept:地理:埃及气候
  type: Concept
  subject: 地理
  title: 埃及气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为埃及全境都是热带沙漠气候，忽略北部沿海的地中海气候
    - 能指出并纠正这一错误：把地中海气候区划到南部，实际上南部是热带沙漠气候
  aliases: []
  category: 地理
  explanation: 尼罗河沿岸及三角洲和北部沿海地区属地中海气候，南部大部分地区属热带沙漠气候。
  misconceptions:
    - 误认为埃及全境都是热带沙漠气候，忽略北部沿海的地中海气候
    - 把地中海气候区划到南部，实际上南部是热带沙漠气候
    - 以为尼罗河沿岸气候是热带沙漠气候，但实际沿岸受灌溉影响为绿洲农业
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S6.md
- id: concept:地理:埃及经济
  type: Concept
  subject: 地理
  title: 埃及经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为埃及经济以农业为主，忽视石油、旅游、苏伊士运河等外汇来源
    - 能指出并纠正这一错误：认为埃及工业以钢铁和机械制造为主，实际以纺织和食品加工为主
  aliases: []
  category: 地理
  explanation: 埃及经济以工业、旅游业、石油工业、苏伊士运河和侨汇为主要外汇来源，工业以纺织和食品加工为主，石油和天然气发展较快。
  misconceptions:
    - 误认为埃及经济以农业为主，忽视石油、旅游、苏伊士运河等外汇来源
    - 认为埃及工业以钢铁和机械制造为主，实际以纺织和食品加工为主
    - 忽略苏伊士运河收入，将侨汇排除在主要外汇之外
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C4/sections/S2.md
- id: concept:地理:城乡景观变化
  type: Concept
  subject: 地理
  title: 城乡景观变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为城乡景观变化只发生在城镇，乡村景观一成不变。
    - 能指出并纠正这一错误：把所有景观变化都归因于人为因素，忽略自然力量。
  aliases:
    - 景观演变
  category: 地理现象
  explanation: 随着社会经济、人口和政策的变化，城镇和乡村的景观会发生改变，如农田规模化、房屋集中、道路硬化等。
  misconceptions:
    - 认为城乡景观变化只发生在城镇，乡村景观一成不变。
    - 把所有景观变化都归因于人为因素，忽略自然力量。
    - 将农田规模化误解为所有农田都变成大棚或楼房。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:城镇
  type: Concept
  subject: 地理
  title: 城镇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将城镇等同于城市，忽略建制镇也属于城镇
    - 能指出并纠正这一错误：认为城镇所有居民都不从事农业，无视城郊存在的菜地等农业活动
  aliases:
    - 城市
  category: 聚落类型
  explanation: 城镇规模较大，人口密集，主要从事工业、服务业等非农业生产活动，通常是周围地区的政治、经济、文化中心。
  misconceptions:
    - 将城镇等同于城市，忽略建制镇也属于城镇
    - 认为城镇所有居民都不从事农业，无视城郊存在的菜地等农业活动
    - 以为每个城镇都是周围地区的政治经济文化中心，忽略定义中的‘通常’二字
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:城镇与乡村的景观差异
  type: Concept
  subject: 地理
  title: 城镇与乡村的景观差异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看建筑高度判断城乡，忽略道路、公共服务设施及人口分布差异
    - 能指出并纠正这一错误：认为乡村完全没有公共服务设施，实际乡村也有诊所、学校等基础服务
  aliases: []
  category: 地理特征
  explanation: 城镇和乡村在建筑密度、道路、公共服务设施、人口分布等方面存在显著差异。
  misconceptions:
    - 只看建筑高度判断城乡，忽略道路、公共服务设施及人口分布差异
    - 认为乡村完全没有公共服务设施，实际乡村也有诊所、学校等基础服务
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:城镇景观特征
  type: Concept
  subject: 地理
  title: 城镇景观特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为城镇景观只有密集高楼，忽略道路和基础设施。
    - 能指出并纠正这一错误：认为城镇人口密度一定高于乡村，忽略特例。
  aliases:
    - 城市景观
  category: 地理概念
  explanation: 城镇景观以建筑物密集、道路宽阔、基础设施完善为特征，人口和建筑密度高。
  misconceptions:
    - 误以为城镇景观只有密集高楼，忽略道路和基础设施。
    - 认为城镇人口密度一定高于乡村，忽略特例。
    - 把城镇景观和乡村景观简单对立，忽略中间过渡类型。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:城镇景观的地域文化影响
  type: Concept
  subject: 地理
  title: 城镇景观的地域文化影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把教堂或城堡为中心的布局说成中国古代城镇特点，实为欧洲典型
    - 能指出并纠正这一错误：认为中国古代所有城镇都严格对称，忽略地形等导致的例外
  aliases: []
  category: 人文地理
  explanation: 城镇景观的空间布局深受地域文化影响，如中国古代城镇讲究对称，欧洲以教堂或城堡为中心，美国布局多样。
  misconceptions:
    - 把教堂或城堡为中心的布局说成中国古代城镇特点，实为欧洲典型
    - 认为中国古代所有城镇都严格对称，忽略地形等导致的例外
    - 认为美国城镇布局多样就没有文化影响，其实多样本身就是文化反映
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:基督教
  type: Concept
  subject: 地理
  title: 基督教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为基督教起源于欧洲而非亚洲西部
    - 能指出并纠正这一错误：误认为基督教信仰人数少于伊斯兰教
  aliases: []
  category: 地理文化
  explanation: 基督教起源于公元1世纪的亚洲西部，是世界上信仰人数最多的宗教，主要分布在欧洲、美洲、非洲和大洋洲。
  misconceptions:
    - 以为基督教起源于欧洲而非亚洲西部
    - 误认为基督教信仰人数少于伊斯兰教
    - 忽略基督教在非洲和大洋洲的大量分布
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:外流河与内流河
  type: Concept
  subject: 地理
  title: 外流河与内流河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为外流河是流往外国的河，所以把澜沧江归为内流河
    - 能指出并纠正这一错误：认为内流河就是水量小、流程短的河，没有按能否入海划分
  aliases:
    - 外流区
    - 内流区
    - 内流河与外流河
  category: 地理概念
  explanation: 直接或间接流入海洋的河流为外流河，不能流入海洋而流入内陆湖泊或消失的为内流河。
  misconceptions:
    - 误以为外流河是流往外国的河，所以把澜沧江归为内流河
    - 认为内流河就是水量小、流程短的河，没有按能否入海划分
    - 误认为位于非季风区的河流都是内流河，忽视额尔齐斯河注入北冰洋
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:大分水岭
  type: Concept
  subject: 地理
  title: 大分水岭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为大分水岭位于澳大利亚西海岸，实际在东海岸南北延伸
    - 能指出并纠正这一错误：认为东坡降水稀少，实际东坡受暖湿气流影响降水丰沛
  aliases: []
  category: 地理
  explanation: 澳大利亚东海岸南北延伸的山脉，东坡受太平洋暖湿气流影响降水丰沛，东北沿海有热带雨林，东南沿海气候温暖湿润。
  misconceptions:
    - 误以为大分水岭位于澳大利亚西海岸，实际在东海岸南北延伸
    - 认为东坡降水稀少，实际东坡受暖湿气流影响降水丰沛
    - 将大分水岭误称为澳大利亚最高的山脉，实际不是
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:大堡礁
  type: Concept
  subject: 地理
  title: 大堡礁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为大堡礁位于澳大利亚西南部，实际在东北部珊瑚海
    - 能指出并纠正这一错误：把大堡礁当成岛屿或群岛，实际是珊瑚礁群
  aliases: []
  category: 地理
  explanation: 大堡礁位于澳大利亚东北部珊瑚海，是世界上最大的珊瑚礁群，也是世界旅游胜地，面临生态危机。
  misconceptions:
    - 误认为大堡礁位于澳大利亚西南部，实际在东北部珊瑚海
    - 把大堡礁当成岛屿或群岛，实际是珊瑚礁群
    - 认为大堡礁只是旅游地，忽略其生态危机和世界最大珊瑚礁群特征
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:大洋
  type: Concept
  subject: 地理
  title: 大洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把海与大洋混为一谈，误认为地中海是大洋，实际海是洋的边缘部分。
    - 能指出并纠正这一错误：误认为大西洋是最大洋，实际太平洋面积最大。
  aliases: []
  category: 地理概念
  explanation: 地球上广阔的水域，如太平洋、大西洋等。
  misconceptions:
    - 把海与大洋混为一谈，误认为地中海是大洋，实际海是洋的边缘部分。
    - 误认为大西洋是最大洋，实际太平洋面积最大。
    - 判读半球图时，误将北冰洋画在低纬度，实际它位于北极附近。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大洋底
  type: Concept
  subject: 地理
  title: 大洋底
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为大洋底是平坦的，看不到洋中脊、海沟等地形起伏
    - 能指出并纠正这一错误：把岛弧当作大陆的一部分，忽略其属于大洋底
  aliases:
    - 洋底
  category: 地理概念
  explanation: 大洋底是大洋的主体，面积约占海底总面积的77.2%，地形复杂多样，主要有洋中脊、海盆、海沟、岛弧等。
  misconceptions:
    - 认为大洋底是平坦的，看不到洋中脊、海沟等地形起伏
    - 把岛弧当作大陆的一部分，忽略其属于大洋底
    - 误以为大洋底只包括海盆，不包括海沟和洋中脊
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大洋洲
  type: Concept
  subject: 地理
  title: 大洋洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为大洋洲就是澳大利亚，忽略新西兰、新几内亚岛及众多太平洋岛屿。
    - 能指出并纠正这一错误：认为大洋洲是面积最大的大洲，实际它是七大洲中最小的。
  aliases: []
  category: 地理区域
  explanation: 大洋洲是世界第七大洲，包括澳大利亚大陆和太平洋上的许多岛屿，因处于大洋的包围之中而得名。
  misconceptions:
    - 误以为大洋洲就是澳大利亚，忽略新西兰、新几内亚岛及众多太平洋岛屿。
    - 认为大洋洲是面积最大的大洲，实际它是七大洲中最小的。
    - 以为大洋洲完全位于南半球，实际有些岛屿在北半球。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大洲
  type: Concept
  subject: 地理
  title: 大洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为大洲就是大陆，如说亚洲就是亚欧大陆，实际亚欧大陆包括欧洲。
    - 能指出并纠正这一错误：误认为澳大利亚大陆就是大洋洲，忽略大洋洲还包括许多岛屿。
  aliases:
    - 大陆
  category: 地理概念
  explanation: 地球上面积广大的陆地，如亚洲、非洲等。
  misconceptions:
    - 误认为大洲就是大陆，如说亚洲就是亚欧大陆，实际亚欧大陆包括欧洲。
    - 误认为澳大利亚大陆就是大洋洲，忽略大洋洲还包括许多岛屿。
    - 误认为非洲是面积最大的大洲，实际亚洲最大。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大洲分界线
  type: Concept
  subject: 地理
  title: 大洲分界线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有大洲分界线都是天然界线，忽略苏伊士运河、巴拿马运河等人为界线。
    - 能指出并纠正这一错误：误把直布罗陀海峡当作亚洲与非洲的分界线，实际它是欧洲与非洲的分界线。
  aliases:
    - 洲界
  category: 地理概念
  explanation: 洲与洲之间的分界线是人为划定的，有的以山脉、河流、湖泊和海峡等天然界线为分界，有的以运河等非天然界线为分界。
  misconceptions:
    - 认为所有大洲分界线都是天然界线，忽略苏伊士运河、巴拿马运河等人为界线。
    - 误把直布罗陀海峡当作亚洲与非洲的分界线，实际它是欧洲与非洲的分界线。
    - 混淆白令海峡的归属，以为它是亚洲与欧洲的分界线，实际是亚洲与北美洲的分界线。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大洲名称由来
  type: Concept
  subject: 地理
  title: 大洲名称由来
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将亚细亚和欧罗巴的含义记反，误以为亚细亚是‘西方日落处’。
    - 能指出并纠正这一错误：误以为‘欧罗巴’意为‘东方日出处’，与亚细亚的含义混淆。
  aliases: []
  category: 地理史实
  explanation: 各大洲的名称都有其历史渊源，如亚洲意为“东方日出处”，欧洲意为“西方日落处”等。
  misconceptions:
    - 将亚细亚和欧罗巴的含义记反，误以为亚细亚是‘西方日落处’。
    - 误以为‘欧罗巴’意为‘东方日出处’，与亚细亚的含义混淆。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大西洋
  type: Concept
  subject: 地理
  title: 大西洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为大西洋是世界上面积最大的海洋，与太平洋实际占近半混淆
    - 能指出并纠正这一错误：将大西洋面积记成约占世界海洋总面积的一半
  aliases: []
  category: 地理区域
  explanation: 大西洋是世界第二大洋，面积约占世界海洋总面积的1/4。
  misconceptions:
    - 误认为大西洋是世界上面积最大的海洋，与太平洋实际占近半混淆
    - 将大西洋面积记成约占世界海洋总面积的一半
    - 认为大西洋全部位于西半球，忽略其东至几内亚湾等东经地区
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大陆坡
  type: Concept
  subject: 地理
  title: 大陆坡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把大陆坡当成大陆架的一部分，混淆二者界线
    - 能指出并纠正这一错误：认为大陆坡水深超过3000米，甚至深达6000米
  aliases:
    - 陆坡
  category: 地理概念
  explanation: 大陆坡是大陆架外缘急剧变陡的斜坡，水深一般不超过3000米，是大陆架向大洋底的过渡地带。
  misconceptions:
    - 把大陆坡当成大陆架的一部分，混淆二者界线
    - 认为大陆坡水深超过3000米，甚至深达6000米
    - 误以为大陆坡是平缓的斜坡，实际上坡度急剧变陡
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:大陆架
  type: Concept
  subject: 地理
  title: 大陆架
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为大陆架是海洋的一部分，而不是陆地向海的自然延伸
    - 能指出并纠正这一错误：误以为大陆架深度很深，超过200米甚至更深
  aliases:
    - 陆架
  category: 地理概念
  explanation: 大陆架是陆地向海洋自然延伸并被海水覆盖的部分，沿海为平原时大陆架宽广，沿海为高原或山脉时大陆架狭窄。
  misconceptions:
    - 认为大陆架是海洋的一部分，而不是陆地向海的自然延伸
    - 误以为大陆架深度很深，超过200米甚至更深
    - 认为所有大陆架宽度相同，忽略沿海地形影响
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:大陆漂移说
  type: Concept
  subject: 地理
  title: 大陆漂移说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为魏格纳提出大陆漂移说时已有充分证据支持
    - 能指出并纠正这一错误：误把大陆漂移说当成板块构造学说的别称
  aliases:
    - 大陆漂移假说
  category: 地理学说
  explanation: 魏格纳提出的学说，认为陆地与海洋之间的相对位置是变化的，大陆在地质时期曾漂移。
  misconceptions:
    - 认为魏格纳提出大陆漂移说时已有充分证据支持
    - 误把大陆漂移说当成板块构造学说的别称
    - 认为大陆漂移只发生在远古，现在已完全停止
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:天体
  type: Concept
  subject: 地理
  title: 天体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把地球大气层内的飞机、云朵当作天体，它们不是天体。
    - 能指出并纠正这一错误：误认为落到地面的陨石仍是天体，实际上陨石已不属于宇宙空间。
  aliases: []
  category: 天文学概念
  explanation: 宇宙中由不同形态的物质组成，统称为天体，包括星云、恒星、行星、卫星、彗星、流星体等。
  misconceptions:
    - 误把地球大气层内的飞机、云朵当作天体，它们不是天体。
    - 误认为落到地面的陨石仍是天体，实际上陨石已不属于宇宙空间。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:天体系统
  type: Concept
  subject: 地理
  title: 天体系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为地球和火星之间相互吸引就能构成天体系统，忽略必须相互绕转。
    - 能指出并纠正这一错误：误将天体系统视为静止的，不清楚存在绕转关系。
  aliases: []
  category: 天文学概念
  explanation: 运动中的天体相互吸引和相互绕转，形成不同层次的天体系统。
  misconceptions:
    - 误以为地球和火星之间相互吸引就能构成天体系统，忽略必须相互绕转。
    - 误将天体系统视为静止的，不清楚存在绕转关系。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:天气
  type: Concept
  subject: 地理
  title: 天气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘四季如春’‘冬暖夏凉’等气候特点当作天气现象
    - 能指出并纠正这一错误：认为天气是多年平均的大气状况，混淆天气与气候
  aliases: []
  category: 地理概念
  explanation: 一个地方短时间内的大气状况，如风雨、阴晴、冷热等。
  misconceptions:
    - 把‘四季如春’‘冬暖夏凉’等气候特点当作天气现象
    - 认为天气是多年平均的大气状况，混淆天气与气候
    - 误认为天气只指气温，不包含风、云、降水等要素
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:天气符号
  type: Concept
  subject: 地理
  title: 天气符号
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为风旗的旗杆指向是风向，实际风向由风尾指示
    - 能指出并纠正这一错误：误认为‘多云’与‘阴天’的天气符号相同，不能区分
  aliases: []
  category: 地理概念
  explanation: 用于天气预报图中表示各种天气现象的符号，如晴、雨、雪、风等。
  misconceptions:
    - 误认为风旗的旗杆指向是风向，实际风向由风尾指示
    - 误认为‘多云’与‘阴天’的天气符号相同，不能区分
    - 误把‘雨夹雪’符号看成‘小雨’符号，忽略它们之间的雪图形
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:太平洋
  type: Concept
  subject: 地理
  title: 太平洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为太平洋面积世界第二，占海洋总面积的1/4
    - 能指出并纠正这一错误：误把太平洋岛屿面积45%说成占世界海洋总面积的45%
  aliases: []
  category: 地理区域
  explanation: 太平洋面积最大，几乎占世界海洋总面积的一半，岛屿最多，约占世界岛屿总面积的45%。
  misconceptions:
    - 误认为太平洋面积世界第二，占海洋总面积的1/4
    - 误把太平洋岛屿面积45%说成占世界海洋总面积的45%
    - 认为太平洋仅位于东半球，忽略其跨越180°经线
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:太平洋沿岸工业带
  type: Concept
  subject: 地理
  title: 太平洋沿岸工业带
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为日本工业集中在日本海沿岸，实际在太平洋和濑户内海沿岸
    - 能指出并纠正这一错误：将北海道和本州北部误以为工业集中区，实际未形成带状
  aliases:
    - 日本工业带
  category: 工业分布
  explanation: 日本工业集中分布在太平洋和濑户内海沿岸，形成太平洋沿岸工业带。
  misconceptions:
    - 误认为日本工业集中在日本海沿岸，实际在太平洋和濑户内海沿岸
    - 将北海道和本州北部误以为工业集中区，实际未形成带状
    - 以为太平洋沿岸工业带是指所有太平洋岛屿，忽略日本本土
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:太空探索
  type: Concept
  subject: 地理
  title: 太空探索
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为太空探索专指载人航天，忽略无人探测器如火星车。
    - 能指出并纠正这一错误：误以为发射卫星不属于太空探索，实际上它也是太空探索的一部分。
  aliases: []
  category: 航天工程
  explanation: 人类向太空发射航天器、探索太空的活动，包括探月工程、火星探测和空间站建设等。
  misconceptions:
    - 误以为太空探索专指载人航天，忽略无人探测器如火星车。
    - 误以为发射卫星不属于太空探索，实际上它也是太空探索的一部分。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:太阳直射点
  type: Concept
  subject: 地理
  title: 太阳直射点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为冬至日太阳直射点位于北回归线，实际是南回归线。
    - 能指出并纠正这一错误：认为夏至后直射点继续北移，实际夏至后向南移动。
  aliases: []
  category: 地理概念
  explanation: 太阳直射点是指阳光垂直照射在地球表面上的点，在南北回归线之间往返移动。
  misconceptions:
    - 认为冬至日太阳直射点位于北回归线，实际是南回归线。
    - 认为夏至后直射点继续北移，实际夏至后向南移动。
    - 认为太阳直射点最北可达赤道，实际是北回归线（23.5°N）。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:太阳系
  type: Concept
  subject: 地理
  title: 太阳系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将冥王星归入太阳系八大行星，实际上它是矮行星。
    - 能指出并纠正这一错误：误以为小行星带位于木星和土星之间，实际在火星与木星之间。
  aliases: []
  category: 天体系统
  explanation: 以太阳为中心的天体系统，包括太阳、八颗行星及其卫星、小行星、彗星等。
  misconceptions:
    - 误将冥王星归入太阳系八大行星，实际上它是矮行星。
    - 误以为小行星带位于木星和土星之间，实际在火星与木星之间。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:太阳系八颗行星
  type: Concept
  subject: 地理
  title: 太阳系八颗行星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把八颗行星的顺序记成水星、金星、火星、地球…，地球位置容易记错。
    - 能指出并纠正这一错误：误将海王星排在天王星之前，实际海王星离太阳更远。
  aliases:
    - 八大行星
  category: 天文学知识
  explanation: 按与太阳距离由近及远依次为水星、金星、地球、火星、木星、土星、天王星和海王星。
  misconceptions:
    - 误把八颗行星的顺序记成水星、金星、火星、地球…，地球位置容易记错。
    - 误将海王星排在天王星之前，实际海王星离太阳更远。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:季风
  type: Concept
  subject: 地理
  title: 季风
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为我国夏季风是西北风、冬季风是东南风，把风向搞反
    - 能指出并纠正这一错误：把季风与海陆风混淆，认为季风是白天海风、夜晚陆风
  aliases:
    - 季风气候
  category: 地理概念
  explanation: 风向随季节变化而有规律改变的风，我国季风气候显著。
  misconceptions:
    - 误认为我国夏季风是西北风、冬季风是东南风，把风向搞反
    - 把季风与海陆风混淆，认为季风是白天海风、夜晚陆风
    - 误认为季风只在中国东部存在，其他大洲没有季风
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:季风区与非季风区
  type: Concept
  subject: 地理
  title: 季风区与非季风区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为季风区与非季风区的分界线是秦岭—淮河一线
    - 能指出并纠正这一错误：误认为季风区内全年盛行夏季风，所以冬季也温暖湿润
  aliases:
    - 季风区
    - 非季风区
  category: 地理概念
  explanation: 季风区是夏季风常年到达的区域，非季风区夏季风难以到达，降水稀少。
  misconceptions:
    - 误认为季风区与非季风区的分界线是秦岭—淮河一线
    - 误认为季风区内全年盛行夏季风，所以冬季也温暖湿润
    - 误认为非季风区完全不受季风影响，实际只是夏季风难以到达
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:宇宙
  type: Concept
  subject: 地理
  title: 宇宙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为宇宙只是所有天体的集合，忽略宇宙是时间和空间的统一。
    - 能指出并纠正这一错误：误认为宇宙是静止不动的，不知道宇宙在膨胀。
  aliases: []
  category: 天文学概念
  explanation: 宇宙是空间和时间的统一，是万事万物的总称。
  misconceptions:
    - 误以为宇宙只是所有天体的集合，忽略宇宙是时间和空间的统一。
    - 误认为宇宙是静止不动的，不知道宇宙在膨胀。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:宗教
  type: Concept
  subject: 地理
  title: 宗教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为佛教起源于中国，实际佛教起源于古印度。
    - 能指出并纠正这一错误：误认为基督教发源于欧洲，实际发源于亚洲的巴勒斯坦地区。
  aliases: []
  category: 人文地理
  explanation: 社会意识形态，如佛教、基督教、伊斯兰教等。
  misconceptions:
    - 误认为佛教起源于中国，实际佛教起源于古印度。
    - 误认为基督教发源于欧洲，实际发源于亚洲的巴勒斯坦地区。
    - 误认为清真寺是佛教建筑，如把麦加大清真寺当作佛寺。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:宗教建筑特色
  type: Concept
  subject: 地理
  title: 宗教建筑特色
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为石窟是基督教特有的建筑形式
    - 能指出并纠正这一错误：混淆神庙与教堂，认为它们是同一种宗教建筑
  aliases: []
  category: 地理文化
  explanation: 宗教建筑包括神庙、寺院、教堂、石窟等，一些已成为世界文化宝贵财富，如中国的四大石窟。
  misconceptions:
    - 误以为石窟是基督教特有的建筑形式
    - 混淆神庙与教堂，认为它们是同一种宗教建筑
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:富士山
  type: Concept
  subject: 地理
  title: 富士山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为富士山是死火山，实际是活火山
    - 能指出并纠正这一错误：认为富士山位于北海道，实际在本州岛
  aliases:
    - 富士山
  category: 自然地理
  explanation: 富士山海拔3776米，是日本第一高峰，也是一座著名的活火山。
  misconceptions:
    - 误认为富士山是死火山，实际是活火山
    - 认为富士山位于北海道，实际在本州岛
    - 把富士山高度记成3000米以下，实际3776米
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:寒带冰原气候
  type: Concept
  subject: 地理
  title: 寒带冰原气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为寒带冰原气候也广布于北冰洋沿岸，实际那里是苔原气候。
    - 能指出并纠正这一错误：误把南极冰原与北极冰原混为一谈，忽略南极大陆更冷且植物绝迹。
  aliases: []
  category: 气候类型
  explanation: 主要分布在南极大陆和格陵兰岛的大部分地区，终年酷寒，降水皆为雪，植物基本无法生存。
  misconceptions:
    - 误认为寒带冰原气候也广布于北冰洋沿岸，实际那里是苔原气候。
    - 误把南极冰原与北极冰原混为一谈，忽略南极大陆更冷且植物绝迹。
    - 读等温线图时，误将冰原气候区标在0℃等温线附近，实际全年酷寒。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:寒带苔原气候
  type: Concept
  subject: 地理
  title: 寒带苔原气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为苔原气候分布在南极大陆，实际南极是冰原气候。
    - 能指出并纠正这一错误：认为苔原气候夏季降水为雨，实际以降雪为主，且长冬无夏。
  aliases: []
  category: 气候类型
  explanation: 主要分布在亚欧大陆和北美大陆的北冰洋沿岸，长冬无夏，终年寒冷，降水以降雪为主。
  misconceptions:
    - 误认为苔原气候分布在南极大陆，实际南极是冰原气候。
    - 认为苔原气候夏季降水为雨，实际以降雪为主，且长冬无夏。
    - 误将苔原气候与冰原气候的植被等同，实际苔原有低矮苔藓地衣。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:寒流对沿岸气候的影响
  type: Concept
  subject: 地理
  title: 寒流对沿岸气候的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为寒流能增温增湿，如误以为本格拉寒流使沿岸降水丰富。
    - 能指出并纠正这一错误：以为寒流只降低气温不影响降水，忽视减湿作用。
  aliases:
    - 寒流降温减湿
  category: 地理原理
  explanation: 寒流对沿岸地区气候起降温、减湿的作用。
  misconceptions:
    - 认为寒流能增温增湿，如误以为本格拉寒流使沿岸降水丰富。
    - 以为寒流只降低气温不影响降水，忽视减湿作用。
    - 把寒流影响与暖流影响颠倒，如认为秘鲁寒流使沿岸沙漠形成是增温所致。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:寒潮
  type: Concept
  subject: 地理
  title: 寒潮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为寒潮只发生在冬季，实际春秋季也可发生强冷空气侵袭
    - 能指出并纠正这一错误：认为寒潮就是普通冷空气，实际需造成大范围急剧降温和大风
  aliases: []
  category: 气象灾害
  explanation: 寒潮是指北半球高纬度地区的强冷空气大规模地向中低纬度地区侵袭，造成大范围急剧降温和大风的天气过程。
  misconceptions:
    - 误以为寒潮只发生在冬季，实际春秋季也可发生强冷空气侵袭
    - 认为寒潮就是普通冷空气，实际需造成大范围急剧降温和大风
    - 以为寒潮只降温，忽视还会带来雨雪霜冻等天气
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:尊重世界文化多样性
  type: Concept
  subject: 地理
  title: 尊重世界文化多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为尊重文化多样性意味着抛弃自身文化去迎合他国，如放弃传统节日改过洋节
    - 能指出并纠正这一错误：把尊重多样性等同于赞同所有文化中的陋习，如接受性别歧视等做法
  aliases:
    - 文化尊重
  category: 价值观
  explanation: 在坚持各民族平等的基础上，尊重差异，理解个性，相互借鉴，求同存异，共同促进人类文明繁荣进步。
  misconceptions:
    - 认为尊重文化多样性意味着抛弃自身文化去迎合他国，如放弃传统节日改过洋节
    - 把尊重多样性等同于赞同所有文化中的陋习，如接受性别歧视等做法
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:小浪底水利枢纽工程
  type: Concept
  subject: 地理
  title: 小浪底水利枢纽工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为小浪底工程位于长江干流，是三峡工程的组成部分
    - 能指出并纠正这一错误：认为小浪底的首要功能是发电，忽略其减淤和防洪作用
  aliases:
    - 小浪底工程
  category: 地理
  explanation: 位于黄河干流的大型综合性水利工程，具有减淤、防洪、防凌、供水、灌溉和发电等功能。
  misconceptions:
    - 误认为小浪底工程位于长江干流，是三峡工程的组成部分
    - 认为小浪底的首要功能是发电，忽略其减淤和防洪作用
    - 认为小浪底建成后黄河下游再不会出现泥沙淤积，彻底解决地上河问题
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:尼罗河
  type: Concept
  subject: 地理
  title: 尼罗河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为尼罗河发源于埃及境内，实际发源于赤道附近高山
    - 能指出并纠正这一错误：以为尼罗河注入红海，实际注入地中海
  aliases: []
  category: 地理
  explanation: 尼罗河是世界第一长河，发源于赤道附近高山，自南向北流经埃及，在埃及境内长1530千米，是埃及的主要水源。
  misconceptions:
    - 误认为尼罗河发源于埃及境内，实际发源于赤道附近高山
    - 以为尼罗河注入红海，实际注入地中海
    - 忘记尼罗河是自南向北流，误认为自北向南流
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:山区
  type: Concept
  subject: 地理
  title: 山区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘山区’等同于‘山地’，认为它不包括丘陵和崎岖的高原
    - 能指出并纠正这一错误：误认为我国山区面积约占全国总面积的1/3，实际约2/3
  aliases: []
  category: 地理概念
  explanation: 习惯上把山地、丘陵、崎岖的高原统称为山区。我国山区面积约占全国总面积的2/3。
  misconceptions:
    - 误将‘山区’等同于‘山地’，认为它不包括丘陵和崎岖的高原
    - 误认为我国山区面积约占全国总面积的1/3，实际约2/3
    - 认为山区只适合发展林业，不宜修建梯田和多种经营
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:山脉走向
  type: Concept
  subject: 地理
  title: 山脉走向
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把大兴安岭的走向判为南北走向，实际是东北—西南走向
    - 能指出并纠正这一错误：误认为山脉走向与河流流向一致，沿河流流向判断山脉走向
  aliases: []
  category: 中国地理
  explanation: 我国山脉的走向主要有东西走向、东北—西南走向、南北走向、西北—东南走向和弧形山脉。山脉构成地形的骨架。
  misconceptions:
    - 误把大兴安岭的走向判为南北走向，实际是东北—西南走向
    - 误认为山脉走向与河流流向一致，沿河流流向判断山脉走向
    - 把喜马拉雅山说成东西走向，忽略其呈弧形分布
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:岛弧
  type: Concept
  subject: 地理
  title: 岛弧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为岛弧是大陆的一部分，其实它是大洋中的弧形岛屿
    - 能指出并纠正这一错误：误以为岛弧不伴生海沟，实际上向海外侧常有海沟
  aliases:
    - 岛屿弧
  category: 地理概念
  explanation: 岛弧是呈弧形排列或弧形伸展的岛屿或群岛，分布于大洋边缘，向海的外侧常伴有很深的海沟。
  misconceptions:
    - 认为岛弧是大陆的一部分，其实它是大洋中的弧形岛屿
    - 误以为岛弧不伴生海沟，实际上向海外侧常有海沟
    - 把岛弧与洋中脊混淆，岛弧位于大洋边缘而非中央
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:工业废气、废水、废渣处理
  type: Concept
  subject: 地理
  title: 工业废气、废水、废渣处理
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：以为工业废气、废水、废渣处理只是简单排放或稀释，如将废气直接高空排放当作处理完毕。
    - 能指出并纠正这一错误：误认为处理废渣就是填埋或焚烧，没有考虑资源化利用或无害化要求。
  aliases:
    - 三废处理
    - 工业废气废水废渣处理
  category: 工业环保
  explanation: 对工业生产中产生的废气、废水、废渣进行处理，减少污染物排放，改善环境。
  misconceptions:
    - 以为工业废气、废水、废渣处理只是简单排放或稀释，如将废气直接高空排放当作处理完毕。
    - 误认为处理废渣就是填埋或焚烧，没有考虑资源化利用或无害化要求。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:工业环境污染
  type: Concept
  subject: 地理
  title: 工业环境污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将工业环境污染等同于所有环境污染，忽略农业污染、生活污染等其他来源。
    - 能指出并纠正这一错误：认为只有大气污染属于工业环境污染，忽视水污染和固体废弃物污染也在其中。
  aliases:
    - 工业污染
  category: 环境问题
  explanation: 工业发展导致大气污染、水污染和固体废弃物污染等环境问题。
  misconceptions:
    - 将工业环境污染等同于所有环境污染，忽略农业污染、生活污染等其他来源。
    - 认为只有大气污染属于工业环境污染，忽视水污染和固体废弃物污染也在其中。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:工业环境污染与治理
  type: Concept
  subject: 地理
  title: 工业环境污染与治理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为治理工业污染只需末端处理，忽视清洁生产应从源头减少污染物产生。
    - 能指出并纠正这一错误：把清洁生产等同于‘少排或不排’，没有理解清洁生产还包括原燃料和工艺的改进。
  aliases:
    - 工业污染治理
  category: 环境问题
  explanation: 工业发展带来大气污染、水污染和固体废弃物污染，我国通过清洁生产等措施进行治理。
  misconceptions:
    - 误以为治理工业污染只需末端处理，忽视清洁生产应从源头减少污染物产生。
    - 把清洁生产等同于‘少排或不排’，没有理解清洁生产还包括原燃料和工艺的改进。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:工业生产模式转变
  type: Concept
  subject: 地理
  title: 工业生产模式转变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为工业生产模式转变是突然发生的，没有看到从手工到机械化再到自动化的渐进过程。
    - 能指出并纠正这一错误：误以为自动化生产一定完全不需要人工，忽视人仍负责监控和维护。
  aliases: []
  category: 工业发展
  explanation: 由人工生产模式向自动化机器设备生产模式转变，提高生产效率和产品质量。
  misconceptions:
    - 认为工业生产模式转变是突然发生的，没有看到从手工到机械化再到自动化的渐进过程。
    - 误以为自动化生产一定完全不需要人工，忽视人仍负责监控和维护。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:巴拿马运河
  type: Concept
  subject: 地理
  title: 巴拿马运河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将巴拿马运河当亚洲与非洲分界线，与苏伊士运河混淆
    - 能指出并纠正这一错误：误认为巴拿马运河沟通大西洋和印度洋
  aliases: []
  category: 地理事物
  explanation: 巴拿马运河是北美洲与南美洲的分界线。
  misconceptions:
    - 误将巴拿马运河当亚洲与非洲分界线，与苏伊士运河混淆
    - 误认为巴拿马运河沟通大西洋和印度洋
    - 误以为巴拿马运河位于南美洲南部，实际在中美洲
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:巴西主要城市
  type: Concept
  subject: 地理
  title: 巴西主要城市
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为巴西首都是圣保罗或里约热内卢，实际是巴西利亚
    - 能指出并纠正这一错误：认为圣保罗是巴西最大海港，实际最大海港是里约热内卢
  aliases: []
  category: 人文地理
  explanation: 巴西利亚是首都，圣保罗是南美洲最大城市，里约热内卢是第二大城市和最大海港。
  misconceptions:
    - 误认为巴西首都是圣保罗或里约热内卢，实际是巴西利亚
    - 认为圣保罗是巴西最大海港，实际最大海港是里约热内卢
    - 把里约热内卢误认为南美洲最大城市，实际最大城市是圣保罗
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西人口分布
  type: Concept
  subject: 地理
  title: 巴西人口分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西人口集中在内陆高原，实则多分布在东部沿海地带。
    - 能指出并纠正这一错误：将巴西人口分布与俄罗斯混淆，认为西密东疏，实际是东密西疏。
  aliases: []
  category: 人文地理
  explanation: 巴西人口分布不均衡，绝大部分集中在东部和东南部沿海地带，内陆稀疏。
  misconceptions:
    - 误以为巴西人口集中在内陆高原，实则多分布在东部沿海地带。
    - 将巴西人口分布与俄罗斯混淆，认为西密东疏，实际是东密西疏。
    - 看图时误将亚马孙平原标为人口稠密区，实际是人口稀疏区。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S5.md
- id: concept:地理:巴西农业
  type: Concept
  subject: 地理
  title: 巴西农业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西是世界最大的小麦出口国，实际是大豆、咖啡等。
    - 能指出并纠正这一错误：误认为巴西咖啡主要产自亚马孙平原，实际主要分布在东南部高原。
  aliases: []
  category: 经济地理
  explanation: 巴西是世界农业大国，大豆、咖啡、甘蔗、柑橘等产量居世界首位。
  misconceptions:
    - 误以为巴西是世界最大的小麦出口国，实际是大豆、咖啡等。
    - 误认为巴西咖啡主要产自亚马孙平原，实际主要分布在东南部高原。
    - 混淆产量与出口量，误以为巴西柑橘产量居世界首位就一定是出口第一。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西地形
  type: Concept
  subject: 地理
  title: 巴西地形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西高原位于巴西北部，亚马孙平原位于南部，实际相反。
    - 能指出并纠正这一错误：将巴西高原海拔说成200米以下，实际在500米以上。
  aliases: []
  category: 自然地理
  explanation: 巴西地形分为巴西高原和亚马孙平原两部分，高原海拔500米以上，平原海拔200米以下。
  misconceptions:
    - 误以为巴西高原位于巴西北部，亚马孙平原位于南部，实际相反。
    - 将巴西高原海拔说成200米以下，实际在500米以上。
    - 混淆高原与平原，认为巴西高原平坦开阔无起伏。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西地理位置
  type: Concept
  subject: 地理
  title: 巴西地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西位于南美洲西部，濒临太平洋，实际东部濒临大西洋。
    - 能指出并纠正这一错误：误以为巴西全境位于热带，忽略南部部分地区位于南温带。
  aliases: []
  category: 自然地理
  explanation: 巴西位于南美洲东部，东濒大西洋，是南美洲面积最大、人口最多的国家。
  misconceptions:
    - 误以为巴西位于南美洲西部，濒临太平洋，实际东部濒临大西洋。
    - 误以为巴西全境位于热带，忽略南部部分地区位于南温带。
    - 根据经纬度判断方向时，误以为巴西位于非洲西侧，实际位于南美洲东部。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西工业
  type: Concept
  subject: 地理
  title: 巴西工业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西工业主要分布在西北部内陆，实际集中在东南沿海。
    - 能指出并纠正这一错误：认为巴西最大工业城市是首都巴西利亚，实际是圣保罗。
  aliases: []
  category: 经济地理
  explanation: 巴西工业主要分布在东南部，圣保罗和里约热内卢是重要工业中心。
  misconceptions:
    - 误以为巴西工业主要分布在西北部内陆，实际集中在东南沿海。
    - 认为巴西最大工业城市是首都巴西利亚，实际是圣保罗。
    - 混淆圣保罗与里约热内卢的位置，认为里约在圣保罗西南方。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西工业体系
  type: Concept
  subject: 地理
  title: 巴西工业体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西工业体系在21世纪才建成，实际是在20世纪70年代。
    - 能指出并纠正这一错误：认为巴西工业体系以纺织服装为主，缺少钢铁机械等重工业。
  aliases: []
  category: 地理
  explanation: 巴西在20世纪70年代基本建成了比较完整的工业体系，包括纺织、采矿、钢铁、机械、汽车和石油化工等工业。
  misconceptions:
    - 误以为巴西工业体系在21世纪才建成，实际是在20世纪70年代。
    - 认为巴西工业体系以纺织服装为主，缺少钢铁机械等重工业。
    - 混淆巴西与阿根廷工业结构，认为巴西主要出口牛肉，工业品出口少。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西热带雨林开发与保护
  type: Concept
  subject: 地理
  title: 巴西热带雨林开发与保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为亚马孙热带雨林全部位于巴西境内，实际跨越秘鲁、哥伦比亚等国。
    - 能指出并纠正这一错误：认为巴西大规模开发雨林是为了种植大豆，实际是砍伐牧场和采矿。
  aliases:
    - 热带雨林开发与保护
    - 亚马孙热带雨林
    - 地球之肺
  category: 环境问题
  explanation: 巴西对热带雨林进行大规模开发，导致环境问题，后采取保护措施，但面临挑战。
  misconceptions:
    - 误以为亚马孙热带雨林全部位于巴西境内，实际跨越秘鲁、哥伦比亚等国。
    - 认为巴西大规模开发雨林是为了种植大豆，实际是砍伐牧场和采矿。
    - 认为保护措施已完全杜绝砍伐，实际仍面临非法采伐挑战。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西矿产资源
  type: Concept
  subject: 地理
  title: 巴西矿产资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西石油储量居世界前列，实际是铁、锰、铝土等。
    - 能指出并纠正这一错误：将巴西铁矿与澳大利亚混淆，认为巴西铁矿多为贫矿，实际是富矿。
  aliases: []
  category: 自然资源
  explanation: 巴西矿产资源丰富，铁、锰、铝土等储量居世界前列，铁矿多为富矿。
  misconceptions:
    - 误以为巴西石油储量居世界前列，实际是铁、锰、铝土等。
    - 将巴西铁矿与澳大利亚混淆，认为巴西铁矿多为贫矿，实际是富矿。
    - 混淆锰和铝土，误以为巴西铝土储量世界第一，实际是前列。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S6.md
- id: concept:地理:巴西种族构成
  type: Concept
  subject: 地理
  title: 巴西种族构成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西是单一的白色人种国家，实际种族构成复杂。
    - 能指出并纠正这一错误：认为巴西原住民是非洲黑人后裔，实际是印第安人。
  aliases: []
  category: 人文地理
  explanation: 巴西种族构成复杂，有印第安人、欧洲移民、非洲黑人后裔和亚洲移民等。
  misconceptions:
    - 误以为巴西是单一的白色人种国家，实际种族构成复杂。
    - 认为巴西原住民是非洲黑人后裔，实际是印第安人。
    - 忽略亚洲移民在巴西的构成，认为只有欧洲移民和非洲后裔。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:巴西经济
  type: Concept
  subject: 地理
  title: 巴西经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴西是发达国家，实际是发展中国家但经济实力南美最强。
    - 能指出并纠正这一错误：认为巴西经济依赖单一农产品，实际是农业、矿产、工业并存。
  aliases: []
  category: 经济地理
  explanation: 巴西是南美洲经济实力最强的国家，农业发达，大豆、咖啡等产量居世界首位，矿产资源丰富，工业集中分布在东南沿海。
  misconceptions:
    - 误以为巴西是发达国家，实际是发展中国家但经济实力南美最强。
    - 认为巴西经济依赖单一农产品，实际是农业、矿产、工业并存。
    - 误以为巴西工业中心分布在内陆，实际在东南沿海。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S6.md
- id: concept:地理:巴西自然环境
  type: Concept
  subject: 地理
  title: 巴西自然环境
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为亚马孙河自东向西流入大西洋，实际自西向东。
    - 能指出并纠正这一错误：认为亚马孙平原地形为热带草原气候，实际是热带雨林气候。
  aliases:
    - 巴西地形
    - 亚马孙河
  category: 自然地理
  explanation: 巴西地形分为巴西高原和亚马孙平原，亚马孙平原是世界最大平原，热带雨林气候，亚马孙河是世界水量最大、流域最广的河流。
  misconceptions:
    - 误以为亚马孙河自东向西流入大西洋，实际自西向东。
    - 认为亚马孙平原地形为热带草原气候，实际是热带雨林气候。
    - 将巴西高原与青藏高原混淆，认为巴西高原地势高峻。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:常绿硬叶林
  type: Concept
  subject: 地理
  title: 常绿硬叶林
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为常绿硬叶林冬季会落叶，实际是常绿，夏季靠革质叶子抗旱。
    - 能指出并纠正这一错误：误将常绿硬叶林认作常绿阔叶林，忽略叶面革质和茸毛的特征。
  aliases: []
  category: 自然景观
  explanation: 地中海气候区的典型植被，植物具有耐旱特点，叶子革质或具茸毛，有利于储存水分或减少蒸发。
  misconceptions:
    - 误认为常绿硬叶林冬季会落叶，实际是常绿，夏季靠革质叶子抗旱。
    - 误将常绿硬叶林认作常绿阔叶林，忽略叶面革质和茸毛的特征。
    - 认为常绿硬叶林分布在温带季风区，实际地中海气候区才有。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:干旱
  type: Concept
  subject: 地理
  title: 干旱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为干旱就是降水绝对少，实际是相对多年平均显著偏少
    - 能指出并纠正这一错误：认为干旱只影响农业，实际也影响人类生活、生态等
  aliases: []
  category: 气象灾害
  explanation: 干旱是指某地某一时段内的降水量相较多年平均降水量显著偏少，导致经济活动（尤其是农业生产）和人类生活受到较大危害的现象。
  misconceptions:
    - 误以为干旱就是降水绝对少，实际是相对多年平均显著偏少
    - 认为干旱只影响农业，实际也影响人类生活、生态等
    - 将干旱与旱灾混淆，干旱是自然现象，旱灾是造成危害
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:干湿区
  type: Concept
  subject: 地理
  title: 干湿区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为干湿地区只由降水量决定，不看蒸发量，降水多即湿润区
    - 能指出并纠正这一错误：误认为秦岭—淮河是半湿润区与半干旱区的分界线，实际是湿润区与半湿润区的分界线
  aliases:
    - 干湿地区
  category: 地理概念
  explanation: 根据降水量与蒸发量的对比关系，我国划分为湿润区、半湿润区、半干旱区和干旱区。
  misconceptions:
    - 误认为干湿地区只由降水量决定，不看蒸发量，降水多即湿润区
    - 误认为秦岭—淮河是半湿润区与半干旱区的分界线，实际是湿润区与半湿润区的分界线
    - 把干旱区等同于沙漠地区，认为植被茂密的干旱区不存在
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:平均受教育年限
  type: Concept
  subject: 地理
  title: 平均受教育年限
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把平均受教育年限等同于国民中大学生比例，忽略中小学教育年限。
    - 能指出并纠正这一错误：计算时误将全人口纳入，实际只统计25岁及以上人口。
  aliases: []
  category: 地理概念
  explanation: 25岁及以上人口在学校接受教育的平均年数，反映国民受教育程度。
  misconceptions:
    - 把平均受教育年限等同于国民中大学生比例，忽略中小学教育年限。
    - 计算时误将全人口纳入，实际只统计25岁及以上人口。
    - 认为平均受教育年限越长该国一定越富裕，忽略其他因素。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S1.md
- id: concept:地理:平等互利原则
  type: Concept
  subject: 地理
  title: 平等互利原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为平等互利就是各国获得完全相同的利益，忽略国情差异。
    - 能指出并纠正这一错误：把平等理解为投资金额和话语权完全均等，不现实。
  aliases: []
  category: 地理原则
  explanation: 开展国际经济合作的基本原则是平等互利，即各国在合作中地位平等、互惠互利。
  misconceptions:
    - 认为平等互利就是各国获得完全相同的利益，忽略国情差异。
    - 把平等理解为投资金额和话语权完全均等，不现实。
    - 认为发展中国家与发达国家合作无法真正平等，就否定该原则。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:应急避难场所
  type: Concept
  subject: 地理
  title: 应急避难场所
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为应急避难场所仅用于地震，实际适用于多种灾害
    - 能指出并纠正这一错误：认为应急避难场所必须有房屋建筑，实际多为公园广场等空地
  aliases: []
  category: 防护技能
  explanation: 应急避难场所是灾害时用于人员疏散和避难，并具有一定生活服务设施的场所，如公园、广场等。
  misconceptions:
    - 误以为应急避难场所仅用于地震，实际适用于多种灾害
    - 认为应急避难场所必须有房屋建筑，实际多为公园广场等空地
    - 以为应急避难场所就是临时帐篷，实际是预先规划的安全场所
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S2.md
- id: concept:地理:建筑风格与城镇景观
  type: Concept
  subject: 地理
  title: 建筑风格与城镇景观
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将陕北窑洞与江南水乡建筑风格混为一谈，无视两地的自然环境与文化差异
    - 能指出并纠正这一错误：认为建筑风格是城镇景观的全部，忽略道路、广场等布局要素
  aliases: []
  category: 人文地理
  explanation: 建筑是城镇景观的重要组成要素，不同国家和地区的建筑风格不同，形成各具特色的城镇景观。
  misconceptions:
    - 将陕北窑洞与江南水乡建筑风格混为一谈，无视两地的自然环境与文化差异
    - 认为建筑风格是城镇景观的全部，忽略道路、广场等布局要素
    - 误以为现代建筑风格趋同，不再受到地域文化的影响
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:影响人口分布的因素
  type: Concept
  subject: 地理
  title: 影响人口分布的因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只考虑自然因素，认为就业机会等社会经济因素不影响人口分布，如说大城市人口多只因气候好。
    - 能指出并纠正这一错误：认为社会经济因素仅影响城市，不影响农村人口分布，如说农村人口分布全靠自然条件。
  aliases:
    - 人口分布影响因素
  category: 地理概念
  explanation: 影响人口分布的因素包括自然因素（如纬度、海拔、距海远近）和社会经济因素（如就业机会、收入水平等）。
  misconceptions:
    - 只考虑自然因素，认为就业机会等社会经济因素不影响人口分布，如说大城市人口多只因气候好。
    - 认为社会经济因素仅影响城市，不影响农村人口分布，如说农村人口分布全靠自然条件。
    - 割裂两类因素，如认为人口迁移只看收入，与自然条件无关。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:影响气候的因素
  type: Concept
  subject: 地理
  title: 影响气候的因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为距海近就一定多雨，忽略地形和风向，如非洲西海岸近海却因寒流少雨。
    - 能指出并纠正这一错误：以为纬度低就全年多雨，忽略副高或信风影响，如撒哈拉沙漠纬度低却少雨。
  aliases:
    - 气候影响因素
  category: 地理原理
  explanation: 纬度位置、海陆位置和地形等多种因素影响世界各地冷热干湿状况，形成不同气候类型。
  misconceptions:
    - 认为距海近就一定多雨，忽略地形和风向，如非洲西海岸近海却因寒流少雨。
    - 以为纬度低就全年多雨，忽略副高或信风影响，如撒哈拉沙漠纬度低却少雨。
    - 忽视地形对气温的影响，如认为同纬度山地与平原气温相同。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:径流量
  type: Concept
  subject: 地理
  title: 径流量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为径流量只取决于降水量，忽略蒸发、下渗、流域面积等因素的影响。
    - 能指出并纠正这一错误：把径流量与水资源总量完全等同，不知道径流量还分地表径流和地下径流。
  aliases: []
  category: 地理概念
  explanation: 衡量一个国家水资源多少的指标，随降水的变化而变化，降水多的地区径流量大，淡水资源丰富。
  misconceptions:
    - 误以为径流量只取决于降水量，忽略蒸发、下渗、流域面积等因素的影响。
    - 把径流量与水资源总量完全等同，不知道径流量还分地表径流和地下径流。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:恒星
  type: Concept
  subject: 地理
  title: 恒星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为恒星在宇宙中绝对静止，实际太阳也绕银河系中心运动
    - 能指出并纠正这一错误：误把金星当作恒星，因它日落后常很亮，实际金星是行星，自身不发光
  aliases: []
  category: 天文学概念
  explanation: 由炽热气体组成的、能自己发光的球状或类球状天体。
  misconceptions:
    - 误认为恒星在宇宙中绝对静止，实际太阳也绕银河系中心运动
    - 误把金星当作恒星，因它日落后常很亮，实际金星是行星，自身不发光
    - 误以为恒星颜色越红温度越高，实际蓝色恒星温度更高
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:我国冬季气温分布规律
  type: Concept
  subject: 地理
  title: 我国冬季气温分布规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为我国冬季南北温差小，与夏季全国普遍高温相混淆
    - 能指出并纠正这一错误：误认为1月0℃等温线西段沿青藏高原东北边缘，实际沿东南边缘
  aliases:
    - 冬季气温分布
  category: 地理规律
  explanation: 冬季我国气温自南向北降低，南北温差大；1月0℃等温线大致沿淮河—秦岭—青藏高原东南边缘分布。
  misconceptions:
    - 误认为我国冬季南北温差小，与夏季全国普遍高温相混淆
    - 误认为1月0℃等温线西段沿青藏高原东北边缘，实际沿东南边缘
    - 误认为冬季气温自东向西降低，忽略自南向北的主要规律
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:我国夏季气温分布规律
  type: Concept
  subject: 地理
  title: 我国夏季气温分布规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为夏季我国南北温差大，如广州与哈尔滨温差可达20℃以上
    - 能指出并纠正这一错误：把青藏高原当作夏季全国最高温区，忽略其低温特点
  aliases:
    - 夏季气温分布
  category: 地理规律
  explanation: 夏季我国除青藏高原等少数地区外，全国普遍高温，南北温差不大。
  misconceptions:
    - 认为夏季我国南北温差大，如广州与哈尔滨温差可达20℃以上
    - 把青藏高原当作夏季全国最高温区，忽略其低温特点
    - 说夏季全国普遍高温，误以为没有任何例外地区
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:我国年降水量空间分布规律
  type: Concept
  subject: 地理
  title: 我国年降水量空间分布规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把降水分布说成‘西多东少’，与东南向西北递减搞反
    - 能指出并纠正这一错误：误以为我国年降水量从东北向西南递减
  aliases:
    - 降水分布规律
  category: 地理规律
  explanation: 我国年降水量东部多、西部少，由东南沿海向西北内陆逐渐减少。
  misconceptions:
    - 把降水分布说成‘西多东少’，与东南向西北递减搞反
    - 误以为我国年降水量从东北向西南递减
    - 认为东南沿海降水最少，实际最多
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:我国矿产资源特征
  type: Concept
  subject: 地理
  title: 我国矿产资源特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为我国矿产资源‘总量多’就代表人均也充足，忽略人口众多导致人均较少。
    - 能指出并纠正这一错误：认为‘分布广泛’就是每个省都有所有矿种，忽视相对集中如煤在山西、内蒙古等省区。
  aliases:
    - 中国矿产资源特点
    - 矿产资源特征
  category: 地理特征
  explanation: 总量多但人均少，种类丰富但质量相差悬殊，分布广泛但相对集中。
  misconceptions:
    - 误以为我国矿产资源‘总量多’就代表人均也充足，忽略人口众多导致人均较少。
    - 认为‘分布广泛’就是每个省都有所有矿种，忽视相对集中如煤在山西、内蒙古等省区。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:抗震房屋
  type: Concept
  subject: 地理
  title: 抗震房屋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为用厚重坚固的花岗岩造房最抗震，忽略轻质弹性材料。
    - 能指出并纠正这一错误：觉得抗震房屋必须又矮又平，不能有窗户或特殊设计。
  aliases: []
  category: 地理应用
  explanation: 抗震房屋是采用轻质、弹性材料或特殊结构以减轻地震破坏的房屋。
  misconceptions:
    - 认为用厚重坚固的花岗岩造房最抗震，忽略轻质弹性材料。
    - 觉得抗震房屋必须又矮又平，不能有窗户或特殊设计。
    - 误以为抗震房屋能完全避免破坏，不会出现任何裂缝。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:拉丁美洲名称的由来
  type: Concept
  subject: 地理
  title: 拉丁美洲名称的由来
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为拉丁美洲是南美洲的别称，忽略墨西哥及中美洲
    - 能指出并纠正这一错误：以为拉丁美洲的得名源于当地所有语言都是拉丁语，忽视西班牙语、葡萄牙语的拉丁语源
  aliases: []
  category: 地理
  explanation: 美国以南的美洲地区被称为拉丁美洲，因为该地区多数国家使用源于拉丁语的西班牙语或葡萄牙语。
  misconceptions:
    - 误以为拉丁美洲是南美洲的别称，忽略墨西哥及中美洲
    - 以为拉丁美洲的得名源于当地所有语言都是拉丁语，忽视西班牙语、葡萄牙语的拉丁语源
    - 把美国以南理解为整个美洲南部，包含巴西和阿根廷，但漏掉墨西哥
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:探月工程
  type: Concept
  subject: 地理
  title: 探月工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“嫦娥五号”是火星探测器，实际它完成了月球采样返回
    - 能指出并纠正这一错误：误以为中国探月工程已实现载人登月，实际只完成无人绕、落、回
  aliases:
    - 嫦娥工程
  category: 航天工程
  explanation: 人类对月球进行的探测活动，中国探月工程又称嫦娥工程，已实现绕、落、回三步走。
  misconceptions:
    - 误认为“嫦娥五号”是火星探测器，实际它完成了月球采样返回
    - 误以为中国探月工程已实现载人登月，实际只完成无人绕、落、回
    - 误把“玉兔号”当作火星车，实际它是月球车
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:撒哈拉以南非洲
  type: Concept
  subject: 地理
  title: 撒哈拉以南非洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为撒哈拉以南非洲全部位于南半球，实际大部分位于北半球
    - 能指出并纠正这一错误：东西两侧大洋混淆，如把东侧说成大西洋
  aliases: []
  category: 地理区域
  explanation: 指撒哈拉沙漠中部以南的非洲大陆及附近岛屿，西临大西洋，东临印度洋，绝大部分地处热带。
  misconceptions:
    - 误以为撒哈拉以南非洲全部位于南半球，实际大部分位于北半球
    - 东西两侧大洋混淆，如把东侧说成大西洋
    - 认为该地区完全处于热带，忽略南部非洲有亚热带气候
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:文化多样性
  type: Concept
  subject: 地理
  title: 文化多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将文化多样性仅理解为美食、服饰差异，忽略语言、宗教、价值观等深层差异
    - 能指出并纠正这一错误：认为全球化会自然消除文化多样性，因此倡导强势文化同化弱势文化
  aliases:
    - 文化多元性
  category: 文化
  explanation: 文化多样性是指不同民族、地区文化的差异性和丰富性，是人类共同遗产。
  misconceptions:
    - 将文化多样性仅理解为美食、服饰差异，忽略语言、宗教、价值观等深层差异
    - 认为全球化会自然消除文化多样性，因此倡导强势文化同化弱势文化
    - 把文化多样性混同于生物多样性，误以为无需人类活动干预就永远存在
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:新能源汽车
  type: Concept
  subject: 地理
  title: 新能源汽车
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为新能源汽车完全不排放二氧化碳，忽略电力可能来自火力发电。
    - 能指出并纠正这一错误：认为只要用电池就是新能源汽车，混淆混合动力汽车与传统燃油车加装电池的概念。
  aliases: []
  category: 交通工具
  explanation: 使用新能源（如电力）的汽车，减少二氧化碳排放，具有环境效益。
  misconceptions:
    - 误以为新能源汽车完全不排放二氧化碳，忽略电力可能来自火力发电。
    - 认为只要用电池就是新能源汽车，混淆混合动力汽车与传统燃油车加装电池的概念。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:日本多火山地震
  type: Concept
  subject: 地理
  title: 日本多火山地震
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为日本位于地中海-喜马拉雅火山地震带，实际位于环太平洋火山地震带。
    - 能指出并纠正这一错误：认为日本地震多发是因为位于亚欧板块内部，实际位于板块交界处。
  aliases:
    - 日本火山地震
  category: 自然灾害
  explanation: 日本地处环太平洋火山地震带，地壳不稳定，火山活动频繁，地震多发。
  misconceptions:
    - 误以为日本位于地中海-喜马拉雅火山地震带，实际位于环太平洋火山地震带。
    - 认为日本地震多发是因为位于亚欧板块内部，实际位于板块交界处。
    - 混淆地震与火山，认为富士山是死火山，实际是活火山。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本工业的分布
  type: Concept
  subject: 地理
  title: 日本工业的分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将日本工业带误认为分布在日本海沿岸，忽视濑户内海沿岸。
    - 能指出并纠正这一错误：以为工业布局接近原料产地，实际原料多依赖进口，工业临海。
  aliases:
    - 日本工业带
  category: 工业分布
  explanation: 日本工业集中分布在太平洋沿岸和濑户内海沿岸，形成太平洋沿岸工业带。
  misconceptions:
    - 将日本工业带误认为分布在日本海沿岸，忽视濑户内海沿岸。
    - 以为工业布局接近原料产地，实际原料多依赖进口，工业临海。
    - 把北九州工业区归入太平洋沿岸，实际它位于濑户内海沿岸。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的农业特点
  type: Concept
  subject: 地理
  title: 日本的农业特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为日本农业以大型机械化为主，实际是小型机械精耕细作。
    - 能指出并纠正这一错误：误以为日本人均耕地多、产量低，实际人均少但单产高。
  aliases:
    - 日本农业
  category: 农业
  explanation: 日本地少人多，人均耕地少，农业机械小型化，精耕细作，单位面积产量高。
  misconceptions:
    - 认为日本农业以大型机械化为主，实际是小型机械精耕细作。
    - 误以为日本人均耕地多、产量低，实际人均少但单产高。
    - 把水稻主产区说成北海道，实际集中在本州南部等地。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的地形特点
  type: Concept
  subject: 地理
  title: 日本的地形特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为山地丘陵占日本面积1/4，实际约占3/4。
    - 能指出并纠正这一错误：认为日本平原广阔，实际平原狭小且仅分布在沿海。
  aliases:
    - 日本地形
  category: 地形
  explanation: 日本是一个多山的国家，山地、丘陵约占全国陆地面积的3/4，平原狭小，仅分布在沿海地区。
  misconceptions:
    - 误以为山地丘陵占日本面积1/4，实际约占3/4。
    - 认为日本平原广阔，实际平原狭小且仅分布在沿海。
    - 把富士山只当作普通山地，忽略其火山形态。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的地理位置
  type: Concept
  subject: 地理
  title: 日本的地理位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说日本位于太平洋东岸，实际位于太平洋西北部。
    - 能指出并纠正这一错误：认为日本自东南向西北延伸，实际自东北向西南延伸。
  aliases:
    - 日本位置
  category: 地理位置
  explanation: 日本位于亚洲东部、太平洋西北部，是一个自东北向西南延伸的岛国。
  misconceptions:
    - 说日本位于太平洋东岸，实际位于太平洋西北部。
    - 认为日本自东南向西北延伸，实际自东北向西南延伸。
    - 将日本称为内陆国家，忘记它是四面环海的岛国。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的工业特点
  type: Concept
  subject: 地理
  title: 日本的工业特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为日本矿产资源丰富，实际贫乏且大量进口。
    - 能指出并纠正这一错误：认为钢铁、汽车产量居世界第一位，实际只是前列。
  aliases:
    - 日本工业
  category: 工业
  explanation: 日本工业现代化程度高，钢铁、汽车、电子等工业产品产量居世界前列，但矿产资源贫乏，对外依赖大。
  misconceptions:
    - 误以为日本矿产资源丰富，实际贫乏且大量进口。
    - 认为钢铁、汽车产量居世界第一位，实际只是前列。
    - 以为日本工业完全自给，忽视了对国际市场的依赖。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的文化特点
  type: Concept
  subject: 地理
  title: 日本的文化特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为日本文化完全等同于唐代中国文化，忽略本土改造。
    - 能指出并纠正这一错误：只强调近代欧美影响，忘记还有长期的中国文化影响。
  aliases:
    - 日本文化
  category: 文化
  explanation: 日本文化既受外来文化影响，又展现民族特性，深受中国唐代文化影响，近代受欧美影响。
  misconceptions:
    - 认为日本文化完全等同于唐代中国文化，忽略本土改造。
    - 只强调近代欧美影响，忘记还有长期的中国文化影响。
    - 误以为日本文化没有自身民族特性，纯属外来汇集。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S2.md
- id: concept:地理:日本的森林资源
  type: Concept
  subject: 地理
  title: 日本的森林资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为日本森林覆盖率仅有1/3，实际达到2/3。
    - 能指出并纠正这一错误：认为工业发达使得日本森林稀少，实际覆盖率很高。
  aliases:
    - 日本森林
  category: 自然资源
  explanation: 日本陆地面积的2/3被森林覆盖，森林资源丰富，重视保护。
  misconceptions:
    - 误以为日本森林覆盖率仅有1/3，实际达到2/3。
    - 认为工业发达使得日本森林稀少，实际覆盖率很高。
    - 以为森林资源丰富就可随意砍伐，忽略日本重视保护。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的气候特征
  type: Concept
  subject: 地理
  title: 日本的气候特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把日本气候说成温带大陆性气候，实际属季风气候。
    - 能指出并纠正这一错误：误以为日本降水稀少，实际降水较多且海洋性强。
  aliases:
    - 日本气候
  category: 气候
  explanation: 日本地处东亚季风区，四面临海，海洋性气候特征明显，冬季较温和，夏季较凉爽，降水较多，为亚热带和温带季风气候。
  misconceptions:
    - 把日本气候说成温带大陆性气候，实际属季风气候。
    - 误以为日本降水稀少，实际降水较多且海洋性强。
    - 认为日本夏季炎热干燥，与地中海气候特点混淆。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的河流特点
  type: Concept
  subject: 地理
  title: 日本的河流特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为河流长而水流平缓，实际日本河流短促、水流急。
    - 能指出并纠正这一错误：认为河流水量小，实际因降水多，水量较丰沛。
  aliases:
    - 日本河流
  category: 水文
  explanation: 日本地形多山，气候降水多，河流短促、水流急，水能资源丰富。
  misconceptions:
    - 误以为河流长而水流平缓，实际日本河流短促、水流急。
    - 认为河流水量小，实际因降水多，水量较丰沛。
    - 忽略水能资源丰富，反而断言日本水能缺乏。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的渔业
  type: Concept
  subject: 地理
  title: 日本的渔业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为北海道渔场是单一寒流或暖流形成，实际是寒暖流交汇。
    - 能指出并纠正这一错误：错误认为北海道渔场位于大西洋，实际在太平洋西北部。
  aliases:
    - 日本渔业
  category: 渔业
  explanation: 日本渔业兴盛，北海道渔场是世界四大渔场之一，位于寒暖流交汇处。
  misconceptions:
    - 误以为北海道渔场是单一寒流或暖流形成，实际是寒暖流交汇。
    - 错误认为北海道渔场位于大西洋，实际在太平洋西北部。
    - 将渔业兴盛归因于沿海污染少，忽略寒暖流交汇因素。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:日本的领土组成
  type: Concept
  subject: 地理
  title: 日本的领土组成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉四国岛，误以为日本由三大岛组成。
    - 能指出并纠正这一错误：把冲绳岛当作四大岛之一，实际是附近小岛。
  aliases:
    - 日本领土
  category: 领土组成
  explanation: 日本由北海道岛、本州岛、四国岛、九州岛4个大岛和附近许多小岛组成。
  misconceptions:
    - 漏掉四国岛，误以为日本由三大岛组成。
    - 把冲绳岛当作四大岛之一，实际是附近小岛。
    - 搞错大岛位置，以为北海道在南、九州在北。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:时间差异
  type: Concept
  subject: 地理
  title: 时间差异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为东边时间总比西边晚，实际东边更早看到日出，时间更早
    - 能指出并纠正这一错误：计算时间差时，误把东经度数相加，实际同在东经应相减
  aliases:
    - 地方时差异
  category: 地理规律
  explanation: 由于地球不停地自转，地球上偏东的地点比偏西的地点先看到日出，所以地球上不同经度的地方，时间是不同的。
  misconceptions:
    - 误认为东边时间总比西边晚，实际东边更早看到日出，时间更早
    - 计算时间差时，误把东经度数相加，实际同在东经应相减
    - 忽略经度相差15度时间差1小时，误以为相差1度差1小时
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:昆仑站
  type: Concept
  subject: 地理
  title: 昆仑站
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为昆仑站位于南极点，实际建在南极冰盖最高地区
    - 能指出并纠正这一错误：混淆昆仑站与中山站、长城站的位置（沿海vs内陆）
  aliases: []
  category: 地理事实
  explanation: 昆仑站是我国首个南极内陆科学考察站，位于南极内陆冰盖海拔最高地区，海拔4000多米，气候极端。
  misconceptions:
    - 误认为昆仑站位于南极点，实际建在南极冰盖最高地区
    - 混淆昆仑站与中山站、长城站的位置（沿海vs内陆）
    - 认为昆仑站海拔只有2000米，实际超过4000米
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:昼夜更替
  type: Concept
  subject: 地理
  title: 昼夜更替
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为昼夜更替的原因是地球公转，实际是自转
    - 能指出并纠正这一错误：认为地球上所有地区都有昼夜更替，忽略极昼极夜地区
  aliases:
    - 昼夜交替
  category: 地理现象
  explanation: 由于地球不停地自转，昼夜也就不断地更替，使地球上绝大部分地区的人们形成了“日出而作、日落而息”的作息规律。
  misconceptions:
    - 误以为昼夜更替的原因是地球公转，实际是自转
    - 认为地球上所有地区都有昼夜更替，忽略极昼极夜地区
    - 把昼夜更替说成地球自转产生了四季，混淆自转与公转的影响
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:昼夜长短变化
  type: Concept
  subject: 地理
  title: 昼夜长短变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为冬至日全球都昼短夜长，忽略了南半球是昼长夜短。
    - 能指出并纠正这一错误：认为赤道地区也有明显的昼夜长短变化，实际终年昼夜平分。
  aliases: []
  category: 地理现象
  explanation: 由于地轴倾斜和公转，太阳直射点移动导致各地昼夜长短变化。
  misconceptions:
    - 认为冬至日全球都昼短夜长，忽略了南半球是昼长夜短。
    - 认为赤道地区也有明显的昼夜长短变化，实际终年昼夜平分。
    - 认为纬度越高昼夜长短变化越小，实际变化越大（两极有极昼极夜）。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:普速铁路
  type: Concept
  subject: 地理
  title: 普速铁路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把普速铁路等同于已淘汰的铁路，忽视普速铁路仍在承担大量客货运任务。
    - 能指出并纠正这一错误：误以为普速铁路速度一定低于100km/h，实际普速铁路一般指时速160km以下，包括部分快速列车…
  aliases: []
  category: 交通运输
  explanation: 普通速度的铁路，与高速铁路相对，速度较慢。
  misconceptions:
    - 把普速铁路等同于已淘汰的铁路，忽视普速铁路仍在承担大量客货运任务。
    - 误以为普速铁路速度一定低于100km/h，实际普速铁路一般指时速160km以下，包括部分快速列车。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:景观保护与规划
  type: Concept
  subject: 地理
  title: 景观保护与规划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为保护既有景观就是禁止一切新建和改建。
    - 能指出并纠正这一错误：把规划景观当作完全推倒重建，不保留任何历史要素。
  aliases:
    - 景观协调
  category: 地理原则
  explanation: 在城乡发展中应妥善处理既有景观与规划景观的关系，保护历史价值和文化特色。
  misconceptions:
    - 认为保护既有景观就是禁止一切新建和改建。
    - 把规划景观当作完全推倒重建，不保留任何历史要素。
    - 误以为景观保护只针对乡村，城镇无需规划保护。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:智能物料处理仓
  type: Concept
  subject: 地理
  title: 智能物料处理仓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为智能物料处理仓就是普通仓库加上电脑，忽略5G网络和自动配送的核心。
    - 能指出并纠正这一错误：认为智能物料处理仓能自动完成所有操作，但实际仍需人工进行异常处理和维护。
  aliases: []
  category: 物流技术
  explanation: 利用5G网络实现物料自动、精准、高效配送的仓储系统。
  misconceptions:
    - 误以为智能物料处理仓就是普通仓库加上电脑，忽略5G网络和自动配送的核心。
    - 认为智能物料处理仓能自动完成所有操作，但实际仍需人工进行异常处理和维护。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:暖流对沿岸气候的影响
  type: Concept
  subject: 地理
  title: 暖流对沿岸气候的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为暖流会降温减湿，如误以为北大西洋暖流使北欧寒冷干燥。
    - 能指出并纠正这一错误：以为暖流只增温不增湿，忽略水汽供应，如认为暖流经过的区域必然多雨。
  aliases:
    - 暖流增温增湿
  category: 地理原理
  explanation: 暖流对沿岸地区气候起增温、增湿的作用。
  misconceptions:
    - 认为暖流会降温减湿，如误以为北大西洋暖流使北欧寒冷干燥。
    - 以为暖流只增温不增湿，忽略水汽供应，如认为暖流经过的区域必然多雨。
    - 把暖流影响与寒流颠覆，如认为东澳大利亚暖流使沿岸降水减少。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:本初子午线
  type: Concept
  subject: 地理
  title: 本初子午线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为本初子午线是东西半球的分界线，实际是0°经线
    - 能指出并纠正这一错误：写经度时把0°经线写作0°E或0°W，正确应是0°
  aliases: []
  category: 地理概念
  explanation: 0°经线，是经度的起始线。
  misconceptions:
    - 误认为本初子午线是东西半球的分界线，实际是0°经线
    - 写经度时把0°经线写作0°E或0°W，正确应是0°
    - 误认为本初子午线经过格林尼治天文台原址，但表述为‘穿过’而非‘经过’
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:机器人技术
  type: Concept
  subject: 地理
  title: 机器人技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为机器人技术就是使用工业机器人替代所有人工，忽略其目前只能完成特定任务。
    - 能指出并纠正这一错误：将机器人技术与人工智能完全等同，认为机器人都有自主学习能力。
  aliases: []
  category: 高新技术
  explanation: 利用机器人进行自动化操作，提高生产效率和精准度。
  misconceptions:
    - 误以为机器人技术就是使用工业机器人替代所有人工，忽略其目前只能完成特定任务。
    - 将机器人技术与人工智能完全等同，认为机器人都有自主学习能力。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:机械手臂
  type: Concept
  subject: 地理
  title: 机械手臂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为机械手臂只能做简单重复动作，忽略其能进行精准化操作如焊接、装配等。
    - 能指出并纠正这一错误：把机械手臂等同于人的手臂，认为它可以完全模拟人手的所有灵活性。
  aliases: []
  category: 工业设备
  explanation: 在流水线上进行自动化、精准化、稳定化操作的机器人手臂。
  misconceptions:
    - 误以为机械手臂只能做简单重复动作，忽略其能进行精准化操作如焊接、装配等。
    - 把机械手臂等同于人的手臂，认为它可以完全模拟人手的所有灵活性。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:板块
  type: Concept
  subject: 地理
  title: 板块
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为喜马拉雅山由板块张裂形成，实际是碰撞挤压形成的。
    - 能指出并纠正这一错误：误认为板块边界与国界线一致，如以为中国西部边界就是板块边界。
  aliases: []
  category: 地质概念
  explanation: 岩石圈被分割成的巨大块体，其运动导致地壳变动。
  misconceptions:
    - 误认为喜马拉雅山由板块张裂形成，实际是碰撞挤压形成的。
    - 误认为板块边界与国界线一致，如以为中国西部边界就是板块边界。
    - 误认为板块内部地壳活跃多火山地震，实际板块交界处更活跃。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:板块交界地带
  type: Concept
  subject: 地理
  title: 板块交界地带
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为板块交界地带只分布在陆地，海洋中不存在。
    - 能指出并纠正这一错误：误以为板块交界地带地壳稳定，火山地震多发生在板块内部。
  aliases:
    - 板块边界
  category: 地理概念
  explanation: 板块交界地带地壳活跃，多火山、地震，也常形成高大的山系。
  misconceptions:
    - 认为板块交界地带只分布在陆地，海洋中不存在。
    - 误以为板块交界地带地壳稳定，火山地震多发生在板块内部。
    - 认为高大的山系位于板块内部，而非板块交界地带。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:板块交界处
  type: Concept
  subject: 地理
  title: 板块交界处
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为板块交界处都是碰撞挤压，误把红海、大西洋中脊当作消亡边界
    - 能指出并纠正这一错误：以为板块交界处仅分布在陆地上，忽略大洋中脊和海底断层也属于交界地带
  aliases:
    - 板块边界
  category: 地理概念
  explanation: 板块与板块的交界地带，地壳活动频繁，多火山地震。
  misconceptions:
    - 认为板块交界处都是碰撞挤压，误把红海、大西洋中脊当作消亡边界
    - 以为板块交界处仅分布在陆地上，忽略大洋中脊和海底断层也属于交界地带
    - 把日本地震归因于亚欧板块与美洲板块碰撞，实际应为亚欧板块与太平洋板块
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:板块内部
  type: Concept
  subject: 地理
  title: 板块内部
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为板块内部完全无火山地震，误以为塔里木盆地永远不会发生地震
    - 能指出并纠正这一错误：忽视板块内部也有缓慢地壳运动，误以为青藏高原抬升是板块挤压造成的
  aliases: []
  category: 地理概念
  explanation: 板块内部相对稳定，地壳活动较少。
  misconceptions:
    - 认为板块内部完全无火山地震，误以为塔里木盆地永远不会发生地震
    - 忽视板块内部也有缓慢地壳运动，误以为青藏高原抬升是板块挤压造成的
    - 看到内陆地震就强行归因于板块边界，如把汶川地震当作板块交界附近事件
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:板块构造学说
  type: Concept
  subject: 地理
  title: 板块构造学说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为板块构造学说等同于大陆漂移说，忽略其强调板块整体运动及海底扩张
    - 能指出并纠正这一错误：认为板块只有大陆地壳，忽视板块包括海洋地壳和上部地幔的岩石圈
  aliases: []
  category: 地理学说
  explanation: 现代地质学理论，认为地球岩石圈由板块组成，板块运动导致海陆变迁、火山地震等。
  misconceptions:
    - 误认为板块构造学说等同于大陆漂移说，忽略其强调板块整体运动及海底扩张
    - 认为板块只有大陆地壳，忽视板块包括海洋地壳和上部地幔的岩石圈
    - 将板块张裂说成碰撞，误以为大西洋在缩小、地中海在扩大
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:板状根
  type: Concept
  subject: 地理
  title: 板状根
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为板状根是储存水分用的，实际是支撑和呼吸作用。
    - 能指出并纠正这一错误：误判板状根为热带草原植被，实际是热带雨林现象。
  aliases: []
  category: 自然地理
  explanation: 板状根是热带雨林地区的一种独特现象，是树木的根系向地面隆起形成的板状结构。
  misconceptions:
    - 误以为板状根是储存水分用的，实际是支撑和呼吸作用。
    - 误判板状根为热带草原植被，实际是热带雨林现象。
    - 把板状根等同气生根，混淆了根的类型。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:极地地区
  type: Concept
  subject: 地理
  title: 极地地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北极地区是世界上最冷的地区，实际南极地区更冷
    - 能指出并纠正这一错误：混淆极地范围，把北极圈以外的地区也算作北极地区
  aliases: []
  category: 地理区域
  explanation: 包括南极地区和北极地区，是地球上极其寒冷的地区，南极地区是世界上最冷、风力最强和最多风的地区。
  misconceptions:
    - 误认为北极地区是世界上最冷的地区，实际南极地区更冷
    - 混淆极地范围，把北极圈以外的地区也算作北极地区
    - 认为南极和北极的冷热程度相同，忽略南极地势高、冰盖反射
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:极地环境指示作用
  type: Concept
  subject: 地理
  title: 极地环境指示作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'指示作用'误解为'决定性作用'，认为极地环境变化直接控制全球气候
    - 能指出并纠正这一错误：误认为极地环境变化只反映当地情况，不会影响全球环境监测
  aliases:
    - 极地环境变化
  category: 地理概念
  explanation: 极地地区自然环境的变化是地球自然环境变化的“晴雨表”，对全球环境有重要指示作用。
  misconceptions:
    - 将'指示作用'误解为'决定性作用'，认为极地环境变化直接控制全球气候
    - 误认为极地环境变化只反映当地情况，不会影响全球环境监测
    - 混淆因果关系，认为全球环境变化导致极地变化，而极地变化不能反映全球
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:极地生态系统脆弱性
  type: Concept
  subject: 地理
  title: 极地生态系统脆弱性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为极地生物种类少，生态系统相对稳定，不易受破坏
    - 能指出并纠正这一错误：忽视极地生态自我修复能力弱，认为受损后可以快速恢复
  aliases:
    - 极地生态系统脆弱
  category: 地理概念
  explanation: 极地地区生态系统脆弱，易受外界干扰，自我修复能力有限，容易造成生态破坏。
  misconceptions:
    - 误认为极地生物种类少，生态系统相对稳定，不易受破坏
    - 忽视极地生态自我修复能力弱，认为受损后可以快速恢复
    - 认为极地气候寒冷，人类活动无法造成生态破坏
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:极地科学考察
  type: Concept
  subject: 地理
  title: 极地科学考察
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄河站是南极科考站，实际黄河站位于北极
    - 能指出并纠正这一错误：混淆长城站、中山站、昆仑站的位置（如认为昆仑站在南极半岛）
  aliases:
    - 极地科考
  category: 地理事实
  explanation: 人类对极地地区开展了广泛的科学考察，我国自20世纪80年代起在南极建立多个科考站，并在北极建立黄河站等。
  misconceptions:
    - 误认为黄河站是南极科考站，实际黄河站位于北极
    - 混淆长城站、中山站、昆仑站的位置（如认为昆仑站在南极半岛）
    - 认为我国科考站建站时间最早在21世纪，实际20世纪80年代起
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:极昼和极夜
  type: Concept
  subject: 地理
  title: 极昼和极夜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北极圈夏至出现极夜，实际是极昼，冬至才是极夜。
    - 能指出并纠正这一错误：以为只有南北极点才有极昼极夜，实际上极圈内所有纬度都有。
  aliases:
    - 极昼
    - 极夜
  category: 地理现象
  explanation: 在极圈内，一天24小时都是白天（极昼）或黑夜（极夜）的现象，分别出现在夏至和冬至。
  misconceptions:
    - 误认为北极圈夏至出现极夜，实际是极昼，冬至才是极夜。
    - 以为只有南北极点才有极昼极夜，实际上极圈内所有纬度都有。
    - 把极昼理解为太阳一整天在头顶，实际上太阳高度很低。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S5.md
- id: concept:地理:极昼和极夜现象
  type: Concept
  subject: 地理
  title: 极昼和极夜现象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为整个极圈内一年中全是极昼或极夜，实际仅在极点附近持续半年
    - 能指出并纠正这一错误：混淆极昼极夜发生地点，认为地球上所有高纬度地区都有此现象
  aliases:
    - 极昼
    - 极夜
  category: 地理概念
  explanation: 极圈及其以内的极地地区有极昼和极夜现象，极昼时太阳不落到地平线以下。
  misconceptions:
    - 误认为整个极圈内一年中全是极昼或极夜，实际仅在极点附近持续半年
    - 混淆极昼极夜发生地点，认为地球上所有高纬度地区都有此现象
    - 误以为极昼期间太阳高度角始终不变，实际上仍有日变化
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S5.md
- id: concept:地理:树种评价指标
  type: Concept
  subject: 地理
  title: 树种评价指标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为评价树种只看生长速度，忽视适应性和景观特性。
    - 能指出并纠正这一错误：把每项评分简单相加比较，而不分项独立评价。
  aliases: []
  category: 地理知识
  explanation: 评价树种优劣的指标包括适应性、景观特性和遮阴功能，每项分3个等级评分。
  misconceptions:
    - 误以为评价树种只看生长速度，忽视适应性和景观特性。
    - 把每项评分简单相加比较，而不分项独立评价。
    - 认为等级分值越高树种越优，实际等级含义可能相反。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:植树造林
  type: Concept
  subject: 地理
  title: 植树造林
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为植树造林能完全拦住洪水，实际是延缓洪水形成、削减洪峰
    - 能指出并纠正这一错误：认为植树造林只美化环境，忽视其涵养水源、保持水土的功能
  aliases: []
  category: 防治措施
  explanation: 植树造林可以涵养水源、保持水土，延缓洪水形成、削减洪峰，减少泥沙淤积。
  misconceptions:
    - 误以为植树造林能完全拦住洪水，实际是延缓洪水形成、削减洪峰
    - 认为植树造林只美化环境，忽视其涵养水源、保持水土的功能
    - 将植树造林与砍伐森林的作用颠倒，砍伐会增加洪涝风险
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:欧元区
  type: Concept
  subject: 地理
  title: 欧元区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有欧盟成员国都使用欧元，实际部分国家未加入欧元区
    - 能指出并纠正这一错误：混淆'欧元区'与'欧洲联盟'，把两者看作同一组织
  aliases: []
  category: 经济区域
  explanation: 欧盟内使用统一货币欧元的国家组成的区域，截至2023年8月共有20个国家。
  misconceptions:
    - 误认为所有欧盟成员国都使用欧元，实际部分国家未加入欧元区
    - 混淆'欧元区'与'欧洲联盟'，把两者看作同一组织
    - 认为欧元区范围固定不变，忽略国家可能加入或退出
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S4.md
- id: concept:地理:欧洲
  type: Concept
  subject: 地理
  title: 欧洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为欧洲是世界面积最小的洲，忽略大洋洲更小
    - 能指出并纠正这一错误：误把苏伊士运河作为欧洲与非洲分界线
  aliases: []
  category: 地理区域
  explanation: 欧洲是世界第六大洲。
  misconceptions:
    - 误认为欧洲是世界面积最小的洲，忽略大洋洲更小
    - 误把苏伊士运河作为欧洲与非洲分界线
    - 认为欧洲全部位于温带，忽略北部北极圈内为寒带
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:欧洲联盟
  type: Concept
  subject: 地理
  title: 欧洲联盟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有欧洲国家都是欧盟成员国，实际包括英国等已脱欧
    - 能指出并纠正这一错误：混淆'欧洲'与'欧盟'，将地理范围与政治组织混为一谈
  aliases:
    - 欧盟
  category: 区域合作
  explanation: 欧洲联盟是欧洲西部形成的区域性合作组织，截至2025年有27个成员国。
  misconceptions:
    - 误认为所有欧洲国家都是欧盟成员国，实际包括英国等已脱欧
    - 混淆'欧洲'与'欧盟'，将地理范围与政治组织混为一谈
    - 认为欧盟只能在欧洲，忽略其与其他地区也有合作
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:欧洲西部位置与范围
  type: Concept
  subject: 地理
  title: 欧洲西部位置与范围
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为欧洲西部就是西欧，不包括南欧、北欧和中欧。
    - 能指出并纠正这一错误：误以为欧洲西部东临大西洋，实际东面是亚洲，西临大西洋。
  aliases:
    - 欧洲西部地理位置
  category: 区域地理
  explanation: 欧洲西部指欧洲西半部，三面临海，包括南欧、西欧、北欧和中欧。
  misconceptions:
    - 误认为欧洲西部就是西欧，不包括南欧、北欧和中欧。
    - 误以为欧洲西部东临大西洋，实际东面是亚洲，西临大西洋。
    - 误认为欧洲西部北临地中海，实际北临北冰洋，地中海在南面。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:欧洲西部旅游业
  type: Concept
  subject: 地理
  title: 欧洲西部旅游业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为欧洲西部旅游业只靠自然风光，忽略丰富的人文旅游资源。
    - 能指出并纠正这一错误：误以为所有欧洲西部国家都靠旅游业为支柱，如卢森堡并非如此。
  aliases: []
  category: 经济地理
  explanation: 欧洲西部自然和人文旅游资源丰富，旅游业发达，是国民经济重要支柱。
  misconceptions:
    - 误认为欧洲西部旅游业只靠自然风光，忽略丰富的人文旅游资源。
    - 误以为所有欧洲西部国家都靠旅游业为支柱，如卢森堡并非如此。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:欧洲西部经济
  type: Concept
  subject: 地理
  title: 欧洲西部经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为欧洲西部经济落后，主要依赖农业，实际是发达地区。
    - 能指出并纠正这一错误：误以为欧盟所有成员国都使用欧元，如瑞典仍用克朗。
  aliases: []
  category: 经济地理
  explanation: 欧洲西部是世界经济发达地区之一，工业、农业、服务业均高度发达，对外贸易重要。
  misconceptions:
    - 误认为欧洲西部经济落后，主要依赖农业，实际是发达地区。
    - 误以为欧盟所有成员国都使用欧元，如瑞典仍用克朗。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:欧盟
  type: Concept
  subject: 地理
  title: 欧盟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为欧盟就是欧洲，实际上欧洲还有许多非欧盟国家。
    - 能指出并纠正这一错误：误以为欧盟是一个国家，实为区域性经济政治组织。
  aliases:
    - 欧洲联盟
  category: 国际组织
  explanation: 欧洲联盟的简称，实行共同经济政策，建立货币联盟，推动科技合作，并向外交、安全等领域拓展。
  misconceptions:
    - 误认为欧盟就是欧洲，实际上欧洲还有许多非欧盟国家。
    - 误以为欧盟是一个国家，实为区域性经济政治组织。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:比例尺
  type: Concept
  subject: 地理
  title: 比例尺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：比例尺计算时单位不统一，如1厘米代表1千米直接写成1:1000，应为1:100000
    - 能指出并纠正这一错误：误认为比例尺越大，表示的范围越大，实际范围越小
  aliases: []
  category: 地理概念
  explanation: 图上距离与实地距离的比值，表示地图缩小的程度。
  misconceptions:
    - 比例尺计算时单位不统一，如1厘米代表1千米直接写成1:1000，应为1:100000
    - 误认为比例尺越大，表示的范围越大，实际范围越小
    - 把比例尺当成图上距离与实际距离的比值，忘记先统一单位
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:民族分布
  type: Concept
  subject: 地理
  title: 民族分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为少数民族集中分布在边疆，忽略内地也有散居的少数民族。
    - 能指出并纠正这一错误：把民族分布特点‘大散居、小聚居、交错杂居’简单理解为‘均匀分布’。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 误认为少数民族集中分布在边疆，忽略内地也有散居的少数民族。
    - 把民族分布特点‘大散居、小聚居、交错杂居’简单理解为‘均匀分布’。
    - 混淆民族分布与人口分界线（黑河—腾冲线），认为少数民族都在该线以西。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:气候
  type: Concept
  subject: 地理
  title: 气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用‘今天气候晴朗’描述天气，混淆天气与气候
    - 能指出并纠正这一错误：认为气候只由气温决定，忽视降水要素
  aliases: []
  category: 地理概念
  explanation: 一个地区多年的平均天气状况，气温和降水是气候的两个基本要素。
  misconceptions:
    - 用‘今天气候晴朗’描述天气，混淆天气与气候
    - 认为气候只由气温决定，忽视降水要素
    - 把气候说成‘短时间的大气状况’
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:气候与人类活动的关系
  type: Concept
  subject: 地理
  title: 气候与人类活动的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘气候’当作‘天气’，说‘今天气候炎热’。
    - 能指出并纠正这一错误：认为建筑风格只由气候决定，忽视当地文化和技术影响。
  aliases: []
  category: 地理
  explanation: 气候影响人类的生产和生活，如建筑特点、活动安排等；人类活动也影响气候。
  misconceptions:
    - 将‘气候’当作‘天气’，说‘今天气候炎热’。
    - 认为建筑风格只由气候决定，忽视当地文化和技术影响。
    - 觉得人类只能适应气候，不可能通过植树、排放等活动影响气候。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:气候垂直变化
  type: Concept
  subject: 地理
  title: 气候垂直变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为海拔越高气温越高，实际每升高1000米气温约降6℃。
    - 能指出并纠正这一错误：将垂直带谱与纬度带混淆，认为同一垂直带谱在各地完全相同。
  aliases:
    - 垂直地带性
  category: 气候特征
  explanation: 在高山地区，随着海拔的升高，气温和降水等气候要素发生有规律的变化，形成垂直气候带。
  misconceptions:
    - 误以为海拔越高气温越高，实际每升高1000米气温约降6℃。
    - 将垂直带谱与纬度带混淆，认为同一垂直带谱在各地完全相同。
    - 只看气温变化，忽略降水对垂直带谱的影响，导致判断出错。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:气候对农业生产的影响
  type: Concept
  subject: 地理
  title: 气候对农业生产的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为气候只影响作物种类，忽略还影响熟制和收成。
    - 能指出并纠正这一错误：把地形对农业的影响归因为气候，如梯田是气候所致。
  aliases:
    - 气候对农业的影响
  category: 气候与人类活动
  explanation: 气候对农业影响显著，决定适宜种植的作物和牲畜，影响耕作制度和收成。
  misconceptions:
    - 认为气候只影响作物种类，忽略还影响熟制和收成。
    - 把地形对农业的影响归因为气候，如梯田是气候所致。
    - 误认为所有地区都适合种植喜热作物，不考虑当地热量条件。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:气候对工业的影响
  type: Concept
  subject: 地理
  title: 气候对工业的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为工业完全不受气候影响，只考虑原料和劳动力，忽略气温降水的作用。
    - 能指出并纠正这一错误：误以为气候只影响露天工业，不考虑仓库存储和运输环节的风雨影响。
  aliases: []
  category: 地理原理
  explanation: 工厂选址、生产过程、运输等受气温、降水、风等气候因素影响，露天工业尤为显著。
  misconceptions:
    - 认为工业完全不受气候影响，只考虑原料和劳动力，忽略气温降水的作用。
    - 误以为气候只影响露天工业，不考虑仓库存储和运输环节的风雨影响。
    - 把电子厂选址在潮湿闷热地区却不觉有隐患，忽视湿度对精密度的高要求。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:气候对生活的影响
  type: Concept
  subject: 地理
  title: 气候对生活的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只想到衣着，忽略传统民居墙壁厚度等建筑特征。
    - 能指出并纠正这一错误：把气候对生活的影响与气候灾害混为一谈，如台风影响。
  aliases: []
  category: 气候与人类活动
  explanation: 气候影响人们的日常生活，如传统民居的墙壁厚度等。
  misconceptions:
    - 只想到衣着，忽略传统民居墙壁厚度等建筑特征。
    - 把气候对生活的影响与气候灾害混为一谈，如台风影响。
    - 误以为气候只影响南方，北方生活不受影响。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:气候异常
  type: Concept
  subject: 地理
  title: 气候异常
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把某天突然降温说成气候异常，混淆了天气与气候的区别。
    - 能指出并纠正这一错误：误以为气候异常只指降水异常，其实气温、风等要素偏离常态也算。
  aliases:
    - 气候灾害
  category: 地理概念
  explanation: 气候异常指气候要素偏离常态，可能引发洪涝、干旱、寒潮等灾害。
  misconceptions:
    - 把某天突然降温说成气候异常，混淆了天气与气候的区别。
    - 误以为气候异常只指降水异常，其实气温、风等要素偏离常态也算。
    - 认为气候异常必然导致灾害，忽略灾害还取决于承灾体的脆弱性。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:气候异常与灾害
  type: Concept
  subject: 地理
  title: 气候异常与灾害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为气候异常一定会造成洪涝干旱，忽视监测和防御可以减轻损失。
    - 能指出并纠正这一错误：误以为洪涝干旱等灾害全由气候异常决定，与人类活动无关。
  aliases: []
  category: 地理概念
  explanation: 气候异常可能导致洪涝、干旱、寒潮等灾害，需加强监测以减少损失。
  misconceptions:
    - 认为气候异常一定会造成洪涝干旱，忽视监测和防御可以减轻损失。
    - 误以为洪涝干旱等灾害全由气候异常决定，与人类活动无关。
    - 将气候异常和气象灾害视为同一概念，未分清原因和结果的关系。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:气候类型
  type: Concept
  subject: 地理
  title: 气候类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将温带季风气候与亚热带季风气候分界误记为长城一线
    - 能指出并纠正这一错误：认为我国只有季风气候，忽略大陆性气候和高原山地气候
  aliases:
    - 气候带
  category: 地理概念
  explanation: 根据气温和降水等特征划分的气候类别，我国主要有五种气候类型。
  misconceptions:
    - 将温带季风气候与亚热带季风气候分界误记为长城一线
    - 认为我国只有季风气候，忽略大陆性气候和高原山地气候
    - 把温度带当作气候类型，如说‘暖温带气候’
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:气候类型复杂多样
  type: Concept
  subject: 地理
  title: 气候类型复杂多样
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为气候复杂多样表示全国无规律可循，无法分类
    - 能指出并纠正这一错误：把复杂多样原因仅归结为纬度广，忽视地形和海陆因素
  aliases: []
  category: 地理特征
  explanation: 中国气候类型复杂多样，不同地区气温和降水组合不同，形成多种气候类型。
  misconceptions:
    - 认为气候复杂多样表示全国无规律可循，无法分类
    - 把复杂多样原因仅归结为纬度广，忽视地形和海陆因素
    - 误以为各地气候完全不同，没有相似性
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:气候资源
  type: Concept
  subject: 地理
  title: 气候资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为气候资源可再生因此可无限使用，忽略利用方式和强度的影响。
    - 能指出并纠正这一错误：把气候资源等同于天气状况，没意识到它是可开发利用的自然资源。
  aliases: []
  category: 地理概念
  explanation: 指光能、热量、水分、风能等可再生的气候资源，与化石燃料相比可再生且无污染。
  misconceptions:
    - 误认为气候资源可再生因此可无限使用，忽略利用方式和强度的影响。
    - 把气候资源等同于天气状况，没意识到它是可开发利用的自然资源。
    - 以为风能、太阳能不属于气候资源，但其根本来自气候要素的能量。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:气温
  type: Concept
  subject: 地理
  title: 气温
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把气温等同于地面温度，认为地面热就是气温高
    - 能指出并纠正这一错误：以为气温是太阳辐射强度，阴天时气温计读数为零
  aliases:
    - 温度
  category: 气候要素
  explanation: 气温是表示大气冷热程度的物理量，是气候的基本要素之一。
  misconceptions:
    - 把气温等同于地面温度，认为地面热就是气温高
    - 以为气温是太阳辐射强度，阴天时气温计读数为零
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:气温年变化
  type: Concept
  subject: 地理
  title: 气温年变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北半球陆地最高气温出现在夏至日，实际在7月
    - 能指出并纠正这一错误：把南半球陆地最低气温记在1月，实际南半球最低在7月
  aliases: []
  category: 气候概念
  explanation: 气温在一年中的变化称为气温年变化。北半球陆地月平均最低气温出现在1月，最高气温出现在7月。
  misconceptions:
    - 认为北半球陆地最高气温出现在夏至日，实际在7月
    - 把南半球陆地最低气温记在1月，实际南半球最低在7月
    - 误以为海洋与陆地最高气温月份相同，实际海洋滞后
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:气温年变化曲线图
  type: Concept
  subject: 地理
  title: 气温年变化曲线图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：读气温曲线图时，把横轴当气温，纵轴当月份
    - 能指出并纠正这一错误：只看曲线最高点就判断为7月，不分南北半球
  aliases:
    - 气温曲线图
  category: 地理技能
  explanation: 用横轴表示月份、纵轴表示气温，将各月平均气温用点标出并用平滑曲线连接，以反映气温的年变化。
  misconceptions:
    - 读气温曲线图时，把横轴当气温，纵轴当月份
    - 只看曲线最高点就判断为7月，不分南北半球
    - 把各月气温点用直线连接，使曲线不平滑
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:气温日变化
  type: Concept
  subject: 地理
  title: 气温日变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一天中气温最高在正午12点，因太阳辐射最强
    - 能指出并纠正这一错误：把最低气温出现时间记为深夜，实际是日出前后
  aliases: []
  category: 气候概念
  explanation: 气温在一天中的变化称为气温日变化。一天中陆地气温最高值出现在午后2时左右，最低值出现在日出前后。
  misconceptions:
    - 认为一天中气温最高在正午12点，因太阳辐射最强
    - 把最低气温出现时间记为深夜，实际是日出前后
    - 混淆气温日变化与年变化，用1月7月说明日变化
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:气象灾害
  type: Concept
  subject: 地理
  title: 气象灾害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为台风、寒潮属于地质灾害，实际是气象灾害
    - 能指出并纠正这一错误：认为气象灾害只由天气引起，与人类活动无关，实际过度砍伐等会加剧
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 误以为台风、寒潮属于地质灾害，实际是气象灾害
    - 认为气象灾害只由天气引起，与人类活动无关，实际过度砍伐等会加剧
    - 误以为气象灾害与地质灾害互不相关，实际可能互相诱发，如暴雨引发泥石流
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:气象灾害预警级别
  type: Concept
  subject: 地理
  title: 气象灾害预警级别
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为红色预警级别最低，实际红色为最高级别
    - 能指出并纠正这一错误：记错预警颜色顺序，实际自低到高为蓝、黄、橙、红
  aliases: []
  category: 防护技能
  explanation: 气象灾害预警通常设置蓝、黄、橙、红四个级别，分别代表一般、较重、严重、特别严重。
  misconceptions:
    - 误以为红色预警级别最低，实际红色为最高级别
    - 记错预警颜色顺序，实际自低到高为蓝、黄、橙、红
    - 认为预警级别数字越大越严重，实际颜色代表级别
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S2.md
- id: concept:地理:水利枢纽工程
  type: Concept
  subject: 地理
  title: 水利枢纽工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为水利枢纽工程就是建水库，实际包括堤坝、溢洪道等设施
    - 能指出并纠正这一错误：认为水利枢纽工程只用于防洪，实际还可发电、灌溉等
  aliases: []
  category: 防治措施
  explanation: 水利枢纽工程通过建设堤坝、溢洪道、蓄滞分洪区等，发挥拦洪滞洪、削峰错峰作用。
  misconceptions:
    - 误以为水利枢纽工程就是建水库，实际包括堤坝、溢洪道等设施
    - 认为水利枢纽工程只用于防洪，实际还可发电、灌溉等
    - 误以为削峰错峰是减少洪水总量，实际削峰指削减洪峰流量，错峰指错开洪峰时间
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:水污染
  type: Concept
  subject: 地理
  title: 水污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水污染就是工业废水，忽略农业和生活污水。
    - 能指出并纠正这一错误：认为水污染只影响水体，不影响水生生物和人体健康。
  aliases: []
  category: 环境问题
  explanation: 部分工厂、企业和城乡居民将未经处理的污水直接排入河流湖泊造成的水体污染，防治措施包括污水处理和河湖治理。
  misconceptions:
    - 认为水污染就是工业废水，忽略农业和生活污水。
    - 认为水污染只影响水体，不影响水生生物和人体健康。
    - 解决水污染只靠污水处理厂，忽视源头减排。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:水系和流域
  type: Concept
  subject: 地理
  title: 水系和流域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把流域说成河流的干支流，如‘长江流域是长江干支流’
    - 能指出并纠正这一错误：误以为分水岭是河流之间的界线，实际是相邻流域山脊
  aliases:
    - 流域
    - 分水岭
  category: 地理概念
  explanation: 干支流组成水系，集水区域为流域，相邻流域以分水岭分隔。
  misconceptions:
    - 把流域说成河流的干支流，如‘长江流域是长江干支流’
    - 误以为分水岭是河流之间的界线，实际是相邻流域山脊
    - 认为水系包括海洋，实际水系只指河流干支流
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:水资源
  type: Concept
  subject: 地理
  title: 水资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把海水当作水资源，忘记通常指陆地淡水。
    - 能指出并纠正这一错误：认为冰川和地下水不属于淡水资源。
  aliases: []
  category: 地理概念
  explanation: 通常指陆地上的淡水资源，由江河及淡水湖泊中的水、高山积雪、冰川以及地下水等组成。
  misconceptions:
    - 把海水当作水资源，忘记通常指陆地淡水。
    - 认为冰川和地下水不属于淡水资源。
    - 混淆水资源和水能资源，前者按水量计，后者按落差与流量计。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:水路运输
  type: Concept
  subject: 地理
  title: 水路运输
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水路运输速度最快，实际最慢。
    - 能指出并纠正这一错误：只认海上运输，忽略内河运输也是水路运输。
  aliases:
    - 水路运输线
  category: 交通运输方式
  explanation: 水路运输包括内河运输和海洋运输，我国已建成干支衔接、通江达海的内河航道体系和五大沿海港口群。
  misconceptions:
    - 认为水路运输速度最快，实际最慢。
    - 只认海上运输，忽略内河运输也是水路运输。
    - 认为我国所有河流冬季都可通航，没有结冰期。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:汉语
  type: Concept
  subject: 地理
  title: 汉语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为汉语是世界上使用范围最广的语言，忘记英语范围更广
    - 能指出并纠正这一错误：以为汉语仅指普通话，不包括粤语、闽南语等方言
  aliases: []
  category: 地理
  explanation: 汉语是世界上作为母语使用人数最多的语言，主要分布在中国。
  misconceptions:
    - 误认为汉语是世界上使用范围最广的语言，忘记英语范围更广
    - 以为汉语仅指普通话，不包括粤语、闽南语等方言
    - 认为汉语母语人数少于英语，搞混人数与范围两个维度
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:河道整治
  type: Concept
  subject: 地理
  title: 河道整治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为河道整治就是清淤，实际还包括治导、护岸等措施
    - 能指出并纠正这一错误：认为河道整治会增加行洪能力，但若过度硬化可能破坏生态
  aliases: []
  category: 防治措施
  explanation: 河道整治通过治导、疏浚和护岸等综合治理措施，稳定河岸，提升行洪能力。
  misconceptions:
    - 误以为河道整治就是清淤，实际还包括治导、护岸等措施
    - 认为河道整治会增加行洪能力，但若过度硬化可能破坏生态
    - 将河道整治与水利枢纽工程混为一谈，前者是河道综合治理
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:法语
  type: Concept
  subject: 地理
  title: 法语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法语只在法国使用，忽略非洲及欧洲部分地区
    - 能指出并纠正这一错误：误以为法语不是联合国工作语言，或把六种漏掉法语
  aliases: []
  category: 地理
  explanation: 法语是联合国工作语言之一，主要分布在法国及非洲、欧洲部分地区。
  misconceptions:
    - 认为法语只在法国使用，忽略非洲及欧洲部分地区
    - 误以为法语不是联合国工作语言，或把六种漏掉法语
    - 把法语使用范围与法国殖民地画等号，不知道现在非洲多国仍通用
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:泛大洋
  type: Concept
  subject: 地理
  title: 泛大洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将泛大洋当作今天的太平洋，忽略它环绕整个泛大陆且面积远大于太平洋
    - 能指出并纠正这一错误：认为泛大洋只存在于南半球，实际它包裹了全球陆地的所有方向
  aliases: []
  category: 地理概念
  explanation: 泛大陆周围环绕的广阔海洋。
  misconceptions:
    - 误将泛大洋当作今天的太平洋，忽略它环绕整个泛大陆且面积远大于太平洋
    - 认为泛大洋只存在于南半球，实际它包裹了全球陆地的所有方向
    - 把泛大洋与现今各大洋混淆，以为大西洋在2亿年前就已经存在
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:泛大陆
  type: Concept
  subject: 地理
  title: 泛大陆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为泛大陆仅包含现在的大陆，忽略古陆还包括未被分开的半岛和岛屿
    - 能指出并纠正这一错误：将泛大陆的形成时间与分裂时间混淆，认为2亿年前是突然分开的时刻
  aliases:
    - 联合古陆
  category: 地理概念
  explanation: 约2亿年前所有大陆连接在一起的超级大陆，又称联合古陆。
  misconceptions:
    - 误以为泛大陆仅包含现在的大陆，忽略古陆还包括未被分开的半岛和岛屿
    - 将泛大陆的形成时间与分裂时间混淆，认为2亿年前是突然分开的时刻
    - 误把泛大陆当作一个板块，忽视它是由多个克拉通组成的超级大陆
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:波斯湾
  type: Concept
  subject: 地理
  title: 波斯湾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为波斯湾位于红海，实际在阿拉伯半岛东侧。
    - 能指出并纠正这一错误：误以为中东石油只分布在波斯湾海底，实际还包括沿岸陆地。
  aliases:
    - Persian Gulf
  category: 地理事物
  explanation: 波斯湾位于中东地区，是世界石油资源最丰富的地区，中东石油主要分布在波斯湾及其沿岸。
  misconceptions:
    - 误认为波斯湾位于红海，实际在阿拉伯半岛东侧。
    - 误以为中东石油只分布在波斯湾海底，实际还包括沿岸陆地。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:泥石流
  type: Concept
  subject: 地理
  title: 泥石流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为泥石流和滑坡是同一现象，泥石流是流动体，滑坡是块体滑动
    - 能指出并纠正这一错误：认为泥石流只发生在雨季，实际地震后也可能暴发
  aliases: []
  category: 地质灾害
  explanation: 泥石流是指山区突然爆发的挟带大量泥沙、石块的洪流，来势凶猛、历时短暂、破坏力强。
  misconceptions:
    - 误以为泥石流和滑坡是同一现象，泥石流是流动体，滑坡是块体滑动
    - 认为泥石流只发生在雨季，实际地震后也可能暴发
    - 将泥石流当作普通洪水，忽略其挟带大量泥沙石块
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:洋中脊
  type: Concept
  subject: 地理
  title: 洋中脊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为洋中脊只分布在太平洋，实际上贯通四大洋
    - 能指出并纠正这一错误：误以为洋中脊没有火山和地震活动
  aliases:
    - 大洋中脊
    - 海岭
  category: 地理概念
  explanation: 洋中脊是伴有火山和地震活动的巨大海底山系，常分布在大洋中央，大致呈南北走向，贯通四大洋。
  misconceptions:
    - 认为洋中脊只分布在太平洋，实际上贯通四大洋
    - 误以为洋中脊没有火山和地震活动
    - 认为洋中脊一定是南北走向，忽略了其他走向的可能
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:洋流对气温的影响
  type: Concept
  subject: 地理
  title: 洋流对气温的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把暖流和寒流方向记反，认为从低纬流向高纬是寒流。
    - 能指出并纠正这一错误：误以为暖流经过地区气温一定低于寒流经过地区，比较同纬度时结论相反。
  aliases: []
  category: 影响因素
  explanation: 同纬度地区，暖流经过气温较高，寒流经过气温较低。
  misconceptions:
    - 把暖流和寒流方向记反，认为从低纬流向高纬是寒流。
    - 误以为暖流经过地区气温一定低于寒流经过地区，比较同纬度时结论相反。
    - 在等温线图上，认为暖流使等温线凸向低纬，实际应凸向高纬。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:洪涝灾害
  type: Concept
  subject: 地理
  title: 洪涝灾害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为洪灾和涝灾相同，洪灾是洪水，涝灾是内涝积水
    - 能指出并纠正这一错误：认为洪涝灾害只发生在河流下游，实际中上游也可能发生洪灾
  aliases:
    - 洪灾
    - 涝灾
  category: 气象灾害
  explanation: 洪涝灾害包括洪灾和涝灾，洪灾是因大雨、融雪等引起洪水泛滥淹没农田、毁坏设施；涝灾是雨量过多或过于集中造成的积水成灾。
  misconceptions:
    - 误以为洪灾和涝灾相同，洪灾是洪水，涝灾是内涝积水
    - 认为洪涝灾害只发生在河流下游，实际中上游也可能发生洪灾
    - 将洪涝灾害一律归为气象灾害，忽视水利工程等人类活动的影响
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:海峡
  type: Concept
  subject: 地理
  title: 海峡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把海峡理解为连接两块陆地的狭窄陆地，与地峡混淆
    - 能指出并纠正这一错误：误将人工开挖的运河等同于天然海峡
  aliases: []
  category: 地理概念
  explanation: 两块陆地之间连接两个海域的狭窄水道叫作海峡。
  misconceptions:
    - 误把海峡理解为连接两块陆地的狭窄陆地，与地峡混淆
    - 误将人工开挖的运河等同于天然海峡
    - 把海湾（如波斯湾）误认为海峡
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:海平面升降
  type: Concept
  subject: 地理
  title: 海平面升降
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将海平面升降归因于人类活动，忽略自然因素
    - 能指出并纠正这一错误：误认为海平面上升仅导致沿海低地淹没，不影响岛屿
  aliases:
    - 海平面变化
  category: 地理概念
  explanation: 造成海陆变迁的第二个原因，海平面上升时沿海低地变为海洋，下降时变为陆地。
  misconceptions:
    - 将海平面升降归因于人类活动，忽略自然因素
    - 误认为海平面上升仅导致沿海低地淹没，不影响岛屿
    - 把海平面下降与地壳抬升混为一谈，看不清原因
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:海底地形分布规律
  type: Concept
  subject: 地理
  title: 海底地形分布规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把顺序记反，从大陆到海洋写成大洋底、大陆坡、大陆架
    - 能指出并纠正这一错误：误以为海沟和岛弧分布在大陆架上
  aliases:
    - 海底地形分布
  category: 地理规律
  explanation: 从大陆边缘到大洋中部，海底依次分布着大陆架、大陆坡和大洋底，大洋底内部又有洋中脊、海盆、海沟、岛弧等。
  misconceptions:
    - 把顺序记反，从大陆到海洋写成大洋底、大陆坡、大陆架
    - 误以为海沟和岛弧分布在大陆架上
    - 认为洋中脊位于大陆边缘而非大洋中部
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:海底地形类型
  type: Concept
  subject: 地理
  title: 海底地形类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆大陆坡与大洋中脊的坡度特征
    - 能指出并纠正这一错误：误以为海沟分布在大陆架边缘，而非大洋边缘
  aliases:
    - 海底地形
  category: 地理概念
  explanation: 海底地形包括大陆架、大陆坡、大洋中脊、海沟、洋盆等。
  misconceptions:
    - 混淆大陆坡与大洋中脊的坡度特征
    - 误以为海沟分布在大陆架边缘，而非大洋边缘
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:海水淡化
  type: Concept
  subject: 地理
  title: 海水淡化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为海水淡化成本低廉，可以大规模无限使用，实际成本高。
    - 能指出并纠正这一错误：误以为波斯湾沿岸国家完全依赖海水淡化，忽略地下水等其他水源。
  aliases: []
  category: 解决措施
  explanation: 波斯湾沿岸缺水国家通过海水淡化生产淡水，以缓解水资源短缺问题。
  misconceptions:
    - 误认为海水淡化成本低廉，可以大规模无限使用，实际成本高。
    - 误以为波斯湾沿岸国家完全依赖海水淡化，忽略地下水等其他水源。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:海沟
  type: Concept
  subject: 地理
  title: 海沟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海沟深度不足6000米，与海盆混淆
    - 能指出并纠正这一错误：误以为海沟紧依大陆架，实际上紧依岛弧或大陆沿岸山脉
  aliases: []
  category: 地理概念
  explanation: 海沟是深度超过6000米的海底狭长形凹地，长度可达数千千米，一般紧依岛弧或大陆沿岸山脉的外侧。
  misconceptions:
    - 认为海沟深度不足6000米，与海盆混淆
    - 误以为海沟紧依大陆架，实际上紧依岛弧或大陆沿岸山脉
    - 把海沟当作陆地地貌，如山谷
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:海洋保护区
  type: Concept
  subject: 地理
  title: 海洋保护区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为保护区内禁止一切开发利用，实际可适度开展科研和旅游。
    - 能指出并纠正这一错误：混淆海洋保护区与海洋自然保护区，后者保护对象更具体。
  aliases: []
  category: 生态保护
  explanation: 为维护生物多样性和生态系统完整性而建立的保护区。
  misconceptions:
    - 认为保护区内禁止一切开发利用，实际可适度开展科研和旅游。
    - 混淆海洋保护区与海洋自然保护区，后者保护对象更具体。
    - 认为海洋保护区只是为保护鱼类，忽略其他生物及生态系统。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋化学资源
  type: Concept
  subject: 地理
  title: 海洋化学资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海盐是唯一的海洋化学资源，忽略溴、镁等其他物质。
    - 能指出并纠正这一错误：认为海水中化学物质可直接提取，忽略成本和技术难度。
  aliases: []
  category: 海洋资源
  explanation: 海水中含有的盐类等化学物质，可提取海盐和工业原料。
  misconceptions:
    - 认为海盐是唯一的海洋化学资源，忽略溴、镁等其他物质。
    - 认为海水中化学物质可直接提取，忽略成本和技术难度。
    - 混淆海洋化学资源与海洋矿产资源，前者指溶解于海水中的盐类。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋垃圾
  type: Concept
  subject: 地理
  title: 海洋垃圾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海洋垃圾都是海洋上产生的，忽略主要来自陆地。
    - 能指出并纠正这一错误：认为可降解垃圾无害，仍会消耗氧气并污染水体。
  aliases: []
  category: 海洋污染
  explanation: 海洋中的固体废弃物，主要来自陆地，需加强监管和清理。
  misconceptions:
    - 认为海洋垃圾都是海洋上产生的，忽略主要来自陆地。
    - 认为可降解垃圾无害，仍会消耗氧气并污染水体。
    - 认为海洋垃圾只影响美观，不影响海洋生态和航运安全。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋对欧洲西部的影响
  type: Concept
  subject: 地理
  title: 海洋对欧洲西部的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为海洋只影响欧洲西部的交通，忽略对气候的调节作用。
    - 能指出并纠正这一错误：误以为欧洲西部受海洋影响冬季寒冷干燥，实际温和多雨。
  aliases: []
  category: 地理影响
  explanation: 海洋为欧洲西部提供便利航运、调节气候、提供渔业资源，并影响其经济和文化。
  misconceptions:
    - 误认为海洋只影响欧洲西部的交通，忽略对气候的调节作用。
    - 误以为欧洲西部受海洋影响冬季寒冷干燥，实际温和多雨。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S3.md
- id: concept:地理:海洋旅游资源
  type: Concept
  subject: 地理
  title: 海洋旅游资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海洋旅游资源只指海滩海水，忽略海岛、渔村等人文景观。
    - 能指出并纠正这一错误：认为所有海岸线都适宜开发旅游业，忽略气候和基础设施条件。
  aliases: []
  category: 海洋资源
  explanation: 海洋自然景观和人文景观构成的旅游资源，用于发展旅游业。
  misconceptions:
    - 认为海洋旅游资源只指海滩海水，忽略海岛、渔村等人文景观。
    - 认为所有海岸线都适宜开发旅游业，忽略气候和基础设施条件。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋污染
  type: Concept
  subject: 地理
  title: 海洋污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把海洋污染等同于水污染，忽略海洋污染还包括垃圾和石油等。
    - 能指出并纠正这一错误：认为海洋污染只来自陆地排放，忽略海上采油和船舶活动。
  aliases: []
  category: 环境问题
  explanation: 人类活动导致海洋水质恶化、生态破坏，如废水排放、垃圾倾倒等。
  misconceptions:
    - 把海洋污染等同于水污染，忽略海洋污染还包括垃圾和石油等。
    - 认为海洋污染只来自陆地排放，忽略海上采油和船舶活动。
    - 认为海洋污染只影响海洋生物，最终也会污染海产品危害人类。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋生态环境保护
  type: Concept
  subject: 地理
  title: 海洋生态环境保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为保护海洋生态环境就是禁止一切海洋开发活动。
    - 能指出并纠正这一错误：只重视污染治理，忽略生态修复和生物多样性保护。
  aliases: []
  category: 环境保护
  explanation: 保护海洋生态系统，防治污染，实现海洋资源可持续利用。
  misconceptions:
    - 认为保护海洋生态环境就是禁止一切海洋开发活动。
    - 只重视污染治理，忽略生态修复和生物多样性保护。
    - 认为海洋生态环境保护和海洋资源利用相互矛盾，无法协调。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋生物资源
  type: Concept
  subject: 地理
  title: 海洋生物资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为海洋生物资源只是鱼类，忽略藻类和贝类
    - 能指出并纠正这一错误：误将石油和天然气归入海洋生物资源
  aliases: []
  category: 自然资源
  explanation: 海洋中已知生物有24万种以上，是食物、医药和工业原料的重要来源。
  misconceptions:
    - 误认为海洋生物资源只是鱼类，忽略藻类和贝类
    - 误将石油和天然气归入海洋生物资源
    - 误认为海洋生物资源是不可再生资源，实际合理利用可恢复
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋矿产资源
  type: Concept
  subject: 地理
  title: 海洋矿产资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将石油和天然气归入生物资源，忽略其矿产属性
    - 能指出并纠正这一错误：误将潮汐能、波浪能归类为海洋矿产资源
  aliases: []
  category: 自然资源
  explanation: 海洋中蕴藏着丰富的矿产资源，主要包括石油、天然气、滨海砂矿和多金属结核等。
  misconceptions:
    - 误将石油和天然气归入生物资源，忽略其矿产属性
    - 误将潮汐能、波浪能归类为海洋矿产资源
    - 只记住石油和天然气，忽略滨海砂矿和多金属结核
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋空间资源
  type: Concept
  subject: 地理
  title: 海洋空间资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海洋空间资源只指海面，忽略海底和海中空间。
    - 能指出并纠正这一错误：混淆海洋空间资源与海洋生物资源，比如养殖场属于前者而非后者。
  aliases: []
  category: 海洋资源
  explanation: 海洋空间用于港口、航运、养殖等开发利用。
  misconceptions:
    - 认为海洋空间资源只指海面，忽略海底和海中空间。
    - 混淆海洋空间资源与海洋生物资源，比如养殖场属于前者而非后者。
    - 认为填海造陆不属于海洋空间资源的开发利用。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋资源
  type: Concept
  subject: 地理
  title: 海洋资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海洋资源取之不尽，忽略其有限性和脆弱性。
    - 能指出并纠正这一错误：认为海洋资源只有生物资源，忽略矿产、化学等资源。
  aliases: []
  category: 自然资源
  explanation: 海洋中各种生物、矿物、能源和空间资源的统称，包括生物、矿产、化学、旅游和空间资源。
  misconceptions:
    - 认为海洋资源取之不尽，忽略其有限性和脆弱性。
    - 认为海洋资源只有生物资源，忽略矿产、化学等资源。
    - 混淆海洋资源与海洋能源，前者指一切海洋中的可利用物质和空间。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋资源地域性强
  type: Concept
  subject: 地理
  title: 海洋资源地域性强
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海洋资源分布是均匀的，无地域差异。
    - 能指出并纠正这一错误：认为地域性只表现为纬度差异，忽略海岸带和近海远海差异。
  aliases: []
  category: 资源特征
  explanation: 海洋资源分布具有明显的地域差异，区域分布不平衡。
  misconceptions:
    - 认为海洋资源分布是均匀的，无地域差异。
    - 认为地域性只表现为纬度差异，忽略海岸带和近海远海差异。
    - 认为不同海域的海洋资源类型完全相同。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋资源开发方式粗放
  type: Concept
  subject: 地理
  title: 海洋资源开发方式粗放
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将粗放开发等同于开发速度快，忽视资源浪费和生态破坏
    - 能指出并纠正这一错误：看到近海渔业产值高就认为开发方式集约，忽略环境代价
  aliases: []
  category: 资源问题
  explanation: 开发过程中存在效率不高、方式粗放，导致生态破坏和环境污染。
  misconceptions:
    - 将粗放开发等同于开发速度快，忽视资源浪费和生态破坏
    - 看到近海渔业产值高就认为开发方式集约，忽略环境代价
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋资源开发过度与利用不足并存
  type: Concept
  subject: 地理
  title: 海洋资源开发过度与利用不足并存
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为近海利用不足、远海开发过度，与实际情况相反
    - 能指出并纠正这一错误：只依据近海渔获量判断利用充分，忽略远海开发程度
  aliases: []
  category: 资源问题
  explanation: 近海开发过度，远海利用不足，区域分布不平衡。
  misconceptions:
    - 误以为近海利用不足、远海开发过度，与实际情况相反
    - 只依据近海渔获量判断利用充分，忽略远海开发程度
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋资源数量巨大
  type: Concept
  subject: 地理
  title: 海洋资源数量巨大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把石油储量393亿吨当作可全部开采利用的数量
    - 能指出并纠正这一错误：认为资源数量巨大就可以取之不尽，忽略有限性
  aliases: []
  category: 资源特征
  explanation: 我国海洋资源储量丰富，如海洋生物2万多种，石油约393亿吨。
  misconceptions:
    - 把石油储量393亿吨当作可全部开采利用的数量
    - 认为资源数量巨大就可以取之不尽，忽略有限性
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋资源种类齐全
  type: Concept
  subject: 地理
  title: 海洋资源种类齐全
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为种类齐全就是各类资源储量都居世界第一
    - 能指出并纠正这一错误：忽略旅游和空间资源，只想到生物和矿产
  aliases: []
  category: 资源特征
  explanation: 我国海洋资源种类多，数量大，包括生物、矿产、化学、旅游和空间资源。
  misconceptions:
    - 认为种类齐全就是各类资源储量都居世界第一
    - 忽略旅游和空间资源，只想到生物和矿产
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海洋资源节约集约利用
  type: Concept
  subject: 地理
  title: 海洋资源节约集约利用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把节约集约利用理解为少开发甚至不开发
    - 能指出并纠正这一错误：将集约利用等同于单纯提高经济效益，忽视生态保护
  aliases: []
  category: 资源利用
  explanation: 通过合理方案，提高资源利用效率，减少浪费，保护生态。
  misconceptions:
    - 把节约集约利用理解为少开发甚至不开发
    - 将集约利用等同于单纯提高经济效益，忽视生态保护
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:海盆
  type: Concept
  subject: 地理
  title: 海盆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海盆是圆形的小凹地，实际上面积巨大
    - 能指出并纠正这一错误：误以为海盆比海沟深，实际上海沟更深
  aliases:
    - 洋盆
  category: 地理概念
  explanation: 海盆是大陆坡以下、海洋底部外形近于圆形或椭圆形的巨大凹地。
  misconceptions:
    - 认为海盆是圆形的小凹地，实际上面积巨大
    - 误以为海盆比海沟深，实际上海沟更深
    - 把海盆与大陆盆地混淆，海盆在海洋底部
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:海陆位置对气温的影响
  type: Concept
  subject: 地理
  title: 海陆位置对气温的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记错季节差异，认为夏季海洋气温高于陆地，冬季海洋气温低于陆地。
    - 能指出并纠正这一错误：判断等温线弯曲时，以为陆地等温线凸向高纬就是冬季，实际凸向高纬表示比海洋暖，是夏季。
  aliases: []
  category: 影响因素
  explanation: 同纬度地区，夏季陆地气温高于海洋，冬季陆地气温低于海洋。
  misconceptions:
    - 记错季节差异，认为夏季海洋气温高于陆地，冬季海洋气温低于陆地。
    - 判断等温线弯曲时，以为陆地等温线凸向高纬就是冬季，实际凸向高纬表示比海洋暖，是夏季。
    - 忽略海陆影响，认为同纬度海洋和陆地气温相同，无法解释沿海温差小。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:海陆位置对降水的影响
  type: Concept
  subject: 地理
  title: 海陆位置对降水的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘中纬度沿海降水多’绝对化，认为所有沿海都多雨，如智利北部沿海受寒流影响却少雨。
    - 能指出并纠正这一错误：误以为内陆降水一定少，认为赤道地区内陆也是干旱的。
  aliases: []
  category: 影响因素
  explanation: 中纬度地区沿海降水多，内陆降水少。
  misconceptions:
    - 将‘中纬度沿海降水多’绝对化，认为所有沿海都多雨，如智利北部沿海受寒流影响却少雨。
    - 误以为内陆降水一定少，认为赤道地区内陆也是干旱的。
    - 在等降水量线图上，把沿海等降水量线密集读作降水多，实际密集只表示变化剧烈。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:海陆分布特点
  type: Concept
  subject: 地理
  title: 海陆分布特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为陆地主要集中在南半球和东半球，实际是北半球和东半球。
    - 能指出并纠正这一错误：误以为海洋大多分布在北半球和西半球，实际是南半球和西半球。
  aliases: []
  category: 地理规律
  explanation: 地球上的海陆分布很不均匀，陆地主要集中在北半球和东半球，海洋大多分布在南半球和西半球。
  misconceptions:
    - 误以为陆地主要集中在南半球和东半球，实际是北半球和东半球。
    - 误以为海洋大多分布在北半球和西半球，实际是南半球和西半球。
    - 判读半球图时，误以为西半球的陆地面积大于东半球。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:海陆变迁
  type: Concept
  subject: 地理
  title: 海陆变迁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海陆分布固定不变，忽视板块运动影响
    - 能指出并纠正这一错误：误将气候变化直接导致海陆变迁，混淆主因
  aliases:
    - 海陆变化
  category: 地理概念
  explanation: 海陆分布不是固定不变的，会因板块运动、气候变化等原因发生变化。
  misconceptions:
    - 认为海陆分布固定不变，忽视板块运动影响
    - 误将气候变化直接导致海陆变迁，混淆主因
    - 把海陆变迁简单理解为海岸线局部变化，忽视大尺度板块漂移
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:海陆变迁的证据
  type: Concept
  subject: 地理
  title: 海陆变迁的证据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把填海造陆当作自然海陆变迁的证据，忽略其人为性。
    - 能指出并纠正这一错误：误以为海平面上升完全是人为导致，未考虑气候自然变化。
  aliases: []
  category: 地理概念
  explanation: 海陆变迁的证据包括海底森林遗迹、海河故道遗迹、填海造陆、海平面上升等。
  misconceptions:
    - 把填海造陆当作自然海陆变迁的证据，忽略其人为性。
    - 误以为海平面上升完全是人为导致，未考虑气候自然变化。
    - 将海底森林遗迹与海河故道遗迹混为一谈，分不清证据类型。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:海陆因素对气温的影响
  type: Concept
  subject: 地理
  title: 海陆因素对气温的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说海洋升温快降温快，陆地升温慢降温慢，温差判断全反
    - 能指出并纠正这一错误：不区分季节，直接断言海洋比大陆冷或热
  aliases: []
  category: 影响因素
  explanation: 海陆热力性质差异导致同纬度地区冬季大陆气温低于海洋，夏季大陆气温高于海洋。
  misconceptions:
    - 说海洋升温快降温快，陆地升温慢降温慢，温差判断全反
    - 不区分季节，直接断言海洋比大陆冷或热
    - 认为海陆热力差异只影响冬季，不影响夏季
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:海陆面积比例
  type: Concept
  subject: 地理
  title: 海陆面积比例
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为海洋面积占29%，陆地面积占71%，将比例完全记反。
    - 能指出并纠正这一错误：认为‘三分陆地’表示陆地面积就是30%，忽略了约为29%的精确比例。
  aliases:
    - 三分陆地七分海洋
  category: 地理事实
  explanation: 地球表面海洋面积约占71%，陆地面积约占29%，因此常说“三分陆地、七分海洋”。
  misconceptions:
    - 误以为海洋面积占29%，陆地面积占71%，将比例完全记反。
    - 认为‘三分陆地’表示陆地面积就是30%，忽略了约为29%的精确比例。
    - 误以为地球表面海洋和陆地面积各占一半，忽视海洋绝对优势。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:清洁生产
  type: Concept
  subject: 地理
  title: 清洁生产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为清洁生产就是末端处理废物，不必改进工艺
    - 能指出并纠正这一错误：以为清洁生产必然增加成本降低利润，企业不愿采用
  aliases: []
  category: 工业环保
  explanation: 指采用节能、节水、节材的产品和清洁生产工艺，减少污染和资源消耗的生产方式。
  misconceptions:
    - 认为清洁生产就是末端处理废物，不必改进工艺
    - 以为清洁生产必然增加成本降低利润，企业不愿采用
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:温带大陆性气候
  type: Concept
  subject: 地理
  title: 温带大陆性气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为温带大陆性气候全年降水均匀，实际降水稀少且集中夏季。
    - 能指出并纠正这一错误：将温带大陆性气候与热带沙漠气候混淆，忽略其夏季高温冬季寒冷年较差大。
  aliases: []
  category: 气候类型
  explanation: 主要分布在温带地区的大陆内部，夏季炎热，冬季寒冷，全年降水稀少且集中在夏季。
  misconceptions:
    - 误认为温带大陆性气候全年降水均匀，实际降水稀少且集中夏季。
    - 将温带大陆性气候与热带沙漠气候混淆，忽略其夏季高温冬季寒冷年较差大。
    - 误判温带大陆性气候位于大陆东岸，实际主要在大陆内部。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:温带季风气候
  type: Concept
  subject: 地理
  title: 温带季风气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为温带季风气候分布在大陆西岸，实际位于亚欧大陆东岸。
    - 能指出并纠正这一错误：误认为温带季风气候冬季受西风带控制温和多雨，实际冬季寒冷干燥。
  aliases: []
  category: 气候类型
  explanation: 主要分布在温带地区的亚欧大陆东岸，冬季寒冷干燥，夏季暖热多雨。
  misconceptions:
    - 误认为温带季风气候分布在大陆西岸，实际位于亚欧大陆东岸。
    - 误认为温带季风气候冬季受西风带控制温和多雨，实际冬季寒冷干燥。
    - 误判温带季风气候冬夏降水均匀，实际夏季多雨冬季干燥。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:温带海洋性气候
  type: Concept
  subject: 地理
  title: 温带海洋性气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为温带海洋性气候夏季炎热干燥，实际冬温夏凉降水均匀。
    - 能指出并纠正这一错误：误判温带海洋性气候分布在大陆东岸，实际只在大陆西部。
  aliases: []
  category: 气候类型
  explanation: 主要分布在温带地区的大陆西部，冬温夏凉，降水均匀，气候湿润。
  misconceptions:
    - 误认为温带海洋性气候夏季炎热干燥，实际冬温夏凉降水均匀。
    - 误判温带海洋性气候分布在大陆东岸，实际只在大陆西部。
    - 误认为温带海洋性气候降水集中在冬季，实际全年分配均匀。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:温带草原和荒漠
  type: Concept
  subject: 地理
  title: 温带草原和荒漠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为温带草原是一种独立气候类型，实际是温带大陆性气候下的景观。
    - 能指出并纠正这一错误：误以为温带草原和荒漠地区无森林，实际较高纬度有针叶林带。
  aliases: []
  category: 自然景观
  explanation: 温带大陆性气候区的自然景观，北部较高纬度地区有大面积针叶林分布。
  misconceptions:
    - 误认为温带草原是一种独立气候类型，实际是温带大陆性气候下的景观。
    - 误以为温带草原和荒漠地区无森林，实际较高纬度有针叶林带。
    - 将温带草原与热带草原的成因混淆，忽略二者纬度及降水差异。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:温带落叶阔叶林
  type: Concept
  subject: 地理
  title: 温带落叶阔叶林
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为温带落叶阔叶林终年常绿，实际冬季落叶，夏季茂盛。
    - 能指出并纠正这一错误：误将温带落叶阔叶林与常绿硬叶林混用，忽略二者气候类型不同。
  aliases: []
  category: 自然景观
  explanation: 温带季风气候区的典型植被，冬季落叶，夏季茂盛。
  misconceptions:
    - 误认为温带落叶阔叶林终年常绿，实际冬季落叶，夏季茂盛。
    - 误将温带落叶阔叶林与常绿硬叶林混用，忽略二者气候类型不同。
    - 误判温带落叶阔叶林分布在地中海气候区，实际是温带季风区。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:温度带
  type: Concept
  subject: 地理
  title: 温度带
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将温度带与气候带完全等同，说‘温度带就是气候类型’
    - 能指出并纠正这一错误：误以为温度带划分依据是年均温，实际是≥10℃积温
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 将温度带与气候带完全等同，说‘温度带就是气候类型’
    - 误以为温度带划分依据是年均温，实际是≥10℃积温
    - 记错温度带界线，把暖温带与亚热带分界当成400毫米等降水量线
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:湄公河
  type: Concept
  subject: 地理
  title: 湄公河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为湄公河自南向北流，实际自北向南注入南海。
    - 能指出并纠正这一错误：误以为湄公河只流经一个国家，实际流经中国、老挝等六国。
  aliases:
    - Mekong River
  category: 河流
  explanation: 湄公河是东南亚最长的河流，发源于中国境内，向南注入南海，流经多个国家。
  misconceptions:
    - 误认为湄公河自南向北流，实际自北向南注入南海。
    - 误以为湄公河只流经一个国家，实际流经中国、老挝等六国。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:滑坡
  type: Concept
  subject: 地理
  title: 滑坡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把滑坡与泥石流混为一谈，忽略滑坡是土体整体滑动，泥石流是水沙混合流动
    - 能指出并纠正这一错误：认为滑坡只发生在陡峭山区，平原或缓坡地区不会出现滑坡
  aliases: []
  category: 地质灾害
  explanation: 滑坡是指斜坡上的不稳定岩体或土体，在重力作用下整体向下滑动的现象，危害巨大。
  misconceptions:
    - 把滑坡与泥石流混为一谈，忽略滑坡是土体整体滑动，泥石流是水沙混合流动
    - 认为滑坡只发生在陡峭山区，平原或缓坡地区不会出现滑坡
    - 误以为滑坡是瞬间发生毫无征兆，实际常有裂缝、位移等前兆
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:澳大利亚三大地形区
  type: Concept
  subject: 地理
  title: 澳大利亚三大地形区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将澳大利亚地形记成“东部高原、西部山地”，实际东部为山地，西部为高原。
    - 能指出并纠正这一错误：误以为中部平原是地势最高处，实际中部大自流盆地地势低平。
  aliases:
    - 澳大利亚地形
  category: 地理
  explanation: 澳大利亚大陆分为西部高原、东部山地和中部平原三个地形区，自然地理环境差异明显。
  misconceptions:
    - 误将澳大利亚地形记成“东部高原、西部山地”，实际东部为山地，西部为高原。
    - 误以为中部平原是地势最高处，实际中部大自流盆地地势低平。
    - 混淆东西方向，把西部高原误当东部山地，导致地势判断颠倒。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:澳大利亚人口与居民
  type: Concept
  subject: 地理
  title: 澳大利亚人口与居民
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为澳大利亚人口多分布在西部高原或内陆，实际主要分布在东南沿海。
    - 能指出并纠正这一错误：误以为居民以黄色人种或原住民为主，实际以白色人种为主。
  aliases:
    - 澳大利亚人口与民族
    - 澳大利亚的人口
  category: 地理
  explanation: 澳大利亚地广人稀，人口密度低，居民以白色人种为主，多为英国移民后裔，官方语言为英语。
  misconceptions:
    - 误认为澳大利亚人口多分布在西部高原或内陆，实际主要分布在东南沿海。
    - 误以为居民以黄色人种或原住民为主，实际以白色人种为主。
    - 误以为澳大利亚官方语言不是英语，或忽略英语占主导地位。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:澳大利亚独特的动植物
  type: Concept
  subject: 地理
  title: 澳大利亚独特的动植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为袋鼠、树袋熊等动物也广泛分布在非洲或美洲，忽略大陆长期孤立。
    - 能指出并纠正这一错误：误认为独特动植物形成原因是气候干燥，实际是孤立环境导致进化缓慢。
  aliases:
    - 澳大利亚独特动植物
    - 世界活化石博物馆
  category: 地理
  explanation: 由于澳大利亚大陆长期孤立，生物进化缓慢，保留了许多古老独特的动植物，如袋鼠、树袋熊、鸸鹋、鸭嘴兽、桉树等。
  misconceptions:
    - 误以为袋鼠、树袋熊等动物也广泛分布在非洲或美洲，忽略大陆长期孤立。
    - 误认为独特动植物形成原因是气候干燥，实际是孤立环境导致进化缓慢。
    - 误以为鸭嘴兽属于鸟类，或认为桉树在其他大洲也常见。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:澳大利亚的产业结构
  type: Concept
  subject: 地理
  title: 澳大利亚的产业结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为目前仍以采矿业为支柱产业，实际服务业已成为新的支柱产业。
    - 能指出并纠正这一错误：误以为澳大利亚经济主要依靠农业畜牧业，忽略矿业和服务业。
  aliases: []
  category: 地理
  explanation: 澳大利亚曾以采矿业、冶金业和机械制造业为支柱产业，目前服务业成为新的支柱产业。
  misconceptions:
    - 误以为目前仍以采矿业为支柱产业，实际服务业已成为新的支柱产业。
    - 误以为澳大利亚经济主要依靠农业畜牧业，忽略矿业和服务业。
    - 误把冶金业和机械制造业当作当前支柱产业，实为过去的产业。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:澳大利亚的位置和范围
  type: Concept
  subject: 地理
  title: 澳大利亚的位置和范围
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为澳大利亚位于北半球，实际在南半球。
    - 能指出并纠正这一错误：误将东临的太平洋和西临的印度洋颠倒，实际东太平洋、西印度洋。
  aliases: []
  category: 地理
  explanation: 澳大利亚位于南半球，东濒太平洋，西临印度洋，包括澳大利亚大陆、塔斯马尼亚岛和附近小岛，是大洋洲面积最大的国家，也是世界上唯一独占一个大陆的国家。
  misconceptions:
    - 误以为澳大利亚位于北半球，实际在南半球。
    - 误将东临的太平洋和西临的印度洋颠倒，实际东太平洋、西印度洋。
    - 误认为澳大利亚包括新西兰，实际澳大利亚大陆不含新西兰。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:火山
  type: Concept
  subject: 地理
  title: 火山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为火山喷发的是燃烧的火焰或岩石，而非高温岩浆。
    - 能指出并纠正这一错误：误以为火山只分布在陆地上，海洋中没有海底火山。
  aliases: []
  category: 地理现象
  explanation: 火山是地下岩浆喷出地表形成的山体，多分布在板块交界地带。
  misconceptions:
    - 认为火山喷发的是燃烧的火焰或岩石，而非高温岩浆。
    - 误以为火山只分布在陆地上，海洋中没有海底火山。
    - 觉得死火山永远熄灭不再喷发，例如认为长白山已无活动。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S3.md
- id: concept:地理:火星探测
  type: Concept
  subject: 地理
  title: 火星探测
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“天问一号”是月球探测器，实际它实现了火星环绕、着陆、巡视
    - 能指出并纠正这一错误：误以为“祝融号”是环绕火星的卫星，实际它是火星表面巡视的火星车
  aliases: []
  category: 航天工程
  explanation: 人类对火星进行的探测活动，中国天问一号实现了环绕、着陆、巡视探测。
  misconceptions:
    - 误认为“天问一号”是月球探测器，实际它实现了火星环绕、着陆、巡视
    - 误以为“祝融号”是环绕火星的卫星，实际它是火星表面巡视的火星车
    - 误以为天问一号已发现火星生命，实际它只探测环境，尚未发现生命
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:热带季风气候
  type: Concept
  subject: 地理
  title: 热带季风气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为热带季风气候降水比热带草原少，实际更多。
    - 能指出并纠正这一错误：误认为该气候分布在南半球，实际主要在亚欧大陆东南部。
  aliases: []
  category: 气候类型
  explanation: 热带季风气候主要分布在北纬10°到北回归线附近的亚欧大陆东南部，全年高温，分旱季和雨季，年降水量比热带草原气候区大。
  misconceptions:
    - 误以为热带季风气候降水比热带草原少，实际更多。
    - 误认为该气候分布在南半球，实际主要在亚欧大陆东南部。
    - 误以为全年高温多雨，忽略有旱季和雨季之分。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:热带气候类型
  type: Concept
  subject: 地理
  title: 热带气候类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆热带季风气候和热带草原气候，认为二者都是全年多雨，忽略季风气候旱雨季分明的特点。
    - 能指出并纠正这一错误：认为热带沙漠气候终年高温多雨，实际是全年少雨。
  aliases:
    - 热带气候
  category: 地理概念
  explanation: 热带地区主要气候类型包括热带雨林气候、热带草原气候、热带沙漠气候和热带季风气候，共同点是终年高温，最冷月平均气温在15℃以上。
  misconceptions:
    - 混淆热带季风气候和热带草原气候，认为二者都是全年多雨，忽略季风气候旱雨季分明的特点。
    - 认为热带沙漠气候终年高温多雨，实际是全年少雨。
    - 忽视热带气候最冷月均温大于15℃的条件，误把亚热带季风气候归入热带。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:热带沙漠气候
  type: Concept
  subject: 地理
  title: 热带沙漠气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为热带沙漠气候分布在大陆东岸，实际在西岸和内部。
    - 能指出并纠正这一错误：误认为该气候冬季温和，实际全年高温。
  aliases: []
  category: 气候类型
  explanation: 热带沙漠气候主要分布在南、北回归线附近的大陆西部和内部，常年干旱少雨，日照强烈，气温高，蒸发强。
  misconceptions:
    - 误以为热带沙漠气候分布在大陆东岸，实际在西岸和内部。
    - 误认为该气候冬季温和，实际全年高温。
    - 误以为蒸发弱，实际蒸发强，干旱少雨。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:热带草原气候
  type: Concept
  subject: 地理
  title: 热带草原气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为热带草原气候降水比热带季风气候多，实际更少。
    - 能指出并纠正这一错误：误认为分布在南北纬30-40度，实际在热带雨林两侧。
  aliases: []
  category: 气候类型
  explanation: 热带草原气候主要分布在热带雨林气候区的南、北两侧，全年高温，分干湿两季。
  misconceptions:
    - 误以为热带草原气候降水比热带季风气候多，实际更少。
    - 误认为分布在南北纬30-40度，实际在热带雨林两侧。
    - 误以为全年多雨，实际分干湿两季。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:热带雨林
  type: Concept
  subject: 地理
  title: 热带雨林
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“地球之肺”仅指释放大量氧气，实际更重要的是吸收二氧化碳调节气候。
    - 能指出并纠正这一错误：误将热带雨林气候与热带草原气候成因混淆，如分干湿两季是草原气候。
  aliases:
    - 地球之肺
  category: 自然地理
  explanation: 亚马孙热带雨林是世界上面积最大的热带雨林，被称为“地球之肺”，对全球气候和生态平衡有重要作用。
  misconceptions:
    - 误以为“地球之肺”仅指释放大量氧气，实际更重要的是吸收二氧化碳调节气候。
    - 误将热带雨林气候与热带草原气候成因混淆，如分干湿两季是草原气候。
    - 误以为亚马孙热带雨林完全位于巴西，实际还分布在其他国家。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S5.md
- id: concept:地理:热带雨林气候
  type: Concept
  subject: 地理
  title: 热带雨林气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为热带雨林气候有干湿季，实际全年多雨。
    - 能指出并纠正这一错误：误认为分布在南/北回归线附近，实际在赤道附近。
  aliases: []
  category: 气候类型
  explanation: 热带雨林气候主要分布在赤道及其附近地区，全年高温多雨，年降水量一般在2000毫米以上。
  misconceptions:
    - 误以为热带雨林气候有干湿季，实际全年多雨。
    - 误认为分布在南/北回归线附近，实际在赤道附近。
    - 误以为年降水量低于2000毫米，实际一般超2000毫米。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:猴面包树
  type: Concept
  subject: 地理
  title: 猴面包树
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为猴面包树生长在热带雨林，实际在热带草原。
    - 能指出并纠正这一错误：误认为树干储水是为抵御寒冷，实际是为抗旱。
  aliases: []
  category: 生物地理
  explanation: 猴面包树是生长在热带草原上的一种植物，树干粗大，能储存大量水分，果实形似面包，是猴子喜爱的食物。
  misconceptions:
    - 误以为猴面包树生长在热带雨林，实际在热带草原。
    - 误认为树干储水是为抵御寒冷，实际是为抗旱。
    - 误以为猴面包树果实就是日常面包，实际只是形似。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:环境地图
  type: Concept
  subject: 地理
  title: 环境地图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把环境地图当作普通地图，只标地名不标污染源或灾害点
    - 能指出并纠正这一错误：用颜色表示人口密度而非环境质量，导致图例与主题不符
  aliases: []
  category: 地理工具
  explanation: 在地图上标注环境问题或地理现象，用于展示和分析环境状况的地图。
  misconceptions:
    - 把环境地图当作普通地图，只标地名不标污染源或灾害点
    - 用颜色表示人口密度而非环境质量，导致图例与主题不符
    - 看环境地图时只找城市，忽略图例中酸雨区或水土流失区的分布
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C4/sections/S2.md
- id: concept:地理:生命存在的条件
  type: Concept
  subject: 地理
  title: 生命存在的条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为只要有液态水就有生命，实际还需适宜温度和大气等条件
    - 能指出并纠正这一错误：误以为地球离太阳最近所以温度适宜，实际地球距太阳第三近，水星最近却酷热
  aliases: []
  category: 地球科学
  explanation: 地球具备安全的宇宙环境、适宜的温度和液态水，以及合适的体积和质量等条件。
  misconceptions:
    - 误认为只要有液态水就有生命，实际还需适宜温度和大气等条件
    - 误以为地球离太阳最近所以温度适宜，实际地球距太阳第三近，水星最近却酷热
    - 误以为火星有大气就适合生命，实际大气稀薄且以二氧化碳为主
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:生态修复
  type: Concept
  subject: 地理
  title: 生态修复
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态修复就是大量植树，忽视土壤、水质恢复
    - 能指出并纠正这一错误：误以为生态修复能完全恢复原状，实际只是改善功能
  aliases:
    - 矿山生态修复
  category: 环境治理
  explanation: 通过人工措施恢复受损生态系统，如矿山生态修复，使废弃矿山重现生机。
  misconceptions:
    - 认为生态修复就是大量植树，忽视土壤、水质恢复
    - 误以为生态修复能完全恢复原状，实际只是改善功能
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:生态文明建设
  type: Concept
  subject: 地理
  title: 生态文明建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态文明建设只包含环境保护，不涉及经济发展
    - 能指出并纠正这一错误：将生态文明与工业文明完全对立，认为要放弃工业化
  aliases: []
  category: 国家战略
  explanation: 我国提出的关于生态环境保护和可持续发展的总体战略，强调人与自然和谐共生。
  misconceptions:
    - 认为生态文明建设只包含环境保护，不涉及经济发展
    - 将生态文明与工业文明完全对立，认为要放弃工业化
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:生态环境保护
  type: Concept
  subject: 地理
  title: 生态环境保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态环境保护就要完全禁止开发，停止生产活动
    - 能指出并纠正这一错误：把生态环境保护等同于治理荒漠化，忽视耕地保护
  aliases:
    - 生态保护
  category: 地理概念
  explanation: 针对土地荒漠化、水土流失等问题，采取治理措施，保护耕地和生态环境，实现可持续发展。
  misconceptions:
    - 认为生态环境保护就要完全禁止开发，停止生产活动
    - 把生态环境保护等同于治理荒漠化，忽视耕地保护
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S2.md
- id: concept:地理:监测预警
  type: Concept
  subject: 地理
  title: 监测预警
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为监测预警只需气象站数据，忽略地质、水文等监测手段
    - 能指出并纠正这一错误：觉得发布预警就代表灾害一定不会发生，实际预警是提醒避险而非阻止灾害
  aliases: []
  category: 防治措施
  explanation: 监测预警通过建设水文气象站等采集信息，进行预测预报，为防灾避险争取时间。
  misconceptions:
    - 认为监测预警只需气象站数据，忽略地质、水文等监测手段
    - 觉得发布预警就代表灾害一定不会发生，实际预警是提醒避险而非阻止灾害
    - 将监测预警归为灾后救援环节，误以为不涉及事前预测
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:盖天说
  type: Concept
  subject: 地理
  title: 盖天说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为盖天说认为大地是球形，实际认为大地是平的
    - 能指出并纠正这一错误：把盖天说与浑天说混淆，浑天说才认为天地是球状
  aliases: []
  category: 地理学史
  explanation: 中国古代关于地球形状的一种猜想，认为大地是平的，天空像盖子。
  misconceptions:
    - 误认为盖天说认为大地是球形，实际认为大地是平的
    - 把盖天说与浑天说混淆，浑天说才认为天地是球状
    - 误认为盖天说由麦哲伦航行推翻，实际是麦哲伦证明地球是球体
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:省级行政区的简称和行政中心
  type: Concept
  subject: 地理
  title: 省级行政区的简称和行政中心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为山东省简称鲁，行政中心济南，但混淆湖北简称鄂与行政中心武汉对应关系
    - 能指出并纠正这一错误：易把江西简称赣写成甘，或甘肃简称陇与广西桂搞混
  aliases:
    - 简称
    - 行政中心
  category: 地理
  explanation: 每个省级行政区都有简称和行政中心，如山东省简称鲁，行政中心济南。
  misconceptions:
    - 误认为山东省简称鲁，行政中心济南，但混淆湖北简称鄂与行政中心武汉对应关系
    - 易把江西简称赣写成甘，或甘肃简称陇与广西桂搞混
    - 误以为所有省级行政区简称都取首字，如内蒙古简称蒙而非内
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:石油资源
  type: Concept
  subject: 地理
  title: 石油资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为石油资源是可再生资源，实际是不可再生资源。
    - 能指出并纠正这一错误：误以为中东石油储量最大的国家是沙特，实际委内瑞拉储量更大。
  aliases:
    - Oil resources
  category: 自然资源
  explanation: 中东石油储量、产量和出口量均居世界首位，主要分布在波斯湾沿岸，对世界能源供应有重要影响。
  misconceptions:
    - 误认为石油资源是可再生资源，实际是不可再生资源。
    - 误以为中东石油储量最大的国家是沙特，实际委内瑞拉储量更大。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:矿产资源
  type: Concept
  subject: 地理
  title: 矿产资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为矿产资源只包括固态矿物，忽略石油和天然气
    - 能指出并纠正这一错误：误以为矿产资源可再生，用完还能自然生成
  aliases: []
  category: 地理概念
  explanation: 由地质作用形成的，具有利用价值的，呈固态、液态或气态的自然资源。
  misconceptions:
    - 认为矿产资源只包括固态矿物，忽略石油和天然气
    - 误以为矿产资源可再生，用完还能自然生成
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:矿产资源保护
  type: Concept
  subject: 地理
  title: 矿产资源保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为矿产资源保护就是少开采或不开采，而非提高回采率
    - 能指出并纠正这一错误：把‘在开发中保护’理解为只恢复地表植被，忽略资源节约
  aliases: []
  category: 资源保护
  explanation: 在保护中开发，在开发中保护，提升矿产资源保护能力，严防过度开发。
  misconceptions:
    - 认为矿产资源保护就是少开采或不开采，而非提高回采率
    - 把‘在开发中保护’理解为只恢复地表植被，忽略资源节约
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:硅谷
  type: Concept
  subject: 地理
  title: 硅谷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为硅谷是圣弗朗西斯科市内的一个区，实际位于圣克拉拉谷地。
    - 能指出并纠正这一错误：误以为硅谷以生产硅矿或硅原料著称，实际是高新技术工业园区。
  aliases:
    - 圣克拉拉谷地
  category: 经济地理
  explanation: 硅谷位于圣弗朗西斯科附近的圣克拉拉谷地，是世界第一个高新技术工业园区，高科技企业聚集地。
  misconceptions:
    - 误以为硅谷是圣弗朗西斯科市内的一个区，实际位于圣克拉拉谷地。
    - 误以为硅谷以生产硅矿或硅原料著称，实际是高新技术工业园区。
    - 误以为硅谷在洛杉矶附近，或误认为在美国东部。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S5.md
- id: concept:地理:碳中和
  type: Concept
  subject: 地理
  title: 碳中和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为碳中和就是零排放，完全不允许排放二氧化碳。
    - 能指出并纠正这一错误：认为只要多种树就能抵消所有排放，忽略节能和减排的优先地位。
  aliases: []
  category: 地理概念
  explanation: 指通过减排和吸收等方式抵消自身产生的二氧化碳排放，实现净零排放。
  misconceptions:
    - 误以为碳中和就是零排放，完全不允许排放二氧化碳。
    - 认为只要多种树就能抵消所有排放，忽略节能和减排的优先地位。
    - 将碳中和与碳达峰混为一谈，不清楚达峰是排放量峰值，中和是净零排放。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:碳达峰
  type: Concept
  subject: 地理
  title: 碳达峰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为碳达峰是指碳排放量变为零，其实只是达到峰值后逐步回落。
    - 能指出并纠正这一错误：认为碳达峰是个人日常行动的目标，实际主要是国家和地区的战略目标。
  aliases: []
  category: 地理概念
  explanation: 指二氧化碳排放量达到峰值后逐步回落，是应对气候变暖的战略目标。
  misconceptions:
    - 误以为碳达峰是指碳排放量变为零，其实只是达到峰值后逐步回落。
    - 认为碳达峰是个人日常行动的目标，实际主要是国家和地区的战略目标。
    - 误以为碳达峰后排放量立即直线下降，忽略了可能有平台期或波动。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S3.md
- id: concept:地理:社交习俗
  type: Concept
  subject: 地理
  title: 社交习俗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球社交习俗趋同，到任何国家都能用握手礼，比如在日本也强握对方手
    - 能指出并纠正这一错误：将社交习俗视为个人随意习惯，忽视其背后文化禁忌，如在中东用左手递物
  aliases:
    - 社交礼仪
  category: 文化
  explanation: 社交习俗是人们在社会交往过程中的礼仪规范，包括见面礼仪等。
  misconceptions:
    - 认为全球社交习俗趋同，到任何国家都能用握手礼，比如在日本也强握对方手
    - 将社交习俗视为个人随意习惯，忽视其背后文化禁忌，如在中东用左手递物
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:禁渔区
  type: Concept
  subject: 地理
  title: 禁渔区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为禁渔区禁止一切渔业活动，连养殖和垂钓也禁
    - 能指出并纠正这一错误：误以为禁渔区只在夏季设立，不知道有常年禁渔区
  aliases: []
  category: 渔业管理
  explanation: 禁止捕捞的区域，以保护渔业资源。
  misconceptions:
    - 认为禁渔区禁止一切渔业活动，连养殖和垂钓也禁
    - 误以为禁渔区只在夏季设立，不知道有常年禁渔区
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:科学技术对工业的影响
  type: Concept
  subject: 地理
  title: 科学技术对工业的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为科技只提高产量，不会降低生产成本和推动转型升级。
    - 能指出并纠正这一错误：把科学技术对工业的影响与自然环境因素混为一谈，认为科技属于自然条件。
  aliases: []
  category: 工业发展
  explanation: 科学技术促进工业生产模式革新，降低成本，推动工业转型升级。
  misconceptions:
    - 认为科技只提高产量，不会降低生产成本和推动转型升级。
    - 把科学技术对工业的影响与自然环境因素混为一谈，认为科技属于自然条件。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:科迪勒拉山系
  type: Concept
  subject: 地理
  title: 科迪勒拉山系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为科迪勒拉山系包含喜马拉雅山脉或亚洲山系。
    - 能指出并纠正这一错误：将山系与山脉混用，把科迪勒拉山系看成一条独立山脉。
  aliases: []
  category: 地理事实
  explanation: 科迪勒拉山系纵贯美洲大陆西部，是世界上最长的山系，由落基山脉和安第斯山脉组成。
  misconceptions:
    - 误认为科迪勒拉山系包含喜马拉雅山脉或亚洲山系。
    - 将山系与山脉混用，把科迪勒拉山系看成一条独立山脉。
    - 错称科迪勒拉山系纵贯南美西部，忽略北美的落基山脉。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:秦岭—淮河线
  type: Concept
  subject: 地理
  title: 秦岭—淮河线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把秦岭—淮河线误记为1月0℃等温线和400毫米年等降水量线穿过
    - 能指出并纠正这一错误：认为秦岭—淮河线是季风区与非季风区界线，实际不是
  aliases:
    - 秦岭淮河线
  category: 地理
  explanation: 我国重要的地理分界线，大致与1月0℃等温线和800毫米年等降水量线一致。
  misconceptions:
    - 把秦岭—淮河线误记为1月0℃等温线和400毫米年等降水量线穿过
    - 认为秦岭—淮河线是季风区与非季风区界线，实际不是
    - 误以为秦岭—淮河线是热带与亚热带分界，实际是暖温带与亚热带
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:空气质量优良天数占比
  type: Concept
  subject: 地理
  title: 空气质量优良天数占比
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将优良天数占总天数比例误算为优良天数与污染天数之比。
    - 能指出并纠正这一错误：认为占比越高说明空气质量越差，把优良和污染概念搞反。
  aliases: []
  category: 环境质量指标
  explanation: 一年中空气质量优良的天数占总天数的比例，反映空气质量改善程度。
  misconceptions:
    - 将优良天数占总天数比例误算为优良天数与污染天数之比。
    - 认为占比越高说明空气质量越差，把优良和污染概念搞反。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:空间站
  type: Concept
  subject: 地理
  title: 空间站
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为空间站是自然天体，实际是人类发射升空的航天器
    - 能指出并纠正这一错误：误认为中国空间站绕月球飞行，实际它绕地球运行
  aliases: []
  category: 航天工程
  explanation: 人类在太空中长期停留、进行科学研究和技术实验的重要平台。
  misconceptions:
    - 误以为空间站是自然天体，实际是人类发射升空的航天器
    - 误认为中国空间站绕月球飞行，实际它绕地球运行
    - 误把“神舟飞船”当作空间站，实际神舟是载人飞船，空间站可长期驻留
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S2.md
- id: concept:地理:第二手资料
  type: Concept
  subject: 地理
  title: 第二手资料
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为地图、图片属于第一手资料，实际它们属于第二手资料。
    - 能指出并纠正这一错误：误以为第二手资料都不可靠，实际经过筛选分析仍有价值。
  aliases: []
  category: 地理
  explanation: 第二手资料包括文字、地图、图片、图表和统计数据等，是了解一个国家的重要途径。
  misconceptions:
    - 误以为地图、图片属于第一手资料，实际它们属于第二手资料。
    - 误以为第二手资料都不可靠，实际经过筛选分析仍有价值。
    - 误以为实地测量数据是第二手资料，实际属于第一手资料。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:等温线
  type: Concept
  subject: 地理
  title: 等温线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：判读等温线时，以为等温线越密集气温变化越小
    - 能指出并纠正这一错误：把等温线当成实际存在的线，以为图上画出就有实物
  aliases:
    - 等温线图
  category: 地理工具
  explanation: 等温线是地图上气温相同各点的连线，用于表示气温的分布情况。
  misconceptions:
    - 判读等温线时，以为等温线越密集气温变化越小
    - 把等温线当成实际存在的线，以为图上画出就有实物
    - 看到等温线弯曲就判定该处气温高，忽视弯曲可表低温
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:红色旅游
  type: Concept
  subject: 地理
  title: 红色旅游
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为红色旅游是指观赏红色植被或红色建筑的旅游活动。
    - 能指出并纠正这一错误：误以为红色旅游只是普通文化旅游，忽略其爱国主义教育功能。
  aliases: []
  category: 地理知识
  explanation: 红色旅游是以中国共产党领导人民在革命和战争时期建树丰功伟绩所形成的纪念地为目的地的旅游活动，是爱国主义和社会主义教育的形式之一。
  misconceptions:
    - 误以为红色旅游是指观赏红色植被或红色建筑的旅游活动。
    - 误以为红色旅游只是普通文化旅游，忽略其爱国主义教育功能。
    - 误以为红色旅游目的地在国外，或认为没有特定纪念地。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:纬度
  type: Concept
  subject: 地理
  title: 纬度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为纬度从赤道向两极递减，实际是递增至90°
    - 能指出并纠正这一错误：北纬写成N，南纬写成S，但容易把赤道写成0°N或0°S
  aliases: []
  category: 地理概念
  explanation: 纬线的度数，从赤道向南北各至90°，北纬用N，南纬用S。
  misconceptions:
    - 误认为纬度从赤道向两极递减，实际是递增至90°
    - 北纬写成N，南纬写成S，但容易把赤道写成0°N或0°S
    - 误认为纬度最高为90°，却把北极点纬度写成90°N，南极点写成90°S，混淆方向
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:纬度位置对气温的影响
  type: Concept
  subject: 地理
  title: 纬度位置对气温的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为低纬度地区气温一定高，忽略海拔影响，如赤道附近的乞力马扎罗山山顶有雪。
    - 能指出并纠正这一错误：混淆低中高纬度范围，误把30°N当高纬度，导致分析气温时判断错。
  aliases: []
  category: 影响因素
  explanation: 低纬度地区太阳辐射强，气温高；高纬度地区太阳辐射弱，气温低。
  misconceptions:
    - 认为低纬度地区气温一定高，忽略海拔影响，如赤道附近的乞力马扎罗山山顶有雪。
    - 混淆低中高纬度范围，误把30°N当高纬度，导致分析气温时判断错。
    - 误认为赤道是全球气温最高的地方，实际最高气温出现在回归线附近的沙漠，因为赤道多雨云。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:纬度位置对降水的影响
  type: Concept
  subject: 地理
  title: 纬度位置对降水的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为回归线附近大陆东、西部降水都少，忽视东部受季风影响多雨。
    - 能指出并纠正这一错误：将回归线附近降水规律记反，把大陆西岸说成多雨、东岸说成少雨。
  aliases: []
  category: 影响因素
  explanation: 赤道地区降水多，两极地区降水少；回归线附近大陆西部和内部少雨，东部多雨。
  misconceptions:
    - 认为回归线附近大陆东、西部降水都少，忽视东部受季风影响多雨。
    - 将回归线附近降水规律记反，把大陆西岸说成多雨、东岸说成少雨。
    - 误以为两极降水比赤道多，看到极地冰雪覆盖就认为降水量大。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:纬度因素对气温的影响
  type: Concept
  subject: 地理
  title: 纬度因素对气温的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为纬度越高太阳辐射越强，所以气温越高
    - 能指出并纠正这一错误：把太阳高度角与纬度关系记反，认为低纬太阳高度角小
  aliases: []
  category: 影响因素
  explanation: 纬度是影响气温分布的主要因素，太阳辐射随纬度升高而减弱，导致气温从低纬向高纬递减。
  misconceptions:
    - 以为纬度越高太阳辐射越强，所以气温越高
    - 把太阳高度角与纬度关系记反，认为低纬太阳高度角小
    - 误认为气温从赤道向两极递增，忽视太阳辐射随纬度减弱
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:纬线
  type: Concept
  subject: 地理
  title: 纬线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为纬线长度都相等，实际赤道最长，向两极递减
    - 能指出并纠正这一错误：误认为纬线是南北方向，实际是东西方向
  aliases: []
  category: 地理概念
  explanation: 与赤道平行的线，呈东西方向，有无数条。
  misconceptions:
    - 误认为纬线长度都相等，实际赤道最长，向两极递减
    - 误认为纬线是南北方向，实际是东西方向
    - 误认为纬线有无数条且能相交，实际平行不相交
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:经度
  type: Concept
  subject: 地理
  title: 经度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为东经度向东度数增大，西经度向西度数增大，但容易写反方位
    - 能指出并纠正这一错误：误认为经度最大为360°，实际东西经各180°
  aliases: []
  category: 地理概念
  explanation: 经线的度数，从本初子午线向东向西各至180°，东经用E，西经用W。
  misconceptions:
    - 误认为东经度向东度数增大，西经度向西度数增大，但容易写反方位
    - 误认为经度最大为360°，实际东西经各180°
    - 误把本初子午线当作东经180°或西经180°
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:经济多元化
  type: Concept
  subject: 地理
  title: 经济多元化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为经济多元化就是开采多种矿产，实际发展制造业、旅游业等。
    - 能指出并纠正这一错误：误以为中东产油国已完全摆脱石油依赖，实际石油仍是主导。
  aliases:
    - economic diversification
  category: 经济发展
  explanation: 中东产油国为摆脱对石油的依赖，实施经济多元化发展战略，发展基础设施、制造业、旅游业等。
  misconceptions:
    - 误认为经济多元化就是开采多种矿产，实际发展制造业、旅游业等。
    - 误以为中东产油国已完全摆脱石油依赖，实际石油仍是主导。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S2.md
- id: concept:地理:经纬网
  type: Concept
  subject: 地理
  title: 经纬网
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为经纬网中每条线都有确定度数，但实际必须标出N/S/E/W才能确定位置
    - 能指出并纠正这一错误：写某点坐标时顺序颠倒，如写(纬度,经度)但规定先纬后经
  aliases: []
  category: 地理概念
  explanation: 经线和纬线交织成的网，用于确定地球表面任何地点的位置。
  misconceptions:
    - 误认为经纬网中每条线都有确定度数，但实际必须标出N/S/E/W才能确定位置
    - 写某点坐标时顺序颠倒，如写(纬度,经度)但规定先纬后经
    - 误认为经纬网中所有经线长度相等，所有纬线长度也相等，忽略纬度不同
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:经线
  type: Concept
  subject: 地理
  title: 经线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为经线是半圆且长度不等，实际所有经线长度相等
    - 能指出并纠正这一错误：误认为经线指示东西方向，实际指示南北方向
  aliases: []
  category: 地理概念
  explanation: 连接南北两极并与纬线垂直的线，呈南北方向，长度相等。
  misconceptions:
    - 误认为经线是半圆且长度不等，实际所有经线长度相等
    - 误认为经线指示东西方向，实际指示南北方向
    - 误认为经线有无数条且会相交于两极，但认为每条经线独立不连接
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:美丽海湾建设
  type: Concept
  subject: 地理
  title: 美丽海湾建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为美丽海湾建设仅指沙滩美观，不包括水质改善和生态修复。
    - 能指出并纠正这一错误：将美丽海湾建设等同于围海造陆，增加陆地面积。
  aliases: []
  category: 生态建设
  explanation: 通过综合治理推进海湾生态保护与建设，实现美丽海湾目标。
  misconceptions:
    - 认为美丽海湾建设仅指沙滩美观，不包括水质改善和生态修复。
    - 将美丽海湾建设等同于围海造陆，增加陆地面积。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:美国主要城市
  type: Concept
  subject: 地理
  title: 美国主要城市
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为纽约是美国首都，实际首都是华盛顿。
    - 能指出并纠正这一错误：误以为底特律是钢铁工业中心，实际是汽车工业中心，钢铁中心是芝加哥。
  aliases: []
  category: 人文地理
  explanation: 华盛顿是首都，纽约是最大城市和金融中心，芝加哥是钢铁工业基地，底特律是汽车工业中心，休斯敦是石油化工和航天中心，洛杉矶是飞机制造和电影中心，圣弗朗西斯科是西部港口和硅谷所在地。
  misconceptions:
    - 误以为纽约是美国首都，实际首都是华盛顿。
    - 误以为底特律是钢铁工业中心，实际是汽车工业中心，钢铁中心是芝加哥。
    - 误以为休斯敦是飞机制造中心，实际是石油化工和航天中心。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:美国产业结构
  type: Concept
  subject: 地理
  title: 美国产业结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为美国农业发达所以第一产业比重最大，实际第三产业比重最大。
    - 能指出并纠正这一错误：误以为美国以制造业为主，第二产业比重最大，实际上第三产业已占主导。
  aliases: []
  category: 经济地理
  explanation: 美国产业结构中，第三产业比重最大，第二产业比重减小，第一产业比重很小。
  misconceptions:
    - 误以为美国农业发达所以第一产业比重最大，实际第三产业比重最大。
    - 误以为美国以制造业为主，第二产业比重最大，实际上第三产业已占主导。
    - 误以为美国第一产业比重大于第二产业，实际第二产业也大于第一产业。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:美国位置与领土组成
  type: Concept
  subject: 地理
  title: 美国位置与领土组成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为美国本土东临太平洋、西临大西洋，实际东大西洋、西太平洋。
    - 能指出并纠正这一错误：误以为美国本土位于北美洲南部，实际位于北美洲中部。
  aliases:
    - 美国的位置
  category: 地理
  explanation: 美国全称美利坚合众国，本土位于北美洲中部，东临大西洋，南临墨西哥湾，西临太平洋，还包括阿拉斯加和夏威夷群岛。
  misconceptions:
    - 误以为美国本土东临太平洋、西临大西洋，实际东大西洋、西太平洋。
    - 误以为美国本土位于北美洲南部，实际位于北美洲中部。
    - 误以为夏威夷群岛在大西洋，或忘记阿拉斯加是美国领土。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:美国农业专业化
  type: Concept
  subject: 地理
  title: 美国农业专业化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把美国农业专业化理解为每个州只种一种作物，忽视轮作和混合经营
    - 能指出并纠正这一错误：误以为乳畜带分布在热带地区，实际位于五大湖附近冷凉湿润区
  aliases:
    - 农业带
    - 农业地区专业化
  category: 农业地理
  explanation: 美国农业充分利用自然条件，实现地区生产专业化，形成乳畜带、玉米带、棉花带、小麦区等农业带。
  misconceptions:
    - 把美国农业专业化理解为每个州只种一种作物，忽视轮作和混合经营
    - 误以为乳畜带分布在热带地区，实际位于五大湖附近冷凉湿润区
    - 认为棉花带位于美国东北部，实际棉花带主要分布在南部地区
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:美国发展农业的自然条件
  type: Concept
  subject: 地理
  title: 美国发展农业的自然条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为美国本土全部为温带气候，忽略亚热带和干旱区存在
    - 能指出并纠正这一错误：误以为美国平原面积狭小，实际中部大平原广阔连片
  aliases: []
  category: 自然地理
  explanation: 美国本土大部分为温带和亚热带气候，降水充沛，平原广阔，耕地、草地、森林资源丰富。
  misconceptions:
    - 认为美国本土全部为温带气候，忽略亚热带和干旱区存在
    - 误以为美国平原面积狭小，实际中部大平原广阔连片
    - 将美国西部山地误认为平原，导致对耕地资源判断错误
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S5.md
- id: concept:地理:美国多元文化
  type: Concept
  subject: 地理
  title: 美国多元文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为美国文化就是欧洲白人文化，无视非洲、亚洲等文化的影响
    - 能指出并纠正这一错误：误以为'人种博物馆'指各人种相互隔离，实际是文化融合
  aliases:
    - 人种博物馆
    - 美国文化的多元化
  category: 地理
  explanation: 美国是移民国家，有“人种博物馆”之称，来自世界各地的文化融合成独特的美国文化。
  misconceptions:
    - 认为美国文化就是欧洲白人文化，无视非洲、亚洲等文化的影响
    - 误以为'人种博物馆'指各人种相互隔离，实际是文化融合
    - 将多元文化等同于种族平等，忽视美国历史上种族歧视现象
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:美国工业分布
  type: Concept
  subject: 地理
  title: 美国工业分布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为美国工业全在东北部，忽视南部和西部的新兴工业
    - 能指出并纠正这一错误：认为南部工业以传统钢铁为主，实际以石油、宇航等新兴工业为主
  aliases: []
  category: 经济地理
  explanation: 美国东北部、南部、西部工业发展各具特色，东北部是传统工业区，南部和西部有新兴工业。
  misconceptions:
    - 误以为美国工业全在东北部，忽视南部和西部的新兴工业
    - 认为南部工业以传统钢铁为主，实际以石油、宇航等新兴工业为主
    - 混淆东北部和西部工业特点，东北部传统工业，西部高新技术
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:美国的人口构成
  type: Concept
  subject: 地理
  title: 美国的人口构成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为美国原住民是主要人口，实际上移民及其后裔占绝大多数
    - 能指出并纠正这一错误：误以为所有美国人都是移民后代，忽略原住民的存在
  aliases: []
  category: 地理
  explanation: 美国是一个移民国家，人口由原住民和来自世界各地的移民及其后裔组成，有“人种博物馆”之称。
  misconceptions:
    - 认为美国原住民是主要人口，实际上移民及其后裔占绝大多数
    - 误以为所有美国人都是移民后代，忽略原住民的存在
    - 把'人种博物馆'理解为各人种数量相等，实际是来源多样
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:美国经济
  type: Concept
  subject: 地理
  title: 美国经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为美国经济以农业为主，实际服务业和高科技产业占主导
    - 能指出并纠正这一错误：认为美国矿产资源贫乏，实际上矿产资源十分丰富
  aliases: []
  category: 地理
  explanation: 美国国内生产总值居世界首位，科技水平领先，是世界第一军事大国，农业机械化程度高，矿产资源丰富。
  misconceptions:
    - 误以为美国经济以农业为主，实际服务业和高科技产业占主导
    - 认为美国矿产资源贫乏，实际上矿产资源十分丰富
    - 误以为美国军事力量弱，实际是世界第一军事大国
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:美国经济发展
  type: Concept
  subject: 地理
  title: 美国经济发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为美国粮食依赖进口，实际是世界主要粮食出口国
    - 能指出并纠正这一错误：误以为美国农业机械化程度低，实际机械化水平极高
  aliases: []
  category: 地理
  explanation: 美国国内生产总值居世界首位，科技领先，农业机械化，粮食出口额大，矿产资源丰富。
  misconceptions:
    - 认为美国粮食依赖进口，实际是世界主要粮食出口国
    - 误以为美国农业机械化程度低，实际机械化水平极高
    - 将美国经济发展等同于工业发展，忽视其科技和服务业贡献
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:老街保护
  type: Concept
  subject: 地理
  title: 老街保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为老街保护就是全部拆掉重建，保留仿古建筑即可
    - 能指出并纠正这一错误：把翻新当保护，用现代材料替换原有青砖木梁，失去历史信息
  aliases: []
  category: 人文地理
  explanation: 对具有历史和文化价值的老街进行保护和更新，以保留其历史风貌并促进其可持续发展。
  misconceptions:
    - 认为老街保护就是全部拆掉重建，保留仿古建筑即可
    - 把翻新当保护，用现代材料替换原有青砖木梁，失去历史信息
    - 只保护个别老宅，忽略街巷格局和整体风貌，如拆掉古井建停车场
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C6/sections/S2.md
- id: concept:地理:耕地保护制度
  type: Concept
  subject: 地理
  title: 耕地保护制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为18亿亩是耕地质量指标，不是面积指标。
    - 能指出并纠正这一错误：说出“耕地面积不少于18亿公顷”，把亩和公顷单位混淆。
  aliases:
    - 基本国策
  category: 政策法规
  explanation: 我国坚持最严格的耕地保护制度，确保耕地面积不少于18亿亩，并实行“十分珍惜、合理利用土地和切实保护耕地”的基本国策。
  misconceptions:
    - 认为18亿亩是耕地质量指标，不是面积指标。
    - 说出“耕地面积不少于18亿公顷”，把亩和公顷单位混淆。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S2.md
- id: concept:地理:联合国工作语言
  type: Concept
  subject: 地理
  title: 联合国工作语言
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为联合国工作语言包括德语和日语
    - 能指出并纠正这一错误：把西班牙文漏掉或错写成葡萄牙文
  aliases:
    - 联合国官方语言
  category: 地理文化
  explanation: 联合国6种工作语言包括中文、英文、西班牙文、俄文、阿拉伯文和法文，具有同等效力。
  misconceptions:
    - 误认为联合国工作语言包括德语和日语
    - 把西班牙文漏掉或错写成葡萄牙文
    - 以为阿拉伯文不是联合国工作语言
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:联合国维持和平行动
  type: Concept
  subject: 地理
  title: 联合国维持和平行动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为维和行动无需冲突各方同意即可强行介入，实际上必须征得各方同意
    - 能指出并纠正这一错误：误认为维和部队可主动开火作战，实际通常只能自卫还击（非武力强制）
  aliases:
    - 维和行动
  category: 国际行动
  explanation: 联合国根据大会或安理会决议，征得各方同意后向冲突地区派遣军事人员以恢复或维持和平的国际行动。
  misconceptions:
    - 误以为维和行动无需冲突各方同意即可强行介入，实际上必须征得各方同意
    - 误认为维和部队可主动开火作战，实际通常只能自卫还击（非武力强制）
    - 误把维和行动的派遣主体说成联合国秘书长，实际须由安理会或大会通过决议
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S3.md
- id: concept:地理:聚落
  type: Concept
  subject: 地理
  title: 聚落
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为聚落仅指房屋建筑，忽略道路、广场等共同构成的聚居环境
    - 能指出并纠正这一错误：把乡村和城镇看作聚落以外的类型，忘记它们正是聚落的两种基本形式
  aliases: []
  category: 地理概念
  explanation: 人们按照生产和生活的需要而聚居的场所称为聚落，城镇和乡村是两种基本的聚落类型。
  misconceptions:
    - 认为聚落仅指房屋建筑，忽略道路、广场等共同构成的聚居环境
    - 把乡村和城镇看作聚落以外的类型，忘记它们正是聚落的两种基本形式
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:聚落消亡
  type: Concept
  subject: 地理
  title: 聚落消亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为聚落消亡都是突然发生的，忽略通常有一个过程。
    - 能指出并纠正这一错误：把聚落消亡完全归因于自然灾害，忽略战争、经济等人为因素。
  aliases:
    - 聚落废弃
  category: 地理现象
  explanation: 聚落可能因环境变化、灾难等原因被放弃或毁灭，如阿纳萨齐聚落遗址。
  misconceptions:
    - 认为聚落消亡都是突然发生的，忽略通常有一个过程。
    - 把聚落消亡完全归因于自然灾害，忽略战争、经济等人为因素。
    - 误以为阿纳萨齐遗址就是聚落消亡的唯一案例。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:自动化机器设备生产模式
  type: Concept
  subject: 地理
  title: 自动化机器设备生产模式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自动化生产仍需要大量人手操作，只是工具更先进。
    - 能指出并纠正这一错误：将自动化生产模式等同于手工工厂生产，忽略减少人工干预的特点。
  aliases: []
  category: 工业生产
  explanation: 利用自动化机器设备进行生产，减少人工干预，提高生产效率和产品质量。
  misconceptions:
    - 认为自动化生产仍需要大量人手操作，只是工具更先进。
    - 将自动化生产模式等同于手工工厂生产，忽略减少人工干预的特点。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:自动织布机
  type: Concept
  subject: 地理
  title: 自动织布机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自动织布机是第二次工业革命的成果，实际是第一次工业革命时期。
    - 能指出并纠正这一错误：认为自动织布机仍依赖水力，不是自动化设备。
  aliases: []
  category: 工业设备
  explanation: 自动化织布设备，降低人力成本，提高生产效率。
  misconceptions:
    - 认为自动织布机是第二次工业革命的成果，实际是第一次工业革命时期。
    - 认为自动织布机仍依赖水力，不是自动化设备。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:自然灾害
  type: Concept
  subject: 地理
  title: 自然灾害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自然灾害只有纯自然原因，忽略人类活动可诱发或加剧灾害
    - 能指出并纠正这一错误：把自然界的异常变化都算作自然灾害，未造成人员和财产损失的不算灾害
  aliases: []
  category: 地理概念
  explanation: 自然灾害是指主要由自然界的异常变化引起的，对人类生命财产与生存环境造成危害的事件或致灾因素。
  misconceptions:
    - 认为自然灾害只有纯自然原因，忽略人类活动可诱发或加剧灾害
    - 把自然界的异常变化都算作自然灾害，未造成人员和财产损失的不算灾害
    - 将人为原因引起的火灾、污染等也归类为自然灾害
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:自然资源
  type: Concept
  subject: 地理
  title: 自然资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将汽油、钢铁等经过人类加工的产品当作自然资源。
    - 能指出并纠正这一错误：认为粮食、蔬菜属于自然资源，实际是农业产品，不是直接从自然界获得。
  aliases: []
  category: 地理概念
  explanation: 人类直接从自然界获得，用于生活和生产的物质和能量，主要包括水资源、土地资源、矿产资源、气候资源、生物资源和海洋资源等。
  misconceptions:
    - 将汽油、钢铁等经过人类加工的产品当作自然资源。
    - 认为粮食、蔬菜属于自然资源，实际是农业产品，不是直接从自然界获得。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:节日习俗
  type: Concept
  subject: 地理
  title: 节日习俗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为圣诞节是中国传统的节日习俗
    - 能指出并纠正这一错误：误以为春节是欧美国家的节日习俗
  aliases: []
  category: 地理文化
  explanation: 节日习俗是节日期间人们遵循的风俗和习惯，如中国的春节和欧美的圣诞节。
  misconceptions:
    - 认为圣诞节是中国传统的节日习俗
    - 误以为春节是欧美国家的节日习俗
    - 把万圣节习俗当作日本节日习俗
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:苏伊士运河
  type: Concept
  subject: 地理
  title: 苏伊士运河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将苏伊士运河当作欧洲与非洲的分界线
    - 能指出并纠正这一错误：误认为苏伊士运河沟通大西洋与太平洋，与巴拿马运河混淆
  aliases: []
  category: 地理事物
  explanation: 苏伊士运河是亚洲和非洲的分界线。
  misconceptions:
    - 误将苏伊士运河当作欧洲与非洲的分界线
    - 误认为苏伊士运河沟通大西洋与太平洋，与巴拿马运河混淆
    - 误以为苏伊士运河位于巴拿马地峡
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:英语
  type: Concept
  subject: 地理
  title: 英语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把英语说成使用人数最多的语言，实际母语人数少于汉语
    - 能指出并纠正这一错误：以为英语母语国家只有英美，忽略加拿大、澳大利亚等国
  aliases: []
  category: 地理
  explanation: 英语是世界上使用范围最广的语言，广泛应用于国际会议和国际交往，主要分布在英国、美国、加拿大、澳大利亚等国。
  misconceptions:
    - 把英语说成使用人数最多的语言，实际母语人数少于汉语
    - 以为英语母语国家只有英美，忽略加拿大、澳大利亚等国
    - 认为只有英国英语才是标准英语，美式等其他变体不是英语
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:莫斯科
  type: Concept
  subject: 地理
  title: 莫斯科
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为莫斯科位于亚洲部分，实际在欧洲部分西部
    - 能指出并纠正这一错误：误以为莫斯科是沿海港口城市，实际是内陆城市
  aliases: []
  category: 地理
  explanation: 俄罗斯首都，位于欧洲部分西部，是政治、经济、文化、交通中心，也是最大工业中心和商业中心。
  misconceptions:
    - 认为莫斯科位于亚洲部分，实际在欧洲部分西部
    - 误以为莫斯科是沿海港口城市，实际是内陆城市
    - 认为莫斯科只是政治中心，忽视它也是最大工业中心
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:萨赫勒地区
  type: Concept
  subject: 地理
  title: 萨赫勒地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为萨赫勒地区位于撒哈拉沙漠北部，实际在南部与草原过渡带。
    - 能指出并纠正这一错误：误以为荒漠化只由人为原因造成，忽略自然因素如气候干旱。
  aliases: []
  category: 地理区域
  explanation: 撒哈拉沙漠南部向热带草原过渡的东西向狭长地带，荒漠化严重，既有自然原因也有人为原因。
  misconceptions:
    - 误认为萨赫勒地区位于撒哈拉沙漠北部，实际在南部与草原过渡带。
    - 误以为荒漠化只由人为原因造成，忽略自然因素如气候干旱。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S4.md
- id: concept:地理:蓝天保卫战
  type: Concept
  subject: 地理
  title: 蓝天保卫战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蓝天保卫战只针对汽车尾气，不含工业废气和燃煤治理。
    - 能指出并纠正这一错误：将蓝天保卫战与垃圾分类混为一谈，认为属于土壤污染治理。
  aliases: []
  category: 环境保护政策
  explanation: 我国为改善空气质量而实施的一系列措施，包括治理工业废气、减少污染物排放等。
  misconceptions:
    - 认为蓝天保卫战只针对汽车尾气，不含工业废气和燃煤治理。
    - 将蓝天保卫战与垃圾分类混为一谈，认为属于土壤污染治理。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:蓝天碧水净土保卫战
  type: Concept
  subject: 地理
  title: 蓝天碧水净土保卫战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把治理土壤污染的“净土”内容归入蓝天保卫战，混淆三大行动各自主攻方向。
    - 能指出并纠正这一错误：认为碧水保卫战只治理河流，不包括湖泊和海洋。
  aliases: []
  category: 环境政策
  explanation: 我国为改善环境质量而实施的污染防治行动，包括大气、水、土壤污染治理。
  misconceptions:
    - 把治理土壤污染的“净土”内容归入蓝天保卫战，混淆三大行动各自主攻方向。
    - 认为碧水保卫战只治理河流，不包括湖泊和海洋。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:行道树的作用
  type: Concept
  subject: 地理
  title: 行道树的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行道树只起绿化美化作用，忽视其杀菌、防尘等功能
    - 能指出并纠正这一错误：误以为行道树没有降低噪音的功能，实际可以降噪
  aliases: []
  category: 地理知识
  explanation: 行道树具有绿化、遮阴、改变城乡景观等作用，还具有杀菌、防尘、防风、降低噪音、净化空气等功能。
  misconceptions:
    - 认为行道树只起绿化美化作用，忽视其杀菌、防尘等功能
    - 误以为行道树没有降低噪音的功能，实际可以降噪
    - 把行道树的作用等同于森林涵养水源，忽略其改变城乡景观功能
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:行道树的选择标准
  type: Concept
  subject: 地理
  title: 行道树的选择标准
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行道树只要美观即可，忽视适应性强、病虫害少的要求
    - 能指出并纠正这一错误：误以为所有树种都适合做行道树，实际需抗污染、耐修剪等
  aliases: []
  category: 地理知识
  explanation: 行道树的选择需考虑养护管理要求（适应性强、病虫害少）和景观效果要求（干挺枝秀、景观持久）。
  misconceptions:
    - 认为行道树只要美观即可，忽视适应性强、病虫害少的要求
    - 误以为所有树种都适合做行道树，实际需抗污染、耐修剪等
    - 将景观效果与养护管理要求割裂，只考虑其中一方面
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:西伯利亚大铁路
  type: Concept
  subject: 地理
  title: 西伯利亚大铁路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为西伯利亚大铁路只经过亚洲，实际也经过欧洲部分
    - 能指出并纠正这一错误：误以为该铁路连接莫斯科和圣彼得堡，实际连接符拉迪沃斯托克
  aliases:
    - 西伯利亚铁路
  category: 交通
  explanation: 西伯利亚大铁路连接莫斯科和符拉迪沃斯托克，带动了东部地区经济发展。
  misconceptions:
    - 认为西伯利亚大铁路只经过亚洲，实际也经过欧洲部分
    - 误以为该铁路连接莫斯科和圣彼得堡，实际连接符拉迪沃斯托克
    - 认为该铁路带动了西部经济，实际带动了东部地区发展
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S3.md
- id: concept:地理:西北地区
  type: Concept
  subject: 地理
  title: 西北地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为西北地区全部位于季风区内，实际是非季风区
    - 能指出并纠正这一错误：把西北地区气候类型说成温带季风气候，实际是温带大陆性气候
  aliases: []
  category: 地理
  explanation: 位于我国西北非季风区，气候干旱，以高原和盆地为主，是我国主要天然牧场。
  misconceptions:
    - 误认为西北地区全部位于季风区内，实际是非季风区
    - 把西北地区气候类型说成温带季风气候，实际是温带大陆性气候
    - 认为西北地区降水稀少因纬度高，实际是深居内陆距海远
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:西气东输工程
  type: Concept
  subject: 地理
  title: 西气东输工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为西气东输输送的是石油，实际是天然气。
    - 能指出并纠正这一错误：将西气东输的运输方式说成铁路运输，实际是管道运输。
  aliases: []
  category: 重大工程
  explanation: 西气东输工程是我国西部大开发的标志性工程之一，采用管道运输方式，将天然气资源跨区域输送至中东部地区。
  misconceptions:
    - 认为西气东输输送的是石油，实际是天然气。
    - 将西气东输的运输方式说成铁路运输，实际是管道运输。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S3.md
- id: concept:地理:西班牙语
  type: Concept
  subject: 地理
  title: 西班牙语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西班牙语主要在西班牙，忽略拉丁美洲使用国家众多
    - 能指出并纠正这一错误：把西班牙语和葡萄牙语混用，以为巴西官方语言是西班牙语
  aliases: []
  category: 地理
  explanation: 西班牙语主要在西班牙和拉丁美洲的许多国家使用。
  misconceptions:
    - 误以为西班牙语主要在西班牙，忽略拉丁美洲使用国家众多
    - 把西班牙语和葡萄牙语混用，以为巴西官方语言是西班牙语
    - 认为西班牙语只在欧洲有人使用，不知道美国南部也有不少使用者
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:西部高原
  type: Concept
  subject: 地理
  title: 西部高原
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为澳大利亚西部高原因面积小，实际约占大陆60%
    - 能指出并纠正这一错误：误以为西部高原气候湿润，实际炎热干燥，沙漠广布
  aliases: []
  category: 地理
  explanation: 澳大利亚西部广阔高原，地势不高，面积约占大陆60%，沙漠广布，气候炎热干燥。
  misconceptions:
    - 认为澳大利亚西部高原因面积小，实际约占大陆60%
    - 误以为西部高原气候湿润，实际炎热干燥，沙漠广布
    - 将西部高原与中部平原混淆，忽略其地势较高、沙漠分布的特点
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:见面礼仪
  type: Concept
  subject: 地理
  title: 见面礼仪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为双手合十礼适用于所有亚洲国家，对韩国人也行合十礼
    - 能指出并纠正这一错误：混淆拱手礼与拥抱礼使用场合，在庄重祭祀场合对长辈行拥抱礼
  aliases:
    - 见面礼节
  category: 文化
  explanation: 不同国家和地区有不同的见面礼仪，如拱手礼、双手合十礼、拥抱礼、握手礼等。
  misconceptions:
    - 误以为双手合十礼适用于所有亚洲国家，对韩国人也行合十礼
    - 混淆拱手礼与拥抱礼使用场合，在庄重祭祀场合对长辈行拥抱礼
    - 认为见面礼仪仅有握手一种，否认鞠躬、亲吻脸颊等其他形式的存在
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:贝加尔湖
  type: Concept
  subject: 地理
  title: 贝加尔湖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为贝加尔湖是咸水湖，实际它是世界蓄水量最大的淡水湖。
    - 能指出并纠正这一错误：把贝加尔湖当世界最大湖泊，实际最大湖泊是里海（咸水湖）。
  aliases:
    - 贝加尔湖
  category: 湖泊
  explanation: 贝加尔湖位于中西伯利亚高原南部，是世界上最深、蓄水量最大的淡水湖。
  misconceptions:
    - 误认为贝加尔湖是咸水湖，实际它是世界蓄水量最大的淡水湖。
    - 把贝加尔湖当世界最大湖泊，实际最大湖泊是里海（咸水湖）。
    - 认为贝加尔湖位于东欧平原，实际在中西伯利亚高原南部。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:赤道
  type: Concept
  subject: 地理
  title: 赤道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为赤道是东西半球的分界线，实际是南北半球分界线
    - 能指出并纠正这一错误：误认为赤道周长约4万千米，却写成4万米
  aliases: []
  category: 地理概念
  explanation: 地球上与南北两极距离相等的大圆圈，是最大的纬线圈，纬度为0°。
  misconceptions:
    - 误认为赤道是东西半球的分界线，实际是南北半球分界线
    - 误认为赤道周长约4万千米，却写成4万米
    - 误认为赤道是地球上最长的经线，实际是最大的纬线圈
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:跨学科主题学习
  type: Concept
  subject: 地理
  title: 跨学科主题学习
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把跨学科学习当成简单拼盘，如地理课抄历史资料，不融合分析
    - 能指出并纠正这一错误：只从单一学科视角回答，如分析某区域问题时只讲气候不提经济
  aliases: []
  category: 学习方法
  explanation: 围绕某一主题，综合运用多学科知识进行探究和实践的学习方式。
  misconceptions:
    - 把跨学科学习当成简单拼盘，如地理课抄历史资料，不融合分析
    - 只从单一学科视角回答，如分析某区域问题时只讲气候不提经济
    - 认为跨学科主题学习就是做手抄报，不进行实地探究和问题解决
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C6/sections/S1.md
- id: concept:地理:跨流域调水
  type: Concept
  subject: 地理
  title: 跨流域调水
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为跨流域调水是为了解决水资源时间分布不均，实际是空间分布不均。
    - 能指出并纠正这一错误：把修建水库与跨流域调水混为一谈，认为水库属于跨流域调水。
  aliases:
    - 调水工程
  category: 地理措施
  explanation: 为改善水资源空间分布不平衡状况，把一个地方的水资源调到另一个地方的工程措施，如南水北调、引黄入晋等。
  misconceptions:
    - 认为跨流域调水是为了解决水资源时间分布不均，实际是空间分布不均。
    - 把修建水库与跨流域调水混为一谈，认为水库属于跨流域调水。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:车牌号码的构成
  type: Concept
  subject: 地理
  title: 车牌号码的构成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为车牌首位字母代表省份，实际汉字代表省份
    - 能指出并纠正这一错误：认为后五位必须全是数字，忽略可能包含字母
  aliases:
    - 车牌
  category: 地理
  explanation: 车牌号码由汉字、字母和数字组成，首位汉字代表省级行政区简称，第一个字母代表发牌机关代号，后五位为数字或字母。
  misconceptions:
    - 误认为车牌首位字母代表省份，实际汉字代表省份
    - 认为后五位必须全是数字，忽略可能包含字母
    - 误认为所有车牌第一个字母相同，忽略不同城市发牌机关代号不同
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:重点海域综合治理
  type: Concept
  subject: 地理
  title: 重点海域综合治理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为重点海域综合治理仅指清理海上漂浮物，不包括污染源管控。
    - 能指出并纠正这一错误：将重点海域综合治理等同于海洋渔业资源开发，方向错误。
  aliases: []
  category: 环境保护
  explanation: 对污染严重的海域实施综合治理，包括执法、监管和修复。
  misconceptions:
    - 认为重点海域综合治理仅指清理海上漂浮物，不包括污染源管控。
    - 将重点海域综合治理等同于海洋渔业资源开发，方向错误。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:金砖国家
  type: Concept
  subject: 地理
  title: 金砖国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为金砖国家只有巴西、俄罗斯、印度、中国四国，忽略南非和扩员国。
    - 能指出并纠正这一错误：把日本、韩国或澳大利亚算作金砖成员，实际这些国家不是。
  aliases:
    - BRICS
  category: 地理
  explanation: 金砖国家最初指巴西、俄罗斯、印度和中国，后南非加入，2024年扩员至11国，包括沙特阿拉伯、埃及、阿联酋、伊朗、埃塞俄比亚和印度尼西亚。
  misconceptions:
    - 误以为金砖国家只有巴西、俄罗斯、印度、中国四国，忽略南非和扩员国。
    - 把日本、韩国或澳大利亚算作金砖成员，实际这些国家不是。
    - 记不清2024年新增国家，常漏掉伊朗、埃塞俄比亚、印度尼西亚等。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S6.md
- id: concept:地理:银河系
  type: Concept
  subject: 地理
  title: 银河系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为太阳系位于银河系中心，实际太阳系位于猎户臂上
    - 能指出并纠正这一错误：误把银河系当作整个宇宙，实际银河系只是宇宙中的一个星系
  aliases:
    - 银河
  category: 天体系统
  explanation: 地球所在的星系，包含太阳系，在夜空中呈现为乳白色光带。
  misconceptions:
    - 误认为太阳系位于银河系中心，实际太阳系位于猎户臂上
    - 误把银河系当作整个宇宙，实际银河系只是宇宙中的一个星系
    - 误以为夜空中乳白色光带就是银河系全部，实际那只是银河系的一部分
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:长江三峡水利枢纽工程
  type: Concept
  subject: 地理
  title: 长江三峡水利枢纽工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为三峡工程位于长江下游，实际位于西陵峡（湖北宜昌）
    - 能指出并纠正这一错误：只答防洪功能，忽略发电、航运等综合效益
  aliases:
    - 三峡工程
  category: 地理
  explanation: 位于西陵峡的大型水利工程，具有防洪、发电、航运等综合效益。
  misconceptions:
    - 误认为三峡工程位于长江下游，实际位于西陵峡（湖北宜昌）
    - 只答防洪功能，忽略发电、航运等综合效益
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:长江不同河段的名称
  type: Concept
  subject: 地理
  title: 长江不同河段的名称
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把金沙江当作中游河段，实际金沙江是上游
    - 能指出并纠正这一错误：误认为川江在下游，或把扬子江当上游名称
  aliases:
    - 长江河段
  category: 地理
  explanation: 长江上游有通天河、金沙江、川江等名称，中游有荆江，下游古称扬子江。
  misconceptions:
    - 把金沙江当作中游河段，实际金沙江是上游
    - 误认为川江在下游，或把扬子江当上游名称
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:长江概况
  type: Concept
  subject: 地理
  title: 长江概况
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为长江发源于巴颜喀拉山，实际发源于唐古拉山脉
    - 能指出并纠正这一错误：把长江注入的海写成渤海，实际是东海
  aliases:
    - 长江
  category: 地理
  explanation: 长江是我国第一长河，发源于唐古拉山脉，注入东海，全长约6300千米。
  misconceptions:
    - 误认为长江发源于巴颜喀拉山，实际发源于唐古拉山脉
    - 把长江注入的海写成渤海，实际是东海
    - 记错长度，写成6千米或630千米
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:长江水能资源
  type: Concept
  subject: 地理
  title: 长江水能资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水能资源集中于下游，实际主要在中上游
    - 能指出并纠正这一错误：误说蕴藏量占全国一半，实际约占40%
  aliases:
    - 长江水电
    - 长江的水能资源
  category: 资源开发
  explanation: 长江流域水能资源丰富，蕴藏量约占全国的40%，已建成多座水电站。
  misconceptions:
    - 认为水能资源集中于下游，实际主要在中上游
    - 误说蕴藏量占全国一半，实际约占40%
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:长江的开发与治理
  type: Concept
  subject: 地理
  title: 长江的开发与治理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为治理长江只需加固堤防防洪，忽略生态保护与污染治理
    - 能指出并纠正这一错误：误以为十年禁渔是黄河流域措施，实际是长江流域
  aliases:
    - 长江治理
  category: 地理
  explanation: 通过生态保护、污染治理、十年禁渔等措施，促进长江流域可持续发展。
  misconceptions:
    - 认为治理长江只需加固堤防防洪，忽略生态保护与污染治理
    - 误以为十年禁渔是黄河流域措施，实际是长江流域
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:长江的水文特征
  type: Concept
  subject: 地理
  title: 长江的水文特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为长江有结冰期，实际冬季不结冰（秦岭-淮河以南）
    - 能指出并纠正这一错误：认为下游水流湍急，实际下游河道宽阔、水流缓慢
  aliases: []
  category: 地理
  explanation: 长江水量大、汛期长，中下游河道宽阔，水流缓慢，利于航运。
  misconceptions:
    - 误认为长江有结冰期，实际冬季不结冰（秦岭-淮河以南）
    - 认为下游水流湍急，实际下游河道宽阔、水流缓慢
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:长江经济带
  type: Concept
  subject: 地理
  title: 长江经济带
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为长江经济带包括所有沿海省份，实际覆盖11个省市
    - 能指出并纠正这一错误：忽略生态优先原则，认为只发展经济不顾生态
  aliases: []
  category: 地理
  explanation: 覆盖11个省市，是我国综合实力最强的区域之一，以生态优先、绿色发展为引领。
  misconceptions:
    - 误认为长江经济带包括所有沿海省份，实际覆盖11个省市
    - 忽略生态优先原则，认为只发展经济不顾生态
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:长芦盐场
  type: Concept
  subject: 地理
  title: 长芦盐场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把长芦盐场的位置错记为山东半岛南部的黄海沿岸，实际位于渤海沿岸
    - 能指出并纠正这一错误：误以为长芦盐场在南方沿海，认为降水越多越利于晒盐
  aliases: []
  category: 海洋化学
  explanation: 位于渤海沿岸的著名盐场，年产海盐量约占全国海盐总产量的1/4。
  misconceptions:
    - 把长芦盐场的位置错记为山东半岛南部的黄海沿岸，实际位于渤海沿岸
    - 误以为长芦盐场在南方沿海，认为降水越多越利于晒盐
    - 在图上标盐场时，将长芦盐场误标在连云港附近的黄海沿岸
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S4.md
- id: concept:地理:防灾减灾体系
  type: Concept
  subject: 地理
  title: 防灾减灾体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为防灾减灾体系只是灾中救援和灾后恢复，忽略监测预警和防御环节
    - 能指出并纠正这一错误：误把监测预警当作灾害防御，搞混体系各环节的先后顺序
  aliases: []
  category: 防治措施
  explanation: 完整的防灾减灾体系包括灾害监测与预警、灾害防御、救灾准备、灾中救援、灾后恢复等多个环节。
  misconceptions:
    - 认为防灾减灾体系只是灾中救援和灾后恢复，忽略监测预警和防御环节
    - 误把监测预警当作灾害防御，搞混体系各环节的先后顺序
    - 以为防灾减灾只靠政府救援，忽略个人日常准备和自救互救
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C6/sections/S1.md
- id: concept:地理:阿拉伯语
  type: Concept
  subject: 地理
  title: 阿拉伯语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为阿拉伯语只在西亚使用，忽略北非地区也广泛使用
    - 能指出并纠正这一错误：以为所有中东国家都说阿拉伯语，忘记伊朗、土耳其使用其他语言
  aliases: []
  category: 地理
  explanation: 阿拉伯语是联合国工作语言之一，主要分布在西亚和北非地区。
  misconceptions:
    - 认为阿拉伯语只在西亚使用，忽略北非地区也广泛使用
    - 以为所有中东国家都说阿拉伯语，忘记伊朗、土耳其使用其他语言
    - 将阿拉伯语视为仅为宗教仪式用语，忽略其作为日常语言的功能
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:阿斯旺大坝
  type: Concept
  subject: 地理
  title: 阿斯旺大坝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为阿斯旺大坝建在尼罗河支流上，实际位于干流。
    - 能指出并纠正这一错误：以为阿斯旺大坝形成的湖泊是维多利亚湖，实际是纳赛尔水库。
  aliases: []
  category: 地理
  explanation: 阿斯旺大坝建于1970年，位于尼罗河干流，形成纳赛尔水库，对灌溉、防洪有重要作用，但也带来泥沙减少、三角洲退缩等负面影响。
  misconceptions:
    - 认为阿斯旺大坝建在尼罗河支流上，实际位于干流。
    - 以为阿斯旺大坝形成的湖泊是维多利亚湖，实际是纳赛尔水库。
    - 只看到灌溉防洪好处，忽略泥沙减少和三角洲退缩等副作用。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S6.md
- id: concept:地理:阿纳萨齐文明
  type: Concept
  subject: 地理
  title: 阿纳萨齐文明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为阿纳萨齐文明毁于战争或瘟疫，忽略过度砍伐的根本原因。
    - 能指出并纠正这一错误：将阿纳萨齐人混同于玛雅等其他美洲文明。
  aliases:
    - 阿纳萨齐文化
  category: 历史地理
  explanation: 阿纳萨齐人是北美古代文明，因过度砍伐森林导致环境恶化而衰落。
  misconceptions:
    - 误以为阿纳萨齐文明毁于战争或瘟疫，忽略过度砍伐的根本原因。
    - 将阿纳萨齐人混同于玛雅等其他美洲文明。
    - 认为环境恶化只是自然变化，没有认识到人类活动的关键作用。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:陆半球和水半球
  type: Concept
  subject: 地理
  title: 陆半球和水半球
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为陆半球是陆地面积大于海洋面积的半球，实际仍以海洋为主。
    - 能指出并纠正这一错误：误以为陆半球位于北半球、水半球位于南半球，实际两个半球中心不同。
  aliases: []
  category: 地理概念
  explanation: 陆地分布最集中的半球称为陆半球，海洋分布最集中的半球称为水半球。
  misconceptions:
    - 误以为陆半球是陆地面积大于海洋面积的半球，实际仍以海洋为主。
    - 误以为陆半球位于北半球、水半球位于南半球，实际两个半球中心不同。
    - 误以为水半球内没有陆地，实际存在少量陆地。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:陆地地形类型
  type: Concept
  subject: 地理
  title: 陆地地形类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为高原表面一定平坦，忽略起伏
    - 能指出并纠正这一错误：混淆山地与丘陵的起伏程度，认为山体高度大
  aliases:
    - 地形类型
  category: 地理概念
  explanation: 陆地地形包括平原、高原、丘陵、山地、盆地等基本类型。
  misconceptions:
    - 误以为高原表面一定平坦，忽略起伏
    - 混淆山地与丘陵的起伏程度，认为山体高度大
    - 误认为盆地一定是中间低四周高，忽视其他形态
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:降水
  type: Concept
  subject: 地理
  title: 降水
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为降水就是降雨，把下雪、冰雹排除在降水之外
    - 能指出并纠正这一错误：认为降水量只算下雨的毫米数，不算降雪融化的水量
  aliases:
    - 降水量
  category: 气候要素
  explanation: 降水是指从大气中降落到地面的液态或固态水，是气候的基本要素之一。
  misconceptions:
    - 以为降水就是降雨，把下雪、冰雹排除在降水之外
    - 认为降水量只算下雨的毫米数，不算降雪融化的水量
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:降水的时间差异
  type: Concept
  subject: 地理
  title: 降水的时间差异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把地中海气候的降水特征说成夏季多雨，实际是冬季多雨。
    - 能指出并纠正这一错误：认为热带雨林气候是全年多雨且均匀，而热带季风气候也是全年多雨，忽略季风气候的旱季。
  aliases:
    - 降水季节变化
  category: 地理概念
  explanation: 同一地区不同时间的降水差异，大致分为全年多雨且均匀、全年少雨、夏季多雨和冬季多雨四种情况。
  misconceptions:
    - 把地中海气候的降水特征说成夏季多雨，实际是冬季多雨。
    - 认为热带雨林气候是全年多雨且均匀，而热带季风气候也是全年多雨，忽略季风气候的旱季。
    - 误以为所有夏季多雨的气候都是热带季风气候，如温带季风气候也被误认。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S1.md
- id: concept:地理:降水量柱状图
  type: Concept
  subject: 地理
  title: 降水量柱状图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：读图时把柱状高度当气温，混淆降水量与气温
    - 能指出并纠正这一错误：判断降水季节变化时只看全年总降水，忽略各月分布
  aliases:
    - 降水柱状图
  category: 地理技能
  explanation: 用柱状图表示各月降水量，反映降水的季节变化。
  misconceptions:
    - 读图时把柱状高度当气温，混淆降水量与气温
    - 判断降水季节变化时只看全年总降水，忽略各月分布
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S2.md
- id: concept:地理:雄安新区
  type: Concept
  subject: 地理
  title: 雄安新区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为雄安新区属于北京，实际位于河北省
    - 能指出并纠正这一错误：把北京城市副中心理解为在雄安，混淆通州与雄安
  aliases: []
  category: 人文地理
  explanation: 雄安新区位于河北，是北京非首都功能疏解的集中承载地，与北京城市副中心形成北京新的两翼。
  misconceptions:
    - 误认为雄安新区属于北京，实际位于河北省
    - 把北京城市副中心理解为在雄安，混淆通州与雄安
    - 以为雄安是首都所有功能转移地，忽略仅限非首都功能
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S1.md
- id: concept:地理:霍尔木兹海峡
  type: Concept
  subject: 地理
  title: 霍尔木兹海峡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为霍尔木兹海峡位于波斯湾西口，实际在波斯湾东口。
    - 能指出并纠正这一错误：误以为霍尔木兹海峡是中东石油唯一外运通道，实际还有输油管道。
  aliases: []
  category: 地理位置
  explanation: 霍尔木兹海峡位于波斯湾东口，是波斯湾的唯一出海口，中东石油外运的重要通道。
  misconceptions:
    - 误认为霍尔木兹海峡位于波斯湾西口，实际在波斯湾东口。
    - 误以为霍尔木兹海峡是中东石油唯一外运通道，实际还有输油管道。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S3.md
- id: concept:地理:青藏地区
  type: Concept
  subject: 地理
  title: 青藏地区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为青藏地区地势低平，实际海拔高
    - 能指出并纠正这一错误：把高寒畜牧业说成发展旱作农业，或忽略河谷农业分布
  aliases: []
  category: 地理
  explanation: 位于青藏高原，地势高，以高寒畜牧业为主，河谷地带发展河谷农业。
  misconceptions:
    - 误认为青藏地区地势低平，实际海拔高
    - 把高寒畜牧业说成发展旱作农业，或忽略河谷农业分布
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:非可再生资源
  type: Concept
  subject: 地理
  title: 非可再生资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将太阳能、风能、水能等归入非可再生资源
    - 能指出并纠正这一错误：认为煤、石油可以人工合成，因此属于可再生资源
  aliases:
    - 不可再生资源
  category: 地理概念
  explanation: 用一点就少一点，在相当长的时间内不可更新也不能再生的自然资源，如化石燃料、金属矿产、非金属矿产等。
  misconceptions:
    - 误将太阳能、风能、水能等归入非可再生资源
    - 认为煤、石油可以人工合成，因此属于可再生资源
    - 把森林资源归为非可再生资源，认为砍伐后不能恢复
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S1.md
- id: concept:地理:非洲
  type: Concept
  subject: 地理
  title: 非洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为非洲是世界面积最大的洲
    - 能指出并纠正这一错误：误以为非洲全境位于南半球，忽略跨赤道两侧
  aliases: []
  category: 地理区域
  explanation: 非洲是世界第二大洲。
  misconceptions:
    - 误认为非洲是世界面积最大的洲
    - 误以为非洲全境位于南半球，忽略跨赤道两侧
    - 误把直布罗陀海峡作为亚非分界线，实际是苏伊士运河
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:非洲大陆地形特点
  type: Concept
  subject: 地理
  title: 非洲大陆地形特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为非洲地形以山地为主，忽视高原为主
    - 能指出并纠正这一错误：混淆非洲地势东南高、西北低与亚洲地势特征
  aliases: []
  category: 地理事实
  explanation: 非洲大陆地势东南高、西北低，起伏不大，地形以高原为主，中部刚果盆地地势较低。
  misconceptions:
    - 误以为非洲地形以山地为主，忽视高原为主
    - 混淆非洲地势东南高、西北低与亚洲地势特征
    - 忽略刚果盆地的存在，误以为非洲全是高原
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C2/sections/S2.md
- id: concept:地理:页岩气
  type: Concept
  subject: 地理
  title: 页岩气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为页岩气是常规天然气，直接从岩层中涌出，实际需压裂开采。
    - 能指出并纠正这一错误：认为中国页岩气产量世界第一，实际美国产量占比很高。
  aliases: []
  category: 自然资源
  explanation: 页岩气是从地下页岩层中开采出来的天然气，美国页岩气产量在天然气产量中占比很高。
  misconceptions:
    - 误认为页岩气是常规天然气，直接从岩层中涌出，实际需压裂开采。
    - 认为中国页岩气产量世界第一，实际美国产量占比很高。
    - 将页岩气与煤层气混淆，二者赋存地层不同。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:预期寿命
  type: Concept
  subject: 地理
  title: 预期寿命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把预期寿命理解为当前人口的平均年龄，实际是新生婴儿预期存活的年数。
    - 能指出并纠正这一错误：以为预期寿命是过去已故人口的平均寿命，而不是对未来新生儿的预期。
  aliases: []
  category: 地理概念
  explanation: 新生婴儿预期可以存活的平均年数，用于衡量国民健康状况和医疗服务水平。
  misconceptions:
    - 把预期寿命理解为当前人口的平均年龄，实际是新生婴儿预期存活的年数。
    - 以为预期寿命是过去已故人口的平均寿命，而不是对未来新生儿的预期。
    - 认为预期寿命只由医疗水平决定，忽略生活水平和环境的影响。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C5/sections/S1.md
- id: concept:地理:风向与风力
  type: Concept
  subject: 地理
  title: 风向与风力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将风向说成风的去向，如吹向北方说成北风（应为南风）
    - 能指出并纠正这一错误：认为风力级数越大风速越小，实际级数大风速强
  aliases: []
  category: 地理概念
  explanation: 风向是风吹来的方向，风力表示风的强弱，级数越大风力越强。
  misconceptions:
    - 误将风向说成风的去向，如吹向北方说成北风（应为南风）
    - 认为风力级数越大风速越小，实际级数大风速强
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:饮食习俗
  type: Concept
  subject: 地理
  title: 饮食习俗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有地区饮食习俗相同，只是口味不同
    - 能指出并纠正这一错误：误以为西餐用餐方式与中餐完全一样
  aliases: []
  category: 地理文化
  explanation: 饮食习俗是人们在加工、制作、食用食物和饮料过程中形成的习俗风尚，差异体现在食材、烹饪方式和用餐方式等方面。
  misconceptions:
    - 认为所有地区饮食习俗相同，只是口味不同
    - 误以为西餐用餐方式与中餐完全一样
    - 忽视食材差异，以为全球都以米饭为主食
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C4/sections/S3.md
- id: concept:地理:马六甲海峡
  type: Concept
  subject: 地理
  title: 马六甲海峡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把马六甲海峡说成位于马来半岛和菲律宾群岛之间，忽略苏门答腊岛
    - 能指出并纠正这一错误：误以为马六甲海峡是沟通大西洋与印度洋的航道，实际是太平洋与印度洋
  aliases:
    - 马六甲
  category: 地理
  explanation: 马六甲海峡位于苏门答腊岛和马来半岛之间，是连接太平洋与印度洋的重要水道，是世界海上运输的咽喉之一。
  misconceptions:
    - 把马六甲海峡说成位于马来半岛和菲律宾群岛之间，忽略苏门答腊岛
    - 误以为马六甲海峡是沟通大西洋与印度洋的航道，实际是太平洋与印度洋
    - 认为马六甲海峡是唯一连接两大洋的通道，忽略其他海峡如巴拿马运河等
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:马来群岛
  type: Concept
  subject: 地理
  title: 马来群岛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为马来群岛全部属于印度尼西亚，忽略菲律宾、文莱等国部分
    - 能指出并纠正这一错误：认为马来群岛地处板块内部，因此火山地震少，实际在交界地带多火山地震
  aliases:
    - Malay Archipelago
  category: 地理区域
  explanation: 马来群岛由2万多个岛屿组成，地形崎岖，地处板块交界地带，多火山地震，印度尼西亚是世界上火山较多的国家。
  misconceptions:
    - 误以为马来群岛全部属于印度尼西亚，忽略菲律宾、文莱等国部分
    - 认为马来群岛地处板块内部，因此火山地震少，实际在交界地带多火山地震
    - 把马来群岛的地形说成以平原为主，实际是山岭纵横、地形崎岖
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:马来群岛的地形特征
  type: Concept
  subject: 地理
  title: 马来群岛的地形特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把马来群岛的火山灰土壤说成贫瘠，实际火山灰土壤肥沃
    - 能指出并纠正这一错误：误以为马来群岛气候类型是热带草原气候，实际是热带雨林气候
  aliases: []
  category: 地理
  explanation: 马来群岛山岭纵横、地形崎岖，地处板块交界地带，多火山地震，火山灰土壤肥沃。
  misconceptions:
    - 把马来群岛的火山灰土壤说成贫瘠，实际火山灰土壤肥沃
    - 误以为马来群岛气候类型是热带草原气候，实际是热带雨林气候
    - 混淆马来群岛与马来半岛的地形特征，说成平原广阔
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C2/sections/S1.md
- id: concept:地理:骑在羊背上的国家
  type: Concept
  subject: 地理
  title: 骑在羊背上的国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为澳大利亚羊的数量世界第一，实际其羊毛产量和出口量居首。
    - 能指出并纠正这一错误：认为新西兰也被称为“骑在羊背上的国家”，该称号专指澳大利亚。
  aliases: []
  category: 地理
  explanation: 澳大利亚养羊业发达，羊毛产量和出口量居世界首位，羊肉产量出口量也居前列，因此得名。
  misconceptions:
    - 误以为澳大利亚羊的数量世界第一，实际其羊毛产量和出口量居首。
    - 认为新西兰也被称为“骑在羊背上的国家”，该称号专指澳大利亚。
    - 认为养羊业优势在羊肉出口，实际羊毛更为突出。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S4.md
- id: concept:地理:高原、高山气候
  type: Concept
  subject: 地理
  title: 高原、高山气候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将高原气候与高山气候混为一谈，忽略高山气候垂直变化更明显。
    - 能指出并纠正这一错误：误认为高原气候四季如春，实际昼夜温差大，冬季严寒。
  aliases:
    - 高山气候
    - 高原高山气候
    - 高原气候
  category: 气候类型
  explanation: 海拔高，气温低，垂直变化明显的气候类型。
  misconceptions:
    - 将高原气候与高山气候混为一谈，忽略高山气候垂直变化更明显。
    - 误认为高原气候四季如春，实际昼夜温差大，冬季严寒。
    - 认为高原和高山气候只分布在高纬度，忽略低纬高海拔地区。
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:高新技术产业
  type: Concept
  subject: 地理
  title: 高新技术产业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为美国高新技术产业集中在东北部传统工业区，实际主要在硅谷等西部。
    - 能指出并纠正这一错误：把高新技术产业等同于信息技术产业，实际还包括生物、新材料等。
  aliases: []
  category: 经济地理
  explanation: 以信息技术、生物技术、新材料技术等为代表的高新技术产业，是美国经济的重要支柱。
  misconceptions:
    - 认为美国高新技术产业集中在东北部传统工业区，实际主要在硅谷等西部。
    - 把高新技术产业等同于信息技术产业，实际还包括生物、新材料等。
    - 认为高新技术产业在美国经济中地位不高，实际是重要支柱。
  sourceRef: content/八年级/下册/地理/ZTB-8-2-Geography/chapters/C3/sections/S1.md
- id: concept:地理:高速公路
  type: Concept
  subject: 地理
  title: 高速公路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为高速公路属于铁路运输系统，有轨道和信号灯
    - 能指出并纠正这一错误：认为高速公路只允许小汽车通行，货车不能上
  aliases:
    - 高速公路线
  category: 交通运输方式
  explanation: 高速公路是公路运输的重要组成部分，具有高速、高效的特点，我国高速公路网不断优化，对20万以上人口城市覆盖率超过98%。
  misconceptions:
    - 误以为高速公路属于铁路运输系统，有轨道和信号灯
    - 认为高速公路只允许小汽车通行，货车不能上
    - 混淆高速公路与高速铁路，误认为高速公路时速可达350千米
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:高速铁路
  type: Concept
  subject: 地理
  title: 高速铁路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将高速铁路当作交通工具，说‘乘坐高速铁路’而非‘乘坐高速铁路列车’
    - 能指出并纠正这一错误：认为高速铁路采用有缝钢轨，以便热胀冷缩
  aliases:
    - 高铁
  category: 交通运输
  explanation: 设计时速高、采用无缝钢轨、自动控制、多动力车厢的铁路，速度快、安全。
  misconceptions:
    - 误将高速铁路当作交通工具，说‘乘坐高速铁路’而非‘乘坐高速铁路列车’
    - 认为高速铁路采用有缝钢轨，以便热胀冷缩
    - 把高速铁路与磁悬浮列车混为一谈，认为都需要磁力悬浮
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:高速铁路列车
  type: Concept
  subject: 地理
  title: 高速铁路列车
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为高速列车只有车头有动力，车厢均无动力
    - 能指出并纠正这一错误：认为列车外形设计只是为了美观，与减小空气阻力无关
  aliases:
    - 高铁列车
  category: 交通工具
  explanation: 在高速铁路上运行的列车，采用自动控制，多节动力车厢，外形减小空气阻力。
  misconceptions:
    - 认为高速列车只有车头有动力，车厢均无动力
    - 认为列车外形设计只是为了美观，与减小空气阻力无关
    - 认为高速列车在普通铁路上也能保持300千米时速运行
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C5/sections/S5.md
- id: concept:地理:麦哲伦环球航行
  type: Concept
  subject: 地理
  title: 麦哲伦环球航行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为麦哲伦本人完成了全程航行，实际他在菲律宾被杀，船队继续完成
    - 能指出并纠正这一错误：误认为麦哲伦环球航行证明地球是扁平圆形，实际证明是球体
  aliases: []
  category: 地理学史
  explanation: 1519-1522年，麦哲伦船队首次完成环球航行，用事实证明了地球是球体。
  misconceptions:
    - 误认为麦哲伦本人完成了全程航行，实际他在菲律宾被杀，船队继续完成
    - 误认为麦哲伦环球航行证明地球是扁平圆形，实际证明是球体
    - 误认为麦哲伦船队从西班牙出发向西航行，却误写成向东
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:黄河概况
  type: Concept
  subject: 地理
  title: 黄河概况
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄河发源于唐古拉山，实际发源于巴颜喀拉山
    - 能指出并纠正这一错误：把河口、桃花峪的分界顺序弄反，河口是上中游分界，桃花峪是中下游分界
  aliases:
    - 黄河
  category: 地理事实
  explanation: 黄河发源于巴颜喀拉山，注入渤海，是我国第二长河，上中下游分界点是河口和桃花峪。
  misconceptions:
    - 误认为黄河发源于唐古拉山，实际发源于巴颜喀拉山
    - 把河口、桃花峪的分界顺序弄反，河口是上中游分界，桃花峪是中下游分界
    - 误认为黄河是我国第一长河，实际是第二长河
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:黄河水患的治理措施
  type: Concept
  subject: 地理
  title: 黄河水患的治理措施
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为黄河水患只在中游，而忽略下游泥沙淤积形成地上河
    - 能指出并纠正这一错误：误把下游措施说成植树种草，实际应固堤防洪
  aliases:
    - 黄河治理
    - 黄河的治理措施
  category: 地理治理
  explanation: 针对黄河水患，采取上游生态保护、中游水土保持、下游防洪治沙等综合措施。
  misconceptions:
    - 认为黄河水患只在中游，而忽略下游泥沙淤积形成地上河
    - 误把下游措施说成植树种草，实际应固堤防洪
    - 混淆治理措施：上游生态保护，中游水土保持，下游防洪治沙
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S1.md
- id: concept:地理:黄金水道
  type: Concept
  subject: 地理
  title: 黄金水道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为黄金水道指黄河，实际长江因水量大、通航条件优才得此称
    - 能指出并纠正这一错误：只记干流，忽略支流通航里程长，导致评估长江航运价值时偏低
  aliases:
    - 长江黄金水道
  category: 地理
  explanation: 长江因航运条件优越，被誉为我国的“黄金水道”，干支流通航里程长，货运量大。
  misconceptions:
    - 误以为黄金水道指黄河，实际长江因水量大、通航条件优才得此称
    - 只记干流，忽略支流通航里程长，导致评估长江航运价值时偏低
    - 认为长江冬季封冻无法通航，实际中下游冬季不结冰、全年可航
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C4/sections/S4.md
- id: concept:地理:我国人口分布特点
  type: Concept
  subject: 地理
  title: 我国人口分布特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人口分布只由面积决定，忽略地形气候与经济条件。
  aliases:
    - 人口分布东多西少
  category: 地理概念
  explanation: 我国人口分布不均衡，以黑河—腾冲一线为界，东南部人口稠密，西北部人口稀疏；这一格局与地形、气候、经济发展水平密切相关。
  misconceptions:
    - 误认为人口分布只由面积决定，忽略地形气候与经济条件。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:我国的人口政策
  type: Concept
  subject: 地理
  title: 我国的人口政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人口政策只为控制数量，忽略结构与质量问题。
  aliases:
    - 优化生育政策
  category: 地理概念
  explanation: 人口政策随人口形势调整。面对出生率下降和老龄化加剧，我国实施优化生育政策，配套支持措施，促进人口长期均衡发展。
  misconceptions:
    - 误认为人口政策只为控制数量，忽略结构与质量问题。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C3/sections/S2.md
- id: concept:地理:黄土高原的位置和范围
  type: Concept
  subject: 地理
  title: 黄土高原的位置和范围
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄土高原只分布在陕西一省，忽略其跨省范围。
  category: 地理概念
  explanation: 黄土高原位于我国中部偏北，大致以太行山、秦岭、长城和乌鞘岭为界，是世界上黄土分布最集中、最深厚的地区。
  misconceptions:
    - 误认为黄土高原只分布在陕西一省，忽略其跨省范围。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S3.md
- id: concept:地理:水土流失
  type: Concept
  subject: 地理
  title: 水土流失
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为水土流失只是自然现象，忽略人为破坏植被的主导作用。
    - 能指出并纠正这一错误：误认为治理只需修梯田，忽略植被恢复的根本作用。
  aliases:
    - 黄土高原水土流失
  category: 地理概念
  explanation: 黄土高原土质疏松、夏季多暴雨、植被破坏严重，导致水土流失；泥沙汇入黄河使其变黄，治理需生物措施与工程措施结合，如植树种草、打坝淤地。
  misconceptions:
    - 误认为水土流失只是自然现象，忽略人为破坏植被的主导作用。
    - 误认为治理只需修梯田，忽略植被恢复的根本作用。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S3.md
- id: concept:地理:长江中下游平原的农业
  type: Concept
  subject: 地理
  title: 长江中下游平原的农业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为该区农业只靠降水，忽略河湖灌溉与湿地条件。
  aliases:
    - 鱼米之乡
  category: 地理概念
  explanation: 长江中下游平原地势低平、河湖密布、水热充足，是我国重要的水稻和淡水渔业产区，素有“鱼米之乡”之称；城市密集、经济发达。
  misconceptions:
    - 误认为该区农业只靠降水，忽略河湖灌溉与湿地条件。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S4.md
- id: concept:地理:珠江三角洲的外向型经济
  type: Concept
  subject: 地理
  title: 珠江三角洲的外向型经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为珠三角的发展只靠廉价劳动力，忽略毗邻港澳与开放政策的区位优势。
  aliases:
    - 珠三角区位优势
  category: 地理概念
  explanation: 珠江三角洲毗邻港澳、濒临南海，改革开放以来依托区位与政策优势发展外向型经济，形成以电子信息、家电等为主的制造业基地。
  misconceptions:
    - 误认为珠三角的发展只靠廉价劳动力，忽略毗邻港澳与开放政策的区位优势。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S5.md
- id: concept:地理:台湾省的位置和范围
  type: Concept
  subject: 地理
  title: 台湾省的位置和范围
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为台湾省只指台湾岛本身，忽略其附属岛屿。
  category: 地理概念
  explanation: 台湾省包括台湾岛及周围澎湖列岛、钓鱼岛等岛屿，东临太平洋、西隔台湾海峡与福建省相望，地处我国东南沿海，是我国第一大岛。
  misconceptions:
    - 误认为台湾省只指台湾岛本身，忽略其附属岛屿。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S6.md
- id: concept:地理:台湾省的自然资源与产业
  type: Concept
  subject: 地理
  title: 台湾省的自然资源与产业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为台湾经济以农业为主，忽略其出口加工业的主导地位。
  category: 地理概念
  explanation: 台湾岛山地为主、气候湿热，森林与旅游资源丰富；工业以加工出口为主，形成“进口—加工—出口”型经济，主要分布在西部平原。
  misconceptions:
    - 误认为台湾经济以农业为主，忽略其出口加工业的主导地位。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S6.md
- id: concept:地理:丹霞地貌
  type: Concept
  subject: 地理
  title: 丹霞地貌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为丹霞地貌由火山喷发形成，实际是沉积岩经流水侵蚀形成。
  category: 地理概念
  explanation: 丹霞地貌是红色砂砾岩在内陆盆地沉积后，经长期流水切割侵蚀形成的红黑相间山体，1928 年由我国学者命名，泰宁是世界自然遗产所在地。
  misconceptions:
    - 误认为丹霞地貌由火山喷发形成，实际是沉积岩经流水侵蚀形成。
  sourceRef: content/七年级/下册/地理/ZTB-7-2-Geography/chapters/C7/sections/S7.md
