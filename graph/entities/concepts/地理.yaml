  masteryCriteria:
    - 能指出并纠正这一错误：误以为地月系的中心天体是月球，实际地球是中心。
    - 能指出并纠正这一错误：误将地月系归入银河系，忽略了它属于太阳系这一层次。
  aliases: []
  category: 天体系统
  explanation: 以地球为中心天体，由地球与月球构成的天体系统。
