    - 能指出并纠正这一错误：将地形特征描述为“平坦”时，不区分平原和高原，忽略高原边缘陡峭、内部平坦的特点。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 把地形类型当地形特点，如只说“以山地为主”，忽略地势起伏、海拔高度等具体特征。
    - 将地形特征描述为“平坦”时，不区分平原和高原，忽略高原边缘陡峭、内部平坦的特点。
    - 读地形图时，把等高线稀疏判断为陡坡，误以为等高线越密坡度越缓。
