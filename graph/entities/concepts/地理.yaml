    - 地球大小
  category: 地理事实
  explanation: 地球是一个两极稍扁、赤道略鼓的不规则球体，赤道半径比极半径略长。
  misconceptions:
    - 误认为地球是正球体，忽略两极稍扁、赤道略鼓的特征
    - 把地球形状说成‘赤道稍扁、两极略鼓’，恰好说反
