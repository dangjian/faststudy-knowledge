  subject: 地理
  title: 地球自转的周期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为自转周期是24小时整，实际约23时56分4秒，24小时是太阳日
    - 能指出并纠正这一错误：将自转周期与公转周期混淆，以为自转一圈是一年
  aliases: []
  category: 地理规律
  explanation: 地球自转的周期是一天，约24小时。
  misconceptions:
    - 误以为自转周期是24小时整，实际约23时56分4秒，24小时是太阳日
    - 将自转周期与公转周期混淆，以为自转一圈是一年
    - 做题时认为昼夜交替周期就是自转周期，忽略太阳日与恒星日的差别
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:地球自转的方向
