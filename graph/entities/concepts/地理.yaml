  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C2/sections/S1.md
- id: concept:地理:地球的普通性
  type: Concept
  subject: 地理
  title: 地球的普通性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为地球的普通性是指它没有大气和液态水，实际普通性体现在体积质量不突出。
    - 能指出并纠正这一错误：误将地球拥有适宜温度等特殊条件当作普通性的表现。
  aliases: []
  category: 地球特征
  explanation: 地球在体积、质量等方面在太阳系中并不突出，是一颗普通的行星。
  misconceptions:
    - 误以为地球的普通性是指它没有大气和液态水，实际普通性体现在体积质量不突出。
    - 误将地球拥有适宜温度等特殊条件当作普通性的表现。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:地球的特殊性
  type: Concept
  subject: 地理
  title: 地球的特殊性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为地球有大气层就是特殊性，实际上金星也有浓厚大气。
    - 能指出并纠正这一错误：误将日地距离适中归结为普通性，而它正是特殊性的重要条件。
  aliases: []
  category: 地球特征
  explanation: 地球是宇宙中目前已知的唯一有生命存在的天体，具有适宜的温度、大气和水等条件。
  misconceptions:
    - 误以为地球有大气层就是特殊性，实际上金星也有浓厚大气。
    - 误将日地距离适中归结为普通性，而它正是特殊性的重要条件。
  sourceRef: content/七年级/上册/地理/ZTB-7-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:地球的自转
  type: Concept
  subject: 地理
  title: 地球的自转
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为地球自转是绕太阳转，实际是绕地轴旋转
    - 能指出并纠正这一错误：画图时把地轴画成竖直，忽略地轴是倾斜的
  aliases:
    - 自转
    - 地球自转
  category: 地理现象
  explanation: 地球绕着地轴不停地旋转，这种运动叫作地球的自转。
  misconceptions:
    - 误以为地球自转是绕太阳转，实际是绕地轴旋转
    - 画图时把地轴画成竖直，忽略地轴是倾斜的
    - 将地球自转与公转的绕转中心混为一谈，认为是绕太阳转
  sourceRef: content/八年级/上册/地理/ZTB-8-1-Geography/chapters/C1/sections/S1.md
- id: concept:地理:地球自转的周期
