- id: concept:道德与法治:“三个代表”重要思想
  type: Concept
  subject: 道德与法治
  title: “三个代表”重要思想
  conceptType: 概念型
  aliases:
    - 三个代表重要思想
  category: 概念
  explanation: 党的十三届四中全会以后，以江泽民同志为主要代表的中国共产党人形成的重大理论成果，加深了对建设什么样的党、怎样建设党的认识。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:一国两制
  type: Concept
  subject: 道德与法治
  title: 一国两制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“一国”与“两制”是并列关系，实际“一国”是前提，如“香港和内地实行不同制度是平等的”。
    - 能指出并纠正这一错误：误认为“两制”下香港、澳门拥有外交权，如“香港可以自行签订对外条约”（外交权属于中央）。
  aliases:
    - 一个国家，两种制度
  category: 政治制度
  explanation: “一国两制”即“一个国家，两种制度”，是在祖国统一的前提下，国家主体坚持社会主义制度，台湾、香港、澳门保持原有资本主义制度和生活方式长期不变。
  misconceptions:
    - 误认为“一国”与“两制”是并列关系，实际“一国”是前提，如“香港和内地实行不同制度是平等的”。
    - 误认为“两制”下香港、澳门拥有外交权，如“香港可以自行签订对外条约”（外交权属于中央）。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:七七事变
  type: Concept
  subject: 道德与法治
  title: 七七事变
  conceptType: 概念型
  aliases:
    - 卢沟桥事变
  category: 概念
  explanation: 1937年日军发动的事变，当地中国驻军奋起抵抗，全民族抗战由此爆发。它也叫卢沟桥事变。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:三大战役
  type: Concept
  subject: 道德与法治
  title: 三大战役
  conceptType: 概念型
  aliases:
    - 辽沈战役
    - 淮海战役
    - 平津战役
  category: 概念
  explanation: 人民解放军连续进行的辽沈、淮海、平津三大战役，基本摧毁了国民党主要军事力量。淮海战役的胜利是人民群众用小车推出来的。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:三步走战略
  type: Concept
  subject: 道德与法治
  title: 三步走战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把三步走第一步目标说成“实现小康”，实际上第一步是解决人民温饱问题。
    - 能指出并纠正这一错误：误认为三步走战略已全部完成，实际第三步到21世纪中叶才基本实现现代化，现仍处于进程中。
  aliases:
    - 三步走
  category: 发展战略
  explanation: 党的十三大提出的现代化建设战略目标，分三步实现国民生产总值翻番、小康水平和基本实现现代化。
  misconceptions:
    - 误把三步走第一步目标说成“实现小康”，实际上第一步是解决人民温饱问题。
    - 误认为三步走战略已全部完成，实际第三步到21世纪中叶才基本实现现代化，现仍处于进程中。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:上课认真听讲
  type: Concept
  subject: 道德与法治
  title: 上课认真听讲
  conceptType: 应用型
  aliases:
    - 认真听勤思考
  category: 方法
  explanation: 上课发言要先举手，别人发言时认真听，想提问就把问题想清楚再说。认真听、勤思考才能学好本领。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:不同法律调整不同领域
  type: Concept
  subject: 道德与法治
  title: 不同法律调整不同领域
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 在法律的大家庭里，不同的法律调整不同领域的社会关系，发挥不同的功能。如民法保护财产和人身权益，行政法约束行政机关权力，刑法惩罚犯罪。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:不当使用电子产品的危害
  type: Concept
  subject: 道德与法治
  title: 不当使用电子产品的危害
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 长时间使用电子产品会使眼睛疲劳、视力下降，还会导致颈部酸痛、手指关节肿胀等，走路看手机甚至威胁生命安全。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:不挑食不暴食
  type: Concept
  subject: 道德与法治
  title: 不挑食不暴食
  conceptType: 概念型
  aliases:
    - 不挑食不浪费
  category: 观点
  explanation: 各种食物都很重要，挑食会让身体缺少营养。好吃的东西也不能吃太多，暴饮暴食对身体不好。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:不攀比不赶时髦
  type: Concept
  subject: 道德与法治
  title: 不攀比不赶时髦
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 并不是所有的愿望都能被满足。要体贴父母，想想父母的辛苦和难处，不提让父母为难的要求，不赶时髦、不和别人攀比。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:不断改进自己
  type: Concept
  subject: 道德与法治
  title: 不断改进自己
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 每个人都有优点，也有不完美的地方。只要正视不足、继续努力，我们就能不断改进自己，让自己变得更好。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:与家人产生矛盾的原因
  type: Concept
  subject: 道德与法治
  title: 与家人产生矛盾的原因
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 随着年龄增长，我们有了自己的想法，希望自己做决定；家人因为关心而多加管束。双方想法和角度不同，就容易产生不愉快。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:与老师发生矛盾的处理方法
  type: Concept
  subject: 道德与法治
  title: 与老师发生矛盾的处理方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为化解矛盾只能靠老师主动，自己被动等待。
    - 能指出并纠正这一错误：把自我反思等同于全盘认错，即使老师有错也一味迎合。
  aliases:
    - 化解师生矛盾
  category: 道德与法治
  explanation: 通过自我反思、相信善意、坦诚沟通、求同存异等方法化解师生矛盾。
  misconceptions:
    - 认为化解矛盾只能靠老师主动，自己被动等待。
    - 把自我反思等同于全盘认错，即使老师有错也一味迎合。
    - 认为坦诚沟通就是顶撞老师，必须据理力争。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:专门人民法院
  type: Concept
  subject: 道德与法治
  title: 专门人民法院
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为军事法院可以审理所有涉及军人的民事纠纷
    - 能指出并纠正这一错误：把所有专门法院当成普通地方法院，如认为知识产权法院可审理任何合同纠纷
  aliases: []
  category: 法律常识
  explanation: 专门人民法院包括军事法院、海事法院、知识产权法院、金融法院等，管辖特定类型的案件。
  misconceptions:
    - 认为军事法院可以审理所有涉及军人的民事纠纷
    - 把所有专门法院当成普通地方法院，如认为知识产权法院可审理任何合同纠纷
    - 误以为专门人民法院是最高人民法院的内部审判庭
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:世界多极化
  type: Concept
  subject: 道德与法治
  title: 世界多极化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为世界多极化就是几个大国共同主宰世界，如说“美中俄三国共同统治世界”。
    - 能指出并纠正这一错误：把世界多极化等同于世界已经实现多极化，不知处于发展过程中。
  aliases:
    - 多极化趋势
  category: 政治概念
  explanation: 世界多极化是指世界格局向多极化发展，多种国际力量既相互依存又相互制约，任何国家都难以单独主宰世界事务，有利于促进国际关系民主化，推动世界和平与发展。
  misconceptions:
    - 认为世界多极化就是几个大国共同主宰世界，如说“美中俄三国共同统治世界”。
    - 把世界多极化等同于世界已经实现多极化，不知处于发展过程中。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:世界贸易组织
  type: Concept
  subject: 道德与法治
  title: 世界贸易组织
  conceptType: 概念型
  aliases:
    - 世贸组织
    - WTO
  category: 概念
  explanation: 世界贸易组织是当代最重要的世界性国际经济组织之一，被称为"经济联合国"，1995年成立。中国2001年加入该组织，对中国和世界的贸易发展影响深远。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:业缘关系
  type: Concept
  subject: 道德与法治
  title: 业缘关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把同班同学当业缘关系，同学基于学习，非社会分工，如同行、同事才是。
    - 能指出并纠正这一错误：认为业缘关系只存在于单位同事，忽略同行、同行团体也是业缘关系。
  aliases: []
  category: 社会关系
  explanation: 以人们广泛的社会分工为基础而形成的社会关系，如同行、同事等。
  misconceptions:
    - 误把同班同学当业缘关系，同学基于学习，非社会分工，如同行、同事才是。
    - 认为业缘关系只存在于单位同事，忽略同行、同行团体也是业缘关系。
    - 把邻居当业缘关系，邻居是地缘，不是由分工形成。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:两个一百年奋斗目标
  type: Concept
  subject: 道德与法治
  title: 两个一百年奋斗目标
  conceptType: 概念型
  aliases:
    - 两个一百年
  category: 概念
  explanation: 即在中国共产党成立100年时全面建成小康社会；在新中国成立100年时把我国建成富强民主文明和谐美丽的社会主义现代化强国。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:两岸三通
  type: Concept
  subject: 道德与法治
  title: 两岸三通
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为三通是“通邮、通商、通婚”，少了通航，如说“两岸连婚姻都通”。
    - 能指出并纠正这一错误：误认为三通是单向的，认为只是大陆向台湾开放，实际是双向、直接、全面的。
  aliases:
    - 三通
  category: 历史事件
  explanation: 指两岸直接、双向、全面的通邮、通商、通航，打破了长期隔绝状态，促进两岸交流。
  misconceptions:
    - 误认为三通是“通邮、通商、通婚”，少了通航，如说“两岸连婚姻都通”。
    - 误认为三通是单向的，认为只是大陆向台湾开放，实际是双向、直接、全面的。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:两弹一星
  type: Concept
  subject: 道德与法治
  title: 两弹一星
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 指原子弹、氢弹等核武器和人造地球卫星等国防尖端科技成就。它们的成功极大鼓舞了中国人民的志气，增强了国防实力，提高了国际地位。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:两步走战略安排
  type: Concept
  subject: 道德与法治
  title: 两步走战略安排
  conceptType: 概念型
  aliases:
    - 两步走战略
  category: 概念
  explanation: 全面建成社会主义现代化强国的总安排：从2020年到2035年基本实现社会主义现代化；从2035年到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:严格执法
  type: Concept
  subject: 道德与法治
  title: 严格执法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为严格执法就是一律从重处罚，对轻微违法也顶格处理
    - 能指出并纠正这一错误：误以为严格执法只是公安机关的事，其他机关不需要严格执法
  aliases: []
  category: 法治
  explanation: 严格执法要求执法机关全面推进严格规范公正文明执法，解决执法不规范、不严格、不透明、不文明以及不作为、乱作为等问题，让执法既有力度又有温度。
  misconceptions:
    - 认为严格执法就是一律从重处罚，对轻微违法也顶格处理
    - 误以为严格执法只是公安机关的事，其他机关不需要严格执法
    - 将“有力度”理解为可以粗暴执法，忽视文明执法和温度
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:个人与社会的关系
  type: Concept
  subject: 道德与法治
  title: 个人与社会的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为个人能脱离社会独自生存，如'鲁滨逊在荒岛无需社会'，忽略他仍使用人类已有的工具和经验。
    - 能指出并纠正这一错误：误以为人的身份一成不变，如'我一生都是孩子/学生'，忘记在不同社会关系中身份会改变。
  aliases:
    - 个人与社会
  category: 道德与法治
  explanation: 个人是社会的有机组成部分，人的身份是在社会关系中确定的，每个人都是社会这张'大网'上的一个'结点'。
  misconceptions:
    - 认为个人能脱离社会独自生存，如'鲁滨逊在荒岛无需社会'，忽略他仍使用人类已有的工具和经验。
    - 误以为人的身份一成不变，如'我一生都是孩子/学生'，忘记在不同社会关系中身份会改变。
    - 把个人与社会的关系简单理解为部分与整体，如同拼图，忽略个人是结点且具有能动性、交叉性。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:个人隐私保护
  type: Concept
  subject: 道德与法治
  title: 个人隐私保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为在朋友圈晒定位、证件照只是个人自由，不算泄露隐私
    - 能指出并纠正这一错误：连接公共WiFi时随意输入支付密码，认为有密码就安全
  aliases:
    - 隐私保护
  category: 道德与法治
  explanation: 在开放的网络世界里，要保护个人隐私和信息安全，防范泄露隐私的行为，筑牢自我保护的防火墙。
  misconceptions:
    - 误以为在朋友圈晒定位、证件照只是个人自由，不算泄露隐私
    - 连接公共WiFi时随意输入支付密码，认为有密码就安全
    - 将陌生人加为好友并透露家庭住址，认为只要不在网上公开就没事
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:个体经济
  type: Concept
  subject: 道德与法治
  title: 个体经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把个体经济当作私营经济，忽视私营经济存在雇佣劳动关系
    - 能指出并纠正这一错误：认为个体经济属于公有制经济，实际是非公有制经济
  aliases: []
  category: 经济成分
  explanation: 非公有制经济的一种，生产资料归个体劳动者所有，以个人劳动为基础。
  misconceptions:
    - 把个体经济当作私营经济，忽视私营经济存在雇佣劳动关系
    - 认为个体经济属于公有制经济，实际是非公有制经济
    - 误以为个体经济是国民经济主导力量，主导力量是国有经济
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:中关村国家自主创新示范区
  type: Concept
  subject: 道德与法治
  title: 中关村国家自主创新示范区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中关村示范区是我国第一个经济特区，实际它是第一个国家自主创新示范区。
    - 能指出并纠正这一错误：认为中关村是行政区划，其实它是科技园区，不是一个行政区政府。
  aliases:
    - 中关村
  category: 区域创新
  explanation: 我国第一个国家自主创新示范区，是原始创新的策源地、自主创新的主阵地。
  misconceptions:
    - 误以为中关村示范区是我国第一个经济特区，实际它是第一个国家自主创新示范区。
    - 认为中关村是行政区划，其实它是科技园区，不是一个行政区政府。
    - 认为所有创新都发源于中关村，以偏概全。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:中华人文精神
  type: Concept
  subject: 道德与法治
  title: 中华人文精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中华人文精神只注重个人内心修养，忽视其教化社会、化成天下的责任
    - 能指出并纠正这一错误：把中华人文精神混同于西方人文主义，片面强调个人自由而忽略集体和谐
  aliases:
    - 人文精神
  category: 人文精神
  explanation: 中华民族在历史发展中形成的以人文化成天下的精神，体现在处世方法、教化思想、美学追求、生活理念等方面。
  misconceptions:
    - 认为中华人文精神只注重个人内心修养，忽视其教化社会、化成天下的责任
    - 把中华人文精神混同于西方人文主义，片面强调个人自由而忽略集体和谐
    - 将'人文化成'误读为用文化知识自我装饰，而非通过实践改造社会
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:中华人民共和国
  type: Concept
  subject: 道德与法治
  title: 中华人民共和国
  conceptType: 概念型
  aliases:
    - 中国
  category: 文化常识
  explanation: 我国的全称是中华人民共和国。在世界地图上能找到她的位置，她是我们的祖国。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中华人民共和国主席的产生
  type: Concept
  subject: 道德与法治
  title: 中华人民共和国主席的产生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家主席由全国选民直接选举产生
    - 能指出并纠正这一错误：误以为担任国家主席只需年满十八周岁且有选举权
  aliases:
    - 国家主席产生
    - 中华人民共和国主席的产生和地位
    - 国家主席的产生
  category: 国家机构
  explanation: 中华人民共和国主席、副主席由全国人民代表大会选举，有选举权和被选举权的年满四十五周岁的中华人民共和国公民可以被选为中华人民共和国主席、副主席。
  misconceptions:
    - 认为国家主席由全国选民直接选举产生
    - 误以为担任国家主席只需年满十八周岁且有选举权
    - 认为国家主席由全国人大常委会选举产生，而不是全国人大
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:中华人民共和国主席的职权
  type: Concept
  subject: 道德与法治
  title: 中华人民共和国主席的职权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家主席有权独自决定对外宣战或缔结条约
    - 能指出并纠正这一错误：误以为国家主席可以直接任免国务院总理，无需根据全国人大的决定
  aliases:
    - 国家主席职权
  category: 国家机构
  explanation: 国家主席根据全国人大及其常委会的决定，行使公布法律、发布命令、任免权、外事权和授予荣誉权等职权。
  misconceptions:
    - 认为国家主席有权独自决定对外宣战或缔结条约
    - 误以为国家主席可以直接任免国务院总理，无需根据全国人大的决定
    - 认为国家主席的职权包括制定和修改法律
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中华人民共和国成立
  type: Concept
  subject: 道德与法治
  title: 中华人民共和国成立
  conceptType: 概念型
  aliases:
    - 开国大典
    - 新中国成立
  category: 文化常识
  explanation: 1949 年 10 月 1 日开国大典上，毛泽东向全世界庄严宣告中央人民政府成立。中国人民从此站起来了，中国历史开启新纪元。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:中华优秀传统文化
  type: Concept
  subject: 道德与法治
  title: 中华优秀传统文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把所有古代文化都当成优秀传统文化，不辨别其中包含的封建糟粕
    - 能指出并纠正这一错误：认为中华优秀传统文化仅指儒家思想，忽略道家、法家等多元文化贡献
  aliases:
    - 中华传统文化
  category: 文化概念
  explanation: 中华民族在长期历史发展中形成的、源远流长、博大精深、历久弥新的文化，是中华民族最根本的精神基因。
  misconceptions:
    - 把所有古代文化都当成优秀传统文化，不辨别其中包含的封建糟粕
    - 认为中华优秀传统文化仅指儒家思想，忽略道家、法家等多元文化贡献
    - 误认为传统文化已过时，对现代社会毫无价值
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:中华优秀传统法律文化
  type: Concept
  subject: 道德与法治
  title: 中华优秀传统法律文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把传统法律文化等同于古代法律条文，忽略法律思想与制度。
    - 能指出并纠正这一错误：认为古代法律都是封建糟粕，全盘否定中华优秀传统法律文化。
  aliases: []
  category: 法治观念
  explanation: 中国历史上形成的优秀法律思想和制度文化。
  misconceptions:
    - 把传统法律文化等同于古代法律条文，忽略法律思想与制度。
    - 认为古代法律都是封建糟粕，全盘否定中华优秀传统法律文化。
    - 将儒家伦理思想与法律混为一谈，认为礼法完全等同。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:中华传统美德
  type: Concept
  subject: 道德与法治
  title: 中华传统美德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为传统美德只属于古代，现代人不必继承
    - 能指出并纠正这一错误：将传统美德等同于所有传统文化，忽视其中也有糟粕
  aliases:
    - 传统美德
  category: 道德
  explanation: 中华文化的精髓，包含爱国情怀、奋进品格、和乐风范、高尚情操、伦理规范、处世准则等。
  misconceptions:
    - 认为传统美德只属于古代，现代人不必继承
    - 将传统美德等同于所有传统文化，忽视其中也有糟粕
    - 以为中华传统美德就是三从四德等封建礼教
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:中华传统美德的表现
  type: Concept
  subject: 道德与法治
  title: 中华传统美德的表现
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为孝敬父母就是事事顺从，即使父母违法也要照办
    - 能指出并纠正这一错误：把勤劳勇敢等同于蛮干冒险，忽略智慧与策略
  aliases: []
  category: 道德
  explanation: 包括忧国忧民、勤劳勇敢、自尊互敬、诚信守法、孝敬父母、律己宽人等具体美德。
  misconceptions:
    - 认为孝敬父母就是事事顺从，即使父母违法也要照办
    - 把勤劳勇敢等同于蛮干冒险，忽略智慧与策略
    - 认为诚信守法只在商业交易中需要，日常小事无所谓
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:中华传统美德的践行
  type: Concept
  subject: 道德与法治
  title: 中华传统美德的践行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为背诵道德格言就等于践行美德，实际行动却言行不一
    - 能指出并纠正这一错误：把践行传统美德看作成年人的义务，自己作为学生可以等长大再说
  aliases:
    - 传统美德的实践
  category: 道德修养
  explanation: 传承中华传统美德的关键在于践行，要讲道德、尊道德、守道德，以促进个人幸福和社会美好。
  misconceptions:
    - 认为背诵道德格言就等于践行美德，实际行动却言行不一
    - 把践行传统美德看作成年人的义务，自己作为学生可以等长大再说
    - 以为只有做英雄壮举才算践行美德，忽略孝敬父母、诚信待人等日常小事
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:中华文化
  type: Concept
  subject: 道德与法治
  title: 中华文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中华文化就是儒家文化，忽略道家、法家、墨家等
    - 能指出并纠正这一错误：认为中华文化只包括汉族文化，不包括少数民族文化
  aliases:
    - 中华优秀传统文化
  category: 文化
  explanation: 中华民族在长期共同生活中创造的灿烂文化，源远流长、博大精深，具有创造力和包容力。
  misconceptions:
    - 认为中华文化就是儒家文化，忽略道家、法家、墨家等
    - 认为中华文化只包括汉族文化，不包括少数民族文化
    - 以为中华文化是封闭保守的，不相信其创造力和包容力
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:中华文明在交流互鉴中发展
  type: Concept
  subject: 道德与法治
  title: 中华文明在交流互鉴中发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中华文明是孤立发展，如四大发明都是完全原创，未受任何外来影响。
    - 能指出并纠正这一错误：把交流互鉴理解为全盘西化，主张抛弃传统去迎合西方文化。
  aliases: []
  category: 道德与法治
  explanation: 中华文明在同其他文明不断交流互鉴中形成和发展，既从其他文明中汲取智慧，也推动世界文明进步。
  misconceptions:
    - 认为中华文明是孤立发展，如四大发明都是完全原创，未受任何外来影响。
    - 把交流互鉴理解为全盘西化，主张抛弃传统去迎合西方文化。
    - 只强调中华文明输出贡献，忽视我们吸收了佛教、阿拉伯数学等外来成果。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:中华文明的突出特性
  type: Concept
  subject: 道德与法治
  title: 中华文明的突出特性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆连续性与创新性，将中华文明的连续性误认为僵化不变、拒绝变革
    - 能指出并纠正这一错误：把包容性理解为全盘吸收外来文化，丧失中华文化的主体性
  aliases:
    - 中华文明五个特性
  category: 文明特性
  explanation: 中华文明具有连续性、创新性、统一性、包容性、和平性五个突出特性，共同塑造了中华文明。
  misconceptions:
    - 混淆连续性与创新性，将中华文明的连续性误认为僵化不变、拒绝变革
    - 把包容性理解为全盘吸收外来文化，丧失中华文化的主体性
    - 认为和平性是软弱退让，在维护国家利益时也不应坚持原则
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:中华民国成立
  type: Concept
  subject: 道德与法治
  title: 中华民国成立
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 1912 年 1 月，革命党人在南京建立临时政府，孙中山就任临时大总统，宣告中华民国成立。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:中华民族一家亲
  type: Concept
  subject: 道德与法治
  title: 中华民族一家亲
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我国是统一的多民族国家，我们都是中华民族的一分子。不同民族的同学在一起学习生活，就像一家人。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:中华民族伟大复兴
  type: Concept
  subject: 道德与法治
  title: 中华民族伟大复兴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为民族复兴就是恢复汉唐盛世的版图，如“要回到古代强盛时期”，实际是建设现代化强国。
    - 能指出并纠正这一错误：误认为民族复兴只是经济腾飞，忽视国家富强、民族振兴、人民幸福的全面内涵。
  aliases:
    - 中国梦
  category: 国家目标
  explanation: 近代以来中华民族最伟大的梦想，实现国家富强、民族振兴、人民幸福。
  misconceptions:
    - 误认为民族复兴就是恢复汉唐盛世的版图，如“要回到古代强盛时期”，实际是建设现代化强国。
    - 误认为民族复兴只是经济腾飞，忽视国家富强、民族振兴、人民幸福的全面内涵。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中华民族共同体意识
  type: Concept
  subject: 道德与法治
  title: 中华民族共同体意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为只有少数民族要铸牢共同体意识，汉族不需加强，如“我是汉族就不需要民族团结”。
    - 能指出并纠正这一错误：误认为中华民族共同体就是汉族同化各民族，如“各民族都变成汉族才算共同体”，实际是多元一体。
  aliases:
    - 中华民族共同体
  category: 政治概念
  explanation: 各族人民对中华民族共同体的认同感和归属感，是维护民族团结的思想基础。
  misconceptions:
    - 误认为只有少数民族要铸牢共同体意识，汉族不需加强，如“我是汉族就不需要民族团结”。
    - 误认为中华民族共同体就是汉族同化各民族，如“各民族都变成汉族才算共同体”，实际是多元一体。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中华民族精神
  type: Concept
  subject: 道德与法治
  title: 中华民族精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把中华民族精神等同于爱国主义，忽略艰苦奋斗等内涵
    - 能指出并纠正这一错误：认为民族精神只在战争年代需要，和平时期无关紧要
  aliases:
    - 民族精神
  category: 道德与法治
  explanation: 中华民族在长期奋斗中培育、继承、发展起来的伟大民族精神，是中华民族生生不息、发展壮大的强大精神支柱，是维系我国各族人民团结奋斗的牢固精神纽带，是激励中华儿女为实现中国梦而奋斗的不竭精神动力。
  misconceptions:
    - 把中华民族精神等同于爱国主义，忽略艰苦奋斗等内涵
    - 认为民族精神只在战争年代需要，和平时期无关紧要
    - 将民族精神与传统文化割裂，以为它们是两回事
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:中和
  type: Concept
  subject: 道德与法治
  title: 中和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'中'理解为折中主义，遇事和稀泥，不讲是非原则
    - 能指出并纠正这一错误：认为'中和'就是消灭一切矛盾差异，追求无差别的绝对平均
  aliases: []
  category: 哲学概念
  explanation: “中”是事物存在的本然状态，“和”是事物间相互和谐的状态。在“中和”的状态下，天地万物和谐地共存发展。
  misconceptions:
    - 将'中'理解为折中主义，遇事和稀泥，不讲是非原则
    - 认为'中和'就是消灭一切矛盾差异，追求无差别的绝对平均
    - 把'中和'等同于消极保守，认为它反对任何形式的进取和变革
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:中国人民政治协商会议
  type: Concept
  subject: 道德与法治
  title: 中国人民政治协商会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人民政协当作国家权力机关或立法机关
    - 能指出并纠正这一错误：认为政协可以决定国家重大事务，实际是协商不决策
  aliases:
    - 人民政协
    - 政协
  category: 政治组织
  explanation: 爱国统一战线组织、多党合作和政治协商的重要机构、人民民主的重要实现形式，是社会主义协商民主的重要渠道和专门协商机构。
  misconceptions:
    - 把人民政协当作国家权力机关或立法机关
    - 认为政协可以决定国家重大事务，实际是协商不决策
    - 混淆政协与人大职能，认为政协有选举产生国家领导人的权力
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:中国共产党的成立
  type: Concept
  subject: 道德与法治
  title: 中国共产党的成立
  conceptType: 概念型
  aliases:
    - 中共一大
  category: 概念
  explanation: 1921年7月，中共一大在上海召开，宣告中国共产党正式成立。这是开天辟地的大事变，中国人民从此有了主心骨，中国革命的面貌焕然一新。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:中国共产党领导
  type: Concept
  subject: 道德与法治
  title: 中国共产党领导
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国共产党领导地位不是宪法确认的，而是自封的。
    - 能指出并纠正这一错误：认为党可以凌驾于宪法和法律之上，不受宪法约束。
  aliases:
    - 党的领导
  category: 政治概念
  explanation: 中国特色社会主义最本质的特征，宪法确认了中国共产党的领导地位。
  misconceptions:
    - 认为中国共产党领导地位不是宪法确认的，而是自封的。
    - 认为党可以凌驾于宪法和法律之上，不受宪法约束。
    - 将党的领导等同于政府行政职能，混为一谈。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:中国共产党领导的多党合作和政治协商制度
  type: Concept
  subject: 道德与法治
  title: 中国共产党领导的多党合作和政治协商制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为各民主党派与共产党共同执政，实际是参政议政
    - 能指出并纠正这一错误：误把该制度当作我国的根本政治制度，根本的是人大制度
  aliases:
    - 多党合作制度
    - 政协制度
  category: 政治制度
  explanation: 我国的一项基本政治制度，是新型政党制度，具有鲜明中国特色和显著政治优势，1993年被载入宪法。
  misconceptions:
    - 认为各民主党派与共产党共同执政，实际是参政议政
    - 误把该制度当作我国的根本政治制度，根本的是人大制度
    - 认为多党合作就是多党制或轮流执政
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:中国农民丰收节
  type: Concept
  subject: 道德与法治
  title: 中国农民丰收节
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 2018年起，我国把秋分这一天设为中国农民丰收节，庆祝农作物大丰收。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:中国制造与中国创造
  type: Concept
  subject: 道德与法治
  title: 中国制造与中国创造
  conceptType: 概念型
  aliases:
    - 从中国制造到中国创造
  category: 观点
  explanation: '"中国制造"的商品遍布世界各国，但这还不够，更需要有自主创新、掌握核心技术的"中国创造"，比如中国高铁、神舟飞船。'
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:中国力量
  type: Concept
  subject: 道德与法治
  title: 中国力量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中国力量就是人口数量，如“我国人最多，力量自然最大”，实际是各族人民大团结的力量。
    - 能指出并纠正这一错误：误认为中国力量等同于经济实力或军力，如“GDP世界第二就是中国力量”，忽略了团结这一核心。
  aliases: []
  category: 力量
  explanation: 全国各族人民大团结的力量。
  misconceptions:
    - 误认为中国力量就是人口数量，如“我国人最多，力量自然最大”，实际是各族人民大团结的力量。
    - 误认为中国力量等同于经济实力或军力，如“GDP世界第二就是中国力量”，忽略了团结这一核心。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中国古人的思想观念
  type: Concept
  subject: 道德与法治
  title: 中国古人的思想观念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“和而不同”误解为无原则地附和他人，就是“老好人”。
    - 能指出并纠正这一错误：将《司马法》‘好战必亡’曲解为任何战争都反对，包括反侵略战争。
  aliases:
    - 和平思想
    - 仁政思想
    - 和合思想
  category: 传统文化
  explanation: 《司马法》《左传》《礼记》中的名言体现了中国古人爱好和平、亲仁善邻、和而不同的思想观念。
  misconceptions:
    - 把“和而不同”误解为无原则地附和他人，就是“老好人”。
    - 将《司马法》‘好战必亡’曲解为任何战争都反对，包括反侵略战争。
    - 认为古人思想只有“和为贵”，没有竞争和进取意识。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:中国式现代化
  type: Concept
  subject: 道德与法治
  title: 中国式现代化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中国式现代化就是西方现代化的翻版，如“现代化必然要走资本主义道路”。
    - 能指出并纠正这一错误：误认为中国式现代化只是物质文明现代化，忽略全体人民共同富裕、物质与精神相协调等中国特色。
  aliases: []
  category: 核心概念
  explanation: 中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。
  misconceptions:
    - 误认为中国式现代化就是西方现代化的翻版，如“现代化必然要走资本主义道路”。
    - 误认为中国式现代化只是物质文明现代化，忽略全体人民共同富裕、物质与精神相协调等中国特色。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中国影响
  type: Concept
  subject: 道德与法治
  title: 中国影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国对世界的影响只体现在经济总量上，忽略文化软实力。
    - 能指出并纠正这一错误：以偏概全，看到中国商品遍布全球就认定是经济侵略。
  aliases: []
  category: 国际关系
  explanation: 中国的发展对世界产生的积极影响，包括经济、文化等方面。
  misconceptions:
    - 认为中国对世界的影响只体现在经济总量上，忽略文化软实力。
    - 以偏概全，看到中国商品遍布全球就认定是经济侵略。
    - 把中国影响力上升等同于“中国威胁论”，无视其和平建设性。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:中国担当
  type: Concept
  subject: 道德与法治
  title: 中国担当
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国担当只是政府的事，与普通公民无关，不参与国际志愿服务。
    - 能指出并纠正这一错误：主张中国应包揽所有国际事务，忽略我国仍是发展中国家的现实。
  aliases:
    - 中国责任
  category: 政治理念
  explanation: 中国在国际事务中积极主动承担责任，不推诿、不逃避，为世界和平与发展作出贡献。
  misconceptions:
    - 认为中国担当只是政府的事，与普通公民无关，不参与国际志愿服务。
    - 主张中国应包揽所有国际事务，忽略我国仍是发展中国家的现实。
    - 把中国对外援助说成“多管闲事”，否定大国责任。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:中国智慧
  type: Concept
  subject: 道德与法治
  title: 中国智慧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将中国智慧等同于古代哲学，忽略“一带一路”等当代方案。
    - 能指出并纠正这一错误：认为中国智慧就是照搬西方治理模式，没有原创贡献。
  aliases: []
  category: 政治理念
  explanation: 中国在参与国际事务中展现的智慧和方案，为全球治理贡献中国思路。
  misconceptions:
    - 将中国智慧等同于古代哲学，忽略“一带一路”等当代方案。
    - 认为中国智慧就是照搬西方治理模式，没有原创贡献。
    - 混淆中国智慧与中国担当，以为智慧只是观念不包含行动。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:中国梦
  type: Concept
  subject: 道德与法治
  title: 中国梦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国梦是国家和民族的事，与个人无关，如‘我一个小学生做不了什么’。
    - 能指出并纠正这一错误：把个人梦想直接等同于中国梦，如‘我的梦想是当明星，所以这就是中国梦’。
  aliases: []
  category: 国家理想
  explanation: 实现中华民族伟大复兴的中国梦，需要每个人的梦想汇聚成强大力量。
  misconceptions:
    - 认为中国梦是国家和民族的事，与个人无关，如‘我一个小学生做不了什么’。
    - 把个人梦想直接等同于中国梦，如‘我的梦想是当明星，所以这就是中国梦’。
    - 认为中国梦只是物质富裕，与精神追求无关。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:中国特色大国外交
  type: Concept
  subject: 道德与法治
  title: 中国特色大国外交
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国外交只追求本国利益，不参与国际事务或不敢担责。
    - 能指出并纠正这一错误：把中国特色大国外交误解为结盟称霸，或认为中国外交以对抗为主。
  aliases:
    - 大国外交
  category: 外交政策
  explanation: 中国秉持和平发展理念，推动建设新型国际关系，促进世界和平与发展，展现负责任大国形象的外交实践。
  misconceptions:
    - 认为中国外交只追求本国利益，不参与国际事务或不敢担责。
    - 把中国特色大国外交误解为结盟称霸，或认为中国外交以对抗为主。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:中国特色社会主义文化
  type: Concept
  subject: 道德与法治
  title: 中国特色社会主义文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国特色社会主义文化只包含优秀传统文化，不含革命文化
    - 能指出并纠正这一错误：把中国特色社会主义文化等同于西方文化或全盘西化
  aliases:
    - 中国特色社会主义文化
  category: 文化
  explanation: 源自中华优秀传统文化，熔铸于革命文化和社会主义先进文化，植根于中国特色社会主义伟大实践。
  misconceptions:
    - 认为中国特色社会主义文化只包含优秀传统文化，不含革命文化
    - 把中国特色社会主义文化等同于西方文化或全盘西化
    - 以为中国特色社会主义文化是脱离实践的抽象理论
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:中国特色社会主义新时代
  type: Concept
  subject: 道德与法治
  title: 中国特色社会主义新时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为新时代是从新中国成立起算，如“1949年就进入新时代”，实际是党的十八大以来。
    - 能指出并纠正这一错误：误认为进入新时代意味着我国已走出社会主义初级阶段，如“新时代就是跨过初级阶段”，实际仍处于初级阶…
  aliases:
    - 新时代
  category: 核心概念
  explanation: 党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。
  misconceptions:
    - 误认为新时代是从新中国成立起算，如“1949年就进入新时代”，实际是党的十八大以来。
    - 误认为进入新时代意味着我国已走出社会主义初级阶段，如“新时代就是跨过初级阶段”，实际仍处于初级阶段。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:中国特色社会主义法律体系
  type: Concept
  subject: 道德与法治
  title: 中国特色社会主义法律体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律体系只含全国人大制定的法律，遗漏行政法规、地方性法规
    - 能指出并纠正这一错误：误将宪法与其他法律地位等同，不知宪法具有最高法律效力
  aliases:
    - 我国法律体系
  category: 法律体系
  explanation: 以宪法为核心，由法律、行政法规、地方性法规等组成的有机整体，涵盖多个法律部门。
  misconceptions:
    - 认为法律体系只含全国人大制定的法律，遗漏行政法规、地方性法规
    - 误将宪法与其他法律地位等同，不知宪法具有最高法律效力
    - 把中国特色社会主义法律体系误认为法系，如大陆法系
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中国特色社会主义法治道路
  type: Concept
  subject: 道德与法治
  title: 中国特色社会主义法治道路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法治道路就是单纯依法治国，不需要坚持党的领导
    - 能指出并纠正这一错误：把党的领导、人民当家作主、依法治国三者割裂，认为可以只选其一
  aliases: []
  category: 政治概念
  explanation: 中国特色社会主义法治道路是坚持党的领导、人民当家作主、依法治国有机统一的法治道路。
  misconceptions:
    - 认为法治道路就是单纯依法治国，不需要坚持党的领导
    - 把党的领导、人民当家作主、依法治国三者割裂，认为可以只选其一
    - 认为法治道路只约束公民，不约束党和政府
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:中国特色社会主义道路
  type: Concept
  subject: 道德与法治
  title: 中国特色社会主义道路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中国特色社会主义道路就是单纯以经济建设为中心，如“只要发展经济就行”，忽视四项基本原则和改…
    - 能指出并纠正这一错误：误认为中国特色社会主义道路是封闭僵化的老路，如“坚持道路就不能吸收国外经验”。
  aliases:
    - 中国道路
  category: 道路
  explanation: 在中国共产党领导下，立足基本国情，以经济建设为中心，坚持四项基本原则，坚持改革开放，解放和发展社会生产力，建设社会主义市场经济、社会主义民主政治、社会主义先进文化、社会主义和谐社会、社会主义生态文明，促进人的全面发展，逐步实现全体人民共同富裕，建设富强民主文明和谐美丽的社会主义现代化强国。
  misconceptions:
    - 误认为中国特色社会主义道路就是单纯以经济建设为中心，如“只要发展经济就行”，忽视四项基本原则和改革开放。
    - 误认为中国特色社会主义道路是封闭僵化的老路，如“坚持道路就不能吸收国外经验”。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中国特色社会主义道路自信、理论自信、制度自信、文化自信
  type: Concept
  subject: 道德与法治
  title: 中国特色社会主义道路自信、理论自信、制度自信、文化自信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为四个自信只有三个，如“道路自信、理论自信、制度自信就够了”，漏掉文化自信。
    - 能指出并纠正这一错误：误认为四个自信中文化自信可有可无，如“文化自信不如经济自信重要”，实际四者都是根本所在。
  aliases:
    - 四个自信
  category: 政治理论
  explanation: 指对中国特色社会主义道路、理论体系、制度和文化的坚定信心，是自信的四个维度。
  misconceptions:
    - 误认为四个自信只有三个，如“道路自信、理论自信、制度自信就够了”，漏掉文化自信。
    - 误认为四个自信中文化自信可有可无，如“文化自信不如经济自信重要”，实际四者都是根本所在。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中国的发展对世界的积极影响
  type: Concept
  subject: 道德与法治
  title: 中国的发展对世界的积极影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看到中国发展惠及发展中国家，认为发达国家必然受损。
    - 能指出并纠正这一错误：将中国商品出口视为“冲击当地产业”，否认了互惠互利。
  aliases:
    - 中国发展的世界意义
  category: 核心观点
  explanation: 中国的发展为世界各国提供了更广阔的市场、更充足的资本、更丰富的产品、更宝贵的合作契机，与各国分享发展机遇，共享发展成果。
  misconceptions:
    - 只看到中国发展惠及发展中国家，认为发达国家必然受损。
    - 将中国商品出口视为“冲击当地产业”，否认了互惠互利。
    - 用零和思维看问题，认为中国发展就是抢走他国就业机会。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:中国精神
  type: Concept
  subject: 道德与法治
  title: 中国精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为民族精神的核心是改革创新，时代精神的核心是爱国主义，正好说颠倒了。
    - 能指出并纠正这一错误：误认为中国精神只指民族精神，不包含时代精神，如“中国精神就是爱国精神”（还缺改革创新）。
  aliases: []
  category: 精神
  explanation: 以爱国主义为核心的民族精神和以改革创新为核心的时代精神。
  misconceptions:
    - 误认为民族精神的核心是改革创新，时代精神的核心是爱国主义，正好说颠倒了。
    - 误认为中国精神只指民族精神，不包含时代精神，如“中国精神就是爱国精神”（还缺改革创新）。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中国腾飞
  type: Concept
  subject: 道德与法治
  title: 中国腾飞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错误认为中国已是世界第一大经济体，实际仍为第二大。
    - 能指出并纠正这一错误：以为中国腾飞仅指GDP增长，无视科技、民生等全面进步。
  aliases: []
  category: 发展成就
  explanation: 改革开放以来，中国成为世界第二大经济体、制造业第一大国等，创造了人类发展史上的伟大奇迹。
  misconceptions:
    - 错误认为中国已是世界第一大经济体，实际仍为第二大。
    - 以为中国腾飞仅指GDP增长，无视科技、民生等全面进步。
    - 认为改革开放已使中国全面超越发达国家，忽视仍是发展中国家。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:中国自信
  type: Concept
  subject: 道德与法治
  title: 中国自信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中国自信源于经济总量大，如“GDP高了就自信了”，实际根本在于道路、理论、制度、文化。
    - 能指出并纠正这一错误：误认为中国自信是盲目自大，如“中国处处都比外国强”，自信不是自负。
  aliases:
    - 四个自信
  category: 时政概念
  explanation: 中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化，这是中国自信、民族自信的根本所在。
  misconceptions:
    - 误认为中国自信源于经济总量大，如“GDP高了就自信了”，实际根本在于道路、理论、制度、文化。
    - 误认为中国自信是盲目自大，如“中国处处都比外国强”，自信不是自负。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中国重返联合国
  type: Concept
  subject: 道德与法治
  title: 中国重返联合国
  conceptType: 概念型
  aliases:
    - 恢复在联合国的合法席位
  category: 文化常识
  explanation: 1971 年第 26 届联合国大会恢复中华人民共和国在联合国的一切合法权利，这是中国外交的重大胜利。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:中国高铁创新
  type: Concept
  subject: 道德与法治
  title: 中国高铁创新
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中国高铁完全是原创技术，忽略“引进—消化—吸收”历程。
    - 能指出并纠正这一错误：以为“中国创造”意味着所有部件全国产，实际有关键核心技术突破但非全部。
  aliases:
    - 高铁技术
  category: 科技成就
  explanation: 中国高铁从引进技术到完全自主知识产权，实现从“中国制造”到“中国创造”的飞跃。
  misconceptions:
    - 误认为中国高铁完全是原创技术，忽略“引进—消化—吸收”历程。
    - 以为“中国创造”意味着所有部件全国产，实际有关键核心技术突破但非全部。
    - 把“中国制造”到“中国创造”等同于彻底抛弃外国技术。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:中央军事委员会
  type: Concept
  subject: 道德与法治
  title: 中央军事委员会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中央军事委员会是国务院的组成部门，与国防部职责相同。
    - 能指出并纠正这一错误：误以为中央军事委员会仅管辖陆军、海军、空军，不包括火箭军等军种。
  aliases: []
  category: 道德与法治
  explanation: 中国人民解放军的最高军事机关为中央军事委员会。
  misconceptions:
    - 误认为中央军事委员会是国务院的组成部门，与国防部职责相同。
    - 误以为中央军事委员会仅管辖陆军、海军、空军，不包括火箭军等军种。
    - 将中央军事委员会与中国共产党中央军事委员会视为两个不同的机构，忽略其同一性。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:中央军事委员会的性质和地位
  type: Concept
  subject: 道德与法治
  title: 中央军事委员会的性质和地位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中央军委是国务院领导下的行政机关
    - 能指出并纠正这一错误：误以为中央军委领导全国武装力量，包括武警和公安部队
  aliases:
    - 中央军委
  category: 国家机构
  explanation: 中央军事委员会是我国的最高军事领导机关，领导全国武装力量。
  misconceptions:
    - 认为中央军委是国务院领导下的行政机关
    - 误以为中央军委领导全国武装力量，包括武警和公安部队
    - 认为中央军委是最高国家权力机关，拥有立法权
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S7.md
- id: concept:道德与法治:中央军事委员会的组成和产生
  type: Concept
  subject: 道德与法治
  title: 中央军事委员会的组成和产生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中央军委副主席也是由全国人大直接选举产生
    - 能指出并纠正这一错误：认为中央军委主席由全国人大常委会决定产生
  aliases: []
  category: 国家机构
  explanation: 中央军事委员会由主席、副主席和委员组成，主席由全国人大选举产生，其他组成人员根据主席提名由全国人大或其常委会决定。
  misconceptions:
    - 误以为中央军委副主席也是由全国人大直接选举产生
    - 认为中央军委主席由全国人大常委会决定产生
    - 认为中央军委全体成员都由全国人大选举产生，不清楚根据主席提名的程序
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中央军事委员会的职权
  type: Concept
  subject: 道德与法治
  title: 中央军事委员会的职权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中央军委有权制定和颁布刑法等基本法律
    - 能指出并纠正这一错误：误以为中央军委可以指挥地方公安机关执行社会治安任务
  aliases: []
  category: 国家机构
  explanation: 中央军事委员会统一指挥全国武装力量，决定军事战略，领导军队建设，制定军事法规等。
  misconceptions:
    - 认为中央军委有权制定和颁布刑法等基本法律
    - 误以为中央军委可以指挥地方公安机关执行社会治安任务
    - 认为中央军委的职权包括任免全军所有军官，无需法定程序
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:中央军事委员会的领导体制
  type: Concept
  subject: 道德与法治
  title: 中央军事委员会的领导体制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中央军委实行集体领导，重大决策由委员表决决定
    - 能指出并纠正这一错误：误以为主席负责制意味着主席可以独断专行，不受任何法律约束
  aliases:
    - 军委主席负责制
  category: 国家机构
  explanation: 中央军事委员会实行主席负责制，中央军委主席负责全面工作，领导指挥全国武装力量。
  misconceptions:
    - 认为中央军委实行集体领导，重大决策由委员表决决定
    - 误以为主席负责制意味着主席可以独断专行，不受任何法律约束
    - 认为中央军委主席统一指挥全国武装力量，因此可以调动地方一切资源
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S8.md
- id: concept:道德与法治:中学生身份
  type: Concept
  subject: 道德与法治
  title: 中学生身份
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为进入中学就自动变成成熟自立的人，不需要父母管教。
    - 能指出并纠正这一错误：只看到新身份的荣耀，忽视责任，如‘我是中学生了，可以随便玩手机’。
  aliases: []
  category: 身份认同
  explanation: 跨进中学校园，我们有了新的身份——中学生，意味着新的人生旅程开始。
  misconceptions:
    - 认为进入中学就自动变成成熟自立的人，不需要父母管教。
    - 只看到新身份的荣耀，忽视责任，如‘我是中学生了，可以随便玩手机’。
    - 认为中学生身份与小学没区别，继续用老方法混日子。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:中秋节
  type: Concept
  subject: 道德与法治
  title: 中秋节
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 农历八月十五是中秋节，是我国的传统节日。人们赏月、吃月饼、点灯笼，一家人团团圆圆。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:为学校出力
  type: Concept
  subject: 道德与法治
  title: 为学校出力
  conceptType: 应用型
  aliases:
    - 我为学校出点力
  category: 方法
  explanation: 学校是我们成长的天地，作为学校的一员要为学校出一份力。可以细心观察学校需要改进的地方，调查后提出建议，再用行动去解决。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:为家乡发展出力
  type: Concept
  subject: 道德与法治
  title: 为家乡发展出力
  conceptType: 应用型
  aliases:
    - 我为家乡发展出力
  category: 观点
  explanation: 家乡的建设靠大家。我们可以积极参与了解家乡的活动，针对发现的问题提出建议，为家乡的发展贡献自己的一份力量。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:为梦想插上翅膀
  type: Concept
  subject: 道德与法治
  title: 为梦想插上翅膀
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 只为自己着想的梦想像萤火虫的微光，为祖国、为人民服务的梦想才能飞得更高、更闪亮。要让梦想和祖国连在一起。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:为父母分担
  type: Concept
  subject: 道德与法治
  title: 为父母分担
  conceptType: 应用型
  aliases:
    - 我为家人来分担
  category: 方法
  explanation: 作为家中的小成员，我们可以做些力所能及的家务，比如扫地、煮饭、陪长辈散步，帮家人分担。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:为班级出力
  type: Concept
  subject: 道德与法治
  title: 为班级出力
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 有利于班级的事，再小也能为班级增添光彩。可以报名比赛、想金点子、参加宣传组。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:主动交流化解矛盾
  type: Concept
  subject: 道德与法治
  title: 主动交流化解矛盾
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 与家人产生矛盾时，要先反思自己，站在家人的角度想一想，再主动沟通、表达真实想法。写信、留便条也是交流的好方式。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:主动关心他人
  type: Concept
  subject: 道德与法治
  title: 主动关心他人
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 留心观察别人的动作和表情，发现妈妈累了就帮忙做家务，发现同学心情不好就主动安慰他。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:义务教育法
  type: Concept
  subject: 道德与法治
  title: 义务教育法
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 保障适龄儿童、少年接受义务教育的权利的法律。义务教育不收学费、杂费，是国家必须予以保障的公益性事业。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:九一八事变
  type: Concept
  subject: 道德与法治
  title: 九一八事变
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 1931年日本发动的侵华事变，给中国人民带来了空前巨大的灾难。它成为中国人民抗日战争的起点，也揭开了世界反法西斯战争的序幕。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:九二共识
  type: Concept
  subject: 道德与法治
  title: 九二共识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把九二共识当作两岸签署的正式协议，实际是双方口头表述的共识。
    - 能指出并纠正这一错误：认为九二共识承认‘一中一台’或‘两个中国’，其核心是两岸同属一个中国。
  aliases:
    - 一个中国原则
  category: 历史共识
  explanation: 1992年海协会与台湾海基会达成的共识，核心是“海峡两岸同属一个中国，共同努力谋求国家统一”。
  misconceptions:
    - 误把九二共识当作两岸签署的正式协议，实际是双方口头表述的共识。
    - 认为九二共识承认‘一中一台’或‘两个中国’，其核心是两岸同属一个中国。
    - 将九二共识与‘一国两制’混为一谈，前者是政治基础，后者是统一方案。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:习近平强军思想
  type: Concept
  subject: 道德与法治
  title: 习近平强军思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把习近平强军思想等同于国防和军队现代化战略，忽略其统领地位
    - 能指出并纠正这一错误：误认为强军思想只适用于军队建设，与地方和青年学生无关
  aliases: []
  category: 指导思想
  explanation: 新时代必须全面贯彻习近平强军思想，全面推进国防和军队现代化，建设一支听党指挥、能打胜仗、作风优良的人民军队。
  misconceptions:
    - 把习近平强军思想等同于国防和军队现代化战略，忽略其统领地位
    - 误认为强军思想只适用于军队建设，与地方和青年学生无关
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:习近平新时代中国特色社会主义思想
  type: Concept
  subject: 道德与法治
  title: 习近平新时代中国特色社会主义思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为习近平新时代中国特色社会主义思想只是习近平的个人思想，忽视它是党和人民实践经验的集体智慧。
    - 能指出并纠正这一错误：误把它等同于某一具体领域思想，如只强调经济，实际涵盖治党治国治军等各方面。
  aliases: []
  category: 指导思想
  explanation: 当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。
  misconceptions:
    - 认为习近平新时代中国特色社会主义思想只是习近平的个人思想，忽视它是党和人民实践经验的集体智慧。
    - 误把它等同于某一具体领域思想，如只强调经济，实际涵盖治党治国治军等各方面。
    - 把它与中国特色社会主义理论体系对立，实际上它是这一体系的最新成果。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:乡村振兴战略
  type: Concept
  subject: 道德与法治
  title: 乡村振兴战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把乡村振兴简单等同于农村城市化，忽视乡村特色保留。
    - 能指出并纠正这一错误：以为乡村振兴只抓经济，忽略生态、文化、组织等振兴。
  aliases: []
  category: 战略
  explanation: 新时代我国实施的解决农业农村农民问题的战略，促进农村发展，实现共同富裕。
  misconceptions:
    - 把乡村振兴简单等同于农村城市化，忽视乡村特色保留。
    - 以为乡村振兴只抓经济，忽略生态、文化、组织等振兴。
    - 认为乡村振兴是摆脱贫困的临时政策，实际是长期战略。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:互利共赢的开放战略
  type: Concept
  subject: 道德与法治
  title: 互利共赢的开放战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把互利共赢理解为单方面让利，牺牲本国利益去讨好他国。
    - 能指出并纠正这一错误：认为开放战略就是无条件开放，忽视国家经济安全风险。
  aliases: []
  category: 经济战略
  explanation: 中国奉行互利共赢的开放战略，促进共同发展。
  misconceptions:
    - 把互利共赢理解为单方面让利，牺牲本国利益去讨好他国。
    - 认为开放战略就是无条件开放，忽视国家经济安全风险。
    - 条件倒置：以为只要开放就自动共赢，忽略规则和公平协商。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:互相帮助
  type: Concept
  subject: 道德与法治
  title: 互相帮助
  conceptType: 概念型
  aliases:
    - 同学要互助
    - 互助
  category: 观点
  explanation: 互相帮助是搭建友谊桥梁的重要基石。它能让我们得到支持和鼓励，也能学到别人的长处。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:五位一体总体布局
  type: Concept
  subject: 道德与法治
  title: 五位一体总体布局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏写‘生态文明建设’，误以为五位一体只含经济、政治、文化、社会。
    - 能指出并纠正这一错误：把‘社会建设’等同于‘社会管理’，实际还包括民生保障和社会治理。
  aliases: []
  category: 战略布局
  explanation: 统筹推进经济建设、政治建设、文化建设、社会建设、生态文明建设。
  misconceptions:
    - 漏写‘生态文明建设’，误以为五位一体只含经济、政治、文化、社会。
    - 把‘社会建设’等同于‘社会管理’，实际还包括民生保障和社会治理。
    - 与‘四个全面’混淆，分不清一个是总体布局，一个是战略布局。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:五四精神
  type: Concept
  subject: 道德与法治
  title: 五四精神
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 五四运动孕育的伟大精神，主要内容是爱国、进步、民主、科学。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:五四运动
  type: Concept
  subject: 道德与法治
  title: 五四运动
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 1919年5月4日爆发的伟大爱国运动，以先进青年知识分子为先锋、广大人民群众参加。它激发了全民族的伟大觉醒，促进了马克思主义在中国的广泛传播。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:井冈山革命根据地
  type: Concept
  subject: 道德与法治
  title: 井冈山革命根据地
  conceptType: 概念型
  aliases:
    - 井冈山根据地
  category: 概念
  explanation: 1928年朱德、陈毅与毛泽东在井冈山会师后建立的革命根据地，被称为中国革命的摇篮。红军在这里开展武装斗争，根据地不断巩固和扩大。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:交朋友的方法
  type: Concept
  subject: 道德与法治
  title: 交朋友的方法
  conceptType: 应用型
  aliases:
    - 怎么交朋友
    - 好友大搜索
  category: 方法
  explanation: 主动介绍自己的名字和爱好，邀请别人一起玩、一起做游戏，就能认识新朋友、交上好朋友。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:产品生产的环节
  type: Concept
  subject: 道德与法治
  title: 产品生产的环节
  conceptType: 程序型
  aliases:
    - 物品的生产流程
  category: 现象
  explanation: 一件产品要经过设计、备料、生产、装饰、检验、包装，再运到商店销售，才能到达我们手中。每个环节都有人在辛勤劳动。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:产学研深度融合
  type: Concept
  subject: 道德与法治
  title: 产学研深度融合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为创新主体是高校，实际企业是主体。
    - 能指出并纠正这一错误：以为产学研融合就是企业出钱、学校出成果的简单买卖。
  aliases: []
  category: 创新机制
  explanation: 企业、高校、科研院所协同创新，加强企业主导的产学研深度融合。
  misconceptions:
    - 误认为创新主体是高校，实际企业是主体。
    - 以为产学研融合就是企业出钱、学校出成果的简单买卖。
    - 把“深度融合”理解为三者物理上同处一地，忽视机制协同。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:亲社会行为
  type: Concept
  subject: 道德与法治
  title: 亲社会行为
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为带有个人目的（如为加分）的帮助不是亲社会行为，亲社会看行为是否利他。
    - 能指出并纠正这一错误：把认真学习说成亲社会行为，学习主要利于自身，不直接促进社会。
  aliases:
    - 利社会行为
  category: 道德与法治
  explanation: 亲社会行为是指人们在社会交往中表现出来的有利于他人和社会的行为，如帮助他人、参与公益活动等。
  misconceptions:
    - 认为带有个人目的（如为加分）的帮助不是亲社会行为，亲社会看行为是否利他。
    - 把认真学习说成亲社会行为，学习主要利于自身，不直接促进社会。
    - 觉得只要不破坏社会秩序就是亲社会，缺乏主动帮助或参与公益。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:亲社会行为的意义
  type: Concept
  subject: 道德与法治
  title: 亲社会行为的意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为亲社会行为只对他人社会有好处，自己没收获，忽略会促进个人成长。
    - 能指出并纠正这一错误：把获得他人认可当作唯一意义，忽略也能为社会增添正能量。
  aliases: []
  category: 社会行为
  explanation: 亲社会行为促进个人成长和社会进步，有利于养成良好的行为习惯，形成正确的价值观，获得他人和社会的接纳与认可，为社会增添正能量。
  misconceptions:
    - 认为亲社会行为只对他人社会有好处，自己没收获，忽略会促进个人成长。
    - 把获得他人认可当作唯一意义，忽略也能为社会增添正能量。
    - 误以为只有做大事才有意义，日常小事如让座、捡垃圾毫无意义。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:人与自然和谐共生
  type: Concept
  subject: 道德与法治
  title: 人与自然和谐共生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人与自然和谐共生就是人类不能利用任何自然资源
    - 能指出并纠正这一错误：认为人是自然的主宰，可以随意征服和改造自然
  aliases:
    - 人与自然和谐发展
  category: 生态文明理念
  explanation: 自然是生命之母，人与自然是生命共同体，追求人与自然和谐共生是人类面对生态危机作出的智慧选择。
  misconceptions:
    - 认为人与自然和谐共生就是人类不能利用任何自然资源
    - 认为人是自然的主宰，可以随意征服和改造自然
    - 把和谐共生只理解为环境保护，忽视人口、资源等问题
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:人口问题
  type: Concept
  subject: 道德与法治
  title: 人口问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人口问题只是人口数量问题，忽视老龄化、性别比等
    - 能指出并纠正这一错误：认为人口问题只是国家的事，与普通公民没有关系
  aliases: []
  category: 道德与法治
  explanation: 人口是社会发展的主体，是影响可持续发展的关键变量。人口问题始终是我国面临的全局性、长期性、战略性问题。
  misconceptions:
    - 认为人口问题只是人口数量问题，忽视老龄化、性别比等
    - 认为人口问题只是国家的事，与普通公民没有关系
    - 将人口问题等同于生育问题，忽略人口素质、分布等
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:人大代表的义务
  type: Concept
  subject: 道德与法治
  title: 人大代表的义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：人大代表只需开会时举手表决，闭会期间无需联系群众
    - 能指出并纠正这一错误：人大代表只对上级负责，不必接受原选区选民监督
  aliases:
    - 代表义务
  category: 政治制度
  explanation: 人大代表必须与人民群众保持密切联系，听取和反映人民群众的意见和要求，努力为人民服务，对人民负责，并接受人民监督。
  misconceptions:
    - 人大代表只需开会时举手表决，闭会期间无需联系群众
    - 人大代表只对上级负责，不必接受原选区选民监督
    - 人大代表反映的是个人意见，不必听取群众要求
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:人大代表的作用
  type: Concept
  subject: 道德与法治
  title: 人大代表的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：人大代表的作用就是制定法律，立法由人大代表直接完成
    - 能指出并纠正这一错误：人大代表只是提建议，对国家机关改进没有推动责任
  aliases:
    - 代表作用
  category: 政治制度
  explanation: 人大代表在国家政策制定过程中发挥重要作用，通过提出议案和建议，推动国家机关改进工作，促进政策完善。
  misconceptions:
    - 人大代表的作用就是制定法律，立法由人大代表直接完成
    - 人大代表只是提建议，对国家机关改进没有推动责任
    - 把提出议案等同于作用发挥，忽视督促落实
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:人大代表的职权
  type: Concept
  subject: 道德与法治
  title: 人大代表的职权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：人大代表可以直接任免政府官员，无需人大会议决定
    - 能指出并纠正这一错误：把人大代表职权等同于公民基本权利，认为可以随意行使
  aliases:
    - 代表职权
  category: 政治制度
  explanation: 人大代表依照宪法和法律赋予本级人民代表大会的各项职权，参加行使国家权力，有权依法审议各项议案和报告、表决各项决定、提出议案和建议等。
  misconceptions:
    - 人大代表可以直接任免政府官员，无需人大会议决定
    - 把人大代表职权等同于公民基本权利，认为可以随意行使
    - 人大代表可以越权干涉法院审判和检察院工作
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:人才强国战略
  type: Concept
  subject: 道德与法治
  title: 人才强国战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人才强国只需培养人才，不用引进海外人才。
    - 能指出并纠正这一错误：把人才等同于高学历者，忽略技能型、应用型人才。
  aliases: []
  category: 战略
  explanation: 国家战略，培养和吸引人才，发挥人才在创新和发展中的第一资源作用。
  misconceptions:
    - 认为人才强国只需培养人才，不用引进海外人才。
    - 把人才等同于高学历者，忽略技能型、应用型人才。
    - 以为人才强国战略只针对科技领域，不涉及教育、医疗等。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:人格尊严
  type: Concept
  subject: 道德与法治
  title: 人格尊严
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人格尊严等同于名誉权，认为只有侮辱、诽谤才侵犯人格尊严。
    - 能指出并纠正这一错误：认为人格尊严权是公民的“权力”而非“权利”，混淆权利与权力。
  aliases:
    - 人格权
  category: 法律概念
  explanation: 指公民的人格尊严不受侵犯，包括名誉权、肖像权、隐私权等，受宪法和法律的保护。
  misconceptions:
    - 把人格尊严等同于名誉权，认为只有侮辱、诽谤才侵犯人格尊严。
    - 认为人格尊严权是公民的“权力”而非“权利”，混淆权利与权力。
    - 将隐私权划归人身自由权，不知道隐私权属于人格尊严范畴。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:人格平等
  type: Concept
  subject: 道德与法治
  title: 人格平等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为收入高、学历高的人人格更高贵，穷人或文盲低人一等。
    - 能指出并纠正这一错误：觉得老板骂员工天经地义，因为给员工发工资，人格有高低。
  aliases: []
  category: 道德与法治
  explanation: 人格平等指人们虽有贫富、知识多寡之别，但在人格上一律平等，没有高低贵贱之分，人格尊严受法律平等保护。
  misconceptions:
    - 认为收入高、学历高的人人格更高贵，穷人或文盲低人一等。
    - 觉得老板骂员工天经地义，因为给员工发工资，人格有高低。
    - 看到清洁工就嫌弃，认为他们的劳动低贱，不配受尊重。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:人民代表大会制度
  type: Concept
  subject: 道德与法治
  title: 人民代表大会制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人民代表大会制度等同于人民代表大会这一机构
    - 能指出并纠正这一错误：认为人民直接行使国家权力，不必通过人大代表
  aliases:
    - 人大制度
  category: 政治制度
  explanation: 我国的根本政治制度，国家一切权力属于人民，通过人民代表大会行使权力。
  misconceptions:
    - 把人民代表大会制度等同于人民代表大会这一机构
    - 认为人民直接行使国家权力，不必通过人大代表
    - 说人民代表大会制度是我国基本政治制度
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:人民代表大会的任免权
  type: Concept
  subject: 道德与法治
  title: 人民代表大会的任免权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国务院总理是由全国人大代表直接投票选举的
    - 能指出并纠正这一错误：误以为所有国家机关工作人员都由人大任免，包括普通公务员
  aliases:
    - 任免权
  category: 人大职权
  explanation: 各级人大和县级以上各级人大常委会依据宪法和法律享有对相关国家机关领导人员及其他组成人员进行选举、决定任免、罢免的权力。
  misconceptions:
    - 认为国务院总理是由全国人大代表直接投票选举的
    - 误以为所有国家机关工作人员都由人大任免，包括普通公务员
    - 认为地方人大可以直接罢免乡镇长，无需依法定程序
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:人民代表大会的决定权
  type: Concept
  subject: 道德与法治
  title: 人民代表大会的决定权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人大对任何重大事项都有决定权，可以随时干预企业微观经营
    - 能指出并纠正这一错误：误以为决定权只能由全国人大行使，地方人大没有决定权
  aliases:
    - 决定权
  category: 人大职权
  explanation: 各级人大和县级以上各级人大常委会依据宪法和法律行使重大事项决定权。
  misconceptions:
    - 认为人大对任何重大事项都有决定权，可以随时干预企业微观经营
    - 误以为决定权只能由全国人大行使，地方人大没有决定权
    - 将人大的决定权与政府行政决策权混为一谈，认为政府所有决定都需人大批准
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:人民代表大会的监督权
  type: Concept
  subject: 道德与法治
  title: 人民代表大会的监督权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人大可以直接改变或撤销法院的生效判决
    - 能指出并纠正这一错误：误以为人大监督是对所有公民个体的监督，可以调查私人生活
  aliases:
    - 监督权
  category: 人大职权
  explanation: 全国人大及其常委会有权监督宪法和法律的实施，县级以上人大及其常委会有权监督本级国家行政机关、监察机关、审判机关、检察机关的工作。
  misconceptions:
    - 认为人大可以直接改变或撤销法院的生效判决
    - 误以为人大监督是对所有公民个体的监督，可以调查私人生活
    - 认为地方人大也可以监督宪法的实施，混淆全国人大与地方人大的监督权限
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:人民代表大会的立法权
  type: Concept
  subject: 道德与法治
  title: 人民代表大会的立法权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为乡镇人大也有权制定地方性法规
    - 能指出并纠正这一错误：误以为全国人大常委会有权修改宪法
  aliases:
    - 立法权
  category: 人大职权
  explanation: 全国人大及其常委会行使国家立法权，包括修改宪法、制定和修改法律，以及制定地方性法规。
  misconceptions:
    - 认为乡镇人大也有权制定地方性法规
    - 误以为全国人大常委会有权修改宪法
    - 认为地方性法规由地方人大常委会制定，与地方人大无关
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人民军队的作用
  type: Concept
  subject: 道德与法治
  title: 人民军队的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将人民军队的作用扩大化，认为军队可以参与国内执法和司法活动
    - 能指出并纠正这一错误：误认为人民军队只保卫领土，忽略维护海外利益和促进世界和平的作用
  aliases:
    - 人民军队的使命
  category: 国防与军队建设
  explanation: 人民军队是保卫红色江山、维护民族尊严的坚强柱石，也是维护地区和世界和平的强大力量，为巩固党的领导、捍卫国家主权和领土完整、维护海外利益、促进世界和平提供战略支撑。
  misconceptions:
    - 将人民军队的作用扩大化，认为军队可以参与国内执法和司法活动
    - 误认为人民军队只保卫领土，忽略维护海外利益和促进世界和平的作用
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:人民军队的性质
  type: Concept
  subject: 道德与法治
  title: 人民军队的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民军队是国家的军队，应保持政治中立，不必接受任何政党的领导。
    - 能指出并纠正这一错误：误以为人民军队的性质是“保家卫国”，从而忽略了党对军队的绝对领导这一根本属性。
  aliases: []
  category: 道德与法治
  explanation: 人民军队是中国共产党缔造和领导的人民军队，对党忠诚、听党指挥，攻无不克、战无不胜，深受人民爱戴。
  misconceptions:
    - 认为人民军队是国家的军队，应保持政治中立，不必接受任何政党的领导。
    - 误以为人民军队的性质是“保家卫国”，从而忽略了党对军队的绝对领导这一根本属性。
    - 认为人民军队只服从中央军委主席个人，而不是服从党组织的集体领导。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:人民军队的性质和宗旨
  type: Concept
  subject: 道德与法治
  title: 人民军队的性质和宗旨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人民军队的根本宗旨当成保卫国家，而忽略全心全意为人民服务
    - 能指出并纠正这一错误：误认为军人优先是特权，而非体现宗旨，反例：军人依法优先购票并非个人特权
  aliases:
    - 人民军队的宗旨
  category: 国防与军队建设
  explanation: 人民军队是纪律严明、作风优良的军队，始终坚持全心全意为人民服务的根本宗旨，与人民同呼吸、共命运、心连心。
  misconceptions:
    - 把人民军队的根本宗旨当成保卫国家，而忽略全心全意为人民服务
    - 误认为军人优先是特权，而非体现宗旨，反例：军人依法优先购票并非个人特权
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:人民军队的构成
  type: Concept
  subject: 道德与法治
  title: 人民军队的构成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将武警部队归入人民解放军的编制序列。
    - 能指出并纠正这一错误：混淆军种和兵种，认为陆军、海军是兵种，而火箭军是军种。
  aliases:
    - 中国人民解放军构成
  category: 道德与法治
  explanation: 中国人民解放军是全国武装力量的主体，包括陆军、海军、空军、火箭军等军种，以及军事航天部队、网络空间部队、信息支援部队、联勤保障部队等兵种。
  misconceptions:
    - 误将武警部队归入人民解放军的编制序列。
    - 混淆军种和兵种，认为陆军、海军是兵种，而火箭军是军种。
    - 忽略军事航天部队、网络空间部队等新兵种，认为人民军队只包括陆、海、空、火箭军。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:人民当家作主
  type: Concept
  subject: 道德与法治
  title: 人民当家作主
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民当家作主就是每个人都直接管理国家事务
    - 能指出并纠正这一错误：把人民当家作主等同于公民个人可随意决策，不必通过法定程序
  aliases:
    - 人民主权
  category: 政治概念
  explanation: 人民当家作主是社会主义民主政治的本质特征，指人民是国家的主人，通过各种途径和形式管理国家事务。
  misconceptions:
    - 认为人民当家作主就是每个人都直接管理国家事务
    - 把人民当家作主等同于公民个人可随意决策，不必通过法定程序
    - 认为只有选举时才有人民当家作主，平时没有体现
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:人民检察院独立行使检察权
  type: Concept
  subject: 道德与法治
  title: 人民检察院独立行使检察权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为检察院独立行使检察权就是不受上级检察院领导，否认上下级领导关系。
    - 能指出并纠正这一错误：把'检察权'写成'审判权'，认为检察院独立行使的是审判权。
  aliases: []
  category: 法律常识
  explanation: 人民检察院依照法律规定独立行使检察权，不受行政机关、社会团体和个人的干涉。
  misconceptions:
    - 误认为检察院独立行使检察权就是不受上级检察院领导，否认上下级领导关系。
    - 把'检察权'写成'审判权'，认为检察院独立行使的是审判权。
    - 认为检察院独立行使检察权意味着不受人大监督，忘了检察院要对人大负责。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S12.md
- id: concept:道德与法治:人民检察院的性质
  type: Concept
  subject: 道德与法治
  title: 人民检察院的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人民检察院是国家的审判机关，与法院性质完全相同。
    - 能指出并纠正这一错误：把检察院当成行政机关的一部分，说检察院隶属于政府。
  aliases:
    - 检察院
  category: 法律常识
  explanation: 人民检察院是国家的法律监督机关，依法独立行使检察权。
  misconceptions:
    - 误认为人民检察院是国家的审判机关，与法院性质完全相同。
    - 把检察院当成行政机关的一部分，说检察院隶属于政府。
    - 认为法律监督机关可以监督所有国家机关，包括全国人大。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人民检察院的组织体系
  type: Concept
  subject: 道德与法治
  title: 人民检察院的组织体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为地方各级检察院也分为高级、中级和基层三级，照搬法院体系。
    - 能指出并纠正这一错误：漏掉专门人民检察院，以为检察院只有最高和地方两级。
  aliases: []
  category: 法律常识
  explanation: 我国设立最高人民检察院、地方各级人民检察院和专门人民检察院，专门人民检察院有军事检察院等。
  misconceptions:
    - 误认为地方各级检察院也分为高级、中级和基层三级，照搬法院体系。
    - 漏掉专门人民检察院，以为检察院只有最高和地方两级。
    - 把军事检察院当成人民法院的专门法院，混淆机关属性。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人民检察院的职权
  type: Concept
  subject: 道德与法治
  title: 人民检察院的职权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为检察院可以审判罪犯，把提起公诉与定罪判刑混为一谈。
    - 能指出并纠正这一错误：认为检察院有权直接决定罪犯的刑罚，不需要经过法院判决。
  aliases: []
  category: 法律常识
  explanation: 人民检察院通过行使检察权，追诉犯罪，维护国家安全和社会秩序，保护合法权益，保障法律正确实施。
  misconceptions:
    - 误认为检察院可以审判罪犯，把提起公诉与定罪判刑混为一谈。
    - 认为检察院有权直接决定罪犯的刑罚，不需要经过法院判决。
    - 把检察院的职权说成包括行使审判权，混淆司法职权。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人民民主
  type: Concept
  subject: 道德与法治
  title: 人民民主
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民民主就是西方所说的民主，忽视中国特色
    - 能指出并纠正这一错误：把人民民主等同于简单的投票选举
  aliases:
    - 社会主义民主
  category: 政治概念
  explanation: 人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义。
  misconceptions:
    - 认为人民民主就是西方所说的民主，忽视中国特色
    - 把人民民主等同于简单的投票选举
    - 认为人民民主只存在于政治领域，与社会经济无关
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:人民民主专政
  type: Concept
  subject: 道德与法治
  title: 人民民主专政
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民民主专政就是全体人民共同执政，没有专政职能。
    - 能指出并纠正这一错误：忽视工人阶级的领导，误以为工农联盟为基础意味着工农共同执政。
  aliases: []
  category: 政治概念
  explanation: 我国的国家性质，即工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。
  misconceptions:
    - 认为人民民主专政就是全体人民共同执政，没有专政职能。
    - 忽视工人阶级的领导，误以为工农联盟为基础意味着工农共同执政。
    - 将人民民主专政等同于西方民主国家，忽略社会主义性质。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:人民法院独立行使审判权
  type: Concept
  subject: 道德与法治
  title: 人民法院独立行使审判权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为法院独立行使审判权就是不受人大监督，忘了法院要对人大负责。
    - 能指出并纠正这一错误：把'审判权'写成'检察权'，认为法院独立行使的是检察权。
  aliases: []
  category: 法律常识
  explanation: 人民法院依照法律规定独立行使审判权，不受行政机关、社会团体和个人的干涉。
  misconceptions:
    - 误认为法院独立行使审判权就是不受人大监督，忘了法院要对人大负责。
    - 把'审判权'写成'检察权'，认为法院独立行使的是检察权。
    - 认为法院独立行使审判权意味着法官可以完全脱离合议庭和审委会独立裁判。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S12.md
- id: concept:道德与法治:人民法院的性质
  type: Concept
  subject: 道德与法治
  title: 人民法院的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人民法院是法律监督机关，与检察院性质互换。
    - 能指出并纠正这一错误：把法院说成国家行政机关，认为政府可以领导法院。
  aliases:
    - 法院
  category: 法律常识
  explanation: 人民法院是国家的审判机关，依法独立行使审判权。
  misconceptions:
    - 误认为人民法院是法律监督机关，与检察院性质互换。
    - 把法院说成国家行政机关，认为政府可以领导法院。
    - 认为法院是唯一的司法机关，否认检察院也是司法机关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人民法院的组织体系
  type: Concept
  subject: 道德与法治
  title: 人民法院的组织体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为地方各级人民法院分为省、市、县三级，而不分高级、中级、基层。
    - 能指出并纠正这一错误：漏掉专门人民法院，只写最高和地方法院。
  aliases: []
  category: 法律常识
  explanation: 我国设立最高人民法院、地方各级人民法院和专门人民法院，地方各级人民法院分为高级、中级和基层人民法院。
  misconceptions:
    - 误认为地方各级人民法院分为省、市、县三级，而不分高级、中级、基层。
    - 漏掉专门人民法院，只写最高和地方法院。
    - 把海事法院、军事法院算作检察院的专门机关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人民法院的职权
  type: Concept
  subject: 道德与法治
  title: 人民法院的职权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为法院可以主动追究犯罪，不懂自诉案件和公诉案件的区别。
    - 能指出并纠正这一错误：把法院的职权包括法律监督，混淆法院和检察院的职能。
  aliases: []
  category: 法律常识
  explanation: 人民法院通过审判刑事案件、民事案件、行政案件等，惩罚犯罪，解决纠纷，保护权益，监督行政机关依法行使职权。
  misconceptions:
    - 误认为法院可以主动追究犯罪，不懂自诉案件和公诉案件的区别。
    - 把法院的职权包括法律监督，混淆法院和检察院的职能。
    - 认为法院可以通过审判制定法律，把审判权当成立法权。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人民调解委员会
  type: Concept
  subject: 道德与法治
  title: 人民调解委员会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为调解协议有强制执行力，签字后反悔仍可要求强制执行。
    - 能指出并纠正这一错误：把人民调解委员会当作国家行政机关，认为其裁决必须服从。
  aliases: []
  category: 法律组织
  explanation: 通过说服、疏导等方法帮助解决生活中的矛盾和纠纷。
  misconceptions:
    - 认为调解协议有强制执行力，签字后反悔仍可要求强制执行。
    - 把人民调解委员会当作国家行政机关，认为其裁决必须服从。
    - 以为所有纠纷必须先经人民调解，否则法院不予受理。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:人治思维
  type: Concept
  subject: 道德与法治
  title: 人治思维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为领导人的指示就是法律，可以随意改变规则
    - 能指出并纠正这一错误：把人治思维等同于灵活变通，忽视规则的普遍适用性
  aliases: []
  category: 法律概念
  explanation: 漠视规则普遍适用性，按照个人意志和感情进行治理，具有任意性和非理性。
  misconceptions:
    - 认为领导人的指示就是法律，可以随意改变规则
    - 把人治思维等同于灵活变通，忽视规则的普遍适用性
    - 认为人治思维就是讲人情，可以突破法律底线
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:人生价值
  type: Concept
  subject: 道德与法治
  title: 人生价值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为有钱有地位才算实现人生价值，忽视普通劳动者在平凡岗位上的贡献
    - 能指出并纠正这一错误：把人生价值等同于向社会索取多少，而不是看贡献了多少
  aliases:
    - 生命价值
  category: 道德与法治
  explanation: 人生价值是指人的生命和活动对自己、他人和社会所具有的积极意义。人生价值是通过劳动创造的，一个人对他人和社会的贡献是衡量其人生价值的尺度。
  misconceptions:
    - 认为有钱有地位才算实现人生价值，忽视普通劳动者在平凡岗位上的贡献
    - 把人生价值等同于向社会索取多少，而不是看贡献了多少
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:人生态度
  type: Concept
  subject: 道德与法治
  title: 人生态度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：遇到挫折就全盘否定自己，只盯着失败的一面，看不到积极因素
    - 能指出并纠正这一错误：把悲观消极当作‘看透现实’，误以为积极态度就是不现实
  aliases:
    - 生活态度
  category: 道德与法治
  explanation: 人生态度是人在生活实践中形成的看待生活、对待人生的心理和行为倾向。积极的人生态度令人看到事物好的一面，消极的人生态度使人看到坏的一面。
  misconceptions:
    - 遇到挫折就全盘否定自己，只盯着失败的一面，看不到积极因素
    - 把悲观消极当作‘看透现实’，误以为积极态度就是不现实
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:人生目标
  type: Concept
  subject: 道德与法治
  title: 人生目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：目标定得越远大越好，不结合自身实际，结果中途放弃
    - 能指出并纠正这一错误：把近期目标当成最终追求，实现一个就松懈，忘了长远方向
  aliases:
    - 人生理想
    - 人生志向
  category: 道德与法治
  explanation: 人生目标体现着人在社会实践中对未来的向往和追求，决定着人生道路的发展方向。正确的人生目标能带来稳定而持久的内在激励，指引我们走上正确的人生道路。
  misconceptions:
    - 目标定得越远大越好，不结合自身实际，结果中途放弃
    - 把近期目标当成最终追求，实现一个就松懈，忘了长远方向
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:人的社会化
  type: Concept
  subject: 道德与法治
  title: 人的社会化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人长大成人就自然社会化，无需学习技能、规范或角色。
    - 能指出并纠正这一错误：把社会化简单等同于学习文化知识，忘记行为规范和角色学习。
  aliases:
    - 社会化
  category: 社会过程
  explanation: 一个人从最初的自然的生物个体转化为社会人的过程，包括学习社会知识、获得社会经验、形成社会认可的思维和行为方式。
  misconceptions:
    - 认为人长大成人就自然社会化，无需学习技能、规范或角色。
    - 把社会化简单等同于学习文化知识，忘记行为规范和角色学习。
    - 认为社会化只在参加工作后开始，家庭中学习生活技能不算社会化。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:人类命运共同体
  type: Concept
  subject: 道德与法治
  title: 人类命运共同体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人类命运共同体是要成立世界政府，各国交出主权。
    - 能指出并纠正这一错误：把构建人类命运共同体看作中国单方面的责任，与他国无关。
  aliases: []
  category: 政治概念
  explanation: 人类命运共同体理念深入人心，强调各国相互依存、共同发展，是当今时代的重要理念。
  misconceptions:
    - 认为人类命运共同体是要成立世界政府，各国交出主权。
    - 把构建人类命运共同体看作中国单方面的责任，与他国无关。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:人类活动诱发自然灾害
  type: Concept
  subject: 道德与法治
  title: 人类活动诱发自然灾害
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 除了自然原因，人类不合理的行为也会诱发或加重自然灾害。比如乱砍滥伐使森林无法涵养水源，容易造成洪涝和山体滑坡。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:人身权
  type: Concept
  subject: 道德与法治
  title: 人身权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人身权就是生命权和健康权，忽略肖像权、隐私权等
    - 能指出并纠正这一错误：误以为人身权可自由放弃，如允许他人伤害自己的身体
  aliases: []
  category: 法律权利
  explanation: 包括生命权、健康权、肖像权、隐私权等，是独立、自由、有尊严生活的基础。
  misconceptions:
    - 认为人身权就是生命权和健康权，忽略肖像权、隐私权等
    - 误以为人身权可自由放弃，如允许他人伤害自己的身体
    - 认为人身权只属于自然人，法人不享有任何人格利益
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:人身自由
  type: Concept
  subject: 道德与法治
  title: 人身自由
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人身自由仅指身体不受拘禁，不包括住宅和通信
    - 能指出并纠正这一错误：认为人身自由是绝对自由，可以不受任何法律限制
  aliases: []
  category: 法律概念
  explanation: 人身自由是指公民的人身不受非法侵犯的自由，包括人身自由不受侵犯、人格尊严不受侵犯、住宅不受侵犯、通信自由和通信秘密受法律保护。它是公民参加国家政治生活、经济生活与社会生活的基础。
  misconceptions:
    - 认为人身自由仅指身体不受拘禁，不包括住宅和通信
    - 认为人身自由是绝对自由，可以不受任何法律限制
    - 将人格尊严等同于人身自由，忽略两者区分
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:从小立志奋斗
  type: Concept
  subject: 道德与法治
  title: 从小立志奋斗
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 奋斗要从小事做起：给自己定个小目标，学好本领，认真做好每一件日常小事。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:他人评价
  type: Concept
  subject: 道德与法治
  title: 他人评价
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：听到表扬就得意，听到批评就全盘否定自己。
    - 能指出并纠正这一错误：认为‘走自己的路，让别人说去吧’就是完全不理他人评价。
  aliases: []
  category: 认识方法
  explanation: 他人的评价是认识自己的一面镜子，要客观冷静对待，既不盲从也不轻视。
  misconceptions:
    - 听到表扬就得意，听到批评就全盘否定自己。
    - 认为‘走自己的路，让别人说去吧’就是完全不理他人评价。
    - 盲目听从他人评价，如‘别人说我胖我就减肥，其实根本不胖’。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:他律与自律
  type: Concept
  subject: 道德与法治
  title: 他律与自律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为他律只有惩罚，忽略监督、提醒也是他律（如觉得老师批评才算）
    - 能指出并纠正这一错误：认为自律就是自己想怎样就怎样，不需要遵守外界规则（如借口'我有自律'拒绝校规）
  aliases:
    - 自律
    - 他律
  category: 道德与法治
  explanation: 他律是外在约束，如监督、提醒、惩戒；自律是自我约束，通过自省和慎独纠正不良行为。二者相互补充，有助于遵守规则。
  misconceptions:
    - 误以为他律只有惩罚，忽略监督、提醒也是他律（如觉得老师批评才算）
    - 认为自律就是自己想怎样就怎样，不需要遵守外界规则（如借口'我有自律'拒绝校规）
    - 把自律与他律完全对立，认为两者不能同时起作用
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:以人民为中心的发展思想
  type: Concept
  subject: 道德与法治
  title: 以人民为中心的发展思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“以人民为中心”与“以经济建设为中心”混同，二者地位不同。
    - 能指出并纠正这一错误：以为“人人享有”就是平均分配，实际是共享发展成果，不是搞均贫富。
  aliases: []
  category: 思想
  explanation: 党和政府强调人人参与、人人尽力、人人享有，让人民群众共享发展成果，满足人民日益增长的美好生活需要。
  misconceptions:
    - 将“以人民为中心”与“以经济建设为中心”混同，二者地位不同。
    - 以为“人人享有”就是平均分配，实际是共享发展成果，不是搞均贫富。
    - 认为共享就是同步富裕，忽视共同富裕是一个长期过程。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:以高水平治理推动人民军队高质量发展
  type: Concept
  subject: 道德与法治
  title: 以高水平治理推动人民军队高质量发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将边斗争、边备战、边建设误解为只重视战争准备，忽略平时建设
    - 能指出并纠正这一错误：机械地认为机械化、信息化、智能化是依次实现，而非融合发展
  aliases: []
  category: 建设路径
  explanation: 坚持边斗争、边备战、边建设，坚持机械化信息化智能化融合发展，提高人民军队打赢能力和捍卫国家主权、安全、发展利益的战略能力。
  misconceptions:
    - 将边斗争、边备战、边建设误解为只重视战争准备，忽略平时建设
    - 机械地认为机械化、信息化、智能化是依次实现，而非融合发展
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:仲裁
  type: Concept
  subject: 道德与法治
  title: 仲裁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一切纠纷都能申请仲裁，包括婚姻继承等
    - 能指出并纠正这一错误：认为仲裁不具强制力，不服裁决可再起诉
  aliases: []
  category: 法律概念
  explanation: 根据仲裁协议，将争议提交仲裁机构裁决，适用于合同纠纷和财产权益纠纷。
  misconceptions:
    - 认为一切纠纷都能申请仲裁，包括婚姻继承等
    - 认为仲裁不具强制力，不服裁决可再起诉
    - 把仲裁与和解混为一谈，认为都是私下协商
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:企业孵化器
  type: Concept
  subject: 道德与法治
  title: 企业孵化器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为孵化器是政府行政部门，实际是市场化服务机构。
    - 能指出并纠正这一错误：认为孵化器只提供资金，忽略管理、资源、技术等配套服务。
  aliases: []
  category: 创新平台
  explanation: 为初创企业提供资金、管理等便利，推动高新技术成果转化和企业成长。
  misconceptions:
    - 误以为孵化器是政府行政部门，实际是市场化服务机构。
    - 认为孵化器只提供资金，忽略管理、资源、技术等配套服务。
    - 把孵化器当成所有初创企业都能进入的场所，实际有准入条件。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:企业是创新的主体
  type: Concept
  subject: 道德与法治
  title: 企业是创新的主体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为高校和科研院所才是创新主体，忽视企业的主体地位。
    - 能指出并纠正这一错误：认为国有企业才是创新主体，民营企业和中小企业不是。
  aliases:
    - 企业科技创新主体地位
  category: 创新机制
  explanation: 企业是科技和经济紧密结合的重要力量，是推动创新创造的生力军，要强化企业科技创新主体地位。
  misconceptions:
    - 误以为高校和科研院所才是创新主体，忽视企业的主体地位。
    - 认为国有企业才是创新主体，民营企业和中小企业不是。
    - 以为企业只负责技术应用，基础研究完全交给高校。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:优秀家风蕴含的传统美德
  type: Concept
  subject: 道德与法治
  title: 优秀家风蕴含的传统美德
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 优秀家风中蕴含着尊老爱幼、勤俭持家、知书达礼、邻里团结、遵纪守法等中华民族传统美德。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:伟大建党精神
  type: Concept
  subject: 道德与法治
  title: 伟大建党精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为伟大建党精神就是民族精神，没有其独特性
    - 能指出并纠正这一错误：把伟大建党精神与红船精神完全等同，忽视其精神之源地位
  aliases:
    - 建党精神
  category: 精神
  explanation: 中国共产党的精神之源，包括坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。
  misconceptions:
    - 认为伟大建党精神就是民族精神，没有其独特性
    - 把伟大建党精神与红船精神完全等同，忽视其精神之源地位
    - 认为建党精神只属于共产党员，与普通群众无关
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:伟大抗战精神
  type: Concept
  subject: 道德与法治
  title: 伟大抗战精神
  conceptType: 概念型
  aliases:
    - 抗战精神
  category: 观点
  explanation: 中国人民在抗日战争中孕育出的精神：天下兴亡、匹夫有责的爱国情怀，视死如归、宁死不屈的民族气节，不畏强暴、血战到底的英雄气概，百折不挠、坚忍不拔的必胜信念。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:伟大抗疫精神
  type: Concept
  subject: 道德与法治
  title: 伟大抗疫精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将伟大抗疫精神等同于无私奉献，忽略生命至上等内涵
    - 能指出并纠正这一错误：认为伟大抗疫精神在疫情结束后就失去价值，不必传承
  aliases:
    - 抗疫精神
  category: 道德与法治
  explanation: 在同新冠疫情的殊死较量中，中国人民和中华民族以敢于斗争、敢于胜利的大无畏气概，铸就了生命至上、举国同心、舍生忘死、尊重科学、命运与共的伟大抗疫精神。
  misconceptions:
    - 将伟大抗疫精神等同于无私奉献，忽略生命至上等内涵
    - 认为伟大抗疫精神在疫情结束后就失去价值，不必传承
    - 误以为抗疫精神只是医务人员的，与普通民众无关
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:伟大长征精神
  type: Concept
  subject: 道德与法治
  title: 伟大长征精神
  conceptType: 概念型
  aliases:
    - 长征精神
  category: 观点
  explanation: 红军在长征中形成的精神：把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，不怕任何艰难险阻，坚持独立自主、实事求是，同人民群众生死相依、艰苦奋斗。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:传承中华优秀传统文化
  type: Concept
  subject: 道德与法治
  title: 传承中华优秀传统文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为穿汉服、背古文就等于传承，忽视理解内涵和践行价值。
    - 能指出并纠正这一错误：把传统文化一律视为封建糟粕，全盘否定，拒绝继承。
  aliases:
    - 文化传承
  category: 道德与法治
  explanation: 要传承弘扬中华优秀传统文化，增强爱国情感，弘扬民族精神和时代精神，践行社会主义核心价值观。
  misconceptions:
    - 认为穿汉服、背古文就等于传承，忽视理解内涵和践行价值。
    - 把传统文化一律视为封建糟粕，全盘否定，拒绝继承。
    - 只重继承不重创新，认为传统节日就是吃月饼粽子，忽视精神传承。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:传承优秀家风
  type: Concept
  subject: 道德与法治
  title: 传承优秀家风
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 优秀家风潜移默化地影响我们的心灵，塑造我们的人格。传承优秀家风要从小事做起、从自身做起，向社会传递正能量。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:传承和弘扬民族精神
  type: Concept
  subject: 道德与法治
  title: 传承和弘扬民族精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有惊天动地的壮举才算弘扬民族精神，忽略日常坚守
    - 能指出并纠正这一错误：认为传承民族精神只是党和政府的责任，个人无能为力
  aliases: []
  category: 道德与法治
  explanation: 传承和弘扬民族精神，表现在国家危难、民族危亡的紧要关头能够挺身而出、舍生忘死、前仆后继，表现在他人生命、财产遇到危险的关键时刻能够见义勇为、扶危济困、无私奉献，表现在日常学习工作中的勤勤恳恳、任劳任怨、敬业创优。
  misconceptions:
    - 认为只有惊天动地的壮举才算弘扬民族精神，忽略日常坚守
    - 认为传承民族精神只是党和政府的责任，个人无能为力
    - 把见义勇为等同于盲目硬拼，不懂依法智为、量力而行
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:传播网络正能量
  type: Concept
  subject: 道德与法治
  title: 传播网络正能量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到网络谣言不核实就转发，还认为是在弘扬正能量。
    - 能指出并纠正这一错误：认为传播正能量就是多点赞转发，不需要辨别信息真伪。
  aliases:
    - 网络正能量
  category: 道德与法治
  explanation: 要努力提高媒介素养，科学、文明、安全、合理使用网络，高扬主旋律，培育积极健康的网络文化，营造清朗的网络空间，建设网上精神家园；践行社会主义核心价值观，积极参与公共事务，投身公益行动。
  misconceptions:
    - 看到网络谣言不核实就转发，还认为是在弘扬正能量。
    - 认为传播正能量就是多点赞转发，不需要辨别信息真伪。
    - 觉得传播网络正能量是明星网红的事，普通学生无需参与。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:依宪治国
  type: Concept
  subject: 道德与法治
  title: 依宪治国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为依宪治国只是国家机关的事，与普通公民无关。
    - 能指出并纠正这一错误：认为依法治国就是依宪治国，忽视其他法律的作用。
  aliases: []
  category: 法治原则
  explanation: 坚持依法治国首先要坚持依宪治国，要求一切组织和个人在宪法和法律范围内活动，维护宪法权威。
  misconceptions:
    - 认为依宪治国只是国家机关的事，与普通公民无关。
    - 认为依法治国就是依宪治国，忽视其他法律的作用。
    - 认为只要不违反刑法，就不算违宪，日常行为不需合宪。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S1.md
- id: concept:道德与法治:依法办事
  type: Concept
  subject: 道德与法治
  title: 依法办事
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要不打架、不偷抢就是依法办事，遇到纠纷先私下解决，解决不了才想法律。
    - 能指出并纠正这一错误：觉得依法办事是政府部门的事，自己学生身份无关，乱闯红灯、抄袭作业都无所谓。
  aliases: []
  category: 法治素养
  explanation: 依法办事是指自觉守法、遇事找法、解决问题靠法，养成依法办事的习惯，依法维护社会秩序。
  misconceptions:
    - 认为只要不打架、不偷抢就是依法办事，遇到纠纷先私下解决，解决不了才想法律。
    - 觉得依法办事是政府部门的事，自己学生身份无关，乱闯红灯、抄袭作业都无所谓。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:依法办事能力
  type: Concept
  subject: 道德与法治
  title: 依法办事能力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：遇到纠纷先托人找关系，而不是依法收集证据、寻求法律途径。
    - 能指出并纠正这一错误：认为依法办事就等于打官司，忽视协商、调解等合法方式。
  aliases: []
  category: 法治观念
  explanation: 运用法律知识解决实际问题的能力。
  misconceptions:
    - 遇到纠纷先托人找关系，而不是依法收集证据、寻求法律途径。
    - 认为依法办事就等于打官司，忽视协商、调解等合法方式。
    - 只要自己觉得合理就认为是依法办事，不查法律具体规定。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:依法履行义务
  type: Concept
  subject: 道德与法治
  title: 依法履行义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律禁止的行为，只要没被处罚就能继续做
    - 能指出并纠正这一错误：认为义务可以放弃，权利必须行使，两者完全分离
  aliases: []
  category: 法律原则
  explanation: 法定义务具有强制性，法律要求做的必须去做，法律禁止做的坚决不做。
  misconceptions:
    - 认为法律禁止的行为，只要没被处罚就能继续做
    - 认为义务可以放弃，权利必须行使，两者完全分离
    - 认为履行义务全靠自觉，法律无法强制
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:依法有序参与民主生活
  type: Concept
  subject: 道德与法治
  title: 依法有序参与民主生活
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公民可以随时随地自由表达，不必遵守法律程序
    - 能指出并纠正这一错误：把依法有序参与等同于只有政府组织的活动才是参与
  aliases: []
  category: 政治概念
  explanation: 公民参与民主生活时应具备社会责任感和主人翁意识，以理性、公正、客观的态度看问题，并依法有序地表达观点和意见。
  misconceptions:
    - 认为公民可以随时随地自由表达，不必遵守法律程序
    - 把依法有序参与等同于只有政府组织的活动才是参与
    - 认为参与民主生活就是上访或网络发泄，不需要理性
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:依法服兵役
  type: Concept
  subject: 道德与法治
  title: 依法服兵役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为服兵役只包括现役，不包括民兵组织
    - 能指出并纠正这一错误：认为逃避兵役只是道德问题，不承担法律责任
  aliases: []
  category: 法律概念
  explanation: 保卫祖国、抵抗侵略是公民的神圣职责。依照法律服兵役和参加民兵组织是公民的光荣义务。我国实行以志愿兵役为主体的志愿兵役与义务兵役相结合的兵役制度。
  misconceptions:
    - 认为服兵役只包括现役，不包括民兵组织
    - 认为逃避兵役只是道德问题，不承担法律责任
    - 认为只有男性需要服兵役，女性不需履行此义务
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:依法治国
  type: Concept
  subject: 道德与法治
  title: 依法治国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为依法治国是用法律来约束公民，政府可以不受法律约束
    - 能指出并纠正这一错误：把依法治国等同于制定更多法律，忽视法律实施
  aliases:
    - 法治
  category: 法治概念
  explanation: 发展人民民主必须坚持全面依法治国，推进法治国家、法治政府、法治社会一体建设。
  misconceptions:
    - 认为依法治国是用法律来约束公民，政府可以不受法律约束
    - 把依法治国等同于制定更多法律，忽视法律实施
    - 认为依法治国只针对违法犯罪，与日常生活无关
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:依法纳税
  type: Concept
  subject: 道德与法治
  title: 依法纳税
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为纳税只是企业的事，与个人收入无关
    - 能指出并纠正这一错误：把逃税、欠税、骗税、抗税混为一谈，不区分法律责任
  aliases: []
  category: 法律概念
  explanation: 税收是国家财政收入的主要来源。任何逃税、欠税、骗税、抗税的行为都是违法行为，都要依法承担相应的法律责任。
  misconceptions:
    - 认为纳税只是企业的事，与个人收入无关
    - 把逃税、欠税、骗税、抗税混为一谈，不区分法律责任
    - 认为偷税是小事，补交即可不承担刑事责任
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:依法维护自身权利
  type: Concept
  subject: 道德与法治
  title: 依法维护自身权利
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 当合法权益受到侵害时，不能靠报复或蛮干，要善于运用法律武器，通过合法途径维护自己的权利。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:依法维权要靠证据
  type: Concept
  subject: 道德与法治
  title: 依法维权要靠证据
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 一切依法取得的能够证明案件事实的材料都可以作为证据，如合同、书信、电子邮件、证人证言、视频、照片、录音等。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:依法行使权利
  type: Concept
  subject: 道德与法治
  title: 依法行使权利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为行使权利可以无视道德纪律，如'我只要不违法，在公共场所大声喧哗是我的权利'
    - 能指出并纠正这一错误：把'权利'当'权力'，认为'我有权利处分你'，将个人意志强加于人
  aliases: []
  category: 道德与法治
  explanation: 自由不是随心所欲，是有限制的、相对的，要在遵守道德、纪律、法律等社会规则的前提下行使权利。
  misconceptions:
    - 误以为行使权利可以无视道德纪律，如'我只要不违法，在公共场所大声喧哗是我的权利'
    - 把'权利'当'权力'，认为'我有权利处分你'，将个人意志强加于人
    - 行使权利时不顾他人感受，如深夜装修唱歌，认为'这是我的家事，别人无权干涉'
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:依法行政
  type: Concept
  subject: 道德与法治
  title: 依法行政
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为行政机关可以'法无授权亦可为'，违背职权法定原则。
    - 能指出并纠正这一错误：认为行政机关只要不违法，不履行法定职责也无妨。
  aliases:
    - 法治政府
  category: 法治
  explanation: 行政机关必须依法行政，坚持法定职责必须为、法无授权不可为，坚决纠正不作为、慢作为、乱作为。
  misconceptions:
    - 误认为行政机关可以'法无授权亦可为'，违背职权法定原则。
    - 认为行政机关只要不违法，不履行法定职责也无妨。
    - 把依法行政写成依法执政，混淆政府与党的领导方式。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:侵害英雄烈士名誉、荣誉罪
  type: Concept
  subject: 道德与法治
  title: 侵害英雄烈士名誉、荣誉罪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为诋毁英雄烈士只承担民事责任，不知道这是刑事犯罪。
    - 能指出并纠正这一错误：认为任何辱骂英雄烈士的行为都构成此罪，忽略情节严重等条件。
  aliases: []
  category: 刑法罪名
  explanation: 刑法修正案（十一）增设的罪名，对诋毁英雄烈士的行为予以刑事处罚，保护英雄烈士名誉荣誉。
  misconceptions:
    - 误认为诋毁英雄烈士只承担民事责任，不知道这是刑事犯罪。
    - 认为任何辱骂英雄烈士的行为都构成此罪，忽略情节严重等条件。
    - 把罪名写成'侵害英雄烈士名誉权罪'，混淆民事与刑事。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S4.md
- id: concept:道德与法治:保护民间艺术
  type: Concept
  subject: 道德与法治
  title: 保护民间艺术
  conceptType: 概念型
  aliases:
    - 民间艺术的保护
  category: 观点
  explanation: 受外来文化和城市文化的冲击，许多民间艺术面临衰落的困境。只有找出衰落的原因，才能更好地继承和发展它们，少年儿童也能贡献力量。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:保护眼睛的方法
  type: Concept
  subject: 道德与法治
  title: 保护眼睛的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 使用电子产品时要保持合适的距离，控制用眼时间，看屏幕约20分钟就休息一下，还可以根据光线调节屏幕亮度。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:保持公共卫生
  type: Concept
  subject: 道德与法治
  title: 保持公共卫生
  conceptType: 概念型
  aliases:
    - 我们不乱扔
    - 讲公共卫生
  category: 观点
  explanation: 不乱扔垃圾，不随地吐痰，不在公共场所乱涂乱画。垃圾要放进垃圾桶或垃圾袋，离开公共场所随手带走垃圾。干净整洁的地方人人都喜欢。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:保持身心健康
  type: Concept
  subject: 道德与法治
  title: 保持身心健康
  conceptType: 概念型
  aliases:
    - 身心健康
  category: 观点
  explanation: 身体好、心情好，才是真正的健康。心里难过或身体不舒服时，要说出来，可以告诉老师和家人。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:信息节食
  type: Concept
  subject: 道德与法治
  title: 信息节食
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为信息节食就是限制上网时间，而不是选择信息内容。
    - 能指出并纠正这一错误：刷搞笑视频停不下来，觉得放松一下不算浪费精力。
  aliases:
    - 选择网络信息
  category: 道德与法治
  explanation: 指注意浏览、寻找对学习和生活有意义的信息，不在无关信息面前停留，不在无聊信息上浪费精力。
  misconceptions:
    - 认为信息节食就是限制上网时间，而不是选择信息内容。
    - 刷搞笑视频停不下来，觉得放松一下不算浪费精力。
    - 认为只浏览学习信息才叫信息节食，娱乐信息一律不碰。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:信息茧房
  type: Concept
  subject: 道德与法治
  title: 信息茧房
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看明星八卦，觉得其他新闻与自己无关，不感到有问题。
    - 能指出并纠正这一错误：认为信息茧房是算法推荐造成的，自己主动选择不算。
  aliases:
    - 信息孤岛
  category: 道德与法治
  explanation: 指只关注自己感兴趣的信息，从而丧失接触不同事物和观点的机会，把自己禁锢在狭小的信息空间中。
  misconceptions:
    - 只看明星八卦，觉得其他新闻与自己无关，不感到有问题。
    - 认为信息茧房是算法推荐造成的，自己主动选择不算。
    - 觉得只关注感兴趣的信息能提高效率，是聪明做法。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:俭约自守、中和泰和
  type: Concept
  subject: 道德与法治
  title: 俭约自守、中和泰和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把俭约自守当成吝啬小气，拒绝一切人际交往中的必要花费
    - 能指出并纠正这一错误：误认为不为物役就是完全否定物质享受，以至于不追求美好生活
  aliases:
    - 俭约自守
    - 中和泰和
  category: 生活理念
  explanation: 倡导俭朴生活方式，不为物役，追求人与自身、他人、世界的和谐统一。
  misconceptions:
    - 把俭约自守当成吝啬小气，拒绝一切人际交往中的必要花费
    - 误认为不为物役就是完全否定物质享受，以至于不追求美好生活
    - 将中和泰和理解为人际关系的和稀泥，不敢坚持正确立场
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:俭约自守、中和泰和的生活理念
  type: Concept
  subject: 道德与法治
  title: 俭约自守、中和泰和的生活理念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为俭约自守就是过苦行僧式的生活，把节约等同于压制欲望
    - 能指出并纠正这一错误：把'中和泰和'的生活理念误解为安于现状、不求上进，否定奋斗意义
  aliases:
    - 俭约自守
    - 中和泰和
  category: 道德与法治
  explanation: 中华民族倡导俭朴、简约的生活方式，强调不为物役，追求人与自身、人与人、人与世界的和谐统一。
  misconceptions:
    - 认为俭约自守就是过苦行僧式的生活，把节约等同于压制欲望
    - 把'中和泰和'的生活理念误解为安于现状、不求上进，否定奋斗意义
    - 将'不为物役'错误理解为不消费、不追求生活品质，彻底否定合理消费
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:值日生的职责
  type: Concept
  subject: 道德与法治
  title: 值日生的职责
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 值日生要提前到教室开窗通风、扫地擦黑板，给大家做榜样。值日时要有礼貌、认真负责，不能指手画脚。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:倾听的方法
  type: Concept
  subject: 道德与法治
  title: 倾听的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 倾听要用心听、抓住关键内容，用点头等方式回应；要耐心听别人讲完，遇到矛盾时更要耐心听解释。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:倾听的重要性
  type: Concept
  subject: 道德与法治
  title: 倾听的重要性
  conceptType: 概念型
  aliases:
    - 倾听很重要
  category: 观点
  explanation: 用耳朵去听、用心去听就是倾听。倾听能体会他人的心情、知道他人的想法，还能给别人带来鼓励和自信。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:做个小小科学家
  type: Concept
  subject: 道德与法治
  title: 做个小小科学家
  conceptType: 概念型
  aliases:
    - 从小爱科学
  category: 方法
  explanation: 从小爱科学，可以通过读科普书、细心观察、上好科学课等方法打好基础。学会用科学知识解决生活中的问题，人人都能做个小小科学家。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:做个开心果
  type: Concept
  subject: 道德与法治
  title: 做个开心果
  conceptType: 概念型
  aliases:
    - 开心果
  category: 观点
  explanation: '"开心果"是指能给身边的人带来快乐的人。真诚地赞美别人、热心帮助别人，别人快乐，自己也快乐。'
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:做个快乐的小学生
  type: Concept
  subject: 道德与法治
  title: 做个快乐的小学生
  conceptType: 概念型
  aliases:
    - 上学啦真高兴
  category: 观点
  explanation: 上小学是件高兴的事，学校是学本领、长见识的地方。当上小学生后要快乐学习、健康成长。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:做勤劳的人
  type: Concept
  subject: 道德与法治
  title: 做勤劳的人
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 做勤劳的人要不怕辛苦，主动去做该做的事，坚持自己的事情自己做，比如打扫班级卫生、主动浇花。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:做家务的好处
  type: Concept
  subject: 道德与法治
  title: 做家务的好处
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 做家务能让家人休息，还能让我们动脑筋、长本领，学会很多小技能。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:做情绪情感的主人
  type: Concept
  subject: 道德与法治
  title: 做情绪情感的主人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得“做情绪情感的主人”就是完全压抑情绪，不许自己有任何负面情绪
    - 能指出并纠正这一错误：只在生气时控制情绪，高兴时放纵大笑大喊，认为正面情绪不需要管理
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 觉得“做情绪情感的主人”就是完全压抑情绪，不许自己有任何负面情绪
    - 只在生气时控制情绪，高兴时放纵大笑大喊，认为正面情绪不需要管理
    - 认为情绪情感只能靠别人安慰来平复，自己无法主动调节
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:做新时代的好少年
  type: Concept
  subject: 道德与法治
  title: 做新时代的好少年
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 新时代少年要从小学习做人、立志向、爱创造，从自己做起、从小事做起，努力做德智体美劳全面发展的建设者和接班人。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:做更好的自己
  type: Concept
  subject: 道德与法治
  title: 做更好的自己
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为做更好的自己就是改掉所有缺点，变成完美的人。
    - 能指出并纠正这一错误：不顾自身特点，盲目模仿他人，如‘看到学霸熬夜我也熬夜’。
  aliases: []
  category: 自我发展
  explanation: 尊重个体差异，根据自身特点和社会需要发展自己，做更好的自己。
  misconceptions:
    - 认为做更好的自己就是改掉所有缺点，变成完美的人。
    - 不顾自身特点，盲目模仿他人，如‘看到学霸熬夜我也熬夜’。
    - 认为只要自己满意就行，完全不顾社会需要。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:做自强不息的人
  type: Concept
  subject: 道德与法治
  title: 做自强不息的人
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 做自强不息的人，要磨炼意志多练习，自信自立不依赖别人，不断超越自己，遇到困难迎难而上。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:儒家伦理道德思想
  type: Concept
  subject: 道德与法治
  title: 儒家伦理道德思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将儒家伦理与'三纲五常'完全画等号，全盘否定其积极意义
    - 能指出并纠正这一错误：对'君君臣臣'断章取义，错误理解为臣子对君主的绝对服从，忽视相互关系
  aliases:
    - 儒家思想
  category: 思想文化
  explanation: 以《论语》为代表的儒家经典体现了伦理道德思想，对后世影响深远。
  misconceptions:
    - 将儒家伦理与'三纲五常'完全画等号，全盘否定其积极意义
    - 对'君君臣臣'断章取义，错误理解为臣子对君主的绝对服从，忽视相互关系
    - 把'父母在，不远游'死板理解为不能出远门，忽略后句'游必有方'
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:儿童权利公约
  type: Concept
  subject: 道德与法治
  title: 儿童权利公约
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 《儿童权利公约》是第一部专门保障儿童权利的国际性公约，旨在为世界各国和地区的儿童创建良好的成长环境。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:儿童节的意义
  type: Concept
  subject: 道德与法治
  title: 儿童节的意义
  conceptType: 概念型
  aliases:
    - 六一国际儿童节
  category: 文化常识
  explanation: 六一国际儿童节是专为少年儿童设置的国际性节日，设立儿童节是为了保障儿童的权利。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:光盘行动
  type: Concept
  subject: 道德与法治
  title: 光盘行动
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 2013年全国掀起"光盘行动"，倡导人们不浪费粮食，从我做起、从小事做起，吃光盘子里的饭菜，吃不完的打包带走。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:克制购物欲望的方法
  type: Concept
  subject: 道德与法治
  title: 克制购物欲望的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 特别想要又不该买的东西，可以转移注意力，或找可以替代的东西，也可以过几天冷静下来再决定是否真的需要。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:克服马虎的方法
  type: Concept
  subject: 道德与法治
  title: 克服马虎的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 做事仔细不马虎，可以贴小提示、列小清单，还可以请同学互相提醒。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:党对人民军队的绝对领导
  type: Concept
  subject: 道德与法治
  title: 党对人民军队的绝对领导
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为党对军队的绝对领导在南昌起义时就已完全确立，忽略后续三湾改编和古田会议。
    - 能指出并纠正这一错误：将三湾改编和古田会议的历史贡献颠倒，认为奠基于古田会议、定型于三湾改编。
  aliases:
    - 党指挥枪
  category: 道德与法治
  explanation: 党对人民军队的绝对领导是人民军队的建军之本、强军之魂，发端于南昌起义，奠基于三湾改编，定型于古田会议。
  misconceptions:
    - 误认为党对军队的绝对领导在南昌起义时就已完全确立，忽略后续三湾改编和古田会议。
    - 将三湾改编和古田会议的历史贡献颠倒，认为奠基于古田会议、定型于三湾改编。
    - 认为“党对人民军队的绝对领导”等同于“国家对军队的领导”，混淆政党与国家的职能。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:党的基本路线
  type: Concept
  subject: 道德与法治
  title: 党的基本路线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆“四项基本原则”与“改革开放”的地位，前者是立国之本，后者是强国之路。
    - 能指出并纠正这一错误：以为以经济建设为中心就是只抓经济，忽略其他文明建设。
  aliases:
    - 社会主义初级阶段基本路线
  category: 政策
  explanation: 领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。
  misconceptions:
    - 混淆“四项基本原则”与“改革开放”的地位，前者是立国之本，后者是强国之路。
    - 以为以经济建设为中心就是只抓经济，忽略其他文明建设。
    - 认为基本路线会随着发展阶段不同而经常改变，实际是长期坚持。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:入队的准备
  type: Concept
  subject: 道德与法治
  title: 入队的准备
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 入队前要学系红领巾、学唱队歌、学敬队礼，作好加入少先队的准备。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:全人类共同价值
  type: Concept
  subject: 道德与法治
  title: 全人类共同价值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将全人类共同价值等同于西方“普世价值”，认为自由民主只属于西方。
    - 能指出并纠正这一错误：认为这些价值只是口号，各国无法共同追求，如“各国价值观完全不同”。
  aliases:
    - 共同价值
  category: 价值理念
  explanation: 指和平、发展、公平、正义、民主、自由，是各国人民共同追求的价值目标。
  misconceptions:
    - 将全人类共同价值等同于西方“普世价值”，认为自由民主只属于西方。
    - 认为这些价值只是口号，各国无法共同追求，如“各国价值观完全不同”。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:全国人民代表大会
  type: Concept
  subject: 道德与法治
  title: 全国人民代表大会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全国人大行使所有国家权力，实际产生其他机关并监督
    - 能指出并纠正这一错误：混淆全国人大与全国人大常委会的职权，如认为常委会有修改宪法的权力（只有全国人大）
  aliases:
    - 全国人大
  category: 国家机构
  explanation: 最高国家权力机关，产生国家主席、中央军委主席等领导人，行使立法权、决定权、任免权、监督权。
  misconceptions:
    - 认为全国人大行使所有国家权力，实际产生其他机关并监督
    - 混淆全国人大与全国人大常委会的职权，如认为常委会有修改宪法的权力（只有全国人大）
    - 把全国人大当成最高行政机关或审判机关
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:全国人民代表大会常务委员会
  type: Concept
  subject: 道德与法治
  title: 全国人民代表大会常务委员会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为全国人大常委会是最高国家权力机关，忘了全国人大才是。
    - 能指出并纠正这一错误：认为全国人大常委会可以代行全国人大的全部职权，如修改宪法。
  aliases:
    - 全国人大常委会
  category: 国家机构
  explanation: 全国人民代表大会常务委员会是全国人民代表大会的常设机关，对全国人民代表大会负责并报告工作。
  misconceptions:
    - 误认为全国人大常委会是最高国家权力机关，忘了全国人大才是。
    - 认为全国人大常委会可以代行全国人大的全部职权，如修改宪法。
    - 把全国人大常委会说成行政机关，认为它负责执行法律。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:全民国家安全教育日
  type: Concept
  subject: 道德与法治
  title: 全民国家安全教育日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把全民国家安全教育日记成了4月14日，实际是每年4月15日。
    - 能指出并纠正这一错误：认为这个日子只是国家机关的宣传活动，学生不需要参与。
  aliases:
    - 国家安全教育日
  category: 法律常识
  explanation: 根据《中华人民共和国国家安全法》第十四条规定，每年4月15日为全民国家安全教育日，旨在增强国家安全意识。
  misconceptions:
    - 把全民国家安全教育日记成了4月14日，实际是每年4月15日。
    - 认为这个日子只是国家机关的宣传活动，学生不需要参与。
    - 误以为该教育日由联合国设立，忘了它是由我国《国家安全法》规定的。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S6.md
- id: concept:道德与法治:全民国防教育
  type: Concept
  subject: 道德与法治
  title: 全民国防教育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国防教育只是军队的事，公民接受国防教育可自愿参加
    - 能指出并纠正这一错误：误以为只有服兵役才算履行国防义务，忽略参加民兵组织和接受国防教育也是义务
  aliases:
    - 国防教育
  category: 国防教育
  explanation: 我们的国防是全民国防，公民应依法服兵役和参加民兵组织，主动接受国防教育，增强忧患意识和责任担当。
  misconceptions:
    - 认为国防教育只是军队的事，公民接受国防教育可自愿参加
    - 误以为只有服兵役才算履行国防义务，忽略参加民兵组织和接受国防教育也是义务
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:全民守法
  type: Concept
  subject: 道德与法治
  title: 全民守法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为全民守法只约束公民，不约束国家机关和社会组织。
    - 能指出并纠正这一错误：认为只要不犯罪就是守法，忽略依法行使权利和履行义务。
  aliases: []
  category: 法治
  explanation: 全民守法要求任何公民、社会组织和国家机关都以宪法和法律为行为准则，依法行使权利或权力、履行义务或职责，弘扬社会主义法治精神。
  misconceptions:
    - 误认为全民守法只约束公民，不约束国家机关和社会组织。
    - 认为只要不犯罪就是守法，忽略依法行使权利和履行义务。
    - 把全民守法理解成老百姓守法，与依法治国、法治政府建设无关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:全球发展倡议
  type: Concept
  subject: 道德与法治
  title: 全球发展倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把全球发展倡议误认为联合国发起的，忽略是中国领导人的提议。
    - 能指出并纠正这一错误：将全球发展倡议与全球安全倡议混为一谈，认为都是讲和平。
  aliases: []
  category: 中国倡议
  explanation: 2021年习近平提出的旨在加快落实联合国2030年可持续发展议程的倡议。
  misconceptions:
    - 把全球发展倡议误认为联合国发起的，忽略是中国领导人的提议。
    - 将全球发展倡议与全球安全倡议混为一谈，认为都是讲和平。
    - 认为该倡议只针对发展中国家，与发达国家无关联。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:全球安全倡议
  type: Concept
  subject: 道德与法治
  title: 全球安全倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球安全倡议只涉及军事安全，忽略网络安全、公共卫生等非传统安全。
    - 能指出并纠正这一错误：把全球安全倡议等同于联合反恐行动，缩小了内涵。
  aliases: []
  category: 中国倡议
  explanation: 2022年习近平提出的旨在消弭国际冲突根源、完善全球安全治理的倡议。
  misconceptions:
    - 认为全球安全倡议只涉及军事安全，忽略网络安全、公共卫生等非传统安全。
    - 把全球安全倡议等同于联合反恐行动，缩小了内涵。
    - 将全球安全倡议与全球文明倡议混淆，以为安全就是文明交流。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:全球性问题
  type: Concept
  subject: 道德与法治
  title: 全球性问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球性问题只指环境问题，如气候变暖、污染，不包括贫困和恐怖主义。
    - 能指出并纠正这一错误：把全球性问题看作各国自己的事，认为与个人日常行为无关。
  aliases: []
  category: 政治
  explanation: 包括不稳定性、经济增长动能不足、贫富分化、地区热点、恐怖主义、网络安全、气候变化等，关系人类生存和发展。
  misconceptions:
    - 认为全球性问题只指环境问题，如气候变暖、污染，不包括贫困和恐怖主义。
    - 把全球性问题看作各国自己的事，认为与个人日常行为无关。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:全球文明倡议
  type: Concept
  subject: 道德与法治
  title: 全球文明倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球文明倡议就是推广儒家文化，否认文明多样性。
    - 能指出并纠正这一错误：将文明倡议简单理解为办文化节，忽视其促进相互理解的深层目标。
  aliases: []
  category: 中国倡议
  explanation: 2023年习近平提出的旨在促进世界文明交流互鉴的倡议。
  misconceptions:
    - 认为全球文明倡议就是推广儒家文化，否认文明多样性。
    - 将文明倡议简单理解为办文化节，忽视其促进相互理解的深层目标。
    - 与全球发展倡议混淆，认为文明倡议也是经济合作项目。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:全球治理倡议
  type: Concept
  subject: 道德与法治
  title: 全球治理倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球治理就是西方主导的旧秩序，中国只是被动参与者。
    - 能指出并纠正这一错误：把全球治理倡议等同于“人类命运共同体”口号，忽略具体治理方案。
  aliases: []
  category: 中国倡议
  explanation: 2025年习近平提出的旨在加强和完善全球治理的倡议。
  misconceptions:
    - 认为全球治理就是西方主导的旧秩序，中国只是被动参与者。
    - 把全球治理倡议等同于“人类命运共同体”口号，忽略具体治理方案。
    - 认为全球治理只涉及国际组织，与国内治理无关。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:全过程人民民主
  type: Concept
  subject: 道德与法治
  title: 全过程人民民主
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民只有在投票时才是民主，其他时候没有民主
    - 能指出并纠正这一错误：把全过程人民民主理解为所有决策都由全体人民直接表决
  aliases:
    - 全链条民主
  category: 政治概念
  explanation: 全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。
  misconceptions:
    - 认为人民只有在投票时才是民主，其他时候没有民主
    - 把全过程人民民主理解为所有决策都由全体人民直接表决
    - 认为全过程人民民主就是多数人的民主，不需要保护少数
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:全面依法治国总目标
  type: Concept
  subject: 道德与法治
  title: 全面依法治国总目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把全面依法治国总目标等同于建设法治政府或法治社会
    - 能指出并纠正这一错误：认为总目标只是建设中国特色社会主义法律体系，忽略法治体系
  aliases: []
  category: 法律概念
  explanation: 建设中国特色社会主义法治体系，建设社会主义法治国家。
  misconceptions:
    - 把全面依法治国总目标等同于建设法治政府或法治社会
    - 认为总目标只是建设中国特色社会主义法律体系，忽略法治体系
    - 认为总目标是让所有公民都懂法，不包括建设法治国家
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:全面依法治国的基本要求
  type: Concept
  subject: 道德与法治
  title: 全面依法治国的基本要求
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全面依法治国是政府的事，与公民个人关系不大，公民只需守法即可。
    - 能指出并纠正这一错误：把'严格执法'理解为法院应严格执法，混淆了法院与行政机关的执法职责。
  aliases: []
  category: 法治理论
  explanation: 全面依法治国要求科学立法、严格执法、公正司法、全民守法，坚持依法治国、依法执政、依法行政共同推进。
  misconceptions:
    - 认为全面依法治国是政府的事，与公民个人关系不大，公民只需守法即可。
    - 把'严格执法'理解为法院应严格执法，混淆了法院与行政机关的执法职责。
    - 认为'科学立法'就是多制定法律，不管法律是否符合实际和人民意愿。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:全面依法治国的指导思想
  type: Concept
  subject: 道德与法治
  title: 全面依法治国的指导思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全面依法治国的根本遵循是宪法和法律，而忽视了习近平法治思想的指导地位。
    - 能指出并纠正这一错误：以为习近平法治思想只涉及反腐败和司法改革，不涉及治国理政全局。
  aliases:
    - 习近平法治思想
  category: 法治理论
  explanation: 习近平法治思想是全面依法治国的根本遵循和行动指南，深刻回答了新时代为什么实行全面依法治国、怎样实行全面依法治国等重大问题。
  misconceptions:
    - 认为全面依法治国的根本遵循是宪法和法律，而忽视了习近平法治思想的指导地位。
    - 以为习近平法治思想只涉及反腐败和司法改革，不涉及治国理政全局。
    - 将习近平法治思想等同于西方'法治'思想，看不到其中国特色和时代内涵。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:全面建成社会主义现代化强国
  type: Concept
  subject: 道德与法治
  title: 全面建成社会主义现代化强国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为2035年就全面建成社会主义现代化强国，实际是先基本实现现代化。
    - 能指出并纠正这一错误：漏掉‘美丽’这一目标，只记富强民主文明和谐。
  aliases: []
  category: 目标
  explanation: 从2020年到2035年基本实现社会主义现代化，从2035年到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。
  misconceptions:
    - 误认为2035年就全面建成社会主义现代化强国，实际是先基本实现现代化。
    - 漏掉‘美丽’这一目标，只记富强民主文明和谐。
    - 把‘基本实现现代化’理解为‘全面建成现代化强国’的完成时。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:全面提升个人素养
  type: Concept
  subject: 道德与法治
  title: 全面提升个人素养
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只刷题提分，认为成绩好就是素养高，忽视社会实践和创新能力。
    - 能指出并纠正这一错误：认为人文素养就是多读书，科学精神与人文素养无关。
  aliases:
    - 个人素养提升
  category: 道德与法治
  explanation: 适应世界发展趋势，需要不断丰富知识储备，增强人文底蕴，树立科学精神，增强社会责任感，培养实践创新能力。
  misconceptions:
    - 只刷题提分，认为成绩好就是素养高，忽视社会实践和创新能力。
    - 认为人文素养就是多读书，科学精神与人文素养无关。
    - 觉得个人素养是个人的事，与担当时代使命没有关系。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:全面深化改革
  type: Concept
  subject: 道德与法治
  title: 全面深化改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为全面深化改革只包括经济体制改革，忽略政治、文化等。
    - 能指出并纠正这一错误：将总目标错写成“建立社会主义市场经济体制”，实际是完善和发展中国特色社会主义制度、推进国家治理现…
  aliases:
    - 深化改革
  category: 概念
  explanation: 我国推行的包括经济、政治、文化、社会、生态等领域的全面而深刻的社会变革，总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。
  misconceptions:
    - 误以为全面深化改革只包括经济体制改革，忽略政治、文化等。
    - 将总目标错写成“建立社会主义市场经济体制”，实际是完善和发展中国特色社会主义制度、推进国家治理现代化。
    - 以为全面深化改革是对根本制度的改变，实际是制度的自我完善。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:公共场所
  type: Concept
  subject: 道德与法治
  title: 公共场所
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 家庭以外大家共同活动的场所就是公共场所，比如学校、商场、医院、公园。公共场所承载着我们的生活记忆。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:公共标志
  type: Concept
  subject: 道德与法治
  title: 公共标志
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 为引导、提示大家自觉遵守和维护公共秩序，人们设置了禁止吸烟、安全通道、请勿喧哗等公共标志。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:公共生活
  type: Concept
  subject: 道德与法治
  title: 公共生活
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 人们在公共空间中的生活就是公共生活，比如看电影、逛集市、去医院就诊。网络世界中的活动也可以是公共生活。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:公共秩序
  type: Concept
  subject: 道德与法治
  title: 公共秩序
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 良好的公共秩序是人们安居乐业的保障，是社会稳定和进步的基础。没有秩序，公共生活就会陷入混乱。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:公共空间
  type: Concept
  subject: 道德与法治
  title: 公共空间
  conceptType: 概念型
  aliases:
    - 公共场所
  category: 概念
  explanation: 电影院、博物馆、集市、医院等大家共同使用的场所是公共空间。在公共空间里行为是公开的，更要注意言谈举止。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:公共设施
  type: Concept
  subject: 道德与法治
  title: 公共设施
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 在公共场所供大家使用的设施叫公共设施，比如休息椅、垃圾箱、路灯，它们是为了方便大家的生活而设置的。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:公平
  type: Concept
  subject: 道德与法治
  title: 公平
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把公平等同于平均主义，认为成绩不同却给相同奖励才算公平。
    - 能指出并纠正这一错误：认为公平只是主观感受，没有客观标准，比如觉得自己没得到就说社会不公平。
  aliases: []
  category: 道德与法治
  explanation: 公平通常指人们基于一定标准或原则，处理事情合情合理、不偏不倚。在社会生活中，公平意味着每个人都拥有同等的发展机会和条件，都要按照规则办事。
  misconceptions:
    - 把公平等同于平均主义，认为成绩不同却给相同奖励才算公平。
    - 认为公平只是主观感受，没有客观标准，比如觉得自己没得到就说社会不公平。
    - 认为公平就是结果完全相同，忽略机会公平和规则公平，如要求所有同学获得同样荣誉。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:公平的价值
  type: Concept
  subject: 道德与法治
  title: 公平的价值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公平只对个人重要，与社会稳定发展无关，比如觉得竞争环境不公平也不影响全局。
    - 能指出并纠正这一错误：认为公平会阻碍效率，为了发展可以放弃公平，如认为多劳多得就是不公平。
  aliases: []
  category: 道德与法治
  explanation: 公平是个人生存和发展的重要保障，也是社会稳定和进步的重要基础。公平能保证个人合法权益，激发工作热情；有利于协调社会利益关系，减少冲突，营造良好竞争环境，推动社会持续健康发展。
  misconceptions:
    - 认为公平只对个人重要，与社会稳定发展无关，比如觉得竞争环境不公平也不影响全局。
    - 认为公平会阻碍效率，为了发展可以放弃公平，如认为多劳多得就是不公平。
    - 将公平的价值简单归结为平均分配资源，认为不公平就是有人多拿一份。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:公序良俗原则
  type: Concept
  subject: 道德与法治
  title: 公序良俗原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要不违反法律明文规定，违背公序良俗的民事行为也是有效的。
    - 能指出并纠正这一错误：把'公序良俗'简单等同于'社会公德'，认为违反道德即违反公序良俗。
  aliases:
    - 公序良俗
  category: 民法原则
  explanation: 民事主体从事民事活动不得违反法律，不得违背公序良俗，违反公序良俗的民事行为无效。
  misconceptions:
    - 认为只要不违反法律明文规定，违背公序良俗的民事行为也是有效的。
    - 把'公序良俗'简单等同于'社会公德'，认为违反道德即违反公序良俗。
    - 误以为公序良俗原则只适用于合同纠纷，其他民事活动不用遵守。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:公开审判
  type: Concept
  subject: 道德与法治
  title: 公开审判
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民法院所有案件都必须公开审理，不知涉及国家秘密、个人隐私等例外。
    - 能指出并纠正这一错误：以为公开审判就是庭审直播，法官允许任何人随时拍摄录像。
  aliases:
    - 审判公开
  category: 司法制度
  explanation: 人民法院审理案件除法律规定的特殊情况外，一律公开进行，允许公民旁听，增加司法透明度。
  misconceptions:
    - 认为人民法院所有案件都必须公开审理，不知涉及国家秘密、个人隐私等例外。
    - 以为公开审判就是庭审直播，法官允许任何人随时拍摄录像。
    - 认为未成年人犯罪案件也应一律公开审理，忽视了特殊保护规定。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S2.md
- id: concept:道德与法治:公有制为主体、多种所有制经济共同发展
  type: Concept
  subject: 道德与法治
  title: 公有制为主体、多种所有制经济共同发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公有制为主体就是国有经济占多数，应看公有资产优势
    - 能指出并纠正这一错误：把非公有制经济等同于社会主义经济性质，实际是市场经济成分
  aliases:
    - 所有制结构
  category: 经济制度
  explanation: 我国社会主义基本经济制度之一，公有制经济包括国有经济、集体经济等，非公有制经济包括个体经济、私营经济等。
  misconceptions:
    - 认为公有制为主体就是国有经济占多数，应看公有资产优势
    - 把非公有制经济等同于社会主义经济性质，实际是市场经济成分
    - 误以为非公有制经济是公有制经济的组成部分
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:公有制经济
  type: Concept
  subject: 道德与法治
  title: 公有制经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把混合所有制中的国有成分、集体成分排除在公有制外
    - 能指出并纠正这一错误：认为公有制经济仅指国有经济，忽略集体经济等
  aliases:
    - 公有制
  category: 经济制度
  explanation: 指生产资料归全体人民或部分劳动者共同所有的经济形式，包括国有经济、集体经济等，是社会主义市场经济的重要组成部分。
  misconceptions:
    - 把混合所有制中的国有成分、集体成分排除在公有制外
    - 认为公有制经济仅指国有经济，忽略集体经济等
    - 误以为公有制经济是唯一合法经济，否定非公有制地位
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:公民
  type: Concept
  subject: 道德与法治
  title: 公民
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 公民是指具有一国国籍的人。凡具有中华人民共和国国籍的人都是中华人民共和国公民，公民身份不分年龄大小。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:公民参与
  type: Concept
  subject: 道德与法治
  title: 公民参与
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公民参与是公民的义务而非权利
    - 能指出并纠正这一错误：把公民参与等同于可以随意干涉政府工作，不遵守法律程序
  aliases:
    - 政治参与
  category: 公民权利
  explanation: 公民参与是社会主义民主的要求，也是公民的一项权利，依照法律法规参与管理国家和社会事务。
  misconceptions:
    - 认为公民参与是公民的义务而非权利
    - 把公民参与等同于可以随意干涉政府工作，不遵守法律程序
    - 认为公民参与就是参与选举，不包括参与民主管理
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:公民基本义务
  type: Concept
  subject: 道德与法治
  title: 公民基本义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公民义务可以自愿放弃，比如不履行服兵役义务。
    - 能指出并纠正这一错误：将公民义务与道德义务等同，认为不履行义务只受道德谴责。
  aliases: []
  category: 法律概念
  explanation: 宪法规定的公民必须履行的责任，表明公民在国家生活中的主体地位。
  misconceptions:
    - 认为公民义务可以自愿放弃，比如不履行服兵役义务。
    - 将公民义务与道德义务等同，认为不履行义务只受道德谴责。
    - 认为只有法律规定义务，宪法规定的义务不是法律义务。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:公民基本权利
  type: Concept
  subject: 道德与法治
  title: 公民基本权利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公民权利是无限的，可以随意行使而不受限制。
    - 能指出并纠正这一错误：将基本权利等同于权力，如认为未成年人也有选举权。
  aliases: []
  category: 法律概念
  explanation: 宪法所确认的公民权利，包括受教育权、被选举权、劳动权、物质帮助权等。
  misconceptions:
    - 认为公民权利是无限的，可以随意行使而不受限制。
    - 将基本权利等同于权力，如认为未成年人也有选举权。
    - 认为受教育权只是权利，不是义务，可以放弃上学。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:公民的基本权利与义务
  type: Concept
  subject: 道德与法治
  title: 公民的基本权利与义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为可以只享受权利不履行义务，权利和义务可以分离
    - 能指出并纠正这一错误：认为劳动和受教育只是权利，不是义务
  aliases:
    - 公民基本权利和义务
  category: 法律概念
  explanation: 公民既是权利的享有者，又是义务的承担者，劳动和受教育既是权利也是义务。
  misconceptions:
    - 认为可以只享受权利不履行义务，权利和义务可以分离
    - 认为劳动和受教育只是权利，不是义务
    - 认为公民的权利是绝对的，不受法律和他人权利限制
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:公证处
  type: Concept
  subject: 道德与法治
  title: 公证处
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公证处是国家行政机关，公证文书可直接申请强制执行。
    - 能指出并纠正这一错误：以为经过公证的合同就一定有效，忽略内容违法则无效。
  aliases: []
  category: 法律组织
  explanation: 公证员依据法律和事实，证明合同、遗嘱、亲属关系等的真实性和合法性。
  misconceptions:
    - 认为公证处是国家行政机关，公证文书可直接申请强制执行。
    - 以为经过公证的合同就一定有效，忽略内容违法则无效。
    - 把公证与见证混同，认为公证只证明签字属实，不证明内容。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:共产主义道德
  type: Concept
  subject: 道德与法治
  title: 共产主义道德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为共产主义道德与中华传统美德毫无关联，是彼此割裂的两回事
    - 能指出并纠正这一错误：把雷锋精神简单等同于做好事不留名，忽视其全心全意为人民服务的核心
  aliases: []
  category: 道德修养
  explanation: 以雷锋日记为代表，体现共产主义战士的崇高道德和为人民服务的精神。
  misconceptions:
    - 认为共产主义道德与中华传统美德毫无关联，是彼此割裂的两回事
    - 把雷锋精神简单等同于做好事不留名，忽视其全心全意为人民服务的核心
    - 认为共产主义道德标准过高，只有党员需要践行，普通群众不必遵守
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:共享发展机遇
  type: Concept
  subject: 道德与法治
  title: 共享发展机遇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为共享发展机遇就是单方面对外援助，不考虑本国根本利益。
    - 能指出并纠正这一错误：以偏概全，认为共享只与发展中国家之间进行，排除发达国家。
  aliases:
    - 发展机遇共享
  category: 道德与法治
  explanation: 中国坚持合作共赢理念，通过共建“一带一路”等举措，让发展成果惠及各国，推动构建人类命运共同体。
  misconceptions:
    - 认为共享发展机遇就是单方面对外援助，不考虑本国根本利益。
    - 以偏概全，认为共享只与发展中国家之间进行，排除发达国家。
    - 把共建“一带一路”说成中国一家独赚，否认合作各方的共赢。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:共享生活方式
  type: Concept
  subject: 道德与法治
  title: 共享生活方式
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 现代社会积极倡导共享，出现了共享单车、农家书屋等共享方式。人人爱护、共同维护，共享才能更好地服务于生活。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:共同但有区别的责任原则
  type: Concept
  subject: 道德与法治
  title: 共同但有区别的责任原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为发达国家和发展中国家应承担完全相同的减排责任，忽视各自历史排放和能力的差异。
    - 能指出并纠正这一错误：把'共同责任'理解为平均分配，要求人口少的国家承担同等义务。
  aliases:
    - 共同但有区别的责任
  category: 国际环境治理原则
  explanation: 各国在承担全球环境治理责任时，应共同但有区别地承担责任。
  misconceptions:
    - 认为发达国家和发展中国家应承担完全相同的减排责任，忽视各自历史排放和能力的差异。
    - 把'共同责任'理解为平均分配，要求人口少的国家承担同等义务。
    - 只强调'有区别'，认为发展中国家可以不承担任何责任，违背共同责任。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:共同富裕
  type: Concept
  subject: 道德与法治
  title: 共同富裕
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把共同富裕理解为同时、同等、同步富裕
    - 能指出并纠正这一错误：认为共同富裕就是平均主义，吃大锅饭
  aliases: []
  category: 发展目标
  explanation: 全体人民通过共建共享实现富裕，是社会主义的本质要求，分配制度是促进共同富裕的基础性制度。
  misconceptions:
    - 把共同富裕理解为同时、同等、同步富裕
    - 认为共同富裕就是平均主义，吃大锅饭
    - 误以为共同富裕是少数人先富，多数人后富（实际是共建共享）
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:共商共建共享原则
  type: Concept
  subject: 道德与法治
  title: 共商共建共享原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为'共商'就是所有国家必须全部同意才能行动，忽视多数协商一致。
    - 能指出并纠正这一错误：把'共享'等同于平均分配，认为各国获得相同利益才是公平。
  aliases:
    - 共商共建共享
  category: 全球治理原则
  explanation: 全球治理中各国共同协商、共同建设、共享成果的原则。
  misconceptions:
    - 以为'共商'就是所有国家必须全部同意才能行动，忽视多数协商一致。
    - 把'共享'等同于平均分配，认为各国获得相同利益才是公平。
    - 认为该原则只适用于经济领域，忽视其在全球治理其他方面也适用。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:共建“一带一路”倡议
  type: Concept
  subject: 道德与法治
  title: 共建“一带一路”倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为'一带一路'是中国单方面对外援助，忽视其互利共赢的共同发展特性。
    - 能指出并纠正这一错误：把'一带一路'说成是中国称霸世界的战略工具，忽视其开放包容性。
  aliases:
    - 一带一路
  category: 道德与法治
  explanation: 中国提出的国际合作倡议，包括丝绸之路经济带和21世纪海上丝绸之路，旨在促进沿线国家共同发展。
  misconceptions:
    - 误认为'一带一路'是中国单方面对外援助，忽视其互利共赢的共同发展特性。
    - 把'一带一路'说成是中国称霸世界的战略工具，忽视其开放包容性。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:关心人类命运的方法与技能
  type: Concept
  subject: 道德与法治
  title: 关心人类命运的方法与技能
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有出国或参加国际组织才能关心人类命运，国内学习工作不算。
    - 能指出并纠正这一错误：把学好外语当作关心的唯一方法，忽略学习本国文化和国际礼仪等。
  aliases:
    - 关心人类命运的方法
  category: 实践方法
  explanation: 包括学习本国文化、参与国际交流、学好外语、了解外国礼仪、关注国际问题等具体方法。
  misconceptions:
    - 认为只有出国或参加国际组织才能关心人类命运，国内学习工作不算。
    - 把学好外语当作关心的唯一方法，忽略学习本国文化和国际礼仪等。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:关心体贴老师
  type: Concept
  subject: 道德与法治
  title: 关心体贴老师
  conceptType: 概念型
  aliases:
    - 关心老师的行动
  category: 观点
  explanation: 老师是我们尊敬、喜爱的人，我们要用自己的行动去关心体贴老师，比如写好作业、和同学友好相处。也要尊重学校里的每一位工作人员。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:关怀生命、尊重生命的价值
  type: Concept
  subject: 道德与法治
  title: 关怀生命、尊重生命的价值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为关怀生命只指关心人类，不包括善待动物和其他生灵。
    - 能指出并纠正这一错误：把尊重生命理解为只要不伤害别人就行，不要求主动帮助他人。
  aliases:
    - 生命关怀
  category: 道德观念
  explanation: 强调善待自己并关注他人命运，理解他人痛苦与快乐，增进包容与合作。
  misconceptions:
    - 认为关怀生命只指关心人类，不包括善待动物和其他生灵。
    - 把尊重生命理解为只要不伤害别人就行，不要求主动帮助他人。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:关注身体状况
  type: Concept
  subject: 道德与法治
  title: 关注身体状况
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得身体没不舒服就不需要体检，忽视了定期体检能发现早期隐患
    - 能指出并纠正这一错误：感冒发烧硬扛着不吃药不看医生，认为小病能自愈
  aliases:
    - 身体状况
  category: 健康观
  explanation: 要关注并记录自身健康状况，定期体检，合理利用卫生保健服务维护健康，积极主动获取健康信息，如有不适及时科学就医。
  misconceptions:
    - 觉得身体没不舒服就不需要体检，忽视了定期体检能发现早期隐患
    - 感冒发烧硬扛着不吃药不看医生，认为小病能自愈
    - 只关注体重和外形，不关注血压血糖等内在健康指标
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:关爱他人的生命
  type: Concept
  subject: 道德与法治
  title: 关爱他人的生命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为关爱他人生命是‘多管闲事’，看到路人摔倒怕被讹诈而走开
    - 能指出并纠正这一错误：只对家人朋友关爱，对陌生人遭遇危险时麻木冷漠
  aliases:
    - 关爱生命
  category: 生命观
  explanation: 敬畏生命就要关爱他人的生命，'仁者爱人'，'推己及人'，既要珍惜自己的生命，又要关爱他人的生命，尊重、关怀和善待他人。
  misconceptions:
    - 认为关爱他人生命是‘多管闲事’，看到路人摔倒怕被讹诈而走开
    - 只对家人朋友关爱，对陌生人遭遇危险时麻木冷漠
    - 觉得关爱他人就要牺牲自己，把帮助别人和珍爱自己对立起来
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:关键核心技术
  type: Concept
  subject: 道德与法治
  title: 关键核心技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错以为用钱能买到任何技术，实际上关键核心技术只能靠自主创新。
    - 能指出并纠正这一错误：认为“卡脖子”问题光砸钱就能解决，忽略人才、基础研究等长期积累。
  aliases:
    - 关键核心技术是国之重器
  category: 科技概念
  explanation: 国之重器，是要不来、买不来、讨不来的，必须依靠自主创新。
  misconceptions:
    - 错以为用钱能买到任何技术，实际上关键核心技术只能靠自主创新。
    - 认为“卡脖子”问题光砸钱就能解决，忽略人才、基础研究等长期积累。
    - 以为强调自主创新就排斥国际合作，实际开放合作与自主创新并不矛盾。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:养成仔细做事的习惯
  type: Concept
  subject: 道德与法治
  title: 养成仔细做事的习惯
  conceptType: 程序型
  aliases: []
  category: 观点
  explanation: 仔细做事要慢慢养成习惯，做事情认真检查，就能少出错、少添麻烦。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:养成劳动习惯
  type: Concept
  subject: 道德与法治
  title: 养成劳动习惯
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 从身边的小事做起：自己的事情自己做，他人的事情帮着做，公益的事情积极做，慢慢养成热爱劳动的好习惯。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:养成整理的习惯
  type: Concept
  subject: 道德与法治
  title: 养成整理的习惯
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 要定时整理、物归原位，用完的东西送回原来的地方，慢慢养成整理的好习惯。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:兼收并蓄
  type: Concept
  subject: 道德与法治
  title: 兼收并蓄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为兼收并蓄就是全盘照搬外国文化，如盲目模仿西方节日而冷落传统。
    - 能指出并纠正这一错误：把'以我为主'理解为排斥一切外来文化，拒绝学习国外优秀文明成果。
  aliases: []
  category: 文化理念
  explanation: 学习和借鉴人类文明的一切优秀成果，坚持以我为主，兼收并蓄。
  misconceptions:
    - 认为兼收并蓄就是全盘照搬外国文化，如盲目模仿西方节日而冷落传统。
    - 把'以我为主'理解为排斥一切外来文化，拒绝学习国外优秀文明成果。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:农业是衣食之源
  type: Concept
  subject: 道德与法治
  title: 农业是衣食之源
  conceptType: 概念型
  aliases:
    - 衣食之源
  category: 观点
  explanation: 我们吃的、穿的、用的、住的、行的都离不开农业。农业为我们提供食物，也为工业生产提供原材料。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:农业生产的种类
  type: Concept
  subject: 道德与法治
  title: 农业生产的种类
  conceptType: 概念型
  aliases:
    - 农业的种类
  category: 概念
  explanation: 我国农业生产种类多样，主要有种植业、畜牧业、林业和渔业等，它们为我们提供粮食、肉蛋、木材和水产品等。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:农村包围城市的革命道路
  type: Concept
  subject: 道德与法治
  title: 农村包围城市的革命道路
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 井冈山革命根据地的建立，为中国革命探索出农村包围城市、武装夺取政权的正确道路。这条道路是前人没有走过的，符合中国国情。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:决定班级事务的原则
  type: Concept
  subject: 道德与法治
  title: 决定班级事务的原则
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 讨论和决定班级事务要坚持公平公正、公开透明、协商合作，让每个同学都有充分表达意见的机会，结果及时公开。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:减少身边的浪费
  type: Concept
  subject: 道德与法治
  title: 减少身边的浪费
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 除了饮食，随手不关灯、纸张只写几个字就扔、乱丢文具等也是浪费。可以通过调查研究了解浪费现象及其危害，提出减少浪费的建议。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:分享时的礼貌
  type: Concept
  subject: 道德与法治
  title: 分享时的礼貌
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 分享图书要爱惜，分享故事要生动，用别人的东西要小心，有小过错不计较，分享要大方有礼貌。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:分享的快乐
  type: Concept
  subject: 道德与法治
  title: 分享的快乐
  conceptType: 概念型
  aliases:
    - 分享的魔力
  category: 观点
  explanation: 把好书、好办法和快乐分享给大家，一个人的快乐就变成大家的快乐，方法也变得更多。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:分场合控制音量
  type: Concept
  subject: 道德与法治
  title: 分场合控制音量
  conceptType: 概念型
  aliases:
    - 我们小点儿声
    - 轻声说话
  category: 方法
  explanation: 不同的场合对声音大小要求不同：课间游戏要小声，不打扰别人；课堂发言要响亮，让别人听得清。在医院、图书馆等地方更要保持安静。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:分辨要求是否合理
  type: Concept
  subject: 道德与法治
  title: 分辨要求是否合理
  conceptType: 概念型
  aliases:
    - 合理的要求与不合理的要求
  category: 方法
  explanation: 提要求前要想想是否合理：买生活必需品、有利于健康成长的要求是合理的；价格过于昂贵、增加家庭负担、为了攀比的要求是不合理的。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:刑事诉讼
  type: Concept
  subject: 道德与法治
  title: 刑事诉讼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为刑事诉讼由受害人直接向法院起诉，忽略公诉为主。
    - 能指出并纠正这一错误：将犯罪嫌疑人直接称为罪犯，未经法院判决就认定有罪。
  aliases: []
  category: 法律程序
  explanation: 国家司法机关在当事人和其他诉讼参与人参加下，依法查明犯罪事实、惩罚犯罪分子、保障无罪的人不受刑事追究的活动。
  misconceptions:
    - 以为刑事诉讼由受害人直接向法院起诉，忽略公诉为主。
    - 将犯罪嫌疑人直接称为罪犯，未经法院判决就认定有罪。
    - 混淆刑事诉讼与民事诉讼，认为被告人都要请辩护律师。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:创客
  type: Concept
  subject: 道德与法治
  title: 创客
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为创客必须是科学家或工程师，普通学生不能成为创客
    - 能指出并纠正这一错误：把创客等同于网络极客，只重技术不重分享和动手实践
  aliases:
    - Maker
  category: 创新主体
  explanation: 具有创新理念、乐于分享、敢于将想法转变为现实的人。
  misconceptions:
    - 认为创客必须是科学家或工程师，普通学生不能成为创客
    - 把创客等同于网络极客，只重技术不重分享和动手实践
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:创意玩法
  type: Concept
  subject: 道德与法治
  title: 创意玩法
  conceptType: 概念型
  aliases:
    - 玩出新花样
  category: 方法
  explanation: 玩的时候可以开动脑筋，换个新玩法、变废为宝做新玩具，玩出新花样，享受乐趣还能长智慧。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:创新
  type: Concept
  subject: 道德与法治
  title: 创新
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为创新就是技术发明，把管理制度改进、新思想提出排除在外
    - 能指出并纠正这一错误：把创新理解为绝对的新，仿制、改进等都不算创新
  aliases:
    - 创新驱动
  category: 核心概念
  explanation: 创新是引领发展的第一动力，是民族进步的灵魂，包括知识创新、技术创新、制度创新等。
  misconceptions:
    - 认为创新就是技术发明，把管理制度改进、新思想提出排除在外
    - 把创新理解为绝对的新，仿制、改进等都不算创新
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:创新型国家
  type: Concept
  subject: 道德与法治
  title: 创新型国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到“进入创新型国家行列”就认为我国已经是世界科技创新强国
    - 能指出并纠正这一错误：忽略“还需提高能力、任重道远”，认为创新水平现已登顶
  aliases: []
  category: 概念
  explanation: 我国成功进入创新型国家行列，但还需进一步提高科技创新能力，建成世界科技创新强国任重道远。
  misconceptions:
    - 看到“进入创新型国家行列”就认为我国已经是世界科技创新强国
    - 忽略“还需提高能力、任重道远”，认为创新水平现已登顶
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:创新性
  type: Concept
  subject: 道德与法治
  title: 创新性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将中华文明的创新性错误理解为古代一切发明都领先世界，滋生盲目自大
    - 能指出并纠正这一错误：把创新性归因于外来文化刺激，忽视中华文明发展的内在动力
  aliases: []
  category: 文明特性
  explanation: 中华文明在历史上具有鲜明的独创性，如四大发明、农业技术等。
  misconceptions:
    - 将中华文明的创新性错误理解为古代一切发明都领先世界，滋生盲目自大
    - 把创新性归因于外来文化刺激，忽视中华文明发展的内在动力
    - 认为创新性只体现在四大发明等古代成就上，否认当代中国的自主创新
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:创新文化
  type: Concept
  subject: 道德与法治
  title: 创新文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把创新文化等同于创新成果的数量，认为成果多就有创新文化
    - 能指出并纠正这一错误：认为创新文化只靠科学家和企业家，普通人无法参与营造
  aliases: []
  category: 文化氛围
  explanation: 有利于创新的社会文化环境，包括弘扬科学精神、企业家精神等。
  misconceptions:
    - 把创新文化等同于创新成果的数量，认为成果多就有创新文化
    - 认为创新文化只靠科学家和企业家，普通人无法参与营造
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:创新是引领发展的第一动力
  type: Concept
  subject: 道德与法治
  title: 创新是引领发展的第一动力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把创新等同于科技创新，认为只有科技领域才有创新
    - 能指出并纠正这一错误：把“第一动力”理解为唯一动力，完全否定其他因素作用
  aliases:
    - 第一动力
  category: 政治概念
  explanation: 创新是推动人类社会向前发展的重要力量，是引领发展的第一动力。
  misconceptions:
    - 把创新等同于科技创新，认为只有科技领域才有创新
    - 把“第一动力”理解为唯一动力，完全否定其他因素作用
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:创新精神
  type: Concept
  subject: 道德与法治
  title: 创新精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把创新精神简单等同于胆子大、敢冒险，忽视好奇心和批判精神
    - 能指出并纠正这一错误：认为创新精神只属于科学家和发明家，普通人没有创新精神
  aliases: []
  category: 精神品质
  explanation: 表现为敢为人先、敢于冒险的勇气和自信，探索新知的好奇心和挑战权威的批判精神等。
  misconceptions:
    - 把创新精神简单等同于胆子大、敢冒险，忽视好奇心和批判精神
    - 认为创新精神只属于科学家和发明家，普通人没有创新精神
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:创新驱动发展战略
  type: Concept
  subject: 道德与法治
  title: 创新驱动发展战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为创新驱动发展战略只是国家和政府的事，与普通学生无关
    - 能指出并纠正这一错误：把“以科技创新为核心”理解为只发展科技，忽略全面创新
  aliases:
    - 创新驱动
  category: 战略
  explanation: 国家战略，以科技创新为核心，推进全面创新，是推动经济高质量发展的根本之策。
  misconceptions:
    - 认为创新驱动发展战略只是国家和政府的事，与普通学生无关
    - 把“以科技创新为核心”理解为只发展科技，忽略全面创新
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:创造性转化和创新性发展
  type: Concept
  subject: 道德与法治
  title: 创造性转化和创新性发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为创造性转化就是把古文简单翻译成白话文
    - 能指出并纠正这一错误：认为创新性发展就要抛弃传统，另起炉灶
  aliases:
    - 两创
  category: 文化
  explanation: 推动中华优秀传统文化与时俱进，赋予其新的时代内涵和现代表达形式，增强其影响力。
  misconceptions:
    - 认为创造性转化就是把古文简单翻译成白话文
    - 认为创新性发展就要抛弃传统，另起炉灶
    - 将创造性转化等同于原封不动地继承传统文化
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:初中阶段
  type: Concept
  subject: 道德与法治
  title: 初中阶段
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为初中阶段只要抓学习，其他活动都是浪费时间。
    - 能指出并纠正这一错误：认为初中阶段决定一生，一次没考好就前途尽毁。
  aliases:
    - 中学阶段
  category: 成长阶段
  explanation: 初中阶段是人生美好的年华，是规划未来之路的重要时期，为自我发展提供无限可能。
  misconceptions:
    - 认为初中阶段只要抓学习，其他活动都是浪费时间。
    - 认为初中阶段决定一生，一次没考好就前途尽毁。
    - 认为初中三年还长，可以慢慢来，不着急规划。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:初中阶段的新机会
  type: Concept
  subject: 道德与法治
  title: 初中阶段的新机会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把社团活动、社会实践当负担，觉得不如多做几道题。
    - 能指出并纠正这一错误：被动等机会找上门，从不主动报名参加活动。
  aliases: []
  category: 发展机会
  explanation: 初中阶段提供富有挑战的课程、社团活动、社会实践等新机会，促进我们涵养品格、提升自我。
  misconceptions:
    - 把社团活动、社会实践当负担，觉得不如多做几道题。
    - 被动等机会找上门，从不主动报名参加活动。
    - 认为只有学习好的学生才有资格参加社团活动。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:初中阶段的新要求
  type: Concept
  subject: 道德与法治
  title: 初中阶段的新要求
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为这些要求是家长老师强加的，产生逆反心理。
    - 能指出并纠正这一错误：认为只有学习进步才是上进，其他方面无所谓。
  aliases: []
  category: 成长要求
  explanation: 家庭、学校、社会期待我们越来越上进、踏实、包容、坚强，取得更大进步。
  misconceptions:
    - 认为这些要求是家长老师强加的，产生逆反心理。
    - 认为只有学习进步才是上进，其他方面无所谓。
    - 用完美标准要求自己，做不到就觉得自己彻底失败。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:利用网络学习
  type: Concept
  subject: 道德与法治
  title: 利用网络学习
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 互联网能提供丰富的学习资源，帮助我们学习知识、掌握生活技能、培养兴趣爱好，是学习和生活的好帮手。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:制度型开放
  type: Concept
  subject: 道德与法治
  title: 制度型开放
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为制度型开放就是多开办自由贸易试验区，忽视规则、规制等制度层面的开放。
    - 能指出并纠正这一错误：以为制度型开放等同于商品和要素流动型开放，忽视其更深层的规则对接。
  aliases:
    - 规则、规制、管理、标准等制度型开放
  category: 开放战略
  explanation: 我国稳步推进制度型开放，分批次设立自由贸易试验区，建设海南自由贸易港，打造全方位扩大开放的排头兵。
  misconceptions:
    - 认为制度型开放就是多开办自由贸易试验区，忽视规则、规制等制度层面的开放。
    - 以为制度型开放等同于商品和要素流动型开放，忽视其更深层的规则对接。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:制订新目标
  type: Concept
  subject: 道德与法治
  title: 制订新目标
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 新学期开始时，可以给自己定新的小目标，也可以和班级一起定共同的目标。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:制订班级规则
  type: Concept
  subject: 道德与法治
  title: 制订班级规则
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 为了让班级更好，大家一起商量，把好建议写下来，做成全班共同的约定。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:制订行动方案
  type: Concept
  subject: 道德与法治
  title: 制订行动方案
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：只定目标不写步骤，如计划‘提高成绩’却没有每天的行动安排。
    - 能指出并纠正这一错误：计划制定后不执行，遇到困难就放弃，不做调整。
  aliases: []
  category: 规划方法
  explanation: 做好初中生活规划，应制订行动方案，分解目标、明确实施细节、列出时间表。
  misconceptions:
    - 只定目标不写步骤，如计划‘提高成绩’却没有每天的行动安排。
    - 计划制定后不执行，遇到困难就放弃，不做调整。
    - 把计划定得过死，突发事件一来就全盘打乱，不知变通。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:制订行动计划
  type: Concept
  subject: 道德与法治
  title: 制订行动计划
  conceptType: 程序型
  aliases:
    - 行动计划
  category: 方法
  explanation: 给自己定一份行动计划，比如坚持体育锻炼、学好每门功课、勤于思考多问为什么，一项一项去做，就能不断进步。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:加入同伴游戏的方法
  type: Concept
  subject: 道德与法治
  title: 加入同伴游戏的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 想和大家一起玩时，可以礼貌地打招呼请求加入，也可以带上玩具分享，或请别人帮忙介绍。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:加快民族地区发展
  type: Concept
  subject: 道德与法治
  title: 加快民族地区发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为加快民族地区发展只是民族地区自身责任，忽视国家西部大开发、兴边富民等支持。
    - 能指出并纠正这一错误：把‘加快民族地区发展’等同于‘各民族共同繁荣’，实际前者是手段，后者是目标。
  aliases: []
  category: 政策措施
  explanation: 国家通过人力、物力、财力支持，实施西部大开发、兴边富民行动等，促进民族地区经济社会发展。
  misconceptions:
    - 认为加快民族地区发展只是民族地区自身责任，忽视国家西部大开发、兴边富民等支持。
    - 把‘加快民族地区发展’等同于‘各民族共同繁荣’，实际前者是手段，后者是目标。
    - 误以为国家支持仅指资金投入，忽视政策、人才、技术等多方面支持。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:助人为乐
  type: Concept
  subject: 道德与法治
  title: 助人为乐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为帮人就必须牺牲自己的利益，否则就不是真正的助人为乐，如拒绝在自己有余力时提供帮助。
    - 能指出并纠正这一错误：把满足他人一切要求当作助人，比如帮同学打架、代写作业还自以为在做好事。
  aliases:
    - 乐于助人
  category: 道德品质
  explanation: 助人为乐是用爱心温暖需要帮助的人，在道义、物质和精神上给予支持。
  misconceptions:
    - 认为帮人就必须牺牲自己的利益，否则就不是真正的助人为乐，如拒绝在自己有余力时提供帮助。
    - 把满足他人一切要求当作助人，比如帮同学打架、代写作业还自以为在做好事。
    - 以为只有捐钱捐物才算帮助，忽视在精神上安慰和鼓励也是助人为乐。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:努力
  type: Concept
  subject: 道德与法治
  title: 努力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为努力就是拼时间，熬夜刷题才算努力，不重效率。
    - 能指出并纠正这一错误：三分钟热度，努力几天不见效果就放弃。
  aliases: []
  category: 行动方法
  explanation: 努力是梦想与现实之间的桥梁，需要落实在每一天的具体行动中。
  misconceptions:
    - 认为努力就是拼时间，熬夜刷题才算努力，不重效率。
    - 三分钟热度，努力几天不见效果就放弃。
    - 认为只要努力就一定能马上实现梦想，忽略方法和方向。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:劳动创造价值
  type: Concept
  subject: 道德与法治
  title: 劳动创造价值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有体力劳动才算劳动，脑力劳动和创造性工作不算
    - 能指出并纠正这一错误：觉得劳动只是为了挣钱，没意识到劳动本身能带来幸福感
  aliases:
    - 劳动的意义
  category: 道德与法治
  explanation: 人们通过劳动创造物质财富和精神财富，在劳动中感受到幸福和愉悦，体会到人生的价值和美好。
  misconceptions:
    - 认为只有体力劳动才算劳动，脑力劳动和创造性工作不算
    - 觉得劳动只是为了挣钱，没意识到劳动本身能带来幸福感
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:劳动创造美好生活
  type: Concept
  subject: 道德与法治
  title: 劳动创造美好生活
  conceptType: 概念型
  aliases:
    - 一切靠劳动
  category: 观点
  explanation: 农民、工人和服务行业的劳动者用辛勤的劳动，为我们提供了食物、物品和各种服务。一切靠劳动，生活才美好。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:劳动模范
  type: Concept
  subject: 道德与法治
  title: 劳动模范
  conceptType: 概念型
  aliases:
    - 劳模
  category: 文化常识
  explanation: 劳动模范是爱岗敬业、勇挑重担的劳动者中的模范人物，国家会表彰他们，他们的先进事迹激励我们前进。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:劳动精神
  type: Concept
  subject: 道德与法治
  title: 劳动精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把劳动精神等同于体力劳动，认为办公室工作没有劳动精神。
    - 能指出并纠正这一错误：认为劳动精神只在劳动节或学雷锋日体现，平时无需践行。
  aliases: []
  category: 职业道德
  explanation: 崇尚劳动、热爱劳动、辛勤劳动、诚实劳动的精神。
  misconceptions:
    - 把劳动精神等同于体力劳动，认为办公室工作没有劳动精神。
    - 认为劳动精神只在劳动节或学雷锋日体现，平时无需践行。
    - 将劳动精神与个人奋斗割裂，认为劳动只是谋生手段，没有精神境界。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:劳动者义务
  type: Concept
  subject: 道德与法治
  title: 劳动者义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为劳动者只需完成本职工作，不必遵守劳动纪律和职业道德。
    - 能指出并纠正这一错误：把提高职业技能当作企业的责任，与劳动者个人无关。
  aliases: []
  category: 法律知识
  explanation: 劳动者应当履行的义务，包括完成劳动任务、提高职业技能、执行劳动安全卫生规程、遵守劳动纪律和职业道德。
  misconceptions:
    - 认为劳动者只需完成本职工作，不必遵守劳动纪律和职业道德。
    - 把提高职业技能当作企业的责任，与劳动者个人无关。
    - 混淆劳动者义务与权利，主张享有权利时可以不履行义务。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:劳动者是平等的
  type: Concept
  subject: 道德与法治
  title: 劳动者是平等的
  conceptType: 概念型
  aliases:
    - 职业不分贵贱
  category: 观点
  explanation: 不同职业的劳动方式有差别，但劳动者之间是平等的，只是分工不同，没有高低贵贱之分。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:劳动者权利
  type: Concept
  subject: 道德与法治
  title: 劳动者权利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为劳动者权利包括随时辞职且不承担任何培训费用。
    - 能指出并纠正这一错误：以为所有劳动者都自动享有社会保险，无需签订合同和维权。
  aliases:
    - 劳动权利
  category: 法律知识
  explanation: 劳动者依法享有的权利，包括劳动安全卫生保护、职业技能培训、社会保险和福利、提请劳动争议处理等。
  misconceptions:
    - 认为劳动者权利包括随时辞职且不承担任何培训费用。
    - 以为所有劳动者都自动享有社会保险，无需签订合同和维权。
    - 将劳动者权利与义务对立，认为自己只享受权利不必付出劳动。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:劳动节
  type: Concept
  subject: 道德与法治
  title: 劳动节
  conceptType: 概念型
  aliases:
    - 五一国际劳动节
    - 五一劳动节
  category: 文化常识
  explanation: 劳动节全称是“五一”国际劳动节，在每年的五月一日，是所有劳动者共同的节日。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:劳模精神
  type: Concept
  subject: 道德与法治
  title: 劳模精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为劳模精神就是“老黄牛”式苦干，忽视勇于创新、争创一流。
    - 能指出并纠正这一错误：觉得劳模只是个别先进人物的事，普通人不必学习。
  aliases: []
  category: 职业道德
  explanation: 爱岗敬业、争创一流、艰苦奋斗、勇于创新、淡泊名利、甘于奉献的精神。
  misconceptions:
    - 认为劳模精神就是“老黄牛”式苦干，忽视勇于创新、争创一流。
    - 觉得劳模只是个别先进人物的事，普通人不必学习。
    - 把淡泊名利等同于不求回报，认为劳模就不该追求物质利益。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:勇于表达
  type: Concept
  subject: 道德与法治
  title: 勇于表达
  conceptType: 概念型
  aliases:
    - 善于表达
  category: 观点
  explanation: 与人交流时要勇敢地说出自己的感受和想法，别人才可能理解你，不然可能会留下遗憾。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:勤俭节约
  type: Concept
  subject: 道德与法治
  title: 勤俭节约
  conceptType: 概念型
  aliases:
    - 节俭
  category: 观点
  explanation: 勤俭节约是中华民族的传统美德。我们要发扬勤俭节约的精神，养成勤俭节约的好习惯。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:勤劳创造幸福生活
  type: Concept
  subject: 道德与法治
  title: 勤劳创造幸福生活
  conceptType: 概念型
  aliases:
    - 勤劳
  category: 观点
  explanation: 幸福的生活不是等来的，是靠勤劳的双手创造的。庄稼丰收、生活变好，都离不开人们的辛勤劳动。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:勤学好问
  type: Concept
  subject: 道德与法治
  title: 勤学好问
  conceptType: 概念型
  aliases:
    - 多在心中画问号
  category: 观点
  explanation: "'问题'是最好的老师，要多在心中画问号，凡事多问为什么。能提问题是爱思考的表现，遇到不明白的就要大胆提问、寻找答案。"
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:包容性
  type: Concept
  subject: 道德与法治
  title: 包容性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把包容性误解为全盘接收外来文化，不进行价值判断和选择
    - 能指出并纠正这一错误：认为讲包容性就不能抵制文化入侵，对外来文化一律照单全收
  aliases: []
  category: 文明特性
  explanation: 中华文明以开放包容的态度吸收多元文化，如宋元时期泉州港的繁荣。
  misconceptions:
    - 把包容性误解为全盘接收外来文化，不进行价值判断和选择
    - 认为讲包容性就不能抵制文化入侵，对外来文化一律照单全收
    - 将包容性等同于消解自身文化特色，认为中华文化已被外来文化同化
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:化解冲突的方法
  type: Concept
  subject: 道德与法治
  title: 化解冲突的方法
  conceptType: 程序型
  aliases:
    - 解决冲突的方法
  category: 方法
  explanation: 处理矛盾的方式不同，结果也不同。可以先控制情绪保持冷静，再交换意见、换位思考，一起商量办法；解决不了时可以请老师等帮助调解。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:北京冬奥精神
  type: Concept
  subject: 道德与法治
  title: 北京冬奥精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北京冬奥精神只是奥运健儿的拼搏精神，忽略参与者
    - 能指出并纠正这一错误：把北京冬奥精神与女排精神混淆，说不清具体内涵
  aliases: []
  category: 道德与法治
  explanation: 在北京冬奥会、冬残奥会申办、筹办、举办的过程中，广大参与者共同创造了胸怀大局、自信开放、迎难而上、追求卓越、共创未来的北京冬奥精神。
  misconceptions:
    - 认为北京冬奥精神只是奥运健儿的拼搏精神，忽略参与者
    - 把北京冬奥精神与女排精神混淆，说不清具体内涵
    - 认为北京冬奥精神在冬奥会闭幕后便失去意义
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:北斗卫星导航系统
  type: Concept
  subject: 道德与法治
  title: 北斗卫星导航系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把北斗系统当成GPS一样的国外导航系统，不知道是我国自主建设、独立运行的
    - 能指出并纠正这一错误：认为北斗只能用于汽车导航，忽略其在国防、农业、救灾等领域的应用
  aliases:
    - 北斗系统
  category: 科技成就
  explanation: 我国自主建设、独立运行的卫星导航系统，是党中央决策实施的国家重大科技工程。
  misconceptions:
    - 把北斗系统当成GPS一样的国外导航系统，不知道是我国自主建设、独立运行的
    - 认为北斗只能用于汽车导航，忽略其在国防、农业、救灾等领域的应用
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:十二生肖
  type: Concept
  subject: 道德与法治
  title: 十二生肖
  conceptType: 概念型
  aliases:
    - 生肖
    - 属相
  category: 文化常识
  explanation: 生肖也叫属相，就是鼠、牛、虎、兔、龙、蛇、马、羊、猴、鸡、狗、猪这十二种动物，用来表示出生的年份，十二年一个循环。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:升国旗的礼仪
  type: Concept
  subject: 道德与法治
  title: 升国旗的礼仪
  conceptType: 概念型
  aliases:
    - 升旗礼仪
  category: 文化常识
  explanation: 升国旗时要停下来，面向国旗肃立、脱帽，行注目礼。少先队员要行队礼，表达对国旗的尊重和喜爱。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:协商民主
  type: Concept
  subject: 道德与法治
  title: 协商民主
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为协商民主就是少数服从多数的投票
    - 能指出并纠正这一错误：把协商民主等同于无原则的妥协，忽视决策科学化
  aliases:
    - 民主协商
  category: 民主形式
  explanation: 协商民主是我国社会主义民主政治的特有形式和独特优势，强调在决策前后进行充分协商。
  misconceptions:
    - 认为协商民主就是少数服从多数的投票
    - 把协商民主等同于无原则的妥协，忽视决策科学化
    - 认为协商民主只是政府听取意见，不需要公民主动参与
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:南京大屠杀
  type: Concept
  subject: 道德与法治
  title: 南京大屠杀
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 1937年12月日军占领南京后进行的血腥大屠杀，遇难同胞达30万人以上。我国将12月13日设立为南京大屠杀死难者国家公祭日，提醒人们牢记历史、勿忘国耻、珍爱和平。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:南京条约
  type: Concept
  subject: 道德与法治
  title: 南京条约
  conceptType: 概念型
  aliases:
    - 中英南京条约
  category: 文化常识
  explanation: 1842 年清政府同英国签订的丧权辱国条约，割让香港岛、赔款、开放通商口岸，中国的领土主权完整遭到破坏。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:卫国戍边英雄事迹
  type: Concept
  subject: 道德与法治
  title: 卫国戍边英雄事迹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记混英雄名字，如把肖思远说成王焯冉，英勇事迹挂错人。
    - 能指出并纠正这一错误：认为卫国戍边只是军人责任，普通公民无法在边防问题上发挥作用。
  aliases:
    - 加勒万河谷冲突
    - 戍边英雄
  category: 道德与法治
  explanation: 2020年6月加勒万河谷冲突中，祁发宝、陈红军、陈祥榕、肖思远、王焯冉等官兵英勇战斗，用生命捍卫国家主权和领土完整。
  misconceptions:
    - 记混英雄名字，如把肖思远说成王焯冉，英勇事迹挂错人。
    - 认为卫国戍边只是军人责任，普通公民无法在边防问题上发挥作用。
    - 将加勒万河谷冲突地点说成在南海或东北边境，搞错了具体方位。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S5.md
- id: concept:道德与法治:厉行法治
  type: Concept
  subject: 道德与法治
  title: 厉行法治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为厉行法治只是立法机关和司法机关的工作，公民无需遵守
    - 能指出并纠正这一错误：把厉行法治等同于严格执法，忽视科学立法和全民守法
  aliases: []
  category: 法律概念
  explanation: 厉行法治是对全体社会成员的共同要求，包括科学立法、严格执法、公正司法、全民守法。
  misconceptions:
    - 认为厉行法治只是立法机关和司法机关的工作，公民无需遵守
    - 把厉行法治等同于严格执法，忽视科学立法和全民守法
    - 认为厉行法治就是多制定法律，对违法只需加重处罚
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:参与公益事业
  type: Concept
  subject: 道德与法治
  title: 参与公益事业
  conceptType: 概念型
  aliases:
    - 公益活动
  category: 观点
  explanation: 参与公益能为身处困境的人雪中送炭。做善事不在于大小，最重要的是真心实意，小善积累起来就是大善。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:参与社区建设
  type: Concept
  subject: 道德与法治
  title: 参与社区建设
  conceptType: 概念型
  aliases:
    - 服务社区
  category: 观点
  explanation: 温馨有活力的社区是社会和谐的基础。社区成员既是社区建设的受益者，也是参与者，要积极参与社区活动、主动承担社区事务。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:友善
  type: Concept
  subject: 道德与法治
  title: 友善
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为友善就是有求必应，拒绝别人就是不友善，宁愿自己吃亏也不敢说“不”。
    - 能指出并纠正这一错误：把友善等同于无原则退让，对同学的错误言行也笑脸相迎，不指出不批评。
  aliases:
    - 与人为善
  category: 道德品质
  explanation: 友善是待人热情友好、与人为善，是社会主义核心价值观的要求和中华民族的传统美德。
  misconceptions:
    - 认为友善就是有求必应，拒绝别人就是不友善，宁愿自己吃亏也不敢说“不”。
    - 把友善等同于无原则退让，对同学的错误言行也笑脸相迎，不指出不批评。
    - 误以为对所有人都友善就是好人，即使对方做坏事也态度温和，不敢强硬制止。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:友好相处的方法
  type: Concept
  subject: 道德与法治
  title: 友好相处的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 一起玩要守规则，还要懂谦让、会安慰、能体谅别人，这样才能玩得开心长久。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:友爱兄弟姐妹
  type: Concept
  subject: 道德与法治
  title: 友爱兄弟姐妹
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 兄弟姐妹之间要和睦相处、互相关心、互相帮助。哥哥姐姐要爱护弟弟妹妹，弟弟妹妹要尊重哥哥姐姐。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:友谊带来的温暖
  type: Concept
  subject: 道德与法治
  title: 友谊带来的温暖
  conceptType: 概念型
  aliases:
    - 友谊的温暖
  category: 观点
  explanation: 好朋友在一起有说不完的开心事，互相帮助、彼此分享。友谊给我们温暖，让我们感受到真情。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:反对分裂
  type: Concept
  subject: 道德与法治
  title: 反对分裂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘反对分裂’仅等同于反对民族分裂势力，漏掉‘台独’等一切分裂行为。
    - 能指出并纠正这一错误：误以为香港特别行政区享有高度自治权，因此可以不遵守中央统一领导，忽视国家主权统一。
  aliases: []
  category: 政治原则
  explanation: 维护国家统一、国家主权和领土完整，反对一切形式的民族分裂活动和暴力恐怖活动。
  misconceptions:
    - 把‘反对分裂’仅等同于反对民族分裂势力，漏掉‘台独’等一切分裂行为。
    - 误以为香港特别行政区享有高度自治权，因此可以不遵守中央统一领导，忽视国家主权统一。
    - 认为反对分裂只是国家的事，与公民个人无关，实际上公民有维护国家统一的义务。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:反对特权
  type: Concept
  subject: 道德与法治
  title: 反对特权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为特权只属于官员，普通人插队、走后门不算特权。
    - 能指出并纠正这一错误：觉得家长随意翻看孩子日记是关心，不违反平等原则。
  aliases: []
  category: 道德与法治
  explanation: 践行平等要坚决反对特权，任何人都必须在宪法和法律范围内活动，不得有超越宪法和法律的特权。
  misconceptions:
    - 认为特权只属于官员，普通人插队、走后门不算特权。
    - 觉得家长随意翻看孩子日记是关心，不违反平等原则。
    - 认为老师可以体罚学生，因为教育需要，不算特权。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:反思的意义
  type: Concept
  subject: 道德与法治
  title: 反思的意义
  conceptType: 概念型
  aliases:
    - 自我反思
    - 自省
  category: 方法
  explanation: 反思就是思考过去的事情并从中得到经验或教训。通过反思可以总结经验、看到自己的不足、明确努力的方向，让自己做得更好。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:反思的方法
  type: Concept
  subject: 道德与法治
  title: 反思的方法
  conceptType: 程序型
  aliases:
    - 养成反思好习惯
  category: 方法
  explanation: 反思时先回忆事情的经过，想想哪些做得对、哪些做得不对，再想想以后遇到类似的事情会怎样做。反思的结果要记录下来提醒自己，坚持每日反思。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:发展的世界
  type: Concept
  subject: 道德与法治
  title: 发展的世界
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为世界发展是全部国家同步前进，不存在贫富差距和落后国家。
    - 能指出并纠正这一错误：只看到新经济、新业态带来的进步，否认发展不平衡和贫困问题。
  aliases: []
  category: 政治概念
  explanation: 新技术、新经济、新业态不断涌现并蓬勃发展，世界正经历着新一轮大发展大变革大调整，但贫富差距、发展不平衡等问题依然困扰着人类社会。
  misconceptions:
    - 认为世界发展是全部国家同步前进，不存在贫富差距和落后国家。
    - 只看到新经济、新业态带来的进步，否认发展不平衡和贫困问题。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:发扬斗争精神
  type: Concept
  subject: 道德与法治
  title: 发扬斗争精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为斗争精神就是武力对抗，面对国家利益受损时只能使用暴力手段。
    - 能指出并纠正这一错误：认为和平年代不需要发扬斗争精神，只需发展经济即可。
  aliases: []
  category: 道德与法治
  explanation: 当国家尊严、安全、发展受到侵犯或威胁时，应挺身而出，敢于斗争、善于斗争，坚决维护国家利益。
  misconceptions:
    - 认为斗争精神就是武力对抗，面对国家利益受损时只能使用暴力手段。
    - 认为和平年代不需要发扬斗争精神，只需发展经济即可。
    - 误以为只要个人利益受侵犯就要发扬斗争精神，忽略前提是国家尊严、安全、发展受侵害。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:发掘潜能
  type: Concept
  subject: 道德与法治
  title: 发掘潜能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自己天生没有潜能，怎么努力也没用。
    - 能指出并纠正这一错误：只关注学习潜能，忽视社交、艺术、体育等潜能。
  aliases: []
  category: 自我发展
  explanation: 通过学习、参与活动、合作等方式发现和发展自己的潜能。
  misconceptions:
    - 认为自己天生没有潜能，怎么努力也没用。
    - 只关注学习潜能，忽视社交、艺术、体育等潜能。
    - 坐等潜能自己出现，不主动参与活动去发现。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:发现学习优势
  type: Concept
  subject: 道德与法治
  title: 发现学习优势
  conceptType: 概念型
  aliases:
    - 人人都能学得好
  category: 方法
  explanation: 每个人在学习上都有自己的优势，比如唱歌好听、画画漂亮、动手能力强。知道自己的优势，可以增强学习自信心，让自己学得更好。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:发现身边的快乐
  type: Concept
  subject: 道德与法治
  title: 发现身边的快乐
  conceptType: 概念型
  aliases:
    - 我分享我快乐
  category: 观点
  explanation: 生活处处有快乐，分享是快乐，创造是快乐，进步也是快乐。只要留心，就能找到快乐。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:取消农业税
  type: Concept
  subject: 道德与法治
  title: 取消农业税
  conceptType: 概念型
  aliases:
    - 废除农业税
  category: 概念
  explanation: 2006年《中华人民共和国农业税条例》废止，在中国延续了2000多年的农业税正式成为历史。农民铸造“告别田赋鼎”表达拥护的心声。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:可持续发展
  type: Concept
  subject: 道德与法治
  title: 可持续发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为可持续发展就是停止发展或限制经济增长。
    - 能指出并纠正这一错误：把可持续发展等同于环境保护，忽略经济和社会公平方面的要求。
  aliases: []
  category: 发展
  explanation: 既满足当代人的需求，又不损害后代人满足其需求的发展模式，强调经济、社会、环境的协调。
  misconceptions:
    - 认为可持续发展就是停止发展或限制经济增长。
    - 把可持续发展等同于环境保护，忽略经济和社会公平方面的要求。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:可敬的家乡人
  type: Concept
  subject: 道德与法治
  title: 可敬的家乡人
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 理发师、快递员、修电工这些家乡人为我们的生活服务，很辛苦。我们要感谢和尊敬他们，学习身边的热心肠。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:司法公正
  type: Concept
  subject: 道德与法治
  title: 司法公正
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要结果公正就算司法公正，忽略程序必须合法，如刑讯逼供取得证据仍判有罪。
    - 能指出并纠正这一错误：以为司法公正只要求以事实为根据，不需要以法律为准绳，凭个人道德感断案。
  aliases:
    - 公正司法
  category: 法律概念
  explanation: 司法公正对社会公正具有重要引领作用，是捍卫正义的最后一道防线，要求以事实为根据、以法律为准绳。
  misconceptions:
    - 认为只要结果公正就算司法公正，忽略程序必须合法，如刑讯逼供取得证据仍判有罪。
    - 以为司法公正只要求以事实为根据，不需要以法律为准绳，凭个人道德感断案。
    - 认为所有案件都必须公开审理才公正，忽略涉及隐私或国家秘密的法定不公开情形。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:各民族共同繁荣
  type: Concept
  subject: 道德与法治
  title: 各民族共同繁荣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘共同繁荣’理解为‘同步富裕’，实际是共同发展、共同富裕。
    - 能指出并纠正这一错误：认为各民族共同繁荣仅指经济繁荣，忽视政治、文化、社会等全面进步。
  aliases: []
  category: 政治概念
  explanation: 国家支持民族地区加快发展，缩小发展差距，实现共同发展、共同富裕。
  misconceptions:
    - 误把‘共同繁荣’理解为‘同步富裕’，实际是共同发展、共同富裕。
    - 认为各民族共同繁荣仅指经济繁荣，忽视政治、文化、社会等全面进步。
    - 将‘共同繁荣’与‘民族平等’相混淆，两个概念范畴不同。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:合作力量大
  type: Concept
  subject: 道德与法治
  title: 合作力量大
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 有合作就不一样，合作做事效率高、快乐多，生活处处有合作。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:合作的方法
  type: Concept
  subject: 道德与法治
  title: 合作的方法
  conceptType: 程序型
  aliases:
    - 怎样才能合作好
  category: 方法
  explanation: 合作时要先分好工，互相配合，遇到问题不埋怨，这样才能一起把事情做好。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:合宪性审查
  type: Concept
  subject: 道德与法治
  title: 合宪性审查
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为合宪性审查是审查公民行为是否符合宪法。
    - 能指出并纠正这一错误：认为合宪性审查只针对行政法规，不包括地方性法规。
  aliases:
    - 违宪审查
  category: 法律概念
  explanation: 对法律法规等规范性文件是否符合宪法进行审查，确保其合宪合法。
  misconceptions:
    - 认为合宪性审查是审查公民行为是否符合宪法。
    - 认为合宪性审查只针对行政法规，不包括地方性法规。
    - 认为审查主体是全国人大，而非全国人大常委会。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:合理使用电子产品
  type: Concept
  subject: 道德与法治
  title: 合理使用电子产品
  conceptType: 概念型
  aliases:
    - 我和电子产品有个约定
  category: 方法
  explanation: 要和电子产品有个约定，合理规划使用时间，正确选择内容，不让它们抢走户外活动和与家人交流的时间。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:合理安排假期
  type: Concept
  subject: 道德与法治
  title: 合理安排假期
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 放假前先想好要做什么，订个小计划。有打算，假期就不会忙乱，能学好玩好休息好。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:合理消费
  type: Concept
  subject: 道德与法治
  title: 合理消费
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 消费要分清合理和不合理的需求，做到不攀比、不虚荣、不从众、量入为出，在家庭能承受的范围内合理消费。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:合理规划家庭支出
  type: Concept
  subject: 道德与法治
  title: 合理规划家庭支出
  conceptType: 概念型
  aliases:
    - 我是家庭小管家
  category: 方法
  explanation: 家庭收入来自家人的辛勤工作，来之不易。要精打细算、量入为出，合理规划支出，把生活安排得井井有条、有滋有味。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:合理选择
  type: Concept
  subject: 道德与法治
  title: 合理选择
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只凭一时兴趣选专业，不考虑自身能力和社会需求。
    - 能指出并纠正这一错误：认为信息越多越好，全部照搬他人经验，缺乏自主判断。
  aliases:
    - 学会选择
  category: 方法技能
  explanation: 做出理性选择需要弄清真实需要、多方面收集信息、掌握选择策略。
  misconceptions:
    - 只凭一时兴趣选专业，不考虑自身能力和社会需求。
    - 认为信息越多越好，全部照搬他人经验，缺乏自主判断。
    - 将“热门”等同于“适合”，盲目跟风报考热门专业。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:同伴在一起很快乐
  type: Concept
  subject: 道德与法治
  title: 同伴在一起很快乐
  conceptType: 概念型
  aliases:
    - 和大家在一起
  category: 观点
  explanation: 和同学们一起交流、做游戏，比一个人玩更开心，和大家在一起真好。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:同商议共承担
  type: Concept
  subject: 道德与法治
  title: 同商议共承担
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 家里的事全家人一起讨论商量、一起承担。用和谐、民主的方式处理家庭事务，家庭生活会更和谐美满。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:同学相伴的快乐
  type: Concept
  subject: 道德与法治
  title: 同学相伴的快乐
  conceptType: 概念型
  aliases:
    - 我们在一起
  category: 观点
  explanation: 同学相伴的日子有学习的快乐、玩耍的乐趣、分享的喜悦和合作的默契。每个人都不能离开集体，就像小音符合在一起才能奏出美妙的乐曲。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:向上向善
  type: Concept
  subject: 道德与法治
  title: 向上向善
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'向上'理解为不择手段地追求个人成功，甚至损人利己
    - 能指出并纠正这一错误：认为'向善'就是做老好人，对不正之风不敢批评、一味迁就
  aliases: []
  category: 道德与法治
  explanation: 向上向善是中华传统美德，要求积极进取、爱人利人、择善而行，追求至善的人生境界。
  misconceptions:
    - 将'向上'理解为不择手段地追求个人成功，甚至损人利己
    - 认为'向善'就是做老好人，对不正之风不敢批评、一味迁就
    - 把'择善而行'误认为只要自己觉得善就可以做，无视社会公德和他人感受
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:和平与发展是时代主题
  type: Concept
  subject: 道德与法治
  title: 和平与发展是时代主题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为当今世界已经持久和平，没有战争和武装冲突。
    - 能指出并纠正这一错误：把和平与发展看作已经实现的目标，不知威胁和平的因素仍存在。
  aliases: []
  category: 政治
  explanation: 当今世界，和平与发展成为时代主题，但威胁和平的因素依然存在。
  misconceptions:
    - 认为当今世界已经持久和平，没有战争和武装冲突。
    - 把和平与发展看作已经实现的目标，不知威胁和平的因素仍存在。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:和平共处五项原则
  type: Concept
  subject: 道德与法治
  title: 和平共处五项原则
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 周恩来提出、作为处理国际关系准则的五项原则：互相尊重主权和领土完整，互不侵犯，互不干涉内政，平等互利，和平共处。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:和平发展道路
  type: Concept
  subject: 道德与法治
  title: 和平发展道路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国坚持和平发展意味着在领土争端中不能使用武力，否定自卫权。
    - 能指出并纠正这一错误：把和平发展道路视为权宜之计，认为中国一旦强大就会改变这一路线。
  aliases: []
  category: 外交政策
  explanation: 中国坚持走和平发展道路，维护世界和平与稳定。
  misconceptions:
    - 认为中国坚持和平发展意味着在领土争端中不能使用武力，否定自卫权。
    - 把和平发展道路视为权宜之计，认为中国一旦强大就会改变这一路线。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:和平性
  type: Concept
  subject: 道德与法治
  title: 和平性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把和平性等同于不打仗，忽略张骞出使西域、郑和下西洋是善意和友谊的交流。
    - 能指出并纠正这一错误：认为中华文明只有和平没有战争，否认历史上也有冲突，以偏概全。
  aliases: []
  category: 文明特性
  explanation: 中华文明崇尚和平，如张骞出使西域、郑和下西洋依靠的是善意和友谊。
  misconceptions:
    - 把和平性等同于不打仗，忽略张骞出使西域、郑和下西洋是善意和友谊的交流。
    - 认为中华文明只有和平没有战争，否认历史上也有冲突，以偏概全。
    - 误将郑和下西洋说成殖民扩张，违背其和平友好的本质。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:和平是世界潮流
  type: Concept
  subject: 道德与法治
  title: 和平是世界潮流
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 世界人民热爱和平，和平是当前国际社会的主要趋势。国家主权神圣不可侵犯，国家之间应当互相尊重，这些原则成为国际和平的基石。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:和平统一、一国两制
  type: Concept
  subject: 道德与法治
  title: 和平统一、一国两制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘和平统一、一国两制’误认为是解决港澳问题的方针，实际也适用于台湾。
    - 能指出并纠正这一错误：误以为‘一国两制’在台湾是指台湾拥有自己的军队和外交权，实际外交权属中央。
  aliases:
    - 和平统一
  category: 政策方针
  explanation: 解决台湾问题的基本方针，是实现国家统一的最佳方式，必须坚持一个中国原则和“九二共识”。
  misconceptions:
    - 把‘和平统一、一国两制’误认为是解决港澳问题的方针，实际也适用于台湾。
    - 误以为‘一国两制’在台湾是指台湾拥有自己的军队和外交权，实际外交权属中央。
    - 认为‘和平统一’是唯一方式，忽视了不承诺放弃使用武力的保留。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:和解
  type: Concept
  subject: 道德与法治
  title: 和解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为和解必须通过法院或调解机构，双方自行协商无效
    - 能指出并纠正这一错误：认为和解协议没有法律约束力，可随意反悔
  aliases: []
  category: 法律概念
  explanation: 当事人通过协商自行解决纠纷的方式，基于自愿互谅达成协议。
  misconceptions:
    - 认为和解必须通过法院或调解机构，双方自行协商无效
    - 认为和解协议没有法律约束力，可随意反悔
    - 把和解等同于仲裁，认为都要提交第三方裁决
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:和谐
  type: Concept
  subject: 道德与法治
  title: 和谐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为和谐就是要求大家完全相同，不允许存在差异和矛盾。
    - 能指出并纠正这一错误：把人与自然和谐相处理解为人类可以任意征服自然，忽略共生共荣。
  aliases: []
  category: 道德与法治
  explanation: 和谐是中华优秀传统文化和社会主义核心价值观的重要内容，强调人与人、人与社会和谐共处。
  misconceptions:
    - 认为和谐就是要求大家完全相同，不允许存在差异和矛盾。
    - 把人与自然和谐相处理解为人类可以任意征服自然，忽略共生共荣。
    - 认为和谐只指人与人之间，不包括人与社会、人与自然的关系。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:唱国歌的礼仪
  type: Concept
  subject: 道德与法治
  title: 唱国歌的礼仪
  conceptType: 概念型
  aliases:
    - 唱国歌的要求
  category: 文化常识
  explanation: 国歌响起时要站起来，严肃认真地跟着大声唱。唱国歌时心里要充满敬意。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:善治
  type: Concept
  subject: 道德与法治
  title: 善治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为善治就是政府单方面管理，无需公民参与
    - 能指出并纠正这一错误：把善治等同于取消法治，只靠道德约束
  aliases: []
  category: 法律概念
  explanation: 善治是法治的更高要求，强调在民主基础上赋予公民更多参与机会，实现公共利益最大化。
  misconceptions:
    - 认为善治就是政府单方面管理，无需公民参与
    - 把善治等同于取消法治，只靠道德约束
    - 认为善治就是多听群众意见，但不必依法办事
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:四个全面战略布局
  type: Concept
  subject: 道德与法治
  title: 四个全面战略布局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉‘全面从严治党’，只记前三个全面。
    - 能指出并纠正这一错误：把‘全面建设社会主义现代化国家’写成旧表述‘全面建成小康社会’。
  aliases: []
  category: 战略布局
  explanation: 协调推进全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。
  misconceptions:
    - 漏掉‘全面从严治党’，只记前三个全面。
    - 把‘全面建设社会主义现代化国家’写成旧表述‘全面建成小康社会’。
    - 与‘五位一体总体布局’混用，分不清战略布局和总体布局。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:四心沟通法
  type: Concept
  subject: 道德与法治
  title: 四心沟通法
  conceptType: 程序型
  aliases:
    - 留心看、细心听、用心讲、耐心说
  category: 方法
  explanation: 与父母沟通的技巧：留心看、细心听、用心讲、耐心说。做到这四点，能让父母更了解我们，沟通更顺畅。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:国家主席的职权
  type: Concept
  subject: 道德与法治
  title: 国家主席的职权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家主席可以自行决定任免国务院总理，不需要根据全国人大的决定。
    - 能指出并纠正这一错误：误以为国家主席的特赦令是个人意志，实际上须根据全国人大常委会的决定发布。
  aliases:
    - 国家主席职权
  category: 国家机构
  explanation: 国家主席根据全国人大及其常委会的决定，行使公布法律、发布命令、任免权、外事权和授予荣誉权等职权。
  misconceptions:
    - 认为国家主席可以自行决定任免国务院总理，不需要根据全国人大的决定。
    - 误以为国家主席的特赦令是个人意志，实际上须根据全国人大常委会的决定发布。
    - 认为国家主席可以修改法律，混淆了国家主席与立法机关的职权。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:国家主权
  type: Concept
  subject: 道德与法治
  title: 国家主权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为主权是联合国或国际组织授予的，而非国家固有。
    - 能指出并纠正这一错误：将主权与政权混淆，认为政府更迭会导致国家主权丧失。
  aliases:
    - 主权
  category: 政治概念
  explanation: 主权是一个国家独立自主地处理对内对外事务的最高权力，主权的丧失意味着国家的解体和灭亡。
  misconceptions:
    - 误以为主权是联合国或国际组织授予的，而非国家固有。
    - 将主权与政权混淆，认为政府更迭会导致国家主权丧失。
    - 认为加入国际组织就等于让渡了部分主权，不再是独立国家。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家公祭日
  type: Concept
  subject: 道德与法治
  title: 国家公祭日
  conceptType: 概念型
  aliases:
    - 南京大屠杀死难者国家公祭日
  category: 文化常识
  explanation: 每年 12 月 13 日是南京大屠杀死难者国家公祭日，提醒我们铭记历史、勿忘国耻、永葆和平。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:国家利益
  type: Concept
  subject: 道德与法治
  title: 国家利益
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把国家利益等同于政府利益或所有公民个人利益的简单相加。
    - 能指出并纠正这一错误：误认为国家利益只包含经济利益，忽视政治、文化和军事安全等。
  aliases: []
  category: 政治概念
  explanation: 国家利益是一个主权国家在国际社会中生存需求和发展需求的总和，涉及政治、经济、文化、社会、军事等领域，关系民族生存、国家兴亡。
  misconceptions:
    - 把国家利益等同于政府利益或所有公民个人利益的简单相加。
    - 误认为国家利益只包含经济利益，忽视政治、文化和军事安全等。
    - 觉得国家利益高高在上，与普通老百姓没有直接关系。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家利益与个人利益的关系
  type: Concept
  subject: 道德与法治
  title: 国家利益与个人利益的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为国家利益和个人利益是对立的，维护国家利益就必须牺牲个人一切利益。
    - 能指出并纠正这一错误：认为个人利益就是国家利益的组成部分，因此当二者冲突时个人应无条件放弃利益。
  aliases:
    - 正确处理国家利益与个人利益的关系
  category: 道德与法治
  explanation: 国家利益是整体利益，个人利益是局部利益，从根本上说二者是一致的，但有时会发生冲突，此时应顾全大局，把国家利益放在第一位。
  misconceptions:
    - 误认为国家利益和个人利益是对立的，维护国家利益就必须牺牲个人一切利益。
    - 认为个人利益就是国家利益的组成部分，因此当二者冲突时个人应无条件放弃利益。
    - 宣扬“个人利益至上”，认为个人利益与国家利益矛盾时，应优先维护个人利益。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:国家利益与人民利益的关系
  type: Concept
  subject: 道德与法治
  title: 国家利益与人民利益的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家利益与个人利益是根本对立的，保国家就必舍小家。
    - 能指出并纠正这一错误：误以为国家利益是人民利益的简单汇总，看不到其整体性和长远性。
  aliases: []
  category: 政治原理
  explanation: 国家利益是人民利益的集中体现，国家利益与人民利益是高度统一的；国家利益只有反映人民利益，依靠人民艰苦奋斗，才能得到真正的实现。
  misconceptions:
    - 认为国家利益与个人利益是根本对立的，保国家就必舍小家。
    - 误以为国家利益是人民利益的简单汇总，看不到其整体性和长远性。
    - 只要国家强大了，人民利益就自动实现，无需自身奋斗。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家利益至上观念
  type: Concept
  subject: 道德与法治
  title: 国家利益至上观念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“至上”理解为可不择手段，甚至用违法方式表达爱国。
    - 能指出并纠正这一错误：爱国就是仇视一切外国事物，全面抵制外来文化。
  aliases: []
  category: 价值观念
  explanation: 以热爱祖国为荣、以危害祖国为耻，坚决维护国家的尊严、荣誉和利益，是维护国家利益的基本要求。
  misconceptions:
    - 把“至上”理解为可不择手段，甚至用违法方式表达爱国。
    - 爱国就是仇视一切外国事物，全面抵制外来文化。
    - 以为国家利益至上，就是任何时候都要放弃个人一切利益。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家制度和国家治理体系的显著优势
  type: Concept
  subject: 道德与法治
  title: 国家制度和国家治理体系的显著优势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘四个自信’是国家制度优势的依据，实际制度优势是四个自信的依据。
    - 能指出并纠正这一错误：认为国家制度显著优势仅指政治制度优势，忽视经济、文化、社会等各方面。
  aliases: []
  category: 政治理论
  explanation: 我国国家制度和国家治理体系具有多方面显著优势，是坚定四个自信的基本依据。
  misconceptions:
    - 误以为‘四个自信’是国家制度优势的依据，实际制度优势是四个自信的依据。
    - 认为国家制度显著优势仅指政治制度优势，忽视经济、文化、社会等各方面。
    - 把‘国家制度’等同于‘国家机构’，混淆了制度与机构的概念。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家司法机关
  type: Concept
  subject: 道德与法治
  title: 国家司法机关
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把公安机关当作司法机关，认为公安局是行使审判权或检察权的机关。
    - 能指出并纠正这一错误：认为司法行政机关（司法局）也是司法机关，属于法院检察院的一部分。
  aliases: []
  category: 国家机构
  explanation: 国家司法机关包括人民法院和人民检察院，分别行使审判权和检察权。
  misconceptions:
    - 把公安机关当作司法机关，认为公安局是行使审判权或检察权的机关。
    - 认为司法行政机关（司法局）也是司法机关，属于法院检察院的一部分。
    - 误以为人民法院和人民检察院都可以行使审判权，忽略了检察院的检察权。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家安全
  type: Concept
  subject: 道德与法治
  title: 国家安全
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将国家安全等同于军事安全，认为没有战争就没有安全威胁。
    - 能指出并纠正这一错误：认为国家安全仅指领土完整，不包括经济、文化、生态等非传统安全。
  aliases: []
  category: 概念
  explanation: 国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。
  misconceptions:
    - 将国家安全等同于军事安全，认为没有战争就没有安全威胁。
    - 认为国家安全仅指领土完整，不包括经济、文化、生态等非传统安全。
    - 觉得国家安全是政府的事，普通公民不会直接遭遇国家安全威胁。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:国家安全机关举报方式
  type: Concept
  subject: 道德与法治
  title: 国家安全机关举报方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：遇到危害国家安全的行为拨打110求助，不了解12339是专用举报电话。
    - 能指出并纠正这一错误：认为向国家安全机关举报必须实名且当面提交，其他方式一律无效。
  aliases: []
  category: 方法
  explanation: 遇到危害国家安全的行为，可以通过拨打12339电话、登录举报平台、投递信函、当面举报或通过其他国家机关报告等方式向国家安全机关举报。
  misconceptions:
    - 遇到危害国家安全的行为拨打110求助，不了解12339是专用举报电话。
    - 认为向国家安全机关举报必须实名且当面提交，其他方式一律无效。
    - 以为只能通过12339举报，不知道还可以向其他国家机关报告。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:国家安全的重要性
  type: Concept
  subject: 道德与法治
  title: 国家安全的重要性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民幸福是国家安全的前提，国家因人民幸福而安全。
    - 能指出并纠正这一错误：觉得国家安全只对国家发展有好处，与个人生活幸福无关。
  aliases: []
  category: 原理
  explanation: 国家安全是国家生存与发展的重要保障，是民族复兴的根基；国家安全是人民幸福安康的前提。
  misconceptions:
    - 认为人民幸福是国家安全的前提，国家因人民幸福而安全。
    - 觉得国家安全只对国家发展有好处，与个人生活幸福无关。
    - 认为国家安全虽重要，但必要时可牺牲安全换取经济发展。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S5.md
- id: concept:道德与法治:国家宪法日
  type: Concept
  subject: 道德与法治
  title: 国家宪法日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将国家宪法日误认为是12月10日世界人权日。
    - 能指出并纠正这一错误：认为宪法日只是为了纪念宪法颁布，与自身无关。
  aliases: []
  category: 法律节日
  explanation: 12月4日为国家宪法日，旨在增强人们的宪法意识。
  misconceptions:
    - 将国家宪法日误认为是12月10日世界人权日。
    - 认为宪法日只是为了纪念宪法颁布，与自身无关。
    - 认为宪法日是法定节假日，学校必须放假。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:国家尊重和保障人权
  type: Concept
  subject: 道德与法治
  title: 国家尊重和保障人权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人权保障只是司法机关的职责，行政机关无需负责。
    - 能指出并纠正这一错误：认为尊重人权意味着国家不能征收土地或限制自由。
  aliases:
    - 人权保障
  category: 宪法原则
  explanation: 2004年宪法修正案载入的原则，要求国家权力机关、行政机关、监察机关、司法机关等保障人权。
  misconceptions:
    - 认为人权保障只是司法机关的职责，行政机关无需负责。
    - 认为尊重人权意味着国家不能征收土地或限制自由。
    - 将人权等同于公民基本权利，忽略人权还包括经济、社会、文化权利。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:国家机关依法行使职权
  type: Concept
  subject: 道德与法治
  title: 国家机关依法行使职权
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 国家机关必须在法定职权范围内、依照法定程序行使权力。宪法和法律规定的职责必须履行，没有授予的权力就不能行使。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:国家机构
  type: Concept
  subject: 道德与法治
  title: 国家机构
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 国家机构是国家机关的统称，包括中央国家机关和地方国家机关，保障国家正常运转和我们的生活。学校、医院、图书馆不属于国家机构。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:国家权力机关
  type: Concept
  subject: 道德与法治
  title: 国家权力机关
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆人大与政府，认为政府也是国家权力机关
    - 能指出并纠正这一错误：认为村委会、居委会是国家权力机关
  aliases:
    - 人民代表大会
  category: 国家机构
  explanation: 由人民民主选举产生，代表人民统一行使国家权力，包括全国人民代表大会和地方各级人民代表大会。
  misconceptions:
    - 混淆人大与政府，认为政府也是国家权力机关
    - 认为村委会、居委会是国家权力机关
    - 误以为国家权力机关是执行机关，实际是产生并监督其他机关
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:国家标志
  type: Concept
  subject: 道德与法治
  title: 国家标志
  conceptType: 概念型
  aliases:
    - 国家象征和标志
  category: 文化常识
  explanation: 国旗、国歌、国徽和首都是国家的象征和标志。我国的国旗是五星红旗，国歌是《义勇军进行曲》，首都是北京。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:国家核心利益
  type: Concept
  subject: 道德与法治
  title: 国家核心利益
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把所有国家利益都当成核心利益，导致维护时平均用力。
    - 能指出并纠正这一错误：误以为核心利益只包括领土和主权，不包括政治制度和社会稳定。
  aliases:
    - 核心利益
  category: 政治概念
  explanation: 我国的核心利益包括国家主权、国家安全、领土完整、国家统一、宪法确立的国家政治制度和社会大局稳定、经济社会可持续发展的基本保障。
  misconceptions:
    - 把所有国家利益都当成核心利益，导致维护时平均用力。
    - 误以为核心利益只包括领土和主权，不包括政治制度和社会稳定。
    - 认为国家核心利益可以拿来谈判交易，随便妥协。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家监察体制改革
  type: Concept
  subject: 道德与法治
  title: 国家监察体制改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为监察委员会属于行政机关的一部分，是政府内部的反腐机构。
    - 能指出并纠正这一错误：把监察委员会与党的纪律检查委员会等同起来，认为两者机构完全一样。
  aliases:
    - 监察体制改革
  category: 政治改革
  explanation: 国家监察体制改革是事关全局的重大政治改革，以法治方式和法治思维推进反腐败工作，设立监察委员会，制定监察法。
  misconceptions:
    - 认为监察委员会属于行政机关的一部分，是政府内部的反腐机构。
    - 把监察委员会与党的纪律检查委员会等同起来，认为两者机构完全一样。
    - 认为国家监察体制改革会削弱法治，因为监委可以不经审判直接处分公职人员。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家监察机关的性质和产生
  type: Concept
  subject: 道德与法治
  title: 国家监察机关的性质和产生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为地方各级监察委员会只对产生它的同级人大负责，不对上级监察委负责。
    - 能指出并纠正这一错误：误以为国家监察委员会由国务院产生，受国务院领导。
  aliases:
    - 监察委员会
  category: 国家机构
  explanation: 国家监察机关由国家权力机关产生，对它负责，受它监督，包括国家监察委员会和地方各级监察委员会。
  misconceptions:
    - 认为地方各级监察委员会只对产生它的同级人大负责，不对上级监察委负责。
    - 误以为国家监察委员会由国务院产生，受国务院领导。
    - 认为监察机关接受人大监督，因此也行使立法权，产生于立法机关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:国家监察机关的职责
  type: Concept
  subject: 道德与法治
  title: 国家监察机关的职责
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为监察机关可以对所有公民进行调查，而不仅仅是公职人员。
    - 能指出并纠正这一错误：误以为监察委员会有审判权，可以对被调查人定罪量刑。
  aliases: []
  category: 国家机构
  explanation: 国家监察机关履行监督、调查、处置职责，对所有行使公权力的公职人员进行监察。
  misconceptions:
    - 认为监察机关可以对所有公民进行调查，而不仅仅是公职人员。
    - 误以为监察委员会有审判权，可以对被调查人定罪量刑。
    - 把监察机关的处置职责与党纪处分混为一谈，认为监委可以直接开除党籍。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S10.md
- id: concept:道德与法治:国家科学技术奖励制度
  type: Concept
  subject: 道德与法治
  title: 国家科学技术奖励制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家最高科学技术奖每年固定颁发多人，不了解宁缺毋滥原则
    - 能指出并纠正这一错误：把该奖励制度看作个人荣誉，忽视其推动科技创新的政策导向
  aliases: []
  category: 制度政策
  explanation: 国家设立的科学技术奖励体系，包括国家最高科学技术奖等五大奖项，以推动科技创新。
  misconceptions:
    - 认为国家最高科学技术奖每年固定颁发多人，不了解宁缺毋滥原则
    - 把该奖励制度看作个人荣誉，忽视其推动科技创新的政策导向
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:国家行政机关的性质
  type: Concept
  subject: 道德与法治
  title: 国家行政机关的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行政机关是国家的权力机关，因为它们管理社会事务。
    - 能指出并纠正这一错误：把法院、检察院也算作行政机关，认为它们也是政府的一部分。
  aliases:
    - 行政机关性质
  category: 国家机构
  explanation: 行政机关是依法设立，行使国家行政权，组织和管理国家行政事务的国家机关。
  misconceptions:
    - 认为行政机关是国家的权力机关，因为它们管理社会事务。
    - 把法院、检察院也算作行政机关，认为它们也是政府的一部分。
    - 误以为国务院是最高国家权力机关，而不是最高国家行政机关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S5.md
- id: concept:道德与法治:国家行政机关的职权
  type: Concept
  subject: 道德与法治
  title: 国家行政机关的职权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行政机关可以制定和修改法律，行使立法权。
    - 能指出并纠正这一错误：以为行政机关有权对刑事案件进行审判，将行政权与司法权混同。
  aliases:
    - 行政机关职权
  category: 国家机构
  explanation: 行政机关管理本行政区域内的经济、教育、科学、文化、卫生、体育、城乡建设等事业和生态环境保护、自然资源、财政、民政、社会保障、公安、民族事务、司法行政、人口与计划生育等行政工作。
  misconceptions:
    - 认为行政机关可以制定和修改法律，行使立法权。
    - 以为行政机关有权对刑事案件进行审判，将行政权与司法权混同。
    - 认为居民委员会、村民委员会是国家的行政机关，拥有行政职权。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S5.md
- id: concept:道德与法治:国庆节
  type: Concept
  subject: 道德与法治
  title: 国庆节
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 10月1日是国庆节，是新中国的生日。1949年10月1日中华人民共和国成立，全国人民一起庆祝。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:国有经济
  type: Concept
  subject: 道德与法治
  title: 国有经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国有经济是公有制经济的唯一形式
    - 能指出并纠正这一错误：把国有经济的主导作用理解为数量、比重占绝对优势，应看控制力
  aliases:
    - 国营经济
  category: 经济成分
  explanation: 公有制经济的重要组成部分，生产资料属于全体人民共同所有，是国民经济的主导力量。
  misconceptions:
    - 认为国有经济是公有制经济的唯一形式
    - 把国有经济的主导作用理解为数量、比重占绝对优势，应看控制力
    - 误以为国有经济是社会主义经济制度的基础，基础是公有制为主体
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:国籍的取得方式
  type: Concept
  subject: 道德与法治
  title: 国籍的取得方式
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 国籍的取得一般有两种方式：一是以出生的方式取得，二是以申请加入的方式取得。我国不承认中国公民具有双重国籍。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:国防和军队现代化新三步走战略
  type: Concept
  subject: 道德与法治
  title: 国防和军队现代化新三步走战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将三步走目标中2035年和本世纪中叶的任务颠倒，以为2035年建成世界一流军队
    - 能指出并纠正这一错误：认为2027年实现建军百年奋斗目标等于全面实现国防和军队现代化
  aliases:
    - 新三步走战略
  category: 战略安排
  explanation: 到2027年实现建军一百年奋斗目标，到2035年基本实现国防和军队现代化，到本世纪中叶全面实现国防和军队现代化，建成世界一流军队。
  misconceptions:
    - 将三步走目标中2035年和本世纪中叶的任务颠倒，以为2035年建成世界一流军队
    - 认为2027年实现建军百年奋斗目标等于全面实现国防和军队现代化
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:国际正义
  type: Concept
  subject: 道德与法治
  title: 国际正义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将国际正义等同于大国主导的秩序，认为强国说了算，违背国家一律平等原则。
    - 能指出并纠正这一错误：认为国际正义就是所有国家法律和制度完全一样，忽略各国国情差异和主权。
  aliases:
    - 世界正义
  category: 政治概念
  explanation: 国际正义是全人类共同价值的重要内容，要求国家一律平等，反对干涉内政和双重标准，构建公正的国际秩序。
  misconceptions:
    - 将国际正义等同于大国主导的秩序，认为强国说了算，违背国家一律平等原则。
    - 认为国际正义就是所有国家法律和制度完全一样，忽略各国国情差异和主权。
    - 主张为了本国利益可以干涉他国内政，并美其名曰‘国际正义’的双重标准。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:国际法
  type: Concept
  subject: 道德与法治
  title: 国际法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国际法是世界法律，对各国有强制约束力，如联合国可强制执法。
    - 能指出并纠正这一错误：把国际法等同于国内法，认为它能直接约束个人行为。
  aliases: []
  category: 法律
  explanation: 以国家之间的关系为主要调整对象的法律，17世纪以来逐渐形成完整体系，对维护国际秩序具有重要意义。
  misconceptions:
    - 认为国际法是世界法律，对各国有强制约束力，如联合国可强制执法。
    - 把国际法等同于国内法，认为它能直接约束个人行为。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:国际竞争的实质
  type: Concept
  subject: 道德与法治
  title: 国际竞争的实质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国际竞争的实质是军事竞赛，如军备数量决定胜负。
    - 能指出并纠正这一错误：把国际竞争等同于单纯的经济竞争，忽略科技和综合国力。
  aliases: []
  category: 政治
  explanation: 当今国际竞争的实质是以经济和科技实力为基础的综合国力的较量。
  misconceptions:
    - 认为国际竞争的实质是军事竞赛，如军备数量决定胜负。
    - 把国际竞争等同于单纯的经济竞争，忽略科技和综合国力。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:国际组织
  type: Concept
  subject: 道德与法治
  title: 国际组织
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 一些国家和地区为了特定的共同目标而组成国际组织。国际组织制定章程、设立机构、开展活动，在推动交流合作、解决矛盾纠纷、促进和平与发展等方面发挥着重要作用。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:国际组织的类型
  type: Concept
  subject: 道德与法治
  title: 国际组织的类型
  conceptType: 概念型
  aliases:
    - 国际组织的分类
  category: 概念
  explanation: 按地理范围，国际组织分为世界性国际组织和区域性国际组织；按职能范围，分为一般性国际组织和专门性国际组织。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:土地生命奖
  type: Concept
  subject: 道德与法治
  title: 土地生命奖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把土地生命奖说成是中国政府设立的环保奖项，忽略其联合国背景。
    - 能指出并纠正这一错误：将土地生命奖与联合国环境署的‘地球卫士奖’混为一谈，认为二者相同。
  aliases: []
  category: 环保荣誉
  explanation: 联合国防治荒漠化领域的最高荣誉，表彰在防治荒漠化方面做出突出贡献的个人或组织。
  misconceptions:
    - 把土地生命奖说成是中国政府设立的环保奖项，忽略其联合国背景。
    - 将土地生命奖与联合国环境署的‘地球卫士奖’混为一谈，认为二者相同。
    - 误以为土地生命奖只授予个人，不授予组织。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:在交往中探索世界
  type: Concept
  subject: 道德与法治
  title: 在交往中探索世界
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为交往就是加好友、聊天，忽视在交往中学习对方的优点。
    - 能指出并纠正这一错误：以自己文化标准评判他人，不尊重文化差异，产生冲突。
  aliases:
    - 交往中成长
  category: 道德与法治
  explanation: 我们在交往中探索世界，彼此守护，共同成长，学会关爱、理解、尊重，获得成长的力量。
  misconceptions:
    - 认为交往就是加好友、聊天，忽视在交往中学习对方的优点。
    - 以自己文化标准评判他人，不尊重文化差异，产生冲突。
    - 把网络交往视为全部，拒绝现实中的面对面交流。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:在奉献中成就精彩人生
  type: Concept
  subject: 道德与法治
  title: 在奉献中成就精彩人生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为奉献就是完全牺牲自己，不考虑个人正当需要
    - 能指出并纠正这一错误：只在顺境时讲奉献，遇到个人利益与集体利益冲突就退缩
  aliases:
    - 奉献精神
  category: 道德与法治
  explanation: 将个人追求与人类发展进步紧密联系，在奉献中实现人生价值，人生才能焕发无限的生机和活力。
  misconceptions:
    - 认为奉献就是完全牺牲自己，不考虑个人正当需要
    - 只在顺境时讲奉献，遇到个人利益与集体利益冲突就退缩
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:在实践中学习
  type: Concept
  subject: 道德与法治
  title: 在实践中学习
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有书本知识才是知识，动手操作只是“玩”。
    - 能指出并纠正这一错误：实践时只动手不动脑，不观察不反思，实践后没有收获。
  aliases:
    - 知行合一
  category: 学习方法
  explanation: 重视书本知识，更要坚持实践，实践出真知，提高认识世界和改造世界的能力。
  misconceptions:
    - 认为只有书本知识才是知识，动手操作只是“玩”。
    - 实践时只动手不动脑，不观察不反思，实践后没有收获。
    - 将实践学习与考试对立，认为参加实践活动浪费时间影响成绩。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:在改错中成长
  type: Concept
  subject: 道德与法治
  title: 在改错中成长
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 改错能帮我们养成好习惯、吸取教训、发现自己的不足，让我们越来越棒。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:在改革中完善法治
  type: Concept
  subject: 道德与法治
  title: 在改革中完善法治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为改革可以突破法律的禁区，等改革完成后再立法规范。
    - 能指出并纠正这一错误：误以为只有经过长期检验的改革经验才能立法，导致法律总是落后于改革。
  aliases: []
  category: 法治
  explanation: 对于实践证明比较成熟的改革经验、行之有效的改革举措，立法机关及时通过立法、修法等方式将其上升为法律规定，促进法律规范体系更加完备。
  misconceptions:
    - 认为改革可以突破法律的禁区，等改革完成后再立法规范。
    - 误以为只有经过长期检验的改革经验才能立法，导致法律总是落后于改革。
    - 认为立法机关可以将任何改革措施直接写进法律，无需评估论证和法定程序。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S3.md
- id: concept:道德与法治:在法治下推进改革
  type: Concept
  subject: 道德与法治
  title: 在法治下推进改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为改革可以先行先试、突破现行法律，等成功后再补立法。
    - 能指出并纠正这一错误：把‘在改革中完善法治’理解为改革优先于法治，可暂时不依法办事。
  aliases: []
  category: 法治
  explanation: 以法治引领改革，依照法定程序把改革方案和举措上升为国家意志，确保重大改革于法有据；以法治深化改革，以法的强制力保证改革顺利推进，以法治方式巩固和扩大改革成果。
  misconceptions:
    - 认为改革可以先行先试、突破现行法律，等成功后再补立法。
    - 把‘在改革中完善法治’理解为改革优先于法治，可暂时不依法办事。
    - 认为只要为了改革，政策文件就可以代替法律。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S3.md
- id: concept:道德与法治:在集体中成长
  type: Concept
  subject: 道德与法治
  title: 在集体中成长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为在集体中成长就是牺牲个人利益，无条件服从集体。
    - 能指出并纠正这一错误：以为只要自己成绩好，不参与集体活动也算在集体中成长。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 认为在集体中成长就是牺牲个人利益，无条件服从集体。
    - 以为只要自己成绩好，不参与集体活动也算在集体中成长。
    - 觉得集体荣誉与个人无关，评优评先时只争个人。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:地方各级人民代表大会
  type: Concept
  subject: 道德与法治
  title: 地方各级人民代表大会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为地方人大是地方行政机关，负责执行法律法规。
    - 能指出并纠正这一错误：认为乡镇人大也设立常务委员会，与县级以上相同。
  aliases:
    - 地方人大
  category: 国家机构
  explanation: 地方各级人民代表大会是地方国家权力机关，是本行政区域内人民行使国家权力的机关。
  misconceptions:
    - 误认为地方人大是地方行政机关，负责执行法律法规。
    - 认为乡镇人大也设立常务委员会，与县级以上相同。
    - 把地方人大常委会当成比人大更高一级的权力机关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:地方各级人民代表大会常务委员会
  type: Concept
  subject: 道德与法治
  title: 地方各级人民代表大会常务委员会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人大常委会是独立于人大之外的最高国家权力机关。
    - 能指出并纠正这一错误：误认为人大常委会可代替人大行使全部职权，无需对人大负责。
  aliases:
    - 地方人大常委会
  category: 国家机构
  explanation: 县级以上的地方各级人民代表大会设立常务委员会，作为本级人民代表大会的常设机关，对本级人民代表大会负责并报告工作。
  misconceptions:
    - 认为人大常委会是独立于人大之外的最高国家权力机关。
    - 误认为人大常委会可代替人大行使全部职权，无需对人大负责。
    - 认为人大常委会与政府一样，都是执行机关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:地球是人类唯一家园
  type: Concept
  subject: 道德与法治
  title: 地球是人类唯一家园
  conceptType: 概念型
  aliases:
    - 地球——我们的家园
  category: 观点
  explanation: 宇宙只有一个地球，到目前为止它是人类赖以生存的唯一家园，为人类提供空间、环境和资源。珍爱和呵护地球是人类唯一的选择。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:地缘关系
  type: Concept
  subject: 道德与法治
  title: 地缘关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把同事说成地缘关系，同事基于分工协作，不是因地理位置相识。
    - 能指出并纠正这一错误：认为同班同学是地缘关系，同学因学业组织而联系，不是因居住地。
  aliases: []
  category: 社会关系
  explanation: 以空间与地理位置为基础而形成的社会关系，如同乡、邻居等。
  misconceptions:
    - 把同事说成地缘关系，同事基于分工协作，不是因地理位置相识。
    - 认为同班同学是地缘关系，同学因学业组织而联系，不是因居住地。
    - 误把‘网友’的关系当作地缘关系，网友无空间位置基础。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:坚持人民至上、生命至上
  type: Concept
  subject: 道德与法治
  title: 坚持人民至上、生命至上
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生命至上意味着任何情况下都要先保自己的命，见死不救也有理
    - 能指出并纠正这一错误：把生命至上理解为可以为了救人而完全不顾自身安全，盲目冲进火场
  aliases:
    - 人民至上
    - 生命至上
  category: 生命观
  explanation: 敬畏生命就要坚持人民至上、生命至上，生命重于泰山，每个人的生命都比金钱、权势等身外之物更为重要，当人民生命遭遇威胁时，要竭尽全力挽救和保护最广大人民的生命。
  misconceptions:
    - 认为生命至上意味着任何情况下都要先保自己的命，见死不救也有理
    - 把生命至上理解为可以为了救人而完全不顾自身安全，盲目冲进火场
    - 认为生命比什么都重要，所以为了守护生命可以牺牲规则和正义
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:坚持做事的方法
  type: Concept
  subject: 道德与法治
  title: 坚持做事的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 想坚持做成一件事，要量力而行，做到了就给自己点赞；还可以像长跑运动员那样，把大目标分成一段一段的小目标。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:坚持才有收获
  type: Concept
  subject: 道德与法治
  title: 坚持才有收获
  conceptType: 概念型
  aliases:
    - 坚持就会有收获
  category: 观点
  explanation: 坚持跑步、练字、背古诗，时间长了就会有进步。能坚持下来，本身就是一种收获。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:坚持锻炼身体
  type: Concept
  subject: 道德与法治
  title: 坚持锻炼身体
  conceptType: 概念型
  aliases:
    - 体育锻炼
  category: 观点
  explanation: 经常跑步、跳绳、打球等锻炼，能让身体更强壮，不容易生病。要坚持锻炼，身体才会好。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:培育和践行社会主义核心价值观
  type: Concept
  subject: 道德与法治
  title: 培育和践行社会主义核心价值观
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为学生只要成绩好，践行核心价值观等长大再说。
    - 能指出并纠正这一错误：把熟背24字当作践行核心价值观，忽视落实到日常行动。
  aliases: []
  category: 道德与法治
  explanation: 培育和践行社会主义核心价值观，要与日常生活紧密联系起来，做到落细、落小、落实。青少年应自觉做到勤于学习、敏于思考，注重修养、勇于实践，明辨是非、善于选择，认真做事、踏实做人。
  misconceptions:
    - 认为学生只要成绩好，践行核心价值观等长大再说。
    - 把熟背24字当作践行核心价值观，忽视落实到日常行动。
    - 认为只有见义勇为、捐款救灾才算践行，帮同学扫地不值一提。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:基层群众自治制度
  type: Concept
  subject: 道德与法治
  title: 基层群众自治制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把村委会、居委会当作国家基层政权机关
    - 能指出并纠正这一错误：误认为基层群众自治制度是根本政治制度
  aliases:
    - 基层自治制度
  category: 政治制度
  explanation: 我国的一项基本政治制度，居民委员会和村民委员会是基层群众性自治组织，实行民主选举、民主协商、民主决策、民主管理、民主监督。
  misconceptions:
    - 把村委会、居委会当作国家基层政权机关
    - 误认为基层群众自治制度是根本政治制度
    - 认为基层事务由乡镇政府直接领导和干预，忽略村民自治
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:基本政治制度
  type: Concept
  subject: 道德与法治
  title: 基本政治制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人民代表大会制度归入基本政治制度
    - 能指出并纠正这一错误：认为基本政治制度只指多党合作和政治协商制度
  aliases: []
  category: 政治制度
  explanation: 包括中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。
  misconceptions:
    - 把人民代表大会制度归入基本政治制度
    - 认为基本政治制度只指多党合作和政治协商制度
    - 忽略基层群众自治制度也是基本政治制度之一
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:塞罕坝精神
  type: Concept
  subject: 道德与法治
  title: 塞罕坝精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把塞罕坝精神说成是‘北大荒精神’，混淆造林与垦荒。
    - 能指出并纠正这一错误：认为塞罕坝精神只属于林场建设者，普通学生无法继承。
  aliases: []
  category: 精神品质
  explanation: 牢记使命、艰苦创业、绿色发展的塞罕坝精神，创造了沙地变林海、荒原成绿洲的人间奇迹。
  misconceptions:
    - 把塞罕坝精神说成是‘北大荒精神’，混淆造林与垦荒。
    - 认为塞罕坝精神只属于林场建设者，普通学生无法继承。
    - 提到塞罕坝精神只说出‘艰苦奋斗’，漏掉‘牢记使命’‘绿色发展’。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:增强风险意识
  type: Concept
  subject: 道德与法治
  title: 增强风险意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得危险都是电视里的事，自己生活安全，所以好奇尝试玩火、野外游泳
    - 能指出并纠正这一错误：把风险意识等同于胆小怕事，嘲笑别人做准备是‘杞人忧天’
  aliases:
    - 风险意识
  category: 安全观
  explanation: 要能够觉察潜在的威胁生命安全的因素，不因好奇去做危险的事情，也不盲目触碰危险的领域，远离危险，方能平安生活。
  misconceptions:
    - 觉得危险都是电视里的事，自己生活安全，所以好奇尝试玩火、野外游泳
    - 把风险意识等同于胆小怕事，嘲笑别人做准备是‘杞人忧天’
    - 明知雨天在树下躲雨有危险，仍觉得‘就一次没事’
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:增进民生福祉
  type: Concept
  subject: 道德与法治
  title: 增进民生福祉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“增进民生福祉”当作发展的手段而不是目的，颠倒了目的与手段的关系
    - 能指出并纠正这一错误：认为增进民生福祉只是政府的事，个人无法也无须参与
  aliases:
    - 民生福祉
  category: 政治概念
  explanation: 发展的根本目的就是增进民生福祉，通过多谋民生之利、多解民生之忧，补齐民生短板，促进社会公平正义。
  misconceptions:
    - 把“增进民生福祉”当作发展的手段而不是目的，颠倒了目的与手段的关系
    - 认为增进民生福祉只是政府的事，个人无法也无须参与
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:多种分配方式并存
  type: Concept
  subject: 道德与法治
  title: 多种分配方式并存
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为我国只实行按劳分配，不存在其他分配方式
    - 能指出并纠正这一错误：误以为资本、技术、管理等要素不能参与分配
  aliases:
    - 其他分配方式
  category: 分配制度
  explanation: 在按劳分配为主体的情况下，允许劳动、资本、土地、知识、技术、管理、数据等生产要素参与收入分配，以及社会保障收入等。
  misconceptions:
    - 认为我国只实行按劳分配，不存在其他分配方式
    - 误以为资本、技术、管理等要素不能参与分配
    - 把社会保障收入混同于按劳分配所得
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:大国重器的文化命名
  type: Concept
  subject: 道德与法治
  title: 大国重器的文化命名
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为神舟、蛟龙等命名只是凑巧，与中华优秀传统文化无关。
    - 能指出并纠正这一错误：把‘蛟龙’误认为恐龙，不知其源自古代神话，体现文化元素。
  aliases:
    - 科技命名文化
  category: 文化传承
  explanation: 如神舟、蛟龙、嫦娥等命名蕴含中华优秀传统文化元素，体现中国式浪漫。
  misconceptions:
    - 认为神舟、蛟龙等命名只是凑巧，与中华优秀传统文化无关。
    - 把‘蛟龙’误认为恐龙，不知其源自古代神话，体现文化元素。
    - 觉得命名只是为了好听，忽略其中蕴含的中国式浪漫和文化自信。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:大庆精神
  type: Concept
  subject: 道德与法治
  title: 大庆精神
  conceptType: 概念型
  aliases:
    - 铁人精神
  category: 观点
  explanation: 以王进喜为代表的大庆石油工人铸就的精神：爱国、创业、求实、奉献，也叫铁人精神。它体现了自力更生、艰苦奋斗的干劲。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:大杂居、小聚居、交错居住
  type: Concept
  subject: 道德与法治
  title: 大杂居、小聚居、交错居住
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘大杂居’误理解为仅指汉族和少数民族杂居，实际是各民族大范围交错居住。
    - 能指出并纠正这一错误：认为‘小聚居’是指少数民族只住在特定区域，忽略交错居住的特征。
  aliases: []
  category: 民族分布格局
  explanation: 我国各民族在长期历史发展中形成的分布特点，各民族交错居住，相互依存。
  misconceptions:
    - 把‘大杂居’误理解为仅指汉族和少数民族杂居，实际是各民族大范围交错居住。
    - 认为‘小聚居’是指少数民族只住在特定区域，忽略交错居住的特征。
    - 误以为只有少数民族聚居区才实行民族区域自治，忽略其他形式。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:大米的生产过程
  type: Concept
  subject: 道德与法治
  title: 大米的生产过程
  conceptType: 程序型
  aliases:
    - 大米哪里来
  category: 现象
  explanation: 一粒米要经过育秧、插秧、田间管理、收割、碾米等许多环节才能端上餐桌。每粒米都来之不易，我们要珍惜粮食。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:大自然的回报
  type: Concept
  subject: 道德与法治
  title: 大自然的回报
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 大自然会给勤劳的人丰厚的回报：种下的稻谷变成米饭，蚕丝织成丝绸。我们吃的东西、用的东西都离不开大自然的礼物。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:大自然的语言
  type: Concept
  subject: 道德与法治
  title: 大自然的语言
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 大自然会用现象告诉我们信息：白云飘得高可能是晴天，蚂蚁搬家可能要下雨，大雁南飞是秋天来了，树的年轮一圈就是一年。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:天下兴亡、匹夫有责的担当意识
  type: Concept
  subject: 道德与法治
  title: 天下兴亡、匹夫有责的担当意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘天下兴亡、匹夫有责’中的‘匹夫’仅指成年男子，与学生无关。
    - 能指出并纠正这一错误：把担当责任等同于放弃个人利益，认为有担当就不能为自己着想。
  aliases:
    - 担当意识
  category: 道德与法治
  explanation: 担当意识要求每个人明确认识到自己的人伦职责，担负起对家庭、社会、国家的责任，兼济天下。
  misconceptions:
    - 认为‘天下兴亡、匹夫有责’中的‘匹夫’仅指成年男子，与学生无关。
    - 把担当责任等同于放弃个人利益，认为有担当就不能为自己着想。
    - 认为天下兴亡是国家的事，个人渺小无力，因此不承担任何责任。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:太和
  type: Concept
  subject: 道德与法治
  title: 太和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘太和’混同于‘太平’，不知其指天地万物和谐的最理想状态。
    - 能指出并纠正这一错误：认为‘太和’只是故宫太和殿的名称，与哲学思想无关。
  aliases:
    - 泰和
  category: 哲学概念
  explanation: “太和”即泰和，是天地万物和谐的最理想状态，对于人来讲是人类生存发展的最高境界，即天人合一之境。
  misconceptions:
    - 把‘太和’混同于‘太平’，不知其指天地万物和谐的最理想状态。
    - 认为‘太和’只是故宫太和殿的名称，与哲学思想无关。
    - 误将‘太和’理解为事事顺遂，而非人与自然的和谐统一。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:奋斗精神
  type: Concept
  subject: 道德与法治
  title: 奋斗精神
  conceptType: 概念型
  aliases:
    - 奋斗精神薪火相传
  category: 观点
  explanation: 中华民族具有不畏艰难、坚韧不拔、不怕挫折的奋斗精神。这种精神一代一代传下来，让国家越来越强大。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:妈祖文化
  type: Concept
  subject: 道德与法治
  title: 妈祖文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把妈祖文化简单归为‘迷信活动’，忽视其作为中华文化精神纽带的作用。
    - 能指出并纠正这一错误：认为妈祖文化只流行于福建和台湾，忽略其在海内外华人中的广泛影响。
  aliases:
    - 妈祖信俗
  category: 文化现象
  explanation: 以妈祖信仰为核心的文化，是凝聚海内外华人的精神纽带，对促进祖国统一有积极意义。
  misconceptions:
    - 把妈祖文化简单归为‘迷信活动’，忽视其作为中华文化精神纽带的作用。
    - 认为妈祖文化只流行于福建和台湾，忽略其在海内外华人中的广泛影响。
    - 割裂妈祖文化与祖国统一的联系，看不到其凝聚共识的积极意义。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:威胁和平的因素
  type: Concept
  subject: 道德与法治
  title: 威胁和平的因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为霸权主义和强权政治是同一回事，忽视强权政治侧重干涉他国内政
    - 能指出并纠正这一错误：将民族问题、宗教冲突一律归为恐怖主义，以偏概全
  aliases: []
  category: 政治
  explanation: 包括霸权主义、强权政治、民族问题、宗教冲突、领土争端和恐怖主义等。
  misconceptions:
    - 认为霸权主义和强权政治是同一回事，忽视强权政治侧重干涉他国内政
    - 将民族问题、宗教冲突一律归为恐怖主义，以偏概全
    - 觉得领土争端只是国家间一般矛盾，不会升级为和平威胁
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:媒介素养
  type: Concept
  subject: 道德与法治
  title: 媒介素养
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：会用手机电脑上网刷视频，就认为自己媒介素养很高。
    - 能指出并纠正这一错误：认为媒介素养只是新闻工作者才需要，普通人用不着。
  aliases: []
  category: 道德与法治
  explanation: 媒介素养是指人们正确选择、理解、使用和批判性评价各种媒介信息的能力。
  misconceptions:
    - 会用手机电脑上网刷视频，就认为自己媒介素养很高。
    - 认为媒介素养只是新闻工作者才需要，普通人用不着。
    - 把媒介素养等同于会制作短视频或会发朋友圈。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:孝亲敬老
  type: Concept
  subject: 道德与法治
  title: 孝亲敬老
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为孝亲敬老只是道德要求，不赡养父母也不违法。
    - 能指出并纠正这一错误：以为赡养父母只需给钱，不用常回家看看。
  aliases:
    - 孝敬父母
  category: 道德与法治
  explanation: 孝亲敬老是中华民族传统美德，也是公民的法定义务，包括赡养扶助父母等。
  misconceptions:
    - 认为孝亲敬老只是道德要求，不赡养父母也不违法。
    - 以为赡养父母只需给钱，不用常回家看看。
    - 觉得未成年学生等长大后再孝亲敬老也不迟。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:孝悌忠信、礼义廉耻
  type: Concept
  subject: 道德与法治
  title: 孝悌忠信、礼义廉耻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘悌’理解为朋友间的友爱，不知其本义是对兄长的敬爱。
    - 能指出并纠正这一错误：认为‘忠’就是无条件服从，连错误的命令也照办。
  aliases:
    - 八德
  category: 道德与法治
  explanation: 这是中华优秀传统文化中做人的基本道德准则，分别指对父母长辈的尊重、对兄长的敬爱、尽心竭力、讲诚信、懂礼貌、符合道义、廉洁奉公、有羞耻之心。
  misconceptions:
    - 把‘悌’理解为朋友间的友爱，不知其本义是对兄长的敬爱。
    - 认为‘忠’就是无条件服从，连错误的命令也照办。
    - 将‘耻’等同于害羞，忽略其判断是非的羞耻之心。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:孝悌忠信、礼义廉耻的荣辱观念
  type: Concept
  subject: 道德与法治
  title: 孝悌忠信、礼义廉耻的荣辱观念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为荣辱标准因人而异，以个人好恶判断荣辱，缺乏统一是非观。
    - 能指出并纠正这一错误：把荣辱观念等同为法律条文，不知其渗透在生活各方面的道德判断。
  aliases: []
  category: 道德观念
  explanation: 判断一切是非、善恶、荣辱的标准，以遵守道德为荣，以违背道德为耻，渗透在生活方方面面。
  misconceptions:
    - 认为荣辱标准因人而异，以个人好恶判断荣辱，缺乏统一是非观。
    - 把荣辱观念等同为法律条文，不知其渗透在生活各方面的道德判断。
    - 以财富多少定荣辱，觉得有钱就光荣，没钱就丢人。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:孝老爱亲
  type: Concept
  subject: 道德与法治
  title: 孝老爱亲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为孝就是给父母钱，忽略陪伴和精神关爱。
    - 能指出并纠正这一错误：把孝老爱亲局限于自己家人，拒绝帮助邻里老人。
  aliases: []
  category: 道德与法治
  explanation: 百善孝为先，孝敬老人、爱护亲人，并将爱的情感和责任扩展到全社会。
  misconceptions:
    - 认为孝就是给父母钱，忽略陪伴和精神关爱。
    - 把孝老爱亲局限于自己家人，拒绝帮助邻里老人。
    - 误以为爱亲就是无条件纵容，甚至包庇亲人的错误。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:学习压力
  type: Concept
  subject: 道德与法治
  title: 学习压力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为学习压力越大越好，能逼自己进步，结果焦虑过度。
    - 能指出并纠正这一错误：把压力当作自己能力不足的证明，一有压力就自暴自弃。
  aliases:
    - 考试压力
  category: 心理健康
  explanation: 学习压力是正常心理现象，要坦然面对，并学会缓解方法。
  misconceptions:
    - 认为学习压力越大越好，能逼自己进步，结果焦虑过度。
    - 把压力当作自己能力不足的证明，一有压力就自暴自弃。
    - 认为缓解压力就是逃避学习，彻底放松不看书。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:学习宪法
  type: Concept
  subject: 道德与法治
  title: 学习宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为学习宪法只需背诵条文，不需理解原则和精神。
    - 能指出并纠正这一错误：认为只有法律职业者才需要学习宪法，普通人无需了解。
  aliases: []
  category: 法律实践
  explanation: 了解宪法产生和发展历程，理解主要内容，领会原则和精神，参与宣传活动。
  misconceptions:
    - 认为学习宪法只需背诵条文，不需理解原则和精神。
    - 认为只有法律职业者才需要学习宪法，普通人无需了解。
    - 在宪法宣传活动中只注重形式，不关注宪法内容。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:学习方法
  type: Concept
  subject: 道德与法治
  title: 学习方法
  conceptType: 程序型
  aliases:
    - 好的学习方法
  category: 方法
  explanation: 要想学得好，掌握方法很重要，好的方法能让学习事半功倍，比如课前预习、专心听讲、课后复习。适合自己的学习方法就是最好的。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:学习是一种生活方式
  type: Concept
  subject: 道德与法治
  title: 学习是一种生活方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为学习只是学生时代的事，毕业后无需再学习。
    - 能指出并纠正这一错误：把学习等同于上学，认为辍学就不用学习了。
  aliases:
    - 终身学习
  category: 学习观念
  explanation: 学习是权利、责任和义务，是适应未来社会需要的能力，应成为生活方式。
  misconceptions:
    - 认为学习只是学生时代的事，毕业后无需再学习。
    - 把学习等同于上学，认为辍学就不用学习了。
    - 觉得终身学习只是脑力劳动者的事，与自己无关。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:学习的快乐
  type: Concept
  subject: 道德与法治
  title: 学习的快乐
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 学习能让我们增长知识、掌握技能、开阔眼界。在学习和活动中取得进步，能收获满满的快乐。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:学习的途径
  type: Concept
  subject: 道德与法治
  title: 学习的途径
  conceptType: 概念型
  aliases:
    - 处处可学习
  category: 方法
  explanation: 课堂学习是学习的主要途径，但生活中处处可以学习，比如读书看报、观察自然、与人交往。做事也能长本领，很多本领是在动手做中学来的。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:学习防护和急救的知识与技能
  type: Concept
  subject: 道德与法治
  title: 学习防护和急救的知识与技能
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为急救是医生的事，自己学了也没机会用，所以不愿花时间学
    - 能指出并纠正这一错误：只在网上看心肺复苏视频，觉得看过就会了，从不实操练习
  aliases:
    - 急救技能
  category: 安全观
  explanation: 平时多掌握防护和急救的知识与技能，在紧急救护时能争分夺秒地施救，为挽救生命赢得宝贵时间。
  misconceptions:
    - 认为急救是医生的事，自己学了也没机会用，所以不愿花时间学
    - 只在网上看心肺复苏视频，觉得看过就会了，从不实操练习
    - 觉得急救知识太复杂记不住，索性放弃学习
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:学人之长避人之短
  type: Concept
  subject: 道德与法治
  title: 学人之长避人之短
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 向别人学习时，要学他的长处，不学他的短处。比如学同学热爱劳动，但不学他粗心大意。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:学做家务的方法
  type: Concept
  subject: 道德与法治
  title: 学做家务的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 会做的家务经常做，不会做的学着做。可以请家人教小窍门，忘了就看看家务提示表。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:学先锋做先锋
  type: Concept
  subject: 道德与法治
  title: 学先锋做先锋
  conceptType: 概念型
  aliases:
    - 学先锋 长大做先锋
  category: 观点
  explanation: 雷锋和新时代好少年是我们学习的榜样，我们要从一点一滴的小事做起，懂感恩、敢创新、乐奉献。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:守护正义的要求
  type: Concept
  subject: 道德与法治
  title: 守护正义的要求
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为守护正义只需勇气，无需智慧，遇违法行为盲目硬拼，如徒手夺刀。
    - 能指出并纠正这一错误：把见义智为当成胆小怕事，认为只有流血冲突才算真正勇敢。
  aliases:
    - 如何守护正义
  category: 道德概念
  explanation: 守护正义需要勇气和智慧，要敢于斗争、善于见义智为，同时需要维护司法公正和国际正义。
  misconceptions:
    - 认为守护正义只需勇气，无需智慧，遇违法行为盲目硬拼，如徒手夺刀。
    - 把见义智为当成胆小怕事，认为只有流血冲突才算真正勇敢。
    - 认为守护正义只是司法机关的责任，普通公民遇到不公只能旁观，不能作为。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:守法光荣、违法可耻
  type: Concept
  subject: 道德与法治
  title: 守法光荣、违法可耻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“大错不犯、小错不断”不算违法，考试作弊未被抓就不可耻。
    - 能指出并纠正这一错误：觉得守法光荣是空话，只有被抓被判刑才叫违法，平时占小便宜不丢人。
  aliases: []
  category: 法治观念
  explanation: 树立守法光荣、违法可耻的观念，从细节抓起、从小事做起，自觉践行社会主义核心价值观。
  misconceptions:
    - 认为“大错不犯、小错不断”不算违法，考试作弊未被抓就不可耻。
    - 觉得守法光荣是空话，只有被抓被判刑才叫违法，平时占小便宜不丢人。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S6.md
- id: concept:道德与法治:守诚信
  type: Concept
  subject: 道德与法治
  title: 守诚信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要说的都是真话就算诚信，忽略‘说到做到’的言行一致。
    - 能指出并纠正这一错误：把善意的谎言全部视为不诚信，不知诚信需结合情境。
  aliases:
    - 诚信
  category: 核心思想理念
  explanation: 要求真实无欺、言行一致，树立诚信意识。
  misconceptions:
    - 认为只要说的都是真话就算诚信，忽略‘说到做到’的言行一致。
    - 把善意的谎言全部视为不诚信，不知诚信需结合情境。
    - 认为对骗子也要诚信，不懂在特殊情况下需保护自己。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:安全健康地玩
  type: Concept
  subject: 道德与法治
  title: 安全健康地玩
  conceptType: 概念型
  aliases:
    - 玩得安全又健康
  category: 观点
  explanation: 不是所有东西都能当玩具，玩的时候要珍爱生命、注意安全。户外游戏要注意安全，万一受伤了要知道怎么办。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:安排课后时间
  type: Concept
  subject: 道德与法治
  title: 安排课后时间
  conceptType: 程序型
  aliases:
    - 课后时光安排
    - 美好的课后时光
  category: 方法
  explanation: 课后时光要合理安排：先做重要的事，再参加社团、读自己喜欢的书。还要找到自己的兴趣。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:完善自己
  type: Concept
  subject: 道德与法治
  title: 完善自己
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只盯着缺点，觉得自己一无是处，忽略自身优点。
    - 能指出并纠正这一错误：认为完善自己就是变成另一个人，完全模仿榜样。
  aliases: []
  category: 自我发展
  explanation: 发挥优点，改正缺点，向他人学习，丰富和发展自己。
  misconceptions:
    - 只盯着缺点，觉得自己一无是处，忽略自身优点。
    - 认为完善自己就是变成另一个人，完全模仿榜样。
    - 改正缺点时把优点也否定，如‘太内向不好，就强迫自己外向’。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:完善规则
  type: Concept
  subject: 道德与法治
  title: 完善规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为规则一经制定就永远不能修改，改规则就是朝令夕改
    - 能指出并纠正这一错误：觉得修改规则是政府的事，中学生提建议就是多管闲事
  aliases: []
  category: 道德与法治
  explanation: 规则不是一成不变的，随着社会发展需要制定、废除或调整规则，要积极参与规则的改进和完善。
  misconceptions:
    - 认为规则一经制定就永远不能修改，改规则就是朝令夕改
    - 觉得修改规则是政府的事，中学生提建议就是多管闲事
    - 以不符合自己利益为由直接不遵守规则，却不肯通过正规渠道提议修改
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:宗教信仰自由
  type: Concept
  subject: 道德与法治
  title: 宗教信仰自由
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宗教信仰自由就是在任何场合自由传教，不受限制。
    - 能指出并纠正这一错误：以为宗教活动可以不受法律约束，想怎么做就怎么做。
  aliases: []
  category: 法律概念
  explanation: 宗教信仰自由是公民的基本权利之一，公民有信仰宗教的自由，国家保障公民的宗教信仰自由。
  misconceptions:
    - 认为宗教信仰自由就是在任何场合自由传教，不受限制。
    - 以为宗教活动可以不受法律约束，想怎么做就怎么做。
    - 误认为学生可以在校园内进行宗教活动，不受学校管理。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:实事求是
  type: Concept
  subject: 道德与法治
  title: 实事求是
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 毛泽东思想的精髓。“实事”就是实际和实情，“求是”就是在了解实际、掌握实情的基础上，探求事物发展的规律。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:实干才能梦想成真
  type: Concept
  subject: 道德与法治
  title: 实干才能梦想成真
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 幸福不会从天而降，梦想不能只靠想，要靠实干。从现在做起，一点一点努力，梦想才能实现。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:实现梦想从学习开始
  type: Concept
  subject: 道德与法治
  title: 实现梦想从学习开始
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 要实现梦想，先要珍惜时光、好好学习，像海绵吸水一样学知识。既学课本知识，也参加户外活动长本领。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:实现目标的方法
  type: Concept
  subject: 道德与法治
  title: 实现目标的方法
  conceptType: 程序型
  aliases:
    - 细化目标
  category: 方法
  explanation: 把大目标分细一点儿，再订个小计划，每天坚持做，目标就容易实现。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法
  type: Concept
  subject: 道德与法治
  title: 宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宪法是普通法律的汇总，包含所有具体法律条文。
    - 能指出并纠正这一错误：认为宪法与普通法律地位相同，只是内容不同。
  aliases:
    - 国家根本法
  category: 法律概念
  explanation: 宪法是国家的根本法，具有最高的法律地位、法律权威和法律效力，规定国家性质、根本制度、根本任务、公民基本权利和义务等根本问题。
  misconceptions:
    - 认为宪法是普通法律的汇总，包含所有具体法律条文。
    - 认为宪法与普通法律地位相同，只是内容不同。
    - 认为宪法规定了一切具体问题，无需其他法律。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法与公民生活
  type: Concept
  subject: 道德与法治
  title: 宪法与公民生活
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宪法距离日常生活遥远，只在打官司时才有关。
    - 能指出并纠正这一错误：认为宪法只约束国家权力，不约束公民个人行为。
  aliases: []
  category: 法律概念
  explanation: 宪法与每个人息息相关，公民应依据宪法行使权利、履行义务，增强宪法意识，维护宪法权威。
  misconceptions:
    - 认为宪法距离日常生活遥远，只在打官司时才有关。
    - 认为宪法只约束国家权力，不约束公民个人行为。
    - 认为违反宪法只是违法问题，不会受到任何处罚。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法与其他法律的关系
  type: Concept
  subject: 道德与法治
  title: 宪法与其他法律的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为普通法律可以修改宪法，只要立法机关通过即可。
    - 能指出并纠正这一错误：认为当普通法与宪法冲突时，应优先适用普通法。
  aliases: []
  category: 法律概念
  explanation: 宪法是国家一切法律法规的总依据、总源头，其他法律不得与宪法相抵触。
  misconceptions:
    - 认为普通法律可以修改宪法，只要立法机关通过即可。
    - 认为当普通法与宪法冲突时，应优先适用普通法。
    - 认为宪法只是原则性规定，不具体，不能作为判案依据。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法保障
  type: Concept
  subject: 道德与法治
  title: 宪法保障
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宪法包含了所有法律的具体条文，把民法典、刑法条款当成宪法规定。
    - 能指出并纠正这一错误：认为有了宪法保障，公民权利就自动实现，不需要其他法律和制度配套。
  aliases:
    - 宪法
  category: 法治概念
  explanation: 宪法是国家的根本法，是公民权利的保障书，社会主义民主的发展需要宪法保障。
  misconceptions:
    - 认为宪法包含了所有法律的具体条文，把民法典、刑法条款当成宪法规定。
    - 认为有了宪法保障，公民权利就自动实现，不需要其他法律和制度配套。
    - 以为宪法保障就是政府可随意制定法律来保护公民，把宪法当成政府的工具。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:宪法修正案
  type: Concept
  subject: 道德与法治
  title: 宪法修正案
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宪法修正案是独立于宪法的法律，如把'第五修正案'当成一项单行法律。
    - 能指出并纠正这一错误：以为修宪5次等于有52条修正案，混淆次数与条数。
  aliases: []
  category: 法律概念
  explanation: 对宪法进行修改的议案，我国现行宪法已通过5次修正，共52条修正案。
  misconceptions:
    - 认为宪法修正案是独立于宪法的法律，如把'第五修正案'当成一项单行法律。
    - 以为修宪5次等于有52条修正案，混淆次数与条数。
    - 认为修正案可以任意改变宪法基本原则，如删除'社会主义制度'。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法和法律委员会
  type: Concept
  subject: 道德与法治
  title: 宪法和法律委员会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为该委员会能直接修改宪法，实际上它只负责推动实施和监督。
    - 能指出并纠正这一错误：把宪法和法律委员会当作最高权力机关，与全国人大混为一谈。
  aliases: []
  category: 国家机构
  explanation: 全国人大设立的专门委员会，负责推动宪法实施、开展宪法解释、推进合宪性审查、加强宪法监督等。
  misconceptions:
    - 认为该委员会能直接修改宪法，实际上它只负责推动实施和监督。
    - 把宪法和法律委员会当作最高权力机关，与全国人大混为一谈。
    - 认为它有权解释宪法，实际解释权属于全国人大常委会。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法宣传教育
  type: Concept
  subject: 道德与法治
  title: 宪法宣传教育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要背诵宪法条文就算宣传教育，忽视对宪法精神的理解。
    - 能指出并纠正这一错误：以为宣传教育只针对学生，国家工作人员不必参与。
  aliases: []
  category: 法律实践
  explanation: 通过多种途径和活动增强人们的宪法意识，包括尊崇宪法、学习宪法、遵守宪法、维护宪法、运用宪法。
  misconceptions:
    - 认为只要背诵宪法条文就算宣传教育，忽视对宪法精神的理解。
    - 以为宣传教育只针对学生，国家工作人员不必参与。
    - 将宪法宣传教育等同于宪法宣誓，认为宣誓就是全部教育。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法宣誓制度
  type: Concept
  subject: 道德与法治
  title: 宪法宣誓制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为不宣誓就不能任职，实际宣誓不决定任职效力。
    - 能指出并纠正这一错误：把宣誓当作走形式，认为宣誓后可以随意违反宪法。
  aliases: []
  category: 法律制度
  explanation: 国家工作人员就职时应当依照法律规定公开进行宪法宣誓，以彰显宪法权威。
  misconceptions:
    - 认为不宣誓就不能任职，实际宣誓不决定任职效力。
    - 把宣誓当作走形式，认为宣誓后可以随意违反宪法。
    - 认为所有公民都应宣誓，实际仅限国家工作人员就职时。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法意识
  type: Concept
  subject: 道德与法治
  title: 宪法意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宪法意识就是记住宪法条文，缺少对宪法价值的认同。
    - 能指出并纠正这一错误：以为只有法官、律师需要宪法意识，普通公民无需具备。
  aliases: []
  category: 法律概念
  explanation: 人们对宪法的认知、认同和尊重，是实施宪法的重要基础。
  misconceptions:
    - 认为宪法意识就是记住宪法条文，缺少对宪法价值的认同。
    - 以为只有法官、律师需要宪法意识，普通公民无需具备。
    - 将宪法意识等同于一般的法律意识，没有突出根本法地位。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法法律至上
  type: Concept
  subject: 道德与法治
  title: 宪法法律至上
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“有权就可以变通”，比如家长或老师可以随意翻看手机，因为“我是监护人”。
    - 能指出并纠正这一错误：觉得宪法离生活很远，不如刑法、民法具体，所以宪法无关紧要。
  aliases: []
  category: 法治观念
  explanation: 坚持宪法法律至上，敬畏法律规则，相信法律的力量，牢固树立法律红线不能触碰、法律底线不可逾越的观念。
  misconceptions:
    - 认为“有权就可以变通”，比如家长或老师可以随意翻看手机，因为“我是监护人”。
    - 觉得宪法离生活很远，不如刑法、民法具体，所以宪法无关紧要。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S6.md
- id: concept:道德与法治:宪法监督
  type: Concept
  subject: 道德与法治
  title: 宪法监督
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全国人大有权解释宪法，实际解释权属全国人大常委会。
    - 能指出并纠正这一错误：以为任何国家机关都能监督宪法实施，如认为国务院也可监督。
  aliases:
    - 宪法实施监督
  category: 法律概念
  explanation: 全国人大及其常委会行使监督宪法实施的职权，全国人大常委会有权解释宪法和法律，对于违反宪法的行为予以追究和纠正。
  misconceptions:
    - 认为全国人大有权解释宪法，实际解释权属全国人大常委会。
    - 以为任何国家机关都能监督宪法实施，如认为国务院也可监督。
    - 将合宪性审查与违宪审查混同，误以为法院能审查法律是否违宪。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:宪法规范国家权力
  type: Concept
  subject: 道德与法治
  title: 宪法规范国家权力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宪法只授予权力，不为权力设定界限，如以为政府可任意行使。
    - 能指出并纠正这一错误：将'规范国家权力'理解为'规范公民行为'，颠倒对象。
  aliases: []
  category: 法治原则
  explanation: 宪法通过设置国家机构，授予职权，规范权力运行，将权力关进制度的笼子。
  misconceptions:
    - 认为宪法只授予权力，不为权力设定界限，如以为政府可任意行使。
    - 将'规范国家权力'理解为'规范公民行为'，颠倒对象。
    - 以为宪法对权力的规范没有强制力，只是一种口号。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:家乡
  type: Concept
  subject: 道德与法治
  title: 家乡
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 自己家所在的地方就是家乡。家乡有美丽的风景和动人的故事，我们要用心发现家乡的美。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:家乡发展中的问题
  type: Concept
  subject: 道德与法治
  title: 家乡发展中的问题
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 家乡在发展过程中也会出现一些问题，比如工厂设备落后倒闭、青壮年外出务工、农田被用来盖房等。面对问题不能回避，要共同想办法解决。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:家乡物产
  type: Concept
  subject: 道德与法治
  title: 家乡物产
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 家乡出产的东西叫物产，比如莲子、莲藕、年画、木雕。家乡的物产养育了我们。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:家乡的传统
  type: Concept
  subject: 道德与法治
  title: 家乡的传统
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 家乡变化很快，但有些传统一直在延续，比如糖画、风味小吃、地方戏。我们可以学一学，把家乡传统传下去。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:家乡的发展
  type: Concept
  subject: 道德与法治
  title: 家乡的发展
  conceptType: 概念型
  aliases:
    - 家乡发展
  category: 现象
  explanation: 家乡的发展带来了人们物质生活条件的巨大改善：房子变漂亮了，泥路变成水泥路，看病有了医疗保险。这些都是看得见、体会得到的。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:家乡的变化
  type: Concept
  subject: 道德与法治
  title: 家乡的变化
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 这几年家乡变化很大，有了读书的好去处、漂亮的运动场，新农村越来越美。我们要留心观察家乡的新鲜事。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:家乡的民间艺术
  type: Concept
  subject: 道德与法治
  title: 家乡的民间艺术
  conceptType: 概念型
  aliases:
    - 我们这里的民间艺术
  category: 文化常识
  explanation: 只要用心观察，身边也有令人骄傲的民间艺术，如余杭滚灯、甘肃庆阳香包、东北二人转等，它们满足了人们生活和审美的需要。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:家人的爱
  type: Concept
  subject: 道德与法治
  title: 家人的爱
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 家人的爱藏在日常小事里，比如半夜盖被子、梳辫子、寄生日礼物，家人之间要互相关爱。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:家人血脉相连
  type: Concept
  subject: 道德与法治
  title: 家人血脉相连
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 一家人血脉相连，每个人都很重要。即使有小矛盾，也会很快和好。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:家庭中的男女平等
  type: Concept
  subject: 道德与法治
  title: 家庭中的男女平等
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 在家庭生活中，每个成员无论男女都享有平等的权利，共同承担责任，互相尊重。这也是法律规定。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:家庭关系确立的几种情形
  type: Concept
  subject: 道德与法治
  title: 家庭关系确立的几种情形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有结婚生子才能确立家庭关系，收养、再婚都不算。
    - 能指出并纠正这一错误：以为家庭关系一旦确立就永远不能解除，如离婚后父子关系仍存但错误认为解除。
  aliases:
    - 家庭关系的确立
  category: 道德与法治
  explanation: 家庭关系可通过结婚、生育、收养、再婚等法定情形确立。
  misconceptions:
    - 认为只有结婚生子才能确立家庭关系，收养、再婚都不算。
    - 以为家庭关系一旦确立就永远不能解除，如离婚后父子关系仍存但错误认为解除。
    - 认为抱养的孩子与亲生父母仍保留法律上的家庭关系。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:家庭对个人成长的作用
  type: Concept
  subject: 道德与法治
  title: 家庭对个人成长的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为家庭教育只在幼儿时期重要，长大后就没用了。
    - 能指出并纠正这一错误：误以为家庭只是提供吃住的地方，教育主要靠学校。
  aliases:
    - 家庭的教育功能
  category: 道德与法治
  explanation: 家庭是第一所学校，父母是第一任老师，家庭教育对个人成长具有奠基作用。
  misconceptions:
    - 认为家庭教育只在幼儿时期重要，长大后就没用了。
    - 误以为家庭只是提供吃住的地方，教育主要靠学校。
    - 认为家庭氛围好坏不影响个人成长，只要自己努力就行。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:家庭的含义
  type: Concept
  subject: 道德与法治
  title: 家庭的含义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为住在一起的亲戚才算家庭，不住一起就不算。
    - 能指出并纠正这一错误：把家庭等同于户籍本上的成员，忽略婚姻和收养关系。
  aliases:
    - 家的定义
  category: 道德与法治
  explanation: 家庭是由婚姻关系、血缘关系或收养关系结合成的亲属生活组织，是生命的居所和心灵的港湾。
  misconceptions:
    - 认为住在一起的亲戚才算家庭，不住一起就不算。
    - 把家庭等同于户籍本上的成员，忽略婚姻和收养关系。
    - 认为只有血缘关系才是家庭，非血缘收养不算家庭。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:家庭的社会功能
  type: Concept
  subject: 道德与法治
  title: 家庭的社会功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为家庭是私领域，怎么相处与社会无关。
    - 能指出并纠正这一错误：以为家庭和睦只是自家事，不会影响社会安定。
  aliases:
    - 家庭与社会的关系
  category: 道德与法治
  explanation: 家庭是社会的细胞，家庭和睦则社会安定，家庭幸福则社会祥和，家庭文明则社会文明。
  misconceptions:
    - 认为家庭是私领域，怎么相处与社会无关。
    - 以为家庭和睦只是自家事，不会影响社会安定。
    - 觉得家庭文明程度高，社会文明就自然高了，不用管社区。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:家庭联产承包责任制
  type: Concept
  subject: 道德与法治
  title: 家庭联产承包责任制
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 农村改革中实行的生产责任制，农民分田包干到户、分户经营、自负盈亏。它充分调动了农民的生产积极性，促进了农业生产的迅速发展。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:家庭责任
  type: Concept
  subject: 道德与法治
  title: 家庭责任
  conceptType: 概念型
  aliases:
    - 我也有责任
  category: 观点
  explanation: 在家庭中，大人和孩子都有各自的责任。承担家庭责任要有始有终，坚持负责到底。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:家风
  type: Concept
  subject: 道德与法治
  title: 家风
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为家风只由长辈决定，晚辈只能遵守。
    - 能指出并纠正这一错误：把家风理解成束缚人的家规，认为越严越好。
  aliases:
    - 家庭风气
  category: 道德与法治
  explanation: 家风是家庭传承的价值观念、道德规范等，潜移默化影响家庭成员，优良家风促进家庭幸福和社会和谐。
  misconceptions:
    - 认为家风只由长辈决定，晚辈只能遵守。
    - 把家风理解成束缚人的家规，认为越严越好。
    - 觉得家风看不见摸不着，对家庭成员没有实际影响。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:宽容
  type: Concept
  subject: 道德与法治
  title: 宽容
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把宽容当作纵容，认为朋友偷东西也应当无条件原谅，甚至帮忙隐瞒。
    - 能指出并纠正这一错误：认为宽容就是放弃原则，对损害公共利益的事也以“要大度”为由不追究。
  aliases:
    - 包容
  category: 道德品质
  explanation: 宽容是体谅和包容他人，不苛求他人，但宽容有原则，在道德底线和法律原则问题上不让步。
  misconceptions:
    - 把宽容当作纵容，认为朋友偷东西也应当无条件原谅，甚至帮忙隐瞒。
    - 认为宽容就是放弃原则，对损害公共利益的事也以“要大度”为由不追究。
    - 误以为宽容就是没有边界，任何过错都该不计较，包括触碰法律底线的行为。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:宽容是有限度的
  type: Concept
  subject: 道德与法治
  title: 宽容是有限度的
  conceptType: 概念型
  aliases:
    - 宽容的原则性
  category: 观点
  explanation: 宽容不是无限度地纵容和姑息迁就，而是有限度、有原则的。对欺负人、玩火等原则性错误不能宽容，否则可能造成严重后果。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:对他人负责
  type: Concept
  subject: 道德与法治
  title: 对他人负责
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为对他人负责就是事事顺从，如朋友抄作业也帮忙打掩护，不敢指出错误。
    - 能指出并纠正这一错误：认为只对熟人负责，对陌生人求助冷漠拒绝，觉得与己无关。
  aliases: []
  category: 道德与法治
  explanation: 对他人负责要求我们平等、真诚对待他人，公正处事，心怀感恩、善待他人，主动关心、帮助和服务他人。
  misconceptions:
    - 认为对他人负责就是事事顺从，如朋友抄作业也帮忙打掩护，不敢指出错误。
    - 认为只对熟人负责，对陌生人求助冷漠拒绝，觉得与己无关。
    - 认为帮别人做完所有事才是负责，导致对方失去锻炼机会。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:对国家和社会负责
  type: Concept
  subject: 道德与法治
  title: 对国家和社会负责
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家大事离自己很远，如不参与班级事务，觉得那是老师的事。
    - 能指出并纠正这一错误：把个人利益置于国家利益之上，如不愿参加社会实践，觉得耽误学习。
  aliases: []
  category: 道德与法治
  explanation: 国家发展、社会进步离不开每个人的担当和奉献，我们要有强烈的主人翁意识和社会责任感，将个人成长进步与国家社会发展紧密结合。
  misconceptions:
    - 认为国家大事离自己很远，如不参与班级事务，觉得那是老师的事。
    - 把个人利益置于国家利益之上，如不愿参加社会实践，觉得耽误学习。
    - 认为只有成年人才能为国家做贡献，中学生只需要好好学习。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:对外开放新格局
  type: Concept
  subject: 道德与法治
  title: 对外开放新格局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新格局就是扩大进口和出口规模，忽视范围、领域和层次的拓展。
    - 能指出并纠正这一错误：只看到'引进来'，忽视'走出去'，或认为新格局只局限于沿海地区。
  aliases:
    - 全面开放新格局
  category: 政策格局
  explanation: 我国形成更大范围、更宽领域、更深层次对外开放新格局，推动贸易强国建设。
  misconceptions:
    - 认为新格局就是扩大进口和出口规模，忽视范围、领域和层次的拓展。
    - 只看到'引进来'，忽视'走出去'，或认为新格局只局限于沿海地区。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:对自己说话算数
  type: Concept
  subject: 道德与法治
  title: 对自己说话算数
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我们不仅要对别人说话算数，对自己下的决心也要努力做到，比如坚持练习、按时整理房间。这没有别人监督，只能靠自觉。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:对自己负责
  type: Concept
  subject: 道德与法治
  title: 对自己负责
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为对自己负责就是自由散漫，如不按时作息，觉得那是自己的事。
    - 能指出并纠正这一错误：把对自己负责与他人负责对立，如为了自己成绩好而不愿帮助同学。
  aliases: []
  category: 道德与法治
  explanation: 对自己负责有助于充分挖掘和发挥自己的潜能，更好地承担起对他人、社会和国家的责任。
  misconceptions:
    - 认为对自己负责就是自由散漫，如不按时作息，觉得那是自己的事。
    - 把对自己负责与他人负责对立，如为了自己成绩好而不愿帮助同学。
    - 认为学习是为了父母和老师，不是自己的责任，因而敷衍了事。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:尊敬老师
  type: Concept
  subject: 道德与法治
  title: 尊敬老师
  conceptType: 概念型
  aliases:
    - 与老师相处
  category: 观点
  explanation: 老师会帮助我们解决困难，我们要尊敬老师。进老师办公室前要先喊报告，得到帮助要说谢谢。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:尊法学法守法用法
  type: Concept
  subject: 道德与法治
  title: 尊法学法守法用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为尊法就是守法，只要不违法就算尊法，不尊重法律也没关系。
    - 能指出并纠正这一错误：认为“用法”就是打官司，平时小事用不上法律，比如消费时不会用消法维权。
  aliases:
    - 学法守法用法
  category: 法治意识
  explanation: 现代社会的公民应增强尊法学法守法用法意识，弘扬法治精神，强化规则意识，树立正确的权利义务观念。
  misconceptions:
    - 认为尊法就是守法，只要不违法就算尊法，不尊重法律也没关系。
    - 认为“用法”就是打官司，平时小事用不上法律，比如消费时不会用消法维权。
    - 认为法律只是约束罪犯的，未成年人不需要尊法学法守法用法。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:尊重他人
  type: Concept
  subject: 道德与法治
  title: 尊重他人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为尊重他人就是迎合他人，不敢提出不同意见。
    - 能指出并纠正这一错误：觉得同学之间熟了就无所谓，随意取笑对方缺陷不算不尊重。
  aliases: []
  category: 道德规范
  explanation: 尊重他人就要尊重他人的隐私和人格，不取笑、歧视他人，接纳他人不同的个性和处世风格，珍视他人的劳动和付出。
  misconceptions:
    - 认为尊重他人就是迎合他人，不敢提出不同意见。
    - 觉得同学之间熟了就无所谓，随意取笑对方缺陷不算不尊重。
    - 认为尊重他人只适用于陌生人或长辈，对朋友不必讲究。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:尊重他人的权利
  type: Concept
  subject: 道德与法治
  title: 尊重他人的权利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：给同学起侮辱性绰号，自认是'开玩笑'，却侵犯他人人格尊严
    - 能指出并纠正这一错误：不同意他人观点就恶语相向，认为'我有言论自由，想怎么说就怎么说'
  aliases: []
  category: 道德与法治
  explanation: 要尊重他人的自由选择权和人格尊严，不能把自己的观点和意志强加于人，更不能侮辱、诽谤他人。
  misconceptions:
    - 给同学起侮辱性绰号，自认是'开玩笑'，却侵犯他人人格尊严
    - 不同意他人观点就恶语相向，认为'我有言论自由，想怎么说就怎么说'
    - 随意翻看他人日记或手机，认为'我是为他好，看隐私没什么'
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:尊重劳动者
  type: Concept
  subject: 道德与法治
  title: 尊重劳动者
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 劳动没有高低贵贱之分，任何一份职业都很光荣。我们要平等地对待每一位劳动者。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:尊重并遵循生命存在和发展的规律
  type: Concept
  subject: 道德与法治
  title: 尊重并遵循生命存在和发展的规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人类可以征服自然、随意改造自然，不必敬畏自然规律
    - 能指出并纠正这一错误：把‘尊重规律’理解为消极认命，生病不治疗说听天由命
  aliases:
    - 遵循生命规律
  category: 生命观
  explanation: 敬畏生命就要尊重并遵循生命存在和发展的规律，效法天地自然，遵循自然界的规律，是对生命最好的珍视和善待。
  misconceptions:
    - 认为人类可以征服自然、随意改造自然，不必敬畏自然规律
    - 把‘尊重规律’理解为消极认命，生病不治疗说听天由命
    - 认为保护动物就是不能吃任何肉，把遵循规律和正常生活对立
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:尊重文化多样性
  type: Concept
  subject: 道德与法治
  title: 尊重文化多样性
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 不同国家的人会因为不了解对方文化而出现尴尬和矛盾，所以要首先了解差异、尊重差异。在认同自己文化的同时，以包容开放的态度对待其他文化，善于发现和欣赏其他文化之美。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:尊重自己
  type: Concept
  subject: 道德与法治
  title: 尊重自己
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 尊重自己包括自尊、自重、自爱和自我接纳，相信自己的价值，不自我贬低、不自卑。还表现为维护自己的形象、爱惜名誉、信守承诺。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:小康社会
  type: Concept
  subject: 道德与法治
  title: 小康社会
  conceptType: 概念型
  aliases:
    - 小康
  category: 概念
  explanation: 千百年来中国人对衣食无忧、平安幸福生活的向往和追求。改革开放之初，党中央提出小康社会的战略构想，党团结带领人民持续推进小康社会建设。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:少先队
  type: Concept
  subject: 道德与法治
  title: 少先队
  conceptType: 概念型
  aliases:
    - 中国少年先锋队
  category: 文化常识
  explanation: 少先队的全称是中国少年先锋队，它在党的领导下成立，一代代少先队员都在为国家强大作贡献。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:少先队作风
  type: Concept
  subject: 道德与法治
  title: 少先队作风
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 少先队的作风是诚实、勇敢、活泼、团结，少先队员要在队旗下努力做到。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:少先队队旗
  type: Concept
  subject: 道德与法治
  title: 少先队队旗
  conceptType: 概念型
  aliases:
    - 队旗
  category: 文化常识
  explanation: 五角星加火炬的红旗是少先队队旗：五角星代表中国共产党的领导，火炬象征光明，红旗象征革命胜利。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:少年强中国强
  type: Concept
  subject: 道德与法治
  title: 少年强中国强
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家发展主要由领导人决定，普通少年无足轻重。
    - 能指出并纠正这一错误：只把考上名校视为“强”，忽视品德、体魄、劳动等全面发展。
  aliases:
    - 青年与国家
  category: 道德与法治
  explanation: 青年兴则国家兴，青年强则国家强。青年一代有理想、有本领、有担当，国家就有前途，民族就有希望。
  misconceptions:
    - 认为国家发展主要由领导人决定，普通少年无足轻重。
    - 只把考上名校视为“强”，忽视品德、体魄、劳动等全面发展。
    - 认为先有国家强大才有个人发展，个人努力对国家没有影响。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:尚和合
  type: Concept
  subject: 道德与法治
  title: 尚和合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把尚和合理解为和稀泥，为避免冲突而无原则妥协。
    - 能指出并纠正这一错误：认为追求和谐就要消除所有差异，不懂多样性统一。
  aliases:
    - 和合
  category: 核心思想理念
  explanation: 追求和谐，强调多样性统一，正确看待差异与矛盾。
  misconceptions:
    - 把尚和合理解为和稀泥，为避免冲突而无原则妥协。
    - 认为追求和谐就要消除所有差异，不懂多样性统一。
    - 误以为和合就是一味忍让，放弃正当权益和原则。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:居民身份证
  type: Concept
  subject: 道德与法治
  title: 居民身份证
  conceptType: 概念型
  aliases:
    - 身份证
  category: 概念
  explanation: 居民身份证是证明公民身份的法定证件。公民身份号码由18位数字组成，是每个公民唯一的、终身不变的身份代码。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:展示精神面貌
  type: Concept
  subject: 道德与法治
  title: 展示精神面貌
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 认真地读、响亮地说、高兴地唱，坐立行走姿势优美，就能展现出好精神。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:崇德向善、见贤思齐
  type: Concept
  subject: 道德与法治
  title: 崇德向善、见贤思齐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘贤’仅指道德高尚，忽略才能出众、有贡献的人也应学习。
    - 能指出并纠正这一错误：认为向善就要默默无闻，批评那些通过媒体宣传善行的人。
  aliases:
    - 崇德向善、见贤思齐的社会风尚
  category: 道德与法治
  explanation: 中华民族自古就有尊崇道德、一心向善的优良传统，不断向有美德、有才能、有贡献的人学习。
  misconceptions:
    - 把‘贤’仅指道德高尚，忽略才能出众、有贡献的人也应学习。
    - 认为向善就要默默无闻，批评那些通过媒体宣传善行的人。
    - 把‘见贤思齐’理解为模仿他人的全部，包括缺点。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:崇正义
  type: Concept
  subject: 道德与法治
  title: 崇正义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把哥们义气当作正义，为朋友打架、包庇错误。
    - 能指出并纠正这一错误：认为坚持正义就是不顾一切后果，忽略方式方法。
  aliases:
    - 正义
  category: 核心思想理念
  explanation: 坚持做正确、符合道义的事，将道义置于优先位置。
  misconceptions:
    - 把哥们义气当作正义，为朋友打架、包庇错误。
    - 认为坚持正义就是不顾一切后果，忽略方式方法。
    - 将正义等同于法律条文，不知法律之外还有道义和公理。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:工业与我们的生活
  type: Concept
  subject: 道德与法治
  title: 工业与我们的生活
  conceptType: 概念型
  aliases:
    - 工业产品与生活
  category: 观点
  explanation: 家中用的、穿的很多东西都来自工业生产。工业产品的不断创新和发展，让我们的生活更加舒适和方便。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:工匠精神
  type: Concept
  subject: 道德与法治
  title: 工匠精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为工匠精神只属于传统手工艺行业，与科技、服务业无关
    - 能指出并纠正这一错误：把工匠精神理解为单纯重复劳动，忽视对品质的极致追求和创新
  aliases: []
  category: 职业道德
  explanation: 执着专注、精益求精、一丝不苟、追求卓越的精神。
  misconceptions:
    - 认为工匠精神只属于传统手工艺行业，与科技、服务业无关
    - 把工匠精神理解为单纯重复劳动，忽视对品质的极致追求和创新
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:差别对待
  type: Concept
  subject: 道德与法治
  title: 差别对待
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为给老人让座是对年轻人不公平，差别对待就是歧视。
    - 能指出并纠正这一错误：觉得残疾人优先购物侵犯了普通人的平等权利。
  aliases: []
  category: 道德与法治
  explanation: 对老人、儿童、孕妇、残疾人等给予特别关照，不违反平等原则，而是为了让他们获得实实在在的平等。
  misconceptions:
    - 认为给老人让座是对年轻人不公平，差别对待就是歧视。
    - 觉得残疾人优先购物侵犯了普通人的平等权利。
    - 认为孕妇可以免排队是特权，违背了同等情况同等对待。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:市场在资源配置中的决定性作用
  type: Concept
  subject: 道德与法治
  title: 市场在资源配置中的决定性作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为市场在国防、公共产品等所有领域都起决定性作用
    - 能指出并纠正这一错误：误以为市场调节是万能的，不存在自发性、盲目性等弊端
  aliases:
    - 市场机制
  category: 经济机制
  explanation: 在市场经济中，价格、供求、竞争等机制调节生产什么、如何生产、生产多少。
  misconceptions:
    - 认为市场在国防、公共产品等所有领域都起决定性作用
    - 误以为市场调节是万能的，不存在自发性、盲目性等弊端
    - 认为政府不再起任何作用，否定了科学宏观调控
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S7.md
- id: concept:道德与法治:师生交往的理想状态
  type: Concept
  subject: 道德与法治
  title: 师生交往的理想状态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为学生必须绝对服从老师，不能有不同意见。
    - 能指出并纠正这一错误：以为教学相长就是老师教学生，学生无需反馈。
  aliases:
    - 良好师生关系
  category: 道德与法治
  explanation: 彼此尊重、教学相长、携手共进是师生交往的理想状态。
  misconceptions:
    - 认为学生必须绝对服从老师，不能有不同意见。
    - 以为教学相长就是老师教学生，学生无需反馈。
    - 觉得老师与学生携手共进就是老师迁就学生。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:帮助他人要注意方式
  type: Concept
  subject: 道德与法治
  title: 帮助他人要注意方式
  conceptType: 概念型
  aliases:
    - 善于帮助别人
  category: 方法
  explanation: 关心他人要以尊重为前提，做到平等对待、尊重隐私和意愿、了解对方的真实需求、态度友善真诚。这样帮助才能真正帮到别人。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:帮助别人传递温暖
  type: Concept
  subject: 道德与法治
  title: 帮助别人传递温暖
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 别人帮了我，我也要去帮助别人，把温暖传递下去，大家互相帮助心里都暖暖的。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:常用求救电话
  type: Concept
  subject: 道德与法治
  title: 常用求救电话
  conceptType: 概念型
  aliases:
    - 急救电话
    - 报警电话
  category: 文化常识
  explanation: 受伤要叫救护车打120，遇到危险报警打110，着火了打119。紧急情况要学会求救。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:常见的购物场所
  type: Concept
  subject: 道德与法治
  title: 常见的购物场所
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 大型超市、专卖店、综合商场、集市和网上商店等都是常见的购物场所，它们各有特点，方便人们买到需要的商品。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:平等
  type: Concept
  subject: 道德与法治
  title: 平等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把平等等同于绝对平均，认为所有人无论情况如何都应获得完全相同的待遇。
    - 能指出并纠正这一错误：觉得给成绩好的学生额外辅导就是不平等，忽略了不同需要。
  aliases: []
  category: 道德与法治
  explanation: 平等是人类的崇高理想，是社会主义核心价值观的重要内容，意味着同等情况同等对待。
  misconceptions:
    - 把平等等同于绝对平均，认为所有人无论情况如何都应获得完全相同的待遇。
    - 觉得给成绩好的学生额外辅导就是不平等，忽略了不同需要。
    - 认为人人平等就是结果一样，比如每个人收入都相同才算平等。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:平等对待他人
  type: Concept
  subject: 道德与法治
  title: 平等对待他人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：对熟悉的人态度友好，对陌生人冷漠，觉得这不是不平等待人。
    - 能指出并纠正这一错误：认为成绩差的同学不值得尊重，嘲笑他们就是看不起。
  aliases: []
  category: 道德与法治
  explanation: 要平等地对待所有社会成员，尊重他人人格，不欺生、不凌弱。
  misconceptions:
    - 对熟悉的人态度友好，对陌生人冷漠，觉得这不是不平等待人。
    - 认为成绩差的同学不值得尊重，嘲笑他们就是看不起。
    - 只尊重有钱有势的人，对普通劳动者颐指气使。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:平等权
  type: Concept
  subject: 道德与法治
  title: 平等权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把平等权理解为结果绝对平均，认为对弱势群体特殊照顾是特权。
    - 能指出并纠正这一错误：认为任何差别对待都是歧视，如不同岗位工资不同。
  aliases: []
  category: 法律概念
  explanation: 平等权是指公民平等地享有权利，不受任何不合理的差别对待，要求国家在同等情况下给予同等保护的权利。它是公民行使其他权利的基础。
  misconceptions:
    - 把平等权理解为结果绝对平均，认为对弱势群体特殊照顾是特权。
    - 认为任何差别对待都是歧视，如不同岗位工资不同。
    - 忽略平等权是法律面前人人平等，误以为现实中所有差异都违背平等权。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:幸福源自奋斗
  type: Concept
  subject: 道德与法治
  title: 幸福源自奋斗
  conceptType: 概念型
  aliases:
    - 幸福生活是奋斗出来的
  category: 观点
  explanation: 幸福生活不是天上掉下来的，是人们用勤劳、智慧和勇气干出来的。奋斗本身就是一种幸福。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:庆祝劳动节的意义
  type: Concept
  subject: 道德与法治
  title: 庆祝劳动节的意义
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我们庆祝劳动节，是为了崇尚劳动、尊重劳动者、珍惜劳动果实。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:应对不开心的小妙招
  type: Concept
  subject: 道德与法治
  title: 应对不开心的小妙招
  conceptType: 程序型
  aliases:
    - 快乐小妙招
  category: 方法
  explanation: 每个人都会遇到不开心的事。可以从好的方面想一想，也可以踢球、画画，或把不开心讲给好朋友和爸爸妈妈听。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:应对欺负的方法
  type: Concept
  subject: 道德与法治
  title: 应对欺负的方法
  conceptType: 程序型
  aliases:
    - 遇到欺负怎么办
  category: 方法
  explanation: 被欺负时不能忍气吞声，否则欺负会变本加厉。在校内可以请同学主持公道、向老师求助；在校外要保持冷静，向大人求助，记住对方特征事后报警。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:建设美好家庭的要求
  type: Concept
  subject: 道德与法治
  title: 建设美好家庭的要求
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为建设美好家庭只是父母的责任，子女无需付出。
    - 能指出并纠正这一错误：误以为给家里添置贵重物品就是建设美好家庭。
  aliases:
    - 让家更美好
  category: 道德与法治
  explanation: 建设美好家庭需要用心体味亲情之爱、相互关爱彼此尊重、传承传统家庭美德、共同分担责任。
  misconceptions:
    - 认为建设美好家庭只是父母的责任，子女无需付出。
    - 误以为给家里添置贵重物品就是建设美好家庭。
    - 认为只要家庭成员身体健康，其他都不重要。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:开放的世界
  type: Concept
  subject: 道德与法治
  title: 开放的世界
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为当今世界所有国家都已完全开放，不存在任何封闭现象
    - 能指出并纠正这一错误：把开放的世界等同于经济全球化，忽略政治、文化领域的开放
  aliases: []
  category: 政治概念
  explanation: 国家间相互开放的程度不断加深，在政治、经济、文化等领域的开放范围不断扩展，但封锁、孤立、以邻为壑的现象仍然存在。
  misconceptions:
    - 认为当今世界所有国家都已完全开放，不存在任何封闭现象
    - 把开放的世界等同于经济全球化，忽略政治、文化领域的开放
    - 误将“以邻为壑”理解为邻里友好互助或保护环境
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:异性交往
  type: Concept
  subject: 道德与法治
  title: 异性交往
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把异性交往等同于早恋，认为跟异性说话就是不正常
    - 能指出并纠正这一错误：认为“把握好尺度”就是干脆不跟异性来往，把交往中的礼貌当成示好
  aliases:
    - 与异性交往
  category: 人际交往
  explanation: 与异性交往有积极作用，但需把握好尺度，注意方式、场合、时间和频率，做到言谈得当、举止得体。
  misconceptions:
    - 把异性交往等同于早恋，认为跟异性说话就是不正常
    - 认为“把握好尺度”就是干脆不跟异性来往，把交往中的礼貌当成示好
    - 在公共场合与异性打闹、搂抱，觉得这是关系好的表现
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:弘扬促进社会和谐的思想文化
  type: Concept
  subject: 道德与法治
  title: 弘扬促进社会和谐的思想文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为和谐就是无原则的一团和气，对错误言行也一味迁就，不敢批评。
    - 能指出并纠正这一错误：把'和而不同'当作'同而不和'，以为表面迎合就是和谐，背后却各行其是。
  aliases: []
  category: 思想文化
  explanation: 中华民族推崇“万物并育而不相害，道并行而不相悖”，主张“四海之内皆兄弟”，提倡人与人、人与社会和谐共处，应正确运用求同存异、和而不同的方法。
  misconceptions:
    - 认为和谐就是无原则的一团和气，对错误言行也一味迁就，不敢批评。
    - 把'和而不同'当作'同而不和'，以为表面迎合就是和谐，背后却各行其是。
    - 只讲人与人和睦，忽略人与社会、自然的和谐，如乱砍滥伐仍自称和谐。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:弘扬向上向善的思想文化
  type: Concept
  subject: 道德与法治
  title: 弘扬向上向善的思想文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得向上向善只是个人品德，与集体无关，如认为帮助同学是老师的事。
    - 能指出并纠正这一错误：把'立己达人'曲解为先自己成功再去帮人，其实成人之美也是成就自己。
  aliases: []
  category: 思想文化
  explanation: 立己达人，兼善天下。要积极进取，向着更高更远的目标努力奋进；爱人利人，择善而行，追求至善的人生境界。
  misconceptions:
    - 觉得向上向善只是个人品德，与集体无关，如认为帮助同学是老师的事。
    - 把'立己达人'曲解为先自己成功再去帮人，其实成人之美也是成就自己。
    - 以为'兼善天下'必须同时帮助所有人，做不到就索性不做，忽视身边小事。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:强国富民
  type: Concept
  subject: 道德与法治
  title: 强国富民
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“富民”等同于“发财”，认为只要经济收入高就是实现了富民
    - 能指出并纠正这一错误：认为强国与富民是两件事，可以只强国家不富百姓
  aliases: []
  category: 奋斗目标
  explanation: 一百多年来中华民族矢志不渝的奋斗目标，即实现国家富强、人民幸福。
  misconceptions:
    - 把“富民”等同于“发财”，认为只要经济收入高就是实现了富民
    - 认为强国与富民是两件事，可以只强国家不富百姓
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:强国必须强军
  type: Concept
  subject: 道德与法治
  title: 强国必须强军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把强国必须强军理解为只有军事强才能强国，忽略经济、科技等综合国力
    - 能指出并纠正这一错误：误认为国家发展了军事实力会自然增强，无需主动加强国防建设
  aliases: []
  category: 国防与军队建设
  explanation: 巩固国防和强大人民军队是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑。
  misconceptions:
    - 把强国必须强军理解为只有军事强才能强国，忽略经济、科技等综合国力
    - 误认为国家发展了军事实力会自然增强，无需主动加强国防建设
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:形神兼备、情景交融
  type: Concept
  subject: 道德与法治
  title: 形神兼备、情景交融
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'形'就是外形，'神'就是精神，把二者机械相加而不是融为一体，如写景再加句'我高兴'。
    - 能指出并纠正这一错误：以为情景交融只需有景有情，不必融合，如写导游词罗列景点却无情。
  aliases:
    - 形神兼备
    - 情景交融
  category: 美学追求
  explanation: 文艺作品既具美妙形态又富神韵，将思想情感与景物融为一体。
  misconceptions:
    - 认为'形'就是外形，'神'就是精神，把二者机械相加而不是融为一体，如写景再加句'我高兴'。
    - 以为情景交融只需有景有情，不必融合，如写导游词罗列景点却无情。
    - 将'形神兼备'等同于内容正确、修辞华丽，忽视内在神韵。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:形神兼备、情景交融的美学追求
  type: Concept
  subject: 道德与法治
  title: 形神兼备、情景交融的美学追求
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有古典诗词才讲形神兼备，现代白话文不需要，如认为鲁迅杂文不具此美。
    - 能指出并纠正这一错误：把情景交融与借景抒情等同，忽略交融是双向的，情与景互相映衬。
  aliases:
    - 形神兼备
    - 情景交融
  category: 美学追求
  explanation: 文艺作品追求形态与神韵兼备，将思想情感与外界景物融为一体，塑造独特审美。
  misconceptions:
    - 认为只有古典诗词才讲形神兼备，现代白话文不需要，如认为鲁迅杂文不具此美。
    - 把情景交融与借景抒情等同，忽略交融是双向的，情与景互相映衬。
    - 以为追求形神兼备就要堆砌辞藻，忽视平实语言也能形神兼备。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:律师事务所
  type: Concept
  subject: 道德与法治
  title: 律师事务所
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为聘请律师后就能保证无罪或胜诉，否则就投诉律师。
    - 能指出并纠正这一错误：以为律师必须揭发当事人所有罪行，忽略其辩护职责。
  aliases: []
  category: 法律组织
  explanation: 律师提供法律咨询、处理法律事务，接受委托担任代理人或辩护人。
  misconceptions:
    - 认为聘请律师后就能保证无罪或胜诉，否则就投诉律师。
    - 以为律师必须揭发当事人所有罪行，忽略其辩护职责。
    - 将律师事务所视为司法机关，认为律师有办案权力。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:德治对法治的支撑作用
  type: Concept
  subject: 道德与法治
  title: 德治对法治的支撑作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为道德是法律的前提，所有法律条文都直接从道德转化而来。
    - 能指出并纠正这一错误：夸大德治作用，认为只要道德水平高就不需要法治。
  aliases: []
  category: 法治
  explanation: 道德为法律创制提供伦理基础，为法律实施奠定社会基础，为法治文化提供源头活水，对法治体系的建立和运行具有重要支撑作用。
  misconceptions:
    - 认为道德是法律的前提，所有法律条文都直接从道德转化而来。
    - 夸大德治作用，认为只要道德水平高就不需要法治。
    - 误认为德治对法治的支撑是决定性的，法律必须服从道德。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:志愿者
  type: Concept
  subject: 道德与法治
  title: 志愿者
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 志愿者指不为获取物质报酬，主动承担社会责任，奉献个人时间和精力，开展有益于社会或个人的活动的人。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:怎样做到诚信
  type: Concept
  subject: 道德与法治
  title: 怎样做到诚信
  conceptType: 程序型
  aliases:
    - 讲诚信见行动
  category: 规则
  explanation: 讲诚信要见行动：下棋落子无悔，作业独立完成不抄袭，做错了说实话。有时坚守诚信会受考验，比如朋友想抄答案，也要坚持不说谎。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:怎样才能有精神
  type: Concept
  subject: 道德与法治
  title: 怎样才能有精神
  conceptType: 程序型
  aliases: []
  category: 观点
  explanation: 适当运动、好好睡觉、心情愉快，人就精神饱满。眼睛明亮、声音响亮、姿势端正也是有精神的样子。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:性知识获取
  type: Concept
  subject: 道德与法治
  title: 性知识获取
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只从网络短视频、不良网站获取性知识，觉得教材里的内容没用
    - 能指出并纠正这一错误：觉得问父母老师很尴尬，就自己胡乱猜测，甚至传播不实信息
  aliases:
    - 性教育
  category: 性教育
  explanation: 应通过正规途径获取性知识，如课堂、教材、科普读物，或向父母、老师咨询。
  misconceptions:
    - 只从网络短视频、不良网站获取性知识，觉得教材里的内容没用
    - 觉得问父母老师很尴尬，就自己胡乱猜测，甚至传播不实信息
    - 将性知识等同于羞耻的事，认为知道得越多越不正经
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:总体国家安全观
  type: Concept
  subject: 道德与法治
  title: 总体国家安全观
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把总体国家安全观理解为军事、领土等传统安全观的简单相加。
    - 能指出并纠正这一错误：觉得总体国家安全观的‘总体’就是所有领域平均用力，不存在核心。
  aliases:
    - 大安全观
  category: 观念
  explanation: 总体国家安全观强调“大安全”理念，涵盖政治、军事、国土、经济、文化、社会、科技、网络、生态、资源、核、海外利益、太空、深海、极地、生物等诸多领域，关键在“总体”。
  misconceptions:
    - 把总体国家安全观理解为军事、领土等传统安全观的简单相加。
    - 觉得总体国家安全观的‘总体’就是所有领域平均用力，不存在核心。
    - 将总体国家安全观等同于反间谍或保密工作，忽略其涵盖的广泛领域。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:总体国家安全观的核心要义
  type: Concept
  subject: 道德与法治
  title: 总体国家安全观的核心要义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘以人民安全为宗旨’当成核心要义的全部，忽略其他九个坚持。
    - 能指出并纠正这一错误：觉得核心要义就是坚持党对国家安全工作的绝对领导，其他坚持可有可无。
  aliases:
    - 十个坚持
  category: 原则
  explanation: 总体国家安全观的核心要义集中体现为“十个坚持”，包括坚持党对国家安全工作的绝对领导、坚持以人民安全为宗旨、坚持统筹发展和安全等。
  misconceptions:
    - 把‘以人民安全为宗旨’当成核心要义的全部，忽略其他九个坚持。
    - 觉得核心要义就是坚持党对国家安全工作的绝对领导，其他坚持可有可无。
    - 将总体国家安全观的核心要义与具体安全领域混为一谈，例如认为核心要义是网络安全。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S5.md
- id: concept:道德与法治:恪守道德，遵守法律
  type: Concept
  subject: 道德与法治
  title: 恪守道德，遵守法律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得网络是虚拟世界，匿名发言可以不用负责任。
    - 能指出并纠正这一错误：认为只要说的是事实，就可以随意发布他人的隐私。
  aliases:
    - 网络道德与法律
  category: 道德与法治
  explanation: 网络无限，自由有界，网络不是法外之地，每个人都应该对自己的网络言论负责，文明互动、理性表达，不制造和传播谣言，不泄露他人隐私，不恶意攻击他人，拒绝网络暴力和欺凌。
  misconceptions:
    - 觉得网络是虚拟世界，匿名发言可以不用负责任。
    - 认为只要说的是事实，就可以随意发布他人的隐私。
    - 把言论自由当成权力，以为可以想说什么就说什么。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:情绪
  type: Concept
  subject: 道德与法治
  title: 情绪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为情绪就是表情，没做出表情就等于没有情绪
    - 能指出并纠正这一错误：把情绪说成是外部事件本身，比如认为“考试失败”就是情绪
  aliases:
    - 情绪类型
  category: 情绪管理
  explanation: 情绪是人的内心世界的重要组成部分，是主观体验，常伴随生理感受，并通过语言、表情和行为表现。
  misconceptions:
    - 认为情绪就是表情，没做出表情就等于没有情绪
    - 把情绪说成是外部事件本身，比如认为“考试失败”就是情绪
    - 觉得只有强烈的感受才算情绪，忽略轻微的内心体验
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:情绪的影响
  type: Concept
  subject: 道德与法治
  title: 情绪的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为消极情绪一定有害，所以一有难过就拼命压制
    - 能指出并纠正这一错误：把积极情绪视为越多越好，兴奋时不停讲话、大笑，影响课堂纪律也不管
  aliases:
    - 情绪作用
  category: 情绪管理
  explanation: 情绪影响人的观念和行动，积极情绪提高积极性，消极情绪可能产生负面影响，但适度消极情绪也有积极作用。
  misconceptions:
    - 认为消极情绪一定有害，所以一有难过就拼命压制
    - 把积极情绪视为越多越好，兴奋时不停讲话、大笑，影响课堂纪律也不管
    - 觉得适度消极情绪也有作用，就故意让自己长期沉浸在悲伤中
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:情绪的影响因素
  type: Concept
  subject: 道德与法治
  title: 情绪的影响因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为情绪完全由外界事情决定，比如“考试成绩差，所以心情必然差”
    - 能指出并纠正这一错误：把性格特点当成情绪本身，比如“我就是爱发脾气，改不了”
  aliases:
    - 情绪因素
  category: 情绪管理
  explanation: 情绪受外部环境、生活事件、个人性格特点、对事物的观念和看法等因素影响。
  misconceptions:
    - 认为情绪完全由外界事情决定，比如“考试成绩差，所以心情必然差”
    - 把性格特点当成情绪本身，比如“我就是爱发脾气，改不了”
    - 忽略自己的观念对情绪的作用，认为同一件事对所有人引起的情绪都一样
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:情绪管理
  type: Concept
  subject: 道德与法治
  title: 情绪管理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：情绪管理等同于忍气吞声，觉得管理就是不发火、不表达
    - 能指出并纠正这一错误：只在情绪爆发后后悔，不注意提前觉察和识别情绪苗头
  aliases:
    - 管理情绪
  category: 情绪管理
  explanation: 情绪是可以管理的，通过觉察和认识情绪，明确情绪背后的需要和原因，做情绪的主人。
  misconceptions:
    - 情绪管理等同于忍气吞声，觉得管理就是不发火、不表达
    - 只在情绪爆发后后悔，不注意提前觉察和识别情绪苗头
    - 认为情绪是天生固定的，无法通过后天方法调整
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:惠民利民、安民富民
  type: Concept
  subject: 道德与法治
  title: 惠民利民、安民富民
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为惠民利民就是直接发钱，忽视改善教育、医疗等公共服务，如只发补贴不修路。
    - 能指出并纠正这一错误：把'安民富民'理解为只需物质富足，忽视精神文化生活，如只建商场不建图书馆。
  aliases:
    - 惠民利民
    - 安民富民
  category: 思想理念
  explanation: 主张社会发展必须惠及人民，满足人民利益需求，让人民过上安定富足的生活。
  misconceptions:
    - 认为惠民利民就是直接发钱，忽视改善教育、医疗等公共服务，如只发补贴不修路。
    - 把'安民富民'理解为只需物质富足，忽视精神文化生活，如只建商场不建图书馆。
    - 认为富民是企业的事，与自己无关，如认为共同富裕靠政府就行。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:成长离不开学习
  type: Concept
  subject: 道德与法治
  title: 成长离不开学习
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我们从学说话、学走路到学会各种本领，成长的每一步都离不开学习。本领不是天生就有的，都是一点一点学来的。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:我为世界添光彩
  type: Concept
  subject: 道德与法治
  title: 我为世界添光彩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得只有科学家、名人才能为世界做贡献，普通人做小事没意义
    - 能指出并纠正这一错误：认为做公益活动才算添光彩，而学习、家务等日常事不算贡献
  aliases:
    - 为世界作贡献
  category: 道德与法治
  explanation: 每个人都是世界的一员，所做的事都可能对世界产生影响，要从普通事做起，为人类发展和世界进步贡献智慧和力量。
  misconceptions:
    - 觉得只有科学家、名人才能为世界做贡献，普通人做小事没意义
    - 认为做公益活动才算添光彩，而学习、家务等日常事不算贡献
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:我国交通建设成就
  type: Concept
  subject: 道德与法治
  title: 我国交通建设成就
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我国建成了全球最大的高速铁路网、高速公路网和世界级港口群，出行又快又方便。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:我国人口现状及趋势
  type: Concept
  subject: 道德与法治
  title: 我国人口现状及趋势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为我国人口总量还在不断大幅增加，忽略已转向减量发展。
    - 能指出并纠正这一错误：把‘少子化’等同于‘老龄化’，不知道前者指出生率低，后者指老年人口占比高。
  aliases: []
  category: 道德与法治
  explanation: 我国是人口众多的国家，人口发展呈现少子化、老龄化、区域人口增减分化等明显的趋势性特征，总体上已由人口增量发展转向减量发展阶段。
  misconceptions:
    - 认为我国人口总量还在不断大幅增加，忽略已转向减量发展。
    - 把‘少子化’等同于‘老龄化’，不知道前者指出生率低，后者指老年人口占比高。
    - 看到我国人口基数大，就认为劳动力永远充足，忽视老龄化影响。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:我国资源形势
  type: Concept
  subject: 道德与法治
  title: 我国资源形势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为我国地大物博、资源取之不尽，忽视人均占有量少的现实。
    - 能指出并纠正这一错误：认为我国资源紧缺只是人口太多，忽略浪费、破坏等人为原因。
  aliases: []
  category: 道德与法治
  explanation: 我国自然资源丰富，总量大，种类多，但人均资源占有量少，开发难度大，总体上资源紧缺。长期以来，资源开发利用不尽合理、不够科学，浪费、损失、污染和破坏严重。
  misconceptions:
    - 认为我国地大物博、资源取之不尽，忽视人均占有量少的现实。
    - 认为我国资源紧缺只是人口太多，忽略浪费、破坏等人为原因。
    - 误以为我国各类资源都容易开采，忽视部分资源开发难度大的事实。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:我的家庭贡献
  type: Concept
  subject: 道德与法治
  title: 我的家庭贡献
  conceptType: 概念型
  aliases:
    - 家庭贡献
  category: 观点
  explanation: 家庭的和谐幸福需要每个成员作出贡献。我们给家人的陪伴、关心、支持，都是对家庭的贡献。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:战争带来的伤害
  type: Concept
  subject: 道德与法治
  title: 战争带来的伤害
  conceptType: 概念型
  aliases:
    - 战争的危害
  category: 现象
  explanation: 战争给人们的生命、健康、精神和财产造成巨大伤害，也破坏环境和文化遗产，让儿童失去家园和亲人。正义终将战胜邪恶，和平终将取代战争。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:战胜学习困难
  type: Concept
  subject: 道德与法治
  title: 战胜学习困难
  conceptType: 程序型
  aliases:
    - 战胜困难更快乐
  category: 方法
  explanation: 学习中遇到困难像遇到'拦路虎'，要先调整心态，找找原因再想办法解决。只要坚持不懈、多想办法，就能战胜困难。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:执法全过程记录制度
  type: Concept
  subject: 道德与法治
  title: 执法全过程记录制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为执法记录仪是用来记录公民违法行为的，而不是记录执法者行为。
    - 能指出并纠正这一错误：认为该制度只适用于公安机关抓人，不适用于城管、工商等其他行政执法。
  aliases:
    - 全过程记录制度
  category: 行政法制度
  explanation: 通过文字、音像等记录形式，对行政执法的启动、调查取证、审核决定、送达执行等全部过程进行记录，并全面系统归档保存，做到执法全过程留痕和可回溯管理。
  misconceptions:
    - 认为执法记录仪是用来记录公民违法行为的，而不是记录执法者行为。
    - 认为该制度只适用于公安机关抓人，不适用于城管、工商等其他行政执法。
    - 认为执法记录只是走过场，不是强制归档保存，事后可随意修改。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:扶危济困
  type: Concept
  subject: 道德与法治
  title: 扶危济困
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得扶危济困是成年人的义务，学生没有能力，如看到同学摔倒也不扶。
    - 能指出并纠正这一错误：以为捐钱就是扶危济困，忽视耐心倾听、精神安慰，如对贫困同学只给钱不尊重。
  aliases: []
  category: 道德与法治
  explanation: 当他人身处困境时主动伸出援助之手，是中华民族的传统美德，体现社会的爱心与温情。
  misconceptions:
    - 觉得扶危济困是成年人的义务，学生没有能力，如看到同学摔倒也不扶。
    - 以为捐钱就是扶危济困，忽视耐心倾听、精神安慰，如对贫困同学只给钱不尊重。
    - 把'危'和'困'混为一谈，认为只有生命危险才需救助，经济困难不算。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:承担责任的代价与回报
  type: Concept
  subject: 道德与法治
  title: 承担责任的代价与回报
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看到付出时间精力，认为被误解就是白费，否认增长才干等回报。
    - 能指出并纠正这一错误：认为承担责任必有物质回报，如做志愿者要求发补贴，否则不想做。
  aliases: []
  category: 道德与法治
  explanation: 承担责任意味着付出时间、精力和金钱，甚至可能被误解和责备，但也会增长才干，赢得尊重和赞许。
  misconceptions:
    - 只看到付出时间精力，认为被误解就是白费，否认增长才干等回报。
    - 认为承担责任必有物质回报，如做志愿者要求发补贴，否则不想做。
    - 认为回报就是荣誉和金钱，忽视获得他人尊重和内心满足也是回报。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:抗日战争的胜利
  type: Concept
  subject: 道德与法治
  title: 抗日战争的胜利
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 1945年，经过14年艰苦卓绝的斗争，中国人民取得抗日战争的伟大胜利。这是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争，成为中华民族走向复兴的历史转折点。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:抗日战争胜利
  type: Concept
  subject: 道德与法治
  title: 抗日战争胜利
  conceptType: 概念型
  aliases:
    - 中国人民抗日战争胜利纪念日
  category: 文化常识
  explanation: 1945 年 9 月 2 日日本正式签字投降。这是近代以来中华民族抗击外来侵略的第一次完全胜利，9 月 3 日是纪念日。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:抗日民族统一战线
  type: Concept
  subject: 道德与法治
  title: 抗日民族统一战线
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 中国共产党以民族大义为重倡导建立的合作抗日战线。在它的旗帜下，全体中华儿女众志成城、同仇敌忾，共同抗击日本侵略者。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:抗美援朝
  type: Concept
  subject: 道德与法治
  title: 抗美援朝
  conceptType: 概念型
  aliases:
    - 抗美援朝战争
  category: 概念
  explanation: 新中国成立初期的保家卫国之战，中国人民志愿军打败了侵略者。它被称为新中国的“立国之战”，志愿军将士被亲切地称为“最可爱的人”。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:抗震救灾精神
  type: Concept
  subject: 道德与法治
  title: 抗震救灾精神
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 在同特大地震灾害的搏斗中，我国人民展现出万众一心、众志成城，不畏艰险、百折不挠，以人为本、尊重科学的伟大抗震救灾精神。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:护边员拉齐尼·巴依卡的事迹
  type: Concept
  subject: 道德与法治
  title: 护边员拉齐尼·巴依卡的事迹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把护边员拉齐尼·巴依卡说成解放军战士，身份判断错误。
    - 能指出并纠正这一错误：只记得他救人牺牲，忽略了他一家三代为国守边70多年的奉献。
  aliases:
    - 拉齐尼·巴依卡
  category: 道德与法治
  explanation: 拉齐尼·巴依卡一家三代人守卫边境70多年，他本人为救落水儿童牺牲，体现了爱国奉献精神。
  misconceptions:
    - 误把护边员拉齐尼·巴依卡说成解放军战士，身份判断错误。
    - 只记得他救人牺牲，忽略了他一家三代为国守边70多年的奉献。
    - 错写英雄名字为“拉齐尼·阿依卡”，或误把他当作维吾尔族，实际是塔吉克族。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S6.md
- id: concept:道德与法治:拔节孕穗期
  type: Concept
  subject: 道德与法治
  title: 拔节孕穗期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为初中生还小，价值观长大了再培养也不迟。
    - 能指出并纠正这一错误：认为拔节孕穗期只是身体长高，与心理无关。
  aliases: []
  category: 人生阶段
  explanation: 初中阶段是生命成长的'拔节孕穗期'，初步形成世界观、人生观、价值观，需要精心引导和栽培。
  misconceptions:
    - 认为初中生还小，价值观长大了再培养也不迟。
    - 认为拔节孕穗期只是身体长高，与心理无关。
    - 认为这个阶段不需要引导，自己完全能搞定。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:按劳分配
  type: Concept
  subject: 道德与法治
  title: 按劳分配
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把私营企业按资本分配获得的工资也算作按劳分配，如认为老板给员工的工资都是按劳分配。
    - 能指出并纠正这一错误：误认为按劳分配是唯一分配方式，否定其他分配形式的存在。
  aliases: []
  category: 分配制度
  explanation: 在公有制经济中，以劳动者提供的劳动数量和质量为尺度进行个人分配，多劳多得，少劳少得。
  misconceptions:
    - 把私营企业按资本分配获得的工资也算作按劳分配，如认为老板给员工的工资都是按劳分配。
    - 误认为按劳分配是唯一分配方式，否定其他分配形式的存在。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:按劳分配为主体、多种分配方式并存
  type: Concept
  subject: 道德与法治
  title: 按劳分配为主体、多种分配方式并存
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为按劳分配只存在于非公有制经济，而多种分配方式只存在于公有制经济。
    - 能指出并纠正这一错误：误以为按劳分配为主体意味着所有收入都必须通过按劳分配获得，忽略财产性收入等。
  aliases:
    - 分配制度
  category: 经济制度
  explanation: 我国社会主义基本经济制度之一，分配制度以按劳分配为主体，多种分配方式并存。
  misconceptions:
    - 认为按劳分配只存在于非公有制经济，而多种分配方式只存在于公有制经济。
    - 误以为按劳分配为主体意味着所有收入都必须通过按劳分配获得，忽略财产性收入等。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:振兴中华
  type: Concept
  subject: 道德与法治
  title: 振兴中华
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 孙中山第一个提出的响亮口号，激励一代代中国人为国家富强、民族复兴而努力奋斗。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:换位思考
  type: Concept
  subject: 道德与法治
  title: 换位思考
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为换位思考就是完全同意对方的观点，否则就是没站在对方角度想。
    - 能指出并纠正这一错误：简单说一句“如果我是你”但并没有真正考虑对方处境，只是走过场。
  aliases:
    - 将心比心
  category: 道德品质
  explanation: 换位思考是设身处地为他人着想，从对方角度思考问题，不把自己的意志强加给他人。
  misconceptions:
    - 以为换位思考就是完全同意对方的观点，否则就是没站在对方角度想。
    - 简单说一句“如果我是你”但并没有真正考虑对方处境，只是走过场。
    - 认为换位思考就是替对方做决定，把自己的想法强加为“我这是为你好”。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:接纳同学的不同
  type: Concept
  subject: 道德与法治
  title: 接纳同学的不同
  conceptType: 概念型
  aliases:
    - 不一样的你我他
  category: 观点
  explanation: 每个人的性格、爱好、习惯、想法都有不同，我们要平等相处，学会接纳不同、欣赏他人。和不同的人相处，可以学到不一样的东西。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:接纳自己
  type: Concept
  subject: 道德与法治
  title: 接纳自己
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只接纳自己的优点，对缺点一味否定，如考试失利就全盘否定自己
    - 能指出并纠正这一错误：把接纳自己当作放任不管，觉得有缺点也没必要改，如脾气暴躁也顺其自然
  aliases: []
  category: 自我发展
  explanation: 接纳自己的全部，包括优点和不足，以乐观勇气面对现实。
  misconceptions:
    - 只接纳自己的优点，对缺点一味否定，如考试失利就全盘否定自己
    - 把接纳自己当作放任不管，觉得有缺点也没必要改，如脾气暴躁也顺其自然
    - 接纳自己就是只接受现状，不去想如何改进，错把接纳当妥协
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:提高劳动本领的方法
  type: Concept
  subject: 道德与法治
  title: 提高劳动本领的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 要多学习、常练习，比如请教别人劳动的方法、反复动手实践，就能把事情干得又快又好。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:提高危险预判能力
  type: Concept
  subject: 道德与法治
  title: 提高危险预判能力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为危险预判靠运气，平时不用学习安全知识，遇事再说
    - 能指出并纠正这一错误：只注意明显的危险，比如施工工地，忽略楼梯湿滑、电线老化等隐患
  aliases:
    - 危险预判
  category: 安全观
  explanation: 危险预判能力不是天生的，要在日常生活中主动学习安全知识，见微知著，对潜在的危险作出科学判断，防患于未然。
  misconceptions:
    - 认为危险预判靠运气，平时不用学习安全知识，遇事再说
    - 只注意明显的危险，比如施工工地，忽略楼梯湿滑、电线老化等隐患
    - 觉得危险不会发生在自己身上，看到警示标志也不当回事
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:提高避险和逃生能力
  type: Concept
  subject: 道德与法治
  title: 提高避险和逃生能力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得每年安全演练是走形式，不认真参与，警报响了慢悠悠走
    - 能指出并纠正这一错误：火灾逃生时因为想拿贵重物品返回火场，错过逃生时机
  aliases:
    - 避险逃生
  category: 安全观
  explanation: 平时积极参加安全演练活动，在危险来临时保持头脑冷静，就近、快速逃离到安全地带，有效利用各种资源求救和逃生。
  misconceptions:
    - 觉得每年安全演练是走形式，不认真参与，警报响了慢悠悠走
    - 火灾逃生时因为想拿贵重物品返回火场，错过逃生时机
    - 地震时选择乘坐电梯逃生，而不是走安全通道
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:改正错误的方法
  type: Concept
  subject: 道德与法治
  title: 改正错误的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 改错时可以想一想犯错的原因，马上改正，还可以请家人帮忙监督提醒。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:改革与创新的关系
  type: Concept
  subject: 道德与法治
  title: 改革与创新的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把改革与创新混为一谈，认为改革就是创新、创新就是改革
    - 能指出并纠正这一错误：认为创新是改革的前提，必须先有创新才能进行改革，忽视二者相互促进
  aliases: []
  category: 关系
  explanation: 改革在不断创新中提升发展品质，创新通过改革渗透到社会各方面，改革创新推动中国走向富强。
  misconceptions:
    - 把改革与创新混为一谈，认为改革就是创新、创新就是改革
    - 认为创新是改革的前提，必须先有创新才能进行改革，忽视二者相互促进
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:改革创新精神
  type: Concept
  subject: 道德与法治
  title: 改革创新精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只把创新看作科技发明，认为学生日常学习与创新无关
    - 能指出并纠正这一错误：认为改革创新精神只是国家层面的事，个人不需要锐意进取
  aliases: []
  category: 精神
  explanation: 与时俱进、锐意进取、勤于探索、勇于实践的精神，是持续推动全面深化改革的重要动力。
  misconceptions:
    - 只把创新看作科技发明，认为学生日常学习与创新无关
    - 认为改革创新精神只是国家层面的事，个人不需要锐意进取
    - 觉得勤于探索就是盲目尝试新方法，不考虑实际效果
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:改革开放
  type: Concept
  subject: 道德与法治
  title: 改革开放
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将改革开放等同于改革或开放单方面，忽视二者相互促进
    - 能指出并纠正这一错误：认为改革开放只是经济政策，与政治文化无关
  aliases:
    - 改革开放伟大革命
  category: 核心史实
  explanation: 中国共产党团结带领中国人民进行的新的伟大革命，极大解放和发展社会生产力，增强社会发展活力，是决定当代中国命运的关键一招。
  misconceptions:
    - 将改革开放等同于改革或开放单方面，忽视二者相互促进
    - 认为改革开放只是经济政策，与政治文化无关
    - 误以为改革开放已经完成，不再需要继续深化
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:政府与市场的关系
  type: Concept
  subject: 道德与法治
  title: 政府与市场的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把政府作用说成在资源配置中起决定性作用，颠倒主次。
    - 能指出并纠正这一错误：认为市场决定性作用和政府作用水火不容，要么完全市场化，要么完全由政府干预。
  aliases:
    - 有效市场有为政府
  category: 经济体制
  explanation: 坚持和完善社会主义市场经济体制，要正确处理政府和市场关系，充分发挥市场决定性作用，更好发挥政府作用，弥补市场缺陷。
  misconceptions:
    - 把政府作用说成在资源配置中起决定性作用，颠倒主次。
    - 认为市场决定性作用和政府作用水火不容，要么完全市场化，要么完全由政府干预。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:政府作用
  type: Concept
  subject: 道德与法治
  title: 政府作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为政府宏观调控可以完全消除市场缺陷，无所不能。
    - 能指出并纠正这一错误：认为政府作用就是直接插手企业经营决策，如规定产品价格。
  aliases:
    - 宏观调控
  category: 经济机制
  explanation: 政府通过宏观调控弥补市场缺陷，实现效率和公平统一，促进共同富裕。
  misconceptions:
    - 误以为政府宏观调控可以完全消除市场缺陷，无所不能。
    - 认为政府作用就是直接插手企业经营决策，如规定产品价格。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S7.md
- id: concept:道德与法治:政治权利
  type: Concept
  subject: 道德与法治
  title: 政治权利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把政治权利等同于政治自由，认为游行示威不需要任何审批。
    - 能指出并纠正这一错误：误认为选举权是所有公民都享有的，未满18岁也有选举权。
  aliases: []
  category: 法律概念
  explanation: 政治权利是公民参与国家政治生活的权利和自由的统称，包括选举权和被选举权，言论、出版、集会、结社、游行、示威的自由等。
  misconceptions:
    - 把政治权利等同于政治自由，认为游行示威不需要任何审批。
    - 误认为选举权是所有公民都享有的，未满18岁也有选举权。
    - 把监督权直接算作政治权利，混淆不同权利类别。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:教师的作用
  type: Concept
  subject: 道德与法治
  title: 教师的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为老师只是教知识的教书匠，不承担育人职责。
    - 能指出并纠正这一错误：以为网络时代有网络课程，老师完全可以被取代。
  aliases:
    - 老师的作用
  category: 道德与法治
  explanation: 老师是锤炼品格、学习知识、创新思维、奉献祖国的引路人，在成长中不可替代。
  misconceptions:
    - 认为老师只是教知识的教书匠，不承担育人职责。
    - 以为网络时代有网络课程，老师完全可以被取代。
    - 认为老师对每个学生都一样，不用因材施教。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:教师职业
  type: Concept
  subject: 道德与法治
  title: 教师职业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为任何人都能当老师，不需要专业培训和资格。
    - 能指出并纠正这一错误：以为教师职业只是谋生手段，与传承人类文明无关。
  aliases:
    - 教师
  category: 道德与法治
  explanation: 教师是履行教育教学职责的专业人员，承担教书育人使命，传承人类文明。
  misconceptions:
    - 认为任何人都能当老师，不需要专业培训和资格。
    - 以为教师职业只是谋生手段，与传承人类文明无关。
    - 觉得教师只在课堂里教书，其他场合不承担育人使命。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:教师节
  type: Concept
  subject: 道德与法治
  title: 教师节
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 9月10日是教师节，是老师们的节日。这一天大家用各种方式向老师表达感谢和祝福。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:教育强国
  type: Concept
  subject: 道德与法治
  title: 教育强国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为教育强国就是多建学校、增加投入，忽视人才培养质量
    - 能指出并纠正这一错误：认为教育强国只是国家目标，个人成绩好坏不影响国家发展
  aliases: []
  category: 国家战略
  explanation: 指教育事业发展达到世界先进水平，能够为国家发展提供强有力的人才支撑和智力支持。
  misconceptions:
    - 认为教育强国就是多建学校、增加投入，忽视人才培养质量
    - 认为教育强国只是国家目标，个人成绩好坏不影响国家发展
    - 把教育强国等同于高等教育强国，忽略基础教育和职业教育
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:教育的重要性
  type: Concept
  subject: 道德与法治
  title: 教育的重要性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为教育只是个人私事，与国家强盛、社会进步没有关系
    - 能指出并纠正这一错误：把教育重要性等同于考试分数，认为不上大学就没有出路
  aliases:
    - 教育为本
    - 教育
  category: 概念
  explanation: 教育是民族振兴、社会进步的基石，是提高国民素质、培养创新型人才、促进人的全面发展的根本途径。
  misconceptions:
    - 认为教育只是个人私事，与国家强盛、社会进步没有关系
    - 把教育重要性等同于考试分数，认为不上大学就没有出路
    - 认为家庭教育和社会实践不算教育，教育就是学校教育
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:敢于抵制不平等的行为
  type: Concept
  subject: 道德与法治
  title: 敢于抵制不平等的行为
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：面对校园欺凌，直接以暴制暴打回去，认为这是抵制不平等。
    - 能指出并纠正这一错误：觉得举报性别歧视是小题大做，忍忍就算了。
  aliases: []
  category: 道德与法治
  explanation: 面对不平等现象，不能听之任之，应据理力争，用合法的方式捍卫平等。
  misconceptions:
    - 面对校园欺凌，直接以暴制暴打回去，认为这是抵制不平等。
    - 觉得举报性别歧视是小题大做，忍忍就算了。
    - 看到有人被歧视，觉得事不关己，反正不是自己。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:敬业乐群
  type: Concept
  subject: 道德与法治
  title: 敬业乐群
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为敬业就是延长工作时间，盲目加班，忽视效率和方法，如熬夜学习但发呆。
    - 能指出并纠正这一错误：把'乐群'理解为搞好人缘，甚至附和错误意见，如明知同学作弊却帮忙隐瞒。
  aliases: []
  category: 道德与法治
  explanation: 对待学习和工作要专心致志、爱岗敬业、尽职尽责，乐于与他人交往，在集体中与人和睦相处、团结协作。
  misconceptions:
    - 认为敬业就是延长工作时间，盲目加班，忽视效率和方法，如熬夜学习但发呆。
    - 把'乐群'理解为搞好人缘，甚至附和错误意见，如明知同学作弊却帮忙隐瞒。
    - 觉得学生没有敬业问题，只有工作后才需敬业，如应付作业也是不敬业。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:敬业精神
  type: Concept
  subject: 道德与法治
  title: 敬业精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把敬业等同于无条件加班加点，不关注效率和工作与生活的平衡
    - 能指出并纠正这一错误：认为从事自己不喜欢的职业就可以不必敬业，把敬业建立在兴趣之上
  aliases:
    - 爱岗敬业
  category: 职业道德
  explanation: 热爱本职工作，践行劳模精神、劳动精神、工匠精神，精益求精，实现人生价值。
  misconceptions:
    - 把敬业等同于无条件加班加点，不关注效率和工作与生活的平衡
    - 认为从事自己不喜欢的职业就可以不必敬业，把敬业建立在兴趣之上
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:敬畏生命
  type: Concept
  subject: 道德与法治
  title: 敬畏生命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把敬畏生命理解成害怕死亡，认为人人都是贪生怕死的
    - 能指出并纠正这一错误：认为敬畏生命就是只敬畏人类生命，对小动物的生死无动于衷
  aliases:
    - 生命敬畏
  category: 生命观
  explanation: 当人的生命遭遇灾难时，我们感受到生命的脆弱与艰难，也体悟到生命的坚强、崇高和神圣，因此要对生命有一种敬畏的情怀。
  misconceptions:
    - 把敬畏生命理解成害怕死亡，认为人人都是贪生怕死的
    - 认为敬畏生命就是只敬畏人类生命，对小动物的生死无动于衷
    - 看到他人遭遇灾难，觉得自己没受影响就事不关己高高挂起
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:整理的方法
  type: Concept
  subject: 道德与法治
  title: 整理的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 整理东西可以分好类、摆整齐、贴上标签，这样用的时候容易找。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:文以载道、以文化人
  type: Concept
  subject: 道德与法治
  title: 文以载道、以文化人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为'文'只指文章，不包含电影、音乐等艺术形式，如不认为纪录片能载道。
    - 能指出并纠正这一错误：把'道'理解为空洞的大道理，忽视做人做事的实际准则，如只看说教不看行动。
  aliases:
    - 文以载道
    - 以文化人
  category: 教化思想
  explanation: 文化形式承载做人道理，教育人、感化人，成就理想人格。
  misconceptions:
    - 以为'文'只指文章，不包含电影、音乐等艺术形式，如不认为纪录片能载道。
    - 把'道'理解为空洞的大道理，忽视做人做事的实际准则，如只看说教不看行动。
    - 将'以文化人'等同于强行灌输，忽视润物无声，如逼写读后感而反感。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:文以载道、以文化人的教化思想
  type: Concept
  subject: 道德与法治
  title: 文以载道、以文化人的教化思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为教化是古代特有的专制手段，现代不需要，如反对学校开展德育活动。
    - 能指出并纠正这一错误：把'文以载道'理解为文艺作品只承载政治口号，忽视艺术性，如要求每首歌都唱颂歌。
  aliases:
    - 文以载道
    - 以文化人
  category: 教化思想
  explanation: 文化形式承载做人做事的道理，教育人、感化人，成就理想人格，提升精神境界。
  misconceptions:
    - 以为教化是古代特有的专制手段，现代不需要，如反对学校开展德育活动。
    - 把'文以载道'理解为文艺作品只承载政治口号，忽视艺术性，如要求每首歌都唱颂歌。
    - 认为教化就是使人服从，不是培养独立思考，如要求盲从权威。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:文化多样性
  type: Concept
  subject: 道德与法治
  title: 文化多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文化多样性必然导致冲突，因此是消极的障碍
    - 能指出并纠正这一错误：把文化多样性视为各民族文化的简单相加，忽略其创新基础作用
  aliases:
    - 文化多元性
  category: 文化概念
  explanation: 文化多样性是人类社会的基本特征，是世界文化充满活力的表现，也是人类文明进步的重要动力。文化多样性是实现文化创新与发展的前提和基础。
  misconceptions:
    - 认为文化多样性必然导致冲突，因此是消极的障碍
    - 把文化多样性视为各民族文化的简单相加，忽略其创新基础作用
    - 误以为文化多样性意味着各文化之间没有任何共性
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:文化教育权利
  type: Concept
  subject: 道德与法治
  title: 文化教育权利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为受教育权只是义务，不是权利，所以可以随意放弃学业。
    - 能指出并纠正这一错误：把文化权利等同于受教育权，认为只有学生才有文化权利。
  aliases: []
  category: 法律概念
  explanation: 文化教育权利包括受教育权和文化权利。公民有权按照其能力平等地从国家获得接受教育的机会，国家实行义务教育制度，保障适龄儿童、少年接受义务教育。
  misconceptions:
    - 认为受教育权只是义务，不是权利，所以可以随意放弃学业。
    - 把文化权利等同于受教育权，认为只有学生才有文化权利。
    - 误以为义务教育就是完全免费教育，所有费用都由国家承担。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:文化生活日益丰富
  type: Concept
  subject: 道德与法治
  title: 文化生活日益丰富
  conceptType: 概念型
  aliases:
    - 丰富的文化生活
  category: 观点
  explanation: 图书馆、博物馆、科技馆等文化场所越来越多，人们的学习和休闲生活变得多姿多彩。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:文化自信
  type: Concept
  subject: 道德与法治
  title: 文化自信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把文化自信当成文化自负，认为中华文化无需借鉴任何外来文化。
    - 能指出并纠正这一错误：认为只有古诗词、传统节日才体现文化自信，忽略红色文化和现代创新。
  aliases:
    - 文化自信
  category: 文化
  explanation: 一个国家、一个民族对自身文化价值的充分肯定和坚定信念，是更基础、更广泛、更深厚的自信。
  misconceptions:
    - 把文化自信当成文化自负，认为中华文化无需借鉴任何外来文化。
    - 认为只有古诗词、传统节日才体现文化自信，忽略红色文化和现代创新。
    - 误以为文化自信就要全盘肯定传统文化，忽略取其精华、去其糟粕。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:文化遗产
  type: Concept
  subject: 道德与法治
  title: 文化遗产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：提到文化遗产只想到古迹文物，说剪纸、京剧等非遗不属于文化遗产。
    - 能指出并纠正这一错误：把九寨沟等自然风景错划为文化遗产，忽略自然遗产类别。
  aliases:
    - 文化遗产
  category: 文化
  explanation: 人类共同的文化财富，包括物质文化遗产和非物质文化遗产，需要保护和传承。
  misconceptions:
    - 提到文化遗产只想到古迹文物，说剪纸、京剧等非遗不属于文化遗产。
    - 把九寨沟等自然风景错划为文化遗产，忽略自然遗产类别。
    - 主张文化遗产应完全封闭保护，反对任何形式的合理开发与传承。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:文明上网
  type: Concept
  subject: 道德与法治
  title: 文明上网
  conceptType: 概念型
  aliases:
    - 网络文明
  category: 观点
  explanation: 网络不是法外之地。我们要遵守网络规则，规范网络言行，不转发来历不明的链接、不公布他人隐私、不辱骂他人，积极传播正能量。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:文明交流互鉴
  type: Concept
  subject: 道德与法治
  title: 文明交流互鉴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文明有高低优劣之分，轻视其他文明，不愿平等交流。
    - 能指出并纠正这一错误：以为文明交流互鉴会导致各文明相互取代，变成单一文明。
  aliases:
    - 文明交流与互鉴
  category: 道德与法治
  explanation: 文明因交流而多彩，因互鉴而丰富。各国应通过交流互鉴促进文明发展，共同应对全球性挑战。
  misconceptions:
    - 认为文明有高低优劣之分，轻视其他文明，不愿平等交流。
    - 以为文明交流互鉴会导致各文明相互取代，变成单一文明。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:文明有礼
  type: Concept
  subject: 道德与法治
  title: 文明有礼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文明有礼只是个人私事，与国家和民族形象无关
    - 能指出并纠正这一错误：觉得文明有礼就是虚伪客套，不如真性情重要
  aliases: []
  category: 道德与法治
  explanation: 文明有礼是调整和规范人际关系的行为准则，体现个人素质，事关社会风尚和国家形象。
  misconceptions:
    - 认为文明有礼只是个人私事，与国家和民族形象无关
    - 觉得文明有礼就是虚伪客套，不如真性情重要
    - 只对老师同学礼貌，对陌生人或环卫工人就恶语相向
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:文明购物
  type: Concept
  subject: 道德与法治
  title: 文明购物
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 购物时要遵守行为规范，轻拿轻放商品、礼貌地与售货员交流、实事求是地评价，做文明的消费者。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:新中国成立
  type: Concept
  subject: 道德与法治
  title: 新中国成立
  conceptType: 概念型
  aliases:
    - 开国大典
    - 中华人民共和国成立
  category: 概念
  explanation: 1949年10月1日开国大典，毛泽东向全世界宣告中华人民共和国中央人民政府成立。中国人民从此站起来了，中国发展开启了新纪元。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:新中国第一部宪法
  type: Concept
  subject: 道德与法治
  title: 新中国第一部宪法
  conceptType: 概念型
  aliases:
    - 1954年宪法
    - 五四宪法
  category: 概念
  explanation: 1954年第一届全国人民代表大会第一次会议通过《中华人民共和国宪法》。这是我国第一部社会主义类型的宪法，也是一部真正反映人民利益的宪法。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:新兴市场国家和发展中国家
  type: Concept
  subject: 道德与法治
  title: 新兴市场国家和发展中国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将中国、印度等新兴市场国家直接视为发达国家
    - 能指出并纠正这一错误：误认为发展中国家快速发展会加剧世界贫富两极分化
  aliases:
    - 新兴经济体
  category: 政治概念
  explanation: 新兴市场国家和发展中国家快速发展，经济实力和国际影响力不断增强，有利于推动世界多极化，为世界经济持续发展提供动力。
  misconceptions:
    - 将中国、印度等新兴市场国家直接视为发达国家
    - 误认为发展中国家快速发展会加剧世界贫富两极分化
    - 把新兴市场国家和发展中国家完全等同，不加区分
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:新发展理念
  type: Concept
  subject: 道德与法治
  title: 新发展理念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将新发展理念记成‘创新、协调、绿色、改革、共享’，漏掉‘开放’。
    - 能指出并纠正这一错误：认为新发展理念只是经济发展的任务，与生态文明建设无关。
  aliases:
    - 五大发展理念
  category: 发展理念
  explanation: 创新、协调、绿色、开放、共享的新发展理念，是实现中华民族永续发展的指导理念。
  misconceptions:
    - 将新发展理念记成‘创新、协调、绿色、改革、共享’，漏掉‘开放’。
    - 认为新发展理念只是经济发展的任务，与生态文明建设无关。
    - 把‘共享’误认为所有人平均分享一切，忽视共建共享的辩证关系。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:新型国际关系
  type: Concept
  subject: 道德与法治
  title: 新型国际关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为合作共赢意味着放弃竞争，没有利益冲突
    - 能指出并纠正这一错误：把新型国际关系说成是世界各国共同制定的规则，而非我国倡导的目标
  aliases: []
  category: 政治
  explanation: 相互尊重、公平正义、合作共赢的国际关系，是我国推动建设的目标。
  misconceptions:
    - 认为合作共赢意味着放弃竞争，没有利益冲突
    - 把新型国际关系说成是世界各国共同制定的规则，而非我国倡导的目标
    - 误以为新型国际关系只涉及政治领域，与经济、文化无关
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:新型民主
  type: Concept
  subject: 道德与法治
  title: 新型民主
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“新型”只是时间新，我国民主起步晚，所以叫新型，而非本质新。
    - 能指出并纠正这一错误：认为新型民主就是排斥西方民主，和人类民主文明没有任何共同点。
  aliases:
    - 社会主义民主
  category: 政治概念
  explanation: 我国社会主义民主是一种新型民主，从中国社会土壤中生长出来，具有强大生命力。
  misconceptions:
    - 认为“新型”只是时间新，我国民主起步晚，所以叫新型，而非本质新。
    - 认为新型民主就是排斥西方民主，和人类民主文明没有任何共同点。
    - 认为新型民主等于选举民主，忽视协商民主等独特形式。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:新时代好青年
  type: Concept
  subject: 道德与法治
  title: 新时代好青年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要成绩好就是新时代好青年，不重视品德、身体和劳动素养
    - 能指出并纠正这一错误：将‘敢担当’理解为只做惊天动地的大事，忽略对班级、家庭的小责任
  aliases: []
  category: 道德品质
  explanation: 有理想、敢担当、能吃苦、肯奋斗的青年，是社会主义建设者和接班人。
  misconceptions:
    - 认为只要成绩好就是新时代好青年，不重视品德、身体和劳动素养
    - 将‘敢担当’理解为只做惊天动地的大事，忽略对班级、家庭的小责任
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:新民主主义革命
  type: Concept
  subject: 道德与法治
  title: 新民主主义革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为新民主主义革命的任务是建立社会主义制度
    - 能指出并纠正这一错误：把新民主主义革命说成是资产阶级领导的，忽视共产党的领导
  aliases: []
  category: 历史事件
  explanation: 中国共产党领导中国人民完成的革命，建立中华人民共和国，彻底结束了旧中国半殖民地半封建社会的历史。
  misconceptions:
    - 误以为新民主主义革命的任务是建立社会主义制度
    - 把新民主主义革命说成是资产阶级领导的，忽视共产党的领导
    - 认为新民主主义革命从1919年持续到1956年，混淆革命阶段
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:新的发展契机
  type: Concept
  subject: 道德与法治
  title: 新的发展契机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为我国已转向高质量发展，就完全不存在困难和挑战了。
    - 能指出并纠正这一错误：把发展契机只理解为经济机遇，忽视制度、市场等多方面优势。
  aliases:
    - 发展契机
  category: 道德与法治
  explanation: 中国已转向高质量发展阶段，具备制度、经济、市场等多方面优势，和平发展合作共赢的时代潮流提供良好外部环境。
  misconceptions:
    - 认为我国已转向高质量发展，就完全不存在困难和挑战了。
    - 把发展契机只理解为经济机遇，忽视制度、市场等多方面优势。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:新风险新挑战
  type: Concept
  subject: 道德与法治
  title: 新风险新挑战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为经济下行压力意味着我国经济发展已经停滞甚至倒退。
    - 能指出并纠正这一错误：把贸易争端等风险全归因于外部因素，忽视自身经济结构问题。
  aliases:
    - 风险与挑战
  category: 道德与法治
  explanation: 中国发展面临经济下行压力、国际形势复杂多变、贸易争端等风险与挑战，需增强机遇意识和风险意识。
  misconceptions:
    - 认为经济下行压力意味着我国经济发展已经停滞甚至倒退。
    - 把贸易争端等风险全归因于外部因素，忽视自身经济结构问题。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:日常保健小妙招
  type: Concept
  subject: 道德与法治
  title: 日常保健小妙招
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 生活中有很多保护身体的小办法，比如少吃甜食好好刷牙、想发脾气时做深呼吸、按天气增减衣服。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:早期文明发祥地
  type: Concept
  subject: 道德与法治
  title: 早期文明发祥地
  conceptType: 概念型
  aliases:
    - 大河流域文明
  category: 文化常识
  explanation: 人类早期文明主要发源于大河流域，如尼罗河流域、两河流域、印度河流域和黄河流域、长江流域。原始农业的兴起为古代文明社会的形成奠定了重要基础。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:早睡早起
  type: Concept
  subject: 道德与法治
  title: 早睡早起
  conceptType: 概念型
  aliases:
    - 作息有规律
  category: 观点
  explanation: 早睡早起才有精神。不早睡会起不来、来不及吃早饭，影响身体健康和学习。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:早睡早起的方法
  type: Concept
  subject: 道德与法治
  title: 早睡早起的方法
  conceptType: 程序型
  aliases:
    - 早睡早起小妙招
  category: 方法
  explanation: 可以用小闹钟定时提醒，请爸爸妈妈来叫自己起床，晚上开一盏小夜灯帮助自己睡觉。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:时间管理
  type: Concept
  subject: 道德与法治
  title: 时间管理
  conceptType: 概念型
  aliases:
    - 合理利用时间
    - 我和时间交朋友
  category: 方法
  explanation: 要学会合理规划和利用时间，做到分清主次、讲究效率、劳逸结合。做事专心、当日事当日毕，就能节省出更多时间。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:春节
  type: Concept
  subject: 道德与法治
  title: 春节
  conceptType: 概念型
  aliases:
    - 过年
    - 农历新年
  category: 文化常识
  explanation: 春节是我国的农历新年。家家贴春联、吃年夜饭、拜年祝福，全家团团圆圆。各地和各民族的过年习俗不一样。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:普通人也能发明创造
  type: Concept
  subject: 道德与法治
  title: 普通人也能发明创造
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 很多发明构想都来源于日常学习和生活，普通人也可以进行发明创造。这些发明让我们的生活变得更加美好。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:更高水平开放型经济新体制
  type: Concept
  subject: 道德与法治
  title: 更高水平开放型经济新体制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为更高水平开放就是更大力度地引进外资，忽视制度创新。
    - 能指出并纠正这一错误：把建设新体制等同于多建自贸区和港口，忽视其拓展中国式现代化空间的深层目标。
  aliases:
    - 开放型经济新体制
  category: 经济体制
  explanation: 我国在新的起点上建设更高水平开放型经济新体制，拓展中国式现代化的发展空间。
  misconceptions:
    - 认为更高水平开放就是更大力度地引进外资，忽视制度创新。
    - 把建设新体制等同于多建自贸区和港口，忽视其拓展中国式现代化空间的深层目标。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:有朋友的快乐
  type: Concept
  subject: 道德与法治
  title: 有朋友的快乐
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 有朋友真好：开心时可以一起分享，伤心时有朋友来安慰。朋友让我们的快乐变多、难过变少。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:朦胧情感
  type: Concept
  subject: 道德与法治
  title: 朦胧情感
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把对异性的好感等同于爱情，觉得喜欢就要马上表白在一起
    - 能指出并纠正这一错误：认为“理智处理”就是完全否定感情，把正常好感当成错误
  aliases:
    - 异性情感
    - 青春期情感
  category: 情感发展
  explanation: 对异性萌发的朦胧情感是正常的，但真正的爱情需要责任、能力和担当，应慎重对待、理智处理。
  misconceptions:
    - 把对异性的好感等同于爱情，觉得喜欢就要马上表白在一起
    - 认为“理智处理”就是完全否定感情，把正常好感当成错误
    - 认为真正的爱情只需要心动和浪漫，责任、能力与担当是以后的事
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:未成年人
  type: Concept
  subject: 道德与法治
  title: 未成年人
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 在我国，未满18周岁的公民为未成年人。未成年人充满活力与朝气，具有探索未知的好奇心与兴趣。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:未成年人保护法
  type: Concept
  subject: 道德与法治
  title: 未成年人保护法
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 我国第一部专门保护未成年人各项合法权利的法律，从家庭、学校、社会、网络、政府、司法六个方面为未成年人筑起保护屏障。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:未成年人六大保护
  type: Concept
  subject: 道德与法治
  title: 未成年人六大保护
  conceptType: 概念型
  aliases:
    - 六道保护屏障
  category: 概念
  explanation: 未成年人保护法筑起六道保护屏障：家庭保护、学校保护、社会保护、网络保护、政府保护和司法保护，家庭、学校、社会、国家各司其职。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:未成年人网络保护
  type: Concept
  subject: 道德与法治
  title: 未成年人网络保护
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 国家加强未成年人网络素养教育：网络游戏企业只能在周五、六、日和法定节假日的20时至21时向未成年人提供服务，禁止未成年人参与直播打赏、严控未成年人当主播。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:未成年人需要特殊保护
  type: Concept
  subject: 道德与法治
  title: 未成年人需要特殊保护
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 未成年人身心发育尚不成熟，生活经验不足，辨别是非、自我控制和自我保护的能力不强，容易受到不良因素影响，需要给予特殊保护。这也是全人类的共识。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:权利与义务相统一
  type: Concept
  subject: 道德与法治
  title: 权利与义务相统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为权利与义务是对等的，尽多少义务就享多少权利。
    - 能指出并纠正这一错误：认为放弃权利就可以不履行义务，如放弃继承就不赡养父母。
  aliases:
    - 权利义务关系
  category: 法律原则
  explanation: 公民的权利与义务相互依存、相互促进。权利的实现需要义务的履行，义务的履行离不开权利的实现。公民享有权利的同时必须履行义务。
  misconceptions:
    - 认为权利与义务是对等的，尽多少义务就享多少权利。
    - 认为放弃权利就可以不履行义务，如放弃继承就不赡养父母。
    - 把权利义务统一理解为所有公民享有相同权利和履行相同义务。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:权利义务平等
  type: Concept
  subject: 道德与法治
  title: 权利义务平等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为收入不同的人纳税义务也不同，所以权利义务不平等。
    - 能指出并纠正这一错误：觉得未成年人没有义务，只有权利，比如可以不承担民事责任。
  aliases: []
  category: 道德与法治
  explanation: 任何公民不分民族、种族、性别等，都平等地享有宪法和法律规定的权利，平等地履行义务。
  misconceptions:
    - 认为收入不同的人纳税义务也不同，所以权利义务不平等。
    - 觉得未成年人没有义务，只有权利，比如可以不承担民事责任。
    - 认为外国人不需要遵守中国法律，因为他们不是中国公民。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:权利救济方式
  type: Concept
  subject: 道德与法治
  title: 权利救济方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆仲裁和诉讼，认为仲裁后还能就同一纠纷向法院起诉。
    - 能指出并纠正这一错误：认为和解就是放弃权利，必须通过诉讼才能维权。
  aliases:
    - 纠纷解决方式
  category: 法律概念
  explanation: 当合法权益受侵害时，可通过和解、调解、仲裁和诉讼等方式依法维权。
  misconceptions:
    - 混淆仲裁和诉讼，认为仲裁后还能就同一纠纷向法院起诉。
    - 认为和解就是放弃权利，必须通过诉讼才能维权。
    - 误以为调解协议具有强制执行力，不履行可直接申请强制执行。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:构建人类命运共同体
  type: Concept
  subject: 道德与法治
  title: 构建人类命运共同体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将构建人类命运共同体等同于经济全球化，忽略政治安全等内涵
    - 能指出并纠正这一错误：误认为构建人类命运共同体要求各国放弃本国利益，只讲共同利益
  aliases:
    - 人类命运共同体
  category: 政治理念
  explanation: 指各国在追求自身利益时兼顾他国合理关切，在谋求本国发展中促进各国共同发展，推动建设一个持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。
  misconceptions:
    - 将构建人类命运共同体等同于经济全球化，忽略政治安全等内涵
    - 误认为构建人类命运共同体要求各国放弃本国利益，只讲共同利益
    - 认为构建人类命运共同体只是中国的事情，与其他国家无关
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:构建人类命运共同体的途径
  type: Concept
  subject: 道德与法治
  title: 构建人类命运共同体的途径
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要对话协商就能建成人类命运共同体，忽视其他途径
    - 能指出并纠正这一错误：将“共建共享”理解为各国平均分配资源和利益
  aliases: []
  category: 政治
  explanation: 坚持对话协商、共建共享、合作共赢、交流互鉴、绿色低碳，建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。
  misconceptions:
    - 认为只要对话协商就能建成人类命运共同体，忽视其他途径
    - 将“共建共享”理解为各国平均分配资源和利益
    - 误把“交流互鉴”等同于文化输出，片面理解
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:构筑中国价值
  type: Concept
  subject: 道德与法治
  title: 构筑中国价值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为构筑中国价值等于恢复全部的旧道德，排斥现代法律和民主成分。
    - 能指出并纠正这一错误：认为构筑中国价值是政府的事，学生无需主动参与建构。
  aliases: []
  category: 道德与法治
  explanation: 构筑中国价值强调坚守植根于中华文化沃土又具有当代中国特色的价值观，培育和践行社会主义核心价值观要与日常生活紧密联系，做到落细、落小、落实。
  misconceptions:
    - 认为构筑中国价值等于恢复全部的旧道德，排斥现代法律和民主成分。
    - 认为构筑中国价值是政府的事，学生无需主动参与建构。
    - 以为构筑中国价值就是传统道德，与社会主义核心价值观没有关系。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:树立安全意识
  type: Concept
  subject: 道德与法治
  title: 树立安全意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要自己守规矩就不会有危险，忽视环境中的安全隐患
    - 能指出并纠正这一错误：在加油站吸一支烟没什么大事，安全意识被侥幸心理取代
  aliases:
    - 安全意识
  category: 安全观
  explanation: 在日常生活中，要牢固树立安全意识，对那些可能会对自己或他人造成伤害的外在环境、人为侵害有所警觉和戒备，保护好我们的生命。
  misconceptions:
    - 认为只要自己守规矩就不会有危险，忽视环境中的安全隐患
    - 在加油站吸一支烟没什么大事，安全意识被侥幸心理取代
    - 觉得安全意识就是出门看车，其他方面（如网络安全）不用管
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:树立正确的人生目标
  type: Concept
  subject: 道德与法治
  title: 树立正确的人生目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只按个人兴趣定目标，不理会国家需要和社会条件
    - 能指出并纠正这一错误：把个人目标与国家利益对立，认为两者无法兼顾
  aliases:
    - 确立正确的人生目标
  category: 道德与法治
  explanation: 树立正确的人生目标需要正确认识个人与社会的关系，从自身实际出发，与国家、民族和人民的利益相结合，与人类的福祉相统一。
  misconceptions:
    - 只按个人兴趣定目标，不理会国家需要和社会条件
    - 把个人目标与国家利益对立，认为两者无法兼顾
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:树立规则意识
  type: Concept
  subject: 道德与法治
  title: 树立规则意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为规则是束缚自由的，比如觉得红灯没人时闯过去也不算违规
    - 能指出并纠正这一错误：只要求别人守规则，自己遇到麻烦就想走捷径插队、翻栏杆
  aliases:
    - 规则意识
  category: 安全观
  explanation: 生活中的'禁令'看似是对我们的限制，其实是对我们自由和生命安全的保障，要自觉遵守规则，对自身行为是否安全作出恰当评估，并及时纠正不当行为。
  misconceptions:
    - 认为规则是束缚自由的，比如觉得红灯没人时闯过去也不算违规
    - 只要求别人守规则，自己遇到麻烦就想走捷径插队、翻栏杆
    - 把遵守规则和灵活变通对立，认为守规则就是死板不知变通
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:校园冲突产生的原因
  type: Concept
  subject: 道德与法治
  title: 校园冲突产生的原因
  conceptType: 概念型
  aliases:
    - 冲突的原因
  category: 现象
  explanation: 不遵守规则、争抢物品、无意碰撞、说话不客气等，都可能引发同学之间的冲突。正确认识冲突的原因，才能更好地解决它。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:核心思想理念
  type: Concept
  subject: 道德与法治
  title: 核心思想理念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把核心思想理念等同于所有传统道德，如认为'孝顺'也属于核心理念。
    - 能指出并纠正这一错误：认为'讲仁爱'就是无差别爱所有人，反对爱有差等，如批评对陌生人不如亲人亲。
  aliases:
    - 核心思想
  category: 思想理念
  explanation: 中华优秀传统文化中具有主导性、根本性意义的思想理念，包括讲仁爱、重民本、守诚信、崇正义、尚和合、求大同。
  misconceptions:
    - 把核心思想理念等同于所有传统道德，如认为'孝顺'也属于核心理念。
    - 认为'讲仁爱'就是无差别爱所有人，反对爱有差等，如批评对陌生人不如亲人亲。
    - 将'求大同'与'和而不同'对立，以为大同就是完全一致，如要求所有民族风俗统一。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:根据场合选择服装
  type: Concept
  subject: 道德与法治
  title: 根据场合选择服装
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 不同的场合要穿合适的衣服，比如运动时穿宽松的运动服，参加典礼时穿正式的衣服。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:梦想
  type: Concept
  subject: 道德与法治
  title: 梦想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为梦想就是空想，喊喊口号就行，从不付出实际行动
    - 能指出并纠正这一错误：觉得梦想必须惊天动地，平凡的小目标不算梦想，如想当个好工人觉得没出息
  aliases: []
  category: 人生目标
  explanation: 梦想是对未来美好生活的愿望，能激发热情和勇气，让生活更有色彩。
  misconceptions:
    - 认为梦想就是空想，喊喊口号就行，从不付出实际行动
    - 觉得梦想必须惊天动地，平凡的小目标不算梦想，如想当个好工人觉得没出息
    - 认为梦想与现实无关，只靠想象就能实现，不结合自身实际
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:梦想从哪里来
  type: Concept
  subject: 道德与法治
  title: 梦想从哪里来
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 梦想常常从生活经历中来。茅以升看到家乡塌桥，立志造结实的桥，后来努力学习，终于建成了钱塘江大桥。我们也能从身边的事里找到自己的梦想。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:梦想的接力
  type: Concept
  subject: 道德与法治
  title: 梦想的接力
  conceptType: 概念型
  aliases:
    - 梦想接力棒
    - 接棒人
  category: 观点
  explanation: 实现中国梦是一场历史接力赛：革命英雄、劳动模范、科学家们一代代接力奋斗。我们也要接过前辈传来的接力棒，跑出好成绩。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:榜样在身边
  type: Concept
  subject: 道德与法治
  title: 榜样在身边
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 身边很多人都可以成为榜样：优秀的班级、爱劳动的同学、助人为乐的哥哥。看到他们的好品质，就要向他们学习。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:榫卯技艺
  type: Concept
  subject: 道德与法治
  title: 榫卯技艺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为榫卯只是古代木工装饰技术，并不具备抗震功能。
    - 能指出并纠正这一错误：以为榫卯技艺已过时，只能在古建筑中看到，现代建筑无法借鉴。
  aliases:
    - 榫卯结构
  category: 道德与法治
  explanation: 中国传统的建筑技艺，通过榫卯结合使构件有弹性，能承受载荷和变形，有效抗震，被多国借鉴。
  misconceptions:
    - 认为榫卯只是古代木工装饰技术，并不具备抗震功能。
    - 以为榫卯技艺已过时，只能在古建筑中看到，现代建筑无法借鉴。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:欢度儿童节的方式
  type: Concept
  subject: 道德与法治
  title: 欢度儿童节的方式
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 儿童节可以表演节目、和小伙伴一起玩，还可以参加庆祝活动、给山区小朋友送书，把快乐分享出去。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:欣赏自己
  type: Concept
  subject: 道德与法治
  title: 欣赏自己
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把欣赏自己当成自高自大，听不进任何批评，如认为别人提建议都是嫉妒
    - 能指出并纠正这一错误：只欣赏自己的长处，看不到自己的短处，觉得自己没有缺点
  aliases: []
  category: 自我发展
  explanation: 欣赏自己的长处和优势，激励自己不断前进，但不是孤芳自赏。
  misconceptions:
    - 把欣赏自己当成自高自大，听不进任何批评，如认为别人提建议都是嫉妒
    - 只欣赏自己的长处，看不到自己的短处，觉得自己没有缺点
    - 觉得自己到处不如人，连优点也看不上，不敢欣赏自己
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:正义的价值
  type: Concept
  subject: 道德与法治
  title: 正义的价值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把正义等同于平均主义，认为所有人获得相同财富才算正义，忽视多劳多得。
    - 能指出并纠正这一错误：认为正义只关乎个人尊严，与社会风气无关，甚至认为实现正义会拖累社会发展。
  aliases:
    - 正义的意义
  category: 道德概念
  explanation: 正义是社会文明的尺度，保障人们有尊严地生活，营造风清气正的社会风尚，是社会进步的动力。
  misconceptions:
    - 把正义等同于平均主义，认为所有人获得相同财富才算正义，忽视多劳多得。
    - 认为正义只关乎个人尊严，与社会风气无关，甚至认为实现正义会拖累社会发展。
    - 认为追求效率可以牺牲正义，比如为了GDP默许污染企业违规排放。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S8.md
- id: concept:道德与法治:正义行为与非正义行为
  type: Concept
  subject: 道德与法治
  title: 正义行为与非正义行为
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要动机善良，结果损害他人利益也是正义行为，如帮朋友隐瞒犯罪。
    - 能指出并纠正这一错误：将一切违法行为都视为非正义行为，忽视某些合法但不合理或合理但不合法的情况。
  aliases:
    - 正义
    - 非正义
  category: 道德概念
  explanation: 正义行为是促进社会进步、维护公共利益的行为，如秉公执法、见义勇为；非正义行为是损害他人和社会利益的行为，如以权谋私、恃强凌弱。
  misconceptions:
    - 认为只要动机善良，结果损害他人利益也是正义行为，如帮朋友隐瞒犯罪。
    - 将一切违法行为都视为非正义行为，忽视某些合法但不合理或合理但不合法的情况。
    - 以利益为标准判断正义：对自己有利的算正义，损害自己的就是非正义。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:正确对待老师的表扬和批评
  type: Concept
  subject: 道德与法治
  title: 正确对待老师的表扬和批评
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把老师的批评当作故意刁难，当场顶撞，从不反思自己的过错。
    - 能指出并纠正这一错误：一受表扬就洋洋得意，觉得比谁都强
  aliases:
    - 对待表扬批评
  category: 道德与法治
  explanation: 表扬是肯定鼓励，应戒骄戒躁；批评是关心提醒，应理解良苦用心，完善自我。
  misconceptions:
    - 把老师的批评当作故意刁难，当场顶撞，从不反思自己的过错。
    - 一受表扬就洋洋得意，觉得比谁都强；一受批评就自暴自弃，否定自己的一切。
    - 认为表扬就是让自己高兴，批评就是为了让自己难堪，不理解两者的教育意义。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:正确的劳动态度
  type: Concept
  subject: 道德与法治
  title: 正确的劳动态度
  conceptType: 概念型
  aliases:
    - 端正劳动态度
  category: 观点
  explanation: 劳动有苦有累，但不怕苦、不怕累才是正确的劳动态度。只享受别人的劳动成果，自己不动手，是不对的。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:正确认识自己
  type: Concept
  subject: 道德与法治
  title: 正确认识自己
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看自己的学习成绩好，就认为所有方面都优秀，以偏概全
    - 能指出并纠正这一错误：完全照搬他人的评价来认识自己，别人说自己笨就真认为自己笨
  aliases:
    - 认识自我
  category: 自我认知
  explanation: 正确认识自己有助于增强自信、促进自我发展、促进交往，正确处理个人与社会关系。
  misconceptions:
    - 只看自己的学习成绩好，就认为所有方面都优秀，以偏概全
    - 完全照搬他人的评价来认识自己，别人说自己笨就真认为自己笨
    - 认为只有自己最了解自己，完全不需要听取别人的意见
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S8.md
- id: concept:道德与法治:正确面对挫折
  type: Concept
  subject: 道德与法治
  title: 正确面对挫折
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 生活中遇到挫折时，不要怨天尤人、自暴自弃，要始终保持信心，寻找方法，不懈努力。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:每个人都应得到尊重
  type: Concept
  subject: 道德与法治
  title: 每个人都应得到尊重
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 每个人都是独一无二的个体，即使默默无闻、没有显著成就，也拥有生而为人的尊严。普通人得到应有的尊重，社会会更温暖和谐。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:毛泽东思想
  type: Concept
  subject: 道德与法治
  title: 毛泽东思想
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 以毛泽东同志为主要代表的中国共产党人，把马克思列宁主义基本原理同中国具体实际相结合创立的思想，为夺取中国革命胜利指明了正确方向。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:民主决策
  type: Concept
  subject: 道德与法治
  title: 民主决策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民主决策就是开听证会走程序，群众意见可听可不听，只要程序走过即可。
    - 能指出并纠正这一错误：认为民主决策等于少数服从多数，所有决策都必须通过投票表决。
  aliases:
    - 决策民主
  category: 民主权利
  explanation: 民主决策是保障人民利益得到充分实现的有效方式，要求广泛参与和科学化。
  misconceptions:
    - 认为民主决策就是开听证会走程序，群众意见可听可不听，只要程序走过即可。
    - 认为民主决策等于少数服从多数，所有决策都必须通过投票表决。
    - 认为有了专家咨询论证，决策就一定科学正确，不需要公众参与。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民主协商
  type: Concept
  subject: 道德与法治
  title: 民主协商
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民主协商就是大家投票表决，否认协商是沟通、协调后达成共识。
    - 能指出并纠正这一错误：认为协商只是征求意见，政府可以按自己的想法定，不尊重协商结果。
  aliases:
    - 协商
  category: 民主权利
  explanation: 民主协商保证了人民的意愿和要求得到充分表达，通过提案、座谈、论证等方式开展。
  misconceptions:
    - 认为民主协商就是大家投票表决，否认协商是沟通、协调后达成共识。
    - 认为协商只是征求意见，政府可以按自己的想法定，不尊重协商结果。
    - 认为民主协商仅适用于国家大事，社区建设、班级管理根本不需要。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民主意识
  type: Concept
  subject: 道德与法治
  title: 民主意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民主意识是天生的，不需要后天培养和教育。
    - 能指出并纠正这一错误：认为民主意识就是随便发表意见，甚至散布谣言也是民主的表现。
  aliases:
    - 民主观念
  category: 公民素养
  explanation: 民主意识是公民对民主的认知和态度，现代社会民主应成为公民的一种生活方式和生活态度。
  misconceptions:
    - 认为民主意识是天生的，不需要后天培养和教育。
    - 认为民主意识就是随便发表意见，甚至散布谣言也是民主的表现。
    - 认为未成年人没有选举权，所以不需要民主意识。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民主的足音
  type: Concept
  subject: 道德与法治
  title: 民主的足音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国民主进程是从1949年才开始，之前没有民本思想和民主探索。
    - 能指出并纠正这一错误：认为近代仁人志士的探索只是少数人的活动，不属于中国民主历史进程。
  aliases:
    - 民主探索历程
  category: 历史进程
  explanation: 指中国追求民主价值的历史进程，包括近代仁人志士的探索和中国共产党领导下的民主建设。
  misconceptions:
    - 认为中国民主进程是从1949年才开始，之前没有民本思想和民主探索。
    - 认为近代仁人志士的探索只是少数人的活动，不属于中国民主历史进程。
    - 认为中国民主是从西方直接移植来的，与中国社会土壤无关。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民主监督
  type: Concept
  subject: 道德与法治
  title: 民主监督
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民主监督就是公民在网上随意发帖抨击政府，不需要属实和理性。
    - 能指出并纠正这一错误：认为公民无权监督政府和官员，监督只是人大、纪委等专门机关的职责。
  aliases:
    - 监督民主
  category: 民主权利
  explanation: 民主监督是公民参与民主生活、行使公民监督权的具体体现，有利于改进工作、防止腐败。
  misconceptions:
    - 认为民主监督就是公民在网上随意发帖抨击政府，不需要属实和理性。
    - 认为公民无权监督政府和官员，监督只是人大、纪委等专门机关的职责。
    - 认为民主监督就是选好人大代表，之后自己就不用管了。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民主管理
  type: Concept
  subject: 道德与法治
  title: 民主管理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民主管理就是想怎么干就怎么干，不需要规章制度约束。
    - 能指出并纠正这一错误：认为民主管理只适用于村委会、居委会，国家层面不需要民主管理。
  aliases:
    - 管理民主
  category: 民主权利
  explanation: 民主管理让人人都有参与管理国家和社会各项事务的机会和渠道。
  misconceptions:
    - 认为民主管理就是想怎么干就怎么干，不需要规章制度约束。
    - 认为民主管理只适用于村委会、居委会，国家层面不需要民主管理。
    - 认为班委会是老师指定的，所以班级管理不属于民主管理。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民主选举
  type: Concept
  subject: 道德与法治
  title: 民主选举
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为我国所有人大代表都是选民直接选举产生的，全国人大代表也直选。
    - 能指出并纠正这一错误：认为选举就是摆形式，选谁最终都一样，参不参加无所谓。
  aliases:
    - 选举
  category: 民主权利
  explanation: 民主选举是人民实现民主权利的一种重要形式，包括直接选举、间接选举等，遵循公开、公平、公正原则。
  misconceptions:
    - 认为我国所有人大代表都是选民直接选举产生的，全国人大代表也直选。
    - 认为选举就是摆形式，选谁最终都一样，参不参加无所谓。
    - 认为贿选、拉票只是违法不道德，但不影响选举的民主性。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民主集中制
  type: Concept
  subject: 道德与法治
  title: 民主集中制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民主集中制就是多数决定少数，不需要听取少数意见。
    - 能指出并纠正这一错误：认为集中就是由领导人作最后决定，民主只是走过场。
  aliases: []
  category: 政治原则
  explanation: 重大问题经人民代表大会充分讨论，遵循少数服从多数原则，民主决定。
  misconceptions:
    - 认为民主集中制就是多数决定少数，不需要听取少数意见。
    - 认为集中就是由领导人作最后决定，民主只是走过场。
    - 把民主集中制等同于西方民主制度，认为只有民主没有集中。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:民事诉讼
  type: Concept
  subject: 道德与法治
  title: 民事诉讼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为民事诉讼中谁有理谁就不用举证，忽略‘谁主张谁举证’。
    - 能指出并纠正这一错误：认为民事诉讼只能向法院起诉，不知道也可申请调解。
  aliases: []
  category: 法律程序
  explanation: 人民法院在当事人和其他诉讼参与人参加下，依法审理民事案件和解决民事纠纷的活动。
  misconceptions:
    - 以为民事诉讼中谁有理谁就不用举证，忽略‘谁主张谁举证’。
    - 认为民事诉讼只能向法院起诉，不知道也可申请调解。
    - 混淆民事纠纷与刑事案件，以为欠钱不还属于犯罪。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:民族区域自治制度
  type: Concept
  subject: 道德与法治
  title: 民族区域自治制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为民族自治地方不受中央统一领导，可以完全独立。
    - 能指出并纠正这一错误：把自治权理解为自治机关可以随意制定法律，与法律相抵触。
  aliases:
    - 民族自治制度
  category: 政治制度
  explanation: 我国的一项基本政治制度，在少数民族聚居的地方实行区域自治，设立自治机关，行使自治权。
  misconceptions:
    - 误以为民族自治地方不受中央统一领导，可以完全独立。
    - 把自治权理解为自治机关可以随意制定法律，与法律相抵触。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:民族团结
  type: Concept
  subject: 道德与法治
  title: 民族团结
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民族团结就是各民族完全一样，取消各自风俗习惯，如要求回民也吃猪肉。
    - 能指出并纠正这一错误：把民族团结曲解为只发生在少数民族地区，或认为只是少数民族之间的事。
  aliases: []
  category: 政治概念
  explanation: 各民族在平等基础上相互尊重、相互包容、相互帮助，共同维护国家统一和社会稳定。
  misconceptions:
    - 认为民族团结就是各民族完全一样，取消各自风俗习惯，如要求回民也吃猪肉。
    - 把民族团结曲解为只发生在少数民族地区，或认为只是少数民族之间的事。
    - 以为民族团结意味着摒弃民族差异，搞民族同化，反而制造矛盾。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:民族复兴
  type: Concept
  subject: 道德与法治
  title: 民族复兴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民族复兴就是要恢复古代汉唐的版图，而非实现现代化。
    - 能指出并纠正这一错误：把民族复兴等同为经济总量世界第一，与个人生活无关。
  aliases:
    - 中国梦
  category: 政治理论
  explanation: 指中华民族的伟大复兴，是近代以来中国人民的共同梦想。
  misconceptions:
    - 认为民族复兴就是要恢复古代汉唐的版图，而非实现现代化。
    - 把民族复兴等同为经济总量世界第一，与个人生活无关。
    - 觉得民族复兴是国家和伟人的事，自己作为学生毫无责任。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:民族平等
  type: Concept
  subject: 道德与法治
  title: 民族平等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民族平等就是各民族完全一样，要求取消所有差异，如强制统一语言。
    - 能指出并纠正这一错误：误以为国家对少数民族的照顾政策违反平等，不知这是实质平等的体现。
  aliases: []
  category: 政治概念
  explanation: 各民族不论人口多少、经济社会发展程度高低、风俗习惯和宗教信仰差异，都具有同等的社会地位，享有平等的权利，承担相同的义务。
  misconceptions:
    - 认为民族平等就是各民族完全一样，要求取消所有差异，如强制统一语言。
    - 误以为国家对少数民族的照顾政策违反平等，不知这是实质平等的体现。
    - 把民族平等等同于绝对平均，认为汉族和少数民族待遇必须完全相同。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:民族精神
  type: Concept
  subject: 道德与法治
  title: 民族精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将民族精神等同于爱国主义，忽略团结统一、爱好和平、勤劳勇敢、自强不息。
    - 能指出并纠正这一错误：认为和平年代民族精神‘过时’了，只有打仗时才需要。
  aliases:
    - 中华民族精神
  category: 精神
  explanation: 以爱国主义为核心的团结统一、爱好和平、勤劳勇敢、自强不息的伟大民族精神。
  misconceptions:
    - 将民族精神等同于爱国主义，忽略团结统一、爱好和平、勤劳勇敢、自强不息。
    - 认为和平年代民族精神‘过时’了，只有打仗时才需要。
    - 把民族精神等同于传统文化中的道德观念，忽略其时代性。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:民族精神的具体体现
  type: Concept
  subject: 道德与法治
  title: 民族精神的具体体现
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为伟大抗疫精神是独立精神，不是中华民族精神的具体体现。
    - 能指出并纠正这一错误：认为民族精神只体现在几个固定历史时期，否认新时代还会产生新精神。
  aliases:
    - 时代精神
  category: 道德与法治
  explanation: 不同历史时期形成的具体精神，如井冈山精神、长征精神、延安精神、抗美援朝精神、雷锋精神、特区精神、载人航天精神、伟大抗疫精神、脱贫攻坚精神、北京冬奥精神等，都是中华民族精神的具体体现，具有鲜明的先进性和时代性。
  misconceptions:
    - 误以为伟大抗疫精神是独立精神，不是中华民族精神的具体体现。
    - 认为民族精神只体现在几个固定历史时期，否认新时代还会产生新精神。
    - 评价人物时说‘雷锋精神超越了民族精神’，将二者对立。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:民族自信
  type: Concept
  subject: 道德与法治
  title: 民族自信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民族自信就是觉得本国一切都好，看不到任何不足。
    - 能指出并纠正这一错误：把民族自信等同于抵制外来文化，盲目排外。
  aliases:
    - 民族自信心
  category: 民族精神
  explanation: 民族自信源于国家的发展成就，是平视世界的底气，赋予我们坚定的民族自豪感。
  misconceptions:
    - 认为民族自信就是觉得本国一切都好，看不到任何不足。
    - 把民族自信等同于抵制外来文化，盲目排外。
    - 认为民族自信只是国家的事，与个人无关。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:民本思想
  type: Concept
  subject: 道德与法治
  title: 民本思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“民惟邦本”直接等同于“人民当家作主”，认为古代就有民主。
    - 能指出并纠正这一错误：认为民本思想是儒家首创，道家和法家都没有类似思想。
  aliases:
    - 民惟邦本
  category: 传统文化
  explanation: 中华优秀传统文化中的民本思想如'民惟邦本'等，是中国民主价值追求的重要思想源头。
  misconceptions:
    - 把“民惟邦本”直接等同于“人民当家作主”，认为古代就有民主。
    - 认为民本思想是儒家首创，道家和法家都没有类似思想。
    - 认为民本思想和现代民主本质一样，只是称呼不同。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:民法典
  type: Concept
  subject: 道德与法治
  title: 民法典
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为民法典调整所有社会关系，如刑事犯罪和行政处分
    - 能指出并纠正这一错误：认为民法典仅调整财产关系，或仅调整人身关系
  aliases:
    - 中华人民共和国民法典
  category: 法律
  explanation: 调整平等主体之间的人身关系和财产关系，体现对生命健康、财产安全等权利平等保护的法律。
  misconceptions:
    - 误以为民法典调整所有社会关系，如刑事犯罪和行政处分
    - 认为民法典仅调整财产关系，或仅调整人身关系
    - 将民法典与民法通则混淆，不知民法典更系统全面
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:民法典基本原则
  type: Concept
  subject: 道德与法治
  title: 民法典基本原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为自愿原则可随意约定，如买卖珍稀野生动物
    - 能指出并纠正这一错误：认为诚信原则只在签合同时用，其他民事活动无所谓
  aliases:
    - 民法基本原则
  category: 法律原则
  explanation: 包括平等、自愿、公平、诚信、守法和公序良俗、绿色等原则，指导民事活动。
  misconceptions:
    - 误以为自愿原则可随意约定，如买卖珍稀野生动物
    - 认为诚信原则只在签合同时用，其他民事活动无所谓
    - 将公序良俗原则等同于一般道德，认为违背道德即违法
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:民间艺术
  type: Concept
  subject: 道德与法治
  title: 民间艺术
  conceptType: 概念型
  aliases:
    - 多姿多彩的民间艺术
  category: 概念
  explanation: 民间文学、民间音乐、民间舞蹈、民间美术和民间手工艺等都是民间艺术，比如舞狮、秧歌、皮影、刺绣。它们由劳动者创造，表达人们的美好愿望。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:水是生命之源
  type: Concept
  subject: 道德与法治
  title: 水是生命之源
  conceptType: 概念型
  aliases:
    - 小水滴的诉说
  category: 观点
  explanation: 水很珍贵，有水山川才绿、秧苗才长，人离不开水。可是浪费水和乱扔垃圾会让小水滴遭遇不幸，我们要珍惜每一滴水。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:求助的方法
  type: Concept
  subject: 道德与法治
  title: 求助的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 遇到困难要向合适的人求助，比如请老师、家长帮忙，也可以到传达室借电话，求助时要有礼貌。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:求同存异、和而不同
  type: Concept
  subject: 道德与法治
  title: 求同存异、和而不同
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'存异'理解为容忍错误观点，如对他人违法行为也说'有个性'。
    - 能指出并纠正这一错误：认为'和而不同'就是表面客气，内心保留意见，如开会不发言只点头。
  aliases:
    - 和而不同
    - 求同存异
  category: 处世方法
  explanation: 既找出共同点又保留不同点，和谐相处但不盲从苟同。
  misconceptions:
    - 把'存异'理解为容忍错误观点，如对他人违法行为也说'有个性'。
    - 认为'和而不同'就是表面客气，内心保留意见，如开会不发言只点头。
    - 将'求同'曲解为附和他人，放弃独立判断，如明知方案有错也随大流。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:求同存异、和而不同的处世方法
  type: Concept
  subject: 道德与法治
  title: 求同存异、和而不同的处世方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为求同存异就是折中调和，各打五十大板，如对守规违纪各罚一半。
    - 能指出并纠正这一错误：把'和而不同'当作无条件退让，在原则问题上也不坚持，如签协议时放弃底线。
  aliases:
    - 和而不同
    - 求同存异
  category: 处世方法
  explanation: 求同存异指找出共同点并保留不同点，和而不同指和谐相处但不盲从苟同，有助于解决人际矛盾。
  misconceptions:
    - 认为求同存异就是折中调和，各打五十大板，如对守规违纪各罚一半。
    - 把'和而不同'当作无条件退让，在原则问题上也不坚持，如签协议时放弃底线。
    - 以为'求同'必须掩盖矛盾，假装一致，如粉饰团队真实分歧。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:求同存异的外交方针
  type: Concept
  subject: 道德与法治
  title: 求同存异的外交方针
  conceptType: 概念型
  aliases:
    - 求同存异
  category: 概念
  explanation: 1955年周恩来在万隆会议上提出的方针，为会议的圆满成功作出重要贡献，增进了中国与亚非各国的理解与信任。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:求大同
  type: Concept
  subject: 道德与法治
  title: 求大同
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“求大同”就是“平均分配、吃大锅饭”，忽略其追求和谐美好社会的本质。
    - 能指出并纠正这一错误：说“求大同”要消灭一切差异，导致把“大同”误解为完全一致。
  aliases:
    - 大同
  category: 核心思想理念
  explanation: 胸怀天下，追求和谐美好的理想社会，为人类进步作贡献。
  misconceptions:
    - 认为“求大同”就是“平均分配、吃大锅饭”，忽略其追求和谐美好社会的本质。
    - 说“求大同”要消灭一切差异，导致把“大同”误解为完全一致。
    - 觉得大同社会只是古人空想，与当代实现中国梦无关。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:汉谟拉比法典
  type: Concept
  subject: 道德与法治
  title: 汉谟拉比法典
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 古巴比伦国王汉谟拉比制定的法典，是迄今已知的世界上第一部较为完整的成文法典，共282条，用楔形文字刻在石柱上。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:汽车文明
  type: Concept
  subject: 道德与法治
  title: 汽车文明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为汽车文明只是汽车品牌多、道路设施好，不涉及人的行为素质
    - 能指出并纠正这一错误：把行人优先理解为行人可以随意穿行，司机必须无理由让行
  aliases: []
  category: 道德与法治
  explanation: 汽车文明不仅表现为品牌、设施和法规，更体现为对人与汽车关系的认识，如行人优先等行为准则。
  misconceptions:
    - 认为汽车文明只是汽车品牌多、道路设施好，不涉及人的行为素质
    - 把行人优先理解为行人可以随意穿行，司机必须无理由让行
    - 认为汽车文明只约束驾驶员，行人不用遵守任何交通规则
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:沉迷网络游戏的危害
  type: Concept
  subject: 道德与法治
  title: 沉迷网络游戏的危害
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 沉迷网络游戏会给身心带来伤害，影响学习，还可能给家庭造成经济损失，也会让朋友渐渐疏远自己。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:法定义务
  type: Concept
  subject: 道德与法治
  title: 法定义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把道德义务当成法定义务，认为不道德行为都会受到法律制裁。
    - 能指出并纠正这一错误：认为法定义务可以自愿放弃，只要自己愿意承担后果就行。
  aliases: []
  category: 法律概念
  explanation: 由宪法和法律规定的义务，具有强制性，公民必须履行。
  misconceptions:
    - 把道德义务当成法定义务，认为不道德行为都会受到法律制裁。
    - 认为法定义务可以自愿放弃，只要自己愿意承担后果就行。
    - 混淆法定义务与基本义务，认为法定义务只是宪法规定的那些。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:法律
  type: Concept
  subject: 道德与法治
  title: 法律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把法律和道德混为一谈，认为不道德就是违法，比如不给老人让座就该受法律制裁。
    - 能指出并纠正这一错误：认为法律只管坏人，自己是好人，所以学习法律没必要，违法的事自己也不会做。
  aliases: []
  category: 法律概念
  explanation: 法律是一种社会规则和行为规范，是评价人们的行为是否合法有效的准绳。
  misconceptions:
    - 把法律和道德混为一谈，认为不道德就是违法，比如不给老人让座就该受法律制裁。
    - 认为法律只管坏人，自己是好人，所以学习法律没必要，违法的事自己也不会做。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:法律上的重要年龄节点
  type: Concept
  subject: 道德与法治
  title: 法律上的重要年龄节点
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 很多法律规定都涉及具体年龄，不同年龄在法律上有不同意义。如6周岁是小学入学年龄，12周岁才能骑自行车上路，18周岁取得选举资格。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:法律与道德的关系
  type: Concept
  subject: 道德与法治
  title: 法律与道德的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律可以替代道德，只要依法办事就行，忽略道德教化作用。
    - 能指出并纠正这一错误：把违反道德的行为直接视为违法行为，如认为撒谎就应受法律制裁。
  aliases:
    - 法治与德治相结合
  category: 法治原理
  explanation: 国家和社会治理需要法律和道德共同发挥作用，法律与道德相辅相成，法治与德治相得益彰。
  misconceptions:
    - 认为法律可以替代道德，只要依法办事就行，忽略道德教化作用。
    - 把违反道德的行为直接视为违法行为，如认为撒谎就应受法律制裁。
    - 认为法治与德治相互对立，主张只靠法律或只靠道德来治理国家。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:法律促进社会发展
  type: Concept
  subject: 道德与法治
  title: 法律促进社会发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律只有打击犯罪的作用，没有促进发展功能
    - 能指出并纠正这一错误：误以为法律促进发展就是政府直接拨款或干预
  aliases: []
  category: 法律作用
  explanation: 法律为各领域发展提供方向指引和保障，推动社会制度化、法治化。
  misconceptions:
    - 认为法律只有打击犯罪的作用，没有促进发展功能
    - 误以为法律促进发展就是政府直接拨款或干预
    - 认为有法律就能自动实现社会进步，忽略实施与配套
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:法律促进社会和谐
  type: Concept
  subject: 道德与法治
  title: 法律促进社会和谐
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 法律衡量行为是否合法，让违法的行为受到制裁，合法的行为受到保护，让生活更安全、更有保障、更公平。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:法律保护社会公共利益
  type: Concept
  subject: 道德与法治
  title: 法律保护社会公共利益
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律只保护个人，不保护环境、公共安全等利益
    - 能指出并纠正这一错误：误以为公共利益可以无条件优先，随意侵犯个人合法权利
  aliases: []
  category: 法律作用
  explanation: 法律设定个人权利界限，平衡个人利益与社会公共利益，防止滥用权利损害公共利益。
  misconceptions:
    - 认为法律只保护个人，不保护环境、公共安全等利益
    - 误以为公共利益可以无条件优先，随意侵犯个人合法权利
    - 认为个人行使权利不受限制，公共利益不能约束自己的行为
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:法律指引行为
  type: Concept
  subject: 道德与法治
  title: 法律指引行为
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 法律作为社会生活的基本规则，告诉我们可以做什么、不应该做什么、必须做什么，是我们行为的指南针。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:法律援助
  type: Concept
  subject: 道德与法治
  title: 法律援助
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 法律援助是国家为经济困难的公民和符合条件的人无偿提供法律咨询、代理等服务的制度，可以拨打12348公共法律服务热线求助。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:法律援助中心
  type: Concept
  subject: 道德与法治
  title: 法律援助中心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为任何经济困难公民都能获得援助，忽略需要符合法定条件。
    - 能指出并纠正这一错误：以为法律援助中心只提供法律咨询，不能代理诉讼。
  aliases: []
  category: 法律组织
  explanation: 为经济困难公民和符合法定条件的其他当事人无偿提供法律咨询、代理、刑事辩护等法律服务。
  misconceptions:
    - 认为任何经济困难公民都能获得援助，忽略需要符合法定条件。
    - 以为法律援助中心只提供法律咨询，不能代理诉讼。
    - 把法律援助中心当作收费服务，认为必须交钱才帮忙。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:法律救济
  type: Concept
  subject: 道德与法治
  title: 法律救济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律救济就是要求对方赔钱，忽略恢复名誉、消除影响等。
    - 能指出并纠正这一错误：受到侵害只想到打官司，不知道还能控告、举报、报案。
  aliases: []
  category: 法律途径
  explanation: 通过法律途径获得帮助，包括控告、举报、提起诉讼等。
  misconceptions:
    - 认为法律救济就是要求对方赔钱，忽略恢复名誉、消除影响等。
    - 受到侵害只想到打官司，不知道还能控告、举报、报案。
    - 把法律救济等同于社会救济，混淆司法救济与民政救助。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:法律服务机构
  type: Concept
  subject: 道德与法治
  title: 法律服务机构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为律师事务所、公证处都是国家司法机关，有强制权力。
    - 能指出并纠正这一错误：以为所有法律服务机构都收费，不知道法律援助中心无偿。
  aliases: []
  category: 法律组织
  explanation: 包括人民调解委员会、律师事务所、公证处、法律援助中心等，为公民提供法律帮助。
  misconceptions:
    - 认为律师事务所、公证处都是国家司法机关，有强制权力。
    - 以为所有法律服务机构都收费，不知道法律援助中心无偿。
    - 将人民调解委员会调解与法院判决效力等同，认为可强制执行。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:法律权威
  type: Concept
  subject: 道德与法治
  title: 法律权威
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律权威来自国家强制力，比如暴力机关，而不是人民内心的拥护。
    - 能指出并纠正这一错误：看到有人违法没被追责，就认为法律没有权威，不再信任法律。
  aliases: []
  category: 法治观念
  explanation: 法律的权威源自人民的内心拥护和真诚信仰，法律只有铭刻在内心，尊法学法守法用法才会成为自觉行为。
  misconceptions:
    - 认为法律权威来自国家强制力，比如暴力机关，而不是人民内心的拥护。
    - 看到有人违法没被追责，就认为法律没有权威，不再信任法律。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:法律禁止做的坚决不做
  type: Concept
  subject: 道德与法治
  title: 法律禁止做的坚决不做
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要不被发现，做法律禁止的事就没关系。
    - 能指出并纠正这一错误：认为法律禁止的只是犯罪行为，一般违法没关系。
  aliases: []
  category: 法律原则
  explanation: 公民不得实施法律禁止的行为，否则需承担相应法律责任。
  misconceptions:
    - 认为只要不被发现，做法律禁止的事就没关系。
    - 认为法律禁止的只是犯罪行为，一般违法没关系。
    - 以为法律没有明文禁止就可以做，即使危害社会。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:法律维护社会秩序
  type: Concept
  subject: 道德与法治
  title: 法律维护社会秩序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护秩序只需严惩违法，忽视规范行为和调解纠纷
    - 能指出并纠正这一错误：误以为法律维护秩序就是限制自由，二者不可兼得
  aliases: []
  category: 法律作用
  explanation: 法律通过规范行为、建立制度、调解纠纷和制裁违法来维护社会秩序。
  misconceptions:
    - 认为维护秩序只需严惩违法，忽视规范行为和调解纠纷
    - 误以为法律维护秩序就是限制自由，二者不可兼得
    - 认为只有犯罪才破坏秩序，轻微违法不影响秩序
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:法律要求做的必须去做
  type: Concept
  subject: 道德与法治
  title: 法律要求做的必须去做
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为不履行法律要求的行为只是不作为，不构成违法。
    - 能指出并纠正这一错误：把道德义务与法律义务混淆，认为见义勇为是法律要求。
  aliases: []
  category: 法律原则
  explanation: 公民必须按照法律要求作出一定行为，否则可能构成违法或犯罪。
  misconceptions:
    - 认为不履行法律要求的行为只是不作为，不构成违法。
    - 把道德义务与法律义务混淆，认为见义勇为是法律要求。
    - 误以为法律要求做的都是小事，如纳税，可以做也可以不做。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:法律规定权利和义务
  type: Concept
  subject: 道德与法治
  title: 法律规定权利和义务
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 法律规定了我们享有的权利，如人身权、财产权、受教育权等；也规定了我们必须履行的义务，如遵守交通规则、爱护公物。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:法律面前人人平等
  type: Concept
  subject: 道德与法治
  title: 法律面前人人平等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为领导、明星犯了罪可以因为身份特殊而减轻处罚。
    - 能指出并纠正这一错误：觉得有钱人能请好律师，法律就会偏向他，所以法律面前不平等。
  aliases: []
  category: 道德与法治
  explanation: 法律面前人人平等是宪法原则，任何人在适用法律上一律平等，不允许有超越法律的特权。
  misconceptions:
    - 认为领导、明星犯了罪可以因为身份特殊而减轻处罚。
    - 觉得有钱人能请好律师，法律就会偏向他，所以法律面前不平等。
    - 认为执法人员在处理熟人违章时可以睁一只眼闭一只眼。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:法治
  type: Concept
  subject: 道德与法治
  title: 法治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将法治等同于法制，认为有法律条文就是法治，忽略良法与善治。
    - 能指出并纠正这一错误：认为法治只是政府管理老百姓的工具，不保障公民权利和自由。
  aliases:
    - 依法治国
  category: 法律概念
  explanation: 法治意味着依法治理，要求实行良法之治和善治，保障公民权利和自由，是现代文明的重要标志。
  misconceptions:
    - 将法治等同于法制，认为有法律条文就是法治，忽略良法与善治。
    - 认为法治只是政府管理老百姓的工具，不保障公民权利和自由。
    - 觉得只要严格执法就是法治，不考虑法律本身是否公正合理。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:法治与德治的关系
  type: Concept
  subject: 道德与法治
  title: 法治与德治的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将法律等同于道德，认为违背道德的行为就是违法行为。
    - 能指出并纠正这一错误：认为法治和德治相互对立，有法治就不要德治。
  aliases:
    - 法治与德治相得益彰
  category: 法治
  explanation: 法治和德治都是治国理政不可或缺的重要手段，法律是成文的道德，道德是内心的法律，二者相互补充、相互促进、相得益彰。
  misconceptions:
    - 将法律等同于道德，认为违背道德的行为就是违法行为。
    - 认为法治和德治相互对立，有法治就不要德治。
    - 认为德治比法治更重要，法律可有可无。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S4.md
- id: concept:道德与法治:法治与改革的关系
  type: Concept
  subject: 道德与法治
  title: 法治与改革的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为改革可以突破法律禁区，先破后立、成功后立法。
    - 能指出并纠正这一错误：把二者对立，认为法治阻碍改革，改革无需依法。
  aliases:
    - 法治与改革相互促进
  category: 法治
  explanation: 改革和法治相辅相成、相互促进，坚持在法治下推进改革，在改革中完善法治。
  misconceptions:
    - 认为改革可以突破法律禁区，先破后立、成功后立法。
    - 把二者对立，认为法治阻碍改革，改革无需依法。
    - 认为只要符合改革方向，违反法律程序也合法。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S3.md
- id: concept:道德与法治:法治中国建设
  type: Concept
  subject: 道德与法治
  title: 法治中国建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法治中国建设只是立法机关和司法机关的事，与普通公民无关。
    - 能指出并纠正这一错误：相信法治中国建设可以一蹴而就，短期内就能全面实现。
  aliases: []
  category: 法治建设
  explanation: 法治是崇高的社会理想，也是伟大的社会实践和长期的系统工程，建设法治中国任重道远。
  misconceptions:
    - 认为法治中国建设只是立法机关和司法机关的事，与普通公民无关。
    - 相信法治中国建设可以一蹴而就，短期内就能全面实现。
    - 把法治中国建设等同于多制定法律，忽略实践和系统工程。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:法治对德治的促进作用
  type: Concept
  subject: 道德与法治
  title: 法治对德治的促进作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法治对德治的促进仅体现在惩罚败德行为，忽略激励作用。
    - 能指出并纠正这一错误：误认为有了良法，社会道德就会自动提升。
  aliases: []
  category: 法治
  explanation: 法治以法治承载道德理念，把道德要求上升为法律规范，严格执法、公正司法，激励立德扬善，提升全社会道德素质。
  misconceptions:
    - 认为法治对德治的促进仅体现在惩罚败德行为，忽略激励作用。
    - 误认为有了良法，社会道德就会自动提升。
    - 把法律视为万能，认为法治可以完全替代德治。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:法治建设长期性
  type: Concept
  subject: 道德与法治
  title: 法治建设长期性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法律体系健全了就等于法治建成，看不到法治实践和长期性。
    - 能指出并纠正这一错误：觉得法治建设是政府的事，自己作为学生无需关注和参与。
  aliases:
    - 法治长期性
  category: 法治原理
  explanation: 法治既是崇高的社会理想，也是伟大的社会实践和长期的系统工程，不可能一蹴而就，建设法治中国任重道远。
  misconceptions:
    - 认为法律体系健全了就等于法治建成，看不到法治实践和长期性。
    - 觉得法治建设是政府的事，自己作为学生无需关注和参与。
    - 认为法治建设只要抓几个典型案件就能快速完成，不必长期坚持。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:法治思维
  type: Concept
  subject: 道德与法治
  title: 法治思维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把法治思维等同于法律知识丰富，认为只有律师、法官才具备。
    - 能指出并纠正这一错误：认为法治思维就是遇事打官司，忽略依法办事、程序正义。
  aliases: []
  category: 法律概念
  explanation: 坚持法律面前人人平等，以法律为最高权威，具有稳定性和一贯性。
  misconceptions:
    - 把法治思维等同于法律知识丰富，认为只有律师、法官才具备。
    - 认为法治思维就是遇事打官司，忽略依法办事、程序正义。
    - 觉得法治思维就是按个人喜好随意解释法律，缺乏稳定性和一贯性。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:法治思维与人治思维
  type: Concept
  subject: 道德与法治
  title: 法治思维与人治思维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人治思维就是完全不讲法律，只要领导说了算。
    - 能指出并纠正这一错误：把领导依法拍板决策误认为是人治思维，不区分依据来源。
  aliases: []
  category: 法律概念
  explanation: 法治思维坚持法律面前人人平等，以法律为最高权威；人治思维漠视规则，按个人意志治理。
  misconceptions:
    - 认为人治思维就是完全不讲法律，只要领导说了算。
    - 把领导依法拍板决策误认为是人治思维，不区分依据来源。
    - 认为法治思维与人治思维可以随意混合，有时靠法律有时靠个人。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:法治思维和法治方式
  type: Concept
  subject: 道德与法治
  title: 法治思维和法治方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为运用法治思维和法治方式是公检法的事，与普通党员和政府工作人员无关。
    - 能指出并纠正这一错误：觉得只要自己不违法就行了，无需主动提高运用法治方式的能力。
  aliases: []
  category: 法治能力
  explanation: 党和政府及其工作人员要带头尊法学法守法用法，提高运用法治思维和法治方式深化改革、推动发展、化解矛盾、维护稳定、应对风险的能力。
  misconceptions:
    - 认为运用法治思维和法治方式是公检法的事，与普通党员和政府工作人员无关。
    - 觉得只要自己不违法就行了，无需主动提高运用法治方式的能力。
    - 把法治方式等同于打官司，认为深化改革、化解矛盾不需要法治思维。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:法治政府建设
  type: Concept
  subject: 道德与法治
  title: 法治政府建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法治政府就是政府自己制定法律并执行。
    - 能指出并纠正这一错误：把法治政府建设等同于人大立法，忽略依法行政。
  aliases: []
  category: 法治
  explanation: 法治政府建设是全面依法治国的重点任务和主体工程，要求政府依法行政，建设职能科学、权责法定、执法严明、公开公正、智能高效、廉洁诚信、人民满意的政府。
  misconceptions:
    - 认为法治政府就是政府自己制定法律并执行。
    - 把法治政府建设等同于人大立法，忽略依法行政。
    - 认为建设法治政府只是政府的事，与公民无关。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S6.md
- id: concept:道德与法治:法治文化环境
  type: Concept
  subject: 道德与法治
  title: 法治文化环境
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为营造法治文化环境只是宣传部门的事，其他部门不用参与。
    - 能指出并纠正这一错误：把法治宣传等同于发传单、拉横幅，忽略弘扬精神和传统法律文化。
  aliases:
    - 法治文化氛围
    - 法治文化
  category: 法治文化
  explanation: 厉行法治需要加强法治宣传，弘扬社会主义法治精神，传承中华优秀传统法律文化，共同营造良好的法治文化环境，树立“守法光荣、违法可耻”的导向。
  misconceptions:
    - 认为营造法治文化环境只是宣传部门的事，其他部门不用参与。
    - 把法治宣传等同于发传单、拉横幅，忽略弘扬精神和传统法律文化。
    - 觉得“守法光荣、违法可耻”的导向只针对违法者，与守法人无关。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:法治观念
  type: Concept
  subject: 道德与法治
  title: 法治观念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为熟背法律条文就等于有法治观念，实际遇到事却不按法律做。
    - 能指出并纠正这一错误：认为法治观念是法律工作者的事，普通人只要不犯法就行，无需主动学法。
  aliases: []
  category: 法治素养
  explanation: 法治观念体现为人们对法律发自内心的认可、崇尚、遵守和服从。
  misconceptions:
    - 以为熟背法律条文就等于有法治观念，实际遇到事却不按法律做。
    - 认为法治观念是法律工作者的事，普通人只要不犯法就行，无需主动学法。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S6.md
- id: concept:道德与法治:浪费的危害
  type: Concept
  subject: 道德与法治
  title: 浪费的危害
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 浪费会加剧资源匮乏，破坏生态环境，败坏社会风气。每一件产品都凝聚着劳动者的辛劳，浪费也是对劳动成果的不尊重。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:海南自由贸易港法治体系
  type: Concept
  subject: 道德与法治
  title: 海南自由贸易港法治体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为海南自由贸易港法由海南省人大制定。
    - 能指出并纠正这一错误：认为海南自贸港可以不受国家法律约束，只有地方性法规。
  aliases: []
  category: 法治建设
  explanation: 以海南自由贸易港法为基础，以地方性法规和商事纠纷解决机制为重要组成的法治体系，营造国际一流的法治环境。
  misconceptions:
    - 误认为海南自由贸易港法由海南省人大制定。
    - 认为海南自贸港可以不受国家法律约束，只有地方性法规。
    - 把海南自贸港法治体系等同于普通地方立法体系。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:深圳经济特区立法权
  type: Concept
  subject: 道德与法治
  title: 深圳经济特区立法权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为深圳可以制定法律（狭义），而不仅是法规和规章。
    - 能指出并纠正这一错误：误认为深圳经济特区立法权是深圳固有的，无需授权。
  aliases:
    - 特区立法权
  category: 立法制度
  explanation: 全国人大常委会授权深圳经济特区制定法规和规章，深圳的地方立法为国家立法提供了借鉴。
  misconceptions:
    - 认为深圳可以制定法律（狭义），而不仅是法规和规章。
    - 误认为深圳经济特区立法权是深圳固有的，无需授权。
    - 将深圳的特区立法权与一般地方立法权混为一谈。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S3.md
- id: concept:道德与法治:清明节
  type: Concept
  subject: 道德与法治
  title: 清明节
  conceptType: 概念型
  aliases:
    - 踏青节
  category: 文化常识
  explanation: 清明节在每年4月5日前后，已有两千多年历史。人们在这一天扫墓祭祖、悼念先烈，也去郊外踏青、放风筝，所以又叫踏青节。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:港人治港、澳人治澳
  type: Concept
  subject: 道德与法治
  title: 港人治港、澳人治澳
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'港人治港'意味着香港可完全脱离中央，变成独立政治实体。
    - 能指出并纠正这一错误：以为'港人治港'是香港所有官员必须由香港出生的人担任，排斥中央任命的权力。
  aliases:
    - 高度自治
  category: 政治原则
  explanation: 香港、澳门特别行政区由当地居民依法管理，实行高度自治，是“一国两制”方针的具体体现。
  misconceptions:
    - 认为'港人治港'意味着香港可完全脱离中央，变成独立政治实体。
    - 以为'港人治港'是香港所有官员必须由香港出生的人担任，排斥中央任命的权力。
    - 将高度自治误解为不受中央任何管辖，连外交、国防也由香港自行负责。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:火灾自救与求救
  type: Concept
  subject: 道德与法治
  title: 火灾自救与求救
  conceptType: 程序型
  aliases:
    - 火警电话119
  category: 方法
  explanation: 遇到火灾要用湿毛巾捂住口鼻、低身走向安全出口，被困时向窗外发出求救信号。拨打火警电话119时要讲清楚详细地址和火势等信息。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:火烧圆明园
  type: Concept
  subject: 道德与法治
  title: 火烧圆明园
  conceptType: 概念型
  aliases:
    - 英法联军火烧圆明园
  category: 文化常识
  explanation: 1860 年第二次鸦片战争中，英法联军闯入皇家园林圆明园，洗劫珍宝后放火焚烧，被誉为万园之园的园林毁于一旦。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:烈士纪念日
  type: Concept
  subject: 道德与法治
  title: 烈士纪念日
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 9月30日是烈士纪念日，用来缅怀为新中国献出生命的英雄烈士。这一天人们向人民英雄纪念碑敬献花篮。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:爱国主义
  type: Concept
  subject: 道德与法治
  title: 爱国主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为爱国不等于爱党、爱社会主义，将二者割裂。
    - 能指出并纠正这一错误：把爱国主义等同于抵制一切外国货，忽视开放包容和理性爱国。
  aliases:
    - 爱国情怀
  category: 精神
  explanation: 中华民族精神的核心，当代爱国主义的本质是坚持爱国和爱党、爱社会主义高度统一。
  misconceptions:
    - 认为爱国不等于爱党、爱社会主义，将二者割裂。
    - 把爱国主义等同于抵制一切外国货，忽视开放包容和理性爱国。
    - 将爱国主义与狭隘民族主义混为一谈，以为排外就是爱国。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:爱国者治港、爱国者治澳
  type: Concept
  subject: 道德与法治
  title: 爱国者治港、爱国者治澳
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为爱国者治港就是只允许爱国政党参选，其他政治派别统统不能存在。
    - 能指出并纠正这一错误：以为爱国者治港与港人治港相互矛盾，是取消港人治港。
  aliases: []
  category: 政治原则
  explanation: 要求香港、澳门的治理者必须爱国，确保特别行政区管治权掌握在爱国者手中。
  misconceptions:
    - 认为爱国者治港就是只允许爱国政党参选，其他政治派别统统不能存在。
    - 以为爱国者治港与港人治港相互矛盾，是取消港人治港。
    - 把爱国者治港理解为所有香港居民都必须加入共产党，否则就不算爱国。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:爱家人的方式
  type: Concept
  subject: 道德与法治
  title: 爱家人的方式
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 爱家人可以帮做小事，记住家人的生日，自己能做的事自己做，不让家人操心。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:爱慕虚荣
  type: Concept
  subject: 道德与法治
  title: 爱慕虚荣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为爱慕虚荣就是注重形象，是自尊的表现。
    - 能指出并纠正这一错误：把追求名牌、攀比当作自信，实则虚荣。
  aliases:
    - 虚荣
  category: 心理现象
  explanation: 指过分追求表面上的荣耀，为名利所惑，不能正确认识自己。自尊的人应避免爱慕虚荣。
  misconceptions:
    - 认为爱慕虚荣就是注重形象，是自尊的表现。
    - 把追求名牌、攀比当作自信，实则虚荣。
    - 认为虚荣心能促使人上进，不全是坏事。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:爱护公共设施
  type: Concept
  subject: 道德与法治
  title: 爱护公共设施
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 公共设施默默为我们提供帮助，如果被人破坏，最终受伤害的是我们自己。发现设施损坏要向有关部门反映，及时维修。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:爱护动物的方法
  type: Concept
  subject: 道德与法治
  title: 爱护动物的方法
  conceptType: 程序型
  aliases:
    - 和动物好好相处
  category: 规则
  explanation: 真正喜欢动物，就要按时按量给它喂食，不乱喂动物园里的动物，离危险的动物远一点，和动物在一起时保护好自己。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:爱护新书和书包
  type: Concept
  subject: 道德与法治
  title: 爱护新书和书包
  conceptType: 概念型
  aliases:
    - 爱新书爱书包
  category: 观点
  explanation: 新书里有很多知识，要好好爱护，可以给它包上书皮。书包里的文具要摆放整齐，样样都爱惜。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:爱护花草树木
  type: Concept
  subject: 道德与法治
  title: 爱护花草树木
  conceptType: 概念型
  aliases: []
  category: 规则
  explanation: 爱护花草树木要做到：不乱摘花，不踩草坪，在草地外面玩，还可以做提示牌提醒大家一起爱护。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:爱护身体
  type: Concept
  subject: 道德与法治
  title: 爱护身体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：为了学习熬夜刷题，觉得年轻身体好，透支健康没关系
    - 能指出并纠正这一错误：把爱护身体理解为多吃补品，却从不运动锻炼
  aliases:
    - 身体健康
  category: 健康观
  explanation: 身体是生命存在的根本，爱护自己的身体是对生命负责任的态度，要做自身健康的第一责任人。
  misconceptions:
    - 为了学习熬夜刷题，觉得年轻身体好，透支健康没关系
    - 把爱护身体理解为多吃补品，却从不运动锻炼
    - 沉迷网络游戏连续几个小时不动，觉得只要不生病就没伤害
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:父母的辛劳和牵挂
  type: Concept
  subject: 道德与法治
  title: 父母的辛劳和牵挂
  conceptType: 概念型
  aliases:
    - 父母为我多操劳
  category: 观点
  explanation: 爸爸妈妈每天为工作忙碌、为生活奔波，同时还时时刻刻牵挂着我们，很辛苦。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:独立自主的和平外交政策
  type: Concept
  subject: 道德与法治
  title: 独立自主的和平外交政策
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 新中国奉行独立自主的和平外交政策，废除了旧中国签订的不平等条约，结束了百余年的屈辱外交。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:玩游戏要节制
  type: Concept
  subject: 道德与法治
  title: 玩游戏要节制
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 要玩健康的、有益的游戏，还要懂得节制。到睡觉时间就要停止玩耍，不健康的游戏不玩。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:环保倡议书
  type: Concept
  subject: 道德与法治
  title: 环保倡议书
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把环保倡议书当成政府颁布的法规，认为必须遵守
    - 能指出并纠正这一错误：写倡议书时只罗列问题，没有具体可行的倡议内容
  aliases: []
  category: 环保实践
  explanation: 以书面形式提出的环保建议或号召，旨在传播环保理念，动员公众参与环保行动。
  misconceptions:
    - 把环保倡议书当成政府颁布的法规，认为必须遵守
    - 写倡议书时只罗列问题，没有具体可行的倡议内容
    - 认为倡议书只能由环保部门发起，普通公民无权发布
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:环境恶化危害
  type: Concept
  subject: 道德与法治
  title: 环境恶化危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自然灾害是环境恶化的原因，而不是结果
    - 能指出并纠正这一错误：只看到大气污染，忽略水污染、土壤污染等也是环境恶化
  aliases: []
  category: 环境问题
  explanation: 环境恶化加剧自然灾害，破坏生态平衡，威胁人民生命安全和身体健康。
  misconceptions:
    - 认为自然灾害是环境恶化的原因，而不是结果
    - 只看到大气污染，忽略水污染、土壤污染等也是环境恶化
    - 认为环境恶化只影响动植物，不影响人类健康
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:珍惜劳动成果
  type: Concept
  subject: 道德与法治
  title: 珍惜劳动成果
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 劳动成果是劳动者用勤劳和智慧换来的，饱含着他们的心血。珍惜劳动成果就是尊重劳动者。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:珍惜友谊
  type: Concept
  subject: 道德与法治
  title: 珍惜友谊
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 友谊来之不易，需要珍惜。当朋友有困难时尽力帮助，朋友犯错误时真诚提醒，友谊才能深厚长久。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:珍爱生命
  type: Concept
  subject: 道德与法治
  title: 珍爱生命
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我们的肢体不可再生，生命不可重来。生命是宝贵的又是脆弱的，我们要学会保护自己，好好珍爱生命。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:珍视自由
  type: Concept
  subject: 道德与法治
  title: 珍视自由
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为珍视自由就是为所欲为，把自由等同于无约束的任性行为
    - 能指出并纠正这一错误：只想要自由的权利，不愿承担相应义务，如'我要自由，但不要规则约束'
  aliases: []
  category: 道德与法治
  explanation: 珍视自由要求珍惜宪法和法律赋予的权利，依法行使权利，尊重他人的权利。
  misconceptions:
    - 认为珍视自由就是为所欲为，把自由等同于无约束的任性行为
    - 只想要自由的权利，不愿承担相应义务，如'我要自由，但不要规则约束'
    - 觉得自己未成年，珍视自由是长大后的事，现在不用管
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:班委的职责
  type: Concept
  subject: 道德与法治
  title: 班委的职责
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 班委根据分工各司其职，比如检查卫生、组织文艺活动、主持班会，为全班同学服务，推动班级进步。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:班委选举的规则
  type: Concept
  subject: 道德与法治
  title: 班委选举的规则
  conceptType: 程序型
  aliases:
    - 民主选举班委的流程
  category: 方法
  explanation: 民主选举班委一般要经过发布公告、自愿报名、演讲答辩、无记名投票、公开唱票宣布结果等步骤。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:班级与我共成长
  type: Concept
  subject: 道德与法治
  title: 班级与我共成长
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 班级就像大树和小河，我们是叶子和水滴。同学团结友爱、守规则，班级就温暖有秩序，班级和我们共同成长。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:班级事务民主协商
  type: Concept
  subject: 道德与法治
  title: 班级事务民主协商
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 对班级重大事务的决定，班委会要组织大家民主讨论，每个人充分表达意见，集中大家的智慧达成共识。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:班级大家庭
  type: Concept
  subject: 道德与法治
  title: 班级大家庭
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我们班就像一个快乐的大家庭，老师和同学一起学习、劳动，互相关心、团结互助。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:班级间的合作与竞争
  type: Concept
  subject: 道德与法治
  title: 班级间的合作与竞争
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 班级之间既有合作也有竞争，乐于合作、善于合作、公平竞争，能让每个班集体变得更好。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:班集体的奋斗目标
  type: Concept
  subject: 道德与法治
  title: 班集体的奋斗目标
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 每个班都有自己的奋斗目标，全班同学一起努力实现目标，班集体就会越来越有凝聚力。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:理性参与网络生活
  type: Concept
  subject: 道德与法治
  title: 理性参与网络生活
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：为了避免网瘾干脆不上网，认为这样就是理性参与。
    - 能指出并纠正这一错误：认为理性参与就是只看不说，不发表任何意见。
  aliases:
    - 理性上网
  category: 道德与法治
  explanation: 我们要学会理性参与网络生活，提升媒介素养，积极利用网络获取新知、促进沟通、完善自我。
  misconceptions:
    - 为了避免网瘾干脆不上网，认为这样就是理性参与。
    - 认为理性参与就是只看不说，不发表任何意见。
    - 觉得只要不违法，怎么上网都是理性参与。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:理性爱国
  type: Concept
  subject: 道德与法治
  title: 理性爱国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为爱国就要‘热血’行动，如打砸外国商店、辱骂外国人。
    - 能指出并纠正这一错误：把理性爱国等同于不问世事，认为沉默就是爱国。
  aliases:
    - 理性、务实、文明表达爱国情感
  category: 行为要求
  explanation: 对危害国家利益的行为，要时刻保持警惕，学会用理性、务实、文明的心态，合法有序地表达爱国情感，维护国家利益。
  misconceptions:
    - 认为爱国就要‘热血’行动，如打砸外国商店、辱骂外国人。
    - 把理性爱国等同于不问世事，认为沉默就是爱国。
    - 以为理性爱国就是无原则退让，不敢维护国家利益。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:生命是不可逆的
  type: Concept
  subject: 道德与法治
  title: 生命是不可逆的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人生可以重来，把希望寄托在'来世'或'重新选择'上，导致今天随意挥霍。
    - 能指出并纠正这一错误：觉得时间很多，以后可以弥补，例如熬夜玩手机想着明天再补，但昨天的时间已一去不返。
  aliases:
    - 生命的不可逆性
  category: 生命观
  explanation: 生命的时光一去不复返，从婴孩到老年，每个阶段都不可重来，因此要珍惜生命的每一天。
  misconceptions:
    - 认为人生可以重来，把希望寄托在'来世'或'重新选择'上，导致今天随意挥霍。
    - 觉得时间很多，以后可以弥补，例如熬夜玩手机想着明天再补，但昨天的时间已一去不返。
    - 幻想返老还童，不珍惜当下阶段，认为'等老了再学也来得及'，忽视每个阶段不可重复。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:生命是代代接续的
  type: Concept
  subject: 道德与法治
  title: 生命是代代接续的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生命完全属于自己，高兴怎样就怎样，与家庭、社会无关。
    - 能指出并纠正这一错误：把生命接续只看作传宗接代，忽视思想、品德、家风等精神层面的传承。
  aliases:
    - 生命的接续性
  category: 生命观
  explanation: 在历史的长河中，个人的生命虽然短暂，但一代又一代的个体生命实现了人类生命的接续，每个人的生命不仅是'我'的生命，还是'我们'的生命。
  misconceptions:
    - 认为生命完全属于自己，高兴怎样就怎样，与家庭、社会无关。
    - 把生命接续只看作传宗接代，忽视思想、品德、家风等精神层面的传承。
    - 觉得自己人微言轻，人类的延续与自己无关，不承担对后代的责任。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:生命是有限的
  type: Concept
  subject: 道德与法治
  title: 生命是有限的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：相信长生不老或永生，认为生命不会结束，因此不珍惜时间，拖延计划。
    - 能指出并纠正这一错误：从'生命有限'推出'努力无意义'，于是及时行乐，放弃奋斗和奉献。
  aliases:
    - 生命的有限性
  category: 生命观
  explanation: 新陈代谢、生老病死是无法抗拒的规律，生命是有限的，应感恩生命的获得，把有限的生命投入到无限的奋斗和奉献之中。
  misconceptions:
    - 相信长生不老或永生，认为生命不会结束，因此不珍惜时间，拖延计划。
    - 从'生命有限'推出'努力无意义'，于是及时行乐，放弃奋斗和奉献。
    - 只沉浸在对死亡的恐惧中，忘了感恩生命，不愿为他人和社会付出。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:生命是独特的
  type: Concept
  subject: 道德与法治
  title: 生命是独特的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人和人都差不多，不用培养自己的优势，别人做什么就跟着做什么。
    - 能指出并纠正这一错误：因自己某些方面不如人而自卑，看不到自己不可替代的价值。
  aliases:
    - 生命的独特性
  category: 生命观
  explanation: 每个人的生命都是独特的，外形相貌、天资禀赋等各不相同，每个生命都不可替代。
  misconceptions:
    - 认为人和人都差不多，不用培养自己的优势，别人做什么就跟着做什么。
    - 因自己某些方面不如人而自卑，看不到自己不可替代的价值。
    - 把'生命独特'误解为可以随心所欲、不守规则，忽视共同的社会规范。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:生命权和健康权
  type: Concept
  subject: 道德与法治
  title: 生命权和健康权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为生命权和健康权是同一权利，没有区别
    - 能指出并纠正这一错误：认为健康权仅指身体健康，不包括心理健康
  aliases: []
  category: 法律权利
  explanation: 生命和健康是参加一切社会活动的基础，法律保护其不受非法侵害。
  misconceptions:
    - 误以为生命权和健康权是同一权利，没有区别
    - 认为健康权仅指身体健康，不包括心理健康
    - 误以为轻微伤害不损害健康权，只有重伤害才算
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:生态保护红线
  type: Concept
  subject: 道德与法治
  title: 生态保护红线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态保护红线就是环境质量底线，二者含义相同
    - 能指出并纠正这一错误：把红线理解为只要不越过就行，可以任意开发到红线边缘
  aliases:
    - 三条红线
  category: 制度保障
  explanation: 严守生态保护红线、环境质量底线、资源利用上线，是建设生态文明的重要制度保障。
  misconceptions:
    - 认为生态保护红线就是环境质量底线，二者含义相同
    - 把红线理解为只要不越过就行，可以任意开发到红线边缘
    - 认为划定生态保护红线后，所有生产活动都必须停止
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:生态文明建设
  type: Concept
  subject: 道德与法治
  title: 生态文明建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态文明建设就是少扔垃圾、节约用水
    - 能指出并纠正这一错误：认为生态文明建设只是政府的事，与公民个人无关
  aliases:
    - 生态文明
  category: 生态文明理念
  explanation: 以资源环境承载能力为基础，以自然规律为准则，以可持续发展、人与自然和谐共生为目标，建设生态文明是人类的共识和时代的选择。
  misconceptions:
    - 认为生态文明建设就是少扔垃圾、节约用水
    - 认为生态文明建设只是政府的事，与公民个人无关
    - 把生态文明建设与传统工业发展对立，认为要停止发展经济
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:生态环境形势
  type: Concept
  subject: 道德与法治
  title: 生态环境形势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到空气质量好转，就认为我国环境问题已经全部解决
    - 能指出并纠正这一错误：认为我国生态环境形势是持续恶化的，没有改善
  aliases:
    - 环境问题
  category: 国情
  explanation: 当前我国生态环境虽总体有所改善，但形势仍不容乐观，存在大气、水、土壤污染等问题。
  misconceptions:
    - 看到空气质量好转，就认为我国环境问题已经全部解决
    - 认为我国生态环境形势是持续恶化的，没有改善
    - 只关注大气污染，忽视水、土壤污染问题
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:生活中的浪费现象
  type: Concept
  subject: 道德与法治
  title: 生活中的浪费现象
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 生活中吃、穿、用等方面都可能产生浪费，比如忘关灯、浪费纸张、不爱惜文具。错误的消费观念是造成浪费的重要原因。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:生活处处有规则
  type: Concept
  subject: 道德与法治
  title: 生活处处有规则
  conceptType: 概念型
  aliases:
    - 生活离不开规则
  category: 观点
  explanation: 每个游戏都有规则，生活中也处处有规则，比如按时上学、公共场所禁止吸烟。规则并不是可有可无的。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:生活安全常识
  type: Concept
  subject: 道德与法治
  title: 生活安全常识
  conceptType: 概念型
  aliases:
    - 安全知多少
  category: 概念
  explanation: 生活中有许多安全常识，比如地面有水要擦干防滑、不买没有生产日期的食物、不随意触碰不熟悉的动物。多学安全知识才能平安成长。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:生活实践
  type: Concept
  subject: 道德与法治
  title: 生活实践
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为认识自己只需要反复思考，不参加任何实践活动也能认清自己
    - 能指出并纠正这一错误：把生活实践等同于刷题或干家务，不从中反思自己的特点和不足
  aliases: []
  category: 认识方法
  explanation: 在生活实践中认识自己，通过学习和劳动等了解自己的优势和不足。
  misconceptions:
    - 以为认识自己只需要反复思考，不参加任何实践活动也能认清自己
    - 把生活实践等同于刷题或干家务，不从中反思自己的特点和不足
    - 只在考试失败后才想到反思，平时不从学习劳动中主动认识自己
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:生活离不开劳动者
  type: Concept
  subject: 道德与法治
  title: 生活离不开劳动者
  conceptType: 概念型
  aliases:
    - 各行各业的劳动者
  category: 观点
  explanation: 我们每天吃的粮食蔬菜、穿的衣物、住的房子、乘坐的交通工具，都离不开各行各业劳动者的付出，是他们的劳动让社会有序运转。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:甲午中日战争
  type: Concept
  subject: 道德与法治
  title: 甲午中日战争
  conceptType: 概念型
  aliases:
    - 甲午战争
  category: 文化常识
  explanation: 1894 年（农历甲午年）日本发动的侵华战争，北洋水师英勇抗敌但最终惨败，中国社会的半殖民地化和民族危机大大加深。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:男生女生特点与优势
  type: Concept
  subject: 道德与法治
  title: 男生女生特点与优势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把男生女生的优势固定化，认为男生数学一定好，女生语文一定好
    - 能指出并纠正这一错误：认为男女生各有特点意味着可以不努力，把“天生优势”当借口
  aliases:
    - 男女差异
    - 性别特点
  category: 性别差异
  explanation: 男生女生在生理性别特征、性格特征、兴趣爱好、思维方式等方面各有特点，各有优势，应相互学习、取长补短。
  misconceptions:
    - 把男生女生的优势固定化，认为男生数学一定好，女生语文一定好
    - 认为男女生各有特点意味着可以不努力，把“天生优势”当借口
    - 觉得男女生只在生理上有差别，性格和思维方式完全一样
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:畅想未来
  type: Concept
  subject: 道德与法治
  title: 畅想未来
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把畅想未来理解为凭空幻想，不将其与脚踏实地的行动结合起来
    - 能指出并纠正这一错误：畅想未来时只考虑个人兴趣和收入，从不与国家发展、社会需求相联系
  aliases: []
  category: 人生规划
  explanation: 畅想未来是为了丰富生命、提升质量，需将个人理想与国家发展相结合。
  misconceptions:
    - 把畅想未来理解为凭空幻想，不将其与脚踏实地的行动结合起来
    - 畅想未来时只考虑个人兴趣和收入，从不与国家发展、社会需求相联系
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:监督权与获得国家赔偿权
  type: Concept
  subject: 道德与法治
  title: 监督权与获得国家赔偿权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为监督权就是要求国家工作人员下台，可以直接罢免。
    - 能指出并纠正这一错误：混淆申诉、控告和检举，认为三者是同一回事。
  aliases:
    - 监督权
    - 获得国家赔偿权
  category: 法律概念
  explanation: 公民对于任何国家机关和国家工作人员有提出批评和建议的权利，对于违法失职行为有申诉、控告或检举的权利。因国家机关和国家工作人员侵犯公民权利而受到损失的人，有依法取得赔偿的权利。
  misconceptions:
    - 认为监督权就是要求国家工作人员下台，可以直接罢免。
    - 混淆申诉、控告和检举，认为三者是同一回事。
    - 认为受到任何国家机关的侵害都能获得国家赔偿，包括自己的过错。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:监督班委工作
  type: Concept
  subject: 道德与法治
  title: 监督班委工作
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 当选的班委要认真履职，其他同学既要配合班委工作，也要监督班委工作，这是参与班级管理的重要方式。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:目标的作用
  type: Concept
  subject: 道德与法治
  title: 目标的作用
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 小小的目标能给我们方向，让我们有力量、能坚持，引领我们不断进步。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:看懂商品包装信息
  type: Concept
  subject: 道德与法治
  title: 看懂商品包装信息
  conceptType: 概念型
  aliases:
    - 看商品标签
  category: 方法
  explanation: 正规商品的外包装上一般有厂名厂址、使用说明、生产日期等信息，这是我们了解商品信息、挑选商品的重要渠道。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:真正的友谊
  type: Concept
  subject: 道德与法治
  title: 真正的友谊
  conceptType: 概念型
  aliases:
    - 真友谊
  category: 观点
  explanation: 真正的友谊不是靠请客送礼换来的，也不能为了朋友就答应不合理的要求。像徐原那样敢当面指出朋友过错的人是益友。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:知法守法
  type: Concept
  subject: 道德与法治
  title: 知法守法
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 遵守法律是每个公民的义务。尊法、守法的前提是知法、懂法，更要尊法、敬法，内心真正敬畏法律，才能让守法成为自觉行动。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:知识产权保护
  type: Concept
  subject: 道德与法治
  title: 知识产权保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为网上免费下载音乐电影不付费不侵权，是资源共享
    - 能指出并纠正这一错误：觉得知识产权保护只是国家的事，学生没有可保护的智力成果
  aliases: []
  category: 法律知识
  explanation: 尊重他人的知识产权，学会保护自己的知识产权，是尊重创造、保护创新的体现。
  misconceptions:
    - 认为网上免费下载音乐电影不付费不侵权，是资源共享
    - 觉得知识产权保护只是国家的事，学生没有可保护的智力成果
    - 把专利权与商标权混为一谈，认为知识产权就是专利
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:知错能改
  type: Concept
  subject: 道德与法治
  title: 知错能改
  conceptType: 概念型
  aliases:
    - 错了就要改
    - 闻过则喜
  category: 观点
  explanation: 人人都可能犯错，犯了错要勇敢承认，说声对不起，及时改正就是好孩子。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:确定个人发展目标
  type: Concept
  subject: 道德与法治
  title: 确定个人发展目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：目标定得越高越好，不考虑自身能力，如想考第一却不制定学习计划
    - 能指出并纠正这一错误：目标只凭个人兴趣，不顾社会需要，如立志当电竞选手却完全脱离实际
  aliases: []
  category: 规划方法
  explanation: 做好初中生活规划，应先确定个人发展目标，结合社会需要和自身条件设定合理目标。
  misconceptions:
    - 目标定得越高越好，不考虑自身能力，如想考第一却不制定学习计划
    - 目标只凭个人兴趣，不顾社会需要，如立志当电竞选手却完全脱离实际
    - 目标笼统模糊，如只说要认真学习，不明确到每次考试或具体技能上
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:社会主义制度
  type: Concept
  subject: 道德与法治
  title: 社会主义制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把社会主义制度说成根本政治制度，与人民代表大会制度混淆。
    - 能指出并纠正这一错误：认为社会主义制度仅是经济制度，不包括政治文化等。
  aliases: []
  category: 政治概念
  explanation: 中华人民共和国的根本制度，是中国特色社会主义的基石。
  misconceptions:
    - 把社会主义制度说成根本政治制度，与人民代表大会制度混淆。
    - 认为社会主义制度仅是经济制度，不包括政治文化等。
    - 以为社会主义制度是宪法规定的一般制度，忽略其根本地位。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:社会主义基本经济制度
  type: Concept
  subject: 道德与法治
  title: 社会主义基本经济制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把公有制为主体理解为国有经济为主体，忽视集体经济等
    - 能指出并纠正这一错误：认为非公有制经济是社会主义经济的重要组成部分，混淆概念
  aliases:
    - 基本经济制度
  category: 制度
  explanation: 我国逐步确立的公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等基本经济制度。
  misconceptions:
    - 把公有制为主体理解为国有经济为主体，忽视集体经济等
    - 认为非公有制经济是社会主义经济的重要组成部分，混淆概念
    - 认为我国基本经济制度只是所有制结构，不包括分配和体制
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:社会主义市场经济体制
  type: Concept
  subject: 道德与法治
  title: 社会主义市场经济体制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为市场起决定性作用就是政府完全不管经济，导致无政府状态。
    - 能指出并纠正这一错误：认为社会主义市场经济体制就是资本主义市场经济，混淆性质。
  aliases:
    - 市场经济体制
  category: 经济制度
  explanation: 我国社会主义基本经济制度之一，市场在资源配置中起决定性作用，同时更好发挥政府作用。
  misconceptions:
    - 误以为市场起决定性作用就是政府完全不管经济，导致无政府状态。
    - 认为社会主义市场经济体制就是资本主义市场经济，混淆性质。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:社会主义核心价值观
  type: Concept
  subject: 道德与法治
  title: 社会主义核心价值观
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为核心价值观只是宣传口号，与日常学习无关，写作文才用得上。
    - 能指出并纠正这一错误：把核心价值观等同于个人道德，认为践行它只是做好人好事，不涉及法律和制度。
  aliases: []
  category: 道德与法治
  explanation: 社会主义核心价值观是当代中国精神的集中体现，是全体人民共同的价值追求，包括富强、民主、文明、和谐等。
  misconceptions:
    - 认为核心价值观只是宣传口号，与日常学习无关，写作文才用得上。
    - 把核心价值观等同于个人道德，认为践行它只是做好人好事，不涉及法律和制度。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:社会主义核心价值观的基本内容
  type: Concept
  subject: 道德与法治
  title: 社会主义核心价值观的基本内容
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'公正'属于国家层面的价值要求
    - 能指出并纠正这一错误：认为'文明'是社会层面的价值要求
  aliases:
    - 三个层面
  category: 道德与法治
  explanation: 富强、民主、文明、和谐是国家层面的价值要求，自由、平等、公正、法治是社会层面的价值要求，爱国、敬业、诚信、友善是公民层面的价值要求。
  misconceptions:
    - 认为'公正'属于国家层面的价值要求
    - 认为'文明'是社会层面的价值要求
    - 分不清'和谐'和'友善'的归属，导致选错
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:社会主义民族关系
  type: Concept
  subject: 道德与法治
  title: 社会主义民族关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为社会主义民族关系是自古就有的，不是新中国成立后新形成的。
    - 能指出并纠正这一错误：把平等团结互助和谐的顺序随意颠倒，或漏掉其中一项。
  aliases: []
  category: 政治概念
  explanation: 新中国成立后形成的平等团结互助和谐的民族关系。
  misconceptions:
    - 认为社会主义民族关系是自古就有的，不是新中国成立后新形成的。
    - 把平等团结互助和谐的顺序随意颠倒，或漏掉其中一项。
    - 误以为民族关系只是政府的事，与普通公民的日常交往无关。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:社会主义法治精神
  type: Concept
  subject: 道德与法治
  title: 社会主义法治精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法治精神就是制定很多法律条文，忽视公平正义价值。
    - 能指出并纠正这一错误：把‘法治’理解成‘以法治民’，认为法律只管老百姓不管官员。
  aliases: []
  category: 法治观念
  explanation: 社会主义法治所蕴含的价值追求和精神内核。
  misconceptions:
    - 认为法治精神就是制定很多法律条文，忽视公平正义价值。
    - 把‘法治’理解成‘以法治民’，认为法律只管老百姓不管官员。
    - 将法律工具化，认为只要达到目的，法律可以随意解释。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:社会主义革命
  type: Concept
  subject: 道德与法治
  title: 社会主义革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为社会主义革命与新民主主义革命同时进行或更早
    - 能指出并纠正这一错误：认为社会主义革命的任务是推翻帝国主义和封建主义统治
  aliases: []
  category: 历史事件
  explanation: 中国共产党领导中国人民完成的革命，确立社会主义制度，为当代中国一切发展进步奠定根本政治前提和制度基础。
  misconceptions:
    - 误认为社会主义革命与新民主主义革命同时进行或更早
    - 认为社会主义革命的任务是推翻帝国主义和封建主义统治
    - 认为社会主义革命完成的标志是改革开放，实际是三大改造
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:社会信用体系
  type: Concept
  subject: 道德与法治
  title: 社会信用体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为信用记录只跟借钱贷款有关，只要不欠钱不贷款，信用好坏就无所谓。
    - 能指出并纠正这一错误：把失信惩戒等同于罚款，以为交了罚款就能消除失信记录，不受其他限制。
  aliases:
    - 个人诚信体系
  category: 社会制度
  explanation: 国家通过建立健全信用档案、守信激励和失信惩戒机制，让守信者受益、失信者受限。
  misconceptions:
    - 认为信用记录只跟借钱贷款有关，只要不欠钱不贷款，信用好坏就无所谓。
    - 把失信惩戒等同于罚款，以为交了罚款就能消除失信记录，不受其他限制。
    - 误以为社会信用体系只约束企业和个人，与政府机关及其工作人员无关。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:社会关系
  type: Concept
  subject: 道德与法治
  title: 社会关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将同学关系误判为地缘关系，实为业缘关系，因共同学习而形成。
    - 能指出并纠正这一错误：把同乡、邻居归入血缘关系，实为地缘关系，基于居住地建立。
  aliases:
    - 社会关系类型
  category: 道德与法治
  explanation: 社会关系是人与人之间形成的各种联系，依据其建立的基础可分为血缘关系、地缘关系和业缘关系等。
  misconceptions:
    - 将同学关系误判为地缘关系，实为业缘关系，因共同学习而形成。
    - 把同乡、邻居归入血缘关系，实为地缘关系，基于居住地建立。
    - 误以为社会关系仅指面对面交往，网上结识、书信往来等不算社会关系。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:社会化的途径
  type: Concept
  subject: 道德与法治
  title: 社会化的途径
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为社会化只有上学读书一种途径，不知道家庭生活技能学习也算。
    - 能指出并纠正这一错误：误认为学习行为规范不是社会化，以为只有获得技能才算社会化。
  aliases: []
  category: 社会过程
  explanation: 在社会生活中，我们通过学习生活技能、学习行为规范、学习扮演社会角色等途径实现社会化。
  misconceptions:
    - 以为社会化只有上学读书一种途径，不知道家庭生活技能学习也算。
    - 误认为学习行为规范不是社会化，以为只有获得技能才算社会化。
    - 认为‘扮演社会角色’不是途径，只是社会化的结果，其实它是途径之一。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:社会生活
  type: Concept
  subject: 道德与法治
  title: 社会生活
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为社会生活就是物质活动，如生产粮食、建造房屋，忽略政治参与和精神生产。
    - 能指出并纠正这一错误：说自己上学不是社会生活，其实学校生活、师生交往也是社会生活的一部分。
  aliases:
    - 社会
  category: 道德与法治
  explanation: 社会生活是丰富多彩、不断变化发展的，具有公共性，包括物质生产活动、社会政治活动和精神生产活动等。
  misconceptions:
    - 认为社会生活就是物质活动，如生产粮食、建造房屋，忽略政治参与和精神生产。
    - 说自己上学不是社会生活，其实学校生活、师生交往也是社会生活的一部分。
    - 把网络互动看作纯虚拟，不承认手机聊天、网上议事也属于社会生活。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:社会秩序
  type: Concept
  subject: 道德与法治
  title: 社会秩序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把社会秩序等同于交通秩序，忽略公共场所秩序、生产秩序
    - 能指出并纠正这一错误：认为社会秩序只需靠法律维护，道德与秩序无关
  aliases: []
  category: 道德与法治
  explanation: 社会秩序是社会生活有条不紊、井然有序的状态，包括交通秩序、生产秩序、公共场所秩序等。
  misconceptions:
    - 把社会秩序等同于交通秩序，忽略公共场所秩序、生产秩序
    - 认为社会秩序只需靠法律维护，道德与秩序无关
    - 觉得秩序太死板，破坏秩序不算违法，最多不文明
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:社会经济权利
  type: Concept
  subject: 道德与法治
  title: 社会经济权利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为社会经济权利仅仅是物质帮助权，不包括劳动权。
    - 能指出并纠正这一错误：把劳动权理解为劳动义务，认为每个人必须参加劳动。
  aliases: []
  category: 法律概念
  explanation: 社会经济权利是指公民依照宪法规定享有的与经济利益相关的权利，包括财产权、劳动权、劳动者休息权、社会保障权和物质帮助权等。
  misconceptions:
    - 认为社会经济权利仅仅是物质帮助权，不包括劳动权。
    - 把劳动权理解为劳动义务，认为每个人必须参加劳动。
    - 认为私有财产权是绝对的，国家在任何情况下都不能征收。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:社会规则
  type: Concept
  subject: 道德与法治
  title: 社会规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为社会规则就是法律，道德、纪律不属于社会规则
    - 能指出并纠正这一错误：把班规、校规当作可有可无的建议，不是规则
  aliases: []
  category: 道德与法治
  explanation: 社会规则是人们为了维护良好的社会环境，在逐渐达成默契与共识的基础上形成的，如道德、纪律、法律等。
  misconceptions:
    - 认为社会规则就是法律，道德、纪律不属于社会规则
    - 把班规、校规当作可有可无的建议，不是规则
    - 认为社会规则是政府强加的，而非人们默契的共识
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:社会规则的作用
  type: Concept
  subject: 道德与法治
  title: 社会规则的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为社会规则的作用只是惩罚违规者，忽略协调人际关系
    - 能指出并纠正这一错误：把社会规则等同于束缚，觉得规则越少越自由
  aliases: []
  category: 道德与法治
  explanation: 社会规则具有规范社会行为、调节社会关系、维护社会秩序的作用，保障社会秩序的实现。
  misconceptions:
    - 认为社会规则的作用只是惩罚违规者，忽略协调人际关系
    - 把社会规则等同于束缚，觉得规则越少越自由
    - 以为只有明文法律起作用，风俗习惯没有规范作用
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:祖国的伟大成就
  type: Concept
  subject: 道德与法治
  title: 祖国的伟大成就
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 我国建成了又快又稳的高铁，有了自己独立的空间站。这些新成就让我们的生活越来越好，我们为祖国自豪。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:祖国的壮丽河山
  type: Concept
  subject: 道德与法治
  title: 祖国的壮丽河山
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 祖国有长长的河、高高的山、茂密的森林、广阔的草原和大海。这片美丽的土地就是我们的家园。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:私营经济
  type: Concept
  subject: 道德与法治
  title: 私营经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把私营经济等同于个体经济，忽略私营经济存在雇佣劳动关系。
    - 能指出并纠正这一错误：误以为私营经济不属于非公有制经济，将其归类为公有制。
  aliases: []
  category: 经济成分
  explanation: 非公有制经济的一种，生产资料归私人所有，存在雇佣劳动关系。
  misconceptions:
    - 把私营经济等同于个体经济，忽略私营经济存在雇佣劳动关系。
    - 误以为私营经济不属于非公有制经济，将其归类为公有制。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:科学发展观
  type: Concept
  subject: 道德与法治
  title: 科学发展观
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 党的十六大以后，以胡锦涛同志为主要代表的中国共产党人形成的重大理论成果，深刻认识和回答了实现什么样的发展、怎样发展等重大问题。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:科学家的品格
  type: Concept
  subject: 道德与法治
  title: 科学家的品格
  conceptType: 概念型
  aliases:
    - 科学家的精神品质
  category: 观点
  explanation: 科学家在国家和人民需要时挺身而出，具有胸怀祖国、无私奉献、淡泊名利、勇于质疑、不怕失败等优秀品格。这些品格值得我们学习。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:科学家的童年品质
  type: Concept
  subject: 道德与法治
  title: 科学家的童年品质
  conceptType: 概念型
  aliases:
    - 科学家的童年
  category: 观点
  explanation: 许多科学家从小就敢于质疑、善于发现，具有好奇心、持之以恒、珍视兴趣、专注等优良品质。我们要向他们学习。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:科学立法
  type: Concept
  subject: 道德与法治
  title: 科学立法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为科学立法就是专家立法，不需要反映人民意愿。
    - 能指出并纠正这一错误：认为只要由立法机关通过的法律就一定科学，无需审查合宪性。
  aliases: []
  category: 法治理论
  explanation: 科学立法要求立法符合宪法精神、反映人民意愿，以良法促进发展、保障善治。
  misconceptions:
    - 认为科学立法就是专家立法，不需要反映人民意愿。
    - 认为只要由立法机关通过的法律就一定科学，无需审查合宪性。
    - 把科学立法等同于法律越多越好、越细越好。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:科学精神
  type: Concept
  subject: 道德与法治
  title: 科学精神
  conceptType: 概念型
  aliases:
    - 追求真理的精神
  category: 观点
  explanation: 哥白尼、伽利略等科学家不盲从权威、不迷信教条，为追求真理、坚持真理甚至不惜牺牲生命。我们也要学习这种勇于探索的科学精神。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:科技创新能力
  type: Concept
  subject: 道德与法治
  title: 科技创新能力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为我国科技创新能力已是世界第一，不需要再学习外国
    - 能指出并纠正这一错误：把科技创新能力等同于科技论文或专利数量，忽视实际转化
  aliases: []
  category: 概念
  explanation: 综合国力竞争的决定性因素，我国科技创新能力还需进一步提高。
  misconceptions:
    - 认为我国科技创新能力已是世界第一，不需要再学习外国
    - 把科技创新能力等同于科技论文或专利数量，忽视实际转化
    - 认为科技创新只是科学家的事，与普通人无关
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:科技应用带来的烦恼
  type: Concept
  subject: 道德与法治
  title: 科技应用带来的烦恼
  conceptType: 概念型
  aliases:
    - 科技的负面影响
  category: 现象
  explanation: 人们在享受科技成果的同时也会遇到新的烦恼，比如农药污染土壤和水、电子产品产生电子垃圾。需要用道德自律、法律约束和公众监督来规范科技应用，善用科技。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:科技提升国力
  type: Concept
  subject: 道德与法治
  title: 科技提升国力
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 科技发展水平是一个国家综合国力的重要体现，科技对国力的提升体现在经济、社会、国防等多个方面。我们要努力做到科技自立自强，建设科技强国。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:科技改变生活
  type: Concept
  subject: 道德与法治
  title: 科技改变生活
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 生活中到处都有科技的身影，冰箱、导航等科技产品让生活更便利。对比今昔可以发现，科技给生活带来了巨大变化。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:科技改变观念
  type: Concept
  subject: 道德与法治
  title: 科技改变观念
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 科技发展不仅改变了我们的生活，也改变了我们的思想和观念。比如科学知识普及后，人们不再相信打雷闪电是神仙发出来的。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:科教兴国战略
  type: Concept
  subject: 道德与法治
  title: 科教兴国战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为科教兴国战略就是科技+教育简单相加，忽视两者结合
    - 能指出并纠正这一错误：把实施科教兴国战略的主体局限于政府，认为企业个人无关
  aliases: []
  category: 战略
  explanation: 国家战略，把科技和教育摆在重要位置，增强国家科技实力和国民素质。
  misconceptions:
    - 认为科教兴国战略就是科技+教育简单相加，忽视两者结合
    - 把实施科教兴国战略的主体局限于政府，认为企业个人无关
    - 认为科教兴国战略是当前中心工作，与经济建设相冲突
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:积极的人生态度
  type: Concept
  subject: 道德与法治
  title: 积极的人生态度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘乐观’当成盲目乐观，遇到问题不分析、不行动
    - 能指出并纠正这一错误：认为积极态度就是从不生气或从不焦虑，忽视合理情绪调节
  aliases:
    - 乐观态度
    - 进取态度
  category: 道德与法治
  explanation: 积极的人生态度体现为乐观向上、认真务实、勤奋进取，能够让我们更加自信从容，勇敢面对困难和挫折。
  misconceptions:
    - 把‘乐观’当成盲目乐观，遇到问题不分析、不行动
    - 认为积极态度就是从不生气或从不焦虑，忽视合理情绪调节
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:积极谋求发展
  type: Concept
  subject: 道德与法治
  title: 积极谋求发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把提升发展质量等同于追求经济增长速度，忽视效益和可持续性
    - 能指出并纠正这一错误：认为参与全球规则制定就意味着中国主导一切国际规则
  aliases:
    - 谋求发展
  category: 道德与法治
  explanation: 中国通过提升发展质量、寻求新增长点、参与全球规则制定、构建新发展格局等途径积极谋求自身发展。
  misconceptions:
    - 把提升发展质量等同于追求经济增长速度，忽视效益和可持续性
    - 认为参与全球规则制定就意味着中国主导一切国际规则
    - 把构建新发展格局误解为闭关锁国，不再需要国际市场
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:积极面对当下的学习
  type: Concept
  subject: 道德与法治
  title: 积极面对当下的学习
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只对中考科目积极投入，认为音体美等科目不值得认真学
    - 能指出并纠正这一错误：遇到学习压力就逃避或硬扛，不懂得通过调整心态和找方法来解决
  aliases:
    - 正确面对学习压力
  category: 学习态度与方法
  explanation: 面对校园学习生活，要高度重视、积极投入，正确面对困难和压力，调整心态，完成学习任务。
  misconceptions:
    - 只对中考科目积极投入，认为音体美等科目不值得认真学
    - 遇到学习压力就逃避或硬扛，不懂得通过调整心态和找方法来解决
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:端午节
  type: Concept
  subject: 道德与法治
  title: 端午节
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 农历五月初五是端午节，一般认为是为纪念爱国诗人屈原而产生的。民间有戴香包、吃粽子、赛龙舟等习俗。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:管好自己少让父母操心
  type: Concept
  subject: 道德与法治
  title: 管好自己少让父母操心
  conceptType: 概念型
  aliases:
    - 管好自己我能行
  category: 方法
  explanation: 管好自己就是不惹麻烦：带齐学习用品、爱惜身体、按时回家，不让父母为我们担心。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:粤港澳大湾区
  type: Concept
  subject: 道德与法治
  title: 粤港澳大湾区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为粤港澳大湾区就是珠三角地区的简单改名，忽略了其国家战略和'一国两制'背景。
    - 能指出并纠正这一错误：以为大湾区建设只是经济合作，不涉及港澳与内地社会的深度融合。
  aliases:
    - 大湾区
  category: 区域发展
  explanation: 国家战略，旨在建设世界级城市群，推动内地与港澳深度合作，支持港澳融入国家发展大局。
  misconceptions:
    - 认为粤港澳大湾区就是珠三角地区的简单改名，忽略了其国家战略和'一国两制'背景。
    - 以为大湾区建设只是经济合作，不涉及港澳与内地社会的深度融合。
    - 认为大湾区规划是中央单方面决定，港澳只能被动执行，没有参与权。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:精准扶贫
  type: Concept
  subject: 道德与法治
  title: 精准扶贫
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 2013年习近平在十八洞村考察时首次提出。它根据致贫原因有针对性地制定方案，因村因户因人施策，就像变“大水漫灌”为“精准滴灌”。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:精忠报国、振兴中华的爱国情怀
  type: Concept
  subject: 道德与法治
  title: 精忠报国、振兴中华的爱国情怀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把爱国等同于盲目排外，如认为“买外国货就是不爱国”。
    - 能指出并纠正这一错误：认为爱国只是成年人的事，学生只要学习，不需要培养爱国情怀。
  aliases:
    - 爱国情怀
  category: 道德与法治
  explanation: 爱国情怀将个人命运与民族存亡紧紧联系在一起，激励一代代中国人为祖国发展繁荣而不懈奋斗。
  misconceptions:
    - 把爱国等同于盲目排外，如认为“买外国货就是不爱国”。
    - 认为爱国只是成年人的事，学生只要学习，不需要培养爱国情怀。
    - 将“精忠报国”仅视为岳飞个人事迹，忽略其作为民族精神传承。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:精神生命是不断传承的
  type: Concept
  subject: 道德与法治
  title: 精神生命是不断传承的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只重视给孩子留下物质财产，认为思想、道德等精神东西不重要，无法'继承'。
    - 能指出并纠正这一错误：认为精神生命只是伟人、名人的事，普通人没有什么精神可以传承。
  aliases:
    - 精神生命的传承
  category: 生命观
  explanation: 伟大的思想、崇高的信仰、高尚的道德等都是精神生命的体现，在生命的传承中，人类的精神不断积淀和丰富。
  misconceptions:
    - 只重视给孩子留下物质财产，认为思想、道德等精神东西不重要，无法'继承'。
    - 认为精神生命只是伟人、名人的事，普通人没有什么精神可以传承。
    - 把精神传承等同于原样照搬古人思想，不结合时代发展去丰富和创新。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:索要发票
  type: Concept
  subject: 道德与法治
  title: 索要发票
  conceptType: 应用型
  aliases:
    - 保留购物凭证
  category: 方法
  explanation: 发票是更换商品、保修商品、解决纠纷、索要赔偿的凭证。购物或接受服务时一定要索要发票并保存好。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:紧密联系的世界
  type: Concept
  subject: 道德与法治
  title: 紧密联系的世界
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将紧密联系的世界等同于经济全球化，忽略交通、通信等纽带
    - 能指出并纠正这一错误：认为紧密联系的世界中各国已完全融为一体，没有独立自主
  aliases: []
  category: 政治概念
  explanation: 现代交通、通信、贸易把全球各地的国家、人们联系在一起，彼此影响，休戚相关。
  misconceptions:
    - 将紧密联系的世界等同于经济全球化，忽略交通、通信等纽带
    - 认为紧密联系的世界中各国已完全融为一体，没有独立自主
    - 只看到贸易联系，忽视文化、人员、信息等方面的联系
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:紧急救助免责条款
  type: Concept
  subject: 道德与法治
  title: 紧急救助免责条款
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要实施救助造成损害，救助人一律不承担民事责任。
    - 能指出并纠正这一错误：误认为救助人故意造成受助人损害也可免责。
  aliases:
    - 好人条款
  category: 法律条款
  explanation: 民法典规定，因自愿实施紧急救助行为造成受助人损害的，救助人不承担民事责任，鼓励互帮互助。
  misconceptions:
    - 认为只要实施救助造成损害，救助人一律不承担民事责任。
    - 误认为救助人故意造成受助人损害也可免责。
    - 认为受助人即使不愿意，救助人强行救助造成损害也免责。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:红军长征
  type: Concept
  subject: 道德与法治
  title: 红军长征
  conceptType: 概念型
  aliases:
    - 长征
  category: 概念
  explanation: 1934年10月，中央红军因第五次反“围剿”失利被迫撤出中央革命根据地，开始艰苦卓绝的长征。长征的胜利是中国革命转危为安的关键，是世界历史上前所未有的壮举。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:红领巾
  type: Concept
  subject: 道德与法治
  title: 红领巾
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 红领巾是少先队员的标志，代表红旗的一角，是革命先烈的鲜血染成的，要戴端正、叠整齐。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:纸的来历
  type: Concept
  subject: 道德与法治
  title: 纸的来历
  conceptType: 程序型
  aliases:
    - 造纸术
  category: 文化常识
  explanation: 古时候的蔡伦改进了造纸的方法，用树皮、麻头、破布等经过切碎、蒸煮、捣浆、晾干做成纸。纸是用竹子、树木等做的，废纸回收后还能再变成纸。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:终身学习
  type: Concept
  subject: 道德与法治
  title: 终身学习
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将终身学习等同于老了还要重返校园，不理解日常中的自我更新也是学习
    - 能指出并纠正这一错误：认为毕业后不再需要主动学习，除非工作需要否则不学新东西
  aliases:
    - 终身学习理念
  category: 学习观念
  explanation: 树立终身学习理念，养成主动学习、不断探索的习惯，增强自我更新、学以致用的能力。
  misconceptions:
    - 将终身学习等同于老了还要重返校园，不理解日常中的自我更新也是学习
    - 认为毕业后不再需要主动学习，除非工作需要否则不学新东西
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:经济全球化
  type: Concept
  subject: 道德与法治
  title: 经济全球化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为经济全球化只有积极影响，没有风险与危机跨国传递等弊端
    - 能指出并纠正这一错误：把经济全球化等同于国际贸易，忽略生产全球化和资本、劳动力流动
  aliases:
    - 经济一体化
  category: 经济概念
  explanation: 经济全球化改变了我们的生活，商品生产在全球范围内完成，商品贸易在全球范围内进行，促进商品、资本和劳动力在全球流动，有利于在世界范围内配置资源，但同时也使风险与危机跨国界传递。
  misconceptions:
    - 认为经济全球化只有积极影响，没有风险与危机跨国传递等弊端
    - 把经济全球化等同于国际贸易，忽略生产全球化和资本、劳动力流动
    - 误以为经济全球化就是政治一体化，混淆不同类型全球化
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:经济特区
  type: Concept
  subject: 道德与法治
  title: 经济特区
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 1980年中央决定在深圳、珠海、汕头、厦门设置经济特区。经济特区成为中国对外开放的重要窗口，向世界展示了中国改革开放的新形象。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:统一性
  type: Concept
  subject: 道德与法治
  title: 统一性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中华文明“统一性”指文化单一，没有多元特色。
    - 能指出并纠正这一错误：说“中国历史上从未分裂过”，忽视三国、南北朝等分裂时期。
  aliases: []
  category: 文明特性
  explanation: 中华文明追求国家统一，如秦代书同文、车同轨等举措。
  misconceptions:
    - 认为中华文明“统一性”指文化单一，没有多元特色。
    - 说“中国历史上从未分裂过”，忽视三国、南北朝等分裂时期。
    - 把“书同文”理解为秦朝才统一文字，忽略之前已存在的文化融合。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:维护世界和平的方式
  type: Concept
  subject: 道德与法治
  title: 维护世界和平的方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护世界和平只能依靠联合国，忽视其他和平手段
    - 能指出并纠正这一错误：误以为维和部队可以介入他国内部冲突，甚至用武力干涉他国主权
  aliases: []
  category: 政治
  explanation: 包括成立联合国、派驻维和部队、签署核不扩散条约等，通过和平谈判解决争端。
  misconceptions:
    - 认为维护世界和平只能依靠联合国，忽视其他和平手段
    - 误以为维和部队可以介入他国内部冲突，甚至用武力干涉他国主权
    - 把通过和平谈判解决争端等同于无条件妥协、放弃原则
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:维护公共利益
  type: Concept
  subject: 道德与法治
  title: 维护公共利益
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 随意占有或浪费公共资源、毁坏公共设施，会侵犯他人的公共权益，严重的还会触犯法律。公共利益需要大家共同维护。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:维护公共秩序
  type: Concept
  subject: 道德与法治
  title: 维护公共秩序
  conceptType: 概念型
  aliases:
    - 公共场所的文明
  category: 观点
  explanation: 公共场所是大家共同活动的地方，要遵守秩序、文明言行，比如升国旗时肃立、乘车时排队。大家共同维护，才能营造良好的公共环境。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:维护公平
  type: Concept
  subject: 道德与法治
  title: 维护公平
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护公平只是政府的责任，个人遇到不公平只能忍受，如被欺凌也不敢声张。
    - 能指出并纠正这一错误：认为为了公平可以不择手段，比如用暴力强行要求平分资源。
  aliases: []
  category: 道德与法治
  explanation: 维护社会公平需要每个人努力追求公平、捍卫公平，面对利益冲突站在公平立场，遇到不公平现象要坚守原则，采用合理合法方式谋求最大限度的公平；同时需要充分发挥规则的保障作用，全体社会成员遵守规则。
  misconceptions:
    - 认为维护公平只是政府的责任，个人遇到不公平只能忍受，如被欺凌也不敢声张。
    - 认为为了公平可以不择手段，比如用暴力强行要求平分资源。
    - 认为只要遵守规则就一定能实现绝对公平，忽视规则本身也可能存在缺陷。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:维护国家利益
  type: Concept
  subject: 道德与法治
  title: 维护国家利益
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护国家利益只是国家的事，自己作为学生无能为力。
    - 能指出并纠正这一错误：误以为未成年人没有义务维护国家利益，等长大了再说。
  aliases:
    - 捍卫国家利益
  category: 行为要求
  explanation: 维护国家利益是每个公民的基本义务，捍卫国家利益是每一个中华儿女的神圣职责，要牢固树立国家利益至上观念，坚决维护国家的尊严、荣誉和利益。
  misconceptions:
    - 认为维护国家利益只是国家的事，自己作为学生无能为力。
    - 误以为未成年人没有义务维护国家利益，等长大了再说。
    - 在个人利益与国家利益冲突时，只求个人好处，不顾国家损失。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:维护国家利益是公民的责任
  type: Concept
  subject: 道德与法治
  title: 维护国家利益是公民的责任
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护国家利益只是党员干部的事，普通公民没有责任。
    - 能指出并纠正这一错误：觉得维护国家利益就是喊口号，不需要在学习和工作中落实行动。
  aliases:
    - 维护国家利益人人有责
  category: 道德与法治
  explanation: 维护国家利益是每个公民的责任，应落实在日常行动中，人人可为。
  misconceptions:
    - 认为维护国家利益只是党员干部的事，普通公民没有责任。
    - 觉得维护国家利益就是喊口号，不需要在学习和工作中落实行动。
    - 把维护国家利益等同于维护国家安全，认为只有发现间谍才算维护。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S5.md
- id: concept:道德与法治:维护国家安全、荣誉和利益
  type: Concept
  subject: 道德与法治
  title: 维护国家安全、荣誉和利益
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护国家安全和荣誉是国家和政府的事，与普通公民无关。
    - 能指出并纠正这一错误：把维护国家安全等同于不泄露国家机密，忽视维护主权、领土完整的义务。
  aliases: []
  category: 法律概念
  explanation: 维护国家安全包括维护国家的主权、领土完整不受侵犯，国家秘密不被窃取、泄露和出卖，社会秩序不被破坏等；维护国家荣誉包括维护国家的尊严不受侵犯，国家的荣誉不受玷污；维护国家利益包括维护国家的政治、经济和安全等各方面的利益。
  misconceptions:
    - 认为维护国家安全和荣誉是国家和政府的事，与普通公民无关。
    - 把维护国家安全等同于不泄露国家机密，忽视维护主权、领土完整的义务。
    - 认为维护国家利益就是维护个人利益，将二者混为一谈。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:维护国家安全是公民的法定义务
  type: Concept
  subject: 道德与法治
  title: 维护国家安全是公民的法定义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护国家安全是道德义务，不履行也不会承担法律责任。
    - 能指出并纠正这一错误：发现危害国家安全的行为后，因怕麻烦而不向有关部门报告。
  aliases:
    - 公民维护国家安全的义务
  category: 法律常识
  explanation: 公民有维护国家安全的法定义务，应依法履行，如发现危害国家安全的行为应及时报告。
  misconceptions:
    - 认为维护国家安全是道德义务，不履行也不会承担法律责任。
    - 发现危害国家安全的行为后，因怕麻烦而不向有关部门报告。
    - 认为报告危害国家安全行为是军人和警察的专属义务，公民无权报告。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S5.md
- id: concept:道德与法治:维护国家安全的义务
  type: Concept
  subject: 道德与法治
  title: 维护国家安全的义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把维护国家安全的义务看作权利，认为可以放弃或转让。
    - 能指出并纠正这一错误：认为只有成年人或军人有维护国家安全的义务，未成年人没有。
  aliases: []
  category: 义务
  explanation: 公民有维护祖国的安全、荣誉和利益的义务，不得有危害祖国的安全、荣誉和利益的行为。
  misconceptions:
    - 把维护国家安全的义务看作权利，认为可以放弃或转让。
    - 认为只有成年人或军人有维护国家安全的义务，未成年人没有。
    - 觉得只要不主动出卖国家秘密就算履行了义务，忽略制止危害行为的义务。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S6.md
- id: concept:道德与法治:维护国家安全的方式
  type: Concept
  subject: 道德与法治
  title: 维护国家安全的方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为普通百姓维护国家安全只能靠举报，没有其他可行方式。
    - 能指出并纠正这一错误：觉得接受国家安全教育只是获取知识，不算维护国家安全的行为。
  aliases: []
  category: 方法
  explanation: 维护国家安全人人可为，可以通过接受国家安全教育、检举制止危害国家安全的行为、提供便利和协助、建言献策等方式。
  misconceptions:
    - 认为普通百姓维护国家安全只能靠举报，没有其他可行方式。
    - 觉得接受国家安全教育只是获取知识，不算维护国家安全的行为。
    - 认为维护国家安全是专职人员的事，公民只需配合即可。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:维护国家统一和全国各民族团结
  type: Concept
  subject: 道德与法治
  title: 维护国家统一和全国各民族团结
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护民族团结是少数民族地区的事，汉族公民无需参与。
    - 能指出并纠正这一错误：认为维护国家统一是军队和政府的职责，公民个人无能为力。
  aliases: []
  category: 法律概念
  explanation: 国家的统一和民族的团结是我国顺利进行社会主义现代化建设的基本保证。每个公民都应当自觉维护国家主权、统一、领土完整，维护平等团结互助和谐的社会主义民族关系。
  misconceptions:
    - 认为维护民族团结是少数民族地区的事，汉族公民无需参与。
    - 认为维护国家统一是军队和政府的职责，公民个人无能为力。
    - 把维护国家统一等同于维护民族团结，忽略领土完整等要求。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:维护民族团结的义务
  type: Concept
  subject: 道德与法治
  title: 维护民族团结的义务
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护民族团结只是道德要求，不履行也不违法，不知道是法律义务。
    - 能指出并纠正这一错误：觉得维护民族团结是少数民族的事，汉族没有这个义务。
  aliases: []
  category: 公民义务
  explanation: 维护和促进民族团结是每个公民的神圣职责和光荣义务。
  misconceptions:
    - 认为维护民族团结只是道德要求，不履行也不违法，不知道是法律义务。
    - 觉得维护民族团结是少数民族的事，汉族没有这个义务。
    - 以为只要不搞破坏民族团结的事就等于尽到了义务，忽略了主动促进团结的积极责任。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:维护消费者权益
  type: Concept
  subject: 道德与法治
  title: 维护消费者权益
  conceptType: 程序型
  aliases:
    - 消费维权
  category: 观点
  explanation: 消费者依法享有合法权益。权益受到侵害时，可以与商家协商，向消费者协会或市场监督管理部门投诉，也可拨打12315热线，并保留小票、发票等凭证。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:维护班集体的荣誉
  type: Concept
  subject: 道德与法治
  title: 维护班集体的荣誉
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 作为班集体的一员，要遵守班规，不做有损班级荣誉的事，看到同学这样做时还要善意提醒。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:维护祖国统一
  type: Concept
  subject: 道德与法治
  title: 维护祖国统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为维护祖国统一只包括反对分裂行为，不包括推动两岸和平统一。
    - 能指出并纠正这一错误：把维护祖国统一等同于维护国家主权，忽略领土完整这一独立内涵。
  aliases: []
  category: 政治原则
  explanation: 维护国家主权和领土完整，是中华民族的根本利益所在，包括反对分裂、促进两岸统一等。
  misconceptions:
    - 认为维护祖国统一只包括反对分裂行为，不包括推动两岸和平统一。
    - 把维护祖国统一等同于维护国家主权，忽略领土完整这一独立内涵。
    - 认为维护祖国统一只是军队和政府的责任，普通公民做不了什么。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:维护规则
  type: Concept
  subject: 道德与法治
  title: 维护规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要自己遵守规则就算维护规则，别人违反与我无关
    - 能指出并纠正这一错误：看到他人违反规则，直接用拳头或辱骂去'教育'对方
  aliases: []
  category: 道德与法治
  explanation: 从自己做起，将规则内化于心、外化于行，并用恰当方法提醒、劝导、帮助他人遵守规则。
  misconceptions:
    - 认为只要自己遵守规则就算维护规则，别人违反与我无关
    - 看到他人违反规则，直接用拳头或辱骂去'教育'对方
    - 怕得罪人而选择沉默，看见插队、闯红灯也不提醒
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:绿水青山就是金山银山
  type: Concept
  subject: 道德与法治
  title: 绿水青山就是金山银山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为绿水青山直接变成金钱，不需要发展产业
    - 能指出并纠正这一错误：把'保护生态环境就是保护生产力'理解为保护环境与发展经济相互矛盾
  aliases:
    - 两山理论
  category: 生态文明理念
  explanation: 习近平提出的科学论断，强调保护生态环境就是保护生产力，改善生态环境就是发展生产力，不能以牺牲环境为代价换取经济增长。
  misconceptions:
    - 认为绿水青山直接变成金钱，不需要发展产业
    - 把'保护生态环境就是保护生产力'理解为保护环境与发展经济相互矛盾
    - 认为为了金山银山可以暂时牺牲绿水青山
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:绿色发展道路
  type: Concept
  subject: 道德与法治
  title: 绿色发展道路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为绿色发展就是植树造林，与经济发展无关
    - 能指出并纠正这一错误：把绿色发展等同于限制发展，甚至不发展
  aliases:
    - 绿色发展
  category: 发展理念
  explanation: 坚持绿色发展，走生产发展、生活富裕、生态良好的文明发展道路，是解决经济社会发展中人口、资源、环境问题的必然选择。
  misconceptions:
    - 认为绿色发展就是植树造林，与经济发展无关
    - 把绿色发展等同于限制发展，甚至不发展
    - 认为只有发达地区才需要走绿色发展道路
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:绿色生产生活方式
  type: Concept
  subject: 道德与法治
  title: 绿色生产生活方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为绿色生活方式就是要求所有人都过苦行僧式生活，不能消费
    - 能指出并纠正这一错误：把绿色生产生活方式等同于垃圾分类，忽略节能低碳
  aliases:
    - 绿色生活
  category: 生活方式
  explanation: 倡导节能、环保、低碳、文明的绿色生产生活方式，让绿色发展理念渗透到生活细节中。
  misconceptions:
    - 认为绿色生活方式就是要求所有人都过苦行僧式生活，不能消费
    - 把绿色生产生活方式等同于垃圾分类，忽略节能低碳
    - 认为绿色生活方式只是个人选择，与生产无关
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:缓解考试压力的方法
  type: Concept
  subject: 道德与法治
  title: 缓解考试压力的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为缓解压力就要完全放松，否定适度紧张对考试状态的积极作用
    - 能指出并纠正这一错误：盲目照搬别人的减压方法，不考虑自己的实际特点，效果不佳
  aliases:
    - 考试压力缓解方法
  category: 学习方法
  explanation: 包括转移注意力、保持身体放松、自我暗示、保持适度紧张等方法。
  misconceptions:
    - 认为缓解压力就要完全放松，否定适度紧张对考试状态的积极作用
    - 盲目照搬别人的减压方法，不考虑自己的实际特点，效果不佳
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:网上购物的注意事项
  type: Concept
  subject: 道德与法治
  title: 网上购物的注意事项
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 网购时要查看商店的信用标识，仔细阅读商品介绍和售后条款，选择安全的支付方式，并保存好订单信息和交流记录。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:网瘾
  type: Concept
  subject: 道德与法治
  title: 网瘾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有沉迷游戏才算网瘾，刷视频聊天不算。
    - 能指出并纠正这一错误：觉得网瘾只是贪玩，不是一种需要治疗的病症。
  aliases:
    - 网络成瘾
    - 网络过度使用症
  category: 道德与法治
  explanation: 又称网络过度使用症，指长时间沉迷于网络，对网络之外的事情没有多少兴趣，影响身心健康的一种病症。
  misconceptions:
    - 认为只有沉迷游戏才算网瘾，刷视频聊天不算。
    - 觉得网瘾只是贪玩，不是一种需要治疗的病症。
    - 认为只要成绩好，通宵上网也不算网瘾。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:网络促进人际交往
  type: Concept
  subject: 道德与法治
  title: 网络促进人际交往
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：网络交友方便快捷，所以可以完全取代现实中的朋友，不需要线下交往。
    - 能指出并纠正这一错误：网络打破了时空限制，就可以随意辱骂他人，反正对方找不到我。
  aliases: []
  category: 道德与法治
  explanation: 网络打破了传统人际交往的时空限制，使人际交往更加方便快捷。
  misconceptions:
    - 网络交友方便快捷，所以可以完全取代现实中的朋友，不需要线下交往。
    - 网络打破了时空限制，就可以随意辱骂他人，反正对方找不到我。
    - 网上聊天看不见对方，不用对自己的言论负责。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:网络促进社会进步
  type: Concept
  subject: 道德与法治
  title: 网络促进社会进步
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只要在网上发帖评论国家大事，就算在行使民主权利，不管内容真假。
    - 能指出并纠正这一错误：网络征求意见是民主的唯一形式，否则就是不民主。
  aliases: []
  category: 道德与法治
  explanation: 网络为社会发展提供了新的平台和渠道，如网上意见征求等，促进社会民主和治理。
  misconceptions:
    - 只要在网上发帖评论国家大事，就算在行使民主权利，不管内容真假。
    - 网络征求意见是民主的唯一形式，否则就是不民主。
    - 网络促进社会进步，所以政府必须按网民投票做决策。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:网络安全
  type: Concept
  subject: 道德与法治
  title: 网络安全
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为网络安全只是电脑杀毒，不涉及手机和账号数据
    - 能指出并纠正这一错误：将个人信息免费换取小礼品，认为不会影响网络安全
  aliases: []
  category: 道德与法治
  explanation: 网络安全是指网络系统的硬件、软件及其系统中的数据受到保护，不因偶然或恶意原因而遭受到破坏、更改、泄露，保障网络服务不中断。
  misconceptions:
    - 认为网络安全只是电脑杀毒，不涉及手机和账号数据
    - 将个人信息免费换取小礼品，认为不会影响网络安全
    - 以为设置复杂密码就绝对安全，忽视设备漏洞和钓鱼链接
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:网络推动生产方式变革
  type: Concept
  subject: 道德与法治
  title: 网络推动生产方式变革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：传统企业只要开个网店，就算完成了生产方式的变革。
    - 能指出并纠正这一错误：网络催生新业态，所以实体经济不再重要，会全部消失。
  aliases: []
  category: 道德与法治
  explanation: 网络促进人才、资金、技术、物资的流动，催生新产业、新业态、新模式，推动传统行业转型升级。
  misconceptions:
    - 传统企业只要开个网店，就算完成了生产方式的变革。
    - 网络催生新业态，所以实体经济不再重要，会全部消失。
    - 生产方式变革就是所有工作都在网上完成，不需要线下生产。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:网络改变生活方式
  type: Concept
  subject: 道德与法治
  title: 网络改变生活方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：网络让生活更便利，所以可以整天刷手机，反正这是新生活方式。
    - 能指出并纠正这一错误：网络购物、在线学习能完全替代现实生活中的一切体验。
  aliases: []
  category: 道德与法治
  explanation: 网络深刻改变着我们的生活方式，使生活更加丰富、便利和美好。
  misconceptions:
    - 网络让生活更便利，所以可以整天刷手机，反正这是新生活方式。
    - 网络购物、在线学习能完全替代现实生活中的一切体验。
    - 既然网络改变生活方式，那么所有个人信息都该上传到网络保存。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:网络改进社会治理方式
  type: Concept
  subject: 道德与法治
  title: 网络改进社会治理方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为网络反腐是给政府添乱，不是参与社会治理。
    - 能指出并纠正这一错误：觉得网上政务只是形式，公民参与没有实际作用。
  aliases:
    - 网络促进社会治理
  category: 道德与法治
  explanation: 网络推动信息互联互通，有助于完善线上线下一体的智能化、精细化公共服务，提高社会治理水平；畅通人们参与社会治理的渠道，保障人们的知情权、参与权、表达权和监督权，促进民主政治的进步。
  misconceptions:
    - 认为网络反腐是给政府添乱，不是参与社会治理。
    - 觉得网上政务只是形式，公民参与没有实际作用。
    - 认为改进社会治理只是政府的事，与普通学生无关。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:网络谣言的危害
  type: Concept
  subject: 道德与法治
  title: 网络谣言的危害
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 编造和传播网络谣言会扰乱公共秩序，造成恶劣的社会影响，造谣传谣还要承担法律责任。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:网购注意事项
  type: Concept
  subject: 道德与法治
  title: 网购注意事项
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 网购时要关注商家的信用、销售量和顾客评价等信息，学会货比三家，才能买到既便宜又合适的商品。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:美丽中国建设
  type: Concept
  subject: 道德与法治
  title: 美丽中国建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为美丽中国就是到处是花园，与经济发展无关
    - 能指出并纠正这一错误：认为建设美丽中国是几十年后的事，现在不需要行动
  aliases:
    - 美丽中国
  category: 发展目标
  explanation: 建设资源节约型、环境友好型社会，实现经济繁荣、生态良好、人民幸福，是建设美丽中国的时代图景。
  misconceptions:
    - 认为美丽中国就是到处是花园，与经济发展无关
    - 认为建设美丽中国是几十年后的事，现在不需要行动
    - 把美丽中国建设等同于生态文明建设，忽略社会和谐
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:老师的辛苦
  type: Concept
  subject: 道德与法治
  title: 老师的辛苦
  conceptType: 概念型
  aliases:
    - 老师多辛苦
  category: 观点
  explanation: 老师每天忙碌工作，日程安排得满满的，还有很多我们看不到的付出。老师的辛苦藏在他们的关怀和辛勤工作里。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:职业与兴趣的关系
  type: Concept
  subject: 道德与法治
  title: 职业与兴趣的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为兴趣是一成不变的，没有意识到兴趣可以在实践尝试中培养和发展
    - 能指出并纠正这一错误：觉得只要对某职业感兴趣就一定能做好，不考虑能力是否匹配和社会需求
  aliases: []
  category: 职业规划
  explanation: 兴趣可在实践中发现和培养，要处理好职业与兴趣的关系，爱岗敬业。
  misconceptions:
    - 认为兴趣是一成不变的，没有意识到兴趣可以在实践尝试中培养和发展
    - 觉得只要对某职业感兴趣就一定能做好，不考虑能力是否匹配和社会需求
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:职业准备
  type: Concept
  subject: 道德与法治
  title: 职业准备
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得职业准备是毕业求职时才做的事，现在考虑为时过早
    - 能指出并纠正这一错误：只冲着‘热门职业’去准备，从不分析自己的特长、性格和职业要求
  aliases:
    - 职业生涯规划
  category: 职业规划
  explanation: 做好职业准备，规划职业生涯，考虑兴趣、特长、能力，适应社会需求。
  misconceptions:
    - 觉得职业准备是毕业求职时才做的事，现在考虑为时过早
    - 只冲着‘热门职业’去准备，从不分析自己的特长、性格和职业要求
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:职业生涯规划的方法
  type: Concept
  subject: 道德与法治
  title: 职业生涯规划的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为职业生涯规划制定一次就永远不变，不根据现实变化适时调整
    - 能指出并纠正这一错误：把规划方法当作书面作业，只写不用，不理解它要落实到日常行动中
  aliases:
    - 职业生涯规划方法
    - 职业规划步骤
  category: 方法技能
  explanation: 包括自我分析、环境分析、确定目标、行动计划、评估调整五个步骤。
  misconceptions:
    - 认为职业生涯规划制定一次就永远不变，不根据现实变化适时调整
    - 把规划方法当作书面作业，只写不用，不理解它要落实到日常行动中
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:联合国
  type: Concept
  subject: 道德与法治
  title: 联合国
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 联合国是当代最具普遍性、代表性和权威性的政府间国际组织，1945年成立，设有联合国大会、安全理事会、国际法院等主要机构，在维护世界和平、促进全球发展方面作用无可替代。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:联系人大代表的途径
  type: Concept
  subject: 道德与法治
  title: 联系人大代表的途径
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公民可以随时随地直接联系人大代表反映问题，不必通过法定途径。
    - 能指出并纠正这一错误：混淆人大代表和政协委员，认为都可以提出议案并监督政府。
  aliases:
    - 人大代表联络方式
    - 联系人大代表的方式
  category: 政治参与
  explanation: 公民可以通过人大代表联络站、人大代表之家、人大代表述职等途径联系人大代表，反映意见和要求。
  misconceptions:
    - 认为公民可以随时随地直接联系人大代表反映问题，不必通过法定途径。
    - 混淆人大代表和政协委员，认为都可以提出议案并监督政府。
    - 认为人大代表述职是公民向代表报告工作，方向理解颠倒。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:肖像权
  type: Concept
  subject: 道德与法治
  title: 肖像权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非营利使用他人肖像就不侵权，如丑化、盗用也算
    - 能指出并纠正这一错误：误以为偷拍但未公开不算侵犯肖像权
  aliases: []
  category: 法律权利
  explanation: 个人有权依法制作、使用、公开或许可他人使用自己的肖像，禁止他人丑化、污损或伪造。
  misconceptions:
    - 认为非营利使用他人肖像就不侵权，如丑化、盗用也算
    - 误以为偷拍但未公开不算侵犯肖像权
    - 认为只有明星等公众人物才有肖像权，普通人没有
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:脚踏实地、实事求是
  type: Concept
  subject: 道德与法治
  title: 脚踏实地、实事求是
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为实事求是就是“只信亲眼所见”，拒绝借鉴他人可靠经验。
    - 能指出并纠正这一错误：说“我想的就是事实”，将主观意愿等同于客观实际。
  aliases:
    - 实事求是
  category: 思想理念
  explanation: 倡导从实际出发，在实践中探求真知，按照事物实际情况办事的思想。
  misconceptions:
    - 认为实事求是就是“只信亲眼所见”，拒绝借鉴他人可靠经验。
    - 说“我想的就是事实”，将主观意愿等同于客观实际。
    - 把实事求是等同于“循规蹈矩”，不敢突破创新。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:脱贫攻坚战全面胜利
  type: Concept
  subject: 道德与法治
  title: 脱贫攻坚战全面胜利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为脱贫攻坚胜利就是消灭了所有贫困，包括相对贫困
    - 能指出并纠正这一错误：认为脱贫攻坚战胜利是终点，不需要巩固成果和防止返贫
  aliases:
    - 脱贫攻坚
  category: 史实
  explanation: 2021年，我国脱贫攻坚战取得全面胜利，消除了绝对贫困，创造了人间奇迹。
  misconceptions:
    - 认为脱贫攻坚胜利就是消灭了所有贫困，包括相对贫困
    - 认为脱贫攻坚战胜利是终点，不需要巩固成果和防止返贫
    - 把脱贫完全归功于国家救济，忽视群众自身努力
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:脱贫攻坚精神
  type: Concept
  subject: 道德与法治
  title: 脱贫攻坚精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'上下同心'写成'众志成城'，与其他精神混为一谈
    - 能指出并纠正这一错误：认为脱贫攻坚结束了，脱贫攻坚精神也只属于过去
  aliases: []
  category: 道德与法治
  explanation: 脱贫攻坚伟大斗争，锻造形成了上下同心、尽锐出战、精准务实、开拓创新、攻坚克难、不负人民的脱贫攻坚精神。
  misconceptions:
    - 把'上下同心'写成'众志成城'，与其他精神混为一谈
    - 认为脱贫攻坚结束了，脱贫攻坚精神也只属于过去
    - 将'不负人民'与'以人为本'完全等同，忽视特定内涵
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:自主创新
  type: Concept
  subject: 道德与法治
  title: 自主创新
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自主创新就是全部技术都由自己发明，拒绝任何合作
    - 能指出并纠正这一错误：把引进消化吸收再创新排除在自主创新之外，认为这不属于
  aliases:
    - 自主创新能力
  category: 创新理念
  explanation: 依靠自身力量进行科技创新，掌握核心技术，是攀登世界科技高峰的必由之路。
  misconceptions:
    - 认为自主创新就是全部技术都由自己发明，拒绝任何合作
    - 把引进消化吸收再创新排除在自主创新之外，认为这不属于
    - 认为自主创新只能靠国家投入，企业个人只需模仿即可
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:自信
  type: Concept
  subject: 道德与法治
  title: 自信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自信就是认为自己永远正确，不虚心接受批评。
    - 能指出并纠正这一错误：把盲目自大当成自信，例如“我肯定能考第一，不用复习”。
  aliases:
    - 自信心
  category: 心理品质
  explanation: 自信就是相信自己，是一个人对自身能力的肯定，是一个人自身能力的彰显，是一个人精神风貌的体现。
  misconceptions:
    - 认为自信就是认为自己永远正确，不虚心接受批评。
    - 把盲目自大当成自信，例如“我肯定能考第一，不用复习”。
    - 认为自信是与生俱来的，无法培养。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:自信的中国人
  type: Concept
  subject: 道德与法治
  title: 自信的中国人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自信的中国人就是觉得中国什么都好，盲目自大，拒绝学习外国长处。
    - 能指出并纠正这一错误：把自信的中国人理解成只要嘴上爱国就行，不要求脚踏实地努力奋斗。
  aliases: []
  category: 品质
  explanation: 对国家有认同、对文化有底气、对发展有信心，既是梦想家又是实干家。
  misconceptions:
    - 认为自信的中国人就是觉得中国什么都好，盲目自大，拒绝学习外国长处。
    - 把自信的中国人理解成只要嘴上爱国就行，不要求脚踏实地努力奋斗。
    - 认为自信的中国人必须排斥一切外来文化，否则就是文化不自信。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:自力更生、艰苦奋斗
  type: Concept
  subject: 道德与法治
  title: 自力更生、艰苦奋斗
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 新中国成立后，全国人民依靠自己的力量艰苦创业，改变工业落后面貌、摘掉贫油帽子，让中国屹立在世界的东方。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:自卑
  type: Concept
  subject: 道德与法治
  title: 自卑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把谦虚说成自卑，如“我不行”是谦虚，其实是自卑。
    - 能指出并纠正这一错误：认为不爱说话就是自卑，性格内向不等于自卑。
  aliases: []
  category: 心理现象
  explanation: 自卑表现为轻视自己，认为自己不如别人，低估自己的能力，不敢尝试。自信的人应远离自卑。
  misconceptions:
    - 把谦虚说成自卑，如“我不行”是谦虚，其实是自卑。
    - 认为不爱说话就是自卑，性格内向不等于自卑。
    - 认为自己某方面不如别人就全盘否定自己，是自卑的表现。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:自尊
  type: Concept
  subject: 道德与法治
  title: 自尊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自尊就是“要面子”，别人批评就是伤自尊。
    - 能指出并纠正这一错误：把自尊心过强看成是自尊，实则自负。
  aliases:
    - 自我尊重
  category: 心理品质
  explanation: 自尊是对自我价值的肯定，包括自我尊重和赢得他人的尊重，是一种良好的心理状态和个人德行的具体表现。
  misconceptions:
    - 认为自尊就是“要面子”，别人批评就是伤自尊。
    - 把自尊心过强看成是自尊，实则自负。
    - 认为自尊就是不能承认自己的错误，否则丢脸。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:自己整理东西
  type: Concept
  subject: 道德与法治
  title: 自己整理东西
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 自己的东西要自己整理，不能依赖妈妈，也不能等长大再说。乱扔乱放用时找不着。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:自强
  type: Concept
  subject: 道德与法治
  title: 自强
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自强就是遇事不求助别人，自己硬扛。
    - 能指出并纠正这一错误：把爱出风头、争强好胜当作自强。
  aliases:
    - 自立自强
  category: 精神品质
  explanation: 自强是自我勉励、发愤图强，是一种奋发进取的精神状态，是一种不断完善自我、超越自我的人生追求。
  misconceptions:
    - 认为自强就是遇事不求助别人，自己硬扛。
    - 把爱出风头、争强好胜当作自强。
    - 认为自强只有贫困或残疾的人需要，与普通人无关。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:自强不息
  type: Concept
  subject: 道德与法治
  title: 自强不息
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自强不息就是“完全靠自己，不接收任何帮助”。
    - 能指出并纠正这一错误：把自强不息理解为“争强好胜”，处处要赢过别人。
  aliases: []
  category: 道德与法治
  explanation: 自强不息是中华民族历经磨难而不倒的精神动力，面对困难和挑战应自立自强、刚健有为。
  misconceptions:
    - 认为自强不息就是“完全靠自己，不接收任何帮助”。
    - 把自强不息理解为“争强好胜”，处处要赢过别人。
    - 说“遇到困难死扛就是自强不息”，忽略需要智慧和方法。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:自我保护
  type: Concept
  subject: 道德与法治
  title: 自我保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为性骚扰只发生在陌生人之间，熟人不可能实施侵害
    - 能指出并纠正这一错误：受到侵害后觉得丢人，自己忍着不告诉家长老师，也不报警
  aliases:
    - 自我保护意识
  category: 安全与法律
  explanation: 增强自我保护意识，提高预防和应对性骚扰、性侵害的能力，学会运用法律武器维护权益。
  misconceptions:
    - 认为性骚扰只发生在陌生人之间，熟人不可能实施侵害
    - 受到侵害后觉得丢人，自己忍着不告诉家长老师，也不报警
    - 把“自我保护”等同于不和任何人接触，拒绝所有社交活动
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:自我分析
  type: Concept
  subject: 道德与法治
  title: 自我分析
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：自我分析只看缺点，对自己的优点视而不见，越分析越自卑
    - 能指出并纠正这一错误：只从成绩单这一个角度分析自己，忽视生理、心理和人际关系方面
  aliases: []
  category: 认识方法
  explanation: 通过生理、心理、社会关系等方面全面分析自己来认识自己。
  misconceptions:
    - 自我分析只看缺点，对自己的优点视而不见，越分析越自卑
    - 只从成绩单这一个角度分析自己，忽视生理、心理和人际关系方面
    - 认为自我分析就是给自己贴标签，如觉得自己内向就不去改变
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:自我调节的方法
  type: Concept
  subject: 道德与法治
  title: 自我调节的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：心情不好时只靠打游戏、刷手机来缓解，认为这也是自我调节
    - 能指出并纠正这一错误：把写想法写成抱怨别人，只写“他太讨厌”，不反思自己
  aliases:
    - 自我调节
  category: 方法与技能
  explanation: 自我调节的方法包括写想法、参加体育活动、运用积极思维等，有助于化解烦恼。
  misconceptions:
    - 心情不好时只靠打游戏、刷手机来缓解，认为这也是自我调节
    - 把写想法写成抱怨别人，只写“他太讨厌”，不反思自己
    - 觉得运动调节只对体育生有用，自己懒得动，仍然憋着烦恼
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:自我超越
  type: Concept
  subject: 道德与法治
  title: 自我超越
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把自我超越理解为要比别人强，总是与同学攀比分数和名次
    - 能指出并纠正这一错误：认为自己只要在优势学科上不断突破就算自我超越，忽视短板和全面发展
  aliases: []
  category: 心理品质
  explanation: 在认识自己的基础上，不断挑战自我、突破局限，实现个人潜能的最大发挥。
  misconceptions:
    - 把自我超越理解为要比别人强，总是与同学攀比分数和名次
    - 认为自己只要在优势学科上不断突破就算自我超越，忽视短板和全面发展
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:自然灾害的危害
  type: Concept
  subject: 道德与法治
  title: 自然灾害的危害
  conceptType: 概念型
  aliases:
    - 我国自然灾害
  category: 现象
  explanation: 我国是世界上遭受自然灾害最严重的国家之一，主要有旱灾、台风、洪涝、地震、滑坡、泥石流和病虫害等。灾害会造成资源破坏、经济损失和人员伤亡，还影响社会稳定和可持续发展。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:自理自立
  type: Concept
  subject: 道德与法治
  title: 自理自立
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 自己的事情自己做，努力学习、练就本领、加强品德修养。做到自立自强，就是对家人最大的精神安慰。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:自由
  type: Concept
  subject: 道德与法治
  title: 自由
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自由就是绝对无限制，如'我想上网到几点就到几点，这是我的自由'
    - 能指出并纠正这一错误：看到法律限制某些行为，就认为'法律减少了自由，自由就该无拘无束'
  aliases: []
  category: 道德与法治
  explanation: 自由是社会主义核心价值观的重要内容，意味着在遵守社会规则的前提下，人们能够依照自己的意志活动，在思想、言论和行为等方面具有充分的自主性。
  misconceptions:
    - 认为自由就是绝对无限制，如'我想上网到几点就到几点，这是我的自由'
    - 看到法律限制某些行为，就认为'法律减少了自由，自由就该无拘无束'
    - 把自由等同于自己想干什么就干什么，忽视自由受社会规则制约
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:自觉守法
  type: Concept
  subject: 道德与法治
  title: 自觉守法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要不犯罪就是守法，违反交通规则、考场纪律不算违法。
    - 能指出并纠正这一错误：无人监督时就违反规则，认为守法是做给别人看的。
  aliases:
    - 守法
  category: 法律义务
  explanation: 遵守宪法和法律是公民的一项基本义务，要求公民在行动上以法律为准绳，自觉遵守法律各项规定。
  misconceptions:
    - 认为只要不犯罪就是守法，违反交通规则、考场纪律不算违法。
    - 无人监督时就违反规则，认为守法是做给别人看的。
    - 以为自觉守法只要求行为合法，不需要学习法律知识。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:自觉抵制不良信息
  type: Concept
  subject: 道德与法治
  title: 自觉抵制不良信息
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为不良信息只有色情暴力，谣言广告不算。
    - 能指出并纠正这一错误：看到低俗内容觉得不看就行，点进去也无所谓。
  aliases:
    - 抵制不良信息
  category: 道德与法治
  explanation: 要提高个人信息保护意识，学会分析判断网络信息，让不良信息止于智者。
  misconceptions:
    - 认为不良信息只有色情暴力，谣言广告不算。
    - 看到低俗内容觉得不看就行，点进去也无所谓。
    - 认为自己不会被不良信息影响，不用刻意抵制。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S6.md
- id: concept:道德与法治:自觉抵制不良行为
  type: Concept
  subject: 道德与法治
  title: 自觉抵制不良行为
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 未成年人要遵守法律法规和社会道德规范，自觉抵制不良行为和违法犯罪行为的引诱，铭记'勿以恶小而为之'，杜绝不良行为，远离违法犯罪。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:自觉排队
  type: Concept
  subject: 道德与法治
  title: 自觉排队
  conceptType: 概念型
  aliases:
    - 大家排好队
    - 排队的规则
  category: 观点
  explanation: 排队要守规则、懂礼让：先来后到，不插队，排队保持间距。排好队才有秩序、才公平，在公共场所排队是讲文明的表现。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:自觉遵守规则
  type: Concept
  subject: 道德与法治
  title: 自觉遵守规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：无人监督时觉得可以不守规则，例如没有交警就闯红灯。
    - 能指出并纠正这一错误：认为遵守规则是做给别人看的，只要不被发现就能违规。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 无人监督时觉得可以不守规则，例如没有交警就闯红灯。
    - 认为遵守规则是做给别人看的，只要不被发现就能违规。
    - 觉得规则是约束别人的，自己可以特殊，比如插队。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:自负
  type: Concept
  subject: 道德与法治
  title: 自负
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自负就是自信，只是比自信更坚定。
    - 能指出并纠正这一错误：把夸夸其谈、自视过高当作有个性。
  aliases: []
  category: 心理现象
  explanation: 自负表现为过高地估计自己，自以为是，好高骛远。自信的人应远离自负。
  misconceptions:
    - 认为自负就是自信，只是比自信更坚定。
    - 把夸夸其谈、自视过高当作有个性。
    - 认为自负的人往往是有能力的，只是态度不好。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:良法之治
  type: Concept
  subject: 道德与法治
  title: 良法之治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要是立法机关出的法律都是良法，不审查其是否反映人民意志。
    - 能指出并纠正这一错误：把良法与善治混为一谈，认为良法之治就是治理得好。
  aliases: []
  category: 法律概念
  explanation: 良法反映最广大人民群众的意志和利益，符合公平正义要求，是法治的前提。
  misconceptions:
    - 认为只要是立法机关出的法律都是良法，不审查其是否反映人民意志。
    - 把良法与善治混为一谈，认为良法之治就是治理得好。
    - 认为良法就是内容完美无缺的法律，忽略其对公平正义的追求。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:节俭是个传家宝
  type: Concept
  subject: 道德与法治
  title: 节俭是个传家宝
  conceptType: 概念型
  aliases:
    - 俭以养德
    - 勤俭节约
  category: 观点
  explanation: 节俭就是不浪费，一粒粮食也不能浪费。节俭能帮我们养成好品德，就算生活条件好了，也要节俭。这就是"俭以养德"。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:节俭的做法
  type: Concept
  subject: 道德与法治
  title: 节俭的做法
  conceptType: 程序型
  aliases:
    - 光盘行动
  category: 方法
  explanation: 节俭可以这样做：吃饭不铺张不浪费，践行光盘行动；零花钱有计划地花，闲置物品互相置换；共享资源，细水长流。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:节约用水的方法
  type: Concept
  subject: 道德与法治
  title: 节约用水的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 洗手时不一直开着水龙头；用过的水可以冲厕所，洗水果的水可以留着接着用。一水多用，就是在节约用水。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:节约用纸
  type: Concept
  subject: 道德与法治
  title: 节约用纸
  conceptType: 程序型
  aliases: []
  category: 规则
  explanation: 纸是好朋友，要爱惜它：不写几个字就扔掉，本子用完再用新的，旧书本送去回收，还能用收集的纸做草稿本。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:节约粮食
  type: Concept
  subject: 道德与法治
  title: 节约粮食
  conceptType: 概念型
  aliases:
    - 拒绝浪费
  category: 观点
  explanation: 浪费粮食的现象常常被忽视，但日积月累数目惊人，还会污染环境。节约粮食既减轻农业对环境的压力，也节约生产资源。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:节约资源和保护环境的基本国策
  type: Concept
  subject: 道德与法治
  title: 节约资源和保护环境的基本国策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为节约资源和保护环境只是个人良好习惯，不属于基本国策
    - 能指出并纠正这一错误：把保护环境的基本国策与可持续发展战略相混淆
  aliases:
    - 节约资源保护环境
  category: 基本国策
  explanation: 我国坚持节约资源和保护环境的基本国策，使青山常在、绿水长流、空气常新。
  misconceptions:
    - 认为节约资源和保护环境只是个人良好习惯，不属于基本国策
    - 把保护环境的基本国策与可持续发展战略相混淆
    - 认为只要节约资源，就不需要开发新资源
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:花草树木有生命
  type: Concept
  subject: 道德与法治
  title: 花草树木有生命
  conceptType: 概念型
  aliases:
    - 植物有生命
  category: 观点
  explanation: 大树、花儿、小草都有生命，它们会发芽、开花、结果，种子落地上又能长出新芽。要像对待朋友一样对待它们。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:获得感、幸福感、安全感
  type: Concept
  subject: 道德与法治
  title: 获得感、幸福感、安全感
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为获得感、幸福感、安全感仅仅是物质满足，忽略精神文化需求
    - 能指出并纠正这一错误：把三者当成一回事，混用不分，比如用幸福感代替获得感
  aliases:
    - 三感
  category: 政治概念
  explanation: 人民对美好生活的主观感受，是衡量民生改善的重要指标。
  misconceptions:
    - 认为获得感、幸福感、安全感仅仅是物质满足，忽略精神文化需求
    - 把三者当成一回事，混用不分，比如用幸福感代替获得感
    - 认为只要经济发展快，人民的获得感、幸福感、安全感就会自动提升
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:落后就会挨打
  type: Concept
  subject: 道德与法治
  title: 落后就会挨打
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 近代中国遭受列强欺凌的历史警示我们：落后就会挨打，自强不息才能立于不败之地。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:虎门销烟
  type: Concept
  subject: 道德与法治
  title: 虎门销烟
  conceptType: 概念型
  aliases:
    - 林则徐禁烟
  category: 文化常识
  explanation: 1839 年 6 月，林则徐在虎门亲自指挥销毁没收的鸦片，向全世界表明了中国人民禁烟的决心和反抗外国侵略者的坚强意志。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:血缘关系
  type: Concept
  subject: 道德与法治
  title: 血缘关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把夫妻关系称为血缘关系，夫妻是婚姻关系，没有血统或生理联系。
    - 能指出并纠正这一错误：认为收养子女与养父母之间是血缘关系，收养关系无血缘，但仍是家庭。
  aliases: []
  category: 社会关系
  explanation: 以血统或生理联系等为基础而形成的社会关系，如家庭、家族成员之间的关系等。
  misconceptions:
    - 把夫妻关系称为血缘关系，夫妻是婚姻关系，没有血统或生理联系。
    - 认为收养子女与养父母之间是血缘关系，收养关系无血缘，但仍是家庭。
    - 把所有家庭成员都当作血缘关系，继父母子女、女婿儿媳并非血缘。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:行己有耻
  type: Concept
  subject: 道德与法治
  title: 行己有耻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行己有耻就是过分自责，对自己的所有行为都持否定态度。
    - 能指出并纠正这一错误：觉得只要不做违法的事，做些不道德的事也不算“可耻”。
  aliases:
    - 知耻
  category: 道德修养
  explanation: 指对自己不善的动机和行为有羞耻心，能以羞耻心约束自己的行为，凡自己认为可耻的事就不去做。
  misconceptions:
    - 认为行己有耻就是过分自责，对自己的所有行为都持否定态度。
    - 觉得只要不做违法的事，做些不道德的事也不算“可耻”。
    - 认为“知耻”就是感到丢人，因此为了不丢人而隐瞒错误。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:行政执法公示制度
  type: Concept
  subject: 道德与法治
  title: 行政执法公示制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行政执法公示制度由人民法院负责，而不是执法机关自己公示。
    - 能指出并纠正这一错误：把公示理解为事后公开处罚结果，忽略执法过程中也要公示。
  aliases:
    - 执法公示制度
  category: 行政法制度
  explanation: 行政执法机关要按照“谁执法谁公示”的原则，明确公示内容的采集、传递、审核、发布职责，规范信息公示内容的标准、格式。
  misconceptions:
    - 认为行政执法公示制度由人民法院负责，而不是执法机关自己公示。
    - 把公示理解为事后公开处罚结果，忽略执法过程中也要公示。
    - 认为“谁执法谁公示”只是针对公安，其他行政执法部门不用执行。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:行政诉讼
  type: Concept
  subject: 道德与法治
  title: 行政诉讼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行政机关欠钱不还可直接提起行政诉讼，其实政府购买商品不付钱属民事纠纷。
    - 能指出并纠正这一错误：以为行政诉讼要告作出决定的公务员个人，实际被告应是该行政机关。
  aliases: []
  category: 法律程序
  explanation: 人民法院在当事人和其他诉讼参与人参加下，依照诉讼程序解决行政争议案件的活动。
  misconceptions:
    - 认为行政机关欠钱不还可直接提起行政诉讼，其实政府购买商品不付钱属民事纠纷。
    - 以为行政诉讼要告作出决定的公务员个人，实际被告应是该行政机关。
    - 认为行政诉讼由作出决定的机关自己开庭处理，实际须由人民法院独立审判。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:衣食住行的变化
  type: Concept
  subject: 道德与法治
  title: 衣食住行的变化
  conceptType: 概念型
  aliases:
    - 生活的变化
  category: 观点
  explanation: 随着国家发展，人们的衣服、食物、住房、交通都越来越好，生活越来越幸福。这些都是生活改善的表现。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:表达的方法
  type: Concept
  subject: 道德与法治
  title: 表达的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 表达要自信，说话前先想好要说什么，说出自己的感受和见解，做到有理有据；表达还要礼貌、友善和尊重。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:见义勇为
  type: Concept
  subject: 道德与法治
  title: 见义勇为
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为见义勇为就是“跟坏人正面搏斗”，不顾自身危险。
    - 能指出并纠正这一错误：说“未成年人不需要见义勇为，报警就行”，完全回避责任。
  aliases: []
  category: 道德与法治
  explanation: 真正勇敢的人具有捍卫正义的勇毅精神，当国家利益和社会公共利益受到侵害时，敢于挺身而出。
  misconceptions:
    - 认为见义勇为就是“跟坏人正面搏斗”，不顾自身危险。
    - 说“未成年人不需要见义勇为，报警就行”，完全回避责任。
    - 把见义勇为等同于“讲义气、为朋友两肋插刀”，不辨是非。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:见贤思齐
  type: Concept
  subject: 道德与法治
  title: 见贤思齐
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 孔子说的"见贤思齐"，意思是见到有道德、有才能的人，就要想着向他学习、向他看齐。这样能不断进步。
  sourceRef: content/二年级/下册/道德与法治/PEP-2-2-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:规划
  type: Concept
  subject: 道德与法治
  title: 规划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把规划等同于简单的时间表，列出每天任务却从不想长远安排
    - 能指出并纠正这一错误：规划一旦定好就死板执行，不根据实际情况调整，如计划被打乱就全盘放弃
  aliases: []
  category: 方法
  explanation: 规划是对未来的事情作出事先的设计与安排，合理的规划帮助更好地度过初中阶段。
  misconceptions:
    - 把规划等同于简单的时间表，列出每天任务却从不想长远安排
    - 规划一旦定好就死板执行，不根据实际情况调整，如计划被打乱就全盘放弃
    - 认为规划只是书面文字，写下来就行了，不需要落实到具体行动中去
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:规则意识
  type: Concept
  subject: 道德与法治
  title: 规则意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得无人监督时就可以不守规则，比如没有监控就闯红灯
    - 能指出并纠正这一错误：认为规则意识就是胆小怕事，有规则意识就是不懂变通
  aliases: []
  category: 道德与法治
  explanation: 对规则心怀敬畏，知方圆、守规矩，提高按规则办事的自觉性。
  misconceptions:
    - 觉得无人监督时就可以不守规则，比如没有监控就闯红灯
    - 认为规则意识就是胆小怕事，有规则意识就是不懂变通
    - 将规则意识等同于害怕惩罚，而不是内心真正尊重规则
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:解决问题靠法
  type: Concept
  subject: 道德与法治
  title: 解决问题靠法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为以暴制暴是‘解决问题靠法’，如用打架讨公道，反成违法。
    - 能指出并纠正这一错误：把‘靠法’等同于必须去法院打官司，忽视协商、调解、仲裁等合法渠道。
  aliases: []
  category: 法律途径
  explanation: 通过合法方式表达诉求，运用法律途径解决矛盾纠纷，包括寻求法律救济、控告举报或提起诉讼。
  misconceptions:
    - 认为以暴制暴是‘解决问题靠法’，如用打架讨公道，反成违法。
    - 把‘靠法’等同于必须去法院打官司，忽视协商、调解、仲裁等合法渠道。
    - 遇纠纷先找能‘摆平’的人，而非寻求法律途径，认为关系比法管用。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:解放战争
  type: Concept
  subject: 道德与法治
  title: 解放战争
  conceptType: 概念型
  aliases:
    - 人民解放战争
  category: 概念
  explanation: 抗日战争胜利后，国民党悍然进攻解放区，挑起全面内战，人民解放军英勇应战。在人民群众的全力支持下，中国共产党领导人民军队推翻了国民党反动统治。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S4.md
- id: concept:道德与法治:计划生育基本国策
  type: Concept
  subject: 道德与法治
  title: 计划生育基本国策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为计划生育就是限制生育，看不到优生优育及生育政策动态调整。
    - 能指出并纠正这一错误：把放开三孩等同于取消计划生育基本国策，认为不必再坚持。
  aliases:
    - 生育政策
  category: 道德与法治
  explanation: 党和国家始终坚持人口与发展综合决策，及时优化生育政策，完善生育支持政策体系，促进人口长期均衡发展。
  misconceptions:
    - 认为计划生育就是限制生育，看不到优生优育及生育政策动态调整。
    - 把放开三孩等同于取消计划生育基本国策，认为不必再坚持。
    - 认为计划生育只是个人生育自由，与人口长期均衡发展无关。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:认同宪法
  type: Concept
  subject: 道德与法治
  title: 认同宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为认同宪法只是内心态度，与遵守行动无关。
    - 能指出并纠正这一错误：以为认同宪法意味着无条件支持一切宪法条款，反对修正。
  aliases: []
  category: 法律态度
  explanation: 认同宪法体现人民共同意志，保障人民民主权利，维护人民根本利益，让宪法精神在心中生根发芽。
  misconceptions:
    - 认为认同宪法只是内心态度，与遵守行动无关。
    - 以为认同宪法意味着无条件支持一切宪法条款，反对修正。
    - 将认同宪法视为公民义务，忽略它也是认同自身权利的体现。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:认真完成作业
  type: Concept
  subject: 道德与法治
  title: 认真完成作业
  conceptType: 概念型
  aliases:
    - 作业认真做
  category: 方法
  explanation: 作业要自己认真做，一笔一画写好，不马虎、不偷懒。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:认识校园场所
  type: Concept
  subject: 道德与法治
  title: 认识校园场所
  conceptType: 概念型
  aliases:
    - 校园探秘
    - 校园里的场所
  category: 文化常识
  explanation: 校园里有阅览室、科学教室、音乐教室、运动场等不同的地方，各有各的用处。熟悉这些场所，在校园里活动时要注意安全。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:认识自己的情绪
  type: Concept
  subject: 道德与法治
  title: 认识自己的情绪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只知道自己“烦”，说不清是愤怒、委屈还是难过，笼统说成“心里不舒服”
    - 能指出并纠正这一错误：把情绪归因于别人，比如“他惹我生气”，不找自己背后的需要
  aliases:
    - 觉察情绪
  category: 情绪管理
  explanation: 学会觉察自己的情绪，体会强弱和变化，明确情绪背后的真实需要和现实原因。
  misconceptions:
    - 只知道自己“烦”，说不清是愤怒、委屈还是难过，笼统说成“心里不舒服”
    - 把情绪归因于别人，比如“他惹我生气”，不找自己背后的需要
    - 情绪来得快去得快，不去体会变化，觉得认识自己情绪没必要
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:讲仁爱
  type: Concept
  subject: 道德与法治
  title: 讲仁爱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为仁爱要求“对所有人都一样好”，否定亲疏有别。
    - 能指出并纠正这一错误：说“爱家人就够了，不必爱陌生人”，缩小了仁爱的范围。
  aliases:
    - 仁爱
  category: 核心思想理念
  explanation: 要求爱亲人、爱他人、爱万物，由爱亲扩展到爱物。
  misconceptions:
    - 认为仁爱要求“对所有人都一样好”，否定亲疏有别。
    - 说“爱家人就够了，不必爱陌生人”，缩小了仁爱的范围。
    - 将讲仁爱等同于“无原则包容一切”，包括坏人恶行。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:讲好中国故事
  type: Concept
  subject: 道德与法治
  title: 讲好中国故事
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只讲中国好的一面，回避问题，认为这样才叫展现中国风貌
    - 能指出并纠正这一错误：认为讲中国故事要迎合外国人口味，放弃中国特色
  aliases:
    - 传播中国声音
  category: 道德与法治
  explanation: 要尊重差异、理解不同、包容多样文化，向国际社会讲好中国故事、传播好中国声音、阐发中国精神、展现中国风貌。
  misconceptions:
    - 只讲中国好的一面，回避问题，认为这样才叫展现中国风貌
    - 认为讲中国故事要迎合外国人口味，放弃中国特色
    - 觉得只要自己做好就行，不需要主动向国际社会传播中国声音
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:识别欺负行为
  type: Concept
  subject: 道德与法治
  title: 识别欺负行为
  conceptType: 概念型
  aliases:
    - 欺负的表现
  category: 概念
  explanation: 故意打、推、撞同学，辱骂取笑，起侮辱性外号，捉弄同学、损坏他人物品，排挤同学等，都是欺负行为。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:诉讼
  type: Concept
  subject: 道德与法治
  title: 诉讼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把仲裁和调解当作诉讼，以为在仲裁委解决纠纷也叫诉讼，实际诉讼专指法院活动。
    - 能指出并纠正这一错误：认为刑事诉讼只是老百姓去法院告状，没分清检察院公诉和自诉的区别。
  aliases:
    - 打官司
  category: 法律程序
  explanation: 诉讼是人民法院在当事人和其他诉讼参与人参加下解决纠纷的活动，分为民事诉讼、行政诉讼和刑事诉讼三种类型。
  misconceptions:
    - 把仲裁和调解当作诉讼，以为在仲裁委解决纠纷也叫诉讼，实际诉讼专指法院活动。
    - 认为刑事诉讼只是老百姓去法院告状，没分清检察院公诉和自诉的区别。
    - 看到‘打官司’就认为是诉讼，但到公安机关报案立案属于刑事程序，不是诉讼。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:诉讼的类型
  type: Concept
  subject: 道德与法治
  title: 诉讼的类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“欠钱不还”的民事纠纷当成刑事诉讼，认为上法院就是刑事官司。
    - 能指出并纠正这一错误：以为“民告官”属于民事诉讼，实际是行政诉讼，混同了被告身份。
  aliases: []
  category: 法律常识
  explanation: 诉讼分为刑事诉讼、民事诉讼和行政诉讼，分别处理刑事案件、民事纠纷和行政争议。
  misconceptions:
    - 把“欠钱不还”的民事纠纷当成刑事诉讼，认为上法院就是刑事官司。
    - 以为“民告官”属于民事诉讼，实际是行政诉讼，混同了被告身份。
    - 将刑事自诉案件看作民事纠纷，误以为自诉只涉及赔偿。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:诚信
  type: Concept
  subject: 道德与法治
  title: 诚信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为诚信就是不说谎，但夸大其词、隐瞒关键信息不算失信
    - 能指出并纠正这一错误：认为抄作业、迟到撒谎只是小事，不影响诚信品质
  aliases:
    - 诚实守信
  category: 道德规范
  explanation: 诚信是言行一致、表里如一、信守承诺，是中华民族传统美德，也是社会主义核心价值观的重要内容。
  misconceptions:
    - 认为诚信就是不说谎，但夸大其词、隐瞒关键信息不算失信
    - 认为抄作业、迟到撒谎只是小事，不影响诚信品质
    - 认为诚信就是有问必答，把他人隐私也如实相告
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:诚信原则
  type: Concept
  subject: 道德与法治
  title: 诚信原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将诚信原则等同于道德诚信，忽视其作为民法基本原则的法律约束力
    - 能指出并纠正这一错误：认为诚信原则只规范合同签订，合同履行和权利行使时无需遵守
  aliases:
    - 诚实信用原则
  category: 法律原则
  explanation: 诚信原则是我国民法的一项基本原则，要求民事主体在行使权利、履行义务过程中讲诚实、重诺言、守信用。
  misconceptions:
    - 将诚信原则等同于道德诚信，忽视其作为民法基本原则的法律约束力
    - 认为诚信原则只规范合同签订，合同履行和权利行使时无需遵守
    - 认为只要不违反法律明文规定，就可以利用规则漏洞损害他人利益
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:诚信策略
  type: Concept
  subject: 道德与法治
  title: 诚信策略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为诚信策略就是可以撒谎，只要出发点是好的，隐瞒实情也不算不诚信。
    - 能指出并纠正这一错误：在复杂情境中只想着不伤害别人，就放弃诚信，编造谎言来“照顾对方感受”。
  aliases:
    - 诚信的智慧
  category: 道德品质
  explanation: 在复杂社会情境中，诚信需要讲究策略，权衡利弊，遵循道德原则和法律要求，做到既为他人着想又恪守诚信。
  misconceptions:
    - 认为诚信策略就是可以撒谎，只要出发点是好的，隐瞒实情也不算不诚信。
    - 在复杂情境中只想着不伤害别人，就放弃诚信，编造谎言来“照顾对方感受”。
    - 把诚信策略等同于见风使舵，认为对自己有利时讲诚信，不利时就可以变通。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:诚实
  type: Concept
  subject: 道德与法治
  title: 诚实
  conceptType: 概念型
  aliases:
    - 诚实与说谎
  category: 观点
  explanation: 诚实是做人的根本，是中华民族的传统美德。说谎常常是因为恐惧、胆怯或虚荣，会伤害别人对我们的信任。
  sourceRef: content/三年级/下册/道德与法治/PEP-3-2-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:说到做到的方法
  type: Concept
  subject: 道德与法治
  title: 说到做到的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 做出保证后要想办法尽力完成。面对诱惑要学会克制，容易忘记的事可以记下来提醒自己，遇到困难不轻易放弃。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:课前准备
  type: Concept
  subject: 道德与法治
  title: 课前准备
  conceptType: 程序型
  aliases:
    - 课前准备好
  category: 方法
  explanation: 上课前先看看课程表，知道下节是什么课，提前把书本和学习用品准备好。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:课间安全活动
  type: Concept
  subject: 道德与法治
  title: 课间安全活动
  conceptType: 程序型
  aliases:
    - 课间活动安排好
  category: 方法
  explanation: 下课铃响后，先望望远、放松大脑，再去玩简单、安全的游戏。游戏结束后要按时回教室上课。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:调查家乡发展的方法
  type: Concept
  subject: 道德与法治
  title: 调查家乡发展的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 可以用收集材料、观察、采访家人、实地参观等方式，了解家乡在生活设施、教育、医疗等方面的变化，还可以登录政府网站收集信息。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:调解
  type: Concept
  subject: 道德与法治
  title: 调解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为调解必须由人民法院进行，人民调解没有法律效力。
    - 能指出并纠正这一错误：将调解与和解混为一谈，认为二者都是由当事人自行协商解决。
  aliases: []
  category: 法律概念
  explanation: 通过调解组织疏导劝说，促使当事人自愿达成协议解决纠纷。
  misconceptions:
    - 认为调解必须由人民法院进行，人民调解没有法律效力。
    - 将调解与和解混为一谈，认为二者都是由当事人自行协商解决。
    - 认为调解协议具有强制执行力，一方不履行可直接申请法院执行。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:负责任大国
  type: Concept
  subject: 道德与法治
  title: 负责任大国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为负责任大国就是对所有国际事务都无条件包揽责任
    - 能指出并纠正这一错误：把负责任大国等同于中国已取代美国、世界唯我独尊
  aliases: []
  category: 国家形象
  explanation: 中国在国际事务中承担相应责任，发挥建设性作用，树立负责任的大国形象。
  misconceptions:
    - 认为负责任大国就是对所有国际事务都无条件包揽责任
    - 把负责任大国等同于中国已取代美国、世界唯我独尊
    - 认为国际责任只需国家领导层承担，普通公民毫无关系
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:责任
  type: Concept
  subject: 道德与法治
  title: 责任
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把责任等同于法律义务，认为未违法就没有尽到责任，如不孝敬父母但没犯法。
    - 能指出并纠正这一错误：认为只有承诺过的事才是责任，分内职责如值日打扫不认真也不算失责。
  aliases: []
  category: 道德与法治
  explanation: 责任是一个人分内应该做的事情。积极履行对他人的承诺，认真完成社会实践任务，遵守道德和法律等都是承担社会责任的表现。
  misconceptions:
    - 把责任等同于法律义务，认为未违法就没有尽到责任，如不孝敬父母但没犯法。
    - 认为只有承诺过的事才是责任，分内职责如值日打扫不认真也不算失责。
    - 认为遵守道德规范不是承担责任，如在公共场所大声喧哗觉得不违法就没事。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C3/sections/S4.md
- id: concept:道德与法治:贫困问题
  type: Concept
  subject: 道德与法治
  title: 贫困问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为贫困问题纯粹是经济问题，不会引发饥饿、疾病和社会动荡
    - 能指出并纠正这一错误：将贫困问题完全归因于发展中国家自身懒惰，忽略历史与外部因素
  aliases: []
  category: 社会
  explanation: 世界经济发展不平衡导致发达国家与发展中国家差距大，贫困衍生饥饿、疾病、社会动荡等问题。
  misconceptions:
    - 认为贫困问题纯粹是经济问题，不会引发饥饿、疾病和社会动荡
    - 将贫困问题完全归因于发展中国家自身懒惰，忽略历史与外部因素
    - 误以为消除贫困只需直接给钱，不需要发展能力等综合措施
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:资源环境问题
  type: Concept
  subject: 道德与法治
  title: 资源环境问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看到资源短缺，忽视环境污染和生态退化，如认为节约资源就能解决一切环境问题。
    - 能指出并纠正这一错误：认为我国资源总量大就不存在资源问题，忽略人均资源少的现实。
  aliases:
    - 资源问题
    - 环境问题
  category: 道德与法治
  explanation: 我国资源日益短缺，环境污染严重，生态系统退化，经济发展与资源、环境之间的矛盾日益突出，已经成为我国经济社会发展必须面对的严峻挑战。
  misconceptions:
    - 只看到资源短缺，忽视环境污染和生态退化，如认为节约资源就能解决一切环境问题。
    - 认为我国资源总量大就不存在资源问题，忽略人均资源少的现实。
    - 把资源环境问题看作经济发展必然代价，认为无法通过人为改变。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:走向世界的中国青少年
  type: Concept
  subject: 道德与法治
  title: 走向世界的中国青少年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为走向世界就是出国旅游或留学，在国内生活不算
    - 能指出并纠正这一错误：觉得青少年只需学好课本，关注世界局势是科学家的事
  aliases:
    - 中国青年与世界
  category: 道德与法治
  explanation: 走向世界的中国青少年需要了解人类文明进程，关切人类问题和世界局势，掌握相应知识，提升影响力，同时要有忧患意识。
  misconceptions:
    - 认为走向世界就是出国旅游或留学，在国内生活不算
    - 觉得青少年只需学好课本，关注世界局势是科学家的事
    - 认为忧患意识会让人悲观，不如只看美好一面
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:走向世界的形式
  type: Concept
  subject: 道德与法治
  title: 走向世界的形式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有亲身出国才算走向世界，网上交流不算
    - 能指出并纠正这一错误：觉得旅游只是游玩，不需珍视经历或建立协作关系
  aliases:
    - 走向世界的途径
  category: 道德与法治
  explanation: 我们走向世界的形式是多样的，包括旅游、交往、学习等，在走向世界的过程中要珍视交往经历，建立协作关系。
  misconceptions:
    - 认为只有亲身出国才算走向世界，网上交流不算
    - 觉得旅游只是游玩，不需珍视经历或建立协作关系
    - 认为走向世界只有一种固定模式，必须留学或工作
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:践行宪法
  type: Concept
  subject: 道德与法治
  title: 践行宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有违宪行为才需要抵制，平时无需践行宪法。
    - 能指出并纠正这一错误：以为践行宪法是成年人或公务员的事，学生无责。
  aliases: []
  category: 法律实践
  explanation: 严格遵守宪法和法律规定，运用宪法分析和解决实际问题，抵制损害宪法尊严的行为。
  misconceptions:
    - 认为只有违宪行为才需要抵制，平时无需践行宪法。
    - 以为践行宪法是成年人或公务员的事，学生无责。
    - 将践行宪法等同于遵守普通法律，忽略宪法根本性要求。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:身上的家人影子
  type: Concept
  subject: 道德与法治
  title: 身上的家人影子
  conceptType: 概念型
  aliases:
    - 家人的影子
  category: 现象
  explanation: 我们的长相、爱好常常和家人很像，像家人的影子；但每个人也有和别人不一样的地方。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:转变发展方式
  type: Concept
  subject: 道德与法治
  title: 转变发展方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把转变发展方式等同于‘不发展’或‘减慢发展’，如认为保护环境就要停止开采资源。
    - 能指出并纠正这一错误：认为转变发展方式只是政府或企业的事，与普通公民的消费方式和生活习惯无关。
  aliases: []
  category: 发展理念
  explanation: 通过转变发展方式解决经济社会发展中出现的人口、资源、环境问题。
  misconceptions:
    - 把转变发展方式等同于‘不发展’或‘减慢发展’，如认为保护环境就要停止开采资源。
    - 认为转变发展方式只是政府或企业的事，与普通公民的消费方式和生活习惯无关。
    - 以为转变发展方式就是简单调整产业结构，未涉及生产生活方式整体转型。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:辛亥革命
  type: Concept
  subject: 道德与法治
  title: 辛亥革命
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 1911 年（农历辛亥年）以孙中山为首的革命党人领导的革命。武昌起义后全国各地纷纷响应，推翻了清朝的统治。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:辛亥革命的历史意义
  type: Concept
  subject: 道德与法治
  title: 辛亥革命的历史意义
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 辛亥革命推翻了两千多年的君主专制制度，使民主共和观念渐入人心；但没有改变半殖民地半封建的社会性质。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:辨别网络谣言的方法
  type: Concept
  subject: 道德与法治
  title: 辨别网络谣言的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：看到朋友圈转发的‘紧急通知’不核实就立刻转发。
    - 能指出并纠正这一错误：认为阅读量高的消息一定是真的，不需要验证。
  aliases:
    - 识别谣言
  category: 道德与法治
  explanation: 包括注意信息出处、关注官方信息、对信息进行多方验证、辨识信息内容、向他人求助等方法。
  misconceptions:
    - 看到朋友圈转发的‘紧急通知’不核实就立刻转发。
    - 认为阅读量高的消息一定是真的，不需要验证。
    - 把所有官方未发布的信息都当成谣言，一概不信。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S7.md
- id: concept:道德与法治:过度消费的危害
  type: Concept
  subject: 道德与法治
  title: 过度消费的危害
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 过度消费不仅会增加家庭负担，还会造成资源浪费，不利于从小养成良好的消费习惯。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:过度维护自己
  type: Concept
  subject: 道德与法治
  title: 过度维护自己
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 过于爱面子、输不起、说不得，就是过度维护自己。维护自己要适度：不过分敏感，客观评价自己，理性对待他人意见。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:过程与结果
  type: Concept
  subject: 道德与法治
  title: 过程与结果
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要结果好，过程无所谓，失败的过程没价值
    - 能指出并纠正这一错误：追求目标时只看结果，忽略过程中的收获和感悟
  aliases: []
  category: 人生哲理
  explanation: 追求目标时，过程中的体验和感悟比结果更重要，是宝贵的人生财富。
  misconceptions:
    - 认为只要结果好，过程无所谓，失败的过程没价值
    - 追求目标时只看结果，忽略过程中的收获和感悟
    - 认为只有成功的过程有意义，失败的过程全是浪费
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:过罚相当原则
  type: Concept
  subject: 道德与法治
  title: 过罚相当原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为处罚越重越能体现执法严明，无视过罚相当原则。
    - 能指出并纠正这一错误：误以为同一违法行为必须相同处罚，忽略情节轻重导致畸轻畸重。
  aliases:
    - 过罚相当
  category: 法律原则
  explanation: 行政处罚应当与违法行为的事实、性质、情节以及社会危害程度相当，避免畸轻畸重。
  misconceptions:
    - 认为处罚越重越能体现执法严明，无视过罚相当原则。
    - 误以为同一违法行为必须相同处罚，忽略情节轻重导致畸轻畸重。
    - 认为只要违法就必须顶格处罚，不考虑事实和危害程度。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S2.md
- id: concept:道德与法治:近期目标和长远目标
  type: Concept
  subject: 道德与法治
  title: 近期目标和长远目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把近期目标当作独立目标，每个都换方向，导致长远目标落空
    - 能指出并纠正这一错误：只定长远目标，不分解成可操作的近期目标，结果无从下手
  aliases:
    - 短期目标
    - 长期目标
  category: 道德与法治
  explanation: 人生目标分为近期目标和长远目标，所有近期目标都应围绕长远目标展开，分阶段实现近期目标才能实现长远目标。
  misconceptions:
    - 把近期目标当作独立目标，每个都换方向，导致长远目标落空
    - 只定长远目标，不分解成可操作的近期目标，结果无从下手
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:违反义务的法律责任
  type: Concept
  subject: 道德与法治
  title: 违反义务的法律责任
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为任何违法行为都会构成犯罪，必须承担刑事责任。
    - 能指出并纠正这一错误：认为未成年人违法不用承担任何法律责任，可逃避处罚。
  aliases: []
  category: 法律概念
  explanation: 违反法律需承担民事责任、行政责任或刑事责任。
  misconceptions:
    - 认为任何违法行为都会构成犯罪，必须承担刑事责任。
    - 认为未成年人违法不用承担任何法律责任，可逃避处罚。
    - 把民事责任等同于行政责任，如认为罚款就是民事赔偿。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:违法行为的种类
  type: Concept
  subject: 道德与法治
  title: 违法行为的种类
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 违法行为包括民事违法行为、行政违法行为和刑事违法行为。违反法律规定，都要依法承担相应的法律责任。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:连续性
  type: Concept
  subject: 道德与法治
  title: 连续性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中华文明连续性指“从未中断”，但忽视了历史上曾有分裂。
    - 能指出并纠正这一错误：说“连续就是不变”，错以为中华文化几千年没有发展变化。
  aliases: []
  category: 文明特性
  explanation: 中华文明几千年连贯发展，如汉字与甲骨文的延续、先哲观念的传承。
  misconceptions:
    - 认为中华文明连续性指“从未中断”，但忽视了历史上曾有分裂。
    - 说“连续就是不变”，错以为中华文化几千年没有发展变化。
    - 把汉字延续理解为“每个字写法从来不变”，否认演变事实。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:适应家庭变化
  type: Concept
  subject: 道德与法治
  title: 适应家庭变化
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 家庭会出现长辈同住、父母外出打工等变化，全家人都需要时间适应。相互理解与帮助，一句关心、一份体贴都是对家人的支持。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:选举权和被选举权
  type: Concept
  subject: 道德与法治
  title: 选举权和被选举权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要年满18周岁的中国公民都有选举权，忽略被剥夺政治权利的情形。
    - 能指出并纠正这一错误：认为在校学生没有选举权和被选举权。
  aliases: []
  category: 法律概念
  explanation: 选举权和被选举权是公民参与管理国家和社会事务的基础。我国年满十八周岁的公民，不分民族、种族、性别、职业等，都有选举权和被选举权，但依法被剥夺政治权利的人除外。
  misconceptions:
    - 认为只要年满18周岁的中国公民都有选举权，忽略被剥夺政治权利的情形。
    - 认为在校学生没有选举权和被选举权。
    - 把选举权和被选举权混为一谈，认为参加选举就是行使被选举权。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:选举民主
  type: Concept
  subject: 道德与法治
  title: 选举民主
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把选举民主等同于民主的全部，认为不搞选举就不是民主。
    - 能指出并纠正这一错误：认为选举民主就是人民群众直接参与所有决策，忽略代议制。
  aliases:
    - 票决民主
  category: 民主形式
  explanation: 选举民主是人民通过选举、投票行使权利的民主形式。
  misconceptions:
    - 把选举民主等同于民主的全部，认为不搞选举就不是民主。
    - 认为选举民主就是人民群众直接参与所有决策，忽略代议制。
    - 混淆选举民主与协商民主，认为两者一样，没有区别。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:遇事找法
  type: Concept
  subject: 道德与法治
  title: 遇事找法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：遇到侵权自行上网搜法条断章取义，不咨询专业人士，如误以为‘假一赔十’适用所有商品。
    - 能指出并纠正这一错误：认为‘遇事找法’必须请律师，忽视法律援助、法律咨询热线等免费帮助。
  aliases: []
  category: 法律意识
  explanation: 遇到法律问题或权益受侵害时，主动咨询专业人士，利用法律服务机构获得帮助。
  misconceptions:
    - 遇到侵权自行上网搜法条断章取义，不咨询专业人士，如误以为‘假一赔十’适用所有商品。
    - 认为‘遇事找法’必须请律师，忽视法律援助、法律咨询热线等免费帮助。
    - 把找关系走后门当成‘找法’，如托熟人向法官递材料，反而不合法。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:遇到困难不慌
  type: Concept
  subject: 道德与法治
  title: 遇到困难不慌
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 困难人人都会有，遇到困难不要慌。小困难可以自己解决，大事情要请人帮忙，不能总依赖别人。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:道德
  type: Concept
  subject: 道德与法治
  title: 道德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为道德靠国家强制力保证实施，与法律一样
    - 能指出并纠正这一错误：觉得道德只关乎个人修养，不是一种社会规则
  aliases: []
  category: 道德与法治
  explanation: 道德是调节人们行为的一种主要社会规则，依靠社会舆论、传统习惯和内心信念来维持。
  misconceptions:
    - 误认为道德靠国家强制力保证实施，与法律一样
    - 觉得道德只关乎个人修养，不是一种社会规则
    - 把“不得偷窃”视为法律要求，否认其也是道德要求
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:道德和法律是两种主要社会规则
  type: Concept
  subject: 道德与法治
  title: 道德和法律是两种主要社会规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将道德和法律维系手段互换：认为法律靠舆论，道德靠强制
    - 能指出并纠正这一错误：以为违反道德就要受法律制裁，混淆两者界限
  aliases: []
  category: 道德与法治
  explanation: 道德和法律是调节人们行为的两种主要社会规则，道德靠舆论和内心信念维系，法律靠国家强制力保证实施。
  misconceptions:
    - 将道德和法律维系手段互换：认为法律靠舆论，道德靠强制
    - 以为违反道德就要受法律制裁，混淆两者界限
    - 认为法律比道德重要，因此道德可以遵守也可以不遵守
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C2/sections/S1.md
- id: concept:道德与法治:道德文章
  type: Concept
  subject: 道德与法治
  title: 道德文章
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“道德文章”是一种专门写道德说教的文章体裁。
    - 能指出并纠正这一错误：说“只要背诵经典就能有道德”，忽视实践行动的重要性。
  aliases: []
  category: 文化传统
  explanation: 中国人自古就有“道德文章”的说法，强调通过阅读经典涵养品德。
  misconceptions:
    - 认为“道德文章”是一种专门写道德说教的文章体裁。
    - 说“只要背诵经典就能有道德”，忽视实践行动的重要性。
    - 将道德与文章割裂，认为写文章好就行，不在乎品德。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S6.md
- id: concept:道德与法治:道法自然、天人合一
  type: Concept
  subject: 道德与法治
  title: 道法自然、天人合一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“道法自然”就是“人只能顺应自然，不能改造自然”。
    - 能指出并纠正这一错误：把“天人合一”等同于“听天由命”，放弃人的主观努力。
  aliases:
    - 天人合一
    - 道法自然
  category: 思想理念
  explanation: 主张尊重、顺应自然规律，与天地万物和谐共生的思想，强调人与自然是一个生命共同体。
  misconceptions:
    - 认为“道法自然”就是“人只能顺应自然，不能改造自然”。
    - 把“天人合一”等同于“听天由命”，放弃人的主观努力。
    - 说“人与自然一体就是不能开发利用自然资源”。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:遵义会议
  type: Concept
  subject: 道德与法治
  title: 遵义会议
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 1935年1月党中央在长征途中召开的会议，确立了以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位。它是党的历史上一个生死攸关的转折点。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:遵守交通规则
  type: Concept
  subject: 道德与法治
  title: 遵守交通规则
  conceptType: 概念型
  aliases:
    - 交通安全
    - 平安出行
  category: 方法
  explanation: 步行要走人行横道、不斜穿猛跑，乘车系好安全带、不把头手伸出窗外。酒后开车非常危险而且违法，一定要劝阻。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:遵守宪法和法律
  type: Concept
  subject: 道德与法治
  title: 遵守宪法和法律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遵守宪法和法律就是不违法犯罪，与日常道德和公共秩序无关。
    - 能指出并纠正这一错误：认为宪法只是根本法，与普通公民的日常生活没有直接关系。
  aliases: []
  category: 法律概念
  explanation: 遵守宪法和法律是公民对国家和社会应尽的责任。公民必须遵守宪法和法律，保守国家秘密，爱护公共财产，遵守劳动纪律，遵守公共秩序，尊重社会公德。
  misconceptions:
    - 认为遵守宪法和法律就是不违法犯罪，与日常道德和公共秩序无关。
    - 认为宪法只是根本法，与普通公民的日常生活没有直接关系。
    - 认为爱护公共财产、遵守公共秩序属于道德要求，不是法律义务。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:遵守班级共同决定
  type: Concept
  subject: 道德与法治
  title: 遵守班级共同决定
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 班级成员集体形成的最终决定在班级中具有约束力，每个成员都要遵守共同决定，并落实到行动中。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:避免浪费的做法
  type: Concept
  subject: 道德与法治
  title: 避免浪费的做法
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 要树立正确的消费观念，做到合理规划、物尽其用，比如按需做饭、按需点餐，保质期短的食品不一次性买太多。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C4/sections/S3.md
- id: concept:道德与法治:邓小平理论
  type: Concept
  subject: 道德与法治
  title: 邓小平理论
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 党的十一届三中全会以后，围绕什么是社会主义、怎样建设社会主义这一根本问题创立的理论，是党领导改革开放实践的理论结晶。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:重大执法决定法制审核制度
  type: Concept
  subject: 道德与法治
  title: 重大执法决定法制审核制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为重大执法决定法制审核是法院的职责，与执法机关无关。
    - 能指出并纠正这一错误：觉得所有执法决定都需要进行法制审核，扩大审核范围。
  aliases:
    - 法制审核制度
  category: 行政法制度
  explanation: 作出重大执法决定前，要严格进行法制审核，未经法制审核或者审核未通过的，不得作出决定。
  misconceptions:
    - 认为重大执法决定法制审核是法院的职责，与执法机关无关。
    - 觉得所有执法决定都需要进行法制审核，扩大审核范围。
    - 把法制审核与合法性审查混为一谈，认为审核只是走形式。
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:重民本
  type: Concept
  subject: 道德与法治
  title: 重民本
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“民本”等同于西方“民主”概念，混同两种思想。
    - 能指出并纠正这一错误：说“民本思想就是官员必须听命于老百姓”，误解责任主体。
  aliases:
    - 民本
  category: 核心思想理念
  explanation: 强调人民是国家根本，要爱民保民利民，赢得人民支持。
  misconceptions:
    - 将“民本”等同于西方“民主”概念，混同两种思想。
    - 说“民本思想就是官员必须听命于老百姓”，误解责任主体。
    - 认为重民本只是古代统治术，与今天党和政府无关。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:重阳节
  type: Concept
  subject: 道德与法治
  title: 重阳节
  conceptType: 概念型
  aliases:
    - 敬老节
  category: 文化常识
  explanation: 农历九月初九是重阳节，因为我们要敬老，也叫敬老节。人们登高、赏菊、做重阳糕。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:防御自然灾害
  type: Concept
  subject: 道德与法治
  title: 防御自然灾害
  conceptType: 概念型
  aliases:
    - 防灾减灾
  category: 方法
  explanation: 要具备防灾避险的意识，掌握自救自护的知识和能力。我国还建立了灾害监测预警系统、防灾减灾工程，并用法律约束人们的行为来减轻灾害。
  sourceRef: content/六年级/下册/道德与法治/PEP-6-2-Politics/chapters/C2/sections/S2.md
- id: concept:道德与法治:防拐防骗的方法
  type: Concept
  subject: 道德与法治
  title: 防拐防骗的方法
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 不轻信陌生人，熟记家人信息，外出征得家人同意并结伴而行。遭遇拐骗时找时机向警察、保安或周围的人求助，尽可能记住坏人特征。
  sourceRef: content/四年级/上册/道德与法治/PEP-4-1-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:防溺水安全
  type: Concept
  subject: 道德与法治
  title: 防溺水安全
  conceptType: 应用型
  aliases:
    - 预防溺水
  category: 方法
  explanation: 不到陌生的水域游泳，游泳前做好热身。发现有人溺水不要贸然下水营救，要大声呼救，或把救生圈、木板等抛给溺水者。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S4.md
- id: concept:道德与法治:集体生活成就我
  type: Concept
  subject: 道德与法治
  title: 集体生活成就我
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得参加集体活动是浪费时间，只埋头学习，错失在集体中锻炼交往能力的机会。
    - 能指出并纠正这一错误：认为集体生活束缚个性，忽视自己在集体中能学会合作、责任和包容。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 觉得参加集体活动是浪费时间，只埋头学习，错失在集体中锻炼交往能力的机会。
    - 认为集体生活束缚个性，忽视自己在集体中能学会合作、责任和包容。
    - 把集体荣誉的取得全部归功于自己，不认可其他同学的付出和老师指导。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S7.md
- id: concept:道德与法治:集体经济
  type: Concept
  subject: 道德与法治
  title: 集体经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将集体经济与国有经济混为一谈，认为都是国家所有。
    - 能指出并纠正这一错误：误以为集体经济的生产资料归集体内每个成员个人私有，可以随意分割。
  aliases: []
  category: 经济成分
  explanation: 公有制经济的重要组成部分，生产资料属于一部分劳动者共同所有。
  misconceptions:
    - 将集体经济与国有经济混为一谈，认为都是国家所有。
    - 误以为集体经济的生产资料归集体内每个成员个人私有，可以随意分割。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:雷锋精神
  type: Concept
  subject: 道德与法治
  title: 雷锋精神
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 雷锋是一位热心助人的解放军战士，是一代又一代人学习的好榜样。我们要弘扬雷锋精神，用爱心贡献社会。
  sourceRef: content/三年级/上册/道德与法治/PEP-3-1-Politics/chapters/C4/sections/S2.md
- id: concept:道德与法治:青少年的责任
  type: Concept
  subject: 道德与法治
  title: 青少年的责任
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为青少年尚未长大，没有责任，责任是成年人的事
    - 能指出并纠正这一错误：觉得自己的责任就是学习考好，不必关心国家和社会
  aliases:
    - 时代责任
  category: 道德与法治
  explanation: 青少年的责任是时代赋予的，不同历史时期有不同的责任，每一代青少年都要在自己所处的时代条件下谋划人生、创造历史。
  misconceptions:
    - 认为青少年尚未长大，没有责任，责任是成年人的事
    - 觉得自己的责任就是学习考好，不必关心国家和社会
    - 认为时代赋予的责任是空话，与自己无关
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:青春期
  type: Concept
  subject: 道德与法治
  title: 青春期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为青春期只是身体长高变壮，忽视心理和情感上的剧烈波动
    - 能指出并纠正这一错误：把青春期等同于叛逆期，觉得所有同龄人都会与父母激烈对抗
  aliases:
    - 青春期
  category: 生理与心理发展
  explanation: 青春期是身体发育和心理发展的加速期，是从童年走向成年的过渡阶段，也是心理“断乳期”。
  misconceptions:
    - 认为青春期只是身体长高变壮，忽视心理和情感上的剧烈波动
    - 把青春期等同于叛逆期，觉得所有同龄人都会与父母激烈对抗
    - 觉得青春期是大人了，不该再有幼稚想法，否则就是没长大
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:青春期心理变化
  type: Concept
  subject: 道德与法治
  title: 青春期心理变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将心理变化全归为负面，比如情绪波动大就觉得自己心理有问题
    - 能指出并纠正这一错误：认为认知能力提高等于什么都懂，听不进老师和家长的建议
  aliases:
    - 心理变化
  category: 心理发展
  explanation: 青春期心理变化包括认知能力提高、自我意识增强、情感世界丰富等，并表现出矛盾性。
  misconceptions:
    - 将心理变化全归为负面，比如情绪波动大就觉得自己心理有问题
    - 认为认知能力提高等于什么都懂，听不进老师和家长的建议
    - 把自我意识增强理解为凡事都要按自己意思来，否则就觉得被轻视
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:青春期心理矛盾
  type: Concept
  subject: 道德与法治
  title: 青春期心理矛盾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得心理矛盾是精神疾病，想赶紧摆脱而不是积极调节
    - 能指出并纠正这一错误：把独立与依赖的矛盾理解为彻底反抗父母，不做任何沟通
  aliases:
    - 心理矛盾
    - 青春期矛盾
  category: 心理发展
  explanation: 青春期心理矛盾表现为独立与依赖、闭锁与开放、勇敢与怯懦等，需要积极面对和调节。
  misconceptions:
    - 觉得心理矛盾是精神疾病，想赶紧摆脱而不是积极调节
    - 把独立与依赖的矛盾理解为彻底反抗父母，不做任何沟通
    - 认为勇敢与怯懦的矛盾说明自己胆小，否定自身成长中的正常波动
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:青春期生理变化
  type: Concept
  subject: 道德与法治
  title: 青春期生理变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生理变化只发生在男生或只发生在女生身上，忽视异性也有变化
    - 能指出并纠正这一错误：把长痘痘、声音变粗等正常现象当成生病，乱用药或过度焦虑
  aliases:
    - 生理变化
  category: 生理发展
  explanation: 青春期生理变化主要表现在身体外形的变化、体内机能的增强、性的发育和成熟。
  misconceptions:
    - 认为生理变化只发生在男生或只发生在女生身上，忽视异性也有变化
    - 把长痘痘、声音变粗等正常现象当成生病，乱用药或过度焦虑
    - 觉得生理变化是丢人的事，故意含胸驼背或嘲笑别人来掩盖不自在
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:非公有制经济
  type: Concept
  subject: 道德与法治
  title: 非公有制经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为非公有制经济不是社会主义市场经济的组成部分，将其排除在外。
    - 能指出并纠正这一错误：把非公有制经济说成社会主义性质的经济，混淆性质判断。
  aliases:
    - 非公有制
  category: 经济制度
  explanation: 指生产资料归私人或外商所有的经济形式，包括个体经济、私营经济、外资经济等，是社会主义市场经济的重要组成部分。
  misconceptions:
    - 误认为非公有制经济不是社会主义市场经济的组成部分，将其排除在外。
    - 把非公有制经济说成社会主义性质的经济，混淆性质判断。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:非故意首次违法轻罚、免罚
  type: Concept
  subject: 道德与法治
  title: 非故意首次违法轻罚、免罚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“首次违法”就能免罚，忽略“非故意”和“情节较轻”条件。
    - 能指出并纠正这一错误：认为非故意首次违法一律免除处罚，对严重情节也免罚。
  aliases:
    - 首违不罚
  category: 法律原则
  explanation: 对于非故意且首次违法的行为，根据情节可以给予从轻或免除处罚，体现执法温度。
  misconceptions:
    - 误以为“首次违法”就能免罚，忽略“非故意”和“情节较轻”条件。
    - 认为非故意首次违法一律免除处罚，对严重情节也免罚。
    - 把故意违法说成“非故意”，想以此获得从轻处理。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C5/sections/S2.md
- id: concept:道德与法治:面对不同风格的老师
  type: Concept
  subject: 道德与法治
  title: 面对不同风格的老师
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：只喜欢讲课幽默的老师，认为严肃古板的老师不好，就不好好听他的课。
    - 能指出并纠正这一错误：遇到不同风格的老师，要求老师改变来适应自己，否则就不配合学习。
  aliases:
    - 不同风格的老师
  category: 道德与法治
  explanation: 应主动交往、理解初衷、多角度了解，承认差别，发现优点。
  misconceptions:
    - 只喜欢讲课幽默的老师，认为严肃古板的老师不好，就不好好听他的课。
    - 遇到不同风格的老师，要求老师改变来适应自己，否则就不配合学习。
    - 将老师风格差异理解为老师不喜欢自己，故意用高标准要求自己，产生抵触情绪。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:革命烈士的奉献精神
  type: Concept
  subject: 道德与法治
  title: 革命烈士的奉献精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为奉献精神就是“不惜一切牺牲生命”，忽视理性选择。
    - 能指出并纠正这一错误：说“和平年代不需要奉献精神”，否定其时代价值。
  aliases:
    - 烈士精神
  category: 道德品质
  explanation: 如林觉民、方志敏等革命烈士，将个人幸福与国家命运相连，体现了高尚的道德情操。
  misconceptions:
    - 认为奉献精神就是“不惜一切牺牲生命”，忽视理性选择。
    - 说“和平年代不需要奉献精神”，否定其时代价值。
    - 把烈士的奉献等同于“盲目牺牲”，不理解其理想信念。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:革故鼎新、与时俱进
  type: Concept
  subject: 道德与法治
  title: 革故鼎新、与时俱进
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“革故鼎新”就是彻底否定过去，把传统道德一概视为“糟粕”而抛弃。
    - 能指出并纠正这一错误：把“与时俱进”等同于标新立异，认为凡新出现的事物都必须跟随模仿。
  aliases:
    - 革故鼎新
    - 与时俱进
  category: 思想理念
  explanation: 认为万物变化不息，主张顺应时代潮流，不断创造与创新。
  misconceptions:
    - 认为“革故鼎新”就是彻底否定过去，把传统道德一概视为“糟粕”而抛弃。
    - 把“与时俱进”等同于标新立异，认为凡新出现的事物都必须跟随模仿。
    - 认为凡是“新”的东西都值得提倡，甚至给网络谣言贴上“创新”的标签。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:顺境和逆境
  type: Concept
  subject: 道德与法治
  title: 顺境和逆境
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为顺境只有好处，逆境只有坏处，忽视境遇的双重作用
    - 能指出并纠正这一错误：身处顺境时骄傲自满，把优势当成永远，不再努力
  aliases:
    - 顺境
    - 逆境
  category: 道德与法治
  explanation: 顺境和逆境是人生历程中两种不同的境遇，对人生的作用都是双重的，关键是以何种态度对待。顺境不骄，逆境不绥，顺境和逆境在一定条件下可以相互转化。
  misconceptions:
    - 认为顺境只有好处，逆境只有坏处，忽视境遇的双重作用
    - 身处顺境时骄傲自满，把优势当成永远，不再努力
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:预防未成年人犯罪法
  type: Concept
  subject: 道德与法治
  title: 预防未成年人犯罪法
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 为保障未成年人身心健康、培养良好品行、预防未成年人犯罪而制定的法律，明确了各部门和家庭在教育、预防、干预、矫治方面的职责。
  sourceRef: content/六年级/上册/道德与法治/PEP-6-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:领土
  type: Concept
  subject: 道德与法治
  title: 领土
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为领土只有陆地，不包括领水和领空，导致概念不全。
    - 能指出并纠正这一错误：认为领土可以通过当地居民投票决定是否归属他国。
  aliases: []
  category: 政治概念
  explanation: 领土是国家行使主权的范围和空间，也是一个主权国家人民得以生息繁衍的最基本的物质基础。
  misconceptions:
    - 误以为领土只有陆地，不包括领水和领空，导致概念不全。
    - 认为领土可以通过当地居民投票决定是否归属他国。
    - 将驻外使领馆看作本国领土，误以为他国无权管辖。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:风俗的演变
  type: Concept
  subject: 道德与法治
  title: 风俗的演变
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 随着社会的发展，有些风俗不再适应时代需要，应该淘汰或变革，比如燃放鞭炮有危险又污染环境；优良的风俗则要努力保护和传承。
  sourceRef: content/四年级/下册/道德与法治/PEP-4-2-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:餐桌礼仪
  type: Concept
  subject: 道德与法治
  title: 餐桌礼仪
  conceptType: 概念型
  aliases:
    - 餐桌上的礼仪
  category: 文化常识
  explanation: 和家里人一起吃饭时要有礼貌：咳嗽打喷嚏要侧身遮掩口鼻，感谢做饭的人，不挑食、不浪费粮食。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:饭前洗手
  type: Concept
  subject: 道德与法治
  title: 饭前洗手
  conceptType: 程序型
  aliases:
    - 饭前要洗手
  category: 方法
  explanation: 饭前要洗手，把小手洗干净才不容易把细菌吃到肚子里。洗手要用正确的方法，别偷懒。
  sourceRef: content/一年级/上册/道德与法治/PEP-1-1-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:首都北京
  type: Concept
  subject: 道德与法治
  title: 首都北京
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 北京是中华人民共和国的首都。天安门广场、人民大会堂、故宫都在北京。
  sourceRef: content/二年级/上册/道德与法治/PEP-2-1-Politics/chapters/C4/sections/S1.md
- id: concept:道德与法治:香港澳门回归祖国
  type: Concept
  subject: 道德与法治
  title: 香港澳门回归祖国
  conceptType: 概念型
  aliases:
    - 港澳回归
  category: 概念
  explanation: 1997年7月1日中国政府对香港恢复行使主权，1999年12月20日对澳门恢复行使主权。港澳回归洗雪了中华民族百年耻辱。
  sourceRef: content/五年级/上册/道德与法治/PEP-5-1-Politics/chapters/C3/sections/S3.md
- id: concept:道德与法治:马关条约
  type: Concept
  subject: 道德与法治
  title: 马关条约
  conceptType: 概念型
  aliases:
    - 中日马关条约
  category: 文化常识
  explanation: 1895 年清政府被迫与日本签订的不平等条约，割让辽东半岛、台湾等地并巨额赔款，大大加深了民族危机。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:马虎的原因
  type: Concept
  subject: 道德与法治
  title: 马虎的原因
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 马虎常常是因为看错题、太着急或者忘了检查。知道自己为什么马虎，才能改正。
  sourceRef: content/一年级/下册/道德与法治/PEP-1-2-Politics/chapters/C1/sections/S2.md
- id: concept:道德与法治:高质量发展
  type: Concept
  subject: 道德与法治
  title: 高质量发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把高质量发展等同于GDP高速增长，忽视质量和效益
    - 能指出并纠正这一错误：认为高质量发展只是经济领域的要求，与生态、民生无关
  aliases: []
  category: 概念
  explanation: 我国经济已由高速增长阶段转向高质量发展阶段，是全面建设社会主义现代化国家的首要任务，需要转变发展方式，优化经济结构，转换增长动力。
  misconceptions:
    - 把高质量发展等同于GDP高速增长，忽视质量和效益
    - 认为高质量发展只是经济领域的要求，与生态、民生无关
    - 觉得转变发展方式就是放弃传统产业，直接搞新兴产业
  sourceRef: content/九年级/上册/道德与法治/PEP-9-1-Politics/chapters/C1/sections/S1.md
- id: concept:道德与法治:鸦片战争
  type: Concept
  subject: 道德与法治
  title: 鸦片战争
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 1840 年英国为打开中国大门发动的侵略战争，清政府战败求和，中国开始沦为半殖民地半封建社会。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S1.md
- id: concept:道德与法治:黄花岗起义
  type: Concept
  subject: 道德与法治
  title: 黄花岗起义
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 1911 年 4 月革命党人在广州发动的武装起义，失败后牺牲的 72 位烈士合葬于黄花岗，史称黄花岗七十二烈士。
  sourceRef: content/五年级/下册/道德与法治/PEP-5-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:教育家精神
  type: Concept
  subject: 道德与法治
  title: 教育家精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为教育家精神只适用于中小学名师，忽略其面向全体教师的普遍要求。
  aliases:
    - 中国特有的教育家精神
  category: 概念
  explanation: 2023 年教师节提出，包括心有大我、至诚报国的理想信念，言为士则、行为世范的道德情操，启智润心、因材施教的育人智慧，勤学笃行、求是创新的躬耕态度，乐教爱生、甘于奉献的仁爱之心，胸怀天下、以文化人的弘道追求六个方面。
  misconceptions:
    - 误认为教育家精神只适用于中小学名师，忽略其面向全体教师的普遍要求。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:师生交往
  type: Concept
  subject: 道德与法治
  title: 师生交往
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为尊重老师就是不能提出不同意见，把顺从当尊重。
    - 能指出并纠正这一错误：误认为被老师批评就是老师不喜欢自己，把批评等同于否定。
  aliases:
    - 珍惜师生情谊
  category: 概念
  explanation: 师生交往是学校生活的重要内容。尊重老师、理解老师的辛劳，主动沟通、真诚表达，是建立和谐师生关系的基础；对老师的批评应正确对待，不因批评而疏远。
  misconceptions:
    - 误认为尊重老师就是不能提出不同意见，把顺从当尊重。
    - 误认为被老师批评就是老师不喜欢自己，把批评等同于否定。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S4.md
- id: concept:道德与法治:友谊的特质
  type: Concept
  subject: 道德与法治
  title: 友谊的特质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为友谊靠一味付出维系，忽略平等与双向。
    - 能指出并纠正这一错误：误认为好朋友之间不能有分歧，把顺从当作忠诚。
  category: 概念
  explanation: 友谊是一种亲密的关系，是平等的关系，是心灵的相遇。友谊需要真诚和努力，也需要精心呵护；朋友之间既有欢乐的分享，也有困难时的支持。
  misconceptions:
    - 误认为友谊靠一味付出维系，忽略平等与双向。
    - 误认为好朋友之间不能有分歧，把顺从当作忠诚。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S5.md
- id: concept:道德与法治:交友的原则
  type: Concept
  subject: 道德与法治
  title: 交友的原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“为朋友两肋插刀”就是讲义气，把违法违纪当忠诚。
    - 能指出并纠正这一错误：误认为朋友之间不该有隐私，把窥探当亲密。
  aliases:
    - 交友的智慧
  category: 概念
  explanation: 交友需要真诚、友善，也需要慎重选择和坚守原则。要明辨是非，不因朋友义气而做出违背道德和法律的事；要尊重对方的边界，不把友谊变成控制。
  misconceptions:
    - 误认为“为朋友两肋插刀”就是讲义气，把违法违纪当忠诚。
    - 误认为朋友之间不该有隐私，把窥探当亲密。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C2/sections/S6.md
- id: concept:道德与法治:精神滋养
  type: Concept
  subject: 道德与法治
  title: 精神滋养
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为身体健康就等于生命状态良好，忽略心理与精神层面。
  category: 概念
  explanation: 良好的生命状态既需要健康的身体，也需要健康的心理和丰富的精神。参观博物馆、欣赏艺术、参加文化活动等，能丰富精神世界、滋养心灵。
  misconceptions:
    - 误认为身体健康就等于生命状态良好，忽略心理与精神层面。
  sourceRef: content/七年级/上册/道德与法治/PEP-7-1-Politics/chapters/C3/sections/S5.md
- id: concept:道德与法治:美好情感
  type: Concept
  subject: 道德与法治
  title: 美好情感
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为情感是凭空产生的，忽略生活实践是情感体验的来源。
  category: 概念
  explanation: 正义感、胜任感、责任感等美好情感，是在生活实践中体验和积累起来的；在帮助他人、奉献社会中能获得积极的情感体验，并提升情绪管理能力。
  misconceptions:
    - 误认为情感是凭空产生的，忽略生活实践是情感体验的来源。
  sourceRef: content/七年级/下册/道德与法治/PEP-7-2-Politics/chapters/C1/sections/S3.md
- id: concept:道德与法治:中国与世界共赢发展
  type: Concept
  subject: 道德与法治
  title: 中国与世界共赢发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为对外开放只是引进外资，忽略共同发展与责任担当。
  aliases:
    - 携手促发展
  category: 概念
  explanation: 中国在谋求自身发展的同时，与世界各国共享发展机遇，坚持共商共建共享，推动构建人类命运共同体，实现互利共赢。
  misconceptions:
    - 误认为对外开放只是引进外资，忽略共同发展与责任担当。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C2/sections/S3.md
- id: concept:道德与法治:少年强则国强
  type: Concept
  subject: 道德与法治
  title: 少年强则国强
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为自强只是个人成绩好，与国家和时代无关。
  aliases:
    - 少年当自强
  category: 概念
  explanation: 个人的命运与国家的命运紧密相连。青少年当自强，要以国家发展为己任，在实践中锻炼本领、培养创新精神，为国家和世界的发展贡献力量。
  misconceptions:
    - 误认为自强只是个人成绩好，与国家和时代无关。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S2.md
- id: concept:道德与法治:网络的作用
  type: Concept
  subject: 道德与法治
  title: 网络的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为网络只带来便利，忽略其带来的隐私、沉迷与治理问题。
  aliases:
    - 网络改变世界
  category: 概念
  explanation: 网络不仅改变了人们的生活方式、交往方式，也促进了社会生产方式和治理方式的变革，是信息时代社会发展的重要推动力。
  misconceptions:
    - 误认为网络只带来便利，忽略其带来的隐私、沉迷与治理问题。
  sourceRef: content/八年级/上册/道德与法治/PEP-8-1-Politics/chapters/C1/sections/S5.md
- id: concept:道德与法治:国家监察机关
  type: Concept
  subject: 道德与法治
  title: 国家监察机关
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为监察委员会属于行政机关，实际是独立的国家监察机关。
    - 能指出并纠正这一错误：误认为监察对象只包括党员干部，忽略所有行使公权力的公职人员。
  category: 国家机构
  explanation: 各级监察委员会是行使国家监察职能的专责机关。国家监察机关由国家权力机关产生，对它负责并受它监督，依法独立行使监察权，对所有行使公权力的公职人员依法进行监督、调查、处置。
  misconceptions:
    - 误认为监察委员会属于行政机关，实际是独立的国家监察机关。
    - 误认为监察对象只包括党员干部，忽略所有行使公权力的公职人员。
  sourceRef: content/八年级/下册/道德与法治/PEP-8-2-Politics/chapters/C4/sections/S9.md
- id: concept:道德与法治:走向未来
  type: Concept
  subject: 道德与法治
  title: 走向未来
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为规划未来就是选定一个职业，忽略持续调整与能力积累。
  aliases:
    - 从这里出发
  category: 概念
  explanation: 站在人生的新起点，要回望成长、总结经验，面对未来的机遇与挑战时脚踏实地、科学规划，把个人理想融入国家发展。
  misconceptions:
    - 误认为规划未来就是选定一个职业，忽略持续调整与能力积累。
  sourceRef: content/九年级/下册/道德与法治/PEP-9-2-Politics/chapters/C3/sections/S5.md
