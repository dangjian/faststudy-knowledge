- id: concept:科学:一天中的气温变化
  type: Concept
  subject: 科学
  title: 一天中的气温变化
  conceptType: 概念型
  aliases:
    - 气温变化规律
  category: 现象
  explanation: 一天中气温会不断变化：早晚比较凉，中午到午后气温最高。按时测量同一地点的气温，就能发现这个规律。
  misconceptions:
    - 误认为中午 12 点气温最高，实际最高气温出现在中午到午后。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:三角形结构
  type: Concept
  subject: 科学
  title: 三角形结构
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 三角形比较稳固、不易变形，在塔台等建筑中多用三角形结构可以让工程更结实。
  misconceptions:
    - 误认为四边形结构和三角形一样稳固，实际四边形受力容易变形，三角形不易变形。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:乐器声音的变化
  type: Concept
  subject: 科学
  title: 乐器声音的变化
  conceptType: 概念型
  aliases:
    - 乐器的发声原理
  category: 概念
  explanation: 乐器靠改变发声部分的振动来改变声音：琴弦的粗细、长短、松紧不同，声音高低就不同；弹拨的力度不同，声音强弱就不同。
  misconceptions:
    - 误认为弹拨力度越大声音越高，实际力度改变的是声音强弱，音高由振动部分的粗细、长短、松紧决定。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S4.md
- id: concept:科学:二十四节气
  type: Concept
  subject: 科学
  title: 二十四节气
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 我国古人长期观察太阳运行规律，在四季基础上细分出二十四节气，用来指导农业生产。
  misconceptions:
    - 误认为二十四节气是按农历划分的，实际是按太阳运行规律在四季基础上细分出来的。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S7.md
- id: concept:科学:二歧分类法
  type: Concept
  subject: 科学
  title: 二歧分类法
  conceptType: 程序型
  aliases:
    - 二歧分类
  category: 方法
  explanation: 确定一个标准把生物分成两类，每类下再确定新标准继续分，直到不能再分为止的分类方法。
  misconceptions:
    - 误认为分类时可以把几个标准一起用，实际每一步只能用一个标准分成两类。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:云量
  type: Concept
  subject: 科学
  title: 云量
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 云量指天空中云的多少。云很少、阳光充足是晴；云比较多、偶尔能看到太阳是多云；云多而密、看不到太阳是阴。
  misconceptions:
    - 误认为云比较多、偶尔能看到太阳就是阴天，实际这是多云，看不到太阳才是阴。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S6.md
- id: concept:科学:人体器官的协作
  type: Concept
  subject: 科学
  title: 人体器官的协作
  conceptType: 概念型
  aliases:
    - 人体是一个统一的整体
  category: 概念
  explanation: 人体是一个系统，各器官的结构和功能不同，活动时却密切配合。比如剧烈运动时呼吸、心跳都加快，把更多氧气和养分送给肌肉。人体是一个统一的整体。
  misconceptions:
    - 误认为各器官各自独立工作，实际剧烈运动时呼吸与心跳会协同加快，把更多氧气和养料送到需要的地方。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S10.md
- id: concept:科学:人类对地球的探索
  type: Concept
  subject: 科学
  title: 人类对地球的探索
  conceptType: 概念型
  aliases:
    - 探索地球
  category: 观点
  explanation: 地球上还有很多动植物没被发现，地球内部和历史也还没有完全弄清楚。科学家每天都在研究地球，不断发现它更多的秘密。
  misconceptions:
    - 误认为地球已被完全探明，实际还有很多动植物未被发现，地球内部和历史也没有完全弄清楚。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S11.md
- id: concept:科学:人类探索宇宙的历程
  type: Concept
  subject: 科学
  title: 人类探索宇宙的历程
  conceptType: 概念型
  aliases:
    - 探索宇宙的历史
  category: 概念
  explanation: 人类从古代观测记录天象，到发明望远镜观测太空，再到用火箭把卫星、探测器送入太空、建设空间站，一步步探索宇宙。
  misconceptions:
    - 误认为一开始就用火箭探测太空，实际先有观测记录天象、发明望远镜，之后才用火箭送卫星和探测器。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C3/sections/S7.md
- id: concept:科学:人类活动对地球的影响
  type: Concept
  subject: 科学
  title: 人类活动对地球的影响
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 人类砍伐森林、建设城市、捕捞鱼类等活动，压缩了动植物的生存空间，还造成环境污染和全球变暖，改变着地球的环境。
  misconceptions:
    - 误认为只有砍伐森林会破坏环境，实际建设城市、捕捞鱼类同样压缩动植物生存空间并造成污染。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S10.md
- id: concept:科学:人耳的结构
  type: Concept
  subject: 科学
  title: 人耳的结构
  conceptType: 概念型
  aliases:
    - 耳朵的结构
  category: 概念
  explanation: 耳朵由耳郭、外耳道、鼓膜、耳蜗等组成。声音经过外耳道这条"隧道"到达鼓膜，引起鼓膜振动，我们才能听到声音。
  misconceptions:
    - 误认为耳朵只是一个听声音的孔，实际耳郭、外耳道、鼓膜、耳蜗分工，鼓膜振动才让我们听到声音。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S8.md
- id: concept:科学:人造物
  type: Concept
  subject: 科学
  title: 人造物
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 经过人们加工做出来的材料叫人造物，比如砖、玻璃和金属。人们常用多种材料一起盖房子。
  misconceptions:
    - 误认为玻璃、金属是自然物，实际它们经过人工加工，属于人造物。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:会开花和不开花的植物
  type: Concept
  subject: 科学
  title: 会开花和不开花的植物
  conceptType: 概念型
  aliases:
    - 多样的植物
  category: 概念
  explanation: 植物的样子多种多样，有的植物会开花，有的植物不会开花。比如兰花会开花，蕨类植物就不开花。
  misconceptions:
    - 误认为所有植物都会开花，实际蕨类等植物不会开花。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S8.md
- id: concept:科学:传染病的预防
  type: Concept
  subject: 科学
  title: 传染病的预防
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 传染病是由病毒、细菌等引起的能传播的疾病。预防传染病要控制传染源、切断传播途径、保护易感染者，平时要勤洗手、常通风、多锻炼。
  misconceptions:
    - 误认为勤洗手是在控制传染源，实际它属于切断传播途径。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S9.md
- id: concept:科学:传粉
  type: Concept
  subject: 科学
  title: 传粉
  conceptType: 概念型
  aliases:
    - 人工授粉
  category: 现象
  explanation: 雄蕊上的花粉传到雌蕊上的过程叫传粉。植物只有完成传粉，花才能发育成果实；蜜蜂等昆虫可以帮助植物传粉。
  misconceptions:
    - 误认为花开了就会结果，实际只有完成传粉，花才能发育成果实。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S5.md
- id: concept:科学:住房的结构和系统
  type: Concept
  subject: 科学
  title: 住房的结构和系统
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 住房由基础、墙体、门窗等结构组成，还需要供水、供电、供暖等系统来满足居住需要。
  misconceptions:
    - 误认为住房只需墙和门窗，实际还需要供水、供电、供暖等系统才满足居住需要。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C1/sections/S1.md
- id: concept:科学:侵蚀作用
  type: Concept
  subject: 科学
  title: 侵蚀作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 流水、风力、波浪等外力在运动状态下改变地表岩石及其风化物的过程叫侵蚀作用，比如雨水冲刷会把坡地的泥土冲走。
  misconceptions:
    - 误认为侵蚀就是岩石自己风化破碎，实际是流水、风力、波浪等外力在运动中改变地表岩石及其风化物。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S6.md
- id: concept:科学:保护动物
  type: Concept
  subject: 科学
  title: 保护动物
  conceptType: 概念型
  aliases:
    - 动物是我们的朋友
  category: 观点
  explanation: 很多动物能帮助我们，比如导盲犬帮盲人、蚯蚓松土。要保护动物和它们生活的环境。
  misconceptions:
    - 误认为保护动物只要保护动物本身，实际还要保护它们生活的环境。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C2/sections/S8.md
- id: concept:科学:保护听力
  type: Concept
  subject: 科学
  title: 保护听力
  conceptType: 概念型
  aliases:
    - 听力的保护
  category: 观点
  explanation: 长时间待在大音量的环境里听力会受到伤害。不要让强声音直接刺激耳朵，必要时戴上耳罩，在公共场所要轻声说话。
  misconceptions:
    - 误认为只有巨响才伤听力，实际长时间待在大音量环境里听力同样会受损。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S8.md
- id: concept:科学:保护呼吸器官和消化器官
  type: Concept
  subject: 科学
  title: 保护呼吸器官和消化器官
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 要养成良好生活习惯：科学佩戴口罩、勤洗手、常通风来预防呼吸道疾病；饭前便后勤洗手、不吃变质不洁的食物来保护胃肠。
  misconceptions:
    - 误认为戴口罩只为挡灰尘，实际它与勤洗手、常通风一起用于预防呼吸道疾病。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S8.md
- id: concept:科学:保护地球的行动
  type: Concept
  subject: 科学
  title: 保护地球的行动
  conceptType: 概念型
  aliases:
    - 保护环境的措施
  category: 方法
  explanation: 人们设立生态保护区，利用太阳能、风力发电，回收处理垃圾等，用这些行动减少污染、保护地球环境。
  misconceptions:
    - 误认为保护地球只能少用资源，实际设立生态保护区、用太阳能风能、回收垃圾都是具体行动。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S10.md
- id: concept:科学:保护岩石和土壤
  type: Concept
  subject: 科学
  title: 保护岩石和土壤
  conceptType: 概念型
  aliases:
    - 保护自然资源
  category: 观点
  explanation: 岩石和矿物被开采后不能再生，我们要合理利用它们；人类生存离不开土壤，要珍惜土壤，防止土壤被污染和浪费。
  misconceptions:
    - 误认为岩石和矿物取之不尽，实际开采后不能再生，要合理利用。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S8.md
- id: concept:科学:保护感觉器官
  type: Concept
  subject: 科学
  title: 保护感觉器官
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 感觉器官很容易受到伤害。不看强光、不揉眼睛、不掏耳朵、不长时间戴耳机，要好好保护它们。
  misconceptions:
    - 误认为感觉器官不需要特别保护，实际强光、掏耳朵、长时间戴耳机都会伤害它们。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:保护水资源
  type: Concept
  subject: 科学
  title: 保护水资源
  conceptType: 概念型
  aliases:
    - 保护身边的水
  category: 观点
  explanation: 水被污染后会变得又黑又臭，让鱼和植物死去，也危害我们。要节约用水，不往河里扔垃圾。
  misconceptions:
    - 误认为水被污染只是变脏，实际会让鱼和植物死去，也危害人的健康。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S9.md
- id: concept:科学:保护生物多样性
  type: Concept
  subject: 科学
  title: 保护生物多样性
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 每个物种都是独一无二的，生物多样性关系到人类的健康和生存，应该与自然和谐相处、加以保护。
  misconceptions:
    - 误认为保护生物多样性只是保护稀有动物，实际每个物种都独一无二，关系到人类的健康和生存。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S7.md
- id: concept:科学:保温的方法
  type: Concept
  subject: 科学
  title: 保温的方法
  conceptType: 概念型
  aliases:
    - 保温杯
  category: 方法
  explanation: 用导热慢的材料包裹杯子、加盖密封、留出真空夹层等办法，都能减慢热量的传递，让热水凉得更慢，比如制作保温杯和保温瓶。
  misconceptions:
    - 误认为保温就是持续加热，实际是用导热慢的材料、加盖密封、留真空夹层来减慢热量传递。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C4/sections/S7.md
- id: concept:科学:健康呼吸
  type: Concept
  subject: 科学
  title: 健康呼吸
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 用鼻子呼吸、经常深呼吸有助于健康；长期用嘴呼吸对身体不好。室内常通风、远离二手烟、人多场所戴口罩，都是保护呼吸的好习惯。
  misconceptions:
    - 误认为用嘴呼吸更省力，实际长期用嘴呼吸对身体不好，应该用鼻子呼吸。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S10.md
- id: concept:科学:健康生活
  type: Concept
  subject: 科学
  title: 健康生活
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 健康生活既包括平衡膳食、充足睡眠、合理运动等生理健康，也包括认识和管理情绪等心理健康，还要有合理的目标和可行的计划。
  misconceptions:
    - 误认为健康就是不生病，实际还包括平衡膳食、充足睡眠、合理运动以及管理情绪。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S8.md
- id: concept:科学:健康生活计划
  type: Concept
  subject: 科学
  title: 健康生活计划
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 通过确定健康目标、明确要养成的习惯、安排每天具体的实践并记录执行效果，来改善自己的健康。
  misconceptions:
    - 误认为计划写下目标就够了，实际要明确要养成的习惯、安排每天的具体实践并记录效果。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S7.md
- id: concept:科学:充足的睡眠
  type: Concept
  subject: 科学
  title: 充足的睡眠
  conceptType: 概念型
  aliases:
    - 睡眠与健康
  category: 概念
  explanation: 小学生每天应睡够 10 小时左右，长期睡眠不足会使记忆力、注意力下降，影响学习效果。
  misconceptions:
    - 误认为睡得少可以白天补回来，实际小学生每天应睡够约 10 小时，不足会降低记忆力和注意力。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:光与视觉
  type: Concept
  subject: 科学
  title: 光与视觉
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 外界物体发出或反射的光进入眼睛引起视觉；视网膜上的视杆细胞帮助我们在暗处看清轮廓，视锥细胞帮助我们分辨颜色。
  misconceptions:
    - 误认为眼睛自己发光才能看见物体，实际是物体发出或反射的光进入眼睛引起视觉。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S9.md
- id: concept:科学:光合作用
  type: Concept
  subject: 科学
  title: 光合作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 在光照下，植物吸收空气中的二氧化碳和水分，在绿叶里制造出生长需要的养料，同时放出氧气。
  misconceptions:
    - 误认为植物只吸收氧气，实际它在光照下吸收二氧化碳和水分制造养料，同时放出氧气。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:光学仪器
  type: Concept
  subject: 科学
  title: 光学仪器
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 利用光的各种特性制造的、用于观察、显示、测量等用途的仪器，如投影仪、显微镜、望远镜和照相机。
  misconceptions:
    - 误认为光学仪器只是把物体放大，实际它们是利用光的各种特性做观察、显示和测量。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:光学显微镜的使用方法
  type: Concept
  subject: 科学
  title: 光学显微镜的使用方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 使用光学显微镜要先安放、对光，再把玻片标本放到载物台上，慢慢转动调节旋钮调焦，直到看清楚图像，最后边观察边记录。
  misconceptions:
    - 误认为应先放玻片再对光，实际要先安放、对光，再把玻片标本放到载物台上调焦。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:光沿直线传播
  type: Concept
  subject: 科学
  title: 光沿直线传播
  conceptType: 概念型
  aliases:
    - 光的直线传播
  category: 性质
  explanation: 光在空气中沿直线传播，排队看齐、林间光束、影子的形成都可以用这一特点解释。
  misconceptions:
    - 误认为光会绕过障碍拐弯，实际光在空气中沿直线传播，影子和林间光束就是证据。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S2.md
- id: concept:科学:光源
  type: Concept
  subject: 科学
  title: 光源
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 太阳、电灯等本身能发光的物体叫光源。月球、镜子本身不会发光，只是反射别的物体的光，所以不是光源。
  misconceptions:
    - 误认为月亮也是光源，实际它只反射太阳光，本身不发光。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S5.md
- id: concept:科学:光的反射
  type: Concept
  subject: 科学
  title: 光的反射
  conceptType: 概念型
  aliases:
    - 镜面反射
  category: 现象
  explanation: 光遇到物体表面会被反射回去，我们能看到不发光的物体，就是因为它们把光反射进了我们的眼睛。
  misconceptions:
    - 误认为看见物体是眼睛发出光，实际是物体表面把光反射进了眼睛。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S4.md
- id: concept:科学:光的色散
  type: Concept
  subject: 科学
  title: 光的色散
  conceptType: 概念型
  aliases:
    - 彩虹的成因
    - 白光的分解
  category: 现象
  explanation: 太阳光看上去是白色的，实际由多种色光组成，通过三棱镜或水和镜子后会分散成红、橙、黄、绿、蓝、靛、紫的彩色光带，彩虹就是这样形成的。
  misconceptions:
    - 误认为太阳光是单一的白光，实际它由多种色光组成，经三棱镜会分散成红橙黄绿蓝靛紫。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S7.md
- id: concept:科学:冬眠
  type: Concept
  subject: 科学
  title: 冬眠
  conceptType: 概念型
  aliases:
    - 夏眠
  category: 现象
  explanation: 一些动物在冬天不吃、不喝、不动，体温下降，用这种方式熬过严寒，这叫冬眠。蛇、刺猬、蝙蝠等很多动物都会冬眠。
  misconceptions:
    - 误认为冬眠只是睡得久，实际是不吃、不喝、不动且体温下降，用来熬过严寒。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S10.md
- id: concept:科学:冰川和海浪的侵蚀
  type: Concept
  subject: 科学
  title: 冰川和海浪的侵蚀
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 在地表缓慢移动的大冰体叫冰川，它像推土机一样磨蚀岩层，形成 U 形谷、角峰等地形；海浪不断拍打磨蚀岸边岩石，会形成海蚀拱桥、海蚀洞穴等地形。
  misconceptions:
    - 误认为只有流水会侵蚀地表，实际冰川磨蚀岩层、海浪拍打海岸同样改变地形。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S9.md
- id: concept:科学:凝结
  type: Concept
  subject: 科学
  title: 凝结
  conceptType: 概念型
  aliases:
    - 凝结现象
  category: 现象
  explanation: 空气中的水蒸气遇到冷的物体，会变成小水珠，这种现象叫凝结。冰镇饮料罐外壁出现的水珠，就是空气中的水蒸气遇冷凝结成的。
  misconceptions:
    - 误认为冰镇饮料罐外的水珠是从罐里渗出来的，实际是空气中的水蒸气遇冷凝结成小水珠。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S2.md
- id: concept:科学:分析环境问题的方法
  type: Concept
  subject: 科学
  title: 分析环境问题的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 分析一个环境问题要先收集资料、弄清原因，再从不同人群的角度看问题、提出解决办法，最后协调平衡各方利益，找出可行的方案。
  misconceptions:
    - 误认为只从一个角度就能给出解决办法，实际要站在不同人群的角度看问题并协调平衡各方利益。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S7.md
- id: concept:科学:分类
  type: Concept
  subject: 科学
  title: 分类
  conceptType: 概念型
  aliases:
    - 给物体分类
  category: 方法
  explanation: 按照物体的一个特征，把它们分成几类，就叫分类。同一个特征分类结果一样，选不同特征会有不同的分法。
  misconceptions:
    - 误认为分类结果只有一种，实际按不同特征分类会得到不同的结果。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S2.md
- id: concept:科学:制作岩石矿物标本
  type: Concept
  subject: 科学
  title: 制作岩石矿物标本
  conceptType: 程序型
  aliases:
    - 制作标本的方法
  category: 方法
  explanation: 制作岩石和矿物标本时，先给采集到的标本编号，再对照图鉴识别名称，然后贴上写有编号、名称、采集地点和时间的标签，最后按顺序放进标本盒保存。
  misconceptions:
    - 误认为标本上只写名称就行，实际还要写编号、采集地点和时间。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S4.md
- id: concept:科学:制作模型的方法
  type: Concept
  subject: 科学
  title: 制作模型的方法
  conceptType: 程序型
  aliases:
    - 制作恐龙模型
  category: 方法
  explanation: 先制订方案，选好合适的材料，再动手做模型，做好后进行展示和修改。做模型能让看不出原样的东西变得更直观。
  misconceptions:
    - 误认为直接动手做就行，实际要先制订方案、选好材料，做完后展示并修改。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C1/sections/S6.md
- id: concept:科学:制作水钟
  type: Concept
  subject: 科学
  title: 制作水钟
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 设计并制作能匀速滴漏的水钟，用秒表在接水容器上标出均匀的时间刻度，并测试计时的误差。
  misconceptions:
    - 误认为容器越大计时越准，实际要在接水容器上标出均匀的时间刻度并测试计时误差。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S3.md
- id: concept:科学:制作科普海报
  type: Concept
  subject: 科学
  title: 制作科普海报
  conceptType: 程序型
  aliases:
    - 科普海报
  category: 方法
  explanation: 制作科普海报要先确定主题，搜集相关的图文资料，再设计版面、制作装饰，最后检查内容是否准确并展示交流。
  misconceptions:
    - 误认为先做装饰再定主题，实际要先确定主题、搜集图文资料，再设计版面。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S8.md
- id: concept:科学:制作简易开关
  type: Concept
  subject: 科学
  title: 制作简易开关
  conceptType: 程序型
  aliases:
    - 回形针开关
  category: 方法
  explanation: 可以用小木板、回形针和图钉做一个简易开关：按下回形针一端接通电路，抬起来就断开电路。开关的材料要一部分能导电、一部分能绝缘。
  misconceptions:
    - 误认为开关用一块金属就能做，实际要一部分能导电、一部分不能导电，才能接通和断开。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S7.md
- id: concept:科学:力使物体的形状改变
  type: Concept
  subject: 科学
  title: 力使物体的形状改变
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 用力按压或拉伸弹簧，弹簧的形状会发生变化。力可以使物体的形状改变。
  misconceptions:
    - 误认为力只能让物体运动起来，实际力也可以改变物体的形状。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:力改变物体的运动状态
  type: Concept
  subject: 科学
  title: 力改变物体的运动状态
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 物体的动静、快慢、方向等运动状态，在重力、弹力、摩擦力等力的作用下会发生改变，力是改变物体运动状态的原因。
  misconceptions:
    - 误认为只有推和拉能改变运动，实际重力、弹力、摩擦力都能改变物体的快慢和方向。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S7.md
- id: concept:科学:力的单位牛顿
  type: Concept
  subject: 科学
  title: 力的单位牛顿
  conceptType: 概念型
  aliases:
    - 牛
    - 'N'
  category: 概念
  explanation: 力的单位是牛顿，简称牛，用符号 N 表示，是以物理学家牛顿的名字命名的。
  misconceptions:
    - 误认为力的单位是千克，实际力的单位是牛顿，符号 N。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S4.md
- id: concept:科学:加快溶解的方法
  type: Concept
  subject: 科学
  title: 加快溶解的方法
  conceptType: 概念型
  aliases:
    - 加快溶解
  category: 方法
  explanation: 搅拌、用热水、把物质研碎成小颗粒，都能加快物质在水中的溶解。做比较实验时，其他条件要一样才公平。
  misconceptions:
    - 误认为搅拌能让水里溶解更多物质，实际搅拌只加快溶解速度，不改变能溶解的量。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S7.md
- id: concept:科学:动滑轮
  type: Concept
  subject: 科学
  title: 动滑轮
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 像塔吊的吊钩那样，可以随重物一起移动的滑轮叫动滑轮。用动滑轮提升重物能省力。
  misconceptions:
    - 误认为动滑轮只能改变用力方向，实际它随重物一起移动，能省力。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:动物分类的依据
  type: Concept
  subject: 科学
  title: 动物分类的依据
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 给动物分类要找依据，比如身体里有没有脊柱、吃什么食物、怎样运动。依据不同，分出来的类别也不同。
  misconceptions:
    - 误认为动物分类有唯一标准，实际按有无脊柱、吃什么、怎样运动分出来的类别并不相同。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:动物生存需要的条件
  type: Concept
  subject: 科学
  title: 动物生存需要的条件
  conceptType: 概念型
  aliases:
    - 动物的需要
  category: 概念
  explanation: 动物生存和生长都需要食物、空气、水和适宜的温度等条件。满足这些条件，动物才能正常生活和繁殖后代。
  misconceptions:
    - 误认为动物有食物就能活，实际还需要空气、水和适宜的温度。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S9.md
- id: concept:科学:动物的生命周期
  type: Concept
  subject: 科学
  title: 动物的生命周期
  conceptType: 概念型
  aliases:
    - 生命周期
  category: 概念
  explanation: 所有动物都会经历出生、生长、繁殖、死亡的过程，这就是动物的生命周期。不同的动物生命周期不一样，比如蝌蚪会变成蛙。
  misconceptions:
    - 误认为只有人会经历生长与死亡，实际动物都要经历出生、生长、繁殖、死亡的过程。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S8.md
- id: concept:科学:动物的生活环境
  type: Concept
  subject: 科学
  title: 动物的生活环境
  conceptType: 概念型
  aliases:
    - 生活环境
  category: 概念
  explanation: 动物生活的地方就是它的家，比如蜗牛喜欢阴湿的地方。养小动物要给它合适的家，有食物、有水，还要保持干净。
  misconceptions:
    - 误认为给动物一个容器就算安家，实际要有食物、有水，还要有适合它的环境。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:动物的繁殖
  type: Concept
  subject: 科学
  title: 动物的繁殖
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 动物生出小宝宝、繁殖后代的现象叫动物的繁殖。动物繁殖后代需要筑巢、孵卵、喂食等很多行为。
  misconceptions:
    - 误认为生下后代就完成了繁殖，实际还要筑巢、孵卵、喂食等许多行为。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:动物的食物
  type: Concept
  subject: 科学
  title: 动物的食物
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 动物都要吃食物，但不同动物吃的东西不一样，吃的方式也不同，比如蜗牛吃菜叶，蜜蜂吸花蜜。
  misconceptions:
    - 误认为所有动物吃同一种食物，实际不同动物吃的东西和吃的方式都不一样。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C2/sections/S5.md
- id: concept:科学:动物适应环境变化的行为
  type: Concept
  subject: 科学
  title: 动物适应环境变化的行为
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 环境发生改变时，动物会用特殊的行为来适应，比如青蛙冬天钻进泥土冬眠、丹顶鹤秋天迁往温暖的南方越冬。
  misconceptions:
    - 误认为动物遇到环境变化只能被动受害，实际会通过冬眠、迁徙等行为来适应。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S5.md
- id: concept:科学:动物需要适宜的环境
  type: Concept
  subject: 科学
  title: 动物需要适宜的环境
  conceptType: 概念型
  aliases:
    - 动物对环境的选择
  category: 概念
  explanation: 通过实验发现蚯蚓喜欢黑暗、潮湿的环境，说明动物都生活在适合自己生存的环境里，和植物一样对环境有要求。
  misconceptions:
    - 误认为蚯蚓随便放在哪里都能活，实际它喜欢黑暗、潮湿的环境。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:化学变化
  type: Concept
  subject: 科学
  title: 化学变化
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 产生了新物质的变化叫化学变化，如食物变质、铁锅生锈。
  misconceptions:
    - 误认为颜色变了就是化学变化，实际要看是否产生了新物质，比如铁锅生锈、食物变质。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S1.md
- id: concept:科学:化学变化伴随的现象
  type: Concept
  subject: 科学
  title: 化学变化伴随的现象
  conceptType: 概念型
  aliases:
    - 变化中伴随的现象
  category: 现象
  explanation: 化学变化常伴随发光发热、改变颜色、产生气体、生成沉淀等现象，可以借助这些现象来判断物质发生了什么变化。
  misconceptions:
    - 误认为只要发光发热就是化学变化，实际要结合颜色改变、产生气体、生成沉淀等现象判断是否有新物质。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S4.md
- id: concept:科学:化石
  type: Concept
  subject: 科学
  title: 化石
  conceptType: 概念型
  aliases:
    - 古生物化石
  category: 概念
  explanation: 化石是存留在岩石中的古生物遗体、遗物或遗迹，能帮助科学家复原古代生物的样子和生活环境。
  misconceptions:
    - 误认为化石就是动物骨头本身，实际是保存在岩石中的古生物遗体、遗物或遗迹。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S6.md
- id: concept:科学:北极星
  type: Concept
  subject: 科学
  title: 北极星
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 北极星位于地球自转轴北极指向的延长线上，人们习惯用它辨认方向；因地轴指向缓慢变化，北极星会慢慢更换。
  misconceptions:
    - 误认为北极星永远固定在同一个位置，实际地轴指向缓慢变化，北极星也会慢慢更换。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S9.md
- id: concept:科学:单细胞生物
  type: Concept
  subject: 科学
  title: 单细胞生物
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 大多数生物由许多细胞构成，但有些生物全身只有一个细胞，叫单细胞生物，如草履虫、变形虫、眼虫等。
  misconceptions:
    - 误认为生物都由许多细胞构成，实际草履虫、变形虫等全身只有一个细胞。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:卵生和胎生
  type: Concept
  subject: 科学
  title: 卵生和胎生
  conceptType: 概念型
  aliases:
    - 卵生动物
    - 胎生动物
  category: 概念
  explanation: 像鸡、金鱼那样通过产卵繁殖后代的方式叫卵生；像猫、狗那样直接生小动物的方式叫胎生。动物的繁殖方式主要分为卵生和胎生。
  misconceptions:
    - 误认为所有动物都直接生小动物，实际鸡、金鱼等通过产卵繁殖后代，属于卵生。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:变异
  type: Concept
  subject: 科学
  title: 变异
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 生物的后代和亲代之间、后代个体之间也会有一些细微的不同，这种现象叫变异。
  misconceptions:
    - 误认为后代一定和亲代完全一样，实际后代与亲代之间、后代个体之间都有细微不同。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:变温动物和恒温动物
  type: Concept
  subject: 科学
  title: 变温动物和恒温动物
  conceptType: 概念型
  aliases:
    - 变温动物
    - 恒温动物
  category: 概念
  explanation: 体温会随环境温度变化的动物叫变温动物，比如蛙、蛇；体温保持稳定的动物叫恒温动物，比如鸟类和人类。变温动物天冷时常常要冬眠。
  misconceptions:
    - 误认为所有动物体温都保持稳定，实际蛙、蛇的体温会随环境温度变化。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S10.md
- id: concept:科学:口腔的消化作用
  type: Concept
  subject: 科学
  title: 口腔的消化作用
  conceptType: 概念型
  aliases:
    - 口腔里的消化
  category: 概念
  explanation: 口腔是消化的第一站：牙齿嚼碎食物，舌搅拌食物，唾液润湿并初步消化食物，使食物变成柔软的小块再咽下去。
  misconceptions:
    - 误认为口腔只负责把食物嚼碎，实际唾液还会润湿并初步消化食物。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:古人计时的方法
  type: Concept
  subject: 科学
  title: 古人计时的方法
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 古人利用自然现象计时：根据太阳和日影制作日晷、圭表，还用燃香、蜡烛燃烧的长短来计算时间。
  misconceptions:
    - 误认为古人只靠看太阳判断时间，实际还用日晷、圭表和燃香、蜡烛燃烧的长短来计时。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S1.md
- id: concept:科学:可再生能源和不可再生能源
  type: Concept
  subject: 科学
  title: 可再生能源和不可再生能源
  conceptType: 概念型
  aliases:
    - 新能源
  category: 概念
  explanation: 煤、石油、天然气用一点少一点，是不可再生能源；太阳能、风能、地热能、海洋能可以源源不断地获得，是可再生能源。我们要节约能源、开发新能源。
  misconceptions:
    - 误认为煤、石油永远用不完，实际它们用一点少一点，只有太阳能、风能等可以源源不断获得。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S5.md
- id: concept:科学:叶在茎上的分布
  type: Concept
  subject: 科学
  title: 叶在茎上的分布
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 植物的叶在茎上是交叉生长的，叶子平展伸展，能让每片叶子都尽可能多地晒到阳光。
  misconceptions:
    - 误认为叶子随意生长，实际叶在茎上交叉生长、平展伸展，让每片叶都尽可能多晒到阳光。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:叶的作用
  type: Concept
  subject: 科学
  title: 叶的作用
  conceptType: 概念型
  aliases:
    - 叶的作用
    - 叶吸收阳光和蒸腾水分
  category: 概念
  explanation: 叶能吸收阳光，为植物生长提供能量；还能通过蒸腾作用散失水分，促进根不断地吸收水分。
  misconceptions:
    - 误认为叶只起观赏作用，实际它吸收阳光为植物提供能量，还通过蒸腾作用促进根吸水。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:呼吸与消化
  type: Concept
  subject: 科学
  title: 呼吸与消化
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 呼吸让人体每时每刻获得氧气、排出废气，消化把吃进的食物变成身体能吸收的营养。它们共同维持我们的生命活动。
  misconceptions:
    - 误认为呼吸和消化互不相关，实际一个供氧、一个供营养，共同维持身体活动。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S1.md
- id: concept:科学:呼吸器官
  type: Concept
  subject: 科学
  title: 呼吸器官
  conceptType: 概念型
  aliases:
    - 人体的呼吸器官
  category: 概念
  explanation: 参与呼吸的器官有鼻腔、气管和肺等。吸气时空气从鼻腔进入，经过气管到达肺；呼气时气体沿原路排出体外。
  misconceptions:
    - 误认为呼吸只靠肺完成，实际空气要先经过鼻腔、气管才能到达肺。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S2.md
- id: concept:科学:土壤的形成
  type: Concept
  subject: 科学
  title: 土壤的形成
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 土壤的形成是一个极其漫长的过程，形成很薄的一层土壤可能需要几百到数万年时间，所以我们要珍惜土壤。
  misconceptions:
    - 误认为土壤是短时间内形成的，实际形成很薄的一层土壤可能需要几百到数万年。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S1.md
- id: concept:科学:土壤的成分
  type: Concept
  subject: 科学
  title: 土壤的成分
  conceptType: 概念型
  aliases:
    - 土壤的组成
  category: 概念
  explanation: 土壤里有沙砾、沙、粉沙、黏土等颗粒，还有水、空气、动植物遗体等。把土壤倒进水里搅拌静置后，颗粒会按大小分层沉降。
  misconceptions:
    - 误认为土壤里只有土，实际还有沙砾、沙、粉沙、黏土、水、空气和动植物遗体。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S6.md
- id: concept:科学:土壤的类型
  type: Concept
  subject: 科学
  title: 土壤的类型
  conceptType: 概念型
  aliases:
    - 沙质土、壤土、黏质土
    - 比较不同的土壤
  category: 概念
  explanation: 根据成分含量不同，土壤分为沙质土、壤土和黏质土。含沙多的沙质土渗水快、黏性差；含黏土多的黏质土渗水慢、黏性强；壤土介于两者之间，适合多种植物生长。
  misconceptions:
    - 误认为所有土壤都一样，实际按成分含量分为沙质土、壤土和黏质土，渗水性与黏性各不相同。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S7.md
- id: concept:科学:土壤颗粒的大小
  type: Concept
  subject: 科学
  title: 土壤颗粒的大小
  conceptType: 概念型
  aliases:
    - 土壤微粒分类
  category: 概念
  explanation: 按颗粒从大到小给土壤微粒分类：最大的是沙砾（小石子），其次是沙，再小的是粉沙，最小的是黏土，黏土微粒小到肉眼几乎看不清。
  misconceptions:
    - 误认为沙比沙砾大，实际从大到小依次是沙砾、沙、粉沙、黏土。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S6.md
- id: concept:科学:圭表
  type: Concept
  subject: 科学
  title: 圭表
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 我国古代测量正午日影的仪器，直立的“表”挡出影子，带刻度的“圭”读出影长，可以用来测定节气和一年时间的长短。
  misconceptions:
    - 误认为圭表是用来计时的钟，实际它是我国古代测量正午日影长度的仪器。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S5.md
- id: concept:科学:地形图
  type: Concept
  subject: 科学
  title: 地形图
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地形图是认识地形的重要工具，展示地球表面的海陆分布和高低起伏，图中暖色调代表海拔高，冷色调代表海拔低。
  misconceptions:
    - 误认为地形图只标注地名，实际用颜色表示海拔高低与海陆分布。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S1.md
- id: concept:科学:地球上的水体
  type: Concept
  subject: 科学
  title: 地球上的水体
  conceptType: 概念型
  aliases:
    - 水体
  category: 概念
  explanation: 地球上分布着很多水，常见的有江、河、湖、海，还有冰川和地下水等，它们都是水体。
  misconceptions:
    - 误认为水只存在于江河湖海，实际还有冰川和地下水等水体。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S2.md
- id: concept:科学:地球公转
  type: Concept
  subject: 科学
  title: 地球公转
  conceptType: 概念型
  aliases:
    - 公转
  category: 概念
  explanation: 地球在自转的同时还围绕太阳自西向东转动叫公转，公转一周约一年，公转时地轴倾斜的方向基本保持不变。
  misconceptions:
    - 误认为公转一周是一天，实际公转一周约一年，且地轴倾斜方向保持不变。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S6.md
- id: concept:科学:地球家园
  type: Concept
  subject: 科学
  title: 地球家园
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球是人类和动植物共同生活的家园，上面有陆地、海洋、空气和各种各样的生物。
  misconceptions:
    - 误认为地球只属于人类，实际它是人类和动植物共同生活的家园。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S1.md
- id: concept:科学:地球模型
  type: Concept
  subject: 科学
  title: 地球模型
  conceptType: 概念型
  aliases:
    - 地球仪
  category: 概念
  explanation: 地球太大难以直接研究，人们用地球仪等模型来模拟地球，研究昼夜交替、四季变化等问题。
  misconceptions:
    - 误认为地球仪只是摆件，实际人们用它模拟地球来研究昼夜交替和四季变化。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S1.md
- id: concept:科学:地球生命的生存条件
  type: Concept
  subject: 科学
  title: 地球生命的生存条件
  conceptType: 概念型
  aliases:
    - 生命存在的必要条件
  category: 概念
  explanation: 地球有适宜的温度、大量氧气、液态水和岩石土壤等条件，正好适合生命生存，所以我们要珍惜这颗独特的星球。
  misconceptions:
    - 误认为有氧气就有生命，实际还需要适宜的温度、液态水和岩石土壤。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S1.md
- id: concept:科学:地球的内部结构
  type: Concept
  subject: 科学
  title: 地球的内部结构
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球内部从外到内分为地壳、地幔和地核三层。火山喷出的岩浆说明地球内部是温度很高、压力很大的炽热状态。
  misconceptions:
    - 误认为地球内部是均匀的实心球，实际分为地壳、地幔、地核，内部温度很高。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S2.md
- id: concept:科学:地球的圈层结构
  type: Concept
  subject: 科学
  title: 地球的圈层结构
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球外部由大气圈、水圈、生物圈等圈层组成，内部包括地壳、地幔和地核，地壳和地幔的一部分组成岩石圈。
  misconceptions:
    - 误认为圈层只指地球外部，实际外部有大气圈、水圈、生物圈，内部有地壳、地幔、地核。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S1.md
- id: concept:科学:地球的特点
  type: Concept
  subject: 科学
  title: 地球的特点
  conceptType: 概念型
  aliases:
    - 地球小档案
  category: 概念
  explanation: 地球是一个球体，是太阳系的行星之一。地表由陆地和海洋组成，外面有大气圈包裹，上面生活着许多生物，平均温度约15℃。
  misconceptions:
    - 误认为地球是太阳系的中心，实际它是绕太阳运行的行星之一。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S1.md
- id: concept:科学:地球磁场
  type: Concept
  subject: 科学
  title: 地球磁场
  conceptType: 概念型
  aliases:
    - 地磁场
  category: 概念
  explanation: 地球周围存在着看不见的磁场，它像一道天然屏障，替地球挡住了太阳吹来的带电粒子，保护着地球上的生命。
  misconceptions:
    - 误认为磁场是能看见的东西，实际它看不见，却能挡住太阳吹来的带电粒子。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S10.md
- id: concept:科学:地球自转
  type: Concept
  subject: 科学
  title: 地球自转
  conceptType: 概念型
  aliases:
    - 自转
  category: 概念
  explanation: 地球绕着穿过自身的地轴不停地旋转叫自转，自转的方向和周期可以用地球模型做模拟实验来研究。
  misconceptions:
    - 误认为自转一周是一年，实际自转是绕地轴旋转，周期约一天。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S3.md
- id: concept:科学:地球自转的方向
  type: Concept
  subject: 科学
  title: 地球自转的方向
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球自西向东自转，所以东边的北京比西边的乌鲁木齐先迎来黎明，太阳看起来才东升西落。
  misconceptions:
    - 误认为太阳绕着地球转，实际是地球自西向东自转，东边的地方先迎来黎明。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S4.md
- id: concept:科学:地球表面的地形
  type: Concept
  subject: 科学
  title: 地球表面的地形
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球表面大约 71% 被海洋覆盖，其余是高低起伏、形态多样的陆地，有平原、山地、峡谷等不同的地形地貌。
  misconceptions:
    - 误认为地球表面大部分是陆地，实际约 71% 被海洋覆盖。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S1.md
- id: concept:科学:地表变化的原因
  type: Concept
  subject: 科学
  title: 地表变化的原因
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球表面的形态是地球内部和外部因素共同作用的结果。地震、火山喷发等内部力量使地表剧烈改变，水、风等外部力量的作用则缓慢而漫长。
  misconceptions:
    - 误认为地表变化只由外力造成，实际是地震、火山等内部力量与外部力量共同作用的结果。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S8.md
- id: concept:科学:地震
  type: Concept
  subject: 科学
  title: 地震
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 地震主要是由地下深处岩层挤压、弯曲直至断裂错动引起的，会使地面出现裂缝、塌陷，造成房屋倒塌等灾害。
  misconceptions:
    - 误认为地震是地面自己抖动，实际是地下深处岩层挤压、弯曲直至断裂错动引起的。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S3.md
- id: concept:科学:垃圾分类
  type: Concept
  subject: 科学
  title: 垃圾分类
  conceptType: 概念型
  aliases:
    - 垃圾分类标准
  category: 概念
  explanation: 生活垃圾一般分为可回收物、有害垃圾、厨余垃圾和其他垃圾四类。分类投放便于回收利用和处理，能减轻垃圾对环境的危害。
  misconceptions:
    - 误认为垃圾只分可回收和不可回收两类，实际分为可回收物、有害垃圾、厨余垃圾和其他垃圾四类。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S4.md
- id: concept:科学:声音的产生
  type: Concept
  subject: 科学
  title: 声音的产生
  conceptType: 概念型
  aliases:
    - 声音由振动产生
  category: 概念
  explanation: 声音是由物体振动产生的。物体发声时都在振动，振动停止，声音也跟着停止。
  misconceptions:
    - 误认为声音靠敲击产生，实际声音由物体振动产生，振动停止声音也停止。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S1.md
- id: concept:科学:声音的传播
  type: Concept
  subject: 科学
  title: 声音的传播
  conceptType: 概念型
  aliases:
    - 声音的传播需要介质
  category: 概念
  explanation: 声音向四面八方传播，需要借助固体、液体或气体。玻璃罩里的空气被抽走后，闹钟的声音就听不见了，说明声音传播离不开这些物质。
  misconceptions:
    - 误认为声音在真空中也能传播，实际它需要借助固体、液体或气体。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S7.md
- id: concept:科学:声音的强弱
  type: Concept
  subject: 科学
  title: 声音的强弱
  conceptType: 概念型
  aliases:
    - 音量
    - 声音的大小
  category: 概念
  explanation: 声音的大小、轻重都指声音的强弱，也叫音量。用力越大，物体振动的幅度越大，声音就越强；用力越小，声音就越弱。
  misconceptions:
    - 误认为用力越大声音越高，实际用力影响的是振动幅度即强弱，音高由振动快慢决定。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S2.md
- id: concept:科学:声音的高低
  type: Concept
  subject: 科学
  title: 声音的高低
  conceptType: 概念型
  aliases:
    - 音调
  category: 概念
  explanation: 声音的高低叫音调。物体振动得越快，声音越高；振动得越慢，声音越低。比如尺子伸出桌面越长，振动越慢，声音越低。
  misconceptions:
    - 误认为声音高低由用力大小决定，实际由物体振动的快慢决定。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S3.md
- id: concept:科学:多种多样的动物
  type: Concept
  subject: 科学
  title: 多种多样的动物
  conceptType: 概念型
  aliases:
    - 周围的动物
  category: 概念
  explanation: 我们周围生活着很多动物，比如麻雀、蝴蝶、蚂蚁、蚯蚓。它们生活在不同的地方，种类多种多样。
  misconceptions:
    - 误认为动物都生活在同一种环境里，实际它们生活在不同地方，种类多种多样。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:大气圈
  type: Concept
  subject: 科学
  title: 大气圈
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球被一层厚厚的大气包围着，里面有氮气、氧气、水汽等，这层大气叫大气圈。风、云、雨、雪等天气现象都发生在靠近地面的大气里。
  misconceptions:
    - 误认为空气不属于地球的一部分，实际地球被大气圈包围，风、云都发生在这一层。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:天气对农业的影响
  type: Concept
  subject: 科学
  title: 天气对农业的影响
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 天气对农业生产很重要。适量的雨水和适宜的气温有利于庄稼生长，而干旱、暴雨、霜冻、冰雹等灾害天气会让农作物减产。
  misconceptions:
    - 误认为雨水越多越有利于庄稼，实际要适量，干旱、暴雨、霜冻都会造成损害。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S9.md
- id: concept:科学:天气对生活的影响
  type: Concept
  subject: 科学
  title: 天气对生活的影响
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 天气会影响人们的生活、学习和生产劳动。我们要根据天气预报提前做好准备，比如下雨带雨具、高温注意防暑，不同的人对天气的感受也不一样。
  misconceptions:
    - 误认为天气只影响穿什么，实际还影响出行、学习和生产劳动。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S8.md
- id: concept:科学:天气现象
  type: Concept
  subject: 科学
  title: 天气现象
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 天气现象是发生在大气中的阴、晴、雨、雪、风等情况。天气一直在变化，我们可以用词语和句子来描述它。
  misconceptions:
    - 误认为天气一旦形成就不再变化，实际天气一直在变，可以用阴、晴、雨、雪、风等词语描述。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:天气符号
  type: Concept
  subject: 科学
  title: 天气符号
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 天气符号是天气预报中用图形表示天气现象的符号，比如晴、小雨、大雪、台风等，认识符号才能看懂天气预报。
  misconceptions:
    - 误认为天气符号只是图形装饰，实际它用来表示晴、小雨、大雪、台风等天气现象。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S7.md
- id: concept:科学:天气预报
  type: Concept
  subject: 科学
  title: 天气预报
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 天气预报告诉我们未来一段时间的天气情况，内容包括最高气温、最低气温、晴转多云、风向风力等信息。可以通过广播、电视、手机查询。
  misconceptions:
    - 误认为预报只说明下不下雨，实际还包括最高最低气温、风力、晴转多云等内容。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S7.md
- id: concept:科学:天气预报的制作过程
  type: Concept
  subject: 科学
  title: 天气预报的制作过程
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 天气预报发布前要经过收集数据、科学计算、预报员作出预报、天气会商等阶段，再通过电视、广播等发布出来。
  misconceptions:
    - 误认为天气预报由仪器自动得出，实际要经过收集数据、科学计算、预报员作出预报、天气会商等阶段。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S9.md
- id: concept:科学:太阳东升西落
  type: Concept
  subject: 科学
  title: 太阳东升西落
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 一天中，太阳在天空中的位置不断变化，早晨从东方升起，傍晚向西落下。
  misconceptions:
    - 误认为太阳绕着地球转，实际这是地球自转造成的视运动。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:太阳是恒星
  type: Concept
  subject: 科学
  title: 太阳是恒星
  conceptType: 概念型
  aliases:
    - 发光发热的太阳
  category: 概念
  explanation: 太阳是太阳系的中心天体，是一颗能自己发光发热的恒星，表面温度约6000℃。它给地球带来光明和温暖，是地球重要的能量来源。
  misconceptions:
    - 误认为太阳是行星，实际它是太阳系的中心天体，是一颗能自己发光发热的恒星。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S5.md
- id: concept:科学:太阳系
  type: Concept
  subject: 科学
  title: 太阳系
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 太阳系是以太阳为中心的天体系统，太阳的质量约占整个太阳系的 99.86%，行星、卫星、小行星、彗星等都围绕太阳运行。
  misconceptions:
    - 误认为太阳系只有太阳和地球，实际包括行星、卫星、小行星等，太阳质量约占整个太阳系的 99.86%。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C3/sections/S1.md
- id: concept:科学:太阳系的八颗行星
  type: Concept
  subject: 科学
  title: 太阳系的八颗行星
  conceptType: 概念型
  aliases:
    - 行星
    - 太阳系的行星
  category: 概念
  explanation: 围绕太阳转动的行星有八颗，地球是其中一颗。按离太阳由近到远依次是水星、金星、地球、火星、木星、土星、天王星、海王星，它们大小和特点各不相同。
  misconceptions:
    - 误认为地球离太阳最近，实际由近到远依次是水星、金星、地球、火星等八颗。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S7.md
- id: concept:科学:太阳风
  type: Concept
  subject: 科学
  title: 太阳风
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 太阳会不停地向四面八方喷出带电的粒子流，就像吹不停的风，这就是太阳风。大部分太阳风都被地球磁场推开了。
  misconceptions:
    - 误认为太阳风是空气流动形成的风，实际它是太阳喷出的带电粒子流。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S10.md
- id: concept:科学:季节变化
  type: Concept
  subject: 科学
  title: 季节变化
  conceptType: 概念型
  aliases:
    - 四季变化
  category: 现象
  explanation: 一年有春、夏、秋、冬四个季节，不同季节里动植物的样子和人们的生活都不一样。
  misconceptions:
    - 误认为季节变化只影响气温，实际动植物的样子和人们的生活都会随之改变。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:安全剪刀的使用方法
  type: Concept
  subject: 科学
  title: 安全剪刀的使用方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 照图拿好剪刀，上下移动大拇指让剪刀开合，沿着画好的线剪，另一只手要离剪刀远一点。
  misconceptions:
    - 误认为另一只手靠近刀口扶纸更稳，实际另一只手要离剪刀远一点。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:安全用电
  type: Concept
  subject: 科学
  title: 安全用电
  conceptType: 概念型
  aliases:
    - 用电安全
  category: 观点
  explanation: 插座里的电来自发电厂，触碰会引发事故甚至危及生命，千万不能直接触摸，也不能用插座里的电做实验。实验时只能用干电池，看到断开或裸露的电线要马上报告大人。
  misconceptions:
    - 误认为插座里的电很弱不会伤人，实际直接触摸会引发事故甚至危及生命。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:安装照明电路
  type: Concept
  subject: 科学
  title: 安装照明电路
  conceptType: 程序型
  aliases:
    - 模拟安装照明电路
    - 设计照明电路
  category: 方法
  explanation: 安装照明电路要先设计方案：在平面图上标出电灯和开关的位置，画出电路图；再按图组装电路，最后检测电流能否通过、开关能否控制电灯、有没有短路。设计要合理，检测后还要改进。
  misconceptions:
    - 误认为把灯接亮就行，实际要先设计方案、画出电路图，再按图组装。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S8.md
- id: concept:科学:定滑轮
  type: Concept
  subject: 科学
  title: 定滑轮
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 固定在一个位置转动而不移动的滑轮叫定滑轮，比如旗杆顶部的滑轮。用定滑轮提升重物不省力，但可以改变用力的方向。
  misconceptions:
    - 误认为定滑轮能省力，实际它固定在一处转动，只改变用力方向而不省力。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:对比实验
  type: Concept
  subject: 科学
  title: 对比实验
  conceptType: 概念型
  aliases:
    - 对照实验
  category: 方法
  explanation: 研究一个条件的作用时，只改变这个条件，其他条件都保持一样，把两组结果放在一起比较。这样看到的差别才能确定是这个条件造成的。
  misconceptions:
    - 误认为可以同时改变几个条件，实际只改变要研究的那个条件，其他条件都保持一样。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S1.md
- id: concept:科学:导体和绝缘体
  type: Concept
  subject: 科学
  title: 导体和绝缘体
  conceptType: 概念型
  aliases:
    - 导电性
  category: 概念
  explanation: 容易让电流通过的物体叫导体，像金属、人体、大地等；不容易让电流通过的物体叫绝缘体，像塑料、橡胶、干木头等。导线的芯用金属做导体，外面包塑料做绝缘体，这样用电才安全。
  misconceptions:
    - 误认为人体不导电，实际金属、人体、大地都容易让电流通过，属于导体。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S6.md
- id: concept:科学:小孔成像
  type: Concept
  subject: 科学
  title: 小孔成像
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 光沿直线穿过小孔，会在后面的屏上形成倒立的像，《墨经》中就记录了这个实验。
  misconceptions:
    - 误认为小孔成的是正立的像，实际光沿直线穿过小孔会形成倒立的像。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S2.md
- id: concept:科学:小灯泡的结构
  type: Concept
  subject: 科学
  title: 小灯泡的结构
  conceptType: 概念型
  aliases:
    - 小灯泡的组成
  category: 概念
  explanation: 小灯泡由玻璃泡、金属架、灯丝和两个连接点组成。电流从灯丝通过时，小灯泡就会发光。
  misconceptions:
    - 误认为灯泡只要装上就发光，实际要电流通过灯丝并经两个连接点形成回路才会亮。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:小肠的消化作用
  type: Concept
  subject: 科学
  title: 小肠的消化作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 小肠又长又有很多皱褶，能和食物充分接触。它是消化食物和吸收营养的主要场所。
  misconceptions:
    - 误认为胃是吸收营养的主要场所，实际小肠才是消化食物和吸收营养的主要场所。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:小苏打和白醋的反应
  type: Concept
  subject: 科学
  title: 小苏打和白醋的反应
  conceptType: 概念型
  aliases:
    - 小苏打与白醋混合
  category: 现象
  explanation: 小苏打和白醋混合会产生二氧化碳气体，这是产生了新物质的化学变化。
  misconceptions:
    - 误认为冒气泡只是混合没有新物质，实际产生了二氧化碳，是化学变化。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S2.md
- id: concept:科学:小车的结构
  type: Concept
  subject: 科学
  title: 小车的结构
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 小车一般由车架、车轮、电池等部分组成，电池驱动小电动机产生动力。拆解小车模型可以认识各部分的结构和作用。
  misconceptions:
    - 误认为小车靠轮子自己转动前进，实际由电池驱动小电动机产生动力。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S1.md
- id: concept:科学:就地取材建造房屋
  type: Concept
  subject: 科学
  title: 就地取材建造房屋
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 各地人们用当地容易找到的材料盖房子，比如北极的冰屋、云南的竹楼和黄土高原的窑洞。
  misconceptions:
    - 误认为各地房屋样式是随意选择的，实际是用当地容易找到的材料，如冰屋、竹楼、窑洞。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S8.md
- id: concept:科学:岩石、沙和黏土的特征
  type: Concept
  subject: 科学
  title: 岩石、沙和黏土的特征
  conceptType: 概念型
  aliases:
    - 岩石、沙和黏土
  category: 概念
  explanation: 大块岩石碎裂会形成沙和黏土。岩石颗粒大而坚硬；沙颗粒较大，不能黏成团；黏土颗粒最小，摸起来滑腻，潮湿时黏性强，能团成小球。
  misconceptions:
    - 误认为沙和黏土是同一种东西，实际沙颗粒较大不能黏成团，黏土颗粒最小能黏成团。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S5.md
- id: concept:科学:岩石和土壤的用途
  type: Concept
  subject: 科学
  title: 岩石和土壤的用途
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 岩石和土壤是地球上的重要资源，用途很广：岩石可以铺路、建房、造雕塑，煤是重要的能源矿产，计算机芯片用的硅来自石英等矿物，植物从土壤中获得养分。
  misconceptions:
    - 误认为岩石只是没用的石头，实际可以铺路、建房、造雕塑，煤还是重要的能源。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S8.md
- id: concept:科学:岩石和土壤记录地球历史
  type: Concept
  subject: 科学
  title: 岩石和土壤记录地球历史
  conceptType: 概念型
  aliases:
    - 岩石和土壤的故事
  category: 概念
  explanation: 岩石和土壤是天然形成的，形成过程非常漫长，上面留下了大自然的痕迹。岩石中的生物痕迹能告诉我们过去有什么生物，岩石的化学成分能告诉我们地球的年龄，喜马拉雅山发现菊石化石说明那里几亿年前曾是海洋。
  misconceptions:
    - 误认为岩石只是静止不动的物体，实际上面留有生物痕迹，记录着地球的历史。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S1.md
- id: concept:科学:岩石由矿物组成
  type: Concept
  subject: 科学
  title: 岩石由矿物组成
  conceptType: 概念型
  aliases:
    - 岩石的组成
  category: 概念
  explanation: 所有的岩石都是由矿物组成的。花岗岩就是由石英、长石、云母三种矿物组成的，有的岩石只由一种矿物组成。
  misconceptions:
    - 误认为岩石是单一物质，实际所有岩石都由矿物组成，如花岗岩由石英、长石、云母组成。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S3.md
- id: concept:科学:岩石的分类
  type: Concept
  subject: 科学
  title: 岩石的分类
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地质学家按形成原因把岩石分为岩浆岩、沉积岩和变质岩三大类：岩浆冷却形成岩浆岩，沉积物压实固结形成沉积岩，岩石在高温高压下变成变质岩。
  misconceptions:
    - 误认为岩石只按颜色分类，实际地质学家按形成原因分为岩浆岩、沉积岩和变质岩。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S5.md
- id: concept:科学:岩石的风化
  type: Concept
  subject: 科学
  title: 岩石的风化
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 裸露在地表的岩石长期受到温度变化、水等自然因素的影响，会慢慢破碎、改变模样，冷热反复作用就能使岩石产生碎渣。
  misconceptions:
    - 误认为风化是瞬间碎裂，实际是长期受温度变化、水等自然因素影响慢慢破碎。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S5.md
- id: concept:科学:岩石软硬的判别标准
  type: Concept
  subject: 科学
  title: 岩石软硬的判别标准
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 能用指甲刻画出痕迹的是软；指甲刻不动但铜钥匙能刻动的是较软；铜钥匙刻不动但小刀能刻动的是较硬；小刀也刻不动的是硬。
  misconceptions:
    - 误认为用手掰一下就能判断软硬，实际按指甲、铜钥匙、小刀能否刻动来分级。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S2.md
- id: concept:科学:工具与技术的关系
  type: Concept
  subject: 科学
  title: 工具与技术的关系
  conceptType: 概念型
  aliases: []
  category: 观点
  explanation: 任何技术的背后都有科学原理支撑，工具和技术的发展是相互促进的，它们的不断改进共同推动着社会的发展。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S7.md
- id: concept:科学:工具的发展变化
  type: Concept
  subject: 科学
  title: 工具的发展变化
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 从古至今，工具在不断发展和改进，比如从毛笔到钢笔、从扁担背篼到手推车。不同的工具材料和作用不同，适用于不同的场景。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S1.md
- id: concept:科学:工程的限制条件
  type: Concept
  subject: 科学
  title: 工程的限制条件
  conceptType: 概念型
  aliases:
    - 限制条件
  category: 概念
  explanation: 工程要在时间、费用、材料、环境等条件的限制下完成，设计时要同时满足这些要求和约束。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C1/sections/S2.md
- id: concept:科学:工程要考虑的因素
  type: Concept
  subject: 科学
  title: 工程要考虑的因素
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 设计一项工程要考虑建在哪里、用什么材料、成本多少、是否安全稳固等因素，要兼顾实用和节省。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:工程设计的基本步骤
  type: Concept
  subject: 科学
  title: 工程设计的基本步骤
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 完成一项工程任务的基本步骤是：明确任务、制订方案、实施方案、测试与改进、展示与交流。根据测试结果要不断调整改进作品。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S6.md
- id: concept:科学:常见材料
  type: Concept
  subject: 科学
  title: 常见材料
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 我们身边的物品常用金属、塑料、玻璃、布、纸、木、陶瓷等材料做成，有的物品还组合了几种材料。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:常见的岩石
  type: Concept
  subject: 科学
  title: 常见的岩石
  conceptType: 概念型
  aliases:
    - 花岗岩、砂岩、大理岩
  category: 概念
  explanation: 花岗岩、砂岩和大理岩是三种常见的岩石。它们在颜色、颗粒、光泽、软硬等特征上各不相同，观察这些特征就能区分和描述岩石。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S2.md
- id: concept:科学:平衡膳食
  type: Concept
  subject: 科学
  title: 平衡膳食
  conceptType: 概念型
  aliases:
    - 营养均衡
  category: 概念
  explanation: 每天要参照平衡膳食宝塔合理搭配食物，谷类、蔬菜水果、肉蛋奶等按合适的比例食用，营养才均衡。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:开关的作用
  type: Concept
  subject: 科学
  title: 开关的作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 开关连在电路里，可以控制电流的通和断：接通开关，电流通过，用电器工作；断开开关，电流中断，用电器停止工作。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:弹力
  type: Concept
  subject: 科学
  title: 弹力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 物体受到外力时形状会发生改变，这时它会产生一个要恢复原来形状的力，这个力叫弹力。橡皮筋缠绕圈数越多，拉伸越长，弹力越大。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S3.md
- id: concept:科学:弹簧测力计
  type: Concept
  subject: 科学
  title: 弹簧测力计
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 弹簧测力计是测量力的大小的工具，由提环、弹簧、指针和刻度组成。拉力越大，弹簧伸得越长，指针示数越大，但用力不能超过它的测量范围。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S4.md
- id: concept:科学:影响摆动快慢的因素
  type: Concept
  subject: 科学
  title: 影响摆动快慢的因素
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 摆的快慢与摆绳长度有关，摆绳越长摆动越慢、越短越快；与摆锤质量无关。可以据此调试出 1 分钟摆动 60 次的摆。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S6.md
- id: concept:科学:影响生长发育的因素
  type: Concept
  subject: 科学
  title: 影响生长发育的因素
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 遗传、饮食习惯、运动、睡眠等都会影响我们的生长发育。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:影子的变化规律
  type: Concept
  subject: 科学
  title: 影子的变化规律
  conceptType: 概念型
  aliases:
    - 一天中影子的变化
  category: 现象
  explanation: 一天中，太阳的位置在不断变化，阳光下物体的影子也会跟着变化：影子总是在背着太阳的一侧，方向和长短都随时间有规律地改变。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S6.md
- id: concept:科学:影子的形成
  type: Concept
  subject: 科学
  title: 影子的形成
  conceptType: 概念型
  aliases:
    - 影子是怎样形成的
  category: 现象
  explanation: 光照射到不透明的物体上，光被挡住，物体背光的一侧就会形成影子。产生影子需要光、物体和挡住光的条件。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S6.md
- id: concept:科学:影长的四季变化
  type: Concept
  subject: 科学
  title: 影长的四季变化
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 一年中正午影长有规律地变化：夏至太阳最高、影长最短，冬至太阳最低、影长最长，与太阳高度有关。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S5.md
- id: concept:科学:微生物
  type: Concept
  subject: 科学
  title: 微生物
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 微生物是个体非常微小、要用显微镜才能看到的生物，包括酵母菌、霉菌、细菌、病毒等。有些微生物能帮我们制造食品、处理垃圾，有些却会让食物霉变、引起疾病。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S7.md
- id: concept:科学:恐龙化石
  type: Concept
  subject: 科学
  title: 恐龙化石
  conceptType: 概念型
  aliases:
    - 恐龙足迹化石
  category: 概念
  explanation: 恐龙化石是很久以前留下的恐龙骨骼或足迹，被大自然保存下来。科学家通过研究化石，可以知道恐龙的样子、怎么走路、怎么生活。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C1/sections/S9.md
- id: concept:科学:情绪
  type: Concept
  subject: 科学
  title: 情绪
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 人有快乐、愤怒、悲伤、恐惧等情绪，情绪会影响健康；遇到过度紧张等情绪问题时，要学会调节并向他人求助。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S6.md
- id: concept:科学:感觉器官
  type: Concept
  subject: 科学
  title: 感觉器官
  conceptType: 概念型
  aliases:
    - 感官
  category: 概念
  explanation: 眼睛、耳朵、鼻子、舌头和皮肤是我们的感觉器官。在玩游戏时，它们帮助我们看、听、闻、摸，作出反应。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S3.md
- id: concept:科学:我国农具的发展
  type: Concept
  subject: 科学
  title: 我国农具的发展
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 我国农具从原始的石斧、木棒，发展到磨制的石镰，再到铁制农具和牛耕，如今有了先进的农业机械。农具的改进让农业生产效率不断提高。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S9.md
- id: concept:科学:拉力
  type: Concept
  subject: 科学
  title: 拉力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 朝自己身边方向用力叫拉力，比如拉动小车、拉开门。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:拼接化石的方法
  type: Concept
  subject: 科学
  title: 拼接化石的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 先按形状给骨骼化石分类，想一想它属于身体的哪个部位，再对照图片把骨骼拼起来，拼好后还要检查和调整。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:指南针的使用方法
  type: Concept
  subject: 科学
  title: 指南针的使用方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把指南针放平，等磁针静止后，转动刻度盘让南北方向和磁针一致，刻度盘上的方向就是实际的方向。红色磁针一端指北，白色一端指南。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S8.md
- id: concept:科学:振动
  type: Concept
  subject: 科学
  title: 振动
  conceptType: 概念型
  aliases:
    - 物体振动
  category: 概念
  explanation: 振动是物体不断重复做往复运动的状态。拨动的橡皮筋、敲响的鼓面都在振动。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S1.md
- id: concept:科学:推力
  type: Concept
  subject: 科学
  title: 推力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 把物体往外推出去的力叫推力，比如推动小车、推开门。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:摄氏度
  type: Concept
  subject: 科学
  title: 摄氏度
  conceptType: 概念型
  aliases:
    - ℃
  category: 概念
  explanation: 摄氏度是常用的温度单位，用符号℃表示。比如38℃读作三十八摄氏度，-4℃读作零下四摄氏度。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:摆的等时性
  type: Concept
  subject: 科学
  title: 摆的等时性
  conceptType: 概念型
  aliases:
    - 单摆的等时性
  category: 法则
  explanation: 同一个摆来回摆动一次所用的时间相同；摆长越长周期越长，与摆球的质量无关。伽利略发现了这一规律，为摆钟的发明奠定了基础。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S9.md
- id: concept:科学:摆的运动特点
  type: Concept
  subject: 科学
  title: 摆的运动特点
  conceptType: 概念型
  aliases:
    - 钟摆
  category: 概念
  explanation: 摆由摆绳和摆锤组成，同一个摆在相同时间内摆动的次数相同；摆幅会慢慢变小，但摆动的快慢不变。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S5.md
- id: concept:科学:摩擦力
  type: Concept
  subject: 科学
  title: 摩擦力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 一个物体在另一个物体表面运动时，接触面会阻碍物体的运动，这种力叫摩擦力。接触面越粗糙、物体越重，摩擦力越大。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S5.md
- id: concept:科学:放大镜的放大原理
  type: Concept
  subject: 科学
  title: 放大镜的放大原理
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 放大镜的镜片是凸透镜，中央厚、边缘薄，能把物体的图像放大，让我们看清人眼不容易看清的细微之处。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:斜面
  type: Concept
  subject: 科学
  title: 斜面
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 斜面是像搭在货车上的长木板那样的简单机械，沿斜面把重物推上高处比直接提升省力。坡度越缓越省力，斜面越长坡度越缓。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S4.md
- id: concept:科学:日食
  type: Concept
  subject: 科学
  title: 日食
  conceptType: 概念型
  aliases:
    - 日蚀
  category: 现象
  explanation: 月球运行到太阳和地球之间，挡住太阳射向地球的光，就形成了日食。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C3/sections/S3.md
- id: concept:科学:昆虫的特征
  type: Concept
  subject: 科学
  title: 昆虫的特征
  conceptType: 概念型
  aliases:
    - 昆虫的身体结构
  category: 概念
  explanation: 昆虫的身体分为头、胸、腹三部分，头部长有触角，胸部长有三对足。蚕蛾、蝴蝶、蚂蚁、蜻蜓都是昆虫，蜘蛛不是。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S6.md
- id: concept:科学:星座
  type: Concept
  subject: 科学
  title: 星座
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 人们把天空划分成不同的区域，根据星星的形态想象成形并命名，这些区域就是星座，全天共划分为 88 个星座。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C3/sections/S4.md
- id: concept:科学:昼夜交替
  type: Concept
  subject: 科学
  title: 昼夜交替
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 白昼和黑夜交替出现，可以提出不同的假说来解释，并借助地球模型做模拟实验来验证。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C3/sections/S2.md
- id: concept:科学:显微镜的放大原理
  type: Concept
  subject: 科学
  title: 显微镜的放大原理
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 一个凸透镜的放大倍数有限，把两个凸透镜平行重叠组合起来，可以把物体的图像放得更大更清晰，这就是显微镜的基本原理。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:暴雨预警
  type: Concept
  subject: 科学
  title: 暴雨预警
  conceptType: 概念型
  aliases:
    - 暴雨预警信号
  category: 概念
  explanation: 暴雨到来之前，气象部门会发出预警，分为蓝色、黄色、橙色、红色四级，级别越高雨越大。收到预警要少外出，注意安全。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:曲线运动
  type: Concept
  subject: 科学
  title: 曲线运动
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 物体沿着弯曲路径的运动叫曲线运动，比如汽车转弯、荡秋千时的运动。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S3.md
- id: concept:科学:月亮形状的变化
  type: Concept
  subject: 科学
  title: 月亮形状的变化
  conceptType: 概念型
  aliases:
    - 月亮圆缺变化
  category: 现象
  explanation: 月亮的形状每天都在变化，有时圆、有时弯，不是每天都能看见月亮。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S7.md
- id: concept:科学:月球是地球的卫星
  type: Concept
  subject: 科学
  title: 月球是地球的卫星
  conceptType: 概念型
  aliases:
    - 地球的卫星
  category: 概念
  explanation: 月球围绕着地球转动，是地球唯一的天然卫星。它自己不会发光，我们看到的月光是它反射的太阳光。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S3.md
- id: concept:科学:月球表面的特点
  type: Concept
  subject: 科学
  title: 月球表面的特点
  conceptType: 概念型
  aliases:
    - 月海
  category: 概念
  explanation: 月球表面没有水和大气，也没有生物，昼夜温差很大。表面有明有暗，暗色的斑块叫月海，其实是低洼的平原，并不是海。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S3.md
- id: concept:科学:月球车的设计
  type: Concept
  subject: 科学
  title: 月球车的设计
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 月球车的设计要适应月球的环境：轮子材料要耐高温抗低温，太阳翼能发电也能保温，还要防月尘、能爬坡越障。探月任务决定了月球车的模样。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S8.md
- id: concept:科学:木质茎和草质茎
  type: Concept
  subject: 科学
  title: 木质茎和草质茎
  conceptType: 概念型
  aliases:
    - 木质茎
    - 草质茎
  category: 概念
  explanation: 茎秆坚硬、大部分由木质部组成的叫木质茎，如油松；茎柔软易折断、常呈绿色的叫草质茎，如狗尾草。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:材料
  type: Concept
  subject: 科学
  title: 材料
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 用来建造东西或做物品的东西叫材料，比如干草、泥、砖和木头。动物和人都用材料建造自己的家。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:材料的导热性能
  type: Concept
  subject: 科学
  title: 材料的导热性能
  conceptType: 概念型
  aliases:
    - 导热性
  category: 性质
  explanation: 不同材料传热的快慢不同：金属传热快，木头、塑料传热慢。传热快慢不同的材料在生活中有不同的用途，比如锅身用金属、锅柄用塑料。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C4/sections/S6.md
- id: concept:科学:杠杆
  type: Concept
  subject: 科学
  title: 杠杆
  conceptType: 概念型
  aliases:
    - 撬杠
  category: 概念
  explanation: 像撬杠这样能绕固定点转动的棍子就是杠杆。杠杆上有三个重要位置：支撑转动的支点、用力的用力点和阻碍转动的阻力点，用力点离支点越远往往越省力。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S2.md
- id: concept:科学:果实的结构
  type: Concept
  subject: 科学
  title: 果实的结构
  conceptType: 概念型
  aliases:
    - 果皮和种子
  category: 概念
  explanation: 果实由果皮和种子组成。果皮保护里面的种子，有的果皮还能帮助种子传播；种子落在适宜的环境里能长成新的植物。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S6.md
- id: concept:科学:根据证据推测
  type: Concept
  subject: 科学
  title: 根据证据推测
  conceptType: 推理型
  aliases:
    - 推测
  category: 方法
  explanation: 不能直接看到的东西，可以靠留下的痕迹去推测它的样子。比如根据恐龙骨骼化石，再参考现在的动物，推测恐龙原来的模样。
  misconceptions:
    - 误认为推测可以凭想象，实际要根据留下的痕迹（如化石）并参考现在的动物来推断。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C1/sections/S5.md
- id: concept:科学:根的作用
  type: Concept
  subject: 科学
  title: 根的作用
  conceptType: 概念型
  aliases:
    - 植物根的作用
  category: 概念
  explanation: 根能吸收土壤里的水分和养料，还能把植物固定在土壤里，使植物不容易倒下或被风吹走。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:检验食物营养的方法
  type: Concept
  subject: 科学
  title: 检验食物营养的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把食物涂在纸上留下不会消失的油迹，说明含有脂肪；在食物上滴碘酒变蓝紫色，说明含有淀粉。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:植物开花与阳光
  type: Concept
  subject: 科学
  title: 植物开花与阳光
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 许多植物开花受阳光的“指挥”，菊花要等秋天白天变短了才开花。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S9.md
- id: concept:科学:植物生长的地方
  type: Concept
  subject: 科学
  title: 植物生长的地方
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 植物大多长在土壤里，土壤能固定植物，还能提供水分和养分。有的植物也能长在水里。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:植物生长需要阳光
  type: Concept
  subject: 科学
  title: 植物生长需要阳光
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 把绿豆苗分别种在阳光充足和黑暗的地方，阳光下的苗长得高、茎粗、叶绿。说明植物的生长离不开阳光。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:植物的变化
  type: Concept
  subject: 科学
  title: 植物的变化
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 植物在生长过程中会慢慢长大、长出叶子、开花结果。把植物的变化记录下来，就能发现它每天都在变。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:植物的生命周期
  type: Concept
  subject: 科学
  title: 植物的生命周期
  conceptType: 概念型
  aliases:
    - 凤仙花的一生
  category: 概念
  explanation: 凤仙花从播种、发芽、长出茎叶、开花、结果，到果实开裂结出新的种子，最后枯死，完成一个生命周期。整理生长记录就能发现植物生长变化的规律。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S8.md
- id: concept:科学:植物的需要
  type: Concept
  subject: 科学
  title: 植物的需要
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 植物生长需要水、阳光和空气。我们要按时给植物浇水，让它晒到太阳。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:模拟实验
  type: Concept
  subject: 科学
  title: 模拟实验
  conceptType: 建模型
  aliases:
    - 模拟实验法
  category: 方法
  explanation: 用细沙模拟月壤，用大小不同的球撞击沙面，模拟出大小、深浅不同的“环形山”。借助模拟实验可以研究看不清或去不了的地方。
  misconceptions:
    - 误认为模拟实验的结果就是真实情况，实际它只是借助模型研究看不清或去不了的对象。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S4.md
- id: concept:科学:次声波
  type: Concept
  subject: 科学
  title: 次声波
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 每秒振动低于 20 次的声音叫次声波，人耳也听不到。它传播距离比较远，可以用来预测地质灾害。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S10.md
- id: concept:科学:比较液体流动快慢
  type: Concept
  subject: 科学
  title: 比较液体流动快慢
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 让水和食用油同时开始流动，流动时间一样，看谁流得更远更快。水比食用油流得快。
  misconceptions:
    - 误认为黏稠的液体流得快，实际水比食用油流得快。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S6.md
- id: concept:科学:比较溶解能力
  type: Concept
  subject: 科学
  title: 比较溶解能力
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 要用同样多的水，把不同物质一份一份地加入，等前一份完全溶解再加下一份，直到加不进去为止，就能比较它们的溶解能力。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:比较物体轻重
  type: Concept
  subject: 科学
  title: 比较物体轻重
  conceptType: 程序型
  aliases:
    - 掂一掂
    - 称一称
  category: 方法
  explanation: 可以先猜一猜，再用手掂一掂，最后用天平称一称。称一称的结果最准确。
  misconceptions:
    - 误认为用手掂一掂最准确，实际用天平称一称的结果最准确。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:比较的方法
  type: Concept
  subject: 科学
  title: 比较的方法
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 比较是把事物按同一个标准排一排、对照看一看。比如按颜色深浅给三杯酱油水排序，就知道哪杯酱油多。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:比较磁力大小的方法
  type: Concept
  subject: 科学
  title: 比较磁力大小的方法
  conceptType: 程序型
  aliases:
    - 比较磁铁力量的大小
  category: 方法
  explanation: 可以让不同的磁铁吸引大头针或垫圈，谁吸的数量多，谁的力量就大；也可以用磁铁吸弹簧，看弹簧被拉得多长来比较。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:气体交换
  type: Concept
  subject: 科学
  title: 气体交换
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 呼吸其实是在进行气体交换：空气中的氧气进入血液，身体产生的二氧化碳被排出去。气体交换主要在肺里进行。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S3.md
- id: concept:科学:气温计
  type: Concept
  subject: 科学
  title: 气温计
  conceptType: 概念型
  aliases:
    - 温度计
  category: 概念
  explanation: 气温计是用来测量气温的工具，由刻度、液柱和玻璃泡组成。用它测量气温，能比人的感觉更准确。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:气温计的使用方法
  type: Concept
  subject: 科学
  title: 气温计的使用方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 测量气温时，要把气温计放在阳光照不到、空气流通、离地面约1.5米的地方，不要用手摸玻璃泡，等液柱稳定后再平视读数。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:气温计读数
  type: Concept
  subject: 科学
  title: 气温计读数
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读气温计时，眼睛要平视液柱顶端，先看液柱指在0℃以上还是以下，再正确读出和记录温度。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:水循环
  type: Concept
  subject: 科学
  title: 水循环
  conceptType: 概念型
  aliases:
    - 水循环现象
  category: 现象
  explanation: 水在固态、液态和气态之间不断循环变化：水蒸发变成水汽升上天空，再通过降雨、降雪回到地面。比如青藏高原的冰川、河流就这样循环着。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S9.md
- id: concept:科学:水的三态变化
  type: Concept
  subject: 科学
  title: 水的三态变化
  conceptType: 概念型
  aliases:
    - 水的三态
  category: 概念
  explanation: 水有固态、液态、气态三种状态，它们是同一种物质，可以互相转化：水在0℃结冰，加热到100℃沸腾变成水蒸气，又能变回液态的水。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:水的特征
  type: Concept
  subject: 科学
  title: 水的特征
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 水没有颜色、没有气味，也没有固定的形状，放进什么容器就是什么形状。水还会流动。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S5.md
- id: concept:科学:水的阻力
  type: Concept
  subject: 科学
  title: 水的阻力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 船在水中行驶时会受到水的阻力，阻力越小船走得越快。流线型的船体受到的阻力比较小。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:水结冰
  type: Concept
  subject: 科学
  title: 水结冰
  conceptType: 概念型
  aliases:
    - 凝固
  category: 现象
  explanation: 水的温度降到0℃时会结冰，从液态变成固态。冰是固体，有固定的形状，不能流动。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S4.md
- id: concept:科学:水钟
  type: Concept
  subject: 科学
  title: 水钟
  conceptType: 概念型
  aliases:
    - 刻漏
    - 漏壶
    - 铜壶滴漏
  category: 概念
  explanation: 利用水流计时的工具叫水钟，关键是让水匀速滴漏，分为记录水漏完时间的泄水型和记录水装满时间的受水型两种。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S2.md
- id: concept:科学:沉积作用
  type: Concept
  subject: 科学
  title: 沉积作用
  conceptType: 概念型
  aliases:
    - 堆积作用
  category: 概念
  explanation: 被侵蚀的泥沙等物质被流水带到下游，流速变慢后堆积下来，这个过程叫沉积作用，也叫堆积作用，河流中下游的沙洲就是这样形成的。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S6.md
- id: concept:科学:河外星系
  type: Concept
  subject: 科学
  title: 河外星系
  conceptType: 概念型
  aliases:
    - 银河系以外的星系
  category: 概念
  explanation: 银河系以外还有许多像银河系一样庞大的恒星集团，如仙女座星系，它们大小不一、形状各异，都在高速运动。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C3/sections/S6.md
- id: concept:科学:沸腾
  type: Concept
  subject: 科学
  title: 沸腾
  conceptType: 概念型
  aliases:
    - 沸腾现象
  category: 现象
  explanation: 水加热到100℃左右时会不停地翻滚冒泡，温度不再升高，这种现象叫沸腾。沸腾时产生的大量"白气"，是水蒸气遇冷变成的小水珠。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S3.md
- id: concept:科学:测试和改进
  type: Concept
  subject: 科学
  title: 测试和改进
  conceptType: 程序型
  aliases:
    - 反思改进
  category: 方法
  explanation: 作品做好后，要照着要求测试一下，看看有没有达到目标，再找出问题、想办法改进，让它做得更好。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S6.md
- id: concept:科学:浮力
  type: Concept
  subject: 科学
  title: 浮力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 像橡皮泥这样会下沉的材料，做成船形后在水里受到的浮力增大了，所以也能漂浮。浮力是水托起物体向上的力。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:海洋和陆地的面积
  type: Concept
  subject: 科学
  title: 海洋和陆地的面积
  conceptType: 概念型
  aliases:
    - 海洋面积大于陆地
  category: 概念
  explanation: 地球表面大部分是海洋，海洋的面积比陆地大得多，约占地球表面的71%。淡水资源却很少，我们要节约用水。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S2.md
- id: concept:科学:消化器官
  type: Concept
  subject: 科学
  title: 消化器官
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 牙齿、口腔、食管、胃、小肠、大肠都是消化器官，它们分工合作，把食物消化成营养并吸收，把废物排出体外。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S9.md
- id: concept:科学:温室效应
  type: Concept
  subject: 科学
  title: 温室效应
  conceptType: 概念型
  aliases:
    - 全球变暖
  category: 概念
  explanation: 人类大量燃烧煤、石油和天然气，使大气中二氧化碳增多，地表附近的气温随之上升，这种增温效果就像栽培植物的温室。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S5.md
- id: concept:科学:溶解
  type: Concept
  subject: 科学
  title: 溶解
  conceptType: 概念型
  aliases:
    - 溶解现象
  category: 概念
  explanation: 把食盐等物质放进水里搅拌，它会均匀地分散在水里看不见了，这就是溶解。不同的物质在水里的溶解量不一样。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:潜望镜的原理
  type: Concept
  subject: 科学
  title: 潜望镜的原理
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 在“之”形通道的两个转角处各放一块平面镜，光经过两次反射实现“拐弯”，就能看到遮挡物另一侧的物体。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:火山喷发
  type: Concept
  subject: 科学
  title: 火山喷发
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 火山喷发是地球内部炽热的岩浆等物质从地壳薄弱处喷出地面的自然现象，它会剧烈地改变地表，形成火山锥、火山口湖等地貌。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S2.md
- id: concept:科学:点亮小灯泡的方法
  type: Concept
  subject: 科学
  title: 点亮小灯泡的方法
  conceptType: 程序型
  aliases:
    - 电池与小灯泡的连接
  category: 方法
  explanation: 用导线把电池和小灯泡的两个连接点连起来，让电流从电池正极出发经过灯丝流回负极，小灯泡才能亮起来。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:热传导
  type: Concept
  subject: 科学
  title: 热传导
  conceptType: 概念型
  aliases:
    - 传导
  category: 现象
  explanation: 热沿着物体从温度高的部分传到温度低的部分，比如加热金属条中部，两端的蜡会先后熔化。金属是容易传热的材料。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C4/sections/S4.md
- id: concept:科学:热传递
  type: Concept
  subject: 科学
  title: 热传递
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 温度不同的物体相互接触时，热量总是从温度高的物体传向温度低的物体，直到两者的温度相同为止，比如凉牛奶浸在热水里会变热。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C4/sections/S3.md
- id: concept:科学:热对流
  type: Concept
  subject: 科学
  title: 热对流
  conceptType: 概念型
  aliases:
    - 对流
  category: 现象
  explanation: 给水底部加热时，受热的水变轻向上流，较冷的水流下来补充，水循环流动把热传到各处。房间里的空气变暖也是这个道理。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C4/sections/S5.md
- id: concept:科学:热空气会上升
  type: Concept
  subject: 科学
  title: 热空气会上升
  conceptType: 概念型
  aliases:
    - 热空气上升
  category: 现象
  explanation: 空气受热后会变轻并上升。用蜡烛加热塑料袋里的空气，袋子感觉到要上升时松手，它就能像热气球一样升起来。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S6.md
- id: concept:科学:热胀冷缩
  type: Concept
  subject: 科学
  title: 热胀冷缩
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 很多物体受热时体积会变大，遇冷时体积会变小，这种现象叫热胀冷缩。比如温度计的液柱受热上升、遇冷下降。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S4.md
- id: concept:科学:煤的形成
  type: Concept
  subject: 科学
  title: 煤的形成
  conceptType: 概念型
  aliases:
    - 煤的形成过程
  category: 概念
  explanation: 远古的植物大量堆积，被泥沙层层掩埋，在地底高温高压的环境下经过亿万年慢慢变成了煤。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S5.md
- id: concept:科学:熔化
  type: Concept
  subject: 科学
  title: 熔化
  conceptType: 概念型
  aliases:
    - 融化
  category: 现象
  explanation: 冰受热后从固体变成液体，变成水，这个过程叫熔化。给冰加热、用手捂、吹热气都能让冰熔化。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:牙齿的种类和作用
  type: Concept
  subject: 科学
  title: 牙齿的种类和作用
  conceptType: 概念型
  aliases:
    - 门齿
    - 犬齿
    - 臼齿
  category: 概念
  explanation: 按形状分，牙齿有门齿、犬齿和臼齿：门齿切断食物，犬齿撕裂食物，臼齿研磨食物。它们分工合作，把食物嚼碎。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S5.md
- id: concept:科学:物体的形状与滚动
  type: Concept
  subject: 科学
  title: 物体的形状与滚动
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 物体形状不同，能不能滚动也不一样。圆的物体容易滚动，方的物体容易叠放稳当。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:物体的特征
  type: Concept
  subject: 科学
  title: 物体的特征
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 每个物体都有自己的特征，比如颜色、形状、大小、软硬、光滑还是粗糙。观察物体就是找出它的这些特点。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S1.md
- id: concept:科学:物理变化
  type: Concept
  subject: 科学
  title: 物理变化
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 没有产生新物质的变化叫物理变化，如白砂糖、食盐溶在水里，物质本身没有变成别的物质。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S2.md
- id: concept:科学:物质的变化
  type: Concept
  subject: 科学
  title: 物质的变化
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 物质总是在不断地变化，有些变化只改变物质的大小、形态，有些变化会产生新物质。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S1.md
- id: concept:科学:环境问题
  type: Concept
  subject: 科学
  title: 环境问题
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 大气污染、水污染、固体废弃物污染、噪声污染等都是地球面临的环境问题，其中很多是人类不合理的活动造成的，会危害生物和人类健康。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S2.md
- id: concept:科学:环形山
  type: Concept
  subject: 科学
  title: 环形山
  conceptType: 概念型
  aliases:
    - 陨石坑
  category: 概念
  explanation: 月球表面有许多大大小小的圆形坑，叫环形山。它们大多数是由太空中的石块撞击月面形成的。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C3/sections/S4.md
- id: concept:科学:生态系统
  type: Concept
  subject: 科学
  title: 生态系统
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 群落里的生物和环境中的水、土壤、阳光等非生物相互联系、相互影响，构成一个整体，这就是生态系统。生态瓶就是模拟的小型生态系统。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S7.md
- id: concept:科学:生物
  type: Concept
  subject: 科学
  title: 生物
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 动物、植物和我们人都有生命，都要吃食物、会长大，这样的东西叫生物。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C2/sections/S6.md
- id: concept:科学:生物多样性
  type: Concept
  subject: 科学
  title: 生物多样性
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 一个区域内动植物种类的丰富程度叫生物多样性，种类越多说明生物越丰富。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:生物多样性的调查方法
  type: Concept
  subject: 科学
  title: 生物多样性的调查方法
  conceptType: 程序型
  aliases:
    - 生物调查
  category: 方法
  explanation: 调查生物多样性可以先按环境划分区域，再分小组统计每个区域内生物的种类和数量，并做好记录。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:生物时钟
  type: Concept
  subject: 科学
  title: 生物时钟
  conceptType: 概念型
  aliases:
    - 化石钟
  category: 概念
  explanation: 生物体上会留下时间的痕迹，如树木年轮、贝壳和珊瑚化石的生长纹、龟甲环纹，可以用来推测生物的年龄和地球的历史。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S7.md
- id: concept:科学:生长发育的信息
  type: Concept
  subject: 科学
  title: 生长发育的信息
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 通过身高、体重、肺活量、视力等数据，可以了解自己这些年身体的生长变化情况。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:生长的证据
  type: Concept
  subject: 科学
  title: 生长的证据
  conceptType: 概念型
  aliases:
    - 长大的证据
  category: 概念
  explanation: 个子变高、体重变重、换牙齿、旧衣服变小等，都能证明我们在长大。这些就是长大的证据。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S2.md
- id: concept:科学:用太阳辨认方向
  type: Concept
  subject: 科学
  title: 用太阳辨认方向
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 早晨起来面向太阳，前面是东，后面是西，左面是北，右面是南。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:用工具测量长度
  type: Concept
  subject: 科学
  title: 用工具测量长度
  conceptType: 程序型
  aliases:
    - 测量长度
  category: 方法
  explanation: 可以用软尺直接量物体的长度，也可以借助绳子或身体来量弯曲的、不好量的地方，然后把结果记下来。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:用方向和距离描述位置
  type: Concept
  subject: 科学
  title: 用方向和距离描述位置
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 描述一个物体的位置，要说清方向和距离。方向可以用前、后、左、右、上、下表示，距离可以用米、厘米或步数来估计。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S1.md
- id: concept:科学:用气味辨别物品
  type: Concept
  subject: 科学
  title: 用气味辨别物品
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 鼻子闻一闻气味，可以分辨不同的物品。但要注意，不能随便闻陌生或刺鼻的东西。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S4.md
- id: concept:科学:用水分离物质
  type: Concept
  subject: 科学
  title: 用水分离物质
  conceptType: 程序型
  aliases:
    - 分离食盐和沙子
  category: 方法
  explanation: 利用水能溶解食盐又能蒸发的方法可以分离沙子和食盐：先溶解、再过滤去掉沙子、最后把水蒸干，就得到盐了。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S8.md
- id: concept:科学:用浮的材料造船
  type: Concept
  subject: 科学
  title: 用浮的材料造船
  conceptType: 概念型
  aliases:
    - 竹筏
    - 木排
  category: 方法
  explanation: 像竹筏、木排那样，用能漂浮的材料加大在水面的接触面积，比独木舟更稳定、能装更多货物，但要注意捆扎牢固、防止进水。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:用磁铁辨别方向
  type: Concept
  subject: 科学
  title: 用磁铁辨别方向
  conceptType: 程序型
  aliases:
    - 利用磁铁辨别方向
  category: 方法
  explanation: 让磁铁悬挂起来或浮在水面上，它能水平自由旋转，静止后一端指南、一端指北，我们就能据此确定方向。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:用自然物辨别方向
  type: Concept
  subject: 科学
  title: 用自然物辨别方向
  conceptType: 概念型
  aliases:
    - 利用自然物辨别方向
  category: 方法
  explanation: 太阳有规律地运动，影响身边的事物：向阳面树叶多、雪化得快，苔藓喜欢长在阴暗潮湿的地方。观察这些自然物的特点，就能大致判断南北方向。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S2.md
- id: concept:科学:电源
  type: Concept
  subject: 科学
  title: 电源
  conceptType: 概念型
  aliases:
    - 电的来源
  category: 概念
  explanation: 生活中使用的电都是由电源提供的。电灯、洗衣机等由发电厂通过电网供电，手机、石英钟等由电池供电。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:电路检测器
  type: Concept
  subject: 科学
  title: 电路检测器
  conceptType: 概念型
  aliases:
    - 电路故障检测
  category: 方法
  explanation: 把简易电路中的开关拆掉，就做成了一个电路检测器。用它接触电路的各个部分，看小灯泡亮不亮，就能找出电路的故障在哪里。它只能检测干电池电路，不能检测家用电路。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S4.md
- id: concept:科学:电路的组成
  type: Concept
  subject: 科学
  title: 电路的组成
  conceptType: 概念型
  aliases:
    - 简易电路
    - 闭合回路
  category: 概念
  explanation: 一个能正常工作的电路由电源、导线、小灯泡等用电器和开关组成。电流从电池一端流出，经过小灯泡回到电池另一端，形成一个闭合的回路。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:画植物记录的方法
  type: Concept
  subject: 科学
  title: 画植物记录的方法
  conceptType: 程序型
  aliases:
    - 给植物画像的方法
  category: 方法
  explanation: 给植物画像时要写出它的名称，画出它长在哪里、长什么样子。这样画出的记录别人才能认出来。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:疫苗
  type: Concept
  subject: 科学
  title: 疫苗
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 疫苗是用特殊微生物制成的免疫制剂，接种后能激活免疫系统。当病原体再次入侵时，有记忆能力的免疫系统会迅速识别并清除它。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S9.md
- id: concept:科学:病毒
  type: Concept
  subject: 科学
  title: 病毒
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 病毒比细菌更小，没有细胞结构，不能独立生存，必须寄生在其他生物的活细胞内，一旦离开活细胞就很容易死亡。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S7.md
- id: concept:科学:百叶箱
  type: Concept
  subject: 科学
  title: 百叶箱
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 百叶箱是安放气温计的白色箱子，放在通风良好、不受阳光直射的草坪上，这样测出的气温更准确。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:皮肤的作用
  type: Concept
  subject: 科学
  title: 皮肤的作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 皮肤能感受到冷、热、痛、痒，还会把这些信息告诉大脑。它像保护罩一样保护身体，还能靠出汗调节体温。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S9.md
- id: concept:科学:直根系和须根系
  type: Concept
  subject: 科学
  title: 直根系和须根系
  conceptType: 概念型
  aliases:
    - 根的种类
  category: 概念
  explanation: 像凤仙花那样有一条明显主根、主根上长出侧根的，叫直根系；像葱那样由许多粗细差不多的根组成的，叫须根系。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:直线运动
  type: Concept
  subject: 科学
  title: 直线运动
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 物体沿着直线路径的运动叫直线运动，比如汽车直行、小钢珠沿直线滚动。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S3.md
- id: concept:科学:相同时间比快慢
  type: Concept
  subject: 科学
  title: 相同时间比快慢
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 运动相同的时间时，谁走过的距离长谁就快。让两个物体同时出发、同时停止，量出各自的距离就能比较。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S5.md
- id: concept:科学:相同距离比快慢
  type: Concept
  subject: 科学
  title: 相同距离比快慢
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 运动相同的距离时，谁用的时间短谁就快。可以用秒表测量物体运动相同距离所花的时间来比较。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S4.md
- id: concept:科学:眼睛看到物体的原理
  type: Concept
  subject: 科学
  title: 眼睛看到物体的原理
  conceptType: 概念型
  aliases:
    - 视觉
  category: 概念
  explanation: 物体发出或反射的光进入眼睛，在视网膜上成像并传给大脑，我们就能看到物体；没有光就看不到物体。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S1.md
- id: concept:科学:短路
  type: Concept
  subject: 科学
  title: 短路
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 导线不经过小灯泡，直接连接电池的正极和负极，就会造成短路。短路时电池里的电很快消耗完，电池会发热变烫，甚至可能爆炸。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:磁化
  type: Concept
  subject: 科学
  title: 磁化
  conceptType: 概念型
  aliases:
    - 人工磁化
  category: 概念
  explanation: 让原来没有磁性的物体获得磁性的过程叫磁化。比如用磁铁沿一个方向摩擦钢针，钢针就会变成能指示方向的磁针。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S5.md
- id: concept:科学:磁极间的相互作用
  type: Concept
  subject: 科学
  title: 磁极间的相互作用
  conceptType: 概念型
  aliases:
    - 同极相斥、异极相吸
    - 磁极的相互作用
  category: 性质
  explanation: 两块磁铁靠近时，相同的磁极互相排斥，不同的磁极互相吸引，也就是同极相斥、异极相吸。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:磁铁对运动的影响
  type: Concept
  subject: 科学
  title: 磁铁对运动的影响
  conceptType: 概念型
  aliases:
    - 磁力改变运动路线
  category: 概念
  explanation: 磁铁能在一定距离内吸引钢珠。当钢珠靠近磁铁时，受到的吸引力越来越大，运动路线就会从直线变成曲线。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S8.md
- id: concept:科学:磁铁的形状
  type: Concept
  subject: 科学
  title: 磁铁的形状
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 磁铁有不同的形状，常见的有条形磁铁、蹄形磁铁和环形磁铁。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:磁铁的用途
  type: Concept
  subject: 科学
  title: 磁铁的用途
  conceptType: 概念型
  aliases:
    - 磁铁在生活中的应用
  category: 概念
  explanation: 生活中很多地方都用到磁铁，比如门吸、冰箱密封条、手包扣和喇叭。强磁铁不能靠近手机、磁卡、手表等物品，否则会影响它们工作。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S8.md
- id: concept:科学:磁铁的磁极
  type: Concept
  subject: 科学
  title: 磁铁的磁极
  conceptType: 概念型
  aliases:
    - 南极
    - 北极
    - S极
    - N极
  category: 概念
  explanation: 磁铁水平自由旋转停下来后，总是一端指南、一端指北。指南的一端叫南极（S），指北的一端叫北极（N）。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:磁铁能吸引铁
  type: Concept
  subject: 科学
  title: 磁铁能吸引铁
  conceptType: 概念型
  aliases:
    - 磁铁吸引铁制品
  category: 性质
  explanation: 磁铁能吸引铁做的物体，比如回形针、大头针。磁铁还能吸引镍等一些金属做的物体。用磁铁可以帮我们找出铁做的物品。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:磁铁隔物吸铁
  type: Concept
  subject: 科学
  title: 磁铁隔物吸铁
  conceptType: 概念型
  aliases:
    - 隔着物体吸铁
  category: 性质
  explanation: 磁铁能隔着纸、布、塑料板，甚至隔着水，吸引铁做的物体。但隔的东西太厚或太多时，吸引力会变弱。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S4.md
- id: concept:科学:种子的传播方式
  type: Concept
  subject: 科学
  title: 种子的传播方式
  conceptType: 概念型
  aliases:
    - 植物传播种子的方式
  category: 概念
  explanation: 植物把种子传播出去的方式有很多：果实能爆裂的凤仙花靠弹力传播，果实有倒钩的苍耳靠动物传播，蒲公英轻小带绒毛靠风传播，樱桃鲜美的果实靠动物食用后传播。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S7.md
- id: concept:科学:种子的结构
  type: Concept
  subject: 科学
  title: 种子的结构
  conceptType: 概念型
  aliases:
    - 种子的内部结构
  category: 概念
  explanation: 种子的外面是种皮，起保护作用；里面是胚，包括胚根、胚芽和子叶。胚根能长成根，胚芽能长成茎和叶，子叶里储存着养分。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S1.md
- id: concept:科学:种子萌发的条件
  type: Concept
  subject: 科学
  title: 种子萌发的条件
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 要挑选饱满、没有受过伤的种子播种，还要提供适宜的水分和温暖的环境，种子才能顺利萌发长成幼苗。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S2.md
- id: concept:科学:种子萌发的过程
  type: Concept
  subject: 科学
  title: 种子萌发的过程
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 种子萌发时先长出根，根再带着幼芽向高处生长，最后破土长出茎和叶。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S3.md
- id: concept:科学:空气占据空间
  type: Concept
  subject: 科学
  title: 空气占据空间
  conceptType: 概念型
  aliases:
    - 空气能占据空间
  category: 性质
  explanation: 空气会占满它所在的空间。把拧紧瓶盖的瓶子压入水中，水进不去，就是因为瓶中的空气占据着空间；放出空气后水才能进来。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:空气可以被压缩
  type: Concept
  subject: 科学
  title: 空气可以被压缩
  conceptType: 概念型
  aliases:
    - 空气可压缩
  category: 性质
  explanation: 空气占据的空间可以被压缩，松手后又能恢复；水占据的空间很难被压缩。所以压装满空气的瓶子，瓶子会变瘪一些。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:空气有质量
  type: Concept
  subject: 科学
  title: 空气有质量
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 空气虽然很轻，但也有质量。用简易天平给皮球打入空气后，天平会向打了气的一端倾斜，加入绿豆重新平衡就能比较空气质量的大小。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:空气柱与音调
  type: Concept
  subject: 科学
  title: 空气柱与音调
  conceptType: 概念型
  aliases:
    - 空气柱的长短与声音高低
  category: 现象
  explanation: 物体里空气柱的长短会影响声音的高低：空气柱变短，振动变快，声音变高。用暖水瓶接水时声音越来越高，就是这个道理。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S11.md
- id: concept:科学:空气流动产生力量
  type: Concept
  subject: 科学
  title: 空气流动产生力量
  conceptType: 概念型
  aliases:
    - 空气流动的力量
  category: 性质
  explanation: 流动的空气有力量，能推动物体运动。气球放气会飞出去，帆船、风筝都是利用空气流动的力量工作的。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:空气的特征
  type: Concept
  subject: 科学
  title: 空气的特征
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 空气看不见、摸不着，无色透明，我们周围到处都有空气，人和动植物的生存都离不开它。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S3.md
- id: concept:科学:空气阻力
  type: Concept
  subject: 科学
  title: 空气阻力
  conceptType: 概念型
  aliases:
    - 空气的阻碍作用
  category: 概念
  explanation: 空气会阻碍物体运动，使下落的物体减速，这就是空气阻力。降落伞就是利用空气阻力减速的；月球上没有大气，所以月球探测器不用降落伞。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S10.md
- id: concept:科学:简单机械
  type: Concept
  subject: 科学
  title: 简单机械
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 杠杆、斜面、滑轮、轮轴都是简单机械。使用简单机械可以省力，也可以让工作更方便，比如用撬棒撬重物、用斜面搬运东西。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S8.md
- id: concept:科学:简易显微镜的使用方法
  type: Concept
  subject: 科学
  title: 简易显微镜的使用方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 使用手持式简易显微镜时，先打开电源，把物镜对准物体，再调节调焦环直到看清图像，然后从目镜观察并记录。靠近眼睛的透镜叫目镜，靠近物体的透镜叫物镜。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S3.md
- id: concept:科学:细胞
  type: Concept
  subject: 科学
  title: 细胞
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 细胞是生物体基本的结构和功能单位。用显微镜观察，可以发现动植物都是由细胞构成的，而非生物没有细胞结构。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:群落
  type: Concept
  subject: 科学
  title: 群落
  conceptType: 概念型
  aliases:
    - 生物群落
  category: 概念
  explanation: 在一定区域里共同生活的各种生物合在一起，就叫一个群落，比如绿豆苗和它周围的动物、植物组成一个群落。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S7.md
- id: concept:科学:羽化
  type: Concept
  subject: 科学
  title: 羽化
  conceptType: 概念型
  aliases:
    - 破茧
  category: 现象
  explanation: 蛾和蝶由蛹变成成虫的过程叫羽化。蚕蛹变成蚕蛾钻出茧，就是蚕的羽化。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S6.md
- id: concept:科学:肺活量
  type: Concept
  subject: 科学
  title: 肺活量
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 肺活量是尽力吸气后再尽力呼出的气体总量，用肺活量测量袋可以测出来。肺活量大的人为血液供氧的能力更强，经常锻炼能增大肺活量。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S4.md
- id: concept:科学:胃的消化作用
  type: Concept
  subject: 科学
  title: 胃的消化作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 胃能暂时储存食物，通过蠕动和分泌胃液，把口腔送来的食物进一步磨碎、消化，变成食糜再慢慢送进小肠。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:能量
  type: Concept
  subject: 科学
  title: 能量
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 运动的物体具有能量，能把别的物体推动或撞开。斜面坡度越大，小球滚下来速度越快，把木块撞得越远，说明能量越大。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S6.md
- id: concept:科学:脊椎动物和无脊椎动物
  type: Concept
  subject: 科学
  title: 脊椎动物和无脊椎动物
  conceptType: 概念型
  aliases:
    - 脊椎动物
    - 无脊椎动物
  category: 概念
  explanation: 身体里有脊柱的动物叫脊椎动物，比如鱼、鸟、人和其他哺乳动物；身体里没有脊柱的动物叫无脊椎动物，比如昆虫。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:脑的结构和功能
  type: Concept
  subject: 科学
  title: 脑的结构和功能
  conceptType: 概念型
  aliases:
    - 大脑
  category: 概念
  explanation: 脑位于颅腔内，包括大脑、小脑和脑干等部分，是身体的“总指挥”，负责思考、记忆、运动和感觉等各种活动。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:自然保护区
  type: Concept
  subject: 科学
  title: 自然保护区
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 自然保护区是依法划出一定面积，对珍稀濒危动植物和自然生态系统进行特殊保护和管理的区域。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S7.md
- id: concept:科学:自然物
  type: Concept
  subject: 科学
  title: 自然物
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 来自大自然、没有经过人们加工的材料叫自然物，比如干草、泥土和树枝。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:船的动力
  type: Concept
  subject: 科学
  title: 船的动力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 船可以靠人力划桨、风帆吹风、蒸汽机或电动机推动前进。安装船舵还能控制船行驶的方向。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C2/sections/S5.md
- id: concept:科学:船的发展历史
  type: Concept
  subject: 科学
  title: 船的发展历史
  conceptType: 概念型
  aliases:
    - 船的历史
  category: 概念
  explanation: 从独木舟到帆船、蒸汽船再到轮船，船的体积越来越大、材料越来越结实、动力越来越强，说明人们不断改进技术满足生产生活的需要。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C2/sections/S1.md
- id: concept:科学:船的结构
  type: Concept
  subject: 科学
  title: 船的结构
  conceptType: 概念型
  aliases:
    - 龙骨
  category: 概念
  explanation: 现代轮船有骨架、船舱等结构，能让船更牢固、更好地利用空间。我国古代发明的龙骨结构还能增强船抵御风浪的能力。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C2/sections/S8.md
- id: concept:科学:船的载重量
  type: Concept
  subject: 科学
  title: 船的载重量
  conceptType: 概念型
  aliases:
    - 载重量
  category: 概念
  explanation: 船能装的货物质量就是载重量。用同样大小的铝箔做船，体积越大载重量越大，但体积大也要注意保持稳定不侧翻。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C2/sections/S4.md
- id: concept:科学:花的结构
  type: Concept
  subject: 科学
  title: 花的结构
  conceptType: 概念型
  aliases:
    - 花的组成
  category: 概念
  explanation: 一朵完整的花由花萼、花瓣、雄蕊和雌蕊组成。雄蕊上有花粉，雌蕊上常有黏液，花蕊与结出果实有密切关系。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S5.md
- id: concept:科学:茎的运输作用
  type: Concept
  subject: 科学
  title: 茎的运输作用
  conceptType: 概念型
  aliases:
    - 茎的作用
  category: 概念
  explanation: 植物的茎能从下往上把根吸收的水分运输到叶、花和果实，把植物各部分连成一个整体。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C1/sections/S4.md
- id: concept:科学:蒸发
  type: Concept
  subject: 科学
  title: 蒸发
  conceptType: 概念型
  aliases:
    - 蒸发现象
  category: 现象
  explanation: 水会慢慢变成看不见的水蒸气，飞散到空气里，这种现象叫蒸发。湿衣服晾干、黑板上的水迹消失都是蒸发。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S1.md
- id: concept:科学:蚕卵的孵化
  type: Concept
  subject: 科学
  title: 蚕卵的孵化
  conceptType: 概念型
  aliases:
    - 蚕卵孵化
  category: 现象
  explanation: 蚕是卵生动物，蚕卵在合适的温度、湿度等条件下会孵出小蚕。蚕卵很小，观察时可以用画图和文字记录它的形状、大小和颜色。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:蚕吐丝结茧
  type: Concept
  subject: 科学
  title: 蚕吐丝结茧
  conceptType: 概念型
  aliases:
    - 结茧
    - 吐丝结茧
  category: 现象
  explanation: 蚕长大后开始吐丝，用蚕丝把自己包裹起来，结成一个茧。结茧是为了在里面安全地变成蚕蛹。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S5.md
- id: concept:科学:蚕的生命周期
  type: Concept
  subject: 科学
  title: 蚕的生命周期
  conceptType: 概念型
  aliases:
    - 蚕的一生
  category: 概念
  explanation: 蚕的一生要经历卵、幼虫、蛹、成虫四个阶段，成虫产卵后衰老死亡。把蚕一生经历的变化按顺序排列，就是它的生命周期。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S7.md
- id: concept:科学:蚕蛹
  type: Concept
  subject: 科学
  title: 蚕蛹
  conceptType: 概念型
  aliases:
    - 蛹
  category: 概念
  explanation: 茧里的蚕变成了不吃不动、身体和幼虫不一样的蚕蛹。蚕蛹还活着，以后会变成蚕蛾钻出茧。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S5.md
- id: concept:科学:蜕皮
  type: Concept
  subject: 科学
  title: 蜕皮
  conceptType: 概念型
  aliases:
    - 蚕蜕皮
  category: 现象
  explanation: 蚕长到一定阶段会蜕掉旧皮、长出新皮，这就是蜕皮。蚕蜕皮前不吃也不动，像睡着了一样，这叫“眠”。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C2/sections/S4.md
- id: concept:科学:蜗牛的身体特点
  type: Concept
  subject: 科学
  title: 蜗牛的身体特点
  conceptType: 概念型
  aliases:
    - 腹足
  category: 性质
  explanation: 蜗牛身体软软的，头上有触角，靠腹足慢慢爬行。遇到危险时会把身体缩进壳里。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C2/sections/S2.md
- id: concept:科学:观察云
  type: Concept
  subject: 科学
  title: 观察云
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 观察云时，可以从云量和云的形状两方面记录，云的形状和多少都能告诉我们天气信息。注意不能直视太阳。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S6.md
- id: concept:科学:观察岩石特征的方法
  type: Concept
  subject: 科学
  title: 观察岩石特征的方法
  conceptType: 程序型
  aliases:
    - 观察岩石的方法
  category: 方法
  explanation: 观察岩石可以用肉眼看颜色、颗粒和斑点条纹，用放大镜看细部，用手摸光滑还是粗糙，用手电筒照有没有光泽，还可以用指甲、铜钥匙、小刀刻画来比较软硬。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S2.md
- id: concept:科学:观察工具的发展
  type: Concept
  subject: 科学
  title: 观察工具的发展
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 从眼睛到放大镜，再到光学显微镜和电子显微镜，观察工具不断改进，人类看到的微小物体越来越清晰。显微镜的发明推动了生命科学、医学等许多领域的重大进步。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S8.md
- id: concept:科学:观察校园里的植物
  type: Concept
  subject: 科学
  title: 观察校园里的植物
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 观察校园里的植物时，不拔起、不采摘、不伤害它们，还要注意安全，不靠近池塘和电线。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S6.md
- id: concept:科学:观察植物的方法
  type: Concept
  subject: 科学
  title: 观察植物的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 观察植物时可以看颜色、大小、形状，摸一摸软硬，闻一闻气味。用多种感官仔细看，才能发现植物的特点。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:观察水中微小生物的方法
  type: Concept
  subject: 科学
  title: 观察水中微小生物的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 用滴管把水滴在载玻片上，盖上盖玻片做成玻片标本，再放到显微镜下观察，就能看到水中的微小生物。如果微小生物运动太快，可以先放少量脱脂棉限制它的活动。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C1/sections/S6.md
- id: concept:科学:观察物体特征的方法
  type: Concept
  subject: 科学
  title: 观察物体特征的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 可以用看、摸、比一比等办法观察物体，找出它的特征，再用词语说出来或记在记录单上。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C1/sections/S1.md
- id: concept:科学:观察矿物特征的方法
  type: Concept
  subject: 科学
  title: 观察矿物特征的方法
  conceptType: 程序型
  aliases:
    - 矿物的特征
    - 识别矿物的方法
  category: 方法
  explanation: 观察矿物可以从颜色、条痕、透明度、光泽和硬度等方面入手。把矿物在白瓷板上摩擦留下的痕迹叫条痕，透过矿物碎片边缘能否看见别的物体可以判断透明度。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C3/sections/S3.md
- id: concept:科学:观察笔记
  type: Concept
  subject: 科学
  title: 观察笔记
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 用文字和图画把亲眼看到的自然现象记录下来，要写上日期，只记真实观察到的，不记想象或听说的。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C2/sections/S2.md
- id: concept:科学:观察记录天气
  type: Concept
  subject: 科学
  title: 观察记录天气
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 可以从冷热、刮风、阴晴、雨雪等方面观察天气，并用简单的图画和词句记录下来。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:观测风的方法
  type: Concept
  subject: 科学
  title: 观测风的方法
  conceptType: 程序型
  aliases:
    - 观测风
  category: 方法
  explanation: 风看不见摸不着，可以观察地面物体的样子，或用风旗、风向标等工具，来判断风的大小和方向。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:解决垃圾问题的方法
  type: Concept
  subject: 科学
  title: 解决垃圾问题的方法
  conceptType: 概念型
  aliases:
    - 减量化
    - 资源化
    - 无害化
  category: 方法
  explanation: 解决垃圾问题要坚持减量化、资源化、无害化：从源头少产生垃圾，把回收的垃圾变废为宝，处理时避免污染环境和危害健康。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S4.md
- id: concept:科学:计时工具的发展
  type: Concept
  subject: 科学
  title: 计时工具的发展
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 人类利用自然界有规律的变化来计时，工具从日晷、水钟发展到机械摆钟，时间的测量精度越来越高。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C4/sections/S8.md
- id: concept:科学:认识星座的方法
  type: Concept
  subject: 科学
  title: 认识星座的方法
  conceptType: 程序型
  aliases:
    - 观星的方法
  category: 方法
  explanation: 观星时先定方向，再找银河等明显标志，然后找亮星定星座，也可以借助观星盘对照辨认。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C3/sections/S5.md
- id: concept:科学:记录身体信息的方法
  type: Concept
  subject: 科学
  title: 记录身体信息的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把身高、体重、跑步成绩等身体信息测量后记录下来。将来再打开对比，就能看出自己身体的变化。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S7.md
- id: concept:科学:设计制作过山车
  type: Concept
  subject: 科学
  title: 设计制作过山车
  conceptType: 程序型
  aliases:
    - 过山车
  category: 方法
  explanation: 像工程师一样，先明确任务、画出设计图，再动手制作和测试，最后评估、改进。轨道要够长，小球要能滚完全程不脱轨。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S7.md
- id: concept:科学:设计图
  type: Concept
  subject: 科学
  title: 设计图
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 建造房子前要先画设计图，标出房子的样子、门窗的位置和要用的材料，照着做更省事。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:设计玩具的方法
  type: Concept
  subject: 科学
  title: 设计玩具的方法
  conceptType: 程序型
  aliases:
    - 设计钓鱼玩具
  category: 方法
  explanation: 先看清楚要完成的任务和要求，再想办法利用手头的材料，把想法画成设计图，听了别人的意见后还可以继续修改。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C2/sections/S5.md
- id: concept:科学:证明空气存在的方法
  type: Concept
  subject: 科学
  title: 证明空气存在的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 虽然看不到空气，但可以用实验证明它存在，比如用塑料袋装空气、把空瓶子压入水中看气泡、感受风吹动身边的物体。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:评价与改进作品
  type: Concept
  subject: 科学
  title: 评价与改进作品
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 做完作品要对照标准检查，比如用了几种材料、房子稳不稳、门窗够不够大，再想想哪里可以改进。
  sourceRef: content/二年级/上册/科学/ES-2-1-Science/chapters/C1/sections/S6.md
- id: concept:科学:资源再生
  type: Concept
  subject: 科学
  title: 资源再生
  conceptType: 概念型
  aliases:
    - 废纸再生
    - 回收再利用
  category: 概念
  explanation: 废纸、塑料、金属、玻璃等回收后可以加工成新的材料再使用，比如用废纸做再生纸。资源再利用能节约原料、减少垃圾、保护环境。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C3/sections/S6.md
- id: concept:科学:超声波
  type: Concept
  subject: 科学
  title: 超声波
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 每秒振动超过 20000 次的声音叫超声波，人耳听不到。它方向集中、容易被物体反射，在医学检查、工业勘探等方面很有用。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S10.md
- id: concept:科学:身体的结构
  type: Concept
  subject: 科学
  title: 身体的结构
  conceptType: 概念型
  aliases:
    - 身体的组成部分
  category: 概念
  explanation: 我们的身体从上到下分为头、颈、躯干和四肢几个部分。用画图的方式可以记录身体的构造。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C2/sections/S1.md
- id: concept:科学:身边的植物
  type: Concept
  subject: 科学
  title: 身边的植物
  conceptType: 概念型
  aliases:
    - 周围常见的植物
  category: 概念
  explanation: 我们周围有很多植物，比如树木、花草和蔬菜。可以先认识它们的名字和样子。
  sourceRef: content/一年级/上册/科学/ES-1-1-Science/chapters/C1/sections/S1.md
- id: concept:科学:轮轴
  type: Concept
  subject: 科学
  title: 轮轴
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 由较大的轮和较小的轴固定在一起转动的机械叫轮轴，比如汽车方向盘和自行车的车把。轮轴可以帮助我们省力、方便地操控方向。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C2/sections/S6.md
- id: concept:科学:辨别方向的方法
  type: Concept
  subject: 科学
  title: 辨别方向的方法
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 可以用太阳、积雪、苔藓等自然物辨别方向，也可以用指南针更快更准确地确定方向。多观察、多分析，才能找到正确的方向。
  sourceRef: content/三年级/下册/科学/ES-3-2-Science/chapters/C1/sections/S9.md
- id: concept:科学:迁徙
  type: Concept
  subject: 科学
  title: 迁徙
  conceptType: 概念型
  aliases:
    - 候鸟迁徙
  category: 现象
  explanation: 当季节变化、食物减少时，有些动物会从原来的地方飞到气候温暖、食物充足的地方生活，等季节合适再回来，比如丹顶鹤的南北迁飞。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S5.md
- id: concept:科学:过滤
  type: Concept
  subject: 科学
  title: 过滤
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 用漏斗和滤纸可以把不溶解的沙子等杂质从水中分离出来，这个方法叫过滤。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S8.md
- id: concept:科学:运动后呼吸加快
  type: Concept
  subject: 科学
  title: 运动后呼吸加快
  conceptType: 概念型
  aliases:
    - 呼吸次数的变化
  category: 现象
  explanation: 剧烈运动时身体要消耗更多氧气，呼吸就会加快加深，让肺部气体交换更快，吸进更多氧气。运动前后每分钟呼吸次数会明显不同。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S3.md
- id: concept:科学:运动和静止
  type: Concept
  subject: 科学
  title: 运动和静止
  conceptType: 概念型
  aliases:
    - 运动的物体与静止的物体
  category: 概念
  explanation: 把大地看作静止的，如果一个物体相对于另一个物体位置发生了变化，它就是运动的；位置没有变化，就是静止的。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S1.md
- id: concept:科学:运动方式
  type: Concept
  subject: 科学
  title: 运动方式
  conceptType: 概念型
  aliases:
    - 运动路线
  category: 概念
  explanation: 物体运动的形式多种多样，有的直行，有的转动，有的摆动。在物体上贴圆点、画出圆点的运动路线，能帮助我们看清物体是怎样运动的。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S2.md
- id: concept:科学:选择和使用工具
  type: Concept
  subject: 科学
  title: 选择和使用工具
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 做事情前先想清楚需要什么工具，再按正确、安全的方法使用它。比如挖掘时要戴护目镜，用锤子时力量先小后大。
  misconceptions:
    - 误认为随手拿一个工具就行，实际要先想清楚需要什么工具，再按正确、安全的方法使用。
  sourceRef: content/二年级/下册/科学/ES-2-2-Science/chapters/C1/sections/S2.md
- id: concept:科学:透明、半透明和不透明
  type: Concept
  subject: 科学
  title: 透明、半透明和不透明
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 光能完全穿过普通玻璃等透明物体，只能部分穿过磨砂玻璃等半透明物体，不能穿过厚纸板等不透明物体。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C2/sections/S3.md
- id: concept:科学:通路和断路
  type: Concept
  subject: 科学
  title: 通路和断路
  conceptType: 概念型
  aliases:
    - 通路与断路
  category: 概念
  explanation: 电路接通、电流能顺利通过时叫通路；电路断开、电流不能通过时叫断路。用电路检测器检测两个接线柱之间是通路还是断路，就能推测看不见的内部连接情况。
  sourceRef: content/四年级/下册/科学/ES-4-2-Science/chapters/C2/sections/S5.md
- id: concept:科学:速度
  type: Concept
  subject: 科学
  title: 速度
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 利用物体运动的时间和距离，可以比较它们运动的快慢，快慢的程度叫速度。速度越大，运动得越快。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C3/sections/S5.md
- id: concept:科学:遗传
  type: Concept
  subject: 科学
  title: 遗传
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 生物的后代和亲代在很多特征上非常相似，这种现象叫遗传。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C2/sections/S3.md
- id: concept:科学:酒精灯的使用方法
  type: Concept
  subject: 科学
  title: 酒精灯的使用方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 用酒精灯加热时要用温度最高的外焰；不能用燃着的酒精灯点燃另一盏，熄灭时要用灯帽盖灭，不能用嘴吹。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C2/sections/S3.md
- id: concept:科学:重力
  type: Concept
  subject: 科学
  title: 重力
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 重力是地球对物体施加的吸引力，它无须接触就能把物体拉向地面。物体的质量越大，受到的重力越大。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C3/sections/S2.md
- id: concept:科学:铁生锈
  type: Concept
  subject: 科学
  title: 铁生锈
  conceptType: 概念型
  aliases:
    - 铁钉生锈
  category: 现象
  explanation: 铁钉在潮湿的空气中容易生锈，生锈是产生了新物质的化学变化。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S4.md
- id: concept:科学:银河系
  type: Concept
  subject: 科学
  title: 银河系
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 银河系是由约 2000 亿到 4000 亿颗恒星组成的天体系统，形状像一个盘子或旋涡，太阳系只是其中普通的一员。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C3/sections/S6.md
- id: concept:科学:降水量
  type: Concept
  subject: 科学
  title: 降水量
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 降水量是一定时间内降落在地面上的雨或雪化的水的深度，用毫米作单位。雨有大有小，要统一标准来测量。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:雨量器
  type: Concept
  subject: 科学
  title: 雨量器
  conceptType: 概念型
  aliases:
    - 雨量计
  category: 概念
  explanation: 雨量器是用来测量降水量的工具，可以用直筒透明杯贴上刻度条自制，放在雨中收集雨水来测量。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S4.md
- id: concept:科学:青春期
  type: Concept
  subject: 科学
  title: 青春期
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 女生 10 岁左右、男生 12 岁左右进入的第二个快速发育时期，这时要注意补充营养并保持身体清洁卫生。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S9.md
- id: concept:科学:风力
  type: Concept
  subject: 科学
  title: 风力
  conceptType: 概念型
  aliases:
    - 风级
  category: 概念
  explanation: 风力指风的大小。可以看风旗的样子把风力简化为无风、微风、大风三个等级，风旗展开飘动就是大风。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:风向
  type: Concept
  subject: 科学
  title: 风向
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 风向是风吹来的方向，用东、南、西、北等八个方位来描述。比如北风就是从北方吹来的风。
  sourceRef: content/三年级/上册/科学/ES-3-1-Science/chapters/C1/sections/S5.md
- id: concept:科学:风对地表的作用
  type: Concept
  subject: 科学
  title: 风对地表的作用
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 风通过吹蚀、搬运和堆积改变地表形态，在干旱地区会形成风蚀蘑菇、雅丹地貌、沙漠和戈壁等独特的地貌。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S7.md
- id: concept:科学:风的成因
  type: Concept
  subject: 科学
  title: 风的成因
  conceptType: 概念型
  aliases:
    - 风是怎样形成的
  category: 现象
  explanation: 地面受热不均匀时，各处空气的温度不同。温度高的地方热空气上升，别处的冷空气流过来补充，空气的这种流动就形成了风。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C1/sections/S7.md
- id: concept:科学:食物中的能量
  type: Concept
  subject: 科学
  title: 食物中的能量
  conceptType: 概念型
  aliases:
    - 食物的能量
  category: 概念
  explanation: 食物蕴含着能量，食物进入身体后经过复杂而平稳的化学变化，转化为身体所需的能量和营养。
  sourceRef: content/六年级/下册/科学/ES-6-2-Science/chapters/C4/sections/S6.md
- id: concept:科学:食物中的营养物质
  type: Concept
  subject: 科学
  title: 食物中的营养物质
  conceptType: 概念型
  aliases:
    - 营养成分
  category: 概念
  explanation: 食物中含有糖类、脂肪、蛋白质、无机盐、维生素和水等营养物质，它们为身体提供能量和生长所需的材料。
  sourceRef: content/六年级/上册/科学/ES-6-1-Science/chapters/C1/sections/S2.md
- id: concept:科学:食物的消化过程
  type: Concept
  subject: 科学
  title: 食物的消化过程
  conceptType: 概念型
  aliases:
    - 食物在身体里的旅行
  category: 概念
  explanation: 食物经过口腔、食管、胃、小肠、大肠这些消化器官：口腔嚼碎，食管运送，胃磨碎消化，小肠吸收营养，大肠处理残渣，最后废物排出体外。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S7.md
- id: concept:科学:食物网
  type: Concept
  subject: 科学
  title: 食物网
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 一个区域里的许多条食物链相互交叉连在一起，像一张大网。一种生物常常处在多条食物链中，少了谁都可能影响其他生物。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S6.md
- id: concept:科学:食物链
  type: Concept
  subject: 科学
  title: 食物链
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 生物之间因为吃与被吃的关系连成一条链，比如绿豆苗被蚜虫吃、蚜虫被瓢虫吃。一般用箭头表示“谁被谁吃”的顺序。
  sourceRef: content/五年级/下册/科学/ES-5-2-Science/chapters/C1/sections/S6.md
- id: concept:科学:鱼的身体特点
  type: Concept
  subject: 科学
  title: 鱼的身体特点
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 鱼身上有鳞片，靠鳍在水里游泳，用鳃呼吸，所以能一直待在水里。
  sourceRef: content/一年级/下册/科学/ES-1-2-Science/chapters/C2/sections/S4.md
- id: concept:科学:黄土高原的形成
  type: Concept
  subject: 科学
  title: 黄土高原的形成
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 黄土高原是西北大风千万年来从沙漠地区吹扬起细小尘土、在远处堆积形成的，降雨又冲刷出无数沟壑，冲下来的泥沙还造就了华北平原。
  sourceRef: content/五年级/上册/科学/ES-5-1-Science/chapters/C4/sections/S9.md
- id: concept:科学:鼓膜的作用
  type: Concept
  subject: 科学
  title: 鼓膜的作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 鼓膜很薄而且有弹性，轻微的声音都能使它振动。声音越强鼓膜振动越明显，鼓膜穿孔听力就会受影响。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C3/sections/S8.md
- id: concept:科学:鼻腔的作用
  type: Concept
  subject: 科学
  title: 鼻腔的作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 鼻腔像空气的"加工厂"，能调节吸入空气的温度和湿度，鼻毛还能阻挡尘埃等有害物质。所以鼻塞时呼吸会受影响，平时不要随便挖鼻孔。
  sourceRef: content/四年级/上册/科学/ES-4-1-Science/chapters/C2/sections/S8.md
