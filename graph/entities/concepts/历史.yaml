  category: 口号
  explanation: 李自成提出的口号，反映农民平均土地和免除赋税的愿望。
  misconceptions:
    - 认为“均田免粮”是太平天国提出的口号，实际是李自成起义口号。
    - 把“均田免粮”理解为平均分配全国土地，实际只是政治号召。
    - 误认为李自成提出口号后立即推行均田制，实际并非制度。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:坊市制度
