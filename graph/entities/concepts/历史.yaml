  misconceptions:
    - 误认志愿军入朝作战时间是1949年，实际是1950年10月。
    - 误认为志愿军司令员是林彪，实际是彭德怀。
    - 误以为志愿军是以解放军正规军名义参战，实际使用志愿军番号。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:中国人民抗日军政大学
  type: Concept
  subject: 历史
  title: 中国人民抗日军政大学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为抗大只培养军事指挥员，实际上还培养政治工作干部。
    - 能指出并纠正这一错误：误以为抗大是国民政府创办的，实际是中共中央设立在延安的学校。
  aliases:
    - 抗大
  category: 教育机构
  explanation: 中共中央设立的培养抗日干部的学校，简称“抗大”。
  misconceptions:
    - 误以为抗大只培养军事指挥员，实际上还培养政治工作干部。
    - 误以为抗大是国民政府创办的，实际是中共中央设立在延安的学校。
    - 误以为抗大是抗战结束后成立的，实际建立于抗战初期。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:中国人民政治协商会议
  type: Concept
  subject: 历史
  title: 中国人民政治协商会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1949年政协会议召开日期是10月1日，实际是9月21日。
    - 能指出并纠正这一错误：误认为1954年后政协仍代行人大职权，实际已成为统一战线组织。
  aliases:
    - 新政协
    - 政协第一届全体会议
  category: 历史事件
  explanation: 1949年9月在北平召开，代行全国人民代表大会职权，完成新中国筹建，标志着中国共产党领导的多党合作和政治协商制度正式确立。
  misconceptions:
    - 误认为1949年政协会议召开日期是10月1日，实际是9月21日。
    - 误认为1954年后政协仍代行人大职权，实际已成为统一战线组织。
    - 认为政协会议是决定社会主义制度建立的会议，实际是筹建新中国。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:中国共产党对革命同盟的认识
  type: Concept
  subject: 历史
  title: 中国共产党对革命同盟的认识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为京汉铁路罢工失败后中共决定放弃革命同盟，独立斗争
    - 能指出并纠正这一错误：把认识到必须团结同盟者归因于二七惨案之后，实际是京汉铁路罢工失败后
  aliases: []
  category: 历史认识
  explanation: 京汉铁路罢工失败后，中共认识到必须团结一切可能的同盟者，才能战胜强大敌人。
  misconceptions:
    - 误以为京汉铁路罢工失败后中共决定放弃革命同盟，独立斗争
    - 把认识到必须团结同盟者归因于二七惨案之后，实际是京汉铁路罢工失败后
    - 以偏概全，认为中共只考虑团结农民阶级，忽略了其他同盟者
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:中国共产党成立
  type: Concept
  subject: 历史
  title: 中国共产党成立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中共一大标志着新民主主义革命开端，实际起点是五四运动。
    - 能指出并纠正这一错误：误认为中国共产党成立时间早于五四运动，实际晚两年。
  aliases:
    - 中共一大
  category: 历史事件
  explanation: 1921年7月，中国共产党第一次全国代表大会召开，标志着中国共产党的诞生，是中国历史上开天辟地的大事。
  misconceptions:
    - 误认为中共一大标志着新民主主义革命开端，实际起点是五四运动。
    - 误认为中国共产党成立时间早于五四运动，实际晚两年。
    - 误认为中共一大在北京召开，实际在上海和嘉兴南湖。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S4.md
- id: concept:历史:中国共产党成立的历史意义
  type: Concept
  subject: 历史
  title: 中国共产党成立的历史意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中共成立后革命马上取得胜利，忽略后来28年艰苦斗争
    - 能指出并纠正这一错误：把'开天辟地'误用在辛亥革命上，说成推翻清王朝也是开天辟地
  aliases: []
  category: 历史意义
  explanation: 中国共产党的成立是中国历史上开天辟地的大事，使中国革命面貌焕然一新，深刻改变了中国人民和中华民族的前途命运。
  misconceptions:
    - 认为中共成立后革命马上取得胜利，忽略后来28年艰苦斗争
    - 把'开天辟地'误用在辛亥革命上，说成推翻清王朝也是开天辟地
    - 将中共成立意义概括为'结束半殖民地半封建社会'，实际只是面貌焕然一新
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:中国共产党早期农民运动
  type: Concept
  subject: 历史
  title: 中国共产党早期农民运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国共产党成立后首先领导农民运动，而非工人运动
    - 能指出并纠正这一错误：把衙前村农民协会和海丰总农会误认为是工人运动组织
  aliases:
    - 农民运动
    - 早期农民运动
  category: 历史事件
  explanation: 中国共产党成立后，在领导工人运动的同时，也开始组织农民协会，领导农民运动，如衙前村农民协会、海丰总农会等。
  misconceptions:
    - 误以为中国共产党成立后首先领导农民运动，而非工人运动
    - 把衙前村农民协会和海丰总农会误认为是工人运动组织
    - 认为早期农民运动是在中共二大之后才开始的，时间上颠倒
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:中国共产党早期组织
  type: Concept
  subject: 历史
  title: 中国共产党早期组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为党的第一个早期组织是李大钊在北京建立的，实际上陈独秀在上海建立最早的组织
    - 能指出并纠正这一错误：认为各地早期组织都成立于1920年夏，忽略了时间先后的差异，如武汉、长沙等稍晚
  aliases:
    - 共产党早期组织
    - 共产主义小组
  category: 历史概念
  explanation: 1920年夏，陈独秀在上海建立第一个早期组织，随后各地相继建立，为中共一大召开奠定基础。
  misconceptions:
    - 误认为党的第一个早期组织是李大钊在北京建立的，实际上陈独秀在上海建立最早的组织
    - 认为各地早期组织都成立于1920年夏，忽略了时间先后的差异，如武汉、长沙等稍晚
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:中国共产党是全民族抗战的中流砥柱
  type: Concept
  subject: 历史
  title: 中国共产党是全民族抗战的中流砥柱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说中流砥柱是因为中共军队人数最多，而非指政治领导作用。
    - 能指出并纠正这一错误：认为中共只在敌后游击战，没有参与正面战场作战。
  aliases: []
  category: 历史结论
  explanation: 中国共产党在抗战中提出正确主张，建立抗日根据地，领导人民战争，发挥了中流砥柱的作用。
  misconceptions:
    - 说中流砥柱是因为中共军队人数最多，而非指政治领导作用。
    - 认为中共只在敌后游击战，没有参与正面战场作战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:中国共产党百年奋斗的历史经验
  type: Concept
  subject: 历史
  title: 中国共产党百年奋斗的历史经验
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏写“坚持自我革命”或“坚持开拓创新”等。
    - 能指出并纠正这一错误：把“坚持胸怀天下”误写为“坚持国际主义”。
  aliases:
    - 十个坚持
  category: 历史经验
  explanation: 包括坚持党的领导、坚持人民至上、坚持理论创新、坚持独立自主、坚持中国道路、坚持胸怀天下、坚持开拓创新、坚持敢于斗争、坚持统一战线、坚持自我革命。
  misconceptions:
    - 漏写“坚持自我革命”或“坚持开拓创新”等。
    - 把“坚持胸怀天下”误写为“坚持国际主义”。
    - 误认为十条经验是在十九大总结的，实际是十九届六中全会。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:中国共产党第一个纲领
  type: Concept
  subject: 历史
  title: 中国共产党第一个纲领
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把党的第一个纲领内容等同于二大提出的反帝反封建民主革命纲领
    - 能指出并纠正这一错误：误以为一大纲领规定了党的中心工作是领导工人运动，实际中心工作在大会决议中而非纲领本身
  aliases:
    - 党纲
  category: 历史文献
  explanation: 中共一大通过，明确党的奋斗目标是推翻资产阶级政权，建立无产阶级专政，实现共产主义。
  misconceptions:
    - 误把党的第一个纲领内容等同于二大提出的反帝反封建民主革命纲领
    - 误以为一大纲领规定了党的中心工作是领导工人运动，实际中心工作在大会决议中而非纲领本身
    - 认为纲领明确提出了建立革命统一战线，但一大纲领并未涉及国共合作
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:中国共产党第一次全国代表大会
  type: Concept
  subject: 历史
  title: 中国共产党第一次全国代表大会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把7月1日当作一大开幕日期，实际开幕是7月23日，7月1日是后来定的建党纪念日
    - 能指出并纠正这一错误：认为一大全程在嘉兴南湖游船上召开，实际先是上海李汉俊家，后转南湖
  aliases:
    - 中共一大
    - 党的一大
  category: 历史事件
  explanation: 1921年7月23日在上海开幕，后转移至嘉兴南湖游船，确定党的名称、纲领和中心工作，标志中国共产党诞生。
  misconceptions:
    - 误把7月1日当作一大开幕日期，实际开幕是7月23日，7月1日是后来定的建党纪念日
    - 认为一大全程在嘉兴南湖游船上召开，实际先是上海李汉俊家，后转南湖
    - 误以为一大确定党的中心工作是开展武装斗争，实际是领导和组织工人运动
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:中国共产党第七次全国代表大会
  type: Concept
  subject: 历史
  title: 中国共产党第七次全国代表大会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中共七大在遵义会议上确立毛泽东思想为指导思想
    - 能指出并纠正这一错误：把中共七大召开的年份记成1944年或1946年
  aliases:
    - 中共七大
  category: 历史事件
  explanation: 1945年，中共七大召开，确立毛泽东思想为党的指导思想。
  misconceptions:
    - 误以为中共七大在遵义会议上确立毛泽东思想为指导思想
    - 把中共七大召开的年份记成1944年或1946年
    - 将毛泽东思想等同于毛泽东个人思想
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:中国共产党诞生
  type: Concept
  subject: 历史
  title: 中国共产党诞生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中共诞生后中国革命面貌立即完全改变，忽略了革命道路探索的曲折性
    - 能指出并纠正这一错误：将五四运动等同于中国共产党的诞生标志，实际一大召开才是诞生标志
  aliases:
    - 中国共产党成立
  category: 历史事件
  explanation: 1921年中国共产党成立，是中国历史上开天辟地的大事变，使中国革命面貌焕然一新。
  misconceptions:
    - 认为中共诞生后中国革命面貌立即完全改变，忽略了革命道路探索的曲折性
    - 将五四运动等同于中国共产党的诞生标志，实际一大召开才是诞生标志
    - 误认为中共成立使中国直接进入社会主义革命阶段，实际先完成民主革命任务
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:中国共产党领导的多党合作和政治协商制度
  type: Concept
  subject: 历史
  title: 中国共产党领导的多党合作和政治协商制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为该制度是我国根本政治制度，实际是基本政治制度。
    - 能指出并纠正这一错误：误认为该制度由1954年宪法确立，实际是1949年政协会议确立。
  aliases:
    - 政治协商制度
  category: 政治制度
  explanation: 由中国人民政治协商会议正式确立，是中国的一项基本政治制度。
  misconceptions:
    - 误认为该制度是我国根本政治制度，实际是基本政治制度。
    - 误认为该制度由1954年宪法确立，实际是1949年政协会议确立。
    - 误认为政协在人大产生后仍行使国家权力，实际是协商机构。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:中国劳动组合书记部
  type: Concept
  subject: 历史
  title: 中国劳动组合书记部
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国劳动组合书记部是工人自行组织的帮会机构
    - 能指出并纠正这一错误：认为它成立于五四运动之前，实际是中共成立后设立的
  aliases: []
  category: 组织
  explanation: 中国共产党成立后设立的领导工人运动的机构，集中领导全国工人运动。
  misconceptions:
    - 误以为中国劳动组合书记部是工人自行组织的帮会机构
    - 认为它成立于五四运动之前，实际是中共成立后设立的
    - 张冠李戴，把它说成是领导农民运动的中央机构
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:中国参与联合国维和行动
  type: Concept
  subject: 历史
  title: 中国参与联合国维和行动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国首次参与联合国维和行动是派遣作战部队
    - 能指出并纠正这一错误：认为中国参与联合国维和始于21世纪
  aliases: []
  category: 外交行动
  explanation: 1990年中国首次派遣军事观察员参与联合国维和行动，此后成为重要力量。
  misconceptions:
    - 认为中国首次参与联合国维和行动是派遣作战部队；实际是1990年派军事观察员。
    - 认为中国参与联合国维和始于21世纪；实际1990年已开始。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:中国同盟会
  type: Concept
  subject: 历史
  title: 中国同盟会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为同盟会是第一个资产阶级革命团体，忽略兴中会成立更早
    - 能指出并纠正这一错误：将同盟会成立地点记成上海，实际是在日本东京
  aliases:
    - 同盟会
  category: 历史事件
  explanation: 1905年8月，孙中山联合兴中会、华兴会、光复会等在日本东京成立的革命政党，是第一个全国规模的、统一的资产阶级革命政党。
  misconceptions:
    - 认为同盟会是第一个资产阶级革命团体，忽略兴中会成立更早
    - 将同盟会成立地点记成上海，实际是在日本东京
    - 误以为同盟会成立时即提出三民主义，实际当时只是十六字纲领
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:中国式现代化
  type: Concept
  subject: 历史
  title: 中国式现代化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中国式现代化只是经济现代化，忽略社会、生态等其他方面。
    - 能指出并纠正这一错误：误认为中国式现代化是西方现代化的复制版，照搬西方模式。
  aliases: []
  category: 政治概念
  explanation: 中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。
  misconceptions:
    - 误认为中国式现代化只是经济现代化，忽略社会、生态等其他方面。
    - 误认为中国式现代化是西方现代化的复制版，照搬西方模式。
    - 误认为中国式现代化不需要各国现代化的共同特征，完全与众不同。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:中国梦
  type: Concept
  subject: 历史
  title: 中国梦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉中国梦本质三部分中任一项，如只写‘国家富强、民族振兴’。
    - 能指出并纠正这一错误：把‘人民幸福’误写为‘人民富裕’，表述不准确。
  aliases:
    - 中华民族伟大复兴
  category: 政治理念
  explanation: 实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想，本质是国家富强、民族振兴、人民幸福。
  misconceptions:
    - 漏掉中国梦本质三部分中任一项，如只写‘国家富强、民族振兴’。
    - 把‘人民幸福’误写为‘人民富裕’，表述不准确。
    - 误认为中国梦只是国家层面的梦，与每个中国人无关。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:中国民族工业的短暂春天
  type: Concept
  subject: 历史
  title: 中国民族工业的短暂春天
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为民族工业的短暂春天发生在一战结束后，实际是在一战期间。
    - 能指出并纠正这一错误：认为一战结束后民族工业仍高速发展，忽略战后列强卷土重来导致萧条。
  aliases:
    - 民族工业短暂春天
  category: 历史概念
  explanation: 一战期间，欧洲列强放松对华经济侵略，中国民族工业获得短暂发展，但战后萧条。
  misconceptions:
    - 误以为民族工业的短暂春天发生在一战结束后，实际是在一战期间。
    - 认为一战结束后民族工业仍高速发展，忽略战后列强卷土重来导致萧条。
    - 将短暂春天的原因说成清政府放宽限制，与甲午战争后的情况混淆。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:中国特色军事变革
  type: Concept
  subject: 历史
  title: 中国特色军事变革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国特色军事变革以机械化而非信息化为核心
    - 能指出并纠正这一错误：认为军事变革始于21世纪初
  aliases: []
  category: 军事
  explanation: 20世纪90年代起，以信息化为核心，推进军事变革，提高防卫作战能力。
  misconceptions:
    - 认为中国特色军事变革以机械化而非信息化为核心；实际以信息化为核心。
    - 认为军事变革始于21世纪初；实际是20世纪90年代起。
    - 认为军事变革就是增加军队数量；实际是提高防卫作战能力的信息化变革。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:中国特色大国外交
  type: Concept
  subject: 历史
  title: 中国特色大国外交
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把外交旗帜‘和平、发展、合作、共赢’写成‘和平、发展、合作、共享’。
    - 能指出并纠正这一错误：误以为中国特色大国外交的目标是构建人类命运共同体，忽略了‘新型国际关系’。
  aliases: []
  category: 理论
  explanation: 2014年习近平提出，高举和平、发展、合作、共赢旗帜，推动建设新型国际关系。
  misconceptions:
    - 把外交旗帜‘和平、发展、合作、共赢’写成‘和平、发展、合作、共享’。
    - 误以为中国特色大国外交的目标是构建人类命运共同体，忽略了‘新型国际关系’。
    - 记错提出时间，误认为是2013年提出，实际是2014年。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:中国特色现代化武器装备体系
  type: Concept
  subject: 历史
  title: 中国特色现代化武器装备体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中国特色现代化武器装备体系只强调引进国外技术，忽视自主创新。
    - 能指出并纠正这一错误：以偏概全，认为该体系仅指陆军装备，忽略诸军兵种体系化建设。
  aliases: []
  category: 军事概念
  explanation: 适应信息化战争要求，具有中国特色的现代化武器装备体系，强调自主创新和体系化建设。
  misconceptions:
    - 误认为中国特色现代化武器装备体系只强调引进国外技术，忽视自主创新。
    - 以偏概全，认为该体系仅指陆军装备，忽略诸军兵种体系化建设。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S3.md
- id: concept:历史:中国特色社会主义制度
  type: Concept
  subject: 历史
  title: 中国特色社会主义制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为十九届四中全会确立了中国特色社会主义制度，实际上只是坚持和完善。
    - 能指出并纠正这一错误：把‘推进国家治理体系和治理能力现代化’漏掉‘体系’或‘现代化’。
  aliases: []
  category: 制度体系
  explanation: 2019年中共十九届四中全会研究坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化。
  misconceptions:
    - 误以为十九届四中全会确立了中国特色社会主义制度，实际上只是坚持和完善。
    - 把‘推进国家治理体系和治理能力现代化’漏掉‘体系’或‘现代化’。
    - 认为中国特色社会主义制度到2019年才形成，实际早已形成并发展。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:中国特色社会主义新时代
  type: Concept
  subject: 历史
  title: 中国特色社会主义新时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为新时代始于2017年中共十九大，忽视十八大后已进入新时代。
    - 能指出并纠正这一错误：错误将新时代等同于“全面建成小康社会”，其实小康是目标之一，新时代是历史方位。
  aliases:
    - 新时代
  category: 历史阶段
  explanation: 中共十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。
  misconceptions:
    - 误认为新时代始于2017年中共十九大，忽视十八大后已进入新时代。
    - 错误将新时代等同于“全面建成小康社会”，其实小康是目标之一，新时代是历史方位。
    - 认为新时代是指中国进入社会主义高级阶段，实际仍是初级阶段。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:中国特色社会主义理论体系
  type: Concept
  subject: 历史
  title: 中国特色社会主义理论体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把毛泽东思想归入中国特色社会主义理论体系，实际该体系不包括。
    - 能指出并纠正这一错误：误以为该体系只包含邓小平理论，忽略‘三个代表’重要思想和科学发展观。
  aliases: []
  category: 理论体系
  explanation: 包括邓小平理论、'三个代表'重要思想以及科学发展观等重大战略思想在内的科学理论体系，实现了马克思主义中国化新的飞跃。
  misconceptions:
    - 误把毛泽东思想归入中国特色社会主义理论体系，实际该体系不包括。
    - 误以为该体系只包含邓小平理论，忽略‘三个代表’重要思想和科学发展观。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:中国近现代史大事年表（上）
  type: Concept
  subject: 历史
  title: 中国近现代史大事年表（上）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把洋务运动时间记成1898年，与戊戌变法同时，实际洋务运动兴起于19世纪60年代。
    - 能指出并纠正这一错误：将甲午战争与八国联军侵华顺序颠倒，误认为先有八国联军后才有甲午战争。
  aliases:
    - 中国近现代史大事年表
  category: 历史年表
  explanation: 列举1839年至1911年间中国近代史上的重大事件，如鸦片战争、太平天国运动、洋务运动、戊戌变法、辛亥革命等。
  misconceptions:
    - 把洋务运动时间记成1898年，与戊戌变法同时，实际洋务运动兴起于19世纪60年代。
    - 将甲午战争与八国联军侵华顺序颠倒，误认为先有八国联军后才有甲午战争。
    - 把《辛丑条约》误记为1895年签订，实际是1901年，与《马关条约》混为一谈。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C8/sections/S2.md
- id: concept:历史:中国远征军
  type: Concept
  subject: 历史
  title: 中国远征军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国远征军入缅作战发生于1941年，实际是1942年初
    - 能指出并纠正这一错误：把中国远征军的作战区域说成在中国境内，忽略了‘入缅甸’这一关键信息
  aliases: []
  category: 历史事件
  explanation: 1942年初，中国组编远征军入缅甸作战，取得仁安羌战役胜利，后反攻取得最终胜利，为世界反法西斯战争作出重要贡献。
  misconceptions:
    - 误以为中国远征军入缅作战发生于1941年，实际是1942年初
    - 把中国远征军的作战区域说成在中国境内，忽略了‘入缅甸’这一关键信息
    - 误将中国远征军与抗美援朝中的志愿军混淆，认为都是出国作战的相同部队
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:中国远征军入缅作战
  type: Concept
  subject: 历史
  title: 中国远征军入缅作战
