- id: concept:历史:1787年美国宪法
  type: Concept
  subject: 历史
  title: 1787年美国宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1787年宪法早于《独立宣言》，实际独立宣言在前。
    - 能指出并纠正这一错误：误认为三权分立由华盛顿提出，实际是孟德斯鸠的理论。
  aliases:
    - 美国宪法
  category: 法律文献
  explanation: 世界上第一部资产阶级成文宪法，确立三权分立、联邦制共和政体。
  misconceptions:
    - 误认为1787年宪法早于《独立宣言》，实际独立宣言在前。
    - 误认为三权分立由华盛顿提出，实际是孟德斯鸠的理论。
    - 误认为它是世界上第一部宪法，忽略'资产阶级成文宪法'的限定。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S4.md
- id: concept:历史:1791年宪法
  type: Concept
  subject: 历史
  title: 1791年宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1791年宪法废除君主制，实际确立君主立宪制。
    - 能指出并纠正这一错误：误认为参与1791年宪法选举的公民无财产限制，实际区分积极与消极公民。
  aliases: []
  category: 法律文献
  explanation: 法国大革命初期制定的宪法，废除旧制度，确立新制度基本框架，但存在积极公民与消极公民的区分。
  misconceptions:
    - 误认为1791年宪法废除君主制，实际确立君主立宪制。
    - 误认为参与1791年宪法选举的公民无财产限制，实际区分积极与消极公民。
    - 误将1791年宪法与《拿破仑法典》当成同一部法典，二者相差十三年。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:1917年墨西哥宪法
  type: Concept
  subject: 历史
  title: 1917年墨西哥宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为它是社会主义性质，事实上仍维护资本主义私有制
    - 能指出并纠正这一错误：认为它颁布于墨西哥革命爆发前，未体现革命成果
  aliases:
    - 墨西哥1917年宪法
  category: 法律文献
  explanation: 1917年颁布，规定自然资源归国家所有、收回租借地、分配土地、保障劳工权益等，体现革命成果。
  misconceptions:
    - 误以为它是社会主义性质，事实上仍维护资本主义私有制
    - 认为它颁布于墨西哥革命爆发前，未体现革命成果
    - 只记分配土地，忽略自然资源国有和劳工权益条款
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:1954年宪法
  type: Concept
  subject: 历史
  title: 1954年宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《共同纲领》是新中国第一部宪法，忽视其临时宪法性质。
    - 能指出并纠正这一错误：把1954年宪法确立的制度说成政治协商制度，实际是人民代表大会制度。
  aliases:
    - 《中华人民共和国宪法》
  category: 法律文献
  explanation: 第一部社会主义类型的宪法，确立了人民代表大会制度，规定了国家性质和政治制度。
  misconceptions:
    - 误认为《共同纲领》是新中国第一部宪法，忽视其临时宪法性质。
    - 把1954年宪法确立的制度说成政治协商制度，实际是人民代表大会制度。
    - 认为1954年宪法通过时我国已确立社会主义制度，实际三大改造尚未完成。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:20世纪70年代初中国外交新局面
  type: Concept
  subject: 历史
  title: 20世纪70年代初中国外交新局面
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把1972年尼克松访华当作中美正式建交，实际建交在1979年。
    - 能指出并纠正这一错误：认为中国恢复联合国合法席位是在1972年，实际是1971年10月。
  aliases:
    - 70年代外交成就
  category: 历史事件
  explanation: 20世纪70年代初，中国外交取得重大突破，包括恢复联合国合法席位、中美关系正常化、中日建交等，开创了外交新局面。
  misconceptions:
    - 把1972年尼克松访华当作中美正式建交，实际建交在1979年。
    - 认为中国恢复联合国合法席位是在1972年，实际是1971年10月。
    - 认为中日建交晚于中美建交，实际中日建交1972年早于1979年中美建交。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:863计划
  type: Concept
  subject: 历史
  title: 863计划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“863”指1986年3月3日，实际得名于1986年3月提出的建议
    - 能指出并纠正这一错误：误以为钱学森是提出863计划的四位科学家之一
  aliases:
    - 国家高技术研究发展计划
  category: 历史事件
  explanation: 1986年3月，四位科学家建议跟踪世界先进水平、发展高技术，后形成国家高技术研究发展计划。
  misconceptions:
    - 认为“863”指1986年3月3日，实际得名于1986年3月提出的建议
    - 误以为钱学森是提出863计划的四位科学家之一
    - 误把863计划等同于“星火计划”，以为是农村科技推广计划
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S3.md
- id: concept:历史:“七千人大会”
  type: Concept
  subject: 历史
  title: “七千人大会”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“七千人大会”当作1966年“文革”后的会议，实际是1962年召开。
    - 能指出并纠正这一错误：认为“七千人大会”提出了“八字方针”，实际“八字方针”在1961年已提出。
  aliases:
    - 七千人大会
  category: 历史事件/会议
  explanation: 1962年中共中央召开的扩大的中央工作会议，总结“大跃进”以来的经验教训，增强党的凝聚力。
  misconceptions:
    - 把“七千人大会”当作1966年“文革”后的会议，实际是1962年召开。
    - 认为“七千人大会”提出了“八字方针”，实际“八字方针”在1961年已提出。
    - 将“七千人大会”与“中共八大”混为一谈，二者会议主题不同。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“三个代表”重要思想
  type: Concept
  subject: 历史
  title: “三个代表”重要思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘三个代表’重要思想记为邓小平提出，实际是江泽民提出的。
    - 能指出并纠正这一错误：把‘三个代表’内容漏写为只代表先进生产力，忽略另两个代表。
  aliases:
    - 三个代表重要思想
  category: 指导思想
  explanation: 以江泽民为主要代表的中国共产党人形成的重要思想，是中国特色社会主义理论体系的重要组成部分。
  misconceptions:
    - 误将‘三个代表’重要思想记为邓小平提出，实际是江泽民提出的。
    - 把‘三个代表’内容漏写为只代表先进生产力，忽略另两个代表。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:“两弹一星”
  type: Concept
  subject: 历史
  title: “两弹一星”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“两弹一星”的“两弹”指导弹和氢弹，实际是原子弹和氢弹。
    - 能指出并纠正这一错误：认为第一颗原子弹爆炸成功是在1967年，实际是1964年。
  aliases:
    - 两弹一星
  category: 科技成就
  explanation: 指原子弹、氢弹和人造地球卫星的研制成功，增强了国防实力，提高了国际地位。
  misconceptions:
    - 认为“两弹一星”的“两弹”指导弹和氢弹，实际是原子弹和氢弹。
    - 认为第一颗原子弹爆炸成功是在1967年，实际是1964年。
    - 将“两弹一星”的功绩完全归于某一人，忽视集体贡献。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S2.md
- id: concept:历史:“九一三事件”
  type: Concept
  subject: 历史
  title: “九一三事件”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把林彪当作“四人帮”成员，林彪是反革命集团头目，不属于“四人帮”。
    - 能指出并纠正这一错误：认为“九一三事件”发生在1976年，实际是1971年。
  aliases:
    - 九一三
    - 九一三事件
  category: 历史事件
  explanation: 1971年林彪反革命集团阴谋政变失败，林彪等人外逃坠机身亡的事件。
  misconceptions:
    - 把林彪当作“四人帮”成员，林彪是反革命集团头目，不属于“四人帮”。
    - 认为“九一三事件”发生在1976年，实际是1971年。
    - 说林彪在事件中“被逮捕”，实际是外逃坠机身亡。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“双百”方针
  type: Concept
  subject: 历史
  title: “双百”方针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“双百”方针是1958年提出的，实际是1956年。
    - 能指出并纠正这一错误：把“双百”方针理解为政治斗争手段，实际是促进科学文化发展。
  aliases:
    - 百花齐放、百家争鸣
    - 双百方针
    - 百花齐放，百家争鸣
  category: 文化政策
  explanation: 1956年毛泽东提出的“百花齐放、百家争鸣”方针，促进艺术发展和科学进步。
  misconceptions:
    - 认为“双百”方针是1958年提出的，实际是1956年。
    - 把“双百”方针理解为政治斗争手段，实际是促进科学文化发展。
    - 认为“双百”方针在“文革”时期仍然有效，实际受到破坏。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“四个现代化”
  type: Concept
  subject: 历史
  title: “四个现代化”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“四个现代化”的提出者记作毛泽东，实际是周恩来。
    - 能指出并纠正这一错误：认为“四个现代化”包括“工业化、农业化、科技化”等错误表述，实际是农业、工业、国防、科学技术。
  aliases:
    - 四个现代化
  category: 历史目标
  explanation: 1964年周恩来提出的建设现代农业、现代工业、现代国防和现代科学技术的战略目标。
  misconceptions:
    - 把“四个现代化”的提出者记作毛泽东，实际是周恩来。
    - 认为“四个现代化”包括“工业化、农业化、科技化”等错误表述，实际是农业、工业、国防、科学技术。
    - 认为“四个现代化”是在1958年总路线中提出的，实际是1964年。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“四五运动”
  type: Concept
  subject: 历史
  title: “四五运动”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“四五运动”是1976年5月4日发生的，实际是清明节前后（4月）。
    - 能指出并纠正这一错误：把“四五运动”误认为是纪念毛泽东，实际是悼念周恩来。
  aliases:
    - 四五运动
  category: 历史事件
  explanation: 1976年清明节前后群众在天安门广场悼念周恩来、声讨“四人帮”的运动，为粉碎“四人帮”奠定群众基础。
  misconceptions:
    - 认为“四五运动”是1976年5月4日发生的，实际是清明节前后（4月）。
    - 把“四五运动”误认为是纪念毛泽东，实际是悼念周恩来。
    - 认为“四五运动”是学生运动，实际是群众自发运动。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“四人帮”
  type: Concept
  subject: 历史
  title: “四人帮”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“四人帮”成员写错，如将张春桥误作“张春乔”。
    - 能指出并纠正这一错误：认为“四人帮”被粉碎的时间是1976年9月，实际是10月。
  aliases:
    - 江青反革命集团
  category: 历史人物集团
  explanation: 指江青、王洪文、张春桥、姚文元组成的反革命集团，1976年被粉碎。
  misconceptions:
    - 把“四人帮”成员写错，如将张春桥误作“张春乔”。
    - 认为“四人帮”被粉碎的时间是1976年9月，实际是10月。
    - 把林彪和“四人帮”混为一谈，认为林彪属于“四人帮”。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“大跃进”运动
  type: Concept
  subject: 历史
  title: “大跃进”运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“大跃进”是1956年社会主义改造后发起的，实际是1958年。
    - 能指出并纠正这一错误：认为“大跃进”促进了国民经济快速发展，实际导致了严重困难。
  aliases:
    - 大跃进
  category: 历史事件
  explanation: 1958年发动的盲目追求高速度、高指标的运动，忽视了客观经济规律，造成国民经济困难。
  misconceptions:
    - 认为“大跃进”是1956年社会主义改造后发起的，实际是1958年。
    - 认为“大跃进”促进了国民经济快速发展，实际导致了严重困难。
    - 将“大跃进”与“人民公社化运动”混为一谈，认为是一个运动。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“引进来”和“走出去”相结合战略
  type: Concept
  subject: 历史
  title: “引进来”和“走出去”相结合战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为走出去仅指商品出口，不包括到海外投资办厂
    - 能指出并纠正这一错误：认为引进来与走出去是先后两个阶段，先引进后走出去
  aliases:
    - 引进来和走出去相结合战略
  category: 开放战略
  explanation: 世纪之交根据经济全球化新趋势提出，鼓励国有企业到国外投资办厂，参与国际竞争。
  misconceptions:
    - 认为走出去仅指商品出口，不包括到海外投资办厂；实际上还包括参与国际竞争。
    - 认为引进来与走出去是先后两个阶段，先引进后走出去；实际上二者是同时结合的战略。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:“文化大革命”
  type: Concept
  subject: 历史
  title: “文化大革命”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“文化大革命”是一场文化领域的革新运动，实际是政治内乱。
    - 能指出并纠正这一错误：把“文化大革命”的时间写成1966-1977年，实际是1966-1976年。
  aliases:
    - 文革
    - 文化大革命
  category: 历史事件
  explanation: 1966年至1976年由领导者错误发动、被反革命集团利用的内乱，给党、国家和人民带来严重挫折和损失。
  misconceptions:
    - 认为“文化大革命”是一场文化领域的革新运动，实际是政治内乱。
    - 把“文化大革命”的时间写成1966-1977年，实际是1966-1976年。
    - 认为“文化大革命”结束后紧接着就是改革开放，实际中间有“两年徘徊”时期。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“调整、巩固、充实、提高”方针
  type: Concept
  subject: 历史
  title: “调整、巩固、充实、提高”方针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为该方针是1962年“七千人大会”提出的，实际是1961年提出。
    - 能指出并纠正这一错误：把“八字方针”的顺序记错，如写成“调整、充实、巩固、提高”。
  aliases:
    - 八字方针
  category: 历史政策
  explanation: 即八字方针，1961年实行，调整国民经济，恢复发展生产。
  misconceptions:
    - 认为该方针是1962年“七千人大会”提出的，实际是1961年提出。
    - 把“八字方针”的顺序记错，如写成“调整、充实、巩固、提高”。
    - 认为该方针旨在加快“大跃进”的速度，实际是纠正“大跃进”造成的困难。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:“鼓足干劲、力争上游、多快好省地建设社会主义”总路线
  type: Concept
  subject: 历史
  title: “鼓足干劲、力争上游、多快好省地建设社会主义”总路线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为总路线是1956年中共八大提出的，实际是1958年。
    - 能指出并纠正这一错误：记忆总路线内容时漏掉“力争上游”或写错顺序。
  aliases:
    - 总路线
  category: 历史政策
  explanation: 1958年提出的总路线，反映了人民愿望但急于求成，忽视客观规律。
  misconceptions:
    - 认为总路线是1956年中共八大提出的，实际是1958年。
    - 记忆总路线内容时漏掉“力争上游”或写错顺序。
    - 认为总路线完全正确，忽视了它急于求成、忽视客观规律的缺陷。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:《中共中央关于党的百年奋斗重大成就和历史经验的决议》
  type: Concept
  subject: 历史
  title: 《中共中央关于党的百年奋斗重大成就和历史经验的决议》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《决议》在中共二十大上通过，实际是2021年十九届六中全会。
    - 能指出并纠正这一错误：记成《决议》仅总结成就，遗漏总结历史经验。
  aliases:
    - 第三个历史决议
  category: 历史文献
  explanation: 2021年11月中共十九届六中全会通过，全面总结党的百年奋斗重大成就和历史经验，重点总结新时代党和国家事业取得的历史性成就。
  misconceptions:
    - 误认为《决议》在中共二十大上通过，实际是2021年十九届六中全会。
    - 记成《决议》仅总结成就，遗漏总结历史经验。
    - 将它与1945年《关于若干历史问题的决议》混为一谈。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:《中华人民共和国土地改革法》
  type: Concept
  subject: 历史
  title: 《中华人民共和国土地改革法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为土地改革法是1954年颁布，实际是1950年。
    - 能指出并纠正这一错误：认为土地改革后土地归国家所有，实际是农民土地私有。
  aliases:
    - 土地改革法
  category: 历史文献
  explanation: 1950年颁布，规定废除地主阶级封建剥削的土地所有制，实行农民的土地所有制，是土地改革的法律依据。
  misconceptions:
    - 误认为土地改革法是1954年颁布，实际是1950年。
    - 认为土地改革后土地归国家所有，实际是农民土地私有。
    - 把废除地主土地所有制说成实行土地公有制，与三大改造搞混。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:《中华人民共和国宪法》
  type: Concept
  subject: 历史
  title: 《中华人民共和国宪法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1954年宪法是由中国人民政治协商会议通过。
    - 能指出并纠正这一错误：将1954年宪法与《共同纲领》混淆，认为共同纲领也是社会主义类型。
  aliases:
    - 五四宪法
  category: 法律文献
  explanation: 1954年第一届全国人大通过，是社会主义类型宪法，反映人民利益。
  misconceptions:
    - 误认为1954年宪法是由中国人民政治协商会议通过。
    - 将1954年宪法与《共同纲领》混淆，认为共同纲领也是社会主义类型。
    - 认为1954年宪法颁布标志社会主义制度确立，实际是三大改造完成。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:《中华人民共和国民法典》
  type: Concept
  subject: 历史
  title: 《中华人民共和国民法典》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误称民法典是新中国第一部民事法律，实际第一步以“法典”命名，此前有《婚姻法》等单行法。
    - 能指出并纠正这一错误：误把施行时间（2021年1月1日）当通过时间，通过是2020年5月28日。
  aliases:
    - 民法典
  category: 法律
  explanation: 2020年十三届全国人大三次会议通过，是新中国第一部以法典命名的法律，被称为'社会生活的百科全书'。
  misconceptions:
    - 误称民法典是新中国第一部民事法律，实际第一步以“法典”命名，此前有《婚姻法》等单行法。
    - 误把施行时间（2021年1月1日）当通过时间，通过是2020年5月28日。
    - 以为民法典等于所有民事法律的汇编，忽略其编纂性。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C8/sections/S1.md
- id: concept:历史:《中华人民共和国香港特别行政区维护国家安全法》
  type: Concept
  subject: 历史
  title: 《中华人民共和国香港特别行政区维护国家安全法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为香港国安法由香港特别行政区立法机关通过，实际是全国人大常委会制定。
    - 能指出并纠正这一错误：误把通过时间记成2021年，实际2020年6月30日通过。
  aliases:
    - 香港国安法
  category: 法律
  explanation: 2020年通过，旨在维护国家安全，保障香港长期繁荣稳定。
  misconceptions:
    - 误认为香港国安法由香港特别行政区立法机关通过，实际是全国人大常委会制定。
    - 误把通过时间记成2021年，实际2020年6月30日通过。
    - 以为只适用于香港永久性居民，实际适用于所有在港人员。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:《中华民国临时约法》
  type: Concept
  subject: 历史
  title: 《中华民国临时约法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《中华民国临时约法》是1912年1月1日与中华民国成立同日颁布的。
    - 能指出并纠正这一错误：认为约法规定实行总统制，而实际是责任内阁制。
  aliases:
    - 临时约法
  category: 法律文献
  explanation: 1912年3月颁布，是中国历史上第一部具有资产阶级共和国宪法性质的重要文件，肯定了民主共和制度和民主自由原则。
  misconceptions:
    - 误以为《中华民国临时约法》是1912年1月1日与中华民国成立同日颁布的。
    - 认为约法规定实行总统制，而实际是责任内阁制。
    - 把《中华民国临时约法》和袁世凯的《中华民国约法》混为一谈。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S5.md
- id: concept:历史:《中国土地法大纲》
  type: Concept
  subject: 历史
  title: 《中国土地法大纲》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《中国土地法大纲》是抗战时期的减租减息政策
    - 能指出并纠正这一错误：认为没收地主土地后按人口平均分配，忽略了废除封建剥削的前提
  aliases: []
  category: 文献
  explanation: 1947年中国共产党颁布，规定没收地主土地，废除封建剥削，实行耕者有其田，按人口平均分配土地。
  misconceptions:
    - 误以为《中国土地法大纲》是抗战时期的减租减息政策
    - 认为没收地主土地后按人口平均分配，忽略了废除封建剥削的前提
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:《中苏友好同盟互助条约》
  type: Concept
  subject: 历史
  title: 《中苏友好同盟互助条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为签订于1949年10月1日，实际是1950年2月。
    - 能指出并纠正这一错误：把该条约视为抗美援朝胜利后签订，时间颠倒。
  aliases: []
  category: 外交条约
  explanation: 1950年签订，促进中苏友谊，打破帝国主义孤立。
  misconceptions:
    - 误认为签订于1949年10月1日，实际是1950年2月。
    - 把该条约视为抗美援朝胜利后签订，时间颠倒。
    - 认为条约使中国完全依附苏联，忽视独立自主方针。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:《义勇军进行曲》
  type: Concept
  subject: 历史
  title: 《义勇军进行曲》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把作词者田汉写成聂耳，作曲者聂耳写成田汉。
    - 能指出并纠正这一错误：认为国歌在1949年开国大典上才首次确定，实际是政协会议确定。
  aliases:
    - 国歌
  category: 历史文献
  explanation: 田汉作词、聂耳作曲，被定为中华人民共和国国歌。
  misconceptions:
    - 把作词者田汉写成聂耳，作曲者聂耳写成田汉。
    - 认为国歌在1949年开国大典上才首次确定，实际是政协会议确定。
    - 误认为《义勇军进行曲》创作于抗日战争胜利后，实际是1935年。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:《九国公约》
  type: Concept
  subject: 历史
  title: 《九国公约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《九国公约》在巴黎和会签订，实际在华盛顿会议
    - 能指出并纠正这一错误：认为它维护中国主权独立，实则使中国回到列强共管
  aliases:
    - 九国公约
  category: 历史文献
  explanation: 1922年华盛顿会议上签订，确立“门户开放”原则，调整列强在东亚和太平洋地区的关系。
  misconceptions:
    - 误以为《九国公约》在巴黎和会签订，实际在华盛顿会议
    - 认为它维护中国主权独立，实则使中国回到列强共管
    - 把'门户开放'说成中国提出，实际是美国主张
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:《九章算术》
  type: Concept
  subject: 历史
  title: 《九章算术》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《九章算术》成书于西汉初年，实际东汉。
    - 能指出并纠正这一错误：认为《九章算术》只讲算术，不包括代数、几何。
  aliases: []
  category: 数学成就
  explanation: 最晚成书于东汉时期，总结了东汉以前的数学知识，包括算术、代数、几何等，是当时世界上先进的数学著作。
  misconceptions:
    - 误以为《九章算术》成书于西汉初年，实际东汉。
    - 认为《九章算术》只讲算术，不包括代数、几何。
    - 把《九章算术》说成中国最早的数学著作，忽略更早的《周髀算经》。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:《五条誓文》
  type: Concept
  subject: 历史
  title: 《五条誓文》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把它当成明治维新后颁布的宪法，实际是1868年的施政纲领。
    - 能指出并纠正这一错误：误认为五条誓文废除了武士特权，它只是表明改革方向。
  aliases: []
  category: 法律文献
  explanation: 1868年日本新政府颁布的政治纲领，表明改革旧制度、向西方学习的决心，成为明治维新的政治纲领。
  misconceptions:
    - 误把它当成明治维新后颁布的宪法，实际是1868年的施政纲领。
    - 误认为五条誓文废除了武士特权，它只是表明改革方向。
    - 将五条誓文与倒幕运动口号混淆，以为是推翻幕府的号召。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:《人权宣言》
  type: Concept
  subject: 历史
  title: 《人权宣言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《人权宣言》比美国《独立宣言》更早，实际晚十三年。
    - 能指出并纠正这一错误：误认为《人权宣言》主张废除私有制，实际宣称私有财产神圣不可侵犯。
  aliases:
    - 人权宣言
  category: 法律文献
  explanation: 1789年制宪议会通过，宣告人权、法治、自由、分权、平等和保护私有财产等基本原则。
  misconceptions:
    - 误以为《人权宣言》比美国《独立宣言》更早，实际晚十三年。
    - 误认为《人权宣言》主张废除私有制，实际宣称私有财产神圣不可侵犯。
    - 误以为《人权宣言》由法国国民公会颁布，实际是制宪议会通过。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:《兰亭集序》
  type: Concept
  subject: 历史
  title: 《兰亭集序》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《兰亭集序》是王献之或颜真卿所写，实际作者是王羲之。
    - 能指出并纠正这一错误：误以为《兰亭集序》是楷书，其实它是行书作品。
  aliases: []
  category: 历史著作
  explanation: 王羲之的代表作，被称为“天下第一行书”。
  misconceptions:
    - 误认为《兰亭集序》是王献之或颜真卿所写，实际作者是王羲之。
    - 误以为《兰亭集序》是楷书，其实它是行书作品。
    - 误以为《兰亭集序》创作于唐代，实际是东晋王羲之所作。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:《共产党宣言》
  type: Concept
  subject: 历史
  title: 《共产党宣言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《共产党宣言》是巴黎公社的施政纲领，实际它发表于巴黎公社之前
    - 能指出并纠正这一错误：把《共产党宣言》发表时间记为1871年，与巴黎公社混淆
  aliases: []
  category: 文献
  explanation: 1848年马克思、恩格斯为共产主义者同盟起草的纲领，标志着马克思主义的诞生，号召无产阶级用暴力推翻资产阶级统治。
  misconceptions:
    - 误以为《共产党宣言》是巴黎公社的施政纲领，实际它发表于巴黎公社之前
    - 把《共产党宣言》发表时间记为1871年，与巴黎公社混淆
    - 认为《共产党宣言》是马克思一人撰写，忽略恩格斯
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:《共产党宣言》中文全译本
  type: Concept
  subject: 历史
  title: 《共产党宣言》中文全译本
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《共产党宣言》中文全译本是李大钊翻译的，实际是陈望道。
    - 能指出并纠正这一错误：误认为陈望道译本出版于1921年，实际是1920年8月。
  aliases: []
  category: 历史文献
  explanation: 1920年8月，陈望道翻译的《共产党宣言》中文全译本在上海出版，促进了马克思主义的广泛传播。
  misconceptions:
    - 误认为《共产党宣言》中文全译本是李大钊翻译的，实际是陈望道。
    - 误认为陈望道译本出版于1921年，实际是1920年8月。
    - 误认为该译本出版推动五四运动爆发，实际五四运动在先，传播在后。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S4.md
- id: concept:历史:《共同纲领》
  type: Concept
  subject: 历史
  title: 《共同纲领》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《共同纲领》当成新中国第一部正式宪法。
    - 能指出并纠正这一错误：误认为《共同纲领》由第一届全国人民代表大会制定。
  aliases:
    - 《中国人民政治协商会议共同纲领》
  category: 历史文献
  explanation: 1949年中国人民政治协商会议通过，是新中国的建国纲领，具有临时宪法作用，规定国家性质、政权机关等。
  misconceptions:
    - 把《共同纲领》当成新中国第一部正式宪法。
    - 误认为《共同纲领》由第一届全国人民代表大会制定。
    - 认为《共同纲领》宣布中国已进入社会主义社会。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:《关于正确处理人民内部矛盾的问题》
  type: Concept
  subject: 历史
  title: 《关于正确处理人民内部矛盾的问题》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把该文主题说成'阶级斗争'或'敌我矛盾'，实际是正确处理人民内部矛盾。
    - 能指出并纠正这一错误：误以为它是1956年《论十大关系》的延续或中共八大报告，忽略1957年发表背景。
  aliases: []
  category: 文献
  explanation: 1957年毛泽东发表，把正确处理人民内部矛盾作为国家政治生活的主题，形成系统学说，具有开创意义。
  misconceptions:
    - 把该文主题说成'阶级斗争'或'敌我矛盾'，实际是正确处理人民内部矛盾。
    - 误以为它是1956年《论十大关系》的延续或中共八大报告，忽略1957年发表背景。
    - 认为'人民内部矛盾'包括对抗性的地主与农民矛盾，错把敌我矛盾归入其中。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:《农政全书》
  type: Concept
  subject: 历史
  title: 《农政全书》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《农政全书》记成宋应星所著，与《天工开物》混为一谈。
    - 能指出并纠正这一错误：误认为该书只介绍明朝农业，忽略其总结古代农业生产经验。
  aliases: []
  category: 科技文化
  explanation: 徐光启所著农业科学巨著，全面总结古代农业生产经验和技术。
  misconceptions:
    - 把《农政全书》记成宋应星所著，与《天工开物》混为一谈。
    - 误认为该书只介绍明朝农业，忽略其总结古代农业生产经验。
    - 误将徐光启当成清代人，实际他是明代科学家。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:《几何原本》翻译
  type: Concept
  subject: 历史
  title: 《几何原本》翻译
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《几何原本》是徐光启独立翻译的，没有利玛窦参与。
    - 能指出并纠正这一错误：将利玛窦误记为汤若望或南怀仁，导致翻译者张冠李戴。
  aliases: []
  category: 历史
  explanation: 徐光启与利玛窦共同翻译的古希腊数学著作，对中国数学发展有深远影响，定下“几何”等术语。
  misconceptions:
    - 误以为《几何原本》是徐光启独立翻译的，没有利玛窦参与。
    - 将利玛窦误记为汤若望或南怀仁，导致翻译者张冠李戴。
    - 认为《几何原本》是徐光启写的中国算术书，而非古希腊数学译著。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S8.md
- id: concept:历史:《凡尔赛条约》
  type: Concept
  subject: 历史
  title: 《凡尔赛条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《凡尔赛条约》当成与奥匈签订，实际是德国
    - 能指出并纠正这一错误：认为它只规定德国疆界，不包括军备和赔款
  aliases:
    - 对德和约
    - 凡尔赛条约
    - 《协约及参战各国对德和约》
  category: 历史文献
  explanation: 1919年协约国与德国签订的和约，规定德国疆界、军备、赔款等，是凡尔赛体系的核心。
  misconceptions:
    - 误把《凡尔赛条约》当成与奥匈签订，实际是德国
    - 认为它只规定德国疆界，不包括军备和赔款
    - 把凡尔赛体系等同于《凡尔赛条约》，忽略其他和约
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:《北京条约》
  type: Concept
  subject: 历史
  title: 《北京条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《北京条约》签订时间误记为1858年，与《天津条约》颠倒。
    - 能指出并纠正这一错误：错把割让九龙半岛南端写成割让整个香港岛或九龙全部。
  aliases:
    - 北京条约
  category: 条约
  explanation: 1860年清政府与英法签订的不平等条约，承认《天津条约》有效，增开天津为商埠，割九龙半岛南端给英国，赔款增加。
  misconceptions:
    - 将《北京条约》签订时间误记为1858年，与《天津条约》颠倒。
    - 错把割让九龙半岛南端写成割让整个香港岛或九龙全部。
    - 误认为《北京条约》是《天津条约》的附件而非独立条约。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:《十二铜表法》
  type: Concept
  subject: 历史
  title: 《十二铜表法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《十二铜表法》是古希腊雅典颁布的成文法
    - 能指出并纠正这一错误：误认为《十二铜表法》早于《汉谟拉比法典》
  aliases:
    - 十二铜表法
  category: 法律文献
  explanation: 公元前450年左右罗马颁布的成文法，涉及诉讼程序、所有权等，使定罪量刑有文字依据。
  misconceptions:
    - 误认为《十二铜表法》是古希腊雅典颁布的成文法
    - 误认为《十二铜表法》早于《汉谟拉比法典》
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:《千金方》
  type: Concept
  subject: 历史
  title: 《千金方》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《千金方》当成唐朝政府编修的药典，实际是孙思邈个人著作。
    - 能指出并纠正这一错误：误以为《千金方》是李时珍所著，与《本草纲目》混淆。
  aliases: []
  category: 医学著作
  explanation: 孙思邈所著，总结唐以前医学理论和实践经验，收集大量药方和药物。
  misconceptions:
    - 把《千金方》当成唐朝政府编修的药典，实际是孙思邈个人著作。
    - 误以为《千金方》是李时珍所著，与《本草纲目》混淆。
    - 认为《千金方》只收药方，没有医学理论总结。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:《南京条约》
  type: Concept
  subject: 历史
  title: 《南京条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《南京条约》开放的通商口岸误记为包括南京，实际五口不含南京
    - 能指出并纠正这一错误：认为《南京条约》割让的是九龙半岛，实际是香港岛
  aliases:
    - 中英《南京条约》
  category: 不平等条约
  explanation: 1842年清政府与英国签订的中国近代史上第一个丧权辱国的不平等条约，主要内容包括开放五口通商、割让香港岛、赔款等。
  misconceptions:
    - 把《南京条约》开放的通商口岸误记为包括南京，实际五口不含南京
    - 认为《南京条约》割让的是九龙半岛，实际是香港岛
    - 混淆《南京条约》签订时间，误记为《马关条约》的1895年
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:《变法通议》
  type: Concept
  subject: 历史
  title: 《变法通议》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《变法通议》是严复在《国闻报》上发表的系列文章。
    - 能指出并纠正这一错误：把'法者天下之公器也'记在康有为名下，实为梁启超名句。
  aliases: []
  category: 著作
  explanation: 梁启超在《时务报》上发表的系列文章，提出'法者天下之公器也，变者天下之公理也'，系统阐述变法主张。
  misconceptions:
    - 误以为《变法通议》是严复在《国闻报》上发表的系列文章。
    - 把'法者天下之公器也'记在康有为名下，实为梁启超名句。
    - 将《变法通议》与《天演论》混为一谈，一为政论一为译著。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:《向日葵》
  type: Concept
  subject: 历史
  title: 《向日葵》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《向日葵》是莫奈的睡莲系列，实际为梵高所作。
    - 能指出并纠正这一错误：认为《向日葵》表达悲观厌世，实际是赞美生命与美好生活。
  aliases: []
  category: 美术作品
  explanation: 梵高的代表作，以明亮黄色花瓣表达对生命的赞美和对美好生活的向往。
  misconceptions:
    - 误以为《向日葵》是莫奈的睡莲系列，实际为梵高所作。
    - 认为《向日葵》表达悲观厌世，实际是赞美生命与美好生活。
    - 将梵高归为印象派创始人，实际他是后印象派代表。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S3.md
- id: concept:历史:《和平法令》
  type: Concept
  subject: 历史
  title: 《和平法令》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为它在二月革命后颁布，实际是十月革命后
    - 能指出并纠正这一错误：认为它主张继续战争、割地赔款，与事实相反
  aliases: []
  category: 历史文献
  explanation: 十月革命后苏维埃政府颁布的法令，建议交战国停战和谈，缔结不割地不赔款和约。
  misconceptions:
    - 误以为它在二月革命后颁布，实际是十月革命后
    - 认为它主张继续战争、割地赔款，与事实相反
    - 把《和平法令》和《土地法令》内容混为一谈
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S2.md
- id: concept:历史:《唐本草》
  type: Concept
  subject: 历史
  title: 《唐本草》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《唐本草》是孙思邈编写，实际由唐高宗时政府组织编修。
    - 能指出并纠正这一错误：把《唐本草》和《千金方》的顺序颠倒，以为《唐本草》早于《千金方》。
  aliases: []
  category: 医学著作
  explanation: 唐高宗时编修，是世界上第一部由国家编定颁布的药典。
  misconceptions:
    - 误认为《唐本草》是孙思邈编写，实际由唐高宗时政府组织编修。
    - 把《唐本草》和《千金方》的顺序颠倒，以为《唐本草》早于《千金方》。
    - 认为《唐本草》是世界上第一部药物学著作，忽略“由国家编定颁布”这一条件。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:《四库全书》
  type: Concept
  subject: 历史
  title: 《四库全书》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《四库全书》是明朝朱棣下令编纂的，与《永乐大典》混为一谈。
    - 能指出并纠正这一错误：认为《四库全书》只收录了儒家经典，其他科技著作一概不收。
  aliases: []
  category: 历史
  explanation: 乾隆时期编纂的大型丛书，按经史子集分类，总计近8万卷，近8亿字，是古代最大的一部丛书。
  misconceptions:
    - 误以为《四库全书》是明朝朱棣下令编纂的，与《永乐大典》混为一谈。
    - 认为《四库全书》只收录了儒家经典，其他科技著作一概不收。
    - 将《四库全书》的规模说成2万卷，忽略了它近8万卷的体量。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S8.md
- id: concept:历史:《回回药方》
  type: Concept
  subject: 历史
  title: 《回回药方》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《回回药方》是中国自编的医书，实际是翻译阿拉伯的医学书籍
    - 能指出并纠正这一错误：误记成唐朝传入的阿拉伯医书，忽略元朝这一时间点
  aliases: []
  category: 科技著作
  explanation: 元朝收集翻译的阿拉伯医学书籍，记载了治疗骨折的方法。
  misconceptions:
    - 误以为《回回药方》是中国自编的医书，实际是翻译阿拉伯的医学书籍
    - 误记成唐朝传入的阿拉伯医书，忽略元朝这一时间点
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:《国闻报》
  type: Concept
  subject: 历史
  title: 《国闻报》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《国闻报》创办于上海，实际是天津报刊。
    - 能指出并纠正这一错误：把《国闻报》的主笔说成梁启超，实际主持者是严复。
  aliases: []
  category: 报刊
  explanation: 严复等主持的天津报刊，以'通上下之情''通中外之故'为宗旨，是北方最有影响的维新报刊。
  misconceptions:
    - 误以为《国闻报》创办于上海，实际是天津报刊。
    - 把《国闻报》的主笔说成梁启超，实际主持者是严复。
    - 认为《国闻报》宗旨是'变法之公理'，实际是'通上下之情''通中外之故'。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:《国际歌》
  type: Concept
  subject: 历史
  title: 《国际歌》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《国际歌》词作者是马克思，实际是欧仁·鲍狄埃
    - 能指出并纠正这一错误：说《国际歌》在巴黎公社前就出现，实际是公社失败后创作的
  aliases: []
  category: 文化
  explanation: 全世界无产阶级的战歌，展现了无产者的革命精神和英雄气概，鼓舞了中国人民的斗争。
  misconceptions:
    - 误认为《国际歌》词作者是马克思，实际是欧仁·鲍狄埃
    - 说《国际歌》在巴黎公社前就出现，实际是公社失败后创作的
    - 把《国际歌》当作《共产党宣言》的一部分
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:《大唐西域记》
  type: Concept
  subject: 历史
  title: 《大唐西域记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《大唐西域记》是玄奘亲笔撰写，实际由他口述、弟子记录。
    - 能指出并纠正这一错误：把《大唐西域记》与《西游记》混为一谈，认为书中有神话故事。
  aliases: []
  category: 历史文献
  explanation: 玄奘口述、弟子记录的著作，记载西域和天竺的风土人情，是研究中外交流史的重要文献。
  misconceptions:
    - 误认为《大唐西域记》是玄奘亲笔撰写，实际由他口述、弟子记录。
    - 把《大唐西域记》与《西游记》混为一谈，认为书中有神话故事。
    - 误以为“西域”仅指新疆，实际还包括中亚、印度等地。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:《大宪章》
  type: Concept
  subject: 历史
  title: 《大宪章》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《大宪章》的时间说成1689年，与《权利法案》混淆。
    - 能指出并纠正这一错误：误认为《大宪章》确立了议会主权，实际只确立王权有限、王在法下。
  aliases: []
  category: 法律文献
  explanation: 1215年英格兰颁布，确立王权有限、王在法下的原则。
  misconceptions:
    - 误将《大宪章》的时间说成1689年，与《权利法案》混淆。
    - 误认为《大宪章》确立了议会主权，实际只确立王权有限、王在法下。
    - 误以为《大宪章》是资产阶级革命文件，实际是封建法律文件。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:《大明历》
  type: Concept
  subject: 历史
  title: 《大明历》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《大明历》是郭守敬编制的《授时历》，实际是祖冲之创制。
    - 能指出并纠正这一错误：误以为《大明历》是唐代颁行的历法，实际是南朝宋时创制。
  aliases: []
  category: 历史著作
  explanation: 祖冲之创制的当时最先进的历法，后来由朝廷正式颁行。
  misconceptions:
    - 误以为《大明历》是郭守敬编制的《授时历》，实际是祖冲之创制。
    - 误以为《大明历》是唐代颁行的历法，实际是南朝宋时创制。
    - 误将《大明历》当作祖冲之的数学著作，实际是历法。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:《大衍历》
  type: Concept
  subject: 历史
  title: 《大衍历》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《大衍历》是郭守敬制定的，实际郭守敬制定《授时历》。
    - 能指出并纠正这一错误：认为《大衍历》是宋朝的历法，实际由唐朝僧一行制定。
  aliases: []
  category: 科技成就
  explanation: 僧一行制定的历法，对天文学发展有重要意义。
  misconceptions:
    - 误以为《大衍历》是郭守敬制定的，实际郭守敬制定《授时历》。
    - 认为《大衍历》是宋朝的历法，实际由唐朝僧一行制定。
    - 认为《大衍历》是农书，未注意它是用于计时的天文历法。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:《天工开物》
  type: Concept
  subject: 历史
  title: 《天工开物》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《天工开物》的作者是徐光启或李时珍，而非宋应星。
    - 能指出并纠正这一错误：把《天工开物》当作纯农书，忽略了它对手工业技术的总结。
  aliases: []
  category: 历史
  explanation: 明朝宋应星编著的科技名著，全面总结我国古代农业和手工业生产技术，被誉为“中国17世纪的工艺百科全书”。
  misconceptions:
    - 误以为《天工开物》的作者是徐光启或李时珍，而非宋应星。
    - 把《天工开物》当作纯农书，忽略了它对手工业技术的总结。
    - 认为“中国17世纪的工艺百科全书”是指《农政全书》或《本草纲目》。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:《天朝田亩制度》
  type: Concept
  subject: 历史
  title: 《天朝田亩制度》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《天朝田亩制度》是洪仁玕提出的，实际是洪秀全颁布
    - 能指出并纠正这一错误：把按人口平均分配误写成按户分配，或忽略‘平均’只提‘分地’
  aliases: []
  category: 文献
  explanation: 太平天国定都天京后颁布的土地纲领，主张按人口和年龄平均分配土地，反映了农民的土地要求，但带有空想色彩。
  misconceptions:
    - 误以为《天朝田亩制度》是洪仁玕提出的，实际是洪秀全颁布
    - 把按人口平均分配误写成按户分配，或忽略‘平均’只提‘分地’
    - 认为它已真正实行，实际因空想未付诸实施
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:《天津条约》
  type: Concept
  subject: 历史
  title: 《天津条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《天津条约》只与英法签订，忽略俄美两国。
    - 能指出并纠正这一错误：将允许外国公使进驻北京误归入《北京条约》内容。
  aliases:
    - 天津条约
  category: 条约
  explanation: 1858年清政府与俄、美、英、法四国签订的不平等条约，规定外国公使进驻北京、增开通商口岸、外国商船军舰可在长江各口岸自由航行等。
  misconceptions:
    - 误以为《天津条约》只与英法签订，忽略俄美两国。
    - 将允许外国公使进驻北京误归入《北京条约》内容。
    - 错把增开通商口岸等同于《南京条约》的五口通商。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:《孙子兵法》
  type: Concept
  subject: 历史
  title: 《孙子兵法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《孙子兵法》是战国孙膑所作，实际作者是春秋孙武。
    - 能指出并纠正这一错误：错把‘知己知彼，百战不殆’当成孙膑名言，实际出自《孙子兵法》。
  aliases: []
  category: 文献典籍
  explanation: 孙武所著，奠定了我国古代军事理论的基础。
  misconceptions:
    - 误认为《孙子兵法》是战国孙膑所作，实际作者是春秋孙武。
    - 错把‘知己知彼，百战不殆’当成孙膑名言，实际出自《孙子兵法》。
    - 误称《孙子兵法》为法家著作，实际属于兵家。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:《宅地法》
  type: Concept
  subject: 历史
  title: 《宅地法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为宅地法是废除奴隶制的法令，实际是鼓励西部垦殖的土地法。
    - 能指出并纠正这一错误：把宅地法与《解放黑人奴隶宣言》时间颠倒，实际宅地法颁布略早。
  aliases:
    - 宅第安地法
  category: 法律文献
  explanation: 1862年联邦政府颁布，鼓励农民到西部耕种，规定公民可低价获得土地，连续耕种5年后成为土地主人。
  misconceptions:
    - 误认为宅地法是废除奴隶制的法令，实际是鼓励西部垦殖的土地法。
    - 把宅地法与《解放黑人奴隶宣言》时间颠倒，实际宅地法颁布略早。
    - 误以为获得土地需付高价，实际连续耕种5年即可低价获得。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S3.md
- id: concept:历史:《寂静的春天》
  type: Concept
  subject: 历史
  title: 《寂静的春天》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把它当成一篇小说，实则是一部揭示杀虫剂危害的科普/纪实作品。
    - 能指出并纠正这一错误：误认为是美国前总统戈尔的作品，实际作者是蕾切尔·卡森。
  aliases: []
  category: 历史文献
  explanation: 1962年美国生物学家蕾切尔·卡森发表，揭示杀虫剂对环境的危害，推动环境保护运动。
  misconceptions:
    - 把它当成一篇小说，实则是一部揭示杀虫剂危害的科普/纪实作品。
    - 误认为是美国前总统戈尔的作品，实际作者是蕾切尔·卡森。
    - 认为该书直接导致所有杀虫剂被禁用，其实只是推动环保运动。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:《尼布楚条约》
  type: Concept
  subject: 历史
  title: 《尼布楚条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《尼布楚条约》是清政府被迫签订的不平等条约，实际是双方平等协商的边界条约。
    - 能指出并纠正这一错误：错把签约时间记为康熙初年（如1660年代），应是在1689年。
  aliases: []
  category: 条约
  explanation: 1689年中俄签订的第一个边界条约，从法律上明确黑龙江和乌苏里江流域包括库页岛在内的广大地区属于中国。
  misconceptions:
    - 误认为《尼布楚条约》是清政府被迫签订的不平等条约，实际是双方平等协商的边界条约。
    - 错把签约时间记为康熙初年（如1660年代），应是在1689年。
    - 误以为条约规定割让外兴安岭以北地区给俄国，实际是确认属于中国。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:《开罗宣言》
  type: Concept
  subject: 历史
  title: 《开罗宣言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《开罗宣言》由美、英、苏三国首脑联名发表，实际没有苏联参加。
    - 能指出并纠正这一错误：误以为《开罗宣言》规定日本归还所有侵占的太平洋岛屿，而不只限于中国领土。
  aliases: []
  category: 历史文献
  explanation: 规定日本窃取的中国领土，如东北地区、台湾及其附属岛屿、澎湖群岛等，应归还中国。
  misconceptions:
    - 误以为《开罗宣言》由美、英、苏三国首脑联名发表，实际没有苏联参加。
    - 误以为《开罗宣言》规定日本归还所有侵占的太平洋岛屿，而不只限于中国领土。
    - 误以为《开罗宣言》是1945年波茨坦会议后发表的，实际是1943年开罗会议后发布。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:《徐霞客游记》
  type: Concept
  subject: 历史
  title: 《徐霞客游记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《徐霞客游记》是郦道元所著，张冠李戴。
    - 能指出并纠正这一错误：以为书中主要记载长江源头，实际对喀斯特地貌考察最著名。
  aliases: []
  category: 科技文化
  explanation: 明朝徐霞客所著地理学巨著，详细记录地貌、水文等，对喀斯特地貌考察居世界先进水平。
  misconceptions:
    - 误认为《徐霞客游记》是郦道元所著，张冠李戴。
    - 以为书中主要记载长江源头，实际对喀斯特地貌考察最著名。
    - 认为徐霞客是宋代人，忽略其生活于明朝。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:《拿破仑法典》
  type: Concept
  subject: 历史
  title: 《拿破仑法典》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《拿破仑法典》是刑法典，实际是民法典。
    - 能指出并纠正这一错误：误认为《拿破仑法典》由制宪议会制定，实际是拿破仑时期颁布。
  aliases:
    - 《法国民法典》
  category: 法律文献
  explanation: 1804年颁布的民法典，体现自由平等和私有财产神圣不可侵犯原则，成为多国民法蓝本。
  misconceptions:
    - 误认为《拿破仑法典》是刑法典，实际是民法典。
    - 误认为《拿破仑法典》由制宪议会制定，实际是拿破仑时期颁布。
    - 误将《拿破仑法典》与《人权宣言》混为一谈，两者性质不同。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:《授时历》
  type: Concept
  subject: 历史
  title: 《授时历》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为郭守敬是北宋人，实际他是元代科学家
    - 能指出并纠正这一错误：误认为《授时历》是借鉴西方历法编制，实际比公历早约300年
  aliases: []
  category: 科技成就
  explanation: 元朝郭守敬编成的历法，测定一年为365.2425天，与现行公历几乎相同，比公历早约300年。
  misconceptions:
    - 误以为郭守敬是北宋人，实际他是元代科学家
    - 误认为《授时历》是借鉴西方历法编制，实际比公历早约300年
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:《时务报》
  type: Concept
  subject: 历史
  title: 《时务报》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《时务报》是北方最有影响的报刊，北方有名的是《国闻报》。
    - 能指出并纠正这一错误：把《时务报》说成严复主持，主笔实为梁启超。
  aliases: []
  category: 报刊
  explanation: 维新运动期间在上海创办的报刊，梁启超任主笔，发表《变法通议》等文章，宣传变法思想。
  misconceptions:
    - 误以为《时务报》是北方最有影响的报刊，北方有名的是《国闻报》。
    - 把《时务报》说成严复主持，主笔实为梁启超。
    - 认为《时务报》创办于天津，实际在上海。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:《本草纲目》
  type: Concept
  subject: 历史
  title: 《本草纲目》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《本草纲目》归于孙思邈或张仲景，弄错作者。
    - 能指出并纠正这一错误：误认为《天工开物》是药物学著作，与《本草纲目》混淆。
  aliases: []
  category: 科技文化
  explanation: 李时珍所著药物学巨著，记载药物1800多种，总结古代药物学成就，影响世界。
  misconceptions:
    - 误将《本草纲目》归于孙思邈或张仲景，弄错作者。
    - 误认为《天工开物》是药物学著作，与《本草纲目》混淆。
    - 认为李时珍是清朝人，实际他是明代医学家。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:《权利法案》
  type: Concept
  subject: 历史
  title: 《权利法案》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《权利法案》于1688年通过，实际是1689年。
    - 能指出并纠正这一错误：误以为光荣革命前就有《权利法案》，实际是革命后议会通过。
  aliases: []
  category: 法律文献
  explanation: 1689年英国议会通过，限制王权，确立议会主权，为君主立宪制提供法律保障。
  misconceptions:
    - 误认为《权利法案》于1688年通过，实际是1689年。
    - 误以为光荣革命前就有《权利法案》，实际是革命后议会通过。
    - 误认为《权利法案》确立民主共和制，实际是君主立宪制。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:《查士丁尼法典》
  type: Concept
  subject: 历史
  title: 《查士丁尼法典》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《查士丁尼法典》是查士丁尼新制定的法律，其实是汇编历代罗马皇帝法令。
    - 能指出并纠正这一错误：把《查士丁尼法典》当成《罗马民法大全》的全部，忽略还有另外三部文献。
  aliases: []
  category: 历史文献
  explanation: 查士丁尼时期汇编的历代罗马皇帝法令，是《罗马民法大全》的一部分。
  misconceptions:
    - 误以为《查士丁尼法典》是查士丁尼新制定的法律，其实是汇编历代罗马皇帝法令。
    - 把《查士丁尼法典》当成《罗马民法大全》的全部，忽略还有另外三部文献。
    - 与《法学汇纂》混为一谈，分不清法典是法令汇编，而法学汇纂是法学家著作摘录。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:《桂苑笔耕集》
  type: Concept
  subject: 历史
  title: 《桂苑笔耕集》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为崔致远是唐朝人，实际他是新罗派来的留学生。
    - 能指出并纠正这一错误：误以为《桂苑笔耕集》是佛教典籍，实际是诗文集。
  aliases: []
  category: 历史文献
  explanation: 新罗人崔致远的诗文集，现存最早的古代朝鲜半岛汉文典籍。
  misconceptions:
    - 误认为崔致远是唐朝人，实际他是新罗派来的留学生。
    - 误以为《桂苑笔耕集》是佛教典籍，实际是诗文集。
    - 把崔致远说成日本人，忘记其新罗人的身份。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:《梦溪笔谈》
  type: Concept
  subject: 历史
  title: 《梦溪笔谈》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《梦溪笔谈》视为南宋或元朝著作，实际为北宋沈括所著
    - 能指出并纠正这一错误：误以为该书主要记载政治制度，忽略其科技成就内容
  aliases: []
  category: 科技著作
  explanation: 沈括所著，综合北宋许多科技成就，在科技史上有重要地位。
  misconceptions:
    - 把《梦溪笔谈》视为南宋或元朝著作，实际为北宋沈括所著
    - 误以为该书主要记载政治制度，忽略其科技成就内容
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:《水经注》
  type: Concept
  subject: 历史
  title: 《水经注》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《水经注》是东汉班固所著，忽视了作者是北魏郦道元。
    - 能指出并纠正这一错误：把《水经注》当作单纯记载河流的文学作品，忽略其地理学价值。
  aliases: []
  category: 地理著作
  explanation: 郦道元所著，记载1252条河流及流域情况，是综合性地理学著作。
  misconceptions:
    - 认为《水经注》是东汉班固所著，忽视了作者是北魏郦道元。
    - 把《水经注》当作单纯记载河流的文学作品，忽略其地理学价值。
    - 误以为《水经》是郦道元亲笔所写，实则《水经》另有作者，郦道元是为其作注。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:《永乐大典》
  type: Concept
  subject: 历史
  title: 《永乐大典》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《永乐大典》是丛书而非类书，与《四库全书》性质混淆。
    - 能指出并纠正这一错误：认为《永乐大典》是纪昀主持编纂的，忽略了明成祖时期的背景。
  aliases: []
  category: 历史
  explanation: 明成祖时编成的大型类书，全书近2.3万卷，1.1万余册，是明清大型典籍编纂的代表。
  misconceptions:
    - 误以为《永乐大典》是丛书而非类书，与《四库全书》性质混淆。
    - 认为《永乐大典》是纪昀主持编纂的，忽略了明成祖时期的背景。
    - 把《永乐大典》的卷数说成8万卷，实际只有近2.3万卷。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:《氾胜之书》
  type: Concept
  subject: 历史
  title: 《氾胜之书》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《氾胜之书》当成北魏贾思勰的《齐民要术》。
    - 能指出并纠正这一错误：认为《氾胜之书》是东汉农学著作，实际成书于西汉。
  aliases: []
  category: 农学成就
  explanation: 秦汉时期农学代表作，总结了农业生产经验，提出改良土壤、适度施肥、合理密植等方法。
  misconceptions:
    - 误将《氾胜之书》当成北魏贾思勰的《齐民要术》。
    - 认为《氾胜之书》是东汉农学著作，实际成书于西汉。
    - 以为它只讲粮食种植，忽略土壤改良、施肥等。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:《汉书》
  type: Concept
  subject: 历史
  title: 《汉书》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《汉书》说成是第一部纪传体通史。
    - 能指出并纠正这一错误：认为班固是西汉人，实际为东汉史学家。
  aliases: []
  category: 史学成就
  explanation: 东汉班固等人撰写，是我国第一部纪传体断代史，记载汉高祖至王莽时期历史，对后世官方史书编撰有很大影响。
  misconceptions:
    - 误把《汉书》说成是第一部纪传体通史。
    - 认为班固是西汉人，实际为东汉史学家。
    - 误以为《汉书》记载了整个汉代历史，实际从汉高祖到王莽。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:《汉谟拉比法典》
  type: Concept
  subject: 历史
  title: 《汉谟拉比法典》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为它是世界上第一部法典，实际上比它更早的还有《乌尔纳姆法典》等。
    - 能指出并纠正这一错误：误以为法典刻在泥板上，真实是刻在黑色玄武岩石柱上。
  aliases: []
  category: 历史
  explanation: 《汉谟拉比法典》是迄今已知世界上第一部较为完整的成文法典，刻在石柱上，内容广泛，反映古巴比伦社会。
  misconceptions:
    - 认为它是世界上第一部法典，实际上比它更早的还有《乌尔纳姆法典》等。
    - 误以为法典刻在泥板上，真实是刻在黑色玄武岩石柱上。
    - 把法典视为古埃及的法律，它反映了古巴比伦王国的情况。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:《波茨坦公告》
  type: Concept
  subject: 历史
  title: 《波茨坦公告》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《波茨坦公告》是处理德国问题的会议文件，混淆波茨坦会议与对日宣言
    - 能指出并纠正这一错误：认为《波茨坦公告》由美苏英三国发表，实际不包括苏联
  aliases:
    - 波茨坦公告
  category: 文献著作
  explanation: 1945年，中、美、英三国发表《波茨坦公告》，敦促日本无条件投降。
  misconceptions:
    - 误以为《波茨坦公告》是处理德国问题的会议文件，混淆波茨坦会议与对日宣言
    - 认为《波茨坦公告》由美苏英三国发表，实际不包括苏联
    - 把《波茨坦公告》与1943年《开罗宣言》混为一谈，忽视发表时间与内容差异
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:《消除对妇女一切形式歧视公约》
  type: Concept
  subject: 历史
  title: 《消除对妇女一切形式歧视公约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为通过时间是1995年北京世妇会，实际是1979年联合国大会通过。
    - 能指出并纠正这一错误：以为只针对发展中国家妇女，实际上全球各国都应消除歧视。
  aliases: []
  category: 历史文献
  explanation: 1979年联合国大会通过，旨在消除对妇女的歧视，实现男女平等。
  misconceptions:
    - 误认为通过时间是1995年北京世妇会，实际是1979年联合国大会通过。
    - 以为只针对发展中国家妇女，实际上全球各国都应消除歧视。
    - 将它与《世界人权宣言》混淆，误认为出台于1948年。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:《独立宣言》
  type: Concept
  subject: 历史
  title: 《独立宣言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《独立宣言》由华盛顿起草，实际是杰斐逊。
    - 能指出并纠正这一错误：误认为《独立宣言》宣布废除奴隶制，实际并未涉及黑奴问题。
  aliases: []
  category: 法律文献
  explanation: 1776年7月4日大陆会议通过，宣告北美13个殖民地独立，体现启蒙思想。
  misconceptions:
    - 误认为《独立宣言》由华盛顿起草，实际是杰斐逊。
    - 误认为《独立宣言》宣布废除奴隶制，实际并未涉及黑奴问题。
    - 误以为《独立宣言》就是美国宪法，实际前者宣告独立，后者确立政体。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:《神灭论》
  type: Concept
  subject: 历史
  title: 《神灭论》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《神灭论》是王充所著，将范缜与王充混淆。
    - 能指出并纠正这一错误：误认为范缜主张‘精神可以脱离肉体而存在’，颠倒其无神论观点。
  aliases: []
  category: 思想著作
  explanation: 范缜所著，阐述无神论思想，认为精神依附于肉体。
  misconceptions:
    - 认为《神灭论》是王充所著，将范缜与王充混淆。
    - 误认为范缜主张‘精神可以脱离肉体而存在’，颠倒其无神论观点。
    - 把范缜当作东汉思想家，时间上提前了几个世纪。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:《罗马民法大全》
  type: Concept
  subject: 历史
  title: 《罗马民法大全》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏记其中一部，如只说《查士丁尼法典》和《新法典》而忽略《法学汇纂》《法理概要》。
    - 能指出并纠正这一错误：误以为它是罗马第一部成文法，实际上早有其前身如《十二铜表法》。
  aliases: []
  category: 历史文献
  explanation: 包括《查士丁尼法典》《法学汇纂》《法理概要》《新法典》四部法律文献，奠定了欧洲民法的基础。
  misconceptions:
    - 漏记其中一部，如只说《查士丁尼法典》和《新法典》而忽略《法学汇纂》《法理概要》。
    - 误以为它是罗马第一部成文法，实际上早有其前身如《十二铜表法》。
    - 认为它只是查士丁尼时期的法律，而不了解它是历代罗马法的汇编和整理。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:《联合国家宣言》
  type: Concept
  subject: 历史
  title: 《联合国家宣言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《联合国家宣言》签署时间误记为1941年，实际上应为1942年1月
    - 能指出并纠正这一错误：误把参与国写成‘26个反法西斯国家’中的‘26’记成其他数字如‘20’或‘30’
  aliases: []
  category: 历史文献
  explanation: 1942年1月，中、美、英、苏等26个反法西斯国家共同签署，正式建立国际反法西斯统一战线。
  misconceptions:
    - 将《联合国家宣言》签署时间误记为1941年，实际上应为1942年1月
    - 误把参与国写成‘26个反法西斯国家’中的‘26’记成其他数字如‘20’或‘30’
    - 将《联合国家宣言》与《开罗宣言》混为一谈，认为都是1942年签署
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:《苏报》案
  type: Concept
  subject: 历史
  title: 《苏报》案
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《苏报》案当作同盟会领导的斗争，实际案发于1903年，同盟会尚未成立。
    - 能指出并纠正这一错误：认为章炳麟与邹容是同盟会骨干，但二人被捕时同盟会还未创立。
  aliases: []
  category: 历史事件
  explanation: 1903年清政府勾结租界当局查封《苏报》，逮捕章炳麟、邹容等，进一步暴露清政府反动本质，推动革命浪潮。
  misconceptions:
    - 误把《苏报》案当作同盟会领导的斗争，实际案发于1903年，同盟会尚未成立。
    - 认为章炳麟与邹容是同盟会骨干，但二人被捕时同盟会还未创立。
    - 混淆《苏报》案与戊戌政变，以为是维新派与顽固派的斗争。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:《英雄交响曲》
  type: Concept
  subject: 历史
  title: 《英雄交响曲》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《英雄交响曲》是莫扎特的作品，实则贝多芬于1804年完成。
    - 能指出并纠正这一错误：认为《英雄交响曲》创作于18世纪，实际完成于19世纪初。
  aliases:
    - 第三交响曲
  category: 音乐作品
  explanation: 贝多芬的代表作，完成于1804年，反映重大社会题材，标志其思想艺术成熟。
  misconceptions:
    - 误以为《英雄交响曲》是莫扎特的作品，实则贝多芬于1804年完成。
    - 认为《英雄交响曲》创作于18世纪，实际完成于19世纪初。
    - 把《英雄交响曲》与《命运交响曲》混为一谈，两者是不同作品。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S3.md
- id: concept:历史:《解放黑人奴隶宣言》
  type: Concept
  subject: 历史
  title: 《解放黑人奴隶宣言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为宣言宣布解放美国所有奴隶，实际只针对南方叛乱各州。
    - 能指出并纠正这一错误：把宣言时间记成1861年，实际是1862年颁布，1863年生效。
  aliases: []
  category: 法律文献
  explanation: 1862年林肯发表，宣布南方叛乱地区的奴隶自1863年元旦起获得自由，并可加入北方军队。
  misconceptions:
    - 误认为宣言宣布解放美国所有奴隶，实际只针对南方叛乱各州。
    - 把宣言时间记成1861年，实际是1862年颁布，1863年生效。
    - 误认为宣言发表后奴隶制度立即彻底废除，实际还需宪法修正案。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:《论十大关系》
  type: Concept
  subject: 历史
  title: 《论十大关系》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《论十大关系》当作中共八大的政治报告，实际是毛泽东在1956年作的报告。
    - 能指出并纠正这一错误：说它是探索社会主义建设道路的'开端'，同时混用中共八大'重要尝试'的评价。
  aliases:
    - 论十大关系
  category: 历史事件/文献
  explanation: 1956年毛泽东作的报告，提出调动国内外一切积极因素建设强大社会主义国家的基本方针，是探索社会主义建设道路的良好开端。
  misconceptions:
    - 误把《论十大关系》当作中共八大的政治报告，实际是毛泽东在1956年作的报告。
    - 说它是探索社会主义建设道路的'开端'，同时混用中共八大'重要尝试'的评价。
    - 忽视其发表年份，以为发表于1957年《关于正确处理人民内部矛盾的问题》之后。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:《论持久战》
  type: Concept
  subject: 历史
  title: 《论持久战》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《论持久战》发表于1937年卢沟桥事变之时，实际是1938年5月发表的。
    - 能指出并纠正这一错误：误以为《论持久战》主张抗战速胜，与事实相反，它驳斥速胜论。
  aliases: []
  category: 历史文献
  explanation: 1938年5月毛泽东发表，阐明抗日持久战战略总方针，驳斥“亡国论”和“速胜论”，对全国抗战具有战略指导意义。
  misconceptions:
    - 误以为《论持久战》发表于1937年卢沟桥事变之时，实际是1938年5月发表的。
    - 误以为《论持久战》主张抗战速胜，与事实相反，它驳斥速胜论。
    - 误以为《论持久战》是周恩来在重庆所作，实际是毛泽东在延安所作。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:《论衡》
  type: Concept
  subject: 历史
  title: 《论衡》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《论衡》是道教典籍，实际批判迷信。
    - 能指出并纠正这一错误：将作者王充误记为东汉末年的王莽。
  aliases: []
  category: 思想成就
  explanation: 东汉思想家王充所著，批判君权天授、神仙方术等虚妄之说，体现朴素的唯物主义思想倾向。
  misconceptions:
    - 误以为《论衡》是道教典籍，实际批判迷信。
    - 将作者王充误记为东汉末年的王莽。
    - 认为《论衡》主张君权天授，实际是批判它。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:《论语》
  type: Concept
  subject: 历史
  title: 《论语》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《论语》是孔子亲手编写，实为弟子及再传弟子记录编纂。
    - 能指出并纠正这一错误：把‘学而时习之’等语录记成孟子所言，张冠李戴。
  aliases: []
  category: 文献典籍
  explanation: 记录孔子及其弟子言行的著作，是儒家经典。
  misconceptions:
    - 误认为《论语》是孔子亲手编写，实为弟子及再传弟子记录编纂。
    - 把‘学而时习之’等语录记成孟子所言，张冠李戴。
    - 误将《论语》归为道家经典，实际是儒家经典。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:《诗经》
  type: Concept
  subject: 历史
  title: 《诗经》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“风、雅、颂”是按时间先后排列的三个时期作品
    - 能指出并纠正这一错误：把《诗经》说成是屈原等人创作的楚辞作品
  aliases:
    - 诗三百
  category: 文学
  explanation: 我国现存第一部诗歌总集，共305篇，分为风、雅、颂三部分。
  misconceptions:
    - 误以为“风、雅、颂”是按时间先后排列的三个时期作品
    - 把《诗经》说成是屈原等人创作的楚辞作品
    - 认为《诗经》共305篇，所以把《离骚》也算入其中
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:《资政新篇》
  type: Concept
  subject: 历史
  title: 《资政新篇》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《资政新篇》当成太平天国的土地纲领，实际是改革内政的方案
    - 能指出并纠正这一错误：认为洪仁玕是天王，实际是干王，且该纲领未在实践中推行
  aliases: []
  category: 文献
  explanation: 洪仁玕提出的向西方学习、改革内政的纲领性文件，因历史条件限制未能付诸实践。
  misconceptions:
    - 误把《资政新篇》当成太平天国的土地纲领，实际是改革内政的方案
    - 认为洪仁玕是天王，实际是干王，且该纲领未在实践中推行
    - 将《资政新篇》与《天朝田亩制度》的提出者互换
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:《资治通鉴》
  type: Concept
  subject: 历史
  title: 《资治通鉴》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《资治通鉴》是纪传体通史，与《史记》体裁相同。
    - 能指出并纠正这一错误：把《资治通鉴》记述的时间范围错记为从黄帝到北宋，实际是战国到五代。
  aliases: []
  category: 史学著作
  explanation: 北宋司马光主持编写的编年体通史巨著，记述从战国到五代1300多年历史，书名意为“鉴于往事，有资于治道”。
  misconceptions:
    - 误以为《资治通鉴》是纪传体通史，与《史记》体裁相同。
    - 把《资治通鉴》记述的时间范围错记为从黄帝到北宋，实际是战国到五代。
    - 认为《资治通鉴》由司马迁编写，张冠李戴。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:《辛丑条约》
  type: Concept
  subject: 历史
  title: 《辛丑条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把签订年份记为1900年，实际是1901年
    - 能指出并纠正这一错误：以为《辛丑条约》要求割地、开放通商口岸，实际是赔款、划使馆界
  aliases: []
  category: 历史条约
  explanation: 1901年清政府与列强签订的不平等条约，使中国完全沦为半殖民地半封建社会。
  misconceptions:
    - 误把签订年份记为1900年，实际是1901年
    - 以为《辛丑条约》要求割地、开放通商口岸，实际是赔款、划使馆界
    - 认为中国从此完全沦为殖民地，忽略半殖民地半封建性质
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:《通商章程善后条约》
  type: Concept
  subject: 历史
  title: 《通商章程善后条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《通商章程善后条约》是《天津条约》的一部分而非后续条约。
    - 能指出并纠正这一错误：将鸦片贸易合法化的时间提前到第一次鸦片战争时期。
  aliases:
    - 通商章程善后条约
  category: 条约
  explanation: 清政府与英、法、美签订的条约，以“洋药”名义承认鸦片贸易合法。
  misconceptions:
    - 误以为《通商章程善后条约》是《天津条约》的一部分而非后续条约。
    - 将鸦片贸易合法化的时间提前到第一次鸦片战争时期。
    - 误认为该条约仅与英国签订，忽略法国和美国。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:《道德经》
  type: Concept
  subject: 历史
  title: 《道德经》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《道德经》是庄子所著，实际作者为老子。
    - 能指出并纠正这一错误：错把‘无为而治’当成儒家主张，实为道家老子的思想。
  aliases:
    - 《老子》
  category: 文献典籍
  explanation: 又称《老子》，是道家的经典，集中体现了老子的思想。
  misconceptions:
    - 误认为《道德经》是庄子所著，实际作者为老子。
    - 错把‘无为而治’当成儒家主张，实为道家老子的思想。
    - 误称《道德经》为法家典籍，混淆学派归属。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:《金刚经》
  type: Concept
  subject: 历史
  title: 《金刚经》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《金刚经》是手抄佛经，实际是雕版印刷品。
    - 能指出并纠正这一错误：把《金刚经》当作活字印刷品，活字印刷是北宋毕昇发明的。
  aliases: []
  category: 文化典籍
  explanation: 868年雕版印刷的佛经，是世界上现存最早的标有确切年代的雕版印刷品。
  misconceptions:
    - 误认为《金刚经》是手抄佛经，实际是雕版印刷品。
    - 把《金刚经》当作活字印刷品，活字印刷是北宋毕昇发明的。
    - 忽略“现存最早标有确切年代”，误认为它是唐朝最早的雕版印刷品。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:《马关条约》
  type: Concept
  subject: 历史
  title: 《马关条约》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为签订于1894年战争爆发时，实际是1895年
    - 能指出并纠正这一错误：漏掉允许日本在通商口岸开设工厂这一内容
  aliases: []
  category: 历史条约
  explanation: 1895年清政府与日本签订的不平等条约，割地赔款，开放通商口岸，允许日本设厂，加剧了民族危机。
  misconceptions:
    - 误以为签订于1894年战争爆发时，实际是1895年
    - 漏掉允许日本在通商口岸开设工厂这一内容
    - 认为《马关条约》使中国完全沦为半殖民地，实际是大大加深
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:《马关条约》的影响
  type: Concept
  subject: 历史
  title: 《马关条约》的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《马关条约》签订后中国开始沦为半殖民地半封建社会，实际是半殖民地化程度大大加深。
    - 能指出并纠正这一错误：将《马关条约》赔款影响说成'清政府财政崩溃'，忽略其迫使清政府大举外债这一标志性影响。
  aliases: []
  category: 历史事件影响
  explanation: 《马关条约》使中国领土主权遭严重破坏，巨额赔款迫使清政府大举外债，列强侵略势力深入中国腹地，加紧资本输出，中国半殖民地化程度大大加深。
  misconceptions:
    - 误以为《马关条约》签订后中国开始沦为半殖民地半封建社会，实际是半殖民地化程度大大加深。
    - 将《马关条约》赔款影响说成'清政府财政崩溃'，忽略其迫使清政府大举外债这一标志性影响。
    - 误认为《马关条约》后列强侵略势力深入中国腹地是依靠增开通商口岸，实际是允许在通商口岸开设工厂。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S4.md
- id: concept:历史:《马赛曲》
  type: Concept
  subject: 历史
  title: 《马赛曲》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《马赛曲》一开始就是法国国歌，实际原是战歌，1795年才成为国歌。
    - 能指出并纠正这一错误：误以为《马赛曲》是拿破仑时期创作，实际诞生于法国大革命初期。
  aliases:
    - 莱茵军团战歌
  category: 文化符号
  explanation: 法国国歌，原为《莱茵军团战歌》，1795年被确立为国歌。
  misconceptions:
    - 误认为《马赛曲》一开始就是法国国歌，实际原是战歌，1795年才成为国歌。
    - 误以为《马赛曲》是拿破仑时期创作，实际诞生于法国大革命初期。
    - 误认为《马赛曲》原名《马赛军团战歌》，实际是《莱茵军团战歌》。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:《黄帝内经》
  type: Concept
  subject: 历史
  title: 《黄帝内经》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《黄帝内经》是黄帝本人亲笔撰写的中医书
    - 能指出并纠正这一错误：把《黄帝内经》与《本草纲目》混为一谈，说作者是李时珍
  aliases: []
  category: 医学
  explanation: 战国时期问世的中医理论著作，总结了当时的医学经验，是中医学的奠基之作。
  misconceptions:
    - 误以为《黄帝内经》是黄帝本人亲笔撰写的中医书
    - 把《黄帝内经》与《本草纲目》混为一谈，说作者是李时珍
    - 称《黄帝内经》成书于东汉末年，而不是战国时期
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:《齐民要术》
  type: Concept
  subject: 历史
  title: 《齐民要术》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为贾思勰是南朝人，实际他是北朝人。
    - 能指出并纠正这一错误：误把《齐民要术》当作地理学著作，与《水经注》混淆。
  aliases: []
  category: 历史著作
  explanation: 北朝贾思勰所著，是我国现存最早的一部完整的农书，总结了农、林、牧、副、渔等生产技术。
  misconceptions:
    - 误认为贾思勰是南朝人，实际他是北朝人。
    - 误把《齐民要术》当作地理学著作，与《水经注》混淆。
    - 误认为《齐民要术》只讲种植业，忽略它涵盖农林牧副渔。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:一个中心、两个基本点
  type: Concept
  subject: 历史
  title: 一个中心、两个基本点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“一个中心”是以改革开放为中心，实际以经济建设为中心
    - 能指出并纠正这一错误：将“两个基本点”误认为“坚持改革开放，坚持社会主义市场经济”
  aliases:
    - 基本路线
  category: 历史概念
  explanation: 党在社会主义初级阶段基本路线的概括，即以经济建设为中心，坚持四项基本原则，坚持改革开放。
  misconceptions:
    - 误认为“一个中心”是以改革开放为中心，实际以经济建设为中心
    - 将“两个基本点”误认为“坚持改革开放，坚持社会主义市场经济”
    - 认为“一个中心、两个基本点”是十一届三中全会提出的基本路线
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S4.md
- id: concept:历史:一二·九运动
  type: Concept
  subject: 历史
  title: 一二·九运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为一二·九运动发生在1937年抗战全面爆发后
    - 能指出并纠正这一错误：将组织者说成国民党或北洋政府，实际是中共领导
  aliases: []
  category: 历史事件
  explanation: 1935年12月9日，北平学生在中国共产党领导下举行抗日救国示威游行，推动了抗日救亡运动的高涨。
  misconceptions:
    - 误以为一二·九运动发生在1937年抗战全面爆发后
    - 将组织者说成国民党或北洋政府，实际是中共领导
    - 把一二·九运动与五四运动混为一谈，认为都反对巴黎和约
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:一国两制
  type: Concept
  subject: 历史
  title: 一国两制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将一国两制下大陆与港澳台的制度颠倒，认为大陆实行资本主义。
    - 能指出并纠正这一错误：误以为一国两制最早是为解决香港问题提出，实际最初着眼于台湾问题。
  aliases: []
  category: 政策构想
  explanation: 邓小平提出的实现祖国和平统一的科学构想，在一个中国前提下，大陆实行社会主义，港澳台实行资本主义。
  misconceptions:
    - 将一国两制下大陆与港澳台的制度颠倒，认为大陆实行资本主义。
    - 误以为一国两制最早是为解决香港问题提出，实际最初着眼于台湾问题。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:一带一路
  type: Concept
  subject: 历史
  title: 一带一路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘一带’说成海上丝绸之路，‘一路’说成陆上丝绸之路，实际相反。
    - 能指出并纠正这一错误：误认为一带一路是古代丝绸之路的完全复制，忽略其新时代内涵。
  aliases:
    - 丝绸之路经济带
    - 21世纪海上丝绸之路
  category: 倡议
  explanation: 2013年习近平提出共建“丝绸之路经济带”和“21世纪海上丝绸之路”，成为国际公共产品。
  misconceptions:
    - 把‘一带’说成海上丝绸之路，‘一路’说成陆上丝绸之路，实际相反。
    - 误认为一带一路是古代丝绸之路的完全复制，忽略其新时代内涵。
    - 认为一带一路只与沿线国家有关，与欧美等发达国家无关。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:一带一路倡议
  type: Concept
  subject: 历史
  title: 一带一路倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘倡议’误写为‘战略’，或认为是中国单方面的对外输出。
    - 能指出并纠正这一错误：误以为一带一路倡议是2014年提出的，实际是2013年。
  aliases: []
  category: 外交倡议
  explanation: 2013年提出共建“一带一路”倡议，促进国际合作与共同发展。
  misconceptions:
    - 把‘倡议’误写为‘战略’，或认为是中国单方面的对外输出。
    - 误以为一带一路倡议是2014年提出的，实际是2013年。
    - 将一带一路倡议与马歇尔计划性质混为一谈。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:一条鞭法
  type: Concept
  subject: 历史
  title: 一条鞭法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一条鞭法是王安石变法时期推行的，实际是张居正改革。
    - 能指出并纠正这一错误：把一条鞭法与摊丁入亩混为一谈，认为它废除了人头税。
  aliases: []
  category: 经济制度
  explanation: 将田赋、徭役等合并，计入田亩，用银两收税，简化税收手续。
  misconceptions:
    - 认为一条鞭法是王安石变法时期推行的，实际是张居正改革。
    - 把一条鞭法与摊丁入亩混为一谈，认为它废除了人头税。
    - 认为一条鞭法用银两收税后不再征收任何实物，实际仍有部分实物税。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:一边倒
  type: Concept
  subject: 历史
  title: 一边倒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“一边倒”外交方针理解为倒向美国，实际是倒向社会主义阵营。
    - 能指出并纠正这一错误：误认为“一边倒”是周恩来在万隆会议上提出的。
  aliases: []
  category: 外交方针
  explanation: 明确宣布新中国站在社会主义和世界和平民主阵营一边。
  misconceptions:
    - 把“一边倒”外交方针理解为倒向美国，实际是倒向社会主义阵营。
    - 误认为“一边倒”是周恩来在万隆会议上提出的。
    - 将“一边倒”与“另起炉灶”混为一谈，两者是不同外交方针。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:七一五反革命政变
  type: Concept
  subject: 历史
  title: 七一五反革命政变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为七一五反革命政变后国共两党合作仍在继续
    - 能指出并纠正这一错误：将七一五反革命政变的时间记成1927年4月，与四一二混淆
  aliases:
    - 七一五分共
  category: 历史事件
  explanation: 1927年7月汪精卫在武汉发动的反革命政变，导致国共合作彻底破裂。
  misconceptions:
    - 认为七一五反革命政变后国共两党合作仍在继续
    - 将七一五反革命政变的时间记成1927年4月，与四一二混淆
    - 把发动七一五反革命政变的汪精卫误写为蒋介石
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:七七事变
  type: Concept
  subject: 历史
  title: 七七事变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把七七事变时间写成1936年，误以为它是抗日战争开始的标志。
    - 能指出并纠正这一错误：认为七七事变是日军突然袭击卢沟桥中国守军，而非蓄谋已久。
  aliases:
    - 卢沟桥事变
  category: 历史事件
  explanation: 1937年7月7日，日本发动全面侵华战争，中国开始全民族抗战。
  misconceptions:
    - 把七七事变时间写成1936年，误以为它是抗日战争开始的标志。
    - 认为七七事变是日军突然袭击卢沟桥中国守军，而非蓄谋已久。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:七十七国集团
  type: Concept
  subject: 历史
  title: 七十七国集团
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为成员国数量始终固定为77个，实际已远超，但名称保留。
    - 能指出并纠正这一错误：把它与不结盟运动混为一谈，二者成员和宗旨不同。
  aliases:
    - Group of 77
  category: 国际组织
  explanation: 七十七国集团是发展中国家为促进经济合作和共同利益而组成的国际组织。
  misconceptions:
    - 误认为成员国数量始终固定为77个，实际已远超，但名称保留。
    - 把它与不结盟运动混为一谈，二者成员和宗旨不同。
    - 以为它是联合国下属机构，实为发展中国家组成的国际组织。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S4.md
- id: concept:历史:七国之乱
  type: Concept
  subject: 历史
  title: 七国之乱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为七国之乱是汉武帝平定的，实际是汉景帝时期。
    - 能指出并纠正这一错误：误以为七国之乱后诸侯王全部被废除，实际仅收回部分权力。
  aliases: []
  category: 历史事件
  explanation: 公元前154年，吴王联合其他六国诸侯王叛乱，被朝廷平定，景帝借此收回诸侯王部分权力。
  misconceptions:
    - 认为七国之乱是汉武帝平定的，实际是汉景帝时期。
    - 误以为七国之乱后诸侯王全部被废除，实际仅收回部分权力。
    - 将七国之乱原因说成中央主动削藩，实际是诸侯王叛乱。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:七擒孟获
  type: Concept
  subject: 历史
  title: 七擒孟获
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把七擒孟获误认为发生在诸葛亮北伐曹魏期间，实为南征中。
    - 能指出并纠正这一错误：认为孟获是北方匈奴首领，实际上他是西南夷首领。
  aliases: []
  category: 历史典故
  explanation: 诸葛亮南征时，七次擒获孟获又释放，最终使其心悦诚服，稳定了蜀汉后方。
  misconceptions:
    - 把七擒孟获误认为发生在诸葛亮北伐曹魏期间，实为南征中。
    - 认为孟获是北方匈奴首领，实际上他是西南夷首领。
    - 错把七擒孟获说成是关羽或张飞所为，与诸葛亮无关。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S1.md
- id: concept:历史:万隆会议
  type: Concept
  subject: 历史
  title: 万隆会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为万隆会议提出了“和平共处五项原则”，实际是周恩来提出“求同存异”。
    - 能指出并纠正这一错误：把万隆会议时间记成1954年，实际是1955年。
  aliases:
    - 亚非会议
  category: 历史事件
  explanation: 1955年在印度尼西亚万隆召开，第一次没有西方殖民国家参加的国际会议。
  misconceptions:
    - 误认为万隆会议提出了“和平共处五项原则”，实际是周恩来提出“求同存异”。
    - 把万隆会议时间记成1954年，实际是1955年。
    - 认为万隆会议有西方国家参加，实际是无西方殖民国家。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S4.md
- id: concept:历史:万隆精神
  type: Concept
  subject: 历史
  title: 万隆精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为万隆精神就是周恩来提出的“求同存异”方针，实则万隆精神是会议共识，求同存异是达成共识的方式
    - 能指出并纠正这一错误：认为万隆精神只反对帝国主义和殖民主义，忽略了亚非国家团结合作、保卫世界和平的内容
  aliases: []
  category: 历史概念
  explanation: 亚非国家和地区团结合作、友好相处，共同反对帝国主义和殖民主义，争取和巩固民族独立，保卫世界和平的精神。
  misconceptions:
    - 误认为万隆精神就是周恩来提出的“求同存异”方针，实则万隆精神是会议共识，求同存异是达成共识的方式
    - 认为万隆精神只反对帝国主义和殖民主义，忽略了亚非国家团结合作、保卫世界和平的内容
    - 把万隆精神当作二战后立即形成的，实际形成于1955年亚非会议
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S4.md
- id: concept:历史:三三制原则
  type: Concept
  subject: 历史
  title: 三三制原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为三三制指共产党员、国民党党员和民主党派各占三分之一。
    - 能指出并纠正这一错误：误以为三三制在全国各级政权中都实行，实际只在抗日民主根据地推行。
  aliases:
    - 三三制
  category: 政治制度
  explanation: 抗日民主政权中共产党员、党外进步人士和中间派各占三分之一的原则，实行民主建政。
  misconceptions:
    - 误以为三三制指共产党员、国民党党员和民主党派各占三分之一。
    - 误以为三三制在全国各级政权中都实行，实际只在抗日民主根据地推行。
    - 误以为三三制中三部分比例是各占四分之一，实际是各三分之一。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:三下江南四保临江战役
  type: Concept
  subject: 历史
  title: 三下江南四保临江战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为三下江南四保临江战役发生在全面内战爆发之前
    - 能指出并纠正这一错误：将该战役与刘邓大军挺进大别山的战役混淆
  aliases:
    - 临江战役
  category: 战役
  explanation: 1946年12月至1947年4月，东北民主联军在临江、松花江地区连续作战，消灭国民党军数万人，扭转东北战局。
  misconceptions:
    - 误以为三下江南四保临江战役发生在全面内战爆发之前
    - 将该战役与刘邓大军挺进大别山的战役混淆
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:三不政策
  type: Concept
  subject: 历史
  title: 三不政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为三不政策是大陆针对台湾提出的方针
    - 能指出并纠正这一错误：将三不政策内容误记为不接触、不谈判、不统一
  aliases: []
  category: 政策方针
  explanation: 台湾当局的“不接触、不谈判、不妥协”政策，1987年被迫调整。
  misconceptions:
    - 认为三不政策是大陆针对台湾提出的方针；实际上它是台湾当局的政策。
    - 将三不政策内容误记为不接触、不谈判、不统一；实为不接触、不谈判、不妥协。
    - 认为1987年台湾当局才提出三不政策；实际上1987年是被迫调整，此前已实行。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:三八线
  type: Concept
  subject: 历史
  title: 三八线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为三八线是朝鲜战争结束后划定的军事分界线。
    - 能指出并纠正这一错误：把三八线当成朝鲜与中国的边界线。
  aliases: []
  category: 地理概念
  explanation: 朝鲜半岛上北纬38度附近的军事分界线，是朝鲜战争的重要地理标志。
  misconceptions:
    - 认为三八线是朝鲜战争结束后划定的军事分界线。
    - 把三八线当成朝鲜与中国的边界线。
    - 认为三八线是严格的北纬38度纬线，实际是近似线。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S2.md
- id: concept:历史:三十税一
  type: Concept
  subject: 历史
  title: 三十税一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'三十税一'理解为税率是30%，即征收收获物的三成。
    - 能指出并纠正这一错误：认为'三十税一'从汉高祖刘邦开始实行，忽略了它是文景时期才确立的比例。
  aliases: []
  category: 制度
  explanation: 汉文帝和汉景帝时期实行的田租税率，即征收收获物的三十分之一，减轻了农民负担。
  misconceptions:
    - 把'三十税一'理解为税率是30%，即征收收获物的三成。
    - 认为'三十税一'从汉高祖刘邦开始实行，忽略了它是文景时期才确立的比例。
    - 将'三十税一'与秦朝'泰半之赋'混同，误以为秦朝也实行同样低的税率。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S3.md
- id: concept:历史:三司
  type: Concept
  subject: 历史
  title: 三司
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三司当成中央官职，实际是明朝地方行政机构，分掌民政、司法、军政。
    - 能指出并纠正这一错误：误以为三司长官合称巡抚，三司互不统属，巡抚是后来临时派遣。
  aliases:
    - 承宣布政使司
    - 提刑按察使司
    - 都指挥使司
  category: 政治制度
  explanation: 明太祖在地方设三司，分掌民政、司法、军政，互不统属，直接向皇帝负责。
  misconceptions:
    - 把三司当成中央官职，实际是明朝地方行政机构，分掌民政、司法、军政。
    - 误以为三司长官合称巡抚，三司互不统属，巡抚是后来临时派遣。
    - 将三司与宋代三司混淆，宋代三司掌财政，明朝三司分掌民政、司法、军政。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:三国协约
  type: Concept
  subject: 历史
  title: 三国协约
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为三国协约包含意大利，实际英法俄
    - 能指出并纠正这一错误：认为三国协约形成早于三国同盟，实际晚于
  aliases:
    - 协约国
  category: 历史事件
  explanation: 20世纪初英国与法国、俄国缔约形成的军事集团，与三国同盟对抗。
  misconceptions:
    - 误以为三国协约包含意大利，实际英法俄
    - 认为三国协约形成早于三国同盟，实际晚于
    - 把三国协约的对抗对象说成美国
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:三国同盟
  type: Concept
  subject: 历史
  title: 三国同盟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为三国同盟包括俄国，实际德奥意
    - 能指出并纠正这一错误：认为三国同盟在一战后继续存在
  aliases:
    - 同盟国
  category: 历史事件
  explanation: 1882年由德国、奥匈帝国和意大利组成的军事同盟集团，与三国协约相对抗。
  misconceptions:
    - 误以为三国同盟包括俄国，实际德奥意
    - 认为三国同盟在一战后继续存在
    - 以为意大利始终忠实，不知它后加入协约国
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:三国鼎立
  type: Concept
  subject: 历史
  title: 三国鼎立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三国鼎立误认为曹操、刘备、孙权称帝，实际曹操未称帝，曹丕称帝建立魏
    - 能指出并纠正这一错误：认为三国鼎立局面始于220年曹操称帝，实际是曹丕称帝，刘备称帝是221年
  aliases:
    - 三国鼎立局面
  category: 历史概念
  explanation: 220年曹丕建魏，221年刘备建蜀汉，229年孙权建吴，三国鼎立局面形成，实现局部统一。
  misconceptions:
    - 把三国鼎立误认为曹操、刘备、孙权称帝，实际曹操未称帝，曹丕称帝建立魏
    - 认为三国鼎立局面始于220年曹操称帝，实际是曹丕称帝，刘备称帝是221年
    - 误以为三国鼎立时期全国统一，实际是局部统一
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S1.md
- id: concept:历史:三大战役
  type: Concept
  subject: 历史
  title: 三大战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三大战役的时间记成1947年开始，忽略实际是1948年9月首战辽沈
    - 能指出并纠正这一错误：误以为三大战役是同时发起，实际是先后依次进行
  aliases: []
  category: 历史事件
  explanation: 1948年至1949年，人民解放军进行的辽沈、淮海、平津三大战役，基本消灭了国民党军队的主力。
  misconceptions:
    - 把三大战役的时间记成1947年开始，忽略实际是1948年9月首战辽沈
    - 误以为三大战役是同时发起，实际是先后依次进行
    - 认为三大战役消灭了国民党全部军队，忽略只是基本消灭主力
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:三大改造
  type: Concept
  subject: 历史
  title: 三大改造
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为三大改造在1949年新中国成立后立即完成。
    - 能指出并纠正这一错误：把农业合作化与土地改革混为一谈，认为都是消灭地主。
  aliases:
    - 社会主义改造
  category: 历史事件
  explanation: 对农业、手工业和资本主义工商业的社会主义改造，1956年基本完成，建立社会主义经济制度。
  misconceptions:
    - 误认为三大改造在1949年新中国成立后立即完成。
    - 把农业合作化与土地改革混为一谈，认为都是消灭地主。
    - 认为资本主义工商业改造采取没收方式，实际是和平赎买。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:三大纪律八项注意
  type: Concept
  subject: 历史
  title: 三大纪律八项注意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把三大纪律八项注意看成解放战争时期新制定的纪律，忽略其井冈山时期已逐步形成。
    - 能指出并纠正这一错误：误以为三大纪律八项注意是朱德在南昌起义时制定的，实际是毛泽东在秋收起义和井冈山时期逐步制定。
  aliases: []
  category: 纪律规范
  explanation: 毛泽东在秋收起义和井冈山时期逐步制定的红军纪律，后经统一规定，成为人民军队的纪律准则。
  misconceptions:
    - 误把三大纪律八项注意看成解放战争时期新制定的纪律，忽略其井冈山时期已逐步形成。
    - 误以为三大纪律八项注意是朱德在南昌起义时制定的，实际是毛泽东在秋收起义和井冈山时期逐步制定。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:三星堆遗址
  type: Concept
  subject: 历史
  title: 三星堆遗址
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把三星堆遗址说成是河南安阳的商朝都城遗址
    - 能指出并纠正这一错误：认为三星堆出土的金杖、青铜面具属于中原青铜文明
  aliases: []
  category: 考古
  explanation: 四川广汉的商周时期遗址，出土了金杖、青铜面具等，展现了古蜀文明。
  misconceptions:
    - 误把三星堆遗址说成是河南安阳的商朝都城遗址
    - 认为三星堆出土的金杖、青铜面具属于中原青铜文明
    - 说三星堆文明是夏朝在中原地区直接统治的遗迹
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:三权分立
  type: Concept
  subject: 历史
  title: 三权分立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为三权分立由《权利法案》确立，实际是1787年美国宪法。
    - 能指出并纠正这一错误：误认为三权分立是孟德斯鸠生前在美国法律中确立的，实际他仅提出理论。
  aliases:
    - 分权制衡
  category: 政治原则
  explanation: 行政、立法、司法三权相互制衡，由1787年宪法确立。
  misconceptions:
    - 误认为三权分立由《权利法案》确立，实际是1787年美国宪法。
    - 误认为三权分立是孟德斯鸠生前在美国法律中确立的，实际他仅提出理论。
    - 误以为三权之间互不干涉，实际是相互制衡、相互监督。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S4.md
- id: concept:历史:三步走发展战略
  type: Concept
  subject: 历史
  title: 三步走发展战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把第一步目标“解决温饱”与第二步“达到小康”顺序颠倒
    - 能指出并纠正这一错误：误认为第三步是“建成社会主义现代化强国”，实际是基本实现现代化
  aliases:
    - 三步走
  category: 历史概念
  explanation: 邓小平提出，中共十三大确认，分三步实现国民生产总值翻番、小康和现代化。
  misconceptions:
    - 把第一步目标“解决温饱”与第二步“达到小康”顺序颠倒
    - 误认为第三步是“建成社会主义现代化强国”，实际是基本实现现代化
    - 误以为“三步走”战略由毛泽东首先提出
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:三民主义
  type: Concept
  subject: 历史
  title: 三民主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“民权主义”误记成“平均地权”，“民生主义”误记成“创立民国”
    - 能指出并纠正这一错误：认为三民主义是一八九四年兴中会成立时提出的
  aliases: []
  category: 历史概念
  explanation: 孙中山在《民报》发刊词中将同盟会纲领阐发为民族主义、民权主义、民生主义，成为资产阶级革命的指导思想。
  misconceptions:
    - 把“民权主义”误记成“平均地权”，“民生主义”误记成“创立民国”
    - 认为三民主义是一八九四年兴中会成立时提出的
    - 将“民族主义”理解成反对所有外来民族，忽略其主要是推翻清王朝
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:三湾改编
  type: Concept
  subject: 历史
  title: 三湾改编
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将三湾改编与古田会议混淆，认为确立了'思想建党、政治建军'原则
    - 能指出并纠正这一错误：误认为三湾改编发生在秋收起义之前，实际是起义部队在1927年9月至10月改编
  aliases: []
  category: 历史事件
  explanation: 1927年9月，毛泽东在江西永新三湾对部队进行改编，确立党对军队的领导，将党支部建在连上，实行民主管理。
  misconceptions:
    - 将三湾改编与古田会议混淆，认为确立了'思想建党、政治建军'原则
    - 误认为三湾改编发生在秋收起义之前，实际是起义部队在1927年9月至10月改编
    - 把三湾改编地点写成井冈山，实际在江西永新三湾
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:三省六部制
  type: Concept
  subject: 历史
  title: 三省六部制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为三省六部制是唐朝首创，实际隋朝已确立
    - 能指出并纠正这一错误：把中书省和门下省职能说反，如称中书省负责审核、门下省负责草诏
  aliases: []
  category: 制度
  explanation: 隋朝确立，唐朝完善，中书省草拟诏令，门下省审核，尚书省执行，下设六部。
  misconceptions:
    - 误以为三省六部制是唐朝首创，实际隋朝已确立
    - 把中书省和门下省职能说反，如称中书省负责审核、门下省负责草诏
    - 认为六部直接听命于皇帝，实际六部隶属尚书省
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S2.md
- id: concept:历史:三级会议
  type: Concept
  subject: 历史
  title: 三级会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为三级会议是法国常设立法机构，实际是临时召开的等级会议。
    - 能指出并纠正这一错误：误以为第三等级只代表资产阶级，实际还包括农民和城市平民。
  aliases: []
  category: 政治制度
  explanation: 法国中世纪以来的等级会议，由教士、贵族、平民三个等级组成，1789年因财政危机召开。
  misconceptions:
    - 误认为三级会议是法国常设立法机构，实际是临时召开的等级会议。
    - 误以为第三等级只代表资产阶级，实际还包括农民和城市平民。
    - 误认为三级会议召开是为制定宪法，实际是路易十六为解决财政危机。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:三角贸易
  type: Concept
  subject: 历史
  title: 三角贸易
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三角贸易路线记成欧洲→美洲→非洲，忽略从非洲运黑奴到美洲的核心环节
    - 能指出并纠正这一错误：认为三角贸易只贩卖黑奴，不理解还涉及欧洲工业品和美洲原料
  aliases:
    - 黑奴贸易
  category: 历史概念
  explanation: 以贩卖黑奴为中心的贸易，路线呈三角形，涉及欧洲、非洲和美洲。
  misconceptions:
    - 把三角贸易路线记成欧洲→美洲→非洲，忽略从非洲运黑奴到美洲的核心环节
    - 认为三角贸易只贩卖黑奴，不理解还涉及欧洲工业品和美洲原料
    - 误以为三角贸易是同时一次性完成的，实际是多次往返的循环贸易
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:三顾茅庐
  type: Concept
  subject: 历史
  title: 三顾茅庐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三顾茅庐当诸葛亮三次拜访刘备，实际是刘备三次亲自去请诸葛亮
    - 能指出并纠正这一错误：认为三顾茅庐发生在赤壁之战后，实际是在官渡之战后刘备依附刘表时
  aliases: []
  category: 历史典故
  explanation: 刘备三次拜访诸葛亮，恳请其出山辅佐，体现求贤若渴。
  misconceptions:
    - 把三顾茅庐当诸葛亮三次拜访刘备，实际是刘备三次亲自去请诸葛亮
    - 认为三顾茅庐发生在赤壁之战后，实际是在官渡之战后刘备依附刘表时
    - 将“三顾”理解为诸葛亮三次运筹帷幄，混淆拜访方向
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S1.md
- id: concept:历史:上海世博会
  type: Concept
  subject: 历史
  title: 上海世博会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为上海世博会于2008年举办，与北京奥运同年。
    - 能指出并纠正这一错误：把上海世博会届数记错，写成第40届或第42届。
  aliases: []
  category: 史实
  explanation: 2010年在上海成功举办第41届世界博览会。
  misconceptions:
    - 误以为上海世博会于2008年举办，与北京奥运同年。
    - 把上海世博会届数记错，写成第40届或第42届。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:上海合作组织
  type: Concept
  subject: 历史
  title: 上海合作组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为上海合作组织是联合国下属机构
    - 能指出并纠正这一错误：认为上合组织只涉及经济合作
  aliases:
    - 上合组织
  category: 国际组织
  explanation: 2001年6月成立，由中国参与推动建立的综合性区域合作组织。
  misconceptions:
    - 认为上海合作组织是联合国下属机构；实际上它是由中国参与推动建立的区域性合作组织。
