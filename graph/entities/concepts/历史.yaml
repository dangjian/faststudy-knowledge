  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为海上马车夫是英国，实际指荷兰
    - 能指出并纠正这一错误：认为荷兰靠无敌舰队称霸海上，实际靠商业贸易和造船业
