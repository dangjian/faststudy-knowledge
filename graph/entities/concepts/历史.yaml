  category: 历史事件
  explanation: 19世纪末由资产阶级维新派发起的旨在通过变法实现国家富强的改良运动，包括组织学会、创办报刊、宣传变法等活动。
  misconceptions:
    - 误以为维新运动仅指百日维新，实际还包括组织学会、创办报刊等前期活动。
    - 把维新运动说成彻底反帝反封建的革命运动，实际是资产阶级改良运动。
    - 误认为维新运动始于辛亥革命之后，实际是19世纪末的改良运动。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:综合国力显著提升
  type: Concept
  subject: 历史
  title: 综合国力显著提升
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为2010年我国经济总量超过美国，成为世界第一大经济体。
    - 能指出并纠正这一错误：把综合国力等同于经济总量，忽视科技、文化等软实力。
  aliases: []
  category: 发展成就
  explanation: 2010年我国经济总量超过40万亿元，成为世界第二大经济体，人民生活明显改善，科技取得重大突破。
  misconceptions:
    - 认为2010年我国经济总量超过美国，成为世界第一大经济体。
    - 把综合国力等同于经济总量，忽视科技、文化等软实力。
    - 误认为2008年经济总量已超40万亿元，时间提前两年。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:绿水青山就是金山银山
  type: Concept
  subject: 历史
  title: 绿水青山就是金山银山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为绿水青山就是金山银山主张为保护环境而禁止一切经济发展。
    - 能指出并纠正这一错误：把该理念理解为只要生态好经济自然提升，忽略制度和产业的作用。
  aliases: []
  category: 生态文明理念
  explanation: 习近平提出的重要理念，强调生态文明建设与经济发展相协调。
  misconceptions:
    - 认为绿水青山就是金山银山主张为保护环境而禁止一切经济发展。
    - 把该理念理解为只要生态好经济自然提升，忽略制度和产业的作用。
    - 认为绿水青山仅指具体山水景色，不包括清洁空气、生物多样性等生态要素。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:编年体通史
  type: Concept
  subject: 历史
  title: 编年体通史
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《资治通鉴》误认为纪传体史书，如与《史记》混同。
    - 能指出并纠正这一错误：误以为编年体通史是按事件类别记述，实际是按时间顺序。
  aliases: []
  category: 史学体裁
  explanation: 按时间顺序记述历史的史书体裁，《资治通鉴》是编年体通史巨著。
  misconceptions:
    - 将《资治通鉴》误认为纪传体史书，如与《史记》混同。
    - 误以为编年体通史是按事件类别记述，实际是按时间顺序。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:罗斯福新政
  type: Concept
  subject: 历史
  title: 罗斯福新政
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为罗斯福新政彻底消除了经济危机，实际只是缓解，危机根源仍在
    - 能指出并纠正这一错误：把新政措施说成是计划经济，混淆国家干预与计划经济的区别
  aliases:
    - 新政
  category: 历史事件
  explanation: 1933年罗斯福就任美国总统后，为应对经济大危机而采取的一系列国家干预经济的措施。
  misconceptions:
    - 认为罗斯福新政彻底消除了经济危机，实际只是缓解，危机根源仍在
    - 把新政措施说成是计划经济，混淆国家干预与计划经济的区别
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:罗马共和国
  type: Concept
  subject: 历史
  title: 罗马共和国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为罗马共和国由皇帝统治，实际是元老院掌握决策权。
    - 能指出并纠正这一错误：把《十二铜表法》当作罗马帝国时期的立法，实际是共和国早期颁布。
  aliases: []
  category: 历史概念
  explanation: 公元前509年建立的罗马国家，元老院掌握决策权，后颁布《十二铜表法》。
  misconceptions:
    - 误认为罗马共和国由皇帝统治，实际是元老院掌握决策权。
    - 把《十二铜表法》当作罗马帝国时期的立法，实际是共和国早期颁布。
    - 认为罗马共和国实行直接民主，忽略其奴隶制贵族共和性质。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:罗马帝国
  type: Concept
  subject: 历史
  title: 罗马帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为罗马帝国由凯撒建立，实际是屋大维建立。
    - 能指出并纠正这一错误：认为罗马帝国建立后立即进入黄金时期，实际2世纪才达到鼎盛。
  aliases: []
  category: 历史概念
  explanation: 公元前27年屋大维建立，2世纪进入黄金时期，版图横跨欧亚非，地中海成为内湖。
  misconceptions:
    - 误认为罗马帝国由凯撒建立，实际是屋大维建立。
    - 认为罗马帝国建立后立即进入黄金时期，实际2世纪才达到鼎盛。
    - 混淆共和国与帝国时期，认为地中海成为内湖是共和国时。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:罗马帝国的衰亡
  type: Concept
  subject: 历史
  title: 罗马帝国的衰亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为476年西罗马帝国灭亡即罗马帝国整体灭亡，忽略东罗马帝国继续存在。
    - 能指出并纠正这一错误：认为罗马帝国衰亡源于外族入侵，忽略奴隶制危机的内在原因。
  aliases: []
  category: 历史事件
  explanation: 3世纪陷入危机，4世纪末分裂，476年西罗马帝国灭亡，实质是奴隶制危机。
  misconceptions:
    - 误认为476年西罗马帝国灭亡即罗马帝国整体灭亡，忽略东罗马帝国继续存在。
    - 认为罗马帝国衰亡源于外族入侵，忽略奴隶制危机的内在原因。
    - 把3世纪危机与4世纪末分裂顺序颠倒，认为先分裂后陷入危机。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:罗马建筑艺术
  type: Concept
  subject: 历史
  title: 罗马建筑艺术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为罗马建筑完全模仿希腊，没有石拱门、穹顶等创新。
    - 能指出并纠正这一错误：把大竞技场、万神庙误认为是希腊建筑。
  aliases: []
  category: 建筑艺术
  explanation: 罗马建筑吸收了希腊建筑特点并创新，如石拱门、穹顶等，代表建筑有大竞技场、万神庙等。
  misconceptions:
    - 认为罗马建筑完全模仿希腊，没有石拱门、穹顶等创新。
    - 把大竞技场、万神庙误认为是希腊建筑。
    - 忽略罗马建筑对希腊柱式的吸收，只强调创新而否定继承。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:罗马法学成就
  type: Concept
  subject: 历史
  title: 罗马法学成就
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《十二铜表法》是罗马帝国时期颁布，实际是共和国时期。
    - 能指出并纠正这一错误：认为《十二铜表法》是罗马第一部法律，实际是第一部成文法。
  aliases: []
  category: 法学
  explanation: 罗马法学是罗马人最伟大的成就之一，《十二铜表法》是罗马法制建设的第一步，是后世罗马法典乃至欧洲法学的渊源。
  misconceptions:
    - 误认为《十二铜表法》是罗马帝国时期颁布，实际是共和国时期。
    - 认为《十二铜表法》是罗马第一部法律，实际是第一部成文法。
    - 夸大《十二铜表法》作用，认为它已形成完整罗马法学体系。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:罗马法学系统
  type: Concept
  subject: 历史
  title: 罗马法学系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为万民法是罗马最早的成文法，实际公民法更早。
    - 能指出并纠正这一错误：认为万民法只适用于罗马公民，忽略其适用于外邦人。
  aliases: []
  category: 法学成就
  explanation: 罗马法学家论证了万民法、经济法等，构成完整的罗马法学系统。
  misconceptions:
    - 误认为万民法是罗马最早的成文法，实际公民法更早。
    - 认为万民法只适用于罗马公民，忽略其适用于外邦人。
    - 混淆古代罗马法学与现代法律体系，认为已有完整经济法。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:美、日侵略台湾
  type: Concept
  subject: 历史
  title: 美、日侵略台湾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为美国直接武装侵略台湾，实际美国转而支持日本侵略。
    - 能指出并纠正这一错误：错误认为1874年日军占领台湾，实际遭抵抗并勒索白银后撤兵。
  aliases: []
  category: 历史事件
  explanation: 19世纪60年代美国军舰进犯台湾，后转而支持日本侵略台湾；1874年日军进攻台湾，遭台湾人民和清军抵抗，最终日本勒索白银后撤兵。
  misconceptions:
    - 误认为美国直接武装侵略台湾，实际美国转而支持日本侵略。
    - 错误认为1874年日军占领台湾，实际遭抵抗并勒索白银后撤兵。
    - 误认为美日联合侵台，实际美国只支持不直接参战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:美国内战
  type: Concept
  subject: 历史
  title: 美国内战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把美国内战时间说成1775-1783，与独立战争混淆。
    - 能指出并纠正这一错误：认为内战直接原因是废奴运动，实际是南北经济制度矛盾激化。
  aliases:
    - 南北战争
  category: 历史事件
  explanation: 1861-1865年美国北方与南方之间的战争，最终北方获胜，维护了国家统一，废除了奴隶制。
  misconceptions:
    - 把美国内战时间说成1775-1783，与独立战争混淆。
    - 认为内战直接原因是废奴运动，实际是南北经济制度矛盾激化。
    - 认为北方获胜后黑人获得完全平等，忽略种族歧视依然存在。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:美国内战性质
  type: Concept
  subject: 历史
  title: 美国内战性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为美国内战是第一次资产阶级革命，实际第一次是独立战争。
    - 能指出并纠正这一错误：认为内战只具有维护统一的性质，忽略其废除奴隶制的革命意义。
  aliases:
    - 美国内战实质
  category: 历史评价
  explanation: 美国内战实质上是美国历史上第二次资产阶级革命，废除了奴隶制，清除了资本主义发展的最大障碍。
  misconceptions:
    - 误以为美国内战是第一次资产阶级革命，实际第一次是独立战争。
    - 认为内战只具有维护统一的性质，忽略其废除奴隶制的革命意义。
    - 将美国内战与法国大革命性质等同，忽略其反对奴隶制而非封建制。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S3.md
- id: concept:历史:美国新经济
  type: Concept
  subject: 历史
  title: 美国新经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“新经济”误认为俄国列宁1921年实行的“新经济政策”，张冠李戴。
    - 能指出并纠正这一错误：认为新经济只是互联网行业繁荣，忽略了全球化和信息化的整体特征。
  aliases: []
  category: 经济概念
  explanation: 20世纪90年代以后美国出现的以全球化和信息化为特征的经济形态。
  misconceptions:
    - 把“新经济”误认为俄国列宁1921年实行的“新经济政策”，张冠李戴。
    - 认为新经济只是互联网行业繁荣，忽略了全球化和信息化的整体特征。
    - 误以为新经济出现于20世纪五六十年代，时间颠倒。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:美国独立战争
  type: Concept
  subject: 历史
  title: 美国独立战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为美国独立战争是反抗法国殖民统治
    - 能指出并纠正这一错误：误把独立战争时间说成17世纪，早于英国革命
  aliases:
    - 美国革命
  category: 历史事件
  explanation: 1775-1783年北美殖民地反抗英国统治的战争，既是民族解放战争也是资产阶级革命。
  misconceptions:
    - 误以为美国独立战争是反抗法国殖民统治
    - 误把独立战争时间说成17世纪，早于英国革命
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:老子
  type: Concept
  subject: 历史
  title: 老子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为老子是战国时期的人，甚至与庄子是同一人
    - 能指出并纠正这一错误：把老子的核心思想说成‘仁政’或‘兼爱’，忽略‘道’
  aliases:
    - 李耳
  category: 历史人物
  explanation: 老子姓李名耳，春秋后期楚国人，道家学派创始人，思想核心是“道”，主张顺应自然、无为而治。
  misconceptions:
    - 认为老子是战国时期的人，甚至与庄子是同一人
    - 把老子的核心思想说成‘仁政’或‘兼爱’，忽略‘道’
    - 认为《道德经》是孔子编订的，与《论语》混淆
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:联合国
  type: Concept
  subject: 历史
  title: 联合国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把联合国与国际联盟混为一谈，认为联合国成立于第一次世界大战之后
    - 能指出并纠正这一错误：认为所有国家都是联合国会员国，忽略部分非会员国如梵蒂冈
  aliases:
    - UN
  category: 国际组织
  explanation: 1945年10月成立的国际组织，旨在维护世界和平与安全，促进国际合作，是影响最大的国际组织。
  misconceptions:
    - 把联合国与国际联盟混为一谈，认为联合国成立于第一次世界大战之后
    - 认为所有国家都是联合国会员国，忽略部分非会员国如梵蒂冈
    - 认为联合国是凌驾于国家之上的世界政府，拥有绝对主权
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:联合国世界妇女大会
  type: Concept
  subject: 历史
  title: 联合国世界妇女大会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为联合国世界妇女大会每年召开一次，实际上从1975年到1995年共召开四次
    - 能指出并纠正这一错误：将1995年北京会议当成首次世界妇女大会，实际是第四次
  aliases:
    - 世界妇女大会
  category: 历史事件
  explanation: 1975年至1995年，联合国先后召开四次世界妇女大会，肯定妇女作用，制定发展战略，倡导提高妇女地位。
  misconceptions:
    - 误以为联合国世界妇女大会每年召开一次，实际上从1975年到1995年共召开四次
    - 将1995年北京会议当成首次世界妇女大会，实际是第四次
    - 认为大会由各成员国轮流主办，而非联合国统一组织
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:联合国安全理事会
  type: Concept
  subject: 历史
  title: 联合国安全理事会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为安理会仅由5个常任理事国组成，忽略10个非常任理事国
    - 能指出并纠正这一错误：认为安理会与联合国大会职责相同，都讨论所有国际议题
  aliases:
    - 安理会
  category: 国际组织
  explanation: 联合国的主要机构之一，担负维护国际和平与安全的主要责任，由5个常任理事国和10个非常任理事国组成。
  misconceptions:
    - 认为安理会仅由5个常任理事国组成，忽略10个非常任理事国
    - 认为安理会与联合国大会职责相同，都讨论所有国际议题
    - 认为非常任理事国也拥有否决权，实际只有常任理事国才有
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:联合国宗旨
  type: Concept
  subject: 历史
  title: 联合国宗旨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为联合国首要宗旨是促进经济发展，忽略维护和平与安全的首位性
    - 能指出并纠正这一错误：认为联合国宗旨是保护人权，而非维持国际和平及安全这一首要目标
  aliases: []
