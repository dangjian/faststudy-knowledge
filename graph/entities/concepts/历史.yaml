  misconceptions:
    - 误以为滇系军阀的首领是陆荣廷，实际为唐继尧。
    - 将滇系军阀的控制区错记为广西、广东，实际为云南、贵州。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:滋生人丁，永不加赋
  type: Concept
  subject: 历史
  title: 滋生人丁，永不加赋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为‘滋生人丁永不加赋’就是彻底免除了人头税。
    - 能指出并纠正这一错误：将与摊丁入亩混同，视为同一制度在康熙年间实施。
  aliases: []
  category: 制度
  explanation: 康熙末年政策，固定丁银总额，新增人口不额外征税。
  misconceptions:
    - 误认为‘滋生人丁永不加赋’就是彻底免除了人头税。
    - 将与摊丁入亩混同，视为同一制度在康熙年间实施。
    - 误认为康熙时完全取消丁银，实际只是固定总额，为后来摊丁入亩铺垫。
