  category: 历史事件
  explanation: 1937年10月，中国军队在山西忻口地区抗击日军进攻的战役，是华北规模最大的一次会战。
  misconceptions:
    - 认为忻口会战是敌后战场八路军发起的战役，而实际是正面战场。
    - 误以为忻口会战发生在平型关大捷之前，实际是之后。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:总体国家安全观
  type: Concept
  subject: 历史
  title: 总体国家安全观
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为总体国家安全观只涉及军事和政治安全，忽视经济、文化等非传统安全
    - 能指出并纠正这一错误：把总体国家安全观与传统安全观完全等同，忽略“总体”涵盖各领域
  aliases: []
  category: 安全理念
  explanation: 新时代我国坚持的国家安全理念，强调维护各领域国家安全。
  misconceptions:
    - 认为总体国家安全观只涉及军事和政治安全，忽视经济、文化等非传统安全
    - 把总体国家安全观与传统安全观完全等同，忽略“总体”涵盖各领域
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:总理各国事务衙门
  type: Concept
  subject: 历史
  title: 总理各国事务衙门
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将总理各国事务衙门设立时间记成1858年或1860年。
    - 能指出并纠正这一错误：错认为它是正式外交部门，忽略其权力极大的特点。
  aliases:
    - 总理衙门
  category: 机构
  explanation: 1861年清政府设立的中央机构，负责对外交涉、通商、海关等事务，权力很大。
  misconceptions:
    - 误将总理各国事务衙门设立时间记成1858年或1860年。
    - 错认为它是正式外交部门，忽略其权力极大的特点。
    - 将总理衙门等同于晚清的外务部，前后混同。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:恢复在联合国的合法席位
  type: Concept
  subject: 历史
  title: 恢复在联合国的合法席位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“恢复”写成“加入”，忘记中国是联合国创始会员国。
    - 能指出并纠正这一错误：将2758号决议通过的时间记成1972年或1970年。
  aliases:
    - 联合国合法席位恢复
  category: 历史事件
  explanation: 1971年10月，第26届联合国大会通过2758号决议，恢复中华人民共和国在联合国的一切合法权利。
  misconceptions:
    - 把“恢复”写成“加入”，忘记中国是联合国创始会员国。
    - 将2758号决议通过的时间记成1972年或1970年。
    - 认为恢复合法席位需要大会三分之二多数，就误以为台湾当局也曾获得同样地位。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:戈尔巴乔夫改革
  type: Concept
  subject: 历史
  title: 戈尔巴乔夫改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为戈尔巴乔夫改革先政治后经济，实际先经济后政治。
    - 能指出并纠正这一错误：把戈尔巴乔夫改革与勃列日涅夫改革混淆，认为是经济改革为主。
  aliases:
    - 戈尔巴乔夫政治改革
  category: 历史事件
  explanation: 1985年戈尔巴乔夫上台，先进行经济改革效果不佳，后转向政治体制改革，放弃马克思主义指导，取消苏共领导地位，实行多党制，导致局势失控和苏联解体。
  misconceptions:
    - 误认为戈尔巴乔夫改革先政治后经济，实际先经济后政治。
    - 把戈尔巴乔夫改革与勃列日涅夫改革混淆，认为是经济改革为主。
    - 误以为戈尔巴乔夫改革是苏联解体的唯一原因，忽视其他因素。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S4.md
- id: concept:历史:戊戌六君子
  type: Concept
  subject: 历史
  title: 戊戌六君子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把康有为、梁启超算入戊戌六君子，实际他二人逃亡未遇害。
    - 能指出并纠正这一错误：记漏六君子之一，如漏掉刘光第或杨深秀。
  aliases: []
  category: 历史人物
  explanation: 戊戌政变中被捕遇害的谭嗣同、刘光第、林旭、杨锐、杨深秀、康广仁六人。
  misconceptions:
    - 误把康有为、梁启超算入戊戌六君子，实际他二人逃亡未遇害。
    - 记漏六君子之一，如漏掉刘光第或杨深秀。
    - 将严复列为六君子之一，实际是谭嗣同等六人。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:成吉思汗统一蒙古
  type: Concept
  subject: 历史
  title: 成吉思汗统一蒙古
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为成吉思汗建立元朝，实际建立蒙古政权。
    - 能指出并纠正这一错误：将铁木真统一蒙古的时间错记为1271年，实际为1206年。
  aliases:
    - 铁木真统一蒙古
  category: 历史事件
  explanation: 1206年铁木真完成蒙古草原统一，建立蒙古政权，被尊为成吉思汗。
  misconceptions:
    - 误认为成吉思汗建立元朝，实际建立蒙古政权。
    - 将铁木真统一蒙古的时间错记为1271年，实际为1206年。
    - 把成吉思汗和忽必烈当作同一时期人物，实际相隔数十年。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:战国七雄
  type: Concept
  subject: 历史
  title: 战国七雄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将宋国、鲁国等诸侯国列入战国七雄，误以为称霸即可入选。
    - 能指出并纠正这一错误：误以为战国七雄包括晋国，不知晋已分裂为韩赵魏。
  aliases: []
  category: 历史概念
  explanation: 指战国时期势力最强的七个诸侯国：齐、楚、燕、韩、赵、魏、秦。
  misconceptions:
    - 将宋国、鲁国等诸侯国列入战国七雄，误以为称霸即可入选。
    - 误以为战国七雄包括晋国，不知晋已分裂为韩赵魏。
    - 漏记韩国，认为七雄中没有韩国。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:战国时期
  type: Concept
  subject: 历史
  title: 战国时期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为战国时期始于周平王东迁（公元前770年），实际为前475年。
    - 能指出并纠正这一错误：认为战国时期先于春秋时期，时间顺序颠倒。
  aliases:
    - 战国
  category: 历史时期
  explanation: 东周后期，一般指公元前475年至前221年，诸侯争霸，社会变革剧烈。
  misconceptions:
    - 误以为战国时期始于周平王东迁（公元前770年），实际为前475年。
    - 认为战国时期先于春秋时期，时间顺序颠倒。
    - 误以为战国时期结束于秦朝灭亡，实际结束于前221年秦统一。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:战时陪都
  type: Concept
  subject: 历史
  title: 战时陪都
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将战时陪都说成武汉，实际为重庆
    - 能指出并纠正这一错误：以为国民政府迁往重庆是在1938年武汉失守后，实际1937年底已定重庆为陪都
  aliases:
    - 陪都
  category: 历史概念
  explanation: 抗日战争时期，国民政府迁往重庆，将重庆作为战时首都。
  misconceptions:
    - 误将战时陪都说成武汉，实际为重庆
    - 以为国民政府迁往重庆是在1938年武汉失守后，实际1937年底已定重庆为陪都
    - 误认为国民政府始终在南京，忽略抗战期间曾以重庆为陪都
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:战略相持阶段
  type: Concept
  subject: 历史
  title: 战略相持阶段
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为相持阶段日军完全停止对正面战场的军事进攻。
    - 能指出并纠正这一错误：误以为相持阶段到来后正面战场就不再重要，只有敌后战场作战。
  aliases:
    - 相持阶段
  category: 历史概念
  explanation: 抗日战争进入相持阶段后，日军因战线过长、兵力物力财力日益困难，正面战场军事压力减小，敌后战场逐渐成为抗战的重要战场。
  misconceptions:
    - 认为相持阶段日军完全停止对正面战场的军事进攻。
    - 误以为相持阶段到来后正面战场就不再重要，只有敌后战场作战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:戚家军
  type: Concept
  subject: 历史
  title: 戚家军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为戚家军是明朝正规军，实际是戚继光招募农民和矿工组建
    - 能指出并纠正这一错误：将戚家军与岳家军混淆，以为其抗金，实际抗倭
  aliases: []
  category: 历史概念
  explanation: 戚继光招募农民和矿工，严格训练而成的军队，纪律严明，能征善战，被誉为“戚家军”。
  misconceptions:
    - 误认为戚家军是明朝正规军，实际是戚继光招募农民和矿工组建
    - 将戚家军与岳家军混淆，以为其抗金，实际抗倭
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:戚继光抗倭
  type: Concept
  subject: 历史
  title: 戚继光抗倭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为戚继光抗倭发生在明初，与郑和下西洋同时期
    - 能指出并纠正这一错误：误以为抗倭后倭患彻底绝迹，实际是基本解除
  aliases:
    - 戚家军抗倭
  category: 历史事件
  explanation: 明朝中期，戚继光率戚家军在东南沿海抗击倭寇，基本解除倭患，是一场反侵略战争。
  misconceptions:
    - 认为戚继光抗倭发生在明初，与郑和下西洋同时期
    - 误以为抗倭后倭患彻底绝迹，实际是基本解除
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:扁鹊
  type: Concept
  subject: 历史
  title: 扁鹊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把扁鹊当成华佗，称其发明了“麻沸散”
    - 能指出并纠正这一错误：认为“望闻问切”四诊法是张仲景总结的，与扁鹊无关
  aliases: []
  category: 医学
  explanation: 战国时期名医，发明切脉诊法，使用望、闻、问、切四诊法。
  misconceptions:
    - 误把扁鹊当成华佗，称其发明了“麻沸散”
    - 认为“望闻问切”四诊法是张仲景总结的，与扁鹊无关
    - 说扁鹊是《黄帝内经》的作者，生活在西汉时期
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:手工工场
  type: Concept
  subject: 历史
  title: 手工工场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为手工工场只存在于城市，实际有分散和集中两种形式，农村也有
    - 能指出并纠正这一错误：误以为分散手工工场没有雇佣关系，实际商人提供原料和工具，形成雇佣关系
  aliases: []
  category: 经济制度
  explanation: 手工业者脱离农业，为市场生产，商人提供原料和工具，形成雇佣关系，分分散和集中两种形式。
  misconceptions:
    - 认为手工工场只存在于城市，实际有分散和集中两种形式，农村也有
    - 误以为分散手工工场没有雇佣关系，实际商人提供原料和工具，形成雇佣关系
    - 认为手工工场主都是手艺人自己，实际多为商人提供原料和工具组织生产
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:打扫干净屋子再请客
  type: Concept
  subject: 历史
  title: 打扫干净屋子再请客
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为该方针指先清除国内反动派再与外国建交，实际为清除帝国主义在华残余势力。
    - 能指出并纠正这一错误：误认为与“另起炉灶”完全相同，实际前者针对旧外交，后者针对帝国主义在华残余势力。
  aliases: []
  category: 外交方针
  explanation: 清除帝国主义在华残余势力后再考虑建交。
  misconceptions:
    - 误认为该方针指先清除国内反动派再与外国建交，实际为清除帝国主义在华残余势力。
    - 误认为与“另起炉灶”完全相同，实际前者针对旧外交，后者针对帝国主义在华残余势力。
    - 误认为该方针由周恩来提出，实际由毛泽东提出。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:扶清灭洋
  type: Concept
  subject: 历史
  title: 扶清灭洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为‘扶清’是支持清政府改革，实际是扶助清朝统治
    - 能指出并纠正这一错误：认为口号体现了对清政府本质的清醒认识，实际认识不清
  aliases: []
  category: 口号
  explanation: 义和团提出的口号，表达了反对帝国主义的斗争意志，但具有盲目排外的落后性，也反映其对清政府本质认识不清。
  misconceptions:
    - 以为‘扶清’是支持清政府改革，实际是扶助清朝统治
    - 认为口号体现了对清政府本质的清醒认识，实际认识不清
    - 把‘灭洋’等同于科学反帝，忽略其盲目排外的落后性
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S3.md
- id: concept:历史:承德避暑山庄
  type: Concept
  subject: 历史
  title: 承德避暑山庄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为承德避暑山庄仅是娱乐场所，忽略它用于处理政务和笼络边疆首领的政治功能。
    - 能指出并纠正这一错误：误将避暑山庄当成颐和园或圆明园，混淆不同皇家园林。
  aliases: []
  category: 历史建筑
  explanation: 清朝皇帝夏天避暑和处理政务的场所，用于接见使节和各族首领，加强中央与边疆联系。
  misconceptions:
    - 认为承德避暑山庄仅是娱乐场所，忽略它用于处理政务和笼络边疆首领的政治功能。
    - 误将避暑山庄当成颐和园或圆明园，混淆不同皇家园林。
    - 认为山庄建于乾隆时期，实际康熙时开始营建。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:投笔从戎
  type: Concept
  subject: 历史
  title: 投笔从戎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“投笔从戎”出自张骞或班固，实际是班超。
    - 能指出并纠正这一错误：把“投笔从戎”理解为弃武从文，方向相反。
  aliases: []
  category: 历史典故
  explanation: 班超曾为官府抄写文书，后投笔从军，立志效法张骞在边疆立功，成为历史典故，比喻弃文就武。
  misconceptions:
    - 误认为“投笔从戎”出自张骞或班固，实际是班超。
    - 把“投笔从戎”理解为弃武从文，方向相反。
    - 以为投笔从戎发生在西汉，实际是东汉。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:抗击非典
  type: Concept
  subject: 历史
  title: 抗击非典
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把非典爆发年份记成2002年或2004年，实际是2003年春。
    - 能指出并纠正这一错误：误以为非典疫情首先发生在北京，忽略最早出现在广东。
  aliases: []
  category: 重大事件
  explanation: 2003年春，非典型性肺炎疫情爆发，在中共中央、国务院领导下，全国人民夺取了防治非典工作的重大胜利。
  misconceptions:
    - 把非典爆发年份记成2002年或2004年，实际是2003年春。
    - 误以为非典疫情首先发生在北京，忽略最早出现在广东。
    - 将抗击非典与防治禽流感相混淆，忽略完全不同的疫病种类。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:抗日战争胜利
  type: Concept
  subject: 历史
  title: 抗日战争胜利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗战胜利是1945年9月2日日本签署投降书，而非8月15日宣布投降。
    - 能指出并纠正这一错误：说抗战胜利后台湾才回到祖国，却忽略甲午战争后已被割让。
  aliases:
    - 抗战胜利
  category: 历史事件
  explanation: 1945年8月15日，日本宣布无条件投降，中国人民取得抗日战争的伟大胜利。
  misconceptions:
    - 认为抗战胜利是1945年9月2日日本签署投降书，而非8月15日宣布投降。
    - 说抗战胜利后台湾才回到祖国，却忽略甲午战争后已被割让。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:抗日战争胜利的意义
  type: Concept
  subject: 历史
  title: 抗日战争胜利的意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为抗日战争的胜利标志着中国实现民族独立，实际随后还有解放战争
    - 能指出并纠正这一错误：认为抗日战争是近代中国第一次反侵略斗争，忽略以往多次反抗
  aliases: []
  category: 历史意义
  explanation: 抗日战争是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争，促进了中华民族的觉醒，为民族独立和人民解放奠定基础，提高了中国的国际地位。
  misconceptions:
    - 误以为抗日战争的胜利标志着中国实现民族独立，实际随后还有解放战争
    - 认为抗日战争是近代中国第一次反侵略斗争，忽略以往多次反抗
    - 将抗战胜利的意义与解放战争胜利的意义完全等同，忽视各自特点
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:抗日根据地
  type: Concept
  subject: 历史
  title: 抗日根据地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗日根据地是国民党在敌后设立的行政区域。
    - 能指出并纠正这一错误：误以为根据地只是临时集结地，没有政权建设。
  aliases:
    - 敌后根据地
  category: 历史概念
  explanation: 中国共产党在敌后建立的抗日根据地，如晋察冀、晋绥等，是敌后战场的依托。
  misconceptions:
    - 认为抗日根据地是国民党在敌后设立的行政区域。
    - 误以为根据地只是临时集结地，没有政权建设。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:抗日民族统一战线
  type: Concept
  subject: 历史
  title: 抗日民族统一战线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗日民族统一战线在九一八事变后立即形成，实际是西安事变后初步形成。
    - 能指出并纠正这一错误：说统一战线只包括国共两党，忽略了其他抗日力量。
  aliases:
    - 民族统一战线
  category: 历史概念
  explanation: 中国共产党倡导的以国共合作为基础，团结一切抗日力量的统一战线，是抗战胜利的重要保证。
  misconceptions:
    - 认为抗日民族统一战线在九一八事变后立即形成，实际是西安事变后初步形成。
    - 说统一战线只包括国共两党，忽略了其他抗日力量。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:抗洪精神
  type: Concept
  subject: 历史
  title: 抗洪精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将抗洪精神与抗震救灾精神混淆，不知道特指1998年抗洪。
    - 能指出并纠正这一错误：误以为抗洪精神形成于2003年非典时期，时间错位。
  aliases: []
  category: 精神
  explanation: 1998年抗洪斗争中形成的万众一心、众志成城，不怕困难、顽强拼搏，坚韧不拔、敢于胜利的伟大精神。
  misconceptions:
    - 将抗洪精神与抗震救灾精神混淆，不知道特指1998年抗洪。
    - 误以为抗洪精神形成于2003年非典时期，时间错位。
    - 认为抗洪精神只体现军人的贡献，忽略人民群众的参与。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:抗疫精神
  type: Concept
  subject: 历史
  title: 抗疫精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为抗疫精神只包含生命至上和举国同心，遗漏舍生忘死、尊重科学。
    - 能指出并纠正这一错误：认为“命运与共”仅指国内团结，忽视其国际关怀内涵。
  aliases: []
  category: 精神谱系
  explanation: 在抗击新冠疫情中铸就的精神，体现了生命至上、举国同心、舍生忘死、尊重科学、命运与共。
  misconceptions:
    - 误以为抗疫精神只包含生命至上和举国同心，遗漏舍生忘死、尊重科学。
    - 认为“命运与共”仅指国内团结，忽视其国际关怀内涵。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:抗美援朝战争
  type: Concept
  subject: 历史
  title: 抗美援朝战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把抗美援朝战争的起止时间记为1950年6月至1953年7月，混淆了朝鲜战争爆发时间。
    - 能指出并纠正这一错误：认为抗美援朝战争是中国与美国的直接战争，忽视了联合国军和韩国军队的存在。
  aliases:
    - 抗美援朝
  category: 历史事件
  explanation: 1950年10月中国人民志愿军入朝作战，1953年取得胜利，保卫了国家安全，提高了中国国际地位。
  misconceptions:
    - 把抗美援朝战争的起止时间记为1950年6月至1953年7月，混淆了朝鲜战争爆发时间。
    - 认为抗美援朝战争是中国与美国的直接战争，忽视了联合国军和韩国军队的存在。
    - 误以为抗美援朝战争结束于1954年日内瓦会议之后。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:抗美援朝精神
  type: Concept
  subject: 历史
  title: 抗美援朝精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将抗美援朝精神中的国际主义说成是革命忠诚，张冠李戴。
    - 能指出并纠正这一错误：认为抗美援朝精神只包括爱国主义和革命英雄主义，漏掉了革命乐观主义、革命忠诚和国际主义。
  aliases: []
  category: 精神概念
  explanation: 包括爱国主义、革命英雄主义、革命乐观主义、革命忠诚和国际主义精神，是中国人民志愿军的精神特质。
  misconceptions:
    - 将抗美援朝精神中的国际主义说成是革命忠诚，张冠李戴。
    - 认为抗美援朝精神只包括爱国主义和革命英雄主义，漏掉了革命乐观主义、革命忠诚和国际主义。
    - 简单地用‘不怕牺牲’概括抗美援朝精神，忽略了其丰富的内涵。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:抗震救灾精神
  type: Concept
  subject: 历史
  title: 抗震救灾精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把抗震救灾精神说成是在1998年抗洪抢险中形成的。
    - 能指出并纠正这一错误：认为汶川地震灾后重建奇迹主要依靠外国援助，不是军民团结。
  aliases: []
  category: 精神
  explanation: 在2008年汶川特大地震中，军民团结一心，创造了灾后重建的奇迹，体现了伟大的抗震救灾精神。
  misconceptions:
    - 把抗震救灾精神说成是在1998年抗洪抢险中形成的。
    - 认为汶川地震灾后重建奇迹主要依靠外国援助，不是军民团结。
    - 将抗震救灾精神与唐山大地震中的‘公而忘私’精神完全等同。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:护国战争
  type: Concept
  subject: 历史
  title: 护国战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为护国战争是孙中山领导的，实际领导人是蔡锷、唐继尧等。
    - 能指出并纠正这一错误：认为护国战争迫使袁世凯下台，实际袁世凯只是取消帝制，仍任大总统。
  aliases:
    - 护国运动
  category: 历史事件
  explanation: 1915年底，蔡锷、唐继尧等为反对袁世凯称帝，在云南宣布独立并组织护国军讨袁，最终迫使袁世凯取消帝制。
  misconceptions:
    - 误认为护国战争是孙中山领导的，实际领导人是蔡锷、唐继尧等。
    - 认为护国战争迫使袁世凯下台，实际袁世凯只是取消帝制，仍任大总统。
    - 把护国战争的时间放在二次革命之前，实际发生在1915年底，晚于二次革命。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:护法运动
  type: Concept
  subject: 历史
  title: 护法运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将护法运动与护国运动混淆，误以为护法运动反对袁世凯称帝。
    - 能指出并纠正这一错误：误以为护法运动维护的是袁世凯的《中华民国约法》，实际是《临时约法》。
  aliases:
    - 护法战争
  category: 历史事件
  explanation: 1917年孙中山为维护《临时约法》和国会，在广州组织护法军政府，但最终失败。
  misconceptions:
    - 将护法运动与护国运动混淆，误以为护法运动反对袁世凯称帝。
    - 误以为护法运动维护的是袁世凯的《中华民国约法》，实际是《临时约法》。
    - 把护法运动的时间记成1915年或1916年，实际为1917年。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:拉丁美洲独立运动
  type: Concept
  subject: 历史
  title: 拉丁美洲独立运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为反抗的唯一殖民者是西班牙，实际巴西反抗葡萄牙。
    - 能指出并纠正这一错误：误认为运动由玻利瓦尔一人领导，实际有圣马丁等多位领导人。
  aliases:
    - 拉丁美洲独立战争
  category: 历史事件
  explanation: 18世纪末19世纪初，受美国独立战争和法国大革命影响，拉丁美洲爆发反抗西班牙、葡萄牙殖民统治、争取民族独立的运动。
  misconceptions:
    - 误认为反抗的唯一殖民者是西班牙，实际巴西反抗葡萄牙。
    - 误认为运动由玻利瓦尔一人领导，实际有圣马丁等多位领导人。
    - 误认为运动发生在18世纪初，实际在18世纪末19世纪初。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:拜上帝会
  type: Concept
  subject: 历史
  title: 拜上帝会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为拜上帝会创立于金田起义之后，实际创立于1843年更早
    - 能指出并纠正这一错误：将拜上帝会与太平天国政权混为一谈，实际是宗教组织
  aliases: []
  category: 组织
  explanation: 洪秀全于1843年创立的宗教组织，后成为太平天国运动的领导核心。
  misconceptions:
    - 误以为拜上帝会创立于金田起义之后，实际创立于1843年更早
    - 将拜上帝会与太平天国政权混为一谈，实际是宗教组织
    - 认为洪秀全是拜上帝会的唯一创立者，实际是洪秀全和冯云山共同创立
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:拜占庭帝国
  type: Concept
  subject: 历史
  title: 拜占庭帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将拜占庭帝国等同于西罗马帝国，首都是罗马
    - 能指出并纠正这一错误：以为拜占庭帝国在476年与西罗马一同灭亡
  aliases:
    - 东罗马帝国
  category: 历史概念
  explanation: 即东罗马帝国，都城君士坦丁堡，地跨欧亚非三洲，1453年被奥斯曼帝国灭亡。
  misconceptions:
    - 误将拜占庭帝国等同于西罗马帝国，首都是罗马
    - 以为拜占庭帝国在476年与西罗马一同灭亡
    - 把灭亡时间记成1204年十字军攻陷，实际是1453年奥斯曼
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:拜占庭文化
  type: Concept
  subject: 历史
  title: 拜占庭文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为拜占庭文化只继承基督教，未吸收希腊罗马古典文化
    - 能指出并纠正这一错误：误以为文艺复兴的古籍来自阿拉伯人，忽视拜占庭的保存
  aliases: []
  category: 历史概念
  explanation: 拜占庭帝国对基督教、希腊罗马古典文化及东方文化兼收并蓄形成的独特文化，保存了大量古籍，为文艺复兴提供营养。
  misconceptions:
    - 认为拜占庭文化只继承基督教，未吸收希腊罗马古典文化
    - 误以为文艺复兴的古籍来自阿拉伯人，忽视拜占庭的保存
    - 把拜占庭文化与伊斯兰文化混为一谈
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:拨乱反正
  type: Concept
  subject: 历史
  title: 拨乱反正
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为拨乱反正仅在思想领域进行，忽略政治、组织等领域
    - 能指出并纠正这一错误：误认为十一届三中全会已彻底完成拨乱反正，实际是全面展开并持续
  aliases: []
  category: 历史概念
  explanation: 中共十一届三中全会后，在思想、政治、组织等领域全面纠正'文化大革命'错误，平反冤假错案，恢复正确方针政策。
  misconceptions:
    - 以为拨乱反正仅在思想领域进行，忽略政治、组织等领域
    - 误认为十一届三中全会已彻底完成拨乱反正，实际是全面展开并持续
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:拿破仑帝国
  type: Concept
  subject: 历史
  title: 拿破仑帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为拿破仑帝国是封建专制帝国，废除了《法典》
    - 能指出并纠正这一错误：将拿破仑帝国与法兰西第一共和国混为一谈，认为同时存在
  aliases: []
  category: 历史时期
  explanation: 拿破仑建立的军事独裁帝国，颁布《法典》，巩固资产阶级成果。
  misconceptions:
    - 误以为拿破仑帝国是封建专制帝国，废除了《法典》
    - 将拿破仑帝国与法兰西第一共和国混为一谈，认为同时存在
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:指南针
  type: Concept
  subject: 历史
  title: 指南针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为指南针在唐代已用于航海，实际宋代才用于航海
    - 能指出并纠正这一错误：误以为指南针是欧洲人发明的，实际是中国发明后传入欧洲
  aliases:
    - 罗盘
  category: 科技成就
  explanation: 利用磁石指南特性制成的指向工具，宋代用于航海，后传入欧洲，推动新航路开辟。
  misconceptions:
    - 误认为指南针在唐代已用于航海，实际宋代才用于航海
    - 误以为指南针是欧洲人发明的，实际是中国发明后传入欧洲
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:挟天子以令诸侯
  type: Concept
  subject: 历史
  title: 挟天子以令诸侯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“挟天子”理解为曹操废掉汉献帝自己称帝，实际是保留皇帝名号控制朝政
    - 能指出并纠正这一错误：认为“令诸侯”是曹操直接命令所有诸侯服从，实际是以皇帝名义号令
  aliases: []
  category: 政治策略
  explanation: 曹操将汉献帝接到许，以皇帝名义号令诸侯，取得政治主动权。
  misconceptions:
    - 把“挟天子”理解为曹操废掉汉献帝自己称帝，实际是保留皇帝名号控制朝政
    - 认为“令诸侯”是曹操直接命令所有诸侯服从，实际是以皇帝名义号令
    - 误以为曹操把汉献帝接到洛阳，实际是接到许
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S1.md
- id: concept:历史:推恩令
  type: Concept
  subject: 历史
  title: 推恩令
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为推恩令是强行削夺诸侯王土地，实际是允许分封子弟。
    - 能指出并纠正这一错误：误以为推恩令实施后诸侯王势力立即消失，实际是逐步削弱。
  aliases:
    - 推恩
  category: 政治制度
  explanation: 汉武帝采纳主父偃建议，允许诸侯王将封地分封给子弟，使侯国增多而诸侯王势力减小，从而加强中央集权。
  misconceptions:
    - 认为推恩令是强行削夺诸侯王土地，实际是允许分封子弟。
    - 误以为推恩令实施后诸侯王势力立即消失，实际是逐步削弱。
    - 将推恩令理解为废除分封制，实际只是缩小诸侯王封地。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:援朝战争
  type: Concept
  subject: 历史
  title: 援朝战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把援朝战争说成唐朝派兵援助朝鲜
    - 能指出并纠正这一错误：认为丰臣秀吉是朝鲜人，实际是日本统治者
  aliases:
    - 万历援朝战争
  category: 历史事件
  explanation: 明朝万历年间，日本丰臣秀吉侵略朝鲜，明朝两次出兵援助，沉重打击了日本势力。
  misconceptions:
    - 误把援朝战争说成唐朝派兵援助朝鲜
    - 认为丰臣秀吉是朝鲜人，实际是日本统治者
    - 将援朝战争说成明太祖时期，实际在万历年间
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:摊丁入亩
  type: Concept
  subject: 历史
  title: 摊丁入亩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将摊丁入亩与明朝张居正的一条鞭法混为一谈。
    - 能指出并纠正这一错误：认为摊丁入亩取消了人头税，实际只是将丁银摊入田赋征收。
  aliases: []
  category: 制度
  explanation: 雍正年间将丁银分摊到田赋中征收，减轻无地农民负担，隐匿人口显现。
  misconceptions:
    - 误将摊丁入亩与明朝张居正的一条鞭法混为一谈。
    - 认为摊丁入亩取消了人头税，实际只是将丁银摊入田赋征收。
    - 误记在康熙年间实行，实际是雍正帝推行。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:攻占巴士底狱
  type: Concept
  subject: 历史
  title: 攻占巴士底狱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为攻占巴士底狱标志着法国大革命结束
    - 能指出并纠正这一错误：误将巴士底狱说成关押资产阶级的监狱，实际上是堡垒
  aliases:
    - 巴士底狱陷落
  category: 历史事件
  explanation: 1789年7月14日巴黎民众攻占巴士底狱，标志着法国大革命开始。
  misconceptions:
    - 误以为攻占巴士底狱标志着法国大革命结束
    - 误将巴士底狱说成关押资产阶级的监狱，实际上是堡垒
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:政治协商会议
  type: Concept
  subject: 历史
  title: 政治协商会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把1946年政治协商会议与1949年新政协会议混为一谈
    - 能指出并纠正这一错误：误认为政协会议决议废除了国民党一党专政和蒋介石独裁统治
  aliases: []
  category: 历史事件
  explanation: 1946年召开的政治协商会议，为实现和平民主带来一线曙光，但国民党坚持独裁统治，悍然发动内战。
  misconceptions:
    - 把1946年政治协商会议与1949年新政协会议混为一谈
    - 误认为政协会议决议废除了国民党一党专政和蒋介石独裁统治
    - 误以为政协会议是在全面内战爆发后召开，实际召开于内战前
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:政治腐败
  type: Concept
  subject: 历史
  title: 政治腐败
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为明朝政治腐败仅存在于天启、崇祯年间，实际从中后期已开始。
    - 能指出并纠正这一错误：把明朝政治腐败归因于农民起义，因果倒置，实际腐败导致起义。
  aliases: []
  category: 历史概念
  explanation: 明朝中后期，皇帝沉迷享乐，宦官专权，朝政混乱，导致社会控制力下降。
  misconceptions:
    - 认为明朝政治腐败仅存在于天启、崇祯年间，实际从中后期已开始。
    - 把明朝政治腐败归因于农民起义，因果倒置，实际腐败导致起义。
    - 认为宦官专权从明朝建立时就存在，实际是中后期才严重。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:敌后战场
  type: Concept
  subject: 历史
  title: 敌后战场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为敌后战场是国民党正规军开辟的，与共产党无关。
    - 能指出并纠正这一错误：误以为敌后战场只起配合作用，不是抗战的重要战场。
  aliases:
    - 敌后抗日根据地
  category: 历史概念
  explanation: 中国共产党领导八路军、新四军深入敌后，建立抗日根据地，开展游击战争，牵制和抗击大量日军，是抗日战争的重要战场。
  misconceptions:
    - 认为敌后战场是国民党正规军开辟的，与共产党无关。
    - 误以为敌后战场只起配合作用，不是抗战的重要战场。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:敦煌莫高窟
  type: Concept
  subject: 历史
  title: 敦煌莫高窟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为莫高窟在河南洛阳，实际位于甘肃敦煌。
    - 能指出并纠正这一错误：认为莫高窟属于道教艺术，实际是佛教艺术地。
  aliases:
    - 莫高窟
  category: 文化遗址
  explanation: 位于甘肃敦煌，是世界上现存规模最大、内容最丰富的佛教艺术地，唐朝开凿的石窟数量最多。
  misconceptions:
    - 误认为莫高窟在河南洛阳，实际位于甘肃敦煌。
    - 认为莫高窟属于道教艺术，实际是佛教艺术地。
    - 认为莫高窟开凿于唐朝，实际始于十六国时期，唐朝只是数量最多。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:文化专制政策
  type: Concept
  subject: 历史
  title: 文化专制政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文化专制仅是查禁书籍，忽视尊孔读经、编撰书籍也是思想控制手段。
    - 能指出并纠正这一错误：将文化专制政策等同于秦始皇焚书坑儒，混淆了朝代与手段。
  aliases:
    - 文化专制
  category: 历史
  explanation: 清朝统治者为了维护集权统治，在文化上实行专制政策，包括提倡尊孔读经、编纂书籍，同时查禁和销毁不利书籍。
  misconceptions:
    - 认为文化专制仅是查禁书籍，忽视尊孔读经、编撰书籍也是思想控制手段。
    - 将文化专制政策等同于秦始皇焚书坑儒，混淆了朝代与手段。
    - 以为文字狱是唯一表现，其实提倡理学、编书等均属专制表现。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:文化产业
  type: Concept
  subject: 历史
  title: 文化产业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新闻出版、广播影视全是文化产业，忽略其中还有文化事业。
    - 能指出并纠正这一错误：将文化产业等同于文化事业，认为都靠国家拨款。
  aliases: []
  category: 经济概念
  explanation: 指从事文化产品生产和提供文化服务的经营性行业，包括新闻出版、广播影视、动漫游戏等。
  misconceptions:
    - 认为新闻出版、广播影视全是文化产业，忽略其中还有文化事业。
    - 将文化产业等同于文化事业，认为都靠国家拨款。
    - 误以为文化产业仅指文化产品生产，不包括文化服务。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S2.md
- id: concept:历史:文化体制改革
  type: Concept
  subject: 历史
  title: 文化体制改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文化体制改革就是将所有文化单位转制为企业，取消公益性质。
    - 能指出并纠正这一错误：把文化体制改革误认为是政治体制改革，改变社会主义制度。
  aliases: []
  category: 政治概念
  explanation: 国家为促进文化发展繁荣而进行的体制机制改革，包括文化事业单位转企改制、公共文化服务体系建设等。
  misconceptions:
    - 认为文化体制改革就是将所有文化单位转制为企业，取消公益性质。
    - 把文化体制改革误认为是政治体制改革，改变社会主义制度。
    - 认为文化体制改革只是事业单位转企，不包括公共文化服务体系建设。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S2.md
- id: concept:历史:文化自信
  type: Concept
  subject: 历史
  title: 文化自信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文化自信只指对中国古代传统文化的自信，排斥革命文化和先进文化。
    - 能指出并纠正这一错误：把文化自信等同于文化自负，认为外国文化一无是处。
  aliases: []
  category: 政治概念
  explanation: 对自身文化价值的充分肯定和积极践行，是更基本、更深沉、更持久的力量。
  misconceptions:
    - 认为文化自信只指对中国古代传统文化的自信，排斥革命文化和先进文化。
    - 把文化自信等同于文化自负，认为外国文化一无是处。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:文天祥抗元
  type: Concept
  subject: 历史
  title: 文天祥抗元
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为文天祥是南宋初年人，实为南宋末年人。
    - 能指出并纠正这一错误：把文天祥抗元与岳飞抗金混为一谈，时代和对象不同。
  aliases: []
  category: 历史事件
  explanation: 文天祥在南宋灭亡后坚持抗元，兵败被俘，宁死不屈，从容就义。
  misconceptions:
    - 误认为文天祥是南宋初年人，实为南宋末年人。
    - 把文天祥抗元与岳飞抗金混为一谈，时代和对象不同。
    - 认为文天祥兵败被俘后投降元朝，实际宁死不屈。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:文字狱
  type: Concept
  subject: 历史
  title: 文字狱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文字狱是秦始皇发明的，但清朝文字狱尤为突出，需区分时间。
    - 能指出并纠正这一错误：误认为文字狱是清政府为选拔人才而设计的制度，实际是镇压思想的冤狱。
  aliases: []
  category: 文化政策
  explanation: 清朝统治者从士人文章中摘取只言片语，罗织罪状，制造冤狱，禁锢思想，阻碍学术发展。
  misconceptions:
    - 认为文字狱是秦始皇发明的，但清朝文字狱尤为突出，需区分时间。
    - 误认为文字狱是清政府为选拔人才而设计的制度，实际是镇压思想的冤狱。
    - 将“八股取士”视为文字狱，两者性质不同，八股是科举形式，文字狱是思想控制。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:文学社与共进会
  type: Concept
  subject: 历史
  title: 文学社与共进会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为文学社与共进会是同盟会直接领导的支部，实际受其影响但独立活动。
    - 能指出并纠正这一错误：混淆文学社与日知会，误以为它们都是同盟会的外围组织。
  aliases: []
  category: 历史组织
  explanation: 湖北的革命组织，在同盟会影响下谋划武昌起义，是起义的主要策划者。
  misconceptions:
    - 误认为文学社与共进会是同盟会直接领导的支部，实际受其影响但独立活动。
    - 混淆文学社与日知会，误以为它们都是同盟会的外围组织。
    - 以偏概全，认为武昌起义只由文学社策划，忽略共进会的联合行动。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:文学革命
  type: Concept
  subject: 历史
  title: 文学革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为文学革命就是新文化运动，忽略其只是重要组成部分
    - 能指出并纠正这一错误：把文学革命代表人物写成鲁迅、李大钊，实际是胡适、陈独秀
  aliases: []
  category: 历史事件
  explanation: 新文化运动的重要组成部分，主张以白话文代替文言文，建设新文学，代表人物有胡适、陈独秀。
  misconceptions:
    - 误以为文学革命就是新文化运动，忽略其只是重要组成部分
    - 把文学革命代表人物写成鲁迅、李大钊，实际是胡适、陈独秀
    - 认为文学革命仅废文言文，不涉及思想内容革新
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:文成公主入藏
  type: Concept
  subject: 历史
  title: 文成公主入藏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记入藏时间为唐玄宗时，实际是唐太宗贞观年间
    - 能指出并纠正这一错误：误认为文成公主是唐太宗的亲生女儿，实际是宗室女
  aliases: []
  category: 历史事件
  explanation: 641年，唐太宗将文成公主嫁给吐蕃赞普松赞干布，带去大量物品和书籍，促进吐蕃发展。
  misconceptions:
    - 误记入藏时间为唐玄宗时，实际是唐太宗贞观年间
    - 误认为文成公主是唐太宗的亲生女儿，实际是宗室女
    - 误认为文成公主入藏只是为了传播佛教，忽略其他交流
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:文明社会标志
  type: Concept
  subject: 历史
  title: 文明社会标志
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为出现文字才是进入文明社会的最重要标志
    - 能指出并纠正这一错误：误以为私有制、阶级、国家三者必须同时产生，缺一不可
  aliases: []
  category: 历史概念
  explanation: 私有制、阶级和国家的产生是人类进入文明社会的重要标志。
  misconceptions:
    - 认为出现文字才是进入文明社会的最重要标志
    - 误以为私有制、阶级、国家三者必须同时产生，缺一不可
    - 以偏概全，认为有了私有制就一定进入文明社会，忽视阶级和国家
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:文景之治
  type: Concept
  subject: 历史
  title: 文景之治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将文景之治误记为汉武帝时期，实际是汉文帝和汉景帝
    - 能指出并纠正这一错误：认为文景之治只是文帝一人之功，漏掉景帝继续推行
  aliases: []
  category: 历史时期
  explanation: 汉文帝、汉景帝时期，继续推行休养生息政策，社会安定，经济恢复发展，史称“文景之治”。
  misconceptions:
    - 将文景之治误记为汉武帝时期，实际是汉文帝和汉景帝
    - 认为文景之治只是文帝一人之功，漏掉景帝继续推行
    - 误以为文景之治时期完全废除刑罚，实际只是减轻
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:文献史料
  type: Concept
  subject: 历史
  title: 文献史料
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把出土青铜器当作文献史料，混淆实物史料与文字记载。
    - 能指出并纠正这一错误：只读文献中一句话就下结论，如仅凭《史记》一句判定项羽英雄。
  aliases:
    - 史料
  category: 历史研究方法
  explanation: 文献史料是书面记录史事的主要载体，是学习历史的基础。读懂文献史料需要关注出处、理解字词、把握整体意思并与其他史料相互印证。
  misconceptions:
    - 把出土青铜器当作文献史料，混淆实物史料与文字记载。
    - 只读文献中一句话就下结论，如仅凭《史记》一句判定项羽英雄。
    - 以为文献史料全部真实可信，忽略作者立场和时代背景的影响。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S9.md
- id: concept:历史:文艺复兴
  type: Concept
  subject: 历史
  title: 文艺复兴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文艺复兴是复古希腊罗马文化，没看到它宣传人文主义、批判教会
    - 能指出并纠正这一错误：把文艺复兴兴起时间说成15世纪，实际是14世纪中叶起源于意大利
  aliases: []
  category: 历史事件
  explanation: 14世纪中叶兴起于意大利的思想文化运动，以人文主义为核心，反对教会神权至上，促进思想解放。
  misconceptions:
    - 认为文艺复兴是复古希腊罗马文化，没看到它宣传人文主义、批判教会
    - 把文艺复兴兴起时间说成15世纪，实际是14世纪中叶起源于意大利
    - 误以为文艺复兴否定了宗教信仰，实际只反对教会神权，并不反对宗教本身
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:斯大林格勒保卫战
  type: Concept
  subject: 历史
  title: 斯大林格勒保卫战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把斯大林格勒保卫战说成美苏联军作战，实际是苏联单独抗击德国
    - 能指出并纠正这一错误：认为斯大林格勒战役是太平洋战场的转折点
  aliases: []
  category: 历史事件
  explanation: 1942年7月至1943年2月，苏联在斯大林格勒击败德军，成为二战的转折点。
  misconceptions:
    - 把斯大林格勒保卫战说成美苏联军作战，实际是苏联单独抗击德国
    - 认为斯大林格勒战役是太平洋战场的转折点
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:新“三步走”发展战略
  type: Concept
  subject: 历史
  title: 新“三步走”发展战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为新“三步走”战略是1987年十三大提出，与邓小平“三步走”混为一谈
    - 能指出并纠正这一错误：将新三步走第一步目标写成“解决温饱”，实际应是国民生产总值翻番
  aliases:
    - 三步走战略
    - 新三步走发展战略
  category: 发展战略
  explanation: 1997年中共十五大提出，分三步实现国民生产总值翻番、完善市场经济体制、基本实现现代化。
  misconceptions:
    - 误以为新“三步走”战略是1987年十三大提出，与邓小平“三步走”混为一谈
    - 将新三步走第一步目标写成“解决温饱”，实际应是国民生产总值翻番
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:新三民主义
  type: Concept
  subject: 历史
  title: 新三民主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新三民主义就是联俄、联共、扶助农工三大政策本身，实际上三民主义是纲领，三大政策是政策
    - 能指出并纠正这一错误：认为新三民主义是中国共产党提出的，实际是孙中山重新解释的
  aliases:
    - 联俄、联共、扶助农工三大政策
  category: 政治理论
  explanation: 孙中山在国民党一大上重新解释的三民主义，确立了联俄、联共、扶助农工三大政策，成为国共合作的政治基础。
  misconceptions:
    - 认为新三民主义就是联俄、联共、扶助农工三大政策本身，实际上三民主义是纲领，三大政策是政策
    - 认为新三民主义是中国共产党提出的，实际是孙中山重新解释的
    - 认为新三民主义与旧三民主义没有区别，忽略了其革命性发展
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:新发展格局
  type: Concept
  subject: 历史
  title: 新发展格局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为新发展格局就是闭关锁国，不再需要对外开放。
    - 能指出并纠正这一错误：把“国内国际双循环”理解为先国内后国际，有先后顺序。
  aliases:
    - 双循环
  category: 经济战略
  explanation: 以国内大循环为主体、国内国际双循环相互促进的新发展格局，2020年中共中央提出。
  misconceptions:
    - 误以为新发展格局就是闭关锁国，不再需要对外开放。
    - 把“国内国际双循环”理解为先国内后国际，有先后顺序。
    - 将新发展格局视为应对疫情的临时政策，而非长期战略。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:新发展理念
  type: Concept
  subject: 历史
  title: 新发展理念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写新发展理念时漏掉“开放”，写成创新、协调、绿色、共享
    - 能指出并纠正这一错误：误以为新发展理念是2014年提出，实际是2015年
  aliases: []
  category: 发展理念
  explanation: 即创新、协调、绿色、开放、共享的发展理念，2015年提出。
  misconceptions:
    - 写新发展理念时漏掉“开放”，写成创新、协调、绿色、共享
    - 误以为新发展理念是2014年提出，实际是2015年
    - 认为新发展理念仅仅指挥经济发展，忽视对环境保护的指导
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:新四军
  type: Concept
  subject: 历史
  title: 新四军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将新四军说成由工农红军主力改编，实际为南方八省游击队
    - 能指出并纠正这一错误：把新四军军长记成项英，实际是叶挺，项英为副军长
  aliases:
    - 国民革命军陆军新编第四军
  category: 军事组织
  explanation: 南方八省游击队改编为国民革命军陆军新编第四军，叶挺任军长。
  misconceptions:
    - 误将新四军说成由工农红军主力改编，实际为南方八省游击队
    - 把新四军军长记成项英，实际是叶挺，项英为副军长
    - 误以为新四军与八路军同时在华北作战，实际新四军在南方
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:新式海军
  type: Concept
  subject: 历史
  title: 新式海军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：忘记北洋舰队1888年正式成军的时间
    - 能指出并纠正这一错误：误以为新式海军是甲午战后重建的，实际是洋务运动期间筹建
  aliases:
    - 北洋海军
  category: 历史概念
  explanation: 洋务运动期间筹建的海军力量，包括福建、广东、南洋和北洋海军，其中北洋舰队规模最大，1888年正式成军。
  misconceptions:
    - 忘记北洋舰队1888年正式成军的时间
    - 误以为新式海军是甲午战后重建的，实际是洋务运动期间筹建
    - 把南洋海军误认为规模最大，实际北洋舰队最大
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:新文化运动
  type: Concept
  subject: 历史
  title: 新文化运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为新文化运动开始于1917年十月革命后，实际是1915年
    - 能指出并纠正这一错误：认为新文化运动全盘否定传统文化，实际主要反对封建礼教
  aliases: []
  category: 历史事件
  explanation: 1915年由陈独秀等人发起的思想文化革新运动，提倡民主与科学，反对封建礼教，为五四运动奠定思想基础。
  misconceptions:
    - 误以为新文化运动开始于1917年十月革命后，实际是1915年
    - 认为新文化运动全盘否定传统文化，实际主要反对封建礼教
    - 把新文化运动与五四运动混为一件事，说成同一场运动
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:新时代十年的伟大变革
  type: Concept
  subject: 历史
  title: 新时代十年的伟大变革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为新时代十年从2015年算起，正确应为2012年十八大至2022年二十大。
    - 能指出并纠正这一错误：把中国特色社会主义进入新时代的时间误记为十八大，实际是十九大宣告。
  aliases:
    - 新时代十年
  category: 历史成就
  explanation: 中共十八大以来的十年，党和国家取得历史性成就、发生历史性变革，具有里程碑意义。
  misconceptions:
    - 误认为新时代十年从2015年算起，正确应为2012年十八大至2022年二十大。
    - 把中国特色社会主义进入新时代的时间误记为十八大，实际是十九大宣告。
    - 将“新时代十年”的成就与改革开放时期成就混同，不做区分。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:新时代好青年
  type: Concept
  subject: 历史
  title: 新时代好青年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新时代好青年就是学习好，不要求政治素质和社会责任。
    - 能指出并纠正这一错误：把“能吃苦”视为过时观念，认为当代青年无需艰苦奋斗。
  aliases: []
  category: 价值观念
  explanation: 有理想、敢担当、能吃苦、肯奋斗的青年，是全面建设社会主义现代化国家的生力军。
  misconceptions:
    - 认为新时代好青年就是学习好，不要求政治素质和社会责任。
    - 把“能吃苦”视为过时观念，认为当代青年无需艰苦奋斗。
    - 误以为“敢担当”只指见义勇为，不包含日常责任和岗位奉献。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:新时期军队建设总要求
  type: Concept
  subject: 历史
  title: 新时期军队建设总要求
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉“作风优良”，写成“政治合格、军事过硬、纪律严明、保障有力”
    - 能指出并纠正这一错误：把“政治合格”与“军事过硬”顺序颠倒，或错成“军事优秀”
  aliases: []
  category: 军事
  explanation: “政治合格、军事过硬、作风优良、纪律严明、保障有力”的总要求。
  misconceptions:
    - 漏掉“作风优良”，写成“政治合格、军事过硬、纪律严明、保障有力”
    - 把“政治合格”与“军事过硬”顺序颠倒，或错成“军事优秀”
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S3.md
- id: concept:历史:新民主主义革命
  type: Concept
  subject: 历史
  title: 新民主主义革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为新民主主义革命由资产阶级领导，实为无产阶级领导。
    - 能指出并纠正这一错误：误认为新民主主义革命时期从1921年开始，实际从1919年五四运动算起。
  aliases: []
  category: 历史概念
  explanation: 无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。从1919年五四运动到1949年中华人民共和国成立，被称为新民主主义革命时期。
  misconceptions:
    - 误认为新民主主义革命由资产阶级领导，实为无产阶级领导。
    - 误认为新民主主义革命时期从1921年开始，实际从1919年五四运动算起。
    - 误认为新民主主义革命只反帝反封建，漏掉反官僚资本主义。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S4.md
- id: concept:历史:新民主主义革命的胜利
  type: Concept
  subject: 历史
  title: 新民主主义革命的胜利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为新民主主义革命胜利后中国直接进入社会主义社会，忽视过渡时期
    - 能指出并纠正这一错误：认为新民主主义革命推翻了北洋军阀统治，实际推翻的是三座大山
  aliases:
    - 新民主主义革命胜利
  category: 历史事件
  explanation: 中国共产党领导中国人民经过长期斗争，推翻了帝国主义、封建主义和官僚资本主义的统治，实现了民族独立和人民解放，结束了半殖民地半封建社会的历史。
  misconceptions:
    - 误以为新民主主义革命胜利后中国直接进入社会主义社会，忽视过渡时期
    - 认为新民主主义革命推翻了北洋军阀统治，实际推翻的是三座大山
    - 将新民主主义革命的胜利归功于民族资产阶级领导，史实错误
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:新民主主义革命胜利的意义
  type: Concept
  subject: 历史
  title: 新民主主义革命胜利的意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新民主主义革命胜利后中国直接进入社会主义社会。
    - 能指出并纠正这一错误：把新中国成立当作社会主义制度建立的标志，忽略1956年三大改造。
  aliases: []
  category: 历史意义
  explanation: 新民主主义革命的胜利结束了中国半殖民地半封建社会的历史，实现了民族独立和人民解放，改变了中国社会的发展方向，为中华民族伟大复兴创造了根本社会条件。
  misconceptions:
    - 认为新民主主义革命胜利后中国直接进入社会主义社会。
    - 把新中国成立当作社会主义制度建立的标志，忽略1956年三大改造。
    - 只说结束半殖民地半封建社会，忽略民族独立和人民解放这一重要意义。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:新疆建省
  type: Concept
  subject: 历史
  title: 新疆建省
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为新疆建省在1878年收复新疆后立即实行，实际是1884年。
    - 能指出并纠正这一错误：错误认为‘故土新归’指新疆之前从未归属中国，实际指新收复的故土。
  aliases: []
  category: 历史事件
  explanation: 1884年，清政府根据左宗棠建议在新疆建立行省，取“故土新归”之意，加强了中央对新疆的管辖。
  misconceptions:
    - 误认为新疆建省在1878年收复新疆后立即实行，实际是1884年。
    - 错误认为‘故土新归’指新疆之前从未归属中国，实际指新收复的故土。
    - 误认为新疆建省是李鸿章建议，实际是左宗棠建议。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:新石器时代
  type: Concept
  subject: 历史
  title: 新石器时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新石器时代早于旧石器时代，实际旧石器时代在前，新石器时代在后。
    - 能指出并纠正这一错误：认为新石器时代主要使用打制石器，实际以磨制石器为主要工具。
  aliases: []
  category: 历史分期
  explanation: 主要使用磨制石器的时代称为“新石器时代”。
  misconceptions:
    - 认为新石器时代早于旧石器时代，实际旧石器时代在前，新石器时代在后。
    - 认为新石器时代主要使用打制石器，实际以磨制石器为主要工具。
    - 认为新石器时代已经使用青铜农具，实际那时主要用石器，青铜时代在后。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:新经济政策
  type: Concept
  subject: 历史
  title: 新经济政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新经济政策是恢复资本主义，实际是在公有制主导下允许部分资本主义。
    - 能指出并纠正这一错误：把新经济政策当成战时共产主义政策的延续，实际两者内容截然相反。
  aliases: []
  category: 历史政策
  explanation: 1921年列宁实施的政策，以粮食税代替余粮收集制，允许自由贸易和私人经营，恢复经济。
  misconceptions:
    - 认为新经济政策是恢复资本主义，实际是在公有制主导下允许部分资本主义。
    - 把新经济政策当成战时共产主义政策的延续，实际两者内容截然相反。
    - 以为新经济政策由斯大林提出，实际是列宁在1921年推行。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:新罗与唐朝的交往
  type: Concept
  subject: 历史
  title: 新罗与唐朝的交往
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把新罗与日本混为一体，新罗是朝鲜半岛国家。
    - 能指出并纠正这一错误：误认为崔致远是日本人，实为新罗留学生。
  aliases: []
  category: 历史事件
  explanation: 新罗派遣使臣和留学生学习唐朝文化，采用唐制，双方贸易活跃，崔致远为代表人物。
  misconceptions:
    - 把新罗与日本混为一体，新罗是朝鲜半岛国家。
    - 误认为崔致远是日本人，实为新罗留学生。
    - 以偏概全说新罗全盘照搬唐制，实际是有选择地采用。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:新航路开辟
  type: Concept
  subject: 历史
  title: 新航路开辟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为麦哲伦船队是葡萄牙资助，实际是西班牙资助完成环球航行
    - 能指出并纠正这一错误：把迪亚士到达好望角与达伽马到达印度张冠李戴
  aliases:
    - 新航路的开辟
    - 地理大发现
  category: 历史事件
  explanation: 15世纪末16世纪初，欧洲国家探寻通往东方的新航路，打破世界隔绝状态，促进资本主义发展。
  misconceptions:
    - 误以为麦哲伦船队是葡萄牙资助，实际是西班牙资助完成环球航行
    - 把迪亚士到达好望角与达伽马到达印度张冠李戴
    - 认为新航路开辟后世界市场就形成了，实际只是开始连为一体
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:新航路开辟的影响
  type: Concept
  subject: 历史
  title: 新航路开辟的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只强调促进资本主义发展，忽视给殖民地人民带来灾难
    - 能指出并纠正这一错误：把新航路开辟说成世界市场最终形成，实际是后续殖民扩张才逐步形成
  aliases: []
  category: 历史影响
  explanation: 新航路开辟后，世界开始连为一个整体，促进了资本主义发展，加强了各洲联系。
  misconceptions:
    - 只强调促进资本主义发展，忽视给殖民地人民带来灾难
    - 把新航路开辟说成世界市场最终形成，实际是后续殖民扩张才逐步形成
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:方田均税法
  type: Concept
  subject: 历史
  title: 方田均税法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为方田均税法仅核实土地不征税，实际核实后按等级征税。
    - 能指出并纠正这一错误：将方田均税法与北魏均田制混淆，不是一回事。
  aliases: []
  category: 变法措施
  explanation: 核实土地，按土地多少好坏征税，防止隐瞒土地。
  misconceptions:
    - 认为方田均税法仅核实土地不征税，实际核实后按等级征税。
    - 将方田均税法与北魏均田制混淆，不是一回事。
    - 以为此法按人口征税，实际按土地多寡好坏征税。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:旅顺大屠杀
  type: Concept
  subject: 历史
  title: 旅顺大屠杀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为旅顺大屠杀发生于甲午战后，实际是1894年
    - 能指出并纠正这一错误：将旅顺大屠杀与南京大屠杀的时间、地点混淆
  aliases: []
  category: 历史事件
  explanation: 1894年日军攻占旅顺后，进行了四天大屠杀，杀害两万多中国人，是日本侵华的暴行。
  misconceptions:
    - 误以为旅顺大屠杀发生于甲午战后，实际是1894年
    - 将旅顺大屠杀与南京大屠杀的时间、地点混淆
    - 颠倒因果，说成清军对日本居民进行屠杀
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S3.md
- id: concept:历史:无为而治
  type: Concept
  subject: 历史
  title: 无为而治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘无为而治’理解为什么都不做，整天不作为
    - 能指出并纠正这一错误：认为‘无为而治’是儒家或法家的政治主张
  aliases: []
  category: 思想主张
  explanation: 老子的政治主张，强调顺应自然，不妄为。
  misconceptions:
    - 把‘无为而治’理解为什么都不做，整天不作为
    - 认为‘无为而治’是儒家或法家的政治主张
    - 把‘无为而治’说成是孟子提出的，与‘仁政’混在一起
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:无敌舰队
  type: Concept
  subject: 历史
  title: 无敌舰队
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为无敌舰队是英国舰队，实际是西班牙海军
    - 能指出并纠正这一错误：把无敌舰队被击败时间说成1580年，实际是1588年被英国海军击败
  aliases:
    - 西班牙无敌舰队
  category: 军事力量
  explanation: 16世纪西班牙的庞大海军舰队，自称“无敌舰队”，1588年被英国海军击败。
  misconceptions:
    - 误以为无敌舰队是英国舰队，实际是西班牙海军
    - 把无敌舰队被击败时间说成1580年，实际是1588年被英国海军击败
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:日不落帝国
  type: Concept
  subject: 历史
  title: 日不落帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为日不落帝国是西班牙，实际是英国在18世纪自诩
    - 能指出并纠正这一错误：把日不落帝国出现时间提前到16世纪，实际是18世纪英国成为殖民大国
  aliases: []
  category: 历史称号
  explanation: 指英国在18世纪成为拥有广大殖民地的帝国，自诩“日不落帝国”。
  misconceptions:
    - 认为日不落帝国是西班牙，实际是英国在18世纪自诩
    - 把日不落帝国出现时间提前到16世纪，实际是18世纪英国成为殖民大国
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:日内瓦会议
  type: Concept
  subject: 历史
  title: 日内瓦会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新中国首次以五大国身份参加的国际会议是万隆会议，时间先后颠倒。
    - 能指出并纠正这一错误：误把日内瓦会议的时间记为1955年，与万隆会议混为一谈。
  aliases: []
  category: 历史事件
  explanation: 1954年召开，新中国首次以五大国身份参加，提高了国际地位。
  misconceptions:
    - 认为新中国首次以五大国身份参加的国际会议是万隆会议，时间先后颠倒。
    - 误把日内瓦会议的时间记为1955年，与万隆会议混为一谈。
    - 混淆了日内瓦会议讨论印度支那问题与万隆会议讨论亚非团结问题。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:日本天皇制度
  type: Concept
  subject: 历史
  title: 日本天皇制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为天皇制度始于明治维新，实际大化改新时已确立。
    - 能指出并纠正这一错误：误认为幕府时期天皇掌握实权，实际大权旁落。
  aliases: []
  category: 政治制度
  explanation: 日本君主制度，大化改新后确立，幕府时期大权旁落，明治维新后确立近代君主立宪制，二战后成为象征。
  misconceptions:
    - 误认为天皇制度始于明治维新，实际大化改新时已确立。
    - 误认为幕府时期天皇掌握实权，实际大权旁落。
    - 误认为二战后天皇仍是国家最高领导人，实际只是象征。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:日本宣布无条件投降
  type: Concept
  subject: 历史
  title: 日本宣布无条件投降
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为日本于1945年9月2日宣布无条件投降
    - 能指出并纠正这一错误：把抗战胜利标志说成是日本正式签署投降书
  aliases: []
  category: 历史事件
  explanation: 1945年8月15日，日本宣布无条件投降，中国抗日战争取得胜利。
  misconceptions:
    - 误认为日本于1945年9月2日宣布无条件投降
    - 把抗战胜利标志说成是日本正式签署投降书
    - 认为日本宣布投降发生在原子弹爆炸之前
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:日本崛起
  type: Concept
  subject: 历史
  title: 日本崛起
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为日本崛起完全靠自己，忽略美国扶持和朝鲜战争特需。
    - 能指出并纠正这一错误：把日本成为资本主义第二经济大国的时间记成1970年代。
  aliases: []
  category: 历史事件
  explanation: 二战后日本在美国扶持下经济迅速发展，1968年成为资本主义世界第二经济大国。
  misconceptions:
    - 误认为日本崛起完全靠自己，忽略美国扶持和朝鲜战争特需。
    - 把日本成为资本主义第二经济大国的时间记成1970年代。
    - 误以为日本经济在二战后立即超越美国，实际只是第二。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:日本投降
  type: Concept
  subject: 历史
  title: 日本投降
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把8月15日天皇宣布投降当作正式签署投降书的时间，混淆先后顺序
    - 能指出并纠正这一错误：误以为9月2日是日本宣布无条件投降的日子，实际是签署投降书
  aliases: []
  category: 历史事件
  explanation: 1945年8月15日日本天皇宣布无条件投降，9月2日日本政府正式签署投降书，中国抗日战争取得最后胜利。
  misconceptions:
    - 把8月15日天皇宣布投降当作正式签署投降书的时间，混淆先后顺序
    - 误以为9月2日是日本宣布无条件投降的日子，实际是签署投降书
    - 认为日本投降后抗日战争立即结束，忽视9月2日正式受降仪式
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:日食记录
  type: Concept
  subject: 历史
  title: 日食记录
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《诗经》中公元前776年的日食记录说成是《春秋》里哈雷彗星的出现记录
    - 能指出并纠正这一错误：认为《诗经》记录的是公元前613年的日食，从而与哈雷彗星混淆
  aliases: []
  category: 天文
  explanation: 《诗经》记载了公元前776年日食，是传世文献中我国历史上第一次有确切日期的日食记录。
  misconceptions:
    - 误将《诗经》中公元前776年的日食记录说成是《春秋》里哈雷彗星的出现记录
    - 认为《诗经》记录的是公元前613年的日食，从而与哈雷彗星混淆
    - 说公元前776年的日食记录是用甲骨文刻在龟甲上的
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:旧民主主义革命
  type: Concept
  subject: 历史
  title: 旧民主主义革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为旧民主主义革命的领导阶级是农民阶级，实为资产阶级。
    - 能指出并纠正这一错误：误认为太平天国运动属于旧民主主义革命，实际它是农民运动。
  aliases: []
  category: 历史概念
  explanation: 从1840年鸦片战争爆发到1919年五四运动，由资产阶级领导的民主革命，如辛亥革命等。
  misconceptions:
    - 误认为旧民主主义革命的领导阶级是农民阶级，实为资产阶级。
    - 误认为太平天国运动属于旧民主主义革命，实际它是农民运动。
    - 误认为旧民主主义革命也是无产阶级领导，与新民主主义革命只是时间不同。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S4.md
- id: concept:历史:旧石器时代
  type: Concept
  subject: 历史
  title: 旧石器时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为旧石器时代使用磨制石器，实际是打制石器。
    - 能指出并纠正这一错误：认为旧石器时代出现了青铜器，实际金属工具出现之前是石器时代。
  aliases: []
  category: 历史分期
  explanation: 在金属工具出现之前，人类以石器为主要生产工具的时代称为“石器时代”。其中，主要使用打制石器的时代称为“旧石器时代”。
  misconceptions:
    - 认为旧石器时代使用磨制石器，实际是打制石器。
    - 认为旧石器时代出现了青铜器，实际金属工具出现之前是石器时代。
    - 把旧石器时代放在新石器时代之后，实际时间顺序应相反。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:早期国家
  type: Concept
  subject: 历史
  title: 早期国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把早期国家等同于部落联盟，没看到王和军队等强制机关
    - 能指出并纠正这一错误：误以为早期国家只有对内统治，没有对外战争功能
  aliases: []
  category: 历史概念
  explanation: 以王为首的统治阶级对内统治、对外战争，形成的政治实体。私有制、阶级和国家的产生是进入文明社会的重要标志。
  misconceptions:
    - 把早期国家等同于部落联盟，没看到王和军队等强制机关
    - 误以为早期国家只有对内统治，没有对外战争功能
    - 认为早期国家出现于夏朝，忽略更早的良渚等遗址
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:早期殖民掠夺
  type: Concept
  subject: 历史
  title: 早期殖民掠夺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为最早进行殖民掠夺的是英国，实际是葡萄牙和西班牙
    - 能指出并纠正这一错误：把殖民掠夺等同于资本原始积累，忽视对殖民地的残酷压榨
  aliases:
    - 殖民扩张
  category: 历史概念
  explanation: 新航路开辟后，欧洲国家（如葡萄牙、西班牙、英国）对亚洲、非洲、美洲进行殖民扩张和掠夺。
  misconceptions:
    - 认为最早进行殖民掠夺的是英国，实际是葡萄牙和西班牙
    - 把殖民掠夺等同于资本原始积累，忽视对殖民地的残酷压榨
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:早期资产阶级
  type: Concept
  subject: 历史
  title: 早期资产阶级
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将早期资产阶级等同于现代工业资产阶级
    - 能指出并纠正这一错误：误以为早期资产阶级主要由农民分化而来
  aliases: []
  category: 历史概念
  explanation: 由富裕的大手工业作坊主、商人和银行家等组成，是市民阶层分化出的新兴社会力量。
  misconceptions:
    - 将早期资产阶级等同于现代工业资产阶级
    - 误以为早期资产阶级主要由农民分化而来
    - 认为所有市民都是资产阶级，忽略仅富裕市民才构成
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:时事溯源
  type: Concept
  subject: 历史
  title: 时事溯源
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把时事与历史简单类比，忽略时代背景差异，导致得出错误结论
    - 能指出并纠正这一错误：认为历史会重演，时事必然完全重复过去，忽视条件变化
  aliases: []
  category: 学习方法
  explanation: 从时事追溯历史渊源，理解历史与现实的联系，避免重蹈覆辙。
  misconceptions:
    - 把时事与历史简单类比，忽略时代背景差异，导致得出错误结论
    - 认为历史会重演，时事必然完全重复过去，忽视条件变化
    - 只找相似点，不分析历史与现实的本质区别，以偏概全
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S4.md
- id: concept:历史:昆曲
  type: Concept
  subject: 历史
  title: 昆曲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为昆曲发源于北京或安徽，而非苏州昆山一带。
    - 能指出并纠正这一错误：将《牡丹亭》的作者误记为汤显祖之外的人，如关汉卿。
  aliases:
    - 昆山腔
  category: 历史
  explanation: 流行于苏州昆山一带的戏曲剧种，明朝万历末年改良后成为全国性剧种，代表作有《牡丹亭》《长生殿》《桃花扇》。
  misconceptions:
    - 误以为昆曲发源于北京或安徽，而非苏州昆山一带。
    - 将《牡丹亭》的作者误记为汤显祖之外的人，如关汉卿。
    - 认为昆曲在清朝才成为全国性剧种，忽略了明朝万历末年的改良。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:明朝灭亡
  type: Concept
  subject: 历史
  title: 明朝灭亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为明朝是被清军直接灭亡的，实际是李自成攻入北京。
    - 能指出并纠正这一错误：认为崇祯帝南逃或被杀，实际是在北京煤山自缢。
  aliases:
    - 明亡
  category: 历史事件
  explanation: 1644年，李自成攻入北京，崇祯帝自缢，明朝灭亡。
  misconceptions:
    - 认为明朝是被清军直接灭亡的，实际是李自成攻入北京。
    - 认为崇祯帝南逃或被杀，实际是在北京煤山自缢。
    - 混淆明朝灭亡时间，认为1645年才灭亡，实际是1644年。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:明朝的对外关系
  type: Concept
  subject: 历史
  title: 明朝的对外关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把郑和下西洋时间误认为在戚继光抗倭之后，实际郑和远航在15世纪初，抗倭在16世纪中叶。
    - 能指出并纠正这一错误：误以为郑和下西洋目的是联合沿途国家抗击倭寇，实际是为宣扬国威和寻找建文帝。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 把郑和下西洋时间误认为在戚继光抗倭之后，实际郑和远航在15世纪初，抗倭在16世纪中叶。
    - 误以为郑和下西洋目的是联合沿途国家抗击倭寇，实际是为宣扬国威和寻找建文帝。
    - 将葡萄牙攫取澳门居住权说成武力强占，实际是贿赂广东地方官获准居住。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:明朝的建立
  type: Concept
  subject: 历史
  title: 明朝的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为明朝建立时间以攻占元大都为准，实际1368年朱元璋先称帝建明，同年攻大都。
    - 能指出并纠正这一错误：将朱元璋和朱棣混淆，认为朱棣是开国皇帝，实际朱元璋是明太祖。
  aliases:
    - 明太祖建立明朝
  category: 历史事件
  explanation: 1368年朱元璋称帝建立明朝，定都应天府，随后攻占元大都，结束元朝统治。
  misconceptions:
    - 误以为明朝建立时间以攻占元大都为准，实际1368年朱元璋先称帝建明，同年攻大都。
    - 将朱元璋和朱棣混淆，认为朱棣是开国皇帝，实际朱元璋是明太祖。
    - 误以为明朝初都城是北京，实际是应天（南京），后明成祖迁都北京。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:明朝的统治
  type: Concept
  subject: 历史
  title: 明朝的统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为内阁是明太祖朱元璋设立，实际是明成祖朱棣在位时形成。
    - 能指出并纠正这一错误：误以为东厂也由朱元璋设立，实际东厂是明成祖朱棣所设。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 误认为内阁是明太祖朱元璋设立，实际是明成祖朱棣在位时形成。
    - 误以为东厂也由朱元璋设立，实际东厂是明成祖朱棣所设。
    - 认为明朝废除丞相后又恢复，实际废丞相后不再设立，内阁并非丞相。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:明治维新
  type: Concept
  subject: 历史
  title: 明治维新
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为明治维新始于1853年黑船事件，而非1868年明治政府改革。
    - 能指出并纠正这一错误：误以为维新是德川幕府推行的改革，实际是倒幕派掌权后开始。
  aliases: []
  category: 历史事件
  explanation: 1868年明治政府开始实行的一系列改革，以西方为榜样，全面改造日本，使日本走上资本主义道路。
  misconceptions:
    - 认为明治维新始于1853年黑船事件，而非1868年明治政府改革。
    - 误以为维新是德川幕府推行的改革，实际是倒幕派掌权后开始。
    - 认为只学西方技术，不学制度，忽略废藩置县和宪法。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:明清时期人口的增长
  type: Concept
  subject: 历史
  title: 明清时期人口的增长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人口增长只因为社会稳定，忽略赋税改革的影响。
    - 能指出并纠正这一错误：将乾隆时期人口记成2亿，实际达到3亿左右。
  aliases: []
  category: 社会
  explanation: 清朝前期人口增长迅速，从康熙1.5亿到乾隆3亿，与赋税改革和社会稳定有关。
  misconceptions:
    - 误认为人口增长只因为社会稳定，忽略赋税改革的影响。
    - 将乾隆时期人口记成2亿，实际达到3亿左右。
    - 认为人口增长停滞，与明清社会经济繁荣矛盾。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:明清时期农业的发展
  type: Concept
  subject: 历史
  title: 明清时期农业的发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为玉米、甘薯在唐末或宋代已传入中国，实际是明朝引进美洲作物。
    - 能指出并纠正这一错误：忽略经济作物种植扩大，只强调粮食产量提高。
  aliases: []
  category: 经济
  explanation: 明朝引进美洲作物，清朝改进技术，粮食产量提高，经济作物种植扩大，农产品商品化程度加深。
  misconceptions:
    - 误认为玉米、甘薯在唐末或宋代已传入中国，实际是明朝引进美洲作物。
    - 忽略经济作物种植扩大，只强调粮食产量提高。
    - 误认为农业商品化程度下降，实际农产品市场化加深。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:明清时期商业的发展
  type: Concept
  subject: 历史
  title: 明清时期商业的发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为全国性商业网络在清朝才出现，忽略明代已形成。
    - 能指出并纠正这一错误：将白银流入视为商业发展的结果，实际是推动商业繁荣的原因。
  aliases: []
  category: 经济
  explanation: 商品贸易兴盛，形成全国性商业网络，白银流入，出现商帮如晋商、徽商。
  misconceptions:
    - 误以为全国性商业网络在清朝才出现，忽略明代已形成。
    - 将白银流入视为商业发展的结果，实际是推动商业繁荣的原因。
    - 误认为商帮出现是商业发展的唯一表现，忽略市镇经济。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:明清时期手工业的发展
  type: Concept
  subject: 历史
  title: 明清时期手工业的发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把景德镇当作棉纺织中心，实际是制瓷中心。
    - 能指出并纠正这一错误：认为手工工场在明初已大规模出现，实际清朝才更显著。
  aliases: []
  category: 经济
  explanation: 明朝棉纺织业推广，出现松江、苏州、景德镇等中心；清朝出现手工工场，规模较大。
  misconceptions:
    - 误把景德镇当作棉纺织中心，实际是制瓷中心。
    - 认为手工工场在明初已大规模出现，实际清朝才更显著。
    - 混淆棉纺织业与丝织业中心，将苏州说成棉纺织中心。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:明长城
  type: Concept
  subject: 历史
  title: 明长城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为明长城东起山海关，实际应是鸭绿江边。
    - 能指出并纠正这一错误：将明长城与秦始皇修筑的长城混淆，认为同一时期所建。
  aliases:
    - 长城
  category: 历史
  explanation: 明朝为防御北方蒙古族南扰而修筑的军事防御工程，东起鸭绿江边，西至嘉峪关，总长万余里，以城墙为主体，由关隘、城台、烽火台等组成，形成完整军事防御体系。
  misconceptions:
    - 误以为明长城东起山海关，实际应是鸭绿江边。
    - 将明长城与秦始皇修筑的长城混淆，认为同一时期所建。
    - 认为明长城是连续一道城墙，忽略了它由关隘、城台、烽火台等组成。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:春秋时期
  type: Concept
  subject: 历史
  title: 春秋时期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把春秋时期与战国时期时间混淆，认为春秋在前770-前221年。
    - 能指出并纠正这一错误：误以为春秋时期得名于《春秋》一书的作者孔子，而非因编年体史书体裁。
  aliases:
    - 春秋
  category: 历史时期
  explanation: 东周前期，一般指公元前770年至前476年，因孔子编订的编年体史书《春秋》而得名。
  misconceptions:
    - 把春秋时期与战国时期时间混淆，认为春秋在前770-前221年。
    - 误以为春秋时期得名于《春秋》一书的作者孔子，而非因编年体史书体裁。
    - 将春秋时期等同于东周，忽视东周还包括战国时期。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:春秋时期经济发展
  type: Concept
  subject: 历史
  title: 春秋时期经济发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为春秋时期经济全面超过战国，忽视战国时期经济发展更高水平。
    - 能指出并纠正这一错误：误以为铁制农具和牛耕在春秋初期即已广泛使用，实际是春秋后期出现。
  aliases: []
  category: 经济现象
  explanation: 农业、手工业、商业都有发展，手工业分工细致，商业活跃，金属货币广泛使用。
  misconceptions:
    - 认为春秋时期经济全面超过战国，忽视战国时期经济发展更高水平。
    - 误以为铁制农具和牛耕在春秋初期即已广泛使用，实际是春秋后期出现。
    - 把金属货币广泛使用当作战国时期特征，忽视春秋晚期已出现金属货币。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:曲辕犁
  type: Concept
  subject: 历史
  title: 曲辕犁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把曲辕犁当作灌溉工具，实际是耕作工具
    - 能指出并纠正这一错误：误以为曲辕犁是宋代才发明的
  aliases: []
  category: 生产工具
  explanation: 唐朝发明的耕作工具，由11个部件构成，设计精妙，轻便灵巧，操作时可自如控制入土深浅，回转省力，适于精耕细作，提高了耕作效率和质量。
  misconceptions:
    - 把曲辕犁当作灌溉工具，实际是耕作工具
    - 误以为曲辕犁是宋代才发明的
    - 认为曲辕犁不能控制深浅，不适合精耕细作
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:曼哈顿计划
  type: Concept
  subject: 历史
  title: 曼哈顿计划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为曼哈顿计划是苏联研究原子弹的计划
    - 能指出并纠正这一错误：把原子弹投放地点误认为东京和柏林
  aliases: []
  category: 历史事件
  explanation: 美国研制原子弹的秘密计划，导致原子弹在广岛和长崎投放。
  misconceptions:
