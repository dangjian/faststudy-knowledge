    - 认为自由贸易试验区就是经济特区，混淆两者的设立目的和功能定位。
    - 把自贸区数量记错，如写成21个或23个，截至2024年共22个。
    - 误认为自贸区只做货物贸易，忽略其在制度创新和开放试验方面的作用。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:臭氧层破坏
