  misconceptions:
    - 误以为‘中国特色社会主义进入新时代’是十八大提出的，实际是十九大。
    - 把‘全面建成小康社会’写成‘全面建设小康社会’，少了一个‘成’字。
    - 误以为十八大提出‘全面深化改革’总目标，实际是十八届三中全会。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:中共十八届四中全会
  type: Concept
  subject: 历史
  title: 中共十八届四中全会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把十八届四中全会主题记成‘全面深化改革’或‘全面从严治党’。
