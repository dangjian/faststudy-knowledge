  subject: 历史
  title: 活字印刷术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为活字印刷术在唐代已出现，实际是北宋毕昇发明
    - 能指出并纠正这一错误：误认为活字印刷术出现后雕版印刷立即被淘汰，实际两者并用
