  subject: 历史
  title: 查理曼帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为843年分裂后形成英法德，实际是法兰西、德意志、意大利雏形
    - 能指出并纠正这一错误：把克洛维与查理曼的事迹混淆，如以为克洛维加冕称帝
  aliases:
