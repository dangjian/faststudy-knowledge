    - 认为北庭都元帅府只管理军事事务
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:北斗三号全球卫星导航系统
  type: Concept
  subject: 历史
  title: 北斗三号全球卫星导航系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错把北斗三号当成2020年才开始研制，忽视前期北斗一号、二号基础。
    - 能指出并纠正这一错误：将北斗直接称为“中国的GPS”，忽略其自主性和短报文特色。
  aliases:
    - 北斗系统
  category: 科技成就
  explanation: 2020年正式开通，是中国自主建设的全球卫星导航系统。
  misconceptions:
    - 错把北斗三号当成2020年才开始研制，忽视前期北斗一号、二号基础。
    - 将北斗直接称为“中国的GPS”，忽略其自主性和短报文特色。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:北方各族的内迁
  type: Concept
  subject: 历史
  title: 北方各族的内迁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为内迁发生在西晋灭亡之后，实际在魏晋时期已开始。
    - 能指出并纠正这一错误：把内迁少数民族说成只有匈奴和鲜卑，漏掉羯、氐、羌。
  aliases:
    - 五胡内迁
    - 北方各族内迁
  category: 历史概念
  explanation: 魏晋时期，匈奴、鲜卑、羯、氐、羌等少数民族不断进入中原，与西晋灭亡有密切关系，并带来深远影响。
  misconceptions:
    - 认为内迁发生在西晋灭亡之后，实际在魏晋时期已开始。
    - 把内迁少数民族说成只有匈奴和鲜卑，漏掉羯、氐、羌。
    - 误认为内迁是西晋主动引进以对抗蜀汉，实际与西晋灭亡相关。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:北方地区的民族交融
  type: Concept
  subject: 历史
  title: 北方地区的民族交融
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为民族交融只是少数民族单方面汉化，忽略汉族也吸收少数民族习俗，如穿胡服、吃胡食。
    - 能指出并纠正这一错误：认为魏晋以来民族隔阂完全消解，实际仍有矛盾和冲突，如北魏后期六镇起义。
  aliases:
    - 民族大交融
  category: 历史现象
  explanation: 魏晋以来，内迁各族与汉人错居杂处，经济文化交往密切，民族隔阂趋于消解，出现大交融。
  misconceptions:
    - 认为民族交融只是少数民族单方面汉化，忽略汉族也吸收少数民族习俗，如穿胡服、吃胡食。
    - 认为魏晋以来民族隔阂完全消解，实际仍有矛盾和冲突，如北魏后期六镇起义。
    - 把民族交融简单等同于战争征服，忽视各族错居杂处和经济文化往来。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S4.md
- id: concept:历史:北朝政权更替
  type: Concept
  subject: 历史
  title: 北朝政权更替
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为北魏先分裂为东魏，后分裂为西魏，实际二者是同时并存的两个政权。
    - 能指出并纠正这一错误：误以为北齐和北周直接取代北魏，实际北齐取代东魏、北周取代西魏。
  aliases: []
  category: 历史概念
  explanation: 北魏分裂为东魏和西魏，后分别被北齐和北周取代，北周灭北齐，北方重归统一。
  misconceptions:
    - 误以为北魏先分裂为东魏，后分裂为西魏，实际二者是同时并存的两个政权。
    - 误以为北齐和北周直接取代北魏，实际北齐取代东魏、北周取代西魏。
    - 误以为北周灭掉西魏统一北方，实际北周灭掉北齐才统一北方。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S4.md
- id: concept:历史:北洋军阀
  type: Concept
  subject: 历史
  title: 北洋军阀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北洋军阀只存在于清末，实际其统治主要在民国初年，如袁世凯1912年当总统。
    - 能指出并纠正这一错误：把北洋军阀等同于袁世凯个人，忽略袁死后分裂为直、皖、奉等派系。
  aliases:
    - 北洋军阀集团
  category: 历史概念
  explanation: 以袁世凯为首的军事政治集团，清末新政期间形成，后控制北洋政府，导致军阀割据。
  misconceptions:
    - 认为北洋军阀只存在于清末，实际其统治主要在民国初年，如袁世凯1912年当总统。
    - 把北洋军阀等同于袁世凯个人，忽略袁死后分裂为直、皖、奉等派系。
    - 误将北洋军阀视为革命力量，实际其镇压革命，如刺杀宋教仁。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S2.md
- id: concept:历史:北约
  type: Concept
  subject: 历史
  title: 北约
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北约是经济合作组织，实际是军事政治集团
    - 能指出并纠正这一错误：认为北约成立于1955年，实际是1949年
  aliases:
    - 北大西洋公约组织
  category: 国际组织
  explanation: 1949年成立的北大西洋公约组织，以美国为首的军事政治集团。
  misconceptions:
    - 误认为北约是经济合作组织，实际是军事政治集团
    - 认为北约成立于1955年，实际是1949年
    - 误认为北约是为了对抗华约而成立，实际上北约成立在先，华约是后来应对北约
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:北魏孝文帝改革
  type: Concept
  subject: 历史
  title: 北魏孝文帝改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为孝文帝迁都长安，实际是迁都洛阳。
    - 能指出并纠正这一错误：误以为孝文帝改汉姓是让汉族改姓鲜卑姓，实际是鲜卑族改姓汉姓。
  aliases:
    - 孝文帝改革
  category: 历史事件
  explanation: 北魏孝文帝迁都洛阳，推行汉化措施，包括使用汉语、改汉姓、通婚等，促进民族交融。
  misconceptions:
    - 误以为孝文帝迁都长安，实际是迁都洛阳。
    - 误以为孝文帝改汉姓是让汉族改姓鲜卑姓，实际是鲜卑族改姓汉姓。
    - 认为孝文帝改革后鲜卑族完全汉化，忽略其仍保留尚武等传统。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S4.md
- id: concept:历史:区域发展战略
  type: Concept
  subject: 历史
  title: 区域发展战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为粤港澳大湾区只包括广东和香港，遗漏澳门。
    - 能指出并纠正这一错误：把长江经济带与长三角城市群混为一谈，概念等同。
  aliases: []
  category: 经济政策
  explanation: 包括京津冀协同发展、长江经济带发展、粤港澳大湾区建设等重大战略。
  misconceptions:
    - 误认为粤港澳大湾区只包括广东和香港，遗漏澳门。
    - 把长江经济带与长三角城市群混为一谈，概念等同。
    - 以为区域发展战略是改革开放初期就提出的，而非新时代。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:十二气历
  type: Concept
  subject: 历史
  title: 十二气历
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为十二气历按月亮圆缺定月份，实际以节气定月份
    - 能指出并纠正这一错误：把十二气历与《授时历》混淆，误以为都是郭守敬所创
  aliases: []
  category: 科技成就
  explanation: 北宋沈括创制的历法，以节气定月份，有利于农事安排。
  misconceptions:
    - 误以为十二气历按月亮圆缺定月份，实际以节气定月份
    - 把十二气历与《授时历》混淆，误以为都是郭守敬所创
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:十六国
  type: Concept
  subject: 历史
  title: 十六国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为十六国都是少数民族建立，忽略前凉、西凉等汉人政权。
    - 能指出并纠正这一错误：误以为十六国是16个政权同时并存，实际是先后更迭。
  aliases: []
  category: 历史概念
  explanation: 4世纪初到5世纪前期，北方各族统治者先后建立的15个主要政权，连同西南地区的成汉，总称十六国。
  misconceptions:
    - 误以为十六国都是少数民族建立，忽略前凉、西凉等汉人政权。
    - 误以为十六国是16个政权同时并存，实际是先后更迭。
    - 误以为成汉在西南所以不属于十六国，实际十六国就包括成汉。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S4.md
- id: concept:历史:十月革命
  type: Concept
  subject: 历史
  title: 十月革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为十月革命推翻的是沙皇，实际是临时政府
    - 能指出并纠正这一错误：认为十月革命发生在公历10月，实际是11月
  aliases:
    - 俄国十月革命
  category: 历史事件
  explanation: 1917年11月俄国布尔什维克党领导的武装起义，建立世界上第一个无产阶级专政国家。
  misconceptions:
    - 误以为十月革命推翻的是沙皇，实际是临时政府
    - 认为十月革命发生在公历10月，实际是11月
    - 把十月革命领导者说成孟什维克
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:半地穴式房屋
  type: Concept
  subject: 历史
  title: 半地穴式房屋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为半地穴式房屋是河姆渡人居住的，实际河姆渡人住干栏式房屋
    - 能指出并纠正这一错误：觉得半地穴式房屋只为了防潮湿，实际主要适应寒冷干燥气候
  aliases: []
  category: 建筑形式
  explanation: 半坡人居住的房屋，部分深入地下，有灶坑，适应北方干燥寒冷气候。
  misconceptions:
    - 认为半地穴式房屋是河姆渡人居住的，实际河姆渡人住干栏式房屋
    - 觉得半地穴式房屋只为了防潮湿，实际主要适应寒冷干燥气候
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:半坡遗址
  type: Concept
  subject: 历史
  title: 半坡遗址
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把半坡遗址说成在浙江余姚，实际位于陕西西安
    - 能指出并纠正这一错误：认为半坡人种植水稻，实际种植粟和黍
  aliases: []
  category: 考古遗址
  explanation: 位于陕西西安，距今约6000年，是仰韶文化的重要遗址，半坡人种植粟、黍，居住在半地穴式房屋。
  misconceptions:
    - 把半坡遗址说成在浙江余姚，实际位于陕西西安
    - 认为半坡人种植水稻，实际种植粟和黍
    - 将半坡遗址归入河姆渡文化，实际属于仰韶文化
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:半殖民地化程度进一步加深
  type: Concept
  subject: 历史
  title: 半殖民地化程度进一步加深
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为半殖民地化是从第二次鸦片战争开始而非进一步加深。
    - 能指出并纠正这一错误：将半殖民地化与半封建化混为一谈。
  aliases:
    - 半殖民地化
  category: 历史概念
  explanation: 第二次鸦片战争后，中国丧失更多主权，列强侵略势力深入内地，半殖民地化程度加深。
  misconceptions:
    - 误认为半殖民地化是从第二次鸦片战争开始而非进一步加深。
    - 将半殖民地化与半封建化混为一谈。
    - 误以为第二次鸦片战争后中国已完全沦为半殖民地半封建社会。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:半殖民地半封建社会
  type: Concept
  subject: 历史
  title: 半殖民地半封建社会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：望文生义认为半殖民地就是一半领土沦为殖民地，半封建就是一半是封建社会
    - 能指出并纠正这一错误：认为半殖民地半封建社会是同时存在独立的殖民地经济和完整的封建经济
  aliases: []
  category: 历史概念
  explanation: 鸦片战争后中国社会性质的变化，指形式上独立但主权和领土完整遭到破坏，经济上受外国资本主义控制，封建经济逐步瓦解的社会形态。
  misconceptions:
    - 望文生义认为半殖民地就是一半领土沦为殖民地，半封建就是一半是封建社会
    - 认为半殖民地半封建社会是同时存在独立的殖民地经济和完整的封建经济
    - 以为鸦片战争后中国立即完全沦为半殖民地半封建社会，忽视了渐进过程
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:华东军区海军
  type: Concept
  subject: 历史
  title: 华东军区海军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为华东军区海军在新中国成立时建立，实际是1949年4月23日。
    - 能指出并纠正这一错误：把第一支海军部队说成北海舰队，实际是华东军区海军。
  aliases: []
  category: 历史事实
  explanation: 1949年4月建立，是中国人民解放军的第一支海军部队。
  misconceptions:
    - 误认为华东军区海军在新中国成立时建立，实际是1949年4月23日。
    - 把第一支海军部队说成北海舰队，实际是华东军区海军。
    - 以为华东军区海军诞生地在上海，实际是江苏泰州白马庙乡。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S3.md
- id: concept:历史:华佗与麻沸散、五禽戏
  type: Concept
  subject: 历史
  title: 华佗与麻沸散、五禽戏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将麻沸散发明者记为张仲景。
    - 能指出并纠正这一错误：认为华佗是西汉人，实际东汉末年。
  aliases: []
  category: 医学成就
  explanation: 东汉末年名医华佗发明“麻沸散”用于外科手术，并创编“五禽戏”帮助人们强身健体。
  misconceptions:
    - 误将麻沸散发明者记为张仲景。
    - 认为华佗是西汉人，实际东汉末年。
    - 误把五禽戏说成模仿五种野兽，遗漏鸡。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:华兴会
  type: Concept
  subject: 历史
  title: 华兴会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为华兴会成立于上海，实际是在长沙
    - 能指出并纠正这一错误：将华兴会会长记成蔡元培或孙中山，实际是黄兴
  aliases: []
  category: 历史事件
  explanation: 1904年2月在长沙成立的革命团体，黄兴为会长，后因起义计划败露，骨干流亡日本。
  misconceptions:
    - 误以为华兴会成立于上海，实际是在长沙
    - 将华兴会会长记成蔡元培或孙中山，实际是黄兴
    - 认为华兴会是在日本东京成立的革命团体
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:华北自治运动
  type: Concept
  subject: 历史
  title: 华北自治运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将华北自治运动与九一八事变混淆，认为前者是日军直接军事占领
    - 能指出并纠正这一错误：以为华北自治运动发生在九一八事变之前，实际在1935年
  aliases: []
  category: 历史事件
  explanation: 1935年下半年日本策动华北五省脱离中国版图的侵略活动，加剧了民族危机。
  misconceptions:
    - 将华北自治运动与九一八事变混淆，认为前者是日军直接军事占领
    - 以为华北自治运动发生在九一八事变之前，实际在1935年
    - 误认为华北自治运动是国民党主动推行的地方自治改革
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:华夏族
  type: Concept
  subject: 历史
  title: 华夏族
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把华夏族等同于现在的汉族，忽略其演化过程
    - 能指出并纠正这一错误：以为华夏族由单一炎帝部落直接形成，不包括黄帝部落
  aliases:
    - 诸夏
  category: 民族概念
  explanation: 炎黄部落联盟逐渐演化而来，是汉族的前身。
  misconceptions:
    - 把华夏族等同于现在的汉族，忽略其演化过程
    - 以为华夏族由单一炎帝部落直接形成，不包括黄帝部落
    - 误以为华夏族就是所有少数民族的共同祖先
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:华夫脱运动
  type: Concept
  subject: 历史
  title: 华夫脱运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为华夫脱运动是武装起义，实际是和平示威与谈判，非暴力斗争。
    - 能指出并纠正这一错误：认为华夫脱运动使埃及立即取得完全独立，实际英国仅有条件承认，仍保留特权。
  aliases: []
  category: 历史事件
  explanation: 扎格鲁尔领导的埃及独立运动，迫使英国有条件承认埃及独立。
  misconceptions:
    - 以为华夫脱运动是武装起义，实际是和平示威与谈判，非暴力斗争。
    - 认为华夫脱运动使埃及立即取得完全独立，实际英国仅有条件承认，仍保留特权。
    - 把扎格鲁尔误记为土耳其领导人，实际他是埃及民族运动领袖。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S5.md
- id: concept:历史:华沙条约组织
  type: Concept
  subject: 历史
  title: 华沙条约组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为它是以美国为首的军事同盟，实际是以苏联为首。
    - 能指出并纠正这一错误：认为它成立于1949年，与北约同时，实际成立于1955年。
  aliases:
    - Warsaw Treaty Organization
  category: 国际组织
  explanation: 华沙条约组织是冷战时期以苏联为首的社会主义国家建立的军事政治同盟。
  misconceptions:
    - 误认为它是以美国为首的军事同盟，实际是以苏联为首。
    - 认为它成立于1949年，与北约同时，实际成立于1955年。
    - 把它当作经济互助组织，实际是军事政治同盟。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S4.md
- id: concept:历史:华盛顿会议
  type: Concept
  subject: 历史
  title: 华盛顿会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为《九国公约》尊重中国主权，实际承认列强在华势力范围，加深半殖民地化。
    - 能指出并纠正这一错误：认为华盛顿会议只讨论欧洲问题，实际主要调整东亚和太平洋地区关系。
  aliases: []
  category: 历史事件
  explanation: 1921-1922年在美国倡议下召开，调整东亚和太平洋地区关系，签订《九国公约》。
  misconceptions:
    - 以为《九国公约》尊重中国主权，实际承认列强在华势力范围，加深半殖民地化。
    - 认为华盛顿会议只讨论欧洲问题，实际主要调整东亚和太平洋地区关系。
    - 混淆华盛顿会议与巴黎和会，以为二者是同一会议或议题相同。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:华约
  type: Concept
  subject: 历史
  title: 华约
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为华约成立于1949年，实际是1955年
    - 能指出并纠正这一错误：误认为华约是经济互助组织，实际是军事政治集团
  aliases:
    - 华沙条约组织
  category: 国际组织
  explanation: 1955年成立的华沙条约组织，以苏联为首的军事政治集团。
  misconceptions:
    - 认为华约成立于1949年，实际是1955年
    - 误认为华约是经济互助组织，实际是军事政治集团
    - 认为华约是应对北约的必然结果，但华约确实为对抗北约而建立，注意北约先成立
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:南书房
  type: Concept
  subject: 历史
  title: 南书房
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南书房是雍正设立的，实际是康熙为抑制满洲贵族而设。
    - 能指出并纠正这一错误：认为南书房是正式国家机构，实际是皇帝的内廷秘书班子。
  aliases: []
  category: 政治制度
  explanation: 康熙帝为抑制满洲贵族权力而设立，由翰林值班，草拟诏书，是皇帝处理政务的秘书班子。
  misconceptions:
    - 误认为南书房是雍正设立的，实际是康熙为抑制满洲贵族而设。
    - 认为南书房是正式国家机构，实际是皇帝的内廷秘书班子。
    - 将南书房与议政王大臣会议混为一谈，前者削弱贵族权力，后者限制皇权。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:南京国民政府
  type: Concept
  subject: 历史
  title: 南京国民政府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南京国民政府建立于1928年
    - 能指出并纠正这一错误：把南京国民政府性质说成代表民族资产阶级
  aliases:
    - 南京国民政府建立
  category: 历史事件
  explanation: 1927年4月，蒋介石在南京另立的大地主大资产阶级性质的国民政府。
  misconceptions:
    - 误认为南京国民政府建立于1928年
    - 把南京国民政府性质说成代表民族资产阶级
    - 与武汉国民政府混淆，认为南京政府是国共合作产物
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:南京大屠杀
  type: Concept
  subject: 历史
  title: 南京大屠杀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将南京大屠杀发生时间说成1937年12月13日之前，以为是日军攻陷前
    - 能指出并纠正这一错误：把屠杀持续时间记成三个月，实际为六周
  aliases:
    - 南京大屠杀事件
  category: 历史事件
  explanation: 1937年12月13日日军攻陷南京后，进行了持续六周的大屠杀，杀害中国军民30万人以上。
  misconceptions:
    - 误将南京大屠杀发生时间说成1937年12月13日之前，以为是日军攻陷前
    - 把屠杀持续时间记成三个月，实际为六周
    - 将遇难人数写成几万或三十万左右，实际是30万人以上
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:南京解放
  type: Concept
  subject: 历史
  title: 南京解放
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：南京解放时误记为1949年4月21日，实际是4月23日（渡江战役后）
    - 能指出并纠正这一错误：认为南京解放标志着解放战争完全结束，实际后续还有追歼残敌
  aliases:
    - 渡江战役
  category: 历史事件
  explanation: 1949年4月23日，人民解放军解放南京，宣告国民党反动统治覆灭。
  misconceptions:
    - 南京解放时误记为1949年4月21日，实际是4月23日（渡江战役后）
    - 认为南京解放标志着解放战争完全结束，实际后续还有追歼残敌
    - 将南京解放与北平和平解放的时间先后颠倒，北平在前南京在后
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:南北矛盾
  type: Concept
  subject: 历史
  title: 南北矛盾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南北矛盾的根源是奴隶制，实际根本原因是资本主义工商业与种植园经济的不同。
    - 能指出并纠正这一错误：误认为南方主张提高关税，实际南方希望降低关税。
  aliases:
    - 南北冲突
  category: 历史概念
  explanation: 美国独立后，北方资本主义工商业与南方种植园经济在关税、奴隶制等问题上的矛盾，最终导致内战爆发。
  misconceptions:
    - 误认为南北矛盾的根源是奴隶制，实际根本原因是资本主义工商业与种植园经济的不同。
    - 误认为南方主张提高关税，实际南方希望降低关税。
    - 误认为北方反对奴隶制出自人道主义，实际更主要是经济和政治利益。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:南宋建立
  type: Concept
  subject: 历史
  title: 南宋建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南宋都城是开封，实际以临安为都城。
    - 能指出并纠正这一错误：把赵构误认为北宋皇帝宋徽宗，实际是宋高宗。
  aliases: []
  category: 历史事件
  explanation: 北宋灭亡后，宋钦宗的弟弟赵构登上皇位，以临安为都城建立政权，史称南宋，赵构即宋高宗。
  misconceptions:
    - 误认为南宋都城是开封，实际以临安为都城。
    - 把赵构误认为北宋皇帝宋徽宗，实际是宋高宗。
    - 认为南宋建立于北宋灭亡前，实际北宋灭亡后赵构建南宋。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:南方谈话
  type: Concept
  subject: 历史
  title: 南方谈话
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把南方谈话时间记成1990年，实际是1992年
    - 能指出并纠正这一错误：误以为南方谈话在1980年深圳特区成立时发表
  aliases:
    - 邓小平南方谈话
  category: 历史事件
  explanation: 1992年邓小平视察南方发表的重要谈话，强调坚持改革开放，加快经济发展，推动改革开放进入新阶段。
  misconceptions:
    - 把南方谈话时间记成1990年，实际是1992年
    - 误以为南方谈话在1980年深圳特区成立时发表
    - 误认为南方谈话核心是“一国两制”方针
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:南昌起义
  type: Concept
  subject: 历史
  title: 南昌起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将毛泽东列为南昌起义领导人，实际是周恩来、贺龙、叶挺、朱德、刘伯承等
    - 能指出并纠正这一错误：认为南昌起义发生在八七会议之后，实际8月1日早于8月7日
  aliases:
    - 八一南昌起义
  category: 历史事件
  explanation: 1927年8月1日，周恩来、贺龙、叶挺、朱德、刘伯承等领导革命军队在南昌发动武装起义，打响武装反抗国民党反动派的第一枪，标志着中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。
  misconceptions:
    - 误将毛泽东列为南昌起义领导人，实际是周恩来、贺龙、叶挺、朱德、刘伯承等
    - 认为南昌起义发生在八七会议之后，实际8月1日早于8月7日
    - 把秋收起义的'工农革命军'旗号安到南昌起义头上
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:南朝
  type: Concept
  subject: 历史
  title: 南朝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把南朝顺序说成宋、梁、齐、陈，忽略了齐在梁前
    - 能指出并纠正这一错误：以为南朝都城在洛阳，或认为南朝统治北方地区
  aliases: []
  category: 朝代
  explanation: 420-589年，南方相继出现宋、齐、梁、陈四个朝代，均定都建康，统称南朝。
  misconceptions:
    - 误把南朝顺序说成宋、梁、齐、陈，忽略了齐在梁前
    - 以为南朝都城在洛阳，或认为南朝统治北方地区
    - 将东晋也归入南朝，或误以为南朝只有四个政权没有更替
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S3.md
- id: concept:历史:南极科考事业
  type: Concept
  subject: 历史
  title: 南极科考事业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国首座南极科考站是中山站，实际是长城站
    - 能指出并纠正这一错误：认为长城站位于南极圈内，实际在南极圈外的乔治王岛
  aliases:
    - 南极考察
  category: 科技成就
  explanation: 中国自1984年起开展南极考察，建立长城站、中山站等科考站，极地事业从无到有。
  misconceptions:
    - 误以为中国首座南极科考站是中山站，实际是长城站
    - 认为长城站位于南极圈内，实际在南极圈外的乔治王岛
    - 误以为首次南极考察始于1985年，实际是1984年
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S4.md
- id: concept:历史:南海诸岛
  type: Concept
  subject: 历史
  title: 南海诸岛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为清朝在海南设府管辖南海诸岛，但误以为仅管辖西沙和南沙，忽略东沙和中沙。
    - 能指出并纠正这一错误：误认为南海诸岛在清朝时未纳入版图，实际通过琼州府明确管辖。
  aliases: []
  category: 历史地理
  explanation: 清初在海南设立琼州府，管辖东沙、西沙、中沙、南沙四个群岛，表明南海诸岛属于中国。
  misconceptions:
    - 认为清朝在海南设府管辖南海诸岛，但误以为仅管辖西沙和南沙，忽略东沙和中沙。
    - 误认为南海诸岛在清朝时未纳入版图，实际通过琼州府明确管辖。
    - 将琼州府等同于海南岛本身，认为只管海南岛而不及海岛。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:南诏
  type: Concept
  subject: 历史
  title: 南诏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南诏位于青藏高原，与吐蕃混为一谈
    - 能指出并纠正这一错误：误认为册封南诏首领的是唐太宗，而非唐玄宗
  aliases: []
  category: 政权
  explanation: 云南六诏中最南部统一其他五诏后建立，唐玄宗册封其首领为云南王。
  misconceptions:
    - 误认为南诏位于青藏高原，与吐蕃混为一谈
    - 误认为册封南诏首领的是唐太宗，而非唐玄宗
    - 误认为南诏是六诏中最北部的部落统一，颠倒了顺序
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:南非种族隔离制度废除
  type: Concept
  subject: 历史
  title: 南非种族隔离制度废除
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为南非废除种族隔离制度是在1994年曼德拉当选总统后，实际1991年废除，1994年当选
    - 能指出并纠正这一错误：认为废除种族隔离制度只是曼德拉一人的功劳，实际是长期斗争和国际压力的结果
  aliases:
    - 南非废除种族隔离
  category: 历史事件
  explanation: 南非在曼德拉等领导下，经过长期斗争，于1991年废除种族隔离制度，1994年曼德拉成为首位黑人总统。
  misconceptions:
    - 误认为南非废除种族隔离制度是在1994年曼德拉当选总统后，实际1991年废除，1994年当选
    - 认为废除种族隔离制度只是曼德拉一人的功劳，实际是长期斗争和国际压力的结果
    - 误以为曼德拉当选总统时南非种族隔离制度仍在，实际上已先废除
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:博古
  type: Concept
  subject: 历史
  title: 博古
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把博古当成共产国际派来的军事顾问，以为他与李德一样是外国人。
    - 能指出并纠正这一错误：认为博古在遵义会议后仍掌控中央，事实上被解除了最高军事指挥权。
  aliases: []
  category: 历史人物
  explanation: 中共临时中央负责人，在第五次反“围剿”中犯“左”的错误，导致红军失败。
  misconceptions:
    - 把博古当成共产国际派来的军事顾问，以为他与李德一样是外国人。
    - 认为博古在遵义会议后仍掌控中央，事实上被解除了最高军事指挥权。
    - 把第五次反“围剿”失败全归因于敌强我弱，忽略博古、李德的“左”倾错误。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:博鳌亚洲论坛
  type: Concept
  subject: 历史
  title: 博鳌亚洲论坛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为博鳌亚洲论坛是政府间组织，实际为非官方国际论坛。
    - 能指出并纠正这一错误：记错成立年份为2002年，或误以为在海南成立的论坛最早是达沃斯论坛。
  aliases: []
  category: 国际组织
  explanation: 2001年2月在海南成立，第一个永久会址设在中国的国际性论坛。
  misconceptions:
    - 误认为博鳌亚洲论坛是政府间组织，实际为非官方国际论坛。
    - 记错成立年份为2002年，或误以为在海南成立的论坛最早是达沃斯论坛。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S3.md
- id: concept:历史:占城稻
  type: Concept
  subject: 历史
  title: 占城稻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认占城稻是元朝传入中国的
    - 能指出并纠正这一错误：认为占城稻来自日本而非越南
  aliases: []
  category: 历史事件
  explanation: 由越南传入的稻种，成熟早，北宋时推广到东南地区，提高了水稻产量。
  misconceptions:
    - 误认占城稻是元朝传入中国的
    - 认为占城稻来自日本而非越南
    - 以为占城稻是北宋自己培育的新品种
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:卡德纳斯改革
  type: Concept
  subject: 历史
  title: 卡德纳斯改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把卡德纳斯改革说成社会主义革命，实际是资产阶级性质的社会改革。
    - 能指出并纠正这一错误：认为改革只涉及土地，实际还包括国有化、教育、政治民主化等多方面。
  aliases: []
  category: 历史事件
  explanation: 1934年墨西哥总统卡德纳斯推行的改革，包括土地改革、国有化等，促进墨西哥发展。
  misconceptions:
    - 把卡德纳斯改革说成社会主义革命，实际是资产阶级性质的社会改革。
    - 认为改革只涉及土地，实际还包括国有化、教育、政治民主化等多方面。
    - 将卡德纳斯改革与1910年墨西哥资产阶级革命混为一谈，时间、内容均不同。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S5.md
- id: concept:历史:卫温到达夷洲
  type: Concept
  subject: 历史
  title: 卫温到达夷洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为卫温是魏国将领，实际由孙权派出的吴国军队。
    - 能指出并纠正这一错误：把夷洲说成现在的海南岛，实际上夷洲是台湾。
  aliases:
    - 卫温夷洲
  category: 历史事件
  explanation: 230年，孙权派将军卫温率船队到达夷洲（今台湾），加强了大陆与台湾的联系。
  misconceptions:
    - 误以为卫温是魏国将领，实际由孙权派出的吴国军队。
    - 把夷洲说成现在的海南岛，实际上夷洲是台湾。
    - 认为卫温到达夷洲是为了占领土地，实际是加强联系。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:印度民族大起义
  type: Concept
  subject: 历史
  title: 印度民族大起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为起义由甘地领导，实际是土兵率先发起的。
    - 能指出并纠正这一错误：误认为起义反抗的是法国殖民统治，实际是英国。
  aliases:
    - 1857年印度起义
  category: 历史事件
  explanation: 1857年印度土兵率先发起的反抗英国殖民统治的起义，波及印度北部和中部，沉重打击了英国殖民者，反映了印度民族意识的觉醒。
  misconceptions:
    - 误认为起义由甘地领导，实际是土兵率先发起的。
    - 误认为起义反抗的是法国殖民统治，实际是英国。
    - 误认为起义成功后印度独立，实际被镇压。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S4.md
- id: concept:历史:厂卫制度
  type: Concept
  subject: 历史
  title: 厂卫制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为东厂是明太祖设立，实际东厂由明成祖设立。
    - 能指出并纠正这一错误：将西厂误记为明成祖设立，实际西厂由明宪宗设立。
  aliases:
    - 锦衣卫
    - 东厂
    - 西厂
  category: 政治制度
  explanation: 明太祖设锦衣卫，明成祖设东厂，明宪宗设西厂，合称厂卫，为皇帝耳目。
  misconceptions:
    - 误以为东厂是明太祖设立，实际东厂由明成祖设立。
    - 将西厂误记为明成祖设立，实际西厂由明宪宗设立。
    - 认为厂卫是正常司法机构，实际是皇帝直接指挥的特务机关。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:历史年表制作
  type: Concept
  subject: 历史
  title: 历史年表制作
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：制作年表时按事件重要性排序，而不是按时间先后。
    - 能指出并纠正这一错误：将1949年错对应到中国共产党成立，年份与事件搞错。
  aliases: []
  category: 学史方法
  explanation: 将重大历史事件按时间顺序排列，形成时间与事件对应的表格，以认识历史发展的阶段特征和趋势。
  misconceptions:
    - 制作年表时按事件重要性排序，而不是按时间先后。
    - 将1949年错对应到中国共产党成立，年份与事件搞错。
    - 认为历史年表只需罗列事件，无需标注具体时间。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:历史纵向联系
  type: Concept
  subject: 历史
  title: 历史纵向联系
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把洋务运动与改革开放直接类比，忽略时代背景的根本差异。
    - 能指出并纠正这一错误：认为五四运动与新文化运动性质完全相同，不加区分。
  aliases:
    - 纵向联系
  category: 学史方法
  explanation: 将不同时期的相关历史现象按类型、性质、意义等进行联结，以把握历史发展脉络和趋势。
  misconceptions:
    - 把洋务运动与改革开放直接类比，忽略时代背景的根本差异。
    - 认为五四运动与新文化运动性质完全相同，不加区分。
    - 只按时间先后连接事件，不分析类型、性质的纵向联系。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C8/sections/S1.md
- id: concept:历史:原始农业
  type: Concept
  subject: 历史
  title: 原始农业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人类先过上定居生活再开始种植农作物，实际是原始农业推动定居。
    - 能指出并纠正这一错误：认为原始农业就是种粮，不包括饲养家畜，比如忽略河姆渡遗址有猪骨。
  aliases:
    - 农业起源
  category: 历史概念
  explanation: 原始农业是指人类在史前时期通过种植农作物和饲养家畜来获取食物的生产方式，它的出现标志着人类从采集狩猎向农耕定居生活的转变。
  misconceptions:
    - 认为人类先过上定居生活再开始种植农作物，实际是原始农业推动定居。
    - 认为原始农业就是种粮，不包括饲养家畜，比如忽略河姆渡遗址有猪骨。
    - 认为原始农业产生于夏朝，实际上夏朝之前的新石器时代已出现原始农业。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:县制
  type: Concept
  subject: 历史
  title: 县制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为县制长官可世袭，实际由国君直接任免，是中央集权产物。
    - 能指出并纠正这一错误：误以为县制是分封制的延续，将县与封地混同。
  aliases: []
  category: 政治制度
  explanation: 商鞅变法确立的地方行政制度，由国君直接派官吏治理，加强中央集权。
  misconceptions:
    - 认为县制长官可世袭，实际由国君直接任免，是中央集权产物。
    - 误以为县制是分封制的延续，将县与封地混同。
    - 认为县制始于秦始皇统一全国，忽视商鞅变法已确立。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:双十协定
  type: Concept
  subject: 历史
  title: 双十协定
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把双十协定签署时间记成1946年，与政治协商会议时间混淆
    - 能指出并纠正这一错误：误认为双十协定条款规定了解放区军队归国民党政府改编
  aliases:
    - 《政府与中共代表会谈纪要》
  category: 历史文件
  explanation: 1945年10月10日国共双方签署的《政府与中共代表会谈纪要》，确定避免内战、和平建国方针。
  misconceptions:
    - 把双十协定签署时间记成1946年，与政治协商会议时间混淆
    - 误认为双十协定条款规定了解放区军队归国民党政府改编
    - 误以为蒋介石后来撕毁的是双十协定，实际上是政协决议
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:反“扫荡”作战
  type: Concept
  subject: 历史
  title: 反“扫荡”作战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将麻雀战、地道战、地雷战等战法说成是国民党正面战场创造的
    - 能指出并纠正这一错误：把反“扫荡”作战的时间混淆为抗战初期，实际是在相持阶段
  aliases: []
  category: 历史事件
  explanation: 日军对抗日根据地进行报复性“扫荡”，敌后军民创造麻雀战、地道战、地雷战等战法进行艰苦斗争。
  misconceptions:
    - 误将麻雀战、地道战、地雷战等战法说成是国民党正面战场创造的
    - 把反“扫荡”作战的时间混淆为抗战初期，实际是在相持阶段
    - 认为反“扫荡”作战只在华北平原进行，忽略了在山区等其他根据地的斗争
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:反分裂国家法
  type: Concept
  subject: 历史
  title: 反分裂国家法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《反分裂国家法》通过时间误记为2000年或2008年，实际是2005年。
    - 能指出并纠正这一错误：错误认为该法承认‘台湾是独立国家’，忽略明确‘台湾是中国的一部分’。
  aliases: []
  category: 法律
  explanation: 2005年十届全国人大三次会议通过，明确台湾是中国的一部分，国家绝不允许'台独'分裂势力把台湾从中国分裂出去。
  misconceptions:
    - 把《反分裂国家法》通过时间误记为2000年或2008年，实际是2005年。
    - 错误认为该法承认‘台湾是独立国家’，忽略明确‘台湾是中国的一部分’。
    - 将《反分裂国家法》与《国家安全法》混淆。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:发电机
  type: Concept
  subject: 历史
  title: 发电机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为发电机能将电能转化为机械能，实际是机械能转化为电能。
    - 能指出并纠正这一错误：把发电机和电动机混为一谈，两者原理和功能相反。
  aliases: []
  category: 技术发明
  explanation: 根据电磁感应现象发明的发电机，将机械能转化为电能，成为第二次工业革命的重要成果。
  misconceptions:
    - 误以为发电机能将电能转化为机械能，实际是机械能转化为电能。
    - 把发电机和电动机混为一谈，两者原理和功能相反。
    - 认为法拉第发明了发电机，实际法拉第发现了电磁感应，发电机据此制成。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:取消农业税
  type: Concept
  subject: 历史
  title: 取消农业税
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为取消农业税是在2004年，实际废止时间是2006年1月1日。
    - 能指出并纠正这一错误：错误认为农业税延续了2000年，实际是2600年。
  aliases:
    - 农业税废除
  category: 经济政策
  explanation: 2006年1月1日起废止《中华人民共和国农业税条例》，结束了延续2600年的农业税，减轻了农民负担。
  misconceptions:
    - 误以为取消农业税是在2004年，实际废止时间是2006年1月1日。
    - 错误认为农业税延续了2000年，实际是2600年。
    - 认为取消农业税只暂停几年，后期还要补缴，忽略全面废止。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:古DNA技术
  type: Concept
  subject: 历史
  title: 古DNA技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为古DNA技术只能分析完整DNA序列，实际可分析降解的古代DNA
    - 能指出并纠正这一错误：把古DNA技术等同于碳十四测年，二者原理不同
  aliases: []
  category: 科学技术
  explanation: 通过分析古代生物遗骸中的DNA序列，追溯其祖先来源，为人类起源研究提供生物学视角。
  misconceptions:
    - 认为古DNA技术只能分析完整DNA序列，实际可分析降解的古代DNA
    - 把古DNA技术等同于碳十四测年，二者原理不同
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:古代印度文明
  type: Concept
  subject: 历史
  title: 古代印度文明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为古代印度文明最早出现在恒河流域，实际是印度河流域。
    - 能指出并纠正这一错误：将哈拉帕和摩亨佐·达罗说成古埃及城市，它们是印度早期遗址。
  aliases:
    - 印度河流域文明
  category: 历史
  explanation: 古代印度文明最早出现于印度河流域，哈拉帕和摩亨佐·达罗是早期城市遗址，孔雀王朝时期达到鼎盛。
  misconceptions:
    - 认为古代印度文明最早出现在恒河流域，实际是印度河流域。
    - 将哈拉帕和摩亨佐·达罗说成古埃及城市，它们是印度早期遗址。
    - 误以为孔雀王朝是古代两河流域的政权，实际是古代印度王朝。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S3.md
- id: concept:历史:古埃及文明
  type: Concept
  subject: 历史
  title: 古埃及文明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为古埃及文明发源于两河流域，实际是尼罗河流域。
    - 能指出并纠正这一错误：误以为金字塔是法老的宫殿，实际是法老的陵墓。
  aliases:
    - 古代埃及文明
  category: 历史
  explanation: 古埃及文明是世界上最早的文明之一，尼罗河是孕育古埃及文明的摇篮，其文明成果包括象形文字、金字塔等。
  misconceptions:
    - 认为古埃及文明发源于两河流域，实际是尼罗河流域。
    - 误以为金字塔是法老的宫殿，实际是法老的陵墓。
    - 把象形文字说成是苏美尔人发明的，它是古埃及人的文字。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:古埃及的科学文化成就
  type: Concept
  subject: 历史
  title: 古埃及的科学文化成就
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为太阳历是两河流域苏美尔人发明的，实际是古埃及人创制。
    - 能指出并纠正这一错误：认为木乃伊制作是古印度文化，它属于古埃及的防腐技术。
  aliases: []
  category: 历史
  explanation: 古埃及在天文学、数学和医学方面成就突出，如太阳历、象形文字、木乃伊制作等。
  misconceptions:
    - 误以为太阳历是两河流域苏美尔人发明的，实际是古埃及人创制。
    - 认为木乃伊制作是古印度文化，它属于古埃及的防腐技术。
    - 把木乃伊制作等同于医学成就，其实是结合解剖知识的防腐技术。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:古埃及的统一与扩张
  type: Concept
  subject: 历史
  title: 古埃及的统一与扩张
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为古埃及统一于公元前3500年，实际约在公元前3100年。
    - 能指出并纠正这一错误：将图特摩斯三世说成古巴比伦国王，他是古埃及法老。
  aliases: []
  category: 历史
  explanation: 约公元前3100年古埃及初步统一，图特摩斯三世时期成为军事帝国，后几度分裂并遭外族入侵。
  misconceptions:
    - 认为古埃及统一于公元前3500年，实际约在公元前3100年。
    - 将图特摩斯三世说成古巴比伦国王，他是古埃及法老。
    - 误以为古埃及从未分裂，实际曾几度分裂并遭外族入侵。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:古巴比伦王国
  type: Concept
  subject: 历史
  title: 古巴比伦王国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为古巴比伦王国位于尼罗河流域，实际在两河流域中下游。
    - 能指出并纠正这一错误：把汉谟拉比当成古埃及法老，他是古巴比伦国王。
  aliases: []
  category: 历史
  explanation: 古巴比伦王国是古代两河流域文明发展的一个高峰，汉谟拉比在位时统一两河流域中下游，实行君主专制。
  misconceptions:
    - 认为古巴比伦王国位于尼罗河流域，实际在两河流域中下游。
    - 把汉谟拉比当成古埃及法老，他是古巴比伦国王。
    - 误以为古巴比伦实行种姓制度，实际实行君主专制。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:古巴革命
  type: Concept
  subject: 历史
  title: 古巴革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为古巴革命后立即建立社会主义制度，实际1959年推翻独裁政权，后来才走上社会主义道路
    - 能指出并纠正这一错误：认为古巴革命推翻的是本国封建王朝，实际是推翻美国支持的独裁政权
  aliases:
    - 古巴社会主义革命
  category: 历史事件
  explanation: 古巴人民在卡斯特罗等人领导下，经过武装斗争，于1959年推翻美国支持的独裁政权，走上社会主义道路。
  misconceptions:
    - 误认为古巴革命后立即建立社会主义制度，实际1959年推翻独裁政权，后来才走上社会主义道路
    - 认为古巴革命推翻的是本国封建王朝，实际是推翻美国支持的独裁政权
    - 把卡斯特罗领导的古巴革命与拉美独立运动混为一谈
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:古希腊城邦
  type: Concept
  subject: 历史
  title: 古希腊城邦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为古希腊城邦是统一的国家
    - 能指出并纠正这一错误：误认为所有希腊城邦都实行民主政治
  aliases:
    - 城邦
    - 希腊城邦
  category: 历史概念
  explanation: 公元前8世纪开始，古希腊建立的以城市为中心的小国，特点是“小国寡民”。
  misconceptions:
    - 误认为古希腊城邦是统一的国家
    - 误认为所有希腊城邦都实行民主政治
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:古田会议
  type: Concept
  subject: 历史
  title: 古田会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把古田会议召开时间记为1935年遵义会议前后，实际是1929年12月。
    - 能指出并纠正这一错误：误以为古田会议确立了毛泽东在全党的领导地位，实际是确立思想建党、政治建军原则。
  aliases:
    - 红军第四军第九次代表大会
  category: 历史事件
  explanation: 1929年12月，红军第四军党的第九次代表大会在福建上杭古田召开，确立了思想建党、政治建军的原则，强调红军必须绝对服从党的领导。
  misconceptions:
    - 误把古田会议召开时间记为1935年遵义会议前后，实际是1929年12月。
    - 误以为古田会议确立了毛泽东在全党的领导地位，实际是确立思想建党、政治建军原则。
    - 误以为古田会议在延安召开，实际在福建上杭古田。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:另起炉灶
  type: Concept
  subject: 历史
  title: 另起炉灶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“另起炉灶”是取消与一切国家的外交关系，实际不承认国民党旧外交，另行建交。
    - 能指出并纠正这一错误：误认为“另起炉灶”与“打扫干净屋子再请客”含义相同，实际两者针对对象不同。
  aliases: []
  category: 外交方针
  explanation: 不承认国民党政府旧的外交关系，取消帝国主义在华特权。
  misconceptions:
    - 误认为“另起炉灶”是取消与一切国家的外交关系，实际不承认国民党旧外交，另行建交。
    - 误认为“另起炉灶”与“打扫干净屋子再请客”含义相同，实际两者针对对象不同。
    - 误认为该方针由周恩来提出，实际由毛泽东提出。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:可持续发展战略
  type: Concept
  subject: 历史
  title: 可持续发展战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把可持续发展战略等同于单纯环境保护，忽略经济、社会协调发展。
    - 能指出并纠正这一错误：误以为中共十四大首次提出可持续发展战略，实际是十五大。
  aliases: []
  category: 发展战略
  explanation: 中共十五大将实施可持续发展战略作为跨世纪发展的重要任务，强调正确处理经济发展同人口、资源、环境的关系。
  misconceptions:
    - 把可持续发展战略等同于单纯环境保护，忽略经济、社会协调发展。
    - 误以为中共十四大首次提出可持续发展战略，实际是十五大。
    - 将可持续发展战略与科学发展观混为一谈，时间先后颠倒。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:台儿庄大捷
  type: Concept
  subject: 历史
  title: 台儿庄大捷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把台儿庄大捷说成是八路军取得的，实为国民党正面战场。
    - 能指出并纠正这一错误：认为台儿庄大捷是抗战以来第一次大捷，实际是平型关大捷。
  aliases: []
  category: 历史事件
  explanation: 1938年春，中国军队在台儿庄与日军激战，取得抗战以来正面战场的重大胜利。
  misconceptions:
    - 把台儿庄大捷说成是八路军取得的，实为国民党正面战场。
    - 认为台儿庄大捷是抗战以来第一次大捷，实际是平型关大捷。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:台湾人民的抗日武装斗争
  type: Concept
  subject: 历史
  title: 台湾人民的抗日武装斗争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为台湾人民的抗日斗争发生在甲午战争期间，实际是甲午战败割台之后。
    - 能指出并纠正这一错误：误以为只有台湾人民自发抵抗，忽略留台清军也参与其中。
  aliases: []
  category: 历史事件
  explanation: 甲午战后，台湾人民和留台清军抵抗日本侵占，进行了大小100余次战斗，是近代反侵略斗争史上的壮烈篇章。
  misconceptions:
    - 误以为台湾人民的抗日斗争发生在甲午战争期间，实际是甲午战败割台之后。
    - 误以为只有台湾人民自发抵抗，忽略留台清军也参与其中。
    - 误以为斗争很快平息，实际进行了大小100余次战斗，持续多年。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:台湾建省
  type: Concept
  subject: 历史
  title: 台湾建省
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为台湾建省发生在1895年《马关条约》割台之后，实际是1885年
    - 能指出并纠正这一错误：误将首任台湾巡抚说成李鸿章，实际是刘铭传
  aliases:
    - 台湾行省
  category: 历史事件
  explanation: 1885年清政府鉴于台湾战略地位重要，决定建立台湾行省，加强海防和治理。
  misconceptions:
    - 误以为台湾建省发生在1895年《马关条约》割台之后，实际是1885年
    - 误将首任台湾巡抚说成李鸿章，实际是刘铭传
    - 把台湾建省归因于甲午战败后加强海防，实为中法战后清廷所设
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:史事要素
  type: Concept
  subject: 历史
  title: 史事要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把事件顺序颠倒，如认为甲午战争发生在辛亥革命之后。
    - 能指出并纠正这一错误：将人物与事件张冠李戴，如说成吉思汗建立了元朝（忽必烈）。
  aliases:
    - 历史事件要素
  category: 历史研究方法
  explanation: 史事要素包括事件的时间、地点、人物、原因、过程、结果等，掌握这些要素是认识历史现象和建立历史联系的基础。
  misconceptions:
    - 把事件顺序颠倒，如认为甲午战争发生在辛亥革命之后。
    - 将人物与事件张冠李戴，如说成吉思汗建立了元朝（忽必烈）。
    - 倒因为果，如认为辛亥革命成功后才爆发武昌起义，实际恰相反。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S9.md
- id: concept:历史:司母戊鼎
  type: Concept
  subject: 历史
  title: 司母戊鼎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为司母戊鼎是西周时期铸造的祭器，而非商朝青铜器
    - 能指出并纠正这一错误：将司母戊鼎说成是专门用来烧水煮饭的日常炊具
  aliases:
    - 后母戊鼎
  category: 青铜器
  explanation: 商朝青铜器，是世界上出土的最重的青铜器之一，重达832.84千克。
  misconceptions:
    - 误认为司母戊鼎是西周时期铸造的祭器，而非商朝青铜器
    - 将司母戊鼎说成是专门用来烧水煮饭的日常炊具
    - 认为“司母戊”三个字是商王室的姓或者地名
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:司马光
  type: Concept
  subject: 历史
  title: 司马光
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将司马光与司马迁混淆，认为《资治通鉴》是司马迁写的。
    - 能指出并纠正这一错误：误以为《资治通鉴》是纪传体断代史，忽略了它是编年体通史。
  aliases: []
  category: 历史人物
  explanation: 北宋史学家、政治家，主持编写《资治通鉴》。
  misconceptions:
    - 将司马光与司马迁混淆，认为《资治通鉴》是司马迁写的。
    - 误以为《资治通鉴》是纪传体断代史，忽略了它是编年体通史。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:司马昭之心
  type: Concept
  subject: 历史
  title: 司马昭之心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把这句话误为司马昭自己说的，实际上是魏帝曹髦所说。
    - 能指出并纠正这一错误：将司马昭误写成司马懿或司马炎，导致人物张冠李戴。
  aliases:
    - 司马昭之心，路人皆知
  category: 历史典故
  explanation: 出自《晋书》，指司马昭专权时，魏帝曹髦说“司马昭之心，路人所知也”，比喻野心非常明显。
  misconceptions:
    - 把这句话误为司马昭自己说的，实际上是魏帝曹髦所说。
    - 将司马昭误写成司马懿或司马炎，导致人物张冠李戴。
    - 认为成语典故出自《三国志》，实际出自《晋书》。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:司马迁与《史记》
  type: Concept
  subject: 历史
  title: 司马迁与《史记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《史记》当作第一部断代史。
    - 能指出并纠正这一错误：认为司马迁是东汉人，实际西汉。
  aliases: []
  category: 史学成就
  explanation: 司马迁所著《史记》是我国古代第一部纪传体通史，记述了从黄帝到汉武帝的史事，文笔优美，对后世史学发展产生深远影响。
  misconceptions:
    - 误把《史记》当作第一部断代史。
    - 认为司马迁是东汉人，实际西汉。
    - 误以为《史记》只记载汉武帝时期，实际从黄帝到汉武帝。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:同盟会
  type: Concept
  subject: 历史
  title: 同盟会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把兴中会说成是第一个全国性资产阶级革命政党，实际兴中会是革命团体，同盟会才是第一个政党。
    - 能指出并纠正这一错误：误认为同盟会成立时孙中山已出任临时大总统，实际成立在1905年，大总统在1912年。
  aliases: []
  category: 历史组织
  explanation: 中国同盟会，1905年由孙中山等创立，是第一个全国性的资产阶级革命政党，领导多次武装起义。
  misconceptions:
    - 把兴中会说成是第一个全国性资产阶级革命政党，实际兴中会是革命团体，同盟会才是第一个政党。
    - 误认为同盟会成立时孙中山已出任临时大总统，实际成立在1905年，大总统在1912年。
    - 片面认为同盟会只由留学生组成，实际包括会党、新军等各阶层。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:君主立宪制
  type: Concept
  subject: 历史
  title: 君主立宪制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国王仍是最高掌权者，议会只是辅助机构
    - 能指出并纠正这一错误：误以为《权利法案》废除了君主制，英国成为共和国
  aliases:
    - 议会君主制
  category: 政治制度
  explanation: 君主为国家象征，议会行使最高权力的政体，英国通过《权利法案》确立。
  misconceptions:
    - 认为国王仍是最高掌权者，议会只是辅助机构
    - 误以为《权利法案》废除了君主制，英国成为共和国
    - 将君主立宪制与民主共和制混为一谈，认为两者无区别
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S4.md
- id: concept:历史:君权神授
  type: Concept
  subject: 历史
  title: 君权神授
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为君权神授是启蒙思想，主张权力来自人民
    - 能指出并纠正这一错误：将詹姆士一世说成法国国王，与路易十四混淆
  aliases: []
  category: 政治理论
  explanation: 认为王权来自上帝、神圣不可侵犯的理论，被詹姆士一世推崇。
  misconceptions:
    - 误以为君权神授是启蒙思想，主张权力来自人民
    - 将詹姆士一世说成法国国王，与路易十四混淆
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:启蒙运动
  type: Concept
  subject: 历史
  title: 启蒙运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为启蒙运动最早在英国兴起，且为英国革命提供理论
    - 能指出并纠正这一错误：认为启蒙运动主张回到宗教神学，与文艺复兴无异
  aliases: []
  category: 思想运动
  explanation: 18世纪法国为中心的思想解放运动，宣传自由平等民主，为法国大革命提供理论准备。
  misconceptions:
    - 误以为启蒙运动最早在英国兴起，且为英国革命提供理论
    - 认为启蒙运动主张回到宗教神学，与文艺复兴无异
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:吴道子
  type: Concept
  subject: 历史
  title: 吴道子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为吴道子是书法家，与柳公权、颜真卿混淆。
    - 能指出并纠正这一错误：误认为《送子天王图》是阎立本所作，实际为吴道子。
  aliases: []
  category: 历史人物
  explanation: 唐朝画家，画风奔放，代表作《送子天王图》。
  misconceptions:
    - 误认为吴道子是书法家，与柳公权、颜真卿混淆。
    - 误认为《送子天王图》是阎立本所作，实际为吴道子。
    - 把《送子天王图》与《清明上河图》混淆，误以为吴道子是北宋画家。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:周世宗改革
  type: Concept
  subject: 历史
  title: 周世宗改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把周世宗柴荣误认为是西周或东周的周王
    - 能指出并纠正这一错误：认为改革是赵匡胤主持的，与陈桥兵变混淆
  aliases:
    - 柴荣改革
  category: 历史事件
  explanation: 五代后期，后周世宗柴荣进行改革，加强中央集权，发展生产，为北宋统一奠定基础。
  misconceptions:
    - 把周世宗柴荣误认为是西周或东周的周王
    - 认为改革是赵匡胤主持的，与陈桥兵变混淆
    - 认为改革使后周直接统一全国，忽略只是奠定基础
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:和平共处五项原则
  type: Concept
  subject: 历史
  title: 和平共处五项原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为五项原则在1955年万隆会议提出，实际为1953年周恩来接见印度代表团时提出。
    - 能指出并纠正这一错误：误认为五项原则没有“互不干涉内政”，经常少一条。
  aliases: []
  category: 外交原则
  explanation: 互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。
  misconceptions:
    - 误认为五项原则在1955年万隆会议提出，实际为1953年周恩来接见印度代表团时提出。
    - 误认为五项原则没有“互不干涉内政”，经常少一条。
    - 误认为五项原则仅适用于社会主义国家，实际适用于所有国家。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S4.md
- id: concept:历史:和平发展合作
  type: Concept
  subject: 历史
  title: 和平发展合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘和平发展合作’与新世纪外交布局混淆，实际布局是‘大国是关键’等。
    - 能指出并纠正这一错误：误以为和平发展合作只针对周边国家，忽略其全球性。
  aliases: []
  category: 外交概念
  explanation: 中国新世纪外交工作的总体布局，强调大国是关键、周边是首要、发展中国家是基础、多边是重要舞台。
  misconceptions:
    - 将‘和平发展合作’与新世纪外交布局混淆，实际布局是‘大国是关键’等。
    - 误以为和平发展合作只针对周边国家，忽略其全球性。
    - 与20世纪50年代‘和平共处五项原则’相混淆，忽略提出时间不同。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:和平宪法
  type: Concept
  subject: 历史
  title: 和平宪法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为和平宪法是美国强制制定的，完全非日本本意，实际是日本在战后接受盟军要求颁布的
    - 能指出并纠正这一错误：认为和平宪法规定日本可拥有军队，实际规定放弃战争权、不保持战争力量
  aliases: []
  category: 法律文件
  explanation: 二战后日本颁布的宪法，规定日本放弃战争权，不保持战争力量。
  misconceptions:
    - 误认为和平宪法是美国强制制定的，完全非日本本意，实际是日本在战后接受盟军要求颁布的
    - 认为和平宪法规定日本可拥有军队，实际规定放弃战争权、不保持战争力量
    - 误以为和平宪法至今未被修改，实际日本长期存在修改宪法的争议
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S2.md
- id: concept:历史:和平统一、一国两制
  type: Concept
  subject: 历史
  title: 和平统一、一国两制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“一国两制”是为解决台湾问题专门提出的，忽略最初针对港澳。
    - 能指出并纠正这一错误：把“和平统一、一国两制”与改革开放前的政策混同，时间错位。
  aliases: []
  category: 政策方针
  explanation: 改革开放后形成的对台基本方针，在“一国两制”构想基础上提出。
  misconceptions:
    - 认为“一国两制”是为解决台湾问题专门提出的，忽略最初针对港澳。
    - 把“和平统一、一国两制”与改革开放前的政策混同，时间错位。
    - 将对台方针与“一带一路”等新时代政策并列，混淆时代背景。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:哈里发中央集权统治
  type: Concept
  subject: 历史
  title: 哈里发中央集权统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为哈里发只掌握政权和军权，而忽略其同时是宗教领袖
    - 能指出并纠正这一错误：将哈里发与‘苏丹’混为一谈，苏丹是地方或某些时期统治者的称号，非中央集权最高元首
  aliases:
    - 哈里发制度
  category: 政治制度
  explanation: 阿拉伯帝国实行哈里发中央集权统治，哈里发集政权、军权和神权于一身，是帝国最高元首和宗教领袖。
  misconceptions:
    - 误认为哈里发只掌握政权和军权，而忽略其同时是宗教领袖
    - 将哈里发与‘苏丹’混为一谈，苏丹是地方或某些时期统治者的称号，非中央集权最高元首
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:哈雷彗星
  type: Concept
  subject: 历史
  title: 哈雷彗星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《春秋》记载的哈雷彗星当作《诗经》对公元前776年日食的记录
    - 能指出并纠正这一错误：认为哈雷彗星是英国天文学家哈雷在近代首次观测到并因此命名的
  aliases: []
  category: 天文
  explanation: 《春秋》记载的公元前613年彗星，有研究认为就是哈雷彗星。
  misconceptions:
    - 误将《春秋》记载的哈雷彗星当作《诗经》对公元前776年日食的记录
    - 认为哈雷彗星是英国天文学家哈雷在近代首次观测到并因此命名的
    - 说公元前613年的哈雷彗星此后不再出现，至今一千年一次
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:哥伦布
  type: Concept
  subject: 历史
  title: 哥伦布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把哥伦布说成葡萄牙航海家，实际他是受西班牙王室资助的意大利人
    - 能指出并纠正这一错误：认为哥伦布到达的地方是印度，实际他到达的是美洲巴哈马群岛
  aliases: []
  category: 历史人物
  explanation: 意大利航海家，1492年横渡大西洋到达美洲，发现新大陆。
  misconceptions:
    - 把哥伦布说成葡萄牙航海家，实际他是受西班牙王室资助的意大利人
    - 认为哥伦布到达的地方是印度，实际他到达的是美洲巴哈马群岛
    - 误以为哥伦布第一个证明了地圆说，实际地圆说由麦哲伦环球航行证实
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:哥伦布发现美洲
  type: Concept
  subject: 历史
  title: 哥伦布发现美洲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为哥伦布意识到自己发现了新大陆，实际他至死误以为到达亚洲
    - 能指出并纠正这一错误：把哥伦布登陆地点说成美洲大陆，实际他到达的是巴哈马群岛等岛屿
  aliases:
    - 发现新大陆
  category: 历史事件
  explanation: 1492年哥伦布受西班牙王室资助横渡大西洋，到达巴哈马群岛，误以为到达亚洲印度，称当地人为“印第安人”。
  misconceptions:
    - 认为哥伦布意识到自己发现了新大陆，实际他至死误以为到达亚洲
    - 把哥伦布登陆地点说成美洲大陆，实际他到达的是巴哈马群岛等岛屿
    - 误以为印第安人因长得像印度人才得名，实为哥伦布误认为已到印度
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:唐三彩
  type: Concept
  subject: 历史
  title: 唐三彩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把唐三彩当作瓷器，实际是低温釉陶
    - 能指出并纠正这一错误：误以为‘三彩’只有三种颜色，实际是多彩
  aliases: []
  category: 手工业成就
  explanation: 唐朝以黄、绿、蓝、褐、紫等釉色为装饰的低温多彩釉陶，造型以马、骆驼、人的形象最为生动传神。
  misconceptions:
    - 把唐三彩当作瓷器，实际是低温釉陶
    - 误以为‘三彩’只有三种颜色，实际是多彩
    - 将唐三彩的典型造型记成人物而非马和骆驼
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:唐朝与东罗马帝国、大食的交往
  type: Concept
  subject: 历史
  title: 唐朝与东罗马帝国、大食的交往
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把东罗马帝国与大食混为一谈，二者是不同的政权。
    - 能指出并纠正这一错误：误认为造纸术经东罗马西传，实际是通过大食传到西方。
  aliases: []
  category: 历史事件
  explanation: 唐朝与东罗马帝国、大食等国有使臣往来，造纸术通过大食西传，促进世界文化发展。
  misconceptions:
    - 把东罗马帝国与大食混为一谈，二者是不同的政权。
    - 误认为造纸术经东罗马西传，实际是通过大食传到西方。
    - 认为唐朝与东罗马、大食没有往来，实际有使臣和贸易。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:唐朝灭亡
  type: Concept
  subject: 历史
  title: 唐朝灭亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把唐朝灭亡时间记成黄巢攻入长安的881年
    - 能指出并纠正这一错误：认为唐朝是被黄巢起义直接推翻的，忽略朱温篡唐
  aliases: []
  category: 历史事件
  explanation: 907年，朱温建立后梁，唐朝灭亡，中国进入五代十国时期。
  misconceptions:
    - 把唐朝灭亡时间记成黄巢攻入长安的881年
    - 认为唐朝是被黄巢起义直接推翻的，忽略朱温篡唐
    - 把朱温建立后梁误认为在安史之乱后立即发生
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:唐朝的乐舞
  type: Concept
  subject: 历史
  title: 唐朝的乐舞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《霓裳羽衣曲》误记为唐太宗所作
    - 能指出并纠正这一错误：认为梨园是唐太宗创建的，实际是唐玄宗
  aliases: []
  category: 文化成就
  explanation: 唐朝音乐舞蹈发展重要时期，唐玄宗创建梨园，创作《霓裳羽衣曲》，吸收西域艺术元素。
  misconceptions:
    - 把《霓裳羽衣曲》误记为唐太宗所作
    - 认为梨园是唐太宗创建的，实际是唐玄宗
    - 以为唐朝乐舞完全来自西域，忽视本土吸收融合
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:唐朝的对外贸易
  type: Concept
  subject: 历史
  title: 唐朝的对外贸易
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为唐朝对外贸易只有陆上丝绸之路
    - 能指出并纠正这一错误：认为海上丝绸之路到宋朝才开始，忽略唐朝海路
  aliases: []
  category: 历史现象
  explanation: 唐朝时陆上丝绸之路畅通，海上丝绸之路也发挥重要作用，对外贸易往来频繁。
  misconceptions:
    - 误认为唐朝对外贸易只有陆上丝绸之路
    - 认为海上丝绸之路到宋朝才开始，忽略唐朝海路
    - 把唐朝对外贸易与宋朝市舶司制度相混淆
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:唐朝的建立
  type: Concept
  subject: 历史
  title: 唐朝的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为唐朝是李世民建立，实际李渊是开国皇帝，李世民只是其次子
    - 能指出并纠正这一错误：误以为618年定都洛阳，实际定都长安
  aliases: []
  category: 历史事件
  explanation: 618年李渊建立唐朝，定都长安，随后统一全国。
  misconceptions:
    - 误以为唐朝是李世民建立，实际李渊是开国皇帝，李世民只是其次子
    - 误以为618年定都洛阳，实际定都长安
    - 把唐朝统一全国说成唐初即完成，实际至贞观年间才逐步统一
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S2.md
- id: concept:历史:唐朝的社会风气
  type: Concept
  subject: 历史
  title: 唐朝的社会风气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为唐朝女子完全不能接受教育，实际风气开放
    - 能指出并纠正这一错误：误以为唐朝社会封闭，受南宋理学束缚
  aliases: []
  category: 历史现象
  explanation: 唐朝社会风气开放，兼容并包，受北方民族和域外习俗影响，尚武风气盛行，女子可接受教育并参与多种活动。
  misconceptions:
    - 认为唐朝女子完全不能接受教育，实际风气开放
    - 误以为唐朝社会封闭，受南宋理学束缚
    - 把唐朝尚武风气归因于中原传统，忽略北方民族影响
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:唐朝经济的繁荣
  type: Concept
  subject: 历史
  title: 唐朝经济的繁荣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把曲辕犁和筒车功能弄反，前者耕地后者灌溉
    - 能指出并纠正这一错误：误以为曲辕犁是宋朝发明的
  aliases: []
  category: 历史现象
  explanation: 唐朝前期经济发展迅速，农业、手工业、商业均繁荣，出现曲辕犁、筒车等工具，丝织、陶瓷等手工业发达，商业贸易兴盛。
  misconceptions:
    - 把曲辕犁和筒车功能弄反，前者耕地后者灌溉
    - 误以为曲辕犁是宋朝发明的
    - 认为唐朝经济繁荣只表现在商业，忽视农业
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:唐玄宗的改革措施
  type: Concept
  subject: 历史
  title: 唐玄宗的改革措施
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把唐玄宗改革与唐太宗贞观之治混为一谈
    - 能指出并纠正这一错误：误以为唐玄宗重用的是房玄龄、杜如晦
  aliases: []
  category: 历史事件
  explanation: 唐玄宗即位后，稳定政局，励精图治，重用贤能，在姚崇和宋璟辅佐下，政治上抑制权贵、整顿吏治、裁减冗员，经济上发展农业、兴修水利、整顿漕运、改革税制，文化上注重文教、编修图籍。
  misconceptions:
    - 把唐玄宗改革与唐太宗贞观之治混为一谈
    - 误以为唐玄宗重用的是房玄龄、杜如晦
    - 认为唐玄宗的改革废除了科举制
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:唐蕃和亲
  type: Concept
  subject: 历史
  title: 唐蕃和亲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为金城公主入藏早于文成公主，实际文成公主更早
    - 能指出并纠正这一错误：误认为和亲是单向的，认为唐朝也迎娶了吐蕃公主
  aliases:
    - 和亲
  category: 历史事件
  explanation: 唐朝与吐蕃通过联姻加强友好关系，如文成公主、金城公主入藏，促进双方经济文化交流。
  misconceptions:
    - 误以为金城公主入藏早于文成公主，实际文成公主更早
    - 误认为和亲是单向的，认为唐朝也迎娶了吐蕃公主
    - 误把唐蕃和亲当作唐朝与突厥的联姻
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:唐诗
  type: Concept
  subject: 历史
  title: 唐诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为唐诗全属浪漫主义风格，忽略杜甫等现实主义诗人。
    - 能指出并纠正这一错误：误以为李白、杜甫、白居易同时代，忽视盛唐与中唐的先后。
  aliases: []
  category: 文学成就
  explanation: 唐朝是诗歌创作的黄金时期，题材丰富，风格多样，代表诗人有李白、杜甫、白居易等。
  misconceptions:
    - 认为唐诗全属浪漫主义风格，忽略杜甫等现实主义诗人。
    - 误以为李白、杜甫、白居易同时代，忽视盛唐与中唐的先后。
    - 认为《长恨歌》是杜甫的作品，实际作者是白居易。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:商帮
  type: Concept
  subject: 历史
  title: 商帮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为商帮是清朝才有的，忽略明中期已开始形成。
    - 能指出并纠正这一错误：将商帮理解为官方商业机构，实际是地域性商人集团。
  aliases:
    - 晋商
    - 徽商
  category: 经济
  explanation: 具有地域特色的商人集团，如晋商、徽商，拥有雄厚资本，对经济发展有推动作用。
  misconceptions:
    - 误认为商帮是清朝才有的，忽略明中期已开始形成。
    - 将商帮理解为官方商业机构，实际是地域性商人集团。
    - 认为晋商只做票号，忽略其经营盐业、茶叶等多种贸易。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S6.md
- id: concept:历史:商朝的建立
  type: Concept
  subject: 历史
  title: 商朝的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为商汤灭夏发生在公元前2070年。
    - 能指出并纠正这一错误：将商朝建立者写成盘庚，或把亳说成殷。
  aliases:
    - 商汤灭夏
  category: 历史事件
  explanation: 约公元前1600年，商汤灭夏，建立商朝，以亳为都城。
  misconceptions:
    - 误以为商汤灭夏发生在公元前2070年。
    - 将商朝建立者写成盘庚，或把亳说成殷。
    - 认为商汤是夏朝的最后一个王。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:商朝的统治
  type: Concept
  subject: 历史
  title: 商朝的统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为商朝一直定都殷，忽略盘庚迁殷前多次迁都。
    - 能指出并纠正这一错误：认为商朝靠分封制统治，而非刑法和监狱。
  aliases: []
  category: 政治制度
  explanation: 商朝多次迁都，盘庚迁殷后稳定；商朝设置监狱、制定刑法，加强对奴隶和平民的控制。
  misconceptions:
    - 误以为商朝一直定都殷，忽略盘庚迁殷前多次迁都。
    - 认为商朝靠分封制统治，而非刑法和监狱。
    - 将盘庚迁殷说成在商朝初期。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:商鞅变法
  type: Concept
  subject: 历史
  title: 商鞅变法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为商鞅变法发生在春秋时期，实际在战国公元前356年。
    - 能指出并纠正这一错误：认为商鞅被车裂意味着变法失败，实际变法措施成效保留，秦国富强。
  aliases:
    - 商鞅变法
  category: 历史事件
  explanation: 公元前356年秦孝公任用商鞅主持的变法，使秦国富强，为统一奠定基础。
  misconceptions:
    - 误以为商鞅变法发生在春秋时期，实际在战国公元前356年。
    - 认为商鞅被车裂意味着变法失败，实际变法措施成效保留，秦国富强。
    - 将商鞅变法与王安石变法混同，误以为都发生在北宋时期。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:四一二反革命政变
  type: Concept
  subject: 历史
  title: 四一二反革命政变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把四一二政变发动者蒋介石误认为汪精卫
    - 能指出并纠正这一错误：认为四一二政变标志着国共合作的彻底破裂，实际是七一五
  aliases:
    - 四一二政变
  category: 历史事件
  explanation: 1927年4月蒋介石在上海发动的反革命政变，标志着国民革命失败。
  misconceptions:
    - 把四一二政变发动者蒋介石误认为汪精卫
    - 认为四一二政变标志着国共合作的彻底破裂，实际是七一五
    - 认为四一二政变发生在武汉，实际是上海
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:四个全面战略布局
  type: Concept
  subject: 历史
  title: 四个全面战略布局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“全面建成小康社会”误写为“全面建设小康社会”，一字之差，意思不同。
    - 能指出并纠正这一错误：认为“四个全面”是固定不变的，实际内涵已演化为全面建设社会主义现代化国家等。
  aliases: []
  category: 战略布局
  explanation: 指全面建成小康社会、全面深化改革、全面依法治国、全面从严治党，后内涵演化为全面建设社会主义现代化国家等。
  misconceptions:
    - 把“全面建成小康社会”误写为“全面建设小康社会”，一字之差，意思不同。
    - 认为“四个全面”是固定不变的，实际内涵已演化为全面建设社会主义现代化国家等。
    - 将“四个全面”与“五位一体”混淆，认为四个全面包含经济建设等。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:四个意识
  type: Concept
  subject: 历史
  title: 四个意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“四个意识”误写成政治意识、大局意识、核心意识、服务意识。
    - 能指出并纠正这一错误：误以为“四个意识”是党的十八大首次提出的。
  aliases: []
  category: 政治原则
  explanation: 增强政治意识、大局意识、核心意识、看齐意识。
  misconceptions:
    - 把“四个意识”误写成政治意识、大局意识、核心意识、服务意识。
    - 误以为“四个意识”是党的十八大首次提出的。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:四个自信
  type: Concept
  subject: 历史
  title: 四个自信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写“四个自信”时漏掉“理论自信”，只写道路、制度、文化。
    - 能指出并纠正这一错误：将“四个自信”与“四个意识”混为一谈，互相替换。
  aliases: []
  category: 政治原则
  explanation: 坚定道路自信、理论自信、制度自信、文化自信。
  misconceptions:
    - 写“四个自信”时漏掉“理论自信”，只写道路、制度、文化。
    - 将“四个自信”与“四个意识”混为一谈，互相替换。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:四书五经
  type: Concept
  subject: 历史
  title: 四书五经
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为科举考试可以引用其他学派的观点，实际必须以朱熹注释为标准答案。
    - 能指出并纠正这一错误：认为四书五经中四书是《大学》《中庸》《论语》《孟子》，五经是《诗》《书》《礼》《易》《春秋》，但…
  aliases: []
  category: 文化经典
  explanation: 明朝科举考试题目必须出自四书五经，解释以朱熹注为标准。
  misconceptions:
    - 误以为科举考试可以引用其他学派的观点，实际必须以朱熹注释为标准答案。
    - 认为四书五经中四书是《大学》《中庸》《论语》《孟子》，五经是《诗》《书》《礼》《易》《春秋》，但常混淆《乐经》不在其中。
    - 把四书五经当成全部考试范围，实际还有时务策论等，但八股文部分出自四书五经。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:四大发明
  type: Concept
  subject: 历史
  title: 四大发明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为四大发明全部出现于宋朝，实际造纸术和火药更早
    - 能指出并纠正这一错误：误认为四大发明中最先发明的是指南针，实际最早是造纸术
  aliases: []
  category: 科技成就
  explanation: 造纸术、印刷术、指南针和火药，是中国对世界文明发展的重大贡献。
  misconceptions:
    - 误以为四大发明全部出现于宋朝，实际造纸术和火药更早
    - 误认为四大发明中最先发明的是指南针，实际最早是造纸术
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:四大名著
  type: Concept
  subject: 历史
  title: 四大名著
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《红楼梦》诞生于明代，忽略了它是清代曹雪芹所写。
    - 能指出并纠正这一错误：将四大名著中的《西游记》作者误记为吴敬梓或施耐庵。
  aliases:
    - 中国四大名著
  category: 历史
  explanation: 明清时期产生的四部著名小说：《三国演义》《水浒传》《西游记》《红楼梦》，代表了中国古典小说的最高成就。
  misconceptions:
    - 误以为《红楼梦》诞生于明代，忽略了它是清代曹雪芹所写。
    - 将四大名著中的《西游记》作者误记为吴敬梓或施耐庵。
    - 认为《水浒传》是真实历史著作，而非小说。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:四等人制
  type: Concept
  subject: 历史
  title: 四等人制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把四等人制中的“汉人”理解为汉朝人
    - 能指出并纠正这一错误：将四等人的等级顺序写成蒙古、汉人、色目、南人
  aliases: []
  category: 历史概念
  explanation: 元朝统治者对不同民族采取差别对待的措施，形成蒙古人、色目人、汉人、南人四个等级，被后人概括为“四等人制”。
  misconceptions:
    - 误把四等人制中的“汉人”理解为汉朝人
    - 将四等人的等级顺序写成蒙古、汉人、色目、南人
    - 认为四等人制是清朝推行的民族政策
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:回回
  type: Concept
  subject: 历史
  title: 回回
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认回回民族形成于唐朝时期
    - 能指出并纠正这一错误：认为回回是单一外来民族，未与本地民族融合
  aliases:
    - 回族前身
  category: 历史概念
  explanation: 来自中亚、西亚的人移居中国，与汉、蒙古、畏兀儿等族长期杂居，互通婚姻，逐渐交融形成的新民族，是回族的前身。
  misconceptions:
    - 误认回回民族形成于唐朝时期
    - 认为回回是单一外来民族，未与本地民族融合
    - 将回回直接等同于今天的回族，忽略历史演变
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:因材施教
  type: Concept
  subject: 历史
  title: 因材施教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘因材施教’的提出者写成孟子，实际是孔子。
    - 能指出并纠正这一错误：错把‘因材施教’与‘有教无类’视为同一概念，前者重方法，后者重对象。
  aliases: []
  category: 教育思想
  explanation: 孔子提出的教学原则，根据学生特点进行教育。
  misconceptions:
    - 误将‘因材施教’的提出者写成孟子，实际是孔子。
    - 错把‘因材施教’与‘有教无类’视为同一概念，前者重方法，后者重对象。
    - 误认为因材施教是道家或法家主张，学派归属错误。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:国共合作
  type: Concept
  subject: 历史
  title: 国共合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为第一次国共合作开始的标志是黄埔军校建立
    - 能指出并纠正这一错误：混淆第一次与第二次国共合作，认为1927年后仍合作
  aliases:
    - 第一次国共合作
  category: 历史事件
  explanation: 1924年，中国国民党第一次全国代表大会召开，标志着国共两党第一次合作正式形成。
  misconceptions:
    - 误以为第一次国共合作开始的标志是黄埔军校建立
    - 混淆第一次与第二次国共合作，认为1927年后仍合作
    - 把国民党一大召开时间记成1923年
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:国共合作宣言
  type: Concept
  subject: 历史
  title: 国共合作宣言
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为抗日民族统一战线正式形成的标志是西安事变和平解决，实际是《国共合作宣言》发表
    - 能指出并纠正这一错误：将发表机构说成延安新华广播电台，实际是国民党中央通讯社
  aliases:
    - 《中共中央为公布国共合作宣言》
  category: 历史文献
  explanation: 1937年9月国民党中央通讯社公开发表的中共中央提交的宣言，标志着抗日民族统一战线正式形成。
  misconceptions:
    - 误以为抗日民族统一战线正式形成的标志是西安事变和平解决，实际是《国共合作宣言》发表
    - 将发表机构说成延安新华广播电台，实际是国民党中央通讯社
    - 误以为《国共合作宣言》是1937年7月7日当天发表的，实际是9月
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:国共第一次合作
  type: Concept
  subject: 历史
  title: 国共第一次合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为第一次国共合作的政治基础是旧三民主义，而非新三民主义
    - 能指出并纠正这一错误：将第一次国共合作正式建立的标志误认为是中共三大，实际是国民党一大
  aliases:
    - 第一次国共合作
    - 国民革命
  category: 历史事件
  explanation: 1924年至1927年，中国共产党与中国国民党进行的合作，以国民党一大召开为标志，建立革命统一战线。
  misconceptions:
    - 认为第一次国共合作的政治基础是旧三民主义，而非新三民主义
    - 将第一次国共合作正式建立的标志误认为是中共三大，实际是国民党一大
    - 认为第一次国共合作在四一二政变后就彻底结束，忽略七一五政变的影响
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:国家公祭日
  type: Concept
  subject: 历史
  title: 国家公祭日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把国家公祭日设立年份说成2015年，实际为2014年
    - 能指出并纠正这一错误：将公祭日日期记成12月12日，实际是12月13日
  aliases:
    - 南京大屠杀死难者国家公祭日
  category: 历史概念
  explanation: 2014年设立，每年12月13日纪念南京大屠杀死难者，铭记历史、珍爱和平。
  misconceptions:
    - 误把国家公祭日设立年份说成2015年，实际为2014年
    - 将公祭日日期记成12月12日，实际是12月13日
    - 误以为国家公祭日纪念所有抗日烈士，忽略特指南京大屠杀死难者
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:国家安全委员会
  type: Concept
  subject: 历史
  title: 国家安全委员会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把国家安全委员会误认为是国务院下属机构，实为中共中央机构
    - 能指出并纠正这一错误：将国家安全委员会成立时间记成2014年，实际是2013年
  aliases: []
  category: 机构
  explanation: 2013年中共中央决定成立，负责统筹国家安全工作。
  misconceptions:
    - 把国家安全委员会误认为是国务院下属机构，实为中共中央机构
    - 将国家安全委员会成立时间记成2014年，实际是2013年
    - 误认为国家安全委员会是专管反腐的机关，与国家监察委员会混淆
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S3.md
- id: concept:历史:国家宪法日
  type: Concept
  subject: 历史
  title: 国家宪法日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为12月4日是纪念1954年宪法颁布，实为现行宪法公布日
    - 能指出并纠正这一错误：将国家宪法日与全国法制宣传日视为两个不同日子，实际都在12月4日
  aliases: []
  category: 法治纪念日
  explanation: 12月4日为国家宪法日，旨在增强宪法意识。
  misconceptions:
    - 误以为12月4日是纪念1954年宪法颁布，实为现行宪法公布日
    - 将国家宪法日与全国法制宣传日视为两个不同日子，实际都在12月4日
    - 认为国家宪法日是为了庆祝宪法诞生，忽略其增强宪法意识的目的
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
