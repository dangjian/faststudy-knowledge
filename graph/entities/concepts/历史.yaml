  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:花园口决堤
  type: Concept
  subject: 历史
  title: 花园口决堤
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为是日军炸毁花园口黄河大堤，实际是国民党军队所为。
    - 能指出并纠正这一错误：以为花园口决堤发生在徐州会战之后，实际在武汉会战前夕。
  aliases:
    - 花园口事件
  category: 历史事件
  explanation: 1938年6月，蒋介石命令国民党军队炸毁郑州花园口黄河大堤，以阻止日军南下，但造成巨大灾难。
  misconceptions:
    - 认为是日军炸毁花园口黄河大堤，实际是国民党军队所为。
    - 以为花园口决堤发生在徐州会战之后，实际在武汉会战前夕。
    - 认为花园口决堤成功阻止了日军南下，忽略其造成巨大灾难。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:苏格拉底的思想
  type: Concept
  subject: 历史
  title: 苏格拉底的思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“认识你自己”误归于柏拉图，实际是苏格拉底观点。
    - 能指出并纠正这一错误：认为苏格拉底著有《理想国》，实际是柏拉图所作。
  aliases: []
  category: 哲学思想
  explanation: 苏格拉底探讨灵魂、美德和幸福，主张认识你自己，通过问答求知。
  misconceptions:
    - 把“认识你自己”误归于柏拉图，实际是苏格拉底观点。
    - 认为苏格拉底著有《理想国》，实际是柏拉图所作。
    - 将苏格拉底归为智者学派，实际他反对智者学派。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:苏维埃政权
  type: Concept
  subject: 历史
  title: 苏维埃政权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为苏维埃政权是资产阶级临时政府，实际是无产阶级专政的工兵农政府。
    - 能指出并纠正这一错误：认为苏维埃政权只代表工人，实际包括士兵和农民代表。
  aliases:
    - 苏维埃
  category: 历史概念
  explanation: 俄国十月革命后建立的工兵农代表苏维埃政权，是无产阶级专政的形式。
  misconceptions:
    - 以为苏维埃政权是资产阶级临时政府，实际是无产阶级专政的工兵农政府。
    - 认为苏维埃政权只代表工人，实际包括士兵和农民代表。
    - 把苏维埃政权等同于巴黎公社，两者性质不同，巴黎公社是无产阶级首次尝试。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S2.md
- id: concept:历史:苏联模式
  type: Concept
  subject: 历史
  title: 苏联模式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为苏联模式是二战后才确立，实际1936年宪法即已确立。
    - 能指出并纠正这一错误：以为苏联模式完全优于市场经济，实际后期僵化阻碍发展，弊端明显。
  aliases:
    - 斯大林模式
  category: 历史概念
  explanation: 1936年苏联宪法确立的高度集中的政治经济体制，促进初期发展但后期僵化。
  misconceptions:
    - 认为苏联模式是二战后才确立，实际1936年宪法即已确立。
    - 以为苏联模式完全优于市场经济，实际后期僵化阻碍发展，弊端明显。
    - 把苏联模式等同于中国特色社会主义，实际两者有本质区别。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:苏联的工业化
  type: Concept
  subject: 历史
  title: 苏联的工业化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为苏联工业化优先发展轻工业，实际优先重工业。
    - 能指出并纠正这一错误：以为苏联工业化依靠外国援助，实际是独立自主，靠国内积累。
  aliases: []
  category: 历史事件
  explanation: 1926年起苏联通过五年计划优先发展重工业，使苏联成为工业强国。
  misconceptions:
    - 认为苏联工业化优先发展轻工业，实际优先重工业。
    - 以为苏联工业化依靠外国援助，实际是独立自主，靠国内积累。
    - 把苏联工业化说成是资本主义工业化道路，实际是社会主义工业化。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S4.md
- id: concept:历史:苏联解体
  type: Concept
  subject: 历史
  title: 苏联解体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将苏联解体的日期记成1992年，或把戈尔巴乔夫下台年份搞混。
    - 能指出并纠正这一错误：认为“东欧剧变”标志着两极格局终结，实际是苏联解体。
  aliases:
    - 苏联剧变
  category: 历史事件
  explanation: 1991年底，苏联停止存在，各加盟共和国独立，标志着两极格局终结。
  misconceptions:
    - 将苏联解体的日期记成1992年，或把戈尔巴乔夫下台年份搞混。
    - 认为“东欧剧变”标志着两极格局终结，实际是苏联解体。
    - 误以为苏联解体后俄罗斯仍是超级大国，继续和美国两极对峙。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:苏轼
