  misconceptions:
    - 认为英国从16世纪初就开始大规模殖民扩张，实际16世纪后期才起步
    - 把英国击败无敌舰队后立刻成为日不落帝国，实际要到18世纪
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:英国资产阶级革命
  type: Concept
  subject: 历史
  title: 英国资产阶级革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为革命推翻了君主制，建立了共和国
    - 能指出并纠正这一错误：将《人权宣言》当作英国革命的纲领文件
  aliases:
    - 英国革命
  category: 历史事件
  explanation: 17世纪英国推翻封建专制、确立资产阶级统治的革命，为资本主义发展开辟道路。
  misconceptions:
    - 误以为革命推翻了君主制，建立了共和国
    - 将《人权宣言》当作英国革命的纲领文件
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:范缜
