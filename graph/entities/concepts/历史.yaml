  misconceptions:
    - 误以为中国—东盟自贸区使全球一半人受益，实际约三分之一。
    - 误以为东盟包括日本和韩国，实际是东南亚国家联盟。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:中国人民志愿军
  type: Concept
  subject: 历史
  title: 中国人民志愿军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认志愿军入朝作战时间是1949年，实际是1950年10月。
    - 能指出并纠正这一错误：误认为志愿军司令员是林彪，实际是彭德怀。
