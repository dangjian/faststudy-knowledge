  subject: 历史
  title: 灌钢法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为灌钢法在汉代已出现，实际是东晋南朝时推广
    - 能指出并纠正这一错误：认为灌钢法只需将生铁与熟铁混合即可，无需反复锻打
  aliases: []
  category: 生产技术
  explanation: 东晋南朝时期推广的冶炼技术，将生铁和熟铁合炼，反复锻打，得到优质钢材。
  misconceptions:
    - 误以为灌钢法在汉代已出现，实际是东晋南朝时推广
    - 认为灌钢法只需将生铁与熟铁混合即可，无需反复锻打
    - 把灌钢法说成是炒钢法，混淆了两种冶炼技术
