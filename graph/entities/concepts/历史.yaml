- id: concept:历史:艰苦奋斗的时代精神
  type: Concept
  subject: 历史
  title: 艰苦奋斗的时代精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为艰苦奋斗精神仅仅指生活上的节俭，不包含奋发图强的创业志向。
    - 能指出并纠正这一错误：误认为只有王进喜等石油工人体现此精神，忽视焦裕禄、雷锋等同样典型。
  aliases: []
  category: 精神
  explanation: 社会主义建设时期涌现出的英雄模范人物所体现的艰苦奋斗、奋发图强的创业精神。
  misconceptions:
    - 误以为艰苦奋斗精神仅仅指生活上的节俭，不包含奋发图强的创业志向。
    - 误认为只有王进喜等石油工人体现此精神，忽视焦裕禄、雷锋等同样典型。
    - 误将艰苦奋斗时代精神归属为改革开放后的产物，实际是社会主义建设时期。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:节度使
  type: Concept
  subject: 历史
