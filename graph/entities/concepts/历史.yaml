  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:脱贫攻坚战
  type: Concept
  subject: 历史
  title: 脱贫攻坚战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为脱贫攻坚战在2020年就已经全面胜利，实际宣布是在2021年。
    - 能指出并纠正这一错误：把脱贫攻坚战看成是国家主席习近平个人的慈善行为，而非国家战略。
  aliases:
    - 精准扶贫
  category: 历史事件
