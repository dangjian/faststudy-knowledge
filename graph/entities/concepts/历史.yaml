    - 把焦裕禄说成是石油工人，与王进喜事迹混淆。
    - 误认为焦裕禄是抗日战争时期的英雄，将其事迹与狼牙山五壮士混同。
    - 将焦裕禄精神概括为“乐于助人”或“无私奉献”，忽略“艰苦奋斗”“科学求实”等特定内涵。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S2.md
- id: concept:历史:燕云十六州
  type: Concept
  subject: 历史
  title: 燕云十六州
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为燕云十六州完全在长城以北，实则在长城以南
    - 能指出并纠正这一错误：把燕云十六州说成是北宋初年割让给辽的，实际是后晋石敬瑭割让
  aliases:
    - 幽云十六州
    - 幽蓟十六州
  category: 地理概念
  explanation: 燕云十六州，也叫幽云十六州，大致相当于今北京及河北、山西北部一带，是中原王朝与北方游牧民族争夺的战略要地。
  misconceptions:
    - 误以为燕云十六州完全在长城以北，实则在长城以南
    - 把燕云十六州说成是北宋初年割让给辽的，实际是后晋石敬瑭割让
    - 认为燕云十六州是产马地，实际主要产粮
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:爱国者治港
  type: Concept
  subject: 历史
  title: 爱国者治港
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为爱国者治港原则只针对香港，不包括澳门，忽略了同样适用于澳门。
    - 能指出并纠正这一错误：把爱国者治港理解为要求所有香港居民必须爱国，实际上仅指治理者。
  aliases:
    - 爱国者治澳
  category: 原则
  explanation: 中央政府落实“爱国者治港”“爱国者治澳”原则，维护国家主权、安全和发展利益。
  misconceptions:
    - 认为爱国者治港原则只针对香港，不包括澳门，忽略了同样适用于澳门。
    - 把爱国者治港理解为要求所有香港居民必须爱国，实际上仅指治理者。
    - 认为爱国者治港会取消香港高度自治，是与‘一国两制’相违背的举措。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S3.md
- id: concept:历史:爱迪生
  type: Concept
  subject: 历史
  title: 爱迪生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为爱迪生发明了电灯，实为发明耐用的白炽灯泡
    - 能指出并纠正这一错误：把爱迪生说成是英国人，实为美国人
  aliases: []
  category: 历史人物
  explanation: 美国发明家爱迪生发明了耐用的白炽灯泡、碱性蓄电池等，并建立了第一座火力发电站。
  misconceptions:
    - 误认为爱迪生发明了电灯，实为发明耐用的白炽灯泡
    - 把爱迪生说成是英国人，实为美国人
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:片面最惠国待遇
  type: Concept
  subject: 历史
  title: 片面最惠国待遇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为片面最惠国待遇是中外双方互惠互利，忘记中国不享有对等权利
    - 能指出并纠正这一错误：将片面最惠国待遇与领事裁判权混为一谈，两者内容完全不同
  aliases: []
  category: 历史概念
  explanation: 外国在中国享有最惠国待遇，但中国不享有对等权利，是列强侵略中国的不平等条款。
  misconceptions:
    - 认为片面最惠国待遇是中外双方互惠互利，忘记中国不享有对等权利
    - 将片面最惠国待遇与领事裁判权混为一谈，两者内容完全不同
    - 误以为片面最惠国待遇只涉及关税优惠，忽视其破坏主权完整性的危害
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:牛顿
  type: Concept
  subject: 历史
  title: 牛顿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为牛顿提出相对论，实为爱因斯坦
    - 能指出并纠正这一错误：把牛顿的成就说成发明蒸汽机，实为瓦特改良蒸汽机
  aliases: []
  category: 历史人物
  explanation: 英国科学家牛顿是近代自然科学奠基人，提出万有引力定律、光学分析和微积分学。
  misconceptions:
    - 误认为牛顿提出相对论，实为爱因斯坦
    - 把牛顿的成就说成发明蒸汽机，实为瓦特改良蒸汽机
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:牧野之战
  type: Concept
  subject: 历史
  title: 牧野之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为牧野之战是商汤讨伐夏桀。
    - 能指出并纠正这一错误：将牧野之战发生年份记成公元前1600年。
  aliases:
    - 武王伐纣
  category: 历史事件
  explanation: 公元前1046年，周武王在牧野大败商军，商朝灭亡，西周建立。
  misconceptions:
    - 误以为牧野之战是商汤讨伐夏桀。
    - 将牧野之战发生年份记成公元前1600年。
    - 认为牧野之战后商朝并未灭亡，只是迁都。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:独立自主的和平外交政策
  type: Concept
  subject: 历史
  title: 独立自主的和平外交政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为独立自主的和平外交政策就是不同任何国家建立外交关系，理解绝对化。
    - 能指出并纠正这一错误：把新中国初期的‘一边倒’外交政策等同于独立自主的和平外交政策。
  aliases:
    - 和平外交
  category: 外交政策
  explanation: 新中国奉行的外交政策，维护国家独立和主权，促进世界和平。
  misconceptions:
    - 认为独立自主的和平外交政策就是不同任何国家建立外交关系，理解绝对化。
    - 把新中国初期的‘一边倒’外交政策等同于独立自主的和平外交政策。
    - 误以为独立自主的和平外交政策放弃了与社会主义国家的合作，以偏概全。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:狼牙山五壮士
  type: Concept
  subject: 历史
  title: 狼牙山五壮士
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将狼牙山五壮士与‘八女投江’混淆，人数和故事张冠李戴
    - 能指出并纠正这一错误：误以为五壮士跳崖时全部牺牲，实际有两人重伤幸存
  aliases: []
  category: 历史事件
  explanation: 1941年9月，晋察冀军区战士马宝玉等五人为掩护群众和主力转移，在狼牙山跳崖，三人牺牲，两人重伤，显示了中华儿女宁死不屈的伟大精神。
  misconceptions:
    - 将狼牙山五壮士与‘八女投江’混淆，人数和故事张冠李戴
    - 误以为五壮士跳崖时全部牺牲，实际有两人重伤幸存
    - 记错五壮士的部队番号，误为八路军，实际他们属于晋察冀军区某部
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:玄奘西行
  type: Concept
  subject: 历史
  title: 玄奘西行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为玄奘东渡日本，与鉴真混淆
    - 能指出并纠正这一错误：误认为玄奘是天竺人，来唐朝传教，方向反了
  aliases: []
  category: 历史事件
  explanation: 唐朝高僧玄奘前往天竺取经，促进中印文化交流。
  misconceptions:
    - 误认为玄奘东渡日本，与鉴真混淆
    - 误认为玄奘是天竺人，来唐朝传教，方向反了
    - 误认为玄奘西行是受唐太宗派遣，实际是私自出行
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:王位纪年法
  type: Concept
  subject: 历史
  title: 王位纪年法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为王位纪年法与年号纪年法相同，如把"贞观元年"当作王位纪年。
    - 能指出并纠正这一错误：认为王位纪年法从公元元年算起，不知按国君在位年数计算。
  aliases:
    - 王位纪年
  category: 历史纪年法
  explanation: 按照国君在位的年数依次纪年，如秦王政元年。
  misconceptions:
    - 误以为王位纪年法与年号纪年法相同，如把"贞观元年"当作王位纪年。
    - 认为王位纪年法从公元元年算起，不知按国君在位年数计算。
    - 混淆"秦王政元年"中的"元年"为年号，实际是王位纪年。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S7.md
- id: concept:历史:王夫之的思想
  type: Concept
  subject: 历史
  title: 王夫之的思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为王夫之是唯心主义思想家，实际是朴素唯物主义者。
    - 能指出并纠正这一错误：将王夫之主张的“变化发展”误认为“泥古不化”，完全颠倒。
  aliases: []
  category: 历史
  explanation: 明末清初思想家王夫之是朴素唯物主义思想家，认为社会是发展的、进化的，不能泥古不化。
  misconceptions:
    - 误以为王夫之是唯心主义思想家，实际是朴素唯物主义者。
    - 将王夫之主张的“变化发展”误认为“泥古不化”，完全颠倒。
    - 认为王夫之是明末农民起义领袖，而非思想家。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S8.md
- id: concept:历史:王守仁的心学
  type: Concept
  subject: 历史
  title: 王守仁的心学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为王守仁是南宋理学家，实际是明朝心学代表。
    - 能指出并纠正这一错误：把王守仁的“致良知”等同于朱熹的“格物致知”，混淆心学与理学。
  aliases:
    - 阳明心学
  category: 历史
  explanation: 明中期思想家王守仁提出心是万物的主宰，提倡“心即理”“知行合一”和“致良知”，影响很大。
  misconceptions:
    - 误以为王守仁是南宋理学家，实际是明朝心学代表。
    - 把王守仁的“致良知”等同于朱熹的“格物致知”，混淆心学与理学。
    - 误认为王守仁是王夫之的师父，两人时代相差数百年。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S8.md
- id: concept:历史:王安石变法
  type: Concept
  subject: 历史
  title: 王安石变法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把王安石变法记为宋仁宗时期，实际是宋神宗。
    - 能指出并纠正这一错误：认为变法完全成功，实际因保守派反对而失败。
  aliases:
    - 熙宁变法
  category: 历史事件
  explanation: 1069年宋神宗任用王安石变法，涉及经济、军事等领域，旨在富国强兵。
  misconceptions:
    - 把王安石变法记为宋仁宗时期，实际是宋神宗。
    - 认为变法完全成功，实际因保守派反对而失败。
    - 将王安石变法与商鞅变法措施混用，张冠李戴。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:王室衰微
  type: Concept
  subject: 历史
  title: 王室衰微
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为王室衰微是战国时期才开始，忽视东迁后周王室权威已下降。
    - 能指出并纠正这一错误：误以为周天子仍能号令诸侯，实际诸侯不再定期朝觐和缴纳贡赋。
  aliases:
    - 周室衰微
  category: 政治现象
  explanation: 东迁后周王室权威削弱，失去对诸侯的控制，诸侯不再定期朝觐和缴纳贡赋，周天子失去实际统治权。
  misconceptions:
    - 认为王室衰微是战国时期才开始，忽视东迁后周王室权威已下降。
    - 误以为周天子仍能号令诸侯，实际诸侯不再定期朝觐和缴纳贡赋。
    - 把王室衰微的原因归结为分封制瓦解，因果颠倒，实际王室衰微加速分封制瓦解。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:王羲之
  type: Concept
  subject: 历史
  title: 王羲之
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《兰亭集序》是王献之所写，父子二人张冠李戴。
    - 能指出并纠正这一错误：误以为王羲之是唐朝书法家，实际他是东晋人。
  aliases: []
  category: 历史人物
  explanation: 东晋书法家，将书法艺术提高到一个新高度，代表作《兰亭集序》被誉为“天下第一行书”。
  misconceptions:
    - 误认为《兰亭集序》是王献之所写，父子二人张冠李戴。
    - 误以为王羲之是唐朝书法家，实际他是东晋人。
    - 误认为王羲之只擅长行书，忽略他楷书、草书也出色。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:环境污染
  type: Concept
  subject: 历史
  title: 环境污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为环境污染始于第三次工业革命，实为第二次工业革命已出现
    - 能指出并纠正这一错误：只想到大气污染，忽略废水污染
  aliases: []
  category: 社会问题
  explanation: 工业化进程中，工厂排放废气和废水，严重污染大气和河流，危害健康。
  misconceptions:
    - 误认为环境污染始于第三次工业革命，实为第二次工业革命已出现
    - 只想到大气污染，忽略废水污染
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S2.md
- id: concept:历史:现代工厂制度
  type: Concept
  subject: 历史
  title: 现代工厂制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为现代工厂制度在手工工场时期就已确立，实际是工业革命后才确立
    - 能指出并纠正这一错误：认为工厂必须靠近河流或水源，实际蒸汽机使工厂可以远离河流
  aliases:
    - 工厂制度
  category: 制度
  explanation: 进入19世纪，传统手工工场逐渐被大工厂替代，工厂可以设在远离河流的地方，规模扩大，现代工厂制度最终确立。
  misconceptions:
    - 认为现代工厂制度在手工工场时期就已确立，实际是工业革命后才确立
    - 认为工厂必须靠近河流或水源，实际蒸汽机使工厂可以远离河流
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:玻利瓦尔
  type: Concept
  subject: 历史
  title: 玻利瓦尔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为玻利瓦尔领导南美洲南部独立，与他实际活动的北部相混。
    - 能指出并纠正这一错误：将玻利瓦尔与圣马丁混淆，称圣马丁为“解放者”。
  aliases:
    - 西蒙·玻利瓦尔
  category: 历史人物
  explanation: 南美洲北部独立运动领导人，解放了哥伦比亚、委内瑞拉、厄瓜多尔等地，被誉为南美“解放者”。
  misconceptions:
    - 误以为玻利瓦尔领导南美洲南部独立，与他实际活动的北部相混。
    - 将玻利瓦尔与圣马丁混淆，称圣马丁为“解放者”。
    - 认为玻利瓦尔解放了墨西哥或巴西，实际他活动于南美北部。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S4.md
- id: concept:历史:珍妮机
  type: Concept
  subject: 历史
  title: 珍妮机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把珍妮机的发明者记为瓦特，实际是哈格里夫斯
    - 能指出并纠正这一错误：说珍妮机使用水力驱动，实际是人力操作的手摇纺纱机
  aliases:
    - 珍妮纺纱机
  category: 发明
  explanation: 1765年哈格里夫斯发明的纺纱机，最初一次能纺出8根纱线，改进后能同时纺出80根，大大提高了生产效率。
  misconceptions:
    - 把珍妮机的发明者记为瓦特，实际是哈格里夫斯
    - 说珍妮机使用水力驱动，实际是人力操作的手摇纺纱机
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:珍珠港事件
  type: Concept
  subject: 历史
  title: 珍珠港事件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把珍珠港事件时间误记为1942年或1943年
    - 能指出并纠正这一错误：认为珍珠港事件后美国直接对德国宣战，实际是日本宣战
  aliases:
    - 偷袭珍珠港
  category: 历史事件
  explanation: 1941年12月7日，日军偷袭美国珍珠港海军基地，导致美国对日宣战，二战达到最大规模。
  misconceptions:
    - 把珍珠港事件时间误记为1942年或1943年
    - 认为珍珠港事件后美国直接对德国宣战，实际是日本宣战
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S3.md
- id: concept:历史:班超经营西域
  type: Concept
  subject: 历史
  title: 班超经营西域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把班超经营西域的时间混同于西汉张骞时期。
    - 能指出并纠正这一错误：认为甘英出使大秦到达了罗马，实际只到波斯湾沿岸。
  aliases: []
  category: 历史事件
  explanation: 东汉时期，班超出使西域，使西域各国与汉朝重新建立联系，并长期驻守西域，经营30多年，还派甘英出使大秦，开辟了通往西亚的路线。
  misconceptions:
    - 误把班超经营西域的时间混同于西汉张骞时期。
    - 认为甘英出使大秦到达了罗马，实际只到波斯湾沿岸。
    - 说班超在西域经营30年，张冠李戴到张骞身上。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:理学
  type: Concept
  subject: 历史
  title: 理学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认朱熹是理学的创立者，忽略程颢、程颐的奠基。
    - 能指出并纠正这一错误：将理学与心学混淆，认为王阳明是理学集大成者。
  aliases: []
  category: 思想流派
  explanation: 程颢、程颐创立，朱熹集大成，强调存天理、灭人欲，成为我国古代统治思想。
  misconceptions:
    - 误认朱熹是理学的创立者，忽略程颢、程颐的奠基。
    - 将理学与心学混淆，认为王阳明是理学集大成者。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:琉球事件
  type: Concept
  subject: 历史
  title: 琉球事件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为琉球事件是日本吞并琉球的借口，实际它是日本侵略台湾的借口。
    - 能指出并纠正这一错误：错误认为日本因琉球事件放弃侵略台湾，实际日本于1874年侵略台湾。
  aliases: []
  category: 历史事件
  explanation: 日本以琉球船民被台湾居民误杀为借口，于1874年侵略台湾，是日本侵略台湾的借口。
  misconceptions:
    - 误认为琉球事件是日本吞并琉球的借口，实际它是日本侵略台湾的借口。
    - 错误认为日本因琉球事件放弃侵略台湾，实际日本于1874年侵略台湾。
    - 误将琉球事件说成台湾居民主动进攻琉球船民，实际是误杀。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:瓦子与勾栏
  type: Concept
  subject: 历史
  title: 瓦子与勾栏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把瓦子当作专供演出的场所，勾栏当作商业区，两者关系颠倒
    - 能指出并纠正这一错误：认为瓦子勾栏最早出现在唐朝长安，实际是宋代东京
  aliases:
    - 瓦子
    - 勾栏
  category: 社会生活
  explanation: 东京城内娱乐兼营商业的场所称瓦子，其中专供演出的圈子称勾栏，反映城市文化生活丰富。
  misconceptions:
    - 误把瓦子当作专供演出的场所，勾栏当作商业区，两者关系颠倒
    - 认为瓦子勾栏最早出现在唐朝长安，实际是宋代东京
    - 将瓦子与勾栏都视为纯粹商业区，忽略其娱乐表演功能
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S5.md
- id: concept:历史:瓦特改良蒸汽机
  type: Concept
  subject: 历史
  title: 瓦特改良蒸汽机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说瓦特发明了蒸汽机，实际他只是改良了已有的蒸汽机
    - 能指出并纠正这一错误：把蒸汽机作为工业革命开始的标志，实际开始的标志是珍妮机
  aliases:
    - 蒸汽机
  category: 发明
  explanation: 18世纪中期瓦特对蒸汽机进行改进，1785年投入使用，成为主要动力来源，使工业革命向纵深发展。
  misconceptions:
    - 说瓦特发明了蒸汽机，实际他只是改良了已有的蒸汽机
    - 把蒸汽机作为工业革命开始的标志，实际开始的标志是珍妮机
    - 认为瓦特改良蒸汽机受牛顿启发，实际是结合汽缸和冷凝器
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:瓦窑堡会议
  type: Concept
  subject: 历史
  title: 瓦窑堡会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把瓦窑堡会议时间记成1936年，与遵义会议先后颠倒
    - 能指出并纠正这一错误：误以为瓦窑堡会议确立了毛泽东的领导地位，实际是遵义会议
  aliases: []
  category: 历史事件
  explanation: 1935年底中共中央在瓦窑堡召开的政治局扩大会议，确定了建立抗日民族统一战线的方针。
  misconceptions:
    - 把瓦窑堡会议时间记成1936年，与遵义会议先后颠倒
    - 误以为瓦窑堡会议确立了毛泽东的领导地位，实际是遵义会议
    - 认为瓦窑堡会议决定发动西安事变，其实际是确定抗日民族统一战线
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:生态问题
  type: Concept
  subject: 历史
  title: 生态问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态问题仅指环境污染，忽略淡水资源短缺、土地荒漠化等
    - 能指出并纠正这一错误：认为生态问题只存在于发达国家，发展中国家没有生态问题
  aliases:
    - 环境问题
  category: 历史概念
  explanation: 全球工业化推进导致环境恶化，如温室效应、臭氧层破坏、淡水资源短缺、土地荒漠化、森林破坏等，成为重大经济和社会问题。
  misconceptions:
    - 认为生态问题仅指环境污染，忽略淡水资源短缺、土地荒漠化等
    - 认为生态问题只存在于发达国家，发展中国家没有生态问题
    - 把单个生态问题当成全部，以偏概全，忽视多样性
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:甲午中日战争
  type: Concept
  subject: 历史
  title: 甲午中日战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为甲午战争发生于1895年，实际是1894年
    - 能指出并纠正这一错误：认为甲午战争宣告洋务运动成功，实际是宣告破产
  aliases: []
  category: 历史事件
  explanation: 1894年日本侵略中国的战争，中国战败，1895年签订《马关条约》，宣告洋务运动破产。
  misconceptions:
    - 误以为甲午战争发生于1895年，实际是1894年
    - 认为甲午战争宣告洋务运动成功，实际是宣告破产
    - 将甲午中日战争与日俄战争混淆，日俄战争在1904年
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:甲骨文
  type: Concept
  subject: 历史
  title: 甲骨文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为甲骨文是铸刻在青铜器上的文字（金文）
    - 能指出并纠正这一错误：认为甲骨文是秦朝统一后推行的标准字体
  aliases:
    - 契文
    - 卜辞
  category: 文字
  explanation: 商朝时期刻在龟甲和兽骨上的文字，是我国已发现的古代文字中年代最早、体系较为完整的成熟文字。
  misconceptions:
    - 误以为甲骨文是铸刻在青铜器上的文字（金文）
    - 认为甲骨文是秦朝统一后推行的标准字体
    - 说甲骨文是我国已知最早但不成体系的刻画符号，而非成熟文字
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:电气时代
  type: Concept
  subject: 历史
  title: 电气时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为第二次工业革命使人类进入蒸汽时代，实为电气时代
    - 能指出并纠正这一错误：把电气时代提前到第一次工业革命
  aliases: []
  category: 历史阶段
  explanation: 电力成为新的能源进入生产生活领域，人类社会进入“电气时代”。
  misconceptions:
    - 误认为第二次工业革命使人类进入蒸汽时代，实为电气时代
    - 把电气时代提前到第一次工业革命
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:电磁感应现象
  type: Concept
  subject: 历史
  title: 电磁感应现象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为电磁感应现象是奥斯特发现，实为法拉第
    - 能指出并纠正这一错误：误认为法拉第发明了发电机，实为发现电磁感应现象为发电机提供基础
  aliases: []
  category: 科学发现
  explanation: 1831年英国科学家法拉第发现电磁感应现象，为发电机的发明提供了理论基础。
  misconceptions:
    - 误认为电磁感应现象是奥斯特发现，实为法拉第
    - 误认为法拉第发明了发电机，实为发现电磁感应现象为发电机提供基础
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:白居易
  type: Concept
  subject: 历史
  title: 白居易
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将白居易诗风概括为豪放飘逸，忽视其平易通俗的特点
    - 能指出并纠正这一错误：误认为《长恨歌》是李白的作品，实际是白居易所作
  aliases: []
  category: 历史人物
  explanation: 唐朝后期诗人，诗直面社会现实，通俗易懂，代表作有《长恨歌》《琵琶行》。
  misconceptions:
    - 误将白居易诗风概括为豪放飘逸，忽视其平易通俗的特点
    - 误认为《长恨歌》是李白的作品，实际是白居易所作
    - 把白居易当作初唐或盛唐诗人，实际是唐朝后期诗人
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:白求恩
  type: Concept
  subject: 历史
  title: 白求恩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为白求恩是美国人或英国人，忽略他是加拿大人。
    - 能指出并纠正这一错误：以为白求恩是在延安殉职，实际是在晋察冀前线。
  aliases:
    - 诺尔曼·白求恩
  category: 历史人物
  explanation: 加拿大共产党员，外科医生，1938年到延安，后赴晋察冀根据地救治伤员，因感染殉职，毛泽东号召学习其国际主义精神。
  misconceptions:
    - 认为白求恩是美国人或英国人，忽略他是加拿大人。
    - 以为白求恩是在延安殉职，实际是在晋察冀前线。
    - 把白求恩说成是苏联派来支援的医生。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:白莲教起义
  type: Concept
  subject: 历史
  title: 白莲教起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把白莲教起义归入明末，实际爆发于清嘉庆元年（1796年）。
    - 能指出并纠正这一错误：将白莲教起义与太平天国混淆，误以为领袖是洪秀全或自封天王。
  aliases: []
  category: 历史
  explanation: 1796年爆发于湖北、四川等五省，历时9年，耗资巨大，是清朝走向衰落的转折点。
  misconceptions:
    - 把白莲教起义归入明末，实际爆发于清嘉庆元年（1796年）。
    - 将白莲教起义与太平天国混淆，误以为领袖是洪秀全或自封天王。
    - 认为起义直接推翻清朝，实际是耗资巨大，成为清朝衰落转折点。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:百团大战
  type: Concept
  subject: 历史
  title: 百团大战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把百团大战说成是国民党发起的正面战场会战。
    - 能指出并纠正这一错误：认为百团大战是八路军对日军发动的最大规模阵地战，实际是破袭战。
  aliases: []
  category: 历史事件
  explanation: 1940年下半年，八路军在华北发动百团大战，是抗日战争中中国军队主动出击日军的最大规模战役。
  misconceptions:
    - 把百团大战说成是国民党发起的正面战场会战。
    - 认为百团大战是八路军对日军发动的最大规模阵地战，实际是破袭战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:百家争鸣
  type: Concept
  subject: 历史
  title: 百家争鸣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把百家争鸣的时间说成春秋末期或秦朝，忽略其战国时期
    - 能指出并纠正这一错误：认为百家争鸣中各学派互相攻击、势不两立，忽略取长补短
  aliases: []
  category: 历史概念
  explanation: 战国时期各学派相互辩论、取长补短的思想文化繁荣局面，是我国古代第一次思想文化发展的高峰。
  misconceptions:
    - 把百家争鸣的时间说成春秋末期或秦朝，忽略其战国时期
    - 认为百家争鸣中各学派互相攻击、势不两立，忽略取长补短
    - 把百家争鸣说成是我国古代第二次思想文化发展高峰，应是第一次
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:百日维新
  type: Concept
  subject: 历史
  title: 百日维新
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为百日维新历时一年，实际仅103天。
    - 能指出并纠正这一错误：将戊戌政变的时间早于变法开始，实际政变发生在变法失败后。
  aliases:
    - 戊戌变法
  category: 历史事件
  explanation: 1898年6月11日至9月21日，光绪帝颁布'明定国是'诏书，实行变法，历时103天，因戊戌政变而失败。
  misconceptions:
    - 误以为百日维新历时一年，实际仅103天。
    - 将戊戌政变的时间早于变法开始，实际政变发生在变法失败后。
    - 认为'明定国是'诏书是慈禧太后颁布的，实际是光绪帝。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:百灵庙大捷
  type: Concept
  subject: 历史
  title: 百灵庙大捷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为百灵庙大捷是八路军取得的战果，实际是傅作义部所打
    - 能指出并纠正这一错误：把百灵庙大捷时间记成1937年或1933年，与长城抗战混淆
  aliases: []
  category: 历史事件
  explanation: 1936年冬，傅作义部在绥远百灵庙击退日伪军，歼敌2000余人，振奋了国人。
  misconceptions:
    - 误认为百灵庙大捷是八路军取得的战果，实际是傅作义部所打
    - 把百灵庙大捷时间记成1937年或1933年，与长城抗战混淆
    - 将百灵庙大捷指挥者误写为冯玉祥或吉鸿昌，实际为傅作义
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:皖南事变
  type: Concept
  subject: 历史
  title: 皖南事变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把皖南事变发生时间误记为1940年或1942年，实际是1941年1月
    - 能指出并纠正这一错误：误以为国民党顽固派突袭的是八路军，实际其袭击的是新四军
  aliases: []
  category: 历史事件
  explanation: 1941年1月，国民党顽固派伏击新四军，制造了震惊中外的皖南事变。中国共产党在政治上坚决回击，并重建新四军军部，维护了抗日民族统一战线。
  misconceptions:
    - 把皖南事变发生时间误记为1940年或1942年，实际是1941年1月
    - 误以为国民党顽固派突袭的是八路军，实际其袭击的是新四军
    - 忽略中国共产党在事变后重建新四军军部，误以为新四军完全解体
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:皖系军阀
  type: Concept
  subject: 历史
  title: 皖系军阀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为段祺瑞是直隶人，导致皖系与直系混淆。
    - 能指出并纠正这一错误：认为皖系军阀控制直隶、江苏等地，实际控制北京政府及安徽。
  aliases: []
  category: 历史概念
  explanation: 以段祺瑞为首，因段祺瑞是安徽人而得名，控制北京政府及安徽等地。
  misconceptions:
    - 误以为段祺瑞是直隶人，导致皖系与直系混淆。
    - 认为皖系军阀控制直隶、江苏等地，实际控制北京政府及安徽。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:盐铁官营
  type: Concept
  subject: 历史
  title: 盐铁官营
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为盐铁官营始于西汉初年，实际是汉武帝时期实行。
    - 能指出并纠正这一错误：误以为盐铁官营只针对盐和铁，不包括酒类，实际卖酒也官营。
  aliases:
    - 盐铁专卖
  category: 经济政策
  explanation: 汉武帝将煮盐、冶铁、卖酒等经营权收归国有，实行官营专卖，以加强朝廷对社会经济的控制。
  misconceptions:
    - 认为盐铁官营始于西汉初年，实际是汉武帝时期实行。
    - 误以为盐铁官营只针对盐和铁，不包括酒类，实际卖酒也官营。
    - 认为盐铁官营是为减轻百姓负担，实际是加强经济控制。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:直系军阀
  type: Concept
  subject: 历史
  title: 直系军阀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为冯国璋是安徽人，导致直系与皖系混淆。
    - 能指出并纠正这一错误：将直系军阀的势力范围说成安徽、北京，实际为直隶、江苏。
  aliases: []
  category: 历史概念
  explanation: 以冯国璋、曹锟为首，因冯国璋是直隶人而得名，控制直隶、江苏等地。
  misconceptions:
    - 误以为冯国璋是安徽人，导致直系与皖系混淆。
    - 将直系军阀的势力范围说成安徽、北京，实际为直隶、江苏。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:真理标准问题大讨论
  type: Concept
  subject: 历史
  title: 真理标准问题大讨论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为真理标准问题讨论发生在十一届三中全会之后，实际是1978年全会前
    - 能指出并纠正这一错误：把讨论内容说成‘两个凡是’的争论，实际是‘实践是检验真理的唯一标准’
  aliases:
    - 真理标准讨论
  category: 历史事件
  explanation: 1978年围绕'实践是检验真理的唯一标准'展开的思想解放运动，成为改革开放的思想先导。
  misconceptions:
    - 误认为真理标准问题讨论发生在十一届三中全会之后，实际是1978年全会前
    - 把讨论内容说成‘两个凡是’的争论，实际是‘实践是检验真理的唯一标准’
    - 认为由邓小平直接发起，实际是《实践是检验真理的唯一标准》文章引发
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:知识青年奔赴延安
  type: Concept
  subject: 历史
  title: 知识青年奔赴延安
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为知识青年奔赴延安是南京国民政府号召的，实际是共产党抗日号召感召。
    - 能指出并纠正这一错误：误以为知识青年奔赴延安是为了躲避战乱，实际是投身抗日救亡运动。
  aliases: []
  category: 历史现象
  explanation: 全国抗战爆发后，大批知识青年奔赴延安，接受革命教育，成为抗日救国骨干力量。
  misconceptions:
    - 误以为知识青年奔赴延安是南京国民政府号召的，实际是共产党抗日号召感召。
    - 误以为知识青年奔赴延安是为了躲避战乱，实际是投身抗日救亡运动。
    - 误以为知识青年奔赴延安发生在抗战胜利后，实际是抗战初期形成高潮。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:礼崩乐坏
  type: Concept
  subject: 历史
  title: 礼崩乐坏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将礼崩乐坏理解为所有礼仪和音乐全部消失，实际指西周制度遭到破坏。
    - 能指出并纠正这一错误：误以为礼崩乐坏是民众自发反抗导致，忽视诸侯争霸和权力下移的推动。
  aliases: []
  category: 历史概念
  explanation: 指西周的各种制度逐渐遭到破坏，社会处于动荡和变化的状态。
  misconceptions:
    - 将礼崩乐坏理解为所有礼仪和音乐全部消失，实际指西周制度遭到破坏。
    - 误以为礼崩乐坏是民众自发反抗导致，忽视诸侯争霸和权力下移的推动。
    - 认为礼崩乐坏只在春秋末期，忽视整个春秋时期都处于逐渐破坏过程。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:社会主义初级阶段理论
  type: Concept
  subject: 历史
  title: 社会主义初级阶段理论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为社会主义初级阶段泛指任何国家进入社会主义都必须经历的阶段，如苏联也适用。
    - 能指出并纠正这一错误：把初级阶段的主要矛盾表述为‘人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾’，混淆了新…
  aliases: []
  category: 历史概念
  explanation: 中共十三大系统阐述，指出我国已是社会主义社会但处于初级阶段，主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。
  misconceptions:
    - 误认为社会主义初级阶段泛指任何国家进入社会主义都必须经历的阶段，如苏联也适用。
    - 把初级阶段的主要矛盾表述为‘人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾’，混淆了新时代表述。
    - 误以为初级阶段起始于新中国成立之时，实际是1956年三大改造完成后才进入。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S4.md
- id: concept:历史:社会主义力量壮大
  type: Concept
  subject: 历史
  title: 社会主义力量壮大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为二战后社会主义国家都在欧洲，忽视亚洲和拉美。
    - 能指出并纠正这一错误：只想到苏联和东欧，忽略中国、朝鲜、越南等亚洲国家。
  aliases: []
  category: 历史概念
  explanation: 二战后东欧、亚洲、拉丁美洲出现多个社会主义国家，社会主义力量增强。
  misconceptions:
    - 误认为二战后社会主义国家都在欧洲，忽视亚洲和拉美。
    - 只想到苏联和东欧，忽略中国、朝鲜、越南等亚洲国家。
    - 误以为社会主义力量壮大仅在二战后初期，忽视继续发展。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:社会主义市场经济体制
  type: Concept
  subject: 历史
  title: 社会主义市场经济体制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为社会主义市场经济就是完全由市场调节，不需要国家宏观调控
    - 能指出并纠正这一错误：把提出时间误记为1997年十五大，实际是1992年十四大
  aliases:
    - 社会主义市场经济
  category: 经济体制
  explanation: 1992年中共十四大提出，是同社会主义基本制度结合在一起的，使市场在国家宏观调控下对资源配置起基础性作用的经济体制。
  misconceptions:
    - 认为社会主义市场经济就是完全由市场调节，不需要国家宏观调控
    - 把提出时间误记为1997年十五大，实际是1992年十四大
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:社会主义建设总路线
  type: Concept
  subject: 历史
  title: 社会主义建设总路线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将总路线内容记成“鼓足干劲，力争上游，多快好省”，但顺序颠倒或漏掉“好省”。
    - 能指出并纠正这一错误：误认为总路线是在1949年提出，或与“一化三改”总路线混淆。
  aliases:
    - 鼓足干劲、力争上游、多快好省地建设社会主义
  category: 方针政策
  explanation: 1958年中共八大二次会议提出“鼓足干劲、力争上游、多快好省地建设社会主义”的总路线，反映了人民愿望但急于求成。
  misconceptions:
    - 将总路线内容记成“鼓足干劲，力争上游，多快好省”，但顺序颠倒或漏掉“好省”。
    - 误认为总路线是在1949年提出，或与“一化三改”总路线混淆。
    - 认为总路线完全正确，没有急于求成的弊病，或把总路线等同于大跃进运动。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:社会主义建设道路的探索
  type: Concept
  subject: 历史
  title: 社会主义建设道路的探索
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为探索时期是从1949年开始，忽略1956年中共八大的“良好开端”。
    - 能指出并纠正这一错误：把“探索”完全等同于犯错误，忽视期间取得的工业、国防等成就。
  aliases:
    - 探索社会主义建设道路
  category: 历史概念
  explanation: 指1956年后中国共产党探索适合中国国情的社会主义建设道路的过程，包括良好开端、曲折失误和成就。
  misconceptions:
    - 误认为探索时期是从1949年开始，忽略1956年中共八大的“良好开端”。
    - 把“探索”完全等同于犯错误，忽视期间取得的工业、国防等成就。
    - 认为探索道路是照搬苏联模式，没有自己的创新。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:社会主义本质论
  type: Concept
  subject: 历史
  title: 社会主义本质论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把社会主义本质等同于公有制和按劳分配，忽视解放和发展生产力是本质的首要内容。
    - 能指出并纠正这一错误：认为‘最终达到共同富裕’就是同时、同步富裕，忽略了允许一部分人先富起来的现实路径。
  aliases:
    - 社会主义本质
  category: 思想理论
  explanation: 邓小平指出社会主义的本质是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。
  misconceptions:
    - 把社会主义本质等同于公有制和按劳分配，忽视解放和发展生产力是本质的首要内容。
    - 认为‘最终达到共同富裕’就是同时、同步富裕，忽略了允许一部分人先富起来的现实路径。
    - 误以为社会主义本质是‘计划经济’，将手段误认为本质。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:社会主义核心价值体系
  type: Concept
  subject: 历史
  title: 社会主义核心价值体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把社会主义核心价值体系等同于社会主义核心价值观，忽视前者是后者的基础。
    - 能指出并纠正这一错误：将马克思主义指导思想与中国特色社会主义共同理想在体系中的位置颠倒。
  aliases:
    - 核心价值体系
  category: 政治概念
  explanation: 2006年中共十六届六中全会提出，是建设社会主义文化强国的根本任务，包括马克思主义指导思想、中国特色社会主义共同理想等。
  misconceptions:
    - 把社会主义核心价值体系等同于社会主义核心价值观，忽视前者是后者的基础。
    - 将马克思主义指导思想与中国特色社会主义共同理想在体系中的位置颠倒。
    - 认为该体系是2008年提出的，实际是2006年十六届六中全会。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S2.md
- id: concept:历史:社会主义民主法制建设
  type: Concept
  subject: 历史
  title: 社会主义民主法制建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将1982年宪法当作新中国第一部宪法，实际第一部是1954年宪法。
    - 能指出并纠正这一错误：把《民族区域自治法》的颁布时间记为1980年，实际是1984年。
  aliases: []
  category: 历史概念
  explanation: 1982年新宪法通过，1984年民族区域自治法颁布，并制定多部法律，推进基层民主建设。
  misconceptions:
    - 误将1982年宪法当作新中国第一部宪法，实际第一部是1954年宪法。
    - 把《民族区域自治法》的颁布时间记为1980年，实际是1984年。
    - 认为基层民主建设只在农村推动，忽略城市社区和企业民主管理。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:社会主义精神文明建设
  type: Concept
  subject: 历史
  title: 社会主义精神文明建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘五讲四美三热爱’是改革开放前提出的，实际是1981年开始的‘五讲四美’，1983年才增‘…
    - 能指出并纠正这一错误：把精神文明建设单纯视为道德建设，忽略教育科学文化建设等内容。
  aliases: []
  category: 历史概念
  explanation: 20世纪80年代开展“五讲四美三热爱”活动，涌现先锋模范，为现代化建设提供精神动力。
  misconceptions:
    - 误以为‘五讲四美三热爱’是改革开放前提出的，实际是1981年开始的‘五讲四美’，1983年才增‘三热爱’活动。
    - 把精神文明建设单纯视为道德建设，忽略教育科学文化建设等内容。
    - 误以为精神文明建设为物质文明建设提供物质基础，实际提供精神动力和智力支持。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S3.md
- id: concept:历史:社会主要矛盾
  type: Concept
  subject: 历史
  title: 社会主要矛盾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：仍把新时代社会主要矛盾表述为人民日益增长的物质文化需要同落后的社会生产之间的矛盾。
    - 能指出并纠正这一错误：认为我国社会主要矛盾已彻底解决，不再存在发展不平衡不充分的问题。
  aliases: []
  category: 理论概念
  explanation: 新时代我国社会主要矛盾转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。
  misconceptions:
    - 仍把新时代社会主要矛盾表述为人民日益增长的物质文化需要同落后的社会生产之间的矛盾。
    - 认为我国社会主要矛盾已彻底解决，不再存在发展不平衡不充分的问题。
    - 将‘发展不平衡不充分’仅仅归结为城乡差距，忽略了区域、收入等其他方面。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:社会保障制度
  type: Concept
  subject: 历史
  title: 社会保障制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为社会保障制度只包括社会保险，不包括社会救济和社会福利
    - 能指出并纠正这一错误：认为社会保障制度是资本主义国家独有，社会主义国家没有建立
  aliases:
    - social security system
  category: 制度
  explanation: 社会保障制度是国家通过立法和行政措施，为公民提供社会保险、救济等保障的制度。
  misconceptions:
    - 认为社会保障制度只包括社会保险，不包括社会救济和社会福利
    - 认为社会保障制度是资本主义国家独有，社会主义国家没有建立
    - 认为社会保障制度始于工业革命后，忽略古代已有灾害救济等措施
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S4.md
- id: concept:历史:社会矛盾加剧
  type: Concept
  subject: 历史
  title: 社会矛盾加剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为社会矛盾加剧仅表现为农民起义，忽略官僚腐败、财政危机和土地兼并等诱因。
    - 能指出并纠正这一错误：把土地兼并看作经济发展，实际是农民破产、矛盾激化的重要原因。
  aliases:
    - 不断加剧的社会矛盾
  category: 历史
  explanation: 清朝中期以后，官僚腐败、财政危机、土地兼并严重，导致社会矛盾不断加剧。
  misconceptions:
    - 以为社会矛盾加剧仅表现为农民起义，忽略官僚腐败、财政危机和土地兼并等诱因。
    - 把土地兼并看作经济发展，实际是农民破产、矛盾激化的重要原因。
    - 认为矛盾加剧出现于鸦片战争后，实际在乾隆中后期已明显显现。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:祖冲之
  type: Concept
  subject: 历史
  title: 祖冲之
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为祖冲之是北朝人，实际他是南朝宋齐之间人。
    - 能指出并纠正这一错误：误把地动仪的发明安到祖冲之头上，实际是张衡所造。
  aliases: []
  category: 历史人物
  explanation: 南朝宋齐之间的杰出科学家，在数学、天文历法和机械制造方面有重大成就，将圆周率精确到小数点后第七位。
  misconceptions:
    - 误认为祖冲之是北朝人，实际他是南朝宋齐之间人。
    - 误把地动仪的发明安到祖冲之头上，实际是张衡所造。
    - 误以为圆周率精确值就是3.1415926，实际是两数之间的范围。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:神人兽面纹
  type: Concept
  subject: 历史
  title: 神人兽面纹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为神人兽面纹出土于红山文化，实际是良渚文化
    - 能指出并纠正这一错误：认为它只是普通装饰图案，没有反映统一的崇拜对象
  aliases:
    - 神徽
  category: 考古发现
  explanation: 良渚文化玉器上的纹饰，反映统一的崇拜对象，被称为“神徽”。
  misconceptions:
    - 误以为神人兽面纹出土于红山文化，实际是良渚文化
    - 认为它只是普通装饰图案，没有反映统一的崇拜对象
    - 把神人兽面纹和商代青铜器上的饕餮纹混为一谈
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:禅让制
  type: Concept
  subject: 历史
  title: 禅让制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为禅让制是夏朝开始时的制度，实际是尧舜禹时期
    - 能指出并纠正这一错误：认为禅让制是父传子，实际是选贤德之人
  aliases: []
  category: 政治制度
  explanation: 传说中尧舜禹时期首领传位给贤德之人的制度。
  misconceptions:
    - 误以为禅让制是夏朝开始时的制度，实际是尧舜禹时期
    - 认为禅让制是父传子，实际是选贤德之人
    - 以为禅让制在禹之后仍然延续，实际终止于启
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:福利国家
  type: Concept
  subject: 历史
  title: 福利国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为福利国家是社会主义国家建立的，实际是资本主义国家。
    - 能指出并纠正这一错误：认为福利国家能消除贫富差距，实际只是缓和矛盾。
  aliases:
    - 社会保障制度
  category: 社会制度
  explanation: 二战后主要资本主义国家建立的社会保障制度，包括医疗、养老、失业等保障。
  misconceptions:
    - 误认为福利国家是社会主义国家建立的，实际是资本主义国家。
    - 认为福利国家能消除贫富差距，实际只是缓和矛盾。
    - 把福利国家出现时间记为一战后，实际是二战后。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:私营经济法律地位确认
  type: Concept
  subject: 历史
  title: 私营经济法律地位确认
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1982年宪法已明确私营经济的补充地位，实际是1988年宪法修正案才确认。
    - 能指出并纠正这一错误：将私营经济地位表述为‘社会主义市场经济的重要组成部分’，这是1999年修宪的内容，混淆历史阶段。
  aliases:
    - 私营经济补充地位
  category: 经济体制改革
  explanation: 1988年宪法修正案明确私营经济是社会主义公有制经济的补充，确认其法律地位。
  misconceptions:
    - 误认为1982年宪法已明确私营经济的补充地位，实际是1988年宪法修正案才确认。
    - 将私营经济地位表述为‘社会主义市场经济的重要组成部分’，这是1999年修宪的内容，混淆历史阶段。
    - 以为私营经济从一开始就合法，忽略了1988年前个体经济有地位，私营经济未获法律承认。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:秋收起义
  type: Concept
  subject: 历史
  title: 秋收起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为秋收起义打响了武装反抗国民党的第一枪，实际那是南昌起义
    - 能指出并纠正这一错误：把秋收起义领导人写成周恩来、贺龙，实际是毛泽东
  aliases: []
  category: 历史事件
  explanation: 1927年9月，毛泽东在湘赣边界发动秋收起义，打出“工农革命军”的旗帜，后放弃攻打长沙，改向山区进军。
  misconceptions:
    - 误认为秋收起义打响了武装反抗国民党的第一枪，实际那是南昌起义
    - 把秋收起义领导人写成周恩来、贺龙，实际是毛泽东
    - 误认为秋收起义最初就决定转向农村，实际是先攻打长沙受挫后改向山区
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:秋瑾
  type: Concept
  subject: 历史
  title: 秋瑾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为秋瑾直接参加了安庆起义，实际她是在绍兴密谋策应，未到安庆。
    - 能指出并纠正这一错误：把秋瑾说成同盟会首位女会员，缺乏史据，她先入光复会，后加入同盟会。
  aliases: []
  category: 历史人物
  explanation: 革命党人，在浙江绍兴策应安庆起义，被捕后英勇就义。
  misconceptions:
    - 误认为秋瑾直接参加了安庆起义，实际她是在绍兴密谋策应，未到安庆。
    - 把秋瑾说成同盟会首位女会员，缺乏史据，她先入光复会，后加入同盟会。
    - 误将秋瑾就义时间说成1906年，实际是1907年安庆起义失败后。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:种姓制度
  type: Concept
  subject: 历史
  title: 种姓制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把四个等级顺序搞反，如将首陀罗当作最高等级，实际是婆罗门最高。
    - 能指出并纠正这一错误：认为种姓制度是古埃及实行的等级制度，实际是古代印度的社会制度。
  aliases: []
  category: 历史
  explanation: 种姓制度是古代印度的社会等级制度，分为婆罗门、刹帝利、吠舍、首陀罗四个等级，各等级世袭。
  misconceptions:
    - 把四个等级顺序搞反，如将首陀罗当作最高等级，实际是婆罗门最高。
    - 认为种姓制度是古埃及实行的等级制度，实际是古代印度的社会制度。
    - 误以为不同种姓之间可以通婚和自由改变职业，实际各等级世袭。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S3.md
- id: concept:历史:科举制
  type: Concept
  subject: 历史
  title: 科举制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为科举制是唐朝设立，实际标志是隋炀帝设进士科
    - 能指出并纠正这一错误：把进士科创立者说成隋文帝，实际是隋炀帝
  aliases:
    - 科举制度
  category: 制度
  explanation: 隋炀帝设置进士科，标志着科举制创立，通过考试选拔人才，加强了中央集权，扩大了统治基础，延续约1300年。
  misconceptions:
    - 误认为科举制是唐朝设立，实际标志是隋炀帝设进士科
    - 把进士科创立者说成隋文帝，实际是隋炀帝
    - 认为科举制始终只考诗赋，忽略其内容随朝代变化而演变
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S2.md
- id: concept:历史:科举制的创立
  type: Concept
  subject: 历史
  title: 科举制的创立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为隋文帝设置进士科，实际隋炀帝设置进士科标志科举制创立
    - 能指出并纠正这一错误：把科举制创立时间说成唐朝，如'唐太宗创立科举制'
  aliases:
    - 科举制度
  category: 历史事件
  explanation: 隋文帝废除前朝选官制度，隋炀帝设置进士科，标志着科举制创立，通过考试选拔人才，影响深远。
  misconceptions:
    - 认为隋文帝设置进士科，实际隋炀帝设置进士科标志科举制创立
    - 把科举制创立时间说成唐朝，如'唐太宗创立科举制'
    - 误以为科举制靠推荐人才，实际是分科考试选拔
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S1.md
- id: concept:历史:科举制的发展
  type: Concept
  subject: 历史
  title: 科举制的发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为殿试是唐朝开创，实际是宋朝成为定制。
    - 能指出并纠正这一错误：以为宋朝科举只考诗赋，忽略经义策论。
  aliases: []
  category: 制度
  explanation: 宋朝改革科举，殿试成为定制，增加取士名额，扩大统治基础。
  misconceptions:
    - 认为殿试是唐朝开创，实际是宋朝成为定制。
    - 以为宋朝科举只考诗赋，忽略经义策论。
    - 将糊名制度归为明朝，实际宋朝已实行。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:科学发展观
  type: Concept
  subject: 历史
  title: 科学发展观
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为科学发展观的第一要义是‘以人为本’，核心是‘发展’。
    - 能指出并纠正这一错误：将‘全面协调可持续’当作根本方法，把‘统筹兼顾’当作基本要求。
  aliases: []
  category: 指导思想
  explanation: 坚持以人为本，树立全面、协调、可持续的发展观，促进经济社会和人的全面发展。第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。
  misconceptions:
    - 认为科学发展观的第一要义是‘以人为本’，核心是‘发展’。
    - 将‘全面协调可持续’当作根本方法，把‘统筹兼顾’当作基本要求。
    - 误认为科学发展观只关注经济发展，不重视人的全面发展。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:科学技术是第一生产力
  type: Concept
  subject: 历史
  title: 科学技术是第一生产力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘科学技术是第一生产力’是毛泽东提出的，实际是邓小平在1988年提出的。
    - 能指出并纠正这一错误：把‘第一生产力’理解为唯一生产力，认为劳动和资本不再创造价值。
  aliases:
    - 科技是第一生产力
  category: 思想理论
  explanation: 邓小平强调科学技术是第一生产力，高科技领域的发展能带动产业进步。
  misconceptions:
    - 误以为‘科学技术是第一生产力’是毛泽东提出的，实际是邓小平在1988年提出的。
    - 把‘第一生产力’理解为唯一生产力，认为劳动和资本不再创造价值。
    - 误认为只有高科技领域才算科学技术，忽视科技在农业、制造业等传统产业中的作用。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:科技强军战略
  type: Concept
  subject: 历史
  title: 科技强军战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为科技强军战略只指增加武器装备数量，忽略人才培养和科技转化
    - 能指出并纠正这一错误：将科技强军与科教兴国混为一谈，认为两者内容相同
  aliases: []
  category: 军事战略
  explanation: 国家实施科技强军战略，增加国防投入，发展武器装备。
  misconceptions:
    - 误以为科技强军战略只指增加武器装备数量，忽略人才培养和科技转化
    - 将科技强军与科教兴国混为一谈，认为两者内容相同
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S3.md
- id: concept:历史:科教兴国战略
  type: Concept
  subject: 历史
  title: 科教兴国战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为科教兴国是1992年十四大提出，实际是1995年确定
    - 能指出并纠正这一错误：把科教兴国误解为只重视教育，忽视科技第一生产力
  aliases: []
  category: 发展战略
  explanation: 1995年中共中央确定实施，全面落实科学技术是第一生产力的思想，把经济建设转移到依靠科技进步和提高劳动者素质的轨道上来。
  misconceptions:
    - 认为科教兴国是1992年十四大提出，实际是1995年确定
    - 把科教兴国误解为只重视教育，忽视科技第一生产力
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:租地农场
  type: Concept
  subject: 历史
  title: 租地农场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把租地农场主当成封建地主，实际是富裕农民和资本家
    - 能指出并纠正这一错误：认为租地农场产品自给自足，实际面向市场
  aliases: []
  category: 经济制度
  explanation: 富裕农民集中土地，采用新的生产方式经营，雇用农民耕种，产品面向市场，是农业资本主义化的表现。
  misconceptions:
    - 把租地农场主当成封建地主，实际是富裕农民和资本家
    - 认为租地农场产品自给自足，实际面向市场
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:秦始皇陵兵马俑
  type: Concept
  subject: 历史
  title: 秦始皇陵兵马俑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为兵马俑是西汉时期的陪葬品，实际是秦始皇陵的陪葬物。
    - 能指出并纠正这一错误：认为兵马俑是用真人真马塑造，实际是陶土烧制而成。
  aliases:
    - 兵马俑
  category: 历史遗迹
  explanation: 位于陕西西安临潼的秦始皇陵陪葬坑中出土的陶制兵马俑，是20世纪中国最重大的考古成就之一。
  misconceptions:
    - 误以为兵马俑是西汉时期的陪葬品，实际是秦始皇陵的陪葬物。
    - 认为兵马俑是用真人真马塑造，实际是陶土烧制而成。
    - 将兵马俑的出土时间误认为秦始皇统一六国之前，实际是在秦朝建立后建造。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:秦朝的灭亡
  type: Concept
  subject: 历史
  title: 秦朝的灭亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为秦朝是被项羽直接攻灭的，实际是刘邦率军抵达咸阳，秦朝统治者出降。
    - 能指出并纠正这一错误：认为秦朝灭亡于公元前206年，实际是公元前207年（秦亡于子婴降汉）。
  aliases:
    - 秦亡
  category: 历史事件
  explanation: 公元前207年，刘邦率军直抵咸阳，秦朝统治者出城投降，秦朝灭亡。
  misconceptions:
    - 误以为秦朝是被项羽直接攻灭的，实际是刘邦率军抵达咸阳，秦朝统治者出降。
    - 认为秦朝灭亡于公元前206年，实际是公元前207年（秦亡于子婴降汉）。
    - 因果颠倒，认为是秦朝的灭亡导致了巨鹿之战，实际巨鹿之战是秦末农民战争中的关键战役，加速了秦亡。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S2.md
- id: concept:历史:秦的暴政
  type: Concept
  subject: 历史
  title: 秦的暴政
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为秦的暴政只是赋税沉重，忽略徭役和法律严苛
    - 能指出并纠正这一错误：认为秦亡仅因暴政，忽视六国旧贵族等其它因素
  aliases: []
  category: 历史概念
  explanation: 秦朝赋税沉重、徭役繁重、法律严苛，导致社会矛盾激化。
  misconceptions:
    - 以为秦的暴政只是赋税沉重，忽略徭役和法律严苛
    - 认为秦亡仅因暴政，忽视六国旧贵族等其它因素
    - 将秦的暴政等同于焚书坑儒，实际暴政范围更广
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:秦统一六国
  type: Concept
  subject: 历史
  title: 秦统一六国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为秦统一六国的时间是公元前202年，与西汉建立混淆
    - 能指出并纠正这一错误：认为秦统一六国后定都洛阳，实际定都咸阳
  aliases:
    - 秦灭六国
    - 秦统一
  category: 历史事件
  explanation: 公元前221年，秦王嬴政灭六国，建立秦朝，定都咸阳，是中国历史上第一个统一多民族的封建国家。
  misconceptions:
    - 误以为秦统一六国的时间是公元前202年，与西汉建立混淆
    - 认为秦统一六国后定都洛阳，实际定都咸阳
    - 把秦统一六国与建立秦朝看成两件事，实际同年完成
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:程朱理学
  type: Concept
  subject: 历史
  title: 程朱理学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把陆九渊的‘心即理’当成程朱理学观点，实际程朱主张‘理在气先’、格物致知。
    - 能指出并纠正这一错误：认为程朱理学由宋代二程和朱熹共同创立，却误称其形成于唐代或明代。
  aliases:
    - 理学
  category: 思想文化
  explanation: 宋代儒学在兼收并蓄基础上形成，以程颢、程颐和朱熹为代表。
  misconceptions:
    - 误把陆九渊的‘心即理’当成程朱理学观点，实际程朱主张‘理在气先’、格物致知。
    - 认为程朱理学由宋代二程和朱熹共同创立，却误称其形成于唐代或明代。
    - 将程朱理学与汉代今文经学混为一谈，忽略其融合佛道后的新儒学特征。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:稷下学宫
  type: Concept
  subject: 历史
  title: 稷下学宫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为稷下学宫是秦朝统一后设立的中央官学
    - 能指出并纠正这一错误：把稷下学宫说成是鲁国为孔子讲学而设
  aliases: []
  category: 历史机构
  explanation: 战国时期齐国设立的讲学场所，促进了学术繁荣。
  misconceptions:
    - 认为稷下学宫是秦朝统一后设立的中央官学
    - 把稷下学宫说成是鲁国为孔子讲学而设
    - 认为稷下学宫是老子在楚国开办的学校
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:穆斯林公社
  type: Concept
  subject: 历史
  title: 穆斯林公社
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为穆斯林公社是纯粹的政治组织，实际是以信仰为基础的宗教社团
    - 能指出并纠正这一错误：误认为穆罕默德在麦加建立公社，实际是迁居麦地那后建立
  aliases:
    - 乌玛
  category: 政治组织
  explanation: 622年穆罕默德迁居麦地那后建立的以共同信仰为基础的宗教社团，是阿拉伯国家的雏形。
  misconceptions:
    - 误认为穆斯林公社是纯粹的政治组织，实际是以信仰为基础的宗教社团
    - 误认为穆罕默德在麦加建立公社，实际是迁居麦地那后建立
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:突厥
  type: Concept
  subject: 历史
  title: 突厥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为突厥在西藏地区，与吐蕃混淆
    - 能指出并纠正这一错误：误认为突厥从未分裂，始终是一个整体，忽略东西突厥
  aliases: []
  category: 民族
  explanation: 6世纪兴起于阿尔泰山的游牧部落，曾建立汗国，后分裂为东西突厥，最终解体。
  misconceptions:
    - 误认为突厥在西藏地区，与吐蕃混淆
    - 误认为突厥从未分裂，始终是一个整体，忽略东西突厥
    - 误认为唐朝灭突厥后，突厥完全消失，实际有部分融入其他民族
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:章西女王
  type: Concept
  subject: 历史
  title: 章西女王
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为她是印度资产阶级独立运动领袖，实际是民族大起义反英领袖。
    - 能指出并纠正这一错误：认为她领导起义成功推翻英国统治，实际失败并壮烈牺牲。
  aliases:
    - 拉克希米·巴伊
  category: 历史人物
  explanation: 印度民族大起义中的领袖之一，领导章西军民反抗英军，最终壮烈牺牲。
  misconceptions:
    - 误以为她是印度资产阶级独立运动领袖，实际是民族大起义反英领袖。
    - 认为她领导起义成功推翻英国统治，实际失败并壮烈牺牲。
    - 将章西女王当作拉丁美洲独立运动的人物，实际她是印度人。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:第13届冬季残奥会
  type: Concept
  subject: 历史
  title: 第13届冬季残奥会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把2022年北京冬残奥会说成第12届或第24届，混淆残奥会与冬奥会的届数。
    - 能指出并纠正这一错误：误以为2022年北京冬残奥会是夏季残奥会，或认为中国首次举办残奥会。
  aliases:
    - 北京冬残奥会
  category: 体育盛事
  explanation: 2022年在北京成功举办，展现中国对残疾人体育事业的重视。
  misconceptions:
    - 把2022年北京冬残奥会说成第12届或第24届，混淆残奥会与冬奥会的届数。
    - 误以为2022年北京冬残奥会是夏季残奥会，或认为中国首次举办残奥会。
    - 将冬残奥会的成功举办归因于“展现中国体育强大”，而忽略对残疾人事业的重视。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:第一个五年计划
  type: Concept
  subject: 历史
  title: 第一个五年计划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把第一个五年计划开始执行的时间记为1950年，与抗美援朝开始时间混淆。
    - 能指出并纠正这一错误：认为一五计划优先发展农业和轻工业，颠倒了重点发展重工业的方针。
  aliases:
    - 一五计划
  category: 经济计划
  explanation: 1953年开始执行，集中力量发展重工业，为社会主义工业化奠定基础。
  misconceptions:
    - 把第一个五年计划开始执行的时间记为1950年，与抗美援朝开始时间混淆。
    - 认为一五计划优先发展农业和轻工业，颠倒了重点发展重工业的方针。
    - 误把武汉长江大桥的建成归功于第二个五年计划，时间错位。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:第一个百年奋斗目标
  type: Concept
  subject: 历史
  title: 第一个百年奋斗目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为第一个百年奋斗目标在2020年就已实现，实际是2021年建党百年时。
    - 能指出并纠正这一错误：把全面建成小康社会与全面建成社会主义现代化强国混淆，两者分属第一和第二个百年目标。
  aliases:
    - 全面建成小康社会
  category: 历史事件
  explanation: 指到中国共产党成立100年时，全面建成小康社会，实现中华民族伟大复兴的第一个百年目标。
  misconceptions:
    - 认为第一个百年奋斗目标在2020年就已实现，实际是2021年建党百年时。
    - 把全面建成小康社会与全面建成社会主义现代化强国混淆，两者分属第一和第二个百年目标。
    - 误认为第一个百年目标包括“实现现代化”，实际是“全面小康”。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:第一国际
  type: Concept
  subject: 历史
  title: 第一国际
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为第一国际就是巴黎公社，实际第一国际成立于1864年，早于巴黎公社
    - 能指出并纠正这一错误：认为第一国际是马克思个人创立的组织，实际是多个工人团体联合
  aliases:
    - 国际工人协会
  category: 组织
  explanation: 1864年成立的国际工人协会，马克思是创始人之一，努力联合各国工人阶级进行经济斗争。
  misconceptions:
    - 误认为第一国际就是巴黎公社，实际第一国际成立于1864年，早于巴黎公社
    - 认为第一国际是马克思个人创立的组织，实际是多个工人团体联合
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:第一届全国人民代表大会
  type: Concept
  subject: 历史
  title: 第一届全国人民代表大会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为第一届全国人民代表大会通过了《共同纲领》，混淆了与1949年政协会议的作用。
    - 能指出并纠正这一错误：把一届人大召开的时间记为1953年，与过渡时期总路线提出时间混淆。
  aliases:
    - 一届人大
  category: 历史事件
  explanation: 1954年在北京召开，通过了《中华人民共和国宪法》，选举了国家领导人。
  misconceptions:
    - 认为第一届全国人民代表大会通过了《共同纲领》，混淆了与1949年政协会议的作用。
    - 把一届人大召开的时间记为1953年，与过渡时期总路线提出时间混淆。
    - 误以为一届人大选举的是刘少奇为国家主席，实际是毛泽东。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:第一次世界大战
  type: Concept
  subject: 历史
  title: 第一次世界大战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一战是正义与邪恶的较量，实际是帝国主义非正义战争。
    - 能指出并纠正这一错误：将同盟国阵营记错，以为包含英法，实际是德奥意（后意转协约）。
  aliases:
    - 一战
  category: 历史事件
  explanation: 1914-1918年爆发的帝国主义战争，以同盟国失败告终，削弱了欧洲力量，促进了民族觉醒。
  misconceptions:
    - 认为一战是正义与邪恶的较量，实际是帝国主义非正义战争。
    - 将同盟国阵营记错，以为包含英法，实际是德奥意（后意转协约）。
    - 把萨拉热窝事件当作一战根本原因，实际只是导火索，根源在帝国主义矛盾。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:第一次工人运动高潮
  type: Concept
  subject: 历史
  title: 第一次工人运动高潮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把第一次工人运动高潮时间记成1921年初至1922年，起点提前
    - 能指出并纠正这一错误：误以为第一次工人运动高潮是在中共二大之后才出现的
  aliases: []
  category: 历史事件
  explanation: 从1922年初到1923年春，全国掀起第一次工人运动高潮，举行大小罢工100多次，参加人数达30万以上。
  misconceptions:
    - 把第一次工人运动高潮时间记成1921年初至1922年，起点提前
    - 误以为第一次工人运动高潮是在中共二大之后才出现的
    - 以偏概全，认为高潮只发生在铁路工人中，忽略了其他行业
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:第三次科技革命
  type: Concept
  subject: 历史
  title: 第三次科技革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为第三次科技革命开始于19世纪末，实际是20世纪四五十年代。
    - 能指出并纠正这一错误：把第三次科技革命与第二次工业革命混淆，如蒸汽机。
  aliases: []
  category: 历史事件
  explanation: 20世纪四五十年代以来在原子能、电子计算机等领域取得的重大突破，提高社会生产力。
  misconceptions:
    - 误认为第三次科技革命开始于19世纪末，实际是20世纪四五十年代。
    - 把第三次科技革命与第二次工业革命混淆，如蒸汽机。
    - 误认为第三次科技革命只有信息技术，忽略原子能、航天等。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S2.md
- id: concept:历史:第二个百年奋斗目标
  type: Concept
  subject: 历史
  title: 第二个百年奋斗目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为第二个百年奋斗目标在2049年实现，实际是2049年（新中国成立一百年）但通常说2050年左…
    - 能指出并纠正这一错误：将第二个百年目标内容表述为“建成现代化国家”，漏掉“富强民主文明和谐美丽”等限定词。
  aliases:
    - 全面建成社会主义现代化强国
  category: 历史事件
  explanation: 指到新中国成立100年时，把我国建成富强民主文明和谐美丽的社会主义现代化强国，实现中华民族伟大复兴。
  misconceptions:
    - 认为第二个百年奋斗目标在2049年实现，实际是2049年（新中国成立一百年）但通常说2050年左右，更准确是2049年。
    - 将第二个百年目标内容表述为“建成现代化国家”，漏掉“富强民主文明和谐美丽”等限定词。
    - 误以为第二个百年目标是“全面建成小康社会”，与第一个百年目标混淆。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:第二次世界大战
  type: Concept
  subject: 历史
  title: 第二次世界大战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为二战爆发始于1937年日本全面侵华
    - 能指出并纠正这一错误：认为二战结束时间只是1945年8月日本投降，忽略德国5月已投降
  aliases:
    - 二战
  category: 历史事件
  explanation: 1939年9月1日德国突袭波兰，英法宣战，二战全面爆发，最终以反法西斯同盟胜利告终。
  misconceptions:
    - 认为二战爆发始于1937年日本全面侵华
    - 认为二战结束时间只是1945年8月日本投降，忽略德国5月已投降
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:第二次世界大战的胜利
  type: Concept
  subject: 历史
  title: 第二次世界大战的胜利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把德国投降时间记成1945年9月，日本投降记成5月
    - 能指出并纠正这一错误：认为二战胜利只是美国的功劳，忽略苏联和中国的贡献
  aliases: []
  category: 历史事件
  explanation: 1945年5月德国投降，9月日本投降，二战结束，对世界历史产生深远影响。
  misconceptions:
    - 把德国投降时间记成1945年9月，日本投降记成5月
    - 认为二战胜利只是美国的功劳，忽略苏联和中国的贡献
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S3.md
- id: concept:历史:第二次国共合作
  type: Concept
  subject: 历史
  title: 第二次国共合作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为第二次国共合作是党内合作，实际为党外合作无统一组织
    - 能指出并纠正这一错误：认为西安事变标志着第二次国共合作正式形成，实际是初步形成
  aliases: []
  category: 历史概念
  explanation: 在抗日民族统一战线旗帜下，国共两党实现第二次合作，共同抗日。
  misconceptions:
    - 误以为第二次国共合作是党内合作，实际为党外合作无统一组织
    - 认为西安事变标志着第二次国共合作正式形成，实际是初步形成
    - 把第二次国共合作结束时间说成1946年全面内战爆发，实际是抗战胜利后并未立即破裂
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:第二次工业革命
  type: Concept
  subject: 历史
  title: 第二次工业革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为第二次工业革命开始于18世纪，实为19世纪六七十年代
    - 能指出并纠正这一错误：把第二次工业革命的特点说成是蒸汽动力，实为电力与科学研究结合
  aliases:
    - 电气革命
  category: 历史事件
  explanation: 19世纪六七十年代开始的第二次工业革命，特点是科学研究同工业生产紧密结合，使人类社会进入“电气时代”。
  misconceptions:
    - 误认为第二次工业革命开始于18世纪，实为19世纪六七十年代
    - 把第二次工业革命的特点说成是蒸汽动力，实为电力与科学研究结合
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:第二次鸦片战争
  type: Concept
  subject: 历史
  title: 第二次鸦片战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将火烧圆明园归因于八国联军，实际是英法联军所为
    - 能指出并纠正这一错误：认为第二次鸦片战争爆发于1840年，与鸦片战争时间混淆
  aliases: []
  category: 历史事件
  explanation: 1856年至1860年英法联军发动的侵华战争，期间火烧圆明园，签订《北京条约》，进一步加深了中国半殖民地化程度。
  misconceptions:
    - 误将火烧圆明园归因于八国联军，实际是英法联军所为
    - 认为第二次鸦片战争爆发于1840年，与鸦片战争时间混淆
    - 把《北京条约》误认为《南京条约》的补充条约，实际是第二次鸦片战争后签订
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:第二次鸦片战争的影响
  type: Concept
  subject: 历史
  title: 第二次鸦片战争的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《南京条约》当作第二次鸦片战争后签订，实际签订的是《天津条约》《北京条约》
    - 能指出并纠正这一错误：误以为第二次鸦片战争使中国开始沦为半殖民地，而非半殖民地化程度进一步加深
  aliases: []
  category: 历史影响
  explanation: 第二次鸦片战争使中国丧失更多主权，西方侵略势力深入长江中下游地区，半殖民地化程度进一步加深。
  misconceptions:
    - 误将《南京条约》当作第二次鸦片战争后签订，实际签订的是《天津条约》《北京条约》
    - 误以为第二次鸦片战争使中国开始沦为半殖民地，而非半殖民地化程度进一步加深
    - 误认为第二次鸦片战争后外国势力仅限沿海，忽略侵略势力深入长江中下游地区
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:第二炮兵部队
  type: Concept
  subject: 历史
  title: 第二炮兵部队
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为第二炮兵部队是常规地面炮兵部队，实则它是导弹部队。
    - 能指出并纠正这一错误：误认为第二炮兵部队诞生于改革开放后，实际是1966年组建。
  aliases:
    - 导弹部队
  category: 历史事实
  explanation: 1966年正式组建的导弹部队，是中国实施战略威慑的核心力量。
  misconceptions:
    - 误以为第二炮兵部队是常规地面炮兵部队，实则它是导弹部队。
    - 误认为第二炮兵部队诞生于改革开放后，实际是1966年组建。
    - 将第二炮兵部队与2015年成立的火箭军视为两支无关部队，实则后者是前者更名而来。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S3.md
- id: concept:历史:第五次反“围剿”
  type: Concept
  subject: 历史
  title: 第五次反“围剿”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把第五次反“围剿”开始时间记成1934年9月，实际是1933年9月。
    - 能指出并纠正这一错误：认为红军第五次反“围剿”失败是主动撤退，实际是被迫开始长征。
  aliases:
    - 第五次反“围剿”失败
  category: 历史事件
  explanation: 1933年9月，国民党军对中央红军发动第五次“围剿”，由于博古、李德等人的错误指挥，红军损失惨重，被迫长征。
  misconceptions:
    - 把第五次反“围剿”开始时间记成1934年9月，实际是1933年9月。
    - 认为红军第五次反“围剿”失败是主动撤退，实际是被迫开始长征。
    - 将第五次反“围剿”失利只归结为敌强我弱，忽视博古、李德的错误指挥。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:筒车
  type: Concept
  subject: 历史
  title: 筒车
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为筒车是耕作工具，实际用于灌溉
    - 能指出并纠正这一错误：把筒车与曲辕犁的功能相混淆
  aliases: []
  category: 生产工具
  explanation: 唐朝发明的灌溉工具，用于农业灌溉，提高了粮食亩产量。
  misconceptions:
    - 误以为筒车是耕作工具，实际用于灌溉
    - 把筒车与曲辕犁的功能相混淆
    - 认为筒车是唐朝发明的风力翻车
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:简仪
  type: Concept
  subject: 历史
  title: 简仪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为简仪是宋代沈括制造的，实际是元代郭守敬所制。
    - 能指出并纠正这一错误：把简仪与浑仪的功能混淆，认为简仪可直接观测天体位置变化，实则用于精确测量。
  aliases: []
  category: 科技成就
  explanation: 元朝郭守敬研制的天文观测仪器，结构简化，精度提高。
  misconceptions:
    - 误以为简仪是宋代沈括制造的，实际是元代郭守敬所制。
    - 把简仪与浑仪的功能混淆，认为简仪可直接观测天体位置变化，实则用于精确测量。
    - 将简仪归为航海工具，但它是天文观测仪器，与郭守敬的《授时历》编制相关。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:算筹
  type: Concept
  subject: 历史
  title: 算筹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为算筹是书写工具，实际它是古代的计算工具。
    - 能指出并纠正这一错误：误以为算筹出现在汉朝，实际至迟春秋战国已有。
  aliases: []
  category: 历史工具
  explanation: 我国古代的计算工具，用竹、木等制成，至迟出现在春秋战国时期。
  misconceptions:
    - 误认为算筹是书写工具，实际它是古代的计算工具。
    - 误以为算筹出现在汉朝，实际至迟春秋战国已有。
    - 误以为算筹与算盘同时出现，实际算盘出现晚得多。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:粤港澳大湾区
  type: Concept
  subject: 历史
  title: 粤港澳大湾区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为粤港澳大湾区包括广东全省，实际只含珠三角九市及港澳。
    - 能指出并纠正这一错误：把港珠澳大桥说成是高铁线路，混淆了桥梁与铁路的建设项目。
  aliases: []
  category: 战略
  explanation: 中央政府高质量建设粤港澳大湾区，建成港珠澳大桥等基础设施，支持港澳融入国家发展大局。
  misconceptions:
    - 认为粤港澳大湾区包括广东全省，实际只含珠三角九市及港澳。
    - 把港珠澳大桥说成是高铁线路，混淆了桥梁与铁路的建设项目。
    - 认为建设大湾区就是要取消港澳独立关税区或现有制度，错误理解融合。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:紫禁城
  type: Concept
  subject: 历史
  title: 紫禁城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为紫禁城是清代才修建的，忽略了它始建于明永乐时期。
    - 能指出并纠正这一错误：将紫禁城与整个北京城等同，认为紫禁城就是北京城的全部。
  aliases:
    - 故宫
  category: 历史
  explanation: 北京城的宫城，今称故宫，建筑总面积16万余平方米，有殿宇超过9000间，是明清两代的皇宫。
  misconceptions:
    - 误以为紫禁城是清代才修建的，忽略了它始建于明永乐时期。
    - 将紫禁城与整个北京城等同，认为紫禁城就是北京城的全部。
    - 误以为紫禁城在南京，明成祖迁都前修建于北京。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:红军三大主力会师
  type: Concept
  subject: 历史
  title: 红军三大主力会师
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为三大主力会师于陕北吴起镇，实际是甘肃会宁和将台堡。
    - 能指出并纠正这一错误：把会师时间写成1935年，与红一方面军到达陕北混淆。
  aliases:
    - 会宁会师
    - 将台堡会师
  category: 历史事件
  explanation: 1936年10月，红一、红二、红四方面军在甘肃会宁和将台堡会师，宣告长征胜利结束。
  misconceptions:
    - 误以为三大主力会师于陕北吴起镇，实际是甘肃会宁和将台堡。
    - 把会师时间写成1935年，与红一方面军到达陕北混淆。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:红军长征
  type: Concept
  subject: 历史
  title: 红军长征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为长征是红军主动发起的战略进攻，实际是第五次反“围剿”失败后的战略转移。
    - 能指出并纠正这一错误：把长征开始时间说成1935年10月，实际是1934年10月。
  aliases:
    - 长征
  category: 历史事件
  explanation: 1934年10月，中央红军因第五次反“围剿”失败，被迫进行战略转移，开始长征。
  misconceptions:
    - 认为长征是红军主动发起的战略进攻，实际是第五次反“围剿”失败后的战略转移。
    - 把长征开始时间说成1935年10月，实际是1934年10月。
    - 说所有红军队伍同时从中央苏区出发，实际是中央红军先开始，红二、四方面军后参与。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:红山文化
  type: Concept
  subject: 历史
  title: 红山文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为红山文化位于长江流域，实际在西辽河流域
    - 能指出并纠正这一错误：把红山文化、良渚文化、仰韶文化的时间先后记错
  aliases: []
  category: 考古学文化
  explanation: 西辽河流域的新石器时代文化，距今约5800-5000年，有祭坛、女神庙等。
  misconceptions:
    - 误以为红山文化位于长江流域，实际在西辽河流域
    - 把红山文化、良渚文化、仰韶文化的时间先后记错
    - 认为红山文化已有青铜器，实际是新石器时代文化
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:红旗渠精神
  type: Concept
  subject: 历史
  title: 红旗渠精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将红旗渠工程与山西大寨相混淆，认为红旗渠是陈永贵领导修建。
    - 能指出并纠正这一错误：误以为红旗渠精神形成于抗日战争时期，实际是社会主义建设时期形成的。
  aliases: []
  category: 精神品质
  explanation: 自力更生、艰苦创业、团结协作、无私奉献的精神，由河南林县人民修建红旗渠时所形成。
  misconceptions:
    - 误将红旗渠工程与山西大寨相混淆，认为红旗渠是陈永贵领导修建。
    - 误以为红旗渠精神形成于抗日战争时期，实际是社会主义建设时期形成的。
    - 把红旗渠精神简单等同于“劳动吃苦”，忽略其自力更生、团结协作的深层内涵。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S2.md
- id: concept:历史:红船精神
  type: Concept
  subject: 历史
  title: 红船精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把红船精神的主要内容写成‘坚定信念、艰苦奋斗’，与井冈山精神混同。
    - 能指出并纠正这一错误：误以为红船精神是长征路上形成的，忽略了诞生于中共一大。
  aliases: []
  category: 革命精神
  explanation: 1921年中国共产党在浙江嘉兴南湖游船上诞生，这条游船被称为红船，红船精神是中国革命精神之源，体现了开天辟地、敢为人先的首创精神。
  misconceptions:
    - 把红船精神的主要内容写成‘坚定信念、艰苦奋斗’，与井冈山精神混同。
    - 误以为红船精神是长征路上形成的，忽略了诞生于中共一大。
    - 认为红船指的是毛泽东在湖南游船，不是嘉兴南湖游船。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S3.md
- id: concept:历史:红色文化
  type: Concept
  subject: 历史
  title: 红色文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为红色文化只包含革命战争年代的文化，不包括建设和改革时期。
    - 能指出并纠正这一错误：把红色文化与中国特色社会主义文化完全等同，忽略其革命斗争源头。
  aliases: []
  category: 文化概念
  explanation: 红色文化是中国共产党领导人民在革命、建设、改革中创造的先进文化，具有鲜明的中国特色，是党和人民共同创造的精神财富。
  misconceptions:
    - 认为红色文化只包含革命战争年代的文化，不包括建设和改革时期。
    - 把红色文化与中国特色社会主义文化完全等同，忽略其革命斗争源头。
    - 误以为红色文化是中国共产党单独创造的，否认人民群众的参与。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S3.md
- id: concept:历史:纪传体
  type: Concept
  subject: 历史
  title: 纪传体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为纪传体是按时间顺序叙述史事，那是编年体。
    - 能指出并纠正这一错误：认为《春秋》是纪传体，实际是编年体。
  aliases: []
  category: 史学体裁
  explanation: 以人物为中心的综合性史书体裁，包括本纪、表等，我国古代“正史”即二十四史均采用此体裁。
  misconceptions:
    - 误以为纪传体是按时间顺序叙述史事，那是编年体。
    - 认为《春秋》是纪传体，实际是编年体。
    - 误以为纪传体只包含本纪和列传，忽略表和书志。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:纳米比亚独立
  type: Concept
  subject: 历史
  title: 纳米比亚独立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为纳米比亚独立标志着亚洲殖民体系瓦解，实际是非洲。
    - 能指出并纠正这一错误：把纳米比亚独立时间记成1991年，实际是1990年。
  aliases: []
  category: 历史事件
  explanation: 1990年纳米比亚独立，标志着所有非洲国家都摆脱了殖民主义的枷锁。
  misconceptions:
    - 误认为纳米比亚独立标志着亚洲殖民体系瓦解，实际是非洲。
    - 把纳米比亚独立时间记成1991年，实际是1990年。
    - 误认为纳米比亚独立后所有非洲国家都已独立，忽视未独立地区。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:经互会
  type: Concept
  subject: 历史
  title: 经互会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为经互会是军事组织，实际是经济互助委员会。
    - 能指出并纠正这一错误：认为经互会促进了东欧经济独立，实际是纳入苏联轨道。
  aliases:
    - 经济互助委员会
  category: 国际组织
  explanation: 1949年苏联与东欧国家建立的经济互助委员会，将东欧经济纳入苏联轨道。
  misconceptions:
    - 误认为经互会是军事组织，实际是经济互助委员会。
    - 认为经互会促进了东欧经济独立，实际是纳入苏联轨道。
    - 误以为经互会是由美国主导建立，实际是苏联。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S3.md
- id: concept:历史:经济全球化
  type: Concept
  subject: 历史
  title: 经济全球化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为经济全球化只涉及贸易，不包括国际投资和生产活动全球化
    - 能指出并纠正这一错误：把经济全球化等同于资本主义化，忽视发展中国家的参与和作用
  aliases: []
  category: 经济
  explanation: 20世纪八九十年代以来，国家间经济联系日益紧密，国际投资和贸易迅速增长，生产活动全球化的趋势。
  misconceptions:
    - 认为经济全球化只涉及贸易，不包括国际投资和生产活动全球化
    - 把经济全球化等同于资本主义化，忽视发展中国家的参与和作用
    - 认为经济全球化开始于新航路开辟，而非20世纪八九十年代
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:经济大危机
  type: Concept
  subject: 历史
  title: 经济大危机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为经济大危机只发生在1929年美国，忽略其席卷整个资本主义世界
    - 能指出并纠正这一错误：把经济大危机的根本原因说成是生产过剩，忽视生产社会化与私有制的矛盾
  aliases:
    - 1929-1933年经济危机
    - 大萧条
  category: 历史事件
  explanation: 1929年爆发于美国，后席卷整个资本主义世界的严重经济危机，持续时间长、破坏性大。
  misconceptions:
    - 认为经济大危机只发生在1929年美国，忽略其席卷整个资本主义世界
    - 把经济大危机的根本原因说成是生产过剩，忽视生产社会化与私有制的矛盾
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:经济特区
  type: Concept
  subject: 历史
  title: 经济特区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1980年设立的经济特区包括海南，实际海南是1988年才设为经济特区的。
    - 能指出并纠正这一错误：以为经济特区实行资本主义制度，实际是社会主义制度下特殊经济政策和管理体制。
  aliases:
    - 特区
  category: 经济政策
  explanation: 1980年设立的深圳、珠海、汕头、厦门等实行特殊经济政策和管理体制的区域，是对外开放的窗口和试验田。
  misconceptions:
    - 误认为1980年设立的经济特区包括海南，实际海南是1988年才设为经济特区的。
    - 以为经济特区实行资本主义制度，实际是社会主义制度下特殊经济政策和管理体制。
    - 将经济特区与沿海开放城市混为一谈，如认为广州也是1980年设立的经济特区。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:经济重心南移
  type: Concept
  subject: 历史
  title: 经济重心南移
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为经济重心南移在唐中后期已完成，实际完成于南宋
    - 能指出并纠正这一错误：认为南宋时北方经济仍超过南方，忽略江南全面超越
  aliases:
    - 经济重心南移完成
  category: 经济史
  explanation: 南宋时期，江南经济全面超过北方，政府财政和粮食依赖江南，标志我国古代经济重心南移完成。
  misconceptions:
    - 误以为经济重心南移在唐中后期已完成，实际完成于南宋
    - 认为南宋时北方经济仍超过南方，忽略江南全面超越
    - 将南移的开始时间与完成时间颠倒，把东汉末年作为完成标志
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S5.md
- id: concept:历史:统一多民族国家的巩固和发展
  type: Concept
