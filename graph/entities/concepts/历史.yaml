  explanation: 依靠贫雇农，团结中农，有步骤地、有分别地消灭封建性剥削的土地制度，发展农业生产。
  misconceptions:
    - 误以为土地改革总路线依靠中农，团结贫雇农
    - 漏掉发展农业生产的相关内容，只强调废除封建剥削
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:土地荒漠化
  type: Concept
  subject: 历史
  title: 土地荒漠化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为荒漠化只是指原有沙漠扩大，实则包括土地退化导致荒漠化。
    - 能指出并纠正这一错误：忽略自然因素，以为完全由人类活动造成，实际上干旱气候也起作用。
  aliases:
    - 荒漠化
  category: 环境概念
  explanation: 在干旱和半干旱地区，土地退化导致荒漠化，是严重的生态问题。
  misconceptions:
    - 认为荒漠化只是指原有沙漠扩大，实则包括土地退化导致荒漠化。
    - 忽略自然因素，以为完全由人类活动造成，实际上干旱气候也起作用。
    - 误以为荒漠化只发生在沙漠地区，实际干旱半干旱区均可发生。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:土尔扈特部回归祖国
  type: Concept
  subject: 历史
  title: 土尔扈特部回归祖国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把土尔扈特部回归当成从新疆内部迁徙，忽略其是从俄国伏尔加河下游东归。
    - 能指出并纠正这一错误：将回归领袖误记为噶尔丹或大小和卓，实际是渥巴锡。
  aliases: []
  category: 历史事件
  explanation: 1771年，土尔扈特部在渥巴锡领导下回归祖国，为统一多民族国家巩固发展作出贡献。
  misconceptions:
    - 把土尔扈特部回归当成从新疆内部迁徙，忽略其是从俄国伏尔加河下游东归。
    - 将回归领袖误记为噶尔丹或大小和卓，实际是渥巴锡。
    - 以为土尔扈特部回归发生在康熙年间，实际是乾隆三十六年（1771年）。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:圣马丁
  type: Concept
  subject: 历史
  title: 圣马丁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为圣马丁领导了墨西哥独立，实际他领导阿根廷、智利、秘鲁独立。
    - 能指出并纠正这一错误：误把圣马丁与玻利瓦尔的事迹互换，如认为他解放了委内瑞拉。
  aliases:
