  explanation: 《联合国宪章》规定的首要宗旨是维持国际和平及安全，采取有效集体办法防止和消除对和平的威胁。
  misconceptions:
    - 认为联合国首要宗旨是促进经济发展，忽略维护和平与安全的首位性
    - 认为联合国宗旨是保护人权，而非维持国际和平及安全这一首要目标
    - 认为联合国可以采取任何手段实现宗旨，不受《联合国宪章》限制
