  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:英国的殖民扩张
  type: Concept
  subject: 历史
  title: 英国的殖民扩张
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为英国从16世纪初就开始大规模殖民扩张，实际16世纪后期才起步
    - 能指出并纠正这一错误：把英国击败无敌舰队后立刻成为日不落帝国，实际要到18世纪
  aliases: []
  category: 历史事件
