- id: concept:历史:澶渊之盟
  type: Concept
  subject: 历史
  title: 澶渊之盟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把澶渊之盟时间记成1004年，实际是1005年
    - 能指出并纠正这一错误：误以为澶渊之盟后宋辽皇帝以父子相称，实际是兄弟
  aliases:
    - 澶渊之盟
  category: 历史事件
  explanation: 1005年，北宋与辽议和，双方皇帝以兄弟相称，北宋每年送给辽钱物，称为“岁币”，史称澶渊之盟。
  misconceptions:
    - 把澶渊之盟时间记成1004年，实际是1005年
    - 误以为澶渊之盟后宋辽皇帝以父子相称，实际是兄弟
    - 认为澶渊之盟是北宋战败后被迫订立的，实际是双方妥协
