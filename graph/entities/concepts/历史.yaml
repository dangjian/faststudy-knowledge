- id: concept:历史:海南经济特区建立
  type: Concept
  subject: 历史
  title: 海南经济特区建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为海南在1988年前已作为经济特区，实际是建省同时设立
    - 能指出并纠正这一错误：将深圳称为最大经济特区，忽略海南面积最大
