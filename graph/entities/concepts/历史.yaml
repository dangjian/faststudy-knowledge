  misconceptions:
    - 误认为福特发明了流水线，实为福特公司使用流水线生产
    - 把流水线生产与第一次工业革命联系，实为第二次工业革命时期
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:海上丝绸之路
  type: Concept
  subject: 历史
  title: 海上丝绸之路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为郑和下西洋开辟了海上丝绸之路，实际他之前已存在
    - 能指出并纠正这一错误：说海上丝绸之路始于明朝，实际汉唐时已有
