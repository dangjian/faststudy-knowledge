  misconceptions:
    - 误以为活字印刷术在唐代已出现，实际是北宋毕昇发明
    - 误认为活字印刷术出现后雕版印刷立即被淘汰，实际两者并用
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:流水线生产
  type: Concept
  subject: 历史
  title: 流水线生产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为福特发明了流水线，实为福特公司使用流水线生产
    - 能指出并纠正这一错误：把流水线生产与第一次工业革命联系，实为第二次工业革命时期
