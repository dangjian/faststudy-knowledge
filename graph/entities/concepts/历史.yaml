  category: 历史事件
  explanation: 辽宋夏金元时期，中外物质、科技文化的交流密切，西方科技文化传入中国，中国的发明创造输往国外。
  misconceptions:
    - 认为辽宋夏金元时期只有中国发明外传，忽视西方科技文化传入
    - 误以为该时期中外交流断绝，实际交流密切
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
