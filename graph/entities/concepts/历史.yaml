  misconceptions:
    - 误认为柳公权是宋朝书法家，实际是唐朝。
    - 认为柳公权以草书闻名，实际是楷书大家。
    - 把“柳骨”说成“颜骨”，与颜真卿混淆。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:柳宗元
  type: Concept
  subject: 历史
  title: 柳宗元
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把柳宗元归为唯心主义思想家，误认为他主张有神论
    - 能指出并纠正这一错误：将柳宗元与韩愈的哲学主张混淆，误认为他主张复兴儒学
  aliases: []
  category: 历史人物
  explanation: 唐朝思想家，无神论和朴素唯物主义思想的杰出代表。
  misconceptions:
    - 把柳宗元归为唯心主义思想家，误认为他主张有神论
    - 将柳宗元与韩愈的哲学主张混淆，误认为他主张复兴儒学
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:格列高利历
  type: Concept
  subject: 历史
  title: 格列高利历
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为格列高利历就是儒略历的别称
    - 能指出并纠正这一错误：误认为格列高利历在公元1世纪就已经制定
  aliases:
    - 公历
  category: 历法
  explanation: 格列高利历是16世纪对儒略历的改革，即现在通用的公历。
  misconceptions:
    - 误认为格列高利历就是儒略历的别称
    - 误认为格列高利历在公元1世纪就已经制定
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:桂系军阀
  type: Concept
  subject: 历史
  title: 桂系军阀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为桂系军阀的首领是唐继尧，实际为陆荣廷。
    - 能指出并纠正这一错误：将桂系军阀控制的地盘说成云南、贵州，实际为广东、广西。
  aliases: []
  category: 历史概念
  explanation: 以陆荣廷为首，控制广东、广西等地。
  misconceptions:
    - 误以为桂系军阀的首领是唐继尧，实际为陆荣廷。
    - 将桂系军阀控制的地盘说成云南、贵州，实际为广东、广西。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:梵高
  type: Concept
  subject: 历史
  title: 梵高
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为梵高是法国人，实为荷兰人
    - 能指出并纠正这一错误：把梵高归为印象派，实为后印象派
  aliases:
    - 文森特·梵高
  category: 美术
  explanation: 荷兰画家，代表作有《向日葵》《夜间的咖啡馆》等，表达对生命的赞美。
  misconceptions:
    - 误认为梵高是法国人，实为荷兰人
    - 把梵高归为印象派，实为后印象派
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:楚汉之争
  type: Concept
  subject: 历史
  title: 楚汉之争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为楚汉之争发生在秦统一之前，实际在秦亡之后
    - 能指出并纠正这一错误：把楚汉之争看成项羽与刘邦共同反秦，实际是争夺帝位
  aliases: []
  category: 历史事件
  explanation: 秦朝灭亡后，项羽和刘邦为争夺帝位进行的战争，最终刘邦获胜。
  misconceptions:
    - 误以为楚汉之争发生在秦统一之前，实际在秦亡之后
    - 把楚汉之争看成项羽与刘邦共同反秦，实际是争夺帝位
    - 认为楚汉之争以项羽获胜告终，实际刘邦胜并建西汉
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:楚辞
  type: Concept
  subject: 历史
  title: 楚辞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《楚辞》和《诗经》一样，是我国第一部诗歌总集
    - 能指出并纠正这一错误：认为《离骚》是屈原用四言体写的史诗，与《诗经》风格相同
  aliases: []
  category: 文学
  explanation: 战国时期屈原等人创作的新体诗歌，代表作《离骚》。
  misconceptions:
    - 误以为《楚辞》和《诗经》一样，是我国第一部诗歌总集
    - 认为《离骚》是屈原用四言体写的史诗，与《诗经》风格相同
    - 把《楚辞》说成是孔子晚年整理编订的诗歌集
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:榷场
  type: Concept
  subject: 历史
  title: 榷场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为榷场是官方允许的贸易，实际是边境民间交易场所
    - 能指出并纠正这一错误：认为榷场只在宋辽边境开设，忽略宋夏边境也有
  aliases:
    - 互市
  category: 历史概念
  explanation: 北宋与辽、西夏在边境开设的贸易场所，称为“榷场”，促进了经济文化交流。
  misconceptions:
    - 误以为榷场是官方允许的贸易，实际是边境民间交易场所
    - 认为榷场只在宋辽边境开设，忽略宋夏边境也有
    - 把榷场和市舶司混为一谈，市舶司管海外贸易
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:欧洲共同体
  type: Concept
  subject: 历史
  title: 欧洲共同体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为欧共体成立于1993年，实际是1967年。
    - 能指出并纠正这一错误：将欧共体与欧盟完全等同，忽略欧盟是欧共体的发展。
  aliases:
    - 欧共体
  category: 国际组织
  explanation: 1967年由欧洲煤钢共同体、欧洲经济共同体和欧洲原子能共同体合并而成，简称欧共体。
  misconceptions:
    - 误认为欧共体成立于1993年，实际是1967年。
    - 将欧共体与欧盟完全等同，忽略欧盟是欧共体的发展。
    - 误认为欧共体只包括经济合作，忽视政治联合。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S2.md
- id: concept:历史:欧洲战争策源地
  type: Concept
  subject: 历史
  title: 欧洲战争策源地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将欧洲战争策源地误认为是意大利或日本
    - 能指出并纠正这一错误：认为德国法西斯专政建于1939年二战爆发时，实际是1933年希特勒上台
  aliases: []
  category: 历史概念
  explanation: 指纳粹德国，1933年希特勒上台后建立法西斯专政，积极扩军备战，成为二战欧洲战争策源地。
  misconceptions:
    - 将欧洲战争策源地误认为是意大利或日本
    - 认为德国法西斯专政建于1939年二战爆发时，实际是1933年希特勒上台
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S2.md
- id: concept:历史:欧洲联盟
  type: Concept
  subject: 历史
  title: 欧洲联盟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为欧盟是在1967年欧共体成立时同时成立。
    - 能指出并纠正这一错误：把欧盟说成是纯经济组织，忽略政治一体化。
  aliases:
    - 欧盟
  category: 国际组织
  explanation: 1993年在欧共体基础上成立，大大加快欧洲一体化进程。
  misconceptions:
    - 误认为欧盟是在1967年欧共体成立时同时成立。
    - 把欧盟说成是纯经济组织，忽略政治一体化。
    - 误认为英国在欧盟成立时就加入，实际1973年才入欧共体。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:正面战场
  type: Concept
  subject: 历史
  title: 正面战场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为正面战场全部由国民党军队组成，共产党没有参与任何正面作战。
    - 能指出并纠正这一错误：误以为正面战场只有防御战，没有主动进攻。
  aliases: []
  category: 历史概念
  explanation: 指国民党军队在正面抗击日军进攻的战场，包括淞沪会战、徐州会战、武汉会战等重大战役。
  misconceptions:
    - 认为正面战场全部由国民党军队组成，共产党没有参与任何正面作战。
    - 误以为正面战场只有防御战，没有主动进攻。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:武则天的统治
  type: Concept
  subject: 历史
  title: 武则天的统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为武则天是唐朝皇帝，实际她改国号为周，史称武周
    - 能指出并纠正这一错误：误认为武则天创立科举制，实际科举制源自隋朝，她只是发展并创立殿试
  aliases:
    - 武则天
  category: 历史人物
  explanation: 武则天是中国历史上唯一的女皇帝，发展科举制，创立殿试，重视生产，为开元盛世奠定基础。
  misconceptions:
    - 误以为武则天是唐朝皇帝，实际她改国号为周，史称武周
    - 误认为武则天创立科举制，实际科举制源自隋朝，她只是发展并创立殿试
    - 把殿试的创立归功于唐太宗，实际是武则天
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S2.md
- id: concept:历史:武器装备国产化
  type: Concept
  subject: 历史
  title: 武器装备国产化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为我国武器装备从新中国成立后立即实现完全自行设计制造，忽略了仿制阶段。
    - 能指出并纠正这一错误：认为“国产化”就是全部国内研究，不引用任何外国技术。
  aliases:
    - 军事装备国产化
  category: 历史事件
  explanation: 从20世纪60年代起，中国人民解放军武器装备进入自行设计、自行制造阶段，实现国产化，并逐步实现轻型化。
  misconceptions:
    - 误以为我国武器装备从新中国成立后立即实现完全自行设计制造，忽略了仿制阶段。
    - 认为“国产化”就是全部国内研究，不引用任何外国技术。
    - 把“两弹一星”成功与武器装备国产化完全等同，认为国产化只指核武器。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S3.md
- id: concept:历史:武士道
  type: Concept
  subject: 历史
  title: 武士道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为武士效忠的对象是天皇或国家，实际是主公
    - 能指出并纠正这一错误：误将武士道视为日本官方法律条文，实际是长期形成的道德规范
  aliases:
    - 武士道精神
  category: 文化概念
  explanation: 武士集团的长期统治逐渐形成的道德规范，武士效忠的对象不是国家，而是自己的主公。
  misconceptions:
    - 误认为武士效忠的对象是天皇或国家，实际是主公
    - 误将武士道视为日本官方法律条文，实际是长期形成的道德规范
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:武昌起义
  type: Concept
  subject: 历史
  title: 武昌起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为起义军一夜占领了武汉三镇，实际只先占武昌，汉阳、汉口次日响应。
    - 能指出并纠正这一错误：把武昌起义等同于辛亥革命，实际辛亥革命还包括各省独立等，武昌起义是开端和标志。
  aliases: []
  category: 历史事件
  explanation: 1911年10月10日晚，湖北新军工程营在武昌起义，一夜占领武昌，随后汉阳、汉口响应，成立湖北军政府，是辛亥革命的开端。
  misconceptions:
    - 误认为起义军一夜占领了武汉三镇，实际只先占武昌，汉阳、汉口次日响应。
    - 把武昌起义等同于辛亥革命，实际辛亥革命还包括各省独立等，武昌起义是开端和标志。
    - 误认为起义由同盟会总部直接策划，实际由文学社和共进会发动，同盟会并未制定计划。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:武汉会战
  type: Concept
  subject: 历史
  title: 武汉会战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为武汉会战发生在1937年，是抗战开始后的第一场大会战。
    - 能指出并纠正这一错误：以为武汉会战结束后抗日战争进入反攻阶段。
  aliases: []
  category: 历史事件
  explanation: 1938年6月至10月，中国军队在武汉地区抗击日军进攻，历时四个多月，使日本迅速灭亡中国的既定战略彻底破灭，抗日战争进入战略相持阶段。
  misconceptions:
    - 认为武汉会战发生在1937年，是抗战开始后的第一场大会战。
    - 以为武汉会战结束后抗日战争进入反攻阶段。
    - 把武汉会战与台儿庄战役混为一谈，认为武汉会战是局部胜利。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:殖民掠夺的影响
  type: Concept
  subject: 历史
  title: 殖民掠夺的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看到殖民地灾难，否定殖民掠夺对欧洲资本原始积累的作用
    - 能指出并纠正这一错误：认为殖民掠夺是正义的，因为它促进了世界市场形成
  aliases: []
  category: 历史影响
  explanation: 殖民掠夺有助于欧洲资本原始积累和世界市场形成，但给殖民地人民带来深重灾难。
  misconceptions:
    - 只看到殖民地灾难，否定殖民掠夺对欧洲资本原始积累的作用
    - 认为殖民掠夺是正义的，因为它促进了世界市场形成
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:毕昇
  type: Concept
  subject: 历史
  title: 毕昇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为毕昇发明的是雕版印刷术，实际发明活字印刷术
    - 能指出并纠正这一错误：把毕昇误记为南宋或唐朝匠人，实际是北宋匠人
  aliases: []
  category: 历史人物
  explanation: 北宋匠人，发明活字印刷术。
  misconceptions:
    - 误以为毕昇发明的是雕版印刷术，实际发明活字印刷术
    - 把毕昇误记为南宋或唐朝匠人，实际是北宋匠人
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:毛泽东
  type: Concept
  subject: 历史
  title: 毛泽东
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遵义会议已确立毛泽东为党的总书记，实际只增选为政治局常委。
    - 能指出并纠正这一错误：认为是毛泽东指挥第五次反“围剿”，实际是博古、李德在指挥。
  aliases: []
  category: 历史人物
  explanation: 在长征中提出改向贵州进军，遵义会议上被增选为中央政治局常委，开始确立其领导地位。
  misconceptions:
    - 认为遵义会议已确立毛泽东为党的总书记，实际只增选为政治局常委。
    - 认为是毛泽东指挥第五次反“围剿”，实际是博古、李德在指挥。
    - 认为毛泽东“改向贵州”的建议在遵义会议上提出，实际在遵义会议前。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:毛泽东思想
  type: Concept
  subject: 历史
  title: 毛泽东思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为毛泽东思想是毛泽东个人全部观点和思想的汇总，忽视集体智慧
    - 能指出并纠正这一错误：认为毛泽东思想在遵义会议上被确立为指导思想，实际是中共七大
  aliases: []
  category: 思想理论
  explanation: 马克思列宁主义理论与中国革命实践相统一的思想，在中共七大上被确立为中国共产党的指导思想并写入党章。
  misconceptions:
    - 误以为毛泽东思想是毛泽东个人全部观点和思想的汇总，忽视集体智慧
    - 认为毛泽东思想在遵义会议上被确立为指导思想，实际是中共七大
    - 把毛泽东思想与中国特色社会主义理论体系混为一谈，混淆不同历史阶段
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:氏族社会
  type: Concept
  subject: 历史
  title: 氏族社会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为氏族社会始终人人平等，实际后期已出现贫富分化。
    - 能指出并纠正这一错误：认为氏族是地缘关系结成的群体，实际以血缘关系为纽带。
  aliases: []
  category: 社会形态
  explanation: 原始社会以血缘关系结合的社会群体，成员有共同祖先，早期平等，后期出现贫富分化。
  misconceptions:
    - 认为氏族社会始终人人平等，实际后期已出现贫富分化。
    - 认为氏族是地缘关系结成的群体，实际以血缘关系为纽带。
    - 把氏族社会等同于部落联盟，实际氏族是部落的基础，部落联盟是更高级组织。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:民主与科学
  type: Concept
  subject: 历史
  title: 民主与科学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'德先生'当科学，'赛先生'当民主，对应关系颠倒
    - 能指出并纠正这一错误：认为民主就是资产阶级政治体制，科学就是具体科技知识
  aliases:
    - 德先生
    - 赛先生
  category: 思想口号
  explanation: 新文化运动的基本口号，民主即反对专制，科学即反对愚昧，被陈独秀称为“德先生”和“赛先生”。
  misconceptions:
    - 将'德先生'当科学，'赛先生'当民主，对应关系颠倒
    - 认为民主就是资产阶级政治体制，科学就是具体科技知识
    - 以为民主与科学是五四运动后提出的口号，实际新文化运动初期就有
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:民主革命纲领
  type: Concept
  subject: 历史
  title: 民主革命纲领
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为民主革命纲领是中共的最高纲领，混淆了层次
    - 能指出并纠正这一错误：认为民主革命纲领是中共一大提出的，与史实不符
  aliases:
    - 最低纲领
  category: 政治纲领
  explanation: 中共二大制定的最低纲领，主要任务是打倒军阀，推翻帝国主义压迫，统一中国为真正的民主共和国。
  misconceptions:
    - 误以为民主革命纲领是中共的最高纲领，混淆了层次
    - 认为民主革命纲领是中共一大提出的，与史实不符
    - 将打倒军阀、推翻帝国主义压迫误认为与三民主义完全一样
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:民族主义
  type: Concept
  subject: 历史
  title: 民族主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将民族主义解释为“创立民国”，与民权主义混淆
    - 能指出并纠正这一错误：认为民族主义明确提出了反对帝国主义的口号
  aliases: []
  category: 历史概念
  explanation: 三民主义之一，即“驱除鞑虏，恢复中华”，推翻清王朝统治，反对民族压迫。
  misconceptions:
    - 误将民族主义解释为“创立民国”，与民权主义混淆
    - 认为民族主义明确提出了反对帝国主义的口号
    - 把民族主义等同于“平均地权”
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:民族交往交流交融
  type: Concept
  subject: 历史
  title: 民族交往交流交融
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为民族交往交流交融只发生在南方，实际指北方地区各民族。
    - 能指出并纠正这一错误：误以为只指少数民族汉化，无视汉族也受少数民族影响。
  aliases:
    - 民族融合
  category: 历史概念
  explanation: 指魏晋南北朝时期北方地区各民族之间在政治、经济、文化等方面的相互往来、交流与融合，为中华民族发展注入新活力。
  misconceptions:
    - 误以为民族交往交流交融只发生在南方，实际指北方地区各民族。
    - 误以为只指少数民族汉化，无视汉族也受少数民族影响。
    - 误以为此现象仅出现于北魏，忽略整个魏晋南北朝时期。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:民族交融
  type: Concept
  subject: 历史
  title: 民族交融
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为民族交融只发生在元朝
    - 能指出并纠正这一错误：以为民族交融的成果只有回回一个民族
  aliases:
    - 民族融合
  category: 历史概念
  explanation: 元朝时期，边疆各族迁入中原和江南，与汉人杂居，互通婚姻，形成新的民族回回，促进了中华民族的进一步交融。
  misconceptions:
    - 误认为民族交融只发生在元朝
    - 以为民族交融的成果只有回回一个民族
    - 将民族交融等同于汉族同化其他民族
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:民族区域自治制度
  type: Concept
  subject: 历史
  title: 民族区域自治制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把民族区域自治与“一国两制”混为一谈，认为自治区像特别行政区一样高度自治。
    - 能指出并纠正这一错误：认为民族区域自治制度是我国根本政治制度，与人民代表大会制度并列。
  aliases: []
  category: 政治制度
  explanation: 我国在少数民族聚居地方实行区域自治，设立自治区、自治州、自治县等，是国家统一领导下的一级地方政权机关。
  misconceptions:
    - 把民族区域自治与“一国两制”混为一谈，认为自治区像特别行政区一样高度自治。
    - 认为民族区域自治制度是我国根本政治制度，与人民代表大会制度并列。
    - 误以为民族区域自治地方可以独立行使主权，是独立的政治实体。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:民族区域自治的五个自治区
  type: Concept
  subject: 历史
  title: 民族区域自治的五个自治区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将内蒙古自治区成立时间记成1949年，而实际是1947年。
    - 能指出并纠正这一错误：把宁夏和广西自治区成立时间混淆，或漏掉其中一个。
  aliases:
    - 五大自治区
  category: 历史事实
  explanation: 内蒙古自治区、新疆维吾尔自治区、广西壮族自治区、宁夏回族自治区和西藏自治区，先后成立于1947年至1965年。
  misconceptions:
    - 将内蒙古自治区成立时间记成1949年，而实际是1947年。
    - 把宁夏和广西自治区成立时间混淆，或漏掉其中一个。
    - 误以为西藏自治区与新疆维吾尔自治区同时成立，或认为五个自治区都成立于20世纪60年代。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:民族地区文化教育发展
  type: Concept
  subject: 历史
  title: 民族地区文化教育发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为发展民族教育就是只用民族语言教学，不必推广国家通用语言文字。
    - 能指出并纠正这一错误：把“整理出版少数民族古籍”理解为“废除传统文化”，或认为是“四旧”产物。
  aliases: []
  category: 史实
  explanation: 国家发展少数民族教育，保护少数民族文化，整理出版少数民族古籍文献。
  misconceptions:
    - 认为发展民族教育就是只用民族语言教学，不必推广国家通用语言文字。
    - 把“整理出版少数民族古籍”理解为“废除传统文化”，或认为是“四旧”产物。
    - 误以为国家不重视民族文化，民族语言有消失的危险。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:民族地区民主改革和社会主义改造
  type: Concept
  subject: 历史
  title: 民族地区民主改革和社会主义改造
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为民族地区民主改革与全国社会主义改造同时完成，如认为西藏在1956年前已完成。
    - 能指出并纠正这一错误：把民主改革等同于土地改革，或认为没有废除封建农奴制就进入社会主义。
  aliases: []
  category: 史实
  explanation: 新中国成立后，党和国家在民族地区进行民主改革和社会主义改造，废除了剥削和压迫，各族人民翻身做主人。
  misconceptions:
    - 误认为民族地区民主改革与全国社会主义改造同时完成，如认为西藏在1956年前已完成。
    - 把民主改革等同于土地改革，或认为没有废除封建农奴制就进入社会主义。
    - 认为民主改革直接消灭了宗教，甚至误以为改革对象是少数民族上层人士。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:民族地区经济建设
  type: Concept
  subject: 历史
  title: 民族地区经济建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为国家对民族地区只给予资金援助，没有技术、物资支持。
    - 能指出并纠正这一错误：把民族地区经济建设成就归功于改革开放后，忽视20世纪五六十年代的基础建设。
  aliases: []
  category: 史实
  explanation: 国家采取优惠政策，通过技术、资金、物资等方式加强民族地区经济建设，兴建工业，发展经济。
  misconceptions:
    - 误以为国家对民族地区只给予资金援助，没有技术、物资支持。
    - 把民族地区经济建设成就归功于改革开放后，忽视20世纪五六十年代的基础建设。
    - 认为民族地区经济落后，国家不应该在工业上投资，只能发展农牧业。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:民族英雄
  type: Concept
  subject: 历史
  title: 民族英雄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把岳飞称为民族英雄，但岳飞抗金属国内民族矛盾
    - 能指出并纠正这一错误：误认为凡打过外族就能称民族英雄，忽略战争性质
  aliases: []
  category: 历史概念
  explanation: 在反抗外来侵略中作出重大贡献的英雄人物，如戚继光。
  misconceptions:
    - 把岳飞称为民族英雄，但岳飞抗金属国内民族矛盾
    - 误认为凡打过外族就能称民族英雄，忽略战争性质
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:民族资本主义的初步发展
  type: Concept
  subject: 历史
  title: 民族资本主义的初步发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为初步发展始于洋务运动，实际是甲午战后清政府放松设厂限制。
    - 能指出并纠正这一错误：误以为民族资本主义资金雄厚、规模大，实际资金少、规模小、技术落后。
  aliases:
    - 中国民族资本主义初步发展
  category: 历史事件
  explanation: 甲午战后，清政府放松民间设厂限制，民族资本主义得到初步发展，但资金少、规模小、技术落后，集中于轻工业，分布不平衡。
  misconceptions:
    - 误以为初步发展始于洋务运动，实际是甲午战后清政府放松设厂限制。
    - 误以为民族资本主义资金雄厚、规模大，实际资金少、规模小、技术落后。
    - 误以为民族工业集中在重工业，实际集中于轻工业且分布不平衡。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S4.md
- id: concept:历史:民权主义
  type: Concept
  subject: 历史
  title: 民权主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将民权主义解释为“平均地权”，与民生主义混淆
    - 能指出并纠正这一错误：认为民权主义主张实行君主立宪制
  aliases: []
  category: 历史概念
  explanation: 三民主义之一，即“创立民国”，推翻君主专制政体，建立资产阶级民主共和国。
  misconceptions:
    - 误将民权主义解释为“平均地权”，与民生主义混淆
    - 认为民权主义主张实行君主立宪制
    - 把民权主义理解为“限制人民权利”
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:民法典
  type: Concept
  subject: 历史
  title: 民法典
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为民法典是新中国成立后第一部民事法律，实为第一部以“法典”命名的法律
    - 能指出并纠正这一错误：把民法典通过时间记成2019年，实际是2020年
  aliases: []
  category: 法律
  explanation: 2020年通过，新中国成立以来第一部以“法典”命名的法律。
  misconceptions:
    - 误以为民法典是新中国成立后第一部民事法律，实为第一部以“法典”命名的法律
    - 把民法典通过时间记成2019年，实际是2020年
    - 认为民法典只调整经济关系，忽略人格权编等内容
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:民生主义
  type: Concept
  subject: 历史
  title: 民生主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为民生主义是“没收地主土地无偿分给农民”
    - 能指出并纠正这一错误：将民生主义与民权主义混淆，说成“创立民国”
  aliases: []
  category: 历史概念
  explanation: 三民主义之一，即“平均地权”，核定地价，逐步实现土地国有，解决贫富不均。
  misconceptions:
    - 误以为民生主义是“没收地主土地无偿分给农民”
    - 将民生主义与民权主义混淆，说成“创立民国”
    - 认为民生主义当时已提出“耕者有其田”的口号
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:民贵君轻
  type: Concept
  subject: 历史
  title: 民贵君轻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘民贵君轻’说成是孔子或荀子提出的
    - 能指出并纠正这一错误：认为‘民贵君轻’意思是百姓权力高于国君，否定君主制
  aliases: []
  category: 思想主张
  explanation: 孟子提出的思想，认为人民比君主更重要。
  misconceptions:
    - 把‘民贵君轻’说成是孔子或荀子提出的
    - 认为‘民贵君轻’意思是百姓权力高于国君，否定君主制
    - 将‘民贵君轻’当作法家加强君主集权的主张
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:水密隔舱
  type: Concept
  subject: 历史
  title: 水密隔舱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为水密隔舱技术源于欧洲，实际是中国宋代首创
    - 能指出并纠正这一错误：认为水密隔舱的主要作用是提高航行速度，实际是增加抗沉性
  aliases: []
  category: 科技史
  explanation: 宋代海船设置水密隔舱，增加抗沉性和横向强度，当时世界领先。
  misconceptions:
    - 误以为水密隔舱技术源于欧洲，实际是中国宋代首创
    - 认为水密隔舱的主要作用是提高航行速度，实际是增加抗沉性
    - 将水密隔舱的出现时间说成元朝，实际宋代海船已有
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S5.md
- id: concept:历史:水运仪象台
  type: Concept
  subject: 历史
  title: 水运仪象台
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为水运仪象台是沈括主持创制，实际是苏颂主持
    - 能指出并纠正这一错误：误以为它是地震检测仪器，实际是天文观测、演示和报时仪器
  aliases: []
  category: 科技成就
  explanation: 北宋苏颂主持创制的天文仪器，集观测、演示和报时于一身，早于欧洲同类仪器数百年。
  misconceptions:
    - 误认为水运仪象台是沈括主持创制，实际是苏颂主持
    - 误以为它是地震检测仪器，实际是天文观测、演示和报时仪器
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:永安建制
  type: Concept
  subject: 历史
  title: 永安建制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为永安建制是在定都天京后，实际是在攻克永安后、定都前
    - 能指出并纠正这一错误：认为分封诸王是洪秀全一人决定，实际是建制的一部分
  aliases: []
  category: 历史事件
  explanation: 太平军攻克永安后，洪秀全分封诸王，初步建立起政权组织。
  misconceptions:
    - 误以为永安建制是在定都天京后，实际是在攻克永安后、定都前
    - 认为分封诸王是洪秀全一人决定，实际是建制的一部分
    - 将永安建制等同于建立政权，实际只是初步建立政权组织
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:求同存异
  type: Concept
  subject: 历史
  title: 求同存异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把求同存异说成是周恩来在日内瓦会议上提出的，场合错误。
    - 能指出并纠正这一错误：认为求同存异是指各国放弃所有分歧，而不是撇开分歧为共同利益合作。
  aliases: []
  category: 外交方针
  explanation: 在万隆会议上提出，呼吁各国撇开分歧，为共同利益合作。
  misconceptions:
    - 把求同存异说成是周恩来在日内瓦会议上提出的，场合错误。
    - 认为求同存异是指各国放弃所有分歧，而不是撇开分歧为共同利益合作。
    - 误以为求同存异是毛泽东提出的，人物张冠李戴。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S4.md
- id: concept:历史:求同存异方针
  type: Concept
  subject: 历史
  title: 求同存异方针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为求同存异方针在日内瓦会议上提出，实际是万隆会议。
    - 能指出并纠正这一错误：把'求同'误解为意识形态相同，实际指共同历史遭遇和愿望。
  aliases: []
  category: 外交方针
  explanation: 周恩来在万隆会议上提出的方针，促进了会议的成功，体现了中国的外交智慧。
  misconceptions:
    - 误认为求同存异方针在日内瓦会议上提出，实际是万隆会议。
    - 把'求同'误解为意识形态相同，实际指共同历史遭遇和愿望。
    - 误以为该方针是毛泽东提出的，实际是周恩来。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:求富口号
  type: Concept
  subject: 历史
  title: 求富口号
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为求富是洋务运动前期口号，实际是后期
    - 能指出并纠正这一错误：认为求富口号下创办的是军事工业，实际是民用工业
  aliases: []
  category: 历史概念
  explanation: 洋务运动后期（19世纪70年代起）的口号，旨在开办民用工业以“求富”，辅助军事工业，如轮船招商局、汉阳铁厂等。
  misconceptions:
    - 误以为求富是洋务运动前期口号，实际是后期
    - 认为求富口号下创办的是军事工业，实际是民用工业
    - 把轮船招商局错归为军事工业，实际是民用企业
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:汉赋与乐府诗
  type: Concept
  subject: 历史
  title: 汉赋与乐府诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为汉赋是民间文学，实际辞藻华丽多为宫廷文人作品。
    - 能指出并纠正这一错误：认为乐府诗多反映宫廷生活，实际来自民间。
  aliases: []
  category: 文学成就
  explanation: 两汉文学成就的代表，赋讲究铺陈排比，辞藻华丽；乐府诗内容丰富，对后代诗歌发展产生重要影响。
  misconceptions:
    - 误以为汉赋是民间文学，实际辞藻华丽多为宫廷文人作品。
    - 认为乐府诗多反映宫廷生活，实际来自民间。
    - 将汉赋与乐府诗混为一体，忽略体裁差异。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:江南地区的开发
  type: Concept
  subject: 历史
  title: 江南地区的开发
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为是江南经济发展带动北方人口南迁，颠倒因果
    - 能指出并纠正这一错误：认为江南开发始于三国时期，忽略西晋末年的转折
  aliases:
    - 江南经济开发
  category: 历史事件
  explanation: 西晋末年以来，北方人口南迁，带来劳动力和先进技术，使江南经济迅速发展。
  misconceptions:
    - 误以为是江南经济发展带动北方人口南迁，颠倒因果
    - 认为江南开发始于三国时期，忽略西晋末年的转折
    - 以偏概全，认为江南所有地区都已是富庶粮仓
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S3.md
- id: concept:历史:江山就是人民，人民就是江山
  type: Concept
  subject: 历史
  title: 江山就是人民，人民就是江山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“江山”仅指国家领土或政权，而忽视其本质是人民利益和民心所向。
    - 能指出并纠正这一错误：把“人民是历史的创造者”曲解为“领袖决定历史”，否定人民的主体地位。
  aliases: []
  category: 执政理念
  explanation: 强调人民是历史的创造者，中国共产党始终坚持以人民为中心，为民造福是立党为公、执政为民的本质要求。
  misconceptions:
    - 认为“江山”仅指国家领土或政权，而忽视其本质是人民利益和民心所向。
    - 把“人民是历史的创造者”曲解为“领袖决定历史”，否定人民的主体地位。
    - 将“以人民为中心”理解为只是关心人民生活，而忘记党的一切工作都是为了人民福祉。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:汪精卫叛国
  type: Concept
  subject: 历史
  title: 汪精卫叛国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为汪精卫投敌发生于相持阶段之前，实际是在相持阶段初期
    - 能指出并纠正这一错误：将伪国民政府建立时间记成1938年或1941年，实际是1940年3月
  aliases: []
  category: 历史事件
  explanation: 抗日战争相持阶段，国民党副总裁汪精卫公开叛国投敌，于1940年3月在南京建立伪国民政府。
  misconceptions:
    - 误以为汪精卫投敌发生于相持阶段之前，实际是在相持阶段初期
    - 将伪国民政府建立时间记成1938年或1941年，实际是1940年3月
    - 误认为汪精卫在北平建立伪政权，实际他在南京建立伪国民政府
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:汪辜会谈
  type: Concept
  subject: 历史
  title: 汪辜会谈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为汪辜会谈是两岸领导人会面，实际是海协会与海基会负责人会谈
    - 能指出并纠正这一错误：将会谈地点说成香港或北京，实际在新加坡
  aliases: []
  category: 历史事件
  explanation: 1993年海协会会长汪道涵与台湾海基会董事长辜振甫在新加坡举行会谈，促进两岸关系发展。
  misconceptions:
    - 误以为汪辜会谈是两岸领导人会面，实际是海协会与海基会负责人会谈
    - 将会谈地点说成香港或北京，实际在新加坡
    - 把汪道涵和辜振甫的身份搞反，误认为辜是海协会会长
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:汶川特大地震
  type: Concept
  subject: 历史
  title: 汶川特大地震
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把汶川地震发生时间记成2009年，与2008年混淆。
    - 能指出并纠正这一错误：误认为汶川地震是地下核试验引发的，不是自然地质灾害。
  aliases: []
  category: 史实
  explanation: 2008年发生，我国取得抗击汶川特大地震的重大胜利，创造了灾后重建的奇迹。
  misconceptions:
    - 把汶川地震发生时间记成2009年，与2008年混淆。
    - 误认为汶川地震是地下核试验引发的，不是自然地质灾害。
    - 将汶川地震与1976年唐山地震混为同一次地震灾害。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:汽车
  type: Concept
  subject: 历史
  title: 汽车
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为汽车是福特发明，实为本茨制造出内燃机驱动的汽车
    - 能指出并纠正这一错误：把汽车归为第一次工业革命产物，实际是第二次
  aliases: []
  category: 交通工具
  explanation: 19世纪80年代德国人本茨制造出由内燃机驱动的汽车，福特汽车公司使用流水线生产使汽车普及。
  misconceptions:
    - 误认为汽车是福特发明，实为本茨制造出内燃机驱动的汽车
    - 把汽车归为第一次工业革命产物，实际是第二次
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:沈括
  type: Concept
  subject: 历史
  title: 沈括
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为沈括是南宋人，实际是北宋科学家
    - 能指出并纠正这一错误：误认为沈括发明了活字印刷术，实际发明者是毕昇
  aliases: []
  category: 历史人物
  explanation: 北宋科学家，著有《梦溪笔谈》，创制十二气历，改进天文仪器。
  misconceptions:
    - 误以为沈括是南宋人，实际是北宋科学家
    - 误认为沈括发明了活字印刷术，实际发明者是毕昇
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:沟通东西方文化的角色
  type: Concept
  subject: 历史
  title: 沟通东西方文化的角色
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为阿拉伯人只传播了中国的火药，而遗漏造纸术和指南针
    - 能指出并纠正这一错误：误将阿拉伯人视为所有东西方文化交流的唯一中介，实际还融合了他人成果
  aliases:
    - 东西方文化交流
  category: 历史贡献
  explanation: 阿拉伯人担当了沟通东西方文化的角色，将中国的造纸术、指南针、火药等传入欧洲。
  misconceptions:
    - 误认为阿拉伯人只传播了中国的火药，而遗漏造纸术和指南针
    - 误将阿拉伯人视为所有东西方文化交流的唯一中介，实际还融合了他人成果
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:河姆渡遗址
  type: Concept
  subject: 历史
  title: 河姆渡遗址
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为河姆渡遗址位于黄河流域，实际在长江下游浙江余姚。
    - 能指出并纠正这一错误：认为河姆渡人种植粟，实际种植水稻，半坡人种植粟。
  aliases: []
  category: 考古遗址
  explanation: 位于浙江余姚，距今约7000年，是长江下游地区稻作农业的代表，有干栏式建筑、骨耜等。
  misconceptions:
    - 认为河姆渡遗址位于黄河流域，实际在长江下游浙江余姚。
    - 认为河姆渡人种植粟，实际种植水稻，半坡人种植粟。
    - 认为河姆渡人住半地穴式房屋，实际住干栏式建筑。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:河西四郡
  type: Concept
  subject: 历史
  title: 河西四郡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为河西四郡位于今新疆，实际在甘肃河西走廊。
    - 能指出并纠正这一错误：认为河西四郡是张骞出使西域后才设置，实际与之无关，是西汉经营西域的举措。
  aliases: []
  category: 行政区划
  explanation: 西汉在河西走廊设置武威、张掖、酒泉、敦煌四郡，加强对西域的控制。
  misconceptions:
    - 误以为河西四郡位于今新疆，实际在甘肃河西走廊。
    - 认为河西四郡是张骞出使西域后才设置，实际与之无关，是西汉经营西域的举措。
    - 把河西四郡归为西域都护府管辖，实际是西汉在河西走廊的行政设置。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:沿海开放城市
  type: Concept
  subject: 历史
  title: 沿海开放城市
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把深圳、珠海等经济特区也算作沿海开放城市，实际两者不同
    - 能指出并纠正这一错误：误认为开放的14个城市包括所有沿海城市，实际只选择部分港口城市
  aliases: []
  category: 历史概念
  explanation: 1984年开放的14个沿海港口城市，如大连、天津、青岛等，以促进对外开放。
  misconceptions:
    - 把深圳、珠海等经济特区也算作沿海开放城市，实际两者不同
    - 误认为开放的14个城市包括所有沿海城市，实际只选择部分港口城市
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S3.md
- id: concept:历史:沿海经济开放区
  type: Concept
  subject: 历史
  title: 沿海经济开放区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为沿海经济开放区包括14个沿海开放城市，实际是三个三角地区
    - 能指出并纠正这一错误：误认为长江三角洲等是后来扩大时划定的，实际是1985年首批
  aliases: []
  category: 历史概念
  explanation: 1985年划定的长江三角洲、珠江三角洲和闽南厦漳泉三角地区，作为沿海经济开放区。
  misconceptions:
    - 以为沿海经济开放区包括14个沿海开放城市，实际是三个三角地区
    - 误认为长江三角洲等是后来扩大时划定的，实际是1985年首批
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:沿海经济开放区扩大
  type: Concept
  subject: 历史
  title: 沿海经济开放区扩大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为扩大后包含海南，实际海南是独立设省并建特区
    - 能指出并纠正这一错误：把扩大时间说成1984年，实际是1988年
  aliases: []
  category: 对外开放
  explanation: 1988年国家决定扩大沿海经济开放区，新划入140个市、县。
  misconceptions:
    - 误认为扩大后包含海南，实际海南是独立设省并建特区
    - 把扩大时间说成1984年，实际是1988年
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:法兰克王国
  type: Concept
  subject: 历史
  title: 法兰克王国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为法兰克王国是查理曼建立，实际为克洛维
    - 能指出并纠正这一错误：认为法兰克王国建国之初就信仰基督教，实为克洛维时皈依
  aliases: []
  category: 政治
  explanation: 481年由日耳曼人建立，是西欧主要国家的起源，克洛维统治时期皈依基督教并不断扩张。
  misconceptions:
    - 误以为法兰克王国是查理曼建立，实际为克洛维
    - 认为法兰克王国建国之初就信仰基督教，实为克洛维时皈依
    - 将法兰克王国等同于法国，忽略它是多个西欧国家的起源
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:法兰西第一共和国
  type: Concept
  subject: 历史
  title: 法兰西第一共和国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为第一共和国成立于1789年攻占巴士底狱当天
    - 能指出并纠正这一错误：认为第一共和国由拿破仑建立，且实行君主制
  aliases: []
  category: 政治实体
  explanation: 1792年法国废除君主制后建立的共和国，是法国历史上第一个共和国。
  misconceptions:
    - 误以为第一共和国成立于1789年攻占巴士底狱当天
    - 认为第一共和国由拿破仑建立，且实行君主制
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:法国大革命
  type: Concept
  subject: 历史
  title: 法国大革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为法国大革命确立了君主立宪制，不断重复英国道路
    - 能指出并纠正这一错误：将《权利法案》当作法国大革命的纲领性文件
  aliases: []
  category: 历史事件
  explanation: 1789年爆发的资产阶级革命，推翻封建专制，传播自由平等思想。
  misconceptions:
    - 误以为法国大革命确立了君主立宪制，不断重复英国道路
    - 将《权利法案》当作法国大革命的纲领性文件
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:法家学派
  type: Concept
  subject: 历史
  title: 法家学派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把韩非说成春秋时期人，与老子的时代混为一谈
    - 能指出并纠正这一错误：认为法家学派的代表人物是孔子或孟子
  aliases: []
  category: 学派
  explanation: 以韩非为代表，主张以法治国、中央集权。
  misconceptions:
    - 把韩非说成春秋时期人，与老子的时代混为一谈
    - 认为法家学派的代表人物是孔子或孟子
    - 认为法家主张‘无为而治’或‘仁政’，与道家、儒家混同
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:法老
  type: Concept
  subject: 历史
  title: 法老
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为法老是古代印度国王的称谓，实际是古埃及国王的称呼。
    - 能指出并纠正这一错误：认为法老权力有限，受祭司控制，实际集军政财神大权于一身。
  aliases: []
  category: 历史
  explanation: 法老是古埃及国王的称谓，集军、政、财、神等大权于一身，被认为是“神之子”。
  misconceptions:
    - 误认为法老是古代印度国王的称谓，实际是古埃及国王的称呼。
    - 认为法老权力有限，受祭司控制，实际集军政财神大权于一身。
    - 把法老看作单纯的宗教领袖，忽视其世俗君主身份。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:法西斯同盟
  type: Concept
  subject: 历史
  title: 法西斯同盟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把法西斯同盟认为只包含德国和日本，忽略意大利
    - 能指出并纠正这一错误：误以为《反共产国际协定》或《德意日三国同盟条约》是《联合国家宣言》
  aliases:
    - 轴心国
  category: 历史事件
  explanation: 德国、意大利和日本通过签订《反共产国际协定》和《德意日三国同盟条约》形成的侵略集团。
  misconceptions:
    - 把法西斯同盟认为只包含德国和日本，忽略意大利
    - 误以为《反共产国际协定》或《德意日三国同盟条约》是《联合国家宣言》
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:法西斯政权
  type: Concept
  subject: 历史
  title: 法西斯政权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为法西斯政权只在德国和日本建立，忽略意大利
    - 能指出并纠正这一错误：把意大利法西斯政权建立时间说成1929年经济大危机后，实际是1922年墨索里尼上台
  aliases:
    - 法西斯主义
  category: 政治制度
  explanation: 20世纪20-30年代在意大利、德国、日本建立的独裁政权，对内实行独裁，对外侵略扩张。
  misconceptions:
    - 认为法西斯政权只在德国和日本建立，忽略意大利
    - 把意大利法西斯政权建立时间说成1929年经济大危机后，实际是1922年墨索里尼上台
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S3.md
- id: concept:历史:洋务派
  type: Concept
  subject: 历史
  title: 洋务派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把奕䜣当作地方代表人物，实际是中央代表
    - 能指出并纠正这一错误：将张之洞归为中央代表，实际是地方代表人物
  aliases: []
  category: 历史人物群体
  explanation: 第二次鸦片战争后，主张利用西方先进技术强兵富国、维护清王朝统治的开明官员，中央以奕䜣为代表，地方以曾国藩、李鸿章、左宗棠、张之洞等为代表。
  misconceptions:
    - 误把奕䜣当作地方代表人物，实际是中央代表
    - 将张之洞归为中央代表，实际是地方代表人物
    - 认为洋务派主张改变封建制度，实际只学习西方技术
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:洋务运动
  type: Concept
  subject: 历史
  title: 洋务运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将洋务运动时间延续到20世纪初，实际到90年代中期
    - 能指出并纠正这一错误：认为洋务运动是中国近代史的开端，实际是鸦片战争
  aliases:
    - 自强求富运动
  category: 历史事件
  explanation: 19世纪60年代到90年代中期，清政府洋务派以“自强”“求富”为口号，利用西方先进技术维护清朝统治的自我运动，是中国早期现代化的初步探索。
  misconceptions:
    - 误将洋务运动时间延续到20世纪初，实际到90年代中期
    - 认为洋务运动是中国近代史的开端，实际是鸦片战争
    - 把口号记成变法图强，实际是自强求富
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:洋务运动的局限性
  type: Concept
  subject: 历史
  title: 洋务运动的局限性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为洋务运动失败因列强侵略太强，实际是封建制度腐败
    - 能指出并纠正这一错误：认为洋务运动完全阻碍了民族资本主义，实际客观上促进其产生
  aliases: []
  category: 历史评价
  explanation: 洋务运动由于清朝政治腐败和外国势力挤压，求强求富目标未实现，未能使中国富强，但客观上促进了民族资本主义产生。
  misconceptions:
    - 误以为洋务运动失败因列强侵略太强，实际是封建制度腐败
    - 认为洋务运动完全阻碍了民族资本主义，实际客观上促进其产生
    - 说洋务运动毫无积极作用，忽略它开启中国近代化
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:洛川会议
  type: Concept
  subject: 历史
  title: 洛川会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为洛川会议标志着毛泽东在党内领导地位的确立，实际是遵义会议。
    - 能指出并纠正这一错误：误以为洛川会议通过了《抗日救国十大纲领》和《论持久战》，实际只通过前者。
  aliases: []
  category: 历史事件
  explanation: 1937年8月，中国共产党在洛川召开政治局扩大会议，确定全面的全民族抗战路线，通过《中国共产党抗日救国十大纲领》。
  misconceptions:
    - 误以为洛川会议标志着毛泽东在党内领导地位的确立，实际是遵义会议。
    - 误以为洛川会议通过了《抗日救国十大纲领》和《论持久战》，实际只通过前者。
    - 误以为洛川会议在延安城内召开，实际在陕西洛川县的冯家村。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:洪秀全与金田起义
  type: Concept
  subject: 历史
  title: 洪秀全与金田起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将金田起义时间记为1853年，以为定都天京才是运动开始
    - 能指出并纠正这一错误：误把金田起义地点记为广东花县，实际发生在广西金田村
  aliases:
    - 金田起义
  category: 历史事件
  explanation: 1851年1月11日洪秀全在广西金田村发动起义，建号太平天国，标志着太平天国运动的开始。
  misconceptions:
    - 误将金田起义时间记为1853年，以为定都天京才是运动开始
    - 误把金田起义地点记为广东花县，实际发生在广西金田村
    - 认为金田起义是太平天国运动的高潮或结束，忽略它是开始的标志
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:活字印刷术
