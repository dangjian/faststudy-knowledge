  category: 历史人物
  explanation: 南美洲南部独立运动领导人，领导阿根廷、智利、秘鲁独立，与玻利瓦尔并称南美“解放者”。
  misconceptions:
    - 误认为圣马丁领导了墨西哥独立，实际他领导阿根廷、智利、秘鲁独立。
    - 误把圣马丁与玻利瓦尔的事迹互换，如认为他解放了委内瑞拉。
