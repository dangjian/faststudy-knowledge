  explanation: 1942年，中国远征军入缅甸作战，支援盟军，为世界反法西斯战争作出贡献。
  misconceptions:
    - 误以为中国远征军入缅作战开始于1941年
    - 混淆远征军入缅与抗美援朝，说成出国作战
    - 认为远征军入缅是侵占缅甸，而非支援盟军
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
