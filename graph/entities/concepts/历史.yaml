  category: 历史事件
  explanation: 1924年至1927年，国共合作进行的反帝反封建的革命运动，包括北伐战争和工农运动。
  misconceptions:
    - 认为国民革命就是北伐战争，忽略了工农运动等其他内容
    - 认为国民革命由国民党单独领导，忽略了共产党的参与
    - 认为国民革命取得了彻底胜利，实际最终失败
