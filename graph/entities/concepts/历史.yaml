  subject: 历史
  title: 垄断组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为垄断组织出现在第一次工业革命后，实际是第二次工业革命后。
    - 能指出并纠正这一错误：认为垄断组织导致生产集中，实际是生产集中形成垄断。
