  subject: 历史
  title: 国民革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国民革命就是北伐战争，忽略了工农运动等其他内容
    - 能指出并纠正这一错误：认为国民革命由国民党单独领导，忽略了共产党的参与
  aliases:
