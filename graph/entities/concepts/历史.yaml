  category: 历史概念
  explanation: 古代中国与外国交通贸易和文化交往的海上通道，郑和下西洋发展了海上丝绸之路。
  misconceptions:
    - 认为郑和下西洋开辟了海上丝绸之路，实际他之前已存在
    - 说海上丝绸之路始于明朝，实际汉唐时已有
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:海上马车夫
