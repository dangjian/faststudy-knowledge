    - 误把十八届四中全会主题记成‘全面深化改革’或‘全面从严治党’。
    - 把‘全面推进依法治国’写成‘全面依法治国’，漏掉‘推进’二字。
    - 误以为十八届四中全会提出‘全面建成小康社会’目标，实际是十八大。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:中共十四大
  type: Concept
  subject: 历史
  title: 中共十四大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为十四大确立了邓小平理论为指导思想
    - 能指出并纠正这一错误：认为十四大提出三步走战略
  aliases:
    - 中国共产党第十四次全国代表大会
  category: 历史事件
  explanation: 1992年举行，提出建立社会主义市场经济体制的改革目标，江泽民当选中央委员会总书记。
  misconceptions:
    - 认为十四大确立了邓小平理论为指导思想；实际上那是十五大。
    - 认为十四大提出三步走战略；实际上那是十三大。
    - 认为十四大提出依法治国基本方略；实际上那是十五大。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S4.md
- id: concept:历史:中华人民共和国成立的历史意义
  type: Concept
  subject: 历史
  title: 中华人民共和国成立的历史意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新中国成立标志社会主义制度确立，实际是三大改造完成。
    - 能指出并纠正这一错误：认为新中国成立结束了封建土地所有制，实际是土地改革完成的。
  aliases:
    - 新中国成立的意义
  category: 历史意义
  explanation: 彻底结束了旧中国半殖民地半封建社会的历史，实现了民族独立和人民解放，中国发展从此开启了新纪元，极大改变了世界政治格局。
  misconceptions:
    - 认为新中国成立标志社会主义制度确立，实际是三大改造完成。
    - 认为新中国成立结束了封建土地所有制，实际是土地改革完成的。
    - 把新中国成立与抗日战争胜利的意义等同，忽视其开辟新纪元。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:中华文明多元一体格局
  type: Concept
  subject: 历史
  title: 中华文明多元一体格局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中华文明仅起源于黄河流域，忽略长江流域等多元起源。
    - 能指出并纠正这一错误：将‘多元’理解为各文明完全独立发展，否定中原核心的引领作用。
  aliases: []
  category: 历史概念
  explanation: 中华文明从各地起源，最终形成以中原为核心的多民族统一格局。
  misconceptions:
    - 认为中华文明仅起源于黄河流域，忽略长江流域等多元起源。
    - 将‘多元’理解为各文明完全独立发展，否定中原核心的引领作用。
    - 误认为‘一体’指中华文明只有一个源头，而非多区域交融形成。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S6.md
- id: concept:历史:中华文明探源工程
  type: Concept
  subject: 历史
  title: 中华文明探源工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为该工程只是单纯考古挖文物，忽略了多学科综合研究
    - 能指出并纠正这一错误：以为工程结论是中华文明五千年早已公认，不需要提出判断标准
  aliases: []
  category: 考古工程
  explanation: 以考古学为基础的综合研究，提出判断进入文明社会标准的中国方案，论证中华文明五千年。
  misconceptions:
    - 认为该工程只是单纯考古挖文物，忽略了多学科综合研究
    - 以为工程结论是中华文明五千年早已公认，不需要提出判断标准
    - 误把探源工程当成只研究夏商周，不涉及更早起源
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:中华民国成立
  type: Concept
  subject: 历史
  title: 中华民国成立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把中华民国成立的时间记成1912年2月12日清帝退位那天。
    - 能指出并纠正这一错误：误认为孙中山在南京就任的是正式大总统，而非临时大总统。
  aliases:
    - 南京临时政府成立
  category: 历史事件
  explanation: 1912年1月1日，孙中山在南京宣誓就任临时大总统，宣告中华民国临时政府成立。
  misconceptions:
    - 把中华民国成立的时间记成1912年2月12日清帝退位那天。
    - 误认为孙中山在南京就任的是正式大总统，而非临时大总统。
    - 以为中华民国成立的地点在北京，而不是南京。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S5.md
- id: concept:历史:中华苏维埃共和国临时中央政府
  type: Concept
  subject: 历史
  title: 中华苏维埃共和国临时中央政府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中华苏维埃共和国临时中央政府是长征途中成立的，实际是1931年冬在瑞金成立。
    - 能指出并纠正这一错误：误以为中华苏维埃共和国定都在延安，实际首都是江西瑞金。
  aliases:
    - 瑞金中央政府
    - 中华苏维埃共和国临时中央政府成立
  category: 历史事件
  explanation: 1931年冬，中华苏维埃第一次全国代表大会在江西瑞金召开，宣布成立中华苏维埃共和国临时中央政府，定都瑞金，毛泽东当选为主席。
  misconceptions:
    - 误以为中华苏维埃共和国临时中央政府是长征途中成立的，实际是1931年冬在瑞金成立。
    - 误以为中华苏维埃共和国定都在延安，实际首都是江西瑞金。
    - 误以为毛泽东当选的是中共中央总书记，实际当选的是临时中央政府主席。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
