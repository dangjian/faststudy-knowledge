  misconceptions:
    - 把脱贫攻坚精神内容误记为‘为民服务、勤政务实’等，与干部作风混淆。
    - 将‘尽锐出战’错写成‘全力以赴’，不能准确对应脱贫攻坚精神表述。
    - 认为脱贫攻坚精神与伟大建党精神等同，没有区分具体内涵。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S2.md
- id: concept:历史:自强口号
  type: Concept
  subject: 历史
  title: 自强口号
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为自强是洋务运动后期口号，实际是前期
    - 能指出并纠正这一错误：把自强口号下的江南机器制造总局当成民用工业
  aliases: []
  category: 历史概念
  explanation: 洋务运动前期（19世纪60年代起）的口号，旨在创办近代军事工业以“自强”，如江南机器制造总局、福州船政局等。
  misconceptions:
    - 误以为自强是洋务运动后期口号，实际是前期
    - 把自强口号下的江南机器制造总局当成民用工业
    - 认为自强口号是为了求富，实际是为了自强创办军事工业
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:自由贸易试验区
  type: Concept
  subject: 历史
  title: 自由贸易试验区
  conceptType: 概念型
  masteryCriteria:
