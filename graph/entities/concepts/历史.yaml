- id: concept:历史:中法《越南条款》
  type: Concept
  subject: 历史
  title: 中法《越南条款》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《越南条款》当作平等条约，实际是法国强迫清政府签订的不平等条约。
    - 能指出并纠正这一错误：错误认为条约签订于中法战争之前，实际签订于镇南关大捷后的1885年。
  aliases: []
  category: 历史条约
  explanation: 1885年清政府与法国签订，承认越南受法国保护，同意开埠通商等，使法国势力侵入中国云南、广西。
  misconceptions:
    - 误将《越南条款》当作平等条约，实际是法国强迫清政府签订的不平等条约。
    - 错误认为条约签订于中法战争之前，实际签订于镇南关大捷后的1885年。
    - 误认为条约承认越南独立，实际是承认越南受法国保护。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:中法战争
  type: Concept
  subject: 历史
  title: 中法战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为中法战争爆发于1884年，实际是1883年12月。
    - 能指出并纠正这一错误：错误认为镇南关大捷后清军乘胜追击收复失地，实际清政府却乘胜求和签约。
  aliases: []
  category: 历史事件
  explanation: 1883年12月，法国进攻清军，中法战争爆发；1885年镇南关大捷后，清政府与法国签订《越南条款》，法国势力侵入中国西南。
  misconceptions:
    - 误认为中法战争爆发于1884年，实际是1883年12月。
    - 错误认为镇南关大捷后清军乘胜追击收复失地，实际清政府却乘胜求和签约。
    - 把中法战争说成中国胜利且收回领土，实际法国势力侵入西南，不败而败。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:中美关系正常化
  type: Concept
  subject: 历史
  title: 中美关系正常化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为1972年尼克松访华时中美正式建交，实际建交在1979年。
    - 能指出并纠正这一错误：把尼克松首次访华时间记成1971年，混淆基辛格秘密访华。
  aliases:
    - 中美建交
  category: 历史事件
  explanation: 1972年尼克松访华，发表《中美联合公报》，两国关系开始走向正常化。
  misconceptions:
    - 误以为1972年尼克松访华时中美正式建交，实际建交在1979年。
    - 把尼克松首次访华时间记成1971年，混淆基辛格秘密访华。
    - 误认为乒乓外交发生在尼克松访华之后，实际乒乓外交为先导。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:中英联合声明
  type: Concept
  subject: 历史
  title: 中英联合声明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将中英联合声明签署时间记成1997年，实际是1984年
    - 能指出并纠正这一错误：认为声明规定香港1997年6月30日回归，实际是7月1日零点
  aliases: []
  category: 历史事件
  explanation: 1984年中英签署，确认中国政府于1997年7月1日对香港恢复行使主权。
  misconceptions:
    - 误将中英联合声明签署时间记成1997年，实际是1984年
    - 认为声明规定香港1997年6月30日回归，实际是7月1日零点
    - 误以为声明宣布对香港1999年恢复行使主权
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:中葡联合声明
  type: Concept
  subject: 历史
  title: 中葡联合声明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将中葡联合声明签署时间误为1984年，实际是1987年
    - 能指出并纠正这一错误：误以为澳门回归时是2000年，实际是1999年
  aliases: []
  category: 历史事件
  explanation: 1987年中葡签署，宣布中国政府于1999年12月20日对澳门恢复行使主权。
  misconceptions:
    - 将中葡联合声明签署时间误为1984年，实际是1987年
    - 误以为澳门回归时是2000年，实际是1999年
    - 误以为中葡声明比中英声明早签署
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:中途岛海战
  type: Concept
  subject: 历史
  title: 中途岛海战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中途岛海战发生在珍珠港事件之前
    - 能指出并纠正这一错误：认为中途岛海战是日本获胜，实际是美国大胜
  aliases: []
  category: 历史事件
  explanation: 1942年6月，美国海军在中途岛击败日本海军，使日本在太平洋战场丧失主动权。
  misconceptions:
    - 误以为中途岛海战发生在珍珠港事件之前
    - 认为中途岛海战是日本获胜，实际是美国大胜
    - 把中途岛海战当作欧洲战场的战役
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:中非新型战略伙伴关系
  type: Concept
  subject: 历史
  title: 中非新型战略伙伴关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中非新型战略伙伴关系是军事同盟，实际是不结盟的全面合作。
    - 能指出并纠正这一错误：误把中非合作论坛北京峰会时间记成2000年，实际是2006年。
  aliases: []
  category: 外交概念
  explanation: 2006年中非合作论坛北京峰会上宣布建立，体现中国与非洲国家在政治、经济、文化等领域的全面合作。
  misconceptions:
    - 误以为中非新型战略伙伴关系是军事同盟，实际是不结盟的全面合作。
    - 误把中非合作论坛北京峰会时间记成2000年，实际是2006年。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S3.md
- id: concept:历史:为政以德
  type: Concept
  subject: 历史
  title: 为政以德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘为政以德’的提出者写成孟子，实际是孔子。
    - 能指出并纠正这一错误：错把‘为政以德’等同于‘无为而治’，混淆儒道主张。
  aliases: []
  category: 思想主张
  explanation: 孔子提出的政治主张，要求统治者以德治国，爱惜民力。
  misconceptions:
    - 误将‘为政以德’的提出者写成孟子，实际是孔子。
    - 错把‘为政以德’等同于‘无为而治’，混淆儒道主张。
    - 误认为‘为政以德’要求严刑峻法，与德治本义相反。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:义和团运动
  type: Concept
  subject: 历史
  title: 义和团运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为义和团提出反清复明，实际是扶清灭洋
    - 能指出并纠正这一错误：将义和团与太平天国混淆，二者斗争对象不同
  aliases: []
  category: 历史事件
  explanation: 19世纪末兴起的反帝爱国运动，反抗帝国主义侵略，后被八国联军和清政府联合绞杀。
  misconceptions:
    - 误认为义和团提出反清复明，实际是扶清灭洋
    - 将义和团与太平天国混淆，二者斗争对象不同
    - 说义和团运动是反封建运动，实际是反帝爱国运动
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:九一八事变
  type: Concept
  subject: 历史
  title: 九一八事变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把九一八事变时间写成1937年，误以为它标志全面抗战开始。
    - 能指出并纠正这一错误：认为九一八事变后中国开始全民族抗战，实际是局部抗战。
  aliases:
    - 柳条湖事件
  category: 历史事件
  explanation: 1931年9月18日，日本侵略者发动九一八事变，侵占中国东北，中国人民的抗日战争开始。
  misconceptions:
    - 把九一八事变时间写成1937年，误以为它标志全面抗战开始。
    - 认为九一八事变后中国开始全民族抗战，实际是局部抗战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:九二共识
  type: Concept
  subject: 历史
  title: 九二共识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把九二共识等同于一国两制
    - 能指出并纠正这一错误：认为九二共识是两岸官方签署的正式协议
  aliases: []
  category: 历史事件
  explanation: 1992年海峡两岸关系协会与台湾海峡交流基金会达成的共识，核心是海峡两岸均坚持一个中国原则。
  misconceptions:
    - 把九二共识等同于一国两制；实际核心是坚持一个中国原则。
    - 认为九二共识是两岸官方签署的正式协议；实际是两会达成的口头共识。
    - 认为九二共识承认一中一台或两个中国；实际双方均坚持一个中国。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:习近平新时代中国特色社会主义思想
  type: Concept
  subject: 历史
  title: 习近平新时代中国特色社会主义思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为该思想在中共十八大时写入党章，实际是十九大写入党章。
    - 能指出并纠正这一错误：误以为习近平新时代中国特色社会主义思想由邓小平等老一代领导人提出，实际是习近平提出。
  aliases: []
  category: 指导思想
  explanation: 中共十九大确立为党的指导思想并写入党章，后载入宪法，是新时代党和国家事业发展的行动指南。
  misconceptions:
    - 认为该思想在中共十八大时写入党章，实际是十九大写入党章。
    - 误以为习近平新时代中国特色社会主义思想由邓小平等老一代领导人提出，实际是习近平提出。
    - 混淆“行动指南”与“根本大法”，其实它写入党章和宪法。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:书法艺术
  type: Concept
  subject: 历史
  title: 书法艺术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为书法在东汉前已是供人欣赏的艺术，实际东汉后才逐渐成为。
    - 能指出并纠正这一错误：误认为王羲之是唐代人，把书法艺术成熟归功于唐代。
  aliases: []
  category: 文化概念
  explanation: 东汉以后逐渐成为供人欣赏的艺术，王羲之被誉为“书圣”，代表作《兰亭集序》被称为“天下第一行书”。
  misconceptions:
    - 误以为书法在东汉前已是供人欣赏的艺术，实际东汉后才逐渐成为。
    - 误认为王羲之是唐代人，把书法艺术成熟归功于唐代。
    - 误将《兰亭集序》当作楷书，实际它是行书。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:二七惨案
  type: Concept
  subject: 历史
  title: 二七惨案
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将二七惨案时间记成1922年，前后颠倒了一整年
    - 能指出并纠正这一错误：误以为二七惨案发生在罢工之前，是惨案引发了罢工
  aliases: []
  category: 历史事件
  explanation: 1923年2月7日，吴佩孚镇压京汉铁路罢工工人，制造血腥惨案，共产党员林祥谦英勇就义。
  misconceptions:
    - 将二七惨案时间记成1922年，前后颠倒了一整年
    - 误以为二七惨案发生在罢工之前，是惨案引发了罢工
    - 把林祥谦在二七惨案中牺牲误记为其他罢工事件中牺牲
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:二十一条
  type: Concept
  subject: 历史
  title: 二十一条
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《二十一条》的签订时间说成1895年甲午战争后。
    - 能指出并纠正这一错误：误认为中国是战败国被迫签订《二十一条》，与《马关条约》混为一谈。
  aliases:
    - 二十一条要求
  category: 历史条约
  explanation: 1915年日本向袁世凯提出的旨在灭亡中国的秘密条款，袁世凯为换取支持而接受大部分内容，严重损害中国主权。
  misconceptions:
    - 把《二十一条》的签订时间说成1895年甲午战争后。
    - 误认为中国是战败国被迫签订《二十一条》，与《马关条约》混为一谈。
    - 认为袁世凯全部接受二十一条，未作任何抵制，实际有拖延和部分拒绝。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:二十四节气
  type: Concept
  subject: 历史
  title: 二十四节气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为二十四节气是按农历固定日期划分，每年公历日期不变
    - 能指出并纠正这一错误：认为二十四节气是近代气象学家测量气象后发明，与战国时期无关
  aliases: []
  category: 历法
  explanation: 战国时期人们将一年分为二十四节气，用于指导农业生产。
  misconceptions:
    - 误以为二十四节气是按农历固定日期划分，每年公历日期不变
    - 认为二十四节气是近代气象学家测量气象后发明，与战国时期无关
    - 将二十四节气说成是商朝甲骨文中已经完整记载的历法
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:二月革命
  type: Concept
  subject: 历史
  title: 二月革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为二月革命发生在公历10月，实际是3月
    - 能指出并纠正这一错误：认为二月革命推翻了临时政府，实际推翻沙皇
  aliases: []
  category: 历史事件
  explanation: 1917年3月俄国爆发革命，推翻沙皇专制统治，建立资产阶级临时政府。
  misconceptions:
    - 误以为二月革命发生在公历10月，实际是3月
    - 认为二月革命推翻了临时政府，实际推翻沙皇
    - 把二月革命与十月革命混为一谈
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S2.md
- id: concept:历史:二次革命
  type: Concept
  subject: 历史
  title: 二次革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把二次革命的导火索误认为武昌起义，而非宋教仁遇刺。
    - 能指出并纠正这一错误：误认为二次革命发生在袁世凯称帝之后，实际在1913年。
  aliases: []
  category: 历史事件
  explanation: 1913年孙中山等革命党人发动的反对袁世凯独裁的武装斗争，因力量悬殊而失败。
  misconceptions:
    - 把二次革命的导火索误认为武昌起义，而非宋教仁遇刺。
    - 误认为二次革命发生在袁世凯称帝之后，实际在1913年。
    - 以为二次革命取得了胜利，实际上因力量悬殊失败。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S5.md
- id: concept:历史:二里头遗址
  type: Concept
  subject: 历史
  title: 二里头遗址
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把二里头遗址说成商朝都城，误为殷墟。
    - 能指出并纠正这一错误：认为二里头遗址只有宫殿，忽略青铜器和墓葬等。
  aliases: []
  category: 考古发现
  explanation: 二里头遗址位于洛阳附近，是夏朝后期都城遗址，反映了夏朝时期的文明发展水平。
  misconceptions:
    - 把二里头遗址说成商朝都城，误为殷墟。
    - 认为二里头遗址只有宫殿，忽略青铜器和墓葬等。
    - 将二里头文化等同于夏朝所有遗址，以偏概全。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:云冈石窟
  type: Concept
  subject: 历史
  title: 云冈石窟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为云冈石窟位于河南洛阳，将其与龙门石窟地点混淆。
    - 能指出并纠正这一错误：误以为云冈石窟开凿于秦朝或汉朝，实际是北魏时期。
  aliases: []
  category: 艺术成就
  explanation: 位于山西大同，是北魏时期开凿的石窟，雕刻有数以万计的造像。
  misconceptions:
    - 认为云冈石窟位于河南洛阳，将其与龙门石窟地点混淆。
    - 误以为云冈石窟开凿于秦朝或汉朝，实际是北魏时期。
    - 把云冈石窟当作道教石窟，实际是佛教石窟。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:五个一工程
  type: Concept
  subject: 历史
  title: 五个一工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为五个一工程是经济建设规划
    - 能指出并纠正这一错误：认为五个一工程开始于2000年
  aliases: []
  category: 文化建设
  explanation: 从1991年开始实施的精神文明建设活动，推出一大批优秀作品。
  misconceptions:
    - 认为五个一工程是经济建设规划；实际是精神文明建设活动。
    - 认为五个一工程开始于2000年；实际从1991年开始实施。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:五代十国
  type: Concept
  subject: 历史
  title: 五代十国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为五代都在北方，十国都在南方，实际十国中的北汉在北方
    - 能指出并纠正这一错误：认为五代十国是同时并存五个和十个政权，实际五代先后更替，十国并存
  aliases: []
  category: 历史时期
  explanation: 唐朝灭亡后，北方先后出现五个政权，南方出现九个政权，加上北汉，合称五代十国。
  misconceptions:
    - 认为五代都在北方，十国都在南方，实际十国中的北汉在北方
    - 认为五代十国是同时并存五个和十个政权，实际五代先后更替，十国并存
    - 把十国写成十个国家，忘加北汉，或误把北汉算入五代
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:五位一体总体布局
  type: Concept
  subject: 历史
  title: 五位一体总体布局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：遗漏“社会建设”，写成“经济、政治、文化、生态文明”四方面。
    - 能指出并纠正这一错误：将“五位一体”误写为“经济建设、政治建设、文化建设、社会建设、国防建设”。
  aliases: []
  category: 战略布局
  explanation: 指经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，促进现代化建设各方面相协调。
  misconceptions:
    - 遗漏“社会建设”，写成“经济、政治、文化、生态文明”四方面。
    - 将“五位一体”误写为“经济建设、政治建设、文化建设、社会建设、国防建设”。
    - 混淆“五位一体”与“四个全面”，认为“五位一体”是战略布局。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:五军都督府
  type: Concept
  subject: 历史
  title: 五军都督府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为五军都督府有调兵权，实际调兵权归兵部，都督府只管理兵籍和训练。
    - 能指出并纠正这一错误：认为五军都督府是武官机构，能直接统兵作战，实为军事管理机构。
  aliases: []
  category: 政治制度
  explanation: 明太祖将大都督府分为五军都督府，分散兵权，军队调动和武官任命归兵部。
  misconceptions:
    - 误以为五军都督府有调兵权，实际调兵权归兵部，都督府只管理兵籍和训练。
    - 认为五军都督府是武官机构，能直接统兵作战，实为军事管理机构。
    - 混淆五军都督府与五城兵马司，后者负责京城治安。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:五四精神
  type: Concept
  subject: 历史
  title: 五四精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为五四精神的核心是民主与科学，实为爱国主义。
    - 能指出并纠正这一错误：将五四运动直接目标当成五四精神，混淆了具体行动与精神内涵。
  aliases: []
  category: 历史概念
  explanation: 五四运动孕育的以爱国、进步、民主、科学为主要内容的伟大精神，其核心是爱国主义精神。
  misconceptions:
    - 误认为五四精神的核心是民主与科学，实为爱国主义。
    - 将五四运动直接目标当成五四精神，混淆了具体行动与精神内涵。
    - 误认为五四精神只强调爱国，忽略进步、民主、科学。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S4.md
- id: concept:历史:五四运动
  type: Concept
  subject: 历史
  title: 五四运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为五四运动导火索是北洋政府签订二十一条，实际是巴黎和会外交失败
    - 能指出并纠正这一错误：把五四运动说成中国共产党领导的爱国运动，当时中共尚未成立
  aliases: []
  category: 历史事件
  explanation: 1919年5月4日爆发的反帝反封建爱国运动，标志着中国新民主主义革命的开端。
  misconceptions:
    - 误以为五四运动导火索是北洋政府签订二十一条，实际是巴黎和会外交失败
    - 把五四运动说成中国共产党领导的爱国运动，当时中共尚未成立
    - 认为五四运动是旧民主主义革命，忽略其新民主主义革命开端地位
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:五四运动的历史意义
  type: Concept
  subject: 历史
  title: 五四运动的历史意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为五四运动后马克思主义才开始在中国传播，实际十月革命后已开始
    - 能指出并纠正这一错误：把五四运动意义说成'完成反帝反封建任务'，实际并未改变社会性质
  aliases: []
  category: 历史意义
  explanation: 五四运动是一次彻底反帝反封建的爱国运动，促进了马克思主义传播，为中国共产党的成立准备了条件。
  misconceptions:
    - 误以为五四运动后马克思主义才开始在中国传播，实际十月革命后已开始
    - 把五四运动意义说成'完成反帝反封建任务'，实际并未改变社会性质
    - 认为五四运动直接创建了中国共产党，忽略思想干部等条件
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:五四运动直接目标
  type: Concept
  subject: 历史
  title: 五四运动直接目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“外争主权，内除国贼”是直接目标，实为口号，直接目标还有三项具体诉求。
    - 能指出并纠正这一错误：误认为释放被捕学生等目标未完全实现，实际全部达成。
  aliases: []
  category: 历史概念
  explanation: 五四运动的直接目标包括释放被捕学生、罢免曹汝霖等人职务、拒绝在巴黎和约上签字，这些目标最终实现。
  misconceptions:
    - 误认为“外争主权，内除国贼”是直接目标，实为口号，直接目标还有三项具体诉求。
    - 误认为释放被捕学生等目标未完全实现，实际全部达成。
    - 误认为直接目标包括废除二十一条，实际未在直接目标中。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S4.md
- id: concept:历史:五大名窑
  type: Concept
  subject: 历史
  title: 五大名窑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认五大名窑是唐代的名窑
    - 能指出并纠正这一错误：把景德镇列入宋代五大名窑
  aliases: []
  category: 历史概念
  explanation: 宋朝瓷器以定窑、汝窑、哥窑、官窑、钧窑五大名窑所产瓷器质量最优。
  misconceptions:
    - 误认五大名窑是唐代的名窑
    - 把景德镇列入宋代五大名窑
    - 认为五大名窑中最著名的是建窑
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:五大战区
  type: Concept
  subject: 历史
  title: 五大战区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将战区名称写为“华北、华东、华南、西北、东北”等老行政区划。
    - 能指出并纠正这一错误：认为五大战区是七大军区直接缩编改称，实际是2016年重新组建。
  aliases: []
  category: 军事
  explanation: 中国人民解放军成立东部、南部、西部、北部、中部五大战区，形成新型军兵种结构布局。
  misconceptions:
    - 误将战区名称写为“华北、华东、华南、西北、东北”等老行政区划。
    - 认为五大战区是七大军区直接缩编改称，实际是2016年重新组建。
    - 误将五大战区顺序写为东南西北中，正确是东部、南部、西部、北部、中部。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S3.md
- id: concept:历史:五星红旗
  type: Concept
  subject: 历史
  title: 五星红旗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为四颗小星代表四个民族，实际代表四个阶级。
    - 能指出并纠正这一错误：误认为五星红旗由毛泽东亲手设计，实际由曾联松设计。
  aliases:
    - 国旗
  category: 历史符号
  explanation: 中华人民共和国国旗，象征全国人民在中国共产党领导下的大团结。
  misconceptions:
    - 误认为四颗小星代表四个民族，实际代表四个阶级。
    - 误认为五星红旗由毛泽东亲手设计，实际由曾联松设计。
    - 误认为四颗小星围绕大星表示君民关系，实际表示共产党领导下的团结。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:五铢钱
  type: Concept
  subject: 历史
  title: 五铢钱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为秦朝统一货币用的是五铢钱，实际为半两钱。
    - 能指出并纠正这一错误：认为汉武帝铸五铢钱前各地已有统一货币，实际当时币制混乱。
  aliases: []
  category: 经济制度
  explanation: 汉武帝将铸币权收归中央，统一铸造五铢钱，以加强经济控制。
  misconceptions:
    - 误以为秦朝统一货币用的是五铢钱，实际为半两钱。
    - 认为汉武帝铸五铢钱前各地已有统一货币，实际当时币制混乱。
    - 把五铢钱当作西汉初年就有的货币，实际是汉武帝时期铸造。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:井冈山会师
  type: Concept
  subject: 历史
  title: 井冈山会师
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为井冈山会师是毛泽东与彭德怀部队的会师，实际是毛泽东与朱德、陈毅的部队会师。
    - 能指出并纠正这一错误：误以为朱德、陈毅率领的是秋收起义部队，实际是南昌起义部分队伍和湘南工农武装。
  aliases:
    - 朱毛会师
  category: 历史事件
  explanation: 1928年4月，朱德、陈毅率领南昌起义部分队伍和湘南工农武装与毛泽东率领的工农革命军在井冈山会师，合编为中国工农革命军第四军，后改称中国工农红军第四军。
  misconceptions:
    - 误以为井冈山会师是毛泽东与彭德怀部队的会师，实际是毛泽东与朱德、陈毅的部队会师。
    - 误以为朱德、陈毅率领的是秋收起义部队，实际是南昌起义部分队伍和湘南工农武装。
    - 误以为井冈山会师后即称中国工农红军第四军，实际先称中国工农革命军第四军。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:井冈山革命根据地
  type: Concept
  subject: 历史
  title: 井冈山革命根据地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为井冈山根据地是南昌起义部队创建的，实际是秋收起义部队到达
    - 能指出并纠正这一错误：把井冈山根据地与中央革命根据地混为一谈，后者在江西瑞金
  aliases:
    - 井冈山根据地
  category: 历史概念
  explanation: 1927年10月，毛泽东率领起义部队到达井冈山地区，创建中国第一个农村革命根据地，拉开中国革命从城市转入农村的序幕。
  misconceptions:
    - 误认为井冈山根据地是南昌起义部队创建的，实际是秋收起义部队到达
    - 把井冈山根据地与中央革命根据地混为一谈，后者在江西瑞金
    - 认为井冈山根据地创建于1928年，实际是1927年10月
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:亚历山大帝国
  type: Concept
  subject: 历史
  title: 亚历山大帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚历山大帝国是波斯帝国的延续
    - 能指出并纠正这一错误：误认为亚历山大东征彻底中断了东西方文化交流
  aliases:
    - 亚历山大东征
  category: 历史概念
  explanation: 公元前4世纪亚历山大东征建立的地跨欧亚非三洲的大帝国，促进了东西方文化交流。
  misconceptions:
    - 误认为亚历山大帝国是波斯帝国的延续
    - 误认为亚历山大东征彻底中断了东西方文化交流
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:亚太经合组织
  type: Concept
  subject: 历史
  title: 亚太经合组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为亚太经合组织是联合国机构，实际是区域性经济合作论坛。
    - 能指出并纠正这一错误：认为中国是亚太经合组织创始成员国，实际上中国1991年加入。
  aliases:
    - APEC
  category: 国际组织
  explanation: 中国高度重视并参与亚太经合组织，推动构建亚太命运共同体。
  misconceptions:
    - 误以为亚太经合组织是联合国机构，实际是区域性经济合作论坛。
    - 认为中国是亚太经合组织创始成员国，实际上中国1991年加入。
    - 将APEC全称误译为“亚洲太平洋经合组织”，或混淆英文缩写APEC与APAC。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:亚洲战争策源地
  type: Concept
  subject: 历史
  title: 亚洲战争策源地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把亚洲战争策源地误认为是中国或意大利
    - 能指出并纠正这一错误：认为日本法西斯专政建立于1937年全面侵华后，实际是1936年军部控制政权
  aliases: []
  category: 历史概念
  explanation: 指日本，1936年军部控制政权后建立法西斯专政，成为二战亚洲战争策源地。
  misconceptions:
    - 把亚洲战争策源地误认为是中国或意大利
    - 认为日本法西斯专政建立于1937年全面侵华后，实际是1936年军部控制政权
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S2.md
- id: concept:历史:亚罗号事件
  type: Concept
  subject: 历史
  title: 亚罗号事件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚罗号是英国船只，实为中国船。
    - 能指出并纠正这一错误：错把亚罗号事件当作第一次鸦片战争的导火线。
  aliases:
    - 亚罗号事件
  category: 历史事件
  explanation: 1856年，英国以中国水师搜查中国船“亚罗号”为借口，制造的事件，成为第二次鸦片战争的导火线之一。
  misconceptions:
    - 误认为亚罗号是英国船只，实为中国船。
    - 错把亚罗号事件当作第一次鸦片战争的导火线。
    - 将亚罗号事件与马神甫事件混淆，张冠李戴。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:亚里士多德的贡献
  type: Concept
  subject: 历史
  title: 亚里士多德的贡献
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亚里士多德提出原子论
    - 能指出并纠正这一错误：误认为亚里士多德是苏格拉底的学生而非柏拉图的学生
  aliases:
    - 亚里士多德的成就
  category: 哲学思想
  explanation: 亚里士多德是百科全书式学者，创立逻辑学，奠定动物学基础。
  misconceptions:
    - 误认为亚里士多德提出原子论
    - 误认为亚里士多德是苏格拉底的学生而非柏拉图的学生
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:交子
  type: Concept
  subject: 历史
  title: 交子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为交子最早出现在南宋临安，实际是北宋前期四川
    - 能指出并纠正这一错误：将交子说成是金属货币，或与铜钱混为一谈
  aliases:
    - 纸币
  category: 经济史
  explanation: 北宋前期四川地区出现的纸币，是世界上最早的纸币，南宋时与铜钱并行，元朝成为主币。
  misconceptions:
    - 误以为交子最早出现在南宋临安，实际是北宋前期四川
    - 将交子说成是金属货币，或与铜钱混为一谈
    - 认为元朝主要流通货币是铜钱，实际是纸币
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:京剧
  type: Concept
  subject: 历史
  title: 京剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为京剧形成于乾隆年间，而非道光年间，时间颠倒。
    - 能指出并纠正这一错误：把京剧的角色行当说成生旦净末丑，忽略“末”已并入生行。
  aliases:
    - 皮黄戏
    - 京戏
  category: 历史
  explanation: 道光年间在徽调基础上吸收昆曲、秦腔等地方戏优点形成的剧种，又称“皮黄戏”，角色行当分为生旦净丑。
  misconceptions:
    - 误认为京剧形成于乾隆年间，而非道光年间，时间颠倒。
    - 把京剧的角色行当说成生旦净末丑，忽略“末”已并入生行。
    - 认为京剧直接由昆曲演变而来，忽略了徽调、汉调等基础。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:京师同文馆
  type: Concept
  subject: 历史
  title: 京师同文馆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把京师同文馆说成是戊戌变法期间创办的，实际是1862年
    - 能指出并纠正这一错误：误认为它是中国近代第一所大学，实际是官办新式学堂
  aliases:
    - 同文馆
  category: 历史机构
  explanation: 1862年成立的中国第一所官办新式学堂，培养翻译人才，传播西学。
  misconceptions:
    - 误把京师同文馆说成是戊戌变法期间创办的，实际是1862年
    - 误认为它是中国近代第一所大学，实际是官办新式学堂
    - 将京师同文馆和戊戌时期的京师大学堂混为一谈
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:京师大学堂
  type: Concept
  subject: 历史
  title: 京师大学堂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为京师大学堂是戊戌政变后被迫停办，实际保留并发展为北京大学。
    - 能指出并纠正这一错误：把京师大学堂的创办归为洋务运动，实际是百日维新的成果。
  aliases:
    - 北京大学前身
  category: 教育机构
  explanation: 百日维新期间创办的近代中国第一所国立综合性大学，后发展为北京大学。
  misconceptions:
    - 误以为京师大学堂是戊戌政变后被迫停办，实际保留并发展为北京大学。
    - 把京师大学堂的创办归为洋务运动，实际是百日维新的成果。
    - 将京师大学堂与洋务派的京师同文馆混为一谈。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S3.md
- id: concept:历史:京汉铁路工人大罢工
  type: Concept
  subject: 历史
  title: 京汉铁路工人大罢工
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为京汉铁路工人大罢工是第一次工人运动高潮的起点
    - 能指出并纠正这一错误：把罢工开始时间记成2月7日，混淆了罢工与惨案的时间
  aliases:
    - 二七大罢工
  category: 历史事件
  explanation: 1923年2月，京汉铁路工人举行大罢工，将第一次工人运动高潮推向顶峰，但遭到军阀吴佩孚血腥镇压。
  misconceptions:
    - 误以为京汉铁路工人大罢工是第一次工人运动高潮的起点
    - 把罢工开始时间记成2月7日，混淆了罢工与惨案的时间
    - 错误认为罢工最终取得了胜利，忽视了军阀血腥镇压
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:京津城际铁路
  type: Concept
  subject: 历史
  title: 京津城际铁路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国第一条高铁是京沪高铁，实际京津城际铁路更早通车。
    - 能指出并纠正这一错误：误以为京津城际铁路于2010年开通，实际是2008年8月1日。
  aliases: []
  category: 史实
  explanation: 2008年8月1日通车运营，标志着中国高铁时代的到来。
  misconceptions:
    - 误以为中国第一条高铁是京沪高铁，实际京津城际铁路更早通车。
    - 误以为京津城际铁路于2010年开通，实际是2008年8月1日。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S2.md
- id: concept:历史:人口增长
  type: Concept
  subject: 历史
  title: 人口增长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人口迅速增长导致了工业革命，实际是工业革命推动人口增长。
    - 能指出并纠正这一错误：只提英国人口增加，忽略美国等其他国家，以偏概全。
  aliases: []
  category: 社会变化
  explanation: 工业革命推动生产力发展，促进人口迅速增长，如英国和美国人口大幅增加。
  misconceptions:
    - 认为人口迅速增长导致了工业革命，实际是工业革命推动人口增长。
    - 只提英国人口增加，忽略美国等其他国家，以偏概全。
    - 以为人口增长是自然结果，忽视生产力发展的推动作用。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:人口问题
  type: Concept
  subject: 历史
  title: 人口问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以偏概全且推理错误：以为人口增长率越低越好，忽略了老龄化带来劳动力短缺等问题。
    - 能指出并纠正这一错误：认为人口问题只是发展中国家人口增长过快，忽略了发达国家因低增长出现老龄化。
  aliases: []
  category: 历史概念
  explanation: 世界人口增长不均衡，有的国家人口增长过快导致资源短缺，有的国家人口增长缓慢出现老龄化等问题，需要全球共同应对。
  misconceptions:
    - 以偏概全且推理错误：以为人口增长率越低越好，忽略了老龄化带来劳动力短缺等问题。
    - 认为人口问题只是发展中国家人口增长过快，忽略了发达国家因低增长出现老龄化。
    - 误将人口问题看作单个国家的问题，实际上需要全球合作应对。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:人文主义
  type: Concept
  subject: 历史
  title: 人文主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人文主义提倡人性自私，忽略它以人为中心、尊重人的价值和尊严
    - 能指出并纠正这一错误：以为人文主义完全否定神学，实际是反对教会束缚而非否定宗教信仰
  aliases: []
  category: 思想
  explanation: 文艺复兴的核心思潮，提倡以人为中心，发扬个性，追求现世幸福。
  misconceptions:
    - 认为人文主义提倡人性自私，忽略它以人为中心、尊重人的价值和尊严
    - 以为人文主义完全否定神学，实际是反对教会束缚而非否定宗教信仰
    - 只记住追求现世幸福，漏掉发扬个性和重视人的作用
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:人文初祖
  type: Concept
  subject: 历史
  title: 人文初祖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只认黄帝为唯一的人文初祖，忘了炎帝同受尊崇
    - 能指出并纠正这一错误：把炎帝和黄帝当成真实存在的某个人，而非群体象征
  aliases: []
  category: 历史称谓
  explanation: 后人尊崇炎帝和黄帝为中华民族的人文初祖，海内外华人自称炎黄子孙。
  misconceptions:
    - 只认黄帝为唯一的人文初祖，忘了炎帝同受尊崇
    - 把炎帝和黄帝当成真实存在的某个人，而非群体象征
    - 误认为人文初祖是后来皇帝给的称号，不是后世尊称
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:人民代表大会制度
  type: Concept
  subject: 历史
  title: 人民代表大会制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人民代表大会制度确立于1949年政协会议，实际是1954年宪法。
    - 能指出并纠正这一错误：误认为全国人大是最高行政机关，实际是最高权力机关。
  aliases:
    - 人大制度
  category: 政治制度
  explanation: 1954年宪法确立的我国根本政治制度，保障人民当家作主。
  misconceptions:
    - 误认为人民代表大会制度确立于1949年政协会议，实际是1954年宪法。
    - 误认为全国人大是最高行政机关，实际是最高权力机关。
    - 误认为各级人大代表均由选民直接选举产生，实际县乡直接、全国间接。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S3.md
- id: concept:历史:人民公社化运动
  type: Concept
  subject: 历史
  title: 人民公社化运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人民公社化运动'一大二公'提高了农民积极性，实际超越生产力水平。
    - 能指出并纠正这一错误：把人民公社化运动与农业合作化顺序颠倒，误以为1953年已有人民公社。
  aliases: []
  category: 历史事件
  explanation: 1958年与“大跃进”同时展开，通过建立人民公社，试图提高公有化程度，但超越了生产力发展水平。
  misconceptions:
    - 认为人民公社化运动'一大二公'提高了农民积极性，实际超越生产力水平。
    - 把人民公社化运动与农业合作化顺序颠倒，误以为1953年已有人民公社。
    - 误以为人民公社化运动是中共八大决定，实际是1958年总路线后的开展。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:人民游击战争
  type: Concept
  subject: 历史
  title: 人民游击战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为游击战争是军队主力的大规模阵地战，忽略伏击战、破袭战也属于游击战争。
    - 能指出并纠正这一错误：认为人民游击战争只在山区进行，平原和水乡地区无法开展。
  aliases:
    - 游击战
  category: 历史概念
  explanation: 中国共产党领导根据地军民开展的游击战争，包括伏击战、破袭战等，是敌后抗战的主要形式。
  misconceptions:
    - 认为游击战争是军队主力的大规模阵地战，忽略伏击战、破袭战也属于游击战争。
    - 认为人民游击战争只在山区进行，平原和水乡地区无法开展。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:人民生活总体达到小康
  type: Concept
  subject: 历史
  title: 人民生活总体达到小康
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为2000年我国已实现全面小康
    - 能指出并纠正这一错误：认为达到小康就意味着实现了第三步战略目标
  aliases: []
  category: 社会成就
  explanation: 到2000年，我国实现了社会主义现代化建设第二步战略目标，人民生活总体上达到小康水平。
  misconceptions:
    - 认为2000年我国已实现全面小康；实际只是总体小康，低水平、不全面。
    - 认为达到小康就意味着实现了第三步战略目标；实际第三步是基本实现现代化。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:人民英雄纪念碑
  type: Concept
  subject: 历史
  title: 人民英雄纪念碑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为纪念碑为纪念抗日战争英烈而建，实际纪念人民解放战争和人民革命中牺牲的英雄。
    - 能指出并纠正这一错误：误认为纪念碑位于故宫内，实际在天安门广场。
  aliases: []
  category: 历史建筑
  explanation: 为纪念在人民解放战争和人民革命中牺牲的人民英雄而建立，位于天安门广场。
  misconceptions:
    - 误认为纪念碑为纪念抗日战争英烈而建，实际纪念人民解放战争和人民革命中牺牲的英雄。
    - 误认为纪念碑位于故宫内，实际在天安门广场。
    - 误认为背面碑文也是毛泽东手书，实际由周恩来书写。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:人民解放军称谓的由来
  type: Concept
  subject: 历史
  title: 人民解放军称谓的由来
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为抗战初期八路军就已统一改称人民解放军
    - 能指出并纠正这一错误：以为《中国人民解放军宣言》颁布前全军已普遍使用该称谓
  aliases:
    - 中国人民解放军
  category: 史实
  explanation: 抗日战争胜利前后，解放区部队开始使用“解放军”或“人民解放军”称谓，1947年10月《中国人民解放军宣言》颁布后全军统一改称。
  misconceptions:
    - 误认为抗战初期八路军就已统一改称人民解放军
    - 以为《中国人民解放军宣言》颁布前全军已普遍使用该称谓
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:人民解放战争
  type: Concept
  subject: 历史
  title: 人民解放战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人民解放战争开始于1945年抗战胜利后
    - 能指出并纠正这一错误：把全面内战开始的标志误认为是1946年进攻延安
  aliases:
    - 解放战争
  category: 历史事件
  explanation: 1946年，国民党发动全面内战，人民解放战争开始。
  misconceptions:
    - 误认为人民解放战争开始于1945年抗战胜利后
    - 把全面内战开始的标志误认为是1946年进攻延安
    - 认为三大战役是人民解放战争开始的标志
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:人民解放战争胜利的原因
  type: Concept
  subject: 历史
  title: 人民解放战争胜利的原因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将胜利原因单纯归为军事英勇作战，忽略土地改革和党的领导
    - 能指出并纠正这一错误：把解放区土地改革说成是革命胜利后才进行，实际是战争期间激发积极性
  aliases: []
  category: 历史结论
  explanation: 胜利原因包括中国共产党的正确领导、解放区土地改革、国统区民主运动、人民解放军英勇作战等。
  misconceptions:
    - 将胜利原因单纯归为军事英勇作战，忽略土地改革和党的领导
    - 把解放区土地改革说成是革命胜利后才进行，实际是战争期间激发积极性
    - 误认为国统区民主运动是胜利的根本原因，颠倒主次
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:人类命运共同体
  type: Concept
  subject: 历史
  title: 人类命运共同体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为人类命运共同体是2013年联大会议首次提出，实际是在莫斯科国际关系学院演讲提出。
    - 能指出并纠正这一错误：将人类命运共同体视为中国外交的权宜之计，实际是长期大国外交内容。
  aliases:
    - 构建人类命运共同体
  category: 外交理念
  explanation: 2013年首次提出，推动构建人类命运共同体是中国开展大国外交的重要内容。
  misconceptions:
    - 误认为人类命运共同体是2013年联大会议首次提出，实际是在莫斯科国际关系学院演讲提出。
    - 将人类命运共同体视为中国外交的权宜之计，实际是长期大国外交内容。
    - 认为人类命运共同体只包含全球发展，实际还包括安全、文明等。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S2.md
- id: concept:历史:人类演化阶段
  type: Concept
  subject: 历史
  title: 人类演化阶段
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人类演化顺序写成古猿→直立人→能人→智人，误以为能人晚于直立人
    - 能指出并纠正这一错误：认为晚期智人就是现代人，忽略其仍存在形态差异和演化过渡
  aliases: []
  category: 生物演化
  explanation: 人类由古猿演化而来，经过能人、直立人、早期智人、晚期智人等阶段，最终演化为现代人。
  misconceptions:
    - 把人类演化顺序写成古猿→直立人→能人→智人，误以为能人晚于直立人
    - 认为晚期智人就是现代人，忽略其仍存在形态差异和演化过渡
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:人造纤维
  type: Concept
  subject: 历史
  title: 人造纤维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把人造纤维的发明者记成爱迪生，实为夏尔多内。
    - 能指出并纠正这一错误：认为人造纤维在1884年前已存在，实际是19世纪末才发明。
  aliases: []
  category: 新材料
  explanation: 1884年法国人夏尔多内发明人造纤维，开辟了新的纺织品生产领域。
  misconceptions:
    - 误把人造纤维的发明者记成爱迪生，实为夏尔多内。
    - 认为人造纤维在1884年前已存在，实际是19世纪末才发明。
    - 将人造纤维当作天然纤维，实际是人工合成材料。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:仁政
  type: Concept
  subject: 历史
  title: 仁政
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘仁政’视为孔子提出，实际是孟子发展出的政治主张。
    - 能指出并纠正这一错误：错把‘仁政’与墨家‘兼爱’混为一谈，忽视两者实质差异。
  aliases: []
  category: 思想主张
  explanation: 孟子提出的政治主张，要求统治者爱惜民力，不要过分盘剥。
  misconceptions:
    - 误将‘仁政’视为孔子提出，实际是孟子发展出的政治主张。
    - 错把‘仁政’与墨家‘兼爱’混为一谈，忽视两者实质差异。
    - 误认为孟子主张‘性恶论’，与仁政思想矛盾。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:从出土文物中获取信息的方法
  type: Concept
  subject: 历史
  title: 从出土文物中获取信息的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：只看文物的艺术价值，忽略其历史价值，如只夸青铜器纹饰精美，不问其所属朝代。
    - 能指出并纠正这一错误：认为所有出土文物都能直接反映当时的生产力水平，未考虑其可能为祭祀或随葬品。
  aliases:
    - 文物信息获取
  category: 学史方法
  explanation: 从出土文物中获取信息主要从历史价值、艺术价值和科学价值三方面入手，分别获取时间空间信息、审美信息和科技信息。
  misconceptions:
    - 只看文物的艺术价值，忽略其历史价值，如只夸青铜器纹饰精美，不问其所属朝代。
    - 认为所有出土文物都能直接反映当时的生产力水平，未考虑其可能为祭祀或随葬品。
    - 误以为科学价值就是指文物用现代科技修复，而非反映当时的科技水平。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S7.md
- id: concept:历史:从历史图像中获取信息的方法
  type: Concept
  subject: 历史
  title: 从历史图像中获取信息的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：读历史图像时只看人物表情，忽略标题和背景，导致误判事件性质。
    - 能指出并纠正这一错误：把图像中的艺术夸张当成真实比例，如认为古人的身高与现代人一样。
  aliases:
    - 如何从历史图像中获取信息
  category: 史学方法
  explanation: 通过阅读标题、有序观察、关注细节、思考象征意义、逐层解释等步骤，从历史图像中提取历史信息。
  misconceptions:
    - 读历史图像时只看人物表情，忽略标题和背景，导致误判事件性质。
    - 把图像中的艺术夸张当成真实比例，如认为古人的身高与现代人一样。
    - 看到龙袍就断定是皇帝，忽略了戏剧服装与历史服饰的区别，需结合其他细节。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C8/sections/S1.md
- id: concept:历史:从重大历史题材影视剧中获取信息的方法
  type: Concept
  subject: 历史
  title: 从重大历史题材影视剧中获取信息的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：将影视剧中的虚构人物（如《甄嬛传》中的甄嬛）当作真实历史人物。
    - 能指出并纠正这一错误：用现代审美判断古代服饰，认为古代人穿的是汉服而非当时的实际形制。
  aliases:
    - 如何从重大历史题材影视剧中获取信息
  category: 史学方法
  explanation: 了解影视剧创作原则，区分真实与虚构，通过观察场景、服饰等感受时代氛围，获取历史信息。
  misconceptions:
    - 将影视剧中的虚构人物（如《甄嬛传》中的甄嬛）当作真实历史人物。
    - 用现代审美判断古代服饰，认为古代人穿的是汉服而非当时的实际形制。
    - 认为影视剧中的台词都是真实史料，不知道编剧可能进行了艺术加工。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C8/sections/S1.md
- id: concept:历史:以农为本
  type: Concept
  subject: 历史
  title: 以农为本
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'以农为本'就是重农抑商，把汉文帝的政策与商鞅变法混为一谈。
    - 能指出并纠正这一错误：把'以农为本'当成秦始皇提出的治国理念，人物对应错误。
  aliases: []
  category: 政策
  explanation: 汉文帝提倡的重视农业、以农业为根本的政策，要求官吏关心农桑。
  misconceptions:
    - 认为'以农为本'就是重农抑商，把汉文帝的政策与商鞅变法混为一谈。
    - 把'以农为本'当成秦始皇提出的治国理念，人物对应错误。
    - 误以为'以农为本'只要求农民种地，忽略汉文帝还要求官吏关心农桑、减轻徭役。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S3.md
- id: concept:历史:仰韶文化
  type: Concept
  subject: 历史
  title: 仰韶文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把仰韶文化说成主要分布在长江下游，实际是黄河中游
    - 能指出并纠正这一错误：认为仰韶文化以黑陶为主，误将蛋壳黑陶对应到仰韶
  aliases: []
  category: 考古学文化
  explanation: 主要分布在黄河中游地区，距今约7000—5000年，以彩陶为重要特征，从事粟作农业。
  misconceptions:
    - 把仰韶文化说成主要分布在长江下游，实际是黄河中游
    - 认为仰韶文化以黑陶为主，误将蛋壳黑陶对应到仰韶
    - 将半坡遗址归入大汶口文化，实际半坡属于仰韶文化
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S2.md
- id: concept:历史:伊斯兰教的创立
  type: Concept
  subject: 历史
  title: 伊斯兰教的创立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为伊斯兰教是阿拉伯半岛原有宗教，其实是由穆罕默德7世纪初创立
    - 能指出并纠正这一错误：把伊斯兰教创立与阿拉伯帝国建立混为一谈，实际上帝国是在穆罕默德逝世后扩张而成
  aliases:
    - 伊斯兰教兴起
  category: 宗教事件
  explanation: 7世纪初，穆罕默德在阿拉伯半岛创立了伊斯兰教，阐述了独尊安拉的宗教思想，推动了阿拉伯半岛的统一。
  misconceptions:
    - 误以为伊斯兰教是阿拉伯半岛原有宗教，其实是由穆罕默德7世纪初创立
    - 把伊斯兰教创立与阿拉伯帝国建立混为一谈，实际上帝国是在穆罕默德逝世后扩张而成
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S3.md
- id: concept:历史:休养生息政策
  type: Concept
  subject: 历史
  title: 休养生息政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为只是减轻赋税，不包括重视农业生产和减少徭役
    - 能指出并纠正这一错误：认为休养生息政策开始于文景之治，实际汉高祖时已实行
  aliases: []
  category: 经济政策
  explanation: 汉初统治者采取减轻赋税、徭役，注重农业生产，以恢复社会经济。
  misconceptions:
    - 误认为只是减轻赋税，不包括重视农业生产和减少徭役
    - 认为休养生息政策开始于文景之治，实际汉高祖时已实行
    - 把休养生息与轻徭薄赋划等号，忽略恢复社会的目的
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:会通河和通惠河
  type: Concept
  subject: 历史
  title: 会通河和通惠河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认会通河和通惠河是隋朝开凿的
    - 能指出并纠正这一错误：将开凿会通河和通惠河归于隋炀帝
  aliases: []
  category: 历史事件
  explanation: 元朝建立初期，忽必烈令人开凿会通河和通惠河，与原有运河连通，便利南粮北运。
  misconceptions:
    - 误认会通河和通惠河是隋朝开凿的
    - 将开凿会通河和通惠河归于隋炀帝
    - 认为这两条河是元朝末年开凿的
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:伟大建党精神
  type: Concept
  subject: 历史
  title: 伟大建党精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将伟大建党精神简单概括为“开天辟地、敢为人先”，实际建党精神包含四个维度的完整内涵
    - 能指出并纠正这一错误：误认为伟大建党精神诞生于全面抗战时期，实际形成于党的创建过程中
  aliases: []
  category: 精神
  explanation: 中国共产党在创建过程中形成的坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民的伟大精神。
  misconceptions:
    - 将伟大建党精神简单概括为“开天辟地、敢为人先”，实际建党精神包含四个维度的完整内涵
    - 误认为伟大建党精神诞生于全面抗战时期，实际形成于党的创建过程中
    - 将伟大建党精神与红船精神完全等同，二者是整体与具体体现的关系
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:伟大抗战精神
  type: Concept
  subject: 历史
  title: 伟大抗战精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗战精神仅指前线将士的英勇牺牲，忽略爱国情怀与必胜信念等内涵
    - 能指出并纠正这一错误：误以为抗战精神是新中国成立后总结的历史经验，而非抗战时期形成
  aliases: []
  category: 精神
  explanation: 在抗日战争中形成的以爱国主义为核心的民族精神，包括天下兴亡、匹夫有责的爱国情怀，视死如归、宁死不屈的民族气节，不畏强暴、血战到底的英雄气概，百折不挠、坚忍不拔的必胜信念。
  misconceptions:
    - 认为抗战精神仅指前线将士的英勇牺牲，忽略爱国情怀与必胜信念等内涵
    - 误以为抗战精神是新中国成立后总结的历史经验，而非抗战时期形成
    - 将抗战精神等同于民族精神，忽视其产生的特定历史背景
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:传统节日
  type: Concept
  subject: 历史
  title: 传统节日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把端午节习俗说成吃月饼、赏月，如认为端午是为了纪念嫦娥。
    - 能指出并纠正这一错误：认为所有民族节日都完全相同，忽略了不同民族节日习俗的差异。
  aliases:
    - 民族节日
  category: 历史文化
  explanation: 我国的传统节日历史悠久、丰富多样，如春节、清明节、端午节、中秋节等，反映了中华文明的统一性，各民族节日共同构成中华民族的节日习俗文化。
  misconceptions:
    - 把端午节习俗说成吃月饼、赏月，如认为端午是为了纪念嫦娥。
    - 认为所有民族节日都完全相同，忽略了不同民族节日习俗的差异。
    - 误以为春节吃粽子、赛龙舟，将春节与端午节习俗混为一谈。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S8.md
- id: concept:历史:伪满洲国
  type: Concept
  subject: 历史
  title: 伪满洲国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为伪满洲国成立于1937年或1940年，实际是1932年
    - 能指出并纠正这一错误：误以为伪满洲国覆盖中国全部领土，而非仅东北地区
  aliases: []
  category: 历史概念
  explanation: 1932年日本扶植溥仪在长春建立的傀儡政权，企图将东北从中国分裂出去。
  misconceptions:
    - 认为伪满洲国成立于1937年或1940年，实际是1932年
    - 误以为伪满洲国覆盖中国全部领土，而非仅东北地区
    - 把伪满洲国视为清朝复辟的独立国家，忽略日本扶植傀儡的实质
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:伪满洲国建立
  type: Concept
  subject: 历史
  title: 伪满洲国建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为伪满洲国建立于1931年九一八事变后
    - 能指出并纠正这一错误：混淆伪满洲国都城，说成在沈阳
  aliases: []
  category: 历史事件
  explanation: 1932年，日本扶植溥仪在长春建立伪满洲国，实行殖民统治。
  misconceptions:
    - 误以为伪满洲国建立于1931年九一八事变后
    - 混淆伪满洲国都城，说成在沈阳
    - 认为溥仪在伪满洲国初年就是皇帝，实际为执政
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:伯里克利改革
  type: Concept
  subject: 历史
  title: 伯里克利改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为伯里克利改革使所有雅典居民都享有公民权
    - 能指出并纠正这一错误：误认为公职人员全部通过选举产生而非抽签
  aliases: []
  category: 历史事件
  explanation: 公元前5世纪中后期伯里克利主政时期，扩大公民权利，公职人员抽签产生，建立津贴制度。
  misconceptions:
    - 误认为伯里克利改革使所有雅典居民都享有公民权
    - 误认为公职人员全部通过选举产生而非抽签
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:但丁
  type: Concept
  subject: 历史
  title: 但丁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把但丁当作文艺复兴全盛时期的代表，实际他是文艺复兴的先驱
    - 能指出并纠正这一错误：误以为《神曲》是用拉丁文写的文学作品，实际用意大利方言创作
  aliases: []
  category: 历史人物
  explanation: 文艺复兴的先驱，代表作《神曲》，抨击教会，表达市民阶层情感。
  misconceptions:
    - 把但丁当作文艺复兴全盛时期的代表，实际他是文艺复兴的先驱
    - 误以为《神曲》是用拉丁文写的文学作品，实际用意大利方言创作
    - 认为但丁是英国诗人，实际他是意大利佛罗伦萨人
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:佛教
  type: Concept
  subject: 历史
  title: 佛教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为佛教创始人是耶稣或穆罕默德，实际是乔达摩·悉达多。
    - 能指出并纠正这一错误：把佛教创立时间说成公元前3世纪，实际是公元前6世纪。
  aliases: []
  category: 历史
  explanation: 佛教创立于公元前6世纪，创始人乔达摩·悉达多（释迦牟尼），宣扬“众生平等”和“忍耐顺从”。
  misconceptions:
    - 误认为佛教创始人是耶稣或穆罕默德，实际是乔达摩·悉达多。
    - 把佛教创立时间说成公元前3世纪，实际是公元前6世纪。
    - 认为佛教宣扬'神权至上'，实际是宣扬'众生平等'。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:佛教传入中国
  type: Concept
  subject: 历史
  title: 佛教传入中国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为佛教在汉武帝时期已传入，实际两汉之际。
    - 能指出并纠正这一错误：认为佛教由东汉明帝时传入，其实明帝时已得到扶持。
  aliases: []
  category: 宗教
  explanation: 佛教产生于古代印度，两汉之际传入中国，东汉明帝时得到上层统治阶级扶持，逐步传播开来，对中国文化产生深远影响。
  misconceptions:
    - 误以为佛教在汉武帝时期已传入，实际两汉之际。
    - 认为佛教由东汉明帝时传入，其实明帝时已得到扶持。
    - 误以为佛教是中国本土宗教，与道教混淆。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:佛教的创立与传播
  type: Concept
  subject: 历史
  title: 佛教的创立与传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为佛教从未传播到印度以外的地方，实际传入东亚等亚洲各地。
    - 能指出并纠正这一错误：误以为阿育王是佛教创始人，他其实是传播佛教的国王。
  aliases: []
  category: 历史
  explanation: 佛教创立于公元前6世纪，创始人乔达摩·悉达多，宣扬“众生平等”和“忍耐顺从”，后传播到亚洲各地。
  misconceptions:
    - 认为佛教从未传播到印度以外的地方，实际传入东亚等亚洲各地。
    - 误以为阿育王是佛教创始人，他其实是传播佛教的国王。
    - 把佛教传入中国的时间说成唐朝，实际早在汉朝已有传入。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:依法治国
  type: Concept
  subject: 历史
  title: 依法治国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为依法治国写入宪法是在1997年
    - 能指出并纠正这一错误：把依法治国理解为以法治国，强调法律的工具作用
  aliases: []
  category: 法治建设
  explanation: 1997年中共十五大确立为党领导人民治理国家的基本方略，1999年载入宪法。
  misconceptions:
    - 认为依法治国写入宪法是在1997年；实际1997年确立为基本方略，1999年入宪。
    - 把依法治国理解为以法治国，强调法律的工具作用；实际是依照法律治理国家。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:俄国侵占中国北方大片领土
  type: Concept
  subject: 历史
  title: 俄国侵占中国北方大片领土
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为俄国割占领土主要发生在19世纪40年代。
    - 能指出并纠正这一错误：将俄国割占的领土面积错记为100万或300万平方千米。
  aliases:
    - 俄国侵占中国领土
    - 俄国侵占中国北方领土
    - 俄国割占中国领土
  category: 历史事件
  explanation: 19世纪50至80年代，俄国通过《瑷珲条约》《北京条约》《勘分西北界约记》等不平等条约，割占中国东北和西北150多万平方千米领土。
  misconceptions:
    - 误以为俄国割占领土主要发生在19世纪40年代。
    - 将俄国割占的领土面积错记为100万或300万平方千米。
    - 只提东北而忽略西北，以偏概全。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:保甲法
  type: Concept
  subject: 历史
  title: 保甲法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为保甲法的主要目的是增加政府收入，而非军事训练和地方控制。
    - 能指出并纠正这一错误：将保甲法误认为商鞅变法的内容，忘记其是王安石变法的军事措施。
  aliases: []
  category: 变法措施
  explanation: 农村人户编制，保丁平时种田，农闲练兵，加强控制。
  misconceptions:
    - 认为保甲法的主要目的是增加政府收入，而非军事训练和地方控制。
    - 将保甲法误认为商鞅变法的内容，忘记其是王安石变法的军事措施。
    - 以为保丁只需种田，完全忽略了农闲时节的军事训练。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:保路运动
  type: Concept
  subject: 历史
  title: 保路运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：颠倒因果，误认为武昌起义导致了保路运动，实际保路运动为武昌起义创造了条件。
    - 能指出并纠正这一错误：误将保路运动反对的铁路国有理解为清政府收回民间资本，实际是出卖路权给列强。
  aliases: []
  category: 历史事件
  explanation: 1911年清政府将铁路收归国有并借款，损害民间利益，引发四川等地的保路运动，为武昌起义创造了条件。
  misconceptions:
    - 颠倒因果，误认为武昌起义导致了保路运动，实际保路运动为武昌起义创造了条件。
    - 误将保路运动反对的铁路国有理解为清政府收回民间资本，实际是出卖路权给列强。
    - 误以为保路运动只发生在四川，实际涉及多省，四川最为激烈。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:信息化战争
  type: Concept
  subject: 历史
  title: 信息化战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将信息化战争等同于纯网络战，忽视物理空间的作战行动。
    - 能指出并纠正这一错误：误以为信息化战争只需武器先进，不需要信息化军队作为主体。
  aliases: []
  category: 军事概念
  explanation: 以信息技术为核心，以信息化军队为主体，在信息空间和物理空间进行的战争形态。
  misconceptions:
    - 将信息化战争等同于纯网络战，忽视物理空间的作战行动。
    - 误以为信息化战争只需武器先进，不需要信息化军队作为主体。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S3.md
- id: concept:历史:信息时代
  type: Concept
  subject: 历史
  title: 信息时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为信息时代始于电子计算机诞生（1946年），实际是20世纪90年代互联网普及。
    - 能指出并纠正这一错误：将信息时代等同于第三次科技革命，混淆了概念范畴。
  aliases: []
  category: 历史概念
  explanation: 20世纪90年代以来，互联网在全球迅速普及，成为现代社会重要的基础设施，标志着人类社会开始进入信息时代。
  misconceptions:
    - 误以为信息时代始于电子计算机诞生（1946年），实际是20世纪90年代互联网普及。
    - 将信息时代等同于第三次科技革命，混淆了概念范畴。
    - 认为全球互联网普及是在20世纪70年代，实际是90年代才快速普及。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:倒幕运动
  type: Concept
  subject: 历史
  title: 倒幕运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为倒幕运动发生在明治维新之后，实际是明治维新前推翻幕府。
    - 能指出并纠正这一错误：误认为倒幕运动由天皇直接领导，实际由中下级武士联合西南强藩发动。
  aliases: []
  category: 历史事件
  explanation: 19世纪中期，中下级武士联合西南强藩和朝廷公卿发动的推翻德川幕府统治的运动，为明治维新奠定基础。
  misconceptions:
    - 误认为倒幕运动发生在明治维新之后，实际是明治维新前推翻幕府。
    - 误认为倒幕运动由天皇直接领导，实际由中下级武士联合西南强藩发动。
    - 误把倒幕运动等同于农民起义，实际主力是中下级武士。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:倭寇
  type: Concept
  subject: 历史
  title: 倭寇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为倭寇都是日本人，忽略不少中国沿海居民也参与其中
    - 能指出并纠正这一错误：误将倭患开始时间说成明朝中期，实际元末明初已出现
  aliases: []
  category: 历史概念
  explanation: 元末明初，日本武士和奸商组成的海盗武装集团，到中国沿海走私抢劫，造成倭患。
  misconceptions:
    - 认为倭寇都是日本人，忽略不少中国沿海居民也参与其中
    - 误将倭患开始时间说成明朝中期，实际元末明初已出现
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:健康中国战略
  type: Concept
  subject: 历史
  title: 健康中国战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为健康中国战略是二十大提出的，实际是十九大提出。
    - 能指出并纠正这一错误：误认为健康中国行动统一标识是2020年公布的，实际是2021年。
  aliases: []
  category: 国家战略
  explanation: 中共十九大提出实施健康中国战略，2021年公布健康中国行动统一标识。
  misconceptions:
    - 误认为健康中国战略是二十大提出的，实际是十九大提出。
    - 误认为健康中国行动统一标识是2020年公布的，实际是2021年。
    - 把健康中国战略等同于多建医院，忽略预防为主、健康生活方式等内涵。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:僧一行
  type: Concept
  subject: 历史
  title: 僧一行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把僧一行和玄奘混淆，误以为他是去天竺取经的僧人。
    - 能指出并纠正这一错误：误以为僧一行是医学家或诗人，实际为天文学家。
  aliases:
    - 一行
  category: 历史人物
  explanation: 唐朝天文学家，制定《大衍历》，组织实测地球子午线长度。
  misconceptions:
    - 把僧一行和玄奘混淆，误以为他是去天竺取经的僧人。
    - 误以为僧一行是医学家或诗人，实际为天文学家。
    - 认为他测量的是地球周长，实际是子午线长度。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:儒家学派
  type: Concept
  subject: 历史
  title: 儒家学派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将荀子归为法家代表，实际荀子是儒家代表人物。
    - 能指出并纠正这一错误：错认为儒家主张‘兼爱非攻’，那是墨家核心思想。
  aliases: []
  category: 学派
  explanation: 以孔子、孟子、荀子为代表，主张仁、礼、德治。
  misconceptions:
    - 误将荀子归为法家代表，实际荀子是儒家代表人物。
    - 错认为儒家主张‘兼爱非攻’，那是墨家核心思想。
    - 误称儒家学派只讲‘仁’不讲‘礼’，实际仁礼并重。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:儒略历
  type: Concept
  subject: 历史
  title: 儒略历
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为儒略历是屋大维命人编制的
    - 能指出并纠正这一错误：误认为儒略历与现行公历完全相同
  aliases: []
  category: 历法
  explanation: 儒略历是凯撒命人编制的历法，以太阳历为蓝本，后成为公历的基础。
  misconceptions:
    - 误认为儒略历是屋大维命人编制的
    - 误认为儒略历与现行公历完全相同
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:儒略历与公历
  type: Concept
  subject: 历史
  title: 儒略历与公历
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为现行公历就是儒略历，不需要改革
    - 能指出并纠正这一错误：误认为格列高利历在凯撒时期就已使用
  aliases:
    - 格列高利历
  category: 历法
  explanation: 儒略历是凯撒命人编制的历法，后成为公历的基础，公历经过格列高利改革形成现代公历。
  misconceptions:
    - 误认为现行公历就是儒略历，不需要改革
    - 误认为格列高利历在凯撒时期就已使用
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:元曲
  type: Concept
  subject: 历史
  title: 元曲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为元曲只指杂剧，完全忽略散曲。
    - 能指出并纠正这一错误：以为元曲是元代突然产生的，没有吸收前代说唱、戏曲艺术。
  aliases: []
  category: 文学形式
  explanation: 元朝在前代说唱、戏曲艺术基础上形成的，包括散曲和杂剧。
  misconceptions:
    - 认为元曲只指杂剧，完全忽略散曲。
    - 以为元曲是元代突然产生的，没有吸收前代说唱、戏曲艺术。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:元朝建立
  type: Concept
  subject: 历史
  title: 元朝建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把成吉思汗当作元朝开国皇帝，元朝实为忽必烈建立。
    - 能指出并纠正这一错误：认为元朝定都于上都开平，实际定都大都（今北京）。
  aliases: []
  category: 历史事件
  explanation: 1271年忽必烈定国号为大元，次年定都大都，忽必烈即元世祖。
  misconceptions:
    - 误把成吉思汗当作元朝开国皇帝，元朝实为忽必烈建立。
    - 认为元朝定都于上都开平，实际定都大都（今北京）。
    - 将1271年建元与1279年统一全国混为一谈。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:元朝疆域
  type: Concept
  subject: 历史
  title: 元朝疆域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为唐朝疆域比元朝更大，实际元朝版图超越汉唐。
    - 能指出并纠正这一错误：把四大汗国全部算入元朝疆域，实际仅蒙古本部及中国属元朝。
  aliases: []
  category: 历史地理
  explanation: 元朝疆域超越汉唐，是我国历史上版图最大的朝代。
  misconceptions:
    - 误认为唐朝疆域比元朝更大，实际元朝版图超越汉唐。
    - 把四大汗国全部算入元朝疆域，实际仅蒙古本部及中国属元朝。
    - 认为元朝疆域仅限于北方地区，忽略其统治南方各地。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:元朝的统治
  type: Concept
  subject: 历史
  title: 元朝的统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为行省制度起源于秦朝，实为元朝首创。
    - 能指出并纠正这一错误：以为行省长官由地方推举世袭，实际由中央派遣任命。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 误认为行省制度起源于秦朝，实为元朝首创。
    - 以为行省长官由地方推举世袭，实际由中央派遣任命。
    - 将元朝四等人制与清朝八旗制度混淆。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:元朝统一
  type: Concept
  subject: 历史
  title: 元朝统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为1276年攻占临安即完成元朝统一，实际1279年灭南宋残部。
    - 能指出并纠正这一错误：把元灭金的顺序记成先于灭西夏，实际先灭西夏后灭金。
  aliases: []
  category: 历史事件
  explanation: 1276年元军攻占临安，1279年灭南宋残部，完成全国统一。
  misconceptions:
    - 误以为1276年攻占临安即完成元朝统一，实际1279年灭南宋残部。
    - 把元灭金的顺序记成先于灭西夏，实际先灭西夏后灭金。
    - 认为元朝统一只是统一北方，不包括原南宋地区。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:元谋人
  type: Concept
  subject: 历史
  title: 元谋人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把元谋人说成距今约70万—20万年，与北京人时代混淆
    - 能指出并纠正这一错误：误以为元谋人已使用磨制石器，实际只会打制石器
  aliases: []
  category: 古人类
  explanation: 我国境内目前已知最早的古人类之一，距今约170万年，发现于云南元谋，能够制作和使用工具。
  misconceptions:
    - 把元谋人说成距今约70万—20万年，与北京人时代混淆
    - 误以为元谋人已使用磨制石器，实际只会打制石器
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:光复会
  type: Concept
  subject: 历史
  title: 光复会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将光复会会长记成黄兴，实际是蔡元培
    - 能指出并纠正这一错误：把光复会成立年份记成一八九四年或一九〇五年
  aliases: []
  category: 历史事件
  explanation: 1904年10月在上海成立的革命团体，蔡元培为会长，在浙江等地联络会党准备起义。
  misconceptions:
    - 将光复会会长记成黄兴，实际是蔡元培
    - 把光复会成立年份记成一八九四年或一九〇五年
    - 将光复会成立地点错记成长沙，实际在上海
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:光武中兴
  type: Concept
  subject: 历史
  title: 光武中兴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为光武中兴的措施是减轻刑罚、整顿吏治，实际是释放奴婢、减轻田租
    - 能指出并纠正这一错误：把光武中兴与西汉的文景之治混淆，认为发生在汉文帝时期
  aliases: []
  category: 历史概念
  explanation: 光武帝刘秀采取释放奴婢、减轻田租、合并郡县等措施，使经济恢复、社会安定，史称“光武中兴”。
  misconceptions:
    - 误以为光武中兴的措施是减轻刑罚、整顿吏治，实际是释放奴婢、减轻田租
    - 把光武中兴与西汉的文景之治混淆，认为发生在汉文帝时期
    - 认为光武中兴出现在东汉中期，实际是光武帝初年
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S5.md
- id: concept:历史:光荣革命
  type: Concept
  subject: 历史
  title: 光荣革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将光荣革命时间记为1689年，实际是1688年。
    - 能指出并纠正这一错误：误认为光荣革命废除了国王，实际只是更换国王，保留君主制。
  aliases: []
  category: 历史事件
  explanation: 1688年英国政变，废黜詹姆士二世，迎立威廉和玛丽，标志革命结束。
  misconceptions:
    - 误将光荣革命时间记为1689年，实际是1688年。
    - 误认为光荣革命废除了国王，实际只是更换国王，保留君主制。
    - 误认为光荣革命是克伦威尔领导的，实际由议会联合威廉、玛丽发动。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:党在社会主义初级阶段的基本路线
  type: Concept
  subject: 历史
  title: 党在社会主义初级阶段的基本路线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为党在社会主义初级阶段的基本路线在十一届三中全会上已完整提出
    - 能指出并纠正这一错误：把“两个基本点”误写为“坚持改革开放，坚持一国两制”
  aliases:
    - 一个中心、两个基本点
  category: 历史概念
  explanation: 概括为“一个中心、两个基本点”，即以经济建设为中心，坚持四项基本原则，坚持改革开放。
  misconceptions:
    - 误以为党在社会主义初级阶段的基本路线在十一届三中全会上已完整提出
    - 把“两个基本点”误写为“坚持改革开放，坚持一国两制”
    - 认为基本路线只是针对经济领域，不涉及其他方面
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S4.md
- id: concept:历史:党的政治路线
  type: Concept
  subject: 历史
  title: 党的政治路线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中共七大政治路线要求立即建立社会主义制度，忽视新民主主义阶段
    - 能指出并纠正这一错误：把中共七大的政治路线与遵义会议的军事路线混为一谈
  aliases: []
  category: 政治纲领
  explanation: 中共七大制定的政治路线：放手发动群众，壮大人民力量，在中国共产党领导下，打败日本侵略者，解放全国人民，建立一个新民主主义的中国。
  misconceptions:
    - 误以为中共七大政治路线要求立即建立社会主义制度，忽视新民主主义阶段
    - 把中共七大的政治路线与遵义会议的军事路线混为一谈
    - 认为政治路线提出打倒蒋介石，实际当时目标是打败日本侵略者
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:全方位外交
  type: Concept
  subject: 历史
  title: 全方位外交
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为全方位外交就是不结盟，即不参加任何国际组织，忽略多边外交。
    - 能指出并纠正这一错误：把全方位外交等同于与所有国家结盟，忽略不对抗、不针对第三方。
  aliases: []
  category: 外交政策
  explanation: 中国发展不结盟、不对抗、不针对第三方的新型大国关系，积极参与多边外交。
  misconceptions:
    - 误认为全方位外交就是不结盟，即不参加任何国际组织，忽略多边外交。
    - 把全方位外交等同于与所有国家结盟，忽略不对抗、不针对第三方。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:全方位多层次宽领域对外开放格局
  type: Concept
  subject: 历史
  title: 全方位多层次宽领域对外开放格局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为全方位多层次宽领域开放格局在1978年十一届三中全会后立即形成。
    - 能指出并纠正这一错误：认为开放顺序是先沿江再沿海，颠倒了从沿海到沿江的进程。
  aliases: []
  category: 对外开放
  explanation: 世纪之交形成从沿海到沿江、从沿边到内陆的开放格局。
  misconceptions:
    - 误以为全方位多层次宽领域开放格局在1978年十一届三中全会后立即形成。
    - 认为开放顺序是先沿江再沿海，颠倒了从沿海到沿江的进程。
    - 只记得经济特区，忽略沿边和内陆的开放，以偏概全。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:全方位对外开放新格局
  type: Concept
  subject: 历史
  title: 全方位对外开放新格局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把全方位对外开放新格局与全方位多层次宽领域格局当成同一概念，忽略“新”的含义。
    - 能指出并纠正这一错误：误以为该格局形成于中华人民共和国成立初期，时间严重提前。
  aliases: []
  category: 对外开放
  explanation: 世纪之交我国形成从沿海到沿江、从沿边到内陆，全方位、多层次、宽领域的对外开放新格局。
  misconceptions:
    - 把全方位对外开放新格局与全方位多层次宽领域格局当成同一概念，忽略“新”的含义。
    - 误以为该格局形成于中华人民共和国成立初期，时间严重提前。
    - 只提沿海开放，忽略沿边、内陆，以偏概全。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:全民国家安全教育日
  type: Concept
  subject: 历史
  title: 全民国家安全教育日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记日期为4月23日（世界读书日），实际是4月15日。
    - 能指出并纠正这一错误：认为该教育日由《反间谍法》设立，实际由《国家安全法》设立。
  aliases: []
  category: 制度
  explanation: 每年4月15日，通过相关法律设立，旨在增强国家安全意识。
  misconceptions:
    - 误记日期为4月23日（世界读书日），实际是4月15日。
    - 认为该教育日由《反间谍法》设立，实际由《国家安全法》设立。
    - 将国家安全教育日等同于国防教育日，后者是每年9月第三个星期六。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S3.md
- id: concept:历史:全民族抗战
  type: Concept
  subject: 历史
  title: 全民族抗战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全民族抗战只是共产党领导的敌后抗战，忽略国民党正面战场的作战
    - 能指出并纠正这一错误：将全民族抗战等同于抗日民族统一战线，忽略其还包括海外华侨和世界反法西斯力量
  aliases:
    - 全民抗战
  category: 历史概念
  explanation: 抗日战争中，中国各民族、各政党、各政治派别、各阶层人民共同参与抗战，形成抗日民族统一战线，使日本侵略者陷入人民战争的汪洋大海。
  misconceptions:
    - 认为全民族抗战只是共产党领导的敌后抗战，忽略国民党正面战场的作战
    - 将全民族抗战等同于抗日民族统一战线，忽略其还包括海外华侨和世界反法西斯力量
    - 误以为全民族抗战仅指工人阶级和农民阶级参与，未包含各民主党派和无党派人士
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:全球发展倡议
  type: Concept
  subject: 历史
  title: 全球发展倡议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为全球发展倡议、全球安全倡议、全球文明倡议是同时提出的，实际2013年提出人类命运共同体后分…
    - 能指出并纠正这一错误：认为“全球发展倡议”由美国政府提出，实际由中国提出。
  aliases:
    - 全球安全倡议
    - 全球文明倡议
  category: 倡议
  explanation: 中国提出的全球发展倡议、全球安全倡议、全球文明倡议，致力于推动构建人类命运共同体。
  misconceptions:
    - 误以为全球发展倡议、全球安全倡议、全球文明倡议是同时提出的，实际2013年提出人类命运共同体后分次提出。
    - 认为“全球发展倡议”由美国政府提出，实际由中国提出。
    - 混淆全球发展倡议与“一带一路”，认为两者是同一概念。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S4.md
- id: concept:历史:全面从严治党
  type: Concept
  subject: 历史
  title: 全面从严治党
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为全面从严治党只针对腐败分子，普通党员不受影响。
    - 能指出并纠正这一错误：将全面从严治党与全面依法治国混为一谈，认为都是管党员，实际一个治党一个治国。
  aliases: []
  category: 党建战略
  explanation: 以习近平同志为核心的党中央推进全面从严治党，包括八项规定、反腐败斗争等。
  misconceptions:
    - 误认为全面从严治党只针对腐败分子，普通党员不受影响。
    - 将全面从严治党与全面依法治国混为一谈，认为都是管党员，实际一个治党一个治国。
    - 认为全面从严治党是“以权治党”，实际依靠法规制度。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:全面依法治国
  type: Concept
  subject: 历史
  title: 全面依法治国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为全面依法治国总目标是“建设社会主义法治国家”，漏掉“法治体系”。
    - 能指出并纠正这一错误：认为依法治国与以德治国相矛盾，实际依法治国和以德治国相结合。
  aliases: []
  category: 战略举措
  explanation: 2014年中共十八届四中全会作出决定，总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。
  misconceptions:
    - 误认为全面依法治国总目标是“建设社会主义法治国家”，漏掉“法治体系”。
    - 认为依法治国与以德治国相矛盾，实际依法治国和以德治国相结合。
    - 将全面依法治国与“十五大”提出的依法治国混淆，未区分全面与基本方略。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:全面内战爆发
  type: Concept
  subject: 历史
  title: 全面内战爆发
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为全面内战爆发于1945年日本投降后马上开始，实际是1946年
    - 能指出并纠正这一错误：认为内战是共产党率先发动的，颠倒战争责任方
  aliases: []
  category: 历史事件
  explanation: 1946年国民党发动全面内战，中国共产党领导人民军队进行自卫反击。
  misconceptions:
    - 误以为全面内战爆发于1945年日本投降后马上开始，实际是1946年
    - 认为内战是共产党率先发动的，颠倒战争责任方
    - 把全面内战爆发的标志说成国民党进攻延安，实际是进攻中原解放区
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:全面建成小康社会
  type: Concept
  subject: 历史
  title: 全面建成小康社会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为在2020年已经宣告全面建成小康社会，实际是2021年宣告。
    - 能指出并纠正这一错误：误认为已基本实现社会主义现代化，混淆两个阶段目标。
  aliases:
    - 全面小康
  category: 历史成就
  explanation: 2021年如期实现，标志着第一个百年奋斗目标达成，创造了经济快速发展和社会长期稳定两大奇迹。
  misconceptions:
    - 误认为在2020年已经宣告全面建成小康社会，实际是2021年宣告。
    - 误认为已基本实现社会主义现代化，混淆两个阶段目标。
    - 误认为全面建成小康社会意味着同步实现了共同富裕。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:全面建设小康社会目标
  type: Concept
  subject: 历史
  title: 全面建设小康社会目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘本世纪头20年’理解为20世纪头20年，实际指21世纪。
    - 能指出并纠正这一错误：误以为全面建设小康社会目标只强调经济，忽略民主、科教、文化等要求。
  aliases:
    - 全面建设小康社会
  category: 发展目标
  explanation: 中共十六大提出，在本世纪头20年，集中力量全面建设惠及十几亿人口的更高水平的小康社会，使经济更加发展、民主更加健全、科教更加进步、文化更加繁荣、社会更加和谐、人民生活更加殷实。
  misconceptions:
    - 误把‘本世纪头20年’理解为20世纪头20年，实际指21世纪。
    - 误以为全面建设小康社会目标只强调经济，忽略民主、科教、文化等要求。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:八七会议
  type: Concept
  subject: 历史
  title: 八七会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为八七会议决定发动南昌起义，实际南昌起义在先，会议总结了教训
    - 能指出并纠正这一错误：把八七会议地点记成上海或瑞金，实际在湖北汉口
  aliases: []
  category: 历史事件
  explanation: 1927年8月7日，中共中央在汉口召开紧急会议，确定实行土地革命和武装起义的方针，毛泽东提出“政权是由枪杆子中取得的”论断。
  misconceptions:
    - 误认为八七会议决定发动南昌起义，实际南昌起义在先，会议总结了教训
    - 把八七会议地点记成上海或瑞金，实际在湖北汉口
    - 误以为八七会议提出'农村包围城市'道路，实际只确定土地革命和武装起义方针
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:八国联军侵华战争
  type: Concept
  subject: 历史
  title: 八国联军侵华战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把八国联军侵华时间记为1901年，实际是1900年
    - 能指出并纠正这一错误：认为八国联军镇压太平天国，实际是镇压义和团
  aliases: []
  category: 历史事件
  explanation: 1900年帝国主义列强组成的八国联军发动侵华战争，镇压义和团，1901年签订《辛丑条约》。
  misconceptions:
    - 误把八国联军侵华时间记为1901年，实际是1900年
    - 认为八国联军镇压太平天国，实际是镇压义和团
    - 将火烧圆明园归为八国联军所为，实际是英法联军
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:八字方针
  type: Concept
  subject: 历史
  title: 八字方针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把八字方针内容漏掉'充实'，说成'调整、巩固、提高'。
    - 能指出并纠正这一错误：误以为'调整'是调整阶级斗争，实际是调整国民经济比例关系。
  aliases:
    - 调整、巩固、充实、提高
  category: 方针政策
  explanation: 1961年中共中央提出“调整、巩固、充实、提高”的方针，对国民经济进行调整，到1965年任务基本完成。
  misconceptions:
    - 把八字方针内容漏掉'充实'，说成'调整、巩固、提高'。
    - 误以为'调整'是调整阶级斗争，实际是调整国民经济比例关系。
    - 把提出时间记成1962年，实际是1961年提出，到1965年基本完成。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:八旗制度
  type: Concept
  subject: 历史
  title: 八旗制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为八旗制度是皇太极建立的，实际是努尔哈赤创立。
    - 能指出并纠正这一错误：认为八旗中只有满洲旗，忽略蒙古八旗和汉军八旗的存在。
  aliases: []
  category: 政治制度
  explanation: 努尔哈赤建立，将生产、行政、军事结合，兵民合一，提高战斗力。
  misconceptions:
    - 认为八旗制度是皇太极建立的，实际是努尔哈赤创立。
    - 认为八旗中只有满洲旗，忽略蒙古八旗和汉军八旗的存在。
    - 把八旗制度单纯看作军事组织，忽视其行政和生产功能。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:八王之乱
  type: Concept
  subject: 历史
  title: 八王之乱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把八王之乱的时间说成西晋建立之前或东晋时期，实为晋惠帝时。
    - 能指出并纠正这一错误：将八王之乱与西汉七国之乱混淆，误认为是为保卫皇室而平叛。
  aliases: []
  category: 历史事件
  explanation: 西晋晋惠帝时期，八个宗室亲王为争夺中央政权而相互混战，历时十几年，严重削弱了西晋国力，成为西晋由盛而衰的转折点。
  misconceptions:
    - 把八王之乱的时间说成西晋建立之前或东晋时期，实为晋惠帝时。
    - 将八王之乱与西汉七国之乱混淆，误认为是为保卫皇室而平叛。
    - 认为八王之乱是少数民族内迁引起的，实际是宗室内斗。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:八股文
  type: Concept
  subject: 历史
  title: 八股文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为八股文可以自由阐述观点，实际必须按固定格式和朱熹注解释经义。
    - 能指出并纠正这一错误：误以为八股文是明代首创，实际唐代已有类似文体，明代定为科举格式。
  aliases: []
  category: 科举制度
  explanation: 明朝科举考试规定文体为八股文，形式呆板，禁锢思想。
  misconceptions:
    - 认为八股文可以自由阐述观点，实际必须按固定格式和朱熹注解释经义。
    - 误以为八股文是明代首创，实际唐代已有类似文体，明代定为科举格式。
    - 认为八股文只考四书五经内容，实际题目必须出自四书五经，解释以朱熹注为准。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:八路军
  type: Concept
  subject: 历史
  title: 八路军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将八路军说成由南方八省游击队改编而成，实际是新四军
    - 能指出并纠正这一错误：把八路军总指挥记成彭德怀或叶挺，实际是朱德
  aliases:
    - 国民革命军第八路军
  category: 军事组织
  explanation: 中国工农红军主力改编为国民革命军第八路军，朱德任总指挥。
  misconceptions:
    - 误将八路军说成由南方八省游击队改编而成，实际是新四军
    - 把八路军总指挥记成彭德怀或叶挺，实际是朱德
    - 认为八路军改编发生在1937年12月之后，实际是8月
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:公元纪年法
  type: Concept
  subject: 历史
  title: 公元纪年法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公元前年份越大的时间越晚，如以为公元前200年晚于公元前100年。
    - 能指出并纠正这一错误：认为公元纪年有公元0年，把公元1年前一年当作公元0年。
  aliases:
    - 公元纪年
  category: 历史纪年法
  explanation: 以公元元年作为开始纪年的标志，公元元年以前称公元前某某年，以后称公元某某年。
  misconceptions:
    - 认为公元前年份越大的时间越晚，如以为公元前200年晚于公元前100年。
    - 认为公元纪年有公元0年，把公元1年前一年当作公元0年。
    - 公元前后跨年计算出错，如误认为公元前1年到公元1年相隔2年。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S7.md
- id: concept:历史:公共文化服务体系
  type: Concept
  subject: 历史
  title: 公共文化服务体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为公共文化服务是市场主导的，忽略政府主导和公益性质。
    - 能指出并纠正这一错误：只想到图书馆、文化馆，忽略博物馆、美术馆也属于公共文化设施。
  aliases: []
  category: 政治概念
  explanation: 由政府主导、社会参与，向公民提供公共文化产品和服务的制度体系，包括图书馆、文化馆等设施。
  misconceptions:
    - 认为公共文化服务是市场主导的，忽略政府主导和公益性质。
    - 只想到图书馆、文化馆，忽略博物馆、美术馆也属于公共文化设施。
    - 误以为公共文化服务体系从一开始就建成，忽略其逐步完善的过程。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S2.md
- id: concept:历史:公民道德建设实施纲要
  type: Concept
  subject: 历史
  title: 公民道德建设实施纲要
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将依法治国与以德治国对立，认为二者只能取其一。
    - 能指出并纠正这一错误：记错《公民道德建设实施纲要》印发年份为1999年或2000年。
  aliases: []
  category: 道德建设
  explanation: 2001年中共中央印发，提出把法制建设与道德建设、依法治国与以德治国紧密结合起来。
  misconceptions:
    - 将依法治国与以德治国对立，认为二者只能取其一。
    - 记错《公民道德建设实施纲要》印发年份为1999年或2000年。
    - 混淆“法制建设”与“法治建设”，忽略两者内涵差异。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:公私合营
  type: Concept
  subject: 历史
  title: 公私合营
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为公私合营是农业社会主义改造形式，实际是对资本主义工商业的改造。
    - 能指出并纠正这一错误：误认为公私合营后企业全部收归国有，实际国家支付定息，实行赎买。
  aliases: []
  category: 经济政策
  explanation: 对资本主义工商业进行社会主义改造的形式，如同仁堂。
  misconceptions:
    - 误认为公私合营是农业社会主义改造形式，实际是对资本主义工商业的改造。
    - 误认为公私合营后企业全部收归国有，实际国家支付定息，实行赎买。
    - 误认为公私合营期间私方人员无任何权益，实际仍按比例领取定息。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S3.md
- id: concept:历史:公车上书
  type: Concept
  subject: 历史
  title: 公车上书
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为公车上书发生于1898年，与戊戌变法同年，实际是1895年。
    - 能指出并纠正这一错误：误以为公车上书是康有为单独领导，忽略梁启超联合各省举人一同上书。
  aliases: []
  category: 历史事件
  explanation: 1895年春，康有为、梁启超联合各省应试举人上书光绪帝，请求拒和、迁都、变法，拉开维新运动序幕。
  misconceptions:
    - 误以为公车上书发生于1898年，与戊戌变法同年，实际是1895年。
    - 误以为公车上书是康有为单独领导，忽略梁启超联合各省举人一同上书。
    - 误以为公车上书要求'变法维新'，实际是请求'拒和、迁都、变法'三件事。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S4.md
- id: concept:历史:关汉卿
  type: Concept
  subject: 历史
  title: 关汉卿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《窦娥冤》误记为散曲作品，实际是杂剧。
    - 能指出并纠正这一错误：误认为关汉卿是南宋人，与元朝时间不符。
  aliases: []
  category: 历史人物
  explanation: 元朝最优秀的杂剧家，代表作《窦娥冤》。
  misconceptions:
    - 把《窦娥冤》误记为散曲作品，实际是杂剧。
    - 误认为关汉卿是南宋人，与元朝时间不符。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:兴中会
  type: Concept
  subject: 历史
  title: 兴中会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把兴中会成立时间记成一九〇五年，与同盟会混淆
    - 能指出并纠正这一错误：误认为兴中会纲领是“驱除鞑虏，恢复中华，创立民国，平均地权”
  aliases: []
  category: 历史事件
  explanation: 1894年11月，孙中山在檀香山联合华侨成立的革命团体，提出“振兴中华”口号，纲领为“驱除鞑虏，恢复中国，创立合众政府”。
  misconceptions:
    - 把兴中会成立时间记成一九〇五年，与同盟会混淆
    - 误认为兴中会纲领是“驱除鞑虏，恢复中华，创立民国，平均地权”
    - 将兴中会成立的领导人记成黄兴，实际是孙中山
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S4.md
- id: concept:历史:兴边富民行动
  type: Concept
  subject: 历史
  title: 兴边富民行动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为兴边富民行动在改革开放之前就已实施。
    - 能指出并纠正这一错误：把兴边富民行动等同于单纯扶贫，忽略振兴边境的边疆安全意义。
  aliases: []
  category: 民族政策
  explanation: 1999年国家实施，旨在振兴边境、富裕边民。
  misconceptions:
    - 误认为兴边富民行动在改革开放之前就已实施。
    - 把兴边富民行动等同于单纯扶贫，忽略振兴边境的边疆安全意义。
    - 以为该行动只涉及新疆和西藏，不包括全国所有边境地区。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:兵家学派
  type: Concept
  subject: 历史
  title: 兵家学派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为孙武著有《孙膑兵法》，实际《孙子兵法》才是孙武所著。
    - 能指出并纠正这一错误：错把兵家代表人物写成孔子或墨子，张冠李戴。
  aliases: []
  category: 学派
  explanation: 以孙武、孙膑等为代表，研究军事理论。
  misconceptions:
    - 误认为孙武著有《孙膑兵法》，实际《孙子兵法》才是孙武所著。
    - 错把兵家代表人物写成孔子或墨子，张冠李戴。
    - 误认为兵家反对一切战争，与墨家‘非攻’混淆。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:兼并战争
  type: Concept
  subject: 历史
  title: 兼并战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将战国兼并战争与春秋争霸混同，认为都以尊王攘夷为口号，实际上战国目标是兼并土地。
    - 能指出并纠正这一错误：误以为秦灭六国的战争是争霸战争，实为兼并统一战争。
  aliases: []
  category: 历史概念
  explanation: 战国时期诸侯国以兼并他国领土为目的的战争，区别于春秋时期的争霸战争。
  misconceptions:
    - 将战国兼并战争与春秋争霸混同，认为都以尊王攘夷为口号，实际上战国目标是兼并土地。
    - 误以为秦灭六国的战争是争霸战争，实为兼并统一战争。
    - 认为兼并战争发生在春秋时期，与战国时期时间颠倒。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:兼爱非攻
  type: Concept
  subject: 历史
  title: 兼爱非攻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘兼爱非攻’归于孔子或孟子，实际是墨子的主张。
    - 能指出并纠正这一错误：错把‘兼爱’等同于儒家‘仁爱’，忽略爱无差等与差等之别。
  aliases: []
  category: 思想主张
  explanation: 墨子的核心主张，要求人们互爱互利，反对战争。
  misconceptions:
    - 误将‘兼爱非攻’归于孔子或孟子，实际是墨子的主张。
    - 错把‘兼爱’等同于儒家‘仁爱’，忽略爱无差等与差等之别。
    - 误认为‘非攻’就是反对一切战争，绝对和平主义。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:内燃机
  type: Concept
  subject: 历史
  title: 内燃机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为内燃机是第一次工业革命的成果，实际是第二次工业革命。
    - 能指出并纠正这一错误：将内燃机与蒸汽机混用，认为它解决了火车问题，实际火车用蒸汽机。
  aliases: []
  category: 技术发明
  explanation: 内燃机的发明是第二次工业革命中应用技术领域的重大成就，解决了交通运输工具的发动机问题。
  misconceptions:
    - 误以为内燃机是第一次工业革命的成果，实际是第二次工业革命。
    - 将内燃机与蒸汽机混用，认为它解决了火车问题，实际火车用蒸汽机。
    - 把内燃机发明者记成瓦特，瓦特改良了蒸汽机。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:内阁
  type: Concept
  subject: 历史
  title: 内阁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把内阁首辅等同于丞相，认为首辅有法定决策权，实际内阁只是皇帝的顾问机构。
    - 能指出并纠正这一错误：误以为明太祖设立内阁，实际明成祖设立，明太祖废丞相。
  aliases: []
  category: 政治制度
  explanation: 明成祖设立内阁，协助皇帝处理政务，后权力渐重，首辅行丞相之权。
  misconceptions:
    - 把内阁首辅等同于丞相，认为首辅有法定决策权，实际内阁只是皇帝的顾问机构。
    - 误以为明太祖设立内阁，实际明成祖设立，明太祖废丞相。
    - 认为内阁是正式行政机构，能直接统率六部，实际六部直接向皇帝负责。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:册封达赖和班禅
  type: Concept
  subject: 历史
  title: 册封达赖和班禅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为册封达赖、班禅始于乾隆，混淆了顺治册封达赖和康熙册封班禅的时间。
    - 能指出并纠正这一错误：将达赖与班禅的册封顺序记反，以为班禅先受中央册封。
  aliases: []
  category: 历史事件
  explanation: 清朝通过册封达赖喇嘛和班禅额尔德尼，确立了对西藏宗教领袖的中央册封制度。
  misconceptions:
    - 认为册封达赖、班禅始于乾隆，混淆了顺治册封达赖和康熙册封班禅的时间。
    - 将达赖与班禅的册封顺序记反，以为班禅先受中央册封。
    - 误以为册封制度就是金瓶掣签，把两种不同制度混为一谈。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:军事战略方针
  type: Concept
  subject: 历史
  title: 军事战略方针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把2004年军事战略方针误记为20世纪90年代提出，与‘科技强军’混淆。
    - 能指出并纠正这一错误：忽略‘信息化条件下’前提，误认为打赢常规战争是基点。
  aliases: []
  category: 军事概念
  explanation: 指导军事斗争准备和军队建设的总方针，2004年中央军委提出把基点放在打赢信息化条件下的局部战争上。
  misconceptions:
    - 把2004年军事战略方针误记为20世纪90年代提出，与‘科技强军’混淆。
    - 忽略‘信息化条件下’前提，误认为打赢常规战争是基点。
    - 将中央军委提出的方针误记为全国人大或国务院提出。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:军机处
  type: Concept
  subject: 历史
  title: 军机处
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为军机处是雍正时设立的正式决策机构，军机大臣拥有决策权，实际只是辅助皇帝拟旨。
    - 能指出并纠正这一错误：误以为军机处设立于康熙朝，与南书房时间颠倒。
  aliases: []
  category: 政治制度
  explanation: 雍正年间设立的辅助皇帝处理政务的中枢机构，军机大臣按皇帝旨意拟旨，使君主专制达到顶峰。
  misconceptions:
    - 认为军机处是雍正时设立的正式决策机构，军机大臣拥有决策权，实际只是辅助皇帝拟旨。
    - 误以为军机处设立于康熙朝，与南书房时间颠倒。
    - 认为军机处使皇权受到限制，实际是君主专制达到顶峰的表现。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:军阀割据
  type: Concept
  subject: 历史
  title: 军阀割据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为军阀割据在袁世凯在位时已经形成，忽略袁世凯死后北洋军阀分裂的背景。
    - 能指出并纠正这一错误：将军阀派系张冠李戴，如说直系是段祺瑞、皖系是冯国璋。
  aliases:
    - 北洋军阀割据
  category: 历史概念
  explanation: 袁世凯死后，北洋军阀分裂为多个派系，各自拥兵自重，导致中国陷入军阀混战和割据的局面。
  misconceptions:
    - 认为军阀割据在袁世凯在位时已经形成，忽略袁世凯死后北洋军阀分裂的背景。
    - 将军阀派系张冠李戴，如说直系是段祺瑞、皖系是冯国璋。
    - 把军阀割据归因于辛亥革命直接导致，而未提及袁世凯死后这一关键节点。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:军队建设指导思想战略性转变
  type: Concept
  subject: 历史
  title: 军队建设指导思想战略性转变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为军队建设指导思想战略性转变发生在1997年，实际是1985年
    - 能指出并纠正这一错误：认为裁军是因为不需要军队，而非战略指导思想转变
  aliases: []
  category: 历史事件
  explanation: 1985年军队建设从临战准备状态转到和平时期建设轨道，实行百万大裁军。
  misconceptions:
    - 误以为军队建设指导思想战略性转变发生在1997年，实际是1985年
    - 认为裁军是因为不需要军队，而非战略指导思想转变
    - 误以为转变是从“积极防御”转向“临战状态”
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:农业起源
  type: Concept
  subject: 历史
  title: 农业起源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为农业起源最早出现在黄河流域，忽略长江流域也有最早稻作
    - 能指出并纠正这一错误：把粟、黍说成起源于南方，实际起源于北方旱作农业区
  aliases: []
  category: 历史事件
  explanation: 距今约1万年，我国南北方出现人工栽培的农作物，是世界上最早的栽培水稻、粟和黍的国家之一。
  misconceptions:
    - 认为农业起源最早出现在黄河流域，忽略长江流域也有最早稻作
    - 把粟、黍说成起源于南方，实际起源于北方旱作农业区
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:农业集体化
  type: Concept
  subject: 历史
  title: 农业集体化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为农业集体化开始于20世纪20年代
    - 能指出并纠正这一错误：认为农业集体化调动了农民积极性，实际损害利益
  aliases: []
  category: 历史事件
  explanation: 20世纪30年代初苏联推行农业集体化，将农民土地公有化，但损害农民利益。
  misconceptions:
    - 误以为农业集体化开始于20世纪20年代
    - 认为农业集体化调动了农民积极性，实际损害利益
    - 将农业集体化等同于列宁的新经济政策
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S4.md
- id: concept:历史:农村包围城市、武装夺取政权
  type: Concept
  subject: 历史
  title: 农村包围城市、武装夺取政权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为农村包围城市道路是中共中央在城市斗争失败后决议确定的，实际是毛泽东在根据地实践中总结形成的…
    - 能指出并纠正这一错误：误认为农村包围城市就是上山打游击，忽略了土地革命和武装夺取政权的总目标。
  aliases:
    - 农村包围城市道路
  category: 革命理论
  explanation: 毛泽东总结工农武装割据的实践经验，形成的中国革命道路思想，到1930年各地创建了大小十几块革命根据地。
  misconceptions:
    - 误以为农村包围城市道路是中共中央在城市斗争失败后决议确定的，实际是毛泽东在根据地实践中总结形成的。
    - 误认为农村包围城市就是上山打游击，忽略了土地革命和武装夺取政权的总目标。
    - 误认为农村包围城市道路在遵义会议后才正式确立，实际到1930年已有多块根据地实践。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:农村居民人均可支配收入
  type: Concept
  subject: 历史
  title: 农村居民人均可支配收入
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘可支配收入’等同于‘纯收入’，忽略统计口径差异。
    - 能指出并纠正这一错误：误以为可支配收入是扣除支出前的总收入，实际需扣除生产性支出和税费。
  aliases:
    - 农村居民可支配收入
  category: 经济概念
  explanation: 指农村居民家庭在扣除生产性支出、税费等之后，实际可自由支配的收入，反映农村居民生活水平。
  misconceptions:
    - 把‘可支配收入’等同于‘纯收入’，忽略统计口径差异。
    - 误以为可支配收入是扣除支出前的总收入，实际需扣除生产性支出和税费。
    - 认为只包括工资性收入，忽略经营、财产和转移性收入。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:农村贫困人口
  type: Concept
  subject: 历史
  title: 农村贫困人口
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为贫困标准固定不变，忽略随经济水平逐年调整。
    - 能指出并纠正这一错误：认为贫困人口增多说明扶贫效果差，忽略标准提高可能增加人数。
  aliases:
    - 贫困人口
  category: 经济概念
  explanation: 指生活水平低于国家规定贫困标准的农村人口，其数量变化反映扶贫成效。
  misconceptions:
    - 误以为贫困标准固定不变，忽略随经济水平逐年调整。
    - 认为贫困人口增多说明扶贫效果差，忽略标准提高可能增加人数。
    - 将农村贫困人口与城市低保人口混为一谈。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:农民阶级的局限性
  type: Concept
  subject: 历史
  title: 农民阶级的局限性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为太平天国失败是因为中外反动势力强大，而非农民阶级自身局限，把客观因素当根本原因。
    - 能指出并纠正这一错误：把洪秀全个人腐败视为失败根源，以为换个领袖就能成功，忽视阶级局限性。
  aliases: []
  category: 历史概念
  explanation: 农民阶级无法提出切合实际的革命纲领，无法制止领导集团腐败，无法保持团结，导致运动失败。
  misconceptions:
    - 认为太平天国失败是因为中外反动势力强大，而非农民阶级自身局限，把客观因素当根本原因。
    - 把洪秀全个人腐败视为失败根源，以为换个领袖就能成功，忽视阶级局限性。
    - 认为《天朝田亩制度》是能调动农民积极性的科学革命纲领，实为绝对平均主义空想。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:冷战
  type: Concept
  subject: 历史
  title: 冷战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为冷战期间美苏没有发生过任何军事冲突，实际有间接军事冲突如朝鲜战争、越南战争
    - 能指出并纠正这一错误：误以为冷战开始于1955年华约成立，实际开始于杜鲁门主义出台
  aliases: []
  category: 历史概念
  explanation: 指二战后40多年间以美苏为首的两大集团之间既非战争又非和平的对峙与竞争状态。
  misconceptions:
    - 认为冷战期间美苏没有发生过任何军事冲突，实际有间接军事冲突如朝鲜战争、越南战争
    - 误以为冷战开始于1955年华约成立，实际开始于杜鲁门主义出台
    - 认为冷战只局限于美苏两国，实际上涉及以美苏为首的两大集团
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:冷战后的世界格局
  type: Concept
  subject: 历史
  title: 冷战后的世界格局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为多极化格局已经形成，实际是多种力量推动下的多极化趋势。
    - 能指出并纠正这一错误：误认为冷战结束后全球无战争，实际仍有局部冲突。
  aliases: []
  category: 政治
  explanation: 两极格局被打破，新的世界格局尚未形成，出现多极化趋势，和平与发展成为时代主题。
  misconceptions:
    - 认为多极化格局已经形成，实际是多种力量推动下的多极化趋势。
    - 误认为冷战结束后全球无战争，实际仍有局部冲突。
    - 把'一超多强'当作稳定的世界格局，忽略其动态演变。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S2.md
- id: concept:历史:减租减息政策
  type: Concept
  subject: 历史
  title: 减租减息政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为减租减息是废除地主土地所有制，实际上地主仍有土地所有权。
    - 能指出并纠正这一错误：误以为减租减息政策只要求地主减租减息，忽略农民仍须交租交息。
  aliases: []
  category: 经济政策
  explanation: 地主减租减息、农民交租交息的土地政策，调动各阶级抗战积极性。
  misconceptions:
    - 误以为减租减息是废除地主土地所有制，实际上地主仍有土地所有权。
    - 误以为减租减息政策只要求地主减租减息，忽略农民仍须交租交息。
    - 误以为减租减息在国共十年对峙时期就已实行，实际是抗战时期土地政策。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:凡尔登战役
  type: Concept
  subject: 历史
  title: 凡尔登战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把凡尔登战役说成英德之间，实际德法
    - 能指出并纠正这一错误：认为凡尔登战役是一战爆发标志，实际是转折点
  aliases: []
  category: 历史事件
  explanation: 1916年德法在凡尔登进行的惨烈阵地战，被称为“绞肉机”，是第一次世界大战的转折点之一。
  misconceptions:
    - 误把凡尔登战役说成英德之间，实际德法
    - 认为凡尔登战役是一战爆发标志，实际是转折点
    - 把凡尔登战役与索姆河战役相混淆
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:凡尔赛—华盛顿体系
  type: Concept
  subject: 历史
  title: 凡尔赛—华盛顿体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为它彻底解决了列强矛盾，实际埋下新祸根
    - 能指出并纠正这一错误：认为它只涉及欧洲事务，不包括亚太
  aliases: []
  category: 历史概念
  explanation: 一战后通过巴黎和会和华盛顿会议建立的国际新秩序，包括凡尔赛体系和华盛顿体系。
  misconceptions:
    - 误以为它彻底解决了列强矛盾，实际埋下新祸根
    - 认为它只涉及欧洲事务，不包括亚太
    - 把该体系建立时间说成一战前
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S3.md
- id: concept:历史:凡尔赛体系
  type: Concept
  subject: 历史
  title: 凡尔赛体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为凡尔赛体系仅由《凡尔赛条约》构成
    - 能指出并纠正这一错误：认为凡尔赛体系调整了全球所有地区秩序
  aliases: []
  category: 历史概念
  explanation: 一战后协约国与战败国签订的一系列和约构成的国际关系体系，主要调整欧洲、西亚、非洲等地区秩序。
  misconceptions:
    - 误以为凡尔赛体系仅由《凡尔赛条约》构成
    - 认为凡尔赛体系调整了全球所有地区秩序
    - 将凡尔赛体系与华盛顿体系混为一谈
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S3.md
- id: concept:历史:凿空
  type: Concept
  subject: 历史
  title: 凿空
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“凿空”当作开凿山洞或挖隧道。
    - 能指出并纠正这一错误：将“凿空”理解为张骞第二次出使时的行为。
  aliases: []
  category: 历史概念
  explanation: 《史记》称张骞出使西域为“凿空”，意为开辟通道，指张骞第一次开辟了中原通往西域的道路，具有开创性意义。
  misconceptions:
    - 误把“凿空”当作开凿山洞或挖隧道。
    - 将“凿空”理解为张骞第二次出使时的行为。
    - 认为“凿空”是打通海上丝绸之路，而非陆路。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:分化事权
  type: Concept
  subject: 历史
  title: 分化事权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分化事权只针对宰相，实际也包括削弱地方官员权力。
    - 能指出并纠正这一错误：把分化事权与崇文抑武方针混为一谈，两回事。
  aliases: []
  category: 政治制度
  explanation: 宋太祖通过分割宰相权力、设置副宰相等方式，加强君权。
  misconceptions:
    - 认为分化事权只针对宰相，实际也包括削弱地方官员权力。
    - 把分化事权与崇文抑武方针混为一谈，两回事。
    - 以为分化事权是为了加强武将权力，实际是削弱。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:分封制
  type: Concept
  subject: 历史
  title: 分封制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为分封制是商朝创立的，与宗法制混淆。
    - 能指出并纠正这一错误：认为诸侯只在封地收税，无需承担军赋和朝贡。
  aliases:
    - 封建制
  category: 政治制度
  explanation: 西周为稳定统治，将宗亲和功臣分封到各地建立诸侯国，诸侯承担义务并可在封地内再分封，形成天子、诸侯、卿大夫、士的等级结构。
  misconceptions:
    - 误以为分封制是商朝创立的，与宗法制混淆。
    - 认为诸侯只在封地收税，无需承担军赋和朝贡。
    - 误将分封等级写成天子-诸侯-卿-士，漏掉大夫。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:分封制瓦解
  type: Concept
  subject: 历史
  title: 分封制瓦解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分封制瓦解是周天子主动废除了分封制，实际是诸侯自行设置县郡不再分封。
    - 能指出并纠正这一错误：把分封制瓦解等同于分封制被完全废除，忽视郡县制与分封制并存时期。
  aliases: []
  category: 制度变化
  explanation: 诸侯不再分封土地给卿大夫，而设置县、郡委派官员直接管理，职位不再世袭，分封制逐步瓦解。
  misconceptions:
    - 认为分封制瓦解是周天子主动废除了分封制，实际是诸侯自行设置县郡不再分封。
    - 把分封制瓦解等同于分封制被完全废除，忽视郡县制与分封制并存时期。
    - 误以为诸侯不再分封土地给卿大夫是西周初年就有的制度，忽视时间在春秋时期。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:列夫·托尔斯泰
  type: Concept
  subject: 历史
  title: 列夫·托尔斯泰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为托尔斯泰是法国作家，实际他是俄国作家。
    - 能指出并纠正这一错误：把《战争与和平》说成陀思妥耶夫斯基的作品，张冠李戴。
  aliases:
    - 托尔斯泰
  category: 文学
  explanation: 俄国伟大作家，代表作有《战争与和平》《安娜·卡列尼娜》《复活》等，被列宁称为“俄国革命的镜子”。
  misconceptions:
    - 误以为托尔斯泰是法国作家，实际他是俄国作家。
    - 把《战争与和平》说成陀思妥耶夫斯基的作品，张冠李戴。
    - 认为是陀思妥耶夫斯基被列宁称为“俄国革命的镜子”，实为托尔斯泰。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:列强瓜分中国狂潮
  type: Concept
  subject: 历史
  title: 列强瓜分中国狂潮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为瓜分狂潮始于《马关条约》签订之前，实际是签后以干涉还辽为契机。
    - 能指出并纠正这一错误：误将'门户开放'视为瓜分狂潮表现，实际是美国提出承认列强势力范围的贸易均等政策。
  aliases:
    - 瓜分狂潮
  category: 历史事件
  explanation: 《马关条约》签订后，列强以干涉还辽为契机，在中国强租租借地、划分势力范围，掀起瓜分狂潮。
  misconceptions:
    - 误认为瓜分狂潮始于《马关条约》签订之前，实际是签后以干涉还辽为契机。
    - 误将'门户开放'视为瓜分狂潮表现，实际是美国提出承认列强势力范围的贸易均等政策。
    - 误以为三国干涉还辽是英法德，实际是俄德法。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:刘胡兰
  type: Concept
  subject: 历史
  title: 刘胡兰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将刘胡兰牺牲时间说成抗日战争时期，实际是解放战争时期
    - 能指出并纠正这一错误：把毛主席题词‘生的伟大，死的光荣’记成是朱德题写的
  aliases: []
  category: 历史人物
  explanation: 解放战争时期英勇就义的共产党员，毛泽东题词“生的伟大，死的光荣”。
  misconceptions:
    - 误将刘胡兰牺牲时间说成抗日战争时期，实际是解放战争时期
    - 把毛主席题词‘生的伟大，死的光荣’记成是朱德题写的
    - 误以为刘胡兰是红军长征途中的女战士
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:创新型国家
  type: Concept
  subject: 历史
  title: 创新型国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为我国已是世界科技最强国，无需再自主创新。
    - 能指出并纠正这一错误：认为创新型国家只指科技领域，与教育、经济无关。
  aliases: []
  category: 发展目标
  explanation: 我国进入创新型国家行列，科技自立自强不断加强，关键核心技术实现突破。
  misconceptions:
    - 误以为我国已是世界科技最强国，无需再自主创新。
    - 认为创新型国家只指科技领域，与教育、经济无关。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:制宪议会
  type: Concept
  subject: 历史
  title: 制宪议会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为制宪议会废除了封建制度和君主制，实际保留国王，确立君主立宪制。
    - 能指出并纠正这一错误：误以为制宪议会与国民公会是同一机构，实际前期和后期的区别。
  aliases: []
  category: 政治机构
  explanation: 法国大革命初期的立法机构，通过了《人权宣言》和1791年宪法。
  misconceptions:
    - 误认为制宪议会废除了封建制度和君主制，实际保留国王，确立君主立宪制。
    - 误以为制宪议会与国民公会是同一机构，实际前期和后期的区别。
    - 误认为《拿破仑法典》由制宪议会制定，实际是拿破仑时期法典。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:刺史制度
  type: Concept
  subject: 历史
  title: 刺史制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为刺史是州级最高行政长官，实际最初是监察官。
    - 能指出并纠正这一错误：误以为刺史制度始于秦朝，实际为汉武帝创立。
  aliases: []
  category: 政治制度
  explanation: 汉武帝将全国划分为13个州部，每州派刺史一人，代表朝廷监察地方官吏和豪强，加强中央对地方的控制。
  misconceptions:
    - 认为刺史是州级最高行政长官，实际最初是监察官。
    - 误以为刺史制度始于秦朝，实际为汉武帝创立。
    - 把刺史职责说成管理地方军政，实际只是监察地方官吏和豪强。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:加入世界贸易组织
  type: Concept
  subject: 历史
  title: 加入世界贸易组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记错中国加入WTO的时间，误认为是2002年1月或2001年11月。
    - 能指出并纠正这一错误：认为加入WTO是改革开放的起点，颠倒重大事件的先后顺序。
  aliases:
    - 入世
  category: 对外开放
  explanation: 2001年12月中国正式成为世界贸易组织成员，是中国对外开放的里程碑，有利于参与经济全球化。
  misconceptions:
    - 记错中国加入WTO的时间，误认为是2002年1月或2001年11月。
    - 认为加入WTO是改革开放的起点，颠倒重大事件的先后顺序。
    - 将入世影响绝对化，只强调机遇而忽视挑战。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:勃列日涅夫改革
  type: Concept
  subject: 历史
  title: 勃列日涅夫改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为勃列日涅夫改革突破了高度集中的计划经济体制，实际仍高度集中
    - 能指出并纠正这一错误：把勃列日涅夫改革与戈尔巴乔夫改革混淆，勃列日涅夫改革未导致苏联解体，也未突破旧体制
  aliases:
    - 勃列日涅夫新政策
  category: 历史事件
  explanation: 1964年勃列日涅夫执政，推行“新政策”，但改革未突破高度集中的计划经济体制，且因军备竞赛导致国民经济畸形发展。
  misconceptions:
    - 误认为勃列日涅夫改革突破了高度集中的计划经济体制，实际仍高度集中
    - 把勃列日涅夫改革与戈尔巴乔夫改革混淆，勃列日涅夫改革未导致苏联解体，也未突破旧体制
    - 认为勃列日涅夫改革因经济成功而闻名，实际因军备竞赛导致国民经济畸形发展
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:募役法
  type: Concept
  subject: 历史
  title: 募役法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为募役法免除了农民的一切徭役，实际是交钱代役。
    - 能指出并纠正这一错误：以为官僚和地主可以免交役钱，实际他们也要缴纳。
  aliases: []
  category: 变法措施
  explanation: 征收役钱雇人服役，官僚也要交钱，减轻农民负担，增加收入。
  misconceptions:
    - 认为募役法免除了农民的一切徭役，实际是交钱代役。
    - 以为官僚和地主可以免交役钱，实际他们也要缴纳。
    - 混淆募役法与方田均税法，一个管役一个管田。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:勤俭治国
  type: Concept
  subject: 历史
  title: 勤俭治国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'勤俭治国'是汉武帝刘彻提倡的，时间上张冠李戴。
    - 能指出并纠正这一错误：把勤俭治国仅仅理解为皇帝个人衣服朴素，忽略其抑制奢靡、减轻民负的治国作用。
  aliases: []
  category: 政策
  explanation: 汉文帝提倡的节俭治国理念，反对奢侈浮华，以身作则。
  misconceptions:
    - 认为'勤俭治国'是汉武帝刘彻提倡的，时间上张冠李戴。
    - 把勤俭治国仅仅理解为皇帝个人衣服朴素，忽略其抑制奢靡、减轻民负的治国作用。
    - 误以为'勤俭治国'就是否定一切消费，甚至认为汉文帝要求百姓也穿粗布衣。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S3.md
- id: concept:历史:化学工业
  type: Concept
  subject: 历史
  title: 化学工业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为化学工业产生于第一次工业革命，实际是第二次工业革命。
    - 能指出并纠正这一错误：只提生产碱，忽略硫酸等人造染料，以偏概全。
  aliases: []
  category: 工业部门
  explanation: 现代化学工业的产生是应用技术领域的重大突破，包括生产碱、硫酸、人造染料等，并推动了石油化学工业的发展。
  misconceptions:
    - 认为化学工业产生于第一次工业革命，实际是第二次工业革命。
    - 只提生产碱，忽略硫酸等人造染料，以偏概全。
    - 以为石油化学工业先于化学工业产生，实际是化学工业推动石油化工。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:化学工业和新材料
  type: Concept
  subject: 历史
  title: 化学工业和新材料
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为诺贝尔发明炸药属于军事技术，不属于化学工业，实际是化学工业突破。
    - 能指出并纠正这一错误：将海厄特误认为发明人造纤维，实际海厄特发明赛璐珞。
  aliases: []
  category: 技术领域
  explanation: 现代化学工业的产生是应用技术领域的重大突破，包括诺贝尔发明炸药、海厄特发明赛璐珞等。
  misconceptions:
    - 误以为诺贝尔发明炸药属于军事技术，不属于化学工业，实际是化学工业突破。
    - 将海厄特误认为发明人造纤维，实际海厄特发明赛璐珞。
    - 认为赛璐珞是天然树脂，实际是人工合成材料。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:化石
  type: Concept
  subject: 历史
  title: 化石
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为化石是古代生物的遗体直接变成石头，忽略遗骸或遗迹的石化过程
    - 能指出并纠正这一错误：把恐龙化石当作研究人类起源的直接证据，实际研究古人类需人类化石
  aliases: []
  category: 考古学概念
  explanation: 古代生物的遗骸或遗迹埋藏在地层中，经过漫长的时间，被周围沉积物中的矿物质所渗入，逐渐石化，称为“化石”。化石是研究古人类历史和古环境变迁的重要证据。
  misconceptions:
    - 认为化石是古代生物的遗体直接变成石头，忽略遗骸或遗迹的石化过程
    - 把恐龙化石当作研究人类起源的直接证据，实际研究古人类需人类化石
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:北京人
  type: Concept
  subject: 历史
  title: 北京人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北京人已经使用磨制石器和人工取火，实际使用打制石器和天然火
    - 能指出并纠正这一错误：把北京人说成早期智人，实际属于直立人
  aliases:
    - 北京直立人
  category: 古人类
  explanation: 生活在距今约70万—20万年，发现于北京周口店龙骨山，属于直立人，会使用打制石器和使用天然火。
  misconceptions:
    - 认为北京人已经使用磨制石器和人工取火，实际使用打制石器和天然火
    - 把北京人说成早期智人，实际属于直立人
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:北京城
  type: Concept
  subject: 历史
  title: 北京城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为北京城是明太祖朱元璋时期营建的，忽略了明成祖迁都。
    - 能指出并纠正这一错误：认为北京城只有宫城和皇城，没有内城和外城，以偏概全。
  aliases:
    - 明清北京城
  category: 历史
  explanation: 明朝在元大都基础上营建，1420年基本建成，有宫城、皇城、内城和外城，宫城即紫禁城，中轴线纵贯，布局均衡完整。
  misconceptions:
    - 误以为北京城是明太祖朱元璋时期营建的，忽略了明成祖迁都。
    - 认为北京城只有宫城和皇城，没有内城和外城，以偏概全。
    - 把紫禁城当作北京城的中心，实际上紫禁城只是宫城，中轴线上还有皇城。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S7.md
- id: concept:历史:北京奥运会
  type: Concept
  subject: 历史
  title: 北京奥运会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把奥运会举办年份记成2001年或2009年，与申办年份混淆。
    - 能指出并纠正这一错误：错误记忆口号为‘新北京、新奥运’，实际是‘同一个世界、同一个梦想’。
  aliases: []
  category: 史实
  explanation: 2008年在北京成功举办第29届夏季奥运会和第13届夏季残奥会，口号是'同一个世界、同一个梦想'。
  misconceptions:
    - 把奥运会举办年份记成2001年或2009年，与申办年份混淆。
    - 错误记忆口号为‘新北京、新奥运’，实际是‘同一个世界、同一个梦想’。
    - 忽略残奥会与奥运会先后举办，误以为同时开幕。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:北伐和西征
  type: Concept
  subject: 历史
  title: 北伐和西征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西征失败，实际西征胜利使太平天国达到全盛
    - 能指出并纠正这一错误：把北伐和西征的顺序颠倒，先有北伐后有西征
  aliases: []
  category: 历史事件
  explanation: 1853年太平天国为推翻清朝和巩固政权进行的军事行动，西征取得重大胜利，使太平天国军事上进入全盛时期。
  misconceptions:
    - 误以为西征失败，实际西征胜利使太平天国达到全盛
    - 把北伐和西征的顺序颠倒，先有北伐后有西征
    - 认为北伐目的是巩固政权，实际是推翻清朝统治
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:北伐战争
  type: Concept
  subject: 历史
  title: 北伐战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北伐战争推翻了所有北洋军阀的统治，忽视了张作霖势力仍存
    - 能指出并纠正这一错误：把北伐战争开始的时间误记为1924年，与国共合作开始混淆
  aliases:
    - 北伐
  category: 历史事件
  explanation: 1926年7月，国民革命军誓师北伐，推翻吴佩孚、孙传芳、张作霖等北洋军阀的统治，统一全国。
  misconceptions:
    - 认为北伐战争推翻了所有北洋军阀的统治，忽视了张作霖势力仍存
    - 把北伐战争开始的时间误记为1924年，与国共合作开始混淆
    - 认为北伐战争是由中国共产党独立领导的，忽视了国民党的领导作用
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:北宋的建立
  type: Concept
  subject: 历史
  title: 北宋的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北宋定都洛阳，实际是开封（东京）。
    - 能指出并纠正这一错误：以为北宋建立后立即统一全国，实际逐步统一。
  aliases:
    - 北宋建立
  category: 历史事件
  explanation: 960年赵匡胤建立宋朝，定都开封，史称北宋，后逐步统一中原和南方。
  misconceptions:
    - 认为北宋定都洛阳，实际是开封（东京）。
    - 以为北宋建立后立即统一全国，实际逐步统一。
    - 把陈桥兵变时间记在北宋建立之后，实际是兵变在前。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:北宋的政治
  type: Concept
  subject: 历史
  title: 北宋的政治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北宋政治重武轻文，实际重文轻武。
    - 能指出并纠正这一错误：以为北宋政治一直积贫积弱，忽视前期强盛。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 认为北宋政治重武轻文，实际重文轻武。
    - 以为北宋政治一直积贫积弱，忽视前期强盛。
    - 将北宋政治与南宋政治特点完全等同，忽略差异。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:北庭都元帅府
  type: Concept
  subject: 历史
  title: 北庭都元帅府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为北庭都元帅府设在西藏
    - 能指出并纠正这一错误：将北庭都元帅府混同于唐朝安西都护府
  aliases: []
  category: 历史事件
  explanation: 元朝在西北地区设置北庭都元帅府等机构，管理西域军政事务。
  misconceptions:
    - 误以为北庭都元帅府设在西藏
