  subject: 历史
  title: 坊市制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘坊’当作交易区，‘市’当作居住区
    - 能指出并纠正这一错误：认为坊市制度下商业活动不受时间限制
