- id: concept:历史:脱贫攻坚战全面胜利
  type: Concept
  subject: 历史
  title: 脱贫攻坚战全面胜利
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将832个贫困县全部摘帽的时间记成2021年底，实际宣布于2021年2月25日。
    - 能指出并纠正这一错误：认为全面胜利意味着我国已不存在任何贫困现象，忽略了相对贫困问题。
  aliases:
    - 脱贫攻坚
  category: 史实
  explanation: 2021年宣布我国现行标准下9899万农村贫困人口全部脱贫，832个贫困县全部摘帽，历史性解决绝对贫困问题。
  misconceptions:
    - 将832个贫困县全部摘帽的时间记成2021年底，实际宣布于2021年2月25日。
    - 认为全面胜利意味着我国已不存在任何贫困现象，忽略了相对贫困问题。
    - 把脱贫标准误认为人均年收入超过1万元，实际标准是现行标准下的‘两不愁三保障’。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:脱贫攻坚精神
  type: Concept
