  misconceptions:
    - 认为良渚遗址属于旧石器时代，实际距今约5300—4300年，是新石器时代晚期。
    - 把良渚古城遗址当作商朝都城，实际是中华文明起源时期遗址。
    - 认为良渚遗址以打制石器为主，实际已出现磨制石器、玉器，有早期国家特征。
