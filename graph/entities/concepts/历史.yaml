  misconceptions:
    - 误以为843年分裂后形成英法德，实际是法兰西、德意志、意大利雏形
    - 把克洛维与查理曼的事迹混淆，如以为克洛维加冕称帝
    - 认为查理曼帝国分裂后立即形成近代民族国家
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:柳公权
  type: Concept
  subject: 历史
  title: 柳公权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为柳公权是宋朝书法家，实际是唐朝。
