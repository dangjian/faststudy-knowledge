- id: concept:历史:漠北战役
  type: Concept
  subject: 历史
  title: 漠北战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为漠北战役是西汉首次大规模反击匈奴，实际此前已有河南战役等。
    - 能指出并纠正这一错误：误以为漠北战役后匈奴被彻底消灭，实际只是无力对抗。
