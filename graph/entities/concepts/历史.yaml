  category: 经济概念
  explanation: 第二次工业革命后，主要资本主义国家出现垄断组织，资本主义向帝国主义阶段过渡。
  misconceptions:
    - 误以为垄断组织出现在第一次工业革命后，实际是第二次工业革命后。
    - 认为垄断组织导致生产集中，实际是生产集中形成垄断。
    - 只提美国出现垄断组织，忽略其他国家，以偏概全。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:垦殖运动
  type: Concept
  subject: 历史
  title: 垦殖运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为垦殖运动是由政府统一组织发起的，实际是农民和庄园主自发开发
    - 能指出并纠正这一错误：误以为新开发地区没有独立司法权，实际获得独立司法权和行政自治权
  aliases: []
  category: 历史事件
  explanation: 11世纪以后，欧洲农村开展的开发林地、荒地、沼泽的运动，使土地面积扩大，新开发地区获得独立司法权和行政自治权。
  misconceptions:
    - 认为垦殖运动是由政府统一组织发起的，实际是农民和庄园主自发开发
    - 误以为新开发地区没有独立司法权，实际获得独立司法权和行政自治权
    - 把垦殖运动时间记成14世纪，实际是11世纪以后开始
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:城市化
  type: Concept
  subject: 历史
  title: 城市化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为城市化是农业发展的直接原因，实际是工业革命推动。
    - 能指出并纠正这一错误：认为19世纪后期大部分英国人生活在城市，误写为法国或美国。
  aliases: []
  category: 社会变化
  explanation: 工业革命后，农村人口流向城市，城市规模扩大，到19世纪后期大部分英国人生活在城市。
  misconceptions:
    - 误以为城市化是农业发展的直接原因，实际是工业革命推动。
    - 认为19世纪后期大部分英国人生活在城市，误写为法国或美国。
    - 把城市化等同于工业化，两者相关但有区别。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:城市经济体制改革
  type: Concept
  subject: 历史
  title: 城市经济体制改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把家庭联产承包责任制当作城市经济体制改革的内容
    - 能指出并纠正这一错误：认为城市改革一开始就全面推行承包制，忽略前期以扩大企业自主权为主
  aliases: []
  category: 经济改革
  explanation: 20世纪80年代初开始，扩大企业自主权，实行经济责任制，发展多种经济形式，克服'大锅饭'弊端。
  misconceptions:
    - 误把家庭联产承包责任制当作城市经济体制改革的内容
    - 认为城市改革一开始就全面推行承包制，忽略前期以扩大企业自主权为主
    - 将1984年经济体制改革决定当作城市改革起点，忽略80年代初已有试点
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:城市自治
  type: Concept
  subject: 历史
  title: 城市自治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有城市都靠武力获得自治，忽略许多城市通过赎买取得特许状。
    - 能指出并纠正这一错误：误以为获得自治后城市完全独立，不再受国王或领主管辖，实际仍有义务。
  aliases:
    - 自由城市
    - 自治城市
  category: 政治
  explanation: 中世纪城市通过赎买或武力争取自由与自治，取得特许状，市民享有自由。
  misconceptions:
    - 认为所有城市都靠武力获得自治，忽略许多城市通过赎买取得特许状。
    - 误以为获得自治后城市完全独立，不再受国王或领主管辖，实际仍有义务。
    - 把“自治”等同于“民主”，认为市民都有选举权，实际自治由贵族富商控制。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:城镇居民人均可支配收入
  type: Concept
  subject: 历史
  title: 城镇居民人均可支配收入
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为城镇居民人均可支配收入等于工资收入，忽略经营和财产收入。
    - 能指出并纠正这一错误：认为是个税扣除前的收入，实际需扣除个税和社会保障支出。
  aliases:
    - 城镇居民可支配收入
  category: 经济概念
  explanation: 指城镇居民家庭在扣除个人所得税、社会保障支出等之后，实际可自由支配的收入，是衡量居民生活水平的重要指标。
  misconceptions:
    - 误以为城镇居民人均可支配收入等于工资收入，忽略经营和财产收入。
    - 认为是个税扣除前的收入，实际需扣除个税和社会保障支出。
    - 忽略转移性收入（如赡养费）也是可支配收入的一部分。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C8/sections/S1.md
- id: concept:历史:基督教
  type: Concept
  subject: 历史
  title: 基督教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为基督教诞生于罗马城，实际在巴勒斯坦地区。
    - 能指出并纠正这一错误：把4世纪末成为罗马国教的时间记成1世纪或2世纪。
  aliases: []
  category: 宗教
  explanation: 1世纪在罗马帝国统治下的巴勒斯坦地区诞生，信仰耶稣为救世主，4世纪末成为罗马国教。
  misconceptions:
    - 误以为基督教诞生于罗马城，实际在巴勒斯坦地区。
    - 把4世纪末成为罗马国教的时间记成1世纪或2世纪。
    - 认为基督救世主是耶稣，但误以为耶稣传教在埃及等地。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:塞罕坝精神
  type: Concept
  subject: 历史
  title: 塞罕坝精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把塞罕坝精神等同于大庆精神，忽略其绿色发展的特有内涵。
    - 能指出并纠正这一错误：误以为塞罕坝林场是天然森林，不知是几代人人工造林。
  aliases: []
  category: 精神
  explanation: 几代塞罕坝人铸就的牢记使命、艰苦创业、绿色发展的精神。
  misconceptions:
    - 把塞罕坝精神等同于大庆精神，忽略其绿色发展的特有内涵。
    - 误以为塞罕坝林场是天然森林，不知是几代人人工造林。
    - 将塞罕坝精神归为革命战争时期形成，时间认知错误。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:墨子
  type: Concept
  subject: 历史
  title: 墨子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误主张墨子提倡‘仁政’，实际是孟子
    - 能指出并纠正这一错误：误认为墨子主张厚葬久丧，实际墨子主张节俭、节葬。
  aliases: []
  category: 历史人物
  explanation: 墨家创始人，主张兼爱、非攻、尚贤、节俭。
  misconceptions:
    - 误主张墨子提倡‘仁政’，实际是孟子；墨子主张兼爱非攻。
    - 误认为墨子主张厚葬久丧，实际墨子主张节俭、节葬。
    - 误将墨子归为儒家学派，实际他创立墨家。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:墨家学派
  type: Concept
  subject: 历史
  title: 墨家学派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将墨家学派看作儒家分支，实际是独立学派。
    - 能指出并纠正这一错误：错认为墨家代表人物有庄子，庄子是道家。
  aliases: []
  category: 学派
  explanation: 以墨子为代表，主张兼爱、非攻、尚贤。
  misconceptions:
    - 误将墨家学派看作儒家分支，实际是独立学派。
    - 错认为墨家代表人物有庄子，庄子是道家。
    - 误称墨家反对‘尚贤’，实际墨子主张‘尚贤’。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:墨西哥资产阶级革命
  type: Concept
  subject: 历史
  title: 墨西哥资产阶级革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为墨西哥革命推翻了迪亚斯后就立即成功，实际此后仍经历长期内战。
    - 能指出并纠正这一错误：认为革命性质是无产阶级革命，实际是资产阶级民主革命。
  aliases: []
  category: 历史事件
  explanation: 1910年爆发的革命，推翻迪亚斯独裁统治，1917年结束并颁布新宪法。
  misconceptions:
    - 以为墨西哥革命推翻了迪亚斯后就立即成功，实际此后仍经历长期内战。
    - 认为革命性质是无产阶级革命，实际是资产阶级民主革命。
    - 混淆革命时间，以为1917年才爆发，实际1910年爆发。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S5.md
- id: concept:历史:复种技术
  type: Concept
  subject: 历史
  title: 复种技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认复种技术是元朝从国外引进的
    - 能指出并纠正这一错误：将复种技术理解为一年的同一块地种同一种作物多次
  aliases: []
  category: 历史概念
  explanation: 宋代推广的农业技术，如江南种稻分早禾和晚禾，南宋时冬麦和晚稻两熟制得到大面积推广，提高了耕地利用率。
  misconceptions:
    - 误认复种技术是元朝从国外引进的
    - 将复种技术理解为一年的同一块地种同一种作物多次
    - 认为复种技术只在北方推广
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:夏商西周奴隶制王朝的更替
  type: Concept
  subject: 历史
  title: 夏商西周奴隶制王朝的更替
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为夏商周是同时并存的三个国家。
    - 能指出并纠正这一错误：认为夏朝是封建社会而非奴隶制王朝。
  aliases: []
  category: 历史脉络
  explanation: 夏、商、西周三个奴隶制王朝依次更替，是中国早期国家的发展阶段。
  misconceptions:
    - 误以为夏商周是同时并存的三个国家。
    - 认为夏朝是封建社会而非奴隶制王朝。
    - 将尧舜禹时期也归入夏商西周更替序列。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:夏朝的建立
  type: Concept
  subject: 历史
  title: 夏朝的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为夏朝建立于公元前1600年。
    - 能指出并纠正这一错误：认为禹建立的夏朝是第一个封建社会。
  aliases:
    - 夏朝建立
  category: 历史事件
  explanation: 约公元前2070年，禹建立夏朝，这是我国历史上第一个奴隶制王朝，标志着我国王朝的产生。
  misconceptions:
    - 误以为夏朝建立于公元前1600年。
    - 认为禹建立的夏朝是第一个封建社会。
    - 把启说成夏朝建立者，而非禹。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:外交为民
  type: Concept
  subject: 历史
  title: 外交为民
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘外交为民’与‘和平发展’混淆，认为都是外交总体布局。
    - 能指出并纠正这一错误：误以为利比亚撤侨是军事行动，忽略其属于外交领事保护。
  aliases: []
  category: 外交概念
  explanation: 中国政府外交工作的宗旨，强调维护国家利益和公民海外合法权益，如利比亚撤侨行动。
  misconceptions:
    - 将‘外交为民’与‘和平发展’混淆，认为都是外交总体布局。
    - 误以为利比亚撤侨是军事行动，忽略其属于外交领事保护。
    - 认为外交为民仅保护海外公民，忽略也保护海外企业合法权益。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S3.md
- id: concept:历史:外戚与宦官交替专权
  type: Concept
  subject: 历史
  title: 外戚与宦官交替专权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为外戚与宦官是同时掌权，实际是交替把持朝政
    - 能指出并纠正这一错误：误以为外戚宦官专权发生在东汉初年，实际是东汉中后期
  aliases:
    - 外戚专权
    - 宦官专权
  category: 历史现象
  explanation: 东汉中后期，皇帝年幼，外戚和宦官轮流把持朝政，导致政治腐朽、社会混乱。
  misconceptions:
    - 认为外戚与宦官是同时掌权，实际是交替把持朝政
    - 误以为外戚宦官专权发生在东汉初年，实际是东汉中后期
    - 将外戚宦官专权现象张冠李戴到西汉汉武帝时期
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S5.md
- id: concept:历史:多元一体
  type: Concept
  subject: 历史
  title: 多元一体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为多元一体指所有区域文化完全融合成单一文化，实际各区域仍保留特色
    - 能指出并纠正这一错误：把多元一体说成中原文化单向传播，忽略其他区域文化的贡献
  aliases: []
  category: 文明特征
  explanation: 中华文明的起源和初步发展具有多元一体的特征，即多个区域文明并存，最终汇聚成以中原为核心的文明格局。
  misconceptions:
    - 认为多元一体指所有区域文化完全融合成单一文化，实际各区域仍保留特色
    - 把多元一体说成中原文化单向传播，忽略其他区域文化的贡献
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:大众教育
  type: Concept
  subject: 历史
  title: 大众教育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为德国实行免费义务教育，实际是英国法国，德国是系统教育体系。
    - 能指出并纠正这一错误：认为大众教育是第二次工业革命以后才推行，实际是19世纪以后。
  aliases: []
  category: 社会变化
  explanation: 19世纪以后，欧美主要国家推广大众教育，如德国建立系统教育体系，英法实行免费义务教育。
  misconceptions:
    - 误以为德国实行免费义务教育，实际是英国法国，德国是系统教育体系。
    - 认为大众教育是第二次工业革命以后才推行，实际是19世纪以后。
    - 把大众教育的推行归因于工业革命，但实际是独立的社会进步。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:大化改新
  type: Concept
  subject: 历史
  title: 大化改新
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为大化改新是学习中国明朝制度，实际是仿效唐朝
    - 能指出并纠正这一错误：误以为大化改新发生在646年之前或之后很久，实际是646年开始
  aliases:
    - 大化革新
  category: 历史事件
  explanation: 646年开始，日本仿效唐朝典章制度进行的一系列改革，使日本发展成为一个中央集权制的封建国家。
  misconceptions:
    - 误认为大化改新是学习中国明朝制度，实际是仿效唐朝
    - 误以为大化改新发生在646年之前或之后很久，实际是646年开始
    - 误以为大化改新后日本成为奴隶制国家，实际是封建国家
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:大和政权统一日本
  type: Concept
  subject: 历史
  title: 大和政权统一日本
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为大和政权统一日本是在3世纪，实际是5世纪
    - 能指出并纠正这一错误：误将大和政权最高统治者称为‘天皇’，当时称为‘大王’
  aliases:
    - 大和国
  category: 历史事件
  explanation: 5世纪，日本本州中部兴起的大和政权基本实现了统一，最高统治者称为“大王”。
  misconceptions:
    - 误认为大和政权统一日本是在3世纪，实际是5世纪
    - 误将大和政权最高统治者称为‘天皇’，当时称为‘大王’
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:大国是关键、周边是首要、发展中国家是基础、多边是重要舞台
  type: Concept
  subject: 历史
  title: 大国是关键、周边是首要、发展中国家是基础、多边是重要舞台
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘大国是关键’和‘周边是首要’顺序记反，导致布局理解错误。
    - 能指出并纠正这一错误：误认为‘多边是重要舞台’意味着多边是新世纪外交的首要。
  aliases:
    - 外交工作总体布局
  category: 外交布局
  explanation: 新世纪中国外交工作的总体布局，强调与大国、周边国家、发展中国家及多边机制的关系。
  misconceptions:
    - 把‘大国是关键’和‘周边是首要’顺序记反，导致布局理解错误。
    - 误认为‘多边是重要舞台’意味着多边是新世纪外交的首要。
    - 将该布局与‘和平共处五项原则’混为一谈，忽略这是具体布局。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S3.md
- id: concept:历史:大学的兴起
  type: Concept
  subject: 历史
  title: 大学的兴起
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为大学是国王或教会直接创办的，实际多为师生自治行会发展而来。
    - 能指出并纠正这一错误：因果颠倒，认为是大学的兴起促进了经济繁荣，实际是经济繁荣推动大学兴起。
  aliases: []
  category: 教育
  explanation: 中世纪经济繁荣促进教育发展，大学纷纷兴起，成为培养专业人才的场所。
  misconceptions:
    - 误认为大学是国王或教会直接创办的，实际多为师生自治行会发展而来。
    - 因果颠倒，认为是大学的兴起促进了经济繁荣，实际是经济繁荣推动大学兴起。
    - 以为大学最早出现在古代希腊，实际中世纪大学是近代大学源头。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:大学自治
  type: Concept
  subject: 历史
  title: 大学自治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为大学自治就是一切自由，学生可以不上课不考试，实际只是管理自主。
    - 能指出并纠正这一错误：认为大学不受任何限制，完全独立于教会与国家，实际仍受一定干预。
  aliases: []
  category: 历史概念
  explanation: 中世纪大学享有的自治地位，主要体现在免赋税特权、教育自主权、司法特权。
  misconceptions:
    - 误以为大学自治就是一切自由，学生可以不上课不考试，实际只是管理自主。
    - 认为大学不受任何限制，完全独立于教会与国家，实际仍受一定干预。
    - 漏掉司法特权，只提免赋税或教育自主权，不知大学有独立司法权。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S4.md
- id: concept:历史:大庆精神（铁人精神）
  type: Concept
  subject: 历史
  title: 大庆精神（铁人精神）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'铁人'是雷锋或焦裕禄，实际是王进喜。
    - 能指出并纠正这一错误：把大庆精神概括为'苦干加巧干'，漏掉爱国、创业、求实、奉献。
  aliases:
    - 铁人精神
  category: 精神品质
  explanation: 爱国、创业、求实、奉献的精神，以王进喜为代表的大庆石油工人所体现。
  misconceptions:
    - 误以为'铁人'是雷锋或焦裕禄，实际是王进喜。
    - 把大庆精神概括为'苦干加巧干'，漏掉爱国、创业、求实、奉献。
    - 以为大庆精神只属于石油工人，与其他行业建设者无关。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S2.md
- id: concept:历史:大汶口文化
  type: Concept
  subject: 历史
  title: 大汶口文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为大汶口文化兴起于长江流域，实际主要分布于黄河下游和淮河中下游
    - 能指出并纠正这一错误：把大汶口文化的贫富分化说成出现在早期，实际出现在晚期
  aliases: []
  category: 考古学文化
  explanation: 主要分布于黄河下游和淮河中下游地区，距今约5900—4400年，晚期出现贫富分化。
  misconceptions:
    - 认为大汶口文化兴起于长江流域，实际主要分布于黄河下游和淮河中下游
    - 把大汶口文化的贫富分化说成出现在早期，实际出现在晚期
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:大生产运动
  type: Concept
  subject: 历史
  title: 大生产运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为大生产运动由根据地农民承担，实际是军队和机关学校自己开荒生产。
    - 能指出并纠正这一错误：误以为大生产运动开展于解放战争时期，实际是抗日战争最困难阶段。
  aliases: []
  category: 历史事件
  explanation: 抗日根据地开展的生产运动，减轻人民负担，支持抗战。
  misconceptions:
    - 误以为大生产运动由根据地农民承担，实际是军队和机关学校自己开荒生产。
    - 误以为大生产运动开展于解放战争时期，实际是抗日战争最困难阶段。
    - 误以为大生产运动的目的是增加政府财税收入，实际是为了减轻人民负担、自给自足。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:大跃进
  type: Concept
  subject: 历史
  title: 大跃进
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“大跃进”当作农业合作化运动，或认为它开始于1956年。
    - 能指出并纠正这一错误：认为“大跃进”的主要表现是“全民大炼钢铁”，而忽视农业“高产卫星”。
  aliases: []
  category: 历史事件
  explanation: 1958年开始的全国性运动，片面追求工农业生产高速度，忽视客观经济规律，导致国民经济困难。
  misconceptions:
    - 误把“大跃进”当作农业合作化运动，或认为它开始于1956年。
    - 认为“大跃进”的主要表现是“全民大炼钢铁”，而忽视农业“高产卫星”。
    - 把三年经济困难的原因完全归咎于自然灾害，刻意忽略“大跃进”的人为失误。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:天下四聚
  type: Concept
  subject: 历史
  title: 天下四聚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把景德镇列为天下四聚之一，实际四聚是北京、苏州、汉口镇、佛山镇。
    - 能指出并纠正这一错误：以为天下四聚都是工商业城市，忽略了北京是政治中心。
  aliases: []
  category: 经济
  explanation: 指北京、苏州、汉口镇、佛山镇四个重要商品集聚地。
  misconceptions:
    - 误把景德镇列为天下四聚之一，实际四聚是北京、苏州、汉口镇、佛山镇。
    - 以为天下四聚都是工商业城市，忽略了北京是政治中心。
    - 错写四聚，将广州或杭州混入。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S6.md
- id: concept:历史:天京事变
  type: Concept
  subject: 历史
  title: 天京事变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为天京事变发生在定都之前，实际定都后1856年才发生
    - 能指出并纠正这一错误：将杨秀清被杀说成洪秀全直接杀死，实际是韦昌辉所为
  aliases: []
  category: 历史事件
  explanation: 1856年秋太平天国领导集团内部争权夺利引发的内讧，导致杨秀清被杀、韦昌辉被处死、石达开出走，使太平天国由盛转衰。
  misconceptions:
    - 误以为天京事变发生在定都之前，实际定都后1856年才发生
    - 将杨秀清被杀说成洪秀全直接杀死，实际是韦昌辉所为
    - 认为天京事变使太平天国立即失败，实际是由盛转衰的转折点
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:天京陷落
  type: Concept
  subject: 历史
  title: 天京陷落
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为天京陷落标志着太平天国完全灭亡，实际是运动失败标志
    - 能指出并纠正这一错误：把天京陷落时间写成1863年，实际是1864年
  aliases: []
  category: 历史事件
  explanation: 1864年湘军攻陷天京，标志着太平天国运动失败。
  misconceptions:
    - 误以为天京陷落标志着太平天国完全灭亡，实际是运动失败标志
    - 把天京陷落时间写成1863年，实际是1864年
    - 认为攻陷天京的是曾国藩的湘军，实际是湘军但主帅是曾国荃
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:天可汗
  type: Concept
  subject: 历史
  title: 天可汗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“天可汗”是唐朝皇帝专用称号，每位皇帝都称天可汗
    - 能指出并纠正这一错误：误认为“天可汗”是唐太宗自封的，实际是西北各族尊奉
  aliases: []
  category: 政治制度
  explanation: 唐太宗被西北各族尊奉为'天可汗'，意为各族共同君主，体现开明民族政策。
  misconceptions:
    - 误认为“天可汗”是唐朝皇帝专用称号，每位皇帝都称天可汗
    - 误认为“天可汗”是唐太宗自封的，实际是西北各族尊奉
    - 误把“天可汗”理解为正式官职，而非尊称
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:天津保卫战
  type: Concept
  subject: 历史
  title: 天津保卫战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为聂士成是义和团首领，实际他是清军将领
    - 能指出并纠正这一错误：把天津保卫战记成1899年发生，实际是1900年
  aliases: []
  category: 战役
  explanation: 1900年义和团联合清军在天津与侵略军激战，直隶提督聂士成殉国，最终天津失陷。
  misconceptions:
    - 误认为聂士成是义和团首领，实际他是清军将领
    - 把天津保卫战记成1899年发生，实际是1900年
    - 认为天津保卫战中聂士成临阵脱逃，实际他殉国
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S3.md
- id: concept:历史:太平天国运动
  type: Concept
  subject: 历史
  title: 太平天国运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为太平天国运动爆发于1850年，与林则徐禁烟时间混淆
    - 能指出并纠正这一错误：把太平天国运动定性为资产阶级民主革命，实际上它是农民战争
  aliases: []
  category: 历史事件
  explanation: 1851年至1864年洪秀全领导的农民战争，持续14年，沉重打击了清朝统治和外国侵略势力，最终失败。
  misconceptions:
    - 误以为太平天国运动爆发于1850年，与林则徐禁烟时间混淆
    - 把太平天国运动定性为资产阶级民主革命，实际上它是农民战争
    - 认为太平天国运动结束标志是天京事变，实际是天京陷落
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:太平天国运动失败
  type: Concept
  subject: 历史
  title: 太平天国运动失败
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把天京陷落时间记为1860或1868年，实际是1864年。
    - 能指出并纠正这一错误：将天京事变视为运动失败的标志，实际天京事变是转折点，失败标志是天京陷落。
  aliases: []
  category: 历史事件
  explanation: 1864年天京陷落标志着太平天国运动失败，其失败的根本原因是农民阶级的局限性。
  misconceptions:
    - 把天京陷落时间记为1860或1868年，实际是1864年。
    - 将天京事变视为运动失败的标志，实际天京事变是转折点，失败标志是天京陷落。
    - 误以为太平天国运动爆发于第二次鸦片战争之后，实际爆发于战争之前（1851年）。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:太平天国运动失败原因
  type: Concept
  subject: 历史
  title: 太平天国运动失败原因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把失败原因简单归结为中外势力太强，忽视根本原因是农民阶级局限性
    - 能指出并纠正这一错误：误以为太平天国提出了切合实际的革命纲领，实际没有
  aliases: []
  category: 历史结论
  explanation: 由于农民阶级的局限性，无法提出切合实际的革命纲领，无法制止领导集团腐败，无法保持团结，在中外反动势力联合镇压下失败。
  misconceptions:
    - 把失败原因简单归结为中外势力太强，忽视根本原因是农民阶级局限性
    - 误以为太平天国提出了切合实际的革命纲领，实际没有
    - 将失败原因归咎于洪秀全个人，忽视阶级局限的深层因素
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:太平天国运动的历史意义
  type: Concept
  subject: 历史
  title: 太平天国运动的历史意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说太平天国运动推翻了清朝统治，实际它只是沉重打击，并未推翻。
    - 能指出并纠正这一错误：误认为它是中国近代史的开端，实际开端是鸦片战争。
  aliases: []
  category: 历史评价
  explanation: 太平天国运动是中国历史上规模宏大的农民战争，坚持14年，沉重打击了清朝统治和外国侵略势力。
  misconceptions:
    - 说太平天国运动推翻了清朝统治，实际它只是沉重打击，并未推翻。
    - 误认为它是中国近代史的开端，实际开端是鸦片战争。
    - 将太平天国坚持时间说成13或15年，实际是14年。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:奉系军阀
  type: Concept
  subject: 历史
  title: 奉系军阀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为奉系军阀得名于张作霖是奉节人，实际得名于奉天。
    - 能指出并纠正这一错误：将奉系军阀的盘踞地错记为直隶、江苏，实际为东北。
  aliases: []
  category: 历史概念
  explanation: 以张作霖为首，因张作霖是奉天人而得名，盘踞东北。
  misconceptions:
    - 误以为奉系军阀得名于张作霖是奉节人，实际得名于奉天。
    - 将奉系军阀的盘踞地错记为直隶、江苏，实际为东北。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S2.md
- id: concept:历史:奏折制度
  type: Concept
  subject: 历史
  title: 奏折制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为奏折制度始于雍正帝，实际康熙时已有，雍正加以完善。
    - 能指出并纠正这一错误：认为奏折制度是官员公开上奏的渠道，实际是秘密呈送皇帝。
  aliases: []
  category: 政治制度
  explanation: 康熙时期部分官员向皇帝秘密呈送报告，皇帝亲手批阅，使皇帝更直接获取信息，强化君主专制。
  misconceptions:
    - 误认为奏折制度始于雍正帝，实际康熙时已有，雍正加以完善。
    - 认为奏折制度是官员公开上奏的渠道，实际是秘密呈送皇帝。
    - 认为奏折制度削弱皇权，实际使皇帝更直接获取信息，强化君权。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:奥斯曼帝国
  type: Concept
  subject: 历史
  title: 奥斯曼帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为奥斯曼帝国建立于1453年，实际建立于13世纪末，1453年是灭拜占庭。
    - 能指出并纠正这一错误：把攻灭拜占庭帝国说成阿拉伯帝国，混淆奥斯曼与阿拉伯。
  aliases: []
  category: 历史概念
  explanation: 由奥斯曼人建立，1453年攻灭拜占庭帝国，改君士坦丁堡为伊斯坦布尔。
  misconceptions:
    - 误以为奥斯曼帝国建立于1453年，实际建立于13世纪末，1453年是灭拜占庭。
    - 把攻灭拜占庭帝国说成阿拉伯帝国，混淆奥斯曼与阿拉伯。
    - 误以为伊斯坦布尔改名前是“拜占庭”，实际原名君士坦丁堡。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:奥林匹克运动会起源
  type: Concept
  subject: 历史
  title: 奥林匹克运动会起源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为奥林匹克运动会起源于罗马
    - 能指出并纠正这一错误：误认为古代奥运会自公元前776年起就是全希腊的运动会
  aliases:
    - 奥运会
  category: 历史事件
  explanation: 奥林匹克运动会起源于古希腊，因举办地在奥林匹亚而得名，公元前776年后发展为全希腊的运动会。
  misconceptions:
    - 误认为奥林匹克运动会起源于罗马
    - 误认为古代奥运会自公元前776年起就是全希腊的运动会
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:奴儿干都司
  type: Concept
  subject: 历史
  title: 奴儿干都司
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为奴儿干都司设在西北地区，实际在黑龙江下游，管辖东北女真。
    - 能指出并纠正这一错误：认为奴儿干都司是明太祖设立，实际是明成祖设立。
  aliases: []
  category: 边疆管理
  explanation: 明成祖在黑龙江下游设奴儿干都司，加强对东北女真等部的管理。
  misconceptions:
    - 误以为奴儿干都司设在西北地区，实际在黑龙江下游，管辖东北女真。
    - 认为奴儿干都司是明太祖设立，实际是明成祖设立。
    - 将奴儿干都司与乌斯藏都司混淆，后者管辖西藏。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:好望角
  type: Concept
  subject: 历史
  title: 好望角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为迪亚士绕过好望角并到达了印度，实际他只到达好望角，未到印度
    - 能指出并纠正这一错误：把好望角名称由来归于麦哲伦，实际是葡萄牙国王约翰二世改名
  aliases:
    - 风暴角
  category: 地理发现
  explanation: 非洲西南端的尖角，迪亚士称其为“风暴角”，后由葡萄牙国王约翰二世改称“好望角”。
  misconceptions:
    - 认为迪亚士绕过好望角并到达了印度，实际他只到达好望角，未到印度
    - 把好望角名称由来归于麦哲伦，实际是葡萄牙国王约翰二世改名
    - 误以为好望角就是非洲最南端，实际非洲最南端是厄加勒斯角
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:妇女地位提高
  type: Concept
  subject: 历史
  title: 妇女地位提高
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为二战后妇女已与男性完全平等，实际仍存在职场歧视和家庭暴力等问题
    - 能指出并纠正这一错误：把妇女地位提高的原因简单归为战争，忽视受教育程度提升的长期作用
  aliases:
    - 女性地位
  category: 历史概念
  explanation: 二战后，随着受教育程度提升，妇女越来越多参加社会工作，女性就业率增长，政治参与度提高，但尚未完全平等。
  misconceptions:
    - 误以为二战后妇女已与男性完全平等，实际仍存在职场歧视和家庭暴力等问题
    - 把妇女地位提高的原因简单归为战争，忽视受教育程度提升的长期作用
    - 认为女性就业率增长从一战时就已开始，而非二战后的趋势
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:姚子青
  type: Concept
  subject: 历史
  title: 姚子青
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将姚子青守卫宝山说成坚守四行仓库，实际为谢晋元
    - 能指出并纠正这一错误：把姚子青说成在台儿庄战役中牺牲，实际是淞沪会战
  aliases: []
  category: 历史人物
  explanation: 淞沪会战中率全营守卫宝山，与日军苦战数日，全营官兵壮烈牺牲。
  misconceptions:
    - 误将姚子青守卫宝山说成坚守四行仓库，实际为谢晋元
    - 把姚子青说成在台儿庄战役中牺牲，实际是淞沪会战
    - 误以为姚子青全营大部分突围成功，实际全营壮烈牺牲
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:姚崇
  type: Concept
  subject: 历史
  title: 姚崇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为姚崇是唐太宗的宰相
    - 能指出并纠正这一错误：将姚崇与宋璟的事迹安到魏征身上
  aliases:
    - 救时宰相
  category: 历史人物
  explanation: 姚崇是唐玄宗时期的宰相，提出兴利除弊的10条建议，整顿吏治，推行有利于发展生产的举措，为开元盛世作出贡献，被誉为“救时宰相”。
  misconceptions:
    - 误以为姚崇是唐太宗的宰相
    - 将姚崇与宋璟的事迹安到魏征身上
    - 认为‘十建议’是魏征向唐太宗提出的
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:威海卫战役
  type: Concept
  subject: 历史
  title: 威海卫战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为北洋舰队全军覆没发生在黄海海战，实际是威海卫战役
    - 能指出并纠正这一错误：把丁汝昌殉国说成是在黄海海战中牺牲
  aliases: []
  category: 战役
  explanation: 1895年初日军进攻威海卫，北洋舰队全军覆没，丁汝昌自杀殉国。
  misconceptions:
    - 误认为北洋舰队全军覆没发生在黄海海战，实际是威海卫战役
    - 把丁汝昌殉国说成是在黄海海战中牺牲
    - 误以为威海卫战役是陆战，实际是日军海陆夹击的海军决战
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S3.md
- id: concept:历史:孔子
  type: Concept
  subject: 历史
  title: 孔子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为孔子是战国时期人，实际是春秋后期鲁国人。
    - 能指出并纠正这一错误：误以为孔子是道家创始人，实际是老子
  aliases:
    - 孔丘
    - 仲尼
  category: 历史人物
  explanation: 名丘字仲尼，春秋后期鲁国人，儒家学派创始人，思想核心是“仁”，主张为政以德、有教无类。
  misconceptions:
    - 误认为孔子是战国时期人，实际是春秋后期鲁国人。
    - 误以为孔子是道家创始人，实际是老子；孔子创儒家。
    - 误称孔子提出‘仁政’，实际是孟子，孔子主张‘仁’和‘为政以德’。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:孙中山
  type: Concept
  subject: 历史
  title: 孙中山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为孙中山亲自指挥了武昌起义，实际上起义由新军中的革命党人发动，孙中山当时在国外。
    - 能指出并纠正这一错误：将孙中山与黄兴混淆，误认为黄兴是同盟会总理，实际总理是孙中山。
  aliases: []
  category: 历史人物
  explanation: 中国民主革命先行者，创立同盟会，领导辛亥革命，后任中华民国临时大总统。
  misconceptions:
    - 误认为孙中山亲自指挥了武昌起义，实际上起义由新军中的革命党人发动，孙中山当时在国外。
    - 将孙中山与黄兴混淆，误认为黄兴是同盟会总理，实际总理是孙中山。
    - 误认为孙中山在武昌起义当日就任临时大总统，实际成立中华民国是在1912年元旦。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:孙思邈
  type: Concept
  subject: 历史
  title: 孙思邈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为孙思邈是明朝人，或把《千金方》当成《本草纲目》。
    - 能指出并纠正这一错误：认为“药王”是华佗，不知孙思邈被尊为药王。
  aliases:
    - 药王
  category: 历史人物
  explanation: 唐朝医药学家，著《千金方》，被后世尊为“药王”。
  misconceptions:
    - 误以为孙思邈是明朝人，或把《千金方》当成《本草纲目》。
    - 认为“药王”是华佗，不知孙思邈被尊为药王。
    - 误以为孙思邈参与编修《唐本草》，实际与《唐本草》无关。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:孙武
  type: Concept
  subject: 历史
  title: 孙武
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把孙武误认为战国时期的孙膑，甚至说《孙子兵法》是孙膑写的
    - 能指出并纠正这一错误：称孙武是儒家创始人或道家代表，忘记他是兵家创始人
  aliases: []
  category: 历史人物
  explanation: 春秋末期兵家创始人，著有《孙子兵法》。
  misconceptions:
    - 把孙武误认为战国时期的孙膑，甚至说《孙子兵法》是孙膑写的
    - 称孙武是儒家创始人或道家代表，忘记他是兵家创始人
    - 将《孙子兵法》说成是战国兵家孙膑所著，时间相差近百年
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:孟子
  type: Concept
  subject: 历史
  title: 孟子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为孟子是儒家学派的创始人，甚至把他说成是春秋时期人
    - 能指出并纠正这一错误：将‘民贵君轻’说成是荀子或韩非的主张
  aliases: []
  category: 历史人物
  explanation: 战国时期儒家代表人物，主张仁政、民贵君轻。
  misconceptions:
    - 认为孟子是儒家学派的创始人，甚至把他说成是春秋时期人
    - 将‘民贵君轻’说成是荀子或韩非的主张
    - 认为孟子主张‘无为而治’，与道家思想混为一谈
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:宁汉合流
  type: Concept
  subject: 历史
  title: 宁汉合流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把宁汉合流误为国共合作，实际是国民党内部派系合并
    - 能指出并纠正这一错误：误认为宁汉合流后全国统一，实际直到东北易帜才形式上统一
  aliases: []
  category: 历史事件
  explanation: 1927年，武汉国民政府与南京国民政府合并，南京国民政府成为国民党一党专政的政府。
  misconceptions:
    - 把宁汉合流误为国共合作，实际是国民党内部派系合并
    - 误认为宁汉合流后全国统一，实际直到东北易帜才形式上统一
    - 将宁汉合流时间记成1928年，实际在1927年
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:安史之乱
  type: Concept
  subject: 历史
  title: 安史之乱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把安史之乱误认为农民起义，实际是边防将领叛乱
    - 能指出并纠正这一错误：认为发生在唐太宗或唐玄宗之前，实际是唐玄宗末年
  aliases:
    - 天宝之乱
  category: 历史事件
  explanation: 755年，安禄山和史思明发动叛乱，史称安史之乱，持续八年，使唐朝由盛转衰。
  misconceptions:
    - 把安史之乱误认为农民起义，实际是边防将领叛乱
    - 认为发生在唐太宗或唐玄宗之前，实际是唐玄宗末年
    - 将安禄山和史思明误认为同一人，或把持续八年写成十年
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:安庆起义
  type: Concept
  subject: 历史
  title: 安庆起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为安庆起义是同盟会领导的，实际是光复会成员徐锡麟发动。
    - 能指出并纠正这一错误：将秋瑾牺牲地误认为安庆，实际秋瑾在绍兴就义。
  aliases: []
  category: 历史事件
  explanation: 1907年夏光复会会员徐锡麟在安庆发动的起义，失败后徐锡麟死难，秋瑾在绍兴策应被捕就义。
  misconceptions:
    - 误认为安庆起义是同盟会领导的，实际是光复会成员徐锡麟发动。
    - 将秋瑾牺牲地误认为安庆，实际秋瑾在绍兴就义。
    - 时间混淆，误以为安庆起义发生在萍浏醴起义之后，实际安庆起义在1907年，萍浏醴在1906年。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:安西都护府和北庭都护府
  type: Concept
  subject: 历史
  title: 安西都护府和北庭都护府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为安西都护府管理天山以北，北庭都护府管理天山以南
    - 能指出并纠正这一错误：误认为两个都护府都是唐太宗时设置，实际北庭为武则天时期
  aliases: []
  category: 政治制度
  explanation: 唐朝在西域设置的行政机构，管辖天山南北地区，加强中央对西域的统治。
  misconceptions:
    - 误认为安西都护府管理天山以北，北庭都护府管理天山以南
    - 误认为两个都护府都是唐太宗时设置，实际北庭为武则天时期
    - 误认为都护府设在吐蕃地区，或与将军府混淆
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:宋元商业繁荣
  type: Concept
  subject: 历史
  title: 宋元商业繁荣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为坊市界限在唐朝已被打破，实际严格限制到宋朝才突破
    - 能指出并纠正这一错误：把临安当成北宋都城，东京才是北宋都城
  aliases:
    - 商业繁荣
  category: 经济史
  explanation: 宋元时期商业超过前代，南方尤为发达，出现东京、临安、大都等百万人口大城市，商业活动突破坊市界限，早市夜市发展。
  misconceptions:
    - 误以为坊市界限在唐朝已被打破，实际严格限制到宋朝才突破
    - 把临安当成北宋都城，东京才是北宋都城
    - 认为宋元商业繁荣局限于北方，忽略南方更发达
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S6.md
- id: concept:历史:宋元海外贸易
  type: Concept
  subject: 历史
  title: 宋元海外贸易
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国商船到达东非是在明朝郑和时期，宋元已远达阿拉伯和东非
    - 能指出并纠正这一错误：将元朝贸易国140多个说成宋朝时的数据，混淆朝代
  aliases:
    - 海外贸易
  category: 经济史
  explanation: 宋元海上贸易超过前代，中国商船远达阿拉伯和东非，贸易国家元朝超过140个。
  misconceptions:
    - 误以为中国商船到达东非是在明朝郑和时期，宋元已远达阿拉伯和东非
    - 将元朝贸易国140多个说成宋朝时的数据，混淆朝代
    - 认为宋元海外贸易仅限近海，未能深入印度洋
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S5.md
- id: concept:历史:宋夏和约
  type: Concept
  subject: 历史
  title: 宋夏和约
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把宋夏和约的时间记成1005年，与澶渊之盟混淆
    - 能指出并纠正这一错误：误以为元昊向北宋称臣后，北宋还每年给西夏钱物叫岁币
  aliases:
    - 庆历和议
  category: 历史事件
  explanation: 1044年，北宋与西夏订立和约，元昊向宋称臣，北宋给西夏钱物，称为“岁赐”。
  misconceptions:
    - 把宋夏和约的时间记成1005年，与澶渊之盟混淆
    - 误以为元昊向北宋称臣后，北宋还每年给西夏钱物叫岁币
    - 认为宋夏和约后双方再无战争，忽略后来仍有冲突
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:宋庆龄声明
  type: Concept
  subject: 历史
  title: 宋庆龄声明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把宋庆龄声明当作中国共产党声明，实际她当时是国民党左派
    - 能指出并纠正这一错误：认为宋庆龄声明后加入中共，实际她仍坚持革命但未入党
  aliases: []
  category: 历史事件
  explanation: 1927年7月14日，宋庆龄发表声明，抗议国民党反动派背叛革命，宣布退出国民党中央执行委员会。
  misconceptions:
    - 误把宋庆龄声明当作中国共产党声明，实际她当时是国民党左派
    - 认为宋庆龄声明后加入中共，实际她仍坚持革命但未入党
    - 把声明时间记在七一五反革命政变之后，实际是7月14日发表
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:宋教仁案
  type: Concept
  subject: 历史
  title: 宋教仁案
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宋教仁案是袁世凯称帝的直接导火索，实际是二次革命的导火索。
    - 能指出并纠正这一错误：误称宋教仁主张总统制以限制袁世凯，他实际上主张责任内阁制。
  aliases:
    - 宋教仁遇刺
  category: 历史事件
  explanation: 1913年，宋教仁在准备北上组阁时于上海火车站遇刺身亡，幕后主使为袁世凯亲信，该事件引发了二次革命。
  misconceptions:
    - 认为宋教仁案是袁世凯称帝的直接导火索，实际是二次革命的导火索。
    - 误称宋教仁主张总统制以限制袁世凯，他实际上主张责任内阁制。
    - 将宋教仁案说成孙中山指使，实际幕后主使为袁世凯亲信。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:宋词
  type: Concept
  subject: 历史
  title: 宋词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为词是宋代才出现的文学形式，其实唐代已有。
    - 能指出并纠正这一错误：误以为所有宋词都是豪放派，忽略了婉约等流派。
  aliases:
    - 长短句
  category: 文学形式
  explanation: 词是一种新体诗歌，句子有长有短，也称长短句，便于歌唱，在唐代已经出现，宋代成为主要文学形式之一。
  misconceptions:
    - 认为词是宋代才出现的文学形式，其实唐代已有。
    - 误以为所有宋词都是豪放派，忽略了婉约等流派。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:宋金和议
  type: Concept
  subject: 历史
  title: 宋金和议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将宋金和议与北宋的澶渊之盟混淆，两者对象和内容不同。
    - 能指出并纠正这一错误：误认为宋金对峙以长江为界，实际以淮水至大散关一线为界。
  aliases:
    - 绍兴和议
  category: 历史事件
  explanation: 1141年宋金达成和议，南宋向金称臣，以淮水至大散关一线为界，形成宋金对峙局面。
  misconceptions:
    - 将宋金和议与北宋的澶渊之盟混淆，两者对象和内容不同。
    - 误认为宋金对峙以长江为界，实际以淮水至大散关一线为界。
    - 认为和议后宋金地位平等，实际南宋向金称臣。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:官渡之战
  type: Concept
  subject: 历史
  title: 官渡之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把官渡之战作战双方记为曹操与孙权，实际是曹操与袁绍
    - 能指出并纠正这一错误：认为官渡之战发生在赤壁之战后，实际官渡之战在200年，早于208年赤壁之战
  aliases: []
  category: 历史事件
  explanation: 200年曹操与袁绍在官渡进行决战，曹操以少胜多，为统一北方打下基础。
  misconceptions:
    - 误把官渡之战作战双方记为曹操与孙权，实际是曹操与袁绍
    - 认为官渡之战发生在赤壁之战后，实际官渡之战在200年，早于208年赤壁之战
    - 误以为官渡之战袁绍以少胜多，实际是曹操以少胜多
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S1.md
- id: concept:历史:定居生活
  type: Concept
  subject: 历史
  title: 定居生活
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为定居生活先于农业起源，实际农业起源促进了定居生活
    - 能指出并纠正这一错误：把磨制石器说成旧石器时代标志，实际新石器时代才普遍磨制
  aliases: []
  category: 生活方式
  explanation: 农业起源促进了定居生活，人们磨制石器、制作陶器、饲养家畜，生产力水平提高。
  misconceptions:
    - 认为定居生活先于农业起源，实际农业起源促进了定居生活
    - 把磨制石器说成旧石器时代标志，实际新石器时代才普遍磨制
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:定都天京
  type: Concept
  subject: 历史
  title: 定都天京
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为定都天京是在金田起义之前，实际起义后1853年才定都
    - 能指出并纠正这一错误：认为天京是南京改名，但误写成北京或洛阳
  aliases: []
  category: 历史事件
  explanation: 1853年3月太平军攻占南京，改名为天京，作为都城。
  misconceptions:
    - 误以为定都天京是在金田起义之前，实际起义后1853年才定都
    - 认为天京是南京改名，但误写成北京或洛阳
    - 忽略定都后的军事行动，误以为定都即全盛
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:实业救国
  type: Concept
  subject: 历史
  title: 实业救国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将张謇当作洋务派代表，实际他是甲午战后状元实业家。
    - 能指出并纠正这一错误：误以为实业救国思潮兴起于洋务运动时期，实际在甲午战后民族危机加深时兴起。
  aliases: []
  category: 历史概念
  explanation: 甲午战后，张謇等状元实业家放弃高官厚禄，回乡创办企业，带动很多人走上实业救国道路。
  misconceptions:
    - 误将张謇当作洋务派代表，实际他是甲午战后状元实业家。
    - 误以为实业救国思潮兴起于洋务运动时期，实际在甲午战后民族危机加深时兴起。
    - 误以为张謇创办的是重工业或军事工业，实际多为纺织等轻工业。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:宣慰使司都元帅府
  type: Concept
  subject: 历史
  title: 宣慰使司都元帅府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认元朝在西藏设立驻藏大臣
    - 能指出并纠正这一错误：将宣慰使司都元帅府记成清朝设立的机构
  aliases: []
  category: 历史事件
  explanation: 元朝在西藏设立宣慰使司都元帅府，屯驻军队，从此中央政府对西藏正式行使行政管辖权。
  misconceptions:
    - 误认元朝在西藏设立驻藏大臣
    - 将宣慰使司都元帅府记成清朝设立的机构
    - 认为该机构是元朝在台湾设立的
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:宪法宣誓制度
  type: Concept
  subject: 历史
  title: 宪法宣誓制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为宪法宣誓制度是在2018年首次实施，实际2016年已开始
    - 能指出并纠正这一错误：认为宪法宣誓的誓词自始至终未修订，忽视2018年修订誓词
  aliases: []
  category: 法律制度
  explanation: 国家工作人员就职时公开进行宪法宣誓，2016年开始实施，2018年修订誓词。
  misconceptions:
    - 误以为宪法宣誓制度是在2018年首次实施，实际2016年已开始
    - 认为宪法宣誓的誓词自始至终未修订，忽视2018年修订誓词
    - 误以为所有国家工作人员就职时必须宣誓，实际范围有限定
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:家庭联产承包责任制
  type: Concept
  subject: 历史
  title: 家庭联产承包责任制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为承包后土地归农民私有，实际所有权仍属集体
    - 能指出并纠正这一错误：误将包干到户说成‘分田单干’，否定其集体所有制性质
  aliases:
    - 包产到户
    - 包干到户
  category: 经济制度
  explanation: 以包产到户、包干到户为主要形式，在土地公有制基础上将土地长期承包给农户经营，自负盈亏，调动农民生产积极性。
  misconceptions:
    - 以为承包后土地归农民私有，实际所有权仍属集体
    - 误将包干到户说成‘分田单干’，否定其集体所有制性质
    - 认为最早实行于四川凤阳，实际是安徽凤阳小岗村
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S2.md
- id: concept:历史:富裕农民和市民阶层
  type: Concept
  subject: 历史
  title: 富裕农民和市民阶层
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为富裕农民和市民阶层属于封建贵族，实际他们是新兴的阶级力量
    - 能指出并纠正这一错误：误以为市民阶层通过劳动致富，实际他们通过投资乡村、联姻等方式兴起
  aliases: []
  category: 社会阶层
  explanation: 富裕农民和市民通过集中土地、投资乡村、联姻等方式，成为农村和城市中新兴的阶级力量，政治权利扩大。
  misconceptions:
    - 认为富裕农民和市民阶层属于封建贵族，实际他们是新兴的阶级力量
    - 误以为市民阶层通过劳动致富，实际他们通过投资乡村、联姻等方式兴起
    - 认为他们的政治权利没有变化，实际通过集中土地和投资使政治权利扩大
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:察举制
  type: Concept
  subject: 历史
  title: 察举制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为察举制是考试选官，与科举制混淆，实际是地方推荐。
    - 能指出并纠正这一错误：误以为察举制由中央直接选拔，实际由地方向中央推荐人才。
  aliases: []
  category: 选官制度
  explanation: 汉武帝确立的由地方向中央推荐人才的选官制度，选拔了一批优秀人才。
  misconceptions:
    - 认为察举制是考试选官，与科举制混淆，实际是地方推荐。
    - 误以为察举制由中央直接选拔，实际由地方向中央推荐人才。
    - 将察举制出现时间记成秦朝，实际是汉代确立。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:对外开放
  type: Concept
  subject: 历史
  title: 对外开放
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把对外开放等同于对外贸易，忽略引进外资、技术和管理经验
    - 能指出并纠正这一错误：认为经济特区在改革开放前已建立，实际是1980年才设立
  aliases: []
  category: 基本国策
  explanation: 中国在改革中逐步展开的对外经济交流，包括吸引外资、引进技术和管理经验，兴办经济特区等。
  misconceptions:
    - 把对外开放等同于对外贸易，忽略引进外资、技术和管理经验
    - 认为经济特区在改革开放前已建立，实际是1980年才设立
    - 误认为只有沿海地区开放，忽略内地和沿江等开放
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:封君封臣制度
  type: Concept
  subject: 历史
  title: 封君封臣制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“我的附庸的附庸也是我的附庸”，实际只对自己直接封君效忠。
    - 能指出并纠正这一错误：认为封臣只享受土地和封赐，无需尽义务，实际要效忠、服兵役等。
  aliases:
    - 封建制度
  category: 政治制度
  explanation: 以土地封赐为纽带，封君与封臣之间形成权利义务关系，具有等级性和契约意义。
  misconceptions:
    - 误以为“我的附庸的附庸也是我的附庸”，实际只对自己直接封君效忠。
    - 认为封臣只享受土地和封赐，无需尽义务，实际要效忠、服兵役等。
    - 认为封君可随意没收封臣土地，实际有契约关系，不可任意妄为。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:封建社会
  type: Concept
  subject: 历史
  title: 封建社会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为中国封建社会始于秦朝统一，实际战国时期已进入封建社会。
    - 能指出并纠正这一错误：认为战国主要阶级仍是奴隶主与奴隶，忽略了地主阶级新贵。
  aliases: []
  category: 社会形态
  explanation: 战国时期中国开始进入封建社会，地主阶级与农民阶级成为主要阶级。
  misconceptions:
    - 误以为中国封建社会始于秦朝统一，实际战国时期已进入封建社会。
    - 认为战国主要阶级仍是奴隶主与奴隶，忽略了地主阶级新贵。
    - 将'封建社会'等同于郡县制，认为秦朝才建立封建制度。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:尊崇儒术
  type: Concept
  subject: 历史
  title: 尊崇儒术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为尊崇儒术后其他学派被禁止，实际只是儒学成为正统。
    - 能指出并纠正这一错误：误以为‘罢黜百家’是孔子提出，实际是董仲舒建议。
  aliases:
    - 罢黜百家，独尊儒术
  category: 思想文化
  explanation: 汉武帝接受董仲舒建议，将儒家学说立为正统思想，兴办太学，使儒学成为国家统治思想。
  misconceptions:
    - 认为尊崇儒术后其他学派被禁止，实际只是儒学成为正统。
    - 误以为‘罢黜百家’是孔子提出，实际是董仲舒建议。
    - 认为太学在汉武帝之前已有，实际是汉武帝兴办。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:尊王攘夷
  type: Concept
  subject: 历史
  title: 尊王攘夷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“尊王攘夷”理解为诸侯真心尊重周王，忽视其借旗号争霸的真实目的。
    - 能指出并纠正这一错误：认为“攘夷”是抵抗所有少数民族，实际主要指抵御北方戎狄等外族入侵。
  aliases: []
  category: 政治口号
  explanation: 一些强大诸侯打出的旗号，意为尊重周王、抵御外族，借此争夺霸主地位。
  misconceptions:
    - 将“尊王攘夷”理解为诸侯真心尊重周王，忽视其借旗号争霸的真实目的。
    - 认为“攘夷”是抵抗所有少数民族，实际主要指抵御北方戎狄等外族入侵。
    - 把“尊王攘夷”当作齐桓公首创，忽视其他霸主也曾用过此旗号。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:小康目标
  type: Concept
  subject: 历史
  title: 小康目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘小康’理解为富裕或现代化，实际是温饱与现代化之间的阶段
    - 能指出并纠正这一错误：以为小康目标在中共十三大提出，实际是1979年邓小平提出
  aliases:
    - 小康
  category: 发展战略
  explanation: 邓小平1979年提出的现代化目标，借用传统文化'小康'概念，指20世纪末人民生活达到小康水平。
  misconceptions:
    - 误把‘小康’理解为富裕或现代化，实际是温饱与现代化之间的阶段
    - 以为小康目标在中共十三大提出，实际是1979年邓小平提出
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S3.md
- id: concept:历史:少数民族三大英雄史诗
  type: Concept
  subject: 历史
  title: 少数民族三大英雄史诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《格萨尔王传》说成蒙古族史诗，把《江格尔》说成藏族史诗。
    - 能指出并纠正这一错误：认为《玛纳斯》是维吾尔族史诗，或三大史诗均有明确作者。
  aliases:
    - 三大史诗
  category: 文化
  explanation: 藏族史诗《格萨尔王传》、蒙古族史诗《江格尔》和柯尔克孜族史诗《玛纳斯》，是世界文化艺术宝库中的瑰宝。
  misconceptions:
    - 把《格萨尔王传》说成蒙古族史诗，把《江格尔》说成藏族史诗。
    - 认为《玛纳斯》是维吾尔族史诗，或三大史诗均有明确作者。
    - 将三大英雄史诗与《荷马史诗》混淆，误以为产生于古希腊。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S2.md
- id: concept:历史:尼罗河与古埃及文明的关系
  type: Concept
  subject: 历史
  title: 尼罗河与古埃及文明的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为尼罗河泛滥只带来灾难，无益于农业，实际留下肥沃淤泥。
    - 能指出并纠正这一错误：把'尼罗河的赠礼'说成是古埃及人自称，实际出自古希腊史家希罗多德。
  aliases:
    - 尼罗河的赠礼
  category: 历史
  explanation: 尼罗河定期泛滥，留下肥沃的淤泥，有利于农业生产，因此古埃及被认为是“尼罗河的赠礼”。
  misconceptions:
    - 认为尼罗河泛滥只带来灾难，无益于农业，实际留下肥沃淤泥。
    - 把'尼罗河的赠礼'说成是古埃及人自称，实际出自古希腊史家希罗多德。
    - 颠倒因果：认为是古埃及文明使尼罗河泛滥，实际是尼罗河孕育文明。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S2.md
- id: concept:历史:局部抗战
  type: Concept
  subject: 历史
  title: 局部抗战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把局部抗战的起点说成七七事变，实际在九一八事变后已开始
    - 能指出并纠正这一错误：认为局部抗战只由国民党军队进行，忽略中共领导的力量
  aliases: []
  category: 历史概念
  explanation: 九一八事变后，东北各族民众和爱国官兵组织抗日义勇军，中国共产党领导游击队和东北抗日联军，开始了中国人民的局部抗战。
  misconceptions:
    - 把局部抗战的起点说成七七事变，实际在九一八事变后已开始
    - 认为局部抗战只由国民党军队进行，忽略中共领导的力量
    - 将东北抗日联军说成国民党组织的正规军
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:居里夫人
  type: Concept
  subject: 历史
  title: 居里夫人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为居里夫人只获得一次诺贝尔奖，实际是物理和化学各一次
    - 能指出并纠正这一错误：把发现X射线说成是居里夫人，实为伦琴
  aliases:
    - 玛丽·居里
  category: 科学
  explanation: 波兰裔法国物理学家和化学家，发现镭和钋元素，两度获得诺贝尔奖。
  misconceptions:
    - 误以为居里夫人只获得一次诺贝尔奖，实际是物理和化学各一次
    - 把发现X射线说成是居里夫人，实为伦琴
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S3.md
- id: concept:历史:屯田制
  type: Concept
  subject: 历史
  title: 屯田制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为屯田制是孙权实行以开发江南，实际是曹操在北方推行
    - 能指出并纠正这一错误：误以为屯田制仅招募士兵种地，实际还组织流亡民众生产
  aliases:
    - 屯田
  category: 经济制度
  explanation: 曹操组织军队和流亡民众从事农业生产，解决军粮和民生问题。
  misconceptions:
    - 认为屯田制是孙权实行以开发江南，实际是曹操在北方推行
    - 误以为屯田制仅招募士兵种地，实际还组织流亡民众生产
    - 把屯田制与北魏均田制混为一谈，实际两者时代不同
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S1.md
- id: concept:历史:山顶洞人
  type: Concept
  subject: 历史
  title: 山顶洞人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为山顶洞人使用磨制石器，实际他们仍使用打制石器，只是掌握磨光和钻孔技术。
    - 能指出并纠正这一错误：把山顶洞人当作最早使用火的古人类，实际北京人早已使用天然火，山顶洞人可能人工取火。
  aliases: []
  category: 古人类
  explanation: 距今约3万年，属于晚期智人，模样和现代人相同，掌握磨光和钻孔技术，可能已经知道人工取火。
  misconceptions:
    - 认为山顶洞人使用磨制石器，实际他们仍使用打制石器，只是掌握磨光和钻孔技术。
    - 把山顶洞人当作最早使用火的古人类，实际北京人早已使用天然火，山顶洞人可能人工取火。
    - 认为山顶洞人距今约1万年，实际约3万年，属于晚期智人。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:岁币
  type: Concept
  subject: 历史
  title: 岁币
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把岁币与岁赐混为一谈，岁币是给辽的，岁赐是给西夏的
    - 能指出并纠正这一错误：误以为岁币是北宋向辽称臣后进贡的，实际双方以兄弟相称
  aliases: []
  category: 历史概念
  explanation: 北宋每年送给辽的钱物，称为“岁币”，是澶渊之盟的内容之一。
  misconceptions:
    - 把岁币与岁赐混为一谈，岁币是给辽的，岁赐是给西夏的
    - 误以为岁币是北宋向辽称臣后进贡的，实际双方以兄弟相称
    - 记成岁币是辽主动放弃进攻后北宋才给的
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:岁赐
  type: Concept
  subject: 历史
  title: 岁赐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把岁赐说成岁币，概念混淆
    - 能指出并纠正这一错误：误以为岁赐是西夏向北宋进贡的财物，实际是北宋给西夏
  aliases: []
  category: 历史概念
  explanation: 北宋给西夏的钱物，称为“岁赐”，是宋夏和约的内容之一。
  misconceptions:
    - 把岁赐说成岁币，概念混淆
    - 误以为岁赐是西夏向北宋进贡的财物，实际是北宋给西夏
    - 认为岁赐和岁币是同一笔钱，只是称呼不同
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:岳飞抗金
  type: Concept
  subject: 历史
  title: 岳飞抗金
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为岳飞被宋钦宗杀害，实为宋高宗和秦桧所为。
    - 能指出并纠正这一错误：将郾城大捷误认为黄天荡之战，后者是韩世忠指挥。
  aliases: []
  category: 历史事件
  explanation: 南宋初年，岳飞等抗金将领率军北伐，岳家军在郾城大败金军主力，但宋高宗和秦桧求和，岳飞被班师回朝。
  misconceptions:
    - 误以为岳飞被宋钦宗杀害，实为宋高宗和秦桧所为。
    - 将郾城大捷误认为黄天荡之战，后者是韩世忠指挥。
    - 认为岳飞北伐失败导致被召回，实际是求和派强令班师。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:崇文抑武方针
  type: Concept
  subject: 历史
  title: 崇文抑武方针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为崇文抑武方针导致军队战斗力大增，实际军事实力下降。
    - 能指出并纠正这一错误：以为这一方针只重文臣不抑武将，实际两者并重。
  aliases:
    - 重文轻武
  category: 政策方针
  explanation: 宋朝实行重文轻武的政策，重用文臣，抑制武将，以巩固政权。
  misconceptions:
    - 认为崇文抑武方针导致军队战斗力大增，实际军事实力下降。
    - 以为这一方针只重文臣不抑武将，实际两者并重。
    - 把崇文抑武方针归为王安石提出，实际是宋初基本国策。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:州牧割据
  type: Concept
  subject: 历史
  title: 州牧割据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为州牧制度在黄巾起义前已有，实际是起义后才改刺史为州牧
    - 能指出并纠正这一错误：误以为州牧是中央官职，实际是地方军政长官，后成割据军阀
  aliases: []
  category: 历史概念
  explanation: 黄巾起义后，东汉改刺史为州牧，州牧势力膨胀，成为割据一方的军阀，加速了东汉瓦解。
  misconceptions:
    - 认为州牧制度在黄巾起义前已有，实际是起义后才改刺史为州牧
    - 误以为州牧是中央官职，实际是地方军政长官，后成割据军阀
    - 把刺史和州牧等同，忽略州牧权力膨胀成为割据势力
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S5.md
- id: concept:历史:工业革命
  type: Concept
  subject: 历史
  title: 工业革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为工业革命首先发生在法国，实际开始于英国
    - 能指出并纠正这一错误：把瓦特改良蒸汽机当作工业革命开始的标志，实际开始的标志是珍妮机的发明
  aliases:
    - 产业革命
  category: 历史事件
  explanation: 18世纪60年代从英国开始的以机器生产代替手工劳动的生产领域革命性变化，极大地推动了生产力发展。
  misconceptions:
    - 认为工业革命首先发生在法国，实际开始于英国
    - 把瓦特改良蒸汽机当作工业革命开始的标志，实际开始的标志是珍妮机的发明
    - 认为工业革命仅指技术变革，忽略它带来的社会关系变革
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:工农武装割据
  type: Concept
  subject: 历史
  title: 工农武装割据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把工农武装割据等同于农村包围城市道路，实际它只是农村包围城市道路的重要组成部分。
    - 能指出并纠正这一错误：误认为工农武装割据仅指军事割据和游击战，忽视打土豪分田地、土地革命和政权建设。
  aliases:
    - 武装割据
  category: 革命理论
  explanation: 毛泽东在井冈山革命根据地实行的打土豪、分田地，开展土地革命，建立工农民主政权，坚持游击战争的局面，是农村包围城市道路的重要组成部分。
  misconceptions:
    - 误把工农武装割据等同于农村包围城市道路，实际它只是农村包围城市道路的重要组成部分。
    - 误认为工农武装割据仅指军事割据和游击战，忽视打土豪分田地、土地革命和政权建设。
    - 误认为工农武装割据是在农村包围城市理论提出后才开始实践，实际是井冈山时期先有实践后有总结。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:左宗棠收复新疆
  type: Concept
  subject: 历史
  title: 左宗棠收复新疆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为左宗棠采用先南后北、缓进急战策略，实际是先北后南、缓进急战。
    - 能指出并纠正这一错误：错误认为左宗棠收复了伊犁，实际伊犁是通过曾纪泽谈判收回的。
  aliases: []
  category: 历史事件
  explanation: 1875年左宗棠督办新疆军务，采取先北后南、缓进急战的策略，于1878年收复除伊犁外的新疆领土。
  misconceptions:
    - 误认为左宗棠采用先南后北、缓进急战策略，实际是先北后南、缓进急战。
    - 错误认为左宗棠收复了伊犁，实际伊犁是通过曾纪泽谈判收回的。
    - 误将左宗棠收复新疆时间说成1881年，实际1878年收复除伊犁外领土。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:左权
  type: Concept
  subject: 历史
  title: 左权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为左权是八路军总司令，实际他任八路军副参谋长
    - 能指出并纠正这一错误：将左权牺牲地点记作太行山，实际是山西辽县（今左权县）
  aliases: []
  category: 历史人物
  explanation: 八路军副参谋长，参与指挥百团大战等战役，1942年5月在山西辽县指挥突围时壮烈牺牲，是八路军在抗日战争中牺牲的最高将领。
  misconceptions:
    - 误以为左权是八路军总司令，实际他任八路军副参谋长
    - 将左权牺牲地点记作太行山，实际是山西辽县（今左权县）
    - 误把左权说成在百团大战中牺牲，实际牺牲于1942年反“扫荡”作战中
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S3.md
- id: concept:历史:巨鹿之战
  type: Concept
  subject: 历史
  title: 巨鹿之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巨鹿之战是刘邦指挥的，实际是项羽率军击败秦军主力。
    - 能指出并纠正这一错误：认为巨鹿之战发生在秦朝灭亡之后，实际是公元前207年秦亡前夕的关键战役。
  aliases:
    - 巨鹿之战
  category: 历史事件
  explanation: 公元前207年，项羽在巨鹿之战中以少胜多，歼灭秦军主力，是秦末农民战争中的关键战役。
  misconceptions:
    - 误以为巨鹿之战是刘邦指挥的，实际是项羽率军击败秦军主力。
    - 认为巨鹿之战发生在秦朝灭亡之后，实际是公元前207年秦亡前夕的关键战役。
    - 把巨鹿之战说成秦末唯一一次以少胜多的战役，忽略其他如陈胜吴广起义等战例。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S2.md
- id: concept:历史:巴尔扎克
  type: Concept
  subject: 历史
  title: 巴尔扎克
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《人间喜剧》是剧本集，实际是小说集
    - 能指出并纠正这一错误：把巴尔扎克当作俄国作家，与托尔斯泰混淆
  aliases: []
  category: 历史人物
  explanation: 19世纪法国作家，创作《人间喜剧》小说集。
  misconceptions:
    - 误认为《人间喜剧》是剧本集，实际是小说集
    - 把巴尔扎克当作俄国作家，与托尔斯泰混淆
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:巴拿马收回运河主权
  type: Concept
  subject: 历史
  title: 巴拿马收回运河主权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为巴拿马收回运河主权是在2000年，实际是1999年底
    - 能指出并纠正这一错误：认为巴拿马收回运河后美国仍保留部分基地，实际收回运河区全部主权
  aliases:
    - 巴拿马运河收回
  category: 历史事件
  explanation: 巴拿马通过长期斗争，于1999年底收回运河区全部主权，维护了国家主权。
  misconceptions:
    - 误认为巴拿马收回运河主权是在2000年，实际是1999年底
    - 认为巴拿马收回运河后美国仍保留部分基地，实际收回运河区全部主权
    - 把巴拿马运河主权回归与苏伊士运河时间混淆，实际是1999年底
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:巴黎公社
  type: Concept
  subject: 历史
  title: 巴黎公社
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把巴黎公社说成世界上第一个社会主义国家，实际它是无产阶级政权
    - 能指出并纠正这一错误：误以为巴黎公社由马克思直接领导，实际是巴黎人民自发起义
  aliases: []
  category: 历史事件
  explanation: 1871年巴黎无产阶级建立的世界上第一个无产阶级政权，虽然失败，但具有重大历史意义。
  misconceptions:
    - 把巴黎公社说成世界上第一个社会主义国家，实际它是无产阶级政权
    - 误以为巴黎公社由马克思直接领导，实际是巴黎人民自发起义
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:巴黎和会
  type: Concept
  subject: 历史
  title: 巴黎和会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把巴黎和会说成在中国开或与华盛顿会议混为一谈
    - 能指出并纠正这一错误：以为中国代表在巴黎和会上争取山东权益成功，实际遭拒绝并被转让给日本
  aliases: []
  category: 历史事件
  explanation: 1919年一战战胜国在法国巴黎召开的会议，中国代表提出合理要求遭拒绝，列强将德国在山东的权益转让给日本，成为五四运动导火索。
  misconceptions:
    - 误把巴黎和会说成在中国开或与华盛顿会议混为一谈
    - 以为中国代表在巴黎和会上争取山东权益成功，实际遭拒绝并被转让给日本
    - 把德国在山东权益说成'割让山东'，实际是转让权益并非领土割让
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:市民身份
  type: Concept
  subject: 历史
  title: 市民身份
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为农奴进城立刻获得自由，实际需住满一年零一天。
    - 能指出并纠正这一错误：认为进城农奴获得市民身份后仍要缴纳农奴税，实际享有自由不再属领主。
  aliases: []
  category: 社会
  explanation: 农奴进入城市住满一年零一天即获得市民身份，享有自由。
  misconceptions:
    - 误以为农奴进城立刻获得自由，实际需住满一年零一天。
    - 认为进城农奴获得市民身份后仍要缴纳农奴税，实际享有自由不再属领主。
    - 以为只有农奴才能获得市民身份，实际自由人、商人也可成为市民。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:市民阶层
  type: Concept
  subject: 历史
  title: 市民阶层
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为市民阶层就是早期的资产阶级，实际不等同，早期资产阶级由市民分化而来。
    - 能指出并纠正这一错误：认为所有住在城市里的人都是市民阶层，实际仅指手工业者和商人，不包含贵族、教会人士。
  aliases: []
  category: 历史概念
  explanation: 随着城市发展和工商业繁荣，城市手工业者和商人逐渐形成的社会阶层，后来分化出早期资产阶级。
  misconceptions:
    - 误以为市民阶层就是早期的资产阶级，实际不等同，早期资产阶级由市民分化而来。
    - 认为所有住在城市里的人都是市民阶层，实际仅指手工业者和商人，不包含贵族、教会人士。
    - 误认为市民阶层出现在农村，实际随城市发展和工商业繁荣而形成。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:市舶司
  type: Concept
  subject: 历史
  title: 市舶司
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为市舶司是管理国内商业的机构，实际管理海外贸易
    - 能指出并纠正这一错误：把市舶司的设立时间说成唐朝，实际宋元才普遍设立
  aliases: []
  category: 制度史
  explanation: 宋元管理海外贸易的机构，政府奖励招引商船有功人员，重视海外贸易。
  misconceptions:
    - 误以为市舶司是管理国内商业的机构，实际管理海外贸易
    - 把市舶司的设立时间说成唐朝，实际宋元才普遍设立
    - 认为市舶司仅负责征税，忽略其奖励招引商船的功能
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:师夷之长技以制夷
  type: Concept
  subject: 历史
  title: 师夷之长技以制夷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“师夷之长技以制夷”是林则徐提出的，实际是魏源
    - 能指出并纠正这一错误：把“师夷长技”错误理解成学习西方政治制度，实际指先进的军事技术
  aliases: []
  category: 思想主张
  explanation: 魏源在《海国图志》中提出的思想，主张学习西方先进技术以抵御西方侵略。
  misconceptions:
    - 误以为“师夷之长技以制夷”是林则徐提出的，实际是魏源
    - 把“师夷长技”错误理解成学习西方政治制度，实际指先进的军事技术
    - 将《海国图志》与《四洲志》混淆，不知前者由魏源编成
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:希望工程
  type: Concept
  subject: 历史
  title: 希望工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为希望工程由红十字会发起，实际是中国青少年发展基金会。
    - 能指出并纠正这一错误：记错希望工程发起时间，误认为在改革开放之前。
  aliases: []
  category: 公益事业
  explanation: 1989年中国青少年发展基金会发起，帮助贫困地区失学儿童重返校园的公益事业。
  misconceptions:
    - 误以为希望工程由红十字会发起，实际是中国青少年发展基金会。
    - 记错希望工程发起时间，误认为在改革开放之前。
    - 将希望工程与“春蕾计划”完全等同，忽略资助对象的差别。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:希腊建筑艺术
  type: Concept
  subject: 历史
  title: 希腊建筑艺术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为帕特农神庙是罗马建筑的代表
    - 能指出并纠正这一错误：误认为希腊建筑的典型特征是拱券和穹顶
  aliases: []
  category: 建筑艺术
  explanation: 希腊建筑艺术主要体现在神庙，以廊柱环绕为特点，雅典帕特农神庙是典型代表。
  misconceptions:
    - 误认为帕特农神庙是罗马建筑的代表
    - 误认为希腊建筑的典型特征是拱券和穹顶
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:希腊罗马古典文化
  type: Concept
  subject: 历史
  title: 希腊罗马古典文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《荷马史诗》是古罗马文学作品
    - 能指出并纠正这一错误：误认为《掷铁饼者》是罗马雕塑
  aliases: []
  category: 文化成就
  explanation: 古希腊罗马在文学、雕塑、哲学、法学等方面的成就，如《荷马史诗》《掷铁饼者》等。
  misconceptions:
    - 误认为《荷马史诗》是古罗马文学作品
    - 误认为《掷铁饼者》是罗马雕塑
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:幕府统治
  type: Concept
  subject: 历史
  title: 幕府统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为幕府统治时期天皇仍有实权，实际是幕府将军把持大权
    - 能指出并纠正这一错误：误以为镰仓幕府是足利尊氏建立，实际是源赖朝
  aliases:
    - 幕府制度
    - 镰仓幕府
  category: 政治制度
  explanation: 12世纪晚期，源赖朝建立镰仓幕府，日本进入近700年的幕府统治时期，幕府将军实际把持国家大权，天皇成为礼仪性摆设。
  misconceptions:
    - 误认为幕府统治时期天皇仍有实权，实际是幕府将军把持大权
    - 误以为镰仓幕府是足利尊氏建立，实际是源赖朝
    - 误以为幕府统治只有近百年，实际约700年
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:干支纪年法
  type: Concept
  subject: 历史
  title: 干支纪年法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为天干地支可以任意组合，如把"甲丑"当作合法干支。
    - 能指出并纠正这一错误：认为干支纪年每12年循环一次，把十天干和十二地支的配合周期当成十二生肖周期。
  aliases:
    - 干支纪年
  category: 历史纪年法
  explanation: 将十天干和十二地支依次组合成六十个干支，用以纪年，每六十年循环一次。
  misconceptions:
    - 误以为天干地支可以任意组合，如把"甲丑"当作合法干支。
    - 认为干支纪年每12年循环一次，把十天干和十二地支的配合周期当成十二生肖周期。
    - 误以为所有甲子年之间相隔120年，实际应为60年。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S7.md
- id: concept:历史:干支纪日
  type: Concept
  subject: 历史
  title: 干支纪日
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为天干地支可以搭配出120个不同的组合，而不是60个
    - 能指出并纠正这一错误：认为干支纪日法是秦始皇统一文字后才出现，与商朝无关
  aliases: []
  category: 历法
  explanation: 用天干地支组合来记录日期的方法，甲骨文中已出现。
  misconceptions:
    - 误以为天干地支可以搭配出120个不同的组合，而不是60个
    - 认为干支纪日法是秦始皇统一文字后才出现，与商朝无关
    - 把甲骨文中的干支内容说成是用于纪年而不是纪日
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:干栏式建筑
  type: Concept
  subject: 历史
  title: 干栏式建筑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为干栏式建筑是半坡人居住的房屋，实际半坡人住半地穴式房屋。
    - 能指出并纠正这一错误：认为干栏式建筑用于适应北方干燥寒冷环境，实际是为了适应南方潮湿多雨环境。
  aliases: []
  category: 建筑形式
  explanation: 河姆渡人居住的房屋，以木桩插于地下，上面用木板等构筑成屋，适应南方潮湿环境。
  misconceptions:
    - 认为干栏式建筑是半坡人居住的房屋，实际半坡人住半地穴式房屋。
    - 认为干栏式建筑用于适应北方干燥寒冷环境，实际是为了适应南方潮湿多雨环境。
    - 把干栏式建筑等同于树上搭巢，实际是木桩支撑类似高脚屋。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:平型关大捷
  type: Concept
  subject: 历史
  title: 平型关大捷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说平型关大捷是国民党军队获得的，实为八路军首次大捷。
    - 能指出并纠正这一错误：把平型关大捷误写成发生在正面战场，实际是敌后伏击战。
  aliases: []
  category: 历史事件
  explanation: 1937年9月，八路军在平型关伏击日军，取得抗战以来中国军队的第一次大捷。
  misconceptions:
    - 说平型关大捷是国民党军队获得的，实为八路军首次大捷。
    - 把平型关大捷误写成发生在正面战场，实际是敌后伏击战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:平壤战役
  type: Concept
  subject: 历史
  title: 平壤战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把平壤战役当海战，实际是甲午战争中的陆战
    - 能指出并纠正这一错误：将左宝贵牺牲说成邓世昌，或把叶志超当英雄
  aliases: []
  category: 战役
  explanation: 甲午中日战争中的陆战，清军将领左宝贵牺牲，统帅叶志超逃跑，平壤陷落。
  misconceptions:
    - 误把平壤战役当海战，实际是甲午战争中的陆战
    - 将左宝贵牺牲说成邓世昌，或把叶志超当英雄
    - 认为清军统帅左宝贵临阵脱逃，实际逃跑的是叶志超
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:平定准噶尔部叛乱
  type: Concept
  subject: 历史
  title: 平定准噶尔部叛乱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为准噶尔部在西藏地区，实际位于西北新疆一带。
    - 能指出并纠正这一错误：认为平定准噶尔叛乱是乾隆一次性完成，忽略康熙年间已有亲征和战争。
  aliases: []
  category: 历史事件
  explanation: 康熙、乾隆时期，清朝多次平定准噶尔部叛乱，维护了西北边疆的稳定。
  misconceptions:
    - 误以为准噶尔部在西藏地区，实际位于西北新疆一带。
    - 认为平定准噶尔叛乱是乾隆一次性完成，忽略康熙年间已有亲征和战争。
    - 把平定准噶尔与平定大小和卓叛乱混为同一事件，实际后者针对回部。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:平定大小和卓叛乱
  type: Concept
  subject: 历史
  title: 平定大小和卓叛乱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将大小和卓当成蒙古准噶尔部首领，实际他们是回部（维吾尔族）首领。
    - 能指出并纠正这一错误：误以为平定大小和卓叛乱发生在康熙时期，实际是乾隆时期。
  aliases: []
  category: 历史事件
  explanation: 乾隆时期，清军平定回部大小和卓叛乱，维护了新疆地区的统一。
  misconceptions:
    - 将大小和卓当成蒙古准噶尔部首领，实际他们是回部（维吾尔族）首领。
    - 误以为平定大小和卓叛乱发生在康熙时期，实际是乾隆时期。
    - 认为平叛后即设置伊犁将军，忽略了平定在先、设置伊犁将军在1762年的先后顺序。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:平津战役
  type: Concept
  subject: 历史
  title: 平津战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为平津战役以武力攻克北平，实际是和平解放
    - 能指出并纠正这一错误：把平津战役的时间记成1948年9月至11月，混淆为辽沈战役的时间
  aliases: []
  category: 历史事件
  explanation: 1948年11月至1949年1月，解放华北全境的战役，北平和平解放。
  misconceptions:
    - 误认为平津战役以武力攻克北平，实际是和平解放
    - 把平津战役的时间记成1948年9月至11月，混淆为辽沈战役的时间
    - 认为平津战役只解放了北平，忽略还解放了天津等华北全境
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:年号纪年法
  type: Concept
  subject: 历史
  title: 年号纪年法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为年号纪年始于秦朝，实际始于汉武帝时期。
    - 能指出并纠正这一错误：误以为一个皇帝一生只用一个年号，忽略明清以前皇帝常改元。
  aliases:
    - 年号纪年
  category: 历史纪年法
  explanation: 用皇帝在位之年的名号来纪年，始于汉武帝时期，明清时一个皇帝一般只用一个年号。
  misconceptions:
    - 认为年号纪年始于秦朝，实际始于汉武帝时期。
    - 误以为一个皇帝一生只用一个年号，忽略明清以前皇帝常改元。
    - 把年号当作皇帝的名字，如称"康熙帝"的"康熙"是名字。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S7.md
- id: concept:历史:广州十三行
  type: Concept
  subject: 历史
  title: 广州十三行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为十三行是政府机构，实为特许垄断贸易的商行组织。
    - 能指出并纠正这一错误：认为十三行专门管理外国商人居住，忽略其核心职能是经营进出口贸易。
  aliases:
    - 十三行
  category: 历史
  explanation: 清朝特许经营对外贸易的商行，负责承销外商货物、代购出口商品、管理外国商人。
  misconceptions:
    - 误以为十三行是政府机构，实为特许垄断贸易的商行组织。
    - 认为十三行专门管理外国商人居住，忽略其核心职能是经营进出口贸易。
    - 把十三行与明朝市舶司等同，忘记它是清代独有的商业组织。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:广州起义
  type: Concept
  subject: 历史
  title: 广州起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为广州起义由同盟会发动，实际是兴中会
    - 能指出并纠正这一错误：将广州起义时间记成一九一一年，与黄花岗起义混淆
  aliases: []
  category: 历史事件
  explanation: 1895年孙中山策划的武装起义，因消息泄露而失败，陆皓东等人牺牲。
  misconceptions:
    - 误以为广州起义由同盟会发动，实际是兴中会
    - 将广州起义时间记成一九一一年，与黄花岗起义混淆
    - 把广州起义失败原因说成是准备不足，实际是消息泄露
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S3.md
- id: concept:历史:庄园制度衰落
  type: Concept
  subject: 历史
  title: 庄园制度衰落
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为庄园制度衰落是由于农民起义，实际是劳役量固定和购买豁免权等导致
    - 能指出并纠正这一错误：误以为农民获得全部土地所有权，实际只获得对自己剩余产品的支配权
  aliases: []
  category: 历史概念
  explanation: 随着劳役量固定、农奴购买劳役豁免权和迁徙税，庄园制度逐渐瓦解，农民获得对自己剩余产品的支配权。
  misconceptions:
    - 认为庄园制度衰落是由于农民起义，实际是劳役量固定和购买豁免权等导致
    - 误以为农民获得全部土地所有权，实际只获得对自己剩余产品的支配权
    - 认为农奴购买劳役豁免权后不再缴任何税，实际还需缴纳迁徙税等
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:庄园法庭
  type: Concept
  subject: 历史
  title: 庄园法庭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为庄园法庭由国王直接管理，法官由国家任命
    - 能指出并纠正这一错误：认为审判依据是罗马成文法，而非习惯法或村法
  aliases: []
  category: 司法
  explanation: 庄园具有司法权，法庭维护庄园秩序，惩罚违法行为，依据习惯法或村法。
  misconceptions:
    - 误以为庄园法庭由国王直接管理，法官由国家任命
    - 认为审判依据是罗马成文法，而非习惯法或村法
    - 把庄园法庭与现代法庭等同，以为有专职公诉人
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:庄园经济
  type: Concept
  subject: 历史
  title: 庄园经济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为自营地由佃户耕种且收成归佃户所有
    - 能指出并纠正这一错误：认为庄园经济以货币地租为主，实际多为劳役地租
  aliases:
    - 封建庄园
  category: 经济
  explanation: 西欧中世纪乡村的典型组织形式，自给自足，领主与佃户关系，包括自营地和份地。
  misconceptions:
    - 误以为自营地由佃户耕种且收成归佃户所有
    - 认为庄园经济以货币地租为主，实际多为劳役地租
    - 把庄园经济等同于城市商品经济，忽略自给自足特点
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:庄子
  type: Concept
  subject: 历史
  title: 庄子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为庄子是春秋末期人，与老子同时代
    - 能指出并纠正这一错误：把庄子的《逍遥游》说成是老子的作品
  aliases: []
  category: 历史人物
  explanation: 战国时期道家代表人物，强调顺应自然和民心，追求精神自由。
  misconceptions:
    - 认为庄子是春秋末期人，与老子同时代
    - 把庄子的《逍遥游》说成是老子的作品
    - 认为庄子主张‘仁政’或‘以法治国’，忽略其道家身份
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:废除丞相
  type: Concept
  subject: 历史
  title: 废除丞相
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为废除丞相后立即设立内阁，实际明太祖废丞相，内阁是明成祖设立。
    - 能指出并纠正这一错误：认为废除丞相后六部分权，实际上六部直接对皇帝负责，权力高度集中。
  aliases: []
  category: 政治制度
  explanation: 明太祖为强化皇权，废除丞相，六部直接向皇帝负责。
  misconceptions:
    - 误以为废除丞相后立即设立内阁，实际明太祖废丞相，内阁是明成祖设立。
    - 认为废除丞相后六部分权，实际上六部直接对皇帝负责，权力高度集中。
    - 把废除丞相和设立厂卫混为一谈，二者都是强化皇权但时间不同。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:废除农奴制
  type: Concept
  subject: 历史
  title: 废除农奴制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1861年改革由彼得一世实行，实际是亚历山大二世。
    - 能指出并纠正这一错误：误认为改革后农奴无偿获得土地，实际需高价赎买。
  aliases:
    - 1861年改革
  category: 历史事件
  explanation: 1861年亚历山大二世颁布法令废除农奴制，使俄国走上资本主义发展道路，是俄国历史上的重要转折点。
  misconceptions:
    - 误认为1861年改革由彼得一世实行，实际是亚历山大二世。
    - 误认为改革后农奴无偿获得土地，实际需高价赎买。
    - 误认为改革彻底废除了封建残余，实际保留大量封建余烬。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S2.md
- id: concept:历史:廊坊阻击战
  type: Concept
  subject: 历史
  title: 廊坊阻击战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为廊坊阻击战是清军主力迎战，实际以义和团为主
    - 能指出并纠正这一错误：说成迫使八国联军撤回北京，实际是撤回天津
  aliases:
    - 廊坊大捷
  category: 战役
  explanation: 1900年义和团在廊坊一带阻击八国联军，迫使其撤回天津，是义和团抗击侵略的重要战斗。
  misconceptions:
    - 误以为廊坊阻击战是清军主力迎战，实际以义和团为主
    - 说成迫使八国联军撤回北京，实际是撤回天津
    - 认为发生在天津城内，实际在廊坊一带铁路沿线
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S1.md
- id: concept:历史:建设有中国特色的社会主义
  type: Concept
  subject: 历史
  title: 建设有中国特色的社会主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为该命题在中共十三大提出，实际是十二大
    - 能指出并纠正这一错误：以为‘中国特色’指放弃马克思主义，实际是结合中国实际
  aliases:
    - 中国特色社会主义
  category: 理论
  explanation: 邓小平在中共十二大提出的命题，强调把马克思主义普遍真理同中国具体实际结合，走自己的道路。
  misconceptions:
    - 误认为该命题在中共十三大提出，实际是十二大
    - 以为‘中国特色’指放弃马克思主义，实际是结合中国实际
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:开元盛世
  type: Concept
  subject: 历史
  title: 开元盛世
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将开元盛世当作唐太宗开创的
    - 能指出并纠正这一错误：认为开元盛世在武则天时期达到顶峰
  aliases: []
  category: 历史事件
  explanation: 唐玄宗在位前期年号为开元，当时政治稳定、经济繁荣、文化发达、国库充盈，唐朝国力达到前所未有的强大，出现盛世局面。
  misconceptions:
    - 误将开元盛世当作唐太宗开创的
    - 认为开元盛世在武则天时期达到顶峰
    - 把开元盛世的年号说成贞观或天宝
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:开元通宝
  type: Concept
  subject: 历史
  title: 开元通宝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为开元通宝始铸于唐玄宗开元年间，实际始铸于621年。
    - 能指出并纠正这一错误：误把“开元”当成唐玄宗的年号，实则意为开辟新纪元。
  aliases: []
  category: 历史文物
  explanation: 唐朝官方铸币，始铸于621年，日本仿铸和同开珎。
  misconceptions:
    - 误认为开元通宝始铸于唐玄宗开元年间，实际始铸于621年。
    - 误把“开元”当成唐玄宗的年号，实则意为开辟新纪元。
    - 误认为日本和同开珎是自创货币，实际仿照开元通宝。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:开发开放上海浦东
  type: Concept
  subject: 历史
  title: 开发开放上海浦东
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将浦东开放时间说成1984年沿海开放城市之一，实际是1990年决策
    - 能指出并纠正这一错误：只强调发展上海，忽略其带动长江流域经济发展的作用
  aliases:
    - 浦东开发
    - 上海浦东开发开放
  category: 对外开放
  explanation: 1990年中共中央作出开发开放上海浦东的决策，推动长江流域经济发展。
  misconceptions:
    - 误将浦东开放时间说成1984年沿海开放城市之一，实际是1990年决策
    - 只强调发展上海，忽略其带动长江流域经济发展的作用
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S4.md
- id: concept:历史:开发式扶贫
  type: Concept
  subject: 历史
  title: 开发式扶贫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把开发式扶贫等同于直接发钱发物，忽视发展产业和技能帮扶
    - 能指出并纠正这一错误：认为开发式扶贫就是“输血式”扶贫，没有看到向“造血式”转变
  aliases: []
  category: 政策
  explanation: 坚持把发展作为解决贫困的根本途径，实现由“输血式”扶贫向“造血式”帮扶转变。
  misconceptions:
    - 误把开发式扶贫等同于直接发钱发物，忽视发展产业和技能帮扶
    - 认为开发式扶贫就是“输血式”扶贫，没有看到向“造血式”转变
    - 片面强调资金投入，认为只要给钱就能解决贫困，忽略根本发展
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S2.md
- id: concept:历史:开国大典
  type: Concept
  subject: 历史
  title: 开国大典
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为毛泽东宣告“中华人民共和国成立了”，实际宣告“中华人民共和国中央人民政府今天成立了”。
    - 能指出并纠正这一错误：误认为开国大典标志着社会主义制度建立，实际标志新中国诞生，制度确立在1956年。
  aliases:
    - 中华人民共和国成立
  category: 历史事件
  explanation: 1949年10月1日在北京天安门广场举行，毛泽东宣告中华人民共和国中央人民政府成立，标志着新中国诞生。
  misconceptions:
    - 误认为毛泽东宣告“中华人民共和国成立了”，实际宣告“中华人民共和国中央人民政府今天成立了”。
    - 误认为开国大典标志着社会主义制度建立，实际标志新中国诞生，制度确立在1956年。
    - 误认为开国大典在晚上举行，实际为下午3点。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:开罗会议
  type: Concept
  subject: 历史
  title: 开罗会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为开罗会议有斯大林参加，实际是美、英、中三巨头会晤。
    - 能指出并纠正这一错误：误以为开罗会议宣布成立联合国，实际该决定在雅尔塔会议。
  aliases: []
  category: 历史事件
  explanation: 1943年中、美、英三国领导人在北非开罗举行会议，商讨对日作战及战后对日本惩处等问题，会后发表《开罗宣言》。
  misconceptions:
    - 误以为开罗会议有斯大林参加，实际是美、英、中三巨头会晤。
    - 误以为开罗会议宣布成立联合国，实际该决定在雅尔塔会议。
    - 误以为开罗会议与德黑兰会议时间先后颠倒，实际开罗会议先于德黑兰会议。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:张仲景与《伤寒杂病论》
  type: Concept
  subject: 历史
  title: 张仲景与《伤寒杂病论》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“医圣”是华佗，实际是张仲景。
    - 能指出并纠正这一错误：认为《伤寒杂病论》只治伤寒，忽略杂病内容。
  aliases:
    - 医圣
  category: 医学成就
  explanation: 东汉末年张仲景写成《伤寒杂病论》，发展了中医学理论和治疗方法，提出辨证分析病情、对症治疗和“治未病”思想，被后世称为“医圣”。
  misconceptions:
    - 误以为“医圣”是华佗，实际是张仲景。
    - 认为《伤寒杂病论》只治伤寒，忽略杂病内容。
    - 将张仲景记为西汉人，实际东汉末年。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:张居正改革
  type: Concept
  subject: 历史
  title: 张居正改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为张居正是北宋改革家，与王安石同时代，实际是明朝万历年间。
    - 能指出并纠正这一错误：认为张居正改革发生在明朝前期，实际发生在明朝中后期。
  aliases:
    - 张居正变法
  category: 历史事件
  explanation: 万历初年，张居正推行一条鞭法，整顿吏治，巩固边防，取得积极成效。
  misconceptions:
    - 认为张居正是北宋改革家，与王安石同时代，实际是明朝万历年间。
    - 认为张居正改革发生在明朝前期，实际发生在明朝中后期。
    - 认为张居正改革彻底解决了明朝财政危机，实际只是暂时有效，死后被清算。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:张楚政权
  type: Concept
  subject: 历史
  title: 张楚政权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为张楚政权是刘邦建立的，实际是陈胜在陈县建立的农民政权。
    - 能指出并纠正这一错误：认为张楚政权定都咸阳，实际都城在陈县（今河南淮阳）。
  aliases:
    - 张楚
  category: 历史政权
  explanation: 陈胜在攻占陈县后建立的农民政权，号召天下共起反秦。
  misconceptions:
    - 误以为张楚政权是刘邦建立的，实际是陈胜在陈县建立的农民政权。
    - 认为张楚政权定都咸阳，实际都城在陈县（今河南淮阳）。
    - 把张楚政权算作西汉初年的割据政权，混淆朝代归属。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S2.md
- id: concept:历史:张自忠
  type: Concept
  subject: 历史
  title: 张自忠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把张自忠说成八路军将领，还误以为他指挥了百团大战。
    - 能指出并纠正这一错误：认为张自忠牺牲于台儿庄战役，而非枣宜会战。
  aliases: []
  category: 历史人物
  explanation: 国民党第三十三集团军总司令，在枣宜会战中壮烈殉国，是抗战中牺牲的著名将领。
  misconceptions:
    - 把张自忠说成八路军将领，还误以为他指挥了百团大战。
    - 认为张自忠牺牲于台儿庄战役，而非枣宜会战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:张骞通西域
  type: Concept
  subject: 历史
  title: 张骞通西域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把两次出使时间记反，第一次写成公元前119年，第二次写成公元前138年。
    - 能指出并纠正这一错误：认为第一次出使目的是联合大月氏夹击匈奴并成功，实际未达军事目标。
  aliases:
    - 张骞出使西域
  category: 历史事件
  explanation: 汉武帝时期，张骞两次出使西域，第一次在公元前138年，目的是联络大月氏夹击匈奴，虽未达成军事同盟，但了解了西域情况；第二次在公元前119年，促进了汉朝与西域的相互了解与往来。
  misconceptions:
    - 把两次出使时间记反，第一次写成公元前119年，第二次写成公元前138年。
    - 认为第一次出使目的是联合大月氏夹击匈奴并成功，实际未达军事目标。
    - 误以为张骞第二次出使到达大秦（罗马），实际只到西域。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:强军之路
  type: Concept
  subject: 历史
  title: 强军之路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将强军之路与2015年军队改革等同，实则是新时代改革总体路径
    - 能指出并纠正这一错误：误认为强军之路是新中国成立初期提出的方针，实为新时代强军战略
  aliases: []
  category: 军事战略
  explanation: 新时代国防和军队改革，建设世界一流军队。
  misconceptions:
    - 将强军之路与2015年军队改革等同，实则是新时代改革总体路径
    - 误认为强军之路是新中国成立初期提出的方针，实为新时代强军战略
    - 把强军之路与强军目标混为一谈，忽略前者是路径，后者是方向
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:强军目标
  type: Concept
  subject: 历史
  title: 强军目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把强军目标的内容颠倒了，将“能打胜仗”与“作风优良”互换
    - 能指出并纠正这一错误：误以为强军目标是2015年提出，实际是2013年
  aliases: []
  category: 理论
  explanation: 2013年习近平提出听党指挥、能打胜仗、作风优良的强军目标。
  misconceptions:
    - 把强军目标的内容颠倒了，将“能打胜仗”与“作风优良”互换
    - 误以为强军目标是2015年提出，实际是2013年
    - 误认为强军目标在党的十九大上首次提出，实为2013年提出
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S3.md
- id: concept:历史:彩陶
  type: Concept
  subject: 历史
  title: 彩陶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为彩陶是陶器烧成后再用颜料画花纹，实际是先画后烧制，这样颜料才不褪色。
    - 能指出并纠正这一错误：将彩陶与龙山文化的黑陶混淆，彩陶是仰韶文化特征，黑陶才是龙山文化代表。
  aliases:
    - 彩陶器
  category: 工艺技术
  explanation: 彩陶是指在陶器表面用矿物颜料绘制图案后烧制而成的陶器，是仰韶文化的重要特征。
  misconceptions:
    - 认为彩陶是陶器烧成后再用颜料画花纹，实际是先画后烧制，这样颜料才不褪色。
    - 将彩陶与龙山文化的黑陶混淆，彩陶是仰韶文化特征，黑陶才是龙山文化代表。
    - 认为彩陶只有半坡遗址才有，实际上仰韶文化多个遗址都出土彩陶。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S2.md
- id: concept:历史:彭德怀
  type: Concept
  subject: 历史
  title: 彭德怀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为平型关大捷是彭德怀指挥的，实际是林彪。
    - 能指出并纠正这一错误：把彭德怀说成八路军总司令，而不是副总指挥。
  aliases: []
  category: 历史人物
  explanation: 八路军副总指挥，指挥百团大战，是敌后战场的著名将领。
  misconceptions:
    - 误以为平型关大捷是彭德怀指挥的，实际是林彪。
    - 把彭德怀说成八路军总司令，而不是副总指挥。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:彼得一世改革
  type: Concept
  subject: 历史
  title: 彼得一世改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为彼得一世改革使俄国走上资本主义道路，实际只是近代化开端。
    - 能指出并纠正这一错误：误认为彼得一世废除了农奴制，实际强化了农奴制。
  aliases:
    - 彼得大帝改革
  category: 历史事件
  explanation: 18世纪初彼得一世为改变俄国落后面貌而推行的改革，涉及军事、经济、文化等方面，开启了俄国近代化进程。
  misconceptions:
    - 误认为彼得一世改革使俄国走上资本主义道路，实际只是近代化开端。
    - 误认为彼得一世废除了农奴制，实际强化了农奴制。
    - 误把彼得一世改革时间记成19世纪，实际是18世纪初。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:徐州会战
  type: Concept
  subject: 历史
  title: 徐州会战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为徐州会战是抗战开始后的第一场大型会战，忽略淞沪会战更早。
    - 能指出并纠正这一错误：误认为台儿庄大捷发生在武汉会战期间。
  aliases: []
  category: 历史事件
  explanation: 1938年1月至5月，中国军队在以徐州为中心的广大地区抗击日军进攻的战役，包括台儿庄大捷。
  misconceptions:
    - 认为徐州会战是抗战开始后的第一场大型会战，忽略淞沪会战更早。
    - 误认为台儿庄大捷发生在武汉会战期间。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:徐锡麟
  type: Concept
  subject: 历史
  title: 徐锡麟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为徐锡麟是同盟会会员，实际他是光复会成员。
    - 能指出并纠正这一错误：误把徐锡麟刺杀的对象说成安徽巡抚恩铭，写成两江总督或安徽提督。
  aliases: []
  category: 历史人物
  explanation: 光复会会员，1907年在安庆起义中刺杀安徽巡抚，失败后死难。
  misconceptions:
    - 误认为徐锡麟是同盟会会员，实际他是光复会成员。
    - 误把徐锡麟刺杀的对象说成安徽巡抚恩铭，写成两江总督或安徽提督。
    - 认为徐锡麟起义时秋瑾也在安庆策应，实际秋瑾在浙江绍兴策应。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:德国分裂
  type: Concept
  subject: 历史
  title: 德国分裂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为德国在1945年战败后就分裂了，实际1949年才正式分裂为东西德
    - 能指出并纠正这一错误：认为德国分裂是苏联单方面造成的，实际是美苏冷战对峙的产物
  aliases: []
  category: 历史事件
  explanation: 1949年德国分裂为联邦德国（西德）和民主德国（东德），是冷战的产物。
  misconceptions:
    - 误认为德国在1945年战败后就分裂了，实际1949年才正式分裂为东西德
    - 认为德国分裂是苏联单方面造成的，实际是美苏冷战对峙的产物
    - 把联邦德国和民主德国弄反，联邦德国是西德，民主德国是东德
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:德川幕府
  type: Concept
  subject: 历史
  title: 德川幕府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为德川幕府是日本第一个幕府，实际是最后一个。
    - 能指出并纠正这一错误：误认为德川幕府支持倒幕运动，实际是被推翻对象。
  aliases: []
  category: 历史政权
  explanation: 日本最后一个幕府政权，推行锁国政策，19世纪中期面临民族危机和社会危机，最终被倒幕运动推翻。
  misconceptions:
    - 误认为德川幕府是日本第一个幕府，实际是最后一个。
    - 误认为德川幕府支持倒幕运动，实际是被推翻对象。
    - 误认为德川幕府实行对外开放，实际推行锁国政策。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S1.md
- id: concept:历史:德谟克利特的原子论
  type: Concept
  subject: 历史
  title: 德谟克利特的原子论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为原子论是亚里士多德提出的
    - 能指出并纠正这一错误：误认为德谟克利特的原子和现代科学发现的原子完全一样
  aliases: []
  category: 哲学思想
  explanation: 德谟克利特提出原子论，认为宇宙万物由微小的原子组成。
  misconceptions:
    - 误认为原子论是亚里士多德提出的
    - 误认为德谟克利特的原子和现代科学发现的原子完全一样
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:忻口会战
  type: Concept
  subject: 历史
  title: 忻口会战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为忻口会战是敌后战场八路军发起的战役，而实际是正面战场。
    - 能指出并纠正这一错误：误以为忻口会战发生在平型关大捷之前，实际是之后。
