  title: 统一多民族国家的巩固和发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为隋唐巩固统一多民族国家仅靠武力征服，忽略和亲、册封等政策
    - 能指出并纠正这一错误：将‘统一多民族国家’误解为只包含汉族，忽视少数民族的文化贡献
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 认为隋唐巩固统一多民族国家仅靠武力征服，忽略和亲、册封等政策
    - 将‘统一多民族国家’误解为只包含汉族，忽视少数民族的文化贡献
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:统一度量衡
  type: Concept
  subject: 历史
  title: 统一度量衡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为度量衡只指长度，实际包括容量和重量
    - 能指出并纠正这一错误：认为统一度量衡只在经济上有效，忽略便于赋税征收
  aliases: []
  category: 经济措施
  explanation: 秦始皇规定以秦制为基础统一度量衡，促进经济发展。
  misconceptions:
    - 误以为度量衡只指长度，实际包括容量和重量
    - 认为统一度量衡只在经济上有效，忽略便于赋税征收
    - 把统一度量衡与统一货币当成一回事，实际二者不同
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:统一文字
  type: Concept
  subject: 历史
  title: 统一文字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为秦朝统一文字采用隶书，实际标准是小篆
    - 能指出并纠正这一错误：认为统一文字只是因为文化差异，忽略有利政令推行
  aliases:
    - 书同文
  category: 文化措施
  explanation: 秦始皇命李斯等制定小篆作为标准文字颁行全国，有利于政令推行和文化交流。
  misconceptions:
    - 误以为秦朝统一文字采用隶书，实际标准是小篆
    - 认为统一文字只是因为文化差异，忽略有利政令推行
    - 将小篆与隶书都当成秦统一文字的标准，实际主用小篆
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:统一货币
  type: Concept
  subject: 历史
  title: 统一货币
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为秦统一货币使用五铢钱，实际是圆形方孔半两钱
    - 能指出并纠正这一错误：认为统一货币前各国货币都是圆形方孔，实际形状各异
  aliases:
    - 半两钱
  category: 经济措施
  explanation: 秦始皇废除六国货币，以圆形方孔半两钱为统一货币，促进经济交流。
  misconceptions:
    - 误以为秦统一货币使用五铢钱，实际是圆形方孔半两钱
    - 认为统一货币前各国货币都是圆形方孔，实际形状各异
    - 将秦半两钱与汉五铢钱混为一谈，时间朝代不同
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:统一车轨
  type: Concept
  subject: 历史
  title: 统一车轨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为车轨是铁轨或轨道，实际指车轮之间的宽度
    - 能指出并纠正这一错误：认为统一车轨只需改车轮，忘记规定道路宽度统一
  aliases:
    - 车同轨
  category: 交通措施
  explanation: 秦始皇统一车轨和道路宽度，修筑以咸阳为中心的交通网，并开凿灵渠。
  misconceptions:
    - 误以为车轨是铁轨或轨道，实际指车轮之间的宽度
    - 认为统一车轨只需改车轮，忘记规定道路宽度统一
    - 把统一车轨和开凿灵渠看作无关联，实际均为交通措施
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:统计图表解读
  type: Concept
  subject: 历史
  title: 统计图表解读
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：只看图表数据上升就断言“经济持续增长”，忽略标题和背景，可能把其他指标误读为经济。
    - 能指出并纠正这一错误：把图表中的相关性直接说成因果性，如“GDP增长导致脱贫”，忽略其他因素。
  aliases: []
  category: 学史方法
  explanation: 通过分析统计图表的标题、数据、趋势，结合历史知识解释数据变化的原因和影响。
  misconceptions:
    - 只看图表数据上升就断言“经济持续增长”，忽略标题和背景，可能把其他指标误读为经济。
    - 把图表中的相关性直接说成因果性，如“GDP增长导致脱贫”，忽略其他因素。
    - 绘制图表或解读时不关注数据下的时间节点，导致历史时期错位。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:绥靖政策
  type: Concept
  subject: 历史
  title: 绥靖政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为绥靖政策是德国推行的，实际是英法等国对法西斯妥协
    - 能指出并纠正这一错误：把绥靖政策等同于不干涉政策，忽略其牺牲他国利益换取自身安全的特点
  aliases: []
  category: 外交政策
  explanation: 20世纪30年代英法等国对法西斯国家妥协退让，牺牲他国利益以换取自身安全的政策。
  misconceptions:
    - 以为绥靖政策是德国推行的，实际是英法等国对法西斯妥协
    - 把绥靖政策等同于不干涉政策，忽略其牺牲他国利益换取自身安全的特点
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:维新运动
  type: Concept
  subject: 历史
  title: 维新运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为维新运动仅指百日维新，实际还包括组织学会、创办报刊等前期活动。
    - 能指出并纠正这一错误：把维新运动说成彻底反帝反封建的革命运动，实际是资产阶级改良运动。
  aliases:
    - 戊戌变法
