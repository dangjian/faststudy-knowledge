    - 误认为海南在1988年前已作为经济特区，实际是建省同时设立
    - 将深圳称为最大经济特区，忽略海南面积最大
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:海峡两岸经济合作框架协议
  type: Concept
  subject: 历史
  title: 海峡两岸经济合作框架协议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为该协议是2010年台湾当局与大陆签署的政治统一协议。
    - 能指出并纠正这一错误：将海峡两岸经济合作框架协议与1992年‘九二共识’混为一谈。
  aliases:
    - ECFA
  category: 史实
  explanation: 2010年签署实施，两岸经济合作不断深化。
  misconceptions:
    - 认为该协议是2010年台湾当局与大陆签署的政治统一协议。
    - 将海峡两岸经济合作框架协议与1992年‘九二共识’混为一谈。
    - 误以为协议签署后两岸立即实现政治统一，忽视经济合作实质。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S2.md
- id: concept:历史:海运航线
  type: Concept
  subject: 历史
  title: 海运航线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认元朝海运航线由郑和开辟
    - 能指出并纠正这一错误：认为海运航线主要运输丝绸而非粮食
  aliases: []
  category: 历史事件
  explanation: 元朝开辟了规模空前的海运航线，粮食运输一度以海运为主。
  misconceptions:
    - 误认元朝海运航线由郑和开辟
    - 认为海运航线主要运输丝绸而非粮食
    - 把海运航线开通归功于隋朝
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:海防与塞防之争
  type: Concept
  subject: 历史
  title: 海防与塞防之争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为李鸿章主张海防和塞防并重，实际他重海防轻塞防。
    - 能指出并纠正这一错误：错误认为左宗棠只重塞防，实际他主张二者并重。
  aliases: []
  category: 历史概念
  explanation: 面对西北和东南危机，清政府内部出现海防与塞防之争，李鸿章主张海防重，左宗棠主张二者并重，最终清政府采纳左宗棠意见。
  misconceptions:
    - 误认为李鸿章主张海防和塞防并重，实际他重海防轻塞防。
    - 错误认为左宗棠只重塞防，实际他主张二者并重。
    - 误认为争论发生在中法战争后，实际在19世纪70年代西北、东南危机时。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:涿鹿之战
  type: Concept
  subject: 历史
  title: 涿鹿之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把涿鹿之战误记为黄帝与炎帝的战役，实际是炎黄联合对蚩尤
    - 能指出并纠正这一错误：认为涿鹿之战发生在阪泉之战之前，实际是阪泉之战后
  aliases: []
  category: 历史事件
  explanation: 炎黄部落联盟与蚩尤部落的战役，蚩尤战败，其部落部分归附。
  misconceptions:
    - 把涿鹿之战误记为黄帝与炎帝的战役，实际是炎黄联合对蚩尤
    - 认为涿鹿之战发生在阪泉之战之前，实际是阪泉之战后
    - 误以为蚩尤部落全被消灭，实际部分归附炎黄联盟
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:淝水之战
  type: Concept
  subject: 历史
  title: 淝水之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为淝水之战是前秦与西晋交战，实际是前秦攻打东晋。
    - 能指出并纠正这一错误：误以为苻坚在淝水之战中获胜，实际前秦大败。
  aliases: []
  category: 历史事件
  explanation: 383年，前秦君主苻坚发动旨在统一全国的战争，与东晋在淝水交战，前秦大败，前秦瓦解，北方再度分裂。
  misconceptions:
    - 误以为淝水之战是前秦与西晋交战，实际是前秦攻打东晋。
    - 误以为苻坚在淝水之战中获胜，实际前秦大败。
    - 误以为淝水之战后前秦统一北方，实际前秦瓦解，北方重新陷入分裂。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S4.md
- id: concept:历史:淞沪会战
  type: Concept
  subject: 历史
  title: 淞沪会战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为淞沪会战持续到1938年，实际是1937年8月至11月
    - 能指出并纠正这一错误：将淞沪会战结果说成中国军队大胜，忽略了最终上海沦陷
  aliases:
    - 八一三事变
  category: 历史事件
  explanation: 1937年8月至11月，中国军队在上海地区抗击日军进攻的战役，打破了日本三个月灭亡中国的迷梦。
  misconceptions:
    - 误以为淞沪会战持续到1938年，实际是1937年8月至11月
    - 将淞沪会战结果说成中国军队大胜，忽略了最终上海沦陷
    - 误以为淞沪会战打破日本迷梦的战役发生在华北，实际在上海
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:淮海战役
  type: Concept
  subject: 历史
  title: 淮海战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为淮海战役的中心是南京，实际是徐州
    - 能指出并纠正这一错误：把淮海战役与平津战役的时间前后颠倒，实际淮海先结束平津后结束
  aliases: []
  category: 历史事件
  explanation: 1948年11月至1949年1月，以徐州为中心的大规模战役，解放长江中下游以北地区。
  misconceptions:
    - 误以为淮海战役的中心是南京，实际是徐州
    - 把淮海战役与平津战役的时间前后颠倒，实际淮海先结束平津后结束
    - 认为淮海战役解放了长江以南地区，实际是长江中下游以北
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:清军入关
  type: Concept
  subject: 历史
  title: 清军入关
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为吴三桂主动投降满清，实际是借清军为崇祯报仇。
    - 能指出并纠正这一错误：认为清军入关后立即统一全国，实际经历了多年战争。
  aliases: []
  category: 历史事件
  explanation: 1644年，吴三桂引清军入关，联合清军打败李自成，清朝开始统治全国。
  misconceptions:
    - 认为吴三桂主动投降满清，实际是借清军为崇祯报仇。
    - 认为清军入关后立即统一全国，实际经历了多年战争。
    - 认为1644年清军入关前已占领山海关，实际是吴三桂开关。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:清朝君主专制的强化
  type: Concept
  subject: 历史
  title: 清朝君主专制的强化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为军机处是固定正式机构，实际是临时性御前辅政机构，无实权。
    - 能指出并纠正这一错误：认为君主专制强化从雍正设军机处才开始，忽视康熙设南书房等铺垫。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 以为军机处是固定正式机构，实际是临时性御前辅政机构，无实权。
    - 认为君主专制强化从雍正设军机处才开始，忽视康熙设南书房等铺垫。
    - 误认为君主专制强化导致皇权削弱，实际是皇帝集权达到顶峰。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:清朝对全国的统治
  type: Concept
  subject: 历史
  title: 清朝对全国的统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为1644年清朝定都北京时已控制全国，实际当时仅控制北方。
    - 能指出并纠正这一错误：认为清朝统治者是汉族，实际是满族贵族建立的王朝。
  aliases: []
  category: 历史事件
  explanation: 1644年清朝定都北京，逐步消灭反清力量，建立对全国的统治。
  misconceptions:
    - 认为1644年清朝定都北京时已控制全国，实际当时仅控制北方。
    - 认为清朝统治者是汉族，实际是满族贵族建立的王朝。
    - 认为清朝对全国的统治始于皇太极改国号时，实际定都北京后。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S3.md
- id: concept:历史:清朝疆域
  type: Concept
  subject: 历史
  title: 清朝疆域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错记疆域四至，如将“西跨葱岭”误为“西跨巴尔喀什湖”，实际葱岭即帕米尔高原。
    - 能指出并纠正这一错误：遗漏东南至台湾及附属岛屿，或遗漏南海诸岛，导致疆域认知不全。
  aliases: []
  category: 历史地理
  explanation: 清朝全盛时期疆域西跨葱岭，西北至巴勒喀什池，北接西伯利亚，西南达喜马拉雅山脉，东北至外兴安岭和库页岛，东临太平洋，东南到台湾及附属岛屿，南至南海诸岛，奠定了今天中国的疆域基础。
  misconceptions:
    - 错记疆域四至，如将“西跨葱岭”误为“西跨巴尔喀什湖”，实际葱岭即帕米尔高原。
    - 遗漏东南至台湾及附属岛屿，或遗漏南海诸岛，导致疆域认知不全。
    - 误以为清朝全盛疆域比今天的中国小，实际奠定现代疆域基础。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:清朝设置台湾府
  type: Concept
  subject: 历史
  title: 清朝设置台湾府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为清朝设置台湾府隶属广东省，实际隶属福建省。
    - 能指出并纠正这一错误：把郑成功收复台湾与清朝设置台湾府时间颠倒，先有郑成功收复，后有1684年设府。
  aliases: []
  category: 历史事件
  explanation: 1684年，清朝在台湾设置台湾府，隶属福建省，加强了对台湾的管辖。
  misconceptions:
    - 误认为清朝设置台湾府隶属广东省，实际隶属福建省。
    - 把郑成功收复台湾与清朝设置台湾府时间颠倒，先有郑成功收复，后有1684年设府。
    - 以为清朝初设台湾府就是设台湾省，忽略了台湾省到1885年才设立。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:清末新政
  type: Concept
  subject: 历史
  title: 清末新政
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为清末新政是戊戌变法的延续，实际两者性质不同，新政旨在维护清廷统治。
    - 能指出并纠正这一错误：把清末新政时间放在《辛丑条约》之前，实际该条约签订后1901年开始推行。
  aliases:
    - 新政
  category: 历史事件
  explanation: 《辛丑条约》签订后，清政府为应对统治危机推行的改革，涉及官制、军事、商业、教育等方面，客观上有利于民族资本主义发展。
  misconceptions:
    - 认为清末新政是戊戌变法的延续，实际两者性质不同，新政旨在维护清廷统治。
    - 把清末新政时间放在《辛丑条约》之前，实际该条约签订后1901年开始推行。
    - 误认为新政直接导致辛亥革命爆发，实际新政加速了革命，但直接导火索是保路运动等。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S4.md
- id: concept:历史:渡江战役
  type: Concept
  subject: 历史
  title: 渡江战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为渡江战役发生在1948年
    - 能指出并纠正这一错误：把渡江战役与解放北平或上海混淆
  aliases: []
  category: 历史事件
  explanation: 1949年4月，人民解放军渡过长江，解放南京，结束了国民党政权的反动统治。
  misconceptions:
    - 误认为渡江战役发生在1948年
    - 把渡江战役与解放北平或上海混淆
    - 认为渡江战役后国民党在大陆统治彻底结束
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:渤海国
  type: Concept
  subject: 历史
  title: 渤海国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为渤海国是契丹族所建，实际是粟末靺鞨
    - 能指出并纠正这一错误：误认为渤海国首领被唐太宗册封，实际是唐玄宗册封
  aliases: []
  category: 政权
  explanation: 粟末建立的政权，唐玄宗封其首领为渤海郡王，经济文化发展快，称'海东盛国'。
  misconceptions:
    - 误认为渤海国是契丹族所建，实际是粟末靺鞨
    - 误认为渤海国首领被唐太宗册封，实际是唐玄宗册封
    - 误认为渤海国位于西北地区，实际在东北
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:温室效应
  type: Concept
  subject: 历史
  title: 温室效应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将温室效应和臭氧层破坏混为一谈，认为两者互为因果
    - 能指出并纠正这一错误：认为温室效应只是气温升高，不知道还会引发冰川融化、海平面上升
  aliases:
    - 全球变暖
  category: 环境概念
  explanation: 人类使用矿物燃料排放二氧化碳等温室气体，导致全球气候变暖、冰川融化、海平面上升。
  misconceptions:
    - 将温室效应和臭氧层破坏混为一谈，认为两者互为因果
    - 认为温室效应只是气温升高，不知道还会引发冰川融化、海平面上升
    - 认为温室效应完全是自然现象，与人类活动无关
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:港珠澳大桥
  type: Concept
  subject: 历史
  title: 港珠澳大桥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将港珠澳大桥开通时间记成2017年，实为2018年
    - 能指出并纠正这一错误：认为港珠澳大桥是内地和香港两地合作，忽略澳门参与
  aliases: []
  category: 工程
  explanation: “一国两制”下粤港澳三地首次合作共建的超大型跨海交通工程，2018年开通。
  misconceptions:
    - 误将港珠澳大桥开通时间记成2017年，实为2018年
    - 认为港珠澳大桥是内地和香港两地合作，忽略澳门参与
    - 说港珠澳大桥完全由内地建造，港澳没有参与
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S3.md
- id: concept:历史:湖北军政府
  type: Concept
  subject: 历史
  title: 湖北军政府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为湖北军政府推举孙中山为都督，实际是黎元洪。
    - 能指出并纠正这一错误：误认为湖北军政府是中华民国中央政府，实际它是省级革命政权。
  aliases: []
  category: 历史组织
  explanation: 武昌起义后成立的革命政权，推举黎元洪为都督，是辛亥革命中建立的第一个省级革命政府。
  misconceptions:
    - 误认为湖北军政府推举孙中山为都督，实际是黎元洪。
    - 误认为湖北军政府是中华民国中央政府，实际它是省级革命政权。
    - 认为黎元洪是革命党人，实际他是清朝新军协统，被迫出任都督。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:湘军
  type: Concept
  subject: 历史
  title: 湘军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把湘军说成由李鸿章创建，实际是曾国藩创建，李鸿章创建的是淮军。
    - 能指出并纠正这一错误：误以为湘军是清朝正规军，实际是以团练为基础编练的私人武装。
  aliases: []
  category: 军事组织
  explanation: 曾国藩以团练为基础编练的私人武装，是镇压太平天国的主要力量。
  misconceptions:
    - 把湘军说成由李鸿章创建，实际是曾国藩创建，李鸿章创建的是淮军。
    - 误以为湘军是清朝正规军，实际是以团练为基础编练的私人武装。
    - 认为镇压太平天国的主要力量是八旗兵或绿营，实际是湘军（后期也有淮军参与）。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:湘江战役
  type: Concept
  subject: 历史
  title: 湘江战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为湘江战役是长征突破的第一道封锁线，实际是第四道。
    - 能指出并纠正这一错误：说湘江战役红军伤亡约两万人，实际从8万余人减至3万余人。
  aliases: []
  category: 历史事件
  explanation: 长征初期红军突破第四道封锁线的战役，损失惨重，红军从8万多人减至3万多人。
  misconceptions:
    - 认为湘江战役是长征突破的第一道封锁线，实际是第四道。
    - 说湘江战役红军伤亡约两万人，实际从8万余人减至3万余人。
    - 把湘江战役看成红军主动与敌决战，实际是为突破封锁被迫血战。
