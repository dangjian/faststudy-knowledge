  misconceptions:
    - 误以为十九届四中全会主题是‘全面深化改革’，实际是十八届三中全会。
    - 把‘国家治理体系和治理能力现代化’省略为‘国家治理现代化’，丢掉了‘体系’和‘能力’。
    - 误认为十九届四中全会提出了习近平新时代中国特色社会主义思想，实际是十九大。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S2.md
- id: concept:历史:中共十五大
  type: Concept
  subject: 历史
  title: 中共十五大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将中共十五大召开年份记成1992年，与十四大混淆
    - 能指出并纠正这一错误：认为十五大首次提出建立社会主义市场经济体制
  aliases:
    - 中国共产党第十五次全国代表大会
  category: 历史事件
  explanation: 1997年举行，确立邓小平理论为指导思想并写入党章，提出新“三步走”发展战略。
  misconceptions:
    - 将中共十五大召开年份记成1992年，与十四大混淆；实际是1997年。
    - 认为十五大首次提出建立社会主义市场经济体制；实际是十四大提出的。
    - 认为十五大将三个代表重要思想写入党章；实际是十六大。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:中共十八大
  type: Concept
  subject: 历史
  title: 中共十八大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘中国特色社会主义进入新时代’是十八大提出的，实际是十九大。
    - 能指出并纠正这一错误：把‘全面建成小康社会’写成‘全面建设小康社会’，少了一个‘成’字。
