    - 误以为莎士比亚是法国人，实际是英国文艺复兴代表
    - 把《哈姆雷特》说成《神曲》，作者张冠李戴
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:莫斯科保卫战
  type: Concept
  subject: 历史
  title: 莫斯科保卫战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为莫斯科保卫战发生在1945年，实际是1941年底至1942年初
    - 能指出并纠正这一错误：把莫斯科保卫战说成是苏德战争的转折点，正确转折点是斯大林格勒战役
  aliases: []
  category: 历史事件
  explanation: 1941年10月至次年1月，苏联军民在莫斯科附近击败德军，粉碎了德军不可战胜的神话。
  misconceptions:
    - 认为莫斯科保卫战发生在1945年，实际是1941年底至1942年初
    - 把莫斯科保卫战说成是苏德战争的转折点，正确转折点是斯大林格勒战役
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S3.md
- id: concept:历史:莫须有罪名
  type: Concept
  subject: 历史
  title: 莫须有罪名
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“莫须有”理解为“必须有”，实际意为“难道没有”。
    - 能指出并纠正这一错误：误认为杀害岳飞只是秦桧个人行为，宋高宗无责任。
  aliases: []
  category: 历史事件
  explanation: 宋高宗和秦桧以“莫须有”的罪名杀害岳飞，成为历史上的冤案。
  misconceptions:
    - 将“莫须有”理解为“必须有”，实际意为“难道没有”。
    - 误认为杀害岳飞只是秦桧个人行为，宋高宗无责任。
    - 把“莫须有”与“欲加之罪何患无辞”完全等同，忽视其特定背景。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:菜篮子工程
  type: Concept
  subject: 历史
  title: 菜篮子工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为‘菜篮子工程’是解决住房问题的具体政策，实际是保障副食品供给的民生工程。
    - 能指出并纠正这一错误：以为该工程开始于1978年包产到户时期，实际启动于1988年。
  aliases: []
  category: 历史事件
  explanation: 1988年国家实施，保障城乡副食品供给，建立生产基地，是民心工程。
  misconceptions:
    - 误认为‘菜篮子工程’是解决住房问题的具体政策，实际是保障副食品供给的民生工程。
    - 以为该工程开始于1978年包产到户时期，实际启动于1988年。
    - 把‘菜篮子工程’与‘米袋子工程’完全混淆，后者主要针对粮食生产。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S4.md
- id: concept:历史:萍浏醴起义
  type: Concept
  subject: 历史
  title: 萍浏醴起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为萍浏醴起义是同盟会成立前的起义，实际它发动于1906年冬，同盟会成立于1905年。
    - 能指出并纠正这一错误：认为萍浏醴起义取得了胜利，实际它失败了，但使同盟会声望大增。
  aliases: []
  category: 历史事件
  explanation: 1906年冬同盟会在江西萍乡、湖南浏阳、醴陵发动的武装起义，是同盟会成立后领导的第一次武装起义，虽失败但声望大振。
  misconceptions:
    - 误认为萍浏醴起义是同盟会成立前的起义，实际它发动于1906年冬，同盟会成立于1905年。
    - 认为萍浏醴起义取得了胜利，实际它失败了，但使同盟会声望大增。
    - 混淆萍浏醴起义与广州起义，误以为都是同盟会组织的最大起义。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:萨拉托加大捷
  type: Concept
  subject: 历史
  title: 萨拉托加大捷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为萨拉托加大捷是独立战争结束的标志
    - 能指出并纠正这一错误：把萨拉托加大捷安在英国内战或法国大革命中
  aliases: []
  category: 历史事件
  explanation: 1777年大陆军击败英军，成为独立战争的转折点。
  misconceptions:
    - 误以为萨拉托加大捷是独立战争结束的标志
    - 把萨拉托加大捷安在英国内战或法国大革命中
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S4.md
- id: concept:历史:萨拉热窝事件
  type: Concept
  subject: 历史
  title: 萨拉热窝事件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为萨拉热窝事件是塞尔维亚政府官方策划，实际是青年会成员个人行为。
    - 能指出并纠正这一错误：认为该事件发生在一战爆发后，实际是1914年6月，一战7月爆发。
  aliases: []
  category: 历史事件
  explanation: 1914年6月28日奥匈帝国皇储斐迪南大公在萨拉热窝被刺杀，成为第一次世界大战的导火索。
  misconceptions:
    - 以为萨拉热窝事件是塞尔维亚政府官方策划，实际是青年会成员个人行为。
    - 认为该事件发生在一战爆发后，实际是1914年6月，一战7月爆发。
    - 把被刺杀者误记为塞尔维亚国王，实际是奥匈帝国皇储斐迪南大公。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:葡萄牙与西班牙的殖民掠夺
  type: Concept
  subject: 历史
  title: 葡萄牙与西班牙的殖民掠夺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为葡萄牙主要在美洲殖民，实际其殖民重点在亚洲和非洲
    - 能指出并纠正这一错误：认为西班牙最早开辟到达印度的航路，实际葡萄牙达伽马先到达
  aliases: []
  category: 历史事件
  explanation: 葡萄牙和西班牙是最早进行殖民的国家，建立殖民据点，进行劫掠式贸易和奴隶劳动。
  misconceptions:
    - 误以为葡萄牙主要在美洲殖民，实际其殖民重点在亚洲和非洲
    - 认为西班牙最早开辟到达印度的航路，实际葡萄牙达伽马先到达
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:葡萄牙攫取澳门租住权
  type: Concept
  subject: 历史
  title: 葡萄牙攫取澳门租住权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为葡萄牙1553年武力强占澳门，实际是借口晾晒货物
    - 能指出并纠正这一错误：将时间记成1557年或1563年，实际1553年进入
  aliases:
    - 澳门租住权
  category: 历史事件
  explanation: 1553年葡萄牙殖民者借口晾晒货物进入澳门，后通过贿赂官员获得居住权，1573年改交明朝地方政府，明政府设官管理。
  misconceptions:
    - 误认为葡萄牙1553年武力强占澳门，实际是借口晾晒货物
    - 将时间记成1557年或1563年，实际1553年进入
    - 认为明政府割让澳门给葡萄牙，实际只是租住权
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:葡萄牙逐步侵占澳门
  type: Concept
  subject: 历史
  title: 葡萄牙逐步侵占澳门
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为1887年《和好通商条约》后葡萄牙获得澳门主权，实则只有永居管理权
    - 能指出并纠正这一错误：将澳门被葡萄牙占据与香港割让混为一谈，认为丧失的是领土主权
  aliases: []
  category: 历史事件
  explanation: 鸦片战争后葡萄牙逐步侵占澳门，1887年签订《和好通商条约》获得永居管理权，但主权仍属中国。
  misconceptions:
    - 误以为1887年《和好通商条约》后葡萄牙获得澳门主权，实则只有永居管理权
    - 将澳门被葡萄牙占据与香港割让混为一谈，认为丧失的是领土主权
    - 误以为葡萄牙自1553年起便完全占领澳门，忽略鸦片战争后才逐步侵占
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S2.md
- id: concept:历史:董存瑞
  type: Concept
  subject: 历史
  title: 董存瑞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将董存瑞的事迹安到黄继光身上，混淆不同时期英雄
    - 能指出并纠正这一错误：误认为董存瑞是抗美援朝时期牺牲，实际是解放战争时期
  aliases: []
  category: 历史人物
  explanation: 解放战争时期战斗英雄，在隆化战斗中舍身炸碉堡，壮烈牺牲。
  misconceptions:
    - 将董存瑞的事迹安到黄继光身上，混淆不同时期英雄
    - 误认为董存瑞是抗美援朝时期牺牲，实际是解放战争时期
    - 把董存瑞炸碉堡的地点记成锦州，实际是隆化
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:蒙古灭西夏和金
  type: Concept
  subject: 历史
  title: 蒙古灭西夏和金
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将蒙古灭西夏与灭金顺序颠倒，实际先灭西夏后灭金。
    - 能指出并纠正这一错误：认为蒙古灭金后立即灭南宋，实际有对峙期。
  aliases: []
  category: 历史事件
  explanation: 1227年蒙古灭西夏，1234年灭金，与南宋形成对峙。
  misconceptions:
    - 将蒙古灭西夏与灭金顺序颠倒，实际先灭西夏后灭金。
    - 认为蒙古灭金后立即灭南宋，实际有对峙期。
    - 误认为西夏在金朝之后灭亡，实际1227年西夏先亡，1234年金亡。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:蒸汽时代
  type: Concept
  subject: 历史
  title: 蒸汽时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蒸汽时代开始于珍妮机发明时，实际应开始于瓦特蒸汽机广泛使用
    - 能指出并纠正这一错误：把蒸汽时代等同于电气时代，混淆两次工业革命
  aliases: []
  category: 历史阶段
  explanation: 工业革命极大地提高了社会生产力，人类进入蒸汽时代，19世纪中期英国成为第一个工业国家。
  misconceptions:
    - 认为蒸汽时代开始于珍妮机发明时，实际应开始于瓦特蒸汽机广泛使用
    - 把蒸汽时代等同于电气时代，混淆两次工业革命
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:蒸汽机
  type: Concept
  subject: 历史
  title: 蒸汽机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蒸汽机是工业革命中最早发明的机器，实际最早是珍妮机
    - 能指出并纠正这一错误：认为蒸汽机的发明者就是瓦特，实际瓦特是改进者
  aliases: []
  category: 发明
  explanation: 瓦特改进的蒸汽机成为主要动力来源，广泛应用于生产部门，使工业革命向纵深发展，人类进入蒸汽时代。
  misconceptions:
    - 认为蒸汽机是工业革命中最早发明的机器，实际最早是珍妮机
    - 认为蒸汽机的发明者就是瓦特，实际瓦特是改进者
    - 认为蒸汽机最初就用于铁路运输，实际先用于采矿抽水
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:蓝田人
  type: Concept
  subject: 历史
  title: 蓝田人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蓝田人是我国最早的古人类，实际元谋人距今约170万年，比蓝田人更早。
    - 能指出并纠正这一错误：认为蓝田人使用磨制石器，实际蓝田人属于旧石器时代，使用打制石器。
  aliases: []
  category: 古人类
  explanation: 发现于陕西蓝田，距今约160万年，考古学家发掘出一个完整头骨化石，能够制作和使用工具。
  misconceptions:
    - 认为蓝田人是我国最早的古人类，实际元谋人距今约170万年，比蓝田人更早。
    - 认为蓝田人使用磨制石器，实际蓝田人属于旧石器时代，使用打制石器。
    - 把蓝田人发现地点记成云南元谋，实际发现于陕西蓝田。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:藩镇割据
  type: Concept
  subject: 历史
  title: 藩镇割据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为藩镇割据始于安史之乱前，实际是安史之乱后形成
    - 能指出并纠正这一错误：认为藩镇是唐朝中央主动设置的，实际是节度使拥兵自重
  aliases:
    - 藩镇
  category: 历史现象
  explanation: 安史之乱后，地方节度使拥兵自重，形成割据局面，中央权力衰微。
  misconceptions:
    - 认为藩镇割据始于安史之乱前，实际是安史之乱后形成
    - 认为藩镇是唐朝中央主动设置的，实际是节度使拥兵自重
    - 把藩镇割据等同于五代十国，忽略中间过渡阶段
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:虎门销烟
  type: Concept
  subject: 历史
  title: 虎门销烟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为虎门销烟发生在鸦片战争之后，实际是在战争前夕的1839年
    - 能指出并纠正这一错误：以为销烟是把鸦片直接用火烧掉，实际是采用石灰浸泡的化学方法
  aliases: []
  category: 历史事件
  explanation: 1839年6月，林则徐在虎门海滩当众销毁收缴的鸦片，是中国人民禁烟斗争的伟大胜利，显示了反抗外来侵略的坚强意志。
  misconceptions:
    - 误认为虎门销烟发生在鸦片战争之后，实际是在战争前夕的1839年
    - 以为销烟是把鸦片直接用火烧掉，实际是采用石灰浸泡的化学方法
    - 把虎门销烟的时间记在1840年，与鸦片战争爆发时间混淆
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:行省制度
  type: Concept
  subject: 历史
  title: 行省制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为行省制度起源于明朝，实际上元朝已实行，明朝沿用并调整。
    - 能指出并纠正这一错误：认为行省制度是元朝独有的，不了解明清也沿用行省或类似制度。
  aliases:
    - 行省制
  category: 政治制度
  explanation: 元朝在地方设行中书省，简称行省，成为常设地方最高行政机构，是我国省制的开端。
  misconceptions:
    - 误以为行省制度起源于明朝，实际上元朝已实行，明朝沿用并调整。
    - 认为行省制度是元朝独有的，不了解明清也沿用行省或类似制度。
    - 误把行省制度与元朝中央的中书省混为一谈，行省是地方机构。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:袁世凯复辟帝制
  type: Concept
  subject: 历史
  title: 袁世凯复辟帝制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为袁世凯改国号为中华帝国后，中华民国就结束了，实际民国依然存续。
    - 能指出并纠正这一错误：把二次革命说成是针对袁世凯称帝发动的，实际发生在称帝之前，是反对其独裁。
  aliases:
    - 洪宪帝制
  category: 历史事件
  explanation: 袁世凯镇压二次革命后，逐步解散国会、废除《临时约法》，改内阁制为总统制，最终于1915年底称帝，改国号为中华帝国。
  misconceptions:
    - 认为袁世凯改国号为中华帝国后，中华民国就结束了，实际民国依然存续。
    - 把二次革命说成是针对袁世凯称帝发动的，实际发生在称帝之前，是反对其独裁。
    - 将袁世凯复辟帝制与张勋复辟混淆，误以为他是拥护清朝复辟。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:袁世凯窃取辛亥革命果实
  type: Concept
  subject: 历史
  title: 袁世凯窃取辛亥革命果实
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为孙中山主动让位给袁世凯是因为袁世凯拥护共和，而非被迫。
    - 能指出并纠正这一错误：将清帝退位和袁世凯就任临时大总统的时间顺序颠倒，以为先就职后退位。
  aliases:
    - 袁世凯篡权
    - 袁世凯窃取革命果实
  category: 历史事件
  explanation: 袁世凯在清帝退位后，利用各种手段迫使孙中山辞职，最终在北京就任临时大总统，使辛亥革命的成果被其窃取。
  misconceptions:
    - 误认为孙中山主动让位给袁世凯是因为袁世凯拥护共和，而非被迫。
    - 将清帝退位和袁世凯就任临时大总统的时间顺序颠倒，以为先就职后退位。
    - 认为袁世凯窃取果实是合法继承，而非利用手段逼迫篡夺。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:西周灭亡
  type: Concept
  subject: 历史
  title: 西周灭亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西周灭亡是因周幽王烽火戏诸侯直接导致犬戎灭国。
    - 能指出并纠正这一错误：将镐京误写为洛邑，或认为西周亡后定都镐京。
  aliases: []
  category: 历史事件
  explanation: 公元前771年，犬戎攻陷镐京，西周灭亡。
  misconceptions:
    - 误以为西周灭亡是因周幽王烽火戏诸侯直接导致犬戎灭国。
    - 将镐京误写为洛邑，或认为西周亡后定都镐京。
    - 误以为公元前771年是东周建立时间，与西周灭亡混淆。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:西周的建立
  type: Concept
  subject: 历史
  title: 西周的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西周定都洛邑，与东周混淆。
    - 能指出并纠正这一错误：认为周武王在牧野之战前就建立了西周。
  aliases: []
  category: 历史事件
  explanation: 周武王灭商后建立周朝，定都镐京，史称西周。
  misconceptions:
    - 误以为西周定都洛邑，与东周混淆。
    - 认为周武王在牧野之战前就建立了西周。
    - 将西周建立者写成周文王或周幽王。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:西域
  type: Concept
  subject: 历史
  title: 西域
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西域只指新疆地区，忽略广义范围。
    - 能指出并纠正这一错误：把西域定义成阳关、玉门关以东的区域。
  aliases: []
  category: 历史地理概念
  explanation: 汉朝人把阳关、玉门关以西，即今新疆和更远的广大地区称作西域。狭义指阳关和玉门关以西、葱岭以东的天山南北地区，即今新疆地区；广义还包括今中亚、西亚、印度半岛、欧洲东部等广大地区。
  misconceptions:
    - 误以为西域只指新疆地区，忽略广义范围。
    - 把西域定义成阳关、玉门关以东的区域。
    - 认为西域这一称呼始于唐朝，实际汉朝已有。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:西域都护府
  type: Concept
  subject: 历史
  title: 西域都护府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西域都护府是汉武帝时期设置的，实际是汉宣帝。
    - 能指出并纠正这一错误：把西域都护府最高长官记成“节度使”或“将军”。
  aliases: []
  category: 历史制度
  explanation: 公元前60年，西汉朝廷在乌垒城设置西域都护府，以西域都护为最高长官，对西域进行有效治理，管辖范围包括今新疆及巴尔喀什湖以东、以南的广大地区。其设置标志着西域正式归属中央政权。
  misconceptions:
    - 误以为西域都护府是汉武帝时期设置的，实际是汉宣帝。
    - 把西域都护府最高长官记成“节度使”或“将军”。
    - 认为西域都护府管辖范围包括西藏或蒙古，实际主要是新疆及巴尔喀什湖以东以南。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:西夏与北宋的关系
  type: Concept
  subject: 历史
  title: 西夏与北宋的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为西夏与北宋订立和约后彻底和平，忽略后来战争
    - 能指出并纠正这一错误：把西夏与北宋的关系等同于辽与北宋的关系，忽略差异
  aliases: []
  category: 历史事件
  explanation: 西夏与北宋时战时和，1044年订立和约后关系较为稳定。
  misconceptions:
    - 认为西夏与北宋订立和约后彻底和平，忽略后来战争
    - 把西夏与北宋的关系等同于辽与北宋的关系，忽略差异
    - 误以为西夏每年向北宋进贡，实际是北宋给西夏岁赐
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:西夏的建立
  type: Concept
  subject: 历史
  title: 西夏的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把西夏建立时间记成1038年，误说成1044年
    - 能指出并纠正这一错误：误以为西夏是由契丹人建立的，实际是党项族
  aliases:
    - 大夏
  category: 历史事件
  explanation: 1038年，党项首领元昊称大夏皇帝，定都兴庆府，史称西夏。
  misconceptions:
    - 把西夏建立时间记成1038年，误说成1044年
    - 误以为西夏是由契丹人建立的，实际是党项族
    - 将兴庆府说成今天的银川，实际是宁夏银川，但学生易误为其他城市
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:西安事变
  type: Concept
  subject: 历史
  title: 西安事变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为西安事变是中共直接策划的，实际是张学良杨虎城发动的。
    - 能指出并纠正这一错误：说西安事变和平解决后国共合作正式形成，实际是初步形成。
  aliases:
    - 双十二事变
  category: 历史事件
  explanation: 1936年12月12日，张学良、杨虎城发动西安事变，逼蒋抗日，后和平解决，推动了抗日民族统一战线初步形成。
  misconceptions:
    - 认为西安事变是中共直接策划的，实际是张学良杨虎城发动的。
    - 说西安事变和平解决后国共合作正式形成，实际是初步形成。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:西晋灭亡
  type: Concept
  subject: 历史
  title: 西晋灭亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西晋亡于八王之乱，没有提到匈奴攻陷长安
    - 能指出并纠正这一错误：误以为是前秦苻坚攻灭西晋，实际是匈奴攻陷长安
  aliases: []
  category: 历史事件
  explanation: 316年，内迁匈奴人攻陷西晋都城，西晋在八王之乱和各族武力进攻下灭亡。
  misconceptions:
    - 误以为西晋亡于八王之乱，没有提到匈奴攻陷长安
    - 误以为是前秦苻坚攻灭西晋，实际是匈奴攻陷长安
    - 认为西晋灭亡后，东晋仍定都洛阳，统称晋朝
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S3.md
- id: concept:历史:西晋的建立
  type: Concept
  subject: 历史
  title: 西晋的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为西晋建立者是司马昭而非司马炎，或把建立时间误记成265年。
    - 能指出并纠正这一错误：误认为西晋建立时就已统一全国，实际280年才灭吴统一。
  aliases:
    - 西晋建立
  category: 历史事件
  explanation: 266年，司马炎称帝，改国号为晋，以洛阳为都，史称西晋。
  misconceptions:
    - 认为西晋建立者是司马昭而非司马炎，或把建立时间误记成265年。
    - 误认为西晋建立时就已统一全国，实际280年才灭吴统一。
    - 将西晋都城洛阳误记为长安，或认为西晋是东汉的延续。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:西晋的短暂统一
  type: Concept
  subject: 历史
  title: 西晋的短暂统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把西晋存在时间当统一时间，认为统一约50年，实际仅36年。
    - 能指出并纠正这一错误：认为西晋统一从266年开始，忽略了280年才灭吴。
  aliases: []
  category: 历史阶段特征
  explanation: 西晋从266年建立到316年灭亡，仅存在约50年，统一时间更短，是短暂的统一。
  misconceptions:
    - 误把西晋存在时间当统一时间，认为统一约50年，实际仅36年。
    - 认为西晋统一从266年开始，忽略了280年才灭吴。
    - 将短暂统一与三国分裂时长比较，认为西晋比三国还久。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:西晋的统一
  type: Concept
  subject: 历史
  title: 西晋的统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把280年灭吴误记成263年灭蜀或266年建立西晋。
    - 能指出并纠正这一错误：认为结束三国的是曹魏而非西晋，或说是司马昭完成的。
  aliases:
    - 西晋统一全国
  category: 历史事件
  explanation: 280年，西晋灭吴，统一了全国，结束了三国鼎立的局面。
  misconceptions:
    - 把280年灭吴误记成263年灭蜀或266年建立西晋。
    - 认为结束三国的是曹魏而非西晋，或说是司马昭完成的。
    - 误认为西晋统一只灭掉吴国，忽略了此前已取代曹魏。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:西汉建立
  type: Concept
  subject: 历史
  title: 西汉建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西汉定都洛阳，实际是长安
    - 能指出并纠正这一错误：认为西汉建于公元前206年，与秦朝灭亡时间混淆
  aliases: []
  category: 历史事件
  explanation: 公元前202年，刘邦建立汉朝，定都长安，史称西汉。
  misconceptions:
    - 误以为西汉定都洛阳，实际是长安
    - 认为西汉建于公元前206年，与秦朝灭亡时间混淆
    - 把西汉建立与刘邦称帝视为两个时间，实际同为前202年
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:西电东送工程
  type: Concept
  subject: 历史
  title: 西电东送工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西电东送是把东部电力送到西部，方向搞反
    - 能指出并纠正这一错误：认为西电东送只有一条通道，实际有北、中、南三条
  aliases: []
  category: 重大工程
  explanation: 2000年全面启动，通过开发西部能源向东部送电，包括北、中、南三大通道。
  misconceptions:
    - 误以为西电东送是把东部电力送到西部，方向搞反
    - 认为西电东送只有一条通道，实际有北、中、南三条
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:西藏和平解放
  type: Concept
  subject: 历史
  title: 西藏和平解放
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把西藏和平解放的时间记为1950年，将昌都战役的胜利误认为解放完成。
    - 能指出并纠正这一错误：认为西藏和平解放后立即实行土地改革，混淆了时间顺序。
  aliases:
    - 和平解放西藏
  category: 历史事件
  explanation: 1951年中央人民政府与西藏地方政府达成协议，人民解放军进驻拉萨，祖国大陆获得完全统一。
  misconceptions:
    - 把西藏和平解放的时间记为1950年，将昌都战役的胜利误认为解放完成。
    - 认为西藏和平解放后立即实行土地改革，混淆了时间顺序。
    - 误以为西藏和平解放是在1951年通过武力完全解放的，忽视了和平协议。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S1.md
- id: concept:历史:西进运动
  type: Concept
  subject: 历史
  title: 西进运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为西进运动是和平的移民，忽略对印第安人的迫害与屠杀。
    - 能指出并纠正这一错误：认为西进运动是联邦政府统一组织的，实际主要是自发移民。
  aliases: []
  category: 历史事件
  explanation: 美国独立后，大批移民从东部迁往西部，开发西部土地，但导致印第安人被迫迁徙，被称为“血泪之路”。
  misconceptions:
    - 误以为西进运动是和平的移民，忽略对印第安人的迫害与屠杀。
    - 认为西进运动是联邦政府统一组织的，实际主要是自发移民。
    - 将西进运动与三角贸易混淆，认为迁移的是黑人奴隶。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C1/sections/S3.md
- id: concept:历史:西部大开发战略
  type: Concept
  subject: 历史
  title: 西部大开发战略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把西部大开发全面启动时间误记为1999年，实际2000年
    - 能指出并纠正这一错误：认为西部大开发仅针对西部地区，忽略支持中西部地区和民族地区
  aliases: []
  category: 发展战略
  explanation: 1999年中共中央决定实施，通过优先安排基础设施建设等措施，支持中西部地区和民族地区加快发展，2000年全面启动。
  misconceptions:
    - 把西部大开发全面启动时间误记为1999年，实际2000年
    - 认为西部大开发仅针对西部地区，忽略支持中西部地区和民族地区
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:解放区军民的自卫反击
  type: Concept
  subject: 历史
  title: 解放区军民的自卫反击
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为自卫反击战采用游击战，实际是集中兵力打运动战
    - 能指出并纠正这一错误：认为自卫反击发生在国民党全面进攻之前，实际是面对进攻的应对
  aliases:
    - 自卫战争
  category: 历史事件
  explanation: 面对国民党进攻，中共中央制定集中优势兵力、各个歼灭敌人的作战原则，以运动战粉碎进攻。
  misconceptions:
    - 误以为自卫反击战采用游击战，实际是集中兵力打运动战
    - 认为自卫反击发生在国民党全面进攻之前，实际是面对进攻的应对
    - 把‘集中优势兵力、各个歼灭敌人’当作国民党军的作战方针
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S4.md
- id: concept:历史:解放区军民粉碎国民党进攻
  type: Concept
  subject: 历史
  title: 解放区军民粉碎国民党进攻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为先粉碎重点进攻，再粉碎全面进攻
    - 能指出并纠正这一错误：以为歼敌112万仅指粉碎全面进攻，不包括重点进攻
  aliases: []
  category: 史实
  explanation: 从1946年7月到1947年6月，解放区军民歼敌112万人，粉碎了国民党军队的全面进攻和重点进攻。
  misconceptions:
    - 误认为先粉碎重点进攻，再粉碎全面进攻
    - 以为歼敌112万仅指粉碎全面进攻，不包括重点进攻
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:解放区土地改革
  type: Concept
  subject: 历史
  title: 解放区土地改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《中国土地法大纲》是抗战时期颁布，实际是解放战争时期
    - 能指出并纠正这一错误：认为土地改革是政府直接将地主土地分给农民，忽略需发动群众斗争
  aliases:
    - 土地改革
  category: 历史事件
  explanation: 中国共产党在解放区进行的土地改革运动，依据《中国土地法大纲》，使农民获得土地，激发革命和生产积极性。
  misconceptions:
    - 误以为《中国土地法大纲》是抗战时期颁布，实际是解放战争时期
    - 认为土地改革是政府直接将地主土地分给农民，忽略需发动群众斗争
    - 把土地改革说成是解放战争胜利后才开始，实际是战争过程中进行
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:计算机网络
  type: Concept
  subject: 历史
  title: 计算机网络
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把互联网普及说成二战后立刻实现，实际是90年代才广泛进入生活
    - 能指出并纠正这一错误：认为计算机网络只用于娱乐，忽略其在科研、金融、教育等领域的应用
  aliases:
    - 互联网
  category: 历史概念
  explanation: 第二次世界大战后，随着电子计算机的发明和普及，数据库和计算机网络建立起来，互联网渗透到各个领域，对现代社会生活产生重大影响。
  misconceptions:
    - 把互联网普及说成二战后立刻实现，实际是90年代才广泛进入生活
    - 认为计算机网络只用于娱乐，忽略其在科研、金融、教育等领域的应用
    - 误以为互联网的诞生导致了电子计算机的发明，实际是先有计算机后有互联网
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S3.md
- id: concept:历史:议会制度
  type: Concept
  subject: 历史
  title: 议会制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为议会制度是《权利法案》颁布后才出现，忽略英国议会早在13世纪末就已确立。
    - 能指出并纠正这一错误：将议会上下两院职能颠倒，认为贵族院控制征税权，实际征税权掌握在下院。
  aliases: []
  category: 政治制度
  explanation: 英格兰13世纪末确立，由上下两院组成，掌握征税权。
  misconceptions:
    - 误以为议会制度是《权利法案》颁布后才出现，忽略英国议会早在13世纪末就已确立。
    - 将议会上下两院职能颠倒，认为贵族院控制征税权，实际征税权掌握在下院。
    - 把1215年《大宪章》签署当作议会制度确立的标志，混淆了限制王权与议会制度。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:议政王大臣会议
  type: Concept
  subject: 历史
  title: 议政王大臣会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为议政王大臣会议是辅助皇帝决策的机构，实际它由满洲贵族组成，常限制皇权。
    - 能指出并纠正这一错误：误以为该会议在雍正设军机处后立即废除，实际是逐渐名存实亡，乾隆时取消。
  aliases: []
  category: 政治制度
  explanation: 清朝初期由满洲贵族组成的决策机构，军国大事由会议决定，皇帝不能改变，后因军机处设立而名存实亡。
  misconceptions:
    - 认为议政王大臣会议是辅助皇帝决策的机构，实际它由满洲贵族组成，常限制皇权。
    - 误以为该会议在雍正设军机处后立即废除，实际是逐渐名存实亡，乾隆时取消。
    - 将议政王大臣会议与明朝内阁混为一谈，两者性质不同，前者是贵族决策机构。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:设置伊犁将军
  type: Concept
  subject: 历史
  title: 设置伊犁将军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为伊犁将军管辖整个西北和西藏，实际只管新疆地区军政。
    - 能指出并纠正这一错误：把伊犁将军设置时间与驻藏大臣混淆，认为1730年代已设立。
  aliases: []
  category: 历史事件
  explanation: 1762年，清朝设置伊犁将军，管辖新疆军政事务，加强了对西北地区的管辖。
  misconceptions:
    - 误认为伊犁将军管辖整个西北和西藏，实际只管新疆地区军政。
    - 把伊犁将军设置时间与驻藏大臣混淆，认为1730年代已设立。
    - 以为伊犁将军是在平定准噶尔前设置，实际在平定大小和卓后的1762年设置。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:设置驻藏办事大臣
  type: Concept
  subject: 历史
  title: 设置驻藏办事大臣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为驻藏大臣由达赖喇嘛任命，实际是清朝中央派遣的。
    - 能指出并纠正这一错误：将驻藏办事大臣设立时间记成1751年或1793年，实际是1727年。
  aliases: []
  category: 历史事件
  explanation: 1727年，清朝在西藏设置驻藏办事大臣，监督西藏地方政务，加强中央对西藏的管理。
  misconceptions:
    - 误认为驻藏大臣由达赖喇嘛任命，实际是清朝中央派遣的。
    - 将驻藏办事大臣设立时间记成1751年或1793年，实际是1727年。
    - 以为驻藏大臣与达赖、班禅地位平等共治西藏，实际上驻藏大臣代表中央监督政务。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:评价历史人物的方法
  type: Concept
  subject: 历史
  title: 评价历史人物的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：评价秦始皇只强调暴政，忽略其统一六国的历史功绩，犯了以偏概全的错误。
    - 能指出并纠正这一错误：用今天的道德标准苛求古代人物，如认为曾国藩镇压太平天国就是‘卖国’。
  aliases:
    - 如何评价历史人物
  category: 史学方法
  explanation: 从时代背景、参与事件、活动领域、阶级属性、历史作用五个方面评价历史人物，看其是否顺应历史潮流、推动历史进步。
  misconceptions:
    - 评价秦始皇只强调暴政，忽略其统一六国的历史功绩，犯了以偏概全的错误。
    - 用今天的道德标准苛求古代人物，如认为曾国藩镇压太平天国就是‘卖国’。
    - 评价历史人物时只看他个人品质，不分析他所处的时代背景和阶级属性。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C8/sections/S1.md
- id: concept:历史:词牌
  type: Concept
  subject: 历史
  title: 词牌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“念奴娇”是词的题目，实际是曲调名（词牌）。
    - 能指出并纠正这一错误：误以为词牌决定词的思想内容，实际上只规定格式与音律。
  aliases: []
  category: 文学术语
  explanation: 填词用的曲调名，如“念奴娇”“满江红”等。
  misconceptions:
    - 认为“念奴娇”是词的题目，实际是曲调名（词牌）。
    - 误以为词牌决定词的思想内容，实际上只规定格式与音律。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:诸侯争霸
  type: Concept
  subject: 历史
  title: 诸侯争霸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把诸侯争霸理解为统一战争，忽视其目的是争夺霸主地位而非统一全国。
    - 能指出并纠正这一错误：误以为齐桓公、晋文公、楚庄王是同时代争霸，实际先后称霸而非同时。
  aliases:
    - 争霸战争
  category: 政治现象
  explanation: 春秋时期诸侯国之间为争夺霸主地位而进行的结盟和军事征伐，齐桓公、晋文公、楚庄王等先后称霸。
  misconceptions:
    - 把诸侯争霸理解为统一战争，忽视其目的是争夺霸主地位而非统一全国。
    - 误以为齐桓公、晋文公、楚庄王是同时代争霸，实际先后称霸而非同时。
    - 认为争霸战争只有军事征伐，忽视结盟、外交等手段也是争霸方式。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:诸葛亮治蜀
  type: Concept
  subject: 历史
  title: 诸葛亮治蜀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将诸葛亮治蜀的政绩全归于刘备，或把北伐说成是贪功。
    - 能指出并纠正这一错误：误认为七擒孟获是北伐曹魏时的事件，混淆南征与北伐。
  aliases: []
  category: 历史人物
  explanation: 诸葛亮辅佐后主刘禅，发展经济，改善民族关系，加速西南地区开发，并多次北伐曹魏。
  misconceptions:
    - 将诸葛亮治蜀的政绩全归于刘备，或把北伐说成是贪功。
    - 误认为七擒孟获是北伐曹魏时的事件，混淆南征与北伐。
    - 认为诸葛亮治蜀后蜀汉实力超过曹魏，实际仍处劣势。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S2.md
- id: concept:历史:诺曼底登陆
  type: Concept
  subject: 历史
  title: 诺曼底登陆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为诺曼底登陆发生在1943年，实际是1944年6月
    - 能指出并纠正这一错误：误以为诺曼底登陆后德军立即投降，实际直至1945年5月德国才无条件投降
  aliases: []
  category: 历史事件
  explanation: 1944年6月，盟军在法国诺曼底登陆，开辟欧洲第二战场，使德国陷入两线作战。
  misconceptions:
    - 认为诺曼底登陆发生在1943年，实际是1944年6月
    - 误以为诺曼底登陆后德军立即投降，实际直至1945年5月德国才无条件投降
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:诺贝尔
  type: Concept
  subject: 历史
  title: 诺贝尔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为诺贝尔是英国人，实为瑞典化学家
    - 能指出并纠正这一错误：误认为诺贝尔获得诺贝尔奖，实际是他设立诺贝尔奖
  aliases: []
  category: 历史人物
  explanation: 瑞典化学家诺贝尔发明现代炸药，并设立诺贝尔奖。
  misconceptions:
    - 误认为诺贝尔是英国人，实为瑞典化学家
    - 误认为诺贝尔获得诺贝尔奖，实际是他设立诺贝尔奖
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:谢晋元
  type: Concept
  subject: 历史
  title: 谢晋元
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将谢晋元的事迹说成守卫宝山，实际为姚子青
    - 能指出并纠正这一错误：把谢晋元说成在四行仓库战斗中当场壮烈殉国，实际后撤，后被暗杀
  aliases: []
  category: 历史人物
  explanation: 淞沪会战中率部坚守四行仓库，与日军血战，消灭日军200多人。
  misconceptions:
    - 误将谢晋元的事迹说成守卫宝山，实际为姚子青
    - 把谢晋元说成在四行仓库战斗中当场壮烈殉国，实际后撤，后被暗杀
    - 误以为谢晋元消灭日军2000多人，实际是200多人
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:谭嗣同
  type: Concept
  subject: 历史
  title: 谭嗣同
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把'有心杀贼，无力回天'当作康有为的绝命诗，实际是谭嗣同的。
    - 能指出并纠正这一错误：认为谭嗣同在戊戌政变后逃亡，实际他拒绝出走、英勇就义。
  aliases: []
  category: 历史人物
  explanation: 维新派代表人物，戊戌政变时拒绝出走，英勇就义，留下'有心杀贼，无力回天'的绝命诗。
  misconceptions:
    - 误把'有心杀贼，无力回天'当作康有为的绝命诗，实际是谭嗣同的。
    - 认为谭嗣同在戊戌政变后逃亡，实际他拒绝出走、英勇就义。
    - 将谭嗣同误认为《天演论》的译者，实际译者是严复。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:豪强大族势力膨胀
  type: Concept
  subject: 历史
  title: 豪强大族势力膨胀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为豪强大族只是经济富裕，不掌握权力，实际他们兼并土地、拥有私人武装并操控地方政权
    - 能指出并纠正这一错误：误以为豪强大族支持中央集权，实际他们是导致地方割据的重要因素
  aliases:
    - 豪强地主
  category: 历史现象
  explanation: 东汉后期，豪强大族兼并土地、拥有私人武装，操控地方政权，是导致割据的重要因素。
  misconceptions:
    - 认为豪强大族只是经济富裕，不掌握权力，实际他们兼并土地、拥有私人武装并操控地方政权
    - 误以为豪强大族支持中央集权，实际他们是导致地方割据的重要因素
    - 把豪强大族与一般地主混同，忽视其私人武装和割据倾向
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S5.md
- id: concept:历史:豫湘桂战役
  type: Concept
  subject: 历史
  title: 豫湘桂战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为豫湘桂战役是正面战场的胜利，忽略了它是一次大溃败。
    - 能指出并纠正这一错误：以为豫湘桂战役发生在1941年或1942年，实际是1944年。
  aliases:
    - 豫湘桂大溃败
  category: 历史事件
  explanation: 1944年，日军在正面战场发动大规模进攻，国民党军队一溃千里，丢失大片领土，是正面战场的一次大溃败。
  misconceptions:
    - 认为豫湘桂战役是正面战场的胜利，忽略了它是一次大溃败。
    - 以为豫湘桂战役发生在1941年或1942年，实际是1944年。
    - 把豫湘桂战役与敌后战场混淆，认为是八路军、新四军参战。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:贝多芬
  type: Concept
  subject: 历史
  title: 贝多芬
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为贝多芬是法国人，把他与拿破仑混为一谈
    - 能指出并纠正这一错误：误以为贝多芬是第二次工业革命时期音乐家，与爱迪生同时代
  aliases:
    - 路德维希·凡·贝多芬
  category: 音乐
  explanation: 德国天才作曲家，代表作《英雄交响曲》反映重大社会题材，表达对自由、平等和博爱的渴望。
  misconceptions:
    - 误认为贝多芬是法国人，把他与拿破仑混为一谈
    - 误以为贝多芬是第二次工业革命时期音乐家，与爱迪生同时代
    - 将《英雄交响曲》当作莫扎特的作品
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:贞观之治
  type: Concept
  subject: 历史
  title: 贞观之治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将贞观之治对应唐玄宗，实际是唐太宗在位时期
    - 能指出并纠正这一错误：误认为唐太宗是唐朝开国皇帝，实际开国皇帝是李渊
  aliases: []
  category: 历史时期
  explanation: 唐太宗在位期间，政治清明、经济恢复、国力增强，史称“贞观之治”。
  misconceptions:
    - 误将贞观之治对应唐玄宗，实际是唐太宗在位时期
    - 误认为唐太宗是唐朝开国皇帝，实际开国皇帝是李渊
    - 把贞观之治说成唐太宗与武则天共同开创，实际仅指唐太宗在位期间的治世
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S2.md
- id: concept:历史:贫富分化
  type: Concept
  subject: 历史
  title: 贫富分化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为原始社会从一开始就存在贫富分化，实际早期氏族社会平等，晚期才出现。
    - 能指出并纠正这一错误：认为贫富分化导致生产力发展，实际生产力发展是贫富分化的原因。
  aliases: []
  category: 社会现象
  explanation: 随着生产力发展，社会成员之间出现财富和地位差异，如大汶口文化晚期墓葬随葬品差异明显。
  misconceptions:
    - 认为原始社会从一开始就存在贫富分化，实际早期氏族社会平等，晚期才出现。
    - 认为贫富分化导致生产力发展，实际生产力发展是贫富分化的原因。
    - 把贫富分化等同于阶级分化，实际贫富分化是财富差异，阶级分化是政治地位差异，但两者相关。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:贫富分化加剧
  type: Concept
  subject: 历史
  title: 贫富分化加剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为工业革命让全体社会成员共同致富，忽略贫富分化
    - 能指出并纠正这一错误：认为工人贫困是因为自身懒惰，而非制度性剥削
  aliases: []
  category: 社会问题
  explanation: 资本家攫取大部分财富，工人收入低且劳动条件恶劣，社会矛盾尖锐。
  misconceptions:
    - 误以为工业革命让全体社会成员共同致富，忽略贫富分化
    - 认为工人贫困是因为自身懒惰，而非制度性剥削
    - 误以为工业革命期间所有资本家都发财，忽视小生产者破产
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S2.md
- id: concept:历史:贾思勰
  type: Concept
  subject: 历史
  title: 贾思勰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为贾思勰是南朝人，实际他是北朝农学家。
    - 能指出并纠正这一错误：误把《齐民要术》当作地理著作，与《水经注》混淆。
  aliases: []
  category: 历史人物
  explanation: 北朝农学家，撰写《齐民要术》，重视农业生产。
  misconceptions:
    - 误认为贾思勰是南朝人，实际他是北朝农学家。
    - 误把《齐民要术》当作地理著作，与《水经注》混淆。
    - 误以为《齐民要术》主要讲渔业，忽略农林牧副渔俱全。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:资本原始积累
  type: Concept
  subject: 历史
  title: 资本原始积累
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为资本原始积累就是资本积累，把殖民掠夺等行为当作资本主义发展的一般现象
    - 能指出并纠正这一错误：认为只有殖民掠夺和黑奴贸易才是资本原始积累，忽略国内圈地运动等途径
  aliases: []
  category: 经济概念
  explanation: 通过殖民掠夺、黑奴贸易等方式积累财富，促进欧洲资本主义发展。
  misconceptions:
    - 认为资本原始积累就是资本积累，把殖民掠夺等行为当作资本主义发展的一般现象
    - 认为只有殖民掠夺和黑奴贸易才是资本原始积累，忽略国内圈地运动等途径
    - 将资本原始积累视为资本主义发展的结果，说‘殖民掠夺是资本主义发展的产物’
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:赎买政策
  type: Concept
  subject: 历史
  title: 赎买政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为赎买政策是无偿没收资本家的生产资料，与没收政策相混淆。
    - 能指出并纠正这一错误：把赎买政策的对象说成是农业和手工业，错误扩大范围。
  aliases: []
  category: 政策方针
  explanation: 对资本主义工商业改造中，国家以定息方式购买资本家生产资料，实现和平过渡。
  misconceptions:
    - 认为赎买政策是无偿没收资本家的生产资料，与没收政策相混淆。
    - 把赎买政策的对象说成是农业和手工业，错误扩大范围。
    - 误以为赎买政策实行的是私人所有，而实际上实现了和平过渡到公有制。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S3.md
- id: concept:历史:赛璐珞
  type: Concept
  subject: 历史
  title: 赛璐珞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为赛璐珞由爱迪生发明，忽视海厄特
    - 能指出并纠正这一错误：将赛璐珞视为天然材料，不知其是现代塑料
  aliases: []
  category: 新材料
  explanation: 1869年美国人海厄特发明赛璐珞制造技术，是现代塑料工业的开端。
  misconceptions:
    - 误以为赛璐珞由爱迪生发明，忽视海厄特
    - 将赛璐珞视为天然材料，不知其是现代塑料
    - 把赛璐珞技术直接说成‘发明塑料’，以偏概全
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:赤壁之战
  type: Concept
  subject: 历史
  title: 赤壁之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把赤壁之战双方记为曹操与袁绍，实际是曹操与孙刘联军
    - 能指出并纠正这一错误：认为赤壁之战后曹操趁胜统一北方，实际是失败退回北方
  aliases: []
  category: 历史事件
  explanation: 208年孙刘联军在赤壁大败曹军，以少胜多，为三国鼎立局面形成奠定基础。
  misconceptions:
    - 误把赤壁之战双方记为曹操与袁绍，实际是曹操与孙刘联军
    - 认为赤壁之战后曹操趁胜统一北方，实际是失败退回北方
    - 把赤壁之战与官渡之战的时间混淆，想成200年，实际是208年
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S1.md
- id: concept:历史:赫鲁晓夫改革
  type: Concept
  subject: 历史
  title: 赫鲁晓夫改革
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把赫鲁晓夫改革措施误安到勃列日涅夫或戈尔巴乔夫身上，人物张冠李戴。
    - 能指出并纠正这一错误：认为赫鲁晓夫改革彻底否定了斯大林模式，实际只作局部调整。
  aliases:
    - 赫鲁晓夫经济改革
  category: 历史事件
  explanation: 1953年斯大林逝世后，赫鲁晓夫上台执政，在经济领域进行改革，如垦荒、种玉米、取消义务交售制等，但未从根本上改变苏联模式高度集中的经济体制弊端。
  misconceptions:
    - 把赫鲁晓夫改革措施误安到勃列日涅夫或戈尔巴乔夫身上，人物张冠李戴。
    - 认为赫鲁晓夫改革彻底否定了斯大林模式，实际只作局部调整。
    - 误认为赫鲁晓夫改革发生在斯大林执政时期，时间顺序颠倒。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:赵州桥
  type: Concept
  subject: 历史
  title: 赵州桥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将赵州桥的建造者说成鲁班，实际是隋朝李春
    - 能指出并纠正这一错误：误认为赵州桥是唐朝建造，实际是隋朝建造
  aliases:
    - 安济桥
  category: 建筑成就
  explanation: 隋朝工匠李春设计建造的石拱桥，是世界上现存最古老的石拱桥之一。
  misconceptions:
    - 将赵州桥的建造者说成鲁班，实际是隋朝李春
    - 误认为赵州桥是唐朝建造，实际是隋朝建造
    - 说赵州桥是世界现存唯一最古老石拱桥，漏掉‘之一’
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:轴心国
  type: Concept
  subject: 历史
  title: 轴心国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为轴心国包括日本，但漏掉意大利或德国，实际是德意日三国
    - 能指出并纠正这一错误：把轴心国形成时间说成1940年，实际始于1936年德意协定
  aliases: []
  category: 历史概念
  explanation: 指二战期间德、意、日三国结成的法西斯同盟，源于1936年德意协定。
  misconceptions:
    - 认为轴心国包括日本，但漏掉意大利或德国，实际是德意日三国
    - 把轴心国形成时间说成1940年，实际始于1936年德意协定
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:辛亥革命
  type: Concept
  subject: 历史
  title: 辛亥革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为辛亥革命推翻了整个封建制度，实际只推翻了清王朝和君主专制制度，封建土地制度仍存。
    - 能指出并纠正这一错误：误认为辛亥革命是从1911年1月1日开始，实际以1911年10月10日武昌起义为标志。
  aliases: []
  category: 历史事件
  explanation: 1911年（辛亥年）爆发的资产阶级民主革命，以武昌起义为标志，推翻了清王朝，建立了中华民国。
  misconceptions:
    - 误认为辛亥革命推翻了整个封建制度，实际只推翻了清王朝和君主专制制度，封建土地制度仍存。
    - 误认为辛亥革命是从1911年1月1日开始，实际以1911年10月10日武昌起义为标志。
    - 以偏概全，认为辛亥革命只是军事行动，实际还包括政治、思想等多方面变革。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:辛亥革命的历史意义
  type: Concept
  subject: 历史
  title: 辛亥革命的历史意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为辛亥革命推翻了封建制度，实际只推翻君主专制制度。
    - 能指出并纠正这一错误：认为辛亥革命使中国摆脱了半殖民地半封建社会，实现了民族独立。
  aliases:
    - 辛亥革命影响
  category: 历史意义
  explanation: 辛亥革命推翻了清王朝，终结了君主专制制度，推动了思想解放，但未完成民族独立和人民解放的任务。
  misconceptions:
    - 误认为辛亥革命推翻了封建制度，实际只推翻君主专制制度。
    - 认为辛亥革命使中国摆脱了半殖民地半封建社会，实现了民族独立。
    - 将辛亥革命的意义说成结束了两千多年的封建社会，应为结束君主专制制度。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S1.md
- id: concept:历史:辛弃疾
  type: Concept
  subject: 历史
  title: 辛弃疾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把陆游的《示儿》当成辛弃疾的作品，如说'辛弃疾留下遗诗《示儿》'。
    - 能指出并纠正这一错误：认为辛弃疾是北宋词人，忽略他活动于南宋时期。
  aliases: []
  category: 历史人物
  explanation: 南宋词人，词风豪迈，代表作《永遇乐·京口北固亭怀古》。
  misconceptions:
    - 误把陆游的《示儿》当成辛弃疾的作品，如说'辛弃疾留下遗诗《示儿》'。
    - 认为辛弃疾是北宋词人，忽略他活动于南宋时期。
    - 将辛弃疾归为婉约派，与李清照混淆，忽略其豪放风格。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:边疆危机
  type: Concept
  subject: 历史
  title: 边疆危机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为边疆危机只发生在西北新疆，忽略东南台湾
    - 能指出并纠正这一错误：认为边疆危机出现在鸦片战争前，实际是19世纪中后期
  aliases: []
  category: 历史事件
  explanation: 19世纪中后期，中国边疆地区面临列强侵略的危机，如新疆、台湾等地的危机，清政府未能有效解决。
  misconceptions:
    - 误以为边疆危机只发生在西北新疆，忽略东南台湾
    - 认为边疆危机出现在鸦片战争前，实际是19世纪中后期
    - 误认为清政府解决了所有边疆危机，实际台湾被割让
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:辽与北宋的和战
  type: Concept
  subject: 历史
  title: 辽与北宋的和战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为澶渊之盟前辽与北宋未有过战争，实际有多次战争
    - 能指出并纠正这一错误：认为澶渊之盟后辽与北宋再无冲突，实际时有小摩擦
  aliases: []
  category: 历史事件
  explanation: 辽与北宋之间既有战争又有和平，澶渊之盟后维持了长期和平。
  misconceptions:
    - 误以为澶渊之盟前辽与北宋未有过战争，实际有多次战争
    - 认为澶渊之盟后辽与北宋再无冲突，实际时有小摩擦
    - 把辽与北宋的和战说成是西夏与北宋的关系，张冠李戴
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:辽沈战役
  type: Concept
  subject: 历史
  title: 辽沈战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为辽沈战役由华北野战军发动，实际是东北野战军
    - 能指出并纠正这一错误：将辽沈战役时间记成1948年11月至1949年1月，混同于淮海战役
  aliases: []
  category: 历史事件
  explanation: 1948年9月至11月，东北野战军解放东北全境的战役。
  misconceptions:
    - 误认为辽沈战役由华北野战军发动，实际是东北野战军
    - 将辽沈战役时间记成1948年11月至1949年1月，混同于淮海战役
    - 认为辽沈战役只是攻克沈阳，忽略还包括锦州、长春等地全境解放
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:辽的建立
  type: Concept
  subject: 历史
  title: 辽的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把辽的建立时间记成916年，误说成907年
    - 能指出并纠正这一错误：误以为辽是由女真族建立的，实际是契丹族
  aliases:
    - 契丹国
  category: 历史事件
  explanation: 916年，契丹首领耶律阿保机统一契丹各部，建立契丹政权，后改国号为辽。
  misconceptions:
    - 把辽的建立时间记成916年，误说成907年
    - 误以为辽是由女真族建立的，实际是契丹族
    - 认为辽国号一直为辽，忽略最初为契丹，后改辽
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:达·伽马
  type: Concept
  subject: 历史
  title: 达·伽马
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为达·伽马到达好望角，而迪亚士到达印度
    - 能指出并纠正这一错误：把达·伽马到达印度的时间记成1487年，与迪亚士的航行时间混淆
  aliases: []
  category: 历史人物
  explanation: 葡萄牙航海家，1497-1498年到达印度，开辟了通往印度的新航路。
  misconceptions:
    - 误认为达·伽马到达好望角，而迪亚士到达印度
    - 把达·伽马到达印度的时间记成1487年，与迪亚士的航行时间混淆
    - 认为达·伽马完成环球航行并证明地圆说
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:达·芬奇
  type: Concept
  subject: 历史
  title: 达·芬奇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《蒙娜丽莎》是米开朗基罗的作品
    - 能指出并纠正这一错误：认为达·芬奇的代表作是雕塑《大卫》
  aliases: []
  category: 历史人物
  explanation: 文艺复兴美术三杰之一，代表作《蒙娜丽莎》《最后的晚餐》，体现人文主义精神。
  misconceptions:
    - 误认为《蒙娜丽莎》是米开朗基罗的作品
    - 认为达·芬奇的代表作是雕塑《大卫》
    - 认为达·芬奇作品以神权至上为主题，忽视人文主义内涵
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:达尔文
  type: Concept
  subject: 历史
  title: 达尔文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为达尔文是法国人，与拉马克张冠李戴
    - 能指出并纠正这一错误：错写《物种起源》出版于1900年后，时间颠倒
  aliases: []
  category: 历史人物
  explanation: 英国生物学家达尔文提出进化论，出版《物种起源》，打破神创论。
  misconceptions:
    - 误认为达尔文是法国人，与拉马克张冠李戴
    - 错写《物种起源》出版于1900年后，时间颠倒
    - 误以为达尔文是神创论支持者，实际进化论打破神创论
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:迁都北京
  type: Concept
  subject: 历史
  title: 迁都北京
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为迁都北京是明太祖朱元璋的决定，实际是明成祖朱棣于1421年完成。
    - 能指出并纠正这一错误：认为迁都北京是为了便于管理南方经济，实际是为了加强北方防御（防御蒙古）。
  aliases: []
  category: 历史事件
  explanation: 1421年明成祖为加强北方防御，将都城从应天迁至北京。
  misconceptions:
    - 误以为迁都北京是明太祖朱元璋的决定，实际是明成祖朱棣于1421年完成。
    - 认为迁都北京是为了便于管理南方经济，实际是为了加强北方防御（防御蒙古）。
    - 把1421年迁都记成1402年靖难之役后，实际靖难之役后仍都南京，1421年才迁都。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:过渡时期总路线
  type: Concept
  subject: 历史
  title: 过渡时期总路线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把过渡时期总路线概括为‘一改三化’，颠倒了内容。
    - 能指出并纠正这一错误：认为过渡时期总路线提出于1954年，与一届人大时间混淆。
  aliases:
    - 一化三改
  category: 政策方针
  explanation: 1953年提出，即“一化三改”，实现社会主义工业化，并对农业、手工业和资本主义工商业进行社会主义改造。
  misconceptions:
    - 把过渡时期总路线概括为‘一改三化’，颠倒了内容。
    - 认为过渡时期总路线提出于1954年，与一届人大时间混淆。
    - 误以为过渡时期总路线只强调工业化，忽略了三大改造，以偏概全。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S3.md
- id: concept:历史:近代军事工业
  type: Concept
  subject: 历史
  title: 近代军事工业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把江南机器制造总局归为官督商办的民用企业，混淆了洋务企业的经营形式。
    - 能指出并纠正这一错误：误认为福州船政局由曾国藩创办，实际是左宗棠在福建创办。
  aliases: []
  category: 历史概念
  explanation: 洋务运动期间创办的官办军事企业，如江南机器制造总局、福州船政局，采用机器生产，但管理落后、效率低下。
  misconceptions:
    - 把江南机器制造总局归为官督商办的民用企业，混淆了洋务企业的经营形式。
    - 误认为福州船政局由曾国藩创办，实际是左宗棠在福建创办。
    - 以为洋务派先办民用工业后办军事工业，实际顺序是先军事后民用。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md

- id: concept:历史:近代民用工业
  type: Concept
  subject: 历史
  title: 近代民用工业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将轮船招商局认作军事工业，实际是官督商办的民用企业。
    - 能指出并纠正这一错误：误认为开平煤矿由张之洞创办，实际是李鸿章创办。
  aliases: []
  category: 历史概念
  explanation: 洋务运动期间创办的官督商办民用企业，如轮船招商局、开平煤矿、汉阳铁厂等，以辅助军事工业。
  misconceptions:
    - 将轮船招商局认作军事工业，实际是官督商办的民用企业。
    - 误认为开平煤矿由张之洞创办，实际是李鸿章创办。
    - 以为所有民用工业都是官办，忽略官督商办这一主要形式。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md

- id: concept:历史:进京赶考
  type: Concept
  subject: 历史
  title: 进京赶考
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘进京赶考’是毛泽东在七届二中全会上正式发言中提出的。
    - 能指出并纠正这一错误：把‘进京赶考’理解为主席进京参加文化考试，忽略其执政考验的寓意。
  aliases: []
  category: 历史典故
  explanation: 1949年3月，中共中央离开西柏坡向北平进发，毛泽东将此行比喻为进京“赶考”，寓意要经受执政的考验，决不当李自成。
  misconceptions:
    - 误以为‘进京赶考’是毛泽东在七届二中全会上正式发言中提出的。
    - 把‘进京赶考’理解为主席进京参加文化考试，忽略其执政考验的寓意。
    - 误以为‘决不当李自成’是朱德或任弼时所说，张冠李戴。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:进化论
  type: Concept
  subject: 历史
  title: 进化论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将进化论理解为‘用进废退’，混淆拉马克与达尔文
    - 能指出并纠正这一错误：认为进化论主张人类由现代猴子直接变来，机械理解
  aliases: []
  category: 科学理论
  explanation: 达尔文提出的生物进化理论，认为物种演变是自然选择的结果。
  misconceptions:
    - 将进化论理解为‘用进废退’，混淆拉马克与达尔文
    - 认为进化论主张人类由现代猴子直接变来，机械理解
    - 误以为物种进化是其主观努力的结果，忽视自然选择
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S3.md
- id: concept:历史:迪亚士
  type: Concept
  subject: 历史
  title: 迪亚士
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为迪亚士到达印度，而达·伽马发现好望角
    - 能指出并纠正这一错误：认为迪亚士在1497年远航，与达·伽马时间颠倒
  aliases: []
  category: 历史人物
  explanation: 葡萄牙航海家，1487年到达好望角，开辟绕道非洲南端的航路。
  misconceptions:
    - 误认为迪亚士到达印度，而达·伽马发现好望角
    - 认为迪亚士在1497年远航，与达·伽马时间颠倒
    - 认为迪亚士完成了环球航行，实际他未完成
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:迪亚斯独裁统治
  type: Concept
  subject: 历史
  title: 迪亚斯独裁统治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为迪亚斯统治时间很短，实际统治长达三十多年（1876-1911年）。
    - 能指出并纠正这一错误：认为迪亚斯是民主选举上台，实际是军事政变上台，实行独裁。
  aliases: []
  category: 历史事件
  explanation: 1876年迪亚斯发动政变上台，实行军事独裁，导致国内矛盾尖锐、经济不平衡。
  misconceptions:
    - 以为迪亚斯统治时间很短，实际统治长达三十多年（1876-1911年）。
    - 认为迪亚斯是民主选举上台，实际是军事政变上台，实行独裁。
    - 以为迪亚斯独裁只压制农民，实际工人、民族资产阶级均受压迫。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:通判
  type: Concept
  subject: 历史
  title: 通判
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为通判是中央派到地方的财政官，实际负责监察知州。
    - 能指出并纠正这一错误：以为通判品级高于知州，实际低于知州但可牵制。
  aliases: []
  category: 官职制度
  explanation: 宋朝州级副长官，负责监察知州，可独立奏事，分知州权力。
  misconceptions:
    - 认为通判是中央派到地方的财政官，实际负责监察知州。
    - 以为通判品级高于知州，实际低于知州但可牵制。
    - 混淆通判与监察御史，通判是地方副官，御史是中央官员。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:造纸术的发明
  type: Concept
  subject: 历史
  title: 造纸术的发明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把蔡伦当作纸的发明者，实际他改进了工艺。
    - 能指出并纠正这一错误：认为西汉时期还没有纸，实际已有早期纸。
  aliases:
    - 蔡侯纸
  category: 科技成就
  explanation: 西汉时期已掌握造纸基本方法，东汉蔡伦改进造纸工艺，使纸的质量提高，原料易找，价格便宜，逐渐取代简帛，成为广泛使用的书写材料，是中国对世界文明的伟大贡献之一。
  misconceptions:
    - 误把蔡伦当作纸的发明者，实际他改进了工艺。
    - 认为西汉时期还没有纸，实际已有早期纸。
    - 认为蔡伦是西汉宦官，实际东汉。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:道家学派
  type: Concept
  subject: 历史
  title: 道家学派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把道家学派与道教混为一谈，认为老子是道教创始人
    - 能指出并纠正这一错误：认为道家学派的代表是孔子和孟子，或荀子和韩非
  aliases: []
  category: 学派
  explanation: 以老子和庄子为代表，主张顺应自然、无为而治。
  misconceptions:
    - 把道家学派与道教混为一谈，认为老子是道教创始人
    - 认为道家学派的代表是孔子和孟子，或荀子和韩非
    - 认为道家学派主张‘仁政’和‘兼爱’，没有抓住顺应自然
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:道教
  type: Concept
  subject: 历史
  title: 道教
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将太平道的创立者记为张陵，实际是张角。
    - 能指出并纠正这一错误：认为道教产生于西汉初年，实际东汉末年。
  aliases:
    - 太平道
    - 五斗米道
  category: 宗教
  explanation: 东汉末年张角创立太平道，张陵创立五斗米道，是早期道教的不同派别，为下层民众所信奉。
  misconceptions:
    - 误将太平道的创立者记为张陵，实际是张角。
    - 认为道教产生于西汉初年，实际东汉末年。
    - 误以为道教与佛教一样由印度传入，实际本土产生。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S7.md
- id: concept:历史:遣唐使
  type: Concept
  subject: 历史
  title: 遣唐使
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为遣唐使是唐朝派往日本，方向反了
    - 能指出并纠正这一错误：误认为遣唐使只学习唐朝的佛教，忽略政治制度等
  aliases:
    - 遣隋使
  category: 历史事件
  explanation: 日本派往唐朝的使团，随行有留学生和留学僧，学习唐朝制度文化。
  misconceptions:
    - 误认为遣唐使是唐朝派往日本，方向反了
    - 误认为遣唐使只学习唐朝的佛教，忽略政治制度等
    - 误将遣唐使与鉴真东渡混淆，鉴真是唐朝去日本，遣唐使是日本来唐
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:遣隋使和遣唐使
  type: Concept
  subject: 历史
  title: 遣隋使和遣唐使
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为遣唐使是唐朝派往日本的使团，实际是日本来唐。
    - 能指出并纠正这一错误：时间先后颠倒：先有遣隋使，后有遣唐使。
  aliases:
    - 遣唐使
  category: 历史事件
  explanation: 隋唐时期日本派往中国的使团，促进了中日文化交流和日本改革。
  misconceptions:
    - 误认为遣唐使是唐朝派往日本的使团，实际是日本来唐。
    - 时间先后颠倒：先有遣隋使，后有遣唐使。
    - 误认为遣隋使是中国派往隋朝的使团，实际是日本来华。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:遵义会议
  type: Concept
  subject: 历史
  title: 遵义会议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遵义会议纠正了博古等人的政治路线错误，实际纠正的是军事和组织错误。
    - 能指出并纠正这一错误：认为遵义会议确立毛泽东对全党的领导地位，实际是“开始确立”。
  aliases: []
  category: 历史事件
  explanation: 1935年1月，中共中央在遵义召开政治局扩大会议，纠正了博古等人在军事上和组织上的“左”的错误，确立了毛泽东在党中央的领导地位。
  misconceptions:
    - 认为遵义会议纠正了博古等人的政治路线错误，实际纠正的是军事和组织错误。
    - 认为遵义会议确立毛泽东对全党的领导地位，实际是“开始确立”。
    - 把遵义会议放在长征之前，实际是长征途中在贵州召开的。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:遵义会议的历史意义
  type: Concept
  subject: 历史
  title: 遵义会议的历史意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遵义会议确立了“农村包围城市”道路，实际那是井冈山时期的探索。
    - 能指出并纠正这一错误：说遵义会议彻底清算了党内“左”倾错误，实际只纠正了军事和组织上的当务之急。
  aliases: []
  category: 历史意义
  explanation: 遵义会议是中国共产党历史上生死攸关的转折点，挽救了党、红军和中国革命。
  misconceptions:
    - 认为遵义会议确立了“农村包围城市”道路，实际那是井冈山时期的探索。
    - 说遵义会议彻底清算了党内“左”倾错误，实际只纠正了军事和组织上的当务之急。
    - 认为遵义会议从根本上改变了敌我力量对比，实际它扭转的是军事指挥和组织领导。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:邓小平理论
  type: Concept
  subject: 历史
  title: 邓小平理论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为邓小平理论在1992年十四大写入党章，实际是1997年十五大
    - 能指出并纠正这一错误：把邓小平理论核心说成以阶级斗争为纲，实际是围绕什么是社会主义、怎样建设社会主义
  aliases: []
  category: 指导思想
  explanation: 围绕什么是社会主义、怎样建设社会主义的根本问题，科学回答了建设中国特色社会主义的一系列基本问题，1997年中共十五大写入党章。
  misconceptions:
    - 误以为邓小平理论在1992年十四大写入党章，实际是1997年十五大
    - 把邓小平理论核心说成以阶级斗争为纲，实际是围绕什么是社会主义、怎样建设社会主义
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:郑和下西洋
  type: Concept
  subject: 历史
  title: 郑和下西洋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为郑和下西洋比欧洲航海家晚，实际早哥伦布80多年
    - 能指出并纠正这一错误：误以为郑和是下西洋的皇帝，实际是明成祖派出的使臣
  aliases:
    - 三宝太监下西洋
  category: 对外关系
  explanation: 明朝航海家郑和七次下西洋，促进中外交流，东南亚以三宝命名纪念。
  misconceptions:
    - 认为郑和下西洋比欧洲航海家晚，实际早哥伦布80多年
    - 误以为郑和是下西洋的皇帝，实际是明成祖派出的使臣
    - 将郑和七下西洋说成是殖民扩张，实际是和平外交与朝贡贸易
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S2.md
- id: concept:历史:郑成功收复台湾
  type: Concept
  subject: 历史
  title: 郑成功收复台湾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为郑成功收复台湾时台湾已被清朝管辖，实际当时是荷兰殖民统治。
    - 能指出并纠正这一错误：将郑成功误认为清军将领，实际他奉南明正朔，后其孙降清。
  aliases: []
  category: 历史事件
  explanation: 1661-1662年，郑成功率军击败荷兰殖民者，收复台湾，使台湾重回祖国怀抱。
  misconceptions:
    - 误认为郑成功收复台湾时台湾已被清朝管辖，实际当时是荷兰殖民统治。
    - 将郑成功误认为清军将领，实际他奉南明正朔，后其孙降清。
    - 以为郑成功收复台湾后台湾立即纳入清朝版图，实际郑氏政权又割据二十多年。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:郡县制
  type: Concept
  subject: 历史
  title: 郡县制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为郡县长官可以世代世袭，实际由朝廷任免
    - 能指出并纠正这一错误：认为郡县制是秦始皇首创，实际战国时已出现
  aliases: []
  category: 政治制度
  explanation: 秦朝在地方废除分封制，实行郡县制，郡县长官由朝廷任免，加强了中央对地方的控制。
  misconceptions:
    - 误以为郡县长官可以世代世袭，实际由朝廷任免
    - 认为郡县制是秦始皇首创，实际战国时已出现
    - 把郡县制与分封制混为一谈，忽略长官任免与世袭区别
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S1.md
- id: concept:历史:郡国并行制
  type: Concept
  subject: 历史
  title: 郡国并行制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为郡国并行制是汉武帝时期出现，实际是西汉初年实行。
    - 能指出并纠正这一错误：误以为汉初只有分封制，没有郡县制，实际是二者并存。
  aliases: []
  category: 政治制度
  explanation: 西汉初年实行郡县制与分封制并行，诸侯王势力强大，成为中央集权的隐患。
  misconceptions:
    - 认为郡国并行制是汉武帝时期出现，实际是西汉初年实行。
    - 误以为汉初只有分封制，没有郡县制，实际是二者并存。
    - 认为郡国并行制在七国之乱后彻底废除，实际到推恩令才逐步解决。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S4.md
- id: concept:历史:郦道元
  type: Concept
  subject: 历史
  title: 郦道元
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为郦道元是南朝人，而非北魏人。
    - 能指出并纠正这一错误：误以为《水经注》是郦道元首创的河流专著，不知是为《水经》作注。
  aliases: []
  category: 历史人物
  explanation: 北魏地理学家、文学家，著有《水经注》。
  misconceptions:
    - 认为郦道元是南朝人，而非北魏人。
    - 误以为《水经注》是郦道元首创的河流专著，不知是为《水经》作注。
    - 把郦道元与《徐霞客游记》的作者徐霞客混淆，认为他写了游记。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:郧县人
  type: Concept
  subject: 历史
  title: 郧县人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为郧县人距今约170万年，实际距今约100万年，比元谋人晚。
    - 能指出并纠正这一错误：认为郧县人使用磨制石器，实际属于旧石器时代，使用打制石器。
  aliases: []
  category: 古人类
  explanation: 发现于湖北郧阳，距今约100万年，目前考古学家发掘出3个头骨化石，能够制作和使用工具。
  misconceptions:
    - 认为郧县人距今约170万年，实际距今约100万年，比元谋人晚。
    - 认为郧县人使用磨制石器，实际属于旧石器时代，使用打制石器。
    - 把郧县人发现地记成陕西蓝田，实际发现于湖北郧阳。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:部民制度
  type: Concept
  subject: 历史
  title: 部民制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为部民是自由农民，实际是近似奴隶的私有民
    - 能指出并纠正这一错误：误认为部民属于国家，实际属于王室和贵族私有
  aliases:
    - 部民制
  category: 政治制度
  explanation: 大和国的王室和贵族拥有私有领地，领地上的居民以“部”的形式组织生产，部民是贵族的私有民，地位近似于奴隶。
  misconceptions:
    - 误认为部民是自由农民，实际是近似奴隶的私有民
    - 误认为部民属于国家，实际属于王室和贵族私有
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:郭守敬
  type: Concept
  subject: 历史
  title: 郭守敬
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认郭守敬为宋代人，他主要活动于元朝，属于元代科学家。
    - 能指出并纠正这一错误：将郭守敬的成就与祖冲之混谈，认为他编制了《大明历》，实为《授时历》。
  aliases: []
  category: 历史人物
  explanation: 元朝科学家，研制简仪等天文仪器，编成《授时历》。
  misconceptions:
    - 误认郭守敬为宋代人，他主要活动于元朝，属于元代科学家。
    - 将郭守敬的成就与祖冲之混谈，认为他编制了《大明历》，实为《授时历》。
    - 把郭守敬的简仪当作地动仪，两者用途不同，简仪用于天文观测而非地震检测。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:都江堰
  type: Concept
  subject: 历史
  title: 都江堰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为都江堰是郑国主持修建，实际为李冰父子。
    - 能指出并纠正这一错误：认为都江堰位于黄河流域，用于治理黄河水患，实际在岷江。
  aliases: []
  category: 水利工程
  explanation: 公元前256年李冰主持修建的大型水利工程，使成都平原成为天府之国。
  misconceptions:
    - 误以为都江堰是郑国主持修建，实际为李冰父子。
    - 认为都江堰位于黄河流域，用于治理黄河水患，实际在岷江。
    - 将都江堰与灵渠混淆，认为都江堰连通湘江和漓江。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:郾城大捷
  type: Concept
  subject: 历史
  title: 郾城大捷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将郾城大捷的岳飞指挥记成韩世忠，或说是金军获胜。
    - 能指出并纠正这一错误：认为郾城大捷后岳飞乘胜收复开封，实际被十二道金牌召回，被迫班师。
  aliases:
    - 郾城之战
  category: 历史事件
  explanation: 岳飞指挥岳家军在郾城大败金军主力，是抗金的重要战役。
  misconceptions:
    - 误将郾城大捷的岳飞指挥记成韩世忠，或说是金军获胜。
    - 认为郾城大捷后岳飞乘胜收复开封，实际被十二道金牌召回，被迫班师。
    - 混淆郾城大捷与黄天荡之战，后者是韩世忠抗金战役。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:重庆谈判
  type: Concept
  subject: 历史
  title: 重庆谈判
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把重庆谈判时间记为1946年，实际是1945年8月到10月
    - 能指出并纠正这一错误：误以为毛泽东未亲赴重庆，只派周恩来等代表参加
  aliases: []
  category: 历史事件
  explanation: 1945年抗日战争胜利后，中国共产党为争取和平民主，与国民党在重庆进行的谈判。
  misconceptions:
    - 把重庆谈判时间记为1946年，实际是1945年8月到10月
    - 误以为毛泽东未亲赴重庆，只派周恩来等代表参加
    - 误以为谈判成果是《停战协定》，实际签署了双十协定
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:重点进攻
  type: Concept
  subject: 历史
  title: 重点进攻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为重点进攻矛头指向东北解放区和华北解放区
    - 能指出并纠正这一错误：把重点进攻的时间记成1946年，实际是1947年3月
  aliases: []
  category: 历史事件
  explanation: 1947年3月国民党军队对陕北和山东解放区发动的重点进攻，被粉碎。
  misconceptions:
    - 误以为重点进攻矛头指向东北解放区和华北解放区
    - 把重点进攻的时间记成1946年，实际是1947年3月
    - 误以为重点进攻对象是中原解放区，实际是陕北和山东
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S1.md
- id: concept:历史:金字塔
  type: Concept
  subject: 历史
  title: 金字塔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把金字塔误认为法老的宫殿，实际是陵墓
    - 能指出并纠正这一错误：误以为最大金字塔是哈夫拉金字塔，实为胡夫金字塔
  aliases: []
  category: 历史
  explanation: 金字塔是古埃及法老的陵墓，呈角锥体状，是古埃及文明的象征，反映了社会经济发展水平和智慧。
  misconceptions:
    - 把金字塔误认为法老的宫殿，实际是陵墓
    - 误以为最大金字塔是哈夫拉金字塔，实为胡夫金字塔
    - 认为金字塔是奴隶建造的，实际多是工匠和农民
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S1.md
- id: concept:历史:金文
  type: Concept
  subject: 历史
  title: 金文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为金文是用黄金书写或刻在金属上的文字，因为“金”指黄金
    - 能指出并纠正这一错误：将金文与甲骨文混淆，说金文刻在龟甲和兽骨上
  aliases:
    - 钟鼎文
  category: 文字
  explanation: 商周时期铸刻在青铜器上的文字，因古人称铜为金而得名。
  misconceptions:
    - 误以为金文是用黄金书写或刻在金属上的文字，因为“金”指黄金
    - 将金文与甲骨文混淆，说金文刻在龟甲和兽骨上
    - 认为金文是西周时期出现的文字，商朝尚未产生金文
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S5.md
- id: concept:历史:金灭辽及北宋
  type: Concept
  subject: 历史
  title: 金灭辽及北宋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把金灭辽的时间记成1125年，误说成1127年
    - 能指出并纠正这一错误：误以为金灭北宋的同时也灭了辽，实际金灭辽在先
  aliases:
    - 靖康之变
  category: 历史事件
  explanation: 1125年，金灭辽；1127年，金灭北宋，史称靖康之变。
  misconceptions:
    - 把金灭辽的时间记成1125年，误说成1127年
    - 误以为金灭北宋的同时也灭了辽，实际金灭辽在先
    - 将靖康之变说成是辽灭北宋，朝代对应错误
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:金瓶掣签制度
  type: Concept
  subject: 历史
  title: 金瓶掣签制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为金瓶掣签制度在清朝初年就已确立，实际是1793年《钦定藏内善后章程》规定。
    - 能指出并纠正这一错误：把金瓶掣签等同于皇帝直接指定达赖班禅，忽略掣签后仍需报朝廷批准。
  aliases:
    - 金瓶掣签
  category: 历史制度
  explanation: 1793年《钦定藏内善后章程》规定，达赖、班禅等大活佛转世需通过金瓶掣签确定，并报朝廷批准。
  misconceptions:
    - 误认为金瓶掣签制度在清朝初年就已确立，实际是1793年《钦定藏内善后章程》规定。
    - 把金瓶掣签等同于皇帝直接指定达赖班禅，忽略掣签后仍需报朝廷批准。
    - 以为金瓶掣签由达赖或班禅自行主持，实际须由驻藏大臣监视掣签。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:金田起义
  type: Concept
  subject: 历史
  title: 金田起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为金田起义发生在1853年，实际是1851年
    - 能指出并纠正这一错误：把金田起义与定都天京混淆，起义在广西，定都在南京
  aliases: []
  category: 历史事件
  explanation: 1851年1月11日洪秀全在广西桂平金田村发动的武装起义，建号太平天国。
  misconceptions:
    - 误以为金田起义发生在1853年，实际是1851年
    - 把金田起义与定都天京混淆，起义在广西，定都在南京
    - 认为建号太平天国是在定都后，实际起义当日已建号
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S3.md
- id: concept:历史:金的建立
  type: Concept
  subject: 历史
  title: 金的建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把金建立时间记成1115年，误说成1125年
    - 能指出并纠正这一错误：误以为金是由契丹族建立的，实际是女真族
  aliases:
    - 大金
  category: 历史事件
  explanation: 1115年，女真首领阿骨打建立女真政权，国号大金，定都会宁府。
  misconceptions:
    - 把金建立时间记成1115年，误说成1125年
    - 误以为金是由契丹族建立的，实际是女真族
    - 将金都城会宁府误说成中都或开封
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S2.md
- id: concept:历史:金砖国家
  type: Concept
  subject: 历史
  title: 金砖国家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为金砖国家成立之初就有南非，不知2011年南非才加入。
    - 能指出并纠正这一错误：认为金砖国家是发达国家集团，包括美国、日本等。
  aliases:
    - BRICS
  category: 外交概念
  explanation: 由巴西、俄罗斯、印度、中国、南非等新兴市场国家组成的合作机制，2011年南非加入后改称金砖国家。
  misconceptions:
    - 认为金砖国家成立之初就有南非，不知2011年南非才加入。
    - 认为金砖国家是发达国家集团，包括美国、日本等。
    - 认为韩国也是金砖国家成员，混淆新兴市场国家名单。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S3.md
- id: concept:历史:鉴真东渡
  type: Concept
  subject: 历史
  title: 鉴真东渡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为鉴真是日本僧人，实际是唐朝高僧东渡日本。
    - 能指出并纠正这一错误：误认为鉴真东渡方向是日本到中国，实际是从中国到日本。
  aliases: []
  category: 历史事件
  explanation: 唐朝高僧鉴真六次东渡日本，传播佛法及中国文化，对中日文化交流贡献巨大。
  misconceptions:
    - 误认为鉴真是日本僧人，实际是唐朝高僧东渡日本。
    - 误认为鉴真东渡方向是日本到中国，实际是从中国到日本。
    - 误认为鉴真第一次东渡就成功，实际六次才成功。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:钓鱼岛及其附属岛屿
  type: Concept
  subject: 历史
  title: 钓鱼岛及其附属岛屿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为钓鱼岛是明朝才被中国发现，实际早在明清前已有记载。
    - 能指出并纠正这一错误：误认为钓鱼岛在清朝时才纳入行政管辖，实际明清时期已纳入。
  aliases:
    - 钓鱼岛
  category: 历史地理
  explanation: 钓鱼岛及其附属岛屿是中国领土不可分割的一部分，中国人最早发现、命名和利用，明清时期已纳入行政管辖。
  misconceptions:
    - 误认为钓鱼岛是明朝才被中国发现，实际早在明清前已有记载。
    - 误认为钓鱼岛在清朝时才纳入行政管辖，实际明清时期已纳入。
    - 将钓鱼岛与南海诸岛混为一谈，分属不同海域和行政体系。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:铁制农具和牛耕
  type: Concept
  subject: 历史
  title: 铁制农具和牛耕
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将铁制农具和牛耕的出现时间提前到西周，实际是春秋后期才出现。
    - 能指出并纠正这一错误：误认为牛耕出现后立即普及，实际推广过程缓慢，战国时期才逐渐普及。
  aliases:
    - 铁犁牛耕
  category: 生产技术
  explanation: 春秋后期出现，使农业深耕细作、山林开发、耕地扩大成为可能，是农业生产力水平提高的重要标志。
  misconceptions:
    - 将铁制农具和牛耕的出现时间提前到西周，实际是春秋后期才出现。
    - 误认为牛耕出现后立即普及，实际推广过程缓慢，战国时期才逐渐普及。
    - 把铁制农具和牛耕的出现归功于某位历史人物，实际是劳动人民长期实践产物。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S2.md
- id: concept:历史:铁器牛耕
  type: Concept
  subject: 历史
  title: 铁器牛耕
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为铁器牛耕在战国时期才产生，忽略春秋时期已出现铁农具。
    - 能指出并纠正这一错误：认为铁器牛耕的推广是商鞅变法的措施内容，实为生产力发展。
  aliases:
    - 铁犁牛耕
  category: 经济概念
  explanation: 战国时期铁制农具和牛耕的推广，提高了农业生产效率。
  misconceptions:
    - 误以为铁器牛耕在战国时期才产生，忽略春秋时期已出现铁农具。
    - 认为铁器牛耕的推广是商鞅变法的措施内容，实为生产力发展。
    - 因果倒置，认为是商鞅变法导致铁器牛耕出现，实际是生产力变革引发变法需求。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S3.md
- id: concept:历史:铁路时代
  type: Concept
  subject: 历史
  title: 铁路时代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为铁路时代开始于瓦特改良蒸汽机时，混淆了开始标志。
    - 能指出并纠正这一错误：把斯蒂芬森的火车试车成功记成富尔顿的汽船试航。
  aliases: []
  category: 历史阶段
  explanation: 1825年斯蒂芬森设计的蒸汽机车试车成功，标志着铁路时代的开始，为社会提供了快捷、廉价、便利的交通。
  misconceptions:
    - 认为铁路时代开始于瓦特改良蒸汽机时，混淆了开始标志。
    - 把斯蒂芬森的火车试车成功记成富尔顿的汽船试航。
    - 认为蒸汽机车是为了铁路运输而发明，颠倒了因果。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:铸牢中华民族共同体意识
  type: Concept
  subject: 历史
  title: 铸牢中华民族共同体意识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“中华民族共同体意识”理解为要消除民族差异，等同于“汉化”或“同化”。
    - 能指出并纠正这一错误：认为铸牢共同体意识只是针对少数民族，汉族不需要增强这一意识。
  aliases:
    - 中华民族共同体意识
  category: 民族政策
  explanation: 引导各民族牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念，加强民族团结。
  misconceptions:
    - 将“中华民族共同体意识”理解为要消除民族差异，等同于“汉化”或“同化”。
    - 认为铸牢共同体意识只是针对少数民族，汉族不需要增强这一意识。
    - 把“休戚与共”等四个“与共”混淆为“命运共同体”的简单重复，忽略其具体内涵。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:锺繇
  type: Concept
  subject: 历史
  title: 锺繇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为锺繇是东晋书法家，实际他是曹魏时人。
    - 能指出并纠正这一错误：误以为锺繇擅长草书，实际他尤擅楷书。
  aliases: []
  category: 历史人物
  explanation: 曹魏时的书法名家，尤擅楷书，刚柔兼备。
  misconceptions:
    - 误认为锺繇是东晋书法家，实际他是曹魏时人。
    - 误以为锺繇擅长草书，实际他尤擅楷书。
    - 误将《兰亭集序》归为锺繇所作，实际是王羲之作品。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:镇南关大捷
  type: Concept
  subject: 历史
  title: 镇南关大捷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为镇南关大捷由刘铭传指挥，实际是老将冯子材。
    - 能指出并纠正这一错误：错误认为镇南关大捷发生在1884年，实际是1885年3月。
  aliases: []
  category: 历史事件
  explanation: 1885年3月，老将冯子材率军取得镇南关大捷，扭转战局，是清军抗法的重要胜利。
  misconceptions:
    - 误认为镇南关大捷由刘铭传指挥，实际是老将冯子材。
    - 错误认为镇南关大捷发生在1884年，实际是1885年3月。
    - 误认为大捷后清军乘胜攻入越南并收复河内，实际未继续追击。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:镇压反革命运动
  type: Concept
  subject: 历史
  title: 镇压反革命运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为镇压反革命运动主要针对刑事犯罪分子，错把对象扩大化。
    - 能指出并纠正这一错误：把镇压反革命运动的时间记为1951年，与西藏和平解放时间混淆。
  aliases:
    - 镇压反革命
  category: 历史事件
  explanation: 1950年12月开始，扫除国民党遗留在大陆的反革命残余势力，巩固人民政权，配合土地改革和抗美援朝。
  misconceptions:
    - 认为镇压反革命运动主要针对刑事犯罪分子，错把对象扩大化。
    - 把镇压反革命运动的时间记为1951年，与西藏和平解放时间混淆。
    - 误认为镇压反革命运动是在抗美援朝战争结束后才开始，因果倒置。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S2.md
- id: concept:历史:长安城
  type: Concept
  subject: 历史
  title: 长安城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为长安城没有外郭城，只有宫城和皇城
    - 能指出并纠正这一错误：认为长安城是政治中心而非经济文化交流中心
  aliases: []
  category: 城市
  explanation: 唐朝都城，以隋朝大兴城为基础扩建，分为宫城、皇城和外郭城，实行坊市制度，是政治、经济、文化交流中心和国际大都市。
  misconceptions:
    - 误以为长安城没有外郭城，只有宫城和皇城
    - 认为长安城是政治中心而非经济文化交流中心
    - 把长安城的坊市制度与北宋东京相混淆
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S3.md
- id: concept:历史:长征精神
  type: Concept
  subject: 历史
  title: 长征精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把长征精神等同于抗战精神，认为它形成于抗日战争时期。
    - 能指出并纠正这一错误：只强调长征中的‘吃苦’，忽略其不畏强敌、不怕牺牲、一往无前的革命英雄主义。
  aliases: []
  category: 历史概念
  explanation: 红军在长征中展现的不畏强敌、不怕牺牲、坚韧不拔、英勇顽强、无坚不摧、一往无前的革命精神。
  misconceptions:
    - 把长征精神等同于抗战精神，认为它形成于抗日战争时期。
    - 只强调长征中的‘吃苦’，忽略其不畏强敌、不怕牺牲、一往无前的革命英雄主义。
    - 误以为长征精神是长征胜利后才有的，忽略它是在长征过程中逐渐形成并展现的。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:长江三峡水利枢纽工程
  type: Concept
  subject: 历史
  title: 长江三峡水利枢纽工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把1997年大江截流误记为2003年蓄水，甚至认为截流即全部完工并开始发电。
    - 能指出并纠正这一错误：误将三峡工程说成“世界上最早的水利工程”，其实它是规模最大、综合效益最广，并非时间最早。
  aliases:
    - 三峡工程
  category: 重大工程
  explanation: 1997年大江截流，世界上规模最大、综合效益最广泛的水利水电工程。
  misconceptions:
    - 把1997年大江截流误记为2003年蓄水，甚至认为截流即全部完工并开始发电。
    - 误将三峡工程说成“世界上最早的水利工程”，其实它是规模最大、综合效益最广，并非时间最早。
    - 将三峡工程与葛洲坝工程混淆，认为葛洲坝是三峡三期工程，实际葛洲坝先于三峡建成。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:门户开放政策
  type: Concept
  subject: 历史
  title: 门户开放政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为美国提出门户开放是为了维护中国主权，实际是为分享列强在华利益。
    - 能指出并纠正这一错误：误以为门户开放政策取消了各国势力范围，实际承认势力范围并求均等贸易机会。
  aliases:
    - 门户开放照会
  category: 历史事件
  explanation: 1899年美国提出门户开放照会，承认列强在华势力范围和既得特权，同时要求各国租借地和势力范围内享有均等贸易机会，得到各国同意。
  misconceptions:
    - 误以为美国提出门户开放是为了维护中国主权，实际是为分享列强在华利益。
    - 误以为门户开放政策取消了各国势力范围，实际承认势力范围并求均等贸易机会。
    - 误以为门户开放政策得到列强一致赞同，实际各国基本同意但存在矛盾。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S4.md
- id: concept:历史:闭关政策
  type: Concept
  subject: 历史
  title: 闭关政策
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为闭关政策是完全不通商贸，实际是严格限制，仅保留广州一口通商。
    - 能指出并纠正这一错误：将闭关政策与明朝海禁完全等同，忽略其由十三行垄断贸易的特点。
  aliases:
    - 闭关锁国
  category: 历史
  explanation: 清朝严格限制对外贸易，仅开放广州一口通商，由广州十三行垄断贸易，导致中国逐渐落后于世界潮流。
  misconceptions:
    - 认为闭关政策是完全不通商贸，实际是严格限制，仅保留广州一口通商。
    - 将闭关政策与明朝海禁完全等同，忽略其由十三行垄断贸易的特点。
    - 误以为闭关政策限制一切对外交往，实际是限制对外贸易，民间往来未全禁。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:阅读历史地图的方法
  type: Concept
  subject: 历史
  title: 阅读历史地图的方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：忽略图例，如不知地图中箭头代表行军路线，导致信息解读错误。
    - 能指出并纠正这一错误：只看地图不看书本内容，无法将地图信息与历史事件关联。
  aliases:
    - 历史地图阅读
  category: 学史方法
  explanation: 从看图名、看图例、看图注、将图中信息与课文内容对照四个方面获取历史地图中的信息。
  misconceptions:
    - 忽略图例，如不知地图中箭头代表行军路线，导致信息解读错误。
    - 只看地图不看书本内容，无法将地图信息与历史事件关联。
    - 把图注当作图例，不结合图注说明就判断地图所反映的时间。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S7.md
- id: concept:历史:阎立本
  type: Concept
  subject: 历史
  title: 阎立本
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《步辇图》当作吴道子的作品，实际是阎立本所作
    - 能指出并纠正这一错误：把阎立本说成隋朝画家，实际是唐朝画家
  aliases: []
  category: 历史人物
  explanation: 唐朝画家，人物画神形兼备。
  misconceptions:
    - 误将《步辇图》当作吴道子的作品，实际是阎立本所作
    - 把阎立本说成隋朝画家，实际是唐朝画家
    - 误认为阎立本画风是泼墨写意，实际是工笔重彩
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S5.md
- id: concept:历史:阪泉之战
  type: Concept
  subject: 历史
  title: 阪泉之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把阪泉之战误记为黄帝与蚩尤战，实际是黄帝与炎帝战
    - 能指出并纠正这一错误：认为阪泉之战发生在涿鹿之战后，实际是涿鹿之战前
  aliases: []
  category: 历史事件
  explanation: 黄帝与炎帝之间的战役，炎帝失败归顺，两大部落结盟。
  misconceptions:
    - 把阪泉之战误记为黄帝与蚩尤战，实际是黄帝与炎帝战
    - 认为阪泉之战发生在涿鹿之战后，实际是涿鹿之战前
    - 误以为阪泉之战后炎帝被杀，实际是归顺结盟
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:阿古柏侵占新疆
  type: Concept
  subject: 历史
  title: 阿古柏侵占新疆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为阿古柏只得到英国支持，实际英俄都支持。
    - 能指出并纠正这一错误：错误认为阿古柏占领新疆全境，实际他只占南疆和北疆部分地区。
  aliases: []
  category: 历史事件
  explanation: 1865年，中亚浩罕国军事头目阿古柏入侵新疆，占领南疆和北疆部分地区，英俄支持其侵略。
  misconceptions:
    - 误认为阿古柏只得到英国支持，实际英俄都支持。
    - 错误认为阿古柏占领新疆全境，实际他只占南疆和北疆部分地区。
    - 误认为阿古柏入侵新疆时间在1875年，实际是1865年。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:阿拉伯帝国
  type: Concept
  subject: 历史
  title: 阿拉伯帝国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为阿拉伯帝国疆域最大时仅跨亚欧两洲，实际跨亚、欧、非三洲
    - 能指出并纠正这一错误：误认为阿拉伯帝国是穆罕默德亲自建立的大帝国，实际是在其逝世后扩张而来
  aliases:
    - 阿拉伯大帝国
  category: 历史事件
  explanation: 穆罕默德逝世后，继承者不断扩张，至8世纪中期建立起地跨亚、欧、非三大洲的大帝国，是当时世界上疆域最大的帝国。
  misconceptions:
    - 误认为阿拉伯帝国疆域最大时仅跨亚欧两洲，实际跨亚、欧、非三洲
    - 误认为阿拉伯帝国是穆罕默德亲自建立的大帝国，实际是在其逝世后扩张而来
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:阿拉伯数字
  type: Concept
  subject: 历史
  title: 阿拉伯数字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为阿拉伯数字是阿拉伯人发明的，实际是改造古印度计数法
    - 能指出并纠正这一错误：误认为阿拉伯数字在穆罕默德时代已传至欧洲，实际是后来阿拉伯人传播的
  aliases:
    - 印度-阿拉伯数字
  category: 科技成就
  explanation: 阿拉伯人改造了古印度人的计数法，形成了我们现在使用的“阿拉伯数字”，并创造了完整的代数学。
  misconceptions:
    - 误认为阿拉伯数字是阿拉伯人发明的，实际是改造古印度计数法
    - 误认为阿拉伯数字在穆罕默德时代已传至欧洲，实际是后来阿拉伯人传播的
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:阿拉伯文化
  type: Concept
  subject: 历史
  title: 阿拉伯文化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《天方夜谭》是古希腊作品，实际是阿拉伯文学瑰宝
    - 能指出并纠正这一错误：误认为阿拉伯文化完全是外来文化，不包含自主创造，实际有特色创造
  aliases:
    - 伊斯兰文化
  category: 文化成就
  explanation: 阿拉伯人在吸收、消化外来文化的基础上创造了有自己特色的文化，包括阿拉伯数字、代数学、医学经典和文学瑰宝《天方夜谭》等。
  misconceptions:
    - 误认为《天方夜谭》是古希腊作品，实际是阿拉伯文学瑰宝
    - 误认为阿拉伯文化完全是外来文化，不包含自主创造，实际有特色创造
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C4/sections/S1.md
- id: concept:历史:阿部规秀
  type: Concept
  subject: 历史
  title: 阿部规秀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为阿部规秀是在平型关大捷中被击毙，实际是黄土岭伏击战。
    - 能指出并纠正这一错误：以为阿部规秀是日军师团长，实际是独立混成旅团旅团长。
  aliases: []
  category: 历史人物
  explanation: 日军中将，在黄土岭伏击战中被击毙，被称为“名将之花”。
  misconceptions:
    - 认为阿部规秀是在平型关大捷中被击毙，实际是黄土岭伏击战。
    - 以为阿部规秀是日军师团长，实际是独立混成旅团旅团长。
    - 把阿部规秀之死归于国民党军队，实际是八路军击毙。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S2.md
- id: concept:历史:陆游
  type: Concept
  subject: 历史
  title: 陆游
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把辛弃疾的《永遇乐·京口北固亭怀古》说成是陆游的词作。
    - 能指出并纠正这一错误：认为陆游是南宋初年抗金名将，实际他是文人，并未领兵作战。
  aliases: []
  category: 历史人物
  explanation: 南宋爱国诗人，作品抒发爱国情怀，如《示儿》。
  misconceptions:
    - 误把辛弃疾的《永遇乐·京口北固亭怀古》说成是陆游的词作。
    - 认为陆游是南宋初年抗金名将，实际他是文人，并未领兵作战。
    - 将陆游的《示儿》解读为表达个人爱情失意，忽略其渴望国家统一的爱国主题。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S7.md
- id: concept:历史:陈树湘
  type: Concept
  subject: 历史
  title: 陈树湘
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为陈树湘是红三十四师军团长，实际他是师长。
    - 能指出并纠正这一错误：把陈树湘牺牲说成在飞夺泸定桥战斗中，实际是在湘江战役。
  aliases: []
  category: 历史人物
  explanation: 红三十四师师长，在湘江战役中掩护主力，伤重被俘后绞断肠子牺牲。
  misconceptions:
    - 认为陈树湘是红三十四师军团长，实际他是师长。
    - 把陈树湘牺牲说成在飞夺泸定桥战斗中，实际是在湘江战役。
    - 认为陈树湘在被俘前就牺牲，实际是伤重被俘后绞肠牺牲。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:陈桥兵变
  type: Concept
  subject: 历史
  title: 陈桥兵变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为陈桥兵变发生在北宋建立之后，实际是建立的关键事件。
    - 能指出并纠正这一错误：以为是赵匡胤主动策划兵变，实际是被部下黄袍加身。
  aliases:
    - 陈桥驿兵变
  category: 历史事件
  explanation: 960年，赵匡胤在陈桥驿被部下黄袍加身，拥立为帝，史称陈桥兵变，是北宋建立的关键事件。
  misconceptions:
    - 认为陈桥兵变发生在北宋建立之后，实际是建立的关键事件。
    - 以为是赵匡胤主动策划兵变，实际是被部下黄袍加身。
    - 把陈桥兵变与“黄袍加身”当成两件事，实际是一体的。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:陈胜、吴广起义
  type: Concept
  subject: 历史
  title: 陈胜、吴广起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将起义时间记成公元前221年或公元前206年，与秦统一、秦亡时间混淆。
    - 能指出并纠正这一错误：误认为起义直接推翻秦朝，实际秦朝是被刘邦攻灭。
  aliases:
    - 大泽乡起义
    - 陈胜吴广起义
  category: 历史事件
  explanation: 公元前209年，陈胜、吴广在大泽乡发动中国历史上第一次农民大起义，反抗秦朝暴政。
  misconceptions:
    - 将起义时间记成公元前221年或公元前206年，与秦统一、秦亡时间混淆。
    - 误认为起义直接推翻秦朝，实际秦朝是被刘邦攻灭。
    - 误以为大泽乡起义是项羽、刘邦发起的，张冠李戴。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S2.md
- id: concept:历史:陶器
  type: Concept
  subject: 历史
  title: 陶器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为陶器最早出现于青铜器时代，实际我国在新石器时代就已有制陶技术。
    - 能指出并纠正这一错误：认为陶器是打制石器时代的代表器具，实际陶器在新石器时代广泛使用。
  aliases: []
  category: 发明创造
  explanation: 我国是最早出现制陶技术的国家，陶器的制作和使用对人类生活有重要意义。
  misconceptions:
    - 认为陶器最早出现于青铜器时代，实际我国在新石器时代就已有制陶技术。
    - 认为陶器是打制石器时代的代表器具，实际陶器在新石器时代广泛使用。
    - 把陶器与瓷器混为一谈，认为我国最早发明的是瓷器，实际陶器更早。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S1.md
- id: concept:历史:陶寺古城遗址
  type: Concept
  subject: 历史
  title: 陶寺古城遗址
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为陶寺古城遗址在长江流域，实际位于黄河中游的晋南地区。
    - 能指出并纠正这一错误：把陶寺遗址当成夏朝都城，实际其年代距今约4300—4000年，早于夏朝。
  aliases: []
  category: 考古遗址
  explanation: 距今约4300—4000年，位于中原地区，反映了中原文明的崛起。
  misconceptions:
    - 误以为陶寺古城遗址在长江流域，实际位于黄河中游的晋南地区。
    - 把陶寺遗址当成夏朝都城，实际其年代距今约4300—4000年，早于夏朝。
    - 认为陶寺文化反映的是长江文明崛起，实为中原文明兴起的重要标志。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:隆庆和议
  type: Concept
  subject: 历史
  title: 隆庆和议
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把隆庆和议的对象写成瓦剌，实际是蒙古俺答汗
    - 能指出并纠正这一错误：认为隆庆和议后明朝与蒙古再无战事，实际仍有局部冲突
  aliases: []
  category: 民族关系
  explanation: 1571年明朝封蒙古俺答汗为王，达成通贡互市协议，结束敌对状态。
  misconceptions:
    - 把隆庆和议的对象写成瓦剌，实际是蒙古俺答汗
    - 认为隆庆和议后明朝与蒙古再无战事，实际仍有局部冲突
    - 误以为隆庆和议是隆庆帝亲自与俺答汗谈判，实际是封贡互市协议
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:隋朝大运河
  type: Concept
  subject: 历史
  title: 隋朝大运河
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误说大运河以长安为中心，实际以洛阳为中心
    - 能指出并纠正这一错误：认为北至长安、南至广州，实际北抵涿郡、南至余杭
  aliases:
    - 大运河
    - 大运河的开通
  category: 历史事件
  explanation: 隋炀帝时期开凿的贯通南北的大运河，以洛阳为中心，北抵涿郡，南至余杭，连接五大水系，全长2700多千米，加强了南北交流。
  misconceptions:
    - 误说大运河以长安为中心，实际以洛阳为中心
    - 认为北至长安、南至广州，实际北抵涿郡、南至余杭
    - 少算一条水系，以为是四大水系，实际连接五大水系
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S1.md
- id: concept:历史:隋朝建立
  type: Concept
  subject: 历史
  title: 隋朝建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为杨广建立隋朝，实际杨坚于581年建立
    - 能指出并纠正这一错误：把建立时间记成589年，误与统一混为一谈
  aliases:
    - 隋文帝建立隋朝
  category: 历史事件
  explanation: 581年，外戚杨坚夺取北周政权，建立隋朝，定都大兴，即隋文帝。
  misconceptions:
    - 误认为杨广建立隋朝，实际杨坚于581年建立
    - 把建立时间记成589年，误与统一混为一谈
    - 误以为定都洛阳，实际定都大兴
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S1.md
- id: concept:历史:隋朝的灭亡
  type: Concept
  subject: 历史
  title: 隋朝的灭亡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为618年李渊灭隋，实际隋炀帝被杀，李渊称帝建唐
    - 能指出并纠正这一错误：把灭亡原因归于农民起义直接推翻，实际是暴政激化矛盾
  aliases:
    - 隋朝速亡
  category: 历史事件
  explanation: 隋炀帝暴政导致农民起义，618年隋炀帝被杀，隋朝灭亡，存在仅30多年。
  misconceptions:
    - 误认为618年李渊灭隋，实际隋炀帝被杀，李渊称帝建唐
    - 把灭亡原因归于农民起义直接推翻，实际是暴政激化矛盾
    - 误认为隋朝存在约50年，实际仅37年左右
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S1.md
- id: concept:历史:隋朝的统一
  type: Concept
  subject: 历史
  title: 隋朝的统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为581年杨坚统一全国，实际589年灭陈完成统一
    - 能指出并纠正这一错误：误认为统一者是隋炀帝，实际是隋文帝杨坚
  aliases:
    - 隋统一
    - 隋统一全国
    - 隋灭陈
  category: 历史事件
  explanation: 581年杨坚建立隋朝，589年灭陈统一全国，结束了长期分裂局面，顺应了民族交融趋势，促进了经济文化交流。
  misconceptions:
    - 误以为581年杨坚统一全国，实际589年灭陈完成统一
    - 误认为统一者是隋炀帝，实际是隋文帝杨坚
    - 认为统一后民族矛盾彻底消除，实际只是顺应融合趋势
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S2.md
- id: concept:历史:隋朝经济恢复措施
  type: Concept
  subject: 历史
  title: 隋朝经济恢复措施
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为统一币制与度量衡是秦朝专属，隋朝没有此类措施
    - 能指出并纠正这一错误：误认为编订户籍是明朝张居正首创，不知道隋朝已推行
  aliases:
    - 隋朝巩固统治措施
  category: 历史事件
  explanation: 隋朝发展经济，编订户籍，减轻赋役，统一币制和度量衡，加强中央集权，使国力强盛。
  misconceptions:
    - 误以为统一币制与度量衡是秦朝专属，隋朝没有此类措施
    - 误认为编订户籍是明朝张居正首创，不知道隋朝已推行
    - 颠倒因果：说是经济措施导致隋朝灭亡，实际是暴政导致
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S1.md
- id: concept:历史:隋炀帝的暴政
  type: Concept
  subject: 历史
  title: 隋炀帝的暴政
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为营建东都是隋文帝，实际是隋炀帝所为
    - 能指出并纠正这一错误：把征辽东说成征西域，实际是三次征讨辽东
  aliases:
    - 隋炀帝残暴统治
  category: 历史事件
  explanation: 隋炀帝急功近利，征发大量劳动力营建东都、开凿运河、征辽东，导致民不聊生，社会矛盾激化。
  misconceptions:
    - 误认为营建东都是隋文帝，实际是隋炀帝所为
    - 把征辽东说成征西域，实际是三次征讨辽东
    - 认为隋朝灭亡导致暴政，实际暴政导致灭亡
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S1.md
- id: concept:历史:雅克萨之战
  type: Concept
  subject: 历史
  title: 雅克萨之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为雅克萨之战发生在《尼布楚条约》之后，实际是战争后签订条约。
    - 能指出并纠正这一错误：误认为清军在雅克萨之战中战败，被迫谈判，实际是两次击败俄军。
  aliases: []
  category: 历史事件
  explanation: 17世纪中期，俄国入侵黑龙江流域，康熙帝两次击败俄军，迫使俄国谈判，最终签订《尼布楚条约》。
  misconceptions:
    - 误认为雅克萨之战发生在《尼布楚条约》之后，实际是战争后签订条约。
    - 误认为清军在雅克萨之战中战败，被迫谈判，实际是两次击败俄军。
    - 将雅克萨之战的时间记为17世纪末（如1690年）而不精确，实际在1685-1686年。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S4.md
- id: concept:历史:雅典民主政治
  type: Concept
  subject: 历史
  title: 雅典民主政治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为雅典民主是全体居民参与，实际仅成年男性公民享有。
    - 能指出并纠正这一错误：混淆伯里克利与梭伦改革，认为民主政治是伯里克利确立。
  aliases:
    - 雅典民主
  category: 政治制度
  explanation: 雅典通过改革建立的奴隶制民主政治，伯里克利时期达到高峰，公民大会是最高权力机构。
  misconceptions:
    - 误认为雅典民主是全体居民参与，实际仅成年男性公民享有。
    - 混淆伯里克利与梭伦改革，认为民主政治是伯里克利确立。
    - 认为公民大会是伯里克利时期才出现，实际在此之前已存在。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C2/sections/S1.md
- id: concept:历史:雅各宾派
  type: Concept
  subject: 历史
  title: 雅各宾派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将雅各宾派当作英国资产阶级革命中的派别，误以为罗伯斯庇尔与克伦威尔同时代。
    - 能指出并纠正这一错误：认为雅各宾派上台标志法国大革命结束，实际是其将革命推向高潮后失势。
  aliases: []
  category: 政治派别
  explanation: 以罗伯斯庇尔为首的激进派别，采取严厉措施将法国大革命推向高潮，后因打击面过宽而失势。
  misconceptions:
    - 将雅各宾派当作英国资产阶级革命中的派别，误以为罗伯斯庇尔与克伦威尔同时代。
    - 认为雅各宾派上台标志法国大革命结束，实际是其将革命推向高潮后失势。
    - 混淆雅各宾派与吉伦特派，误以为吉伦特派首领是罗伯斯庇尔。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C6/sections/S1.md
- id: concept:历史:雕版印刷术
  type: Concept
  subject: 历史
  title: 雕版印刷术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为雕版印刷术是北宋毕昇发明的，实际唐朝已出现
    - 能指出并纠正这一错误：将雕版印刷术的出现时间说成隋朝
  aliases:
    - 雕版印刷
  category: 科技发明
  explanation: 唐朝时出现的印刷技术，在版料上雕刻图文进行印刷，促进了文化传播。
  misconceptions:
    - 误认为雕版印刷术是北宋毕昇发明的，实际唐朝已出现
    - 将雕版印刷术的出现时间说成隋朝
    - 误以为雕版印刷术出现后立即取代手工抄写，实际并未完全取代
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:雷锋精神
  type: Concept
  subject: 历史
  title: 雷锋精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将雷锋精神简化为“做好事”，忽略其爱党爱国、干一行爱一行等丰富内涵。
    - 能指出并纠正这一错误：误把雷锋当作党的好干部，与焦裕禄的事迹相混淆，导致人物错位。
  aliases: []
  category: 精神品质
  explanation: 热爱党、热爱祖国、热爱社会主义，服务人民、助人为乐，干一行爱一行、专一行精一行，锐意进取、自强不息，艰苦奋斗、勤俭节约的精神。
  misconceptions:
    - 误将雷锋精神简化为“做好事”，忽略其爱党爱国、干一行爱一行等丰富内涵。
    - 误把雷锋当作党的好干部，与焦裕禄的事迹相混淆，导致人物错位。
    - 误认为雷锋精神只存在于60年代，与当代无关，否认其时代价值。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S2.md
- id: concept:历史:霸权主义与强权政治
  type: Concept
  subject: 历史
  title: 霸权主义与强权政治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将北约组织本身等同于霸权主义，忽略北约只是军事集团而非政策
    - 能指出并纠正这一错误：认为霸权主义只存在于冷战结束后，实际上冷战期间美苏也有类似表现
  aliases: []
  category: 政治
  explanation: 以美国为代表的西方国家推行霸权主义和强权政治，引发地区冲突，威胁世界和平与发展。
  misconceptions:
    - 将北约组织本身等同于霸权主义，忽略北约只是军事集团而非政策
    - 认为霸权主义只存在于冷战结束后，实际上冷战期间美苏也有类似表现
    - 把霸权主义与强权政治只归因于美国，忽略其他国家也有推行此类政策
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:青花瓷
  type: Concept
  subject: 历史
  title: 青花瓷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认青花瓷是宋代五大名窑烧制的
    - 能指出并纠正这一错误：认为青花瓷在明朝才首次出现
  aliases: []
  category: 历史概念
  explanation: 元朝烧制的青花瓷，代表了制瓷技术的高超水平。
  misconceptions:
    - 误认青花瓷是宋代五大名窑烧制的
    - 认为青花瓷在明朝才首次出现
    - 将青花瓷的釉色与唐三彩相混淆
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:青苗法
  type: Concept
  subject: 历史
  title: 青苗法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将青苗法当作明朝张居正推行的一条鞭法，说成是赋税合并制度。
    - 能指出并纠正这一错误：误认为青苗法是官府直接给农民发粮食救灾，无需偿还，比如说是无偿赈济。
  aliases: []
  category: 变法措施
  explanation: 官府在青黄不接时向农民提供贷款或谷物，收获时偿还，限制高利贷。
  misconceptions:
    - 误将青苗法当作明朝张居正推行的一条鞭法，说成是赋税合并制度。
    - 误认为青苗法是官府直接给农民发粮食救灾，无需偿还，比如说是无偿赈济。
    - 误把青苗法归为范仲淹庆历新政的内容，而非王安石变法措施。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S1.md
- id: concept:历史:青藏铁路
  type: Concept
  subject: 历史
  title: 青藏铁路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把青藏铁路全线通车时间记成2008年，与北京奥运会同年。
    - 能指出并纠正这一错误：误认为青藏铁路是世界最长的铁路，忽略了‘高原铁路’的限定。
  aliases: []
  category: 史实
  explanation: 2006年7月1日全线通车，全长1956千米，是世界上海拔最高、线路最长的高原铁路。
  misconceptions:
    - 把青藏铁路全线通车时间记成2008年，与北京奥运会同年。
    - 误认为青藏铁路是世界最长的铁路，忽略了‘高原铁路’的限定。
    - 将青藏铁路与青藏公路混淆，以为2006年通车的是公路。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:靖康之变
  type: Concept
  subject: 历史
  title: 靖康之变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把靖康之变的时间记为1126年，其实1127年金军攻破东京掳走二帝。
    - 能指出并纠正这一错误：以为靖康之变只掳走宋徽宗，忽略宋钦宗也被掳，北宋灭亡。
  aliases:
    - 靖康之耻
  category: 历史事件
  explanation: 1127年金军攻破东京，掳走宋徽宗和宋钦宗，北宋灭亡，史称靖康之变。
  misconceptions:
    - 误把靖康之变的时间记为1126年，其实1127年金军攻破东京掳走二帝。
    - 以为靖康之变只掳走宋徽宗，忽略宋钦宗也被掳，北宋灭亡。
    - 误认为靖康之变后南宋直接灭亡，实际是北宋灭亡，南宋偏安江南。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S3.md
- id: concept:历史:靖难之役
  type: Concept
  subject: 历史
  title: 靖难之役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为朱棣是朱元璋指定继承人，实际是起兵夺位
    - 能指出并纠正这一错误：混淆建文帝和明太祖，以为建文帝是朱元璋的儿子，实际是孙子
  aliases: []
  category: 历史事件
  explanation: 明太祖去世后，建文帝削藩，燕王朱棣起兵夺取帝位，史称靖难之役。
  misconceptions:
    - 认为朱棣是朱元璋指定继承人，实际是起兵夺位
    - 混淆建文帝和明太祖，以为建文帝是朱元璋的儿子，实际是孙子
    - 将靖难之役说成是农民起义，实际是皇室内部争夺帝位的战争
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S1.md
- id: concept:历史:非典型性肺炎疫情
  type: Concept
  subject: 历史
  title: 非典型性肺炎疫情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非典疫情爆发时间在2008年，与汶川地震同年。
    - 能指出并纠正这一错误：误以为非典疫情是科学发展观实施的结果，而非其引发思考的诱因。
  aliases:
    - 非典
  category: 史实
  explanation: 2003年春发生的重大疫情，暴露出发展不协调、公共卫生事业发展滞后等问题，引发对发展问题的思考。
  misconceptions:
    - 认为非典疫情爆发时间在2008年，与汶川地震同年。
    - 误以为非典疫情是科学发展观实施的结果，而非其引发思考的诱因。
    - 把非典疫情与2009年甲型H1N1流感混为同一种疫情。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:非暴力不合作运动
  type: Concept
  subject: 历史
  title: 非暴力不合作运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为非暴力不合作运动采用武装暴力对抗英国殖民者
    - 能指出并纠正这一错误：将甘地领导的运动错记在南非，而非印度本土
  aliases: []
  category: 历史事件
  explanation: 甘地领导的印度反抗英国殖民统治的运动，采用非暴力方式，如抵制英货、拒绝纳税等。
  misconceptions:
    - 误以为非暴力不合作运动采用武装暴力对抗英国殖民者
    - 将甘地领导的运动错记在南非，而非印度本土
    - 认为该运动使印度立即独立，忽略二战后才真正实现
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S1.md
- id: concept:历史:非洲年
  type: Concept
  subject: 历史
  title: 非洲年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“非洲年”错认为1990年（纳米比亚独立年份），年份混淆。
    - 能指出并纠正这一错误：误以为1960年非洲所有国家都已独立，忽略其后仍有多国独立。
  aliases: []
  category: 历史概念
  explanation: 1960年，非洲有17个国家获得独立，因此这一年被称为“非洲年”。
  misconceptions:
    - 将“非洲年”错认为1990年（纳米比亚独立年份），年份混淆。
    - 误以为1960年非洲所有国家都已独立，忽略其后仍有多国独立。
    - 把“非洲年”理解为整个非洲的独立运动胜利，而非17国独立事件。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S4.md
- id: concept:历史:韦编三绝
  type: Concept
  subject: 历史
  title: 韦编三绝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“韦”误解为芦苇绳，实际是熟牛皮绳
    - 能指出并纠正这一错误：记成“韦编三绝”是形容读书速度快，实际是形容反复研读、勤奋刻苦。
  aliases: []
  category: 成语典故
  explanation: 孔子读《易》多次翻断编简的绳子，形容勤奋好学。
  misconceptions:
    - 把“韦”误解为芦苇绳，实际是熟牛皮绳；或误以为孔子读的是《诗经》而非《周易》。
    - 记成“韦编三绝”是形容读书速度快，实际是形容反复研读、勤奋刻苦。
    - 将“三”理解为实指三次，实际是多、多次的意思。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:韩愈
  type: Concept
  subject: 历史
  title: 韩愈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为韩愈主张无神论，实际他抨击佛教但未否定鬼神
    - 能指出并纠正这一错误：误把韩愈当作宋朝思想家，实际是唐朝人
  aliases: []
  category: 历史人物
  explanation: 唐朝思想家，抨击佛教，主张复兴儒学。
  misconceptions:
    - 误认为韩愈主张无神论，实际他抨击佛教但未否定鬼神
    - 误把韩愈当作宋朝思想家，实际是唐朝人
    - 误认为韩愈主张抛弃传统儒学，实际是复兴儒学正统
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:韩非
  type: Concept
  subject: 历史
  title: 韩非
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为韩非是儒家代表人物，实际他是法家集大成者。
    - 能指出并纠正这一错误：把韩非主张的“以法治国”理解为“以法治民”，忽略其包含约束君主的一面。
  aliases: []
  category: 历史人物
  explanation: 战国末期法家集大成者，主张以法治国、建立中央集权。
  misconceptions:
    - 误认为韩非是儒家代表人物，实际他是法家集大成者。
    - 把韩非主张的“以法治国”理解为“以法治民”，忽略其包含约束君主的一面。
    - 将韩非与韩非子视为两人，或误认为韩非是战国初期人物，实际是战国末期。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:顾恺之
  type: Concept
  subject: 历史
  title: 顾恺之
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为顾恺之是唐朝画家，实际是东晋画家。
    - 能指出并纠正这一错误：误把《清明上河图》当作顾恺之的作品。
  aliases: []
  category: 历史人物
  explanation: 东晋最著名的画家，代表作有《女史箴图》和《洛神赋图》。
  misconceptions:
    - 认为顾恺之是唐朝画家，实际是东晋画家。
    - 误把《清明上河图》当作顾恺之的作品。
    - 把《兰亭集序》误认为顾恺之的书法作品。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:顾炎武的思想
  type: Concept
  subject: 历史
  title: 顾炎武的思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“亡国”误认为改朝换代，将“亡天下”误认为国家灭亡，二者含义颠倒
    - 能指出并纠正这一错误：把“保天下者，匹夫有责”记成“保国者”，忽略文化层面的社会责任
  aliases: []
  category: 历史
  explanation: 明末清初思想家顾炎武区分“亡国”与“亡天下”，提出“保天下者，匹夫之贱与有责焉耳矣”，强调文化沉沦的严重性。
  misconceptions:
    - 将“亡国”误认为改朝换代，将“亡天下”误认为国家灭亡，二者含义颠倒
    - 把“保天下者，匹夫有责”记成“保国者”，忽略文化层面的社会责任
    - 误以为顾炎武主张废除君主制度，实际他反对的是君主专制而非君主制
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S8.md
- id: concept:历史:领事裁判权
  type: Concept
  subject: 历史
  title: 领事裁判权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有外国人在中国都享有领事裁判权，实际只有条约列强的侨民才有
    - 能指出并纠正这一错误：把领事裁判权等同于治外法权，忽视了它只保护特定国家侨民的特权
  aliases: []
  category: 历史概念
  explanation: 外国侨民在中国犯罪或成为民事诉讼被告时，不受中国法律管辖，只受本国领事依照本国法律审判的特权。
  misconceptions:
    - 误认为所有外国人在中国都享有领事裁判权，实际只有条约列强的侨民才有
    - 把领事裁判权等同于治外法权，忽视了它只保护特定国家侨民的特权
    - 认为领事裁判权是清朝主动给予的，实际是列强通过不平等条约强加
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:颜真卿
  type: Concept
  subject: 历史
  title: 颜真卿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘颜筋’说成柳公权的书法特点，实际指颜真卿
    - 能指出并纠正这一错误：误将颜真卿当作宋朝书法家，实际是唐朝
  aliases: []
  category: 历史人物
  explanation: 唐朝书法家，字端正劲美，雄浑敦厚。
  misconceptions:
    - 误把‘颜筋’说成柳公权的书法特点，实际指颜真卿
    - 误将颜真卿当作宋朝书法家，实际是唐朝
    - 误认为颜真卿擅长行书草书，实际以楷书著称
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S7.md
- id: concept:历史:飞机
  type: Concept
  subject: 历史
  title: 飞机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为飞机由瓦特发明，忽略莱特兄弟
    - 能指出并纠正这一错误：认为飞机以蒸汽机为发动机，实际是内燃机
  aliases: []
  category: 交通工具
  explanation: 1903年莱特兄弟发明飞机，以内燃机为发动机，实现了人类飞行的梦想。
  misconceptions:
    - 误以为飞机由瓦特发明，忽略莱特兄弟
    - 认为飞机以蒸汽机为发动机，实际是内燃机
    - 把飞机发明时间写成19世纪初，与火车混淆
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C2/sections/S1.md
- id: concept:历史:飞梭
  type: Concept
  subject: 历史
  title: 飞梭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把飞梭当作纺纱工具，误以为它提高了纺纱速度。
    - 能指出并纠正这一错误：将飞梭的发明者写成哈格里夫斯，与珍妮机混淆。
  aliases: []
  category: 发明
  explanation: 1733年凯伊发明的纺织工具，提高了织布速度，促进了纺织技术的革新。
  misconceptions:
    - 把飞梭当作纺纱工具，误以为它提高了纺纱速度。
    - 将飞梭的发明者写成哈格里夫斯，与珍妮机混淆。
    - 认为飞梭是蒸汽驱动的自动织布机，忽略了其手动性质。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:香港回归
  type: Concept
  subject: 历史
  title: 香港回归
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将香港回归与澳门回归时间颠倒，误以为香港在1999年、澳门在1997年回归。
    - 能指出并纠正这一错误：误认为香港回归后实行社会主义制度，忽略“一国两制”下香港保持资本主义制度不变。
  aliases: []
  category: 祖国统一
  explanation: 1997年7月1日中国政府对香港恢复行使主权，香港特别行政区成立。
  misconceptions:
    - 将香港回归与澳门回归时间颠倒，误以为香港在1999年、澳门在1997年回归。
    - 误认为香港回归后实行社会主义制度，忽略“一国两制”下香港保持资本主义制度不变。
    - 误以为香港回归仅收回香港岛，忽略九龙和新界也属于回归范围。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S1.md
- id: concept:历史:香港国安法
  type: Concept
  subject: 历史
  title: 香港国安法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为香港国安法由全国人民代表大会制定，实际是全国人大常委会通过。
    - 能指出并纠正这一错误：把香港国安法实施时间记成2021年，实际是2020年通过并实施。
  aliases:
    - 香港特别行政区维护国家安全法
  category: 法律
  explanation: 2020年全国人大常委会通过《中华人民共和国香港特别行政区维护国家安全法》，推动香港由乱到治。
  misconceptions:
    - 认为香港国安法由全国人民代表大会制定，实际是全国人大常委会通过。
    - 把香港国安法实施时间记成2021年，实际是2020年通过并实施。
    - 认为该法只适用于香港，忽略了其对维护国家安全的一般意义。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:香港特别行政区基本法
  type: Concept
  subject: 历史
  title: 香港特别行政区基本法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《基本法》是1997年香港回归后由香港立法机关制定的，实际是1990年全国人大通过。
    - 能指出并纠正这一错误：将《基本法》当作凌驾于宪法之上的法律，不清楚它是依据宪法制定以落实“一国两制”。
  aliases:
    - 香港基本法
  category: 法律
  explanation: 1990年七届全国人大三次会议通过，以法律形式固定中央政府对香港的方针政策，奠定依法治港的法律基石。
  misconceptions:
    - 误以为《基本法》是1997年香港回归后由香港立法机关制定的，实际是1990年全国人大通过。
    - 将《基本法》当作凌驾于宪法之上的法律，不清楚它是依据宪法制定以落实“一国两制”。
    - 认为《基本法》只规定经济制度，以偏概全，不了解它还规定政治体制和居民权利义务。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S2.md
- id: concept:历史:马克思主义
  type: Concept
  subject: 历史
  title: 马克思主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为马克思主义就是科学社会主义，忽略了哲学和政治经济学。
    - 能指出并纠正这一错误：把马克思主义说成是马克思独立创立，忽略恩格斯的贡献。
  aliases: []
  category: 理论
  explanation: 马克思、恩格斯批判继承前人思想精华形成的理论体系，包括马克思主义哲学、政治经济学和科学社会主义三个组成部分。
  misconceptions:
    - 认为马克思主义就是科学社会主义，忽略了哲学和政治经济学。
    - 把马克思主义说成是马克思独立创立，忽略恩格斯的贡献。
    - 认为马克思主义直接来自空想社会主义，未批判继承。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:马克思主义与中国工人运动相结合
  type: Concept
  subject: 历史
  title: 马克思主义与中国工人运动相结合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为先有工人群众自发的运动，后有马克思主义传播，实际是先进知识分子先接受并宣传马克思主义
    - 能指出并纠正这一错误：认为马克思主义与工人运动的结合是自然完成的，未意识到知识分子主动深入群众的过程
  aliases:
    - 马克思主义与工人运动结合
  category: 历史概念
  explanation: 五四运动后，先进知识分子深入工人群众，宣传马克思主义，启发工人觉悟，促进马克思主义与工人运动结合。
  misconceptions:
    - 认为先有工人群众自发的运动，后有马克思主义传播，实际是先进知识分子先接受并宣传马克思主义
    - 认为马克思主义与工人运动的结合是自然完成的，未意识到知识分子主动深入群众的过程
    - 误以为结合过程中只向工人宣传理论，忽略了启发工人觉悟和领导工人罢工的实践
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S3.md
- id: concept:历史:马克思主义中国化时代化
  type: Concept
  subject: 历史
  title: 马克思主义中国化时代化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为马克思主义中国化就是照搬马列原理，或者只同中国实际相结合，忽略同中华优秀传统文化相结合。
    - 能指出并纠正这一错误：将马克思主义中国化时代化等同于毛泽东思想的形成，忽视新时代的最新成果。
  aliases: []
  category: 理论概念
  explanation: 将马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，形成具有中国特色的马克思主义理论。
  misconceptions:
    - 认为马克思主义中国化就是照搬马列原理，或者只同中国实际相结合，忽略同中华优秀传统文化相结合。
    - 将马克思主义中国化时代化等同于毛泽东思想的形成，忽视新时代的最新成果。
    - 误认为中国化就是去掉马克思主义基本原理，只保留中国传统文化元素。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:马克思主义的传播
  type: Concept
  subject: 历史
  title: 马克思主义的传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为马克思主义在中国的第一位传播者是陈独秀，实际是李大钊。
    - 能指出并纠正这一错误：误认为五四运动前马克思主义已广泛传播，实际是五四运动后才广泛传播。
  aliases: []
  category: 历史事件
  explanation: 五四运动后，马克思主义在中国广泛传播，李大钊等先进知识分子积极宣传，为中国共产党成立奠定思想基础。
  misconceptions:
    - 误认为马克思主义在中国的第一位传播者是陈独秀，实际是李大钊。
    - 误认为五四运动前马克思主义已广泛传播，实际是五四运动后才广泛传播。
    - 误认为《新青年》一创刊就大量刊登马克思主义文章，实际初时宣传民主与科学。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C4/sections/S4.md
- id: concept:历史:马可·波罗行纪
  type: Concept
  subject: 历史
  title: 马可·波罗行纪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为马可·波罗是传教士或政府官员，实际是旅行家/商人
    - 能指出并纠正这一错误：把马可·波罗来华时间说成明朝，实际是元朝
  aliases:
    - 马可·波罗
  category: 文化交流
  explanation: 意大利旅行家马可·波罗在元朝来华，其著作《马可·波罗行纪》描述中国繁华，激起欧洲人对中国的向往。
  misconceptions:
    - 误以为马可·波罗是传教士或政府官员，实际是旅行家/商人
    - 把马可·波罗来华时间说成明朝，实际是元朝
    - 认为《马可·波罗行纪》是马可·波罗在中国写成的，实际是回国后口述
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S6.md
- id: concept:历史:马戛尔尼使团来华
  type: Concept
  subject: 历史
  title: 马戛尔尼使团来华
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为马戛尔尼使团来华是在鸦片战争后，实际是1793年（乾隆年间）。
    - 能指出并纠正这一错误：将马戛尔尼使团与英国发动鸦片战争直接因果相连，实则被拒后仍正常通商。
  aliases: []
  category: 历史
  explanation: 1793年英国使团来华要求扩大贸易，被乾隆皇帝拒绝，反映了清朝的闭关自守和盲目自大。
  misconceptions:
    - 认为马戛尔尼使团来华是在鸦片战争后，实际是1793年（乾隆年间）。
    - 将马戛尔尼使团与英国发动鸦片战争直接因果相连，实则被拒后仍正常通商。
    - 误以为乾隆答应扩大贸易，实际使团要求被断然拒绝，未获成果。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S5.md
- id: concept:历史:马歇尔计划
  type: Concept
  subject: 历史
  title: 马歇尔计划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把马歇尔计划提出时间误记为1945年或1950年，时间错误。
    - 能指出并纠正这一错误：认为杜鲁门主义是马歇尔计划的运用，颠倒了两者关系。
  aliases:
    - 欧洲复兴计划
  category: 历史事件
  explanation: 1947年美国国务卿马歇尔提出的欧洲复兴计划，是杜鲁门主义的大规模运用，美国实施冷战政策的重要步骤。
  misconceptions:
    - 把马歇尔计划提出时间误记为1945年或1950年，时间错误。
    - 认为杜鲁门主义是马歇尔计划的运用，颠倒了两者关系。
    - 只强调马歇尔计划的经济援助，忽视其遏制苏联的冷战目的。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:马神甫事件
  type: Concept
  subject: 历史
  title: 马神甫事件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为马神甫是英国传教士，实际是法国人。
    - 能指出并纠正这一错误：将马神甫事件与亚罗号事件混淆，分不清导火线。
  aliases:
    - 马神甫事件
    - 西林教案
  category: 历史事件
  explanation: 1856年，法国以天主教神父马赖在广西西林被处死为借口，制造的事件，成为第二次鸦片战争的导火线之一。
  misconceptions:
    - 误认为马神甫是英国传教士，实际是法国人。
    - 将马神甫事件与亚罗号事件混淆，分不清导火线。
    - 误记马赖在广西桂林被处死，实际是西林。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:驿传制度
  type: Concept
  subject: 历史
  title: 驿传制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为驿传制度是元朝首创，其实秦汉已有驿站
    - 能指出并纠正这一错误：将急递铺与驿站混为一谈，认为急递铺也接待官员
  aliases:
    - 驿站制度
  category: 历史制度
  explanation: 元朝为传递中央政令、加强对地方管辖而实行的制度，以大都为中心设置驿站和急递铺，形成交通网。
  misconceptions:
    - 误以为驿传制度是元朝首创，其实秦汉已有驿站
    - 将急递铺与驿站混为一谈，认为急递铺也接待官员
    - 认为驿传制度只传递军情，忽略其传达政令、运输物资的功能
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:魏玛共和国
  type: Concept
  subject: 历史
  title: 魏玛共和国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为魏玛共和国由希特勒在1933年建立
    - 能指出并纠正这一错误：以为魏玛共和国时期德国经济繁荣，实际长期受通胀困扰
  aliases: []
  category: 历史事件
  explanation: 1919年德国在魏玛城建立的共和国，因战败和赔款导致经济困难，民众不满。
  misconceptions:
    - 误认为魏玛共和国由希特勒在1933年建立
    - 以为魏玛共和国时期德国经济繁荣，实际长期受通胀困扰
    - 将魏玛共和国与德意志帝国混淆，时间顺序颠倒
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C3/sections/S3.md
- id: concept:历史:鸦片战争
  type: Concept
  subject: 历史
  title: 鸦片战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为虎门销烟是鸦片战争的根本原因，实际根本原因是英国打开中国市场
    - 能指出并纠正这一错误：把鸦片战争爆发时间记为1841年，与虎门销烟年份混淆
  aliases:
    - 第一次鸦片战争
  category: 历史事件
  explanation: 1840年至1842年英国对中国发动的侵略战争，以清政府失败并签订《南京条约》告终，是中国近代史的开端。
  misconceptions:
    - 误认为虎门销烟是鸦片战争的根本原因，实际根本原因是英国打开中国市场
    - 把鸦片战争爆发时间记为1841年，与虎门销烟年份混淆
    - 误认为《南京条约》签订于鸦片战争进行中，实际是战争结束后签订
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C1/sections/S1.md
- id: concept:历史:鸿胪寺
  type: Concept
  subject: 历史
  title: 鸿胪寺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为鸿胪寺是管理佛教事务的机构，实际负责外交接待。
    - 能指出并纠正这一错误：误认为鸿胪寺是秦朝始设，实际隋唐已有此机构。
  aliases: []
  category: 历史制度
  explanation: 隋唐时期掌管接待外国宾客和周边民族首领的机构。
  misconceptions:
    - 误认为鸿胪寺是管理佛教事务的机构，实际负责外交接待。
    - 误认为鸿胪寺是秦朝始设，实际隋唐已有此机构。
    - 误认为鸿胪寺主管对外贸易，实际接待外国宾客和首领。
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S6.md
- id: concept:历史:麦哲伦船队环球航行
  type: Concept
  subject: 历史
  title: 麦哲伦船队环球航行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为麦哲伦本人全程完成环球航行，忽略其死在菲律宾
    - 能指出并纠正这一错误：认为麦哲伦是西班牙人，且由西班牙国王派遣
  aliases:
    - 麦哲伦环球航行
  category: 历史事件
  explanation: 1519-1522年麦哲伦船队完成人类首次环球航行，证明了地圆说的正确。
  misconceptions:
    - 误认为麦哲伦本人全程完成环球航行，忽略其死在菲律宾
    - 认为麦哲伦是西班牙人，且由西班牙国王派遣
    - 认为此次航行首次提出地圆说，而非通过航行证实地圆说
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:黄兴
  type: Concept
  subject: 历史
  title: 黄兴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为黄兴是湖北军政府都督，实际是黎元洪
    - 能指出并纠正这一错误：把黄兴领导广州起义误记为武昌起义
  aliases: []
  category: 历史人物
  explanation: 革命党领导人，与孙中山并称“孙黄”，领导广州起义，后任湖北军政府战时总司令。
  misconceptions:
    - 误以为黄兴是湖北军政府都督，实际是黎元洪
    - 把黄兴领导广州起义误记为武昌起义
    - 认为黄兴与孙中山并称“孙黄”是指两人共同发动武昌起义
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:黄埔军校
  type: Concept
  subject: 历史
  title: 黄埔军校
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为黄埔军校由中国共产党创办，实际由孙中山创办
    - 能指出并纠正这一错误：认为黄埔军校只培养军事人才，忽略了也培养政治人才
  aliases:
    - 中国国民党陆军军官学校
  category: 历史机构
  explanation: 1924年孙中山在广州黄埔创办的军事学校，培养了大批军事政治人才，为北伐战争准备了条件。
  misconceptions:
    - 认为黄埔军校由中国共产党创办，实际由孙中山创办
    - 认为黄埔军校只培养军事人才，忽略了也培养政治人才
    - 认为黄埔军校创办于北伐战争后，实际是北伐前
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:黄宗羲的思想
  type: Concept
  subject: 历史
  title: 黄宗羲的思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄宗羲拥护君为臣纲，忽略其批判君主专制的核心观点
    - 能指出并纠正这一错误：把“做官应为天下万民”错解为为皇帝服务，颠倒服务对象
  aliases: []
  category: 历史
  explanation: 明末清初思想家黄宗羲激烈反对君主专制，批判“君为臣纲”，认为做官应为天下万民。
  misconceptions:
    - 误认为黄宗羲拥护君为臣纲，忽略其批判君主专制的核心观点
    - 把“做官应为天下万民”错解为为皇帝服务，颠倒服务对象
    - 将黄宗羲反对君主专制与顾炎武的“亡天下”思想混为一谈
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C3/sections/S8.md
- id: concept:历史:黄巢起义
  type: Concept
  subject: 历史
  title: 黄巢起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为黄巢起义发生在唐初，实际是唐末875年
    - 能指出并纠正这一错误：把黄巢建立的大齐政权误认为大顺，与李自成混淆
  aliases:
    - 黄巢之乱
  category: 历史事件
  explanation: 875年爆发的唐末农民起义，由黄巢领导，攻入长安，建立大齐政权，沉重打击唐朝统治。
  misconceptions:
    - 认为黄巢起义发生在唐初，实际是唐末875年
    - 把黄巢建立的大齐政权误认为大顺，与李自成混淆
    - 认为黄巢起义直接推翻唐朝，实际是沉重打击但唐亡于朱温
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C1/sections/S4.md
- id: concept:历史:黄巾起义
  type: Concept
  subject: 历史
  title: 黄巾起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为黄巾起义由张鲁领导，实际领导者是张角
    - 能指出并纠正这一错误：把黄巾起义时间记成186年，实际是184年
  aliases:
    - 黄巾军
  category: 历史事件
  explanation: 184年，张角领导的有组织的大规模农民起义，因头裹黄巾而得名，沉重打击了东汉统治，使其名存实亡。
  misconceptions:
    - 认为黄巾起义由张鲁领导，实际领导者是张角
    - 把黄巾起义时间记成186年，实际是184年
    - 误以为黄巾起义直接推翻东汉，实际是沉重打击使其名存实亡
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S7.md
- id: concept:历史:黄帝
  type: Concept
  subject: 历史
  title: 黄帝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为黄帝是真实历史人物而非传说人物
    - 能指出并纠正这一错误：认为黄帝只打败了蚩尤，忽略阪泉之战统一炎帝部落
  aliases:
    - 轩辕氏
  category: 传说人物
  explanation: 传说中部落联盟首领，经阪泉之战和涿鹿之战统一部落，被尊为中华民族人文初祖。
  misconceptions:
    - 误以为黄帝是真实历史人物而非传说人物
    - 认为黄帝只打败了蚩尤，忽略阪泉之战统一炎帝部落
    - 把黄帝说成华夏族唯一始祖，忽略炎帝也是人文初祖
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C1/sections/S3.md
- id: concept:历史:黄海海战
  type: Concept
  subject: 历史
  title: 黄海海战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄海海战导致北洋舰队全军覆没，实际是威海卫战役
    - 能指出并纠正这一错误：把邓世昌牺牲说成在平壤战役或威海卫战役
  aliases:
    - 大东沟海战
  category: 战役
  explanation: 甲午中日战争中的一次重要海战，北洋舰队与日本联合舰队在黄海激战，致远舰管带邓世昌等壮烈牺牲。
  misconceptions:
    - 误认为黄海海战导致北洋舰队全军覆没，实际是威海卫战役
    - 把邓世昌牺牲说成在平壤战役或威海卫战役
    - 误以为黄海海战是甲午战争中唯一一次海战，实际还有丰岛等海战
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S1.md
- id: concept:历史:黄花岗七十二烈士
  type: Concept
  subject: 历史
  title: 黄花岗七十二烈士
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为七十二烈士全部牺牲于武昌起义
    - 能指出并纠正这一错误：把黄花岗七十二烈士等同于所有广州起义牺牲者，忽略实际收殓人数
  aliases: []
  category: 历史人物群体
  explanation: 广州起义失败后，收殓的七十二具烈士遗骸合葬于黄花岗，称黄花岗七十二烈士。
  misconceptions:
    - 误以为七十二烈士全部牺牲于武昌起义
    - 把黄花岗七十二烈士等同于所有广州起义牺牲者，忽略实际收殓人数
    - 认为七十二烈士是在起义胜利后合葬的
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:黄花岗起义
  type: Concept
  subject: 历史
  title: 黄花岗起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将黄花岗起义时间误记为1911年10月10日，与武昌起义混淆
    - 能指出并纠正这一错误：误以为黄花岗起义是孙中山亲自率众攻入总督衙门
  aliases:
    - 广州起义
  category: 历史事件
  explanation: 1911年4月同盟会在广州发动的起义，黄兴率众攻入总督衙门，失败后牺牲者被合葬于黄花岗，称黄花岗七十二烈士。
  misconceptions:
    - 将黄花岗起义时间误记为1911年10月10日，与武昌起义混淆
    - 误以为黄花岗起义是孙中山亲自率众攻入总督衙门
    - 认为黄花岗起义失败后立刻引发武昌起义，忽略中间间隔
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:黄道婆
  type: Concept
  subject: 历史
  title: 黄道婆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为黄道婆是海南黎族人，实际是松江人，从黎族学艺
    - 能指出并纠正这一错误：把黄道婆说成棉纺织技术的发明者，实际是革新推广者
  aliases: []
  category: 历史人物
  explanation: 元朝棉纺织技术革新者，从海南黎族地区带回先进棉纺织技术，改进工具，推动松江成为棉纺织业中心。
  misconceptions:
    - 误认为黄道婆是海南黎族人，实际是松江人，从黎族学艺
    - 把黄道婆说成棉纺织技术的发明者，实际是革新推广者
    - 认为松江成为棉纺织业中心在宋朝，实际是元朝黄道婆之后
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S4.md
- id: concept:历史:黎元洪
  type: Concept
  subject: 历史
  title: 黎元洪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为黎元洪是同盟会成员，实际为清末新军将领
    - 能指出并纠正这一错误：把黎元洪被推举为湖北军政府都督与武昌起义时间先后颠倒
  aliases: []
  category: 历史人物
  explanation: 武昌起义后，被推举为湖北军政府都督。
  misconceptions:
    - 误以为黎元洪是同盟会成员，实际为清末新军将领
    - 把黎元洪被推举为湖北军政府都督与武昌起义时间先后颠倒
    - 误以为黎元洪是黄花岗起义的领导人
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C3/sections/S4.md
- id: concept:历史:龙门石窟
  type: Concept
  subject: 历史
  title: 龙门石窟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为龙门石窟位于山西大同，与云冈石窟位置颠倒。
    - 能指出并纠正这一错误：误以为龙门石窟开凿于隋朝，实际始于北魏。
  aliases: []
  category: 艺术成就
  explanation: 位于河南洛阳，是北魏时期开凿的石窟，与云冈石窟齐名。
  misconceptions:
    - 认为龙门石窟位于山西大同，与云冈石窟位置颠倒。
    - 误以为龙门石窟开凿于隋朝，实际始于北魏。
    - 把龙门石窟与敦煌莫高窟混淆，认为以壁画为主，实际以石刻造像为主。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
