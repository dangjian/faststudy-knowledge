- id: concept:历史:焦裕禄精神
  type: Concept
  subject: 历史
  title: 焦裕禄精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把焦裕禄说成是石油工人，与王进喜事迹混淆。
    - 能指出并纠正这一错误：误认为焦裕禄是抗日战争时期的英雄，将其事迹与狼牙山五壮士混同。
  aliases: []
  category: 精神品质
  explanation: 亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献的精神，焦裕禄是优秀共产党员的典范。
