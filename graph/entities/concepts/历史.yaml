  misconceptions:
    - 认为范缜是东汉人，其生活年代被提前。
    - 把《神灭论》的作者说成是荀子或王充，张冠李戴。
    - 误认为范缜支持佛教因果报应，实际他反对佛教。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S5.md
- id: concept:历史:荀子
  type: Concept
  subject: 历史
  title: 荀子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把荀子归为法家，因为其主张‘礼法并用’
    - 能指出并纠正这一错误：认为荀子是春秋末期人，与孔子同时
  aliases: []
  category: 历史人物
  explanation: 战国时期儒家代表人物，主张礼治、礼法并用。
  misconceptions:
    - 把荀子归为法家，因为其主张‘礼法并用’
    - 认为荀子是春秋末期人，与孔子同时
    - 把荀子的‘礼法并用’与法家的‘以法治国’混为一谈，忽略其儒家底色
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S4.md
- id: concept:历史:莎士比亚
  type: Concept
  subject: 历史
  title: 莎士比亚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为莎士比亚是法国人，实际是英国文艺复兴代表
    - 能指出并纠正这一错误：把《哈姆雷特》说成《神曲》，作者张冠李戴
  aliases: []
  category: 历史人物
  explanation: 英国文艺复兴代表，代表作《哈姆雷特》《罗密欧与朱丽叶》，批判封建道德。
