  explanation: 唐朝长安城实行坊市制度，坊为居民居住区，市为商品交易区，两者严格区分，坊门和市门按规定时间开闭。
  misconceptions:
    - 误把‘坊’当作交易区，‘市’当作居住区
    - 认为坊市制度下商业活动不受时间限制
