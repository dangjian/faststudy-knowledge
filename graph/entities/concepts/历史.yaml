    - 能指出并纠正这一错误：认为麦哲伦本人完成了环球航行，实际他中途死于菲律宾，船队继续完成
    - 能指出并纠正这一错误：把地圆说的提出归于麦哲伦，实际地圆说古已有之，麦哲伦是证明者
