  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S3.md
- id: concept:历史:上海精神
  type: Concept
  subject: 历史
  title: 上海精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把上海精神内容说成互信、互利、平等、合作、共赢，漏掉协商和尊重多样文明。
    - 能指出并纠正这一错误：将上海精神与上海合作组织混为一谈，不知其是组织的基本指导原则。
  aliases: []
  category: 外交理念
  explanation: 以“互信、互利、平等、协商、尊重多样文明、谋求共同发展”为基本内容。
  misconceptions:
    - 把上海精神内容说成互信、互利、平等、合作、共赢，漏掉协商和尊重多样文明。
    - 将上海精神与上海合作组织混为一谈，不知其是组织的基本指导原则。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C4/sections/S3.md
- id: concept:历史:上甘岭战役
  type: Concept
  subject: 历史
  title: 上甘岭战役
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为上甘岭战役发生在1953年，实际是1952年10月。
    - 能指出并纠正这一错误：把邱少云的事迹放到上甘岭战役，实际他是潜伏于391高地。
  aliases: []
  category: 历史事件
  explanation: 1952年10月，志愿军在上甘岭击退美军强大攻势，取得胜利，涌现出黄继光等英雄。
  misconceptions:
    - 误认为上甘岭战役发生在1953年，实际是1952年10月。
    - 把邱少云的事迹放到上甘岭战役，实际他是潜伏于391高地。
    - 认为上甘岭战役是朝鲜战争爆发后第一次战役，实际是中期拉锯战。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C1/sections/S2.md
- id: concept:历史:不结盟运动
  type: Concept
  subject: 历史
  title: 不结盟运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国是其成员国，实际上中国从未加入不结盟运动。
    - 能指出并纠正这一错误：把它与万隆会议混淆，误认为是1955年成立。
  aliases: []
  category: 政治
  explanation: 1961年正式成立，由新独立的民族国家发起，实行和平、不结盟的对外政策，冲击两极格局。
  misconceptions:
    - 认为中国是其成员国，实际上中国从未加入不结盟运动。
    - 把它与万隆会议混淆，误认为是1955年成立。
    - 错误理解'不结盟'为不与任何国家交往，实为不与大国结盟。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:世界上最早的印刷广告
  type: Concept
  subject: 历史
  title: 世界上最早的印刷广告
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把济南刘家功夫针铺铜版误认为元代或明代实物，忽略其宋代属性
    - 能指出并纠正这一错误：误以为它是世界上最早的广告，漏掉'印刷'限定，唐代已有招牌广告
  aliases:
    - 印刷广告
  category: 经济史
  explanation: 宋朝济南刘家功夫针铺铜版是已知世界上最早的印刷广告，反映商业竞争激烈。
  misconceptions:
    - 把济南刘家功夫针铺铜版误认为元代或明代实物，忽略其宋代属性
    - 误以为它是世界上最早的广告，漏掉'印刷'限定，唐代已有招牌广告
    - 将铜版上的白兔捣药图案误认为是与交子相关的图案
  sourceRef: content/七年级/下册/历史/PEP-7-2-History/chapters/C2/sections/S5.md
- id: concept:历史:世界历史大事年表
  type: Concept
  subject: 历史
  title: 世界历史大事年表
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将工业革命开始时间排在法国大革命之后，实际工业革命开始于18世纪60年代
    - 能指出并纠正这一错误：认为大事年表只记政治事件，忽略经济、文化事件
  aliases: []
  category: 历史年表
  explanation: 按时间顺序排列的世界历史重大事件列表，涵盖从古代到近代的重要史实。
  misconceptions:
    - 将工业革命开始时间排在法国大革命之后，实际工业革命开始于18世纪60年代
    - 认为大事年表只记政治事件，忽略经济、文化事件
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C7/sections/S1.md
- id: concept:历史:世界反法西斯同盟
  type: Concept
  subject: 历史
  title: 世界反法西斯同盟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把世界反法西斯同盟的成立时间误认为1945年，实际是1942年《联合国家宣言》签署时
    - 能指出并纠正这一错误：认为中国不在世界反法西斯同盟中，忽略中国是重要成员
  aliases:
    - 反法西斯同盟
  category: 历史概念
  explanation: 由美、英、苏、中等国组成的国际反法西斯统一战线，共同对抗轴心国。
  misconceptions:
    - 把世界反法西斯同盟的成立时间误认为1945年，实际是1942年《联合国家宣言》签署时
    - 认为中国不在世界反法西斯同盟中，忽略中国是重要成员
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S1.md
- id: concept:历史:世界反法西斯战争的东方主战场
  type: Concept
  subject: 历史
  title: 世界反法西斯战争的东方主战场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中国战场不是主战场，只有太平洋战场才是东方主战场。
    - 能指出并纠正这一错误：说中国抗战没有牵制日军主力，低估中国战场的贡献。
  aliases:
    - 中国战场是世界反法西斯战争的东方主战场
  category: 历史概念
  explanation: 中国抗日战争是世界反法西斯战争的重要组成部分，中国战场是东方主战场，牵制了大量日军，为世界反法西斯战争胜利作出巨大贡献。
  misconceptions:
    - 认为中国战场不是主战场，只有太平洋战场才是东方主战场。
    - 说中国抗战没有牵制日军主力，低估中国战场的贡献。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C4/sections/S3.md
- id: concept:历史:世界多极化趋势
  type: Concept
  subject: 历史
  title: 世界多极化趋势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为多极格局已经形成，实际上只是趋势，新的格局尚未确立。
    - 能指出并纠正这一错误：误以为只有美、欧、日、中、俄五个力量，忽略了发展中国家和地区力量。
  aliases:
    - 多极化
  category: 政治
  explanation: 冷战结束后，美国成为唯一超级大国，但欧盟、日本、中国、俄罗斯等力量推动世界向多极化方向发展。
  misconceptions:
    - 认为多极格局已经形成，实际上只是趋势，新的格局尚未确立。
    - 误以为只有美、欧、日、中、俄五个力量，忽略了发展中国家和地区力量。
    - 认为多极化始于冷战前，实际是冷战结束后才出现的趋势。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S2.md
- id: concept:历史:世界市场
  type: Concept
  subject: 历史
  title: 世界市场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新航路开辟之前世界市场已经形成，实际是开辟后商业联系加强才逐渐形成
    - 能指出并纠正这一错误：把世界市场等同于欧洲内部市场，忽略它涵盖全球各洲的贸易网络
  aliases: []
  category: 经济概念
  explanation: 新航路开辟后，世界各地区之间的商业联系加强，逐渐形成世界市场。
  misconceptions:
    - 认为新航路开辟之前世界市场已经形成，实际是开辟后商业联系加强才逐渐形成
    - 把世界市场等同于欧洲内部市场，忽略它涵盖全球各洲的贸易网络
    - 误以为世界市场形成于工业革命后，实际新航路开辟后已开始形成
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C5/sections/S1.md
- id: concept:历史:世界贸易组织
  type: Concept
  subject: 历史
  title: 世界贸易组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为它成立于1947年，实际是1995年，前身是关贸总协定。
    - 能指出并纠正这一错误：以为它是联合国的专门机构，实际上它独立于联合国运作。
  aliases:
    - WTO
  category: 国际组织
  explanation: 1995年成立的全球性经济组织，旨在促进全球贸易和经济发展，制定多边贸易规则，解决贸易争端。
  misconceptions:
    - 误认为它成立于1947年，实际是1995年，前身是关贸总协定。
    - 以为它是联合国的专门机构，实际上它独立于联合国运作。
    - 混淆其管辖范围，认为它只处理货物贸易，不涉及服务贸易和知识产权。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:世界贸易组织宗旨
  type: Concept
  subject: 历史
  title: 世界贸易组织宗旨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为宗旨是维护世界和平，实际是促进全球贸易和经济发展。
    - 能指出并纠正这一错误：认为非歧视性原则就是对发展中国家更优惠，实际包含最惠国待遇和国民待遇。
  aliases: []
  category: 经济
  explanation: 以非歧视性、开放、公平等为原则，促进全球贸易和经济发展，保证就业、收入与需求的增长。
  misconceptions:
    - 误以为宗旨是维护世界和平，实际是促进全球贸易和经济发展。
    - 认为非歧视性原则就是对发展中国家更优惠，实际包含最惠国待遇和国民待遇。
    - 忽略保障就业、收入增长等目标，只强调降低关税。
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C6/sections/S1.md
- id: concept:历史:世袭制取代禅让制
  type: Concept
  subject: 历史
  title: 世袭制取代禅让制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为世袭制是从启开始的，但认为禅让制是黄帝发明的。
    - 能指出并纠正这一错误：将世袭制继承理解为只传儿子，忽略兄终弟及等。
  aliases:
    - 家天下
  category: 政治制度
  explanation: 禹死后，其子启继承王位，从此世袭制取代了禅让制，王位在一家一姓中传承。
  misconceptions:
    - 误以为世袭制是从启开始的，但认为禅让制是黄帝发明的。
    - 将世袭制继承理解为只传儿子，忽略兄终弟及等。
    - 认为世袭制取代禅让制是和平交接，忽略启与伯益的争斗。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C2/sections/S1.md
- id: concept:历史:东北易帜
  type: Concept
  subject: 历史
  title: 东北易帜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为东北易帜标志着全国完全统一，实际只是形式上统一
    - 能指出并纠正这一错误：把东北易帜时间记在1927年南京国民政府成立前，实际是1928年底
  aliases: []
  category: 历史事件
  explanation: 1928年底，张学良宣布“服从国民政府，改易旗帜”，标志着南京国民政府在形式上统一了全国。
  misconceptions:
    - 误以为东北易帜标志着全国完全统一，实际只是形式上统一
    - 把东北易帜时间记在1927年南京国民政府成立前，实际是1928年底
    - 混淆皇姑屯事件与东北易帜，以为是张作霖易帜，实际是其子张学良
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S3.md
- id: concept:历史:东晋
  type: Concept
  subject: 历史
  title: 东晋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为东晋是司马炎建立，与西晋一样定都洛阳
    - 能指出并纠正这一错误：认为东晋统一了北方，是西晋的延续
  aliases: []
  category: 朝代
  explanation: 西晋灭亡后，司马睿在建康建立的政权，与北方政权对峙，统治南方。
  misconceptions:
    - 误以为东晋是司马炎建立，与西晋一样定都洛阳
    - 认为东晋统一了北方，是西晋的延续
    - 误将东晋都城说成长安，认为晋朝南迁后仍控制全国
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C4/sections/S3.md
- id: concept:历史:东欧剧变
  type: Concept
  subject: 历史
  title: 东欧剧变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为东欧剧变是各国自发改革的结果，实际受戈尔巴乔夫改革影响并实行政治多元化
    - 能指出并纠正这一错误：误以为东欧剧变发生在苏联解体之后，实际东欧剧变在先
  aliases:
    - 东欧社会主义国家剧变
  category: 历史事件
  explanation: 20世纪80年代末，东欧各国受戈尔巴乔夫改革影响，实行政治多元化，全盘否定自身历史，政局剧烈动荡，社会主义制度发生根本变化。
  misconceptions:
    - 认为东欧剧变是各国自发改革的结果，实际受戈尔巴乔夫改革影响并实行政治多元化
    - 误以为东欧剧变发生在苏联解体之后，实际东欧剧变在先
    - 认为东欧剧变后东欧各国仍坚持社会主义制度，实际社会主义制度发生根本变化
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:东汉建立
  type: Concept
  subject: 历史
  title: 东汉建立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为东汉定都长安，实际定都洛阳
    - 能指出并纠正这一错误：把东汉建立时间写成公元前25年，应为公元25年
  aliases:
    - 光武中兴
  category: 历史事件
  explanation: 公元25年，刘秀称帝，定都洛阳，史称东汉，刘秀即光武帝。
  misconceptions:
    - 认为东汉定都长安，实际定都洛阳
    - 把东汉建立时间写成公元前25年，应为公元25年
    - 误以为刘秀建立东汉前直接是西汉，忽略了中间的新朝
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S5.md
- id: concept:历史:丝绸之路
  type: Concept
  subject: 历史
  title: 丝绸之路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为丝绸之路起点是洛阳，实际是长安。
    - 能指出并纠正这一错误：把丝绸之路形成时间提前到张骞第一次出使前。
  aliases:
    - 陆上丝绸之路
  category: 历史概念
  explanation: 张骞出使西域后，汉朝和西域的使者、商人相互往来，形成了一条从长安出发，穿过河西走廊，经西域运往中亚、西亚，再转运到欧洲和北非的陆上交通道路，后世称“丝绸之路”。它是古代东西方往来的大动脉，促进了贸易与文化交流。
  misconceptions:
    - 认为丝绸之路起点是洛阳，实际是长安。
    - 把丝绸之路形成时间提前到张骞第一次出使前。
    - 误以为丝绸之路上只运输丝绸，忽略瓷器、香料等。
  sourceRef: content/七年级/上册/历史/PEP-7-1-History/chapters/C3/sections/S6.md
- id: concept:历史:两不愁三保障
  type: Concept
  subject: 历史
  title: 两不愁三保障
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘三保障’漏写‘基本医疗’或‘住房安全’，简化为‘医疗、教育、住房’。
    - 能指出并纠正这一错误：误将‘两不愁’写成‘不愁吃、不愁住’，漏掉‘不愁穿’。
  aliases: []
  category: 脱贫标准
  explanation: 不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障。
  misconceptions:
    - 把‘三保障’漏写‘基本医疗’或‘住房安全’，简化为‘医疗、教育、住房’。
    - 误将‘两不愁’写成‘不愁吃、不愁住’，漏掉‘不愁穿’。
    - 把‘三保障’顺序记错，写成‘住房、医疗、教育’。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S2.md
- id: concept:历史:两个一百年奋斗目标
  type: Concept
  subject: 历史
  title: 两个一百年奋斗目标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：颠倒了两个一百年的时间：把第一个一百年写成新中国成立100年。
    - 能指出并纠正这一错误：把全面建成小康社会误写为‘基本实现现代化’。
  aliases: []
  category: 战略目标
  explanation: 到中国共产党成立100年时全面建成小康社会，到新中国成立100年时建成社会主义现代化国家。
  misconceptions:
    - 颠倒了两个一百年的时间：把第一个一百年写成新中国成立100年。
    - 把全面建成小康社会误写为‘基本实现现代化’。
    - 误以为两个一百年奋斗目标都是到2049年实现。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:两个凡是
  type: Concept
  subject: 历史
  title: 两个凡是
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“两个凡是”与七届二中全会的“两个务必”混为一谈
    - 能指出并纠正这一错误：误以为“两个凡是”是邓小平提出的方针
  aliases: []
  category: 历史概念
  explanation: 1977年提出的“凡是毛主席作出的决策，我们都坚决维护，凡是毛主席的指示，我们都始终不渝地遵循”的方针，后被否定。
  misconceptions:
    - 把“两个凡是”与七届二中全会的“两个务必”混为一谈
    - 误以为“两个凡是”是邓小平提出的方针
    - 认为“两个凡是”被十一届三中全会完全肯定并继续沿用
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:两个务必
  type: Concept
  subject: 历史
  title: 两个务必
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘两个务必’出自中共七大或七届一中全会。
    - 能指出并纠正这一错误：将‘两个务必’与党的‘三大作风’混为一谈，列举成三条。
  aliases: []
  category: 方针政策
  explanation: 毛泽东在七届二中全会上告诫全党，务必继续保持谦虚、谨慎、不骄、不躁的作风，务必继续保持艰苦奋斗的作风。
  misconceptions:
    - 误以为‘两个务必’出自中共七大或七届一中全会。
    - 将‘两个务必’与党的‘三大作风’混为一谈，列举成三条。
    - 把‘两个务必’内容说成‘务必保持革命热情，务必保持革命警惕’等自编表述。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:两个确立
  type: Concept
  subject: 历史
  title: 两个确立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“确立”写成“维护”，与“两个维护”混为一谈。
    - 能指出并纠正这一错误：误将“指导地位”说成“领导地位”。
  aliases: []
  category: 政治概念
  explanation: 确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。
  misconceptions:
    - 把“确立”写成“维护”，与“两个维护”混为一谈。
    - 误将“指导地位”说成“领导地位”。
    - 记成确立“习近平同志党中央的核心、全党的核心地位”和“习近平新时代中国特色社会主义思想的指导地位”的顺序颠倒。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:两个维护
  type: Concept
  subject: 历史
  title: 两个维护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“维护”写成“确立”，与“两个确立”混淆。
    - 能指出并纠正这一错误：误写成“坚决维护习近平总书记党中央的领导地位”，漏掉“核心”。
  aliases: []
  category: 政治原则
  explanation: 坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。
  misconceptions:
    - 把“维护”写成“确立”，与“两个确立”混淆。
    - 误写成“坚决维护习近平总书记党中央的领导地位”，漏掉“核心”。
    - 记成“维护国家主权和领土完整”等。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:两免一补
  type: Concept
  subject: 历史
  title: 两免一补
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为两免一补免除所有学生的教科书费，忽视对象仅限贫困家庭学生。
    - 能指出并纠正这一错误：误以为免除学杂费只针对贫困学生，实际全部免除农村义务教育阶段学杂费。
  aliases: []
  category: 政策
  explanation: 2006年起国家实施的政策，全部免除农村义务教育阶段学生学杂费，对贫困家庭学生免费提供教科书并补助寄宿生生活费。
  misconceptions:
    - 误以为两免一补免除所有学生的教科书费，忽视对象仅限贫困家庭学生。
    - 误以为免除学杂费只针对贫困学生，实际全部免除农村义务教育阶段学杂费。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:两岸三通
  type: Concept
  subject: 历史
  title: 两岸三通
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为两岸三通包括通商，实际2008年实现的是空运、海运直航和邮政合作。
    - 能指出并纠正这一错误：误以为两岸三通于2005年实现，实际是2008年。
  aliases:
    - 三通
  category: 祖国统一
  explanation: 2008年两岸实现空运直航、海运直航、邮政合作，即'三通'，促进了两岸关系和平发展。
  misconceptions:
    - 误以为两岸三通包括通商，实际2008年实现的是空运、海运直航和邮政合作。
    - 误以为两岸三通于2005年实现，实际是2008年。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C5/sections/S1.md
- id: concept:历史:两岸领导人会面
  type: Concept
  subject: 历史
  title: 两岸领导人会面
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把两岸领导人会面地点写成北京或台北，实际是新加坡。
    - 能指出并纠正这一错误：漏掉‘1949年以来’的时间限制，直接说成是两岸领导人首次会面。
  aliases: []
  category: 史实
  explanation: 2015年习近平与马英九在新加坡会面，是1949年以来两岸领导人的首次会面。
  misconceptions:
    - 误把两岸领导人会面地点写成北京或台北，实际是新加坡。
    - 漏掉‘1949年以来’的时间限制，直接说成是两岸领导人首次会面。
    - 把马英九误记为蔡英文时期的两岸领导人会面。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:两弹一星功勋奖章
  type: Concept
  subject: 历史
  title: 两弹一星功勋奖章
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为'两弹'是原子弹和氢弹，忽略导弹也是两弹之一。
    - 能指出并纠正这一错误：把1999年授予时间记成1964年原子弹爆炸时，忽略追授背景。
  aliases: []
  category: 历史事实
  explanation: 1999年授予钱学森、邓稼先、郭永怀等科学家的荣誉奖章，表彰他们对国防事业的贡献。
  misconceptions:
    - 误认为'两弹'是原子弹和氢弹，忽略导弹也是两弹之一。
    - 把1999年授予时间记成1964年原子弹爆炸时，忽略追授背景。
    - 以为功勋奖章只发给钱学森、邓稼先，忘掉郭永怀等更多科学家。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S2.md
- id: concept:历史:两弹一星精神
  type: Concept
  subject: 历史
  title: 两弹一星精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把精神内涵简化为'爱国、奉献'，漏掉自力更生、艰苦奋斗等关键词。
    - 能指出并纠正这一错误：误将'大力协同、勇于登攀'写成'团结协作、敢于创新'。
  aliases: []
  category: 精神品质
  explanation: 热爱祖国、无私奉献、自力更生、艰苦奋斗、大力协同、勇于登攀的精神。
  misconceptions:
    - 把精神内涵简化为'爱国、奉献'，漏掉自力更生、艰苦奋斗等关键词。
    - 误将'大力协同、勇于登攀'写成'团结协作、敢于创新'。
    - 认为这种精神只属于两弹一星科学家，与国防建设中的普通劳动者无关。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:两极格局
  type: Concept
  subject: 历史
  title: 两极格局
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为两极格局就是美苏直接军事对抗，实际是全面冷战对峙状态
    - 能指出并纠正这一错误：把两极格局等同于冷战，冷战是对峙形式，两极格局是美苏两大集团对峙的格局
  aliases: []
  category: 历史概念
  explanation: 北约和华约对峙形成的美苏两大集团全面冷战对峙的局面。
  misconceptions:
    - 误认为两极格局就是美苏直接军事对抗，实际是全面冷战对峙状态
    - 把两极格局等同于冷战，冷战是对峙形式，两极格局是美苏两大集团对峙的格局
    - 认为两极格局形成于1947年杜鲁门主义出台，实际以华约成立为标志
  sourceRef: content/九年级/下册/历史/PEP-9-2-History/chapters/C5/sections/S1.md
- id: concept:历史:两步走战略安排
  type: Concept
  subject: 历史
  title: 两步走战略安排
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为第一步到2035年建成社会主义现代化强国，第二步到本世纪中叶基本实现现代化。
    - 能指出并纠正这一错误：误认为两步走战略从2035年开始，实际从2020年开始。
  aliases:
    - 两步走
  category: 发展战略
  explanation: 从2020年到2035年基本实现社会主义现代化；从2035年到本世纪中叶建成社会主义现代化强国。
  misconceptions:
    - 误认为第一步到2035年建成社会主义现代化强国，第二步到本世纪中叶基本实现现代化。
    - 误认为两步走战略从2035年开始，实际从2020年开始。
    - 把“基本实现”和“建成”的目标弄反。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S2.md
- id: concept:历史:两河流域文明
  type: Concept
  subject: 历史
  title: 两河流域文明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将两河流域误认为尼罗河流域，说成是古埃及的发源地。
    - 能指出并纠正这一错误：误以为楔形文字是古埃及人创造的，实际由苏美尔人发明。
  aliases:
    - 美索不达米亚文明
  category: 历史
  explanation: 两河流域（美索不达米亚）是人类最早的文明发祥地之一，苏美尔人发明楔形文字、阴历和60进制。
  misconceptions:
    - 将两河流域误认为尼罗河流域，说成是古埃及的发源地。
    - 误以为楔形文字是古埃及人创造的，实际由苏美尔人发明。
    - 把60进制说成是古埃及的贡献，它是苏美尔人的成就。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C1/sections/S3.md
- id: concept:历史:严复
  type: Concept
  subject: 历史
  title: 严复
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把严复当作《时务报》主笔，实际他是《国闻报》的主持者。
    - 能指出并纠正这一错误：认为严复是戊戌六君子之一，实际六君子中并无严复。
  aliases: []
  category: 历史人物
  explanation: 近代启蒙思想家，翻译《天演论》，宣传'物竞天择''适者生存'，主持《国闻报》，号召变法图强。
  misconceptions:
    - 误把严复当作《时务报》主笔，实际他是《国闻报》的主持者。
    - 认为严复是戊戌六君子之一，实际六君子中并无严复。
    - 将《天演论》的翻译者说成梁启超，实际是严复。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C2/sections/S2.md
- id: concept:历史:中世纪
  type: Concept
  subject: 历史
  title: 中世纪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把中世纪时间说成从基督教诞生开始，实际应从西罗马帝国灭亡起。
    - 能指出并纠正这一错误：误以为中世纪结束于1453年拜占庭灭亡，其实以文艺复兴为结束标志。
  aliases: []
  category: 历史时期
  explanation: 西罗马帝国灭亡后至文艺复兴前，西欧封建社会时期，又称中世纪。
  misconceptions:
    - 把中世纪时间说成从基督教诞生开始，实际应从西罗马帝国灭亡起。
    - 误以为中世纪结束于1453年拜占庭灭亡，其实以文艺复兴为结束标志。
    - 认为中世纪等于“黑暗时代”，忽略其也有发展（如大学、城市）。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:中世纪大学课程
  type: Concept
  subject: 历史
  title: 中世纪大学课程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“七艺”当成全部大学课程，忽视专业课程如法学、医学、神学。
    - 能指出并纠正这一错误：将基础课程中的“逻辑”说成“辩证法”，或漏掉“算术、几何”等。
  aliases: []
  category: 历史概念
  explanation: 大学基础课程包括文法、修辞、逻辑、算术、几何、天文和音乐，专业课程有法学、医学和神学。
  misconceptions:
    - 把“七艺”当成全部大学课程，忽视专业课程如法学、医学、神学。
    - 将基础课程中的“逻辑”说成“辩证法”，或漏掉“算术、几何”等。
    - 误以为大学课程与今天一样自由选修，实际上基础课程是必修的。
  sourceRef: content/九年级/上册/历史/PEP-9-1-History/chapters/C3/sections/S1.md
- id: concept:历史:中共七大
  type: Concept
  subject: 历史
  title: 中共七大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把确立毛泽东思想写为在遵义会议，而非中共七大。
    - 能指出并纠正这一错误：认为中共七大在1945年抗战胜利后召开，实际是胜利前夕。
  aliases: []
  category: 历史事件
  explanation: 1945年4月，中国共产党第七次全国代表大会在延安召开，确立毛泽东思想为党的指导思想。
  misconceptions:
    - 把确立毛泽东思想写为在遵义会议，而非中共七大。
    - 认为中共七大在1945年抗战胜利后召开，实际是胜利前夕。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C6/sections/S1.md
- id: concept:历史:中共七届二中全会
  type: Concept
  subject: 历史
  title: 中共七届二中全会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为七届二中全会决定党的工作重心由城市转向乡村，正好说反。
    - 能指出并纠正这一错误：将七届二中全会与中共七大地点混淆，以为是在延安召开。
  aliases:
    - 七届二中全会
  category: 历史事件
  explanation: 1949年3月中共中央在河北西柏坡召开的重要会议，确定了全国胜利后党在政治、经济、外交方面的基本政策，决定党的工作重心由乡村转向城市。
  misconceptions:
    - 误以为七届二中全会决定党的工作重心由城市转向乡村，正好说反。
    - 将七届二中全会与中共七大地点混淆，以为是在延安召开。
    - 误以为七届二中全会提出‘建立社会主义制度’或‘进入社会主义社会’。
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C7/sections/S2.md
- id: concept:历史:中共三大
  type: Concept
  subject: 历史
  title: 中共三大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中共三大标志着国共两党合作正式建立，而忽视了国民党一大的标志性意义
    - 能指出并纠正这一错误：把中共三大召开的时间误认为1924年，与国民党一大时间混淆
  aliases:
    - 中国共产党第三次全国代表大会
  category: 历史事件
  explanation: 1923年6月，中国共产党第三次全国代表大会在广州召开，决定与国民党合作，建立革命统一战线，共产党员以个人身份加入国民党。
  misconceptions:
    - 认为中共三大标志着国共两党合作正式建立，而忽视了国民党一大的标志性意义
    - 把中共三大召开的时间误认为1924年，与国民党一大时间混淆
    - 认为中共三大提出了彻底的反帝反封建的革命纲领
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S2.md
- id: concept:历史:中共二十大
  type: Concept
  subject: 历史
  title: 中共二十大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为二十大首次提出“两步走”战略安排，实际是十九大提出。
    - 能指出并纠正这一错误：误将二十大时间说成2023年，实际为2022年10月。
  aliases:
    - 中国共产党第二十次全国代表大会
  category: 历史事件
  explanation: 2022年10月举行，提出以中国式现代化全面推进中华民族伟大复兴，明确两步走战略安排。
  misconceptions:
    - 误认为二十大首次提出“两步走”战略安排，实际是十九大提出。
    - 误将二十大时间说成2023年，实际为2022年10月。
    - 误认为二十大主题是“夺取新时代中国特色社会主义伟大胜利”，那是十九大主题。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:中共二大
  type: Concept
  subject: 历史
  title: 中共二大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把中共二大召开时间记成1921年，与中共一大混淆
    - 能指出并纠正这一错误：误以为中共一大就第一次提出了反帝反封建的民主革命纲领
  aliases:
    - 中国共产党第二次全国代表大会
  category: 历史事件
  explanation: 1922年7月在上海召开，制定了党的最低纲领，第一次提出明确的反帝反封建的民主革命纲领。
  misconceptions:
    - 把中共二大召开时间记成1921年，与中共一大混淆
    - 误以为中共一大就第一次提出了反帝反封建的民主革命纲领
    - 认为二大最高纲领是打倒军阀，混淆了最低纲领与最高纲领
  sourceRef: content/八年级/上册/历史/PEP-8-1-History/chapters/C5/sections/S1.md
- id: concept:历史:中共八大
  type: Concept
  subject: 历史
  title: 中共八大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将中共八大召开时间错记为1954年，实际是1956年。
    - 能指出并纠正这一错误：误认为八大主要矛盾是无产阶级与资产阶级的矛盾，实际是先进制度与落后生产力的矛盾。
  aliases:
    - 中国共产党第八次全国代表大会
  category: 历史事件
  explanation: 1956年召开，正确分析国内主要矛盾，提出集中力量把我国从落后的农业国变为先进的工业国，是探索社会主义建设道路的重要尝试。
  misconceptions:
    - 将中共八大召开时间错记为1954年，实际是1956年。
    - 误认为八大主要矛盾是无产阶级与资产阶级的矛盾，实际是先进制度与落后生产力的矛盾。
    - 把八大任务'农业国变为工业国'说成'工业国变为农业国'，方向颠倒。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C2/sections/S1.md
- id: concept:历史:中共十一届三中全会
  type: Concept
  subject: 历史
  title: 中共十一届三中全会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将十一届三中全会召开时间记成1979年，实际是1978年12月
    - 能指出并纠正这一错误：误以为全会决定继续以阶级斗争为纲，实际是转移到经济建设
  aliases:
    - 十一届三中全会
  category: 历史事件
  explanation: 1978年12月召开，作出把工作重心转移到社会主义现代化建设上来、实行改革开放的历史性决策，是新中国成立以来党的历史上具有深远意义的伟大转折。
  misconceptions:
    - 将十一届三中全会召开时间记成1979年，实际是1978年12月
    - 误以为全会决定继续以阶级斗争为纲，实际是转移到经济建设
    - 误以为会上确立了“两个凡是”方针，实际否定了它
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:中共十三大
  type: Concept
  subject: 历史
  title: 中共十三大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把十三大时间记成1982年，实际是1987年
    - 能指出并纠正这一错误：误认为社会主义初级阶段理论在十一届三中全会已系统阐述
  aliases: []
  category: 历史会议
  explanation: 1987年举行，系统阐述社会主义初级阶段理论，提出党的基本路线。
  misconceptions:
    - 把十三大时间记成1982年，实际是1987年
    - 误认为社会主义初级阶段理论在十一届三中全会已系统阐述
    - 误以为十三大提出建立社会主义市场经济体制目标
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C3/sections/S1.md
- id: concept:历史:中共十九大
  type: Concept
  subject: 历史
  title: 中共十九大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把社会主要矛盾写成‘人民日益增长的物质文化需要同落后的社会生产之间的矛盾’。
    - 能指出并纠正这一错误：将习近平新时代中国特色社会主义思想简称为‘新时代中国特色社会主义思想’，表述不准确。
  aliases: []
  category: 历史事件
  explanation: 2017年召开，确立习近平新时代中国特色社会主义思想为党的指导思想，提出社会主要矛盾转化。
  misconceptions:
    - 误把社会主要矛盾写成‘人民日益增长的物质文化需要同落后的社会生产之间的矛盾’。
    - 将习近平新时代中国特色社会主义思想简称为‘新时代中国特色社会主义思想’，表述不准确。
    - 误认为‘两个一百年’奋斗目标在十九大提出，实际是十八大。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C6/sections/S1.md
- id: concept:历史:中共十九届六中全会
  type: Concept
  subject: 历史
  title: 中共十九届六中全会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为十九届六中全会通过的是“十四五”规划建议，实际是五中全会。
    - 能指出并纠正这一错误：误将全会时间记成2022年，实际为2021年11月。
  aliases:
    - 十九届六中全会
  category: 历史事件
  explanation: 2021年11月召开，通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》，总结党的百年奋斗重大成就和历史经验。
  misconceptions:
    - 误认为十九届六中全会通过的是“十四五”规划建议，实际是五中全会。
    - 误将全会时间记成2022年，实际为2021年11月。
    - 误认为全会总结了“四个全面”战略布局的成就，实际是全面总结党的百年奋斗重大成就和历史经验。
  sourceRef: content/八年级/下册/历史/PEP-8-2-History/chapters/C7/sections/S1.md
- id: concept:历史:中共十九届四中全会
  type: Concept
  subject: 历史
  title: 中共十九届四中全会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为十九届四中全会主题是‘全面深化改革’，实际是十八届三中全会。
    - 能指出并纠正这一错误：把‘国家治理体系和治理能力现代化’省略为‘国家治理现代化’，丢掉了‘体系’和‘能力’。
  aliases: []
  category: 历史事件
