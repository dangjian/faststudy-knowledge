- id: concept:生物:ABO血型系统
  type: Concept
  subject: 生物
  title: ABO血型系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为O型血是万能血，可大量输给任何血型的人，实际O型血血清中含抗A和抗B抗体，大量输注会凝集
    - 能指出并纠正这一错误：认为AB型血能接受任何血型的血，但AB型血浆中无抗A抗B，输血时仍以同型血为原则
  aliases:
    - ABO血型
  category: 医学概念
  explanation: ABO血型系统是最常见的血型系统，分为A型、B型、AB型和O型，输血时以输同型血为原则。
  misconceptions:
    - 认为O型血是万能血，可大量输给任何血型的人，实际O型血血清中含抗A和抗B抗体，大量输注会凝集
    - 认为AB型血能接受任何血型的血，但AB型血浆中无抗A抗B，输血时仍以同型血为原则
    - 把输血原则误记为‘O型血只能接受O型血’，忽略同型血优先
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:AED（自动体外除颤器）
  type: Concept
  subject: 生物
  title: AED（自动体外除颤器）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为AED会自动分析并电击，无需人工操作，实际需按语音提示贴电极并按下按钮。
    - 能指出并纠正这一错误：用AED除颤后即停止心肺复苏，实际除颤后还需持续按压和人工呼吸。
  aliases:
    - 自动体外除颤器
  category: 急救设备
  explanation: AED是一种便携式医疗设备，能自动分析心律并给予电击，使心跳恢复正常，用于心搏骤停的急救。
  misconceptions:
    - 认为AED会自动分析并电击，无需人工操作，实际需按语音提示贴电极并按下按钮。
    - 用AED除颤后即停止心肺复苏，实际除颤后还需持续按压和人工呼吸。
    - 将AED电极片随意贴在前胸，导致无法正确分析心律，应贴右锁骨下和左乳头外侧。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:BMI
  type: Concept
  subject: 生物
  title: BMI
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：算BMI时用体重除以身高（没平方），如60kg/1.7m得35.3，结果错误。
    - 能指出并纠正这一错误：认为BMI越小越健康，忽略过低也属于营养不良。
  aliases:
    - 体重指数
  category: 概念
  explanation: BMI即体重指数，是体重（千克）除以身高（米）的平方得出的数值，用于评价体重是否适宜。
  misconceptions:
    - 算BMI时用体重除以身高（没平方），如60kg/1.7m得35.3，结果错误。
    - 认为BMI越小越健康，忽略过低也属于营养不良。
    - 觉得BMI正常就完全没有健康问题，把BMI和疾病诊断划等号。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:DDT
  type: Concept
  subject: 生物
  title: DDT
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：DDT只在土壤中残留，不会进入生物体
    - 能指出并纠正这一错误：DDT在自然环境中分解很快，不会长期残留
  aliases:
    - 滴滴涕
  category: 化学物质
  explanation: 一种有机氯杀虫剂，曾广泛使用，但因对生态环境和生物造成危害而被许多国家禁用。
  misconceptions:
    - DDT只在土壤中残留，不会进入生物体
    - DDT在自然环境中分解很快，不会长期残留
    - DDT已被所有国家禁用，现在环境中没有DDT了
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S3.md
- id: concept:生物:DNA
  type: Concept
  subject: 生物
  title: DNA
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为DNA只存在于细胞核，忽略线粒体和叶绿体中也有少量。
    - 能指出并纠正这一错误：误以为一切生物的遗传物质都是DNA，却不知RNA病毒以RNA为遗传物质。
  aliases:
    - 脱氧核糖核酸
  category: 生物学概念
  explanation: 脱氧核糖核酸的简称，是主要的遗传物质，主要存在于细胞核中，细胞质中的叶绿体和线粒体内也有少量。
  misconceptions:
    - 认为DNA只存在于细胞核，忽略线粒体和叶绿体中也有少量。
    - 误以为一切生物的遗传物质都是DNA，却不知RNA病毒以RNA为遗传物质。
    - 把DNA与染色体等同，其实染色体由DNA和蛋白质组成。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:HIV
  type: Concept
  subject: 生物
  title: HIV
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为HIV只存在于血液中，精液、乳汁等其他体液不含病毒
    - 能指出并纠正这一错误：认为与HIV携带者拥抱、握手会感染艾滋病
  aliases:
    - 人类免疫缺陷病毒
  category: 病原体
  explanation: 艾滋病病毒，存在于HIV携带者和艾滋病患者的血液、精液、乳汁、唾液、泪液和尿液中。
  misconceptions:
    - 认为HIV只存在于血液中，精液、乳汁等其他体液不含病毒
    - 认为与HIV携带者拥抱、握手会感染艾滋病
    - 认为艾滋病可用抗生素治疗，把HIV当成细菌
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:Y染色体上的性别决定基因
  type: Concept
  subject: 生物
  title: Y染色体上的性别决定基因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为Y染色体上只有性别决定基因，没有其他基因，如SRY只是其中之一。
    - 能指出并纠正这一错误：误以为X染色体上也含有决定睾丸形成的基因，所以XX个体也能发育为男性。
  aliases:
    - SRY基因
  category: 遗传学概念
  explanation: Y染色体上决定雄性性别的基因，决定睾丸的形成和精子产生。
  misconceptions:
    - 认为Y染色体上只有性别决定基因，没有其他基因，如SRY只是其中之一。
    - 误以为X染色体上也含有决定睾丸形成的基因，所以XX个体也能发育为男性。
    - 误认为儿子性别由母亲决定，因为母亲提供X，父亲提供Y，实际父亲精子类型决定。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:pH
  type: Concept
  subject: 生物
  title: pH
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为pH越大酸性越强，误将pH=0当碱性最强
    - 能指出并纠正这一错误：用蒸馏水润湿pH试纸后测溶液，认为读数不变，实际酸性溶液pH偏大、碱性偏小
  aliases:
    - 酸碱度
  category: 化学
  explanation: 衡量溶液酸碱性的指标，范围0~14，pH=7中性，小于7酸性，大于7碱性。
  misconceptions:
    - 认为pH越大酸性越强，误将pH=0当碱性最强
    - 用蒸馏水润湿pH试纸后测溶液，认为读数不变，实际酸性溶液pH偏大、碱性偏小
    - 认为pH=7就是纯水，忽略中性盐溶液（如NaCl）pH也为7
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:《中华人民共和国反食品浪费法》
  type: Concept
  subject: 生物
  title: 《中华人民共和国反食品浪费法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《反食品浪费法》只是道德倡议，浪费食物不违法。
    - 能指出并纠正这一错误：认为该法只约束餐饮企业，个人剩饭不受任何法律约束。
  aliases: []
  category: 法律
  explanation: 我国于2021年施行的防止食品浪费、保障国家粮食安全的法律。
  misconceptions:
    - 误以为《反食品浪费法》只是道德倡议，浪费食物不违法。
    - 认为该法只约束餐饮企业，个人剩饭不受任何法律约束。
    - 误以为该法规定所有剩余食物必须打包，否则违法。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S3.md
- id: concept:生物:《中华人民共和国食品安全法》
  type: Concept
  subject: 生物
  title: 《中华人民共和国食品安全法》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《食品安全法》只管食品生产，不管销售和餐饮环节。
    - 能指出并纠正这一错误：认为买到过期食品只能自认倒霉，不知道可以依法索赔。
  aliases: []
  category: 法律
  explanation: 我国颁布的保障食品安全的法律，规范食品生产经营活动。
  misconceptions:
    - 误以为《食品安全法》只管食品生产，不管销售和餐饮环节。
    - 认为买到过期食品只能自认倒霉，不知道可以依法索赔。
    - 误以为食品添加剂都是非法物质，法律禁止使用所有添加剂。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S3.md
- id: concept:生物:《中国居民膳食指南（2022）》
  type: Concept
  subject: 生物
  title: 《中国居民膳食指南（2022）》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为膳食指南是强制法规，违反会受到处罚。
    - 能指出并纠正这一错误：认为八条准则适用于所有人群，包括婴幼儿和病人。
  aliases:
    - 膳食指南
    - 《中国居民膳食指南》
  category: 膳食指南
  explanation: 中国营养学会制订的指导居民合理膳食的权威指南，提出了八条平衡膳食准则。
  misconceptions:
    - 误以为膳食指南是强制法规，违反会受到处罚。
    - 认为八条准则适用于所有人群，包括婴幼儿和病人。
    - 误以为指南中的‘适量’就是固定克数，忽略个体差异。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S3.md
- id: concept:生物:上皮组织
  type: Concept
  subject: 生物
  title: 上皮组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为上皮组织只分布在身体表面，不知道胃肠腔壁内也有上皮组织
    - 能指出并纠正这一错误：把上皮组织与植物的保护组织混淆，以为上皮组织也属于植物体结构
  aliases:
    - 上皮组织
  category: 生物学概念
  explanation: 由上皮细胞构成，具有保护、分泌等功能，如皮肤上皮能保护体表，小肠腺上皮能分泌消化液。
  misconceptions:
    - 认为上皮组织只分布在身体表面，不知道胃肠腔壁内也有上皮组织
    - 把上皮组织与植物的保护组织混淆，以为上皮组织也属于植物体结构
    - 认为上皮组织只能保护，不能分泌，忽略小肠腺上皮能分泌消化液
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:不利变异
  type: Concept
  subject: 生物
  title: 不利变异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为不利变异在任何环境下都不利，如矮小在干旱区可能是优势。
    - 能指出并纠正这一错误：认为不利变异一定会被自然选择淘汰，但环境改变后可能被保留。
  aliases: []
  category: 生物学概念
  explanation: 不利于生物生存的变异，容易被自然选择淘汰。
  misconceptions:
    - 认为不利变异在任何环境下都不利，如矮小在干旱区可能是优势。
    - 认为不利变异一定会被自然选择淘汰，但环境改变后可能被保留。
    - 认为不利变异不能遗传，只要基因改变就能遗传。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S3.md
- id: concept:生物:不遗传的变异
  type: Concept
  subject: 生物
  title: 不遗传的变异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为环境引起的变异一定不能遗传，如紫外线诱发基因突变后仍认为不变异。
    - 能指出并纠正这一错误：误认为水肥充足导致的高产小麦一定能遗传，实际这属于不遗传的变异。
  aliases:
    - 不可遗传的变异
  category: 生物学概念
  explanation: 单纯由环境引起的变异，如果没有影响遗传物质，一般不会遗传给后代。
  misconceptions:
    - 误认为环境引起的变异一定不能遗传，如紫外线诱发基因突变后仍认为不变异。
    - 误认为水肥充足导致的高产小麦一定能遗传，实际这属于不遗传的变异。
    - 误认为不遗传的变异对生物个体没有意义，但环境引起的有益变异可帮助生存。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S5.md
- id: concept:生物:两侧对称
  type: Concept
  subject: 生物
  title: 两侧对称
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水螅也是两侧对称，因为水螅的身体也能分出左右。
    - 能指出并纠正这一错误：误以为两侧对称就是身体上下对称或前后对称，把辐射对称也算进去。
  aliases:
    - 左右对称
  category: 生物概念
  explanation: 经过动物体的中央轴只有一个切面能将身体分为左右相等的两部分，如扁形动物。
  misconceptions:
    - 认为水螅也是两侧对称，因为水螅的身体也能分出左右。
    - 误以为两侧对称就是身体上下对称或前后对称，把辐射对称也算进去。
    - 将两侧对称与左右镜像混淆，认为所有两侧对称动物内部器官也是左右完全一样。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:两栖动物
  type: Concept
  subject: 生物
  title: 两栖动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为两栖动物成体完全用鳃呼吸，忽略多数成体用肺呼吸兼皮肤辅助。
    - 能指出并纠正这一错误：认为“两栖”就是可长期生活在陆地和水中，实际幼体必须水生，成体皮肤需湿润。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 误以为两栖动物成体完全用鳃呼吸，忽略多数成体用肺呼吸兼皮肤辅助。
    - 认为“两栖”就是可长期生活在陆地和水中，实际幼体必须水生，成体皮肤需湿润。
    - 误将龟、鳄鱼归为两栖动物，它们体表有角质鳞片属爬行动物。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:两栖动物与人类生活的关系
  type: Concept
  subject: 生物
  title: 两栖动物与人类生活的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有两栖动物都能捕食害虫，忽略牛蛙等外来物种会破坏生态平衡。
    - 能指出并纠正这一错误：觉得两栖动物只能作为食物或捕虫工具，不知道有些种类可分泌毒素。
  aliases: []
  category: 生物学应用
  explanation: 两栖动物如青蛙能捕食害虫，牛蛙等可作为食物，但外来物种可能造成危害。
  misconceptions:
    - 认为所有两栖动物都能捕食害虫，忽略牛蛙等外来物种会破坏生态平衡。
    - 觉得两栖动物只能作为食物或捕虫工具，不知道有些种类可分泌毒素。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:两栖动物的主要特征
  type: Concept
  subject: 生物
  title: 两栖动物的主要特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为两栖动物成体只靠肺呼吸，完全忽略皮肤辅助呼吸的作用。
    - 能指出并纠正这一错误：误以为两栖动物幼体也用肺呼吸，实际幼体生活在水中用鳃呼吸。
  aliases:
    - 两栖动物特征
  category: 生物学概念
  explanation: 两栖动物的幼体生活在水中，用鳃呼吸；成体大多生活在陆地上，也可在水中游泳，用肺呼吸，皮肤可辅助呼吸。
  misconceptions:
    - 认为两栖动物成体只靠肺呼吸，完全忽略皮肤辅助呼吸的作用。
    - 误以为两栖动物幼体也用肺呼吸，实际幼体生活在水中用鳃呼吸。
    - 把两栖动物归为恒温动物，实际上它们体温随环境变化。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:两栖动物的呼吸方式
  type: Concept
  subject: 生物
  title: 两栖动物的呼吸方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为两栖动物的肺很发达，实际上肺结构简单，需皮肤辅助呼吸。
    - 能指出并纠正这一错误：误以为干燥的皮肤也能辅助呼吸，实际必须保持湿润才能进行气体交换。
  aliases:
    - 青蛙呼吸
  category: 生物学概念
  explanation: 两栖动物成体用肺呼吸，但肺不发达，皮肤湿润且密布毛细血管，可辅助呼吸。
  misconceptions:
    - 认为两栖动物的肺很发达，实际上肺结构简单，需皮肤辅助呼吸。
    - 误以为干燥的皮肤也能辅助呼吸，实际必须保持湿润才能进行气体交换。
    - 认为幼体也靠肺呼吸和皮肤辅助，实际幼体用鳃呼吸，无皮肤辅助。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:乙肝疫苗
  type: Concept
  subject: 生物
  title: 乙肝疫苗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为接种乙肝疫苗后一定不会感染乙肝，忽略疫苗可能失效或接种前已感染。
    - 能指出并纠正这一错误：把乙肝疫苗当成治疗药物，发病后才注射来治病。
  aliases: []
  category: 概念
  explanation: 用于预防乙型病毒性肝炎的疫苗，我国第一代乙肝疫苗由陶其敏等人研制。
  misconceptions:
    - 认为接种乙肝疫苗后一定不会感染乙肝，忽略疫苗可能失效或接种前已感染。
    - 把乙肝疫苗当成治疗药物，发病后才注射来治病。
    - 误以为乙肝疫苗是抗体，注射后直接中和病毒，实际是抗原刺激免疫系统。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:事实和观点
  type: Concept
  subject: 生物
  title: 事实和观点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“人猿同祖”当成事实，实际是科学观点。
    - 能指出并纠正这一错误：认为经过验证的观点就是事实，如说“进化论是事实”。
  aliases:
    - 事实与观点
  category: 科学方法
  explanation: 事实是客观存在的，观点是基于事实的解释或推断，科学探究中需区分。
  misconceptions:
    - 把“人猿同祖”当成事实，实际是科学观点。
    - 认为经过验证的观点就是事实，如说“进化论是事实”。
    - 误认为“化石被发现”是观点，实为客观事实。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:人体的三道防线
  type: Concept
  subject: 生物
  title: 人体的三道防线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为皮肤和黏膜只属于第一道防线，而黏膜分泌的杀菌物质属于第二道防线，混淆防线层次
    - 能指出并纠正这一错误：把体液中的溶菌酶当作第一道防线，误以为杀菌物质都由皮肤分泌
  aliases: []
  category: 核心概念
  explanation: 人体抵御病原体入侵的三道防线：第一道防线是皮肤和黏膜，第二道防线是体液中的杀菌物质和吞噬细胞，第三道防线是免疫器官和免疫细胞。
  misconceptions:
    - 认为皮肤和黏膜只属于第一道防线，而黏膜分泌的杀菌物质属于第二道防线，混淆防线层次
    - 把体液中的溶菌酶当作第一道防线，误以为杀菌物质都由皮肤分泌
    - 认为吞噬细胞只在第二道防线起作用，忽略其在第三道防线也参与抗原呈递
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:人体的呼吸
  type: Concept
  subject: 生物
  title: 人体的呼吸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把呼吸运动当成呼吸作用，认为呼吸作用在肺进行，忽略细胞才进行呼吸作用
    - 能指出并纠正这一错误：认为吸气时氧气进入血液，呼气时二氧化碳排出体外，实际气体交换在肺泡处进行
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 把呼吸运动当成呼吸作用，认为呼吸作用在肺进行，忽略细胞才进行呼吸作用
    - 认为吸气时氧气进入血液，呼气时二氧化碳排出体外，实际气体交换在肺泡处进行
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S1.md
- id: concept:生物:人工呼吸
  type: Concept
  subject: 生物
  title: 人工呼吸
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：吹气时不捏紧患者鼻孔，导致气体从鼻腔漏出，胸廓无起伏
    - 能指出并纠正这一错误：认为吹气越用力越好，可能造成胃部膨胀或损伤
  aliases:
    - 口对口吹气法
  category: 急救技能
  explanation: 最常用口对口吹气法，每次吹气持续1秒以上，与胸外按压交替进行。
  misconceptions:
    - 吹气时不捏紧患者鼻孔，导致气体从鼻腔漏出，胸廓无起伏
    - 认为吹气越用力越好，可能造成胃部膨胀或损伤
    - 以为人工呼吸只需吹气，不必与胸外按压交替进行
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:人工繁育与野外放归
  type: Concept
  subject: 生物
  title: 人工繁育与野外放归
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人工繁育成功即可直接放归，忽略了野外生存训练和适应性评估
    - 能指出并纠正这一错误：将人工繁育与野外放归顺序颠倒，认为先放归再人工繁殖
  aliases:
    - 再引入
  category: 生态保护
  explanation: 对珍稀濒危物种进行人工繁殖并放归自然，以恢复其野外种群。
  misconceptions:
    - 认为人工繁育成功即可直接放归，忽略了野外生存训练和适应性评估
    - 将人工繁育与野外放归顺序颠倒，认为先放归再人工繁殖
    - 认为人工繁育就是圈养，不需要与野外种群交流基因
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:人工角膜
  type: Concept
  subject: 生物
  title: 人工角膜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为人工角膜是捐献的活体角膜，实际是人工合成材料
    - 能指出并纠正这一错误：以为人工角膜能替代整个眼球，只替代角膜部分
  aliases: []
  category: 医学技术
  explanation: 人工制造的可替代角膜的移植物，用于角膜疾病致盲患者，我国已用于临床。
  misconceptions:
    - 误以为人工角膜是捐献的活体角膜，实际是人工合成材料
    - 以为人工角膜能替代整个眼球，只替代角膜部分
    - 认为人工角膜可治疗白内障、青光眼等所有致盲眼病
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:人工选择
  type: Concept
  subject: 生物
  title: 人工选择
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为变异是人为定向诱导产生的，如以为用X射线照射种子就能得到所需性状，实际变异不定向，人工选择只…
    - 能指出并纠正这一错误：把人工选择与自然选择混为一谈，如认为高产水稻是自然进化形成的，忽视了人类选育的作用。
  aliases:
    - 选择育种
  category: 进化机制
  explanation: 人类根据需求对生物进行选择，培育出符合人类需要的品种。
  misconceptions:
    - 认为变异是人为定向诱导产生的，如以为用X射线照射种子就能得到所需性状，实际变异不定向，人工选择只是选出已有变异。
    - 把人工选择与自然选择混为一谈，如认为高产水稻是自然进化形成的，忽视了人类选育的作用。
    - 认为人工选择的性状都对生物自身有利，如认为宠物狗的短鼻子比野狼的长鼻更适应野外生存。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S3.md
- id: concept:生物:人痘接种法
  type: Concept
  subject: 生物
  title: 人痘接种法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人痘接种法误认为是詹纳发明的牛痘接种法，混淆两法来源。
    - 能指出并纠正这一错误：认为人痘接种法是直接注射天花病毒，而不是接种轻症患者的痘浆。
  aliases:
    - 人痘
  category: 医学史
  explanation: 我国古代发明的一种预防天花的方法，将轻症天花患者的痘浆接种到健康人身上，使其产生对天花的免疫力。
  misconceptions:
    - 把人痘接种法误认为是詹纳发明的牛痘接种法，混淆两法来源。
    - 认为人痘接种法是直接注射天花病毒，而不是接种轻症患者的痘浆。
    - 以为人痘接种法出自西方，不知道是我国古代发明的。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:人的生殖
  type: Concept
  subject: 生物
  title: 人的生殖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为受精卵在子宫内形成并开始分裂，实际受精发生在输卵管中
    - 能指出并纠正这一错误：认为胎儿在子宫内通过鼻孔呼吸，实际依靠胎盘和脐带从母体获得氧气
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 误以为受精卵在子宫内形成并开始分裂，实际受精发生在输卵管中
    - 认为胎儿在子宫内通过鼻孔呼吸，实际依靠胎盘和脐带从母体获得氧气
    - 把胎盘当成母体器官，不知道胎盘是胎儿与母体交换物质的结构
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:人类和现代类人猿的共同祖先是古猿
  type: Concept
  subject: 生物
  title: 人类和现代类人猿的共同祖先是古猿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人类由黑猩猩进化而来，实际二者有共同祖先古猿。
    - 能指出并纠正这一错误：把古猿当成古人类，以为他们像现代人一样直立行走并使用工具。
  aliases:
    - 人猿同祖
  category: 进化事实
  explanation: 达尔文提出人类和现代类人猿有共同祖先，即古猿。
  misconceptions:
    - 认为人类由黑猩猩进化而来，实际二者有共同祖先古猿。
    - 把古猿当成古人类，以为他们像现代人一样直立行走并使用工具。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:人类活动对生态环境的影响
  type: Concept
  subject: 生物
  title: 人类活动对生态环境的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：人类活动对生态环境只有破坏作用，没有正面影响
    - 能指出并纠正这一错误：只有工业生产污染环境，农业生产不会破坏生态
  aliases: []
  category: 生态学概念
  explanation: 人类活动如使用杀虫剂等会对生态环境产生正面或负面的影响，可能导致生物多样性下降和生态失衡。
  misconceptions:
    - 人类活动对生态环境只有破坏作用，没有正面影响
    - 只有工业生产污染环境，农业生产不会破坏生态
    - 人类生态影响只发生在局部区域，不会影响全球
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:人类活动对生物圈的影响
  type: Concept
  subject: 生物
  title: 人类活动对生物圈的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有工业活动才破坏生物圈，农业活动不会造成生态环境问题
    - 能指出并纠正这一错误：觉得人类活动对生物圈的影响都是立竿见影的，忽略长期累积效应
  aliases: []
  category: 生态学
  explanation: 人类活动可能破坏生态系统，造成生态环境问题，如酸雨、全球变暖等。
  misconceptions:
    - 认为只有工业活动才破坏生物圈，农业活动不会造成生态环境问题
    - 觉得人类活动对生物圈的影响都是立竿见影的，忽略长期累积效应
    - 将酸雨、全球变暖等所有环境问题都归因于单一的某种人类活动
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:人类起源
  type: Concept
  subject: 生物
  title: 人类起源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人类起源于现代猕猴等猴类。
    - 能指出并纠正这一错误：认为人类起源由神创造，混淆科学与宗教。
  aliases:
    - 人猿同祖
  category: 生物学概念
  explanation: 关于人类由来的科学解释，达尔文提出人类和现代类人猿的共同祖先是古猿。
  misconceptions:
    - 认为人类起源于现代猕猴等猴类。
    - 认为人类起源由神创造，混淆科学与宗教。
    - 认为研究人类起源只有化石证据，忽视分子生物学等。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:从猿到人的进化
  type: Concept
  subject: 生物
  title: 从猿到人的进化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为从猿到人先使用工具再直立行走，实际先有直立行走。
    - 能指出并纠正这一错误：认为古猿因用进废退而下地直立，实际由自然选择决定。
  aliases: []
  category: 进化过程
  explanation: 古猿下地生活后，经过自然选择，逐渐向直立行走、使用工具、脑发达等方向进化。
  misconceptions:
    - 认为从猿到人先使用工具再直立行走，实际先有直立行走。
    - 认为古猿因用进废退而下地直立，实际由自然选择决定。
    - 认为大脑先发达才直立行走，实际直立行走促进脑发育。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:会厌软骨
  type: Concept
  subject: 生物
  title: 会厌软骨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为会厌软骨在食管入口，吞咽时盖住食管。
    - 能指出并纠正这一错误：认为平时会厌软骨盖住喉口，呼吸时打开。
  aliases:
    - epiglottis
  category: 解剖结构
  explanation: 会厌软骨位于喉口，吞咽时盖住喉口，防止食物进入气管。
  misconceptions:
    - 误以为会厌软骨在食管入口，吞咽时盖住食管。
    - 认为平时会厌软骨盖住喉口，呼吸时打开。
    - 误以为会厌软骨属于发声器官，是声带的一部分。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S1.md
- id: concept:生物:传入神经
  type: Concept
  subject: 生物
  title: 传入神经
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将传入神经误认为是从神经中枢传到效应器的通路，方向完全颠倒
    - 能指出并纠正这一错误：画反射弧时把传入神经放在传出神经后面，顺序排错
  aliases: []
  category: 生物学概念
  explanation: 传入神经将感受器产生的神经冲动传导到神经中枢。
  misconceptions:
    - 将传入神经误认为是从神经中枢传到效应器的通路，方向完全颠倒
    - 画反射弧时把传入神经放在传出神经后面，顺序排错
    - 认为缩手反射中神经冲动是由脊髓传向手指，混淆了传入和传出
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:传出神经
  type: Concept
  subject: 生物
  title: 传出神经
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将传出神经误认为承担感受器至神经中枢的传导，与传入神经混淆
    - 能指出并纠正这一错误：画反射弧时把传出神经放在神经中枢之前，起始位置搞错
  aliases: []
  category: 生物学概念
  explanation: 传出神经将神经中枢发出的神经冲动传导到效应器。
  misconceptions:
    - 将传出神经误认为承担感受器至神经中枢的传导，与传入神经混淆
    - 画反射弧时把传出神经放在神经中枢之前，起始位置搞错
    - 认为缩手反射中手部肌肉的收缩信号由传入神经传递，功能颠倒
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:传播途径
  type: Concept
  subject: 生物
  title: 传播途径
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为传播途径是病原体本身，如说'流感病毒是传播途径'，实际传染源是患者。
    - 能指出并纠正这一错误：把传播途径和传染源混淆，如说'咳嗽是传染源'，实际咳嗽是飞沫传播途径的表现。
  aliases: []
  category: 生物学概念
  explanation: 病原体离开传染源到达人或动物所经过的途径。
  misconceptions:
    - 误认为传播途径是病原体本身，如说'流感病毒是传播途径'，实际传染源是患者。
    - 把传播途径和传染源混淆，如说'咳嗽是传染源'，实际咳嗽是飞沫传播途径的表现。
    - 认为传播途径只有空气传播，忽略接触、血液等其他途径。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:传染源
  type: Concept
  subject: 生物
  title: 传染源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为传染源是病原体，如说'新冠病毒是传染源'，实际传染源是人或动物。
    - 能指出并纠正这一错误：认为只有发病的患者才是传染源，忽略无症状感染者。
  aliases: []
  category: 生物学概念
  explanation: 能够散播病原体的人或动物。
  misconceptions:
    - 误认为传染源是病原体，如说'新冠病毒是传染源'，实际传染源是人或动物。
    - 认为只有发病的患者才是传染源，忽略无症状感染者。
    - 认为宠物不是传染源，但某些动物可携带病原体传播。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:传染病
  type: Concept
  subject: 生物
  title: 传染病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有病原体引起的疾病都是传染病，如破伤风虽由细菌引起但不人传人。
    - 能指出并纠正这一错误：认为传染病只能通过空气或接触传播，忽略血液、母婴等传播途径。
  aliases: []
  category: 概念
  explanation: 由病原体（如细菌、病毒、寄生虫等）引起的、能在人与人或人与动物之间传播的疾病。
  misconceptions:
    - 认为所有病原体引起的疾病都是传染病，如破伤风虽由细菌引起但不人传人。
    - 认为传染病只能通过空气或接触传播，忽略血液、母婴等传播途径。
    - 认为得过传染病后终生免疫，忽略病原体变异会导致重复感染。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:传染病分类
  type: Concept
  subject: 生物
  title: 传染病分类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为艾滋病是甲类传染病，实际甲类只有鼠疫和霍乱。
    - 能指出并纠正这一错误：认为非典是甲类，实际法定为乙类但按甲类管理。
  aliases: []
  category: 生物学事实
  explanation: 《中华人民共和国传染病防治法》将传染病分为甲类、乙类和丙类，甲类传染病危害最大，包括鼠疫和霍乱。
  misconceptions:
    - 误认为艾滋病是甲类传染病，实际甲类只有鼠疫和霍乱。
    - 认为非典是甲类，实际法定为乙类但按甲类管理。
    - 认为丙类传染病危害大于乙类，实际甲类危害最大。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:传染病及其预防
  type: Concept
  subject: 生物
  title: 传染病及其预防
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为把患病的动物杀死属于切断传播途径，实际是控制传染源
    - 能指出并纠正这一错误：把蚊虫叮咬当作传染源，实际蚊子是传播途径中的生物媒介
  aliases: []
  category: 传染病学
  explanation: 传染病由病原体引起，具有传染性和流行性，预防措施包括控制传染源、切断传播途径和保护易感人群。
  misconceptions:
    - 认为把患病的动物杀死属于切断传播途径，实际是控制传染源
    - 把蚊虫叮咬当作传染源，实际蚊子是传播途径中的生物媒介
    - 认为打疫苗是控制传染源，实际是保护易感人群
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:传染病流行的基本环节
  type: Concept
  subject: 生物
  title: 传染病流行的基本环节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为切断传播途径就能阻止传染病流行，忽略传染源和易感人群。
    - 能指出并纠正这一错误：把三个环节顺序颠倒，如说'先有传播途径再有传染源'。
  aliases:
    - 传染病流行三环节
  category: 生物学规律
  explanation: 传染病在人群中流行必须经过传染源、传播途径和易感人群三个基本环节，缺少任何一个环节传染病就流行不起来。
  misconceptions:
    - 认为切断传播途径就能阻止传染病流行，忽略传染源和易感人群。
    - 把三个环节顺序颠倒，如说'先有传播途径再有传染源'。
    - 认为传染病流行只需两个环节，如只有传染源和传播途径。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:传染病的预防措施
  type: Concept
  subject: 生物
  title: 传染病的预防措施
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把戴口罩、勤洗手当作控制传染源，实际是切断传播途径。
    - 能指出并纠正这一错误：认为隔离病人是切断传播途径，实际是控制传染源。
  aliases:
    - 预防传染病措施
  category: 生物学概念
  explanation: 针对传染病流行的三个基本环节，采取控制传染源、切断传播途径和保护易感人群等措施，以阻止传染病传播。
  misconceptions:
    - 把戴口罩、勤洗手当作控制传染源，实际是切断传播途径。
    - 认为隔离病人是切断传播途径，实际是控制传染源。
    - 认为只采取一种措施就能预防所有传染病，忽视综合措施。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:传染病预防
  type: Concept
  subject: 生物
  title: 传染病预防
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把蚊虫等传播媒介当成传染源，如认为疟疾的传染源是蚊子，实际是疟原虫患者或携带者
    - 能指出并纠正这一错误：隔离传染病患者属于切断传播途径，实际是控制传染源，如隔离新冠患者是控制传染源
  aliases:
    - 预防传染病
  category: 健康素养
  explanation: 通过控制传染源、切断传播途径、保护易感人群等措施有效预防传染病。
  misconceptions:
    - 把蚊虫等传播媒介当成传染源，如认为疟疾的传染源是蚊子，实际是疟原虫患者或携带者
    - 隔离传染病患者属于切断传播途径，实际是控制传染源，如隔离新冠患者是控制传染源
    - 认为保护易感人群只需接种疫苗，忽略锻炼身体、营养等非特异性措施，如流感季节全员接种疫苗才算
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:体内受精
  type: Concept
  subject: 生物
  title: 体内受精
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为体内受精就是胎生，如认为蝗虫体内受精所以胎生
    - 能指出并纠正这一错误：认为所有陆生动物都是体内受精，忽略青蛙等体外受精
  aliases: []
  category: 受精方式
  explanation: 精子和卵细胞在雌性体内完成受精的方式，如蝗虫、黑翅长脚鹬。
  misconceptions:
    - 误以为体内受精就是胎生，如认为蝗虫体内受精所以胎生
    - 认为所有陆生动物都是体内受精，忽略青蛙等体外受精
    - 认为体内受精的卵细胞在雌体内发育成新个体，混淆受精与胚胎发育
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:体外受精
  type: Concept
  subject: 生物
  title: 体外受精
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为体外受精是无性生殖，因为受精过程在体外完成
    - 能指出并纠正这一错误：认为体外受精的动物都不产卵，如青蛙直接产小蛙
  aliases: []
  category: 受精方式
  explanation: 精子和卵细胞在体外（通常在水中）完成受精的方式，如水螅、斗鱼、青蛙。
  misconceptions:
    - 误以为体外受精是无性生殖，因为受精过程在体外完成
    - 认为体外受精的动物都不产卵，如青蛙直接产小蛙
    - 认为体外受精后受精卵在母体内发育成新个体
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:体循环
  type: Concept
  subject: 生物
  title: 体循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把体循环起点写成右心室，实际应从左心室出发
    - 能指出并纠正这一错误：认为体循环中血液从动脉血变成静脉血，于是误以为起点是右心室流出静脉血
  aliases:
    - 大循环
  category: 生理学概念
  explanation: 体循环是血液从左心室出发，经主动脉流向全身，再经上下腔静脉回到右心房的循环路径。
  misconceptions:
    - 把体循环起点写成右心室，实际应从左心室出发
    - 认为体循环中血液从动脉血变成静脉血，于是误以为起点是右心室流出静脉血
    - 颠倒体循环路径，写成‘左心房→主动脉→全身→上下腔静脉→右心房’
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S3.md
- id: concept:生物:体液传播
  type: Concept
  subject: 生物
  title: 体液传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为体液传播只指性传播，忽略血液、乳汁等体液。
    - 能指出并纠正这一错误：认为唾液属于体液传播的常见途径，实际艾滋病不通过唾液传播。
  aliases: []
  category: 生物学概念
  explanation: 病原体存在于血液、精液或乳汁等体液中，通过性接触、血液等传播，如艾滋病、乙肝等。
  misconceptions:
    - 误认为体液传播只指性传播，忽略血液、乳汁等体液。
    - 认为唾液属于体液传播的常见途径，实际艾滋病不通过唾液传播。
    - 将体液传播与接触传播混同，认为握手属于体液传播。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:体育运动对健康的影响
  type: Concept
  subject: 生物
  title: 体育运动对健康的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为体育运动只对运动系统有益，忽视它还能改善神经系统和循环系统。
    - 能指出并纠正这一错误：把身高增长完全归因于骨骼生长，忽略肌肉发育的促进作用。
  aliases: []
  category: 健康
  explanation: 体育运动促进血液循环、改善运动系统营养、提高神经系统灵敏度，促进青少年肌肉发育和身高增长。
  misconceptions:
    - 认为体育运动只对运动系统有益，忽视它还能改善神经系统和循环系统。
    - 把身高增长完全归因于骨骼生长，忽略肌肉发育的促进作用。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:侏儒症
  type: Concept
  subject: 生物
  title: 侏儒症
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为侏儒症是成年后生长激素分泌不足导致的，实际是幼年时期分泌不足
    - 能指出并纠正这一错误：把侏儒症和呆小症混淆，侏儒症智力正常，呆小症智力低下
  aliases: []
  category: 疾病
  explanation: 侏儒症是幼年时期生长激素分泌不足导致的生长发育迟缓。
  misconceptions:
    - 认为侏儒症是成年后生长激素分泌不足导致的，实际是幼年时期分泌不足
    - 把侏儒症和呆小症混淆，侏儒症智力正常，呆小症智力低下
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:保护易感人群
  type: Concept
  subject: 生物
  title: 保护易感人群
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为接种疫苗属于控制传染源，实际属于保护易感人群。
    - 能指出并纠正这一错误：把体育锻炼归为切断传播途径，实际是保护易感人群。
  aliases: []
  category: 预防措施
  explanation: 通过接种疫苗、体育锻炼等提高人群免疫力，减少感染风险。
  misconceptions:
    - 认为接种疫苗属于控制传染源，实际属于保护易感人群。
    - 把体育锻炼归为切断传播途径，实际是保护易感人群。
    - 认为保护易感人群也适用于病人，但病人是传染源。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:保护生物多样性
  type: Concept
  subject: 生物
  title: 保护生物多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为引进外来物种能丰富本地生物多样性，实际可能破坏生态平衡
    - 能指出并纠正这一错误：认为保护生物多样性就是禁止一切开发和利用，忽略了合理利用
  aliases:
    - 生物多样性保护
  category: 生态学概念
  explanation: 采取多种措施保护生物物种及其生存环境，以维持生态平衡和生物资源的可持续利用。
  misconceptions:
    - 认为引进外来物种能丰富本地生物多样性，实际可能破坏生态平衡
    - 认为保护生物多样性就是禁止一切开发和利用，忽略了合理利用
    - 把保护个体的行为等同于保护物种的生存环境，如只保护大熊猫
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:保护组织
  type: Concept
  subject: 生物
  title: 保护组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为保护组织细胞含有叶绿体，能进行光合作用
    - 能指出并纠正这一错误：把保护组织当成动物上皮组织，认为它能分泌消化液
  aliases:
    - 保护组织
  category: 生物学概念
  explanation: 根、茎、叶表面的表皮细胞构成保护组织，具有保护内部结构的功能。
  misconceptions:
    - 认为保护组织细胞含有叶绿体，能进行光合作用
    - 把保护组织当成动物上皮组织，认为它能分泌消化液
    - 误以为保护组织细胞排列紧密且细胞壁很厚，其实保护组织细胞壁较薄
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S3.md
- id: concept:生物:保护耳和听力的措施
  type: Concept
  subject: 生物
  title: 保护耳和听力的措施
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用棉签或挖耳勺用力掏耳屎，认为能清洁耳朵，实则可能损伤外耳道或鼓膜。
    - 能指出并纠正这一错误：擤鼻涕时捏紧两侧鼻孔用力擤，认为这样擤得干净，却易把鼻涕压入中耳引发中耳炎。
  aliases:
    - 耳的保健
  category: 健康知识
  explanation: 避免长时间使用耳机、不用尖锐物掏耳、防止脏水入耳、正确擤鼻涕、遇到巨响张口或堵耳、及时治疗鼻咽炎症等。
  misconceptions:
    - 用棉签或挖耳勺用力掏耳屎，认为能清洁耳朵，实则可能损伤外耳道或鼓膜。
    - 擤鼻涕时捏紧两侧鼻孔用力擤，认为这样擤得干净，却易把鼻涕压入中耳引发中耳炎。
    - 遇到巨响时只捂耳不张口，认为捂耳足够，实则不张口不能平衡鼓膜内外气压。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:保护色
  type: Concept
  subject: 生物
  title: 保护色
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为变色龙变色是主动适应环境，实际是长期自然选择的结果。
    - 能指出并纠正这一错误：认为保护色只利于躲避敌害，忽略捕食者也具保护色。
  aliases: []
  category: 生物学概念
  explanation: 动物体色与周围环境色彩相似，有利于躲避敌害或捕食猎物，是自然选择的结果。
  misconceptions:
    - 认为变色龙变色是主动适应环境，实际是长期自然选择的结果。
    - 认为保护色只利于躲避敌害，忽略捕食者也具保护色。
    - 将枯叶蝶拟态误认为保护色，二者机制不同。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S3.md
- id: concept:生物:健康
  type: Concept
  subject: 生物
  title: 健康
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为不生病就是健康，忽略心理和社会适应方面的要求。
    - 能指出并纠正这一错误：只重视身体锻炼，认为心理问题不属于健康范畴。
  aliases: []
  category: 定义
  explanation: 健康是指一种身体上、心理上和社会适应方面的良好状态，而不仅仅是没有疾病或者不虚弱。
  misconceptions:
    - 认为不生病就是健康，忽略心理和社会适应方面的要求。
    - 只重视身体锻炼，认为心理问题不属于健康范畴。
    - 把社会适应能力差只看作性格内向，否认是健康问题。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:健康的生活方式
  type: Concept
  subject: 生物
  title: 健康的生活方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为偶尔吸烟、喝酒不会影响健康，只要不过量就没事
    - 能指出并纠正这一错误：觉得只要坚持运动，熬夜和吃垃圾食品也能抵消不良影响
  aliases: []
  category: 健康概念
  explanation: 指有益于健康的习惯化的行为方式，包括合理营养、平衡膳食、坚持体育锻炼、按时作息、不吸烟不喝酒、拒绝毒品等。
  misconceptions:
    - 认为偶尔吸烟、喝酒不会影响健康，只要不过量就没事
    - 觉得只要坚持运动，熬夜和吃垃圾食品也能抵消不良影响
    - 把不吸烟不喝酒当成健康生活的全部，忽略营养和作息
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:光合作用
  type: Concept
  subject: 生物
  title: 光合作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光合作用吸收氧气、释放二氧化碳，与呼吸作用原料产物颠倒
    - 能指出并纠正这一错误：误以为光合作用释放的氧气来自二氧化碳，实际上来自水
  aliases: []
  category: 生物学概念
  explanation: 植物通过光合作用制造有机物，储存能量，是生产者角色的基础。
  misconceptions:
    - 认为光合作用吸收氧气、释放二氧化碳，与呼吸作用原料产物颠倒
    - 误以为光合作用释放的氧气来自二氧化碳，实际上来自水
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:光学显微镜
  type: Concept
  subject: 生物
  title: 光学显微镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为光学显微镜可以直接观察到病毒，实际上病毒需电子显微镜。
    - 能指出并纠正这一错误：认为物镜越长放大倍数越小，实际物镜越长，放大倍数越大。
  aliases:
    - 显微镜
  category: 实验工具
  explanation: 以可见光为光源的显微镜，常见的有单目显微镜和双目显微镜，用于观察微小物体如细胞。
  misconceptions:
    - 误以为光学显微镜可以直接观察到病毒，实际上病毒需电子显微镜。
    - 认为物镜越长放大倍数越小，实际物镜越长，放大倍数越大。
    - 把光学显微镜当成放大镜，以为可观察原子结构。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:克隆
  type: Concept
  subject: 生物
  title: 克隆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为克隆需精子和卵细胞结合，忘记克隆是无性繁殖。
    - 能指出并纠正这一错误：以为克隆个体与供体完全相同，忽略细胞质基因和环境的影响。
  aliases: []
  category: 生物学概念
  explanation: 通过无性繁殖产生与供体相同基因的个体的技术，多莉羊是克隆技术的产物。
  misconceptions:
    - 认为克隆需精子和卵细胞结合，忘记克隆是无性繁殖。
    - 以为克隆个体与供体完全相同，忽略细胞质基因和环境的影响。
    - 误将克隆说成'复制'，混淆基因相同与性状完全一致。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:免疫
  type: Concept
  subject: 生物
  title: 免疫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为免疫只是防御外来病原体，忽略免疫还能清除衰老、损伤和异常细胞
    - 能指出并纠正这一错误：将免疫等同于特异性免疫，认为非特异性免疫不属于免疫
  aliases:
    - immunity
  category: 核心概念
  explanation: 人体识别和清除外来入侵物质（如病原体）、衰老或损伤细胞以及体内异常细胞，维持自身生理平衡的功能。
  misconceptions:
    - 认为免疫只是防御外来病原体，忽略免疫还能清除衰老、损伤和异常细胞
    - 将免疫等同于特异性免疫，认为非特异性免疫不属于免疫
    - 认为免疫功能越强越好，忽视免疫过强会导致过敏或自身免疫病
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:免疫力
  type: Concept
  subject: 生物
  title: 免疫力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为免疫力越强越好，实际过强可能引发过敏或自身免疫病。
    - 能指出并纠正这一错误：将免疫力等同于特异性免疫，实际包括非特异性免疫。
  aliases:
    - 抵抗力
  category: 生物学概念
  explanation: 人体抵抗病原体入侵的能力，可通过锻炼和接种疫苗增强。
  misconceptions:
    - 认为免疫力越强越好，实际过强可能引发过敏或自身免疫病。
    - 将免疫力等同于特异性免疫，实际包括非特异性免疫。
    - 认为只有患病后才能获得免疫力，接种疫苗也能主动获得。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:免疫器官
  type: Concept
  subject: 生物
  title: 免疫器官
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为免疫器官就是免疫细胞，把淋巴结误认为一种细胞
    - 能指出并纠正这一错误：认为胸腺只属于内分泌系统，忽略其免疫器官功能
  aliases: []
  category: 免疫学
  explanation: 包括胸腺、淋巴结、脾等，是免疫细胞生成、成熟或集中分布的场所。
  misconceptions:
    - 认为免疫器官就是免疫细胞，把淋巴结误认为一种细胞
    - 认为胸腺只属于内分泌系统，忽略其免疫器官功能
    - 认为脾是造血器官而非免疫器官，混淆功能
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:免疫系统
  type: Concept
  subject: 生物
  title: 免疫系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为皮肤和黏膜属于第二道防线，实际属于第一道防线
    - 能指出并纠正这一错误：认为吞噬细胞是免疫器官，实际吞噬细胞属于免疫细胞
  aliases: []
  category: 免疫学
  explanation: 免疫系统由三道防线组成，包括皮肤和黏膜、杀菌物质和吞噬细胞、免疫器官和免疫细胞，具有防御、监视和自稳功能。
  misconceptions:
    - 认为皮肤和黏膜属于第二道防线，实际属于第一道防线
    - 认为吞噬细胞是免疫器官，实际吞噬细胞属于免疫细胞
    - 认为免疫系统只防御病原体，忽略其监视和自稳功能
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:免疫细胞
  type: Concept
  subject: 生物
  title: 免疫细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为免疫细胞仅指淋巴细胞，不包括吞噬细胞等
    - 能指出并纠正这一错误：认为红细胞能携带抗体，属于免疫细胞
  aliases: []
  category: 免疫学
  explanation: 包括淋巴细胞等，参与免疫应答的细胞。
  misconceptions:
    - 认为免疫细胞仅指淋巴细胞，不包括吞噬细胞等
    - 认为红细胞能携带抗体，属于免疫细胞
    - 认为免疫细胞只存在于免疫器官中，血液中没有
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:免疫规划
  type: Concept
  subject: 生物
  title: 免疫规划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为免疫规划只是个人自愿接种疫苗，忽略计划性和群体免疫目标
    - 能指出并纠正这一错误：将免疫规划等同于治疗传染病，误以为接种疫苗是用于患病后治疗
  aliases:
    - 计划免疫
  category: 核心概念
  explanation: 根据疫情监测和人群免疫状况，按照规定的免疫程序，有计划地利用疫苗进行预防接种，以提高人群免疫水平，达到控制乃至消灭传染病的目的。
  misconceptions:
    - 认为免疫规划只是个人自愿接种疫苗，忽略计划性和群体免疫目标
    - 将免疫规划等同于治疗传染病，误以为接种疫苗是用于患病后治疗
    - 认为所有疫苗终身有效，忽略部分疫苗需加强免疫
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:全民健身计划
  type: Concept
  subject: 生物
  title: 全民健身计划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为全民健身计划只针对成年人，不知道青少年是重点人群之一。
    - 能指出并纠正这一错误：将《全民健身计划》当作地方性文件，忽略其由国务院印发。
  aliases: []
  category: 社会
  explanation: 国务院印发《全民健身计划（2021—2025年）》，将青少年作为重点人群，实施青少年体育活动促进计划。
  misconceptions:
    - 误以为全民健身计划只针对成年人，不知道青少年是重点人群之一。
    - 将《全民健身计划》当作地方性文件，忽略其由国务院印发。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:全球变暖
  type: Concept
  subject: 生物
  title: 全球变暖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球变暖是太阳辐射增强或太阳距离变近导致的
    - 能指出并纠正这一错误：把全球变暖与温室效应混为一谈，认为两者是同一回事
  aliases:
    - 气候变暖
  category: 环境科学
  explanation: 全球变暖是指由于温室气体排放增加导致地球平均气温上升的现象，会引发冰川融化、海平面上升等后果。
  misconceptions:
    - 认为全球变暖是太阳辐射增强或太阳距离变近导致的
    - 把全球变暖与温室效应混为一谈，认为两者是同一回事
    - 觉得全球变暖只会让气温升高，不会引发冰川融化和海平面上升
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:全球性生态环境问题
  type: Concept
  subject: 生物
  title: 全球性生态环境问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全球性生态环境问题只包括气候变化，忽略生物多样性锐减等
    - 能指出并纠正这一错误：把酸雨、水体富营养化等区域性环境问题也归为全球性生态环境问题
  aliases: []
  category: 环境问题
  explanation: 指全球变暖、大气污染、生物多样性锐减等跨越国界、影响全人类的环境问题。
  misconceptions:
    - 认为全球性生态环境问题只包括气候变化，忽略生物多样性锐减等
    - 把酸雨、水体富营养化等区域性环境问题也归为全球性生态环境问题
    - 认为全球性生态环境问题仅由发达国家造成，与发展中国家无关
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:共同祖先
  type: Concept
  subject: 生物
  title: 共同祖先
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有生物的共同祖先是某种现存的猴子或猩猩。
    - 能指出并纠正这一错误：认为共同祖先是一个个体生物，实际上是一个种群。
  aliases: []
  category: 生物学概念
  explanation: 所有生物都起源于原始的共同祖先，这是生物进化的基本观点。
  misconceptions:
    - 认为所有生物的共同祖先是某种现存的猴子或猩猩。
    - 认为共同祖先是一个个体生物，实际上是一个种群。
    - 把黑猩猩当成人类和猿类的共同祖先。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:关节
  type: Concept
  subject: 生物
  title: 关节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为关节是骨与骨直接接触，中间没有软骨或滑液。
    - 能指出并纠正这一错误：将颅骨缝等不活动连接也当作关节，实际骨缝不属于关节。
  aliases: []
  category: 生物学概念
  explanation: 关节是骨与骨之间的连接结构，主要由关节面、关节囊和关节腔组成，关节面上覆盖关节软骨，关节腔内有滑液以减少摩擦。
  misconceptions:
    - 认为关节是骨与骨直接接触，中间没有软骨或滑液。
    - 将颅骨缝等不活动连接也当作关节，实际骨缝不属于关节。
    - 误以为关节的灵活性只由关节囊决定，忽略软骨和滑液的作用。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:关节囊
  type: Concept
  subject: 生物
  title: 关节囊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为关节囊是肌肉组织，能主动收缩产生运动。
    - 能指出并纠正这一错误：认为滑液由关节囊外层直接分泌，实际由内层滑膜分泌。
  aliases: []
  category: 生物学概念
  explanation: 关节囊是包裹在关节周围的结缔组织，内部形成密闭的关节腔。
  misconceptions:
    - 误认为关节囊是肌肉组织，能主动收缩产生运动。
    - 认为滑液由关节囊外层直接分泌，实际由内层滑膜分泌。
    - 将关节囊与肌腱混淆，肌腱连肌腹和骨，关节囊包裹关节。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:关节腔
  type: Concept
  subject: 生物
  title: 关节腔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为关节腔是骨与骨之间的天然空隙，不由关节囊包裹。
    - 能指出并纠正这一错误：误以为关节腔内充满空气，实际含有滑液。
  aliases: []
  category: 生物学概念
  explanation: 关节腔是由关节囊包裹形成的密闭腔隙，内含滑液，可减少骨与骨之间的摩擦。
  misconceptions:
    - 认为关节腔是骨与骨之间的天然空隙，不由关节囊包裹。
    - 误以为关节腔内充满空气，实际含有滑液。
    - 将关节腔与骨髓腔混淆，二者位置和功能不同。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:关节软骨
  type: Concept
  subject: 生物
  title: 关节软骨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为关节软骨覆盖在关节囊外面，起保护关节囊作用。
    - 能指出并纠正这一错误：误以为关节软骨可像皮肤一样再生，实际损伤后修复能力很弱。
  aliases: []
  category: 生物学概念
  explanation: 关节软骨覆盖在关节面上，具有减少摩擦和缓冲震荡的作用。
  misconceptions:
    - 认为关节软骨覆盖在关节囊外面，起保护关节囊作用。
    - 误以为关节软骨可像皮肤一样再生，实际损伤后修复能力很弱。
    - 认为关节软骨的作用是连接两块骨，而非减少摩擦和缓冲。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:关节面
  type: Concept
  subject: 生物
  title: 关节面
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为关节面就是整块骨的表面，实际仅指相接触的骨面。
    - 能指出并纠正这一错误：将关节头和关节窝混淆，误以为关节窝是凸起的。
  aliases: []
  category: 生物学概念
  explanation: 关节面是构成关节的骨的接触面，包括凸起的关节头和凹陷的关节窝，表面覆盖关节软骨。
  misconceptions:
    - 认为关节面就是整块骨的表面，实际仅指相接触的骨面。
    - 将关节头和关节窝混淆，误以为关节窝是凸起的。
    - 误认为关节面上没有软骨，导致骨与骨直接磨损。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:其他感觉器官
  type: Concept
  subject: 生物
  title: 其他感觉器官
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为舌能闻气味，鼻能尝味道，把嗅觉和味觉的器官搞反。
    - 能指出并纠正这一错误：认为皮肤只有触觉，不能感知冷热和疼痛，忽略皮肤还有冷觉、热觉、痛觉。
  aliases:
    - 嗅觉、味觉、触觉
  category: 生理知识
  explanation: 鼻、舌、皮肤等感觉器官分别具有嗅觉、味觉和触觉等功能，帮助感知外界环境变化。
  misconceptions:
    - 认为舌能闻气味，鼻能尝味道，把嗅觉和味觉的器官搞反。
    - 认为皮肤只有触觉，不能感知冷热和疼痛，忽略皮肤还有冷觉、热觉、痛觉。
    - 认为感觉器官只有眼、耳、鼻、舌，不把皮肤看作感觉器官。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:其他排泄途径
  type: Concept
  subject: 生物
  title: 其他排泄途径
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为排泄只通过泌尿系统完成，忽略呼吸和皮肤也排出代谢废物。
    - 能指出并纠正这一错误：误以为汗液只含有水和无机盐，不含尿素，其实汗液中也有少量尿素。
  aliases: []
  category: 生理过程
  explanation: 呼吸系统排出二氧化碳和少量水，皮肤通过汗液排出水、无机盐和尿素。
  misconceptions:
    - 认为排泄只通过泌尿系统完成，忽略呼吸和皮肤也排出代谢废物。
    - 误以为汗液只含有水和无机盐，不含尿素，其实汗液中也有少量尿素。
    - 误认为呼出的二氧化碳是肺部产生的，实际是组织细胞呼吸作用产生的。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:内分泌系统
  type: Concept
  subject: 生物
  title: 内分泌系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把汗腺、唾液腺等外分泌腺也当作内分泌腺
    - 能指出并纠正这一错误：认为内分泌系统只包含甲状腺和垂体，漏掉胰岛和性腺
  aliases:
    - endocrine system
  category: 生物学概念
  explanation: 由垂体、甲状腺、肾上腺、胰岛和性腺等内分泌腺组成的系统，分泌多种激素调节人体生理活动。
  misconceptions:
    - 把汗腺、唾液腺等外分泌腺也当作内分泌腺
    - 认为内分泌系统只包含甲状腺和垂体，漏掉胰岛和性腺
    - 认为内分泌系统和神经系统各自独立，互不影响
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:内分泌腺
  type: Concept
  subject: 生物
  title: 内分泌腺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为内分泌腺有导管，激素经导管排出
    - 能指出并纠正这一错误：认为内分泌腺分泌的激素进入消化道
  aliases: []
  category: 生物学概念
  explanation: 没有导管的腺体，分泌的激素直接进入腺体内的毛细血管，随血液循环输送到全身。
  misconceptions:
    - 认为内分泌腺有导管，激素经导管排出
    - 认为内分泌腺分泌的激素进入消化道
    - 认为内分泌腺也叫外分泌腺
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:农田生态系统
  type: Concept
  subject: 生物
  title: 农田生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为农田生态系统是自然形成的，不需要人类持续管理。
    - 能指出并纠正这一错误：误认为农田里的生物只有农作物，忽略杂草、害虫和微生物。
  aliases: []
  category: 生态系统类型
  explanation: 课文提及农田生态系统是多种多样的生态系统之一，但未详细描述。
  misconceptions:
    - 误认为农田生态系统是自然形成的，不需要人类持续管理。
    - 误认为农田里的生物只有农作物，忽略杂草、害虫和微生物。
    - 误认为农田生态系统结构简单，因此能自我长期稳定维持。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:冠脉循环
  type: Concept
  subject: 生物
  title: 冠脉循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为冠状动脉流动的是静脉血，实际冠状动脉内流动脉血，为心肌供氧
    - 能指出并纠正这一错误：把冠脉循环归入肺循环，实际冠脉循环是体循环的一部分
  aliases: []
  category: 生理学
  explanation: 血液由主动脉基部的冠状动脉流向心肌毛细血管，再流回右心房的循环，为心脏供血供氧。
  misconceptions:
    - 认为冠状动脉流动的是静脉血，实际冠状动脉内流动脉血，为心肌供氧
    - 把冠脉循环归入肺循环，实际冠脉循环是体循环的一部分
    - 认为冠脉循环起于右心房，实际起于主动脉基部的冠状动脉
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S3.md
- id: concept:生物:凸透镜和凹透镜
  type: Concept
  subject: 生物
  title: 凸透镜和凹透镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为凹透镜对光有会聚作用，如拿凹透镜对着太阳光能点燃纸片
    - 能指出并纠正这一错误：远视眼镜用凹透镜，近视眼镜用凸透镜，导致眼镜错戴
  aliases:
    - 透镜
  category: 光学
  explanation: 凸透镜对光有会聚作用，凹透镜对光有发散作用；远视镜用凸透镜，近视镜用凹透镜。
  misconceptions:
    - 误认为凹透镜对光有会聚作用，如拿凹透镜对着太阳光能点燃纸片
    - 远视眼镜用凹透镜，近视眼镜用凸透镜，导致眼镜错戴
    - 认为凸透镜越厚焦距越大，混淆透镜厚度与折光能力
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:出芽生殖
  type: Concept
  subject: 生物
  title: 出芽生殖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为出芽生殖是植物特有的，如水螅的出芽生殖被当作营养生殖
    - 能指出并纠正这一错误：认为酵母菌的出芽生殖属于分裂生殖，因为都有分裂过程
  aliases: []
  category: 生殖方式
  explanation: 母体在一定部位长出芽体，芽体长大后脱离母体成为新个体的无性生殖方式，如水螅、酵母菌。
  misconceptions:
    - 误认为出芽生殖是植物特有的，如水螅的出芽生殖被当作营养生殖
    - 认为酵母菌的出芽生殖属于分裂生殖，因为都有分裂过程
    - 认为芽体脱离母体前就已经是独立新个体，不需要脱离
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:出血和止血
  type: Concept
  subject: 生物
  title: 出血和止血
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将动脉出血与静脉出血混淆，动脉血色鲜红喷射状，静脉暗红涌出，止血方法不同。
    - 能指出并纠正这一错误：认为内出血可以自行止血，在家观察即可，实际必须立即就医。
  aliases: []
  category: 急救技能
  explanation: 出血分为内出血和外出血，外出血需在送医前进行止血处理，内出血需及时就医。
  misconceptions:
    - 将动脉出血与静脉出血混淆，动脉血色鲜红喷射状，静脉暗红涌出，止血方法不同。
    - 认为内出血可以自行止血，在家观察即可，实际必须立即就医。
    - 使用止血带后长时间不放松，导致肢体坏死，应每隔1小时放松1-2分钟。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:分娩
  type: Concept
  subject: 生物
  title: 分娩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分娩时只有胎儿经阴道排出，胎盘留在子宫内
    - 能指出并纠正这一错误：误认为分娩过程是从母体肛门排出的
  aliases:
    - 生产
  category: 生理过程
  explanation: 成熟的胎儿和胎盘从母体的子宫经阴道产出的过程。
  misconceptions:
    - 认为分娩时只有胎儿经阴道排出，胎盘留在子宫内
    - 误认为分娩过程是从母体肛门排出的
    - 认为剖宫产不属于分娩方式
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:分子
  type: Concept
  subject: 生物
  title: 分子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分子是构成物质的唯一微粒，忽略原子和离子也能构成物质。
    - 能指出并纠正这一错误：误以为化学变化中分子不变，实际分子破裂成原子重新组合。
  aliases: []
  category: 生物学概念
  explanation: 构成物质的一种微粒，水、氧气、葡萄糖等物质都是由分子构成的。
  misconceptions:
    - 认为分子是构成物质的唯一微粒，忽略原子和离子也能构成物质。
    - 误以为化学变化中分子不变，实际分子破裂成原子重新组合。
    - 把分子当作保持物质化学性质的最小粒子，却不知原子也有此性质。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:分生组织
  type: Concept
  subject: 生物
  title: 分生组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分生组织只存在于根尖和芽尖，忽略茎中的形成层也是分生组织
    - 能指出并纠正这一错误：认为分生组织细胞已经分化，不再具有分裂能力
  aliases:
    - 分生组织
  category: 生物学概念
  explanation: 在成熟的植物体内，总保留着一部分不分化的细胞，它们终生保持分裂能力，由这样的细胞群构成的组织，叫作分生组织。
  misconceptions:
    - 认为分生组织只存在于根尖和芽尖，忽略茎中的形成层也是分生组织
    - 认为分生组织细胞已经分化，不再具有分裂能力
    - 把分生组织当作动物组织，与动物的干细胞混淆
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S3.md
- id: concept:生物:分类等级
  type: Concept
  subject: 生物
  title: 分类等级
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“种”是最高分类等级，而“界”是最基本的单位
    - 能指出并纠正这一错误：把分类单位按从大到小排列为：种、属、科、目、纲、门、界
  aliases:
    - 生物分类等级
  category: 分类系统
  explanation: 生物分类的等级由高到低依次为界、门、纲、目、科、属、种，种是最基本的分类单位。
  misconceptions:
    - 认为“种”是最高分类等级，而“界”是最基本的单位
    - 把分类单位按从大到小排列为：种、属、科、目、纲、门、界
    - 认为分类等级越低，包含的生物种类越多
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S2.md
- id: concept:生物:分裂生殖
  type: Concept
  subject: 生物
  title: 分裂生殖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分裂生殖产生的两个细胞中一个是母体，一个是子代
    - 能指出并纠正这一错误：误以为所有单细胞生物都只靠分裂生殖，如草履虫还有接合生殖
  aliases: []
  category: 生殖方式
  explanation: 单细胞生物通过细胞分裂产生两个新个体的无性生殖方式，如草履虫、细菌。
  misconceptions:
    - 认为分裂生殖产生的两个细胞中一个是母体，一个是子代
    - 误以为所有单细胞生物都只靠分裂生殖，如草履虫还有接合生殖
    - 认为人体细胞分裂也属于分裂生殖，混淆生物繁殖与细胞增殖
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:分解者
  type: Concept
  subject: 生物
  title: 分解者
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把蚯蚓、蜣螂等腐生动物当成消费者，实际上它们是分解者
    - 能指出并纠正这一错误：认为细菌都是分解者，忽略硝化细菌属于生产者
  aliases:
    - decomposer
  category: 生态学概念
  explanation: 细菌和真菌等将动植物的遗体残骸中的有机物分解成无机物，供植物重新利用，称为分解者。
  misconceptions:
    - 把蚯蚓、蜣螂等腐生动物当成消费者，实际上它们是分解者
    - 认为细菌都是分解者，忽略硝化细菌属于生产者
    - 误以为分解者将有机物分解为有机物，实际上分解为无机物
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:切断传播途径
  type: Concept
  subject: 生物
  title: 切断传播途径
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把杀灭蚊虫当作控制传染源，实际蚊虫是传播途径。
    - 能指出并纠正这一错误：认为戴口罩是保护易感人群，实际是切断传播途径。
  aliases: []
  category: 预防措施
  explanation: 通过戴口罩、勤洗手、保持社交距离、搞好环境卫生等方式，阻断病原体传播。
  misconceptions:
    - 把杀灭蚊虫当作控制传染源，实际蚊虫是传播途径。
    - 认为戴口罩是保护易感人群，实际是切断传播途径。
    - 认为搞好环境卫生是控制传染源，实际是切断传播途径。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:刺胞动物
  type: Concept
  subject: 生物
  title: 刺胞动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为刺胞动物有口有肛门，把消化腔当成完整消化道。
    - 能指出并纠正这一错误：认为水螅身体呈两侧对称，与涡虫一样。
  aliases:
    - 腔肠动物
  category: 生物类群
  explanation: 身体呈辐射对称，体表有刺细胞，有口无肛门，如水螅、海葵。
  misconceptions:
    - 误以为刺胞动物有口有肛门，把消化腔当成完整消化道。
    - 认为水螅身体呈两侧对称，与涡虫一样。
    - 以为刺细胞在触手外也能主动攻击，忽略其防御功能。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:动物体结构层次
  type: Concept
  subject: 生物
  title: 动物体结构层次
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将动物体结构层次错写为细胞→器官→组织→系统→个体
    - 能指出并纠正这一错误：认为动物体由器官直接构成个体，跳过系统层次
  aliases: []
  category: 生物学概念
  explanation: 动物体结构层次为细胞→组织→器官→系统→个体。
  misconceptions:
    - 将动物体结构层次错写为细胞→器官→组织→系统→个体
    - 认为动物体由器官直接构成个体，跳过系统层次
    - 认为器官就是组织，如把一块肌肉说成肌肉组织
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:动物分类依据
  type: Concept
  subject: 生物
  title: 动物分类依据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只根据外形相似就把鲸归为鱼类，忽略内部结构和生理功能
    - 能指出并纠正这一错误：认为动物分类只依据形态结构，与生理功能和生殖方式无关
  aliases: []
  category: 分类依据
  explanation: 动物分类除了比较形态结构，还要比较生理功能和生殖方式等特征。
  misconceptions:
    - 只根据外形相似就把鲸归为鱼类，忽略内部结构和生理功能
    - 认为动物分类只依据形态结构，与生理功能和生殖方式无关
    - 以为分类时会考虑动物与人类关系的亲疏
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:动物的分类
  type: Concept
  subject: 生物
  title: 动物的分类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把海豚、鲸等水生哺乳动物误分类为鱼类或无脊椎动物
    - 能指出并纠正这一错误：认为所有无脊椎动物都生活在水中，脊椎动物都生活在陆地
  aliases: []
  category: 生物分类
  explanation: 动物根据形态结构、生理功能和生殖方式分为无脊椎动物和脊椎动物，分类反映结构差异、亲缘关系和进化关系，但不反映与人类生活关系的远近。
  misconceptions:
    - 把海豚、鲸等水生哺乳动物误分类为鱼类或无脊椎动物
    - 认为所有无脊椎动物都生活在水中，脊椎动物都生活在陆地
    - 认为分类等级可反映动物与人类生活关系的远近
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:动物细胞的基本结构
  type: Concept
  subject: 生物
  title: 动物细胞的基本结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为动物细胞也有细胞壁，画图时多画了一层矩形框。
    - 能指出并纠正这一错误：认为动物细胞没有细胞核，忽略成熟红细胞无核但其他细胞有核。
  aliases: []
  category: 生物学概念
  explanation: 动物细胞一般具有细胞膜、细胞质和细胞核，细胞质中含有线粒体，但不具有细胞壁、叶绿体，通常也没有液泡。
  misconceptions:
    - 误以为动物细胞也有细胞壁，画图时多画了一层矩形框。
    - 认为动物细胞没有细胞核，忽略成熟红细胞无核但其他细胞有核。
    - 以为动物细胞没有任何细胞器，其实有线粒体等。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:动物获取氧的方式
  type: Concept
  subject: 生物
  title: 动物获取氧的方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为鲸属于鱼类，所以用鳃呼吸
    - 能指出并纠正这一错误：认为青蛙成体只用肺呼吸，不需要皮肤辅助
  aliases: []
  category: 生理功能
  explanation: 不同动物获取氧的方式不同，如鲸用肺呼吸，草履虫用表膜，鲫鱼用鳃，青蛙幼体用鳃、成体用肺兼皮肤辅助。
  misconceptions:
    - 认为鲸属于鱼类，所以用鳃呼吸
    - 认为青蛙成体只用肺呼吸，不需要皮肤辅助
    - 认为草履虫没有呼吸结构，因此不能进行气体交换
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S2.md
- id: concept:生物:动脉
  type: Concept
  subject: 生物
  title: 动脉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有动脉内都流动脉血，反例：肺动脉内流静脉血
    - 能指出并纠正这一错误：认为动脉都在身体深处，体表摸不到，实际如桡动脉、颈动脉可在体表摸到
  aliases:
    - artery
  category: 生物学概念
  explanation: 动脉是将血液从心脏输送到全身各处的血管，管壁厚、弹性大、血流速度快。
  misconceptions:
    - 认为所有动脉内都流动脉血，反例：肺动脉内流静脉血
    - 认为动脉都在身体深处，体表摸不到，实际如桡动脉、颈动脉可在体表摸到
    - 把‘动脉’与‘动脉血’混为一谈，用血管名称判断血类型
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S2.md
- id: concept:生物:动脉出血
  type: Concept
  subject: 生物
  title: 动脉出血
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为动脉出血颜色暗红且连续流出，与静脉出血混淆
    - 能指出并纠正这一错误：用指压止血时错误按压伤口远心端，实际应按压近心端
  aliases: []
  category: 医学常识
  explanation: 血液呈鲜红色，从伤口喷出或随心跳一股一股地涌出，若不及时止血会因失血过多而死亡。
  misconceptions:
    - 认为动脉出血颜色暗红且连续流出，与静脉出血混淆
    - 用指压止血时错误按压伤口远心端，实际应按压近心端
    - 以为动脉出血可自行凝固止血，不立即处理会失血过多
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:动脉血和静脉血
  type: Concept
  subject: 生物
  title: 动脉血和静脉血
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：根据血管名称判断血类型，认为肺动脉里流动脉血，实际是静脉血
    - 能指出并纠正这一错误：认为动脉血含氧多、含二氧化碳少，但动脉血二氧化碳含量不一定少
  aliases: []
  category: 生理学
  explanation: 动脉血含氧丰富、颜色鲜红；静脉血含氧较少、颜色暗红。
  misconceptions:
    - 根据血管名称判断血类型，认为肺动脉里流动脉血，实际是静脉血
    - 认为动脉血含氧多、含二氧化碳少，但动脉血二氧化碳含量不一定少
    - 误以为颜色鲜红的血一定是动脉血，实际上动脉血和静脉血颜色受氧含量影响
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:化石
  type: Concept
  subject: 生物
  title: 化石
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为化石必须是生物遗体，脚印、粪便等不属于化石。
    - 能指出并纠正这一错误：把琥珀中的昆虫排斥在化石之外，因其未经石化。
  aliases: []
  category: 生物学概念
  explanation: 通过自然作用保存在地层中的古代生物的遗体、遗物或生活痕迹等，是研究生物进化的直接证据。
  misconceptions:
    - 认为化石必须是生物遗体，脚印、粪便等不属于化石。
    - 把琥珀中的昆虫排斥在化石之外，因其未经石化。
    - 认为化石就是石化了的生物本身，忽略痕迹化石类型。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:化石证据
  type: Concept
  subject: 生物
  title: 化石证据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为化石是间接证据，实际是研究进化的直接证据。
    - 能指出并纠正这一错误：认为露西化石是完整骨架，实际只有部分骨骼。
  aliases: []
  category: 科学证据
  explanation: 化石是研究生物进化的重要证据，如露西化石支持人类起源于非洲。
  misconceptions:
    - 认为化石是间接证据，实际是研究进化的直接证据。
    - 认为露西化石是完整骨架，实际只有部分骨骼。
    - 认为只有化石能证明生物进化，忽视其他证据。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:医疗救护员
  type: Concept
  subject: 生物
  title: 医疗救护员
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为医疗救护员能代替医生开处方药、做手术
    - 能指出并纠正这一错误：认为只要会包扎就算医疗救护员，忽视心肺复苏等专业培训
  aliases: []
  category: 职业知识
  explanation: 医疗救护员是运用救护知识和技能，对伤病员进行现场初步紧急救护的专业人员。
  misconceptions:
    - 误以为医疗救护员能代替医生开处方药、做手术
    - 认为只要会包扎就算医疗救护员，忽视心肺复苏等专业培训
    - 将医疗救护员与普通志愿者等同，认为无需考核认证
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:单子叶植物
  type: Concept
  subject: 生物
  title: 单子叶植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为单子叶植物的种子没有胚乳，如玉米被当成双子叶植物。
    - 能指出并纠正这一错误：认为一片子叶就是只长一片叶子，把玉米幼苗误认为单子叶。
  aliases: []
  category: 生物类群
  explanation: 种子具有一片子叶的绿色开花植物，如玉米。
  misconceptions:
    - 误以为单子叶植物的种子没有胚乳，如玉米被当成双子叶植物。
    - 认为一片子叶就是只长一片叶子，把玉米幼苗误认为单子叶。
    - 将小麦、水稻归为裸子植物，因为它们种子外有果皮。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:单细胞生物
  type: Concept
  subject: 生物
  title: 单细胞生物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为病毒也是单细胞生物，忽视病毒没有细胞结构
    - 能指出并纠正这一错误：认为所有单细胞生物都只在水中生活，忽略潮湿土壤等环境
  aliases:
    - 单细胞生物
  category: 生物学概念
  explanation: 身体只有一个细胞的生物，称为单细胞生物，如草履虫、衣藻等。
  misconceptions:
    - 认为病毒也是单细胞生物，忽视病毒没有细胞结构
    - 认为所有单细胞生物都只在水中生活，忽略潮湿土壤等环境
    - 认为草履虫没有细胞核，误以为单细胞生物结构简单没有核
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S4.md
- id: concept:生物:卵壳的气孔
  type: Concept
  subject: 生物
  title: 卵壳的气孔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为气孔只存在于鸡蛋钝端，其实整个蛋壳表面都有气孔
    - 能指出并纠正这一错误：认为气孔是可见的大孔，可用肉眼直接观察
  aliases:
    - 气孔
  category: 生物学事实
  explanation: 鸡卵壳上约有7000个气孔，用于气体交换，保证胚胎发育时的呼吸。
  misconceptions:
    - 误以为气孔只存在于鸡蛋钝端，其实整个蛋壳表面都有气孔
    - 认为气孔是可见的大孔，可用肉眼直接观察
    - 误以为气孔的作用是让精子进入卵内受精，实际受精在产卵前
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:卵巢
  type: Concept
  subject: 生物
  title: 卵巢
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将卵巢当成输卵管的一部分，混淆两条管状结构的位置
    - 能指出并纠正这一错误：认为卵巢只产生卵细胞，不分泌任何激素
  aliases: []
  category: 人体结构
  explanation: 女性的主要生殖器官，功能是产生卵细胞，分泌雌激素等。
  misconceptions:
    - 将卵巢当成输卵管的一部分，混淆两条管状结构的位置
    - 认为卵巢只产生卵细胞，不分泌任何激素
    - 误以为卵细胞从卵巢排出后直接进入子宫，实际上进入输卵管
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:卵生
  type: Concept
  subject: 生物
  title: 卵生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为卵生动物都是体内受精，如鲫鱼卵生但体外受精
    - 能指出并纠正这一错误：误以为卵生就是母体产下卵细胞，不是受精卵
  aliases:
    - 产卵
  category: 生物学概念
  explanation: 卵生是动物通过产卵方式繁殖后代，胚胎在卵内发育，依靠卵内营养物质，如鸟类。
  misconceptions:
    - 认为卵生动物都是体内受精，如鲫鱼卵生但体外受精
    - 误以为卵生就是母体产下卵细胞，不是受精卵
    - 认为卵生和胎生主要区别在于是否孵蛋
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:原始大气
  type: Concept
  subject: 生物
  title: 原始大气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为原始大气含有氧气，忽略氧气是蓝藻光合作用后出现的。
    - 能指出并纠正这一错误：误认为原始大气与现在大气成分相似，主要含氮气和氧气。
  aliases: []
  category: 生物学概念
  explanation: 原始地球的大气层，由火山喷出的气体构成，如水蒸气、氢气、氨、甲烷、二氧化碳、硫化氢等，没有氧气。
  misconceptions:
    - 误认为原始大气含有氧气，忽略氧气是蓝藻光合作用后出现的。
    - 误认为原始大气与现在大气成分相似，主要含氮气和氧气。
    - 误认为原始大气只有甲烷和氨，没有水蒸气和二氧化碳。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:原核生物
  type: Concept
  subject: 生物
  title: 原核生物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把病毒当作原核生物，因为病毒没有细胞核，但病毒无细胞结构。
    - 能指出并纠正这一错误：认为细菌有成形的细胞核，实际细菌没有核膜包被的细胞核。
  aliases:
    - prokaryote
  category: 生物学概念
  explanation: 没有成形的细胞核的生物，如细菌。
  misconceptions:
    - 把病毒当作原核生物，因为病毒没有细胞核，但病毒无细胞结构。
    - 认为细菌有成形的细胞核，实际细菌没有核膜包被的细胞核。
    - 误以为所有原核生物都是有害的，忽略有些细菌能制造食物或分解废物。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S2.md
- id: concept:生物:双名法
  type: Concept
  subject: 生物
  title: 双名法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把学名中的第一个词当作种加词，如将leo视为Panthera的属名
    - 能指出并纠正这一错误：认为双名法中的两个词是种名和品种名
  aliases:
    - 学名
  category: 命名规则
  explanation: 国际统一的生物命名规则，每个物种的学名由属名和种加词组成，用拉丁文斜体书写，属名首字母大写，种加词首字母小写。
  misconceptions:
    - 把学名中的第一个词当作种加词，如将leo视为Panthera的属名
    - 认为双名法中的两个词是种名和品种名
    - 书写学名时不使用拉丁文或不用斜体
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S2.md
- id: concept:生物:双子叶植物
  type: Concept
  subject: 生物
  title: 双子叶植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为双子叶植物的种子一定没有胚乳，忽略了蓖麻、油桐等有胚乳。
    - 能指出并纠正这一错误：认为菜豆种子只有两片子叶，就不需要种皮了。
  aliases: []
  category: 生物类群
  explanation: 种子具有两片子叶的绿色开花植物，如菜豆。
  misconceptions:
    - 误以为双子叶植物的种子一定没有胚乳，忽略了蓖麻、油桐等有胚乳。
    - 认为菜豆种子只有两片子叶，就不需要种皮了。
    - 将双子叶植物与直根系、网状脉完全等同，不考虑特殊类型。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:反射
  type: Concept
  subject: 生物
  title: 反射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物向光弯曲也是反射，未意识到反射需神经系统参与
    - 能指出并纠正这一错误：觉得所有反射都必须经过大脑皮层，忽略了脊髓参与的反射
  aliases: []
  category: 生理过程
  explanation: 人体通过神经系统对内外刺激作出的规律性应答，是神经调节的基本方式。
  misconceptions:
    - 认为植物向光弯曲也是反射，未意识到反射需神经系统参与
    - 觉得所有反射都必须经过大脑皮层，忽略了脊髓参与的反射
    - 把膝跳反射、缩手反射等简单反射当作随意主动的行为
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:反射弧
  type: Concept
  subject: 生物
  title: 反射弧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将反射弧传导方向写成效应器→传出神经→神经中枢→传入神经→感受器
    - 能指出并纠正这一错误：认为反射弧完整就必然产生反射，未考虑必须有刺激并达到阈值
  aliases: []
  category: 结构
  explanation: 反射活动的神经结构基础，包括感受器、传入神经、神经中枢、传出神经和效应器。
  misconceptions:
    - 将反射弧传导方向写成效应器→传出神经→神经中枢→传入神经→感受器
    - 认为反射弧完整就必然产生反射，未考虑必须有刺激并达到阈值
    - 误以为在缩手反射中，先感到痛再缩手，颠倒感觉与缩手的先后
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:反应速度
  type: Concept
  subject: 生物
  title: 反应速度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把百米跑成绩当反应速度，混淆运动速度与刺激到反应的间隔时间。
    - 能指出并纠正这一错误：测反应速度时，认为手捏住尺子的位置越靠下，反应越快，实际越靠下反应越慢。
  aliases:
    - 反应时间
  category: 生物学概念
  explanation: 从刺激出现到作出反应所需的时间，可通过特定实验测定。
  misconceptions:
    - 误把百米跑成绩当反应速度，混淆运动速度与刺激到反应的间隔时间。
    - 测反应速度时，认为手捏住尺子的位置越靠下，反应越快，实际越靠下反应越慢。
    - 认为反应速度只由反射弧长度决定，忽略突触延搁和效应器的反应时间。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:发酵食品制作
  type: Concept
  subject: 生物
  title: 发酵食品制作
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为制作酸奶用的是酵母菌，而不是乳酸菌
    - 能指出并纠正这一错误：认为泡菜发酵需要充足氧气，否则无法进行
  aliases:
    - 发酵
  category: 应用技术
  explanation: 利用细菌或真菌的代谢活动制作酸奶、泡菜、馒头等食品。
  misconceptions:
    - 认为制作酸奶用的是酵母菌，而不是乳酸菌
    - 认为泡菜发酵需要充足氧气，否则无法进行
    - 认为馒头发酵过程中产生乳酸，使馒头变酸
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S5.md
- id: concept:生物:受精
  type: Concept
  subject: 生物
  title: 受精
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为受精作用发生在子宫内，而不是输卵管
    - 能指出并纠正这一错误：误以为一个卵细胞可同时接受多个精子，形成双胞胎或三胞胎
  aliases:
    - 受精作用
  category: 生理过程
  explanation: 精子和卵细胞结合形成受精卵的过程，一个卵细胞只能接受一个精子。
  misconceptions:
    - 认为受精作用发生在子宫内，而不是输卵管
    - 误以为一个卵细胞可同时接受多个精子，形成双胞胎或三胞胎
    - 认为受精卵是精子发育来的，与卵细胞无关
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:变异
  type: Concept
  subject: 生物
  title: 变异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为变异只指子代与亲代的差异，忽略子代个体间也存在差异。
    - 能指出并纠正这一错误：误认为变异都是由遗传物质改变引起的，忽略环境因素的影响。
  aliases:
    - variation
  category: 生物学概念
  explanation: 变异是指亲子代间及子代个体间的差异。
  misconceptions:
    - 误认为变异只指子代与亲代的差异，忽略子代个体间也存在差异。
    - 误认为变异都是由遗传物质改变引起的，忽略环境因素的影响。
    - 误认为变异总是有利的，实际上多数变异对生物有害或中性。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:口腔的消化作用
  type: Concept
  subject: 生物
  title: 口腔的消化作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为口腔能对蛋白质和脂肪进行初步消化
    - 能指出并纠正这一错误：误以为唾液淀粉酶将淀粉直接分解为葡萄糖，不经过麦芽糖
  aliases:
    - 口腔消化
  category: 生物学概念
  explanation: 口腔通过牙的咀嚼、舌的搅拌和唾液的分泌，对食物进行初步消化，淀粉在唾液淀粉酶作用下分解为麦芽糖。
  misconceptions:
    - 认为口腔能对蛋白质和脂肪进行初步消化
    - 误以为唾液淀粉酶将淀粉直接分解为葡萄糖，不经过麦芽糖
    - 认为牙齿的咀嚼和舌的搅拌属于化学性消化
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:古人类化石
  type: Concept
  subject: 生物
  title: 古人类化石
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北京猿人就是现代人的直系祖先，实际可能是灭绝旁支。
    - 能指出并纠正这一错误：将古人类化石等同于古猿化石，混淆进化阶段。
  aliases: []
  category: 生物学概念
  explanation: 古人类化石是研究人类起源问题的直接证据，如北京猿人头盖骨化石。
  misconceptions:
    - 认为北京猿人就是现代人的直系祖先，实际可能是灭绝旁支。
    - 将古人类化石等同于古猿化石，混淆进化阶段。
    - 认为一块头盖骨化石就能复原物种全貌，忽略个体差异。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:古猿
  type: Concept
  subject: 生物
  title: 古猿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为现代黑猩猩就是古猿，其实古猿早已灭绝。
    - 能指出并纠正这一错误：认为古猿全部树栖，忽略有下地生活并直立行走的种类。
  aliases: []
  category: 生物学概念
  explanation: 现代类人猿和人类的共同祖先，生活在热带丛林中，后来一部分下地生活进化成人类。
  misconceptions:
    - 认为现代黑猩猩就是古猿，其实古猿早已灭绝。
    - 认为古猿全部树栖，忽略有下地生活并直立行走的种类。
    - 把古猿与恐龙同时代，实际恐龙灭绝远早于古猿出现。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:可遗传的变异
  type: Concept
  subject: 生物
  title: 可遗传的变异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为可遗传变异只由基因突变引起，忽略基因重组和染色体变异。
    - 能指出并纠正这一错误：误认为发生在体细胞中的突变也能遗传，只有生殖细胞突变才能传给后代。
  aliases:
    - 遗传的变异
  category: 生物学概念
  explanation: 由遗传物质的变化引起的变异，能够遗传给后代。
  misconceptions:
    - 误认为可遗传变异只由基因突变引起，忽略基因重组和染色体变异。
    - 误认为发生在体细胞中的突变也能遗传，只有生殖细胞突变才能传给后代。
    - 误认为可遗传变异一定对生物有利，实际上也有有害或中性变异。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:叶绿体
  type: Concept
  subject: 生物
  title: 叶绿体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有植物细胞都有叶绿体，忽略根尖细胞无叶绿体。
    - 能指出并纠正这一错误：错误认为叶绿体将化学能转化为光能，颠倒能量转化方向。
  aliases: []
  category: 生物学概念
  explanation: 植物绿色部分细胞中的能量转换器，能吸收光能并将光能转化为化学能储存在有机物中。
  misconceptions:
    - 认为所有植物细胞都有叶绿体，忽略根尖细胞无叶绿体。
    - 错误认为叶绿体将化学能转化为光能，颠倒能量转化方向。
    - 以为叶绿体只存在于叶肉细胞，却不知茎的绿色部分也有。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:叶绿体是光合作用场所
  type: Concept
  subject: 生物
  title: 叶绿体是光合作用场所
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为呼吸作用在叶绿体中进行，与线粒体功能混淆
    - 能指出并纠正这一错误：认为所有植物细胞都有叶绿体，忽略根细胞没有叶绿体
  aliases: []
  category: 生物学概念
  explanation: 叶绿体是植物细胞进行光合作用制造有机物的场所。
  misconceptions:
    - 认为呼吸作用在叶绿体中进行，与线粒体功能混淆
    - 认为所有植物细胞都有叶绿体，忽略根细胞没有叶绿体
    - 认为只有叶片细胞有叶绿体，忽略茎的绿色部分也有
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S5.md
- id: concept:生物:叶绿体是能量转换器
  type: Concept
  subject: 生物
  title: 叶绿体是能量转换器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将叶绿体与线粒体功能混淆，认为叶绿体分解有机物释放能量。
    - 能指出并纠正这一错误：认为只有叶绿体是能量转换器，忽略线粒体也是。
  aliases:
    - 叶绿体的功能
  category: 细胞生物学
  explanation: 叶绿体能将光能转化成化学能，是植物细胞中的能量转换器。
  misconceptions:
    - 将叶绿体与线粒体功能混淆，认为叶绿体分解有机物释放能量。
    - 认为只有叶绿体是能量转换器，忽略线粒体也是。
    - 误以为叶绿体产生的能量直接用于生命活动，实际以有机物储存。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:合作关系
  type: Concept
  subject: 生物
  title: 合作关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为合作只发生在同种生物之间，忽略不同种生物间的协作（如犀牛鸟与犀牛）。
    - 能指出并纠正这一错误：把寄生关系误认为合作，认为共同生活就是互助互利。
  aliases:
    - 合作
  category: 生态学
  explanation: 同种或不同种生物之间相互协作、共同生活的关系，如蚂蚁、蜜蜂分工合作。
  misconceptions:
    - 认为合作只发生在同种生物之间，忽略不同种生物间的协作（如犀牛鸟与犀牛）。
    - 把寄生关系误认为合作，认为共同生活就是互助互利。
    - 误以为合作仅存在于动物，植物与微生物（如根瘤菌与大豆）没有合作。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:合理利用和保护自然资源
  type: Concept
  subject: 生物
  title: 合理利用和保护自然资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为合理利用和保护自然资源就是完全禁止开发利用，不进行任何开采
    - 能指出并纠正这一错误：将可再生资源视为取之不尽、用之不竭，任意过度使用
  aliases: []
  category: 生态保护措施
  explanation: 在开发利用自然资源时，遵循可持续原则，避免过度消耗和破坏。
  misconceptions:
    - 认为合理利用和保护自然资源就是完全禁止开发利用，不进行任何开采
    - 将可再生资源视为取之不尽、用之不竭，任意过度使用
    - 认为保护自然资源就是保护珍稀动植物，不包括水资源和土地资源
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:合理用药
  type: Concept
  subject: 生物
  title: 合理用药
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为贵的药疗效一定更好，忽略安全性和适用性。
    - 能指出并纠正这一错误：病刚好就自行停药，不按疗程用药导致病情反复。
  aliases:
    - 安全用药
  category: 医学常识
  explanation: 合理用药是指安全、有效、经济地使用药物，其中安全是第一位的。安全用药就是根据患者的病情、体质和药物的作用适当选择药物的品种，以适当的方法、剂量，在适当的时间准确用药，充分发挥药物的最佳效果，尽量减小药物对人体的不良影响或危害。
  misconceptions:
    - 认为贵的药疗效一定更好，忽略安全性和适用性。
    - 病刚好就自行停药，不按疗程用药导致病情反复。
    - 为了快点好，随意加大药量或同时吃多种同类药。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:合理膳食
  type: Concept
  subject: 生物
  title: 合理膳食
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“清淡饮食”就是一点油盐不吃，结果只吃水煮菜，导致必需脂肪酸缺乏
    - 能指出并纠正这一错误：把“多喝骨头汤补钙”当合理膳食，实际钙含量低且脂肪高
  aliases:
    - 均衡饮食
  category: 健康生活方式
  explanation: 合理膳食是指均衡摄入各类营养素，避免高油、高盐、高糖食物，适量摄入蛋白质。
  misconceptions:
    - 认为“清淡饮食”就是一点油盐不吃，结果只吃水煮菜，导致必需脂肪酸缺乏
    - 把“多喝骨头汤补钙”当合理膳食，实际钙含量低且脂肪高
    - 觉得每天只吃水果和蔬菜就能健康减肥，忽视蛋白质和主食摄入
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:合理营养
  type: Concept
  subject: 生物
  title: 合理营养
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为合理营养就是吃得越多越好，种类多就行。
    - 能指出并纠正这一错误：认为合理营养是不吃高脂肪高糖食物，完全禁食某类营养素。
  aliases:
    - 平衡膳食
  category: 营养学
  explanation: 合理营养是指全面而平衡的营养，即摄取的营养物质种类齐全、数量合适，与身体需要保持平衡。
  misconceptions:
    - 误以为合理营养就是吃得越多越好，种类多就行。
    - 认为合理营养是不吃高脂肪高糖食物，完全禁食某类营养素。
    - 误以为所有成年人每天所需营养完全一样，没有个体差异。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S3.md
- id: concept:生物:吞噬细胞
  type: Concept
  subject: 生物
  title: 吞噬细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为吞噬细胞只存在于血液中，忽略组织中也有吞噬细胞
    - 能指出并纠正这一错误：将吞噬细胞归入第三道防线，误以为其只参与特异性免疫
  aliases: []
  category: 核心概念
  explanation: 一种免疫细胞，能吞噬和消灭侵入人体的病原体，属于第二道防线。
  misconceptions:
    - 认为吞噬细胞只存在于血液中，忽略组织中也有吞噬细胞
    - 将吞噬细胞归入第三道防线，误以为其只参与特异性免疫
    - 认为吞噬细胞能识别所有抗原并永久记忆，混淆其与淋巴细胞的功能
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:听觉的形成
  type: Concept
  subject: 生物
  title: 听觉的形成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为听觉在大脑产生，所以切断听觉神经仍能形成听觉
    - 能指出并纠正这一错误：把听小骨振动和鼓膜振动顺序颠倒，认为是听小骨先振动
  aliases: []
  category: 生理学
  explanation: 听觉形成过程包括声波经外耳道传到鼓膜，引起鼓膜振动，通过听小骨传到内耳，刺激耳蜗内的听觉感受器，产生神经冲动，经听觉神经传到大脑皮层听觉中枢形成听觉。
  misconceptions:
    - 认为听觉在大脑产生，所以切断听觉神经仍能形成听觉
    - 把听小骨振动和鼓膜振动顺序颠倒，认为是听小骨先振动
    - 认为耳蜗能直接形成听觉，实际耳蜗只是产生神经冲动
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:听觉的形成过程
  type: Concept
  subject: 生物
  title: 听觉的形成过程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将听觉形成顺序写成声波→鼓膜→耳蜗→听小骨→听神经，颠倒听小骨和耳蜗。
    - 能指出并纠正这一错误：认为耳蜗直接产生听觉，忘记听觉最终由大脑皮层形成。
  aliases:
    - 听觉形成
    - 听觉形成过程
  category: 生理过程
  explanation: 外界声波经外耳道传到鼓膜，鼓膜振动通过听小骨传到内耳，刺激耳蜗内感觉细胞，信息经听神经传给大脑听觉中枢，产生听觉。
  misconceptions:
    - 将听觉形成顺序写成声波→鼓膜→耳蜗→听小骨→听神经，颠倒听小骨和耳蜗。
    - 认为耳蜗直接产生听觉，忘记听觉最终由大脑皮层形成。
    - 认为鼓膜振动直接引起听神经兴奋，忽略听小骨传递和耳蜗换能。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:吸收
  type: Concept
  subject: 生物
  title: 吸收
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为吸收就是食物在消化道内被分解的过程，与消化混淆。
    - 能指出并纠正这一错误：认为只有小肠能吸收营养物质，胃和大肠不吸收任何物质。
  aliases: []
  category: 人体生理
  explanation: 食物成分或其消化后的产物通过消化道进入血液的过程称为吸收。
  misconceptions:
    - 误以为吸收就是食物在消化道内被分解的过程，与消化混淆。
    - 认为只有小肠能吸收营养物质，胃和大肠不吸收任何物质。
    - 误以为吸收是通过消化道蠕动推动食物前进的过程。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:吸毒的危害
  type: Concept
  subject: 生物
  title: 吸毒的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“吸一次不会上瘾”，实际上海洛因一次即可成瘾
    - 能指出并纠正这一错误：觉得吸毒只是个人自由，不影响他人，忽视其引发抢劫等犯罪行为
  aliases:
    - 毒品危害
  category: 健康危害
  explanation: 吸毒会损害神经系统、降低免疫力，导致多种疾病，甚至死亡，并对家庭和社会造成严重危害。
  misconceptions:
    - 认为“吸一次不会上瘾”，实际上海洛因一次即可成瘾
    - 觉得吸毒只是个人自由，不影响他人，忽视其引发抢劫等犯罪行为
    - 主张只有注射毒品才会成瘾，吸食大麻没有危害
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:吸烟的危害
  type: Concept
  subject: 生物
  title: 吸烟的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为吸烟只伤害吸烟者自己的肺，与周围人健康无关。
    - 能指出并纠正这一错误：觉得吸二手烟没有危害，或者自己不吸烟就不会得肺癌。
  aliases: []
  category: 健康知识
  explanation: 吸烟是不健康的生活方式，烟草烟雾中含至少69种致癌物质，可诱发呼吸系统疾病如慢性支气管炎、肺癌等。
  misconceptions:
    - 认为吸烟只伤害吸烟者自己的肺，与周围人健康无关。
    - 觉得吸二手烟没有危害，或者自己不吸烟就不会得肺癌。
    - 认为烟瘾大只是意志力薄弱，而非尼古丁依赖。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:呆小症
  type: Concept
  subject: 生物
  title: 呆小症
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为呆小症是生长激素缺乏导致的，实际是甲状腺激素缺乏
    - 能指出并纠正这一错误：误以为呆小症患者仅身材矮小，忽略智力低下的关键特征
  aliases:
    - 呆小病
  category: 疾病
  explanation: 呆小症是幼年时期甲状腺激素缺乏导致的发育障碍，表现为身材矮小、智力低下。
  misconceptions:
    - 认为呆小症是生长激素缺乏导致的，实际是甲状腺激素缺乏
    - 误以为呆小症患者仅身材矮小，忽略智力低下的关键特征
    - 将呆小症与侏儒症都归因于生长激素，混淆病因
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:呼吸作用
  type: Concept
  subject: 生物
  title: 呼吸作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物只在晚上进行呼吸作用，白天不进行
    - 能指出并纠正这一错误：误以为呼吸作用需要光照，光合作用需要氧气
  aliases: []
  category: 生物学概念
  explanation: 生物体分解有机物释放能量，与光合作用共同参与物质循环和能量流动。
  misconceptions:
    - 认为植物只在晚上进行呼吸作用，白天不进行
    - 误以为呼吸作用需要光照，光合作用需要氧气
    - 误以为呼吸作用分解有机物但不释放能量
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:呼吸系统的组成
  type: Concept
  subject: 生物
  title: 呼吸系统的组成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为呼吸道包括口腔，或把肺归入呼吸道
    - 能指出并纠正这一错误：咽和喉位置颠倒，误将咽当作气体和食物共同通道的下端
  aliases:
    - 呼吸系统
  category: 解剖学
  explanation: 人体呼吸系统由呼吸道和肺组成，呼吸道包括鼻、咽、喉、气管、支气管，其作用是保证气体顺畅通过并对吸入气体进行处理。
  misconceptions:
    - 认为呼吸道包括口腔，或把肺归入呼吸道
    - 咽和喉位置颠倒，误将咽当作气体和食物共同通道的下端
    - 漏掉支气管，认为呼吸道只包括鼻、咽、喉、气管
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S1.md
- id: concept:生物:呼吸道
  type: Concept
  subject: 生物
  title: 呼吸道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为呼吸道包括口腔，因为口腔也参与呼吸。
    - 能指出并纠正这一错误：认为肺是呼吸道的一部分，是气体进出的通道。
  aliases:
    - respiratory tract
  category: 解剖结构
  explanation: 呼吸道是气体进出肺的通道，包括鼻、咽、喉、气管、支气管，具有保证气流通畅、温暖、湿润、清洁空气的作用。
  misconceptions:
    - 误以为呼吸道包括口腔，因为口腔也参与呼吸。
    - 认为肺是呼吸道的一部分，是气体进出的通道。
    - 误以为呼吸道是气体交换的场所，而肺泡不是呼吸道。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S1.md
- id: concept:生物:呼吸道对空气的处理
  type: Concept
  subject: 生物
  title: 呼吸道对空气的处理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为呼吸道能彻底清洁空气，到达肺部的气体无菌。
    - 能指出并纠正这一错误：认为鼻腔黏液能温暖空气，纤毛能湿润空气。
  aliases: []
  category: 生理功能
  explanation: 呼吸道能保证气体顺畅通过，并对吸入的气体进行处理，使到达肺部的气体温暖、湿润、清洁，但处理能力有限。
  misconceptions:
    - 误以为呼吸道能彻底清洁空气，到达肺部的气体无菌。
    - 认为鼻腔黏液能温暖空气，纤毛能湿润空气。
    - 误以为呼吸道对空气的处理能力无限，任何空气都无害。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S1.md
- id: concept:生物:品种
  type: Concept
  subject: 生物
  title: 品种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为马和驴是同一物种的不同品种
    - 能指出并纠正这一错误：认为品种是自然存在的野生种群，不经人工选育
  aliases: []
  category: 生物概念
  explanation: 一个自然物种经过人工选育形成的具有一定经济价值和稳定性状的生物群体。
  misconceptions:
    - 认为马和驴是同一物种的不同品种
    - 认为品种是自然存在的野生种群，不经人工选育
    - 把同一物种的不同个体差异说成是不同品种
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S2.md
- id: concept:生物:哺乳动物与人类生活的关系
  type: Concept
  subject: 生物
  title: 哺乳动物与人类生活的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有哺乳动物对人类都有益，忽略鼠类等会传播疾病或破坏庄稼。
    - 能指出并纠正这一错误：觉得只有家畜才提供皮毛和食物，不知道野生哺乳动物也有直接用途。
  aliases: []
  category: 生物学应用
  explanation: 哺乳动物为人类提供食物、皮毛，有些种类对农业有害或传播疾病。
  misconceptions:
    - 认为所有哺乳动物对人类都有益，忽略鼠类等会传播疾病或破坏庄稼。
    - 觉得只有家畜才提供皮毛和食物，不知道野生哺乳动物也有直接用途。
    - 把蝙蝠当成鸟类，认为它会下蛋，实际上蝙蝠是哺乳动物且胎生。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:哺乳动物的主要特征
  type: Concept
  subject: 生物
  title: 哺乳动物的主要特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为鲸和海豚是鱼，实际它们是哺乳动物，用肺呼吸、胎生哺乳。
    - 能指出并纠正这一错误：误以为鸭嘴兽不是哺乳动物，因为卵生，但它有乳腺并哺乳后代。
  aliases:
    - 哺乳动物特征
  category: 生物学概念
  explanation: 哺乳动物体表被毛，体温恒定，胎生哺乳，牙齿有门齿、犬齿和臼齿的分化。
  misconceptions:
    - 认为鲸和海豚是鱼，实际它们是哺乳动物，用肺呼吸、胎生哺乳。
    - 误以为鸭嘴兽不是哺乳动物，因为卵生，但它有乳腺并哺乳后代。
    - 认为所有哺乳动物都有门齿、犬齿、臼齿功能，但兔等缺乏犬齿。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:哺乳动物的牙齿分化
  type: Concept
  subject: 生物
  title: 哺乳动物的牙齿分化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为门齿用来撕咬食物，犬齿用来切断食物，实际门齿切断、犬齿撕咬。
    - 能指出并纠正这一错误：觉得所有哺乳动物都具备三类牙齿，但兔等没有犬齿，有齿隙。
  aliases:
    - 牙齿分化
    - 牙齿的分化
  category: 生物学概念
  explanation: 哺乳动物牙齿分化为门齿、犬齿和臼齿，提高了摄取和消化食物的能力。
  misconceptions:
    - 认为门齿用来撕咬食物，犬齿用来切断食物，实际门齿切断、犬齿撕咬。
    - 觉得所有哺乳动物都具备三类牙齿，但兔等没有犬齿，有齿隙。
    - 误以为牙齿分化与食性无关，实际植食性动物犬齿退化，肉食性犬齿发达。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:唾液淀粉酶
  type: Concept
  subject: 生物
  title: 唾液淀粉酶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为唾液淀粉酶可将淀粉直接分解为葡萄糖。
    - 能指出并纠正这一错误：认为唾液淀粉酶能消化蛋白质，因为口腔有酶。
  aliases: []
  category: 酶
  explanation: 唾液中含有唾液淀粉酶，能将淀粉分解为麦芽糖。
  misconceptions:
    - 误以为唾液淀粉酶可将淀粉直接分解为葡萄糖。
    - 认为唾液淀粉酶能消化蛋白质，因为口腔有酶。
    - 误以为唾液淀粉酶在胃中仍然能继续消化淀粉。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:唾液腺
  type: Concept
  subject: 生物
  title: 唾液腺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为唾液腺是消化道的组成部分，位于口腔壁内
    - 能指出并纠正这一错误：误以为唾液腺分泌的唾液不含消化酶，只能润湿食物
  aliases: []
  category: 生物学概念
  explanation: 唾液腺是消化腺之一，分泌唾液，通过导管流入口腔，参与食物的湿润和初步消化。
  misconceptions:
    - 认为唾液腺是消化道的组成部分，位于口腔壁内
    - 误以为唾液腺分泌的唾液不含消化酶，只能润湿食物
    - 认为唾液腺属于内分泌腺，分泌的唾液通过血液输送
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:器官
  type: Concept
  subject: 生物
  title: 器官
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把一块骨骼肌误认为一个组织，实际上它由多种组织构成，属于器官
    - 能指出并纠正这一错误：认为皮肤只是上皮组织，误认为皮肤是组织而非器官
  aliases:
    - organ
  category: 生物学概念
  explanation: 由不同的组织按照一定的次序组合在一起构成的行使一定功能的结构，叫作器官。
  misconceptions:
    - 把一块骨骼肌误认为一个组织，实际上它由多种组织构成，属于器官
    - 认为皮肤只是上皮组织，误认为皮肤是组织而非器官
    - 把番茄的果肉当成器官，果肉实际是营养组织
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:器官移植
  type: Concept
  subject: 生物
  title: 器官移植
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为器官移植不需要配型，直接移植即可，实际需组织相容性配型以降低排斥反应
    - 能指出并纠正这一错误：认为只有肾脏和心脏可以移植，实际肝、肺、胰腺等也可移植
  aliases: []
  category: 医学技术
  explanation: 将健康器官移植到患者体内以替代失去功能的器官，包括肾、心脏、肝等。
  misconceptions:
    - 认为器官移植不需要配型，直接移植即可，实际需组织相容性配型以降低排斥反应
    - 认为只有肾脏和心脏可以移植，实际肝、肺、胰腺等也可移植
    - 认为移植的器官能完全替代原器官功能，忽略免疫排斥和术后风险
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:噪声
  type: Concept
  subject: 生物
  title: 噪声
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有响度大的声音才是噪声，轻声说话在别人学习时也会成为噪声。
    - 能指出并纠正这一错误：认为噪声只损伤耳朵，不影响其他生理功能，如导致失眠、焦虑。
  aliases:
    - 噪音
  category: 概念
  explanation: 影响人们学习、工作和休息的声音称为噪声，长期暴露或突然强噪声可损伤听力。
  misconceptions:
    - 认为只有响度大的声音才是噪声，轻声说话在别人学习时也会成为噪声。
    - 认为噪声只损伤耳朵，不影响其他生理功能，如导致失眠、焦虑。
    - 认为优美的音乐在任何时候都是乐音，但学习时播放也会干扰注意力而成为噪声。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:国家免疫规划疫苗儿童免疫程序表
  type: Concept
  subject: 生物
  title: 国家免疫规划疫苗儿童免疫程序表
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为该表适用于所有疫苗，实际只针对国家免疫规划疫苗，自费疫苗不在此表内。
    - 能指出并纠正这一错误：认为表内接种时间固定不可变，错过即无效，实际可补种但需按间隔要求。
  aliases:
    - 免疫程序表
  category: 公共卫生
  explanation: 规定儿童在不同年龄接种相应疫苗的表格，用于指导免疫规划实施。
  misconceptions:
    - 认为该表适用于所有疫苗，实际只针对国家免疫规划疫苗，自费疫苗不在此表内。
    - 认为表内接种时间固定不可变，错过即无效，实际可补种但需按间隔要求。
    - 把程序表当疫苗说明书，忽略它只规定时间剂次，不涉及禁忌症等内容。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:国家安全体系
  type: Concept
  subject: 生物
  title: 国家安全体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家安全只包含军事和政治，将生态安全排除在外。
    - 能指出并纠正这一错误：把生态安全与国家安全视为并列关系，忽略生态安全是国家安全的一部分。
  aliases: []
  category: 政策法规
  explanation: 包括生态安全在内的国家整体安全框架，生态安全是国家安全的重要组成部分。
  misconceptions:
    - 认为国家安全只包含军事和政治，将生态安全排除在外。
    - 把生态安全与国家安全视为并列关系，忽略生态安全是国家安全的一部分。
    - 认为生态安全仅在国家安全体系中占次要地位，可被其他安全取代。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:土地沙化
  type: Concept
  subject: 生物
  title: 土地沙化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为土地沙化完全是自然演变，与砍伐森林、过度放牧无关。
    - 能指出并纠正这一错误：觉得沙化就是沙漠边缘扩大，忽略草地退化也是沙化表现。
  aliases:
    - 沙漠化
  category: 生态环境问题
  explanation: 土地因植被破坏等原因逐渐变成沙漠的过程，是严重的生态环境问题之一。
  misconceptions:
    - 认为土地沙化完全是自然演变，与砍伐森林、过度放牧无关。
    - 觉得沙化就是沙漠边缘扩大，忽略草地退化也是沙化表现。
    - 以为只要栽上树就能立刻逆转沙化，忽略需长期恢复和水分限制。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:垂体
  type: Concept
  subject: 生物
  title: 垂体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为垂体位于颈部甲状腺的旁边
    - 能指出并纠正这一错误：认为垂体只分泌生长激素一种激素
  aliases: []
  category: 内分泌腺
  explanation: 位于脑下部，分泌生长激素等多种激素，调节人体的生理活动。
  misconceptions:
    - 认为垂体位于颈部甲状腺的旁边
    - 认为垂体只分泌生长激素一种激素
    - 认为侏儒症是垂体分泌过多引起的
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:城市生态系统
  type: Concept
  subject: 生物
  title: 城市生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为城市生态系统只有人类，没有其他生物。
    - 能指出并纠正这一错误：误认为城市生态系统能完全自我调节，不需要外部输入。
  aliases: []
  category: 生态系统类型
  explanation: 课文提及城市生态系统是多种多样的生态系统之一，但未详细描述。
  misconceptions:
    - 误认为城市生态系统只有人类，没有其他生物。
    - 误认为城市生态系统能完全自我调节，不需要外部输入。
    - 误认为城市生态系统是独立的，与周边自然生态系统无关。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:培养基
  type: Concept
  subject: 生物
  title: 培养基
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为培养基就是土壤或泥土，实际是人工配制的营养基质。
    - 能指出并纠正这一错误：误以为所有培养基都必须加琼脂，实际液体培养基不加琼脂。
  aliases: []
  category: 实验方法
  explanation: 适于细菌或真菌生长的物质制成的营养基质，固体培养基常加入琼脂。
  misconceptions:
    - 认为培养基就是土壤或泥土，实际是人工配制的营养基质。
    - 误以为所有培养基都必须加琼脂，实际液体培养基不加琼脂。
    - 觉得培养基只能培养细菌，真菌和病毒也可用特定培养基培养。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:基因
  type: Concept
  subject: 生物
  title: 基因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为基因就是DNA，其实基因是DNA上有遗传效应的片段
    - 能指出并纠正这一错误：认为基因位于细胞质中，主要存在于线粒体或叶绿体
  aliases:
    - 遗传因子
  category: 生物学概念
  explanation: 基因是控制生物性状的遗传物质片段，位于DNA上，通过指导蛋白质合成决定性状。
  misconceptions:
    - 误认为基因就是DNA，其实基因是DNA上有遗传效应的片段
    - 认为基因位于细胞质中，主要存在于线粒体或叶绿体
    - 认为一条染色体只有一个基因
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:基因在亲子代间的传递
  type: Concept
  subject: 生物
  title: 基因在亲子代间的传递
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为亲代通过血液或体液把基因传给子代，实际通过精子和卵细胞。
    - 能指出并纠正这一错误：误认为精子和卵细胞中的基因数量与体细胞相同，实际配子中基因成单。
  aliases: []
  category: 遗传规律
  explanation: 在有性生殖过程中，基因通过精子和卵细胞传递给子代。
  misconceptions:
    - 误认为亲代通过血液或体液把基因传给子代，实际通过精子和卵细胞。
    - 误认为精子和卵细胞中的基因数量与体细胞相同，实际配子中基因成单。
    - 误认为受精后子代基因数是父母的总和，实际减数分裂后各提供一半。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S2.md
- id: concept:生物:基因工程育种
  type: Concept
  subject: 生物
  title: 基因工程育种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为基因工程育种无需改变基因，只需改变环境条件。
    - 能指出并纠正这一错误：误认为基因工程育种的原理是基因突变，实际是基因重组。
  aliases:
    - 转基因育种
  category: 育种方法
  explanation: 通过将特定基因转入或去除，培育具有特定性状的优良品种的方法。
  misconceptions:
    - 误认为基因工程育种无需改变基因，只需改变环境条件。
    - 误认为基因工程育种的原理是基因突变，实际是基因重组。
    - 误认为转入的外源基因一定能在受体中表达，忽略调控序列等因素。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:基因控制生物的性状
  type: Concept
  subject: 生物
  title: 基因控制生物的性状
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为基因型相同则表现型一定相同，忽略环境对性状的影响。
    - 能指出并纠正这一错误：误认为一个基因只控制一个性状，忽略基因与性状的复杂对应关系。
  aliases: []
  category: 遗传规律
  explanation: 生物的性状是由基因控制的，基因可以控制生物体的性状表现。
  misconceptions:
    - 误认为基因型相同则表现型一定相同，忽略环境对性状的影响。
    - 误认为一个基因只控制一个性状，忽略基因与性状的复杂对应关系。
    - 误认为染色体数目相同则性状相同，忽略基因差异和等位基因不同。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:基因的显性和隐性
  type: Concept
  subject: 生物
  title: 基因的显性和隐性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为隐性基因在杂合状态下完全不表达，实际隐性基因仍能产生蛋白质。
    - 能指出并纠正这一错误：误认为显性基因控制的性状一定比隐性基因更常见，显隐性与优劣无关。
  aliases: []
  category: 遗传学规律
  explanation: 控制相对性状的基因有显性和隐性之分，显性基因控制的性状在杂合状态下能表现，隐性基因控制的性状在杂合状态下不能表现。
  misconceptions:
    - 误认为隐性基因在杂合状态下完全不表达，实际隐性基因仍能产生蛋白质。
    - 误认为显性基因控制的性状一定比隐性基因更常见，显隐性与优劣无关。
    - 误认为显性和隐性固定不变，忽略不完全显性等特殊情况。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:声带
  type: Concept
  subject: 生物
  title: 声带
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为声带位于气管内，呼吸时振动发出声音。
    - 能指出并纠正这一错误：认为发声时声带分开，气流通过时无振动。
  aliases:
    - vocal cords
  category: 解剖结构
  explanation: 声带位于喉部，呼吸时分开，发声时拉紧，气流振动声带发出声音。
  misconceptions:
    - 误以为声带位于气管内，呼吸时振动发出声音。
    - 认为发声时声带分开，气流通过时无振动。
    - 误以为声带是软骨，发声靠肌肉拉紧像琴弦一样振动。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S1.md
- id: concept:生物:处方药
  type: Concept
  subject: 生物
  title: 处方药
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为处方药不需要医生处方，可以在药店随便买。
    - 能指出并纠正这一错误：把处方药和非处方药混为一谈，以为标着OTC就是处方药。
  aliases: []
  category: 医学常识
  explanation: 处方药是指必须凭执业医师或执业助理医师的处方才可购买，并要遵医嘱使用的药物。
  misconceptions:
    - 认为处方药不需要医生处方，可以在药店随便买。
    - 把处方药和非处方药混为一谈，以为标着OTC就是处方药。
    - 以为处方药只要按说明书吃就安全，不需遵医嘱。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:外出血的类型
  type: Concept
  subject: 生物
  title: 外出血的类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为毛细血管出血最严重，需紧急止血，实际最常见且可自愈
    - 能指出并纠正这一错误：把血液喷涌而出归为静脉出血，实际是动脉出血特征
  aliases:
    - 出血种类
  category: 医学常识
  explanation: 外出血分为毛细血管出血、静脉出血和动脉出血三种，各有不同的血液颜色和流出特点。
  misconceptions:
    - 认为毛细血管出血最严重，需紧急止血，实际最常见且可自愈
    - 把血液喷涌而出归为静脉出血，实际是动脉出血特征
    - 认为三种出血类型都用同一方法止血，不区分流速和颜色
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:外来入侵物种
  type: Concept
  subject: 生物
  title: 外来入侵物种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把所有外来物种都当成入侵物种，如认为从外国引入的胡萝卜是入侵物种，实际上未造成危害则不算。
    - 能指出并纠正这一错误：认为外来入侵物种只包括动物，如认为水葫芦是植物就不属于外来入侵物种。
  aliases:
    - 外来物种
  category: 威胁因素
  explanation: 外来入侵物种是指从外地传入，对当地生物多样性和生态安全造成威胁的物种。
  misconceptions:
    - 把所有外来物种都当成入侵物种，如认为从外国引入的胡萝卜是入侵物种，实际上未造成危害则不算。
    - 认为外来入侵物种只包括动物，如认为水葫芦是植物就不属于外来入侵物种。
    - 认为只有从国外传入才会入侵，如认为把长江鱼放入滇池不会破坏生态，忽略了跨区域引入的潜在威胁。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:外来物种入侵
  type: Concept
  subject: 生物
  title: 外来物种入侵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为外来物种入侵后，本地物种会自然淘汰，如认为巴西龟只是多一种乌龟，不会导致本地龟灭绝。
    - 能指出并纠正这一错误：认为外来物种入侵只影响数量，不破坏生态结构，如认为水葫芦增多仅是遮挡阳光，不影响水质底泥变化。
  aliases:
    - 生物入侵
  category: 生态风险
  explanation: 外来物种在新环境中缺乏天敌，可能大量繁殖，破坏当地生态平衡，威胁本地物种。
  misconceptions:
    - 认为外来物种入侵后，本地物种会自然淘汰，如认为巴西龟只是多一种乌龟，不会导致本地龟灭绝。
    - 认为外来物种入侵只影响数量，不破坏生态结构，如认为水葫芦增多仅是遮挡阳光，不影响水质底泥变化。
    - 认为外来物种是故意入侵的，如认为巴西龟有意识地驱逐本地龟，实际是生态位竞争的结果。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:外骨骼
  type: Concept
  subject: 生物
  title: 外骨骼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为外骨骼会随着动物长大而变大，不知道需要蜕皮。
    - 能指出并纠正这一错误：认为外骨骼是细胞构成的结构，能像皮肤一样呼吸。
  aliases: []
  category: 生物结构
  explanation: 节肢动物体表坚韧的外壳，起保护和防止水分蒸发的作用，但限制生长，需蜕皮。
  misconceptions:
    - 误以为外骨骼会随着动物长大而变大，不知道需要蜕皮。
    - 认为外骨骼是细胞构成的结构，能像皮肤一样呼吸。
    - 把螺壳、贝壳当作节肢动物的外骨骼。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:大气圈
  type: Concept
  subject: 生物
  title: 大气圈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为生物圈包含整个大气圈，实际只包含其底部。
    - 能指出并纠正这一错误：误认为大气圈就是氧气，忽略其由多种气体组成。
  aliases: []
  category: 生物学概念
  explanation: 大气圈是地球表面的气体圈层，由多种气体组成，生物圈包括其底部。
  misconceptions:
    - 误认为生物圈包含整个大气圈，实际只包含其底部。
    - 误认为大气圈就是氧气，忽略其由多种气体组成。
    - 误认为大气圈顶部也有大量生物活动。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:大脑
  type: Concept
  subject: 生物
  title: 大脑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为大脑只管随意运动，忽略感觉、语言等最高级功能
    - 能指出并纠正这一错误：把呼吸困难归因于大脑受损，实际是脑干生命中枢
  aliases: []
  category: 器官结构
  explanation: 大脑包括左右两个半球，表面是大脑皮层，是调节人体生命活动的最高级中枢，具有感觉、运动、语言等多种功能区。
  misconceptions:
    - 认为大脑只管随意运动，忽略感觉、语言等最高级功能
    - 把呼吸困难归因于大脑受损，实际是脑干生命中枢
    - 误以为大脑是唯一反射中枢，忘记脊髓也能完成反射
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:女性生殖系统
  type: Concept
  subject: 生物
  title: 女性生殖系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为子宫是女性最主要的生殖器官
    - 能指出并纠正这一错误：认为卵细胞从卵巢排出后直接通过阴道排出体外
  aliases:
    - 女性生殖器官
  category: 人体结构
  explanation: 女性生殖系统主要包括卵巢、输卵管、子宫和阴道等，卵巢是主要生殖器官，产生卵细胞和分泌雌激素等。
  misconceptions:
    - 误认为子宫是女性最主要的生殖器官
    - 认为卵细胞从卵巢排出后直接通过阴道排出体外
    - 混淆输卵管和子宫的功能，以为输卵管是胚胎发育的主要场所
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:嫁接
  type: Concept
  subject: 生物
  title: 嫁接
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为嫁接后接穗和砧木的基因混合，果实兼具两者特征
    - 能指出并纠正这一错误：认为嫁接属于有性生殖，因为需要两棵植株
  aliases: []
  category: 无性生殖应用
  explanation: 把一个植物体的枝或芽（接穗）接在另一个植物体（砧木）上，使两者长成一个完整植物体的方法。
  misconceptions:
    - 误以为嫁接后接穗和砧木的基因混合，果实兼具两者特征
    - 认为嫁接属于有性生殖，因为需要两棵植株
    - 把砧木和接穗弄反，认为被接的树是接穗
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:子实体
  type: Concept
  subject: 生物
  title: 子实体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为子实体是蘑菇的地下部分，实际子实体是地上的菌柄和菌盖。
    - 能指出并纠正这一错误：误以为子实体负责吸收营养，实际它主要产生孢子，菌丝吸收营养。
  aliases: []
  category: 生物概念
  explanation: 子实体是蘑菇等大型真菌地上部分，由菌柄和菌盖组成，用于产生孢子。
  misconceptions:
    - 认为子实体是蘑菇的地下部分，实际子实体是地上的菌柄和菌盖。
    - 误以为子实体负责吸收营养，实际它主要产生孢子，菌丝吸收营养。
    - 把整个蘑菇都叫子实体，忽略了地下的菌丝不是子实体的一部分。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:孟德尔的解释
  type: Concept
  subject: 生物
  title: 孟德尔的解释
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为孟德尔当时提出了“基因”一词，实际他称为“遗传因子”。
    - 能指出并纠正这一错误：误认为孟德尔认为配子中遗传因子成对存在，实际配子中只含一个。
  aliases:
    - 孟德尔遗传规律
  category: 科学史
  explanation: 孟德尔对豌豆杂交实验现象作出的解释，包括显性性状、隐性性状、显性基因、隐性基因以及基因在体细胞和生殖细胞中的存在方式。
  misconceptions:
    - 误认为孟德尔当时提出了“基因”一词，实际他称为“遗传因子”。
    - 误认为孟德尔认为配子中遗传因子成对存在，实际配子中只含一个。
    - 误认为孟德尔的解释适用于所有生物，实际只限有性生殖且遵循分离定律的性状。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:孟德尔的豌豆杂交实验
  type: Concept
  subject: 生物
  title: 孟德尔的豌豆杂交实验
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为孟德尔在开花后去雄，实际应在花未开放时去雄并套袋。
    - 能指出并纠正这一错误：误认为F2显性性状全部是纯合子，实际显性个体中既有纯合也有杂合。
  aliases: []
  category: 科学史实
  explanation: 孟德尔通过豌豆杂交实验发现了生物遗传的规律。
  misconceptions:
    - 误认为孟德尔在开花后去雄，实际应在花未开放时去雄并套袋。
    - 误认为F2显性性状全部是纯合子，实际显性个体中既有纯合也有杂合。
    - 误认为孟德尔只做杂交实验不做自交实验，实际还进行了自交验证。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:孢子
  type: Concept
  subject: 生物
  title: 孢子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为孢子是植物的种子，把蕨类植物称为种子植物。
    - 能指出并纠正这一错误：认为孢子必须在水中才能萌发，忽略了气生环境中的孢子。
  aliases: []
  category: 生物学概念
  explanation: 孢子是一种生殖细胞，十分微小，可通过空气、水传播，在适宜环境中形成新个体。
  misconceptions:
    - 误以为孢子是植物的种子，把蕨类植物称为种子植物。
    - 认为孢子必须在水中才能萌发，忽略了气生环境中的孢子。
    - 把孢子看成动物产生的生殖细胞，如草履虫的孢囊。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:安全用药
  type: Concept
  subject: 生物
  title: 安全用药
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得药量越大好得越快，擅自加倍服药，导致药物中毒或肝肾损伤。
    - 能指出并纠正这一错误：认为中成药纯天然无毒副作用，随意长期服用，实际也有禁忌和不良反应。
  aliases:
    - 合理用药
  category: 医学常识
  explanation: 安全用药是指根据病情、体质和药物性质，选择适当的药物、剂量和用法，避免药物误用和滥用，确保用药有效和安全。
  misconceptions:
    - 觉得药量越大好得越快，擅自加倍服药，导致药物中毒或肝肾损伤。
    - 认为中成药纯天然无毒副作用，随意长期服用，实际也有禁忌和不良反应。
    - 根据他人经验自行购买抗生素，不对症反而延误病情并导致耐药。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:实验组和对照组
  type: Concept
  subject: 生物
  title: 实验组和对照组
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为对照组就是不作任何处理的一组，如探究土壤湿度对蚯蚓分布时，把干燥土壤组当对照组，其实湿润和干…
    - 能指出并纠正这一错误：把施加实验变量的一组当作对照组，如探究光是光合作用必需条件时，把遮光组当对照组。
  aliases:
    - 对照实验
  category: 科学方法
  explanation: 实验组是接受实验处理的一组，对照组是用于比较的标准组，其他条件相同。
  misconceptions:
    - 认为对照组就是不作任何处理的一组，如探究土壤湿度对蚯蚓分布时，把干燥土壤组当对照组，其实湿润和干燥都是实验变量处理。
    - 把施加实验变量的一组当作对照组，如探究光是光合作用必需条件时，把遮光组当对照组。
    - 认为对照组和实验组除了变量外其他条件可以不同，如探究光照对种子萌发时，实验组放在温暖处，对照组放在冰箱里，以为也能对照。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:实验设计
  type: Concept
  subject: 生物
  title: 实验设计
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：设置重复组时为了多做一次实验以获得更多数据，但不是为了减少误差
    - 能指出并纠正这一错误：认为实验设计不需要先作出假设，可以直接操作
  aliases:
    - 探究实验
  category: 科学方法
  explanation: 科学实验需要提出问题、作出假设、制订计划、实施实验、分析结果，并设置重复组以减少误差。
  misconceptions:
    - 设置重复组时为了多做一次实验以获得更多数据，但不是为了减少误差
    - 认为实验设计不需要先作出假设，可以直接操作
    - 误以为对照组不需要做任何处理，与实验组无关
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:对照实验
  type: Concept
  subject: 生物
  title: 对照实验
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为对照组就是不做处理的组，实际对照组也可能接受处理（如安慰剂）
    - 能指出并纠正这一错误：把对照组和实验组混淆，认为改变自变量的是对照组
  aliases: []
  category: 科学方法
  explanation: 对照实验是设置对照组和实验组，控制自变量，观察因变量，以验证假设的实验方法。
  misconceptions:
    - 认为对照组就是不做处理的组，实际对照组也可能接受处理（如安慰剂）
    - 把对照组和实验组混淆，认为改变自变量的是对照组
    - 认为对照实验必须设置两个组，忽略自身前后对照等类型
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:小肠是吸收营养物质的主要器官
  type: Concept
  subject: 生物
  title: 小肠是吸收营养物质的主要器官
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为胃是吸收营养物质的主要器官，因为胃容量大。
    - 能指出并纠正这一错误：认为小肠是主要吸收器官仅因为长度长，忽略皱襞和绒毛。
  aliases: []
  category: 人体生理
  explanation: 小肠长5-6米，内表面有皱襞和小肠绒毛，增大了吸收面积，是吸收营养物质的主要器官。
  misconceptions:
    - 误以为胃是吸收营养物质的主要器官，因为胃容量大。
    - 认为小肠是主要吸收器官仅因为长度长，忽略皱襞和绒毛。
    - 误以为大肠能吸收大部分营养物质，因为有微生物群落。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:小肠绒毛
  type: Concept
  subject: 生物
  title: 小肠绒毛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为小肠绒毛位于大肠，增大大肠的吸收面积。
    - 能指出并纠正这一错误：认为小肠绒毛是细胞，与上皮细胞混为一谈。
  aliases:
    - 绒毛
  category: 人体结构
  explanation: 小肠内表面的绒毛状突起，增大了吸收面积，是吸收营养物质的主要结构。
  misconceptions:
    - 误以为小肠绒毛位于大肠，增大大肠的吸收面积。
    - 认为小肠绒毛是细胞，与上皮细胞混为一谈。
    - 误以为小肠绒毛增大了消化面积，而不是吸收面积。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:小脑
  type: Concept
  subject: 生物
  title: 小脑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为小脑负责记忆、思维，实际协调运动维持平衡
    - 能指出并纠正这一错误：走路摇晃就判定大脑受伤，可能小脑受损
  aliases: []
  category: 器官结构
  explanation: 小脑的功能是协调运动，维持身体平衡。
  misconceptions:
    - 认为小脑负责记忆、思维，实际协调运动维持平衡
    - 走路摇晃就判定大脑受伤，可能小脑受损
    - 将小脑与脑干功能混淆，以为小脑控制心跳
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:就地保护
  type: Concept
  subject: 生物
  title: 就地保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为就地保护就是把濒危动物抓回动物园饲养，如认为大熊猫圈养繁殖属于就地保护。
    - 能指出并纠正这一错误：认为就地保护就是设立禁区禁止一切人类活动，如认为自然保护区内不能开展科研和旅游。
  aliases:
    - 就地保护
  category: 保护措施
  explanation: 就地保护是指将包含保护对象的一定面积的陆地或水域划分出来，设置为自然保护地进行保护和管理。
  misconceptions:
    - 认为就地保护就是把濒危动物抓回动物园饲养，如认为大熊猫圈养繁殖属于就地保护。
    - 认为就地保护就是设立禁区禁止一切人类活动，如认为自然保护区内不能开展科研和旅游。
    - 认为就地保护只保护珍稀动物个体，不保护其栖息环境，如认为给朱鹮投喂饲料即就地保护。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:尿的形成
  type: Concept
  subject: 生物
  title: 尿的形成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为原尿中含血细胞和蛋白质，实际肾小球滤过时它们不能通过
    - 能指出并纠正这一错误：认为肾小管重吸收尿素，实际尿素大部分不被重吸收而随尿液排出
  aliases: []
  category: 生理学
  explanation: 尿的形成包括肾小球的滤过作用和肾小管的重吸收作用，原尿经重吸收后形成尿液。
  misconceptions:
    - 认为原尿中含血细胞和蛋白质，实际肾小球滤过时它们不能通过
    - 认为肾小管重吸收尿素，实际尿素大部分不被重吸收而随尿液排出
    - 把尿的形成顺序写成‘肾小管重吸收→肾小球滤过’，实际先滤过再重吸收
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:屈肘和伸肘动作的肌肉配合
  type: Concept
  subject: 生物
  title: 屈肘和伸肘动作的肌肉配合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为伸肘时肱二头肌收缩、肱三头肌舒张，把屈伸肘时的肌肉配合搞反。
    - 能指出并纠正这一错误：误以为屈肘和伸肘只由一组肌肉完成，忽略多组肌肉协调配合。
  aliases: []
  category: 生理学
  explanation: 屈肘时肱二头肌收缩、肱三头肌舒张；伸肘时相反，多组肌肉协调配合完成动作。
  misconceptions:
    - 认为伸肘时肱二头肌收缩、肱三头肌舒张，把屈伸肘时的肌肉配合搞反。
    - 误以为屈肘和伸肘只由一组肌肉完成，忽略多组肌肉协调配合。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:山水林田湖草沙一体化保护与修复
  type: Concept
  subject: 生物
  title: 山水林田湖草沙一体化保护与修复
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为山水林田湖草沙是各自独立、互不影响的生态系统，只需单独治理
    - 能指出并纠正这一错误：将一体化保护理解为在每块区域都采取相同的修复措施，不因地制宜
  aliases:
    - 山水林田湖草沙生命共同体
  category: 生态保护原则
  explanation: 指将山水林田湖草沙等不同生态系统视为生命共同体，进行整体保护、系统修复和综合治理。
  misconceptions:
    - 认为山水林田湖草沙是各自独立、互不影响的生态系统，只需单独治理
    - 将一体化保护理解为在每块区域都采取相同的修复措施，不因地制宜
    - 认为一体化保护就是只注重植树种草，忽略各生态系统间的整体联系
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:岩石圈
  type: Concept
  subject: 生物
  title: 岩石圈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为生物圈包含整个岩石圈，实际只包含其表面。
    - 能指出并纠正这一错误：误认为岩石圈就是地表的土壤层，忽略其岩石主体。
  aliases: []
  category: 生物学概念
  explanation: 岩石圈是地球的最外层，由岩石组成，表面覆盖土壤，生物圈包括其表面。
  misconceptions:
    - 误认为生物圈包含整个岩石圈，实际只包含其表面。
    - 误认为岩石圈就是地表的土壤层，忽略其岩石主体。
    - 误认为岩石圈中的所有岩石上都生活着生物。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:巡护员
  type: Concept
  subject: 生物
  title: 巡护员
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为巡护员只是公园保洁员，如以为工作仅打扫垃圾，不涉及物种监测和记录。
    - 能指出并纠正这一错误：认为巡护员没有执法权，只能旁观盗猎者，如认为遇到盗猎只能报警，不能当场制止。
  aliases:
    - 护林员
  category: 职业
  explanation: 从事野外野生动植物保育和自然环境保护工作的相关人员，负责监测、保护、打击盗猎等。
  misconceptions:
    - 认为巡护员只是公园保洁员，如以为工作仅打扫垃圾，不涉及物种监测和记录。
    - 认为巡护员没有执法权，只能旁观盗猎者，如认为遇到盗猎只能报警，不能当场制止。
    - 认为巡护员是临时志愿者，任何爱好者都能担任，如以为不需要专业培训即可上岗。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:巨人症
  type: Concept
  subject: 生物
  title: 巨人症
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为巨人症是成年后生长激素分泌过多导致的，实际是幼年时期分泌过多
    - 能指出并纠正这一错误：把巨人症和肢端肥大症混淆，成年后分泌过多是肢端肥大症
  aliases: []
  category: 疾病
  explanation: 巨人症是幼年时期生长激素分泌过多导致的过度生长。
  misconceptions:
    - 认为巨人症是成年后生长激素分泌过多导致的，实际是幼年时期分泌过多
    - 把巨人症和肢端肥大症混淆，成年后分泌过多是肢端肥大症
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:巴斯德
  type: Concept
  subject: 生物
  title: 巴斯德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把巴斯德误认为是青霉素的发现者（弗莱明）。
    - 能指出并纠正这一错误：认为巴斯德是英国人，实际他是法国科学家。
  aliases: []
  category: 科学家
  explanation: 法国科学家，通过研究证明了传染病可由细菌引起，并研制出鸡霍乱疫苗、炭疽疫苗等，为微生物学和免疫学做出巨大贡献。
  misconceptions:
    - 把巴斯德误认为是青霉素的发现者（弗莱明）。
    - 认为巴斯德是英国人，实际他是法国科学家。
    - 以为巴斯德发明了牛痘接种法，实际是詹纳。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:常染色体
  type: Concept
  subject: 生物
  title: 常染色体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为常染色体上不含性别相关基因，实际常染色体上也有影响性别的基因。
    - 能指出并纠正这一错误：误认为性染色体上的基因只与性别有关，实际性染色体上也有其他性状基因。
  aliases: []
  category: 遗传学概念
  explanation: 除性染色体外，男女相同的染色体，共22对。
  misconceptions:
    - 误认为常染色体上不含性别相关基因，实际常染色体上也有影响性别的基因。
    - 误认为性染色体上的基因只与性别有关，实际性染色体上也有其他性状基因。
    - 误认为常染色体在男女中数目不同，实际都是22对，性染色体才不同。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:干细胞
  type: Concept
  subject: 生物
  title: 干细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为干细胞只能分化成血细胞，实际干细胞可分化为多种细胞、组织和器官
    - 能指出并纠正这一错误：认为成体干细胞没有分化潜能，实际成体干细胞仍能分化并参与修复
  aliases: []
  category: 生物学概念
  explanation: 干细胞是一类具有自我更新和分化潜能的细胞，能分化为各种细胞、组织和器官。
  misconceptions:
    - 认为干细胞只能分化成血细胞，实际干细胞可分化为多种细胞、组织和器官
    - 认为成体干细胞没有分化潜能，实际成体干细胞仍能分化并参与修复
    - 把干细胞与普通体细胞混淆，误认为所有体细胞都是干细胞
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:平衡膳食宝塔
  type: Concept
  subject: 生物
  title: 平衡膳食宝塔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为宝塔越往上摄入量越多，把塔尖的油脂当作吃得最多的
    - 能指出并纠正这一错误：把每一层食物等量摄入，以为每天各层吃一样多
  aliases:
    - 膳食宝塔
  category: 营养学
  explanation: 中国营养学会制订的《中国居民膳食指南》中提出的食物分类和比例建议，用宝塔形式表示每日各类食物的摄入量。
  misconceptions:
    - 认为宝塔越往上摄入量越多，把塔尖的油脂当作吃得最多的
    - 把每一层食物等量摄入，以为每天各层吃一样多
    - 认为多吃肉少吃谷类更健康，因肉类位于宝塔上层
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S3.md
- id: concept:生物:幼根的生长
  type: Concept
  subject: 生物
  title: 幼根的生长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为幼根的生长主要靠成熟区吸收营养，而不是分生区和伸长区的分裂伸长。
    - 能指出并纠正这一错误：认为分生区细胞伸长使根变长，伸长区细胞分裂增加细胞数量。
  aliases:
    - 根的生长
  category: 生物学概念
  explanation: 幼根的生长依靠分生区细胞分裂增加数量，伸长区细胞伸长增大体积。
  misconceptions:
    - 认为幼根的生长主要靠成熟区吸收营养，而不是分生区和伸长区的分裂伸长。
    - 认为分生区细胞伸长使根变长，伸长区细胞分裂增加细胞数量。
    - 误认为伸长区细胞既能分裂又能伸长，且伸长时细胞数量也增加。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:建构模型
  type: Concept
  subject: 生物
  title: 建构模型
  conceptType: 建模型
  masteryCriteria:
    - 能指出并纠正这一错误：认为模型必须与实物一模一样，忽略模型的简化与概括性。
    - 能指出并纠正这一错误：把建构模型等同于画图，以为只有物理模型或数学公式才算模型。
  aliases: []
  category: 科学方法
  explanation: 模型是对认识对象的一种简化的、概括性的描述，建构模型就是把认识的对象塑造成模型的过程。
  misconceptions:
    - 认为模型必须与实物一模一样，忽略模型的简化与概括性。
    - 把建构模型等同于画图，以为只有物理模型或数学公式才算模型。
    - 以为模型可以随意创建，不需要根据实验事实或科学原理。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:开放气道
  type: Concept
  subject: 生物
  title: 开放气道
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为开放气道就是让患者平躺并垫高枕头，反而阻塞气道
    - 能指出并纠正这一错误：以为仰头抬颏只需轻抬下巴，额头不后仰，气道未打开
  aliases:
    - 仰头抬颏法
  category: 急救技能
  explanation: 通过仰头抬颏法使呼吸道畅通，是心肺复苏的重要步骤。
  misconceptions:
    - 认为开放气道就是让患者平躺并垫高枕头，反而阻塞气道
    - 以为仰头抬颏只需轻抬下巴，额头不后仰，气道未打开
    - 开放气道前不检查口腔有无异物，直接吹气导致堵塞
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:归纳
  type: Concept
  subject: 生物
  title: 归纳
  conceptType: 推理型
  masteryCriteria:
    - 能指出并纠正这一错误：将归纳与演绎混淆，认为归纳是从一般性原理推出个别事实。
    - 能指出并纠正这一错误：以为归纳结论绝对正确，遇到反例也不肯修正。
  aliases: []
  category: 科学方法
  explanation: 归纳是指由一系列具体事实推出一般结论的思维方法。
  misconceptions:
    - 将归纳与演绎混淆，认为归纳是从一般性原理推出个别事实。
    - 以为归纳结论绝对正确，遇到反例也不肯修正。
    - 把归纳简单等同于总结，未体现从具体事实推出一般结论的过程。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:形成层
  type: Concept
  subject: 生物
  title: 形成层
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为形成层是树皮的一部分，位于木质部内
    - 能指出并纠正这一错误：认为形成层能运输水分和无机盐，实际负责分裂产生新细胞
  aliases: []
  category: 植物组织
  explanation: 属于分生组织，能不断分裂产生新细胞，使茎逐年长粗，嫁接时需紧密结合。
  misconceptions:
    - 误以为形成层是树皮的一部分，位于木质部内
    - 认为形成层能运输水分和无机盐，实际负责分裂产生新细胞
    - 认为所有植物茎中都有形成层，如草本植物也有
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:微生物
  type: Concept
  subject: 生物
  title: 微生物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为微生物都肉眼看不见，但蘑菇、木耳等大型真菌肉眼可见。
    - 能指出并纠正这一错误：误以为微生物就是细菌，忽略了真菌和病毒也是微生物。
  aliases:
    - microorganism
  category: 生物学概念
  explanation: 个体微小、结构简单的生物统称为微生物，主要包括细菌、真菌和病毒等。
  misconceptions:
    - 认为微生物都肉眼看不见，但蘑菇、木耳等大型真菌肉眼可见。
    - 误以为微生物就是细菌，忽略了真菌和病毒也是微生物。
    - 觉得所有微生物都是有害的，实际很多微生物有益，如发酵菌。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S1.md
- id: concept:生物:心理健康的核心
  type: Concept
  subject: 生物
  title: 心理健康的核心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为心理健康就是永远开心，不能有悲伤、愤怒等负面情绪
    - 能指出并纠正这一错误：把偶尔一次情绪低落直接判定为心理不健康，过度担忧
  aliases: []
  category: 心理健康
  explanation: 保持身心健康、心情愉快是儿童和青少年心理健康的核心，良好的情绪和适度的情绪反应表示身心处于积极健康状态。
  misconceptions:
    - 认为心理健康就是永远开心，不能有悲伤、愤怒等负面情绪
    - 把偶尔一次情绪低落直接判定为心理不健康，过度担忧
    - 觉得情绪反应越强烈越真实，不克制自己才是心理健康
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:心理咨询师
  type: Concept
  subject: 生物
  title: 心理咨询师
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为心理咨询师能开处方药，与精神科医生没有区别
    - 能指出并纠正这一错误：以为心理咨询师可以治愈所有心理疾病，包括严重精神分裂症
  aliases:
    - 心理医生
  category: 职业
  explanation: 心理咨询师是帮助人们缓解情绪、解决心理健康问题的专业人员，需要掌握心理学和医学知识，具备观察、理解、判断等能力。
  misconceptions:
    - 认为心理咨询师能开处方药，与精神科医生没有区别
    - 以为心理咨询师可以治愈所有心理疾病，包括严重精神分裂症
    - 认为心理咨询只需聊天，不需要掌握心理学和医学知识
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S2.md
- id: concept:生物:心肺复苏
  type: Concept
  subject: 生物
  title: 心肺复苏
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：先做人工呼吸再胸外按压，实际应先胸外按压30次再进行人工呼吸（C-A-B顺序）。
    - 能指出并纠正这一错误：胸外按压时位置偏左或偏下，应准确按压两乳头连线中点的胸骨中下段。
  aliases:
    - CPR
  category: 急救方法
  explanation: 心肺复苏是针对心跳呼吸骤停的患者采取的急救措施，包括胸外按压和人工呼吸等，以维持重要器官的血液供应。
  misconceptions:
    - 先做人工呼吸再胸外按压，实际应先胸外按压30次再进行人工呼吸（C-A-B顺序）。
    - 胸外按压时位置偏左或偏下，应准确按压两乳头连线中点的胸骨中下段。
    - 认为心肺复苏能救活心脏骤停者，实际只能维持基本血流，必须配合AED和120急救。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S5.md
- id: concept:生物:心脏工作过程
  type: Concept
  subject: 生物
  title: 心脏工作过程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为心脏四个腔同时收缩和舒张，实际心房和心室交替收缩，有先后顺序
    - 能指出并纠正这一错误：认为心脏每搏动一次，心房和心室各收缩一次，但顺序错误写成‘心室先收缩、心房后收缩’
  aliases:
    - 心动周期
  category: 生理学
  explanation: 一次心跳包括心房收缩、心室舒张和心室收缩等过程，瓣膜配合开闭，推动血液流动。
  misconceptions:
    - 认为心脏四个腔同时收缩和舒张，实际心房和心室交替收缩，有先后顺序
    - 认为心脏每搏动一次，心房和心室各收缩一次，但顺序错误写成‘心室先收缩、心房后收缩’
    - 认为瓣膜在整个心跳过程中都开放，实际瓣膜随压强变化开闭，防止血液倒流
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S3.md
- id: concept:生物:心脏的瓣膜
  type: Concept
  subject: 生物
  title: 心脏的瓣膜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把动脉瓣当成位于心房和心室之间，误以为房室瓣只存在于心室与动脉之间
    - 能指出并纠正这一错误：认为心脏瓣膜是单向阀门但会同时开放，实际是交替开闭防止倒流
  aliases: []
  category: 解剖学
  explanation: 心脏内有房室瓣和动脉瓣，防止血液倒流。
  misconceptions:
    - 把动脉瓣当成位于心房和心室之间，误以为房室瓣只存在于心室与动脉之间
    - 认为心脏瓣膜是单向阀门但会同时开放，实际是交替开闭防止倒流
    - 误以为瓣膜能主动收缩控制血流，实际是被动开合由血压决定
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S3.md
- id: concept:生物:心脏的结构
  type: Concept
  subject: 生物
  title: 心脏的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为左心房和右心房之间有孔相通，实际左右不相通，中间有间隔
    - 能指出并纠正这一错误：认为心脏四腔壁厚度相同，实际左心室壁最厚，因需将血泵向全身
  aliases: []
  category: 生物学概念
  explanation: 心脏主要由肌肉组织构成，有四个腔：左心房、左心室、右心房、右心室，左右不相通，上下相通。
  misconceptions:
    - 认为左心房和右心房之间有孔相通，实际左右不相通，中间有间隔
    - 认为心脏四腔壁厚度相同，实际左心室壁最厚，因需将血泵向全身
    - 误把心脏结构写成‘左心房连肺动脉、右心室连主动脉’，实际方向相反
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S3.md
- id: concept:生物:急救方法
  type: Concept
  subject: 生物
  title: 急救方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：心肺复苏时先人工呼吸后胸外按压，实际应先胸外按压30次再吹气2次
    - 能指出并纠正这一错误：动脉出血时在伤口远心端止血，如手指动脉出血要捆扎指根远离心脏一侧，实际应在近心端加压
  aliases:
    - 急救
  category: 健康素养
  explanation: 在突发疾病或意外伤害时采取的紧急处理措施，如心肺复苏、止血等。
  misconceptions:
    - 心肺复苏时先人工呼吸后胸外按压，实际应先胸外按压30次再吹气2次
    - 动脉出血时在伤口远心端止血，如手指动脉出血要捆扎指根远离心脏一侧，实际应在近心端加压
    - 认为溺水者必须先控水再心肺复苏，实际应立即进行心肺复苏，控水会延误急救
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:性别决定
  type: Concept
  subject: 生物
  title: 性别决定
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生男生女由母亲决定，实际上取决于父亲的精子带X还是Y
    - 能指出并纠正这一错误：认为所有生物的性别都由XX/XY决定，忽略ZW型和环境决定型
  aliases: []
  category: 遗传学概念
  explanation: 由性染色体决定，XX为女性，XY为男性。
  misconceptions:
    - 认为生男生女由母亲决定，实际上取决于父亲的精子带X还是Y
    - 认为所有生物的性别都由XX/XY决定，忽略ZW型和环境决定型
    - 认为性染色体只存在于生殖细胞，体细胞中没有
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:性染色体
  type: Concept
  subject: 生物
  title: 性染色体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为男性只有Y染色体，女性只有X染色体，忽略男性也有X
    - 能指出并纠正这一错误：认为性染色体上的所有基因都控制性别，实际上很多与性别无关
  aliases: []
  category: 遗传学概念
  explanation: 与性别决定有关的染色体，男性为XY，女性为XX。
  misconceptions:
    - 认为男性只有Y染色体，女性只有X染色体，忽略男性也有X
    - 认为性染色体上的所有基因都控制性别，实际上很多与性别无关
    - 认为一条X染色体一定来自母亲，实际上女儿的两条X分别来自父母
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:性状
  type: Concept
  subject: 生物
  title: 性状
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为性状只是外形特征，如颜色、大小，忽略血型也是性状
    - 能指出并纠正这一错误：误以为同一性状只能有一种表现，如高茎和矮茎是不同性状
  aliases:
    - 生物性状
  category: 生物学概念
  explanation: 性状是生物体形态结构、生理特征和行为方式等特征的总称，如黄瓜的苦味、颜色等。
  misconceptions:
    - 认为性状只是外形特征，如颜色、大小，忽略血型也是性状
    - 误以为同一性状只能有一种表现，如高茎和矮茎是不同性状
    - 认为基因就是性状，基因是控制因素，性状是表现
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:性腺
  type: Concept
  subject: 生物
  title: 性腺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为性腺就是生殖器官，不是内分泌腺
    - 能指出并纠正这一错误：认为性激素只促进生殖器官发育，不维持第二性征
  aliases: []
  category: 内分泌腺
  explanation: 包括睾丸和卵巢，分泌性激素，促进生殖器官发育和维持第二性征。
  misconceptions:
    - 认为性腺就是生殖器官，不是内分泌腺
    - 认为性激素只促进生殖器官发育，不维持第二性征
    - 认为男性睾丸只产生精子，不分泌激素
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:恒温动物与变温动物
  type: Concept
  subject: 生物
  title: 恒温动物与变温动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为恒温动物的体温永远保持不变，实际会有昼夜或季节小幅波动。
    - 能指出并纠正这一错误：误以为变温动物就是冷血动物且体温低，实际体温随环境变化，可能高于环境。
  aliases:
    - 恒温动物
    - 变温动物
  category: 生物学概念
  explanation: 恒温动物体温恒定，不随环境变化；变温动物体温随环境变化。鸟和哺乳动物是恒温动物，鱼、两栖动物和爬行动物是变温动物。
  misconceptions:
    - 认为恒温动物的体温永远保持不变，实际会有昼夜或季节小幅波动。
    - 误以为变温动物就是冷血动物且体温低，实际体温随环境变化，可能高于环境。
    - 把爬行动物归为恒温动物，实际上鱼、两栖和爬行动物都是变温动物。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:感受器
  type: Concept
  subject: 生物
  title: 感受器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把眼睛、耳朵等感觉器官当成感受器，忽略了视网膜、耳蜗等具体结构
    - 能指出并纠正这一错误：认为感受器能产生感觉，感觉在感受器处形成，实际在大脑皮层
  aliases: []
  category: 生物学概念
  explanation: 感受器是反射弧的起始部分，能够感受刺激并产生神经冲动。
  misconceptions:
    - 把眼睛、耳朵等感觉器官当成感受器，忽略了视网膜、耳蜗等具体结构
    - 认为感受器能产生感觉，感觉在感受器处形成，实际在大脑皮层
    - 将感受器放在反射弧末端，与效应器位置互换
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:扁形动物
  type: Concept
  subject: 生物
  title: 扁形动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为涡虫是线形动物，因为身体细长。
    - 能指出并纠正这一错误：认为扁形动物都有口有肛门，忽略了有口无肛门。
  aliases: []
  category: 生物类群
  explanation: 身体呈两侧对称，背腹扁平，有口无肛门，如涡虫、血吸虫。
  misconceptions:
    - 误以为涡虫是线形动物，因为身体细长。
    - 认为扁形动物都有口有肛门，忽略了有口无肛门。
    - 以为所有扁形动物都寄生生活，忘了涡虫自由生活。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:扦插
  type: Concept
  subject: 生物
  title: 扦插
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为扦插是嫁接的一种，因为都要用到枝条
    - 能指出并纠正这一错误：认为扦插时枝条倒插也能成活，因为根和芽都能生长
  aliases: []
  category: 无性生殖应用
  explanation: 剪取植物枝条插入土壤或水中，使其生根发芽长成新个体的繁殖方法。
  misconceptions:
    - 误以为扦插是嫁接的一种，因为都要用到枝条
    - 认为扦插时枝条倒插也能成活，因为根和芽都能生长
    - 认为扦插属于有性生殖，利用种子繁殖
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:抗体
  type: Concept
  subject: 生物
  title: 抗体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗体是疫苗，实际疫苗是抗原，刺激产生抗体。
    - 能指出并纠正这一错误：认为抗体能直接杀死病原体，实际是结合使其失去活性。
  aliases: []
  category: 生物学概念
  explanation: 人体免疫系统受抗原刺激后产生的专门抵抗病原体的蛋白质。
  misconceptions:
    - 认为抗体是疫苗，实际疫苗是抗原，刺激产生抗体。
    - 认为抗体能直接杀死病原体，实际是结合使其失去活性。
    - 认为抗体在体内终生存在，实际不同抗体存留时间不同。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:抗原
  type: Concept
  subject: 生物
  title: 抗原
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗原一定是病原体，忽略花粉、药物等异物也可作为抗原
    - 能指出并纠正这一错误：认为抗体是抗原，颠倒两者关系，误将抗体当作引起免疫反应的物质
  aliases: []
  category: 核心概念
  explanation: 能引起人体产生抗体的物质（如病原体、异物等）。
  misconceptions:
    - 认为抗原一定是病原体，忽略花粉、药物等异物也可作为抗原
    - 认为抗体是抗原，颠倒两者关系，误将抗体当作引起免疫反应的物质
    - 认为自身衰老细胞不是抗原，忽略异常细胞也能成为抗原
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:抗生素
  type: Concept
  subject: 生物
  title: 抗生素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗生素能治疗病毒性感冒，自行服用阿莫西林。
    - 能指出并纠正这一错误：把抗生素当成消炎药，哪里发炎都吃抗生素。
  aliases: []
  category: 医学常识
  explanation: 抗生素是由微生物或高等动植物在生活过程中所产生的具有抗病原体或其他活性的一类次级代谢产物，能干扰其他生活细胞的发育功能。用于治疗细菌感染等疾病。
  misconceptions:
    - 认为抗生素能治疗病毒性感冒，自行服用阿莫西林。
    - 把抗生素当成消炎药，哪里发炎都吃抗生素。
    - 认为抗生素可以随意联合使用，效果更强。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S5.md
- id: concept:生物:抗生素的产生
  type: Concept
  subject: 生物
  title: 抗生素的产生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抗生素能杀死病毒，所以可用来治疗感冒
    - 能指出并纠正这一错误：认为所有抗生素都由细菌产生，与真菌无关
  aliases: []
  category: 生物学概念
  explanation: 某些真菌产生的抗生素可用于治疗细菌感染。
  misconceptions:
    - 认为抗生素能杀死病毒，所以可用来治疗感冒
    - 认为所有抗生素都由细菌产生，与真菌无关
    - 认为青霉菌是细菌，因此抗生素来源于细菌
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:捕食关系
  type: Concept
  subject: 生物
  title: 捕食关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为捕食只发生在动物与动物之间，忽略动物吃植物（如羊吃草）也是捕食。
    - 能指出并纠正这一错误：将寄生当成捕食，如认为蛔虫在人体内吸营养是捕食。
  aliases:
    - 捕食
  category: 生态学
  explanation: 一种生物以另一种生物为食的关系，如蛇捕食田鼠。
  misconceptions:
    - 误认为捕食只发生在动物与动物之间，忽略动物吃植物（如羊吃草）也是捕食。
    - 将寄生当成捕食，如认为蛔虫在人体内吸营养是捕食。
    - 误认为捕食者一定比被捕食者大，如不认为小鸟吃昆虫是捕食。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:排尿的意义
  type: Concept
  subject: 生物
  title: 排尿的意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为排尿的唯一意义是排出废物，忽视它能调节水和无机盐的平衡。
    - 能指出并纠正这一错误：误认为排尿可以调节血糖浓度，实际上尿液不含葡萄糖。
  aliases: []
  category: 生理意义
  explanation: 排尿可以排出废物，调节体内水和无机盐的平衡，维持组织细胞的正常生理功能。
  misconceptions:
    - 认为排尿的唯一意义是排出废物，忽视它能调节水和无机盐的平衡。
    - 误认为排尿可以调节血糖浓度，实际上尿液不含葡萄糖。
    - 觉得排尿多少只与喝水量有关，不知道还受无机盐平衡调节。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:排泄
  type: Concept
  subject: 生物
  title: 排泄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把排便当作排泄，如认为排出食物残渣是排泄作用，实际排便排的是未消化食物，不属于代谢废物
    - 能指出并纠正这一错误：认为排泄只能通过泌尿系统，忽视皮肤和呼吸排出废物，如出汗和呼出二氧化碳也是排泄
  aliases:
    - 人体内废物的排出
  category: 生理过程
  explanation: 人体将代谢废物排出体外的过程，主要通过泌尿系统、皮肤和呼吸系统完成。
  misconceptions:
    - 把排便当作排泄，如认为排出食物残渣是排泄作用，实际排便排的是未消化食物，不属于代谢废物
    - 认为排泄只能通过泌尿系统，忽视皮肤和呼吸排出废物，如出汗和呼出二氧化碳也是排泄
    - 认为尿液中只含水、无机盐和尿素，忽略尿酸等其他代谢废物
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:排遗
  type: Concept
  subject: 生物
  title: 排遗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将排遗当作排泄，认为粪便排出也是排泄代谢废物。
    - 能指出并纠正这一错误：认为排遗排出的也是细胞产生的废物，实际是食物残渣。
  aliases: []
  category: 生理过程
  explanation: 粪便是由食物消化后的残渣形成的，它排出体外的过程叫做排遗。
  misconceptions:
    - 误将排遗当作排泄，认为粪便排出也是排泄代谢废物。
    - 认为排遗排出的也是细胞产生的废物，实际是食物残渣。
    - 说“人体的排泄途径包括排遗”，混淆了排泄与排遗的概念。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:探究实验的基本步骤
  type: Concept
  subject: 生物
  title: 探究实验的基本步骤
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：先做实验再制订计划，把实施计划放到制订计划之前。
    - 能指出并纠正这一错误：在提出问题前就作出假设，弄反了探究的起点。
  aliases:
    - 科学探究
  category: 科学方法
  explanation: 科学探究的一般过程包括提出问题、作出假设、制订计划、实施计划、得出结论、表达和交流。
  misconceptions:
    - 先做实验再制订计划，把实施计划放到制订计划之前。
    - 在提出问题前就作出假设，弄反了探究的起点。
    - 直接把作出的假设当成结论，没有用实验数据验证。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S3.md
- id: concept:生物:接种
  type: Concept
  subject: 生物
  title: 接种
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为接种就是把细菌倒进培养基，无需无菌操作
    - 能指出并纠正这一错误：以为接种就是培养细菌，在恒温箱中完成
  aliases: []
  category: 实验方法
  explanation: 将少量细菌或真菌转移到培养基上的过程。
  misconceptions:
    - 认为接种就是把细菌倒进培养基，无需无菌操作
    - 以为接种就是培养细菌，在恒温箱中完成
    - 认为接种无需在酒精灯火焰旁进行，可直接暴露在空气中
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S1.md
- id: concept:生物:接触传播
  type: Concept
  subject: 生物
  title: 接触传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为飞沫传播属于接触传播，如认为打喷嚏是接触传播。
    - 能指出并纠正这一错误：认为只有直接接触才传播，忽略接触污染物品的间接接触。
  aliases: []
  category: 生物学概念
  explanation: 病原体通过直接或间接接触污染的物品而传播的方式，如甲肝可通过共用碗筷传播。
  misconceptions:
    - 误认为飞沫传播属于接触传播，如认为打喷嚏是接触传播。
    - 认为只有直接接触才传播，忽略接触污染物品的间接接触。
    - 认为性传播属于接触传播，实际归属体液传播。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:控制传染源
  type: Concept
  subject: 生物
  title: 控制传染源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为对病人隔离是切断传播途径，实际是控制传染源。
    - 能指出并纠正这一错误：把消灭带菌动物当作切断传播途径，实际是控制传染源。
  aliases: []
  category: 预防措施
  explanation: 对传染源采取隔离、治疗等措施，减少病原体的传播。
  misconceptions:
    - 认为对病人隔离是切断传播途径，实际是控制传染源。
    - 把消灭带菌动物当作切断传播途径，实际是控制传染源。
    - 认为对健康人接种疫苗属于控制传染源，实际是保护易感人群。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:控制变量
  type: Concept
  subject: 生物
  title: 控制变量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：探究光照对鼠妇分布影响时，把湿度也设为不同，认为这样更科学，实际湿度是无关变量应保持相同。
    - 能指出并纠正这一错误：认为控制变量是让所有条件都不变，如研究温度对酶活性影响时把温度也固定，导致自变量不变。
  aliases:
    - 变量控制
  category: 科学方法
  explanation: 在实验中，除自变量外，其他条件保持相同，以排除无关变量的干扰。
  misconceptions:
    - 探究光照对鼠妇分布影响时，把湿度也设为不同，认为这样更科学，实际湿度是无关变量应保持相同。
    - 认为控制变量是让所有条件都不变，如研究温度对酶活性影响时把温度也固定，导致自变量不变。
    - 认为设置对照组就是控制变量，忽略实验组和对照组除了自变量外其他条件也要相同。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:推测
  type: Concept
  subject: 生物
  title: 推测
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为推测就是毫无根据的猜想，不需要证据支持
    - 能指出并纠正这一错误：认为通过推测得到的结论一定是事实，忽略推测需要验证
  aliases: []
  category: 科学方法
  explanation: 根据已知的事物，通过思维活动，对未知事物的真相提出一定的看法。科学的推测需要证据、严密逻辑和丰富联想。
  misconceptions:
    - 认为推测就是毫无根据的猜想，不需要证据支持
    - 认为通过推测得到的结论一定是事实，忽略推测需要验证
    - 看到化石就认为它一定是某种动物，其实只是推测
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:效应器
  type: Concept
  subject: 生物
  title: 效应器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把效应器只写成肌肉或腺体，遗漏了传出神经末梢这一组成
    - 能指出并纠正这一错误：将效应器当作反射弧的起始部分，认为它接受刺激产生神经冲动
  aliases: []
  category: 生物学概念
  explanation: 效应器由传出神经的神经末梢和它所支配的肌肉或腺体组成，对刺激作出反应。
  misconceptions:
    - 把效应器只写成肌肉或腺体，遗漏了传出神经末梢这一组成
    - 将效应器当作反射弧的起始部分，认为它接受刺激产生神经冲动
    - 误以为缩手反射的效应器是手上的皮肤感受器，功能搞反
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:旗舰种
  type: Concept
  subject: 生物
  title: 旗舰种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为旗舰种一定是濒危物种，如认为麻雀数量多，不能作为旗舰种，实际旗舰种关键在号召力。
    - 能指出并纠正这一错误：认为保护旗舰种只需保护该物种，如认为给大熊猫投喂竹子即可，不需保护其栖息地。
  aliases:
    - 伞护种
  category: 保护生物学概念
  explanation: 具有号召力、能引起公众关注的物种，保护旗舰种有助于保护其所在生态系统和生物多样性。
  misconceptions:
    - 认为旗舰种一定是濒危物种，如认为麻雀数量多，不能作为旗舰种，实际旗舰种关键在号召力。
    - 认为保护旗舰种只需保护该物种，如认为给大熊猫投喂竹子即可，不需保护其栖息地。
    - 把旗舰种当关键种，认为旗舰种在生态系统中不可替代，如认为失去金丝猴森林会崩溃，实际旗舰种未必是关键种。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:无偿献血制度
  type: Concept
  subject: 生物
  title: 无偿献血制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为献血会伤元气、影响健康，实际适量献血不影响正常生理功能
    - 能指出并纠正这一错误：认为未满18岁的健康青少年也可以献血，实际上我国规定需年满18周岁
  aliases:
    - 无偿献血
    - 献血
  category: 社会医学
  explanation: 我国实行无偿献血制度，提倡18-55周岁健康公民自愿献血。
  misconceptions:
    - 认为献血会伤元气、影响健康，实际适量献血不影响正常生理功能
    - 认为未满18岁的健康青少年也可以献血，实际上我国规定需年满18周岁
    - 认为任何健康公民都可以随时献血，忽略了年龄、体重、疾病等限制条件
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:无机物
  type: Concept
  subject: 生物
  title: 无机物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为无机物都不含碳，将二氧化碳、碳酸盐归为有机物。
    - 能指出并纠正这一错误：以为无机物就是水，忽略无机盐也是无机物。
  aliases: []
  category: 生物学概念
  explanation: 细胞中的一类物质，如水、无机盐等，一般不含碳元素。
  misconceptions:
    - 误以为无机物都不含碳，将二氧化碳、碳酸盐归为有机物。
    - 以为无机物就是水，忽略无机盐也是无机物。
    - 认为无机物都不能被细胞利用，其实无机盐也参与细胞构成。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:无脊椎动物
  type: Concept
  subject: 生物
  title: 无脊椎动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为无脊椎动物就是没有骨骼，把外骨骼排除在外。
    - 能指出并纠正这一错误：将鱼、蛙等有脊椎骨的动物误认为无脊椎动物，因为生活在水中。
  aliases: []
  category: 生物概念
  explanation: 体内没有由脊椎骨组成的脊柱的动物，如涡虫、水螅、蝗虫等。
  misconceptions:
    - 误以为无脊椎动物就是没有骨骼，把外骨骼排除在外。
    - 将鱼、蛙等有脊椎骨的动物误认为无脊椎动物，因为生活在水中。
    - 认为无脊椎动物都是身体柔软，如蜘蛛、螃蟹因有外骨骼被归为脊椎动物。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:昆虫的外骨骼
  type: Concept
  subject: 生物
  title: 昆虫的外骨骼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为外骨骼会随昆虫长大而逐渐长大，不需要蜕皮
    - 能指出并纠正这一错误：认为外骨骼仅起保护作用，与防止水分蒸发无关
  aliases:
    - 外骨骼
  category: 动物结构
  explanation: 昆虫的外骨骼具有保护和支持内部器官、防止体内水分蒸发的作用，但会限制昆虫的生长，因此昆虫需要蜕皮。
  misconceptions:
    - 认为外骨骼会随昆虫长大而逐渐长大，不需要蜕皮
    - 认为外骨骼仅起保护作用，与防止水分蒸发无关
    - 认为蜕皮只发生在幼虫变为成虫的变态发育过程中
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:易感人群
  type: Concept
  subject: 生物
  title: 易感人群
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为易感人群是已患病人群，实际是缺乏免疫力的人。
    - 能指出并纠正这一错误：认为接种疫苗后仍属于易感人群，实际已产生抗体不再易感。
  aliases: []
  category: 生物学概念
  explanation: 对某种传染病缺乏免疫力而容易感染该病的人群。
  misconceptions:
    - 误认为易感人群是已患病人群，实际是缺乏免疫力的人。
    - 认为接种疫苗后仍属于易感人群，实际已产生抗体不再易感。
    - 认为只有老年人和儿童是易感人群，健康成人也可能缺乏免疫力。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:显微镜的使用方法
  type: Concept
  subject: 生物
  title: 显微镜的使用方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：转换高倍镜后仍用粗准焦螺旋调焦，易压碎玻片。
    - 能指出并纠正这一错误：下降镜筒时眼睛注视目镜，应注视物镜与玻片距离。
  aliases: []
  category: 实验技能
  explanation: 包括对光调光、调焦观察等步骤，使用单目显微镜时需注意物镜与玻片的距离，转换高倍镜后不能用粗准焦螺旋调焦。
  misconceptions:
    - 转换高倍镜后仍用粗准焦螺旋调焦，易压碎玻片。
    - 下降镜筒时眼睛注视目镜，应注视物镜与玻片距离。
    - 光线较暗时用平面镜，应改用凹面镜增大亮度。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:显微镜的发展史
  type: Concept
  subject: 生物
  title: 显微镜的发展史
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为最早的显微镜是电子显微镜，实际是简单放大镜。
    - 能指出并纠正这一错误：以为电子显微镜放大倍数最高，忽略扫描隧道显微镜可观察原子。
  aliases:
    - 显微镜历史
  category: 科学史
  explanation: 从最早的简单显微镜到电子显微镜、激光扫描共聚焦显微镜和扫描隧道显微镜，显微镜技术不断进步。
  misconceptions:
    - 认为最早的显微镜是电子显微镜，实际是简单放大镜。
    - 以为电子显微镜放大倍数最高，忽略扫描隧道显微镜可观察原子。
    - 认为显微镜发展是直线进步，新式完全取代旧式，实际多种并存。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:显微镜的放大倍数
  type: Concept
  subject: 生物
  title: 显微镜的放大倍数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为放大倍数越大视野越亮，实际视野变暗。
    - 能指出并纠正这一错误：放大倍数越大看到的细胞数量越多，实际数量越少。
  aliases:
    - 放大倍数
  category: 概念
  explanation: 显微镜的放大倍数等于目镜与物镜放大倍数的乘积，放大倍数越大，物像越大，视野范围越小。
  misconceptions:
    - 认为放大倍数越大视野越亮，实际视野变暗。
    - 放大倍数越大看到的细胞数量越多，实际数量越少。
    - 将放大倍数理解为面积倍数，实际是长度倍数。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:显性基因
  type: Concept
  subject: 生物
  title: 显性基因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为显性基因总是有利的，显性性状是优势性状
    - 能指出并纠正这一错误：认为显性基因能完全掩盖隐性基因，且不允许隐性基因表达
  aliases: []
  category: 遗传学概念
  explanation: 控制显性性状的基因，通常用大写英文字母表示。
  misconceptions:
    - 认为显性基因总是有利的，显性性状是优势性状
    - 认为显性基因能完全掩盖隐性基因，且不允许隐性基因表达
    - 认为一个个体只有一个显性基因，其实一对等位基因可能两个都是显性
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:显性基因和隐性基因
  type: Concept
  subject: 生物
  title: 显性基因和隐性基因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为隐性基因在杂合子中不表达，所以它没有作用
    - 能指出并纠正这一错误：认为只要表现显性性状，个体就一定含显性基因，其实可能是有利的环境修饰
  aliases: []
  category: 遗传规律
  explanation: 显性基因控制显性性状，隐性基因控制隐性性状。
  misconceptions:
    - 认为隐性基因在杂合子中不表达，所以它没有作用
    - 认为只要表现显性性状，个体就一定含显性基因，其实可能是有利的环境修饰
    - 认为隐性基因控制的性状永远不出现，其实纯合子时能表现
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:显性性状
  type: Concept
  subject: 生物
  title: 显性性状
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为杂交后代中表现多的性状就是显性性状，实际需看纯种杂交子一代
    - 能指出并纠正这一错误：认为所有相对性状杂交后子一代都表现显性性状，忽视不完全显性
  aliases: []
  category: 遗传学概念
  explanation: 具有相对性状的两个纯种个体杂交时，子一代表现出的性状称为显性性状。
  misconceptions:
    - 认为杂交后代中表现多的性状就是显性性状，实际需看纯种杂交子一代
    - 认为所有相对性状杂交后子一代都表现显性性状，忽视不完全显性
    - 认为显性性状在后代中永远占多数，比例一定为3:1
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:显性性状和隐性性状
  type: Concept
  subject: 生物
  title: 显性性状和隐性性状
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为性状只有显性和隐性两种，忽视其他类型
    - 能指出并纠正这一错误：认为显性性状是常见的，隐性性状是罕见的，没有必然联系
  aliases: []
  category: 遗传规律
  explanation: 显性性状是由显性基因控制的性状，隐性性状是由隐性基因控制的性状。
  misconceptions:
    - 认为性状只有显性和隐性两种，忽视其他类型
    - 认为显性性状是常见的，隐性性状是罕见的，没有必然联系
    - 认为一对相对性状杂交后，显性个体一定是纯合子
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:月经
  type: Concept
  subject: 生物
  title: 月经
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为月经是卵子排出时引起的出血，排卵时就该来月经
    - 能指出并纠正这一错误：认为月经血是身体受伤或生病的表现
  aliases:
    - 例假
  category: 生理现象
  explanation: 女孩进入青春期后，子宫内膜周期性脱落出血，经阴道排出的现象。
  misconceptions:
    - 误以为月经是卵子排出时引起的出血，排卵时就该来月经
    - 认为月经血是身体受伤或生病的表现
    - 搞不清排卵时间，以为排卵发生在月经期间
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:有利变异
  type: Concept
  subject: 生物
  title: 有利变异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为有利变异是生物为适应环境主动产生的，如长颈鹿脖子变长。
    - 能指出并纠正这一错误：认为有利变异永远有利，如耐药菌无抗生素时优势丧失。
  aliases: []
  category: 生物学概念
  explanation: 有利于生物在生存斗争中生存下来的变异，自然选择会保留这些变异。
  misconceptions:
    - 认为有利变异是生物为适应环境主动产生的，如长颈鹿脖子变长。
    - 认为有利变异永远有利，如耐药菌无抗生素时优势丧失。
    - 认为有利变异一定使生物更高级，实际只是更适应特定环境。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S3.md
- id: concept:生物:有性生殖
  type: Concept
  subject: 生物
  title: 有性生殖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为有性生殖必须经过交配，如青蛙体外受精没有交配
    - 能指出并纠正这一错误：认为有性生殖的后代遗传物质与亲本完全一样，不会变异
  aliases:
    - sexual reproduction
  category: 生物学概念
  explanation: 由两性生殖细胞结合形成受精卵，再由受精卵发育成新个体的生殖方式。
  misconceptions:
    - 误以为有性生殖必须经过交配，如青蛙体外受精没有交配
    - 认为有性生殖的后代遗传物质与亲本完全一样，不会变异
    - 认为只有动物才有有性生殖，植物开花结果也有有性生殖
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:有性生殖的意义
  type: Concept
  subject: 生物
  title: 有性生殖的意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为有性生殖的后代与亲本完全相同，实际上后代具有双亲遗传物质而产生差异。
    - 能指出并纠正这一错误：误以为有性生殖只是增加个体数量，忽略其能增加遗传多样性以适应环境变化。
  aliases:
    - 有性生殖的意义
  category: 生物学概念
  explanation: 有性生殖产生的后代具有双亲的遗传物质，增加了遗传多样性，有利于生物在复杂多变的环境中生存和繁衍。
  misconceptions:
    - 认为有性生殖的后代与亲本完全相同，实际上后代具有双亲遗传物质而产生差异。
    - 误以为有性生殖只是增加个体数量，忽略其能增加遗传多样性以适应环境变化。
    - 将无性生殖的优势套用到有性生殖，认为在稳定环境中有性生殖更有利。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:有机物
  type: Concept
  subject: 生物
  title: 有机物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为含碳化合物都是有机物，将二氧化碳、碳酸钙当作有机物。
    - 能指出并纠正这一错误：认为所有有机物都能提供能量，忽略核酸不能氧化供能。
  aliases: []
  category: 生物学概念
  explanation: 细胞中的一类物质，如糖类、脂质、蛋白质和核酸等，含有碳元素，能为细胞提供能量。
  misconceptions:
    - 误以为含碳化合物都是有机物，将二氧化碳、碳酸钙当作有机物。
    - 认为所有有机物都能提供能量，忽略核酸不能氧化供能。
    - 把有机物等同于糖类或蛋白质，忽略脂质和核酸也属有机物。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:机械组织
  type: Concept
  subject: 生物
  title: 机械组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把机械组织与保护组织混淆，认为机械组织只分布在植物体表
    - 能指出并纠正这一错误：认为机械组织细胞壁薄，起不到支撑作用，与薄壁细胞混淆
  aliases:
    - 机械组织
  category: 生物学概念
  explanation: 茎、叶柄、叶片、花柄、果皮、种皮等处都有机械组织，细胞壁厚，对植物体主要起支撑和保护作用。
  misconceptions:
    - 把机械组织与保护组织混淆，认为机械组织只分布在植物体表
    - 认为机械组织细胞壁薄，起不到支撑作用，与薄壁细胞混淆
    - 把机械组织当成动物组织，认为肌肉就是机械组织
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S3.md
- id: concept:生物:杂交育种
  type: Concept
  subject: 生物
  title: 杂交育种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为杂交育种一定会得到同时具有亲本优良性状的后代，可能得不到
    - 能指出并纠正这一错误：认为杂交育种是基因突变产生新基因，实际上是基因重组
  aliases: []
  category: 育种方法
  explanation: 通过杂交将不同品种的优良性状组合在一起，培育出新品种的方法。
  misconceptions:
    - 认为杂交育种一定会得到同时具有亲本优良性状的后代，可能得不到
    - 认为杂交育种是基因突变产生新基因，实际上是基因重组
    - 认为杂交后无需筛选，直接获得新品种
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S5.md
- id: concept:生物:杂合子
  type: Concept
  subject: 生物
  title: 杂合子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为杂合子表现显性性状，所以隐性基因不遗传给后代
    - 能指出并纠正这一错误：认为杂合子自交后代全是杂合子，其实会出现纯合子
  aliases: []
  category: 遗传学概念
  explanation: 体细胞中成对的基因不同（如Dd）的个体称为杂合子。
  misconceptions:
    - 认为杂合子表现显性性状，所以隐性基因不遗传给后代
    - 认为杂合子自交后代全是杂合子，其实会出现纯合子
    - 认为只有Dd才是杂合子，其他不同字母如Aa也是
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:李时珍与《本草纲目》
  type: Concept
  subject: 生物
  title: 李时珍与《本草纲目》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为李时珍是东汉或唐朝人，与张仲景同时代
    - 能指出并纠正这一错误：认为《本草纲目》只是药物清单，没有纲目分类体系
  aliases:
    - 本草纲目
  category: 科学史
  explanation: 李时珍是明代医药学家，历时27年编成《本草纲目》，首创纲目体系分类药物，被誉为“东方药学巨典”。
  misconceptions:
    - 误认为李时珍是东汉或唐朝人，与张仲景同时代
    - 认为《本草纲目》只是药物清单，没有纲目分类体系
    - 将《本草纲目》与《伤寒杂病论》混淆，以为专论外感病
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:条件反射
  type: Concept
  subject: 生物
  title: 条件反射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把缩手反射、眨眼反射等生来就有的反射当成条件反射
    - 能指出并纠正这一错误：认为条件反射不需要大脑皮层参与，如望梅止渴只由脊髓控制
  aliases:
    - 复杂反射
  category: 生物学概念
  explanation: 条件反射是人出生后通过学习和训练形成的复杂反射，如望梅止渴、听到发令枪响起跑等。
  misconceptions:
    - 把缩手反射、眨眼反射等生来就有的反射当成条件反射
    - 认为条件反射不需要大脑皮层参与，如望梅止渴只由脊髓控制
    - 误以为所有由具体信号刺激引起的反射都是非条件反射
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:染色体
  type: Concept
  subject: 生物
  title: 染色体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为染色体是遗传物质，其实是DNA是遗传物质，染色体是载体
    - 能指出并纠正这一错误：认为一条染色体上有多个DNA分子，实际上只有一条
  aliases: []
  category: 细胞结构
  explanation: 细胞核中DNA与蛋白质结合形成的结构，一条染色体含有一个DNA分子。
  misconceptions:
    - 认为染色体是遗传物质，其实是DNA是遗传物质，染色体是载体
    - 认为一条染色体上有多个DNA分子，实际上只有一条
    - 认为细胞核中只有分裂时才有染色体，平时没有，其实是染色质状态
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S1.md
- id: concept:生物:根尖的结构
  type: Concept
  subject: 生物
  title: 根尖的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把根尖从上到下排列成成熟区、伸长区、分生区、根冠，颠倒了四区的顺序。
    - 能指出并纠正这一错误：认为根冠细胞具有分裂能力，成熟区是根尖分裂的主要部位。
  aliases:
    - 根尖
  category: 生物学概念
  explanation: 根尖从顶端到生有根毛的部分，包括根冠、分生区、伸长区和成熟区。
  misconceptions:
    - 把根尖从上到下排列成成熟区、伸长区、分生区、根冠，颠倒了四区的顺序。
    - 认为根冠细胞具有分裂能力，成熟区是根尖分裂的主要部位。
    - 把根尖说成是分生组织，忽略了它由多种组织构成的器官（根）的一部分。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:检索表
  type: Concept
  subject: 生物
  title: 检索表
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为检索表只能用于动物分类，不能用于植物
    - 能指出并纠正这一错误：使用检索表时不按顺序，直接跳到后面的特征进行比对
  aliases: []
  category: 分类工具
  explanation: 根据生物特征进行二分法分类的表格，用于鉴定生物类群。
  misconceptions:
    - 认为检索表只能用于动物分类，不能用于植物
    - 使用检索表时不按顺序，直接跳到后面的特征进行比对
    - 认为检索表中各特征同等重要，顺序可以任意颠倒
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:棘皮动物
  type: Concept
  subject: 生物
  title: 棘皮动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为海星属于刺胞动物，因为身体呈辐射对称。
    - 能指出并纠正这一错误：认为棘皮动物生活在淡水中，如海胆被当成淡水生物。
  aliases: []
  category: 生物类群
  explanation: 生活在海洋中，体表有棘，如海星、海胆。
  misconceptions:
    - 误以为海星属于刺胞动物，因为身体呈辐射对称。
    - 认为棘皮动物生活在淡水中，如海胆被当成淡水生物。
    - 把海参误认为环节动物，因为身体柔软且蠕动。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:森林生态系统
  type: Concept
  subject: 生物
  title: 森林生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为森林生态系统分布在干旱地区，实际上需要较湿润条件。
    - 能指出并纠正这一错误：误认为“地球之肺”是海洋生态系统，实际指森林生态系统。
  aliases: []
  category: 生态系统类型
  explanation: 分布在较湿润地区，动植物种类繁多，有“绿色水库”“地球之肺”之称。
  misconceptions:
    - 误认为森林生态系统分布在干旱地区，实际上需要较湿润条件。
    - 误认为“地球之肺”是海洋生态系统，实际指森林生态系统。
    - 误认为森林生态系统中动植物种类少，实际上种类繁多。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:植树节
  type: Concept
  subject: 生物
  title: 植树节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把植树节日期记成4月12日，还说是春天种树
    - 能指出并纠正这一错误：以为植树节是国家法定节假日，要求学校放假
  aliases: []
  category: 生态保护活动
  explanation: 我国将每年的3月12日定为植树节，号召全民参与植树造林。
  misconceptions:
    - 把植树节日期记成4月12日，还说是春天种树
    - 以为植树节是国家法定节假日，要求学校放假
    - 觉得植树节只种树就行，不考虑树苗能否成活
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:植株生长需要的无机盐
  type: Concept
  subject: 生物
  title: 植株生长需要的无机盐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物需求量最大的无机盐是钙，而不是含氮、磷、钾的无机盐。
    - 能指出并纠正这一错误：误把含钾无机盐的功能说成促进枝叶茂盛，含氮的促进果实发育。
  aliases:
    - 无机盐
  category: 生物学概念
  explanation: 植物生长需要多种无机盐，其中需要量最多的是含氮、磷、钾的无机盐。
  misconceptions:
    - 认为植物需求量最大的无机盐是钙，而不是含氮、磷、钾的无机盐。
    - 误把含钾无机盐的功能说成促进枝叶茂盛，含氮的促进果实发育。
    - 认为水生植物只需水分，不需要无机盐，其实任何植物生长都需要无机盐。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:植物为其他生物提供有机物和能量
  type: Concept
  subject: 生物
  title: 植物为其他生物提供有机物和能量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物从土壤中直接吸收有机物，施肥就是补有机物
    - 能指出并纠正这一错误：以为动物吃草只是获取无机盐，有机物被消化后排出
  aliases:
    - 植物提供有机物
  category: 生物学概念
  explanation: 植物通过光合作用制造的有机物，不仅满足自身需要，还为其他生物提供食物来源和构建身体的材料及能量。
  misconceptions:
    - 认为植物从土壤中直接吸收有机物，施肥就是补有机物
    - 以为动物吃草只是获取无机盐，有机物被消化后排出
    - 说植物光合作用制造的有机物全被自身呼吸消耗，动物吃不到
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:植物体结构层次
  type: Concept
  subject: 生物
  title: 植物体结构层次
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物体结构层次也有系统，写为细胞→组织→器官→系统→个体
    - 能指出并纠正这一错误：把一株桃树的根、茎、叶等器官误认为组织
  aliases: []
  category: 生物学概念
  explanation: 植物体结构层次为细胞→组织→器官→个体，没有系统。
  misconceptions:
    - 认为植物体结构层次也有系统，写为细胞→组织→器官→系统→个体
    - 把一株桃树的根、茎、叶等器官误认为组织
    - 忽略植物体结构层次中器官直接构成个体，没有系统
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S3.md
- id: concept:生物:植物分类依据
  type: Concept
  subject: 生物
  title: 植物分类依据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看根、茎、叶，不依据花、果实、种子来分类
    - 能指出并纠正这一错误：认为所有植物都有花和果实，因此分类时都以花为依据
  aliases: []
  category: 分类依据
  explanation: 对植物进行分类时，仔细观察形态结构，如根、茎、叶、花、果实、种子的特征，其中花、果实和种子是重要依据。
  misconceptions:
    - 只看根、茎、叶，不依据花、果实、种子来分类
    - 认为所有植物都有花和果实，因此分类时都以花为依据
    - 认为生活环境的差异是植物分类的主要依据
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:植物的分类
  type: Concept
  subject: 生物
  title: 植物的分类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蕨类植物能产生种子，属于种子植物
    - 能指出并纠正这一错误：认为裸子植物有果实，如松果是果实
  aliases: []
  category: 生物学概念
  explanation: 根据有无种子、花、果实等特征，将植物分为不同类群。
  misconceptions:
    - 认为蕨类植物能产生种子，属于种子植物
    - 认为裸子植物有果实，如松果是果实
    - 认为所有植物都能开花结果
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:植物细胞临时装片的制作
  type: Concept
  subject: 生物
  title: 植物细胞临时装片的制作
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：制作时先取材后滴清水，导致细胞失水变形。
    - 能指出并纠正这一错误：盖盖玻片时直接平放，产生大量气泡影响观察。
  aliases:
    - 临时装片制作
  category: 实验操作
  explanation: 制作临时装片的基本步骤包括擦片、滴液、取材、展平、盖片、染色等，用于观察植物细胞。
  misconceptions:
    - 制作时先取材后滴清水，导致细胞失水变形。
    - 盖盖玻片时直接平放，产生大量气泡影响观察。
    - 染色时把碘液滴在盖玻片中央，应滴在盖玻片一侧用吸水纸吸引。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:植物细胞的基本结构
  type: Concept
  subject: 生物
  title: 植物细胞的基本结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有植物细胞都有叶绿体，根尖细胞没有。
    - 能指出并纠正这一错误：将细胞壁说成能控制物质进出，实际这是细胞膜的功能。
  aliases:
    - 植物细胞结构
  category: 细胞生物学
  explanation: 植物细胞具有细胞壁、细胞膜、细胞质、细胞核等结构，某些细胞还有叶绿体等。
  misconceptions:
    - 误认为所有植物细胞都有叶绿体，根尖细胞没有。
    - 将细胞壁说成能控制物质进出，实际这是细胞膜的功能。
    - 把液泡中的细胞液当成细胞质的一部分，混淆结构层次。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:止血方法
  type: Concept
  subject: 生物
  title: 止血方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有出血都可用指压止血，包括毛细血管出血，不必要
    - 能指出并纠正这一错误：加压包扎时包扎过紧或过松，过紧导致肢体缺血坏死
  aliases:
    - 包扎止血
  category: 急救技能
  explanation: 包括指压止血、加压包扎止血等，适用于不同出血情况。
  misconceptions:
    - 认为所有出血都可用指压止血，包括毛细血管出血，不必要
    - 加压包扎时包扎过紧或过松，过紧导致肢体缺血坏死
    - 用止血带扎在伤口远心端，且持续扎紧不放松
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:毒品的危害
  type: Concept
  subject: 生物
  title: 毒品的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为冰毒、摇头丸等新型毒品偶尔玩一次不会上瘾
    - 能指出并纠正这一错误：把毒品危害只等同于身体损害，忽略其引发的违法犯罪行为
  aliases:
    - 吸毒危害
  category: 健康危害
  explanation: 毒品如摇头丸、冰毒、氯胺酮等会损害神经系统，降低免疫功能，具有成瘾性，并可能引发违法犯罪行为。
  misconceptions:
    - 认为冰毒、摇头丸等新型毒品偶尔玩一次不会上瘾
    - 把毒品危害只等同于身体损害，忽略其引发的违法犯罪行为
    - 觉得身强力壮的人吸毒也能扛得住，不会有大问题
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:比较法
  type: Concept
  subject: 生物
  title: 比较法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为比较法只能用于化石结构，不能用于基因和蛋白质序列的比较
    - 能指出并纠正这一错误：把比较法等同于分类法，只看相同点忽略差异，导致亲缘关系判断错误
  aliases:
    - 比较
  category: 科学方法
  explanation: 根据一定标准把彼此有联系的事物加以对比，找出内在联系、共同规律和本质的方法，常用于研究生物进化。
  misconceptions:
    - 认为比较法只能用于化石结构，不能用于基因和蛋白质序列的比较
    - 把比较法等同于分类法，只看相同点忽略差异，导致亲缘关系判断错误
    - 比较时只拿现生生物相比，忘记化石可以提供古生物比较信息
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:毛细血管
  type: Concept
  subject: 生物
  title: 毛细血管
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为毛细血管内流动的是动脉血，实际全身毛细血管中血液有动脉血也有静脉血
    - 能指出并纠正这一错误：认为毛细血管连接小动脉和小动脉，实际连接最小动脉和最小静脉
  aliases:
    - capillary
  category: 生物学概念
  explanation: 毛细血管是连通最小动脉和最小静脉的血管，管壁极薄、内径小、血流速度最慢，便于物质交换。
  misconceptions:
    - 认为毛细血管内流动的是动脉血，实际全身毛细血管中血液有动脉血也有静脉血
    - 认为毛细血管连接小动脉和小动脉，实际连接最小动脉和最小静脉
    - 认为毛细血管管壁厚、血流速度快，实际管壁极薄、血流速度最慢，便于物质交换
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S2.md
- id: concept:生物:毛细血管出血
  type: Concept
  subject: 生物
  title: 毛细血管出血
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为毛细血管出血呈鲜红色喷涌而出，误当成动脉出血
    - 能指出并纠正这一错误：认为毛细血管出血必须用止血带才能止住，过度处理
  aliases: []
  category: 医学常识
  explanation: 最常见的外出血，血液呈红色，从伤口渗出，一般能自行凝固止血。
  misconceptions:
    - 认为毛细血管出血呈鲜红色喷涌而出，误当成动脉出血
    - 认为毛细血管出血必须用止血带才能止住，过度处理
    - 以为毛细血管出血颜色暗红、流速缓慢，与静脉出血混为一谈
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:气囊辅助呼吸
  type: Concept
  subject: 生物
  title: 气囊辅助呼吸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为气囊能进行气体交换，是鸟类呼吸的主要器官
    - 能指出并纠正这一错误：以为呼气时气囊中的气体直接排出，不经过肺进行交换
  aliases:
    - 气囊
  category: 生物学概念
  explanation: 鸟类的气囊与肺相通，吸气呼气时肺内均有富含氧气的空气，提高气体交换效率。
  misconceptions:
    - 认为气囊能进行气体交换，是鸟类呼吸的主要器官
    - 以为呼气时气囊中的气体直接排出，不经过肺进行交换
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:气生菌丝
  type: Concept
  subject: 生物
  title: 气生菌丝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为气生菌丝可吸收空气中的营养物质，用于自身生长
    - 能指出并纠正这一错误：以为气生菌丝像根一样深入土壤，吸收水和无机盐
  aliases: []
  category: 生物概念
  explanation: 气生菌丝是霉菌等真菌中向空气中生长的菌丝，顶端可产生孢子。
  misconceptions:
    - 认为气生菌丝可吸收空气中的营养物质，用于自身生长
    - 以为气生菌丝像根一样深入土壤，吸收水和无机盐
    - 将气生菌丝与营养菌丝功能混淆，认为两者都吸收营养
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:水华
  type: Concept
  subject: 生物
  title: 水华
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水华只发生在海洋，把海洋中的赤潮误称为水华
    - 能指出并纠正这一错误：认为水华是鱼类大量繁殖引起，实际是蓝细菌和藻类暴发
  aliases:
    - 藻华
  category: 生态学
  explanation: 水体富营养化导致蓝细菌和藻类大量繁殖的现象，危害水生生态系统。
  misconceptions:
    - 认为水华只发生在海洋，把海洋中的赤潮误称为水华
    - 认为水华是鱼类大量繁殖引起，实际是蓝细菌和藻类暴发
    - 认为水华使水体溶氧增加，实际藻类死亡后分解消耗大量氧气
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:水和无机盐
  type: Concept
  subject: 生物
  title: 水和无机盐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物靠叶片吸收水分和无机盐，实际主要靠根尖成熟区吸收
    - 能指出并纠正这一错误：误认为无机盐是光合作用的产物，实际由根从土壤中吸收
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 认为植物靠叶片吸收水分和无机盐，实际主要靠根尖成熟区吸收
    - 误认为无机盐是光合作用的产物，实际由根从土壤中吸收
    - 认为施肥越多越好，忽略浓度过高导致烧苗或根部失水
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:水圈
  type: Concept
  subject: 生物
  title: 水圈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为水圈只包括海洋，忽略河流、湖泊和地下水。
    - 能指出并纠正这一错误：误认为生物圈只包含部分水圈，实际包含整个水圈。
  aliases: []
  category: 生物学概念
  explanation: 水圈是地球表层由水和冰雪所占有或覆盖的圈层，包括大气水、地表水和地下水，生物圈包括整个水圈。
  misconceptions:
    - 误认为水圈只包括海洋，忽略河流、湖泊和地下水。
    - 误认为生物圈只包含部分水圈，实际包含整个水圈。
    - 误认为水圈中的水都是液态，忽略冰雪和大气水。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:水土流失
  type: Concept
  subject: 生物
  title: 水土流失
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把水土流失仅归因于降水太多，忽视毁林毁草开荒才是主要人为原因。
    - 能指出并纠正这一错误：认为水土流失只发生在陡坡山区，平原耕地不会发生。
  aliases: []
  category: 生态环境问题
  explanation: 因毁林毁草开荒和陡坡种粮等原因，导致土壤被水流冲刷流失，造成江河湖库泥沙淤积、洪涝灾害等问题。
  misconceptions:
    - 把水土流失仅归因于降水太多，忽视毁林毁草开荒才是主要人为原因。
    - 认为水土流失只发生在陡坡山区，平原耕地不会发生。
    - 以为植树造林后水土流失马上就为零，忽略植被恢复需要时间。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:汗腺
  type: Concept
  subject: 生物
  title: 汗腺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为汗液只含水和无机盐，不含尿素，实际上汗液含少量尿素。
    - 能指出并纠正这一错误：将汗腺当成内分泌腺，认为汗液中含有激素，实际上汗腺是外分泌腺。
  aliases: []
  category: 解剖学
  explanation: 汗腺分布于皮肤，分泌汗液，主要成分是水，还有少量尿素和无机盐，参与排泄。
  misconceptions:
    - 认为汗液只含水和无机盐，不含尿素，实际上汗液含少量尿素。
    - 将汗腺当成内分泌腺，认为汗液中含有激素，实际上汗腺是外分泌腺。
    - 认为肾功能衰竭患者可以靠大量出汗排出体内废物，而无需透析。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:汤飞凡
  type: Concept
  subject: 生物
  title: 汤飞凡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将汤飞凡误认为细菌学家或医学家，忽略其病毒学家的身份
    - 能指出并纠正这一错误：认为汤飞凡是外国人，误以为沙眼衣原体由外国科学家发现
  aliases: []
  category: 核心概念
  explanation: 我国第一代病毒学家，免疫学奠基者，成功分离出沙眼衣原体，被誉为“中国疫苗之父”。
  misconceptions:
    - 将汤飞凡误认为细菌学家或医学家，忽略其病毒学家的身份
    - 认为汤飞凡是外国人，误以为沙眼衣原体由外国科学家发现
    - 将汤飞凡誉为‘疫苗之父’时，忽略其真正贡献是分离沙眼衣原体
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:沉迷手机的危害
  type: Concept
  subject: 生物
  title: 沉迷手机的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为玩手机最多伤眼睛，不会导致抑郁症、焦虑症等疾病
    - 能指出并纠正这一错误：觉得每天玩几个小时不算沉迷，只有整天玩才算
  aliases:
    - 手机依赖
  category: 健康危害
  explanation: 沉迷手机会导致身体免疫力低下，甚至引发精神障碍如抑郁症、焦虑症等。
  misconceptions:
    - 认为玩手机最多伤眼睛，不会导致抑郁症、焦虑症等疾病
    - 觉得每天玩几个小时不算沉迷，只有整天玩才算
    - 把用手机学习也当成沉迷，完全排斥手机的使用
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:沙眼衣原体
  type: Concept
  subject: 生物
  title: 沙眼衣原体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为沙眼衣原体是病毒，忽略其具有细胞结构
    - 能指出并纠正这一错误：认为沙眼衣原体是细菌，但与常见细菌的细胞壁成分不同，混淆微生物分类
  aliases:
    - 沙眼病毒
  category: 核心概念
  explanation: 引起沙眼的病原体，是一种介于细菌和病毒之间的微生物，由汤飞凡等人分离发现。
  misconceptions:
    - 认为沙眼衣原体是病毒，忽略其具有细胞结构
    - 认为沙眼衣原体是细菌，但与常见细菌的细胞壁成分不同，混淆微生物分类
    - 认为沙眼衣原体只引起沙眼，忽略其可感染泌尿生殖道等部位
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:泌尿系统的组成
  type: Concept
  subject: 生物
  title: 泌尿系统的组成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为膀胱可形成尿液，实际膀胱仅暂时储存尿液。
    - 能指出并纠正这一错误：将输尿管和尿道功能颠倒，输尿管输送尿液入膀胱，尿道排出体外。
  aliases: []
  category: 器官系统
  explanation: 泌尿系统由肾脏、输尿管、膀胱和尿道组成，分别负责形成尿液、输送尿液、暂时储存尿液和排出尿液。
  misconceptions:
    - 误认为膀胱可形成尿液，实际膀胱仅暂时储存尿液。
    - 将输尿管和尿道功能颠倒，输尿管输送尿液入膀胱，尿道排出体外。
    - 认为泌尿系统由肾脏、输尿管、膀胱、尿道和肾单位组成，混淆系统与结构层次。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:测定食物中的能量
  type: Concept
  subject: 生物
  title: 测定食物中的能量
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：测定能量时只做一次实验，不设置重复组就得出结论
    - 能指出并纠正这一错误：认为水温升高的度数可直接换算为食物全部能量，忽略热量损失
  aliases: []
  category: 实验方法
  explanation: 通过测量食物燃烧释放热量来测定食物中的能量，需设置重复组以减少误差。
  misconceptions:
    - 测定能量时只做一次实验，不设置重复组就得出结论
    - 认为水温升高的度数可直接换算为食物全部能量，忽略热量损失
    - 通过观察食物营养成分表判断能量，不做燃烧实验
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S1.md
- id: concept:生物:海洋生态系统
  type: Concept
  subject: 生物
  title: 海洋生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为海洋生态系统只分布在海洋表层，忽略深海也有生物。
    - 能指出并纠正这一错误：误认为海洋生态系统动物种类少，实际动物种类多。
  aliases: []
  category: 生态系统类型
  explanation: 有丰富的藻类资源，动物种类多，能吸收大量二氧化碳并制造大量氧气。
  misconceptions:
    - 误认为海洋生态系统只分布在海洋表层，忽略深海也有生物。
    - 误认为海洋生态系统动物种类少，实际动物种类多。
    - 误认为海洋生态系统不产生氧气，实际上产生大量氧气。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:消化
  type: Concept
  subject: 生物
  title: 消化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把牙齿咀嚼、胆汁乳化脂肪归为化学性消化
    - 能指出并纠正这一错误：认为唾液淀粉酶把淀粉消化成葡萄糖，实际是麦芽糖
  aliases: []
  category: 人体生理
  explanation: 食物的消化包括物理性消化（切断、磨碎、混合）和化学性消化（消化酶分解大分子有机物为小分子）。
  misconceptions:
    - 把牙齿咀嚼、胆汁乳化脂肪归为化学性消化
    - 认为唾液淀粉酶把淀粉消化成葡萄糖，实际是麦芽糖
    - 认为消化就是吸收，食物在口腔里已被直接吸收
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:消化和吸收
  type: Concept
  subject: 生物
  title: 消化和吸收
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人在胃里就能完成绝大部分消化和吸收，实际小肠才是主要消化吸收场所，如馒头主要在小肠消化
    - 能指出并纠正这一错误：混淆消化和吸收，认为淀粉在口腔分解为葡萄糖，实际口腔只把淀粉分解为麦芽糖，葡萄糖在小肠形成
  aliases:
    - 消化吸收
  category: 生理过程
  explanation: 人体通过消化系统将食物分解为可吸收的小分子物质，并吸收进入血液循环的过程。
  misconceptions:
    - 认为人在胃里就能完成绝大部分消化和吸收，实际小肠才是主要消化吸收场所，如馒头主要在小肠消化
    - 混淆消化和吸收，认为淀粉在口腔分解为葡萄糖，实际口腔只把淀粉分解为麦芽糖，葡萄糖在小肠形成
    - 认为胃壁能吸收大量水分和酒精，实际胃只能吸收少量水和酒精，大部分水在小肠和大肠吸收
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:消化系统
  type: Concept
  subject: 生物
  title: 消化系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为消化系统只指消化道，不包括肝脏、唾液腺等消化腺
    - 能指出并纠正这一错误：说肝脏在消化道里，将消化腺当消化道组成部分
  aliases: []
  category: 人体生理
  explanation: 消化系统由消化道和消化腺组成，负责食物的消化和营养物质的吸收。
  misconceptions:
    - 认为消化系统只指消化道，不包括肝脏、唾液腺等消化腺
    - 说肝脏在消化道里，将消化腺当消化道组成部分
    - 误以为食物主要在小肠被消化，吸收则主要在胃
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:消化腺
  type: Concept
  subject: 生物
  title: 消化腺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为胆汁含有消化酶，能直接消化脂肪
    - 能指出并纠正这一错误：误以为肝脏不属于消化腺，因为不在消化道内
  aliases: []
  category: 生物学概念
  explanation: 消化腺包括唾液腺、肝、胰等器官以及消化道壁内的小腺体，分泌消化液帮助消化。
  misconceptions:
    - 认为胆汁含有消化酶，能直接消化脂肪
    - 误以为肝脏不属于消化腺，因为不在消化道内
    - 混淆胰腺的内外分泌功能，将胰液和胰岛素都当作消化液
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:消化道
  type: Concept
  subject: 生物
  title: 消化道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为肝脏、胰腺属于消化道，实际是消化腺，不参与食物通道。
    - 能指出并纠正这一错误：误认为咽只属于呼吸道，实际咽是消化道和呼吸道的共同通道。
  aliases:
    - 消化管
  category: 生物学概念
  explanation: 消化道包括口腔、咽、食管、胃、小肠、大肠、肛门等器官，是食物通过的通道。
  misconceptions:
    - 误认为肝脏、胰腺属于消化道，实际是消化腺，不参与食物通道。
    - 误认为咽只属于呼吸道，实际咽是消化道和呼吸道的共同通道。
    - 误认为食物经胃直接进入大肠，跳过小肠，实际须先到小肠消化吸收。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:消化道传播
  type: Concept
  subject: 生物
  title: 消化道传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为乙肝通过消化道传播，实际乙肝经血液和体液传播。
    - 能指出并纠正这一错误：认为所有经口进入的传染病都是消化道传播，忽略其他途径。
  aliases:
    - 粪-口传播
  category: 生物学概念
  explanation: 病原体污染食物、水源，经口进入消化道而感染的方式，如霍乱、伤寒等。
  misconceptions:
    - 误认为乙肝通过消化道传播，实际乙肝经血液和体液传播。
    - 认为所有经口进入的传染病都是消化道传播，忽略其他途径。
    - 认为消化道传播仅通过食物，忽略水源污染。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:消费者
  type: Concept
  subject: 生物
  title: 消费者
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为消费者一定是动物，忽视菟丝子等寄生植物也是消费者
    - 能指出并纠正这一错误：误以为消费者都以植物为食，忽视肉食和杂食动物
  aliases:
    - consumer
  category: 生态学概念
  explanation: 动物不能自己制造有机物，直接或间接以植物为食，称为消费者。
  misconceptions:
    - 认为消费者一定是动物，忽视菟丝子等寄生植物也是消费者
    - 误以为消费者都以植物为食，忽视肉食和杂食动物
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:液泡
  type: Concept
  subject: 生物
  title: 液泡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有植物细胞都有大液泡，根尖分生区细胞无液泡。
    - 能指出并纠正这一错误：以为液泡内的细胞液只含水，忽略其中溶解糖分、色素等。
  aliases: []
  category: 生物学概念
  explanation: 植物细胞细胞质中的结构，内含细胞液，溶解有多种物质。
  misconceptions:
    - 误认为所有植物细胞都有大液泡，根尖分生区细胞无液泡。
    - 以为液泡内的细胞液只含水，忽略其中溶解糖分、色素等。
    - 错画动物细胞有液泡，混淆动植物细胞结构差异。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:淀粉的消化
  type: Concept
  subject: 生物
  title: 淀粉的消化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为淀粉在口腔中直接分解为葡萄糖，实际在唾液淀粉酶作用下分解为麦芽糖。
    - 能指出并纠正这一错误：误认为淀粉在胃中开始消化，实际胃液无淀粉酶，淀粉仅在口腔和小肠被消化。
  aliases:
    - 淀粉分解
  category: 生物学概念
  explanation: 淀粉是馒头或米饭的主要成分，无甜味，在口腔中经唾液淀粉酶作用分解为麦芽糖，麦芽糖有甜味。
  misconceptions:
    - 误认为淀粉在口腔中直接分解为葡萄糖，实际在唾液淀粉酶作用下分解为麦芽糖。
    - 误认为淀粉在胃中开始消化，实际胃液无淀粉酶，淀粉仅在口腔和小肠被消化。
    - 误认为馒头嚼出甜味是馒头本身含糖，实际是淀粉被分解产生麦芽糖所致。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:淀粉遇碘变蓝
  type: Concept
  subject: 生物
  title: 淀粉遇碘变蓝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为麦芽糖遇碘也变蓝，实际只有淀粉遇碘变蓝，麦芽糖不变色。
    - 能指出并纠正这一错误：误认为碘液能检测所有有机物，实际只能用于检测淀粉，不能检测蛋白质、脂肪等。
  aliases:
    - 碘液检测淀粉
  category: 实验原理
  explanation: 淀粉遇碘液变蓝，麦芽糖遇碘不变蓝，用于检测淀粉是否被分解。
  misconceptions:
    - 误认为麦芽糖遇碘也变蓝，实际只有淀粉遇碘变蓝，麦芽糖不变色。
    - 误认为碘液能检测所有有机物，实际只能用于检测淀粉，不能检测蛋白质、脂肪等。
    - 误认为变蓝说明含有葡萄糖，实际是淀粉遇碘变蓝，与葡萄糖无关。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:淋巴细胞
  type: Concept
  subject: 生物
  title: 淋巴细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有淋巴细胞都能直接产生抗体，忽略需受抗原刺激分化
    - 能指出并纠正这一错误：认为T细胞也产生抗体，混淆淋巴细胞分工
  aliases: []
  category: 免疫细胞
  explanation: 一种白细胞，受抗原刺激后可产生抗体。
  misconceptions:
    - 认为所有淋巴细胞都能直接产生抗体，忽略需受抗原刺激分化
    - 认为T细胞也产生抗体，混淆淋巴细胞分工
    - 认为淋巴细胞是红细胞的一种，因为都来自血液
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:淡水生态系统
  type: Concept
  subject: 生物
  title: 淡水生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为淡水生态系统仅包括河流和湖泊，忽略池塘、溪流等。
    - 能指出并纠正这一错误：误认为淡水生态系统没有调节气候的功能，实际有。
  aliases: []
  category: 生态系统类型
  explanation: 包括河流、湖泊、池塘等生态系统，由淡水水体和其中的生物组成，提供水源并调节气候。
  misconceptions:
    - 误认为淡水生态系统仅包括河流和湖泊，忽略池塘、溪流等。
    - 误认为淡水生态系统没有调节气候的功能，实际有。
    - 误认为淡水生态系统中的生物种类单一，实际多种多样。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:清洁能源
  type: Concept
  subject: 生物
  title: 清洁能源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为煤经过脱硫后就无污染，算清洁能源，实际仍排放二氧化碳和粉尘
    - 能指出并纠正这一错误：认为核能是清洁能源，不排放污染物，但核废料有放射性污染
  aliases:
    - 绿色能源
  category: 能源
  explanation: 不排放污染物的能源，如太阳能、风能等，有助于减少环境污染。
  misconceptions:
    - 认为煤经过脱硫后就无污染，算清洁能源，实际仍排放二氧化碳和粉尘
    - 认为核能是清洁能源，不排放污染物，但核废料有放射性污染
    - 认为风能、太阳能完全无环境影响，忽略制造和回收中的污染
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:温室效应
  type: Concept
  subject: 生物
  title: 温室效应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为温室效应是温室气体阻挡太阳光进入地球，导致地球变冷
    - 能指出并纠正这一错误：觉得温室效应完全是人为造成的，没有温室效应地球会更热
  aliases: []
  category: 环境科学
  explanation: 温室效应是指大气中的二氧化碳等温室气体允许阳光透射并截留地表热量，使地球保持相对稳定气温的现象。
  misconceptions:
    - 认为温室效应是温室气体阻挡太阳光进入地球，导致地球变冷
    - 觉得温室效应完全是人为造成的，没有温室效应地球会更热
    - 把温室效应等同于全球变暖，认为温室效应本身就是环境问题
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:湿地生态系统
  type: Concept
  subject: 生物
  title: 湿地生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为湿地生态系统就是沼泽，忽略其他类型如滩涂、红树林。
    - 能指出并纠正这一错误：误认为湿地生态系统对生态环境没有重要作用。
  aliases: []
  category: 生态系统类型
  explanation: 课文提及湿地生态系统是多种多样的生态系统之一，但未详细描述。
  misconceptions:
    - 误认为湿地生态系统就是沼泽，忽略其他类型如滩涂、红树林。
    - 误认为湿地生态系统对生态环境没有重要作用。
    - 误认为湿地生态系统属于陆地生态系统，忽略其水陆过渡特征。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:溶菌酶
  type: Concept
  subject: 生物
  title: 溶菌酶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为溶菌酶能杀死病毒，误以为对一切病菌有效
    - 能指出并纠正这一错误：认为溶菌酶是免疫细胞分泌的抗体，混淆概念
  aliases: []
  category: 免疫物质
  explanation: 一种能破坏多种病菌细胞壁的酶，具有抗菌、消炎作用。
  misconceptions:
    - 认为溶菌酶能杀死病毒，误以为对一切病菌有效
    - 认为溶菌酶是免疫细胞分泌的抗体，混淆概念
    - 认为溶菌酶只存在于唾液中，忽略泪液、乳汁等
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:溺水自救
  type: Concept
  subject: 生物
  title: 溺水自救
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：溺水时拼命挣扎呼救，反而加速下沉，应保持冷静仰面漂浮。
    - 能指出并纠正这一错误：认为必须仰头才能保持呼吸，实际应全身放松、身体后仰，使口鼻自然露出水面。
  aliases: []
  category: 急救技能
  explanation: 溺水时保持冷静，屏住呼吸，放松身体，采取仰面姿势使口鼻露出水面，并抓住漂浮物。
  misconceptions:
    - 溺水时拼命挣扎呼救，反而加速下沉，应保持冷静仰面漂浮。
    - 认为必须仰头才能保持呼吸，实际应全身放松、身体后仰，使口鼻自然露出水面。
    - 抓住漂浮物后用力拉扯，导致体力耗尽或拉扯物翻转，应轻轻扶抓。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:滑液
  type: Concept
  subject: 生物
  title: 滑液
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为滑液由关节软骨分泌，实际由滑膜分泌。
    - 能指出并纠正这一错误：误以为滑液的作用是增大摩擦，防止骨滑脱。
  aliases: []
  category: 生物学概念
  explanation: 滑液是关节腔内的液体，能减少骨与骨之间的摩擦。
  misconceptions:
    - 认为滑液由关节软骨分泌，实际由滑膜分泌。
    - 误以为滑液的作用是增大摩擦，防止骨滑脱。
    - 将滑液与血液混淆，认为滑液含大量红细胞。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:激素
  type: Concept
  subject: 生物
  title: 激素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把激素当成酶，认为激素能催化化学反应
    - 能指出并纠正这一错误：认为蛋白质类激素可以口服，不会被消化
  aliases:
    - hormone
  category: 生物学概念
  explanation: 由内分泌腺或内分泌细胞产生的、对机体代谢和生理功能发挥调节作用的化学物质。
  misconceptions:
    - 把激素当成酶，认为激素能催化化学反应
    - 认为蛋白质类激素可以口服，不会被消化
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:激素调节
  type: Concept
  subject: 生物
  title: 激素调节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为激素调节是通过导管运输的，实际激素直接进入体液（血液）运输
    - 能指出并纠正这一错误：认为所有激素都作用于全身所有细胞，实际只作用于靶细胞
  aliases:
    - 体液调节
  category: 生理学
  explanation: 激素调节是内分泌腺分泌的激素通过体液运输作用于靶细胞，调节生命活动的过程。
  misconceptions:
    - 认为激素调节是通过导管运输的，实际激素直接进入体液（血液）运输
    - 认为所有激素都作用于全身所有细胞，实际只作用于靶细胞
    - 把激素调节与神经调节的速度混淆，激素调节速度较慢
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:激素调节与神经调节的关系
  type: Concept
  subject: 生物
  title: 激素调节与神经调节的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人体生命活动只受激素调节
    - 能指出并纠正这一错误：认为神经调节和激素调节二者互不联系
  aliases: []
  category: 生理调节
  explanation: 人体生命活动主要受神经调节，也受激素调节，二者相互配合、相互影响。
  misconceptions:
    - 认为人体生命活动只受激素调节
    - 认为神经调节和激素调节二者互不联系
    - 认为激素调节比神经调节更重要
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:爬行动物与人类生活的关系
  type: Concept
  subject: 生物
  title: 爬行动物与人类生活的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蛇都有毒，对人类有害，应全部消灭
    - 能指出并纠正这一错误：把鳖和龟混为一谈，认为鳖就是龟，可任意食用
  aliases: []
  category: 生物学应用
  explanation: 爬行动物如蛇能控制鼠害，鳖可食用和药用，避役能捕食害虫。
  misconceptions:
    - 认为蛇都有毒，对人类有害，应全部消灭
    - 把鳖和龟混为一谈，认为鳖就是龟，可任意食用
    - 误以为避役生活在水中，是两栖动物
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:爬行动物的主要特征
  type: Concept
  subject: 生物
  title: 爬行动物的主要特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为爬行动物体表湿润，需要皮肤辅助呼吸，像青蛙一样
    - 能指出并纠正这一错误：以为爬行动物体温恒定，属于恒温动物
  aliases:
    - 爬行动物特征
  category: 生物学概念
  explanation: 爬行动物体表覆盖角质的鳞片或甲，用肺呼吸，大多数种类在陆地上产卵，卵表面有坚韧的卵壳。
  misconceptions:
    - 认为爬行动物体表湿润，需要皮肤辅助呼吸，像青蛙一样
    - 以为爬行动物体温恒定，属于恒温动物
    - 认为爬行动物在水中产卵，像两栖动物一样
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:爬行动物的卵
  type: Concept
  subject: 生物
  title: 爬行动物的卵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为爬行动物的卵必须在水中发育，忽略其卵有卵壳和卵壳膜可适应陆地繁殖。
    - 能指出并纠正这一错误：认为爬行动物的卵与鸟卵完全一样，且都有坚硬卵壳，实际上爬行动物卵壳多柔软。
  aliases:
    - 爬行类卵
  category: 生物学概念
  explanation: 爬行动物的卵与鸟卵相似，具有卵壳和卵壳膜，储存丰富营养物质，适应陆地繁殖。
  misconceptions:
    - 误认为爬行动物的卵必须在水中发育，忽略其卵有卵壳和卵壳膜可适应陆地繁殖。
    - 认为爬行动物的卵与鸟卵完全一样，且都有坚硬卵壳，实际上爬行动物卵壳多柔软。
    - 误以为爬行动物的卵没有卵壳和卵壳膜，导致无法在干燥陆地环境存活。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:爬行动物的生殖发育
  type: Concept
  subject: 生物
  title: 爬行动物的生殖发育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为爬行动物体外受精，受精过程离不开水
    - 能指出并纠正这一错误：以为爬行动物胎生，直接生出小爬行动物
  aliases:
    - 爬行动物生殖
  category: 生物学概念
  explanation: 爬行动物体内受精，产卵于陆地，卵有坚韧卵壳保护，生殖发育摆脱了对水环境的依赖。
  misconceptions:
    - 认为爬行动物体外受精，受精过程离不开水
    - 以为爬行动物胎生，直接生出小爬行动物
    - 认为爬行动物将卵产在水中，卵在水中孵化
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:牛痘接种法
  type: Concept
  subject: 生物
  title: 牛痘接种法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为牛痘接种法是用天花病毒接种，其实用的是牛痘病毒。
    - 能指出并纠正这一错误：把牛痘接种法和人痘接种法混为一谈，不知詹纳。
  aliases: []
  category: 医学史
  explanation: 詹纳发明的用牛痘病毒预防天花的方法，牛痘病毒与天花病毒有交叉免疫反应，接种牛痘可使人获得对天花的免疫力。
  misconceptions:
    - 认为牛痘接种法是用天花病毒接种，其实用的是牛痘病毒。
    - 把牛痘接种法和人痘接种法混为一谈，不知詹纳。
    - 以为牛痘病毒和天花病毒完全一样，没有交叉免疫。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:物种多样性
  type: Concept
  subject: 生物
  title: 物种多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把物种多样性当成个体总数，例如一种蚂蚁数量极多也认为多样性很高
    - 能指出并纠正这一错误：认为物种多样性就是物种数量，与基因多样性和生态系统多样性无关
  aliases: []
  category: 生物学概念
  explanation: 物种多样性是指地球上生物物种的丰富程度，是生物多样性的核心。
  misconceptions:
    - 把物种多样性当成个体总数，例如一种蚂蚁数量极多也认为多样性很高
    - 认为物种多样性就是物种数量，与基因多样性和生态系统多样性无关
    - 将物种多样性理解为'一个群落中个体数量的均匀程度'，与丰富度混淆
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:物质循环
  type: Concept
  subject: 生物
  title: 物质循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为物质循环只在生物群落内进行，忽视了与无机环境的交换
    - 能指出并纠正这一错误：将物质循环等同于能量流动，误以为物质也单向流动、逐级递减
  aliases:
    - 物质循环
  category: 生态学概念
  explanation: 组成生物体的元素在生物群落与无机环境之间反复循环的过程，具有全球性、循环性。
  misconceptions:
    - 误认为物质循环只在生物群落内进行，忽视了与无机环境的交换
    - 将物质循环等同于能量流动，误以为物质也单向流动、逐级递减
    - 误认为物质循环是化合物在无机环境与生物群落间循环，实际是元素
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:特异性免疫
  type: Concept
  subject: 生物
  title: 特异性免疫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为特异性免疫生来就有，混淆非特异性免疫与特异性免疫的时间特点
    - 能指出并纠正这一错误：认为特异性免疫对所有病原体都起作用，忽略其针对特定病原体
  aliases:
    - 后天性免疫
  category: 核心概念
  explanation: 出生以后才产生的，只对某一特定的病原体或异物起作用，包括第三道防线。
  misconceptions:
    - 认为特异性免疫生来就有，混淆非特异性免疫与特异性免疫的时间特点
    - 认为特异性免疫对所有病原体都起作用，忽略其针对特定病原体
    - 认为吞噬细胞属于特异性免疫，忽略其属于非特异性免疫或参与非特异性免疫
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:环节动物
  type: Concept
  subject: 生物
  title: 环节动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为蚯蚓身体没有体节，把它当成线形动物。
    - 能指出并纠正这一错误：认为环节动物都有刚毛，忽略了沙蚕靠疣足运动。
  aliases: []
  category: 生物类群
  explanation: 身体呈圆筒形，由许多相似的体节构成，多靠刚毛或疣足辅助运动，如蚯蚓、沙蚕。
  misconceptions:
    - 误以为蚯蚓身体没有体节，把它当成线形动物。
    - 认为环节动物都有刚毛，忽略了沙蚕靠疣足运动。
    - 将水蛭误认为软体动物，因为身体表面有环纹。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:玻片标本的类型
  type: Concept
  subject: 生物
  title: 玻片标本的类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把用刀片切取的薄片称为装片，实际是切片。
    - 能指出并纠正这一错误：将血液涂片归类为装片，应按制作方法归为涂片。
  aliases:
    - 装片
    - 切片
    - 涂片
  category: 概念
  explanation: 常见的玻片标本有装片、切片和涂片三种，根据制作方法不同而分类。
  misconceptions:
    - 把用刀片切取的薄片称为装片，实际是切片。
    - 将血液涂片归类为装片，应按制作方法归为涂片。
    - 认为临时装片就是永久装片，忽视临时装片不能久存。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:瓣膜
  type: Concept
  subject: 生物
  title: 瓣膜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将房室瓣误认为位于心室与动脉之间，动脉瓣误认为位于心房与心室之间。
    - 能指出并纠正这一错误：认为瓣膜能主动开闭以控制血流，实际是被血流冲击被动开闭。
  aliases: []
  category: 生物学结构
  explanation: 瓣膜位于心房与心室之间、心室与动脉之间，能开闭，防止血液倒流。
  misconceptions:
    - 将房室瓣误认为位于心室与动脉之间，动脉瓣误认为位于心房与心室之间。
    - 认为瓣膜能主动开闭以控制血流，实际是被血流冲击被动开闭。
    - 认为全身动脉都有动脉瓣，实际只有心室与动脉交界处有。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:生产者
  type: Concept
  subject: 生物
  title: 生产者
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有绿色植物是生产者，忽视硝化细菌等化能合成细菌
    - 能指出并纠正这一错误：把菟丝子等寄生植物当作生产者，它们实际是消费者
  aliases:
    - producer
  category: 生态学概念
  explanation: 在生态系统中，植物通过光合作用制造有机物，储存来自阳光的能量，是生态系统中的生产者。
  misconceptions:
    - 认为只有绿色植物是生产者，忽视硝化细菌等化能合成细菌
    - 把菟丝子等寄生植物当作生产者，它们实际是消费者
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生命起源的化学进化说
  type: Concept
  subject: 生物
  title: 生命起源的化学进化说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为原始大气含有氧气，误以为米勒实验原料中有氧气
    - 能指出并纠正这一错误：认为无机物直接形成原始生命，跳过有机物和有机大分子阶段
  aliases:
    - 海洋化学起源说
    - 生命起源的化学进化假说
  category: 生物学理论
  explanation: 关于生命起源的一种假说，认为原始地球上的无机物在高温、紫外线、雷电等条件下形成有机物，再经过漫长岁月在原始海洋中形成原始生命。
  misconceptions:
    - 认为原始大气含有氧气，误以为米勒实验原料中有氧气
    - 认为无机物直接形成原始生命，跳过有机物和有机大分子阶段
    - 把米勒实验当成已完全证明生命起源，认为不需要长时间化学进化
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:生存斗争
  type: Concept
  subject: 生物
  title: 生存斗争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把生存斗争只理解为动物间的打斗，忽略与无机环境的斗争
    - 能指出并纠正这一错误：认为同种生物之间不会发生生存斗争，因为'同族相护'
  aliases: []
  category: 生物学概念
  explanation: 生物要生存下去，就得为获取足够的食物和空间而进行斗争，包括种内斗争、种间斗争以及生物与无机环境的斗争。
  misconceptions:
    - 把生存斗争只理解为动物间的打斗，忽略与无机环境的斗争
    - 认为同种生物之间不会发生生存斗争，因为'同族相护'
    - 以为只有动物才有生存斗争，植物和微生物不存在这种规律
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:生态保护与修复
  type: Concept
  subject: 生物
  title: 生态保护与修复
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态修复就是人工种植树木，不需要考虑动物、微生物等其他生物
    - 能指出并纠正这一错误：把生态保护等同于完全不干扰自然界，连必要的科学管理也视为破坏
  aliases: []
  category: 生态保护措施
  explanation: 通过保护、恢复和改善生态系统，维护其结构和功能的完整性。
  misconceptions:
    - 认为生态修复就是人工种植树木，不需要考虑动物、微生物等其他生物
    - 把生态保护等同于完全不干扰自然界，连必要的科学管理也视为破坏
    - 认为生态保护与修复只针对受破坏的生态系统，健康系统无需保护
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态保护红线
  type: Concept
  subject: 生物
  title: 生态保护红线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态保护红线内禁止一切人类活动，误将严格限制开发当作完全禁止。
    - 能指出并纠正这一错误：混淆生态保护红线与耕地红线，认为两者是同一概念。
  aliases: []
  category: 政策法规
  explanation: 国家划定的生态保护区域，严格限制开发，以保障生态安全。
  misconceptions:
    - 认为生态保护红线内禁止一切人类活动，误将严格限制开发当作完全禁止。
    - 混淆生态保护红线与耕地红线，认为两者是同一概念。
    - 认为生态保护红线一旦划定就永久不变，忽略依法可调整。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态兴则文明兴，生态衰则文明衰
  type: Concept
  subject: 生物
  title: 生态兴则文明兴，生态衰则文明衰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'生态兴则文明兴'当作口号，否认生态恶化会直接导致古文明消失。
    - 能指出并纠正这一错误：认为文明衰亡只由战争决定，与生态破坏毫无关系。
  aliases: []
  category: 生态理念
  explanation: 强调生态文明建设与文明兴衰的密切关系，生态良好则文明兴盛，生态恶化则文明衰落。
  misconceptions:
    - 把'生态兴则文明兴'当作口号，否认生态恶化会直接导致古文明消失。
    - 认为文明衰亡只由战争决定，与生态破坏毫无关系。
    - 倒因为果，说成'文明兴则生态兴，文明衰则生态衰'。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态因素
  type: Concept
  subject: 生物
  title: 生态因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把生态因素只当作生物因素，如只考虑天敌、竞争，忽略阳光、温度等非生物因素。
    - 能指出并纠正这一错误：将海拔、纬度等环境要素直接视为生态因素，其实它们通过温度、水分等间接影响生物。
  aliases:
    - ecological factor
  category: 生态学概念
  explanation: 环境中影响生物的生活和分布的因素叫作生态因素，包括非生物因素和生物因素。
  misconceptions:
    - 把生态因素只当作生物因素，如只考虑天敌、竞争，忽略阳光、温度等非生物因素。
    - 将海拔、纬度等环境要素直接视为生态因素，其实它们通过温度、水分等间接影响生物。
    - 认为生态因素只影响生物的生活，不影响其分布，如忽略了温度对苹果分布区域的限制。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生态安全
  type: Concept
  subject: 生物
  title: 生态安全
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态安全就是环境质量良好，没有污染，忽略其支撑可持续发展的能力。
    - 能指出并纠正这一错误：只关注自然生态安全，忽视人类社会经济活动对生态安全的影响。
  aliases: []
  category: 生态学概念
  explanation: 生态安全是指生态系统服务能够支撑经济社会可持续发展，使人类的生存和发展不受生态环境问题威胁的状态与能力。
  misconceptions:
    - 认为生态安全就是环境质量良好，没有污染，忽略其支撑可持续发展的能力。
    - 只关注自然生态安全，忽视人类社会经济活动对生态安全的影响。
    - 将生态安全等同于生态平衡，认为只要生态平衡就是安全的。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态旅游
  type: Concept
  subject: 生物
  title: 生态旅游
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态旅游就是到自然景区玩，不用管对环境的破坏
    - 能指出并纠正这一错误：觉得生态旅游不能有任何经济活动，否则就不叫生态旅游
  aliases: []
  category: 生态学
  explanation: 生态旅游是一种尽量减少对生态环境不利影响，将生态保护与公众教育、地方经济发展相结合的旅游活动。
  misconceptions:
    - 认为生态旅游就是到自然景区玩，不用管对环境的破坏
    - 觉得生态旅游不能有任何经济活动，否则就不叫生态旅游
    - 把生态旅游和普通旅游完全等同，忽略其保护与教育功能
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态环境问题
  type: Concept
  subject: 生物
  title: 生态环境问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态环境问题只由人类活动引起，忽略火山喷发等自然因素。
    - 能指出并纠正这一错误：把水土流失归为环境污染，而不是生态破坏。
  aliases: []
  category: 生态学
  explanation: 生态环境问题是指由于人类活动或自然因素导致的生态破坏和环境污染，如草地退化、水土流失等。
  misconceptions:
    - 认为生态环境问题只由人类活动引起，忽略火山喷发等自然因素。
    - 把水土流失归为环境污染，而不是生态破坏。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:生态瓶
  type: Concept
  subject: 生物
  title: 生态瓶
  conceptType: 建模型
  masteryCriteria:
    - 能指出并纠正这一错误：以为生态瓶必须敞口才能透气，忽略其密封但自给自足的特点
    - 能指出并纠正这一错误：认为生态瓶中植物只需光照，不需动物和分解者，导致物质循环断裂
  aliases:
    - 微型生态系统
  category: 实验方法
  explanation: 生态瓶是将小型生物和无机物放入透明密闭瓶中形成的微型生态系统，用于模拟和研究生态系统。
  misconceptions:
    - 以为生态瓶必须敞口才能透气，忽略其密封但自给自足的特点
    - 认为生态瓶中植物只需光照，不需动物和分解者，导致物质循环断裂
    - 把生态瓶放在完全黑暗处，以为植物仍能进行光合作用维持平衡
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S4.md
- id: concept:生物:生态系统
  type: Concept
  subject: 生物
  title: 生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把一片森林里所有生物当成生态系统，漏掉阳光、水、土壤等非生物部分
    - 能指出并纠正这一错误：认为一个鱼缸里的鱼就是生态系统，没包含鱼缸中的水草、微生物和水、泥沙等
  aliases: []
  category: 概念
  explanation: 在一定的空间范围内，生物与环境相互作用所形成的统一的整体叫作生态系统。
  misconceptions:
    - 把一片森林里所有生物当成生态系统，漏掉阳光、水、土壤等非生物部分
    - 认为一个鱼缸里的鱼就是生态系统，没包含鱼缸中的水草、微生物和水、泥沙等
    - 误以为校园里的一棵大树是一个生态系统，没意识到它需要周围环境共同构成整体
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生态系统之间的关联
  type: Concept
  subject: 生物
  title: 生态系统之间的关联
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态系统之间只通过生物迁徙关联，忽视阳光、大气、水等非生物因素的联系。
    - 能指出并纠正这一错误：觉得只有相邻的生态系统才有联系，相隔较远的如极地与热带之间没有关联。
  aliases: []
  category: 核心概念
  explanation: 不同生态系统之间通过非生物因素（如阳光、大气、水）、地域关系（如河流）和生物因素（如迁徙）相互关联。
  misconceptions:
    - 认为生态系统之间只通过生物迁徙关联，忽视阳光、大气、水等非生物因素的联系。
    - 觉得只有相邻的生态系统才有联系，相隔较远的如极地与热带之间没有关联。
    - 把河流对生态系统的关联看成单向流动，忽视下游对上游的影响（如洄游鱼类）。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S3.md
- id: concept:生物:生态系统多样性
  type: Concept
  subject: 生物
  title: 生态系统多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把生态系统多样性等同于物种多样性，忽略生境和生态系统过程
    - 能指出并纠正这一错误：认为生态系统多样性只指森林、草原等大型生态系统，忽略农田、池塘等
  aliases: []
  category: 生物学概念
  explanation: 生态系统多样性是指生物圈内生境、生物群落和生态过程的多样化。
  misconceptions:
    - 把生态系统多样性等同于物种多样性，忽略生境和生态系统过程
    - 认为生态系统多样性只指森林、草原等大型生态系统，忽略农田、池塘等
    - 将生态系统多样性理解为生物个体数量多，而非生态系统类型和结构多样
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生态系统是统一的整体
  type: Concept
  subject: 生物
  title: 生态系统是统一的整体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生物圈就是整个地球，包括岩石圈、大气圈和水圈的全部，实际只包括生物生存的部分。
    - 能指出并纠正这一错误：觉得生物圈只是各种生态系统的简单相加，各系统之间没有相互作用，不能形成统一整体。
  aliases:
    - 生物圈是一个统一的整体
  category: 核心概念
  explanation: 各种生态系统相互关联，从非生物因素、地域关系、生物因素等方面看，生物圈是一个统一的整体。
  misconceptions:
    - 认为生物圈就是整个地球，包括岩石圈、大气圈和水圈的全部，实际只包括生物生存的部分。
    - 觉得生物圈只是各种生态系统的简单相加，各系统之间没有相互作用，不能形成统一整体。
    - 将生物圈仅看作地球上所有生物的总和，完全忽略非生物环境也是生物圈的重要组成部分。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S3.md
- id: concept:生物:生态系统服务功能
  type: Concept
  subject: 生物
  title: 生态系统服务功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态系统服务功能只包括食物、水等物质供给，忽略调节气候、净化环境等功能
    - 能指出并纠正这一错误：将土壤形成、养分循环归为调节服务，实际属于支持服务
  aliases:
    - 生态系统服务
  category: 生态学
  explanation: 生态系统服务功能是指生态系统为人类提供的各种惠益，包括供给、调节、文化和支持服务。
  misconceptions:
    - 认为生态系统服务功能只包括食物、水等物质供给，忽略调节气候、净化环境等功能
    - 将土壤形成、养分循环归为调节服务，实际属于支持服务
    - 认为文化服务如休闲旅游不属于生态系统服务功能
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态系统的功能
  type: Concept
  subject: 生物
  title: 生态系统的功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为能量沿食物链循环流动，实际上单向递减
    - 能指出并纠正这一错误：认为物质循环是单向的，忽视物质可循环利用
  aliases: []
  category: 生态学概念
  explanation: 生态系统具有物质循环和能量流动的功能，物质和能量沿食物链和食物网流动。
  misconceptions:
    - 认为能量沿食物链循环流动，实际上单向递减
    - 认为物质循环是单向的，忽视物质可循环利用
    - 误以为能量流动和物质循环彼此独立，实际上同时进行
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:生态系统的稳定性
  type: Concept
  subject: 生物
  title: 生态系统的稳定性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：生态系统的稳定性就是各个物种的数量固定不变
    - 能指出并纠正这一错误：抵抗力稳定性越强的生态系统，恢复力稳定性也越强
  aliases:
    - 生态平衡
  category: 生态学概念
  explanation: 生态系统所具有的保持或恢复自身结构和功能相对稳定的能力，取决于生物的种类、数量、比例以及环境条件。
  misconceptions:
    - 生态系统的稳定性就是各个物种的数量固定不变
    - 抵抗力稳定性越强的生态系统，恢复力稳定性也越强
    - 人工生态系统比自然生态系统稳定性更强
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态系统的类型
  type: Concept
  subject: 生物
  title: 生态系统的类型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为森林生态系统中没有分解者，或草原生态系统中没有消费者。
    - 能指出并纠正这一错误：误以为湿地生态系统只属于水域，忽视了其过渡特征。
  aliases: []
  category: 生态学
  explanation: 生态系统有多种类型，如森林生态系统、草原生态系统、湿地生态系统等，不同类型的生态系统结构和功能不同。
  misconceptions:
    - 认为森林生态系统中没有分解者，或草原生态系统中没有消费者。
    - 误以为湿地生态系统只属于水域，忽视了其过渡特征。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S3.md
- id: concept:生物:生态系统的组成成分
  type: Concept
  subject: 生物
  title: 生态系统的组成成分
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把阳光、水、温度等非生物部分排除在生态系统组成之外。
    - 能指出并纠正这一错误：误以为蘑菇是生产者，实际是分解者。
  aliases:
    - 生态系统的成分
  category: 生态学
  explanation: 生态系统由生产者、消费者、分解者和非生物部分（如阳光、水、温度等）组成。
  misconceptions:
    - 把阳光、水、温度等非生物部分排除在生态系统组成之外。
    - 误以为蘑菇是生产者，实际是分解者。
    - 认为细菌都是分解者，忽略了硝化细菌等生产者。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S3.md
- id: concept:生物:生态系统的自我调节能力
  type: Concept
  subject: 生物
  title: 生态系统的自我调节能力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生态系统无论受多大干扰都能恢复原状，忽略自我调节能力有限
    - 能指出并纠正这一错误：认为自我调节能力只体现在生物数量变化，忽视结构和功能稳定
  aliases:
    - 自我调节能力
    - 生态系统自我调节能力
  category: 生态学概念
  explanation: 生态系统在受到一定程度的外界影响后，能够维持自身结构和功能相对稳定，并逐步恢复原有状态的能力。
  misconceptions:
    - 认为生态系统无论受多大干扰都能恢复原状，忽略自我调节能力有限
    - 认为自我调节能力只体现在生物数量变化，忽视结构和功能稳定
    - 误以为只有自然因素才需调节，人为破坏也能自动修复
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态系统的自我调节能力有限度
  type: Concept
  subject: 生物
  title: 生态系统的自我调节能力有限度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为超过自我调节限度后生态系统必然崩溃，不会缓慢恢复
    - 能指出并纠正这一错误：将外界干扰超过限度等同于生物个体死亡，而非生态系统退化
  aliases:
    - 调节限度
  category: 生态学原理
  explanation: 生态系统的自我调节能力有一定限度，外界干扰超过限度会导致生态系统破坏，服务功能退化。
  misconceptions:
    - 认为超过自我调节限度后生态系统必然崩溃，不会缓慢恢复
    - 将外界干扰超过限度等同于生物个体死亡，而非生态系统退化
    - 认为自我调节能力的限度对所有生态系统都一样，忽略不同生态系统差异
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:生态系统的营养结构
  type: Concept
  subject: 生物
  title: 生态系统的营养结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把食物链和食物网误认为生态系统功能，实际上它们是营养结构
    - 能指出并纠正这一错误：认为营养结构包含分解者和非生物环境，实际上只由生产者和消费者构成
  aliases: []
  category: 生态学概念
  explanation: 食物链和食物网是生态系统的营养结构，物质和能量沿其流动。
  misconceptions:
    - 把食物链和食物网误认为生态系统功能，实际上它们是营养结构
    - 认为营养结构包含分解者和非生物环境，实际上只由生产者和消费者构成
    - 误以为营养结构指生态系统中生物数量的多少
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:生殖系统
  type: Concept
  subject: 生物
  title: 生殖系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为膀胱属于生殖系统，实际膀胱属于泌尿系统。
    - 能指出并纠正这一错误：误认为生殖系统只包括产生生殖细胞的器官，不含输送管道和附属腺体。
  aliases:
    - 生殖器官
  category: 人体生理
  explanation: 人体生殖系统分为男性生殖系统和女性生殖系统，由产生生殖细胞、输送生殖细胞以及胚胎发育的器官组成。
  misconceptions:
    - 误认为膀胱属于生殖系统，实际膀胱属于泌尿系统。
    - 误认为生殖系统只包括产生生殖细胞的器官，不含输送管道和附属腺体。
    - 误认为胚胎在卵巢中发育，实际卵巢只产生卵细胞，胚胎在子宫内发育。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:生活方式
  type: Concept
  subject: 生物
  title: 生活方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把生活方式窄化为饮食习惯，忽略运动、作息和社交等行为。
    - 能指出并纠正这一错误：认为生活方式只是个人爱好，与身体健康没有直接关系。
  aliases: []
  category: 定义
  explanation: 生活方式是指人们在日常生活中的行为方式或习惯，如运动娱乐方式、社交方式、饮食习惯等。
  misconceptions:
    - 把生活方式窄化为饮食习惯，忽略运动、作息和社交等行为。
    - 认为生活方式只是个人爱好，与身体健康没有直接关系。
    - 将压力、情绪调节等心理状态也算作生活方式，混淆了内在状态和行为习惯。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:生活方式病
  type: Concept
  subject: 生物
  title: 生活方式病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把流感、新冠肺炎等传染病也说成生活方式病。
    - 能指出并纠正这一错误：认为生活方式病只发生在中老年，青少年完全不会得。
  aliases:
    - 现代文明病
  category: 概念
  explanation: 生活方式病又称现代文明病，指癌症、心血管疾病、糖尿病等非传染性疾病，其发生和发展受不健康生活方式影响。
  misconceptions:
    - 把流感、新冠肺炎等传染病也说成生活方式病。
    - 认为生活方式病只发生在中老年，青少年完全不会得。
    - 觉得所有癌症都是遗传所致，与生活方式无关。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:生物
  type: Concept
  subject: 生物
  title: 生物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有生物均由细胞构成，忽略病毒没有细胞结构。
    - 能指出并纠正这一错误：把能长大的钟乳石当成生物，因其无生命特征。
  aliases:
    - 生物体
  category: 生物学概念
  explanation: 生物是指有生命的物体，具有共同特征，如由细胞构成（除病毒外）、需要营养、能呼吸、能对外界刺激作出反应、能生长和繁殖、有遗传和变异等。
  misconceptions:
    - 认为所有生物均由细胞构成，忽略病毒没有细胞结构。
    - 把能长大的钟乳石当成生物，因其无生命特征。
    - 误以为不能运动的一定非生物，忽视植物能生长繁殖。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:生物与环境是一个不可分割的整体
  type: Concept
  subject: 生物
  title: 生物与环境是一个不可分割的整体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：觉得生物可以完全脱离环境生存，比如把动物从大自然移到室内就以为不受环境影响
    - 能指出并纠正这一错误：误认为环境只是生物生存的场所，生物对环境没有任何影响或改造作用
  aliases: []
  category: 观点
  explanation: 自然界中的各种生物是相互制约的，生物与环境相互作用，形成一个统一的整体。
  misconceptions:
    - 觉得生物可以完全脱离环境生存，比如把动物从大自然移到室内就以为不受环境影响
    - 误认为环境只是生物生存的场所，生物对环境没有任何影响或改造作用
    - 把生物与环境看成彼此独立的两部分，忽视它们相互依赖、相互制约的关系
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生物与环境的关系
  type: Concept
  subject: 生物
  title: 生物与环境的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘大树底下好乘凉’是生物适应环境，实际是生物影响环境
    - 能指出并纠正这一错误：认为环境能主动改变生物，如寒冷使北极狐变白，实际是自然选择
  aliases: []
  category: 生态学
  explanation: 生物与环境相互影响，生物适应环境并影响环境，环境对生物有选择作用。
  misconceptions:
    - 认为‘大树底下好乘凉’是生物适应环境，实际是生物影响环境
    - 认为环境能主动改变生物，如寒冷使北极狐变白，实际是自然选择
    - 认为生物只能被动适应环境，不能通过行为影响环境
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生物再生生命保障系统
  type: Concept
  subject: 生物
  title: 生物再生生命保障系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'月宫一号'完全封闭、无需任何外界输入，实际上需要提供能量（如太阳能）和物质补充。
    - 能指出并纠正这一错误：觉得该系统内不需要分解者，只要有植物和动物就能物质循环，实际上需要微生物分解有机物。
  aliases:
    - 月宫一号
  category: 科学技术
  explanation: 模拟生物圈功能，为人类提供氧气、水和食物等生命保障的密闭生态系统，如“月宫一号”。
  misconceptions:
    - 认为'月宫一号'完全封闭、无需任何外界输入，实际上需要提供能量（如太阳能）和物质补充。
    - 觉得该系统内不需要分解者，只要有植物和动物就能物质循环，实际上需要微生物分解有机物。
    - 误以为该系统可以永久维持，忽略实验过程中需要人工调节和维护，并非完全自给自足。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S3.md
- id: concept:生物:生物分类
  type: Concept
  subject: 生物
  title: 生物分类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分类等级越高，生物亲缘关系越近，实际等级越低亲缘关系越近
    - 能指出并纠正这一错误：认为生物分类只依据形态结构，忽略生理功能和生殖方式
  aliases:
    - 分类
  category: 生物学方法
  explanation: 根据生物的相似程度（形态结构、生理功能、生殖方式等）将生物划分为不同等级，以弄清亲缘关系和进化关系。
  misconceptions:
    - 认为分类等级越高，生物亲缘关系越近，实际等级越低亲缘关系越近
    - 认为生物分类只依据形态结构，忽略生理功能和生殖方式
    - 认为同种生物的个体完全相同，不存在个体差异
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:生物分类的方法
  type: Concept
  subject: 生物
  title: 生物分类的方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为对植物分类只看根、茎、叶，花和果实不重要
    - 能指出并纠正这一错误：认为分类只需肉眼观察，不需要借助放大镜或显微镜等工具
  aliases: []
  category: 生物学方法
  explanation: 对生物进行分类时，要仔细观察形态结构特征，如被子植物的根、茎、叶等。
  misconceptions:
    - 认为对植物分类只看根、茎、叶，花和果实不重要
    - 认为分类只需肉眼观察，不需要借助放大镜或显微镜等工具
    - 将‘生物分类的方法’与‘生物分类的等级’混为一谈
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:生物因素
  type: Concept
  subject: 生物
  title: 生物因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为同种生物之间的互助或斗争不属于生物因素，如忽略蚂蚁群体中的分工合作对个体生存的意义。
    - 能指出并纠正这一错误：认为生物因素只有捕食关系，忽略竞争、寄生、互利共生等对生物的影响。
  aliases:
    - 生物因子
  category: 生态因素分类
  explanation: 生物因素是指影响某种生物生活的其他生物，如捕食、竞争、寄生等关系。
  misconceptions:
    - 认为同种生物之间的互助或斗争不属于生物因素，如忽略蚂蚁群体中的分工合作对个体生存的意义。
    - 认为生物因素只有捕食关系，忽略竞争、寄生、互利共生等对生物的影响。
    - 把人类活动排除在生物因素之外，认为人不是影响其他生物生活的“其他生物”。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:生物因素对生物的影响
  type: Concept
  subject: 生物
  title: 生物因素对生物的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将阳光、温度、水分等非生物因素误认为生物因素。
    - 能指出并纠正这一错误：认为生物因素只包括捕食和竞争，忽略合作等关系。
  aliases:
    - 生物因素
  category: 生态学
  explanation: 生物与生物之间存在捕食、竞争、合作等关系，这些关系影响生物的生存和分布。
  misconceptions:
    - 将阳光、温度、水分等非生物因素误认为生物因素。
    - 认为生物因素只包括捕食和竞争，忽略合作等关系。
    - 误以为生物因素只在不同种生物间存在，同种生物间的竞争与合作不算。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生物圈
  type: Concept
  subject: 生物
  title: 生物圈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为生物圈就是地球上所有生物，忽略还包括生存环境。
    - 能指出并纠正这一错误：误认为生物圈包括大气圈、水圈、岩石圈的全部。
  aliases: []
  category: 生物学概念
  explanation: 生物圈是地球上所有生物与其生存环境的总和，是最大的生态系统。
  misconceptions:
    - 误认为生物圈就是地球上所有生物，忽略还包括生存环境。
    - 误认为生物圈包括大气圈、水圈、岩石圈的全部。
    - 误认为生物圈是均匀分布的，实际各圈层中生物分布不均。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:生物圈的范围
  type: Concept
  subject: 生物
  title: 生物圈的范围
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为生物圈向上和向下没有界限，实际各约10千米。
    - 能指出并纠正这一错误：误认为生物圈只包括水圈的全部，忽略大气圈底部和岩石圈表面。
  aliases: []
  category: 生物学概念
  explanation: 生物圈以海平面为基准，向上约10千米，向下约10千米，包括大气圈的底部、岩石圈的表面和整个水圈。
  misconceptions:
    - 误认为生物圈向上和向下没有界限，实际各约10千米。
    - 误认为生物圈只包括水圈的全部，忽略大气圈底部和岩石圈表面。
    - 误认为生物圈的范围固定不变，实际随生物分布而变化。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:生物多样性
  type: Concept
  subject: 生物
  title: 生物多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生物多样性仅指物种多样性，忽略遗传和生态系统多样性
    - 能指出并纠正这一错误：将遗传多样性等同于物种多样性，混淆概念层级
  aliases: []
  category: 生态学
  explanation: 生物及其环境形成的生态复合体以及与此相关的各种生态过程的总和，包括遗传、物种和生态系统多样性。
  misconceptions:
    - 认为生物多样性仅指物种多样性，忽略遗传和生态系统多样性
    - 将遗传多样性等同于物种多样性，混淆概念层级
    - 认为生物多样性只包括动物和植物，不包括微生物和生态过程
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生物多样性保护法律
  type: Concept
  subject: 生物
  title: 生物多样性保护法律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有野生动物都受法律保护，如认为捕杀蝗虫也违法，实际上法律只保护珍贵、濒危等名录种。
    - 能指出并纠正这一错误：认为法律只保护动物，不保护植物，如认为采伐野生红豆杉不受《野生动物保护法》制裁。
  aliases:
    - 法律法规
  category: 保护措施
  explanation: 我国颁布了《野生动物保护法》等法律法规，为生物多样性保护提供法律保障。
  misconceptions:
    - 认为所有野生动物都受法律保护，如认为捕杀蝗虫也违法，实际上法律只保护珍贵、濒危等名录种。
    - 认为法律只保护动物，不保护植物，如认为采伐野生红豆杉不受《野生动物保护法》制裁。
    - 认为有了法律就万事大吉，如认为颁布《野生动物保护法》后盗猎立即消失，忽略执法和公众参与。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S4.md
- id: concept:生物:生物多样性面临的威胁
  type: Concept
  subject: 生物
  title: 生物多样性面临的威胁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为威胁只来自人类活动，如认为火山喷发导致物种灭绝不算生物多样性威胁，忽略自然因素。
    - 能指出并纠正这一错误：认为外来物种入侵是唯一威胁，如认为只要防范外来物种，生物多样性就不会减少，忽略栖息地破坏等威胁。
  aliases:
    - 生物多样性威胁
  category: 威胁因素
  explanation: 生物多样性面临的威胁包括物种灭绝、生态系统破坏、外来物种入侵等。
  misconceptions:
    - 认为威胁只来自人类活动，如认为火山喷发导致物种灭绝不算生物多样性威胁，忽略自然因素。
    - 认为外来物种入侵是唯一威胁，如认为只要防范外来物种，生物多样性就不会减少，忽略栖息地破坏等威胁。
    - 认为物种灭绝是自然规律，人类无需干预，如认为渡渡鸟灭绝是正常更替，不必保护现存鸟类。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:生物富集
  type: Concept
  subject: 生物
  title: 生物富集
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为食物链中营养级越高，有害物质浓度越低
    - 能指出并纠正这一错误：误以为生物富集只发生在水生生态系统，陆生不会发生
  aliases:
    - 生物放大
  category: 生态学概念
  explanation: 污染物沿食物链传递并逐渐积累，在生物体内浓度升高，危及高营养级生物。
  misconceptions:
    - 认为食物链中营养级越高，有害物质浓度越低
    - 误以为生物富集只发生在水生生态系统，陆生不会发生
    - 认为所有污染物都会沿食物链富集，忽略易分解物质
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:生物对环境的影响
  type: Concept
  subject: 生物
  title: 生物对环境的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把生物适应环境的特征（如骆驼刺根很长）误认为是对环境的影响。
    - 能指出并纠正这一错误：认为只有人类才能影响环境，其他生物如蚯蚓、植物没有影响力。
  aliases:
    - 影响环境
  category: 生态学
  explanation: 生物在适应环境的同时，也通过生命活动影响和改变环境，如植物影响气温和湿度、蚯蚓疏松土壤。
  misconceptions:
    - 把生物适应环境的特征（如骆驼刺根很长）误认为是对环境的影响。
    - 认为只有人类才能影响环境，其他生物如蚯蚓、植物没有影响力。
    - 误以为生物对环境的影响总是有利的，忽略过度繁殖会破坏环境。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生物对环境的适应
  type: Concept
  subject: 生物
  title: 生物对环境的适应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为骆驼的驼峰储存水，适应干旱环境，实际储存的是脂肪。
    - 能指出并纠正这一错误：认为变色龙变色是主动想变色，不知道这是长期进化的结果。
  aliases:
    - 适应
  category: 生态学
  explanation: 生物在形态、结构、生理和行为等方面与环境相适应的现象，如骆驼耐旱、海豹皮下脂肪厚。
  misconceptions:
    - 误认为骆驼的驼峰储存水，适应干旱环境，实际储存的是脂肪。
    - 认为变色龙变色是主动想变色，不知道这是长期进化的结果。
    - 认为生物能适应全部环境，忽略适应是相对的（如北极熊到了热带会死亡）。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:生物武器
  type: Concept
  subject: 生物
  title: 生物武器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生物武器只含细菌和病毒，不含真菌毒素
    - 能指出并纠正这一错误：认为生物武器只会伤害军人，不会影响平民和环境
  aliases: []
  category: 生物安全
  explanation: 生物武器是利用致病细菌、病毒等制成的武器，给人类带来深重灾难，国际社会普遍反对。
  misconceptions:
    - 认为生物武器只含细菌和病毒，不含真菌毒素
    - 认为生物武器只会伤害军人，不会影响平民和环境
    - 认为生物武器已被国际社会允许使用
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S2.md
- id: concept:生物:生物界的统一性
  type: Concept
  subject: 生物
  title: 生物界的统一性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有生物遗传物质都是DNA，如认为烟草花叶病毒的遗传物质是DNA，实际上它是RNA。
    - 能指出并纠正这一错误：认为所有生物都有细胞结构，如认为病毒也是细胞构成的，忽略了病毒无细胞。
  aliases:
    - 生物的统一性
  category: 生物学概念
  explanation: 生物界在分子、细胞、个体等层面存在共同特征，如遗传物质都是核酸，细胞结构相似，生命活动有共同规律。
  misconceptions:
    - 认为所有生物遗传物质都是DNA，如认为烟草花叶病毒的遗传物质是DNA，实际上它是RNA。
    - 认为所有生物都有细胞结构，如认为病毒也是细胞构成的，忽略了病毒无细胞。
    - 认为统一性意味着所有生物结构完全相同，如以为人和变形虫的细胞结构一模一样，忽略差异性。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:生物的变异
  type: Concept
  subject: 生物
  title: 生物的变异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有变异都是遗传物质改变引起的，环境引起的也算但不遗传
    - 能指出并纠正这一错误：认为变异对生物都是有利的，实际上多数是有害或中性的
  aliases: []
  category: 遗传学概念
  explanation: 生物体亲代与子代之间以及子代不同个体之间存在差异的现象。
  misconceptions:
    - 认为所有变异都是遗传物质改变引起的，环境引起的也算但不遗传
    - 认为变异对生物都是有利的，实际上多数是有害或中性的
    - 认为同种生物个体间的差异都是基因突变造成的，可能受环境影响
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S5.md
- id: concept:生物:生物的特征
  type: Concept
  subject: 生物
  title: 生物的特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为某种生物不具备全部特征就不是生物，如骡子不育仍是生物。
    - 能指出并纠正这一错误：认为所有生物都需要呼吸氧气，实际上一些厌氧菌不需要氧气。
  aliases:
    - 生物的共同特征
  category: 生物学概念
  explanation: 生物具有共同特征，包括由细胞构成（除病毒外）、需要营养、能呼吸、能对外界刺激作出反应、能生长和繁殖、有遗传和变异等。
  misconceptions:
    - 误以为某种生物不具备全部特征就不是生物，如骡子不育仍是生物。
    - 认为所有生物都需要呼吸氧气，实际上一些厌氧菌不需要氧气。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:生物的生活需要营养
  type: Concept
  subject: 生物
  title: 生物的生活需要营养
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物只需要阳光和水，不需要无机盐。
    - 能指出并纠正这一错误：误以为病毒不需要营养，因为它在细胞外不活动。
  aliases: []
  category: 生物特征
  explanation: 生物需要不断从外界获得营养物质，植物通过光合作用制造有机物，动物以其他生物为食。
  misconceptions:
    - 认为植物只需要阳光和水，不需要无机盐。
    - 误以为病毒不需要营养，因为它在细胞外不活动。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:生物能对外界刺激作出反应
  type: Concept
  subject: 生物
  title: 生物能对外界刺激作出反应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为只有动物对外界刺激能作出反应，植物也有向光性、向地性等。
    - 能指出并纠正这一错误：认为生物对外界刺激的反应都需通过神经系统，植物无神经却也能反应。
  aliases:
    - 应激性
  category: 生物特征
  explanation: 生物能够对环境中的各种刺激作出一定的反应，如含羞草受碰触叶片合拢。
  misconceptions:
    - 误以为只有动物对外界刺激能作出反应，植物也有向光性、向地性等。
    - 认为生物对外界刺激的反应都需通过神经系统，植物无神经却也能反应。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:生物能生长、发育和繁殖
  type: Concept
  subject: 生物
  title: 生物能生长、发育和繁殖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把细菌的二分裂称为生长，实际是繁殖方式。
    - 能指出并纠正这一错误：误以为生长就是发育，将身高增加当作发育完成。
  aliases: []
  category: 生物特征
  explanation: 生物体能够由小长大，发育到一定阶段后繁殖下一代。
  misconceptions:
    - 把细菌的二分裂称为生长，实际是繁殖方式。
    - 误以为生长就是发育，将身高增加当作发育完成。
    - 误以为所有生物都进行有性生殖，细菌用分裂生殖。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:生物能进行呼吸
  type: Concept
  subject: 生物
  title: 生物能进行呼吸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有生物都需要氧气，忽视酵母菌、乳酸菌能在无氧条件下呼吸。
    - 能指出并纠正这一错误：把植物的呼吸作用当成光合作用，认为植物只在夜间呼吸。
  aliases: []
  category: 生物特征
  explanation: 绝大多数生物需要获取氧气，排出二氧化碳。
  misconceptions:
    - 认为所有生物都需要氧气，忽视酵母菌、乳酸菌能在无氧条件下呼吸。
    - 把植物的呼吸作用当成光合作用，认为植物只在夜间呼吸。
    - 认为“呼吸”就是肺通气，与细胞内的呼吸作用混为一谈。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:生物进化的总体趋势
  type: Concept
  subject: 生物
  title: 生物进化的总体趋势
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有生物都由简单到复杂，忽略寄生虫等结构简化现象
    - 能指出并纠正这一错误：认为'由水生到陆生'是绝对规律，举例鲸回到海洋就说不符合趋势
  aliases: []
  category: 生物学规律
  explanation: 生物进化由简单到复杂、由水生到陆生，既有新物种产生，也有物种灭绝。
  misconceptions:
    - 认为所有生物都由简单到复杂，忽略寄生虫等结构简化现象
    - 认为'由水生到陆生'是绝对规律，举例鲸回到海洋就说不符合趋势
    - 认为进化只会产生新物种，物种灭绝与进化趋势无关
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S2.md
- id: concept:生物:生物都有遗传和变异的特性
  type: Concept
  subject: 生物
  title: 生物都有遗传和变异的特性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“种瓜得瓜，种豆得豆”是变异，实际是遗传现象。
    - 能指出并纠正这一错误：把亲代与子代间的差异叫遗传，把相似叫变异，两者颠倒。
  aliases:
    - 遗传和变异
  category: 生物特征
  explanation: 生物的亲代与子代之间相似为遗传，亲子间及子代个体间差异为变异。
  misconceptions:
    - 认为“种瓜得瓜，种豆得豆”是变异，实际是遗传现象。
    - 把亲代与子代间的差异叫遗传，把相似叫变异，两者颠倒。
    - 认为变异只发生在子代个体间，亲子代之间不存在变异。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:生物防治
  type: Concept
  subject: 生物
  title: 生物防治
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为生物防治就是喷施农药，实际是利用天敌等生物来防治
    - 能指出并纠正这一错误：认为生物防治能彻底消灭有害生物，实际只是控制种群数量
  aliases: []
  category: 生态学应用
  explanation: 利用天敌等生物来防治有害生物的方法，是绿色产业中害虫防治的思路。
  misconceptions:
    - 误认为生物防治就是喷施农药，实际是利用天敌等生物来防治
    - 认为生物防治能彻底消灭有害生物，实际只是控制种群数量
    - 将生物防治等同于引入外来天敌，忽略可能造成物种入侵风险
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:生男生女的奥秘
  type: Concept
  subject: 生物
  title: 生男生女的奥秘
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为生男生女由母亲决定，因为母亲提供X，实际由父亲精子决定
    - 能指出并纠正这一错误：认为生男生女有规律可循，比如通过饮食控制，实际是随机的
  aliases: []
  category: 遗传学规律
  explanation: 男性产生含X或Y的精子，女性产生含X的卵细胞，精子与卵细胞随机结合，生男生女机会均等。
  misconceptions:
    - 认为生男生女由母亲决定，因为母亲提供X，实际由父亲精子决定
    - 认为生男生女有规律可循，比如通过饮食控制，实际是随机的
    - 认为含Y精子速度更快，所以更容易生男孩，但概率仍是50%
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:生长激素
  type: Concept
  subject: 生物
  title: 生长激素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为幼年生长激素过多导致肢端肥大症
    - 能指出并纠正这一错误：认为侏儒症是甲状腺激素缺乏引起的
  aliases: []
  category: 激素
  explanation: 由垂体分泌，促进生长，幼年分泌过多导致巨人症，不足导致侏儒症。
  misconceptions:
    - 认为幼年生长激素过多导致肢端肥大症
    - 认为侏儒症是甲状腺激素缺乏引起的
    - 认为成年后生长激素分泌不足会导致侏儒症
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S2.md
- id: concept:生物:甲状腺
  type: Concept
  subject: 生物
  title: 甲状腺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为呆小病是缺碘所致，与甲状腺无关
  aliases: []
  category: 内分泌腺
  explanation: 分泌甲状腺激素，促进新陈代谢和生长发育，缺乏时导致呆小病。
  misconceptions:
    - 认为呆小病是缺碘所致，与甲状腺无关
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:甲状腺激素
  type: Concept
  subject: 生物
  title: 甲状腺激素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为幼年甲状腺激素过多会患侏儒症
    - 能指出并纠正这一错误：认为成人缺乏甲状腺激素会患呆小病
  aliases: []
  category: 激素
  explanation: 由甲状腺分泌，促进新陈代谢和生长发育，缺乏导致呆小病。
  misconceptions:
    - 认为幼年甲状腺激素过多会患侏儒症
    - 认为成人缺乏甲状腺激素会患呆小病
    - 认为呆小病和侏儒症是同一种疾病
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S2.md
- id: concept:生物:男性生殖系统
  type: Concept
  subject: 生物
  title: 男性生殖系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为附睾产生精子，实际附睾是储存和输送精子的结构，精子由睾丸产生。
    - 能指出并纠正这一错误：误认为输精管输送尿液，实际输精管输送精子，尿道输送尿液。
  aliases:
    - 男性生殖器官
  category: 人体结构
  explanation: 男性生殖系统主要包括睾丸、附睾、输精管和阴茎等，睾丸是主要生殖器官，产生精子和分泌雄激素。
  misconceptions:
    - 误认为附睾产生精子，实际附睾是储存和输送精子的结构，精子由睾丸产生。
    - 误认为输精管输送尿液，实际输精管输送精子，尿道输送尿液。
    - 误认为阴茎是男性主要生殖器官，实际睾丸才是主要生殖器官。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:疫苗
  type: Concept
  subject: 生物
  title: 疫苗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为疫苗是抗体，实际疫苗是抗原（或减毒病原体等）。
    - 能指出并纠正这一错误：认为接种疫苗后立即产生免疫力，实际需要时间产生抗体。
  aliases: []
  category: 生物学概念
  explanation: 接种后能使人体产生相应抗体，提高对特定传染病抵抗力的生物制品。
  misconceptions:
    - 认为疫苗是抗体，实际疫苗是抗原（或减毒病原体等）。
    - 认为接种疫苗后立即产生免疫力，实际需要时间产生抗体。
    - 认为疫苗能预防所有传染病，实际每种疫苗只针对特定病原体。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:病原体
  type: Concept
  subject: 生物
  title: 病原体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为病原体都是病毒，忽略细菌、寄生虫等也能致病。
    - 能指出并纠正这一错误：认为寄生虫不属于病原体，因为它们是动物不是微生物。
  aliases: []
  category: 概念
  explanation: 能引起传染病的细菌、病毒、寄生虫等生物。
  misconceptions:
    - 认为病原体都是病毒，忽略细菌、寄生虫等也能致病。
    - 认为寄生虫不属于病原体，因为它们是动物不是微生物。
    - 把病原体与传染源混为一谈，传染源是病人或携带者，病原体是致病生物。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:病毒与人类的关系
  type: Concept
  subject: 生物
  title: 病毒与人类的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为病毒只会致病，对人类毫无益处
    - 能指出并纠正这一错误：认为所有病毒都能用于基因工程，随意作为载体
  aliases: []
  category: 生物学概念
  explanation: 病毒既可引起严重疾病，也可被人类利用于治疗、防治害虫和基因工程。
  misconceptions:
    - 认为病毒只会致病，对人类毫无益处
    - 认为所有病毒都能用于基因工程，随意作为载体
    - 认为病毒引起的疾病完全无法预防，疫苗无效
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S4.md
- id: concept:生物:病毒性肝炎
  type: Concept
  subject: 生物
  title: 病毒性肝炎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有肝炎都是病毒引起的，把脂肪性肝炎也归为病毒性肝炎。
    - 能指出并纠正这一错误：认为甲肝和乙肝都通过血液传播，实际甲肝经粪-口传播。
  aliases:
    - 肝炎
  category: 概念
  explanation: 由肝炎病毒引起的传染病，具有传染性，包括甲肝、乙肝、丙肝等。
  misconceptions:
    - 认为所有肝炎都是病毒引起的，把脂肪性肝炎也归为病毒性肝炎。
    - 认为甲肝和乙肝都通过血液传播，实际甲肝经粪-口传播。
    - 认为只有甲肝和乙肝是病毒性肝炎，忽略丙肝等类型。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:病毒的发现
  type: Concept
  subject: 生物
  title: 病毒的发现
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为伊万诺夫斯基用普通光学显微镜直接看到了病毒
    - 能指出并纠正这一错误：认为病毒的发现者是巴斯德而非伊万诺夫斯基
  aliases: []
  category: 生物学史实
  explanation: 伊万诺夫斯基通过过滤实验发现烟草花叶病由比细菌更小的微生物引起，即病毒。
  misconceptions:
    - 认为伊万诺夫斯基用普通光学显微镜直接看到了病毒
    - 认为病毒的发现者是巴斯德而非伊万诺夫斯基
    - 认为过滤实验证明病毒是能通过滤器的小细菌
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S4.md
- id: concept:生物:病毒的增殖方式
  type: Concept
  subject: 生物
  title: 病毒的增殖方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为病毒能在人工培养基上独立繁殖，不需要活细胞
    - 能指出并纠正这一错误：认为病毒增殖时利用自身能量和物质合成新病毒
  aliases:
    - 复制增殖
    - 病毒的增殖
    - 病毒复制
  category: 生物学概念
  explanation: 病毒寄生在活细胞内，利用细胞内的物质制造新病毒，离开活细胞则无生命活动。
  misconceptions:
    - 认为病毒能在人工培养基上独立繁殖，不需要活细胞
    - 认为病毒增殖时利用自身能量和物质合成新病毒
    - 认为病毒离开活细胞后仍能继续增殖和活动
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S4.md
- id: concept:生物:病毒的种类
  type: Concept
  subject: 生物
  title: 病毒的种类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为噬菌体是一种抗生素，可以治疗细菌感染
    - 能指出并纠正这一错误：认为根据寄主不同分为DNA病毒和RNA病毒，混淆分类依据
  aliases:
    - 病毒分类
  category: 生物学概念
  explanation: 根据寄主细胞不同，病毒分为动物病毒、植物病毒和噬菌体。
  misconceptions:
    - 认为噬菌体是一种抗生素，可以治疗细菌感染
    - 认为根据寄主不同分为DNA病毒和RNA病毒，混淆分类依据
    - 认为细菌和病毒属于同一类微生物，结构相似
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S4.md
- id: concept:生物:病毒的结构
  type: Concept
  subject: 生物
  title: 病毒的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为病毒具有细胞膜和细胞质，只是结构简单
    - 能指出并纠正这一错误：认为病毒同时含有DNA和RNA两种遗传物质
  aliases: []
  category: 生物学概念
  explanation: 病毒没有细胞结构，由蛋白质外壳和内部的遗传物质组成，比细胞小得多。
  misconceptions:
    - 认为病毒具有细胞膜和细胞质，只是结构简单
    - 认为病毒同时含有DNA和RNA两种遗传物质
    - 认为病毒比细菌大，用普通显微镜能看清
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S4.md
- id: concept:生物:癌细胞
  type: Concept
  subject: 生物
  title: 癌细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为癌症具有传染性，与癌症患者日常接触会传染。
    - 能指出并纠正这一错误：将癌细胞与正常细胞等同，认为它不会无限增殖。
  aliases:
    - 恶性肿瘤细胞
  category: 病理学
  explanation: 癌细胞是正常细胞癌变后形成的，具有分裂快、可转移等特点。
  misconceptions:
    - 认为癌症具有传染性，与癌症患者日常接触会传染。
    - 将癌细胞与正常细胞等同，认为它不会无限增殖。
    - 以为癌细胞只分裂不转移，忽略其可侵入周围组织并扩散。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S1.md
- id: concept:生物:白内障
  type: Concept
  subject: 生物
  title: 白内障
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认白内障是角膜变浊引起，实际是晶状体变浊
    - 能指出并纠正这一错误：认为白内障可通过角膜移植治愈，应更换人工晶状体
  aliases: []
  category: 疾病
  explanation: 由晶状体浑浊引起的致盲性眼病，可通过手术复明。
  misconceptions:
    - 误认白内障是角膜变浊引起，实际是晶状体变浊
    - 认为白内障可通过角膜移植治愈，应更换人工晶状体
    - 把白内障与视网膜病变混为一谈，以为是感光细胞受损
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:白细胞
  type: Concept
  subject: 生物
  title: 白细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为白细胞没有细胞核，与红细胞一样只运输氧气。
    - 能指出并纠正这一错误：误认为白细胞是数量最多的血细胞，实际上红细胞数量最多。
  aliases:
    - 白血球
  category: 生物学概念
  explanation: 白细胞是体积较大、有细胞核的血细胞，能吞噬病菌，起防御作用。
  misconceptions:
    - 误认为白细胞没有细胞核，与红细胞一样只运输氧气。
    - 误认为白细胞是数量最多的血细胞，实际上红细胞数量最多。
    - 误认为白细胞体积最小，能穿过细胞间隙清除病菌，实际最小的是血小板。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:白血病
  type: Concept
  subject: 生物
  title: 白血病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为白血病是红细胞增多，血液颜色变白，实际是白细胞异常增生。
    - 能指出并纠正这一错误：认为白血病是传染病，需要隔离，实际属于造血系统恶性肿瘤，不传染。
  aliases:
    - 血癌
  category: 医学概念
  explanation: 白血病俗称血癌，是造血系统的恶性肿瘤，表现为血细胞数量、功能异常。
  misconceptions:
    - 认为白血病是红细胞增多，血液颜色变白，实际是白细胞异常增生。
    - 认为白血病是传染病，需要隔离，实际属于造血系统恶性肿瘤，不传染。
    - 认为白血病就是白细胞减少，免疫力下降，实际是白细胞恶性增殖并浸润。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:直立人
  type: Concept
  subject: 生物
  title: 直立人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为北京直立人就是现代人的直系祖先，忽略智人阶段的存在
    - 能指出并纠正这一错误：把直立人与能人混淆，认为直立人最早开始制造工具
  aliases: []
  category: 生物学概念
  explanation: 直立人是人类进化史上的一个重要阶段，北京猿人属于直立人。
  misconceptions:
    - 认为北京直立人就是现代人的直系祖先，忽略智人阶段的存在
    - 把直立人与能人混淆，认为直立人最早开始制造工具
    - 认为直立人已具备现代人的语言和意识，与智人没有显著差别
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:直立行走
  type: Concept
  subject: 生物
  title: 直立行走
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：因果颠倒，认为是脑容量增大后才开始直立行走
    - 能指出并纠正这一错误：认为直立行走仅仅是为了看得更远，忽视解放前肢的关键作用
  aliases: []
  category: 生物学概念
  explanation: 人类进化的重要标志，使前肢解放出来，促进工具使用和大脑发展。
  misconceptions:
    - 因果颠倒，认为是脑容量增大后才开始直立行走
    - 认为直立行走仅仅是为了看得更远，忽视解放前肢的关键作用
    - 把直立行走和工具制造视为毫不相关的两个事件
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S4.md
- id: concept:生物:相对性状
  type: Concept
  subject: 生物
  title: 相对性状
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将不同生物的同一性状视为相对性状，如狗的长毛与猫的短毛。
    - 能指出并纠正这一错误：误将同一生物的不同性状视为相对性状，如人的高个与胖瘦。
  aliases:
    - 相对性状
  category: 生物学概念
  explanation: 相对性状是同种生物同一性状的不同表现类型，如黄瓜果实有苦和不苦。
  misconceptions:
    - 误将不同生物的同一性状视为相对性状，如狗的长毛与猫的短毛。
    - 误将同一生物的不同性状视为相对性状，如人的高个与胖瘦。
    - 认为相对性状只有显性和隐性两种，忽略同一性状可有多种表现类型。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:真核生物
  type: Concept
  subject: 生物
  title: 真核生物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为细菌是真核生物，有成形细胞核
    - 能指出并纠正这一错误：以为真菌是原核生物，没有细胞核
  aliases:
    - eukaryote
  category: 生物概念
  explanation: 真核生物是指细胞内有成形的细胞核的生物，包括真菌、植物和动物。
  misconceptions:
    - 认为细菌是真核生物，有成形细胞核
    - 以为真菌是原核生物，没有细胞核
    - 认为真核生物包含原核生物，混淆层级关系
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:真菌
  type: Concept
  subject: 生物
  title: 真菌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为真菌都是多细胞生物，酵母菌也是多细胞
    - 能指出并纠正这一错误：以为蘑菇是植物，能进行光合作用
  aliases: []
  category: 生物学概念
  explanation: 真核生物，包括霉菌、酵母菌等，细胞有细胞核，菌落较大。
  misconceptions:
    - 认为真菌都是多细胞生物，酵母菌也是多细胞
    - 以为蘑菇是植物，能进行光合作用
    - 认为真菌的繁殖方式主要是分裂生殖
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:真菌与人类的关系
  type: Concept
  subject: 生物
  title: 真菌与人类的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为真菌对人类只有害处，没有益处
    - 能指出并纠正这一错误：认为蘑菇、木耳等属于植物，不是真菌
  aliases: []
  category: 生物学概念
  explanation: 真菌既有有害的一面（引起疾病），也有有益的一面（食用、制药、发酵等）。
  misconceptions:
    - 认为真菌对人类只有害处，没有益处
    - 认为蘑菇、木耳等属于植物，不是真菌
    - 认为真菌全部营寄生生活，不进行分解作用
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:真菌的分解作用
  type: Concept
  subject: 生物
  title: 真菌的分解作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有细菌能分解动植物遗体，真菌不能
    - 能指出并纠正这一错误：认为分解产物是葡萄糖和氧气，而非二氧化碳、水和无机盐
  aliases:
    - 腐生
  category: 生物学概念
  explanation: 真菌和细菌能将动植物遗体分解为二氧化碳、水和无机盐，促进物质循环。
  misconceptions:
    - 认为只有细菌能分解动植物遗体，真菌不能
    - 认为分解产物是葡萄糖和氧气，而非二氧化碳、水和无机盐
    - 认为真菌的分解作用会阻碍自然界的物质循环
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:真菌的寄生性
  type: Concept
  subject: 生物
  title: 真菌的寄生性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有真菌都营寄生生活，不存在腐生类型
    - 能指出并纠正这一错误：认为手癣、足癣是由细菌感染引起的，而非真菌
  aliases: []
  category: 生物学概念
  explanation: 有些真菌寄生在人体或动植物体内，吸收营养，导致疾病，如手癣、足癣、稻瘟病等。
  misconceptions:
    - 认为所有真菌都营寄生生活，不存在腐生类型
    - 认为手癣、足癣是由细菌感染引起的，而非真菌
    - 认为寄生真菌对宿主无害，只是共同生活
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:真菌的有益应用
  type: Concept
  subject: 生物
  title: 真菌的有益应用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有真菌都能食用，如毒蘑菇也可随意吃
    - 能指出并纠正这一错误：认为青霉菌是病毒，抗生素来自病毒
  aliases: []
  category: 生物学概念
  explanation: 许多真菌可食用或用于制作食品，有些能产生抗生素治疗疾病，还可用于生产乙醇、甘油等。
  misconceptions:
    - 认为所有真菌都能食用，如毒蘑菇也可随意吃
    - 认为青霉菌是病毒，抗生素来自病毒
    - 认为酿酒、发面只靠细菌，不需要酵母菌等真菌
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:真菌的繁殖方式
  type: Concept
  subject: 生物
  title: 真菌的繁殖方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蘑菇是由种子繁殖的，其实蘑菇靠孢子繁殖，种子是高等植物的特征。
    - 能指出并纠正这一错误：认为孢子必须两个结合才能发育，实际孢子单个就能在适宜环境长成新个体。
  aliases:
    - 孢子繁殖
    - 真菌的孢子繁殖
    - 孢子生殖
  category: 生物学概念
  explanation: 真菌通过产生大量的孢子来繁殖后代，每个孢子在适宜环境下都能发育成新个体。
  misconceptions:
    - 认为蘑菇是由种子繁殖的，其实蘑菇靠孢子繁殖，种子是高等植物的特征。
    - 认为孢子必须两个结合才能发育，实际孢子单个就能在适宜环境长成新个体。
    - 认为真菌只能进行无性生殖，忽略有些真菌也进行有性生殖。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:眼球成像模型
  type: Concept
  subject: 生物
  title: 眼球成像模型
  conceptType: 建模型
  masteryCriteria:
    - 能指出并纠正这一错误：认为近视眼是晶状体曲度过小导致成像在视网膜后方，实际是曲度过大提前成像
    - 能指出并纠正这一错误：把视网膜与视神经功能颠倒，以为视网膜负责传导信号而视神经负责感光
  aliases:
    - 眼球模型
  category: 模型制作
  explanation: 可调节的眼球成像模型用于模拟正常眼成像、近视形成及矫正，包括晶状体、视网膜等结构。
  misconceptions:
    - 认为近视眼是晶状体曲度过小导致成像在视网膜后方，实际是曲度过大提前成像
    - 把视网膜与视神经功能颠倒，以为视网膜负责传导信号而视神经负责感光
    - 误以为看近物时晶状体变薄以增强折光，实际应变厚
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:眼球的结构
  type: Concept
  subject: 生物
  title: 眼球的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为晶状体是透明胶状物，玻璃体是能变形的透镜
    - 能指出并纠正这一错误：认为瞳孔是一层黑色的薄膜，实际是虹膜中央的开口
  aliases:
    - 眼球基本结构
  category: 解剖学
  explanation: 眼球近似球体，由眼球壁和内容物构成，包括巩膜、虹膜、脉络膜、瞳孔、视网膜、角膜、视神经、晶状体、玻璃体、睫状体等结构。
  misconceptions:
    - 误以为晶状体是透明胶状物，玻璃体是能变形的透镜
    - 认为瞳孔是一层黑色的薄膜，实际是虹膜中央的开口
    - 将巩膜当成光线入口，认为角膜是眼白部分
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:睾丸
  type: Concept
  subject: 生物
  title: 睾丸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为睾丸分泌雌性激素，实际睾丸分泌雄激素。
    - 能指出并纠正这一错误：误认为附睾能产生精子，实际精子由睾丸产生，附睾只储存精子。
  aliases: []
  category: 人体结构
  explanation: 男性的主要生殖器官，功能是产生精子，分泌雄激素。
  misconceptions:
    - 误认为睾丸分泌雌性激素，实际睾丸分泌雄激素。
    - 误认为附睾能产生精子，实际精子由睾丸产生，附睾只储存精子。
    - 误认为睾丸仅产生精子，不分泌激素，实际还分泌雄激素。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:瞳孔的调节
  type: Concept
  subject: 生物
  title: 瞳孔的调节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为在明亮环境中瞳孔放大以看清，暗处缩小减少进光
    - 能指出并纠正这一错误：把瞳孔调节当成改变晶状体曲度，用于聚焦
  aliases:
    - 瞳孔反射
  category: 生理学
  explanation: 瞳孔大小可调节，在明亮环境中缩小，在黑暗环境中放大，以控制进入眼球的光量，帮助看清物体。
  misconceptions:
    - 认为在明亮环境中瞳孔放大以看清，暗处缩小减少进光
    - 把瞳孔调节当成改变晶状体曲度，用于聚焦
    - 误以为瞳孔是黑色不透光的，会阻挡光线进入眼内
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:碘缺乏病
  type: Concept
  subject: 生物
  title: 碘缺乏病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为碘缺乏病只是甲状腺肿大，忽略可能伴有甲状腺功能减退
    - 能指出并纠正这一错误：认为碘越多越好，过量碘也会导致甲状腺疾病
  aliases:
    - 地方性甲状腺肿
  category: 疾病
  explanation: 碘缺乏病是由于缺碘导致甲状腺激素合成不足，引起地方性甲状腺肿等疾病。
  misconceptions:
    - 认为碘缺乏病只是甲状腺肿大，忽略可能伴有甲状腺功能减退
    - 认为碘越多越好，过量碘也会导致甲状腺疾病
    - 把碘缺乏病等同于甲亢，实际碘缺乏导致甲状腺激素合成不足
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:碳中和
  type: Concept
  subject: 生物
  title: 碳中和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为碳中和就是完全不排放二氧化碳，一点也不能排
    - 能指出并纠正这一错误：觉得只要多种树就能实现碳中和，不需要减少碳排放
  aliases: []
  category: 环境政策
  explanation: 碳中和是指通过植树造林等方式抵消人为排放的二氧化碳，实现净零排放，我国力争2060年前实现碳中和。
  misconceptions:
    - 认为碳中和就是完全不排放二氧化碳，一点也不能排
    - 觉得只要多种树就能实现碳中和，不需要减少碳排放
    - 将碳中和与碳达峰混为一谈，认为实现碳达峰就是碳中和
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:碳捕集、利用与封存技术
  type: Concept
  subject: 生物
  title: 碳捕集、利用与封存技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为碳捕集技术能完全消除所有二氧化碳排放，无需减排
    - 能指出并纠正这一错误：觉得捕集到的二氧化碳只能封存起来，不能进行利用
  aliases:
    - CCUS
  category: 技术
  explanation: 碳捕集、利用与封存技术是指将二氧化碳从排放源捕集，并加以利用或封存，以减少大气中二氧化碳的技术。
  misconceptions:
    - 认为碳捕集技术能完全消除所有二氧化碳排放，无需减排
    - 觉得捕集到的二氧化碳只能封存起来，不能进行利用
    - 将碳捕集技术等同于碳中和，认为有了该技术就不用种树
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:碳氧平衡
  type: Concept
  subject: 生物
  title: 碳氧平衡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为晚上植物也进行光合作用，树林里氧气比白天还多
    - 能指出并纠正这一错误：以为碳氧平衡是氧气和二氧化碳的量完全相等，永远不变
  aliases:
    - 碳-氧平衡
  category: 生物学概念
  explanation: 植物通过光合作用吸收二氧化碳释放氧气，维持生物圈中二氧化碳和氧气的相对平衡。
  misconceptions:
    - 认为晚上植物也进行光合作用，树林里氧气比白天还多
    - 以为碳氧平衡是氧气和二氧化碳的量完全相等，永远不变
    - 认为只有绿色植物维持碳氧平衡，动物和微生物的呼吸无关
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:碳达峰
  type: Concept
  subject: 生物
  title: 碳达峰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为碳达峰就是碳排放量不再增加，之后一直保持不变
    - 能指出并纠正这一错误：将碳达峰与碳中和混淆，认为两者是同一概念或同时实现
  aliases: []
  category: 环境政策
  explanation: 碳达峰是指二氧化碳排放量达到历史最高值后经历平台期进入持续下降的过程，我国承诺2030年前实现碳达峰。
  misconceptions:
    - 认为碳达峰就是碳排放量不再增加，之后一直保持不变
    - 将碳达峰与碳中和混淆，认为两者是同一概念或同时实现
    - 觉得碳达峰意味着排放量立即下降，不需要经历平台期
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:神经中枢
  type: Concept
  subject: 生物
  title: 神经中枢
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将神经中枢仅限定在大脑皮层，忽略脊髓中的缩手反射中枢
    - 能指出并纠正这一错误：认为神经中枢能够产生感觉，混淆了中枢与分析综合功能
  aliases: []
  category: 生物学概念
  explanation: 神经中枢是反射弧的中间部分，在脊髓或脑中，能对传入的神经冲动进行分析和综合，并将神经冲动传给传出神经。
  misconceptions:
    - 将神经中枢仅限定在大脑皮层，忽略脊髓中的缩手反射中枢
    - 认为神经中枢能够产生感觉，混淆了中枢与分析综合功能
    - 把神经中枢画在反射弧最前端，位于感受器和传入神经之前
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:神经元
  type: Concept
  subject: 生物
  title: 神经元
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为神经纤维就是神经元本身，不知是轴突包鞘
    - 能指出并纠正这一错误：分不清树突和轴突，常把轴突说成树突
  aliases:
    - 神经细胞
  category: 细胞结构
  explanation: 神经元是神经系统结构和功能的基本单位，由胞体和突起组成，突起分为树突和轴突。
  misconceptions:
    - 误认为神经纤维就是神经元本身，不知是轴突包鞘
    - 分不清树突和轴突，常把轴突说成树突
    - 把神经元当作组织，忘记它是细胞
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:神经系统
  type: Concept
  subject: 生物
  title: 神经系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为神经系统只有脑和脊髓，漏掉两者发出的神经
    - 能指出并纠正这一错误：误以为神经就是神经系统，混淆局部与整体
  aliases:
    - nervous system
  category: 系统
  explanation: 人体主要的调节系统，由脑、脊髓和它们发出的神经组成，负责调节各项生命活动。
  misconceptions:
    - 认为神经系统只有脑和脊髓，漏掉两者发出的神经
    - 误以为神经就是神经系统，混淆局部与整体
    - 误把一条神经当成整个神经系统
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S2.md
- id: concept:生物:神经系统的支配作用
  type: Concept
  subject: 生物
  title: 神经系统的支配作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把肌肉收缩当作随意行为，不知道必须接受神经系统的支配才能运动。
    - 能指出并纠正这一错误：误认为单块肌肉即可完成动作，忽略多组肌肉的协调配合。
  aliases: []
  category: 生理学
  explanation: 人体的任何动作都由多组肌肉在神经系统统一支配下协调完成，神经受损可导致肌肉萎缩或瘫痪。
  misconceptions:
    - 把肌肉收缩当作随意行为，不知道必须接受神经系统的支配才能运动。
    - 误认为单块肌肉即可完成动作，忽略多组肌肉的协调配合。
    - 把神经受损仅与疼痛联系，不知会导致肌肉萎缩或瘫痪。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:神经纤维
  type: Concept
  subject: 生物
  title: 神经纤维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把神经纤维当成神经元，忽略它只是轴突加鞘
    - 能指出并纠正这一错误：认为树突也属于神经纤维，只有长轴突包鞘才是
  aliases: []
  category: 结构概念
  explanation: 神经纤维是神经元长的突起（轴突）外套有鞘形成的结构，聚集成束外包膜构成神经。
  misconceptions:
    - 把神经纤维当成神经元，忽略它只是轴突加鞘
    - 认为树突也属于神经纤维，只有长轴突包鞘才是
    - 混淆神经和神经纤维，神经是器官，纤维是结构
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:神经组织
  type: Concept
  subject: 生物
  title: 神经组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把神经组织误认为能收缩和舒张，与肌肉组织混淆
    - 能指出并纠正这一错误：认为神经组织只存在于脑和脊髓中，忽略分布在全身各处
  aliases:
    - 神经组织
  category: 生物学概念
  explanation: 主要由神经细胞构成，能够感受刺激，产生并传导神经冲动，在体内起着调节和控制作用。
  misconceptions:
    - 把神经组织误认为能收缩和舒张，与肌肉组织混淆
    - 认为神经组织只存在于脑和脊髓中，忽略分布在全身各处
    - 认为神经组织的主要功能是运输氧气，混同于血液
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:神经胶质细胞
  type: Concept
  subject: 生物
  title: 神经胶质细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为神经系统只由神经元组成，忽略胶质细胞
    - 能指出并纠正这一错误：认为胶质细胞能传导神经冲动，实际只是支持
  aliases: []
  category: 细胞类型
  explanation: 神经胶质细胞是神经系统中的支持细胞，为神经元提供营养和支持。
  misconceptions:
    - 以为神经系统只由神经元组成，忽略胶质细胞
    - 认为胶质细胞能传导神经冲动，实际只是支持
    - 把胶质细胞当成神经元的一种，功能完全不同
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:神经调节
  type: Concept
  subject: 生物
  title: 神经调节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为神经调节的反射弧包括效应器就是肌肉，忽略腺体也是效应器
    - 能指出并纠正这一错误：认为反射弧中兴奋传导方向是效应器→传出神经→中枢，实际方向相反
  aliases: []
  category: 生理学
  explanation: 神经调节是神经系统通过反射弧对机体生命活动进行的调节，具有快速、精准的特点。
  misconceptions:
    - 认为神经调节的反射弧包括效应器就是肌肉，忽略腺体也是效应器
    - 认为反射弧中兴奋传导方向是效应器→传出神经→中枢，实际方向相反
    - 把神经调节和体液调节的特点混淆，神经调节具有快速精准特点
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:禁止近亲结婚
  type: Concept
  subject: 生物
  title: 禁止近亲结婚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为堂兄妹结婚属于三代以外，实际上堂兄妹属三代以内旁系血亲
    - 能指出并纠正这一错误：认为近亲结婚的后代一定会患遗传病，实为概率增大而非必然
  aliases: []
  category: 优生优育
  explanation: 法律禁止直系血亲和三代以内旁系血亲结婚，以降低遗传病发病率，有益于优生优育。
  misconceptions:
    - 认为堂兄妹结婚属于三代以外，实际上堂兄妹属三代以内旁系血亲
    - 认为近亲结婚的后代一定会患遗传病，实为概率增大而非必然
    - 认为禁止近亲结婚只禁止直系血亲，不管旁系血亲，实则三代以内旁系也禁止
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:种子植物
  type: Concept
  subject: 生物
  title: 种子植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为苔藓、蕨类也能产生种子，因为它们能繁殖后代。
    - 能指出并纠正这一错误：认为种子植物都会开花，把松树排除在种子植物之外。
  aliases: []
  category: 生物类群
  explanation: 能结种子的植物称为种子植物，包括裸子植物和被子植物。
  misconceptions:
    - 误以为苔藓、蕨类也能产生种子，因为它们能繁殖后代。
    - 认为种子植物都会开花，把松树排除在种子植物之外。
    - 误以为所有种子植物都有果实，裸子植物如银杏被误认为没有种子。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:种子的结构
  type: Concept
  subject: 生物
  title: 种子的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为胚乳是胚的一部分，把玉米的胚乳当成了子叶。
    - 能指出并纠正这一错误：认为种皮和胚是并列的，实际上胚包括胚芽、胚轴、胚根和子叶。
  aliases: []
  category: 生物学概念
  explanation: 种子由种皮和胚组成，胚包括胚芽、胚轴、胚根和子叶，有的种子有胚乳。
  misconceptions:
    - 误以为胚乳是胚的一部分，把玉米的胚乳当成了子叶。
    - 认为种皮和胚是并列的，实际上胚包括胚芽、胚轴、胚根和子叶。
    - 误以为种子萌发时最先突破种皮的是胚芽，实际是胚根。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:种子萌发的环境条件
  type: Concept
  subject: 生物
  title: 种子萌发的环境条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为种子萌发必须有光照，如把置于黑暗中的种子视为不能萌发。
    - 能指出并纠正这一错误：认为种子萌发必须要有土壤和肥料，如把在棉花或纸巾上萌发的种子视为异常。
  aliases:
    - 种子萌发条件
  category: 生物学概念
  explanation: 种子萌发需要适宜的温度、适量的水分和充足的空气。
  misconceptions:
    - 认为种子萌发必须有光照，如把置于黑暗中的种子视为不能萌发。
    - 认为种子萌发必须要有土壤和肥料，如把在棉花或纸巾上萌发的种子视为异常。
    - 认为种子萌发时水分越多越好，把完全浸泡在水中的种子当作能正常萌发。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:种子萌发的自身条件
  type: Concept
  subject: 生物
  title: 种子萌发的自身条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为种子只要有完整的胚就能萌发，忽视胚活力不足或未度过休眠期。
    - 能指出并纠正这一错误：认为胚乳完整就能萌发，胚是否完整无所谓。
  aliases:
    - 种子萌发内部条件
  category: 生物学概念
  explanation: 种子萌发需要胚完整且具有活力，并度过休眠期。
  misconceptions:
    - 认为种子只要有完整的胚就能萌发，忽视胚活力不足或未度过休眠期。
    - 认为胚乳完整就能萌发，胚是否完整无所谓。
    - 认为刚收获的种子在适宜条件下立即就能萌发，不认休眠状态的存在。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:种子萌发的过程
  type: Concept
  subject: 生物
  title: 种子萌发的过程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为种子萌发时先长出茎和叶，然后才长出根。
    - 能指出并纠正这一错误：误认为胚根发育成茎和叶，胚芽发育成根。
  aliases:
    - 萌发过程
  category: 生物学概念
  explanation: 种子萌发时吸水膨胀，胚根突破种皮形成根，胚芽发育成茎和叶。
  misconceptions:
    - 认为种子萌发时先长出茎和叶，然后才长出根。
    - 误认为胚根发育成茎和叶，胚芽发育成根。
    - 认为子叶会发育成幼苗的叶，而不是储藏营养。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:种质资源库
  type: Concept
  subject: 生物
  title: 种质资源库
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为种质资源库只保存种子，如认为DNA和试管苗不能入库保存。
    - 能指出并纠正这一错误：认为种质资源库能保存整个生物体，如认为可将大熊猫个体放入库中长期存活。
  aliases:
    - 基因库
  category: 保护设施
  explanation: 利用仪器设备控制储藏环境，长期保存种质资源（如种子、试管苗、DNA等）的仓库。
  misconceptions:
    - 认为种质资源库只保存种子，如认为DNA和试管苗不能入库保存。
    - 认为种质资源库能保存整个生物体，如认为可将大熊猫个体放入库中长期存活。
    - 认为种质资源库不需要特殊环境，如认为把种子放在普通柜子里就能长期保存。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:科学方法：建构模型
  type: Concept
  subject: 生物
  title: 科学方法：建构模型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把模型当作原物的复制品，要求与实物完全一样，忽略模型只需反映本质特征
    - 能指出并纠正这一错误：认为建模是随意简化，可忽略关键特征，导致模型失去代表性
  aliases: []
  category: 科学方法
  explanation: 模型是对认识对象的简化、概括性描述，建构模型是塑造模型的过程，要反映本质特征。
  misconceptions:
    - 把模型当作原物的复制品，要求与实物完全一样，忽略模型只需反映本质特征
    - 认为建模是随意简化，可忽略关键特征，导致模型失去代表性
    - 将科学模型等同于模具，不理解模型是抽象概括而非实物
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:科学方法：归纳
  type: Concept
  subject: 生物
  title: 科学方法：归纳
  conceptType: 推理型
  masteryCriteria:
    - 能指出并纠正这一错误：用一两个细胞观察就断言所有细胞都有某结构，以偏概全
    - 能指出并纠正这一错误：把归纳当演绎，从一般原理推出个别结论，颠倒思维方向
  aliases: []
  category: 科学方法
  explanation: 由一系列具体事实推出一般结论的思维方法，如观察许多细胞有细胞膜等结构，得出细胞都有这些结构。
  misconceptions:
    - 用一两个细胞观察就断言所有细胞都有某结构，以偏概全
    - 把归纳当演绎，从一般原理推出个别结论，颠倒思维方向
    - 忽略反例，如看到多数细胞有细胞核就认为所有细胞都有细胞核
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:秸秆还田
  type: Concept
  subject: 生物
  title: 秸秆还田
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为秸秆还田越多越好，忽略病虫害蔓延的风险。
    - 能指出并纠正这一错误：把秸秆直接焚烧当作还田，错失土壤养分补充。
  aliases: []
  category: 生态农业
  explanation: 秸秆还田是将农作物秸秆归还土壤，以补充土壤养分、改善土壤结构，但需科学处理以避免病虫害等问题。
  misconceptions:
    - 认为秸秆还田越多越好，忽略病虫害蔓延的风险。
    - 把秸秆直接焚烧当作还田，错失土壤养分补充。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:空气质量与健康
  type: Concept
  subject: 生物
  title: 空气质量与健康
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植树造林是根本措施，实际根本措施是控制污染物排放
    - 能指出并纠正这一错误：认为室外空气一定比室内差，忽略室内甲醛等污染物
  aliases:
    - 空气污染
  category: 环境健康
  explanation: 大气污染物危害健康，控制污染物排放是根本措施，植树造林是有效防治措施。
  misconceptions:
    - 认为植树造林是根本措施，实际根本措施是控制污染物排放
    - 认为室外空气一定比室内差，忽略室内甲醛等污染物
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:竞争关系
  type: Concept
  subject: 生物
  title: 竞争关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将捕食当竞争，如认为猫抓老鼠是两者在争夺食物。
    - 能指出并纠正这一错误：认为竞争只发生在动物之间，忽略植物间争夺阳光、水分也是竞争。
  aliases:
    - 竞争
  category: 生态学
  explanation: 不同生物之间争夺资源（如阳光、养料、水）的关系，如杂草和水稻竞争。
  misconceptions:
    - 误将捕食当竞争，如认为猫抓老鼠是两者在争夺食物。
    - 认为竞争只发生在动物之间，忽略植物间争夺阳光、水分也是竞争。
    - 以为竞争必须直接打斗，忽略争夺同一资源但互不接触（如大树遮挡阳光）。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:第一道防线
  type: Concept
  subject: 生物
  title: 第一道防线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为皮肤和黏膜只起阻挡作用，忽略其分泌物的杀菌功能
    - 能指出并纠正这一错误：把呼吸道纤毛和黏膜分泌物归为第二道防线，混淆组成归属
  aliases: []
  category: 核心概念
  explanation: 由皮肤和黏膜组成，阻挡大多数病原体侵入，并通过分泌抑菌和杀菌物质及特殊结构清除病原体。
  misconceptions:
    - 认为皮肤和黏膜只起阻挡作用，忽略其分泌物的杀菌功能
    - 把呼吸道纤毛和黏膜分泌物归为第二道防线，混淆组成归属
    - 认为第一道防线能清除所有病原体，忽略其不能处理已侵入体内的病原体
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:第三道防线
  type: Concept
  subject: 生物
  title: 第三道防线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为胸腺属于内分泌器官，忽略其也是免疫器官
    - 能指出并纠正这一错误：认为淋巴细胞只在血液中，忽略其也存在于淋巴和脾等免疫器官
  aliases: []
  category: 核心概念
  explanation: 主要由免疫器官（如胸腺、淋巴结、脾）和免疫细胞（如淋巴细胞）组成，针对特定病原体起作用，属于特异性免疫。
  misconceptions:
    - 认为胸腺属于内分泌器官，忽略其也是免疫器官
    - 认为淋巴细胞只在血液中，忽略其也存在于淋巴和脾等免疫器官
    - 认为第三道防线包括吞噬细胞，但忽视了吞噬细胞也参与第二道防线，混淆层次
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:第二性征
  type: Concept
  subject: 生物
  title: 第二性征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为生殖器官的发育属于第二性征，实际第二性征指其他外部特征，如胡须、喉结。
    - 能指出并纠正这一错误：误认为第二性征出生时就已存在，实际在青春期后才出现。
  aliases: []
  category: 生理特征
  explanation: 除生殖器官外男女性特有的外部特征，如男性胡须、喉结，女性乳房增大等。
  misconceptions:
    - 误认为生殖器官的发育属于第二性征，实际第二性征指其他外部特征，如胡须、喉结。
    - 误认为第二性征出生时就已存在，实际在青春期后才出现。
    - 误认为男性喉结和女性乳房增大是第一性征，实际这是第二性征。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S2.md
- id: concept:生物:第二道防线
  type: Concept
  subject: 生物
  title: 第二道防线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为溶菌酶属于第一道防线，误以为其由皮肤分泌
    - 能指出并纠正这一错误：认为吞噬作用只属于非特异性免疫，忽略吞噬细胞在特异性免疫中呈递抗原
  aliases: []
  category: 核心概念
  explanation: 由体液中的杀菌物质（如溶菌酶）和吞噬细胞组成，能吞噬和消灭侵入人体的病原体。
  misconceptions:
    - 认为溶菌酶属于第一道防线，误以为其由皮肤分泌
    - 认为吞噬作用只属于非特异性免疫，忽略吞噬细胞在特异性免疫中呈递抗原
    - 把第二道防线当作包括皮肤和黏膜，混淆第二与第一道防线
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:米勒实验
  type: Concept
  subject: 生物
  title: 米勒实验
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为米勒实验产生了原始生命，或直接产生核酸等大分子
    - 能指出并纠正这一错误：认为实验证明了整个生命起源化学过程，不需后续'原始生命诞生'阶段
  aliases:
    - 米勒模拟实验
  category: 科学实验
  explanation: 模拟原始地球条件，通过火花放电将甲烷、氨、氢气、水蒸气等气体合成了多种氨基酸，证明原始地球能产生有机物。
  misconceptions:
    - 认为米勒实验产生了原始生命，或直接产生核酸等大分子
    - 认为实验证明了整个生命起源化学过程，不需后续'原始生命诞生'阶段
    - 认为米勒实验中的火花放电等同于紫外线，误以为模拟的是紫外线辐射
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:糖尿病
  type: Concept
  subject: 生物
  title: 糖尿病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为糖尿病只是血糖升高，忽略多饮多食多尿的典型症状
    - 能指出并纠正这一错误：认为糖尿病一定是胰岛素分泌不足，忽略胰岛素抵抗的情况
  aliases: []
  category: 疾病
  explanation: 糖尿病是由于胰岛素分泌不足或细胞对胰岛素反应减弱导致血糖浓度过高，出现多尿、多饮、多食等症状的疾病。
  misconceptions:
    - 认为糖尿病只是血糖升高，忽略多饮多食多尿的典型症状
    - 认为糖尿病一定是胰岛素分泌不足，忽略胰岛素抵抗的情况
    - 把尿糖当糖尿病确诊标准，实际需测血糖
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:糖类
  type: Concept
  subject: 生物
  title: 糖类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为糖类都有甜味，淀粉无甜味但属于糖类。
    - 能指出并纠正这一错误：误认为脂肪是主要能源物质，实际糖类是主要能源物质，脂肪是备用能源。
  aliases:
    - 碳水化合物
  category: 营养物质
  explanation: 糖类是重要的能源物质，包括葡萄糖、蔗糖、淀粉等，能为人体生命活动提供能量。
  misconceptions:
    - 误认为糖类都有甜味，淀粉无甜味但属于糖类。
    - 误认为脂肪是主要能源物质，实际糖类是主要能源物质，脂肪是备用能源。
    - 误认为糖类只供能，不参与构成细胞，实际糖类也是细胞的重要组成成分。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:系统
  type: Concept
  subject: 生物
  title: 系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把心脏误认为是一个系统，实际上它属于器官
    - 能指出并纠正这一错误：认为植物也有系统，如输导系统，其实是输导组织
  aliases:
    - system
  category: 生物学概念
  explanation: 能够共同完成一种或几种生理功能的多个器官按照一定的次序组合在一起，就构成了系统。
  misconceptions:
    - 把心脏误认为是一个系统，实际上它属于器官
    - 认为植物也有系统，如输导系统，其实是输导组织
    - 将消化系统称为组织，混淆系统的概念
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:紧急呼救
  type: Concept
  subject: 生物
  title: 紧急呼救
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：拨打120后立即挂断电话等待，实际应保持电话畅通，并听从调度员指导。
    - 能指出并纠正这一错误：对昏迷者掐人中或喂水，应先判断意识和呼吸，必要时进行心肺复苏。
  aliases:
    - 拨打120
  category: 急救技能
  explanation: 遇到紧急情况时，先判断患者意识和呼吸，清除呼吸道异物，并拨打120急救电话求助。
  misconceptions:
    - 拨打120后立即挂断电话等待，实际应保持电话畅通，并听从调度员指导。
    - 对昏迷者掐人中或喂水，应先判断意识和呼吸，必要时进行心肺复苏。
    - 清除呼吸道异物时盲目用手挖，可能把异物推向深处，应使用海姆立克法。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:红细胞
  type: Concept
  subject: 生物
  title: 红细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为红细胞有细胞核，能自主分裂产生新红细胞，实际无核。
    - 能指出并纠正这一错误：误认为红细胞能吞噬病菌，起防御作用，实际是运输氧。
  aliases:
    - 红血球
  category: 生物学概念
  explanation: 红细胞是数量最多的血细胞，无细胞核，富含血红蛋白，具有运输氧的功能。
  misconceptions:
    - 误认为红细胞有细胞核，能自主分裂产生新红细胞，实际无核。
    - 误认为红细胞能吞噬病菌，起防御作用，实际是运输氧。
    - 误认为血红蛋白游离在血浆中，通过血浆运输氧，实际限制在红细胞内。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:纯合子
  type: Concept
  subject: 生物
  title: 纯合子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为aa不是纯合子，觉得只有AA或DD才是纯合子，实际aa也是纯合子
    - 能指出并纠正这一错误：把Dd误认为纯合子，认为含显性基因就是纯合，实际Dd是杂合子
  aliases:
    - 纯种
  category: 遗传学概念
  explanation: 体细胞中成对的基因相同（如DD或dd）的个体称为纯合子。
  misconceptions:
    - 认为aa不是纯合子，觉得只有AA或DD才是纯合子，实际aa也是纯合子
    - 把Dd误认为纯合子，认为含显性基因就是纯合，实际Dd是杂合子
    - 认为纯合子自交后代一定出现性状分离，实际纯合子自交后代全是纯合子
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:线粒体
  type: Concept
  subject: 生物
  title: 线粒体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物细胞没有线粒体，只有叶绿体，因为植物能光合作用
    - 能指出并纠正这一错误：误认为线粒体是合成有机物的场所，而实际是分解有机物释放能量
  aliases: []
  category: 生物学概念
  explanation: 细胞中的能量转换器，能将有机物中的化学能释放出来供细胞利用，动植物细胞都有。
  misconceptions:
    - 认为植物细胞没有线粒体，只有叶绿体，因为植物能光合作用
    - 误认为线粒体是合成有机物的场所，而实际是分解有机物释放能量
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:线粒体是能量转换器
  type: Concept
  subject: 生物
  title: 线粒体是能量转换器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将线粒体与叶绿体功能混淆，认为线粒体把光能转变成化学能
    - 能指出并纠正这一错误：认为线粒体能直接利用无机物合成有机物，不消耗有机物就释放能量
  aliases:
    - 线粒体的功能
  category: 细胞生物学
  explanation: 线粒体能将有机物中储存的能量释放出来，供细胞利用，是细胞中的能量转换器。
  misconceptions:
    - 将线粒体与叶绿体功能混淆，认为线粒体把光能转变成化学能
    - 认为线粒体能直接利用无机物合成有机物，不消耗有机物就释放能量
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:线虫动物
  type: Concept
  subject: 生物
  title: 线虫动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蛔虫只有口没有肛门，食物残渣从口排出。
    - 能指出并纠正这一错误：把所有线虫都当作寄生虫，忽视了自由生活的线虫。
  aliases: []
  category: 生物类群
  explanation: 身体细长，呈圆柱形，体表有角质层，有口有肛门，如蛔虫、钩虫。
  misconceptions:
    - 认为蛔虫只有口没有肛门，食物残渣从口排出。
    - 把所有线虫都当作寄生虫，忽视了自由生活的线虫。
    - 把体表角质层当成外骨骼，以为它会随身体长大。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:组织
  type: Concept
  subject: 生物
  title: 组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一个细胞也能构成组织，忽略组织是多个细胞的联合
    - 能指出并纠正这一错误：把皮肤、骨骼肌等器官误认为组织
  aliases:
    - tissue
  category: 生物学概念
  explanation: 由形态相似、功能相同的细胞联合在一起形成的细胞群，叫作组织。
  misconceptions:
    - 认为一个细胞也能构成组织，忽略组织是多个细胞的联合
    - 把皮肤、骨骼肌等器官误认为组织
    - 认为组织中的细胞形态相同但功能不同，违背概念
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:组织培养
  type: Concept
  subject: 生物
  title: 组织培养
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为组织培养需要种子，实际利用植物组织如茎尖、叶片在无菌条件下培养。
    - 能指出并纠正这一错误：误以为组织培养属于有性生殖，会改变遗传物质，实际是无性繁殖保持母本性状。
  aliases:
    - 植物组织培养
  category: 无性生殖应用
  explanation: 在无菌条件下，将植物组织（如茎尖、叶片）在人工培养基上培养成完整植株的技术。
  misconceptions:
    - 误认为组织培养需要种子，实际利用植物组织如茎尖、叶片在无菌条件下培养。
    - 误以为组织培养属于有性生殖，会改变遗传物质，实际是无性繁殖保持母本性状。
    - 认为组织培养在普通土壤中进行即可，忽略需无菌和人工培养基的条件。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:组织液
  type: Concept
  subject: 生物
  title: 组织液
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为组织液就是血液，血液中包含组织液，实际二者都是细胞外液但不相同。
    - 能指出并纠正这一错误：认为组织液是细胞内的溶液，与血浆无关，实际存在于组织细胞间隙。
  aliases: []
  category: 体液
  explanation: 组织液是组织细胞之间的液体，血液与组织细胞通过组织液进行物质交换。
  misconceptions:
    - 认为组织液就是血液，血液中包含组织液，实际二者都是细胞外液但不相同。
    - 认为组织液是细胞内的溶液，与血浆无关，实际存在于组织细胞间隙。
    - 认为组织液与血浆成分完全一样，只是位置不同，实际蛋白质含量差异明显。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S2.md
- id: concept:生物:细胞
  type: Concept
  subject: 生物
  title: 细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为病毒由细胞构成，忽略病毒没有细胞结构这一特例。
    - 能指出并纠正这一错误：认为草履虫是多细胞生物，不知道它由一个细胞构成。
  aliases: []
  category: 生物学概念
  explanation: 细胞是生物体结构和功能的基本单位，除病毒外，生物都是由细胞构成的。
  misconceptions:
    - 认为病毒由细胞构成，忽略病毒没有细胞结构这一特例。
    - 认为草履虫是多细胞生物，不知道它由一个细胞构成。
    - 认为构成多细胞生物的每个细胞都能独立完成全部生命活动，实际需依赖其他细胞。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:细胞分化
  type: Concept
  subject: 生物
  title: 细胞分化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为细胞分化后遗传物质改变，实际上是基因选择性表达，遗传物质不变
    - 能指出并纠正这一错误：把细胞分裂和细胞分化混为一谈，误以为分化也使细胞数目增多
  aliases:
    - cell differentiation
  category: 生物学概念
  explanation: 在个体发育过程中，一个或一种细胞通过细胞分裂产生的子代细胞，在形态、结构和生理功能上发生差异性的变化，这个过程叫作细胞分化。
  misconceptions:
    - 认为细胞分化后遗传物质改变，实际上是基因选择性表达，遗传物质不变
    - 把细胞分裂和细胞分化混为一谈，误以为分化也使细胞数目增多
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:细胞分裂
  type: Concept
  subject: 生物
  title: 细胞分裂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为细胞分裂是先分裂细胞质再分裂细胞核，顺序颠倒
    - 能指出并纠正这一错误：以为细胞分裂就是细胞膜直接缢裂成两个，无细胞核分裂过程
  aliases:
    - cell division
  category: 细胞生物学
  explanation: 细胞分裂就是一个细胞分成两个细胞的过程，包括细胞核分裂和细胞质分裂。
  misconceptions:
    - 误认为细胞分裂是先分裂细胞质再分裂细胞核，顺序颠倒
    - 以为细胞分裂就是细胞膜直接缢裂成两个，无细胞核分裂过程
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S1.md
- id: concept:生物:细胞分裂和分化
  type: Concept
  subject: 生物
  title: 细胞分裂和分化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为分化使细胞数目增多，分裂使细胞种类增多，两者功能颠倒
    - 能指出并纠正这一错误：认为细胞分裂和分化是两个独立过程，实际分裂是分化的基础，分化伴随分裂进行
  aliases: []
  category: 生物学概念
  explanation: 细胞分裂使细胞数目增多，分化使细胞形态、结构和功能发生差异，形成不同组织。
  misconceptions:
    - 误认为分化使细胞数目增多，分裂使细胞种类增多，两者功能颠倒
    - 认为细胞分裂和分化是两个独立过程，实际分裂是分化的基础，分化伴随分裂进行
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S4.md
- id: concept:生物:细胞壁
  type: Concept
  subject: 生物
  title: 细胞壁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为细胞壁能控制物质进出，实际这是细胞膜的功能
    - 能指出并纠正这一错误：以为动物细胞也有细胞壁，将保护支持功能与细胞膜功能混同
  aliases: []
  category: 生物学概念
  explanation: 植物细胞最外层的一层较薄的壁，起保护和支持细胞的作用。
  misconceptions:
    - 认为细胞壁能控制物质进出，实际这是细胞膜的功能
    - 以为动物细胞也有细胞壁，将保护支持功能与细胞膜功能混同
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:细胞学说
  type: Concept
  subject: 生物
  title: 细胞学说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为细胞学说是达尔文提出的，或说施莱登和施旺只研究了动物
    - 能指出并纠正这一错误：认为病毒也是由细胞构成的，违背细胞学说的基本观点
  aliases: []
  category: 生物学史
  explanation: 施莱登和施旺于19世纪30年代创建，主要观点是动物、植物都是由细胞构成的，细胞是生物体结构和功能的基本单位，细胞能够产生新细胞。
  misconceptions:
    - 误以为细胞学说是达尔文提出的，或说施莱登和施旺只研究了动物
    - 认为病毒也是由细胞构成的，违背细胞学说的基本观点
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:细胞是构成生物体的基本单位
  type: Concept
  subject: 生物
  title: 细胞是构成生物体的基本单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：忽视病毒没有细胞结构，仍说所有生物都由细胞构成
    - 能指出并纠正这一错误：将“基本单位”理解为唯一单位，忽略有些生物如病毒无细胞
  aliases: []
  category: 生物学概念
  explanation: 无论是植物、动物，还是细菌、真菌，它们都是由细胞构成的，细胞是构成生物体的基本单位。
  misconceptions:
    - 忽视病毒没有细胞结构，仍说所有生物都由细胞构成
    - 将“基本单位”理解为唯一单位，忽略有些生物如病毒无细胞
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:细胞是生物体结构和功能的基本单位
  type: Concept
  subject: 生物
  title: 细胞是生物体结构和功能的基本单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把细胞、组织、器官层次混淆，如认为细胞就是器官
    - 能指出并纠正这一错误：认为细胞是孤立单位，与其他细胞无联系，否定细胞间协作
  aliases:
    - 细胞的基本单位
  category: 细胞生物学
  explanation: 细胞是生物体结构和功能的基本单位，细胞的生活是物质、能量和信息的统一。
  misconceptions:
    - 把细胞、组织、器官层次混淆，如认为细胞就是器官
    - 认为细胞是孤立单位，与其他细胞无联系，否定细胞间协作
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:细胞核
  type: Concept
  subject: 生物
  title: 细胞核
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有细胞都有细胞核，忽略原核生物无成形细胞核
    - 能指出并纠正这一错误：将细胞核功能说成是能量转换或物质合成，如认为核是能量中心
  aliases: []
  category: 生物学概念
  explanation: 细胞中近似球形的结构，是细胞的控制中心，含有遗传物质DNA，控制生物的生长、发育和遗传。
  misconceptions:
    - 认为所有细胞都有细胞核，忽略原核生物无成形细胞核
    - 将细胞核功能说成是能量转换或物质合成，如认为核是能量中心
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:细胞核是细胞的控制中心
  type: Concept
  subject: 生物
  title: 细胞核是细胞的控制中心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为细胞质是控制中心，因代谢反应主要在细胞质进行
    - 能指出并纠正这一错误：认为细胞核只控制遗传不控制代谢，或只控制代谢不控制遗传
  aliases:
    - 细胞核是控制中心
  category: 生物学概念
  explanation: 细胞核含有遗传物质，控制细胞的遗传和代谢活动。
  misconceptions:
    - 误认为细胞质是控制中心，因代谢反应主要在细胞质进行
    - 认为细胞核只控制遗传不控制代谢，或只控制代谢不控制遗传
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:细胞液
  type: Concept
  subject: 生物
  title: 细胞液
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将细胞液与细胞质等同，认为细胞液是细胞质中的全部液体
    - 能指出并纠正这一错误：以为所有细胞都有大液泡和细胞液，例如动物细胞
  aliases: []
  category: 生物学概念
  explanation: 液泡内的液体，含有无机盐、糖类、色素等多种物质。
  misconceptions:
    - 将细胞液与细胞质等同，认为细胞液是细胞质中的全部液体
    - 以为所有细胞都有大液泡和细胞液，例如动物细胞
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:细胞生长
  type: Concept
  subject: 生物
  title: 细胞生长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为细胞生长是细胞数目增多，实际是单个细胞体积增大，如细胞分裂是数目增多。
    - 能指出并纠正这一错误：以为细胞能无限长大，实际受表面积与体积比限制，长到一定程度便不再生长。
  aliases: []
  category: 细胞生物学
  explanation: 细胞生长是指细胞不断从周围环境中吸收营养物质，体积由小变大的过程。
  misconceptions:
    - 认为细胞生长是细胞数目增多，实际是单个细胞体积增大，如细胞分裂是数目增多。
    - 以为细胞能无限长大，实际受表面积与体积比限制，长到一定程度便不再生长。
    - 认为细胞生长只需吸收营养，忽略细胞膜控制物质进出和能量供应。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:细胞的生活是物质、能量和信息的统一
  type: Concept
  subject: 生物
  title: 细胞的生活是物质、能量和信息的统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为细胞膜是控制中心，实际细胞核才是细胞的控制中心。
    - 能指出并纠正这一错误：认为所有细胞都有叶绿体和线粒体，如动物细胞没有叶绿体，只有线粒体。
  aliases: []
  category: 生物学概念
  explanation: 细胞的生活需要物质和能量，细胞膜控制物质进出，叶绿体和线粒体是能量转换器，细胞核是控制中心，因此细胞的生活是物质、能量和信息的统一。
  misconceptions:
    - 误认为细胞膜是控制中心，实际细胞核才是细胞的控制中心。
    - 认为所有细胞都有叶绿体和线粒体，如动物细胞没有叶绿体，只有线粒体。
    - 将能量转换器与遗传信息载体混淆，说成线粒体储存遗传信息。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:细胞的统一性
  type: Concept
  subject: 生物
  title: 细胞的统一性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有细胞都有成形细胞核，如说细菌具有核膜包围的细胞核，实际上细菌只有拟核。
    - 能指出并纠正这一错误：认为所有细胞都有细胞壁，如说动物细胞也有细胞壁，实际上动物细胞没有。
  aliases:
    - 细胞结构的统一性
  category: 生物学概念
  explanation: 不同种类的细胞（动物、植物、真菌、细菌）在结构上具有共同点，如都有细胞膜、细胞质、细胞核（或拟核），这些结构共同完成生命活动，细胞是生物体的基本单位。
  misconceptions:
    - 认为所有细胞都有成形细胞核，如说细菌具有核膜包围的细胞核，实际上细菌只有拟核。
    - 认为所有细胞都有细胞壁，如说动物细胞也有细胞壁，实际上动物细胞没有。
    - 认为所有细胞都有叶绿体，如说蓝藻细胞有叶绿体进行光合作用，实际上蓝藻没有叶绿体，只有光合色素。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:细胞膜
  type: Concept
  subject: 生物
  title: 细胞膜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为植物细胞膜在细胞壁外面，实际细胞膜紧贴细胞壁内侧。
    - 能指出并纠正这一错误：以为光学显微镜下能清晰看到细胞膜，实际细胞膜很薄，不易看清。
  aliases: []
  category: 生物学概念
  explanation: 紧贴细胞壁内侧的一层非常薄的膜，在光学显微镜下不易看清楚，具有控制物质进出的功能。
  misconceptions:
    - 认为植物细胞膜在细胞壁外面，实际细胞膜紧贴细胞壁内侧。
    - 以为光学显微镜下能清晰看到细胞膜，实际细胞膜很薄，不易看清。
    - 把细胞膜的功能说成保护和支持，其实那是细胞壁的功能。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:细胞膜控制物质进出
  type: Concept
  subject: 生物
  title: 细胞膜控制物质进出
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为细胞膜能挡住一切有害物质，实际某些病毒也能侵入细胞。
    - 能指出并纠正这一错误：认为细胞膜只允许物质进入而不排出废物，实际代谢废物也会排出。
  aliases: []
  category: 生物学概念
  explanation: 细胞膜能够控制物质进出细胞，让需要的物质进入，把不需要的物质挡在外面，同时排出代谢废物。
  misconceptions:
    - 误以为细胞膜能挡住一切有害物质，实际某些病毒也能侵入细胞。
    - 认为细胞膜只允许物质进入而不排出废物，实际代谢废物也会排出。
    - 把细胞膜当成全透性膜，认为所有小分子都能自由进出。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:细胞质
  type: Concept
  subject: 生物
  title: 细胞质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为细胞质包含细胞核，实际细胞核是独立于细胞膜以内细胞核以外的区域。
    - 能指出并纠正这一错误：认为植物所有细胞质中都有叶绿体，如根尖细胞没有叶绿体。
  aliases: []
  category: 生物学概念
  explanation: 细胞膜以内、细胞核以外的部分，含有多种细胞器，如线粒体、叶绿体等。
  misconceptions:
    - 误以为细胞质包含细胞核，实际细胞核是独立于细胞膜以内细胞核以外的区域。
    - 认为植物所有细胞质中都有叶绿体，如根尖细胞没有叶绿体。
    - 把细胞质当成透明液体，忽略其中含有线粒体、叶绿体等细胞器。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:细菌
  type: Concept
  subject: 生物
  title: 细菌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为细菌有成形的细胞核，属于真核生物
    - 能指出并纠正这一错误：以为细菌通过孢子进行生殖
  aliases:
    - bacterium
  category: 生物学概念
  explanation: 单细胞原核生物，具有细胞壁、细胞膜、细胞质，无成形的细胞核，通过分裂生殖。
  misconceptions:
    - 认为细菌有成形的细胞核，属于真核生物
    - 以为细菌通过孢子进行生殖
    - 认为细菌是植物，含有叶绿体
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S2.md
- id: concept:生物:细菌与人类的关系
  type: Concept
  subject: 生物
  title: 细菌与人类的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为细菌对人类只有害处，如都会致病
    - 能指出并纠正这一错误：以为制酸奶是用霉菌发酵，而不是乳酸菌
  aliases: []
  category: 生物学应用
  explanation: 细菌既有有益方面（制醋、制酸奶、生产胰岛素、净化污水、产生沼气等），也有有害方面（引起疾病、使食物腐败）。
  misconceptions:
    - 认为细菌对人类只有害处，如都会致病
    - 以为制酸奶是用霉菌发酵，而不是乳酸菌
    - 认为净化污水靠复杂的多细胞生物，细菌没有作用
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S2.md
- id: concept:生物:细菌和真菌与人类的关系
  type: Concept
  subject: 生物
  title: 细菌和真菌与人类的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有细菌都对人体有害，忽略乳酸菌、双歧杆菌等有益菌可制作酸奶或维持肠道健康。
    - 能指出并纠正这一错误：认为真菌都致病，忽视酵母菌用于发酵馒头、蘑菇可食用。
  aliases: []
  category: 生物与人类
  explanation: 细菌和真菌既有有益的一面（如发酵、分解有机物），也有有害的一面（如致病），并非所有肠道细菌都有益。
  misconceptions:
    - 认为所有细菌都对人体有害，忽略乳酸菌、双歧杆菌等有益菌可制作酸奶或维持肠道健康。
    - 认为真菌都致病，忽视酵母菌用于发酵馒头、蘑菇可食用。
    - 认为肠道内的细菌都是有害的，事实上很多肠道细菌帮助消化，但不排除少数致病菌。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:细菌和真菌在自然界中的作用
  type: Concept
  subject: 生物
  title: 细菌和真菌在自然界中的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为细菌和真菌是生产者，能像植物一样进行光合作用制造有机物，实际它们是分解者。
    - 能指出并纠正这一错误：认为细菌和真菌把无机物合成为有机物，颠倒了方向，实际是将有机物分解为无机物。
  aliases:
    - 分解者作用
  category: 生物学概念
  explanation: 细菌和真菌作为分解者，将动植物遗体分解为无机物，促进物质循环。
  misconceptions:
    - 认为细菌和真菌是生产者，能像植物一样进行光合作用制造有机物，实际它们是分解者。
    - 认为细菌和真菌把无机物合成为有机物，颠倒了方向，实际是将有机物分解为无机物。
    - 认为只分解动植物遗体，忽略它们也分解动物排泄物和残枝落叶。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:结晶牛胰岛素的人工合成
  type: Concept
  subject: 生物
  title: 结晶牛胰岛素的人工合成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为我国人工合成的牛胰岛素是核酸，实际是蛋白质。
    - 能指出并纠正这一错误：认为人工合成的是整个牛胰岛细胞，实际是单纯的胰岛素分子。
  aliases:
    - 人工合成牛胰岛素
  category: 史实
  explanation: 1965年，我国科学家在世界上首次用人工方法合成了具有生物活性的蛋白质——结晶牛胰岛素。
  misconceptions:
    - 认为我国人工合成的牛胰岛素是核酸，实际是蛋白质。
    - 认为人工合成的是整个牛胰岛细胞，实际是单纯的胰岛素分子。
    - 误以为该成果是合成牛胰岛素基因，实际是直接合成蛋白质。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:结核病
  type: Concept
  subject: 生物
  title: 结核病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为结核病是由病毒引起的，实际是结核分枝杆菌。
    - 能指出并纠正这一错误：认为结核病只感染肺部，其实也可感染淋巴结、骨骼等。
  aliases: []
  category: 概念
  explanation: 由结核分枝杆菌引起的传染病，属于细菌性传染病。
  misconceptions:
    - 认为结核病是由病毒引起的，实际是结核分枝杆菌。
    - 认为结核病只感染肺部，其实也可感染淋巴结、骨骼等。
    - 把结核分枝杆菌当成真菌，因为都有“分枝”特征。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:结缔组织
  type: Concept
  subject: 生物
  title: 结缔组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为血液不是结缔组织，因它是液态而误判为其他组织
    - 能指出并纠正这一错误：把所有具有连接作用的组织都叫结缔组织，忽视骨、血液等具体类型
  aliases:
    - 结缔组织
  category: 生物学概念
  explanation: 种类很多，骨组织、血液等都属于结缔组织，具有支持、连接、保护、营养等功能。
  misconceptions:
    - 认为血液不是结缔组织，因它是液态而误判为其他组织
    - 把所有具有连接作用的组织都叫结缔组织，忽视骨、血液等具体类型
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:统一观测标准
  type: Concept
  subject: 生物
  title: 统一观测标准
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要用同一把刻度尺就满足统一标准，忽略读数时视线、估读方法也要一致。
    - 能指出并纠正这一错误：把统一观测标准混同于控制变量，认为实验组和对照组所有条件都相同就是统一标准。
  aliases:
    - 统一标准
  category: 科学方法
  explanation: 在观察和测量中设立统一的标准，以保证结果的可靠性和可比性。
  misconceptions:
    - 认为只要用同一把刻度尺就满足统一标准，忽略读数时视线、估读方法也要一致。
    - 把统一观测标准混同于控制变量，认为实验组和对照组所有条件都相同就是统一标准。
    - 认为统一标准后测量结果绝对精确，不会出现误差。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:维生素
  type: Concept
  subject: 生物
  title: 维生素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为维生素能提供能量，实际维生素不供能，需量很少但作用大。
    - 能指出并纠正这一错误：误认为维生素需要量越大越健康，实际过量可能中毒，适量即可。
  aliases: []
  category: 营养物质
  explanation: 维生素是人体不能合成或合成不足的有机物，需求量小但作用重要，缺乏时会影响健康。
  misconceptions:
    - 误认为维生素能提供能量，实际维生素不供能，需量很少但作用大。
    - 误认为维生素需要量越大越健康，实际过量可能中毒，适量即可。
    - 误认为人体能合成所有维生素，实际多数维生素需从食物中摄取。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:综合措施与重点措施相结合
  type: Concept
  subject: 生物
  title: 综合措施与重点措施相结合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为预防传染病必须对所有环节采取相同力度的措施，实际要抓主要环节。
    - 能指出并纠正这一错误：认为重点措施对所有传染病都一样，如艾滋病和流感重点不同。
  aliases: []
  category: 预防原则
  explanation: 预防传染病时，既要针对三个环节采取综合措施，又要根据不同病种特点抓住主要环节。
  misconceptions:
    - 认为预防传染病必须对所有环节采取相同力度的措施，实际要抓主要环节。
    - 认为重点措施对所有传染病都一样，如艾滋病和流感重点不同。
    - 认为综合措施与重点措施互相矛盾，实际需结合运用。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:绿水青山就是金山银山
  type: Concept
  subject: 生物
  title: 绿水青山就是金山银山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为要金山银山就必须牺牲绿水青山，两者不可兼得。
    - 能指出并纠正这一错误：只看到生态的经济效益，忽略生态本身的调节、支撑等非经济价值。
  aliases: []
  category: 生态理念
  explanation: 强调生态环境保护与经济发展相辅相成，绿水青山本身就是宝贵的财富。
  misconceptions:
    - 认为要金山银山就必须牺牲绿水青山，两者不可兼得。
    - 只看到生态的经济效益，忽略生态本身的调节、支撑等非经济价值。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:绿色水库
  type: Concept
  subject: 生物
  title: 绿色水库
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为绿色水库指森林能像人工水库一样直接蓄水成湖
    - 能指出并纠正这一错误：认为森林涵养水源只与根系有关，与落叶层和土壤无关
  aliases: []
  category: 生物学概念
  explanation: 森林能涵养水源、补充地下水，减缓雨水冲刷，因此被称为绿色水库。
  misconceptions:
    - 误以为绿色水库指森林能像人工水库一样直接蓄水成湖
    - 认为森林涵养水源只与根系有关，与落叶层和土壤无关
    - 将绿色水库等同于所有绿色植物，包括农田里的庄稼
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C3/sections/S4.md
- id: concept:生物:耳的结构
  type: Concept
  subject: 生物
  title: 耳的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为鼓膜属于外耳或内耳，实际鼓膜位于中耳。
    - 能指出并纠正这一错误：认为耳蜗是产生听觉的场所，混淆耳蜗和听觉中枢的功能。
  aliases:
    - 耳的组成
  category: 解剖结构
  explanation: 耳分为外耳、中耳和内耳，包括外耳道、鼓膜、听小骨、耳蜗等结构，各部分协同完成听觉功能。
  misconceptions:
    - 认为鼓膜属于外耳或内耳，实际鼓膜位于中耳。
    - 认为耳蜗是产生听觉的场所，混淆耳蜗和听觉中枢的功能。
    - 认为听小骨位于内耳，实际位于中耳，连接鼓膜和耳蜗。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:肌肉组织
  type: Concept
  subject: 生物
  title: 肌肉组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有肌肉组织都能随意收缩，忽略心肌、平滑肌不受意识控制
    - 能指出并纠正这一错误：把骨骼肌当成肌肉组织的唯一类型，忽略平滑肌和心肌
  aliases:
    - 肌肉组织
  category: 生物学概念
  explanation: 主要由肌细胞构成，具有收缩和舒张功能，能使机体产生运动，包括平滑肌、骨骼肌、心肌。
  misconceptions:
    - 误认为所有肌肉组织都能随意收缩，忽略心肌、平滑肌不受意识控制
    - 把骨骼肌当成肌肉组织的唯一类型，忽略平滑肌和心肌
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S2.md
- id: concept:生物:肌腱
  type: Concept
  subject: 生物
  title: 肌腱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肌腱能收缩和舒张，实际只有肌腹有收缩功能。
    - 能指出并纠正这一错误：误以为肌腱连接骨与骨，实际连接肌肉和骨。
  aliases: []
  category: 生物学概念
  explanation: 肌腱是骨骼肌两端较细的乳白色部分，可以绕过关节连在不同的骨上。
  misconceptions:
    - 认为肌腱能收缩和舒张，实际只有肌腹有收缩功能。
    - 误以为肌腱连接骨与骨，实际连接肌肉和骨。
    - 认为肌腱弹性强，像橡皮筋可拉长，实际肌腱韧性差。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:肌腹
  type: Concept
  subject: 生物
  title: 肌腹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肌腹是肌腱末端的膨大，实际位于骨骼肌中间。
    - 能指出并纠正这一错误：误以为肌腹不具收缩功能，主要起连接作用。
  aliases: []
  category: 生物学概念
  explanation: 肌腹是骨骼肌中间较粗的部分，具有收缩和舒张功能，内含血管和神经。
  misconceptions:
    - 认为肌腹是肌腱末端的膨大，实际位于骨骼肌中间。
    - 误以为肌腹不具收缩功能，主要起连接作用。
    - 认为肌腹内没有血管和神经，不需要能量供应。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:肺与外界的气体交换
  type: Concept
  subject: 生物
  title: 肺与外界的气体交换
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：吸气时误认为膈肌舒张、胸腔缩小，实际应收缩、扩大
    - 能指出并纠正这一错误：误认为呼气时肺内气压低于外界，实际是高于外界
  aliases:
    - 呼吸运动
  category: 生理学
  explanation: 通过呼吸运动（吸气和呼气）实现肺与外界的气体交换，吸气时膈肌收缩、胸腔扩大、肺内气压降低，呼气时相反。
  misconceptions:
    - 吸气时误认为膈肌舒张、胸腔缩小，实际应收缩、扩大
    - 误认为呼气时肺内气压低于外界，实际是高于外界
    - 认为胸廓扩大是由肺扩张引起的，实际是胸廓先变化肺才被动扩张
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S2.md
- id: concept:生物:肺循环
  type: Concept
  subject: 生物
  title: 肺循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将肺循环路线写成左心室→肺动脉→肺→肺静脉→右心房，起点和终点颠倒。
    - 能指出并纠正这一错误：误认为肺循环中血液流经肺部后，由动脉血变成静脉血，实际相反。
  aliases:
    - 小循环
  category: 生理学概念
  explanation: 肺循环是血液从右心室出发，经肺动脉流向肺部，再经肺静脉回到左心房的循环路径。
  misconceptions:
    - 误将肺循环路线写成左心室→肺动脉→肺→肺静脉→右心房，起点和终点颠倒。
    - 误认为肺循环中血液流经肺部后，由动脉血变成静脉血，实际相反。
    - 认为肺循环与体循环彼此独立，没有共同的连通点，实际在心脏处汇合。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S3.md
- id: concept:生物:肺泡
  type: Concept
  subject: 生物
  title: 肺泡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肺泡壁由多层细胞构成，不利于气体交换
    - 能指出并纠正这一错误：把肺泡当作支气管的直接分支，忽略细支气管末端
  aliases:
    - alveolus
  category: 解剖结构
  explanation: 肺泡是支气管最细分支末端的囊状结构，外面包绕着丰富的毛细血管，是气体交换的场所。
  misconceptions:
    - 认为肺泡壁由多层细胞构成，不利于气体交换
    - 把肺泡当作支气管的直接分支，忽略细支气管末端
    - 认为肺泡是消化系统结构，负责气体交换
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:肺泡与血液的气体交换
  type: Concept
  subject: 生物
  title: 肺泡与血液的气体交换
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写反方向：认为氧气从血液进入肺泡，二氧化碳从肺泡进入血液
    - 能指出并纠正这一错误：认为气体交换在肺泡内进行，与包绕的毛细血管无关
  aliases:
    - 气体交换
  category: 生理过程
  explanation: 肺泡中的氧气透过肺泡壁和毛细血管壁进入血液，血液中的二氧化碳进入肺泡，通过呼气排出。
  misconceptions:
    - 写反方向：认为氧气从血液进入肺泡，二氧化碳从肺泡进入血液
    - 认为气体交换在肺泡内进行，与包绕的毛细血管无关
    - 认为交换后静脉血变动脉血，但说氧含量降低
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C7/sections/S2.md
- id: concept:生物:肺活量
  type: Concept
  subject: 生物
  title: 肺活量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把肺活量当成肺能容纳的最大气体总量
    - 能指出并纠正这一错误：认为肺活量是平静呼吸一次进出肺的气体量
  aliases:
    - vital capacity
  category: 生理指标
  explanation: 肺活量是尽力吸气后再尽力呼气所能呼出的气体量，反映肺的通气能力。
  misconceptions:
    - 把肺活量当成肺能容纳的最大气体总量
    - 认为肺活量是平静呼吸一次进出肺的气体量
    - 测量肺活量时只吸不呼，数值偏大
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:肾上腺
  type: Concept
  subject: 生物
  title: 肾上腺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肾上腺素抑制心跳，使心率减慢
    - 能指出并纠正这一错误：认为肾上腺只在紧急情况分泌肾上腺素
  aliases: []
  category: 内分泌腺
  explanation: 分泌肾上腺素等，参与应激反应等调节。
  misconceptions:
    - 认为肾上腺素抑制心跳，使心率减慢
    - 认为肾上腺只在紧急情况分泌肾上腺素
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:肾上腺素
  type: Concept
  subject: 生物
  title: 肾上腺素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肾上腺素只由肾上腺髓质分泌，忽略肾上腺皮质也分泌其他激素
    - 能指出并纠正这一错误：把肾上腺素的作用与甲状腺激素混淆，甲状腺激素也提高兴奋性但作用不同
  aliases: []
  category: 激素
  explanation: 肾上腺素由肾上腺分泌，促使心跳加快、血压升高，提高神经系统兴奋性。
  misconceptions:
    - 认为肾上腺素只由肾上腺髓质分泌，忽略肾上腺皮质也分泌其他激素
    - 把肾上腺素的作用与甲状腺激素混淆，甲状腺激素也提高兴奋性但作用不同
    - 认为肾上腺素能降低血糖，实际是升高血糖
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:肾单位
  type: Concept
  subject: 生物
  title: 肾单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为肾单位是泌尿系统的一个器官，实际它是肾脏的结构功能单位。
    - 能指出并纠正这一错误：以为肾小球是血管球，不属于肾单位，其实肾小球就是肾单位的一部分。
  aliases: []
  category: 结构单位
  explanation: 肾脏结构和功能的基本单位是肾单位，包括肾小球、肾小囊和肾小管等部分。
  misconceptions:
    - 误认为肾单位是泌尿系统的一个器官，实际它是肾脏的结构功能单位。
    - 以为肾小球是血管球，不属于肾单位，其实肾小球就是肾单位的一部分。
    - 认为肾小囊是包在肾小管外面的，混淆肾小囊和肾小管的位置。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:肾小球的滤过作用
  type: Concept
  subject: 生物
  title: 肾小球的滤过作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为原尿中含有血细胞和大分子蛋白质，实际上它们不能滤过。
    - 能指出并纠正这一错误：误以为葡萄糖不会被滤过，实际上葡萄糖能滤过只是被重吸收。
  aliases:
    - 肾小球的过滤作用
    - 肾小球滤过作用
  category: 生理学
  explanation: 当血液流经肾小球时，除血细胞和大分子蛋白质外，血浆中的部分水、无机盐、葡萄糖和尿素等滤过到肾小囊中形成原尿。
  misconceptions:
    - 认为原尿中含有血细胞和大分子蛋白质，实际上它们不能滤过。
    - 误以为葡萄糖不会被滤过，实际上葡萄糖能滤过只是被重吸收。
    - 认为滤过作用发生在肾小管，实际在肾小球，混滑滤过与重吸收的位置。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:肾小管的重吸收作用
  type: Concept
  subject: 生物
  title: 肾小管的重吸收作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全部水和无机盐都被重吸收，实际上大部分水、部分无机盐被重吸收。
    - 能指出并纠正这一错误：误认为葡萄糖只被部分重吸收，健康人尿液中也含葡萄糖。
  aliases:
    - 肾小管重吸收
  category: 生理过程
  explanation: 原尿流经肾小管时，全部葡萄糖、大部分水和部分无机盐被重新吸收回血液，剩余物质形成尿液。
  misconceptions:
    - 认为全部水和无机盐都被重吸收，实际上大部分水、部分无机盐被重吸收。
    - 误认为葡萄糖只被部分重吸收，健康人尿液中也含葡萄糖。
    - 误以为尿素也能被肾小管重吸收回血液，实际尿素基本不被重吸收。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:肾的功能
  type: Concept
  subject: 生物
  title: 肾的功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肾只能形成尿液，不能排出其他废物，实际还能排出多余无机盐和水。
    - 能指出并纠正这一错误：误认为尿液是在膀胱中由肾产生的，膀胱负责排尿，实际肾生成尿液，膀胱储存。
  aliases: []
  category: 生理学
  explanation: 肾是人体重要器官，负责排出体内废物，维持正常代谢。
  misconceptions:
    - 认为肾只能形成尿液，不能排出其他废物，实际还能排出多余无机盐和水。
    - 误认为尿液是在膀胱中由肾产生的，膀胱负责排尿，实际肾生成尿液，膀胱储存。
    - 认为肾是消化器官，能将食物残渣变成尿液排出，实际属于泌尿系统。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:肾移植
  type: Concept
  subject: 生物
  title: 肾移植
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肾移植是尿毒症的唯一治疗办法，透析只能暂缓不能长期维持，实际透析可长期维持。
    - 能指出并纠正这一错误：认为只要找到健康肾就能移植，无需配型，实际必须进行免疫匹配。
  aliases:
    - 肾脏移植
  category: 医学技术
  explanation: 将健康者的肾移植到丧失肾功能的患者体内，是治疗肾衰竭的最佳方案。
  misconceptions:
    - 认为肾移植是尿毒症的唯一治疗办法，透析只能暂缓不能长期维持，实际透析可长期维持。
    - 认为只要找到健康肾就能移植，无需配型，实际必须进行免疫匹配。
    - 认为术后不用吃抗排异药，肾移植后身体会完全适应，实际需长期服药。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:肾衰竭
  type: Concept
  subject: 生物
  title: 肾衰竭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为肾衰竭患者尿量会增多，以便排出更多废物，实际少尿或无尿。
    - 能指出并纠正这一错误：认为肾衰竭时血液中尿素废物减少，因为肾脏不排了，实际废物在体内堆积。
  aliases:
    - 肾功能衰竭
  category: 病理学
  explanation: 肾功能丧失，无法排出废物，导致中毒甚至死亡。
  misconceptions:
    - 认为肾衰竭患者尿量会增多，以便排出更多废物，实际少尿或无尿。
    - 认为肾衰竭时血液中尿素废物减少，因为肾脏不排了，实际废物在体内堆积。
    - 认为肾衰竭和尿毒症是一回事，实际上尿毒症是肾衰竭的晚期阶段。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:胃蛋白酶
  type: Concept
  subject: 生物
  title: 胃蛋白酶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为胃蛋白酶能分解淀粉和脂肪，把它当万能消化酶
    - 能指出并纠正这一错误：说胃蛋白酶将蛋白质彻底分解为氨基酸
  aliases: []
  category: 酶
  explanation: 胃液中的胃蛋白酶对蛋白质进行初步分解。
  misconceptions:
    - 认为胃蛋白酶能分解淀粉和脂肪，把它当万能消化酶
    - 说胃蛋白酶将蛋白质彻底分解为氨基酸
    - 误以为胃蛋白酶在口腔中分泌并起作用
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:胎生和哺乳
  type: Concept
  subject: 生物
  title: 胎生和哺乳
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有哺乳动物都是胎生，忽略鸭嘴兽等卵生动物
    - 能指出并纠正这一错误：误以为蝙蝠是鸟类，能飞所以不是哺乳动物
  aliases:
    - 胎生
    - 哺乳
  category: 生物学概念
  explanation: 绝大多数哺乳动物的胚胎在母体内发育，从母体获得营养，产出后由母体用乳汁哺育，提高了后代的成活率。
  misconceptions:
    - 认为所有哺乳动物都是胎生，忽略鸭嘴兽等卵生动物
    - 误以为蝙蝠是鸟类，能飞所以不是哺乳动物
    - 认为鲸生活在水中，属于鱼类而不是哺乳动物
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:胎盘
  type: Concept
  subject: 生物
  title: 胎盘
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为胎儿与母体血液直接相通，实际需经胎盘交换物质，血液不混合。
    - 能指出并纠正这一错误：误认为胎盘是胎儿的一部分，实际胎盘由胎儿和母体组织共同构成，分娩后排出。
  aliases: []
  category: 人体结构
  explanation: 胎儿和母体交换物质的器官，通过脐带与胎儿相连，内含绒毛和毛细血管。
  misconceptions:
    - 误认为胎儿与母体血液直接相通，实际需经胎盘交换物质，血液不混合。
    - 误认为胎盘是胎儿的一部分，实际胎盘由胎儿和母体组织共同构成，分娩后排出。
    - 误认为脐带就是胎盘，实际脐带连接胎儿和胎盘，是输送物质的通道。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:胚盘
  type: Concept
  subject: 生物
  title: 胚盘
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为胚盘是卵白中的白色絮状物，实际它位于卵黄表面中央。
    - 能指出并纠正这一错误：误以为胚盘就是已发育的胚胎，实际它是含细胞核的盘状结构，受精后才发育。
  aliases: []
  category: 鸟卵结构
  explanation: 卵黄表面中央的盘状小白点，含有细胞核，是胚胎发育的部位。
  misconceptions:
    - 误认为胚盘是卵白中的白色絮状物，实际它位于卵黄表面中央。
    - 误以为胚盘就是已发育的胚胎，实际它是含细胞核的盘状结构，受精后才发育。
    - 认为鸟卵中每个胚盘都能孵化出雏鸟，忽略未受精的胚盘不能发育。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:胚胎发育
  type: Concept
  subject: 生物
  title: 胚胎发育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为受精卵在子宫内开始分裂，实际在输卵管内分裂形成胚泡后才着床。
    - 能指出并纠正这一错误：误认为发育顺序是受精卵→胚胎→胚泡→胎儿，实际应为受精卵→胚泡→胚胎→胎儿。
  aliases: []
  category: 生理过程
  explanation: 受精卵经过细胞分裂和分化，逐渐发育成胚泡、胚胎、胎儿，直至成熟的过程。
  misconceptions:
    - 误认为受精卵在子宫内开始分裂，实际在输卵管内分裂形成胚泡后才着床。
    - 误认为发育顺序是受精卵→胚胎→胚泡→胎儿，实际应为受精卵→胚泡→胚胎→胎儿。
    - 误认为胚泡就是胎儿，实际胚泡是早期胚胎阶段，需继续分化才能形成胎儿。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:胰岛
  type: Concept
  subject: 生物
  title: 胰岛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把胰岛当作整个胰腺，认为‘胰腺就是胰岛’，实际胰岛只是胰腺内的内分泌细胞团。
    - 能指出并纠正这一错误：误认为胰岛素由胰腺直接分泌，忽略胰岛中的B细胞，将外分泌腺与内分泌功能混为一谈。
  aliases: []
  category: 内分泌腺
  explanation: 位于胰腺中，分泌胰岛素等，调节血糖浓度。
  misconceptions:
    - 把胰岛当作整个胰腺，认为‘胰腺就是胰岛’，实际胰岛只是胰腺内的内分泌细胞团。
    - 误认为胰岛素由胰腺直接分泌，忽略胰岛中的B细胞，将外分泌腺与内分泌功能混为一谈。
    - 认为胰岛只分泌胰岛素，忽视它还能分泌胰高血糖素等激素，属于以偏概全。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:胰岛素
  type: Concept
  subject: 生物
  title: 胰岛素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为胰岛素分泌过多导致糖尿病
    - 能指出并纠正这一错误：认为胰岛素能升高血糖浓度
  aliases: []
  category: 激素
  explanation: 由胰岛分泌，降低血糖浓度，缺乏导致糖尿病。
  misconceptions:
    - 认为胰岛素分泌过多导致糖尿病
    - 认为胰岛素能升高血糖浓度
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:胸外按压
  type: Concept
  subject: 生物
  title: 胸外按压
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为胸外按压位置在左胸心尖处，实际应在胸骨中下段
    - 能指出并纠正这一错误：认为按压深度越深越好，超过6厘米易致肋骨骨折
  aliases: []
  category: 急救技能
  explanation: 心肺复苏的关键步骤，按压深度5-6厘米，频率100-120次/分。
  misconceptions:
    - 认为胸外按压位置在左胸心尖处，实际应在胸骨中下段
    - 认为按压深度越深越好，超过6厘米易致肋骨骨折
    - 按压时手臂弯曲或肘部离床，导致按压力度不足
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:能量流动
  type: Concept
  subject: 生物
  title: 能量流动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为能量沿食物链可以循环利用，实际是单向流动、逐级递减
    - 能指出并纠正这一错误：误认为相邻营养级间能量传递效率恒定，实际因食物链不同而有差异
  aliases:
    - 能量流动
  category: 生态学概念
  explanation: 生态系统中能量的输入、传递、转化和散失的过程，能量沿食物链单向流动、逐级递减。
  misconceptions:
    - 误认为能量沿食物链可以循环利用，实际是单向流动、逐级递减
    - 误认为相邻营养级间能量传递效率恒定，实际因食物链不同而有差异
    - 把呼吸作用消耗的能量计入传给下一营养级的能量
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:能量流动和物质循环
  type: Concept
  subject: 生物
  title: 能量流动和物质循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为能量沿食物链可以循环利用，违背逐级递减原则。
    - 能指出并纠正这一错误：误以为物质在生物与环境间单向流动，而非循环往复。
  aliases: []
  category: 生态学
  explanation: 能量流动和物质循环是生态系统的基本功能，能量沿食物链单向流动、逐级递减，物质在生物与环境之间循环往复。
  misconceptions:
    - 认为能量沿食物链可以循环利用，违背逐级递减原则。
    - 误以为物质在生物与环境间单向流动，而非循环往复。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:能量转换器
  type: Concept
  subject: 生物
  title: 能量转换器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为线粒体将光能转变成化学能，实际是叶绿体进行光合作用。
    - 能指出并纠正这一错误：认为动物细胞也有叶绿体作为能量转换器，实际动物细胞只有线粒体。
  aliases: []
  category: 生物学概念
  explanation: 细胞中能够进行能量转换的结构，包括叶绿体和线粒体。
  misconceptions:
    - 误认为线粒体将光能转变成化学能，实际是叶绿体进行光合作用。
    - 认为动物细胞也有叶绿体作为能量转换器，实际动物细胞只有线粒体。
    - 将细胞核当作能量转换器，实际能量转换器是叶绿体和线粒体。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:脂肪性肝炎
  type: Concept
  subject: 生物
  title: 脂肪性肝炎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为脂肪性肝炎具有传染性，会通过接触传播给别人。
    - 能指出并纠正这一错误：认为只有过量饮酒才会得脂肪性肝炎，忽略肥胖、糖尿病等也可导致。
  aliases: []
  category: 概念
  explanation: 由肝细胞内脂肪沉积过多导致的肝病，不具有传染性。
  misconceptions:
    - 认为脂肪性肝炎具有传染性，会通过接触传播给别人。
    - 认为只有过量饮酒才会得脂肪性肝炎，忽略肥胖、糖尿病等也可导致。
    - 把脂肪性肝炎与病毒性肝炎混为一谈，认为其也由肝炎病毒引起。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:脂质
  type: Concept
  subject: 生物
  title: 脂质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为脂质就是脂肪，实际脂质还包括磷脂、固醇等。
    - 能指出并纠正这一错误：误认为脂质是主要供能物质，实际脂质是备用能源物质，糖类才是主要供能物质。
  aliases:
    - 脂肪
  category: 营养物质
  explanation: 脂质包括脂肪等，是人体重要的备用能源物质，储存在体内，可在食物摄入不足时提供能量。
  misconceptions:
    - 误认为脂质就是脂肪，实际脂质还包括磷脂、固醇等。
    - 误认为脂质是主要供能物质，实际脂质是备用能源物质，糖类才是主要供能物质。
    - 误认为脂肪可直接供能，实际需先分解为甘油和脂肪酸等才能利用。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S1.md
- id: concept:生物:脊椎动物
  type: Concept
  subject: 生物
  title: 脊椎动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为脊椎动物都是胎生哺乳，鱼类和爬行类其实是卵生。
    - 能指出并纠正这一错误：认为脊椎动物都有四肢，鱼和蛇没有四肢，所以不是脊椎动物。
  aliases: []
  category: 生物概念
  explanation: 身体内有由脊椎骨组成的脊柱的动物，如鱼、哺乳动物等。
  misconceptions:
    - 认为脊椎动物都是胎生哺乳，鱼类和爬行类其实是卵生。
    - 认为脊椎动物都有四肢，鱼和蛇没有四肢，所以不是脊椎动物。
    - 误认为水里的动物都是脊椎动物，比如海蜇、河蚌其实不是。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:脊髓
  type: Concept
  subject: 生物
  title: 脊髓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为脊髓只传导信号，不完成任何反射
    - 能指出并纠正这一错误：把膝跳反射的中枢说成大脑，实际在脊髓
  aliases: []
  category: 器官结构
  explanation: 脊髓能对刺激作出有规律的反应，并传导刺激到大脑，是脑与躯干、内脏的联系通路。
  misconceptions:
    - 认为脊髓只传导信号，不完成任何反射
    - 把膝跳反射的中枢说成大脑，实际在脊髓
    - 分不清脊髓和脊神经，脊髓是中枢，脊神经是周围
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:脐带
  type: Concept
  subject: 生物
  title: 脐带
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把脐带说成连接母体和胎儿的管道，实际是连接胎儿和胎盘。
    - 能指出并纠正这一错误：认为脐带内含一条动脉和一条静脉，实际是两条动脉一条静脉。
  aliases: []
  category: 人体结构
  explanation: 连接胎儿和胎盘的管道，内含血管，用于运输营养物质和代谢废物。
  misconceptions:
    - 把脐带说成连接母体和胎儿的管道，实际是连接胎儿和胎盘。
    - 认为脐带内含一条动脉和一条静脉，实际是两条动脉一条静脉。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:脑干
  type: Concept
  subject: 生物
  title: 脑干
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为脑干控制随意运动，实际是心跳呼吸中枢
    - 能指出并纠正这一错误：混淆脑干和脊髓，以为脑干也负责反射传导
  aliases: []
  category: 器官结构
  explanation: 脑干是脑的一部分，下部与脊髓连接，含有调节心跳、呼吸等基本生命活动的中枢。
  misconceptions:
    - 认为脑干控制随意运动，实际是心跳呼吸中枢
    - 混淆脑干和脊髓，以为脑干也负责反射传导
    - 误以为脑干受损还能正常呼吸，实际立即危机生命
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:膈肌
  type: Concept
  subject: 生物
  title: 膈肌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为吸气时膈肌舒张、顶部上升，呼气时收缩下降
    - 能指出并纠正这一错误：把膈肌当成消化系统的肌肉，与呼吸无关
  aliases:
    - diaphragm
  category: 解剖结构
  explanation: 膈是位于胸腔和腹腔之间的肌肉结构，膈肌收缩时膈顶部下降，舒张时上升，参与呼吸运动。
  misconceptions:
    - 认为吸气时膈肌舒张、顶部上升，呼气时收缩下降
    - 把膈肌当成消化系统的肌肉，与呼吸无关
    - 认为只有膈肌收缩呼吸，忽略肋间肌等参与
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:膝跳反射
  type: Concept
  subject: 生物
  title: 膝跳反射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为膝跳反射必须经过大脑，不知是脊髓反射
    - 能指出并纠正这一错误：把叩击部位说成膝盖骨，实际是下方韧带
  aliases: []
  category: 反射类型
  explanation: 膝跳反射是一种简单的反射，通过叩击膝盖下方的韧带引起小腿突然抬起，用于检查神经系统功能。
  misconceptions:
    - 认为膝跳反射必须经过大脑，不知是脊髓反射
    - 把叩击部位说成膝盖骨，实际是下方韧带
    - 写反反射弧顺序，先效应器后感受器
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:膳食纤维
  type: Concept
  subject: 生物
  title: 膳食纤维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为膳食纤维能被消化吸收并提供能量，实际它促进肠道蠕动，不被消化。
    - 能指出并纠正这一错误：把膳食纤维归为维生素一类，实际它是植物细胞壁成分，属于糖类。
  aliases:
    - 纤维素
  category: 营养物质
  explanation: 膳食纤维是植物细胞壁的主要成分，包括纤维素、果胶等，能促进肠道蠕动，被称为“第七类营养素”。
  misconceptions:
    - 认为膳食纤维能被消化吸收并提供能量，实际它促进肠道蠕动，不被消化。
    - 把膳食纤维归为维生素一类，实际它是植物细胞壁成分，属于糖类。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S1.md
- id: concept:生物:自然保护区
  type: Concept
  subject: 生物
  title: 自然保护区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为建立自然保护区的目的是开发旅游资源，忽视其保护本质
    - 能指出并纠正这一错误：认为保护区内严禁一切人类活动，包括科学研究和生态监测
  aliases: []
  category: 生态保护
  explanation: 为保护典型生态系统、珍稀濒危野生动植物等而划定的特殊保护区域。
  misconceptions:
    - 认为建立自然保护区的目的是开发旅游资源，忽视其保护本质
    - 认为保护区内严禁一切人类活动，包括科学研究和生态监测
    - 认为自然保护区只保护珍稀动物，不保护典型生态系统和湿地
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:自然保护地体系
  type: Concept
  subject: 生物
  title: 自然保护地体系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为国家公园是唯一主体，忽略自然保护区的基础地位。
    - 能指出并纠正这一错误：将各类自然公园说成主体，搞错主次关系。
  aliases:
    - 自然保护地
  category: 保护措施
  explanation: 我国构建以国家公园为主体、自然保护区为基础、各类自然公园为补充的自然保护地体系。
  misconceptions:
    - 误以为国家公园是唯一主体，忽略自然保护区的基础地位。
    - 将各类自然公园说成主体，搞错主次关系。
    - 认为自然保护地体系只包括国家公园，不包括其他类型。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:自然恢复为主、自然恢复与人工修复相结合
  type: Concept
  subject: 生物
  title: 自然恢复为主、自然恢复与人工修复相结合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自然恢复为主就是完全放任不管，拒绝任何人工干预措施
    - 能指出并纠正这一错误：在修复过程中优先采用人工造林等干预方式，忽视自然恢复能力
  aliases: []
  category: 生态修复方法
  explanation: 在生态修复中，优先依靠自然力量恢复，同时结合人工干预措施，实现系统治理。
  misconceptions:
    - 认为自然恢复为主就是完全放任不管，拒绝任何人工干预措施
    - 在修复过程中优先采用人工造林等干预方式，忽视自然恢复能力
    - 把人工修复措施当成主导，只在人工修复失败后才考虑自然恢复
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:自然选择
  type: Concept
  subject: 生物
  title: 自然选择
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为是生物为了适应环境主动改变，如长颈鹿努力伸脖子导致脖子变长
    - 能指出并纠正这一错误：把自然选择等同于用进废退，认为长期使用的器官可以遗传给后代
  aliases:
    - 自然选择学说
  category: 生物学概念
  explanation: 自然界中的生物，通过激烈的生存斗争，适应者生存，不适应者被淘汰，这就是自然选择。
  misconceptions:
    - 认为是生物为了适应环境主动改变，如长颈鹿努力伸脖子导致脖子变长
    - 把自然选择等同于用进废退，认为长期使用的器官可以遗传给后代
    - 认为自然选择只能由环境改变引起，环境不变时自然选择就停止
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:自然选择学说
  type: Concept
  subject: 生物
  title: 自然选择学说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为变异是定向的，环境直接决定生物变异方向
    - 能指出并纠正这一错误：忽视过度繁殖在自然选择学说中的地位，认为核心只有适者生存
  aliases:
    - 自然选择
  category: 生物学理论
  explanation: 由达尔文提出的解释生物进化的理论，主要内容包括过度繁殖、生存斗争、遗传变异和适者生存。
  misconceptions:
    - 认为变异是定向的，环境直接决定生物变异方向
    - 忽视过度繁殖在自然选择学说中的地位，认为核心只有适者生存
    - 认为自然选择学说中的'生存斗争'不包括生物与恶劣环境的斗争
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:艾滋病
  type: Concept
  subject: 生物
  title: 艾滋病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为艾滋病病毒会通过蚊虫叮咬传播，实际不会。
    - 能指出并纠正这一错误：认为从HIV感染到发病期没有传染性，实际上整个期间都有传染性。
  aliases:
    - 获得性免疫缺陷综合征
  category: 概念
  explanation: 由人类免疫缺陷病毒（HIV）引起的获得性免疫缺陷综合征，属于病毒性传染病。
  misconceptions:
    - 认为艾滋病病毒会通过蚊虫叮咬传播，实际不会。
    - 认为从HIV感染到发病期没有传染性，实际上整个期间都有传染性。
    - 认为艾滋病是细菌感染，所以用抗生素能治愈。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S4.md
- id: concept:生物:节肢动物
  type: Concept
  subject: 生物
  title: 节肢动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为外骨骼可以随身体生长，忘记了蜕皮现象。
    - 能指出并纠正这一错误：把蜘蛛、蜈蚣当昆虫，因为它们身体分节且有外骨骼。
  aliases: []
  category: 生物类群
  explanation: 体表有坚韧的外骨骼，身体和附肢都分节，是种类最多的动物类群，如昆虫、蜘蛛、虾、蟹。
  misconceptions:
    - 认为外骨骼可以随身体生长，忘记了蜕皮现象。
    - 把蜘蛛、蜈蚣当昆虫，因为它们身体分节且有外骨骼。
    - 以为节肢动物都生活在陆地上，其实虾蟹是水生的。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:芽孢
  type: Concept
  subject: 生物
  title: 芽孢
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为芽孢是细菌的生殖细胞，能繁殖成新细菌
    - 能指出并纠正这一错误：以为芽孢是细菌在营养充足时产生的，帮助细菌繁殖
  aliases: []
  category: 生物学概念
  explanation: 细菌在不良环境下形成的休眠体，对高温、干旱等有很强抵抗力。
  misconceptions:
    - 认为芽孢是细菌的生殖细胞，能繁殖成新细菌
    - 以为芽孢是细菌在营养充足时产生的，帮助细菌繁殖
    - 将芽孢与荚膜混淆，认为是细菌的保护性结构
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S2.md
- id: concept:生物:芽的发育
  type: Concept
  subject: 生物
  title: 芽的发育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为叶芽只发育成叶，不发育成茎，因此无法形成枝条。
    - 能指出并纠正这一错误：误认为花芽也能发育成枝条，混合芽只发育成花或叶。
  aliases:
    - 芽的发育
  category: 生物学概念
  explanation: 叶芽中的分生组织分裂分化形成枝条，芽分为叶芽、花芽和混合芽。
  misconceptions:
    - 认为叶芽只发育成叶，不发育成茎，因此无法形成枝条。
    - 误认为花芽也能发育成枝条，混合芽只发育成花或叶。
    - 把所有芽都当作叶芽，不知道还有花芽和混合芽。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:苔藓植物
  type: Concept
  subject: 生物
  title: 苔藓植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把苔藓的假根当作真正的根，认为它能吸收水分。
    - 能指出并纠正这一错误：误以为苔藓有导管和叶脉，所以能长得很高大。
  aliases: []
  category: 生物类群
  explanation: 苔藓植物大多生活在陆地上的阴湿环境中，一般矮小，有类似茎和叶的分化，但无导管和叶脉，根为假根，繁殖过程离不开水。
  misconceptions:
    - 把苔藓的假根当作真正的根，认为它能吸收水分。
    - 误以为苔藓有导管和叶脉，所以能长得很高大。
    - 认为苔藓通过种子繁殖，实际靠孢子繁殖后代。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:草原生态系统
  type: Concept
  subject: 生物
  title: 草原生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为草原生态系统分布在湿润地区，实际在干旱/半干旱地区。
    - 能指出并纠正这一错误：误认为草原生态系统以高大乔木为主，实际缺乏高大植物。
  aliases: []
  category: 生态系统类型
  explanation: 多分布在干旱与半干旱地区，年降水量较少，缺乏高大植物，在保持水土和防风固沙方面起重要作用。
  misconceptions:
    - 误认为草原生态系统分布在湿润地区，实际在干旱/半干旱地区。
    - 误认为草原生态系统以高大乔木为主，实际缺乏高大植物。
    - 误认为草原生态系统在防风固沙方面没有作用，实际作用重要。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:草履虫的结构
  type: Concept
  subject: 生物
  title: 草履虫的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为草履虫有神经系统，能像多细胞动物一样完成反射
    - 能指出并纠正这一错误：把收集管当作排泄器官，实际收集管收集废物排入伸缩泡再排出
  aliases:
    - 草履虫
  category: 生物学概念
  explanation: 草履虫是单细胞生物，具有纤毛、表膜、口沟、食物泡、收集管、胞肛等结构，能完成运动、呼吸、消化、排泄等生命活动。
  misconceptions:
    - 误认为草履虫有神经系统，能像多细胞动物一样完成反射
    - 把收集管当作排泄器官，实际收集管收集废物排入伸缩泡再排出
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S4.md
- id: concept:生物:草履虫的结构与功能
  type: Concept
  subject: 生物
  title: 草履虫的结构与功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为草履虫通过口沟进行气体交换，实际气体交换靠表膜
    - 能指出并纠正这一错误：误认为草履虫的细胞核只有一个，实际有大核和小核之分
  aliases: []
  category: 生物学事实
  explanation: 草履虫是单细胞生物，具有口沟、表膜、细胞核等结构，能完成获取食物、气体交换、应激性等生命活动。
  misconceptions:
    - 认为草履虫通过口沟进行气体交换，实际气体交换靠表膜
    - 误认为草履虫的细胞核只有一个，实际有大核和小核之分
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S4.md
- id: concept:生物:荚膜
  type: Concept
  subject: 生物
  title: 荚膜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为荚膜是细菌的运动结构（实际是保护作用，运动靠鞭毛）
    - 能指出并纠正这一错误：认为所有细菌都有荚膜（实际只有部分细菌具有）
  aliases: []
  category: 生物学结构
  explanation: 某些细菌细胞壁外的一层结构，有保护作用，与致病性有关。
  misconceptions:
    - 认为荚膜是细菌的运动结构（实际是保护作用，运动靠鞭毛）
    - 认为所有细菌都有荚膜（实际只有部分细菌具有）
    - 认为荚膜是细菌细胞壁的一部分，两者功能相同（荚膜是细胞壁外的独立结构）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S2.md
- id: concept:生物:药品说明书
  type: Concept
  subject: 生物
  title: 药品说明书
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为药品说明书没用，不看就直接服药。
    - 能指出并纠正这一错误：擅自改变说明书上的用法用量，如加倍剂量。
  aliases: []
  category: 医学常识
  explanation: 药品说明书是指导用药的重要文件，包含药品名称、成分、性状、适应证、规格、用法用量、不良反应、药物相互作用、注意事项、储藏条件、生产日期、有效期等信息，使用前应认真阅读以确保用药安全。
  misconceptions:
    - 认为药品说明书没用，不看就直接服药。
    - 擅自改变说明书上的用法用量，如加倍剂量。
    - 忽略说明书中的不良反应和禁忌，吃了才后悔。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:药物不良反应
  type: Concept
  subject: 生物
  title: 药物不良反应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将药品过期、变质引起的中毒也算作药物不良反应
    - 能指出并纠正这一错误：认为只有西药才有不良反应，中草药天然无毒
  aliases: []
  category: 医学常识
  explanation: 药物不良反应是指合格药品在正常用法用量下出现的与用药目的无关的有害反应。
  misconceptions:
    - 误将药品过期、变质引起的中毒也算作药物不良反应
    - 认为只有西药才有不良反应，中草药天然无毒
    - 把药物不良反应与副作用等同，认为所有反应都可预知
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:药物误用和滥用
  type: Concept
  subject: 生物
  title: 药物误用和滥用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有吸毒才算药物滥用，实际不按医嘱过量使用或频繁用抗生素也是滥用。
    - 能指出并纠正这一错误：觉得药物误用只是偶尔吃错一次，实际不按说明书服用处方药同样属于误用。
  aliases: []
  category: 医学常识
  explanation: 药物误用是指不按医嘱或说明书用药，滥用是指无指征或过量使用药物，两者都可能延误治疗、加重病情。
  misconceptions:
    - 认为只有吸毒才算药物滥用，实际不按医嘱过量使用或频繁用抗生素也是滥用。
    - 觉得药物误用只是偶尔吃错一次，实际不按说明书服用处方药同样属于误用。
    - 症状稍有好转就自行停药，导致病情复发或细菌产生耐药性。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:菌丝
  type: Concept
  subject: 生物
  title: 菌丝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为菌丝是单细胞结构（实际由许多细胞连接而成）
    - 能指出并纠正这一错误：认为气生菌丝深入基质吸收营养，营养菌丝长出表面产生孢子（功能颠倒）
  aliases: []
  category: 生物概念
  explanation: 菌丝是真菌的基本结构单位，由许多细胞连接而成，分为气生菌丝和营养菌丝。
  misconceptions:
    - 认为菌丝是单细胞结构（实际由许多细胞连接而成）
    - 认为气生菌丝深入基质吸收营养，营养菌丝长出表面产生孢子（功能颠倒）
    - 认为菌丝是细菌特有的结构，真菌没有菌丝（实际菌丝是真菌的基本结构）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:菌落
  type: Concept
  subject: 生物
  title: 菌落
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一个菌落就是一个细菌（实际是大量细菌或真菌的集合）
    - 能指出并纠正这一错误：认为菌落只能由单个细菌繁殖而来（概念上可由一个或多个繁殖）
  aliases: []
  category: 生物学概念
  explanation: 由一个或多个细菌或真菌繁殖后形成的肉眼可见的子细胞群体。
  misconceptions:
    - 认为一个菌落就是一个细菌（实际是大量细菌或真菌的集合）
    - 认为菌落只能由单个细菌繁殖而来（概念上可由一个或多个繁殖）
    - 认为菌落是微观结构，肉眼不可见（实际肉眼可见）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S1.md
- id: concept:生物:营养物质的吸收
  type: Concept
  subject: 生物
  title: 营养物质的吸收
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把吸收当成消化过程，认为吸收就是食物被磨碎
    - 能指出并纠正这一错误：认为吸收主要发生在胃，小肠只负责消化
  aliases:
    - 吸收
  category: 人体生理学
  explanation: 食物中的营养成分经过消化后，通过消化道黏膜进入血液或淋巴的过程。
  misconceptions:
    - 把吸收当成消化过程，认为吸收就是食物被磨碎
    - 认为吸收主要发生在胃，小肠只负责消化
    - 认为大肠不吸收任何物质，水都靠小肠吸收
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:营养生殖
  type: Concept
  subject: 生物
  title: 营养生殖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将马铃薯种子繁殖视为营养生殖，实际营养生殖利用块茎等营养器官。
    - 能指出并纠正这一错误：认为营养生殖产生的后代具有双亲遗传物质，实际是无性生殖，后代与母体相同。
  aliases:
    - 营养繁殖
  category: 生殖方式
  explanation: 植物通过营养器官（根、茎、叶）进行繁殖的无性生殖方式，如椒草、竹、马铃薯。
  misconceptions:
    - 误将马铃薯种子繁殖视为营养生殖，实际营养生殖利用块茎等营养器官。
    - 认为营养生殖产生的后代具有双亲遗传物质，实际是无性生殖，后代与母体相同。
    - 误以为椒草用叶繁殖属于有性生殖，忽略其属于营养生殖中的扦插方式。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:营养菌丝
  type: Concept
  subject: 生物
  title: 营养菌丝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为营养菌丝暴露在空气中，负责产生孢子（实际深入基质吸收营养）
    - 能指出并纠正这一错误：认为营养菌丝只起固定作用，不吸收有机养料（实际是主要吸收结构）
  aliases: []
  category: 生物概念
  explanation: 营养菌丝是深入营养基质内部的菌丝，能吸收有机物供真菌利用。
  misconceptions:
    - 认为营养菌丝暴露在空气中，负责产生孢子（实际深入基质吸收营养）
    - 认为营养菌丝只起固定作用，不吸收有机养料（实际是主要吸收结构）
    - 认为营养菌丝与气生菌丝形态和功能完全相同（实际不同，营养菌丝在基质内）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:蒸腾作用
  type: Concept
  subject: 生物
  title: 蒸腾作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蒸腾作用只对植物有害，会让植物缺水干枯
    - 能指出并纠正这一错误：以为蒸腾作用只是为了散热，不能拉动水和无机盐上升
  aliases: []
  category: 生物学概念
  explanation: 植物通过蒸腾作用将水分散失到大气中，提高大气湿度，增加降水，参与水循环。
  misconceptions:
    - 认为蒸腾作用只对植物有害，会让植物缺水干枯
    - 以为蒸腾作用只是为了散热，不能拉动水和无机盐上升
    - 误认为无机盐能随水从气孔蒸腾出去，叶片会缺无机盐
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:蕨类植物
  type: Concept
  subject: 生物
  title: 蕨类植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为蕨类能开花结果，实际它们不开花、不结种子。
    - 能指出并纠正这一错误：认为蕨类没有输导组织，与苔藓一样，实际有输导组织。
  aliases: []
  category: 生物类群
  explanation: 蕨类植物有根、茎、叶的分化，有输导组织，不结种子，通过孢子繁殖。
  misconceptions:
    - 误认为蕨类能开花结果，实际它们不开花、不结种子。
    - 认为蕨类没有输导组织，与苔藓一样，实际有输导组织。
    - 把孢子囊当种子，以为孢子就是种子。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:薄壁组织
  type: Concept
  subject: 生物
  title: 薄壁组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有薄壁组织都含叶绿体，实际果实和种子中的薄壁组织不含叶绿体
    - 能指出并纠正这一错误：把输导组织当成薄壁组织，因为都存在于根茎叶中但结构和功能不同
  aliases:
    - 薄壁组织
  category: 生物学概念
  explanation: 根、茎、叶、花、果实、种子中都含有大量的薄壁组织，细胞壁薄，液泡较大，含有叶绿体的薄壁组织细胞能进行光合作用，果实和种子中的薄壁组织细胞能够储存营养物质。
  misconceptions:
    - 认为所有薄壁组织都含叶绿体，实际果实和种子中的薄壁组织不含叶绿体
    - 把输导组织当成薄壁组织，因为都存在于根茎叶中但结构和功能不同
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S3.md
- id: concept:生物:藻类
  type: Concept
  subject: 生物
  title: 藻类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海带有根、茎、叶，其实它的固着器只是假根。
    - 能指出并纠正这一错误：误以为藻类都是绿色，红藻、褐藻也有颜色。
  aliases: []
  category: 生物类群
  explanation: 藻类是能进行光合作用的结构简单的生物，没有根、茎、叶的分化，多生活在水中。
  misconceptions:
    - 认为海带有根、茎、叶，其实它的固着器只是假根。
    - 误以为藻类都是绿色，红藻、褐藻也有颜色。
    - 觉得藻类只能生活在水中，忽略了潮湿陆地上的藻类。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:藻类植物
  type: Concept
  subject: 生物
  title: 藻类植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为藻类有根、茎、叶的分化，例如误把海带的固着器当作根，其实它们没有真正的根。
    - 能指出并纠正这一错误：认为藻类只能生活在海水里，忽略淡水藻类如衣藻、水绵。
  aliases:
    - 藻类
  category: 生物类群
  explanation: 藻类植物生活在水中，结构简单，能进行光合作用，没有根、茎、叶的分化。
  misconceptions:
    - 认为藻类有根、茎、叶的分化，例如误把海带的固着器当作根，其实它们没有真正的根。
    - 认为藻类只能生活在海水里，忽略淡水藻类如衣藻、水绵。
    - 认为藻类都是单细胞生物，忽略海带、紫菜等是多细胞的大型藻类。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:蘑菇
  type: Concept
  subject: 生物
  title: 蘑菇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蘑菇是植物，能进行光合作用（实际是异养真菌）
    - 能指出并纠正这一错误：认为蘑菇的菌盖是营养器官，菌柄是生殖器官（整个子实体是生殖结构）
  aliases: []
  category: 生物概念
  explanation: 蘑菇是大型真菌，菌体由菌丝构成，地上部分为子实体，由菌柄和菌盖组成。
  misconceptions:
    - 认为蘑菇是植物，能进行光合作用（实际是异养真菌）
    - 认为蘑菇的菌盖是营养器官，菌柄是生殖器官（整个子实体是生殖结构）
    - 认为蘑菇没有细胞核，属于原核生物（实际真菌细胞有核）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C8/sections/S3.md
- id: concept:生物:蛋白质
  type: Concept
  subject: 生物
  title: 蛋白质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蛋白质的首要功能是供能，实际是建造和修复身体的主要原料。
    - 能指出并纠正这一错误：说蛋白质只存在于动物性食物中，忽略大豆等植物也含丰富蛋白质。
  aliases: []
  category: 营养物质
  explanation: 蛋白质是建造和修复身体的重要原料，参与生长发育和受损细胞的修复更新，也能分解提供能量。
  misconceptions:
    - 认为蛋白质的首要功能是供能，实际是建造和修复身体的主要原料。
    - 说蛋白质只存在于动物性食物中，忽略大豆等植物也含丰富蛋白质。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:螺旋形包扎法
  type: Concept
  subject: 生物
  title: 螺旋形包扎法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：包扎时后一圈完全覆盖前一圈，不是螺旋形而是环形
    - 能指出并纠正这一错误：认为应从伤口近心端开始缠绕，实际应从远心端向近心端
  aliases: []
  category: 急救技能
  explanation: 常用的包扎止血方法，绷带螺旋缠绕，后一周覆盖前一周1/3~1/2。
  misconceptions:
    - 包扎时后一圈完全覆盖前一圈，不是螺旋形而是环形
    - 认为应从伤口近心端开始缠绕，实际应从远心端向近心端
    - 包扎后不固定末端或打结在伤口处，易松脱或感染
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:血压
  type: Concept
  subject: 生物
  title: 血压
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为血压是血液对心脏腔壁的压力，而不是对血管壁的侧压力。
    - 能指出并纠正这一错误：误认为收缩压是心脏舒张时测得的，舒张压是收缩时测得的，二者颠倒。
  aliases: []
  category: 生理学
  explanation: 血液对血管壁的侧压力，通常测量上臂肱动脉处的动脉血压，包括收缩压和舒张压。
  misconceptions:
    - 认为血压是血液对心脏腔壁的压力，而不是对血管壁的侧压力。
    - 误认为收缩压是心脏舒张时测得的，舒张压是收缩时测得的，二者颠倒。
    - 认为所有血管内血压都一样，动脉血压高于静脉血压但各处相同，实际不同部位不同。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:血吸虫病
  type: Concept
  subject: 生物
  title: 血吸虫病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为血吸虫病是细菌性传染病，实际是寄生虫病。
    - 能指出并纠正这一错误：认为血吸虫通过呼吸道飞沫传播，实际通过接触含尾蚴的疫水。
  aliases: []
  category: 概念
  explanation: 由血吸虫感染引起的寄生虫病。
  misconceptions:
    - 认为血吸虫病是细菌性传染病，实际是寄生虫病。
    - 认为血吸虫通过呼吸道飞沫传播，实际通过接触含尾蚴的疫水。
    - 认为血吸虫病只发生在肠道，实际主要寄生在门静脉系统，也可引起肝脾病变。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:血小板
  type: Concept
  subject: 生物
  title: 血小板
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为血小板有细胞核，是最小的血细胞且能运输氧，实际无核不运氧。
    - 能指出并纠正这一错误：误认为血小板过少会使血液凝固加快，形成血栓，实际过少易出血。
  aliases:
    - 血栓细胞
  category: 生物学概念
  explanation: 血小板是最小的血细胞，无细胞核，形状不规则，参与止血和凝血。
  misconceptions:
    - 误认为血小板有细胞核，是最小的血细胞且能运输氧，实际无核不运氧。
    - 误认为血小板过少会使血液凝固加快，形成血栓，实际过少易出血。
    - 误认为血小板是白细胞的一种，能吞噬病菌，实际是独立血细胞群。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:血浆
  type: Concept
  subject: 生物
  title: 血浆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为血浆的主要功能是运输氧气，实际运输氧气主要靠红细胞
    - 能指出并纠正这一错误：把血浆和血清混为一谈，血清是去掉纤维蛋白原后的部分
  aliases: []
  category: 生理学
  explanation: 血浆是血液的液体部分，主要成分是水，功能是运载血细胞和运输物质。
  misconceptions:
    - 认为血浆的主要功能是运输氧气，实际运输氧气主要靠红细胞
    - 把血浆和血清混为一谈，血清是去掉纤维蛋白原后的部分
    - 误以为血浆只含水，忽略它还运输营养物质和废物
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:血液
  type: Concept
  subject: 生物
  title: 血液
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把血液称为器官，而不是结缔组织
    - 能指出并纠正这一错误：认为血液只由红细胞和白细胞组成，漏掉血小板
  aliases:
    - blood
  category: 组织
  explanation: 血液是流动的组织，由血浆和血细胞（红细胞、白细胞、血小板）组成，具有运输、防御等功能。
  misconceptions:
    - 把血液称为器官，而不是结缔组织
    - 认为血液只由红细胞和白细胞组成，漏掉血小板
    - 认为血浆是血细胞，红细胞悬浮在血浆里所以血浆属于血细胞
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S2.md
- id: concept:生物:血液传播
  type: Concept
  subject: 生物
  title: 血液传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为血液传播与体液传播完全相同，实际体液传播范围更大。
    - 能指出并纠正这一错误：认为只要接触血液就必然感染，忽略人体免疫力的作用。
  aliases: []
  category: 生物学概念
  explanation: 病原体通过血液、性接触等途径传播，如艾滋病、乙肝等。
  misconceptions:
    - 误认为血液传播与体液传播完全相同，实际体液传播范围更大。
    - 认为只要接触血液就必然感染，忽略人体免疫力的作用。
    - 认为性传播不属于血液传播，但艾滋病可经性传播。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:血液循环
  type: Concept
  subject: 生物
  title: 血液循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为动脉里流的一定是动脉血，静脉里流的一定是静脉血，实际肺动脉里流静脉血，肺静脉里流动脉血
    - 能指出并纠正这一错误：认为体循环和肺循环是先后进行的两个独立过程，实际两循环同时进行，在心脏处汇合
  aliases:
    - 循环系统
  category: 生理过程
  explanation: 血液在心脏和血管中循环流动，运输氧气、营养物质和废物。
  misconceptions:
    - 认为动脉里流的一定是动脉血，静脉里流的一定是静脉血，实际肺动脉里流静脉血，肺静脉里流动脉血
    - 认为体循环和肺循环是先后进行的两个独立过程，实际两循环同时进行，在心脏处汇合
    - 混淆血液和血浆，认为血浆就是血液，实际血浆是血液的组成成分，血液中还含有血细胞
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:血液的功能
  type: Concept
  subject: 生物
  title: 血液的功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为血液只负责运输，忽视其防御（白细胞吞噬）和保护（血小板凝血）功能。
    - 能指出并纠正这一错误：说血液能运输氧气和废物，但遗漏运输激素、营养等物质。
  aliases: []
  category: 生物学概念
  explanation: 血液具有运输、防御和保护功能。
  misconceptions:
    - 认为血液只负责运输，忽视其防御（白细胞吞噬）和保护（血小板凝血）功能。
    - 说血液能运输氧气和废物，但遗漏运输激素、营养等物质。
    - 混淆血液的防御功能与免疫系统的功能，认为防御仅靠白细胞。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:血液的组成
  type: Concept
  subject: 生物
  title: 血液的组成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把血浆误认为血细胞的一种，或漏掉血小板。
    - 能指出并纠正这一错误：认为血液由血浆、红细胞、白细胞和血小板组成，但忽略血浆中的水分和营养物质。
  aliases:
    - 血液成分
  category: 生物学概念
  explanation: 血液由血浆和血细胞组成，血细胞包括红细胞、白细胞和血小板。
  misconceptions:
    - 把血浆误认为血细胞的一种，或漏掉血小板。
    - 认为血液由血浆、红细胞、白细胞和血小板组成，但忽略血浆中的水分和营养物质。
    - 将血清和血浆混为一谈，认为血浆是血液凝固后析出的液体。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:血液的组成与功能
  type: Concept
  subject: 生物
  title: 血液的组成与功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为血液属于器官而不是结缔组织，导致概念层级错误。
    - 能指出并纠正这一错误：说血液由血细胞组成，忽略血浆，或认为血细胞包括血浆。
  aliases:
    - 血液
  category: 生物学概念
  explanation: 血液由血浆和血细胞组成，具有运输、防御和保护作用。
  misconceptions:
    - 认为血液属于器官而不是结缔组织，导致概念层级错误。
    - 说血液由血细胞组成，忽略血浆，或认为血细胞包括血浆。
    - 把血液的运输功能等同于仅有红细胞运氧，忽略血浆的运输作用。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:血液透析
  type: Concept
  subject: 生物
  title: 血液透析
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为透析能根治肾衰竭，而不知只是替代肾脏排出废物。
    - 能指出并纠正这一错误：认为透析机会把血液中所有物质包括血细胞都过滤掉。
  aliases:
    - 透析
  category: 医学技术
  explanation: 当肾衰竭无法排出体内废物时，通过人工方式（透析机）过滤血液，清除废物，以维持生命。
  misconceptions:
    - 认为透析能根治肾衰竭，而不知只是替代肾脏排出废物。
    - 认为透析机会把血液中所有物质包括血细胞都过滤掉。
    - 以为透析是口服药物来净化血液，而非体外循环。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C9/sections/S1.md
- id: concept:生物:血糖调节
  type: Concept
  subject: 生物
  title: 血糖调节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为胰岛素升高血糖浓度，实际胰岛素是降低血糖浓度
    - 能指出并纠正这一错误：认为血糖调节只由胰岛素完成，忽略胰高血糖素等激素的作用
  aliases: []
  category: 生理学
  explanation: 血糖浓度受胰岛素等激素调节，胰岛素能促进血糖合成糖原、加速血糖分解，从而降低血糖浓度。
  misconceptions:
    - 认为胰岛素升高血糖浓度，实际胰岛素是降低血糖浓度
    - 认为血糖调节只由胰岛素完成，忽略胰高血糖素等激素的作用
    - 认为胰岛素直接分解血糖，实际是促进血糖合成糖原和氧化分解
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:血红蛋白
  type: Concept
  subject: 生物
  title: 血红蛋白
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为血红蛋白存在于血浆中，而不是红细胞内。
    - 能指出并纠正这一错误：认为血红蛋白在氧浓度低处与氧结合，高处分离（方向颠倒）。
  aliases:
    - Hb
  category: 生物学概念
  explanation: 血红蛋白是红细胞中的红色含铁蛋白质，在氧浓度高处与氧结合，低处与氧分离，使红细胞能运输氧。
  misconceptions:
    - 认为血红蛋白存在于血浆中，而不是红细胞内。
    - 认为血红蛋白在氧浓度低处与氧结合，高处分离（方向颠倒）。
    - 误以为血红蛋白能单独运输氧，不需红细胞，或认为白细胞中也含有血红蛋白。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:血细胞
  type: Concept
  subject: 生物
  title: 血细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为成熟红细胞有细胞核，能分裂增生
    - 能指出并纠正这一错误：说白细胞能运输氧气，红细胞能吞噬病菌
  aliases:
    - blood cells
  category: 血液成分
  explanation: 血细胞包括红细胞、白细胞和血小板，悬浮在血浆中，各自具有不同的功能。
  misconceptions:
    - 认为成熟红细胞有细胞核，能分裂增生
    - 说白细胞能运输氧气，红细胞能吞噬病菌
    - 认为血小板是白细胞的一种，含有细胞核
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:血量
  type: Concept
  subject: 生物
  title: 血量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为成年人血量越多越健康，不知血量过多也会增加心脏负担。
    - 能指出并纠正这一错误：认为一次献血400ml会严重影响健康，不知可很快恢复。
  aliases: []
  category: 生理学概念
  explanation: 成年人体内血量约占体重的7%～8%，血量稳定对生命活动至关重要。
  misconceptions:
    - 认为成年人血量越多越健康，不知血量过多也会增加心脏负担。
    - 认为一次献血400ml会严重影响健康，不知可很快恢复。
    - 将血量占体重7%～8%记成8%～9%，或混淆为占血细胞比例。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:衣藻的结构与功能
  type: Concept
  subject: 生物
  title: 衣藻的结构与功能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为衣藻有神经结构，能对刺激作出反射，实际只是应激性
    - 能指出并纠正这一错误：误认为衣藻的鞭毛用于捕食，实际只用于运动
  aliases: []
  category: 生物学事实
  explanation: 衣藻是单细胞藻类，有鞭毛和叶绿体，能运动、进行光合作用制造有机物，但无神经结构。
  misconceptions:
    - 认为衣藻有神经结构，能对刺激作出反射，实际只是应激性
    - 误认为衣藻的鞭毛用于捕食，实际只用于运动
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S4.md
- id: concept:生物:被子植物
  type: Concept
  subject: 生物
  title: 被子植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把松球果当成果实，误认为松树是被子植物。
    - 能指出并纠正这一错误：认为银杏的白果外面有果皮，所以是被子植物。
  aliases:
    - 绿色开花植物
  category: 生物类群
  explanation: 种子外面有果皮包被的植物，也称绿色开花植物，是陆地上分布最广泛的植物家族。
  misconceptions:
    - 把松球果当成果实，误认为松树是被子植物。
    - 认为银杏的白果外面有果皮，所以是被子植物。
    - 误认为香蕉、无籽西瓜没有种子，所以不属于被子植物。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C9/sections/S1.md
- id: concept:生物:裸子植物
  type: Concept
  subject: 生物
  title: 裸子植物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为银杏的白果是果实，实际上是种子。
    - 能指出并纠正这一错误：误认为松柏不开花结果，因此不属于种子植物。
  aliases: []
  category: 生物类群
  explanation: 种子裸露，外面没有果皮包被的植物，如松、柏、水杉、银杏等。
  misconceptions:
    - 认为银杏的白果是果实，实际上是种子。
    - 误认为松柏不开花结果，因此不属于种子植物。
    - 认为裸子植物有真正的花和果实，因为它们有球果。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:观察
  type: Concept
  subject: 生物
  title: 观察
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为观察只能借助显微镜等工具，用肉眼观察不属于科学观察。
    - 能指出并纠正这一错误：观察时没有明确目的和顺序，随手记录零散信息，未按计划进行。
  aliases: []
  category: 科学方法
  explanation: 观察是科学探究的一种基本方法，可以直接用肉眼，也可以借助放大镜、显微镜等设备，观察要有明确的目的、按一定顺序进行并做好记录。
  misconceptions:
    - 认为观察只能借助显微镜等工具，用肉眼观察不属于科学观察。
    - 观察时没有明确目的和顺序，随手记录零散信息，未按计划进行。
    - 认为观察和实验完全相同，用观察代替实验探究。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:视网膜
  type: Concept
  subject: 生物
  title: 视网膜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错误认为视觉形成于视网膜，实际是在大脑皮层的视觉中枢
    - 能指出并纠正这一错误：把视网膜本身当成感光细胞，没有区分结构与其含有的细胞
  aliases: []
  category: 解剖结构
  explanation: 眼球内含有感光细胞的结构，能感受光刺激并产生神经冲动。
  misconceptions:
    - 错误认为视觉形成于视网膜，实际是在大脑皮层的视觉中枢
    - 把视网膜本身当成感光细胞，没有区分结构与其含有的细胞
    - 以为视网膜受损会导致青光眼，实为视神经受损所致
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:视觉的形成过程
  type: Concept
  subject: 生物
  title: 视觉的形成过程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：叙述光线路径时先经晶状体后经瞳孔，或先经玻璃体后经晶状体
    - 能指出并纠正这一错误：认为视觉在视网膜上形成，忽视大脑皮层的加工作用
  aliases:
    - 视觉形成
  category: 生理学
  explanation: 外界物体反射的光线依次通过角膜、房水、瞳孔、晶状体和玻璃体，经折射后在视网膜上成像，视网膜上的感光细胞将信息通过视神经传给大脑特定区域，形成视觉。
  misconceptions:
    - 叙述光线路径时先经晶状体后经瞳孔，或先经玻璃体后经晶状体
    - 认为视觉在视网膜上形成，忽视大脑皮层的加工作用
    - 说感光细胞在晶状体上，视神经连接玻璃体传信息
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:角膜移植
  type: Concept
  subject: 生物
  title: 角膜移植
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为角膜移植是移植整个眼球，实际仅替换角膜
    - 能指出并纠正这一错误：认为角膜移植与人工角膜移植完全相同，忽略取材差异
  aliases: []
  category: 医学技术
  explanation: 用健康的角膜替换患者损坏的角膜，以恢复视力，是治疗角膜致盲的有效方法。
  misconceptions:
    - 误以为角膜移植是移植整个眼球，实际仅替换角膜
    - 认为角膜移植与人工角膜移植完全相同，忽略取材差异
    - 相信角膜移植能治疗白内障，白内障需处理晶状体
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:设置对照
  type: Concept
  subject: 生物
  title: 设置对照
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为对照组必须不做任何处理，实际上可做无关处理。
    - 能指出并纠正这一错误：设置实验组和对照组时同时改变两个变量，无法比较。
  aliases:
    - 对照实验
  category: 科学方法
  explanation: 设置对照组和实验组，通过比较来验证实验假设。
  misconceptions:
    - 误以为对照组必须不做任何处理，实际上可做无关处理。
    - 设置实验组和对照组时同时改变两个变量，无法比较。
    - 将重复实验误认为是对照实验，混淆两组角色。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:诱变育种
  type: Concept
  subject: 生物
  title: 诱变育种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为诱变育种能定向产生所需变异，实际突变是不定向的
    - 能指出并纠正这一错误：认为诱变育种属于转基因技术，实际上诱变育种改变基因结构，转基因导入外源基因
  aliases:
    - 太空育种
    - 航天育种
  category: 育种方法
  explanation: 利用物理或化学因素诱导基因突变，从中选育优良品种的方法。
  misconceptions:
    - 认为诱变育种能定向产生所需变异，实际突变是不定向的
    - 认为诱变育种属于转基因技术，实际上诱变育种改变基因结构，转基因导入外源基因
    - 认为诱变育种产生的变异都是有利的，实际大多数变异是不利或中性的
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S5.md
- id: concept:生物:调节情绪的方法
  type: Concept
  subject: 生物
  title: 调节情绪的方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为调节情绪就是强行压住不良情绪，不表现出来
    - 能指出并纠正这一错误：觉得只有转移注意力才有效，其他方法都是白费功夫
  aliases:
    - 情绪调节
  category: 心理健康
  explanation: 包括转移注意力、向他人倾诉、自我安慰等三种方法，用于缓解不良情绪。
  misconceptions:
    - 认为调节情绪就是强行压住不良情绪，不表现出来
    - 觉得只有转移注意力才有效，其他方法都是白费功夫
    - 把向他人倾诉当成软弱的表现，选择独自硬扛
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:贫血
  type: Concept
  subject: 生物
  title: 贫血
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为贫血就是血液总量减少了，实际是红细胞或血红蛋白低于正常。
    - 能指出并纠正这一错误：认为贫血一定是因为缺铁，缺铁只是常见原因之一。
  aliases: []
  category: 医学概念
  explanation: 贫血是指体内红细胞数量或血红蛋白含量低于正常值，可能导致组织供氧不足。
  misconceptions:
    - 认为贫血就是血液总量减少了，实际是红细胞或血红蛋白低于正常。
    - 认为贫血一定是因为缺铁，缺铁只是常见原因之一。
    - 把贫血与白细胞减少或血小板减少混为一谈。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S3.md
- id: concept:生物:赤潮
  type: Concept
  subject: 生物
  title: 赤潮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为赤潮是藻类过度繁殖而非单细胞生物，实际赤潮也含某些原生动物
    - 能指出并纠正这一错误：认为赤潮是由温度升高引起的，主要原因是含氮磷物质大量排入海洋
  aliases:
    - 赤潮
  category: 生物学概念
  explanation: 海水中某些单细胞生物大量繁殖时可形成赤潮，危害渔业。形成赤潮的主要原因是大量含氮、含磷物质排入海洋。
  misconceptions:
    - 认为赤潮是藻类过度繁殖而非单细胞生物，实际赤潮也含某些原生动物
    - 认为赤潮是由温度升高引起的，主要原因是含氮磷物质大量排入海洋
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S4.md
- id: concept:生物:超级细菌
  type: Concept
  subject: 生物
  title: 超级细菌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为超级细菌是抗生素诱导产生的定向变异（实际变异不定向，抗生素起选择作用）
    - 能指出并纠正这一错误：认为超级细菌通过产生抗体抵抗抗生素（实际是基因突变产生耐药性，无抗体）
  aliases: []
  category: 生物学概念
  explanation: 对绝大多数抗生素不再敏感的细菌，由普通细菌变异而来，与滥用抗生素有关。
  misconceptions:
    - 认为超级细菌是抗生素诱导产生的定向变异（实际变异不定向，抗生素起选择作用）
    - 认为超级细菌通过产生抗体抵抗抗生素（实际是基因突变产生耐药性，无抗体）
    - 认为超级细菌是自然界新出现的物种（实际由普通细菌变异而来）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:趋性
  type: Concept
  subject: 生物
  title: 趋性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把趋性等同于反射，忽视趋性是定向运动而反射是应答性活动
    - 能指出并纠正这一错误：认为所有动物对外界刺激的反应都是趋性，如缩手反射不是趋性
  aliases:
    - 趋性
  category: 生物学概念
  explanation: 动物受到外界刺激时，会作出一定的反应，它们接近或离开刺激源的定向运动叫作趋性。
  misconceptions:
    - 把趋性等同于反射，忽视趋性是定向运动而反射是应答性活动
    - 认为所有动物对外界刺激的反应都是趋性，如缩手反射不是趋性
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C4/sections/S4.md
- id: concept:生物:转基因技术
  type: Concept
  subject: 生物
  title: 转基因技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为转基因技术改变生物自身的基因，实际是导入外源基因，属于基因重组
    - 能指出并纠正这一错误：认为转基因生物一定是新物种，实际转基因只是改变部分性状，不一定产生新物种
  aliases: []
  category: 生物技术
  explanation: 把一种生物的某个基因转入另一种生物的细胞中，培育出转基因生物。
  misconceptions:
    - 认为转基因技术改变生物自身的基因，实际是导入外源基因，属于基因重组
    - 认为转基因生物一定是新物种，实际转基因只是改变部分性状，不一定产生新物种
    - 认为转基因技术能产生新的基因，实际是转移已有基因
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:软体动物
  type: Concept
  subject: 生物
  title: 软体动物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有软体动物都有贝壳，章鱼和乌贼没有贝壳。
    - 能指出并纠正这一错误：把蜗牛的壳当作外骨骼，其实那是外套膜分泌的贝壳。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 误认为所有软体动物都有贝壳，章鱼和乌贼没有贝壳。
    - 把蜗牛的壳当作外骨骼，其实那是外套膜分泌的贝壳。
    - 认为蚯蚓身体柔软属于软体动物，实际是环节动物。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:辐射对称
  type: Concept
  subject: 生物
  title: 辐射对称
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为辐射对称就是左右对称，把人的身体也说成辐射对称。
    - 能指出并纠正这一错误：认为水螅的体形是两侧对称，实际它呈辐射对称。
  aliases: []
  category: 生物概念
  explanation: 经过动物体的中央轴有多个切面能将身体分为两个相等的部分，如刺胞动物。
  misconceptions:
    - 误认为辐射对称就是左右对称，把人的身体也说成辐射对称。
    - 认为水螅的体形是两侧对称，实际它呈辐射对称。
    - 以为辐射对称的动物有前后左右之分，实际上没有明显背腹。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S1.md
- id: concept:生物:输导组织
  type: Concept
  subject: 生物
  title: 输导组织
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为筛管运输水和无机盐，导管运输有机物，两者运输功能颠倒
    - 能指出并纠正这一错误：认为只有根茎叶有输导组织，花果实种子中也有分布
  aliases:
    - 输导组织
  category: 生物学概念
  explanation: 根、茎、叶等处有运输水和无机盐的导管，也有运输有机物的筛管，它们都属于输导组织。
  misconceptions:
    - 误认为筛管运输水和无机盐，导管运输有机物，两者运输功能颠倒
    - 认为只有根茎叶有输导组织，花果实种子中也有分布
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:输血与血型
  type: Concept
  subject: 生物
  title: 输血与血型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为O型血是万能血，可大量输给任何血型，实际只能少量输给非O型，且需交叉配血
    - 能指出并纠正这一错误：误以为AB型人能接受任何血型，实际虽可接受少量其他血型，但优先同型输血
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 认为O型血是万能血，可大量输给任何血型，实际只能少量输给非O型，且需交叉配血
    - 误以为AB型人能接受任何血型，实际虽可接受少量其他血型，但优先同型输血
    - 认为子女血型一定与父母一方相同，忽略如A+B可生O型，血型遗传有隐性可能
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:输血原则
  type: Concept
  subject: 生物
  title: 输血原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为O型血是万能血，可任意输给其他血型的人（异型输血有凝集风险）。
    - 能指出并纠正这一错误：认为AB型血能接受任何血型，但输血仍以同型血为首选。
  aliases: []
  category: 医学原则
  explanation: 输血时应以输同型血为原则，避免红细胞凝集和溶血反应。
  misconceptions:
    - 认为O型血是万能血，可任意输给其他血型的人（异型输血有凝集风险）。
    - 认为AB型血能接受任何血型，但输血仍以同型血为首选。
    - 认为输血只需验ABO血型，不必考虑Rh因子和交叉配血。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:达尔文
  type: Concept
  subject: 生物
  title: 达尔文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为达尔文提出了'用进废退'学说，与拉马克混淆
    - 能指出并纠正这一错误：认为达尔文的代表作是《自然选择》，而不是《物种起源》
  aliases:
    - C.Darwin
  category: 科学家
  explanation: 英国博物学家，提出自然选择学说，著有《物种起源》。
  misconceptions:
    - 认为达尔文提出了'用进废退'学说，与拉马克混淆
    - 认为达尔文的代表作是《自然选择》，而不是《物种起源》
    - 认为达尔文用自然选择学说否定了遗传变异的存在
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S3.md
- id: concept:生物:迁地保护
  type: Concept
  subject: 生物
  title: 迁地保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为迁地保护就是在原地划保护区，与就地保护混淆。
    - 能指出并纠正这一错误：认为迁地保护不需要人工繁育或特殊管理，简单搬迁即可。
  aliases:
    - 易地保护
  category: 保护措施
  explanation: 迁地保护是指将濒危生物迁出原地，移入动物园、植物园、水族馆或繁育中心等进行特殊保护和管理。
  misconceptions:
    - 误以为迁地保护就是在原地划保护区，与就地保护混淆。
    - 认为迁地保护不需要人工繁育或特殊管理，简单搬迁即可。
    - 将迁地保护视为所有濒危物种的通用办法，忽略其适用性。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C4/sections/S1.md
- id: concept:生物:过度繁殖
  type: Concept
  subject: 生物
  title: 过度繁殖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为繁殖能力强的生物必然能生存，忽略环境限制（如苍蝇产卵多但大多死亡）
    - 能指出并纠正这一错误：把过度繁殖当成生物有意识地为适应环境而多生后代（如认为害虫故意多产卵）
  aliases: []
  category: 生物学概念
  explanation: 生物普遍具有很强的繁殖能力，能产生大量后代，是生存斗争的前提。
  misconceptions:
    - 认为繁殖能力强的生物必然能生存，忽略环境限制（如苍蝇产卵多但大多死亡）
    - 把过度繁殖当成生物有意识地为适应环境而多生后代（如认为害虫故意多产卵）
    - 认为过度繁殖只指动物产仔多，植物产生大量种子不属于过度繁殖
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:过敏原
  type: Concept
  subject: 生物
  title: 过敏原
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为过敏原对所有人都会引起过敏反应，忽略个体差异
    - 能指出并纠正这一错误：认为过敏原是抗体，把引起过敏的物质当成免疫产物
  aliases: []
  category: 免疫学
  explanation: 引起过敏反应的物质。
  misconceptions:
    - 认为过敏原对所有人都会引起过敏反应，忽略个体差异
    - 认为过敏原是抗体，把引起过敏的物质当成免疫产物
    - 认为只有花粉才是过敏原，其他物质不可能
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:过敏反应
  type: Concept
  subject: 生物
  title: 过敏反应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为初次接触过敏原就会发生过敏反应，实际需再次接触
    - 能指出并纠正这一错误：认为过敏反应是免疫能力过强导致的正常防御，无害
  aliases: []
  category: 免疫学
  explanation: 机体对某些抗原的入侵产生免疫反应后，再次受到相同抗原刺激时所发生的反应，可能导致组织损伤或生理功能紊乱。
  misconceptions:
    - 认为初次接触过敏原就会发生过敏反应，实际需再次接触
    - 认为过敏反应是免疫能力过强导致的正常防御，无害
    - 认为过敏反应只引起皮肤红肿，不会导致组织损伤
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:运动
  type: Concept
  subject: 生物
  title: 运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为骨自身能收缩产生运动，实际运动靠骨骼肌收缩牵拉骨，如屈肘时肱二头肌收缩
    - 能指出并纠正这一错误：认为一块骨骼肌就能完成一个动作，实际需要多组肌群协调配合，如屈肘时肱三头肌舒张
  aliases: []
  category: 生理过程
  explanation: 人体通过骨骼肌收缩牵动骨绕关节活动完成各种动作。
  misconceptions:
    - 认为骨自身能收缩产生运动，实际运动靠骨骼肌收缩牵拉骨，如屈肘时肱二头肌收缩
    - 认为一块骨骼肌就能完成一个动作，实际需要多组肌群协调配合，如屈肘时肱三头肌舒张
    - 把关节腔当作关节的组成，认为关节腔是独立的，实际关节腔是关节结构的一部分，内有滑液
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S3.md
- id: concept:生物:运动损伤的预防与处理
  type: Concept
  subject: 生物
  title: 运动损伤的预防与处理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为运动损伤只需休息即可，忽视正确处理方法如固定骨折部位。
    - 能指出并纠正这一错误：运动前不热身，认为无关紧要，其实会增加骨折和拉伤风险。
  aliases: []
  category: 健康
  explanation: 运动前热身、合理安排运动量、使用护具可预防骨折、脱位、韧带拉伤等损伤；骨折时需固定并告知家长。
  misconceptions:
    - 认为运动损伤只需休息即可，忽视正确处理方法如固定骨折部位。
    - 运动前不热身，认为无关紧要，其实会增加骨折和拉伤风险。
    - 将脱位与骨折混为一谈，处理方式相同。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:运动系统
  type: Concept
  subject: 生物
  title: 运动系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为运动系统只由肌肉组成，忽略骨和关节。
    - 能指出并纠正这一错误：误以为运动系统功能独立，不需神经系统支配。
  aliases: []
  category: 生物学概念
  explanation: 运动系统主要由骨、关节和肌肉组成，在神经系统支配下完成各种动作。
  misconceptions:
    - 认为运动系统只由肌肉组成，忽略骨和关节。
    - 误以为运动系统功能独立，不需神经系统支配。
    - 将运动系统与循环系统混淆，认为运动系统能运输氧气。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:运动需要多个系统的配合
  type: Concept
  subject: 生物
  title: 运动需要多个系统的配合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为运动只靠运动系统，忘记消化、呼吸等系统提供能量。
    - 能指出并纠正这一错误：把神经系统和运动系统的作用割裂，不知它们需统一配合才能运动。
  aliases: []
  category: 生理学
  explanation: 运动不仅依靠运动系统和神经系统，还需要消化、呼吸、循环等系统提供能量。
  misconceptions:
    - 认为运动只靠运动系统，忘记消化、呼吸等系统提供能量。
    - 把神经系统和运动系统的作用割裂，不知它们需统一配合才能运动。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:近亲结婚
  type: Concept
  subject: 生物
  title: 近亲结婚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为近亲结婚只指表兄妹，堂兄妹不算，实际堂兄妹也属三代以内旁系血亲
    - 能指出并纠正这一错误：认为近亲结婚的后代患遗传病概率和普通婚姻相同，实际风险显著增大
  aliases: []
  category: 遗传与优生
  explanation: 直系血亲和三代以内的旁系血亲之间的婚配，近亲结婚会增大隐性遗传病的发病概率。
  misconceptions:
    - 认为近亲结婚只指表兄妹，堂兄妹不算，实际堂兄妹也属三代以内旁系血亲
    - 认为近亲结婚的后代患遗传病概率和普通婚姻相同，实际风险显著增大
    - 认为兄弟姐妹属于直系血亲，实际兄弟姐妹是旁系血亲
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:近视
  type: Concept
  subject: 生物
  title: 近视
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为近视是眼球前后径过短或晶状体曲度过小，物像落在视网膜后方
    - 能指出并纠正这一错误：把近视眼说成看近模糊、看远清楚，与远视症状混淆
  aliases:
    - 近视眼
  category: 病理学
  explanation: 近视是眼球前后径过长或角膜、晶状体曲度过大，导致物像落在视网膜前方，看不清远处物体的眼病。
  misconceptions:
    - 认为近视是眼球前后径过短或晶状体曲度过小，物像落在视网膜后方
    - 把近视眼说成看近模糊、看远清楚，与远视症状混淆
    - 认为近视是因为视网膜距晶状体太远，导致像成在视网膜前
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:近视的矫正
  type: Concept
  subject: 生物
  title: 近视的矫正
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为近视眼用凸透镜矫正，因为凸透镜能放大远处物体
    - 能指出并纠正这一错误：认为凹透镜对光线起会聚作用，矫正后焦点更靠前
  aliases:
    - 近视矫正
  category: 治疗方法
  explanation: 近视可通过佩戴凹透镜（近视镜）进行矫正，凹透镜对光有发散作用。
  misconceptions:
    - 认为近视眼用凸透镜矫正，因为凸透镜能放大远处物体
    - 认为凹透镜对光线起会聚作用，矫正后焦点更靠前
    - 误以为戴近视镜是为了让物像落在视网膜前方，增强刺激
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:退田还湖还湿
  type: Concept
  subject: 生物
  title: 退田还湖还湿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为退田还湖就是简单挖开水淹，不需要恢复水生植被和生态功能
    - 能指出并纠正这一错误：认为退田还湖会大幅减少粮食产量，因此应禁止实施
  aliases: []
  category: 生态恢复
  explanation: 将围垦的湖泊、湿地恢复为原有状态，以改善生态环境。
  misconceptions:
    - 认为退田还湖就是简单挖开水淹，不需要恢复水生植被和生态功能
    - 认为退田还湖会大幅减少粮食产量，因此应禁止实施
    - 将退田还湖与围湖造田顺序颠倒，认为先退水再围堤
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:退耕还林还草
  type: Concept
  subject: 生物
  title: 退耕还林还草
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有耕地都必须退耕还林，不管是否适宜。
    - 能指出并纠正这一错误：忽略退耕还草的作用，误以为只有种树才能恢复生态。
  aliases: []
  category: 生态保护
  explanation: 退耕还林还草是恢复生态环境的重要措施，通过将不适宜耕作的农田转为林地或草地，减少水土流失，改善生态。
  misconceptions:
    - 认为所有耕地都必须退耕还林，不管是否适宜。
    - 忽略退耕还草的作用，误以为只有种树才能恢复生态。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:退耕还林还草工程
  type: Concept
  subject: 生物
  title: 退耕还林还草工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把退耕还林还草理解为把所有耕地都改种树草，而非只针对易流失的坡耕地和沙化地。
    - 能指出并纠正这一错误：认为还林就是要种成纯林，还草就是统一种草，忽略因地制宜和乡土物种。
  aliases:
    - 退耕还林还草
  category: 生态工程
  explanation: 将容易造成水土流失的坡耕地、严重沙化耕地等有计划地停止耕种，植树种草恢复植被，以改善生态环境、维护生态安全。
  misconceptions:
    - 把退耕还林还草理解为把所有耕地都改种树草，而非只针对易流失的坡耕地和沙化地。
    - 认为还林就是要种成纯林，还草就是统一种草，忽略因地制宜和乡土物种。
    - 以为退耕后当年就能蓄水保土，忽视植被恢复需多年才能见效。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:适者生存
  type: Concept
  subject: 生物
  title: 适者生存
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'适者'理解为最大最强，如认为狮子一定比羚羊更适应环境，忽略环境变化
    - 能指出并纠正这一错误：认为适者生存是生物主动努力适应环境的结果，如长颈鹿因使劲伸脖子而脖子变长
  aliases: []
  category: 生物学概念
  explanation: 在生存斗争中，具有有利变异的个体容易生存下来并繁殖后代。
  misconceptions:
    - 把'适者'理解为最大最强，如认为狮子一定比羚羊更适应环境，忽略环境变化
    - 认为适者生存是生物主动努力适应环境的结果，如长颈鹿因使劲伸脖子而脖子变长
    - 忽视'繁殖后代'，认为只要自己活着就是适者，如不育个体也算适者
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:选育
  type: Concept
  subject: 生物
  title: 选育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为选育过程中不会发生性状分离，实际连续选育也可能出现杂合子分离
    - 能指出并纠正这一错误：认为选育就是只选择显性性状，不能选育隐性性状，实际隐性性状一旦表现就能稳定遗传
  aliases:
    - 选择育种
  category: 育种方法
  explanation: 对具有优良性状的个体进行多代选择、繁育，获得新品种的方法。
  misconceptions:
    - 认为选育过程中不会发生性状分离，实际连续选育也可能出现杂合子分离
    - 认为选育就是只选择显性性状，不能选育隐性性状，实际隐性性状一旦表现就能稳定遗传
    - 认为选育不需要遗传变异，只靠环境改变，实际选育必须有可遗传变异
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:造血干细胞
  type: Concept
  subject: 生物
  title: 造血干细胞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为造血干细胞只能分化为红细胞，而忽略其他血细胞。
    - 能指出并纠正这一错误：认为造血干细胞就是骨髓细胞，且只存在于骨髓中（忘记脐带血等来源）。
  aliases: []
  category: 生物学概念
  explanation: 造血干细胞主要存在于骨髓中，能分化为红细胞、白细胞和血小板。
  misconceptions:
    - 认为造血干细胞只能分化为红细胞，而忽略其他血细胞。
    - 认为造血干细胞就是骨髓细胞，且只存在于骨髓中（忘记脐带血等来源）。
    - 把造血干细胞当成血细胞的一种，而它属于干细胞。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:遗传
  type: Concept
  subject: 生物
  title: 遗传
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遗传是亲代直接把性状传给子代，实际传递的是遗传物质（基因）
    - 能指出并纠正这一错误：认为遗传和变异是相互排斥的，实际上遗传是相对的，变异是绝对的
  aliases:
    - heredity
  category: 生物学概念
  explanation: 遗传是指亲子代间的相似性。
  misconceptions:
    - 认为遗传是亲代直接把性状传给子代，实际传递的是遗传物质（基因）
    - 认为遗传和变异是相互排斥的，实际上遗传是相对的，变异是绝对的
    - 认为遗传只指长得像，不包括内在基因的传递，实际遗传包括各种特征
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:遗传信息
  type: Concept
  subject: 生物
  title: 遗传信息
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遗传信息存在于细胞质或线粒体，实际主要存在于细胞核中。
    - 能指出并纠正这一错误：把遗传信息当成蛋白质，实际遗传信息是DNA上碱基的排列顺序。
  aliases: []
  category: 生物学概念
  explanation: 指导个体生长发育的全部信息，代代相传，主要存在于细胞核中。
  misconceptions:
    - 认为遗传信息存在于细胞质或线粒体，实际主要存在于细胞核中。
    - 把遗传信息当成蛋白质，实际遗传信息是DNA上碱基的排列顺序。
    - 以为遗传信息只在生殖细胞中，体细胞同样携带全套遗传信息。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:遗传多样性
  type: Concept
  subject: 生物
  title: 遗传多样性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将遗传多样性与物种多样性混淆，认为生物种类多就是遗传多样性高（如认为不同物种数量多等于遗传多样性…
    - 能指出并纠正这一错误：认为遗传多样性只发生在不同物种间，同一物种内的基因差异不算遗传多样性（如认为人类个体的差异不属遗…
  aliases:
    - 基因多样性
  category: 生物学概念
  explanation: 遗传多样性是指地球上生物所携带的各种遗传信息的总和，是生物多样性的重要组成部分。
  misconceptions:
    - 将遗传多样性与物种多样性混淆，认为生物种类多就是遗传多样性高（如认为不同物种数量多等于遗传多样性高）
    - 认为遗传多样性只发生在不同物种间，同一物种内的基因差异不算遗传多样性（如认为人类个体的差异不属遗传多样性）
    - 认为遗传多样性仅指显性基因的多样性，忽略隐性基因也有多样性
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C5/sections/S1.md
- id: concept:生物:遗传学
  type: Concept
  subject: 生物
  title: 遗传学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遗传学只研究遗传不研究变异，实际上遗传变异都是研究对象
    - 能指出并纠正这一错误：认为遗传学就是研究基因的学科，过于狭隘，遗传学研究遗传和变异规律
  aliases: []
  category: 学科领域
  explanation: 研究生物遗传和变异规律的学科。
  misconceptions:
    - 认为遗传学只研究遗传不研究变异，实际上遗传变异都是研究对象
    - 认为遗传学就是研究基因的学科，过于狭隘，遗传学研究遗传和变异规律
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S1.md
- id: concept:生物:遗传学之父
  type: Concept
  subject: 生物
  title: 遗传学之父
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为达尔文是遗传学之父，实际孟德尔是遗传学之父，达尔文提出自然选择
    - 能指出并纠正这一错误：认为孟德尔提出了‘基因’一词，实际孟德尔提出的是‘遗传因子’
  aliases: []
  category: 科学史
  explanation: 孟德尔因在遗传学上的杰出贡献被后人公认为“遗传学之父”。
  misconceptions:
    - 认为达尔文是遗传学之父，实际孟德尔是遗传学之父，达尔文提出自然选择
    - 认为孟德尔提出了‘基因’一词，实际孟德尔提出的是‘遗传因子’
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:遗传育种
  type: Concept
  subject: 生物
  title: 遗传育种
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为遗传育种都能产生新基因，实际杂交育种和选育只是重新组合已有基因
    - 能指出并纠正这一错误：认为遗传育种只包括现代生物技术，实际上选育、杂交等传统方法也属于
  aliases:
    - 育种
  category: 生物学概念
  explanation: 人类应用遗传和变异原理，通过选育、杂交、诱变、基因工程等方法获得生物新品种。
  misconceptions:
    - 认为遗传育种都能产生新基因，实际杂交育种和选育只是重新组合已有基因
    - 认为遗传育种只包括现代生物技术，实际上选育、杂交等传统方法也属于
    - 认为遗传育种等同于基因工程，实际上基因工程只是其中一种方法
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:遗精
  type: Concept
  subject: 生物
  title: 遗精
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把遗精当作疾病或异常现象，实际是青春期正常的生理现象。
    - 能指出并纠正这一错误：认为遗精会损害身体，需要刻意制止，实际偶尔遗精不影响健康。
  aliases: []
  category: 生理现象
  explanation: 男孩进入青春期后，有时在睡梦中精液自尿道排出的现象，是正常的生理现象。
  misconceptions:
    - 把遗精当作疾病或异常现象，实际是青春期正常的生理现象。
    - 认为遗精会损害身体，需要刻意制止，实际偶尔遗精不影响健康。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S2.md
- id: concept:生物:酒精中毒
  type: Concept
  subject: 生物
  title: 酒精中毒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为喝酒脸红代表酒量大不会中毒，实际是乙醛蓄积的中毒表现
    - 能指出并纠正这一错误：认为酒精中毒后喝浓茶可解酒，反而加重心脏和肾脏负担
  aliases:
    - 醉酒
  category: 健康危害
  explanation: 酒精中毒是指饮酒过量导致的中枢神经系统抑制状态，严重时可危及生命，并影响其他系统。
  misconceptions:
    - 认为喝酒脸红代表酒量大不会中毒，实际是乙醛蓄积的中毒表现
    - 认为酒精中毒后喝浓茶可解酒，反而加重心脏和肾脏负担
    - 觉得催吐吐掉未吸收的酒就安全，但大部分酒精已入血
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:酒精对健康的危害
  type: Concept
  subject: 生物
  title: 酒精对健康的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为青少年偶尔喝点啤酒没关系，不会伤害大脑
    - 能指出并纠正这一错误：觉得只有每天大量饮酒才会有危害，偶尔一次没问题
  aliases:
    - 饮酒危害
  category: 健康危害
  explanation: 青少年饮酒会对大脑造成永久性伤害，影响行为和情绪；长期饮酒可导致心血管疾病、肝病和癌症风险增加。
  misconceptions:
    - 认为青少年偶尔喝点啤酒没关系，不会伤害大脑
    - 觉得只有每天大量饮酒才会有危害，偶尔一次没问题
    - 把酒精危害简单等同于伤肝，忽视对行为和情绪的影响
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:酵母菌
  type: Concept
  subject: 生物
  title: 酵母菌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为酵母菌是细菌，没有成形的细胞核（实际是真菌，有核）
    - 能指出并纠正这一错误：认为酵母菌以分裂生殖为主（实际以出芽生殖为主）
  aliases: []
  category: 生物概念
  explanation: 酵母菌是单细胞真菌，细胞有细胞核、细胞壁、细胞膜、细胞质、线粒体和液泡，可进行出芽生殖。
  misconceptions:
    - 认为酵母菌是细菌，没有成形的细胞核（实际是真菌，有核）
    - 认为酵母菌以分裂生殖为主（实际以出芽生殖为主）
    - 认为酵母菌无氧呼吸产生二氧化碳和水（实际产生酒精和二氧化碳）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:酸雨
  type: Concept
  subject: 生物
  title: 酸雨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为pH小于7的雨水就属于酸雨，实际应小于5.6
    - 能指出并纠正这一错误：认为酸雨只由二氧化硫引起，忽视氮氧化物的作用
  aliases:
    - 酸性降水
  category: 环境科学
  explanation: pH小于5.6的雨水称为酸雨，主要由人类活动排放的二氧化硫、氮氧化物等造成，对生物和建筑物有害。
  misconceptions:
    - 认为pH小于7的雨水就属于酸雨，实际应小于5.6
    - 认为酸雨只由二氧化硫引起，忽视氮氧化物的作用
    - 认为酸雨会很快腐蚀金属和建筑，实际是一个长期累积过程
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S1.md
- id: concept:生物:重复组
  type: Concept
  subject: 生物
  title: 重复组
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将重复组等同于对照组，实际重复组是多次实验取平均值。
    - 能指出并纠正这一错误：认为重复实验是为了得到最大值或最小值，而不是排除偶然因素。
  aliases:
    - 重复实验
  category: 科学方法
  explanation: 重复组是指在相同条件下重复实验多次，取平均值以排除偶然因素影响，提高结果可靠性。
  misconceptions:
    - 将重复组等同于对照组，实际重复组是多次实验取平均值。
    - 认为重复实验是为了得到最大值或最小值，而不是排除偶然因素。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S1.md
- id: concept:生物:防治环境污染
  type: Concept
  subject: 生物
  title: 防治环境污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为防治环境污染只指对已产生的污染进行治理，忽略源头预防
    - 能指出并纠正这一错误：认为只要减少污染物排放量，就一定能彻底消除对环境的影响
  aliases: []
  category: 生态保护措施
  explanation: 采取措施减少污染物排放，治理污染，保护环境质量。
  misconceptions:
    - 认为防治环境污染只指对已产生的污染进行治理，忽略源头预防
    - 认为只要减少污染物排放量，就一定能彻底消除对环境的影响
    - 将防治环境污染等同于植树造林和增加绿化面积，忽视污染治理本身
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C6/sections/S2.md
- id: concept:生物:随机取样
  type: Concept
  subject: 生物
  title: 随机取样
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：随机取样时故意挑长得好的个体，导致样本偏大。
    - 能指出并纠正这一错误：认为随机取样就是随意抓取，不保证每个样本机会均等。
  aliases:
    - 随机抽样
  category: 科学方法
  explanation: 在抽样检测时，不凭主观选择，使每个样本被选中的机会均等，以保证样本代表性。
  misconceptions:
    - 随机取样时故意挑长得好的个体，导致样本偏大。
    - 认为随机取样就是随意抓取，不保证每个样本机会均等。
    - 用固定间隔取样代替随机取样，忽略随机性要求。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S5.md
- id: concept:生物:隐性基因
  type: Concept
  subject: 生物
  title: 隐性基因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为隐性基因在杂合子中不存在，实际上Dd中就有隐性基因d
    - 能指出并纠正这一错误：认为隐性基因不能表达，实际上隐性纯合时能表达
  aliases: []
  category: 遗传学概念
  explanation: 控制隐性性状的基因，通常用小写英文字母表示。
  misconceptions:
    - 认为隐性基因在杂合子中不存在，实际上Dd中就有隐性基因d
    - 认为隐性基因不能表达，实际上隐性纯合时能表达
    - 认为隐性基因总是导致遗传病，实际上许多隐性基因无害
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:隐性性状
  type: Concept
  subject: 生物
  title: 隐性性状
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为隐性性状在子一代不表现，就永远消失了，实际上子二代可再次出现
    - 能指出并纠正这一错误：认为后代中数量少的性状就是隐性性状，实际需看纯种杂交子一代是否表现
  aliases: []
  category: 遗传学概念
  explanation: 具有相对性状的两个纯种个体杂交时，子一代未表现出的性状称为隐性性状。
  misconceptions:
    - 认为隐性性状在子一代不表现，就永远消失了，实际上子二代可再次出现
    - 认为后代中数量少的性状就是隐性性状，实际需看纯种杂交子一代是否表现
    - 认为隐性性状是隐性的，所以不能遗传，实际隐性性状的遗传信息照样传给后代
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:隐性遗传病
  type: Concept
  subject: 生物
  title: 隐性遗传病
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要带一个隐性致病基因（杂合）就会患病，如把Aa误判为白化病患者，实际Aa表现正常。
    - 能指出并纠正这一错误：认为父母双方都正常，就不可能生出患隐性遗传病的孩子，忽略父母可能都是携带者，如Aa×Aa可生出a…
  aliases: []
  category: 遗传病
  explanation: 由隐性致病基因引起的疾病，当隐性致病基因纯合时个体患病，杂合时个体表现正常但携带致病基因。
  misconceptions:
    - 认为只要带一个隐性致病基因（杂合）就会患病，如把Aa误判为白化病患者，实际Aa表现正常。
    - 认为父母双方都正常，就不可能生出患隐性遗传病的孩子，忽略父母可能都是携带者，如Aa×Aa可生出aa患儿。
    - 认为隐性遗传病会代代相传（像显性遗传病那样），实际常常隔代遗传，如aa患病，子女若Aa则不患病。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:雄激素
  type: Concept
  subject: 生物
  title: 雄激素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为雄激素由卵巢分泌，实际主要由睾丸分泌。
    - 能指出并纠正这一错误：说雄激素促进女性第二性征出现，实际促进男性生殖器官和第二性征。
  aliases:
    - 雄性激素
  category: 激素
  explanation: 主要由睾丸分泌，促进男性生殖器官发育和第二性征出现。
  misconceptions:
    - 认为雄激素由卵巢分泌，实际主要由睾丸分泌。
    - 说雄激素促进女性第二性征出现，实际促进男性生殖器官和第二性征。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:雌激素
  type: Concept
  subject: 生物
  title: 雌激素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为雌激素由睾丸分泌，实际主要由卵巢分泌。
    - 能指出并纠正这一错误：说雌激素促进男性第二性征，实际促进女性生殖器官发育和第二性征。
  aliases:
    - 雌性激素
  category: 激素
  explanation: 主要由卵巢分泌，促进女性生殖器官发育和第二性征出现。
  misconceptions:
    - 认为雌激素由睾丸分泌，实际主要由卵巢分泌。
    - 说雌激素促进男性第二性征，实际促进女性生殖器官发育和第二性征。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:霉菌
  type: Concept
  subject: 生物
  title: 霉菌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为霉菌是单细胞真菌，没有菌丝（实际是多细胞，由菌丝构成）
    - 能指出并纠正这一错误：认为霉菌与酵母菌一样主要进行出芽生殖（实际通过孢子繁殖）
  aliases: []
  category: 生物概念
  explanation: 霉菌是多细胞真菌，由菌丝构成，包括气生菌丝和营养菌丝，通过孢子繁殖。
  misconceptions:
    - 认为霉菌是单细胞真菌，没有菌丝（实际是多细胞，由菌丝构成）
    - 认为霉菌与酵母菌一样主要进行出芽生殖（实际通过孢子繁殖）
    - 认为霉菌没有细胞壁，是原核生物（实际有细胞壁，真核）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:青光眼
  type: Concept
  subject: 生物
  title: 青光眼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为青光眼是晶状体浑浊，其实为视神经损伤
    - 能指出并纠正这一错误：认为眼压正常就不会得青光眼，存在正常眼压性青光眼
  aliases: []
  category: 疾病
  explanation: 主要与眼压增高引起的视神经损伤有关的致盲性眼病。
  misconceptions:
    - 误以为青光眼是晶状体浑浊，其实为视神经损伤
    - 认为眼压正常就不会得青光眼，存在正常眼压性青光眼
    - 觉得青光眼可用角膜移植治愈，应降低眼压和保护视神经
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:青春期
  type: Concept
  subject: 生物
  title: 青春期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为青春期只是身体变化，心理没有变化，实际心理也会显著变化。
    - 能指出并纠正这一错误：把青春期定为从18岁开始，实际一般从10~14岁进入青春期。
  aliases: []
  category: 人体生理
  explanation: 从儿童过渡到成年的时期，身体和心理发生显著变化。
  misconceptions:
    - 认为青春期只是身体变化，心理没有变化，实际心理也会显著变化。
    - 把青春期定为从18岁开始，实际一般从10~14岁进入青春期。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C5/sections/S2.md
- id: concept:生物:青春期卫生保健
  type: Concept
  subject: 生物
  title: 青春期卫生保健
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为青春期卫生保健只注意个人卫生，忽略合理营养和心理健康。
    - 能指出并纠正这一错误：遇到心理问题自己硬扛，不及时寻求帮助，可能影响健康成长。
  aliases:
    - 青春期保健
  category: 健康
  explanation: 青春期应注意个人卫生、合理营养、适当锻炼，并关注心理健康，遇到问题及时寻求帮助。
  misconceptions:
    - 认为青春期卫生保健只注意个人卫生，忽略合理营养和心理健康。
    - 遇到心理问题自己硬扛，不及时寻求帮助，可能影响健康成长。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:青春期发育特点
  type: Concept
  subject: 生物
  title: 青春期发育特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为男孩和女孩青春期的发育顺序完全相同，实际女孩一般早于男孩。
    - 能指出并纠正这一错误：认为身高突增只在青春期出现，实际青春期是生长高峰但非唯一时期。
  aliases:
    - 青春期身体变化
  category: 生理学
  explanation: 青春期是人体生长发育的关键时期，女孩和男孩在身高、第二性征等方面出现明显变化，如女孩乳房发育、月经初潮，男孩喉结、遗精等。
  misconceptions:
    - 认为男孩和女孩青春期的发育顺序完全相同，实际女孩一般早于男孩。
    - 认为身高突增只在青春期出现，实际青春期是生长高峰但非唯一时期。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:静脉
  type: Concept
  subject: 生物
  title: 静脉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有静脉中流的是静脉血，实际上肺静脉中流动脉血。
    - 能指出并纠正这一错误：认为静脉一定在体表，或所有静脉都有静脉瓣（大静脉和深静脉没有）。
  aliases:
    - vein
  category: 生物学概念
  explanation: 静脉是将血液从全身各处送回心脏的血管，管壁薄、弹性小、血流速度慢，四肢静脉内有静脉瓣。
  misconceptions:
    - 认为所有静脉中流的是静脉血，实际上肺静脉中流动脉血。
    - 认为静脉一定在体表，或所有静脉都有静脉瓣（大静脉和深静脉没有）。
    - 认为静脉管壁厚、弹性大，与动脉特征混淆。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S2.md
- id: concept:生物:静脉出血
  type: Concept
  subject: 生物
  title: 静脉出血
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为静脉出血为鲜红色喷射状，实际是暗红色连续流出
    - 能指出并纠正这一错误：认为静脉出血比动脉出血更危险，需立即用止血带
  aliases: []
  category: 医学常识
  explanation: 血液呈暗红色，缓慢而连续不断地从伤口流出。
  misconceptions:
    - 认为静脉出血为鲜红色喷射状，实际是暗红色连续流出
    - 认为静脉出血比动脉出血更危险，需立即用止血带
    - 指压止血时选近心端，静脉出血应压远心端或伤口远端
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:静脉瓣
  type: Concept
  subject: 生物
  title: 静脉瓣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为静脉瓣存在于所有静脉中，实际上四肢静脉才有。
    - 能指出并纠正这一错误：认为静脉瓣的作用是加速血液流动，实际是防止倒流。
  aliases: []
  category: 生物学结构
  explanation: 静脉瓣是四肢静脉内表面的瓣膜，防止血液倒流。
  misconceptions:
    - 认为静脉瓣存在于所有静脉中，实际上四肢静脉才有。
    - 认为静脉瓣的作用是加速血液流动，实际是防止倒流。
    - 将静脉瓣与动脉瓣、房室瓣的位置和功能混淆。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S2.md
- id: concept:生物:非处方药
  type: Concept
  subject: 生物
  title: 非处方药
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非处方药绝对安全，可以长期乱吃。
    - 能指出并纠正这一错误：以为非处方药都无需读说明书，凭经验吃。
  aliases:
    - OTC
  category: 医学常识
  explanation: 非处方药是指不需要凭执业医师或执业助理医师的处方即可购买，但需要按药品说明书的规定使用的药物，包括甲类和乙类。非处方药适于消费者易于进行自我诊断、自我治疗的小伤小病。
  misconceptions:
    - 认为非处方药绝对安全，可以长期乱吃。
    - 以为非处方药都无需读说明书，凭经验吃。
    - 混淆甲类和乙类非处方药，以为乙类毒性更强。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:非条件反射
  type: Concept
  subject: 生物
  title: 非条件反射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将望梅止渴、听到铃声分泌唾液等条件反射当成非条件反射
    - 能指出并纠正这一错误：认为非条件反射需要经过大脑分析和判断才能完成
  aliases:
    - 简单反射
  category: 生物学概念
  explanation: 非条件反射是生来就有的反射，不需要先经过大脑的分析和判断，如缩手反射、眨眼反射、排尿反射、膝跳反射等。
  misconceptions:
    - 将望梅止渴、听到铃声分泌唾液等条件反射当成非条件反射
    - 认为非条件反射需要经过大脑分析和判断才能完成
    - 误以为膝跳反射是有意识控制的反射，因此属于条件反射
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:非特异性免疫
  type: Concept
  subject: 生物
  title: 非特异性免疫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非特异性免疫包括第三道防线，混淆所有免疫防线
    - 能指出并纠正这一错误：认为非特异性免疫是后天获得的，忽略其生来就有
  aliases:
    - 先天性免疫
  category: 核心概念
  explanation: 人生来就有的，对多种病原体都有防御作用，包括第一道和第二道防线。
  misconceptions:
    - 认为非特异性免疫包括第三道防线，混淆所有免疫防线
    - 认为非特异性免疫是后天获得的，忽略其生来就有
    - 认为非特异性免疫只对特定病原体起作用，忽略其应对多种病原体
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:非生物因素
  type: Concept
  subject: 生物
  title: 非生物因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为非生物因素只包括光、温度和水，忽略空气、土壤等对生物的影响。
    - 能指出并纠正这一错误：认为非生物因素对生物的作用是孤立的，比如只把干旱归因于缺水，忽略往往伴随的高温。
  aliases:
    - 非生物因子
  category: 生态因素分类
  explanation: 非生物因素包括光、温度、水、空气、土壤等，它们影响生物的生活和分布。
  misconceptions:
    - 误以为非生物因素只包括光、温度和水，忽略空气、土壤等对生物的影响。
    - 认为非生物因素对生物的作用是孤立的，比如只把干旱归因于缺水，忽略往往伴随的高温。
    - 以为阳光只对植物有影响，动物不受光照影响，如忽略光照影响动物的繁殖节律。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:非生物因素对生物的影响
  type: Concept
  subject: 生物
  title: 非生物因素对生物的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为光照只影响植物，不影响动物，忽略鼠妇等动物也受光照影响。
    - 能指出并纠正这一错误：把非生物因素当成生物因素，认为水和空气也属于生物因素。
  aliases:
    - 非生物因素
  category: 生态学
  explanation: 非生物因素如光照、温度、水分等会影响动物的生活和分布，例如光照影响鼠妇分布，温度影响金鱼呼吸。
  misconceptions:
    - 误认为光照只影响植物，不影响动物，忽略鼠妇等动物也受光照影响。
    - 把非生物因素当成生物因素，认为水和空气也属于生物因素。
    - 误认为温度只影响变温动物，不影响恒温动物，如哺乳动物在低温下不受影响。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S1.md
- id: concept:生物:鞭毛
  type: Concept
  subject: 生物
  title: 鞭毛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有细菌都有鞭毛（实际只有部分细菌有）
    - 能指出并纠正这一错误：认为鞭毛是细菌的骨骼，起支撑作用（实际与运动有关）
  aliases: []
  category: 生物学结构
  explanation: 某些细菌表面细长的结构，有助于细菌在液体中游动。
  misconceptions:
    - 认为所有细菌都有鞭毛（实际只有部分细菌有）
    - 认为鞭毛是细菌的骨骼，起支撑作用（实际与运动有关）
    - 认为鞭毛和菌毛一样是运动结构（菌毛一般与附着有关）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:预防接种证
  type: Concept
  subject: 生物
  title: 预防接种证
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为接种证只在接种时使用，忽视其是入托入学必须查验的凭证。
    - 能指出并纠正这一错误：认为接种证应在所有疫苗打完后才办理，实际出生后就要办理并妥善保管。
  aliases:
    - 接种证
  category: 公共卫生
  explanation: 记录儿童预防接种信息的证件，用于有计划地进行预防接种。
  misconceptions:
    - 认为接种证只在接种时使用，忽视其是入托入学必须查验的凭证。
    - 认为接种证应在所有疫苗打完后才办理，实际出生后就要办理并妥善保管。
    - 认为预防接种证只在儿童期有用，成人出国或特殊岗位也需查验接种记录。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S2.md
- id: concept:生物:风险比
  type: Concept
  subject: 生物
  title: 风险比
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为风险比大于1表示疾病风险降低，小于1表示风险升高。
    - 能指出并纠正这一错误：把风险比等于1理解成风险最大，其实等于1表示与对照组风险相同。
  aliases: []
  category: 概念
  explanation: 风险比反映疾病发生的风险，大于1表示风险升高，小于1表示风险降低。
  misconceptions:
    - 认为风险比大于1表示疾病风险降低，小于1表示风险升高。
    - 把风险比等于1理解成风险最大，其实等于1表示与对照组风险相同。
    - 认为风险比数值越大表示患病绝对风险越高，忽略了这是相对风险。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S3.md
- id: concept:生物:飞沫传播
  type: Concept
  subject: 生物
  title: 飞沫传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为飞沫传播等同于空气传播，实际气溶胶传播才是空气传播。
    - 能指出并纠正这一错误：认为佩戴口罩一定能预防飞沫传播，忽略密闭空间气溶胶风险。
  aliases: []
  category: 生物学概念
  explanation: 病原体通过飞沫悬浮于空气中，被他人吸入后感染的方式，如流感、新型冠状病毒感染等。
  misconceptions:
    - 误认为飞沫传播等同于空气传播，实际气溶胶传播才是空气传播。
    - 认为佩戴口罩一定能预防飞沫传播，忽略密闭空间气溶胶风险。
    - 认为飞沫传播仅通过呼吸道吸入，忽略眼睛等黏膜接触传播。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S1.md
- id: concept:生物:食品安全
  type: Concept
  subject: 生物
  title: 食品安全
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为食品只要看着、闻着没坏就绝对安全，过期可忽略
    - 能指出并纠正这一错误：用清水冲洗果蔬就能完全去除农药残留
  aliases: []
  category: 食品安全
  explanation: 食品安全指食品无毒、无害，符合应当有的营养要求，对人体健康不造成任何急性、亚急性或者慢性危害。
  misconceptions:
    - 认为食品只要看着、闻着没坏就绝对安全，过期可忽略
    - 用清水冲洗果蔬就能完全去除农药残留
    - 认为路边摊经过高温油炸就符合食品安全
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S3.md
- id: concept:生物:食物中的营养物质
  type: Concept
  subject: 生物
  title: 食物中的营养物质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为食物中的营养物质只有糖类、脂肪和蛋白质，忽略水、无机盐、维生素。
    - 能指出并纠正这一错误：把无机盐当作供能物质，实际无机盐不提供能量但参与调节。
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 认为食物中的营养物质只有糖类、脂肪和蛋白质，忽略水、无机盐、维生素。
    - 把无机盐当作供能物质，实际无机盐不提供能量但参与调节。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C2/sections/S1.md
- id: concept:生物:食物的消化
  type: Concept
  subject: 生物
  title: 食物的消化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为消化只有化学性消化，忽略牙齿咀嚼和胃肠蠕动也是消化
    - 能指出并纠正这一错误：认为蛋白质在口腔就被消化成氨基酸，实际口腔只初步消化淀粉
  aliases:
    - 消化
  category: 人体生理学
  explanation: 食物在消化道内被分解为小分子物质的过程，包括物理性消化和化学性消化。
  misconceptions:
    - 认为消化只有化学性消化，忽略牙齿咀嚼和胃肠蠕动也是消化
    - 认为蛋白质在口腔就被消化成氨基酸，实际口腔只初步消化淀粉
    - 认为食物消化后仍是大分子，可直接被细胞吸收，实际需分解为小分子
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:食物网
  type: Concept
  subject: 生物
  title: 食物网
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为各条食物链彼此独立，互不交错
    - 能指出并纠正这一错误：把分解者加进食物网，实际上食物网只含生产者和消费者
  aliases:
    - food web
  category: 生态学概念
  explanation: 在一个生态系统中，很多条食物链彼此交错连接形成的网状结构。
  misconceptions:
    - 认为各条食物链彼此独立，互不交错
    - 把分解者加进食物网，实际上食物网只含生产者和消费者
    - 误以为食物网中生物之间只有捕食关系，没有竞争关系
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:食物链
  type: Concept
  subject: 生物
  title: 食物链
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在食物链中写入阳光、空气，如'阳光→草→兔'
    - 能指出并纠正这一错误：把分解者写进食物链，如'草→兔→细菌'
  aliases:
    - food chain
  category: 生态学概念
  explanation: 在生态系统中，不同生物之间由于吃与被吃的关系而形成的链状联系。
  misconceptions:
    - 在食物链中写入阳光、空气，如'阳光→草→兔'
    - 把分解者写进食物链，如'草→兔→细菌'
    - 把箭头方向写反，如'鹰→鸡→虫'，实际应为'虫→鸡→鹰'
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:食物链和食物网
  type: Concept
  subject: 生物
  title: 食物链和食物网
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将腐生细菌等分解者写入食物链，破坏营养结构。
    - 能指出并纠正这一错误：认为食物链可以无限长，忽略能量递减的限制。
  aliases:
    - 营养结构
  category: 生态学
  explanation: 食物链是生物之间由于食物关系而形成的一种联系，多条食物链交错连接构成食物网，是生态系统的营养结构。
  misconceptions:
    - 误将腐生细菌等分解者写入食物链，破坏营养结构。
    - 认为食物链可以无限长，忽略能量递减的限制。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C5/sections/S2.md
- id: concept:生物:饮酒的危害
  type: Concept
  subject: 生物
  title: 饮酒的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：做酒精对水蚤心率实验时，认为酒精浓度越高心率越快，实际高浓度会抑制心率。
    - 能指出并纠正这一错误：认为只有醉酒才算有害，少量饮酒对健康有益且无风险。
  aliases: []
  category: 健康知识
  explanation: 饮酒危害人体健康，可通过实验观察酒精对水蚤心率的影响来探究。
  misconceptions:
    - 做酒精对水蚤心率实验时，认为酒精浓度越高心率越快，实际高浓度会抑制心率。
    - 认为只有醉酒才算有害，少量饮酒对健康有益且无风险。
    - 主张直接用人做饮酒实验，忽略用动物替代实验的安全性和伦理问题。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C3/sections/S4.md
- id: concept:生物:骨的运动要靠骨骼肌的牵拉
  type: Concept
  subject: 生物
  title: 骨的运动要靠骨骼肌的牵拉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为骨能够自主运动，忽视骨骼肌收缩是骨位置变化的动力。
    - 能指出并纠正这一错误：把骨当作运动器官而忽略其被动牵拉性质。
  aliases: []
  category: 生理学
  explanation: 骨本身不能运动，其位置变化由骨骼肌收缩牵拉产生。
  misconceptions:
    - 认为骨能够自主运动，忽视骨骼肌收缩是骨位置变化的动力。
    - 把骨当作运动器官而忽略其被动牵拉性质。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:骨骼肌
  type: Concept
  subject: 生物
  title: 骨骼肌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把骨骼肌等同于肌腹，忽略两端的肌腱部分。
    - 能指出并纠正这一错误：误以为骨骼肌的收缩由肌腱完成，肌腹只提供营养。
  aliases:
    - 肌肉
  category: 生物学概念
  explanation: 骨骼肌是附着在骨骼上的肌肉，由肌腹和肌腱组成，具有收缩和舒张功能。
  misconceptions:
    - 把骨骼肌等同于肌腹，忽略两端的肌腱部分。
    - 误以为骨骼肌的收缩由肌腱完成，肌腹只提供营养。
    - 认为每块骨骼肌只跨过一个关节，实际部分肌肉跨多关节。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:骨骼肌收缩牵动骨绕关节活动
  type: Concept
  subject: 生物
  title: 骨骼肌收缩牵动骨绕关节活动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为关节是产生运动的动力来源，忽略骨骼肌收缩的作用。
    - 能指出并纠正这一错误：把神经冲动与肌肉收缩的过程颠倒，认为肌肉先收缩再接受神经信号。
  aliases: []
  category: 生理学
  explanation: 骨骼肌接受神经传来的冲动后收缩，牵动骨绕关节活动，从而产生运动。
  misconceptions:
    - 误认为关节是产生运动的动力来源，忽略骨骼肌收缩的作用。
    - 把神经冲动与肌肉收缩的过程颠倒，认为肌肉先收缩再接受神经信号。
    - 认为骨骼肌收缩只能牵拉骨而不能推动骨，产生运动必须靠关节活动。
  sourceRef: content/八年级/上册/生物/PEP-8-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:骨髓移植
  type: Concept
  subject: 生物
  title: 骨髓移植
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为骨髓移植是直接移植骨骼，实际是移植造血干细胞。
    - 能指出并纠正这一错误：认为只能用亲兄弟的骨髓，实际有中华骨髓库等无关供者。
  aliases: []
  category: 医学治疗
  explanation: 骨髓移植是移植骨髓中的造血干细胞，用于治疗白血病等疾病。
  misconceptions:
    - 认为骨髓移植是直接移植骨骼，实际是移植造血干细胞。
    - 认为只能用亲兄弟的骨髓，实际有中华骨髓库等无关供者。
    - 认为骨髓移植后患者立刻就恢复，不知有排异和恢复期。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C8/sections/S1.md
- id: concept:生物:鱼与人类生活的关系
  type: Concept
  subject: 生物
  title: 鱼与人类生活的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为渔业资源取之不尽，可以无限制捕捞。
    - 能指出并纠正这一错误：误以为长江十年禁渔使鱼类减少，实际是为了恢复资源。
  aliases:
    - 渔业资源保护
  category: 生物学概念
  explanation: 鱼为人类提供蛋白质食物，并融入文化，如年画寓意年年有余；我国通过《渔业法》和长江十年禁渔等措施保护鱼类资源。
  misconceptions:
    - 认为渔业资源取之不尽，可以无限制捕捞。
    - 误以为长江十年禁渔使鱼类减少，实际是为了恢复资源。
    - 认为保护鱼类只是保护动物，与人类文化、经济无关。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:鱼的主要特征
  type: Concept
  subject: 生物
  title: 鱼的主要特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为鲸、海豚是鱼，因为生活在水中，但它们是哺乳动物。
    - 能指出并纠正这一错误：认为鱼都用肺呼吸，如鲨鱼其实用鳃呼吸。
  aliases: []
  category: 生物特征
  explanation: 鱼能靠游动获取食物和躲避敌害，通过鳃在水中呼吸。
  misconceptions:
    - 误认为鲸、海豚是鱼，因为生活在水中，但它们是哺乳动物。
    - 认为鱼都用肺呼吸，如鲨鱼其实用鳃呼吸。
    - 误认为黄鳝、泥鳅不是鱼，因为外形像蛇，但它们用鳃呼吸且有鳍。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:鱼的体形与运动
  type: Concept
  subject: 生物
  title: 鱼的体形与运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为鱼游泳全靠鳍的协调摆动，忽略了尾部和躯干的摆动才是主要动力，如鲨鱼游泳时尾鳍摆动提供主要推进…
    - 能指出并纠正这一错误：把所有鱼都当作流线型体形，比如比目鱼、海马体形特殊，但同样适应水中生活。
  aliases:
    - 流线型体形
  category: 生物学概念
  explanation: 鱼的身体分头、躯干和尾三部分，左右侧扁，呈流线型，有利于减小游泳时的阻力；通过尾部和躯干部的摆动以及鳍的协调作用游泳。
  misconceptions:
    - 认为鱼游泳全靠鳍的协调摆动，忽略了尾部和躯干的摆动才是主要动力，如鲨鱼游泳时尾鳍摆动提供主要推进。
    - 把所有鱼都当作流线型体形，比如比目鱼、海马体形特殊，但同样适应水中生活。
    - 误以为左右侧扁的体形是为了增大阻力，实际是减小游泳时的阻力。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:鱼的呼吸器官——鳃
  type: Concept
  subject: 生物
  title: 鱼的呼吸器官——鳃
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为水从鱼鳃盖流入口中，实际相反，水由口进入，从鳃盖流出，如观察鱼呼吸时可看到口和鳃盖交替开合。
    - 能指出并纠正这一错误：认为鱼呼吸的是空气中的氧气，实际鱼利用的是溶解在水中的氧气，鱼离开水会因鳃丝干燥无法获氧而死亡。
  aliases:
    - 鳃
  category: 生物学概念
  explanation: 鳃是鱼的呼吸器官，主要部分是鳃丝，鳃丝中密布毛细血管，水从鱼口流进，经过鳃丝时，溶解在水中的氧进入血液，二氧化碳排出体外。
  misconceptions:
    - 以为水从鱼鳃盖流入口中，实际相反，水由口进入，从鳃盖流出，如观察鱼呼吸时可看到口和鳃盖交替开合。
    - 认为鱼呼吸的是空气中的氧气，实际鱼利用的是溶解在水中的氧气，鱼离开水会因鳃丝干燥无法获氧而死亡。
    - 误以为鳃丝本身是气体交换场所，实际是鳃丝内密布的毛细血管完成氧和二氧化碳的交换。
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S1.md
- id: concept:生物:鸟与人类生活的关系
  type: Concept
  subject: 生物
  title: 鸟与人类生活的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为鸟对人类只有益处，没有害处（如害鸟会糟蹋庄稼）
    - 能指出并纠正这一错误：认为所有鸟都能捕食害虫（有些鸟以谷物为食）
  aliases: []
  category: 生物学应用
  explanation: 鸟能捕食害虫，家禽提供蛋白质，为艺术创作提供灵感。
  misconceptions:
    - 认为鸟对人类只有益处，没有害处（如害鸟会糟蹋庄稼）
    - 认为所有鸟都能捕食害虫（有些鸟以谷物为食）
    - 认为家禽只提供蛋白质，忽略鸟在艺术创作中的价值（如丹顶鹤入画）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C2/sections/S2.md
- id: concept:生物:鸟卵的结构
  type: Concept
  subject: 生物
  title: 鸟卵的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为鸟卵的卵白是卵细胞的细胞质，实际卵黄才是细胞质。
    - 能指出并纠正这一错误：误将卵壳和卵壳膜当作鸡卵的细胞膜，实际上卵黄膜才是细胞膜。
  aliases:
    - 鸡蛋结构
    - 鸟蛋结构
  category: 生物学概念
  explanation: 鸟卵由卵壳、卵壳膜、卵白（蛋清）、卵黄等组成，卵壳和卵壳膜起保护作用，卵白和卵黄储存营养物质。
  misconceptions:
    - 误认为鸟卵的卵白是卵细胞的细胞质，实际卵黄才是细胞质。
    - 误将卵壳和卵壳膜当作鸡卵的细胞膜，实际上卵黄膜才是细胞膜。
    - 认为鸟卵中卵黄为胚胎发育提供主要营养，而卵白只保护，忽略卵白也储存营养。
  sourceRef: content/八年级/下册/生物/PEP-8-2-Biology/chapters/C3/sections/S3.md
- id: concept:生物:鸟的主要特征
  type: Concept
  subject: 生物
  title: 鸟的主要特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为鸟的体温随环境变化而变化（实际体温恒定）
    - 能指出并纠正这一错误：认为鸟有牙齿，用于咀嚼食物（实际有喙无齿）
  aliases:
    - 鸟类特征
  category: 生物学概念
  explanation: 鸟的体温恒定，体表覆羽，前肢变成翼，有喙无齿，有气囊辅助肺呼吸。
  misconceptions:
    - 认为鸟的体温随环境变化而变化（实际体温恒定）
    - 认为鸟有牙齿，用于咀嚼食物（实际有喙无齿）
    - 认为气囊是鸟的主要呼吸器官（气囊只辅助呼吸，肺才是主要）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:鸟适于飞行的形态结构特点
  type: Concept
  subject: 生物
  title: 鸟适于飞行的形态结构特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为身体呈流线型是为了减轻重量（实际是减少空气阻力）
    - 能指出并纠正这一错误：认为鸟骨骼薄而脆弱，只靠轻来适应飞行（实际骨骼中空且坚固）
  aliases:
    - 鸟类飞行适应
  category: 生物学结构适应
  explanation: 鸟的身体呈流线型，体表覆羽，前肢变成翼，骨骼轻薄，有龙骨突和发达胸肌，呼吸系统有气囊辅助。
  misconceptions:
    - 认为身体呈流线型是为了减轻重量（实际是减少空气阻力）
    - 认为鸟骨骼薄而脆弱，只靠轻来适应飞行（实际骨骼中空且坚固）
    - 认为气囊与肺一样能交换气体（气囊只贮存气体，不进行交换）
  sourceRef: content/七年级/上册/生物/PEP-7-1-Biology/chapters/C7/sections/S2.md
- id: concept:生物:麦芽糖
  type: Concept
  subject: 生物
  title: 麦芽糖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为麦芽糖遇碘变蓝，实际遇碘变蓝的是淀粉。
    - 能指出并纠正这一错误：说麦芽糖是由葡萄糖分解产生的，实际麦芽糖是淀粉分解的产物。
  aliases: []
  category: 生物学概念
  explanation: 麦芽糖是淀粉分解的产物，有甜味，遇碘不变蓝。
  misconceptions:
    - 认为麦芽糖遇碘变蓝，实际遇碘变蓝的是淀粉。
    - 说麦芽糖是由葡萄糖分解产生的，实际麦芽糖是淀粉分解的产物。
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
- id: concept:生物:龋齿
  type: Concept
  subject: 生物
  title: 龋齿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为龋齿是蔗糖直接腐蚀牙齿，与细菌作用无关
    - 能指出并纠正这一错误：认为饭后立即刷牙就能彻底防龋，忽略细菌持续产酸的过程
  aliases:
    - 蛀牙
  category: 健康
  explanation: 口腔中细菌作用下，蔗糖转化为酸性物质，吸附在牙表面，如不及时清除会导致龋齿。
  misconceptions:
    - 认为龋齿是蔗糖直接腐蚀牙齿，与细菌作用无关
    - 认为饭后立即刷牙就能彻底防龋，忽略细菌持续产酸的过程
    - 认为只有儿童会得龋齿，成人牙釉质厚不会被腐蚀
  sourceRef: content/七年级/下册/生物/PEP-7-2-Biology/chapters/C6/sections/S2.md
