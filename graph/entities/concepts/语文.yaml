- id: concept:语文:ABB式词语
  type: Concept
  subject: 语文
  title: ABB式词语
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 像“懒洋洋、静悄悄”这样后两个字相同的词语，读起来有画面感，能让描写更生动。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:X光衍射
  type: Concept
  subject: 语文
  title: X光衍射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“衍射”误写为“演射”，如作文中写“X光演射”。
    - 能指出并纠正这一错误：误认为X光衍射是光透过晶体发生折射，忽略“衍射”指绕过障碍物。
  aliases:
    - X射线衍射
  category: 物理学
  explanation: X光通过晶体时产生衍射现象，用于检测晶体内部结构。
  misconceptions:
    - 将“衍射”误写为“演射”，如作文中写“X光演射”。
    - 误认为X光衍射是光透过晶体发生折射，忽略“衍射”指绕过障碍物。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:jqx与ü相拼省略两点
  type: Concept
  subject: 语文
  title: jqx与ü相拼省略两点
  conceptType: 概念型
  aliases:
    - ü上两点省略
  category: 法则
  explanation: j、q、x 和 ü 相拼时，ü 上的两点要去掉，写成 u，比如 j—ü 拼成 ju。这是因为声母 j、q、x 从来不和真正的 u 相拼，所以两点可以省。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:‘伟大的神力’
  type: Concept
  subject: 语文
  title: ‘伟大的神力’
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把第一次“伟大的神力”当成阿长真的具有退敌法术，忽略了童年视角的荒诞感。
    - 能指出并纠正这一错误：误以为两次“伟大的神力”都表达赞美，没有区分第一次的调侃和第二次的感激。
  aliases: []
  category: 关键语句
  explanation: 文中两次出现，第一次指阿长讲长毛故事时的‘神力’，第二次指她买来《山海经》的‘神力’，含义不同。
  misconceptions:
    - 把第一次“伟大的神力”当成阿长真的具有退敌法术，忽略了童年视角的荒诞感。
    - 误以为两次“伟大的神力”都表达赞美，没有区分第一次的调侃和第二次的感激。
    - 将第二次“神力”理解为阿长有求神拜佛的能力，与买书无关。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:“一”的变调
  type: Concept
  subject: 语文
  title: “一”的变调
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 一 本来读一声，但和别的字连在一起时读音会变，比如一片片、一群里的 一 读不同的声调。读词语时要特别留意 一 的读音。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:“一二·一”运动
  type: Concept
  subject: 语文
  title: “一二·一”运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“一二·一”运动误写成“一二·九”，混淆了两次学生运动。
    - 能指出并纠正这一错误：认为“一二·一”是指“12月1日”，写成“12·1”或“一二一”。
  aliases:
    - 一二一惨案
  category: 历史背景
  explanation: 1945年12月1日，昆明学生为反对内战遭国民党镇压，死伤多人，是民主运动的重要事件。
  misconceptions:
    - 把“一二·一”运动误写成“一二·九”，混淆了两次学生运动。
    - 认为“一二·一”是指“12月1日”，写成“12·1”或“一二一”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:“不”的变调
  type: Concept
  subject: 语文
  title: “不”的变调
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 不 字和别的字连在一起读时，声调会变，比如不多、不行、不久里 不 的读音不一样。读词语时要留意 不 的变调。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C9/sections/S3.md
- id: concept:语文:“熟能生巧”的道理
  type: Concept
  subject: 语文
  title: “熟能生巧”的道理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把卖油翁的技艺归为天赋，没看到‘惟手熟尔’强调的反复练习。
    - 能指出并纠正这一错误：将‘熟能生巧’中的‘熟’理解成‘熟悉’，说成‘熟悉就能产生巧妙办法’。
  aliases:
    - 熟能生巧
  category: 主旨理解
  explanation: 本文通过卖油翁“酌油沥之”的技艺，揭示了“熟能生巧”的道理，说明任何技艺只要反复练习，就能达到熟练精妙的境界。
  misconceptions:
    - 把卖油翁的技艺归为天赋，没看到‘惟手熟尔’强调的反复练习。
    - 将‘熟能生巧’中的‘熟’理解成‘熟悉’，说成‘熟悉就能产生巧妙办法’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:《三国演义》
  type: Concept
  subject: 语文
  title: 《三国演义》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《三国演义》的作者误记为施耐庵，与《水浒传》作者张冠李戴
    - 能指出并纠正这一错误：认为《三国演义》是编年体史书，说它按时间记录三国真实事件
  aliases:
    - 三国志演义
  category: 文学常识
  explanation: 我国第一部章回体长篇历史演义小说，作者罗贯中，以东汉末年至西晋建立为背景，叙述魏蜀吴三国兴衰。
  misconceptions:
    - 把《三国演义》的作者误记为施耐庵，与《水浒传》作者张冠李戴
    - 认为《三国演义》是编年体史书，说它按时间记录三国真实事件
    - 将“三顾茅庐”说成出自《水浒传》，混淆两部作品情节
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:《丑奴儿·书博山道中壁》
  type: Concept
  subject: 语文
  title: 《丑奴儿·书博山道中壁》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“丑奴儿”当作作品题目，忽略“书博山道中壁”才是标题
    - 能指出并纠正这一错误：将“欲说还休”解释为“想躺着说话”，没懂“还休”是停止之意
  aliases:
    - 采桑子
  category: 古诗词
  explanation: 辛弃疾的词作，通过少年与成年对“愁”的不同感受，表达人生无奈，运用对比手法。
  misconceptions:
    - 把“丑奴儿”当作作品题目，忽略“书博山道中壁”才是标题
    - 将“欲说还休”解释为“想躺着说话”，没懂“还休”是停止之意
    - 误认作者是李清照，因“少年不识愁滋味”像婉约词而张冠李戴
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:《世界遗产青少年教育苏州宣言》
  type: Concept
  subject: 语文
  title: 《世界遗产青少年教育苏州宣言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《苏州宣言》误记为《杭州宣言》，会议地点记错为杭州。
    - 能指出并纠正这一错误：将第28届世界遗产委员会会议写成第29届，届次混淆。
  aliases:
    - 苏州宣言
  category: 国际文件
  explanation: 2004年7月在中国苏州召开的第28届世界遗产委员会会议上通过，旨在推动世界遗产青少年教育的国际合作与行动纲领。
  misconceptions:
    - 把《苏州宣言》误记为《杭州宣言》，会议地点记错为杭州。
    - 将第28届世界遗产委员会会议写成第29届，届次混淆。
    - 将‘世界遗产青少年教育’误为‘世界遗产保护’，漏掉‘青少年教育’核心。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:《世说新语》
  type: Concept
  subject: 语文
  title: 《世说新语》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《世说新语》是刘义庆一人所著，实际是他组织编写。
    - 能指出并纠正这一错误：称《世说新语》为志怪小说，实际是志人小说。
  aliases: []
  category: 文学常识
  explanation: 《世说新语》是南朝宋临川王刘义庆组织编写的一部志人小说集，主要记载汉末至东晋士大夫的言谈、逸事。
  misconceptions:
    - 误以为《世说新语》是刘义庆一人所著，实际是他组织编写。
    - 称《世说新语》为志怪小说，实际是志人小说。
    - 把《世说新语》的朝代说成东汉或唐代，实际是南朝宋。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:《伊索寓言》
  type: Concept
  subject: 语文
  title: 《伊索寓言》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《伊索寓言》全部故事都以动物为主角，忽略《农夫和蛇》等人物故事
    - 能指出并纠正这一错误：把《伊索寓言》的作者说成是克雷洛夫，或误认为伊索是古希腊历史学家
  aliases: []
  category: 文学常识
  explanation: 古希腊寓言集，相传为伊索所作，多借动物故事讽刺社会。
  misconceptions:
    - 误以为《伊索寓言》全部故事都以动物为主角，忽略《农夫和蛇》等人物故事
    - 把《伊索寓言》的作者说成是克雷洛夫，或误认为伊索是古希腊历史学家
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《儒林外史》的批判精神
  type: Concept
  subject: 语文
  title: 《儒林外史》的批判精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《儒林外史》批判科举制度本身，所以作者主张废除科举
    - 能指出并纠正这一错误：将范进中举发疯简单归因于个人心理脆弱，忽视科举制度对读书人的精神压迫这一社会根源。
  aliases:
    - 批判精神
  category: 文学知识
  explanation: 作品通过塑造典型人物，针砭时弊，揭露科举制度对心灵的毒害，表达对理想社会的向往。
  misconceptions:
    - 认为《儒林外史》批判科举制度本身，所以作者主张废除科举；实际是批判八股取士对心灵的毒害。
    - 将范进中举发疯简单归因于个人心理脆弱，忽视科举制度对读书人的精神压迫这一社会根源。
    - 以为作品批判的是所有读书人，其实只批判热衷功名的士子，正面人物如王冕是理想人格。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:《儒林外史》的正面理想人物
  type: Concept
  subject: 语文
  title: 《儒林外史》的正面理想人物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为王冕是作者讽刺的反面人物，因他拒绝做官显得清高
    - 能指出并纠正这一错误：将杜少卿与严监生混淆，认为他也吝啬
  aliases:
    - 贤者奇人
  category: 文学知识
  explanation: 如王冕、杜少卿等，他们淡泊名利、恪守道德，与反面人物形成对比，增强批判力量。
  misconceptions:
    - 误以为王冕是作者讽刺的反面人物，因他拒绝做官显得清高；实际是正面理想形象。
    - 将杜少卿与严监生混淆，认为他也吝啬；杜少卿慷慨仗义，严监生才悭吝。
    - 认为正面人物与反面人物没有共性，不理解对比是为了增强批判力度。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《儒林外史》的讽刺艺术
  type: Concept
  subject: 语文
  title: 《儒林外史》的讽刺艺术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：片面认为《儒林外史》只用夸张手法，忽略白描和对比，如“范进中举”也有白描。
    - 能指出并纠正这一错误：将讽刺与幽默等同，认为《儒林外史》是轻松搞笑，未意识到其冷峻的批判。
  aliases:
    - 讽刺笔法
  category: 文学知识
  explanation: 《儒林外史》是中国古代最优秀的讽刺小说，通过白描、夸张、对比等手法，揭露科举制度对读书人的毒害，表达对理想社会的追求。
  misconceptions:
    - 片面认为《儒林外史》只用夸张手法，忽略白描和对比，如“范进中举”也有白描。
    - 将讽刺与幽默等同，认为《儒林外史》是轻松搞笑，未意识到其冷峻的批判。
    - 误以为讽刺的对象是具体某个人，如范进，而不知是借此揭露整个科举制度。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《元和郡县图志》
  type: Concept
  subject: 语文
  title: 《元和郡县图志》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把作者写作'李吉普'或'李洁甫'，字形错误。
    - 能指出并纠正这一错误：误认为此书是《水经注》作者郦道元所撰。
  aliases: []
  category: 文学常识
  explanation: 唐代李吉甫编撰的地理总志，成书于唐宪宗元和八年。
  misconceptions:
    - 把作者写作'李吉普'或'李洁甫'，字形错误。
    - 误认为此书是《水经注》作者郦道元所撰。
    - 将书名误写为《元和郡县志》，漏掉关键'图'字。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:《关雎》
  type: Concept
  subject: 语文
  title: 《关雎》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'雎'误写成'睢'，如把'关关雎鸠'写成'关关睢鸠'
    - 能指出并纠正这一错误：认为'窈窕'指身材苗条，实际指女子文静美好
  aliases: []
  category: 课文篇目
  explanation: 《诗经·周南》中的一首诗，描写男子对女子的爱慕和追求，运用比兴手法。
  misconceptions:
    - 将'雎'误写成'睢'，如把'关关雎鸠'写成'关关睢鸠'
    - 认为'窈窕'指身材苗条，实际指女子文静美好
    - 把'好逑'的'逑'当作'追求'的'求'，正确义为配偶
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:《列子》
  type: Concept
  subject: 语文
  title: 《列子》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《列子》是吕不韦召集门客编写的，与《吕氏春秋》混淆
    - 能指出并纠正这一错误：把‘杞人忧天’的出处错记成《庄子》或《山海经》
  aliases: []
  category: 文学常识
  explanation: 旧题列御寇著，内容多为民间故事、寓言和神话传说。
  misconceptions:
    - 误认为《列子》是吕不韦召集门客编写的，与《吕氏春秋》混淆
    - 把‘杞人忧天’的出处错记成《庄子》或《山海经》
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《十一月四日风雨大作（其二）》
  type: Concept
  subject: 语文
  title: 《十一月四日风雨大作（其二）》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：默写时把“戍轮台”的“戍”写成“戌”或“戊”，导致字音字形混淆。
    - 能指出并纠正这一错误：误以为“铁马冰河入梦来”是现实场景，实际是诗人梦中见闻。
  aliases: []
  category: 古诗词
  explanation: 陆游的诗歌，借风雨梦境抒发报国之志和忧国忧民的情怀。
  misconceptions:
    - 默写时把“戍轮台”的“戍”写成“戌”或“戊”，导致字音字形混淆。
    - 误以为“铁马冰河入梦来”是现实场景，实际是诗人梦中见闻。
    - 把作者误记为杜甫，实际是陆游。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《古诗十九首》
  type: Concept
  subject: 语文
  title: 《古诗十九首》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《古诗十九首》是《诗经》中的篇目，将‘迢迢牵牛星’归入《诗经》
    - 能指出并纠正这一错误：把《古诗十九首》视为建安七子所作，忽略其多无名氏作者的特点
  aliases: []
  category: 文学常识
  explanation: 东汉末年文人五言诗的代表作，内容多写夫妇朋友间的离愁别绪，风格质朴自然，辞浅思深。
  misconceptions:
    - 误认为《古诗十九首》是《诗经》中的篇目，将‘迢迢牵牛星’归入《诗经》
    - 把《古诗十九首》视为建安七子所作，忽略其多无名氏作者的特点
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S8.md
- id: concept:语文:《史记》
  type: Concept
  subject: 语文
  title: 《史记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《史记》是编年体通史，实际是纪传体。
    - 能指出并纠正这一错误：误以为《史记》只记录了汉朝历史，实际贯穿黄帝至汉武帝。
  aliases:
    - 太史公书
  category: 文学常识
  explanation: 西汉司马迁所著，中国第一部纪传体通史，记载了从黄帝到汉武帝的历史。
  misconceptions:
    - 认为《史记》是编年体通史，实际是纪传体。
    - 误以为《史记》只记录了汉朝历史，实际贯穿黄帝至汉武帝。
    - 把《史记》与《资治通鉴》的体例和作者弄混，司马光写成司马迁。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:《吕氏春秋》
  type: Concept
  subject: 语文
  title: 《吕氏春秋》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《吕氏春秋》是吕不韦一人独著，忽略‘集合门客编写’
    - 能指出并纠正这一错误：把‘穿井得一人’的出处说成《列子》或《孟子》
  aliases:
    - 吕览
  category: 文学常识
  explanation: 又称《吕览》，先秦杂家代表著作，战国末吕不韦集合门客编写。
  misconceptions:
    - 误以为《吕氏春秋》是吕不韦一人独著，忽略‘集合门客编写’
    - 把‘穿井得一人’的出处说成《列子》或《孟子》
    - 将《吕氏春秋》的别名《吕览》写成《吕揽》
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《咸阳城东楼》
  type: Concept
  subject: 语文
  title: 《咸阳城东楼》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“山雨欲来风满楼”的“欲”解作“欲望”，导致句意不通
    - 能指出并纠正这一错误：误将作者许浑写成李商隐，两人都是晚唐诗人易混
  aliases:
    - 咸阳城西楼晚眺
  category: 古诗词
  explanation: 唐代许浑的七言律诗，写登楼远眺之景，抒发历史沧桑之感，其中“山雨欲来风满楼”为千古名句。
  misconceptions:
    - 把“山雨欲来风满楼”的“欲”解作“欲望”，导致句意不通
    - 误将作者许浑写成李商隐，两人都是晚唐诗人易混
    - 认为“咸阳”是“咸”的城，不知道是陕西地名
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:《围城》的讽刺艺术
  type: Concept
  subject: 语文
  title: 《围城》的讽刺艺术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《围城》作者误记为茅盾或巴金，不是钱锺书。
    - 能指出并纠正这一错误：认为《围城》仅讽刺婚姻，如“城外的人想进去”，忽视其对知识分子的群像讽喻。
  aliases: []
  category: 文学知识
  explanation: 钱锺书《围城》通过幽默讽刺的笔法，展现病态知识分子的群像，探讨人性的弱点和人生的荒凉。
  misconceptions:
    - 将《围城》作者误记为茅盾或巴金，不是钱锺书。
    - 认为《围城》仅讽刺婚姻，如“城外的人想进去”，忽视其对知识分子的群像讽喻。
    - 误以为《围城》是自传体小说，方鸿渐就是钱锺书，实际是虚构人物。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《在烈火中永生》
  type: Concept
  subject: 语文
  title: 《在烈火中永生》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《在烈火中永生》当成虚构小说，误以为它和《红岩》是同一体裁
    - 能指出并纠正这一错误：将《在烈火中永生》的篇名记成“烈火中永生”，漏写“在”字
  aliases: []
  category: 文学作品
  explanation: 革命回忆录，是《红岩》的创作基础。
  misconceptions:
    - 把《在烈火中永生》当成虚构小说，误以为它和《红岩》是同一体裁
    - 将《在烈火中永生》的篇名记成“烈火中永生”，漏写“在”字
    - 误以为《在烈火中永生》是《红岩》的续集，乱判作品顺序
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:《夜雨寄北》
  type: Concept
  subject: 语文
  title: 《夜雨寄北》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“共剪西窗烛”理解为两人一起剪蜡烛，实际是剪烛花。
    - 能指出并纠正这一错误：把《夜雨寄北》的作者说成杜牧，实际是李商隐。
  aliases: []
  category: 古诗词
  explanation: 李商隐的诗歌，通过想象未来团聚的场景，表达对妻子的思念和羁旅之苦。
  misconceptions:
    - 误将“共剪西窗烛”理解为两人一起剪蜡烛，实际是剪烛花。
    - 把《夜雨寄北》的作者说成杜牧，实际是李商隐。
    - 误把“何当共剪西窗烛”当作眼前发生的事，实际是想象。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《天地九重》
  type: Concept
  subject: 语文
  title: 《天地九重》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《天地九重》当作科幻小说，实际是杨利伟的自传。
    - 能指出并纠正这一错误：将书名写成《九天重》或《天地九重天》，错加“天”字。
  aliases: []
  category: 作品
  explanation: 杨利伟的自传，记述了他的航天经历。
  misconceptions:
    - 误把《天地九重》当作科幻小说，实际是杨利伟的自传。
    - 将书名写成《九天重》或《天地九重天》，错加“天”字。
    - 认为作者是航天员翟志刚，与杨利伟张冠李戴。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:《子衿》
  type: Concept
  subject: 语文
  title: 《子衿》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'子衿'的'衿'误写为'矜'，写成'青青子矜'
    - 能指出并纠正这一错误：误认为《子衿》表达男子的思念，实际是女子等候恋人
  aliases: []
  category: 诗歌作品
  explanation: 《诗经·郑风》中的一首恋歌，表达女子对恋人的思念和约会不遇的惆怅。
  misconceptions:
    - 将'子衿'的'衿'误写为'矜'，写成'青青子矜'
    - 误认为《子衿》表达男子的思念，实际是女子等候恋人
    - 把'嗣音'理解为'继承音乐'，实为'传音讯'
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《学记》
  type: Concept
  subject: 语文
  title: 《学记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《学记》的“记”写成“纪”，误作“学纪”。
    - 能指出并纠正这一错误：认为《学记》是孔子编写的，实际是《礼记》中的一篇，作者不详。
  aliases: []
  category: 文学常识
  explanation: 《礼记》中的一篇，是我国最早的一篇关于教育和教学问题的专论。
  misconceptions:
    - 把《学记》的“记”写成“纪”，误作“学纪”。
    - 认为《学记》是孔子编写的，实际是《礼记》中的一篇，作者不详。
    - 把《学记》当作独立成书的教育专著，误以为与《礼记》无关。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:《山海经》
  type: Concept
  subject: 语文
  title: 《山海经》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《山海经》误认为鲁迅自己创作的书籍。
    - 能指出并纠正这一错误：把《山海经》与《二十四孝图》混淆，不确定其中提到的异兽来自哪部书。
  aliases: []
  category: 文学常识
  explanation: 中国古代神话地理著作，内容多奇珍异兽，鲁迅在文中提及并渴慕其绘图本。
  misconceptions:
    - 将《山海经》误认为鲁迅自己创作的书籍。
    - 把《山海经》与《二十四孝图》混淆，不确定其中提到的异兽来自哪部书。
    - 写错书名，如将‘经’误写作‘径’，或把‘海’误写作‘每’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《左传》
  type: Concept
  subject: 语文
  title: 《左传》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《左传》误认为国别体史书，与《战国策》混淆，实际它是编年体。
    - 能指出并纠正这一错误：认为《左传》作者是孔子，实际旧传为左丘明所作。
  aliases:
    - 《左氏春秋》
  category: 文学常识
  explanation: 又称《春秋左氏传》，儒家经典之一，是中国古代的史学和文学名著，旧传为左丘明所作。
  misconceptions:
    - 将《左传》误认为国别体史书，与《战国策》混淆，实际它是编年体。
    - 认为《左传》作者是孔子，实际旧传为左丘明所作。
    - 写“左丘明”时把“丘”写成“邱”或“秋”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:《庄子》
  type: Concept
  subject: 语文
  title: 《庄子》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《庄子》是儒家经典，与《论语》同属一类。
    - 能指出并纠正这一错误：误以为《秋水》出自内篇，实际《秋水》属外篇。
  aliases:
    - 《南华经》
  category: 文学常识
  explanation: 道家经典著作，现存33篇，包括内篇、外篇、杂篇，本课节选《逍遥游》和《秋水》。
  misconceptions:
    - 认为《庄子》是儒家经典，与《论语》同属一类。
    - 误以为《秋水》出自内篇，实际《秋水》属外篇。
    - 把《庄子》的作者说成老子，实际是庄周及其后学。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:《式微》
  type: Concept
  subject: 语文
  title: 《式微》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'式微'理解为'国家衰落'，诗中指天色昏暗
    - 能指出并纠正这一错误：将'微'释为'卑微'，在《式微》中应为'昏暗'
  aliases: []
  category: 诗歌作品
  explanation: 《诗经·邶风》中的一首劳役者的悲歌，以咏叹和质问的方式表达怨情。
  misconceptions:
    - 把'式微'理解为'国家衰落'，诗中指天色昏暗
    - 将'微'释为'卑微'，在《式微》中应为'昏暗'
    - 把'胡不归'的'胡'当作'胡人'，实为'为什么'
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《归田录》
  type: Concept
  subject: 语文
  title: 《归田录》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《归田录》是沈括的著作，将《卖油翁》与《梦溪笔谈》混淆。
    - 能指出并纠正这一错误：把《归田录》说成欧阳修早年作品，实际是他晚年所写。
  aliases: []
  category: 文学常识
  explanation: 《归田录》是欧阳修晚年写的笔记小说集，多记朝廷旧事和士大夫琐事，本文即选自该书卷一。
  misconceptions:
    - 误以为《归田录》是沈括的著作，将《卖油翁》与《梦溪笔谈》混淆。
    - 把《归田录》说成欧阳修早年作品，实际是他晚年所写。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:《我的白鸽》
  type: Concept
  subject: 语文
  title: 《我的白鸽》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为本文选自陈忠实的长篇小说《白鹿原》
    - 能指出并纠正这一错误：把本文原题《告别白鸽》记成《我的白鸽》
  aliases:
    - 告别白鸽
  category: 课文
  explanation: 本文选自《陈忠实文集》第6卷，原题为《告别白鸽》，有删改。
  misconceptions:
    - 误以为本文选自陈忠实的长篇小说《白鹿原》
    - 把本文原题《告别白鸽》记成《我的白鸽》
    - 将作者陈忠实误写为路遥或贾平凹
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:《战国策》
  type: Concept
  subject: 语文
  title: 《战国策》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《战国策》是编年体，实际是国别体史书。
    - 能指出并纠正这一错误：认为《战国策》由刘向所著，实际是刘向编定之作。
  aliases: []
  category: 文学常识
  explanation: 国别体史书，主要记述战国时期纵横家的政治主张和策略，由西汉刘向编定。
  misconceptions:
    - 误认为《战国策》是编年体，实际是国别体史书。
    - 认为《战国策》由刘向所著，实际是刘向编定之作。
    - 将“策”写成“册”或“则”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:《挺进报》
  type: Concept
  subject: 语文
  title: 《挺进报》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《挺进报》说成国民党发布的官方报纸，颠倒敌我立场
    - 能指出并纠正这一错误：将“挺进报”误写为“挺近报”，“进”与“近”同音混淆
  aliases: []
  category: 历史事件
  explanation: 重庆地下党人宣传革命思想的阵地，在《红岩》中作为重要情节出现。
  misconceptions:
    - 把《挺进报》说成国民党发布的官方报纸，颠倒敌我立场
    - 将“挺进报”误写为“挺近报”，“进”与“近”同音混淆
    - 误认为《挺进报》是《红岩》中虚构的报纸，不知它真实存在
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:《无题》
  type: Concept
  subject: 语文
  title: 《无题》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“春蚕到死丝方尽”的“丝”写成“思”，忽略了谐音双关
    - 能指出并纠正这一错误：把“蜡炬成灰泪始干”的“泪”当蜡烛油，未理解是喻相思之泪
  aliases: []
  category: 古诗词
  explanation: 李商隐的代表作，以“春蚕到死丝方尽，蜡炬成灰泪始干”等句表达至死不渝的爱情，运用双关、比喻等手法。
  misconceptions:
    - 把“春蚕到死丝方尽”的“丝”写成“思”，忽略了谐音双关
    - 把“蜡炬成灰泪始干”的“泪”当蜡烛油，未理解是喻相思之泪
    - 误将《无题》作者记成杜牧，与李商隐的“小李杜”混淆
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:《望洞庭湖赠张丞相》
  type: Concept
  subject: 语文
  title: 《望洞庭湖赠张丞相》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'欲济无舟楫'的'济'是'救济'，实为'渡过'
    - 能指出并纠正这一错误：认为本诗只是写洞庭湖景色，忽略了请求引荐的用意
  aliases: []
  category: 诗歌作品
  explanation: 孟浩然所作投赠诗，借洞庭湖景象表达希望得到张九龄引荐的心愿。
  misconceptions:
    - 误以为'欲济无舟楫'的'济'是'救济'，实为'渡过'
    - 认为本诗只是写洞庭湖景色，忽略了请求引荐的用意
    - 将作者孟浩然误记为王勃或刘禹锡
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《朝花夕拾》
  type: Concept
  subject: 语文
  title: 《朝花夕拾》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《朝花夕拾》当作鲁迅的小说集，如误认为《藤野先生》选自《呐喊》
    - 能指出并纠正这一错误：把“夕”写成“昔”，如《朝花昔拾》
  aliases:
    - 《旧事重提》
  category: 文学常识
  explanation: 《朝花夕拾》是鲁迅的回忆性散文集，收录了《藤野先生》等十篇散文，原名《旧事重提》。
  misconceptions:
    - 将《朝花夕拾》当作鲁迅的小说集，如误认为《藤野先生》选自《呐喊》
    - 把“夕”写成“昔”，如《朝花昔拾》
    - 误以为《朝花夕拾》是杂文集，忘了它是回忆性散文集
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:《格列佛游记》的讽刺艺术
  type: Concept
  subject: 语文
  title: 《格列佛游记》的讽刺艺术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将作者斯威夫特与笛福混淆，以为《格列佛游记》是笛福所写。
    - 能指出并纠正这一错误：认为作品只是童话式幻想，没有讽刺，如小人国仅是故事情节。
  aliases: []
  category: 文学知识
  explanation: 斯威夫特通过奇特的幻想和童话式叙事，讽刺18世纪英国的社会现实。
  misconceptions:
    - 将作者斯威夫特与笛福混淆，以为《格列佛游记》是笛福所写。
    - 认为作品只是童话式幻想，没有讽刺，如小人国仅是故事情节。
    - 误以为讽刺对象是小人国或大人国，其实是影射英国社会现实。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《梦溪笔谈》
  type: Concept
  subject: 语文
  title: 《梦溪笔谈》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：默写书名时把“梦溪”的“溪”写成“悉”或“蹊”
    - 能指出并纠正这一错误：误认为《梦溪笔谈》是沈括写的诗文集，而非笔记体著作
  aliases: []
  category: 文学常识
  explanation: 北宋科学家沈括所著的综合性笔记体著作，本文即选自其中。
  misconceptions:
    - 默写书名时把“梦溪”的“溪”写成“悉”或“蹊”
    - 误认为《梦溪笔谈》是沈括写的诗文集，而非笔记体著作
    - 将《梦溪笔谈》的作者错记为北宋科学家苏颂
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《水浒传》
  type: Concept
  subject: 语文
  title: 《水浒传》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“水浒传”的“浒”读成“xǔ”，混淆形声字字音
    - 能指出并纠正这一错误：误写作者为罗贯中，和《三国演义》作者张冠李戴
  aliases:
    - 水浒
  category: 文学常识
  explanation: 中国古典四大名著之一，描写北宋末年宋江起义的故事，塑造了众多英雄人物。
  misconceptions:
    - 把“水浒传”的“浒”读成“xǔ”，混淆形声字字音
    - 误写作者为罗贯中，和《三国演义》作者张冠李戴
    - 将“智取生辰纲”说成是抢劫普通货物，没抓住“生辰纲”是寿礼
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:《水经注》
  type: Concept
  subject: 语文
  title: 《水经注》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《水经注》的作者误记为《水经》作者桑钦，说成'桑钦著《水经注》'。
    - 能指出并纠正这一错误：把'水经注'的'注'写成'住'或'柱'，混淆形近字。
  aliases: []
  category: 文学常识
  explanation: 中国古代地理名著，详细记载了河流水道及沿岸风物，具有很高的文学价值。
  misconceptions:
    - 把《水经注》的作者误记为《水经》作者桑钦，说成'桑钦著《水经注》'。
    - 把'水经注'的'注'写成'住'或'柱'，混淆形近字。
    - 误认为《水经注》是郦道元实地考察三峡后专门写景的游记，忽略其为《水经》作注的性质。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《清明上河图》
  type: Concept
  subject: 语文
  title: 《清明上河图》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《清明上河图》的作者说成是唐代的吴道子，或误认为内容是描绘唐朝长安城。
    - 能指出并纠正这一错误：误以为《清明上河图》是山水画或人物画，忽略了它以市井风俗为主的特点。
  aliases: []
  category: 绘画作品
  explanation: 北宋画家张择端的代表作，描绘了汴京的繁华景象，是中国十大传世名画之一。
  misconceptions:
    - 把《清明上河图》的作者说成是唐代的吴道子，或误认为内容是描绘唐朝长安城。
    - 误以为《清明上河图》是山水画或人物画，忽略了它以市井风俗为主的特点。
    - 将《清明上河图》的时代背景写为南宋临安，而非北宋汴京。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:《潼关》
  type: Concept
  subject: 语文
  title: 《潼关》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《潼关》抒发的是羁旅愁思，实际是渴望冲决罗网的少年意气。
    - 能指出并纠正这一错误：把“河流大野犹嫌束”中的“河流”当成“小河在流”，实际指黄河。
  aliases: []
  category: 古诗词
  explanation: 谭嗣同的诗歌，通过描写潼关的壮阔风景，表达渴望冲决罗网、追求个性解放的少年意气。
  misconceptions:
    - 误以为《潼关》抒发的是羁旅愁思，实际是渴望冲决罗网的少年意气。
    - 把“河流大野犹嫌束”中的“河流”当成“小河在流”，实际指黄河。
    - 默写时把“潼关”的“潼”误写成“瞳”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《猫》
  type: Concept
  subject: 语文
  title: 《猫》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《猫》的作者记成老舍，误认为《猫》是《茶馆》作者的散文。
    - 能指出并纠正这一错误：误以为《猫》是小说，忽略了它是郑振铎写的散文。
  aliases: []
  category: 课文
  explanation: 郑振铎的散文，通过三次养猫的经历，表达了对生命、人性的思考，揭示了人与动物关系的复杂性。
  misconceptions:
    - 把《猫》的作者记成老舍，误认为《猫》是《茶馆》作者的散文。
    - 误以为《猫》是小说，忽略了它是郑振铎写的散文。
    - 将三次养猫的顺序记成先黄猫、后白猫、最后花猫，弄错文中情节。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:《礼记》
  type: Concept
  subject: 语文
  title: 《礼记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《礼记》的“记”写成“纪”，与《史记》混淆。
    - 能指出并纠正这一错误：认为《礼记》是孔子亲自撰写的，实际由西汉戴圣编纂。
  aliases: []
  category: 文学常识
  explanation: 儒家经典著作，战国至秦汉间各种礼仪论著的汇编，相传由西汉戴圣编纂。
  misconceptions:
    - 把《礼记》的“记”写成“纪”，与《史记》混淆。
    - 认为《礼记》是孔子亲自撰写的，实际由西汉戴圣编纂。
    - 把《礼记》与《周礼》《仪礼》混为一谈，误以为是一本书。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:《礼运》
  type: Concept
  subject: 语文
  title: 《礼运》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《礼运》是《周礼》中的一篇，实际出自《礼记》。
    - 能指出并纠正这一错误：把“礼运”理解为“礼的运行”，错写为“礼韵”。
  aliases: []
  category: 文学常识
  explanation: 《礼记》中的一篇，关于礼的起源、运行和作用的专论。
  misconceptions:
    - 认为《礼运》是《周礼》中的一篇，实际出自《礼记》。
    - 把“礼运”理解为“礼的运行”，错写为“礼韵”。
    - 误以为《礼运》是道家著作，实际是儒家《礼记》篇目。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:《秋水》
  type: Concept
  subject: 语文
  title: 《秋水》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《秋水》归入《庄子》内篇，实际是外篇。
    - 能指出并纠正这一错误：将对话者说成“河伯与龙王”，实际是河伯与北海若（海神）。
  aliases: []
  category: 文学篇目
  explanation: 《庄子》外篇中的一篇，通过河伯与海神的对话讨论认知的相对性。
  misconceptions:
    - 把《秋水》归入《庄子》内篇，实际是外篇。
    - 将对话者说成“河伯与龙王”，实际是河伯与北海若（海神）。
    - 认为《秋水》主要讲绝对自由，实际讲认知的相对性。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:《秋词（其一）》
  type: Concept
  subject: 语文
  title: 《秋词（其一）》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“自古逢秋悲寂寥”是诗人的观点，实际是他否定的传统。
    - 能指出并纠正这一错误：默写时把“碧霄”的“霄”写成“夜宵”的“宵”。
  aliases: []
  category: 古诗词
  explanation: 刘禹锡的诗歌，一反悲秋传统，表达对秋天的喜爱和豪迈的诗情。
  misconceptions:
    - 误认为“自古逢秋悲寂寥”是诗人的观点，实际是他否定的传统。
    - 默写时把“碧霄”的“霄”写成“夜宵”的“宵”。
    - 把“排云上”的“排”理解为排列成队，实际是“推开”之意。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:《红岩》
  type: Concept
  subject: 语文
  title: 《红岩》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《红岩》作者说成杨沫或梁斌，与《青春之歌》作者张冠李戴
    - 能指出并纠正这一错误：误以为《红岩》描写红军长征的故事，把时间背景搞错
  aliases:
    - 红岩
  category: 文学作品
  explanation: 罗广斌、杨益言创作的长篇小说，以革命回忆录《在烈火中永生》为基础，讲述重庆解放前夕地下党人的英勇斗争。
  misconceptions:
    - 把《红岩》作者说成杨沫或梁斌，与《青春之歌》作者张冠李戴
    - 误以为《红岩》描写红军长征的故事，把时间背景搞错
    - 把《红岩》当革命回忆录，忽略了它作为长篇小说的虚构创作
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:《红楼梦》
  type: Concept
  subject: 语文
  title: 《红楼梦》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把作者写成高鹗，忽略曹雪芹是前八十回作者
    - 能指出并纠正这一错误：认为贾宝玉与林黛玉成婚，误把悲剧结局说成团圆
  aliases: []
  category: 文学常识
  explanation: 我国古代小说的巅峰之作，以贾宝玉、林黛玉的爱情悲剧为线索，讲述四大家族的兴衰。
  misconceptions:
    - 把作者写成高鹗，忽略曹雪芹是前八十回作者
    - 认为贾宝玉与林黛玉成婚，误把悲剧结局说成团圆
    - 将四大家族说成“贾王史薛”，与“贾史王薛”顺序混淆
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:《经典常谈》
  type: Concept
  subject: 语文
  title: 《经典常谈》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把作者朱自清误记为朱光潜
    - 能指出并纠正这一错误：把《经典常谈》当作古代经典原著，忽略其'谈'是介绍
  aliases: []
  category: 文学常识
  explanation: 朱自清所著，介绍中国古代经典著作的普及性读物，包括《说文解字》《春秋》《史记》等。
  misconceptions:
    - 把作者朱自清误记为朱光潜
    - 把《经典常谈》当作古代经典原著，忽略其'谈'是介绍
    - 误以为'常谈'指经常谈论，实际指平常浅近的讲述
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:《聊斋志异》
  type: Concept
  subject: 语文
  title: 《聊斋志异》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《聊斋志异》作者误记为吴敬梓或罗贯中，如回答“《聊斋志异》的作者是吴敬梓”。
    - 能指出并纠正这一错误：把“志”写成“记”，如书名写作《聊斋记异》或《聊斋异记》。
  aliases: []
  category: 文学常识
  explanation: 蒲松龄创作的文言短篇小说集，多写狐鬼花妖故事，借以讽刺现实。
  misconceptions:
    - 将《聊斋志异》作者误记为吴敬梓或罗贯中，如回答“《聊斋志异》的作者是吴敬梓”。
    - 把“志”写成“记”，如书名写作《聊斋记异》或《聊斋异记》。
    - 误认为《聊斋志异》是长篇小说，其实它是文言短篇小说集。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:《蒹葭》
  type: Concept
  subject: 语文
  title: 《蒹葭》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'溯洄'解释为'顺流而下'，实为'逆流而上'
    - 能指出并纠正这一错误：把'蒹葭'误写为'廉暇'，或把'葭'读成xiá
  aliases: []
  category: 课文篇目
  explanation: 《诗经·秦风》中的一首诗，表现对意中人的追寻而不得的惆怅，意境朦胧。
  misconceptions:
    - 将'溯洄'解释为'顺流而下'，实为'逆流而上'
    - 把'蒹葭'误写为'廉暇'，或把'葭'读成xiá
    - 以为'伊人'专指美女，实际可指理想或贤者
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《行香子》
  type: Concept
  subject: 语文
  title: 《行香子》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把词牌名“行香子”当题目，误以为写的是烧香祭拜
    - 能指出并纠正这一错误：误认作者为苏轼，因秦观与苏轼师徒关系密切而混淆
  aliases: []
  category: 古诗词
  explanation: 秦观的词作，以白描手法描绘田园春景，语言明快，画面生动。
  misconceptions:
    - 把词牌名“行香子”当题目，误以为写的是烧香祭拜
    - 误认作者为苏轼，因秦观与苏轼师徒关系密切而混淆
    - 将“收尽春光”说成夸张，实际是白描手法
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:《西游记》
  type: Concept
  subject: 语文
  title: 《西游记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《西游记》作者误记为罗贯中或施耐庵，与《三国演义》《水浒传》作者混淆
    - 能指出并纠正这一错误：将《西游记》当成真实历史书，认为唐僧取经是小说完全虚构，忽略其有历史原型
  aliases: []
  category: 文学常识
  explanation: 《西游记》是古代神话小说，一般认为是明代吴承恩所著，是中国古典四大名著之一。
  misconceptions:
    - 把《西游记》作者误记为罗贯中或施耐庵，与《三国演义》《水浒传》作者混淆
    - 将《西游记》当成真实历史书，认为唐僧取经是小说完全虚构，忽略其有历史原型
    - 写错作者名，将‘吴承恩’误写为‘吴辰恩’或‘吴承因’
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:《论语》
  type: Concept
  subject: 语文
  title: 《论语》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《论语》是孔子亲手所写，实为其弟子及再传弟子编纂记录
    - 能指出并纠正这一错误：将《论语》二十篇记成十八篇，或与《孟子》七篇篇数混淆
  aliases:
    - 论语
  category: 文学常识
  explanation: 儒家经典著作，记录孔子及其弟子言行，共二十篇，宋代与《大学》《中庸》《孟子》合称“四书”。
  misconceptions:
    - 误认为《论语》是孔子亲手所写，实为其弟子及再传弟子编纂记录
    - 将《论语》二十篇记成十八篇，或与《孟子》七篇篇数混淆
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:《诗经》
  type: Concept
  subject: 语文
  title: 《诗经》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《诗经》收录战国诗歌，实际是西周到春秋
    - 能指出并纠正这一错误：将'风雅颂'与'赋比兴'混为一谈，前者是分类，后者是手法
  aliases:
    - 诗三百
    - 诗
  category: 文学常识
  explanation: 我国最早的一部诗歌总集，收录了从西周到春秋时期的诗歌305篇，分为风、雅、颂三部分。
  misconceptions:
    - 误认为《诗经》收录战国诗歌，实际是西周到春秋
    - 将'风雅颂'与'赋比兴'混为一谈，前者是分类，后者是手法
    - 认为《诗经》正好300篇才叫'诗三百'，实际305篇
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《诗经》六义
  type: Concept
  subject: 语文
  title: 《诗经》六义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'风雅颂'误作表现手法，把'赋比兴'误作分类
    - 能指出并纠正这一错误：将'比'与'兴'混同，如说'关关雎鸠'是比喻
  aliases:
    - 六义
  category: 文学常识
  explanation: 《诗经》按乐曲分为风、雅、颂三类，表现手法有赋、比、兴，合称“六义”。
  misconceptions:
    - 把'风雅颂'误作表现手法，把'赋比兴'误作分类
    - 将'比'与'兴'混同，如说'关关雎鸠'是比喻
    - 把'赋'理解为汉赋等文体，实际是铺陈直叙
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:《送杜少府之任蜀州》
  type: Concept
  subject: 语文
  title: 《送杜少府之任蜀州》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'无为在歧路'的'无为'是'没有作为'，实为'不要'
    - 能指出并纠正这一错误：把作者王勃误记为李白或孟浩然
  aliases: []
  category: 诗歌作品
  explanation: 王勃所作送别诗，以“海内存知己，天涯若比邻”表达真挚友情，积极乐观。
  misconceptions:
    - 误以为'无为在歧路'的'无为'是'没有作为'，实为'不要'
    - 把作者王勃误记为李白或孟浩然
    - 将'儿女共沾巾'的'儿女'理解为子女，实际指青年男女
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:《逍遥游》
  type: Concept
  subject: 语文
  title: 《逍遥游》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《逍遥游》归为《庄子》外篇，实际是内篇第一篇。
    - 能指出并纠正这一错误：认为“逍遥游”指自由自在地游玩，实际是哲学上的绝对自由。
  aliases: []
  category: 文学篇目
  explanation: 《庄子》内篇中的第一篇，以鲲鹏变化的故事阐述绝对自由的思想。
  misconceptions:
    - 把《逍遥游》归为《庄子》外篇，实际是内篇第一篇。
    - 认为“逍遥游”指自由自在地游玩，实际是哲学上的绝对自由。
    - 把鲲鹏故事与《秋水》的河伯故事混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:一丈青大娘
  type: Concept
  subject: 语文
  title: 一丈青大娘
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把外号“一丈青”写成“一丈清”，误以为是形容她清秀。
    - 能指出并纠正这一错误：误以为“一丈青”就是《水浒传》中的扈三娘本人，忽略是借用外号。
  aliases:
    - 何满子奶奶
  category: 文学形象
  explanation: 《蒲柳人家》中何满子的奶奶，性格泼辣、刚强，外号取自《水浒传》中的一丈青扈三娘。
  misconceptions:
    - 把外号“一丈青”写成“一丈清”，误以为是形容她清秀。
    - 误以为“一丈青”就是《水浒传》中的扈三娘本人，忽略是借用外号。
    - 认为她性格温柔，与“泼辣、刚强”相反。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:一丝不苟
  type: Concept
  subject: 语文
  title: 一丝不苟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“一丝不苟”的“苟”写成“荀”或“旬”，误认作别的字
    - 能指出并纠正这一错误：将“一丝不苟”与“一丝不挂”混淆，用来形容穿着整齐
  aliases: []
  category: 成语
  explanation: 形容做事认真细致，一点儿不马虎。文中形容阻拦索安全观察员检查工作认真。
  misconceptions:
    - 把“一丝不苟”的“苟”写成“荀”或“旬”，误认作别的字
    - 将“一丝不苟”与“一丝不挂”混淆，用来形容穿着整齐
    - 误以为“一丝不苟”只用于工作，不能形容学习或做事细致
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:一览无余
  type: Concept
  subject: 语文
  title: 一览无余
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘一览无余’的‘余’写成‘遗’，写作‘一览无遗’
    - 能指出并纠正这一错误：把‘一目了然’当作‘一览无余’用，如‘事情一目了然’说成‘一览无余’
  aliases: []
  category: 成语
  explanation: 一眼看去，所有的景物全看见了。文中形容在圈梁上看到“天眼”全貌。
  misconceptions:
    - 将‘一览无余’的‘余’写成‘遗’，写作‘一览无遗’
    - 把‘一目了然’当作‘一览无余’用，如‘事情一目了然’说成‘一览无余’
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:一词多义
  type: Concept
  subject: 语文
  title: 一词多义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘负势竞上’和‘横柯上蔽’中的‘上’意思相同，都翻译成‘上面’。
    - 能指出并纠正这一错误：把‘上’在‘负势竞上’中当成方位名词，忽略它是动词‘向上伸展’。
  aliases: []
  category: 文言语法
  explanation: 同一个词在不同语境中有不同含义。如'上'在'负势竞上'中是动词，在'横柯上蔽'中是名词作状语。
  misconceptions:
    - 误以为‘负势竞上’和‘横柯上蔽’中的‘上’意思相同，都翻译成‘上面’。
    - 把‘上’在‘负势竞上’中当成方位名词，忽略它是动词‘向上伸展’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:一鼓作气
  type: Concept
  subject: 语文
  title: 一鼓作气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写成“一鼓足气”，错解“作气”为“鼓起勇气”。
    - 能指出并纠正这一错误：误以为“一鼓”是“击一次鼓”，实际指第一次击鼓。
  aliases: []
  category: 成语
  explanation: 指第一次击鼓时士气振奋，比喻趁劲头大的时候一下子把事情做完。出自《曹刿论战》。
  misconceptions:
    - 写成“一鼓足气”，错解“作气”为“鼓起勇气”。
    - 误以为“一鼓”是“击一次鼓”，实际指第一次击鼓。
    - 与“一气呵成”混用，如说“写作文要一鼓作气”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:三叶虫
  type: Concept
  subject: 语文
  title: 三叶虫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“三叶虫”写成“三页虫”，或读错“叶”音。
    - 能指出并纠正这一错误：误认为三叶虫是植物，因为名字带“叶”。
  aliases: []
  category: 科学知识
  explanation: 已灭绝的海洋节肢动物，其化石指示寒武纪时代。
  misconceptions:
    - 把“三叶虫”写成“三页虫”，或读错“叶”音。
    - 误认为三叶虫是植物，因为名字带“叶”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:三吏三别
  type: Concept
  subject: 语文
  title: 三吏三别
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“三吏三别”的作者写成李白，实际是杜甫。
    - 能指出并纠正这一错误：将“三吏”写成“三史”，或将“三别”写错字。
  aliases: []
  category: 文学作品
  explanation: 杜甫的六首诗作，反映安史之乱中百姓的苦难。
  misconceptions:
    - 把“三吏三别”的作者写成李白，实际是杜甫。
    - 将“三吏”写成“三史”，或将“三别”写错字。
    - 认为三吏三别写的是盛唐繁荣景象，实际反映安史之乱苦难。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:三味书屋
  type: Concept
  subject: 语文
  title: 三味书屋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三味书屋说成是鲁迅家的书房，实际是读书的私塾
    - 能指出并纠正这一错误：误以为三味书屋在百草园里面，其实两者是不同地方
  aliases: []
  category: 课文内容
  explanation: 鲁迅少年时读书的私塾，是全城中称为最严厉的书塾，先生是寿怀鉴。
  misconceptions:
    - 把三味书屋说成是鲁迅家的书房，实际是读书的私塾
    - 误以为三味书屋在百草园里面，其实两者是不同地方
    - 将三味书屋的先生寿怀鉴与字寿镜吾混为一谈
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:三大白
  type: Concept
  subject: 语文
  title: 三大白
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘白’当作‘白酒’，将‘三大白’解释为‘三杯白酒’
    - 能指出并纠正这一错误：将‘白’理解为‘白色’，以为‘三大白’是‘三大杯白色的酒’
  aliases: []
  category: 古代文化
  explanation: 三大杯酒。白，古人罚酒时用的酒杯。
  misconceptions:
    - 误把‘白’当作‘白酒’，将‘三大白’解释为‘三杯白酒’
    - 将‘白’理解为‘白色’，以为‘三大白’是‘三大杯白色的酒’
    - 认为‘白’是‘说’的意思，把‘强饮三大白’错解为‘勉强说了三大段话’
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:三字经
  type: Concept
  subject: 语文
  title: 三字经
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 三字经是古时候小朋友读的书，三个字一句，念起来有节奏，教我们学习和做人的道理。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:三峡
  type: Concept
  subject: 语文
  title: 三峡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三峡顺序记成西陵峡、巫峡、瞿塘峡，逆流了。
    - 能指出并纠正这一错误：误将'瞿塘峡'的'瞿'读作'jù'，正确读'qú'。
  aliases: []
  category: 地理
  explanation: 指长江上游重庆奉节至湖北宜昌之间的瞿塘峡、巫峡和西陵峡，两岸高山对峙，水流湍急。
  misconceptions:
    - 把三峡顺序记成西陵峡、巫峡、瞿塘峡，逆流了。
    - 误将'瞿塘峡'的'瞿'读作'jù'，正确读'qú'。
    - 认为三峡在长江中下游，或把虎跳峡列入三峡。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:三年谪宦
  type: Concept
  subject: 语文
  title: 三年谪宦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误读‘谪’为‘dí’，正确读音是‘zhé’
    - 能指出并纠正这一错误：把‘谪宦’写成‘谪官’，混淆‘宦’与‘官’字形
  aliases: []
  category: 词语理解
  explanation: 贾谊被贬至长沙三年。
  misconceptions:
    - 误读‘谪’为‘dí’，正确读音是‘zhé’
    - 把‘谪宦’写成‘谪官’，混淆‘宦’与‘官’字形
    - 误以为‘三年谪宦’指贾谊三次被贬，忽略‘三年’是时长
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:三拼音节
  type: Concept
  subject: 语文
  title: 三拼音节
  conceptType: 概念型
  aliases:
    - 三拼法
  category: 概念
  explanation: 由声母、介母、韵母三个部分拼成的音节叫三拼音节，比如 g—u—à 拼成 guà。拼读时声母轻、介母快、韵母响。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:三杯吐然诺，五岳倒为轻
  type: Concept
  subject: 语文
  title: 三杯吐然诺，五岳倒为轻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“然诺”写作“言诺”或“然若”，字形混淆
    - 能指出并纠正这一错误：把“五岳倒为轻”理解为“五岳倒塌了”，忽视“倒为轻”是比较之义
  aliases: []
  category: 名言警句
  explanation: 出自李白《侠客行》，形容重承诺，诺言比五岳还重。
  misconceptions:
    - 误将“然诺”写作“言诺”或“然若”，字形混淆
    - 把“五岳倒为轻”理解为“五岳倒塌了”，忽视“倒为轻”是比较之义
    - 误把此诗作者记为杜甫，实为李白
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:三顾茅庐
  type: Concept
  subject: 语文
  title: 三顾茅庐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“三顾”解释为“三次回头”，忽略“顾”是拜访义
    - 能指出并纠正这一错误：误以为刘备拜访的是诸葛亮，却说出自《水浒传》
  aliases:
    - 三顾草庐
  category: 文学常识
  explanation: 指刘备三次前往隆中拜访诸葛亮，恳请其出山相助的故事，出自《三国演义》第三十八回。
  misconceptions:
    - 把“三顾”解释为“三次回头”，忽略“顾”是拜访义
    - 误以为刘备拜访的是诸葛亮，却说出自《水浒传》
    - 把“茅庐”写成“毛驴”，字形不辨导致误读
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:下雨前的动物征兆
  type: Concept
  subject: 语文
  title: 下雨前的动物征兆
  conceptType: 概念型
  aliases: []
  category: 现象
  explanation: 要下雨了，空气变潮湿，燕子飞得低，小鱼游到水面透气，蚂蚁忙着搬家。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:不二法门
  type: Concept
  subject: 语文
  title: 不二法门
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“不二法门”误写成“不二法们”。
    - 能指出并纠正这一错误：认为“不二法门”指“没有两个门”或“没有其他办法”，忽略了“最好的独一无二”之意。
  aliases: []
  category: 成语
  explanation: 指最好的或独一无二的方法、门径。
  misconceptions:
    - 将“不二法门”误写成“不二法们”。
    - 认为“不二法门”指“没有两个门”或“没有其他办法”，忽略了“最好的独一无二”之意。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:不同体裁文章的扩写着重点
  type: Concept
  subject: 语文
  title: 不同体裁文章的扩写着重点
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：扩写记叙文时大段议论抒情，忽视补充情节，如把《背影》买橘子扩写成读后感。
    - 能指出并纠正这一错误：扩写说明文时虚构故事，如给《中国石拱桥》编造传说，却没运用列数字等说明方法。
  aliases: []
  category: 写作知识
  explanation: 记叙性文章补充情节和细节，说明性文章补充材料运用说明方法，议论性文章补充论据阐释观点。
  misconceptions:
    - 扩写记叙文时大段议论抒情，忽视补充情节，如把《背影》买橘子扩写成读后感。
    - 扩写说明文时虚构故事，如给《中国石拱桥》编造传说，却没运用列数字等说明方法。
    - 扩写议论文只摆事实不加分析，补了论据却不阐释与论点的联系。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:不平则鸣
  type: Concept
  subject: 语文
  title: 不平则鸣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“不平则鸣”解释为“社会不公平就要大声喊叫”，实际指内心抑郁不平有所抒发。
    - 能指出并纠正这一错误：认为该观点出自柳宗元，实际是韩愈在《送孟东野序》提出。
  aliases: []
  category: 文学主张
  explanation: 韩愈提出的文学观点，认为作者在遭遇不平时会发出声音。
  misconceptions:
    - 把“不平则鸣”解释为“社会不公平就要大声喊叫”，实际指内心抑郁不平有所抒发。
    - 认为该观点出自柳宗元，实际是韩愈在《送孟东野序》提出。
    - 把“鸣”理解为“鸟鸣”，误认为与自然有关。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:不必说……也不必说……单是……
  type: Concept
  subject: 语文
  title: 不必说……也不必说……单是……
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：造句时把“单是”后面的内容当作次要，重点放在“不必说”上
    - 能指出并纠正这一错误：误以为“不必说”就是省略不写，实际仍需列举内容
  aliases: []
  category: 句式
  explanation: 一种强调句式，先以“不必说”略写次要内容，再用“单是”突出强调重点内容。
  misconceptions:
    - 造句时把“单是”后面的内容当作次要，重点放在“不必说”上
    - 误以为“不必说”就是省略不写，实际仍需列举内容
    - 用“不必说……也不必说……而是……”的错误搭配
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:不求甚解
  type: Concept
  subject: 语文
  title: 不求甚解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘不求甚解’当作贬义词，认为是读书马虎、不认真的表现。
    - 能指出并纠正这一错误：误将‘甚’写成‘深’，写成语‘不求深解’。
  aliases:
    - 会意
  category: 文学观点
  explanation: 马南邨阐释陶渊明“不求甚解”的含义，指虚心领会要旨，不固执咬文嚼字，前后贯通了解大意。
  misconceptions:
    - 把‘不求甚解’当作贬义词，认为是读书马虎、不认真的表现。
    - 误将‘甚’写成‘深’，写成语‘不求深解’。
    - 认为马南邨反对‘不求甚解’，实际他是倡导虚心领会要旨。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:不用说来写对话
  type: Concept
  subject: 语文
  title: 不用说来写对话
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 写人物说话时，可以不用「说」，换成「喊」「嘟囔」「谈论」等词语，或者用动作、神态带出对话，表达更生动。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C7/sections/S5.md
- id: concept:语文:不要堆砌词语
  type: Concept
  subject: 语文
  title: 不要堆砌词语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：堆砌近义词，如“他伤心难过痛苦地哭了”，词语重复累赘。
    - 能指出并纠正这一错误：误以为形容词越多越好，写“美丽漂亮好看的花朵”，表达啰唆。
  aliases: []
  category: 写作方法
  explanation: 不要堆砌意思相近的词语，以免给人累赘的感觉。
  misconceptions:
    - 堆砌近义词，如“他伤心难过痛苦地哭了”，词语重复累赘。
    - 误以为形容词越多越好，写“美丽漂亮好看的花朵”，表达啰唆。
    - 用“立刻马上”“忽然突然”等意思相近的词语连用，显得赘余。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:不辍
  type: Concept
  subject: 语文
  title: 不辍
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“辍”误写成“缀”或“啜”，如“不缀劳作”。
    - 能指出并纠正这一错误：误读“辍”为“zhuì”，与“缀”字读音混淆。
  aliases: []
  category: 词语
  explanation: 不停止。
  misconceptions:
    - 把“辍”误写成“缀”或“啜”，如“不缀劳作”。
    - 误读“辍”为“zhuì”，与“缀”字读音混淆。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:与民同乐
  type: Concept
  subject: 语文
  title: 与民同乐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘与民同乐’的思想归于范仲淹，认为出自《岳阳楼记》
    - 能指出并纠正这一错误：将‘与民同乐’的‘乐’读作yuè，误解为‘音乐’
  aliases: []
  category: 思想情感
  explanation: 欧阳修在《醉翁亭记》中表达的思想，与百姓一同享受快乐。
  misconceptions:
    - 误把‘与民同乐’的思想归于范仲淹，认为出自《岳阳楼记》
    - 将‘与民同乐’的‘乐’读作yuè，误解为‘音乐’
    - 把‘与民同乐’解释为‘和人民一起游玩’，丢失‘共同享受快乐’内蕴
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:世外桃源
  type: Concept
  subject: 语文
  title: 世外桃源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'世外桃源'写成'世外桃园'，将'源'误作'园'
    - 能指出并纠正这一错误：认为'世外桃源'指景色优美的地方，实际指理想境界
  aliases:
    - 桃花源
  category: 文学典故
  explanation: 指理想中的美好世界，源自陶渊明《桃花源记》，后成为成语。
  misconceptions:
    - 把'世外桃源'写成'世外桃园'，将'源'误作'园'
    - 认为'世外桃源'指景色优美的地方，实际指理想境界
    - 把出处误记为周敦颐《爱莲说》或陶渊明《桃花源诗》
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:世态炎凉
  type: Concept
  subject: 语文
  title: 世态炎凉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“炎”误写成“严”，写作“世态严凉”
    - 能指出并纠正这一错误：将“世态炎凉”误当“世外桃源”，指环境清幽
  aliases: []
  category: 主题思想
  explanation: 指社会上的人情冷暖，范进中举前后众人态度的变化体现了这一点。
  misconceptions:
    - 把“炎”误写成“严”，写作“世态严凉”
    - 将“世态炎凉”误当“世外桃源”，指环境清幽
    - 在范进中举中，把“世态炎凉”说成范进对邻居的态度变化
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:世有伯乐，然后有千里马
  type: Concept
  subject: 语文
  title: 世有伯乐，然后有千里马
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把这句话当作是柳宗元或苏轼说的，实际出自韩愈《马说》。
    - 能指出并纠正这一错误：把“伯乐”写成“伯东”，或“乐”写错。
  aliases: []
  category: 观点
  explanation: 韩愈提出的观点，强调识别人才的人比人才本身更重要。
  misconceptions:
    - 把这句话当作是柳宗元或苏轼说的，实际出自韩愈《马说》。
    - 把“伯乐”写成“伯东”，或“乐”写错。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:世界遗产
  type: Concept
  subject: 语文
  title: 世界遗产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为世界遗产只包括文化遗产，忽略自然遗产和双重遗产。
    - 能指出并纠正这一错误：把‘世界遗产’等同于‘非物质文化遗产’，概念范围混淆。
  aliases:
    - 世界文化和自然遗产
  category: 文化概念
  explanation: 指被联合国教科文组织和世界遗产委员会确认的人类罕见的、无法替代的财富，分为世界文化遗产、世界自然遗产、世界文化与自然双重遗产等类别。
  misconceptions:
    - 认为世界遗产只包括文化遗产，忽略自然遗产和双重遗产。
    - 把‘世界遗产’等同于‘非物质文化遗产’，概念范围混淆。
    - 误以为所有名山大川都是世界遗产，忽略联合国教科文组织权威认证。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:世界遗产青少年教育
  type: Concept
  subject: 语文
  title: 世界遗产青少年教育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为青少年教育只属于大学生，小学生不必参与，如小学参加遗产日活动被视为多余。
    - 能指出并纠正这一错误：把《苏州宣言》误记为《北京宣言》，答题或分享时张冠李戴。
  aliases:
    - 青少年遗产教育
  category: 教育理念
  explanation: 通过教育使青少年确立保护世界遗产的意识，并参与保护行动，如《苏州宣言》所倡导。
  misconceptions:
    - 认为青少年教育只属于大学生，小学生不必参与，如小学参加遗产日活动被视为多余。
    - 把《苏州宣言》误记为《北京宣言》，答题或分享时张冠李戴。
    - 认为青少年教育只要求认识遗产，不必动手保护，如从不参加社区清洁古迹活动。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:丙辰
  type: Concept
  subject: 语文
  title: 丙辰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘丙辰’误写为‘丙晨’，错把‘辰’当‘早晨’
    - 能指出并纠正这一错误：误把‘丙辰’对应为宋神宗熙宁十年（1077年），而非熙宁九年
  aliases: []
  category: 纪年
  explanation: 宋神宗熙宁九年（1076）。
  misconceptions:
    - 将‘丙辰’误写为‘丙晨’，错把‘辰’当‘早晨’
    - 误把‘丙辰’对应为宋神宗熙宁十年（1077年），而非熙宁九年
    - 认为‘丙辰’是苏轼的字号，不知其为干支纪年
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:东六西四
  type: Concept
  subject: 语文
  title: 东六西四
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把比例记成“东四西六”，认为店铺拿六成。
    - 能指出并纠正这一错误：将“东”理解为方位东边，“西”为西边，以为是地域划分。
  aliases: []
  category: 文化常识
  explanation: 旧时商业利润分成比例，东家六成，店铺四成，体现劳资关系。
  misconceptions:
    - 误把比例记成“东四西六”，认为店铺拿六成。
    - 将“东”理解为方位东边，“西”为西边，以为是地域划分。
    - 误以为“东六西四”是人员分配，不是利润分成。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:东家
  type: Concept
  subject: 语文
  title: 东家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“东家”当成酒店掌柜或打工者，忽略其实是出资方老板。
    - 能指出并纠正这一错误：误以为“东家”指顾客，如“今天来了几位东家”。
  aliases: []
  category: 文化常识
  explanation: 店铺的所有者，出资方。
  misconceptions:
    - 把“东家”当成酒店掌柜或打工者，忽略其实是出资方老板。
    - 误以为“东家”指顾客，如“今天来了几位东家”。
    - 与“东道主”混淆，把请客之人叫东家。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:东巴象形文字
  type: Concept
  subject: 语文
  title: 东巴象形文字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为东巴文是藏族使用的文字，实际为纳西族。
    - 能指出并纠正这一错误：将'东巴'误写为'冬巴'，音同字误。
  aliases:
    - 东巴文
  category: 文化常识
  explanation: 纳西族旧时使用的一种象形文字，是纳西族传统文化的重要载体。
  misconceptions:
    - 误认为东巴文是藏族使用的文字，实际为纳西族。
    - 将'东巴'误写为'冬巴'，音同字误。
    - 以为东巴文已失传，其实至今仍在使用。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:两弹一星
  type: Concept
  subject: 语文
  title: 两弹一星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把'两弹'理解为导弹和原子弹，忽略了氢弹。
    - 能指出并纠正这一错误：将'星'误写为'新'，写成'两弹一新'。
  aliases: []
  category: 历史事件
  explanation: 指中国在20世纪60年代成功研制原子弹、氢弹和人造卫星，是国防和科技的重大成就。
  misconceptions:
    - 误把'两弹'理解为导弹和原子弹，忽略了氢弹。
    - 将'星'误写为'新'，写成'两弹一新'。
    - 误以为'两弹一星'包含火箭和卫星四个成就。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:严丝合缝
  type: Concept
  subject: 语文
  title: 严丝合缝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘严丝合缝’的‘丝’写成‘思’，‘缝’写成‘逢’
    - 能指出并纠正这一错误：将‘严丝合缝’与‘天衣无缝’混用，形容办法完美无缺
  aliases: []
  category: 成语
  explanation: 指缝隙严密闭合，形容衔接紧密。文中指南仁东对技术精益求精。
  misconceptions:
    - 把‘严丝合缝’的‘丝’写成‘思’，‘缝’写成‘逢’
    - 将‘严丝合缝’与‘天衣无缝’混用，形容办法完美无缺
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:中华美德
  type: Concept
  subject: 语文
  title: 中华美德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为勤俭就是吝啬，舍不得花钱买必需品，把“抠门”当美德。
    - 能指出并纠正这一错误：把仁爱理解成对任何人都宽容，连错误行为也纵容，如包庇作弊。
  aliases:
    - 传统美德
  category: 文化概念
  explanation: 中华民族在长期历史发展中形成的优秀道德品质，如诚信、仁爱、勤俭等，是中华文化的重要组成部分。
  misconceptions:
    - 认为勤俭就是吝啬，舍不得花钱买必需品，把“抠门”当美德。
    - 把仁爱理解成对任何人都宽容，连错误行为也纵容，如包庇作弊。
    - 认为中华美德只属于古代，今天讲诚信、仁爱已经过时。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:中国天眼
  type: Concept
  subject: 语文
  title: 中国天眼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘中国天眼’是光学望远镜，写成‘太阳望远镜’
    - 能指出并纠正这一错误：把‘中国天眼’所在地写作云南，而非贵州平塘
  aliases:
    - FAST
    - 500米口径球面射电望远镜
  category: 科学成就
  explanation: 500米口径球面射电望远镜（FAST），位于贵州平塘，是世界上最大的单口径射电望远镜。
  misconceptions:
    - 误以为‘中国天眼’是光学望远镜，写成‘太阳望远镜’
    - 把‘中国天眼’所在地写作云南，而非贵州平塘
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:中国戏曲
  type: Concept
  subject: 语文
  title: 中国戏曲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为戏曲全靠写实，像话剧一样布景真实，忽略虚拟性和程式性。
    - 能指出并纠正这一错误：认为“中国戏曲”单指京剧，不包括昆曲、越剧等地方剧种。
  aliases:
    - 戏曲
  category: 传统文化
  explanation: 中国传统戏剧形式，包含多种地方剧种，如京剧、昆曲、越剧等，具有综合性、虚拟性、程式性等特点。
  misconceptions:
    - 以为戏曲全靠写实，像话剧一样布景真实，忽略虚拟性和程式性。
    - 认为“中国戏曲”单指京剧，不包括昆曲、越剧等地方剧种。
    - 把戏曲的程式动作说成“真实生活动作”，如骑马直接骑真马。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:中国的脊梁
  type: Concept
  subject: 语文
  title: 中国的脊梁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“脊梁”写成“脊粱”，误以为是米字旁
    - 能指出并纠正这一错误：认为只有英雄伟人才算脊梁，忽略平凡岗位上默默奉献的人
  aliases:
    - 民族脊梁
  category: 修辞手法
  explanation: 比喻有骨气、有担当、为民族作出贡献的人，是鲁迅对民族脊梁的赞颂。
  misconceptions:
    - 把“脊梁”写成“脊粱”，误以为是米字旁
    - 认为只有英雄伟人才算脊梁，忽略平凡岗位上默默奉献的人
    - 将“中国的脊梁”理解为抽象的民族精神，而非具体的人
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:中心论点与分论点
  type: Concept
  subject: 语文
  title: 中心论点与分论点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把中心论点当成标题，不看文章直接套标题
    - 能指出并纠正这一错误：分论点写成与中心论点并列的另一观点，而非支撑关系
  aliases:
    - 论点
  category: 论证知识
  explanation: 中心论点是文章的核心观点，分论点是支撑中心论点的若干小观点，共同构成论证结构。
  misconceptions:
    - 把中心论点当成标题，不看文章直接套标题
    - 分论点写成与中心论点并列的另一观点，而非支撑关系
    - 误以为中心论点只能在开头，忽略中间或结尾提出
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:临江仙·夜登小阁，忆洛中旧游·陈与义
  type: Concept
  subject: 语文
  title: 临江仙·夜登小阁，忆洛中旧游·陈与义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将作者陈与义误记为苏轼或辛弃疾，因词风相似。
    - 能指出并纠正这一错误：认为词作表达豪情壮志，实际是回忆洛阳旧游后的落寞孤寂。
  aliases:
    - 临江仙
  category: 古诗词
  explanation: 陈与义词作，追忆往昔，抒发落寞孤寂的情怀。
  misconceptions:
    - 将作者陈与义误记为苏轼或辛弃疾，因词风相似。
    - 认为词作表达豪情壮志，实际是回忆洛阳旧游后的落寞孤寂。
    - 把“忆洛中旧游”理解为怀念洛阳景物，忽略了对当年雅集兴盛的追念与今昔对比。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:为探索者画像
  type: Concept
  subject: 语文
  title: 为探索者画像
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把“画像”理解成外貌描写，满篇写长相五官，忽略科技工作者的事迹与精神。
    - 能指出并纠正这一错误：罗列生平大事却不会提炼，写成“年代表”式的流水账，没有凸显人物精神。
  aliases: []
  category: 写作任务
  explanation: 通过收集科技工作者的资料，用文字描绘其形象，可包括大事年表、主要经历或科学精神。
  misconceptions:
    - 把“画像”理解成外貌描写，满篇写长相五官，忽略科技工作者的事迹与精神。
    - 罗列生平大事却不会提炼，写成“年代表”式的流水账，没有凸显人物精神。
    - 引用资料时张冠李戴，把袁隆平的事迹安到屠呦呦身上，导致人物形象失真。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:主一无适便是敬
  type: Concept
  subject: 语文
  title: 主一无适便是敬
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“适”理解为“适合”，整句误读为“没有适合的事就是敬”。
    - 能指出并纠正这一错误：将“主一无适”误写为“主一无事”，把“适”写成“事”。
  aliases: []
  category: 名言警句
  explanation: 朱熹对敬的解释，指专一无杂念，是敬业的核心。
  misconceptions:
    - 把“适”理解为“适合”，整句误读为“没有适合的事就是敬”。
    - 将“主一无适”误写为“主一无事”，把“适”写成“事”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:主体
  type: Concept
  subject: 语文
  title: 主体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把主体当作消息开头的第一段，误以为主体就是导语。
    - 能指出并纠正这一错误：认为主体是消息的结尾，负责总结全文，与导语无关。
  aliases: []
  category: 文体知识
  explanation: 主体是消息中导语之后的部分，具体展开新闻事实的叙述。
  misconceptions:
    - 把主体当作消息开头的第一段，误以为主体就是导语。
    - 认为主体是消息的结尾，负责总结全文，与导语无关。
    - 找主体时从标题开始找，把标题和导语都算作主体。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:主语和宾语搭配不当
  type: Concept
  subject: 语文
  title: 主语和宾语搭配不当
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“他的年龄是青年”是对的说法，实际“年龄”与“青年”不搭配。
    - 能指出并纠正这一错误：把“他的性格是开朗的”判为主谓搭配不当，实际应为主宾搭配不当。
  aliases:
    - 主宾搭配不当
  category: 语法
  explanation: 主语和宾语在语义上不能搭配，如'收成是一年'。
  misconceptions:
    - 误认为“他的年龄是青年”是对的说法，实际“年龄”与“青年”不搭配。
    - 把“他的性格是开朗的”判为主谓搭配不当，实际应为主宾搭配不当。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:主语和谓语搭配不当
  type: Concept
  subject: 语文
  title: 主语和谓语搭配不当
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：检查“目光和掌声集中到旗杆上”时，只看出“目光集中”，漏掉“掌声集中”不搭配。
    - 能指出并纠正这一错误：认为“他的脸色和声音都很健康”没有语病，实际“声音”不能“健康”。
  aliases:
    - 主谓搭配不当
  category: 语法
  explanation: 主语和谓语在语义上不能搭配，如'目光和掌声集中到旗杆上'中'掌声'不能'集中'。
  misconceptions:
    - 检查“目光和掌声集中到旗杆上”时，只看出“目光集中”，漏掉“掌声集中”不搭配。
    - 认为“他的脸色和声音都很健康”没有语病，实际“声音”不能“健康”。
    - 把“他的思想进步了”误判为主谓不搭配，实际“进步”可以和“思想”搭配。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:主题思想
  type: Concept
  subject: 语文
  title: 主题思想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把主题概括成“菲利普夫妇嫌贫爱富”，忽略对金钱社会人际关系的批判
    - 能指出并纠正这一错误：用复述情节代替主题，如“写了于勒由穷变富又变穷的故事”
  aliases:
    - 中心思想
  category: 文学常识
  explanation: 主题思想是作品通过情节和人物所表达的中心思想。
  misconceptions:
    - 把主题概括成“菲利普夫妇嫌贫爱富”，忽略对金钱社会人际关系的批判
    - 用复述情节代替主题，如“写了于勒由穷变富又变穷的故事”
    - 认为主题就是作者通过人物说的某句话，如把若瑟夫的话当主题
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:丽江古城
  type: Concept
  subject: 语文
  title: 丽江古城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为丽江古城位于昆明市，实际在丽江市。
    - 能指出并纠正这一错误：把四方街误认为木氏土司的木府。
  aliases:
    - 大研古城
  category: 文化常识
  explanation: 位于云南省丽江市，是中国历史文化名城，以四方街为中心，木氏土司曾在此筑城。
  misconceptions:
    - 误以为丽江古城位于昆明市，实际在丽江市。
    - 把四方街误认为木氏土司的木府。
    - 误以为四方街是四条街道交叉口，实为广场。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:举例论证
  type: Concept
  subject: 语文
  title: 举例论证
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将举例论证与比喻论证混淆，如认为“一箪食，一豆羹”是比喻，实际是例子。
    - 能指出并纠正这一错误：误以为举例论证必须用“例如”等词，没有关联词就不是举例论证。
  aliases:
    - 例证法
  category: 论证方法
  explanation: 通过列举具体事例来论证论点，如“一箪食，一豆羹”的例子。
  misconceptions:
    - 将举例论证与比喻论证混淆，如认为“一箪食，一豆羹”是比喻，实际是例子。
    - 误以为举例论证必须用“例如”等词，没有关联词就不是举例论证。
    - 将道理论据与事例论据混同，如引用名人名言也算举例论证。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:义和团
  type: Concept
  subject: 语文
  title: 义和团
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将义和团当成太平天国，两者都是清末农民运动但性质不同。
    - 能指出并纠正这一错误：错写“义和团”为“仪和团”，或认为它只反清不反帝。
  aliases: []
  category: 历史常识
  explanation: 清末民间反帝爱国组织，何大学问年轻时曾参加过。
  misconceptions:
    - 误将义和团当成太平天国，两者都是清末农民运动但性质不同。
    - 错写“义和团”为“仪和团”，或认为它只反清不反帝。
    - 认为义和团由清政府支持，忽略其反帝爱国本质。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:之的用法
  type: Concept
  subject: 语文
  title: 之的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“何陋之有”的“之”当作代词“它”，翻译成“它有啥简陋？”
    - 能指出并纠正这一错误：误将“予独爱莲之出淤泥而不染”中的“之”译为“的”，实际是取消句子独立性
  aliases: []
  category: 文言虚词
  explanation: 文言文中“之”有多种用法：作代词、助词（的）、取消句子独立性、宾语前置的标志等。
  misconceptions:
    - 把“何陋之有”的“之”当作代词“它”，翻译成“它有啥简陋？”
    - 误将“予独爱莲之出淤泥而不染”中的“之”译为“的”，实际是取消句子独立性
    - 认为“水陆草木之花”中的“之”是动词“到”，混淆助词和动词用法
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:乌木三镶银箸
  type: Concept
  subject: 语文
  title: 乌木三镶银箸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“箸”读成“zhē”，不知道是“筷子”的古称
    - 能指出并纠正这一错误：误以为“三镶”是“三根”筷子，将“镶”当数量词
  aliases: []
  category: 文化常识
  explanation: 一种奢华的筷子，用乌木制成，并镶嵌银饰。
  misconceptions:
    - 把“箸”读成“zhē”，不知道是“筷子”的古称
    - 误以为“三镶”是“三根”筷子，将“镶”当数量词
    - 将“乌木三镶银箸”说成“黑色木筷”，漏掉银饰镶嵌
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:乌篷船
  type: Concept
  subject: 语文
  title: 乌篷船
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“乌篷船”的“篷”误写为“蓬”，如“乌蓬船”。
    - 能指出并纠正这一错误：把“篷”与“蓬”混用，误写“帐蓬”。
  aliases: []
  category: 文化常识
  explanation: 船篷是用黑油涂过的船。
  misconceptions:
    - 将“乌篷船”的“篷”误写为“蓬”，如“乌蓬船”。
    - 把“篷”与“蓬”混用，误写“帐蓬”。
    - 认为“乌篷船”是黑色小船，忽略“篷”指船篷。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:乐业
  type: Concept
  subject: 语文
  title: 乐业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“乐业”的“乐”读成yuè，误以为与音乐有关。
    - 能指出并纠正这一错误：认为“乐业”指“快乐的职业”，与“以业为乐”混淆。
  aliases: []
  category: 核心概念
  explanation: 乐业指从劳作中发现乐趣，以积极乐观的态度对待工作，避免厌恶本业。
  misconceptions:
    - 把“乐业”的“乐”读成yuè，误以为与音乐有关。
    - 认为“乐业”指“快乐的职业”，与“以业为乐”混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:乐府诗
  type: Concept
  subject: 语文
  title: 乐府诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为乐府诗都是汉代民歌，忽略唐代文人仿作。
    - 能指出并纠正这一错误：将《十五从军征》归为律诗，实际是乐府诗。
  aliases: []
  category: 文学体裁
  explanation: 乐府诗是古代乐府官署采集的民歌或文人仿作，多反映社会现实，如《十五从军征》。
  misconceptions:
    - 误认为乐府诗都是汉代民歌，忽略唐代文人仿作。
    - 将《十五从军征》归为律诗，实际是乐府诗。
    - 把“乐府”的“乐”读作lè，正确应读yuè。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:九一八事变
  type: Concept
  subject: 语文
  title: 九一八事变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将九一八事变时间记成1937年，与七七事变混淆，如认为日本全面侵华始于九一八。
    - 能指出并纠正这一错误：误以为九一八事变后东北未沦陷，或认为东北青年流亡是自发而非被迫。
  aliases:
    - 九一八
    - 沈阳事变
  category: 历史事件
  explanation: 1931年9月18日日本侵占中国东北的事件，导致东北沦陷，大批东北青年流亡关内。
  misconceptions:
    - 将九一八事变时间记成1937年，与七七事变混淆，如认为日本全面侵华始于九一八。
    - 误以为九一八事变后东北未沦陷，或认为东北青年流亡是自发而非被迫。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:九重天
  type: Concept
  subject: 语文
  title: 九重天
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘九重天’解释为‘天有九层’，不知实指帝王居所
    - 能指出并纠正这一错误：误读‘重’为zhòng，正确为chóng
  aliases:
    - 朝廷
  category: 文学常识
  explanation: 指皇帝，古代称帝王居所为九重天。
  misconceptions:
    - 将‘九重天’解释为‘天有九层’，不知实指帝王居所
    - 误读‘重’为zhòng，正确为chóng
    - 把‘九重天’的借代手法当成真实景观，以为指某座高山
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:习俗的寓意
  type: Concept
  subject: 语文
  title: 习俗的寓意
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 许多民间习俗寄托着人们的美好愿望，如过年吃年糕寓意"年年高"，建筑上雕刻蝙蝠寓意"福到"。了解寓意能帮助我们理解传统文化。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:乡土文学
  type: Concept
  subject: 语文
  title: 乡土文学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为只要写农村就是乡土文学，忽略地方色彩和风土人情。
    - 能指出并纠正这一错误：把“乡土”写成“乡士”，字形混淆。
  aliases: []
  category: 文学常识
  explanation: 以农村生活为题材，描写风土人情，具有地方色彩的小说。本文体现了乡土文学的特点。
  misconceptions:
    - 误以为只要写农村就是乡土文学，忽略地方色彩和风土人情。
    - 把“乡土”写成“乡士”，字形混淆。
    - 将乡土文学与“荷花淀派”等同，认为刘绍棠是乡土文学唯一代表。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:书信体
  type: Concept
  subject: 语文
  title: 书信体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为书信体只能写给具体的人，不能写给抽象对象如‘祖国’（错，《致祖国》也是书信体）。
    - 能指出并纠正这一错误：写书信体作文时忘记署名和日期，以为只写正文即可。
  aliases:
    - 书信格式
  category: 文体知识
  explanation: 书信体是以书信形式写成的文章，具有明确的收信人、写信人和日期，便于直接表达情感和观点。
  misconceptions:
    - 认为书信体只能写给具体的人，不能写给抽象对象如‘祖国’（错，《致祖国》也是书信体）。
    - 写书信体作文时忘记署名和日期，以为只写正文即可。
    - 把标明‘日记’字样的文章误判为书信体，因二者都有日期。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:书信的格式
  type: Concept
  subject: 语文
  title: 书信的格式
  conceptType: 概念型
  aliases:
    - 书信格式
  category: 概念
  explanation: 写信有固定的格式：开头是称呼，然后是问候语、正文、祝福语，最后写署名和日期。写好的信还要正确书写信封才能寄出。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:事件通讯
  type: Concept
  subject: 语文
  title: 事件通讯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只罗列事件结果，没有写出发生、发展的过程，读起来像简讯。
    - 能指出并纠正这一错误：把事件通讯和消息混为一谈，认为也可以只写最重要部分，忽视详述经过。
  aliases: []
  category: 新闻体裁
  explanation: 事件通讯是相对完整地记述新闻事件，展示其发展过程与社会意义的新闻体裁。
  misconceptions:
    - 只罗列事件结果，没有写出发生、发展的过程，读起来像简讯。
    - 把事件通讯和消息混为一谈，认为也可以只写最重要部分，忽视详述经过。
    - 在事件通讯中大量加入主观议论，忘了应靠事实本身展示意义。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:事实论据
  type: Concept
  subject: 语文
  title: 事实论据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把引用名言警句误判为事实论据，实为道理论据
    - 能指出并纠正这一错误：用小说中的虚构情节作事实论据，混淆生活事例与艺术虚构
  aliases: []
  category: 写作知识
  explanation: 用历史事件、生活事例、统计数据等作为论据。
  misconceptions:
    - 把引用名言警句误判为事实论据，实为道理论据
    - 用小说中的虚构情节作事实论据，混淆生活事例与艺术虚构
    - 将‘举例论证’等同于‘事实论据’，把论证方法当论据类型
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:二十四节气
  type: Concept
  subject: 语文
  title: 二十四节气
  conceptType: 概念型
  aliases:
    - 节气
    - 二十四节气歌
  category: 文化常识
  explanation: 古人把一年分成二十四个节气，用来安排农事。节气歌说"春雨惊春清谷天，夏满芒夏暑相连"，背一背就记住了。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:二郎神
  type: Concept
  subject: 语文
  title: 二郎神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将二郎神视为“大圣”，以为“小圣”是孙悟空。
    - 能指出并纠正这一错误：把二郎神与哪吒混为一谈，认为哪吒会七十二变。
  aliases:
    - 杨戬
    - 清源妙道真君
  category: 文学常识
  explanation: 二郎神是神话故事人物，传说姓杨名戬，住灌江口，道号“清源妙道真君”，在《西游记》中被称为“小圣”。
  misconceptions:
    - 误将二郎神视为“大圣”，以为“小圣”是孙悟空。
    - 把二郎神与哪吒混为一谈，认为哪吒会七十二变。
    - 将“二郎神”误写成“二朗神”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:于勒
  type: Concept
  subject: 语文
  title: 于勒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为于勒是“我”的哥哥，实际于勒是“我”的叔叔（父亲的弟弟）
    - 能指出并纠正这一错误：以为于勒始终是恶人，忽略他后来破产沦为穷水手的遭遇
  aliases: []
  category: 人物形象
  explanation: 于勒是《我的叔叔于勒》中的人物，年轻时败家，后发财又破产，成为菲利普夫妇态度变化的焦点。
  misconceptions:
    - 认为于勒是“我”的哥哥，实际于勒是“我”的叔叔（父亲的弟弟）
    - 以为于勒始终是恶人，忽略他后来破产沦为穷水手的遭遇
    - 说于勒在美洲发了财并写信回来，却忘记他后来破产的结局
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:互文
  type: Concept
  subject: 语文
  title: 互文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“将军百战死，壮士十年归”拆开译成将军都战死、壮士都归来，不懂合看补充
    - 能指出并纠正这一错误：将“开我东阁门，坐我西阁床”当作只开门不坐床，或只坐床不进门，忽略互文关系
  aliases:
    - 互文见义
  category: 修辞手法
  explanation: 上下句意思相互交错、补充，合起来表达一个完整的意思。
  misconceptions:
    - 把“将军百战死，壮士十年归”拆开译成将军都战死、壮士都归来，不懂合看补充
    - 将“开我东阁门，坐我西阁床”当作只开门不坐床，或只坐床不进门，忽略互文关系
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:五子行
  type: Concept
  subject: 语文
  title: 五子行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“五子行”看作光荣职业的统称，忽略其贬义色彩。
    - 能指出并纠正这一错误：写错字，将“堂子”写作“糖子”，“门子”写作“们子”。
  aliases: []
  category: 文化常识
  explanation: 旧时对厨子、戏子、堂子、门子、老妈子的蔑称，社会地位低下。
  misconceptions:
    - 误把“五子行”看作光荣职业的统称，忽略其贬义色彩。
    - 写错字，将“堂子”写作“糖子”，“门子”写作“们子”。
    - 以为“五子行”指五种五行，与金木水火土有关。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:五行五谷五音五彩
  type: Concept
  subject: 语文
  title: 五行五谷五音五彩
  conceptType: 概念型
  aliases:
    - 五行
    - 五谷
    - 五音
    - 五彩
  category: 文化常识
  explanation: 五行指金、木、水、火、土；五谷指稻、麦、黍、菽、稷；五音指宫、商、角、徵、羽；五彩指黄、青、赤、白、黑。这些是古人常用的文化常识。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C7/sections/S5.md
- id: concept:语文:井冈山精神
  type: Concept
  subject: 语文
  title: 井冈山精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“延安精神”的核心“自力更生、艰苦奋斗”当井冈山精神，二者产生时期和内涵不同
    - 能指出并纠正这一错误：将井冈山精神简化为仅“坚定信念、艰苦奋斗”，丢掉“实事求是、敢闯新路、依靠群众”等关键要素
  aliases:
    - 井冈山革命精神
  category: 文化常识
  explanation: 以毛泽东为代表的中国共产党人在井冈山革命根据地斗争中形成的革命精神，核心是坚定信念、艰苦奋斗、实事求是、敢闯新路、依靠群众、勇于胜利。
  misconceptions:
    - 误把“延安精神”的核心“自力更生、艰苦奋斗”当井冈山精神，二者产生时期和内涵不同
    - 将井冈山精神简化为仅“坚定信念、艰苦奋斗”，丢掉“实事求是、敢闯新路、依靠群众”等关键要素
    - 以为井冈山精神是全国胜利后概括的，实际它诞生于1927-1930年井冈山革命斗争实践
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:交友之道
  type: Concept
  subject: 语文
  title: 交友之道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“交友之道”理解为“交朋友的道理”，却忽略“道”指方法原则，答题时只说“要真诚”而说不出具体做…
    - 能指出并纠正这一错误：误以为“志同道合”就是兴趣相同，如都爱打球就算志同道合，忽视志向和价值观的一致。
  aliases:
    - 交友原则
  category: 文化常识
  explanation: 交友之道指交朋友的原则和方法，如真诚、志同道合、选择益友等。本课通过活动探讨交友之道。
  misconceptions:
    - 把“交友之道”理解为“交朋友的道理”，却忽略“道”指方法原则，答题时只说“要真诚”而说不出具体做法。
    - 误以为“志同道合”就是兴趣相同，如都爱打球就算志同道合，忽视志向和价值观的一致。
    - 举交友例子时引用“管宁割席”却误说成是“管鲍之交”，张冠李戴。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:京剧
  type: Concept
  subject: 语文
  title: 京剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为京剧起源于昆曲，其实它融合了徽剧、汉剧等多种声腔。
    - 能指出并纠正这一错误：把京剧发祥地写成安徽或湖北，实际是形成于北京。
  aliases:
    - 国剧
  category: 戏曲剧种
  explanation: 中国影响最大的戏曲剧种，起源于北京，融合多种声腔，表演艺术精湛。
  misconceptions:
    - 误认为京剧起源于昆曲，其实它融合了徽剧、汉剧等多种声腔。
    - 把京剧发祥地写成安徽或湖北，实际是形成于北京。
    - 将京剧代表作《红灯记》说成是历史剧，忽略其现代戏属性。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:京味儿
  type: Concept
  subject: 语文
  title: 京味儿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把京味儿等同于北京方言词，忽略老舍笔下四合院、胡同、车厂等风土人情
    - 能指出并纠正这一错误：把“京味儿”写成“京味”丢儿化音，或与“京腔”混为一谈
  aliases:
    - 京味
  category: 文学特色
  explanation: 指老舍小说中运用北京口语、描绘北京风土人情所形成的独特地方色彩。
  misconceptions:
    - 把京味儿等同于北京方言词，忽略老舍笔下四合院、胡同、车厂等风土人情
    - 把“京味儿”写成“京味”丢儿化音，或与“京腔”混为一谈
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:京味话剧
  type: Concept
  subject: 语文
  title: 京味话剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把老舍的《茶馆》说成是京剧或评剧，忽略其话剧属性。
    - 能指出并纠正这一错误：以为只要台词用儿化音就是京味话剧，忽略文化内涵和民俗风情。
  aliases:
    - 北京味话剧
  category: 文学常识
  explanation: 指具有北京地域文化特色、语言风格和民俗风情的话剧，人物语言富有北京口语特点。
  misconceptions:
    - 把老舍的《茶馆》说成是京剧或评剧，忽略其话剧属性。
    - 以为只要台词用儿化音就是京味话剧，忽略文化内涵和民俗风情。
    - 混淆“京味话剧”与“北京人艺”概念，以为是同一类戏剧形式。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:亭亭玉立
  type: Concept
  subject: 语文
  title: 亭亭玉立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写为“婷婷玉立”，误以为“婷婷”才是形容女子姿态的字形。
    - 能指出并纠正这一错误：用“亭亭玉立”形容高楼或山峰，忽视了它用于花木或女子本义。
  aliases: []
  category: 成语
  explanation: 形容花木主干挺拔或女子身材修长，也形容姿态端正美好。
  misconceptions:
    - 误写为“婷婷玉立”，误以为“婷婷”才是形容女子姿态的字形。
    - 用“亭亭玉立”形容高楼或山峰，忽视了它用于花木或女子本义。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:亲情
  type: Concept
  subject: 语文
  title: 亲情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“亲情”等同于“血缘关系”，认为只有亲生父母才算亲人，忽略养父母、继父母之间的深厚感情。
    - 能指出并纠正这一错误：误以为亲情只局限于父母之爱，忽略兄弟姐妹、祖孙间的关爱同样属于亲情。
  aliases: []
  category: 主题
  explanation: 人世间最普遍、最美好的情感之一，本单元围绕家人之间的故事和真挚感情展开。
  misconceptions:
    - 把“亲情”等同于“血缘关系”，认为只有亲生父母才算亲人，忽略养父母、继父母之间的深厚感情。
    - 误以为亲情只局限于父母之爱，忽略兄弟姐妹、祖孙间的关爱同样属于亲情。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:人与动物的关系
  type: Concept
  subject: 语文
  title: 人与动物的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人与动物关系就是人类说了算，忽略文中对生命平等的反思。
    - 能指出并纠正这一错误：只看到前两只猫带来的快乐，忽略第三只猫引发的矛盾冲突和愧疚。
  aliases:
    - 人与动物相处
  category: 主题思想
  explanation: 本单元文章围绕人与动物的相处方式、情感态度及矛盾冲突展开，探讨人与动物和谐共生的意义。
  misconceptions:
    - 认为人与动物关系就是人类说了算，忽略文中对生命平等的反思。
    - 只看到前两只猫带来的快乐，忽略第三只猫引发的矛盾冲突和愧疚。
    - 觉得人与动物共生只需喂食，不懂文中情感态度变化才是核心。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:人倍信则名不达
  type: Concept
  subject: 语文
  title: 人倍信则名不达
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“倍”误译为“加倍”，正确是“违背”
    - 能指出并纠正这一错误：误将“名不达”理解为“名声不能传播到远方”，实际是“名声不会显达”
  aliases: []
  category: 名言警句
  explanation: 出自刘向《说苑·谈丛》，意为违背信用的人名声不会显达。
  misconceptions:
    - 把“倍”误译为“加倍”，正确是“违背”
    - 误将“名不达”理解为“名声不能传播到远方”，实际是“名声不会显达”
    - 记错出处为《论语》，实为刘向《说苑》
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:人声鼎沸
  type: Concept
  subject: 语文
  title: 人声鼎沸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“鼎”字写成“顶”或“钉”，写成“人声顶沸”
    - 能指出并纠正这一错误：误用来形容安静的环境，如教室静悄悄也说人声鼎沸
  aliases: []
  category: 成语
  explanation: 形容人声喧闹，像水在鼎中沸腾一样。
  misconceptions:
    - 把“鼎”字写成“顶”或“钉”，写成“人声顶沸”
    - 误用来形容安静的环境，如教室静悄悄也说人声鼎沸
    - 将“沸”误读成fú，正确读音为fèi
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:人民英雄纪念碑
  type: Concept
  subject: 语文
  title: 人民英雄纪念碑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为纪念碑是1949年开国大典时建成的，实际1958年才建成。
    - 能指出并纠正这一错误：将纪念碑的位置记成上海人民广场，而非北京天安门广场。
  aliases:
    - 纪念碑
  category: 建筑
  explanation: 位于北京天安门广场，为纪念在人民解放战争和人民革命中牺牲的人民英雄而建，1949年奠基，1952年动工，1958年建成。
  misconceptions:
    - 误认为纪念碑是1949年开国大典时建成的，实际1958年才建成。
    - 将纪念碑的位置记成上海人民广场，而非北京天安门广场。
    - 写‘人民英雄纪念碑’时把‘碑’的右部‘卑’写成‘白’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:人物卡片设计
  type: Concept
  subject: 语文
  title: 人物卡片设计
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：给《老山界》人物卡片配上黄继光照片，图注与人物完全不符。
    - 能指出并纠正这一错误：引用评价时张冠李戴，把闻一多评臧克家的话写进李公朴卡片。
  aliases:
    - 人物卡片
  category: 语文实践
  explanation: 为杰出人物设计图文卡片，包括选取照片、图注和精要介绍文字，可引用人物原话或他人评价。
  misconceptions:
    - 给《老山界》人物卡片配上黄继光照片，图注与人物完全不符。
    - 引用评价时张冠李戴，把闻一多评臧克家的话写进李公朴卡片。
    - 介绍文字写成生平年表，超过百字仍无重点，失去“精要”二字。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:人物台词
  type: Concept
  subject: 语文
  title: 人物台词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把舞台说明如“（愤怒地）”当作人物台词。
    - 能指出并纠正这一错误：认为台词只包括对话，不包括独白和旁白。
  aliases:
    - 台词
  category: 文学常识
  explanation: 剧中人物所说的话语，包括对话、独白、旁白等，用于塑造人物和推动情节。
  misconceptions:
    - 把舞台说明如“（愤怒地）”当作人物台词。
    - 认为台词只包括对话，不包括独白和旁白。
    - 写剧本时，把心理活动的描写直接放在台词里，忽略潜台词。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:人物塑造方法
  type: Concept
  subject: 语文
  title: 人物塑造方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有正面描写能塑造人物，忽略多角度描写中的侧面描写。
    - 能指出并纠正这一错误：把“艺术性夸张”等同于夸大其词，认为不真实。
  aliases: []
  category: 文学知识
  explanation: 小说中塑造人物的方法包括多角度描写、置于矛盾冲突中、艺术性夸张等。
  misconceptions:
    - 认为只有正面描写能塑造人物，忽略多角度描写中的侧面描写。
    - 把“艺术性夸张”等同于夸大其词，认为不真实。
    - 误把“置于矛盾冲突中”当作情节设置，而非人物塑造方法。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:人物小传
  type: Concept
  subject: 语文
  title: 人物小传
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写保尔小传时只罗列他参军、修路等事件，没有概括‘钢铁意志’这一性格点。
    - 能指出并纠正这一错误：把人物小传写成读后感，大谈自己受感动，而不是客观概括生平事迹。
  aliases: []
  category: 阅读方法
  explanation: 用简短的文字概括人物的生平事迹和性格特点，是分析人物形象的一种方法。
  misconceptions:
    - 写保尔小传时只罗列他参军、修路等事件，没有概括‘钢铁意志’这一性格点。
    - 把人物小传写成读后感，大谈自己受感动，而不是客观概括生平事迹。
    - 认为人物小传必须包含外貌描写，于是照抄原文中对保尔眼睛的描写。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:人物形象
  type: Concept
  subject: 语文
  title: 人物形象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：概括人物性格时贴标签，如只说“自私冷酷”，不带文本依据
    - 能指出并纠正这一错误：把人物某一行为当成全部性格，如认为于勒仅是个败家子
  aliases:
    - 人物性格
  category: 文学常识
  explanation: 人物形象是小说中塑造的人物性格特征，通过具体描写展现。
  misconceptions:
    - 概括人物性格时贴标签，如只说“自私冷酷”，不带文本依据
    - 把人物某一行为当成全部性格，如认为于勒仅是个败家子
    - 混淆“人物形象”与“人物描写方法”，分析时答非所问
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:人物形象分析
  type: Concept
  subject: 语文
  title: 人物形象分析
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把妞儿的泼辣误读成蛮横无理，忽略她对八路军战士的真切关怀。
    - 能指出并纠正这一错误：分析人物时只抄语言描写，不结合‘给我洗脸’等动作细节，得出片面结论。
  aliases: []
  category: 阅读方法
  explanation: 通过语言、动作、神态等描写分析人物性格，如妞儿的泼辣爽直、善良质朴。
  misconceptions:
    - 把妞儿的泼辣误读成蛮横无理，忽略她对八路军战士的真切关怀。
    - 分析人物时只抄语言描写，不结合‘给我洗脸’等动作细节，得出片面结论。
    - 给妞儿贴‘农村妇女’标签，忽视其爽直中带羞涩、质朴中显机敏的复杂性。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:人物描写方法
  type: Concept
  subject: 语文
  title: 人物描写方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“脸色苍白”判断为外貌描写，其实属于神态描写
    - 能指出并纠正这一错误：把心理活动写成语言描写，如“他想：完了”误作语言描写
  aliases:
    - 描写方法
  category: 写作手法
  explanation: 人物描写方法包括外貌、语言、动作、心理、神态描写，用以刻画人物性格。
  misconceptions:
    - 将“脸色苍白”判断为外貌描写，其实属于神态描写
    - 把心理活动写成语言描写，如“他想：完了”误作语言描写
    - 将“他哭着说”只归为动作描写，忽略其中包含的神态描写
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:人物特点
  type: Concept
  subject: 语文
  title: 人物特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把外貌当全部，如写“他个子高、眼睛大”就结束，不写性格差异，使人物面目模糊。
    - 能指出并纠正这一错误：用概括词贴标签，如“他很善良”“他很勤劳”，不举具体表现，特点空泛无说服力。
  aliases:
    - 人物特征
  category: 写作知识
  explanation: 人物特点包括外貌差异和性格差异，是区分不同人物的关键。
  misconceptions:
    - 把外貌当全部，如写“他个子高、眼睛大”就结束，不写性格差异，使人物面目模糊。
    - 用概括词贴标签，如“他很善良”“他很勤劳”，不举具体表现，特点空泛无说服力。
    - 将身份职业当特点，如写“他是班长”“他是医生”，未写出与别人不同的个性特质。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:人物通讯
  type: Concept
  subject: 语文
  title: 人物通讯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：面面俱到地写人物一生，像写简历，没有聚焦新闻事件中的具体表现。
    - 能指出并纠正这一错误：只写人物的豪言壮语，不写具体行动和事例，导致人物形象空洞。
  aliases: []
  category: 新闻体裁
  explanation: 人物通讯是围绕新闻事件中的人物，报道其言行、事迹，展现人物精神的新闻体裁。
  misconceptions:
    - 面面俱到地写人物一生，像写简历，没有聚焦新闻事件中的具体表现。
    - 只写人物的豪言壮语，不写具体行动和事例，导致人物形象空洞。
    - 把不同人物的事迹混在一起写，张冠李戴，人物形象不真实。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:人生的三大追求
  type: Concept
  subject: 语文
  title: 人生的三大追求
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将罗素的三大追求记成'对权力的渴望'，应是对爱情的渴望。
    - 能指出并纠正这一错误：把'对知识的追求'错写为'对财富的追求'，或遗漏'对人类苦难的同情'。
  aliases:
    - 我为什么而活着
  category: 哲理
  explanation: 罗素认为对爱情的渴望、对知识的追求和对人类苦难的同情是支配他一生的三种感情。
  misconceptions:
    - 误将罗素的三大追求记成'对权力的渴望'，应是对爱情的渴望。
    - 把'对知识的追求'错写为'对财富的追求'，或遗漏'对人类苦难的同情'。
    - 张冠李戴：将罗素的三大追求安到叔本华头上。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:人迹罕至
  type: Concept
  subject: 语文
  title: 人迹罕至
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“罕”写成“汗”，写成“人迹汗至”
    - 能指出并纠正这一错误：误以为“人迹”指人的痕迹，与足迹无关
  aliases: []
  category: 成语
  explanation: 少有人来。迹，足迹。罕，稀少。
  misconceptions:
    - 把“罕”写成“汗”，写成“人迹汗至”
    - 误以为“人迹”指人的痕迹，与足迹无关
    - 把“罕”理解成“稀”却错写成“人迹稀至”
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:仁慈
  type: Concept
  subject: 语文
  title: 仁慈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“仁慈”与“慈祥”混用，如“爷爷仁慈的笑容”误用。
    - 能指出并纠正这一错误：认为“仁慈”只能形容上级对下级，缩小了使用范围。
  aliases: []
  category: 词语
  explanation: 仁爱慈善。
  misconceptions:
    - 将“仁慈”与“慈祥”混用，如“爷爷仁慈的笑容”误用。
    - 认为“仁慈”只能形容上级对下级，缩小了使用范围。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:介绍姓氏的方法
  type: Concept
  subject: 语文
  title: 介绍姓氏的方法
  conceptType: 程序型
  aliases:
    - 拆字法介绍姓氏
  category: 方法
  explanation: 介绍自己的姓有多种方法：可以把字拆开说，如木子李、弓长张；也可以组词说，如方向的方。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:介绍科技影视作品
  type: Concept
  subject: 语文
  title: 介绍科技影视作品
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把影视作品里的科幻设定当成真实科技，介绍时直接说“科学家已发明时光机”。
    - 能指出并纠正这一错误：写介绍时复述剧情占大半篇幅，缺少自己的观点和对科技内核的说明。
  aliases:
    - 科技影视作品介绍
  category: 写作任务
  explanation: 观看科技相关影视作品，记录重要信息，并撰写介绍文字，在分享会上交流。
  misconceptions:
    - 把影视作品里的科幻设定当成真实科技，介绍时直接说“科学家已发明时光机”。
    - 写介绍时复述剧情占大半篇幅，缺少自己的观点和对科技内核的说明。
    - 将导演、上映年份或演员信息记错，分享时被同学指出错误（如说《流浪地球》导演是张艺谋）。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:从不同角度提出问题
  type: Concept
  subject: 语文
  title: 从不同角度提出问题
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 提问可以从不同角度进行：有的问题针对课文的一部分内容，有的问题针对全文。从多个角度提问，思考会更全面。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:从不同角度观察
  type: Concept
  subject: 语文
  title: 从不同角度观察
  conceptType: 概念型
  aliases:
    - 换个角度看
  category: 方法
  explanation: 看东西的位置不同，看到的样子也不同，像从旁边看杨桃就像五角星。所以不要急着笑别人，先想想他是从什么角度看的。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:从动作和语言体会人物品质
  type: Concept
  subject: 语文
  title: 从动作和语言体会人物品质
  conceptType: 程序型
  aliases:
    - 通过动作、语言感受人物品质
  category: 方法
  explanation: 人物的动作、语言能表现他的品质，如黄继光用胸膛堵住枪口的动作，让人感受到他的英勇无畏。读时找出这样的语句好好体会。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C7/sections/S2.md
- id: concept:语文:从多方面介绍事物
  type: Concept
  subject: 语文
  title: 从多方面介绍事物
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 介绍一个事物时，可以从规模、类型、神态等几个方面来写，常用过渡句把不同方面连接起来。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:从漫画中获得启示
  type: Concept
  subject: 语文
  title: 从漫画中获得启示
  conceptType: 程序型
  aliases:
    - 漫画作文
  category: 方法
  explanation: 先观察漫画画的是什么内容，再借助标题或文字提示联系生活中的人和事思考含义，写的时候先写清楚漫画内容，再写出自己的思考。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:他信力
  type: Concept
  subject: 语文
  title: 他信力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“他信力”理解成相信别人对自己的信任，而非相信外在力量
    - 能指出并纠正这一错误：仿写时造出“你信力”“我信力”，忽略鲁迅的反讽语境
  aliases: []
  category: 词语理解
  explanation: 鲁迅仿照“自信力”新造的词，指相信外在力量（如地、物、国联）而不相信自己。
  misconceptions:
    - 把“他信力”理解成相信别人对自己的信任，而非相信外在力量
    - 仿写时造出“你信力”“我信力”，忽略鲁迅的反讽语境
    - 把“他信力”与“自信力”看成近义词，实际是对立关系
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:代词
  type: Concept
  subject: 语文
  title: 代词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘这’‘那’当人称代词，把‘我’‘你’当指示代词
    - 能指出并纠正这一错误：将疑问代词‘谁’归为指示代词，忽略其疑问功能
  aliases: []
  category: 语法
  explanation: 代替名词或名词性短语的词，包括人称代词（如我、你、他）和指示代词（如这、那）。
  misconceptions:
    - 误把‘这’‘那’当人称代词，把‘我’‘你’当指示代词
    - 将疑问代词‘谁’归为指示代词，忽略其疑问功能
    - 认为代词‘它’只能指动物，不能指植物或无生命物
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:以小见大
  type: Concept
  subject: 语文
  title: 以小见大
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为小事写得越细就越能表现大主题，结果写成流水账，如切西瓜从切到吃完只为写‘幸福’。
    - 能指出并纠正这一错误：用小事例时直接贴标签，如写公交让座后议论‘这体现了传统美德’，缺少具体描写和自然升华。
  aliases: []
  category: 写作手法
  explanation: 通过细小的事物或细节来表现重大的主题或深刻的意义。
  misconceptions:
    - 认为小事写得越细就越能表现大主题，结果写成流水账，如切西瓜从切到吃完只为写‘幸福’。
    - 用小事例时直接贴标签，如写公交让座后议论‘这体现了传统美德’，缺少具体描写和自然升华。
    - 忽略小事与主题的联系，认为只要写小事情就算以小见大，如写同学借笔却未点明‘帮助’的深层意义。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:任人宰割
  type: Concept
  subject: 语文
  title: 任人宰割
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'宰割'写成'宰害'或'载割'。
    - 能指出并纠正这一错误：误用为'任人欺负'，忽略了其针对国家民族的沉重意味。
  aliases: []
  category: 成语
  explanation: 比喻国家、民族或个人被人侵略、欺压，毫无反抗能力。
  misconceptions:
    - 把'宰割'写成'宰害'或'载割'。
    - 误用为'任人欺负'，忽略了其针对国家民族的沉重意味。
    - 把'任'理解成'信任'，曲解为'信任别人而被宰割'。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:任劳任怨
  type: Concept
  subject: 语文
  title: 任劳任怨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“任”误写为“认”，如“认劳认怨”。
    - 能指出并纠正这一错误：只强调“任劳”，不懂“任怨”是“不怕别人埋怨”。
  aliases: []
  category: 成语
  explanation: 做事不辞劳苦，不怕别人埋怨。
  misconceptions:
    - 把“任”误写为“认”，如“认劳认怨”。
    - 只强调“任劳”，不懂“任怨”是“不怕别人埋怨”。
    - 与“埋头苦干”等同，忽视忍受埋怨这一层。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:仿写句子
  type: Concept
  subject: 语文
  title: 仿写句子
  conceptType: 程序型
  aliases:
    - 照样子写句子
  category: 方法
  explanation: 学着课文小节的样子，换上自己的想法写几句话，比如照着"大块的草坪，绿了"写自己想画的内容。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:仿照课文说一说
  type: Concept
  subject: 语文
  title: 仿照课文说一说
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 先读懂课文里的说法，再学着它的样子，用上同样的句式说出新的内容。比如仿照课文说一说其他植物传播种子的方法。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:伏尔泰
  type: Concept
  subject: 语文
  title: 伏尔泰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为伏尔泰是《就英法联军远征中国给巴特勒上尉的信》的作者，实际是雨果。
    - 能指出并纠正这一错误：将伏尔泰与俄国作家托尔斯泰混淆，认为他是俄国人。
  aliases: []
  category: 人物
  explanation: 法国启蒙思想家、文学家，曾谈及圆明园。
  misconceptions:
    - 误以为伏尔泰是《就英法联军远征中国给巴特勒上尉的信》的作者，实际是雨果。
    - 将伏尔泰与俄国作家托尔斯泰混淆，认为他是俄国人。
    - 认为伏尔泰是英国哲学家，与培根同属英国。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:优雅风度
  type: Concept
  subject: 语文
  title: 优雅风度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为优雅风度就是打扮华贵，与内在修养无关。
    - 能指出并纠正这一错误：认为优雅风度是演员装出来的，私下里不需要保持。
  aliases:
    - 风度
  category: 概念
  explanation: 优雅风度是教养的外在表现，基于关照态度，以尊重他人为核心。
  misconceptions:
    - 误以为优雅风度就是打扮华贵，与内在修养无关。
    - 认为优雅风度是演员装出来的，私下里不需要保持。
    - 将优雅风度等同于教养，忽略了教养是内在品质。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:会意字
  type: Concept
  subject: 语文
  title: 会意字
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 把两个字合在一起，表示一个新的意思，这样的字叫会意字。比如日加月组成明，小加土组成尘，两部分合起来就能猜出字的意思。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C7/sections/S2.md
- id: concept:语文:传感眼镜
  type: Concept
  subject: 语文
  title: 传感眼镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把传感眼镜等同于普通VR眼镜，忽略它能传递触觉和嗅觉。
    - 能指出并纠正这一错误：误以为传感眼镜只能传递视觉信息，不能传递声音。
  aliases: []
  category: 科幻设定
  explanation: 小说中的科幻设备，能传递视觉、触觉和嗅觉，使佩戴者身临其境。
  misconceptions:
    - 把传感眼镜等同于普通VR眼镜，忽略它能传递触觉和嗅觉。
    - 误以为传感眼镜只能传递视觉信息，不能传递声音。
    - 认为传感眼镜是现实中已发明的设备，未意识到它是科幻想象。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:传统节日
  type: Concept
  subject: 语文
  title: 传统节日
  conceptType: 概念型
  aliases:
    - 中国传统节日
  category: 文化常识
  explanation: 我国有春节、元宵节、清明节、端午节、七夕、中秋节、重阳节等传统节日，每个节日都有特别的习俗，像春节贴窗花、端午赛龙舟。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:伪满洲国
  type: Concept
  subject: 语文
  title: 伪满洲国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为伪满洲国是独立国家，忽略其傀儡政权性质。
    - 能指出并纠正这一错误：错写“满洲”为“满州”，或误以为溥仪是自愿当皇帝。
  aliases:
    - 满洲国
  category: 历史知识
  explanation: 1932年日本帝国主义在我国东北建立的傀儡政权，溥仪为傀儡皇帝。
  misconceptions:
    - 误认为伪满洲国是独立国家，忽略其傀儡政权性质。
    - 错写“满洲”为“满州”，或误以为溥仪是自愿当皇帝。
    - 认为伪满洲国存在到新中国成立，实际1945年即灭亡。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:伯乐
  type: Concept
  subject: 语文
  title: 伯乐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为伯乐是传说中神仙，实际是春秋时秦国人孙阳。
    - 能指出并纠正这一错误：把伯乐与“千里马”混为一谈，误为善于奔跑的马。
  aliases: []
  category: 文学意象
  explanation: 善于相马的人，比喻善于发现和选用人才的人。
  misconceptions:
    - 认为伯乐是传说中神仙，实际是春秋时秦国人孙阳。
    - 把伯乐与“千里马”混为一谈，误为善于奔跑的马。
    - 把“伯乐”的“乐”写成“岳”或“跃”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:伯乐相马
  type: Concept
  subject: 语文
  title: 伯乐相马
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“相”误读为xiāng（互相），实际读xiàng（观察）。
    - 能指出并纠正这一错误：认为“伯乐相马”是指伯乐骑着马相看，实际是观察马匹优劣。
  aliases: []
  category: 文化常识
  explanation: 传说中伯乐善于相马，后比喻善于发现和选用人才。
  misconceptions:
    - 把“相”误读为xiāng（互相），实际读xiàng（观察）。
    - 认为“伯乐相马”是指伯乐骑着马相看，实际是观察马匹优劣。
    - 将“伯乐相马”与“塞翁失马”的故事混为一谈。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:佃农
  type: Concept
  subject: 语文
  title: 佃农
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误读“佃”为“tián”，与“田”的读音混淆。
    - 能指出并纠正这一错误：写成“田农”，认为佃农就是所有种田的农民。
  aliases: []
  category: 词语
  explanation: 旧时租种地主土地的农民。
  misconceptions:
    - 误读“佃”为“tián”，与“田”的读音混淆。
    - 写成“田农”，认为佃农就是所有种田的农民。
    - 误解为“有自己土地的农民”，忽略租种地主土地。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:低碳生活
  type: Concept
  subject: 语文
  title: 低碳生活
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“低碳”的“碳”误写为“炭”，如“低炭生活”。
    - 能指出并纠正这一错误：误认为低碳生活就是减少使用煤炭等燃料，忽略减少二氧化碳排放的本质。
  aliases:
    - 低碳生活方式
  category: 环保理念
  explanation: 指减少二氧化碳排放的生活方式，倡导简约适度、绿色低碳。
  misconceptions:
    - 将“低碳”的“碳”误写为“炭”，如“低炭生活”。
    - 误认为低碳生活就是减少使用煤炭等燃料，忽略减少二氧化碳排放的本质。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:体会人物的品质
  type: Concept
  subject: 语文
  title: 体会人物的品质
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 通过人物的言行和自述体会他的精神品质，如从方志敏被搜身却一个铜板也没有，感受他清贫朴素、舍己为公的美德。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:体会人物的想法
  type: Concept
  subject: 语文
  title: 体会人物的想法
  conceptType: 程序型
  aliases:
    - 体会人物的心理
  category: 方法
  explanation: 读人物说的话时，联系前后文想一想他心里在想什么。比如读萨沙的三次问话，能体会到她从好奇到勇敢的变化。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:体会词语的表达效果
  type: Concept
  subject: 语文
  title: 体会词语的表达效果
  conceptType: 程序型
  aliases:
    - 体会用词
    - 品味词语
  category: 方法
  explanation: 把句子里的重点词语细细读一读，想想它让我们感受到了什么。比如"珠峰耸"的"耸"，让我们觉得山峰又高又直地立着。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:体会诗歌表达的情感
  type: Concept
  subject: 语文
  title: 体会诗歌表达的情感
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 反复朗读短诗，体会诗歌的韵味，感受诗人藏在诗句里的感情，比如对母亲深深的依恋。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:体会语言的巧妙
  type: Concept
  subject: 语文
  title: 体会语言的巧妙
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 杨氏之子借姓氏巧妙回应，说“未闻孔雀是夫子家禽”，既听了对方的话又不失礼貌，体现了语言的机智幽默。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C8/sections/S1.md
- id: concept:语文:体会语言表达的准确性
  type: Concept
  subject: 语文
  title: 体会语言表达的准确性
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 说明性课文中不少语句表达很准确，如“科学家们希望能够全面揭示这一历史进程”，找出来体会用词的分寸，能感受到说明要实事求是。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:体会课文表达的思想感情
  type: Concept
  subject: 语文
  title: 体会课文表达的思想感情
  conceptType: 程序型
  aliases:
    - 从关键语句体会思想感情
  category: 方法
  explanation: 找出课文中直接表达作者感情的语句，或者从字里行间去体会，就能知道作者想表达怎样的感情。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:何大学问
  type: Concept
  subject: 语文
  title: 何大学问
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“何大学问”是真名，实为外号，他本人没什么学问。
    - 能指出并纠正这一错误：认为他重视学问所以自己饱读诗书，其实他赶马为生。
  aliases:
    - 何大学问
  category: 人物形象
  explanation: 何满子的爷爷，外号何大学问，身材高大，好说大话，爱打抱不平，赶马为生，重视学问，希望孙子成才。
  misconceptions:
    - 误以为“何大学问”是真名，实为外号，他本人没什么学问。
    - 认为他重视学问所以自己饱读诗书，其实他赶马为生。
    - 把“何大学问”与“何满子”的爷爷搞混，实为同一人。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:何满子
  type: Concept
  subject: 语文
  title: 何满子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为何满子是女孩，实际是六岁顽童（男孩）。
    - 能指出并纠正这一错误：认为他被拴在葡萄架上是因淘气，实际是奶奶怕他溺河。
  aliases: []
  category: 文学形象
  explanation: 《蒲柳人家》中的主要人物，六岁顽童，天真活泼，被爷爷拴在葡萄架上。
  misconceptions:
    - 误以为何满子是女孩，实际是六岁顽童（男孩）。
    - 认为他被拴在葡萄架上是因淘气，实际是奶奶怕他溺河。
    - 把“何满子”与唐代诗人的词牌名混淆，忽略是小说人物。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:何陋之有
  type: Concept
  subject: 语文
  title: 何陋之有
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“何陋之有”理解成“没有什么简陋的”，而实际是反问句
    - 能指出并纠正这一错误：误以为“之”在“何陋之有”中是助词“的”，不知它是宾语前置标志
  aliases: []
  category: 名句
  explanation: 语出《论语·子罕》，意思是“有什么简陋的呢？”在《陋室铭》中引用，强调陋室不陋。
  misconceptions:
    - 把“何陋之有”理解成“没有什么简陋的”，而实际是反问句
    - 误以为“之”在“何陋之有”中是助词“的”，不知它是宾语前置标志
    - 误认为“何陋之有”中“何”是“多么”，译成“多么简陋啊”
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:作批注的角度
  type: Concept
  subject: 语文
  title: 作批注的角度
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 可以从不同角度作批注：写得好的地方、有疑问的地方、有启发的地方、有体会的地方，都可以写下自己的看法。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C7/sections/S1.md
- id: concept:语文:依止
  type: Concept
  subject: 语文
  title: 依止
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'依止'是'依靠并停止'，拆字理解导致错误。
    - 能指出并纠正这一错误：把'依止'写成'依此'，音同字误。
  aliases: []
  category: 词汇
  explanation: 依托，依附。
  misconceptions:
    - 误以为'依止'是'依靠并停止'，拆字理解导致错误。
    - 把'依止'写成'依此'，音同字误。
    - 在句中误用，如'小鸟依止在树枝上'，应用'依傍'。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:侦缉队
  type: Concept
  subject: 语文
  title: 侦缉队
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把侦缉队当作维护正义的警察机构，忽略剧中代表恶势力。
    - 能指出并纠正这一错误：将“侦缉”写成“侦稽”或“侦察”，混淆字形。
  aliases: []
  category: 历史常识
  explanation: 清末民国时期主管侦查缉捕的机构，剧中代表恶势力。
  misconceptions:
    - 误把侦缉队当作维护正义的警察机构，忽略剧中代表恶势力。
    - 将“侦缉”写成“侦稽”或“侦察”，混淆字形。
    - 认为侦缉队是民国时期才有，不清楚清末已有类似机构。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:侧面描写
  type: Concept
  subject: 语文
  title: 侧面描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把观众欢呼当作侧面描写，但实际写的是吕伟的动作，误将直接描写当侧面描写。
    - 能指出并纠正这一错误：认为侧面描写只能写环境，不能写其他人物的反应，如漏掉观众反应。
  aliases:
    - 间接描写
  category: 写作手法
  explanation: 侧面描写是通过描写其他事物或人物的反应来间接表现主要对象，如通过观众反应表现吕伟的精彩。
  misconceptions:
    - 把观众欢呼当作侧面描写，但实际写的是吕伟的动作，误将直接描写当侧面描写。
    - 认为侧面描写只能写环境，不能写其他人物的反应，如漏掉观众反应。
    - 写侧面描写时，直接描写主要人物的心理活动，反而不写他人反应。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:俗语和成语的表达效果
  type: Concept
  subject: 语文
  title: 俗语和成语的表达效果
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 俗语和成语可以表达相近的意思，但俗语口语化、通俗易懂，成语更简洁书面，要根据场合选择合适的说法。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:俘获说
  type: Concept
  subject: 语文
  title: 俘获说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“俘获”误写为“浮获”或“俘掳”。
    - 能指出并纠正这一错误：混淆“俘获说”与“分裂说”，误认为月球是从地球甩出去的是俘获说。
  aliases: []
  category: 天文学假说
  explanation: 认为月球原本是一颗小行星，被地球引力俘获成为卫星，但存在概率问题。
  misconceptions:
    - 将“俘获”误写为“浮获”或“俘掳”。
    - 混淆“俘获说”与“分裂说”，误认为月球是从地球甩出去的是俘获说。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:保尔·柯察金
  type: Concept
  subject: 语文
  title: 保尔·柯察金
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘柯察金’写成‘科察金’或‘柯查金’，混淆‘察’与‘查’。
    - 能指出并纠正这一错误：误认为保尔就是《童年》里的阿廖沙，因两人都经历过苦难。
  aliases:
    - 保尔
  category: 人物形象
  explanation: 小说《钢铁是怎样炼成的》中的主人公，是一个具有钢铁般意志、为理想献身的无产阶级战士形象。
  misconceptions:
    - 把‘柯察金’写成‘科察金’或‘柯查金’，混淆‘察’与‘查’。
    - 误认为保尔就是《童年》里的阿廖沙，因两人都经历过苦难。
    - 把保尔完全等同于作者奥斯特洛夫斯基，忘记了他是艺术形象。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:信天游
  type: Concept
  subject: 语文
  title: 信天游
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写“信天游”为“信天由”。
    - 能指出并纠正这一错误：认为信天游是两行一节且每句都押韵，实际是节内押韵。
  aliases:
    - 顺天游
  category: 文学体裁
  explanation: 陕北民歌的一种形式，两行一节，节内押韵，形式活泼，节奏自由，多用叠词和衬字。
  misconceptions:
    - 误写“信天游”为“信天由”。
    - 认为信天游是两行一节且每句都押韵，实际是节内押韵。
    - 误把信天游当作南方山歌。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:修改润色
  type: Concept
  subject: 语文
  title: 修改润色
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为修改润色就是多换华丽辞藻，忽略内容充实和语言通顺。
    - 能指出并纠正这一错误：把‘改对’和‘改好’混为一谈，以为改到没有错别字就完成了。
  aliases:
    - 文章修改
  category: 写作方法
  explanation: 文章写成后，通过修改使内容更充实、语言更流畅，包括改'对'和改'好'两个层次。
  misconceptions:
    - 认为修改润色就是多换华丽辞藻，忽略内容充实和语言通顺。
    - 把‘改对’和‘改好’混为一谈，以为改到没有错别字就完成了。
    - 只在表面改词句，不调整结构或充实内容，导致改后仍不达意。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:修改符号
  type: Concept
  subject: 语文
  title: 修改符号
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 改正、增补、删除等符号，可以用来修改习作中的错字、漏掉的字和多余的内容。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:修身之道
  type: Concept
  subject: 语文
  title: 修身之道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘人不知而不愠’的‘知’解释为‘知识’，以为别人没知识也不生气，实际‘知’意为了解、赏识
    - 能指出并纠正这一错误：将‘三军可夺帅也，匹夫不可夺志也’理解成‘三军可以夺取主帅，普通人不能夺取志向’，忽略了‘夺’是…
  aliases: []
  category: 思想内容
  explanation: 关于个人品德修养的观点，如“人不知而不愠”“吾日三省吾身”“三军可夺帅也，匹夫不可夺志也”等。
  misconceptions:
    - 把‘人不知而不愠’的‘知’解释为‘知识’，以为别人没知识也不生气，实际‘知’意为了解、赏识
    - 将‘三军可夺帅也，匹夫不可夺志也’理解成‘三军可以夺取主帅，普通人不能夺取志向’，忽略了‘夺’是改变之意
    - 误把‘不愠’的‘愠’写成‘温’，错解为‘不温暖’
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:修辞手法
  type: Concept
  subject: 语文
  title: 修辞手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“他长得像他爸爸”当作比喻，同类相比不是比喻
    - 能指出并纠正这一错误：看到“像”字就判为比喻，忽略“像”后是同类事物或想象，如“他像猴子一样折”不是比喻
  aliases:
    - 修辞
  category: 修辞知识
  explanation: 修辞手法包括比喻、拟人、排比等，写作时根据表达需要单独或综合使用，以提高语言表现力。
  misconceptions:
    - 误把“他长得像他爸爸”当作比喻，同类相比不是比喻
    - 看到“像”字就判为比喻，忽略“像”后是同类事物或想象，如“他像猴子一样折”不是比喻
    - 混淆拟人和比喻，如“柳条在风中起舞”误判为比喻
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:修辞立其诚
  type: Concept
  subject: 语文
  title: 修辞立其诚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘修辞’理解为比喻、拟人等修辞手法，认为‘修辞立其诚’是善用辞藻显真诚。
    - 能指出并纠正这一错误：认为只要态度认真，写出的文章自然‘诚’，无需推敲文字。
  aliases: []
  category: 写作原则
  explanation: 写文章要态度认真，思想、语言、文字三者一致，不马虎。
  misconceptions:
    - 把‘修辞’理解为比喻、拟人等修辞手法，认为‘修辞立其诚’是善用辞藻显真诚。
    - 认为只要态度认真，写出的文章自然‘诚’，无需推敲文字。
    - 将‘诚’理解为诚实，认为文章只要不撒谎即可，不重视文辞统一。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:修辞艺术
  type: Concept
  subject: 语文
  title: 修辞艺术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“盼望着，盼望着”误判为排比，实际是反复。
    - 能指出并纠正这一错误：将“太阳像火球”误判为拟人，应属比喻。
  aliases: []
  category: 语言
  explanation: 课文运用比喻、反复、排比等修辞手法，注重声韵协调和词语锤炼，体现汉语的韵律美和表现力。
  misconceptions:
    - 把“盼望着，盼望着”误判为排比，实际是反复。
    - 将“太阳像火球”误判为拟人，应属比喻。
    - 认为排比必须三句以上结构完全一致，忽略句子成分相近即可。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:修饰语和中心语搭配不当
  type: Concept
  subject: 语文
  title: 修饰语和中心语搭配不当
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：造句“猛烈地讨论”后以为正确，实际“猛烈”不能修饰“讨论”。
    - 能指出并纠正这一错误：误认为“非常晴朗的天空”是修饰语不当，其实“非常”修饰“晴朗”恰当。
  aliases:
    - 修饰语搭配不当
  category: 语法
  explanation: 定语、状语等修饰成分与中心语搭配不当，如'强烈地证明'中'强烈'修饰'证明'不当。
  misconceptions:
    - 造句“猛烈地讨论”后以为正确，实际“猛烈”不能修饰“讨论”。
    - 误认为“非常晴朗的天空”是修饰语不当，其实“非常”修饰“晴朗”恰当。
    - 把“他高兴地跳起来”判为修饰语不当，其实这是状语加中心语，搭配正确。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:倒金字塔结构
  type: Concept
  subject: 语文
  title: 倒金字塔结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写消息时把最新最重要的事实放结尾，却把背景和过程写在开头。
    - 能指出并纠正这一错误：倒金字塔结构要求每段独立，但学写成环环相扣，删掉前文就看不懂后文。
  aliases: []
  category: 消息结构
  explanation: 消息正文按照重要性递减的原则安排内容，关键信息集中在前，次要信息在后。
  misconceptions:
    - 写消息时把最新最重要的事实放结尾，却把背景和过程写在开头。
    - 倒金字塔结构要求每段独立，但学写成环环相扣，删掉前文就看不懂后文。
    - 认为倒金字塔结构只适合标题，正文按时间顺序写，关键信息后置。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:借代
  type: Concept
  subject: 语文
  title: 借代
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“借代”与“借喻”混为一谈，如“旌旗”借指军士看作比喻。
    - 能指出并纠正这一错误：误认为借代基于相似性，实际是相关性。
  aliases: []
  category: 修辞
  explanation: 不直接说出要说的人或事物，而借用与它密切相关的人或事物来代替。如“旌旗”借指军士。
  misconceptions:
    - 将“借代”与“借喻”混为一谈，如“旌旗”借指军士看作比喻。
    - 误认为借代基于相似性，实际是相关性。
    - 判断借代时只认本体喻体，忽视借体与本体的事物关联。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:借助图片实物讲述
  type: Concept
  subject: 语文
  title: 借助图片实物讲述
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 讲自己的经历时，出示相关的图片或实物，能让别人听得更明白、更感兴趣。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:借助插图阅读
  type: Concept
  subject: 语文
  title: 借助插图阅读
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 看图能帮我们记住故事内容，一幅图接着一幅图看，故事就不容易讲错。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C7/sections/S6.md
- id: concept:语文:借助注释理解诗意
  type: Concept
  subject: 语文
  title: 借助注释理解诗意
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读古诗时，可以借助注释弄懂难懂的字的意思和用法，再用自己的话说说诗句写了什么。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:借助注释读懂课文
  type: Concept
  subject: 语文
  title: 借助注释读懂课文
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读文言文时，对照课文下面的注释，弄懂难懂的字词意思，再注意停顿读通顺，就能明白课文讲什么。
  sourceRef: content/三年级/下册/语文/PEP-3-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:借助资料理解课文
  type: Concept
  subject: 语文
  title: 借助资料理解课文
  conceptType: 程序型
  aliases:
    - 查阅资料
  category: 方法
  explanation: 读课文时查找、阅读相关资料，比如历史背景知识，能帮助我们理解课文中不懂的地方和更深的含义。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C8/sections/S3.md
- id: concept:语文:借助韵文识字
  type: Concept
  subject: 语文
  title: 借助韵文识字
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把生字编进朗朗上口的韵文里，边拍手朗读边记字，读起来顺口，字也记得牢。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:借喻
  type: Concept
  subject: 语文
  title: 借喻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘红领巾’当借喻，实为借代，借喻能还原明喻，借代不能。
    - 能指出并纠正这一错误：认为借喻要出现本体和比喻词，实际只出现喻体，如‘乌云遮不住太阳’。
  aliases: []
  category: 修辞手法
  explanation: 借喻是比喻的一种，本体和比喻词都不出现，直接用喻体代替本体。
  misconceptions:
    - 把‘红领巾’当借喻，实为借代，借喻能还原明喻，借代不能。
    - 认为借喻要出现本体和比喻词，实际只出现喻体，如‘乌云遮不住太阳’。
    - 把拟人句当借喻，如‘花儿在风中笑’是拟人，不是借喻。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:借景抒情
  type: Concept
  subject: 语文
  title: 借景抒情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为所有景物描写都是借景抒情，如《答谢中书书》开篇写景就说是抒情。
    - 能指出并纠正这一错误：把借景抒情与托物言志混为一谈，认为《爱莲说》是借景抒情，实际是托物言志。
  aliases:
    - 寓情于景
  category: 写作手法
  explanation: 借景抒情是作者通过对景物的描写来抒发内心情感的手法，景物描写与情感表达紧密结合。
  misconceptions:
    - 误认为所有景物描写都是借景抒情，如《答谢中书书》开篇写景就说是抒情。
    - 把借景抒情与托物言志混为一谈，认为《爱莲说》是借景抒情，实际是托物言志。
    - 看到“感时花溅泪”就说是借景抒情，忽略这是移情，借景抒情重在先景后情。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:借物喻人
  type: Concept
  subject: 语文
  title: 借物喻人
  conceptType: 概念型
  aliases:
    - 借物写人
  category: 方法
  explanation: 先写事物的特点，再由事物想到具有这种品质的人，借事物来赞美做人的道理。比如借花生赞美默默奉献的人。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:借物抒情
  type: Concept
  subject: 语文
  title: 借物抒情
  conceptType: 概念型
  aliases:
    - 借物表达情感
  category: 方法
  explanation: 通过写和具体事物有关的事，把藏在事物里的感情表达出来。比如借桂花寄托对故乡和亲人的思念。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:倡议书
  type: Concept
  subject: 语文
  title: 倡议书
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写倡议书用命令语气，如“全体同学必须参加”，缺乏号召力和可行性。
    - 能指出并纠正这一错误：只罗列措施，不说明背景和目的，读者不知为何要响应倡议。
  aliases: []
  category: 应用文
  explanation: 面向公众提出建议或号召的书面文书，需说明背景、目的和具体安排，语言有说服力。
  misconceptions:
    - 写倡议书用命令语气，如“全体同学必须参加”，缺乏号召力和可行性。
    - 只罗列措施，不说明背景和目的，读者不知为何要响应倡议。
    - 语言过于指责，如“你们太不自觉”，使倡议变成批评。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:假设复句
  type: Concept
  subject: 语文
  title: 假设复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“只要……就”当作假设复句，实际它是条件复句
    - 能指出并纠正这一错误：认为假设复句表示的事情一定不会发生，其实只是假设，可能发生
  aliases: []
  category: 语法
  explanation: 假设复句是表示假设某种情况发生会出现怎样的结果的复句，常用关联词语有“倘若”“如果”“假如”等，后面常与“就”“便”“则”等搭配。
  misconceptions:
    - 把“只要……就”当作假设复句，实际它是条件复句
    - 认为假设复句表示的事情一定不会发生，其实只是假设，可能发生
    - 将“即使……也”归入假设复句，实际是让步复句
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:偏旁的笔画变化
  type: Concept
  subject: 语文
  title: 偏旁的笔画变化
  conceptType: 概念型
  aliases:
    - 偏旁变形
    - 笔顺变化
  category: 法则
  explanation: 有的字变成偏旁后要变形："劝"里的"又"捺变成了点，"转"里的"车"最后一笔横变成了提。写字时要注意这些变化。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C8/sections/S4.md
- id: concept:语文:偏旁表义
  type: Concept
  subject: 语文
  title: 偏旁表义
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 很多偏旁能告诉我们字的意思，比如木字旁的字和树木有关，草字头的字和花草有关。看偏旁就能猜出字和什么有关。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C7/sections/S5.md
- id: concept:语文:偏正短语
  type: Concept
  subject: 语文
  title: 偏正短语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“心情舒畅”当成偏正短语，实际是主谓短语。
    - 能指出并纠正这一错误：误认为“红花绿叶”是偏正短语，实际是并列短语。
  aliases: []
  category: 语法
  explanation: 偏正短语由修饰语和中心语组成，修饰语在前，中心语在后，分为定中关系和状中关系。
  misconceptions:
    - 把“心情舒畅”当成偏正短语，实际是主谓短语。
    - 误认为“红花绿叶”是偏正短语，实际是并列短语。
    - 认为偏正短语中心语必须在后，忽略了“慢慢地走”等状中关系。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:做笔记
  type: Concept
  subject: 语文
  title: 做笔记
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：以为做笔记就是抄写原文，从不记录自己的疑问或评价
    - 能指出并纠正这一错误：做笔记时只写提要不写心得，或只写心得忽略提要
  aliases:
    - 笔记
    - 读书笔记
  category: 阅读方法
  explanation: 读书时记录要点和心得的方法，包括写提要和写心得两大类，有助于重温内容、积累素材、提升鉴赏能力。
  misconceptions:
    - 以为做笔记就是抄写原文，从不记录自己的疑问或评价
    - 做笔记时只写提要不写心得，或只写心得忽略提要
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:停连
  type: Concept
  subject: 语文
  title: 停连
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：朗读时逢标点便停顿，无标点也停，忽略连接处的语意连贯。
    - 能指出并纠正这一错误：认为停连只指停顿，其实还包括连接，如‘亲爱的/爸爸妈妈’与连读不同。
  aliases: []
  category: 朗读技巧
  explanation: 停连指朗读中声音的中断和连接，包括停顿和连接，用于表达情感和结构。
  misconceptions:
    - 朗读时逢标点便停顿，无标点也停，忽略连接处的语意连贯。
    - 认为停连只指停顿，其实还包括连接，如‘亲爱的/爸爸妈妈’与连读不同。
    - 把停连固定为统一速度，读长句一味不停，导致急促且失情感层次。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:偷偷摸摸
  type: Concept
  subject: 语文
  title: 偷偷摸摸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写“偷偷默默”，把“摸”错写成“默”。
    - 能指出并纠正这一错误：把中性义的“偷偷地”也写成“偷偷摸摸”，如“他偷偷摸摸地练习书法”，贬义不当。
  aliases: []
  category: 词语
  explanation: 形容瞒着别人做事，不敢让人知道。
  misconceptions:
    - 误写“偷偷默默”，把“摸”错写成“默”。
    - 把中性义的“偷偷地”也写成“偷偷摸摸”，如“他偷偷摸摸地练习书法”，贬义不当。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:儒有不宝金玉，而忠信以为宝
  type: Concept
  subject: 语文
  title: 儒有不宝金玉，而忠信以为宝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：未识别“宝”的意动用法，误译为“不宝贵金玉”
    - 能指出并纠正这一错误：把“而”当成并列连词，实际应为转折“却”
  aliases: []
  category: 名言警句
  explanation: 出自《礼记·儒行》，意为儒者不以金玉为宝，而以忠信为宝，强调忠信的价值。
  misconceptions:
    - 未识别“宝”的意动用法，误译为“不宝贵金玉”
    - 把“而”当成并列连词，实际应为转折“却”
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:儒林
  type: Concept
  subject: 语文
  title: 儒林
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“儒林”理解为儒家学派或儒者集团，不清楚指读书人群体。
    - 能指出并纠正这一错误：认为“儒林传”记载的是孔子弟子，实际是历代读书人的传记。
  aliases: []
  category: 文化概念
  explanation: “儒林”指封建社会里“读书人”或“士人”这一群体，历代正史设有“儒林传”。
  misconceptions:
    - 将“儒林”理解为儒家学派或儒者集团，不清楚指读书人群体。
    - 认为“儒林传”记载的是孔子弟子，实际是历代读书人的传记。
    - 与“儒生”混淆，认为儒林仅指儒家学者，而实际包括更广的士人。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:儒林外史
  type: Concept
  subject: 语文
  title: 儒林外史
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把作者吴敬梓误写成吴承恩，名字相近易混淆
    - 能指出并纠正这一错误：误把《儒林外史》归入“四大谴责小说”，忽略其讽刺性
  aliases: []
  category: 文学常识
  explanation: 清代吴敬梓创作的长篇讽刺小说，以知识分子为主要描写对象，批判科举制度和封建礼教。
  misconceptions:
    - 把作者吴敬梓误写成吴承恩，名字相近易混淆
    - 误把《儒林外史》归入“四大谴责小说”，忽略其讽刺性
    - 将“外史”解释为“外国历史”，不懂是正史之外的记载
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:儿化
  type: Concept
  subject: 语文
  title: 儿化
  conceptType: 概念型
  aliases:
    - 儿化音
  category: 概念
  explanation: 读儿化词时，后面的儿不单独读出来，只在前面的音节后面加个 r，表示卷一下舌头，比如花儿读作 huār。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:儿童诗
  type: Concept
  subject: 语文
  title: 儿童诗
  conceptType: 概念型
  aliases:
    - 儿童诗歌
  category: 文化常识
  explanation: 儿童诗是专门写给孩子的诗，句子短短的，读起来有节奏、朗朗上口，比如《一株紫丁香》表达了对老师的感谢。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:元明白话
  type: Concept
  subject: 语文
  title: 元明白话
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“洒家”解释为“洒水的人”，不明是方言自称
    - 能指出并纠正这一错误：把“恁地”理解成“怎么”，实际是“那么、那样”
  aliases: []
  category: 语言知识
  explanation: 元明时期的口语，与现代汉语有差异，如“洒家”“恁地”等词语。
  misconceptions:
    - 把“洒家”解释为“洒水的人”，不明是方言自称
    - 把“恁地”理解成“怎么”，实际是“那么、那样”
    - 误认为元明白话就是文言文，把“洒家”当文言虚词背
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:元曲
  type: Concept
  subject: 语文
  title: 元曲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为元曲只指杂剧，忽略散曲，把《天净沙·秋思》当作杂剧。
    - 能指出并纠正这一错误：把“元曲”的“曲”当成歌曲，误认为散曲必须配乐演唱，忽视其文学性。
  aliases: []
  category: 文学常识
  explanation: 元曲是盛行于元代的一种文艺形式，包括杂剧和散曲。《天净沙·秋思》是散曲中的小令。
  misconceptions:
    - 误以为元曲只指杂剧，忽略散曲，把《天净沙·秋思》当作杂剧。
    - 把“元曲”的“曲”当成歌曲，误认为散曲必须配乐演唱，忽视其文学性。
    - 误将《天净沙·秋思》视为宋词，因其句式与词相近。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:先天下之忧而忧，后天下之乐而乐
  type: Concept
  subject: 语文
  title: 先天下之忧而忧，后天下之乐而乐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将这句话归于欧阳修，认为出自《醉翁亭记》
    - 能指出并纠正这一错误：背写时漏掉‘之’，写成‘先天下忧而忧，后天下乐而乐’
  aliases: []
  category: 名句
  explanation: 范仲淹在《岳阳楼记》中提出的政治抱负，体现忧国忧民的情怀。
  misconceptions:
    - 误将这句话归于欧阳修，认为出自《醉翁亭记》
    - 背写时漏掉‘之’，写成‘先天下忧而忧，后天下乐而乐’
    - 把‘先’‘后’理解为‘首先’‘然后’，忽视‘在天下人之前/之后’的对比关系
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:光未然
  type: Concept
  subject: 语文
  title: 光未然
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将光未然误写为‘光末然’，二字形近易错
    - 能指出并纠正这一错误：误认光未然是《黄河大合唱》的曲作者，与冼星海职务互换
  aliases:
    - 张光年
  category: 文学常识
  explanation: 现代诗人、文学评论家，原名张光年，代表作有《黄河大合唱》等。
  misconceptions:
    - 将光未然误写为‘光末然’，二字形近易错
    - 误认光未然是《黄河大合唱》的曲作者，与冼星海职务互换
    - 把光未然原名‘张光年’错记成‘张永年’或‘张广年’
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:全国生态日
  type: Concept
  subject: 语文
  title: 全国生态日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“生态”误写为“生太”，或把“日”写成“曰”。
    - 能指出并纠正这一错误：误认为全国生态日是每年世界环境日（6月5日），忽略8月15日。
  aliases: []
  category: 纪念日
  explanation: 2023年设立，定于每年8月15日，旨在提高全民生态文明意识。
  misconceptions:
    - 将“生态”误写为“生太”，或把“日”写成“曰”。
    - 误认为全国生态日是每年世界环境日（6月5日），忽略8月15日。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:全国道德模范
  type: Concept
  subject: 语文
  title: 全国道德模范
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全国道德模范每年评选一次，实际是两年评选一次
    - 能指出并纠正这一错误：误以为只有孝老爱亲才算道德模范，忽略助人为乐等其他类型
  aliases: []
  category: 社会荣誉
  explanation: 全国道德模范是两年评选一次的荣誉称号，其中包含孝老爱亲模范。
  misconceptions:
    - 认为全国道德模范每年评选一次，实际是两年评选一次
    - 误以为只有孝老爱亲才算道德模范，忽略助人为乐等其他类型
    - 把全国道德模范与感动中国年度人物混为一谈，以为都是官方评选
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:六尺巷典故
  type: Concept
  subject: 语文
  title: 六尺巷典故
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把张英误写为张廷玉或张居正，实际是清代张英。
    - 能指出并纠正这一错误：认为六尺巷在北京或南京，实际在安徽桐城。
  aliases:
    - 六尺巷故事
  category: 文化常识
  explanation: 清代张英家人与邻居争地，张英回信让家人退让三尺，邻居也退让三尺，形成六尺巷，体现谦让和睦的传统美德。
  misconceptions:
    - 把张英误写为张廷玉或张居正，实际是清代张英。
    - 认为六尺巷在北京或南京，实际在安徽桐城。
    - 把“六尺巷”写成“六尺像”或“六迟巷”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:共产主义精神
  type: Concept
  subject: 语文
  title: 共产主义精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为共产主义精神就是做好事、乐于助人，忽略其与无产阶级解放事业的根本联系
    - 能指出并纠正这一错误：把白求恩的共产主义精神仅看作个人品德，未意识到它代表一种国际无产阶级的共同理想
  aliases:
    - 共产主义者的精神
  category: 精神品质
  explanation: 指毫无利己的动机，把中国人民的解放事业当作自己的事业，毫不利己专门利人，对工作极端负责任，对同志对人民极端热忱，对技术精益求精。
  misconceptions:
    - 认为共产主义精神就是做好事、乐于助人，忽略其与无产阶级解放事业的根本联系
    - 把白求恩的共产主义精神仅看作个人品德，未意识到它代表一种国际无产阶级的共同理想
    - 误以为当代的奉献行为都属于共产主义精神，忽略其历史条件和阶级属性
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:共振现象
  type: Concept
  subject: 语文
  title: 共振现象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“共振”写成“共震”，振、震不分。
    - 能指出并纠正这一错误：误以为共振现象指返回时通信中断，实为火箭上升时人体不适。
  aliases:
    - 共振
  category: 科学知识
  explanation: 火箭上升时产生的低频振动与人体内脏共振，导致航天员极度不适。
  misconceptions:
    - 将“共振”写成“共震”，振、震不分。
    - 误以为共振现象指返回时通信中断，实为火箭上升时人体不适。
    - 把共振现象当作纯粹物理声学，忽略其在航天中的危害。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:关城
  type: Concept
  subject: 语文
  title: 关城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“关城”释为“城墙”，忽略关塞城堡的含义。
    - 能指出并纠正这一错误：在诗句中误当成“城关”或“关口”，如“关城树色”误解为城内树色。
  aliases: []
  category: 文言词语
  explanation: 关塞上的城堡。
  misconceptions:
    - 将“关城”释为“城墙”，忽略关塞城堡的含义。
    - 在诗句中误当成“城关”或“关口”，如“关城树色”误解为城内树色。
    - 认为“关城”是城市名称，如“玉门关”城市。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:关联词语
  type: Concept
  subject: 语文
  title: 关联词语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“即使”当“既然”用，写“即使你来了，我就放心了”误表因果。
    - 能指出并纠正这一错误：认为“不但…而且…”可表因果关系，如“他不但迟到，而且被批评”混淆递进与因果。
  aliases:
    - 关联词
  category: 语法
  explanation: 关联词语用于连接复句中的分句，表明分句之间的关系。恰当使用可使语义清晰，使用不当包括搭配不当、误用、缺少或滥用等。
  misconceptions:
    - 把“即使”当“既然”用，写“即使你来了，我就放心了”误表因果。
    - 认为“不但…而且…”可表因果关系，如“他不但迟到，而且被批评”混淆递进与因果。
    - 缺少必要关联词，写“他不仅学习好，成绩优秀”漏掉“而且”使递进关系不完整。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:关联词语的使用
  type: Concept
  subject: 语文
  title: 关联词语的使用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写“无论…但是…”搭配不当，混合条件关系与转折关系。
    - 能指出并纠正这一错误：同时使用“因为”和“因此”，如“因为下雨，因此取消活动”，重复赘余。
  aliases:
    - 关联词
  category: 语法知识
  explanation: 复句中常使用关联词语连接分句，表明分句间的关系。使用时要搭配得当，避免误用、缺少或滥用。
  misconceptions:
    - 写“无论…但是…”搭配不当，混合条件关系与转折关系。
    - 同时使用“因为”和“因此”，如“因为下雨，因此取消活动”，重复赘余。
    - 滥用“虽然…但是…”，如“他虽然成绩好，但是他也很努力”中第二个“但是”多余。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:关键语句
  type: Concept
  subject: 语文
  title: 关键语句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“关键语句”等同于“中心句”，认为找出来就能概括全文，不联系上下文挖掘深意。
    - 能指出并纠正这一错误：认为“好好儿活”只是母亲对儿子的嘱咐，没有看到它反复出现并贯穿文章主旨，寄托着母子的共同愿望。
  aliases: []
  category: 阅读方法
  explanation: 文中反复出现的语句，如“好好儿活”，往往蕴含深意，需联系全文理解。
  misconceptions:
    - 把“关键语句”等同于“中心句”，认为找出来就能概括全文，不联系上下文挖掘深意。
    - 认为“好好儿活”只是母亲对儿子的嘱咐，没有看到它反复出现并贯穿文章主旨，寄托着母子的共同愿望。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:典型细节
  type: Concept
  subject: 语文
  title: 典型细节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写人物时罗列所有特点，如从发型到鞋码全写一遍，导致没有重点，不能突出人物性格。
    - 能指出并纠正这一错误：选取的细节与人物特征不符，如写一个粗心的人，却选他每天整理书桌的细节。
  aliases: []
  category: 写作手法
  explanation: 指最能反映人物性格特点或事件本质的细节，贵在精而不在多。
  misconceptions:
    - 写人物时罗列所有特点，如从发型到鞋码全写一遍，导致没有重点，不能突出人物性格。
    - 选取的细节与人物特征不符，如写一个粗心的人，却选他每天整理书桌的细节。
    - 认为典型细节必须是稀奇古怪的动作，如写热心肠的人非要写他给流浪猫买猫粮，而忽略平时的小帮助。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:兼工带写
  type: Concept
  subject: 语文
  title: 兼工带写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为‘写’就是书法，把兼工带写说成‘既会工笔又会书法’。
    - 能指出并纠正这一错误：将兼工带写等同于工笔或写意单一种手法，忽略两者的结合。
  aliases: []
  category: 绘画技法
  explanation: 工笔与写意相结合的绘画手法，工笔用笔工整，写意注重神态和情趣。
  misconceptions:
    - 误认为‘写’就是书法，把兼工带写说成‘既会工笔又会书法’。
    - 将兼工带写等同于工笔或写意单一种手法，忽略两者的结合。
    - 看到画中既有精细线条又有潦草笔触就说是兼工带写，未理解工整与神韵的融合。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:再塑生命的人
  type: Concept
  subject: 语文
  title: 再塑生命的人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“再塑生命”是指眼睛复明，而实际上指精神启蒙和生命改变
    - 能指出并纠正这一错误：将“再塑”误写为“在塑”，误以为与“存在”有关
  aliases: []
  category: 文学常识
  explanation: 本文选自《假如给我三天光明》，作者海伦·凯勒，记叙了莎莉文老师教育她认识事物、理解语言，从而改变她生命的故事。
  misconceptions:
    - 误以为“再塑生命”是指眼睛复明，而实际上指精神启蒙和生命改变
    - 将“再塑”误写为“在塑”，误以为与“存在”有关
    - 认为“再塑生命的人”是海伦自己，忽视了莎莉文老师的角色
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:再生式生命保障系统
  type: Concept
  subject: 语文
  title: 再生式生命保障系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘再生式’误写成‘再升式’，‘保障’误写成‘保章’。
    - 能指出并纠正这一错误：认为‘循环利用’等于简单回收，忽略系统需净化、消毒等环节。
  aliases:
    - 再生生保
  category: 航天科技
  explanation: 再生生保系统是载人航天中维持生存环境的关键技术，能循环利用资源。
  misconceptions:
    - 把‘再生式’误写成‘再升式’，‘保障’误写成‘保章’。
    - 认为‘循环利用’等于简单回收，忽略系统需净化、消毒等环节。
    - 误以为生命保障系统只提供氧气，忘记水、食物和废物处理。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:冒号的用法
  type: Concept
  subject: 语文
  title: 冒号的用法
  conceptType: 概念型
  aliases:
    - 冒号的作用
  category: 语法
  explanation: 冒号可以用在总起的话后面，引出具体的解释或例子，如“它要是高兴，能比谁都温柔可亲：用身子蹭你的腿……”。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:写作习惯
  type: Concept
  subject: 语文
  title: 写作习惯
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：写作文时从不列提纲，想到哪写到哪，结果写到一半偏题，前后不连贯。
    - 能指出并纠正这一错误：写完作文从不回头读改，错别字和病句直接拖累语言连贯性。
  aliases: []
  category: 写作知识
  explanation: 良好的写作习惯包括下笔前列提纲或打腹稿，写作时一气呵成，写完后多读多改，以保证文章连贯。
  misconceptions:
    - 写作文时从不列提纲，想到哪写到哪，结果写到一半偏题，前后不连贯。
    - 写完作文从不回头读改，错别字和病句直接拖累语言连贯性。
    - 写作中一遇到不会写的字就停下查字典，中断思路，导致句子间断裂。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:写作品梗概
  type: Concept
  subject: 语文
  title: 写作品梗概
  conceptType: 程序型
  aliases:
    - 梗概
  category: 方法
  explanation: 用简练的语言概括一本书的主要内容。写梗概要先读懂内容、把握脉络，保留主干、去除枝叶，再把概括的内容合并成段，做到语意清楚连贯。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:写作思路清晰
  type: Concept
  subject: 语文
  title: 写作思路清晰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写作文不列提纲，想到哪写到哪，结果结构混乱，如写游记中途突然写别的事。
    - 能指出并纠正这一错误：认为多用小标题或分段就是思路清晰，实际内容东拉西扯，如分段但每段各说各话。
  aliases: []
  category: 写作
  explanation: 写作思路清晰要求条理清楚、层次分明，可通过整体构思、确定顺序、列提纲等方法实现。
  misconceptions:
    - 写作文不列提纲，想到哪写到哪，结果结构混乱，如写游记中途突然写别的事。
    - 认为多用小标题或分段就是思路清晰，实际内容东拉西扯，如分段但每段各说各话。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:写作提纲
  type: Concept
  subject: 语文
  title: 写作提纲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把提纲等同于草稿，写出每段完整内容。
    - 能指出并纠正这一错误：只列标题不列要点和顺序，提纲起不到作用。
  aliases:
    - 提纲
  category: 写作方法
  explanation: 写作提纲是写作前对文章结构和内容的规划，有助于组织材料、理清思路。
  misconceptions:
    - 把提纲等同于草稿，写出每段完整内容。
    - 只列标题不列要点和顺序，提纲起不到作用。
    - 把提纲当作固定框架，写作时不敢改动。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:写作目的
  type: Concept
  subject: 语文
  title: 写作目的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写感谢信却大篇幅提要求，如“既然帮我了，再帮我写作业”，目的混杂。
    - 能指出并纠正这一错误：写请假条不讲正事，却描述笑话细节，偏离请假核心目的。
  aliases:
    - 目的
  category: 写作要素
  explanation: 写作时首先要明确目的，如感谢、道歉、反映问题等，不同目的决定表达方式和态度。
  misconceptions:
    - 写感谢信却大篇幅提要求，如“既然帮我了，再帮我写作业”，目的混杂。
    - 写请假条不讲正事，却描述笑话细节，偏离请假核心目的。
    - 认为写作目的就是完成作业，忽略实际交流功能。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:写作目的、对象、场合
  type: Concept
  subject: 语文
  title: 写作目的、对象、场合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：正式场合使用口语化表达，如“大家好啊”。
    - 能指出并纠正这一错误：给儿童讲解时使用专业术语，不考虑对象。
  aliases:
    - 写作三要素
  category: 写作策略
  explanation: 写作前需明确向谁介绍、为何介绍、在什么场合介绍，这决定了讲解词的内容选择和语言风格。
  misconceptions:
    - 正式场合使用口语化表达，如“大家好啊”。
    - 给儿童讲解时使用专业术语，不考虑对象。
    - 只关注内容，忽略写作目的，导致文体选择错误。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:写作目的与读者对象
  type: Concept
  subject: 语文
  title: 写作目的与读者对象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写说明文时从不考虑读者是谁，导致给小朋友的科普和给专家的论文内容完全相同。
    - 能指出并纠正这一错误：以为写作目的只有‘介绍事物’一种，忽略还有‘教人操作’‘劝人保护环境’等目的。
  aliases: []
  category: 写作知识
  explanation: 写作目的和读者对象影响说明文的内容选取和写法，是分析说明文差异的重要角度。
  misconceptions:
    - 写说明文时从不考虑读者是谁，导致给小朋友的科普和给专家的论文内容完全相同。
    - 以为写作目的只有‘介绍事物’一种，忽略还有‘教人操作’‘劝人保护环境’等目的。
    - 分析课文时只看内容，不联系读者对象，认为《中国石拱桥》和《核舟记》写法一样。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:写作目的和对象
  type: Concept
  subject: 语文
  title: 写作目的和对象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“为了谁写”当作“为什么写”，混淆对象与目的。
    - 能指出并纠正这一错误：写信时不根据收信人调整语气，长辈与朋友用词相同。
  aliases: []
  category: 写作
  explanation: 写作要考虑为什么写和写给谁看，据此选择内容、文体、表达方式和语言风格，以达到预期效果。
  misconceptions:
    - 把“为了谁写”当作“为什么写”，混淆对象与目的。
    - 写信时不根据收信人调整语气，长辈与朋友用词相同。
    - 不考虑读者知识水平，文章晦涩难懂。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:写出对事物的喜爱
  type: Concept
  subject: 语文
  title: 写出对事物的喜爱
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 写自己心爱的东西时，写出它是什么样子、怎么得到的、为什么喜爱，把喜爱之情融在具体描写里。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:写包票
  type: Concept
  subject: 语文
  title: 写包票
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写“打包票”为“打保票”。
    - 能指出并纠正这一错误：认为“包票”是一种票据或凭证。
  aliases:
    - 打包票
  category: 词语
  explanation: 也称“打包票”，表示对某件事情有绝对把握。
  misconceptions:
    - 误写“打包票”为“打保票”。
    - 认为“包票”是一种票据或凭证。
    - 把“写包票”理解为写保证书，而非口头担保。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:写字姿势
  type: Concept
  subject: 语文
  title: 写字姿势
  conceptType: 程序型
  aliases:
    - 坐姿与握笔
  category: 方法
  explanation: 写字时要坐端正，本子放平，握好笔。姿势对了，字才写得好看，眼睛也不容易累。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:写心得
  type: Concept
  subject: 语文
  title: 写心得
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：写心得时复述半天故事情节，自己的感悟只有一句“感动”
    - 能指出并纠正这一错误：误认为心得必须全面评价，不敢写对一个细节的独特感受
  aliases:
    - 心得
  category: 阅读方法
  explanation: 记录阅读时的体验、感想，包括对内容和形式的看法、评价及新认识。
  misconceptions:
    - 写心得时复述半天故事情节，自己的感悟只有一句“感动”
    - 误认为心得必须全面评价，不敢写对一个细节的独特感受
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:写提要
  type: Concept
  subject: 语文
  title: 写提要
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：写提要时把三起三落每件事都详写，变成原文缩写
    - 能指出并纠正这一错误：以为提要只能是一段话，忽略提纲和图表形式
  aliases:
    - 提要
  category: 阅读方法
  explanation: 用精练的语言概括作品要点，可以是成段文字、提纲或图表。
  misconceptions:
    - 写提要时把三起三落每件事都详写，变成原文缩写
    - 以为提要只能是一段话，忽略提纲和图表形式
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:写景作文修改
  type: Concept
  subject: 语文
  title: 写景作文修改
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：写雪景时直接照搬“忽如一夜春风来”，与上下文风格不协调
    - 能指出并纠正这一错误：为求文言美感，四处加“之乎者也”，导致语句不通顺
  aliases: []
  category: 写作方法
  explanation: 在修改写景作文时，灵活运用课文中的词句、句式，使文章带有文言美感。
  misconceptions:
    - 写雪景时直接照搬“忽如一夜春风来”，与上下文风格不协调
    - 为求文言美感，四处加“之乎者也”，导致语句不通顺
    - 认为修改作文就是多用四字词语，堆砌辞藻而忽视整体意境
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:写景散文
  type: Concept
  subject: 语文
  title: 写景散文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为写景散文只能客观写景，不能融入抒情议论，如把《雨的四季》当说明文看。
    - 能指出并纠正这一错误：分析写景散文时只罗列景物特征，忽略作者情感，导致主旨概括偏题。
  aliases: []
  category: 文学体裁
  explanation: 以描写景物为主，通过细腻生动的笔触和饱含感情的语言，展现景物的美丽与灵动，表达作者的情感。
  misconceptions:
    - 认为写景散文只能客观写景，不能融入抒情议论，如把《雨的四季》当说明文看。
    - 分析写景散文时只罗列景物特征，忽略作者情感，导致主旨概括偏题。
    - 误以为文中所有景物都须实写，见'希望的雨'便质疑散文真实性。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:写景顺序
  type: Concept
  subject: 语文
  title: 写景顺序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为文章按春夏秋冬四季顺序写，把春冬分列为两季。
    - 能指出并纠正这一错误：以为先写秋季，再倒叙夏季，与原文先夏后春冬再秋不符。
  aliases: []
  category: 写作手法
  explanation: 本文按季节顺序描写三峡景物，先写夏季水势，再写春冬之景，最后写秋季萧瑟。
  misconceptions:
    - 误认为文章按春夏秋冬四季顺序写，把春冬分列为两季。
    - 以为先写秋季，再倒叙夏季，与原文先夏后春冬再秋不符。
    - 混淆'以季节为序'和'以水位涨落为序'，以为先写冬季水枯。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:写活动的场面
  type: Concept
  subject: 语文
  title: 写活动的场面
  conceptType: 程序型
  aliases:
    - 写活动
  category: 方法
  explanation: 写活动要按顺序写清楚活动过程，把印象深刻的部分作为重点。写场面时既关注整个场景，也注意人物的动作、语言、神态，并把活动中的体会写下来。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:写活动策划书
  type: Concept
  subject: 语文
  title: 写活动策划书
  conceptType: 应用型
  aliases:
    - 活动策划书
  category: 方法
  explanation: 举办活动前先写好策划书，写明活动名称、目的、时间、地点、分工和活动流程，分工职责要明确，流程要清楚。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:写清楚理由
  type: Concept
  subject: 语文
  title: 写清楚理由
  conceptType: 程序型
  aliases:
    - 写出理由
  category: 方法
  explanation: 写话时把自己的想法和理由写明白，比如想养小动物，就把为什么想养写成几条理由，一条一条说清楚。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C7/sections/S6.md
- id: concept:语文:写简单的研究报告
  type: Concept
  subject: 语文
  title: 写简单的研究报告
  conceptType: 应用型
  aliases:
    - 研究报告
  category: 方法
  explanation: 围绕感兴趣的问题开展简单研究，按问题的提出、研究方法、资料整理、研究结论几部分来写，标题要体现研究的主要内容。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:写自己当时的感受
  type: Concept
  subject: 语文
  title: 写自己当时的感受
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 写事时不仅要写清楚事情的经过，还要写出自己当时的心情和感受，可以用上描写心情的词语和句子。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C7/sections/S6.md
- id: concept:语文:写观察日记
  type: Concept
  subject: 语文
  title: 写观察日记
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 对观察对象进行连续观察，主要记录它的变化，还可以写下观察的过程和自己的想法、心情，也可以配上图画或照片。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:写话
  type: Concept
  subject: 语文
  title: 写话
  conceptType: 应用型
  aliases:
    - 写几句话
  category: 方法
  explanation: 把想说的话用几句话写下来。介绍好朋友时要写清楚他是谁、长什么样子、你们经常一起做什么。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:写话的格式
  type: Concept
  subject: 语文
  title: 写话的格式
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 写话时，一段话的开头要空两格，标点符号一般占一格。先把话和同学说清楚，再按格式写下来。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:冰塔林
  type: Concept
  subject: 语文
  title: 冰塔林
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为冰塔林是冰川直接形成，实为冰川消融后形成。
    - 能指出并纠正这一错误：将'冰塔林'写成'冰踏林'，字形混淆。
  aliases: []
  category: 自然景观
  explanation: 冰川消融后形成的冰塔、冰柱等景观，形态各异，晶莹洁白。
  misconceptions:
    - 误以为冰塔林是冰川直接形成，实为冰川消融后形成。
    - 将'冰塔林'写成'冰踏林'，字形混淆。
    - 误以为冰塔林分布在岩石山地，实际形成于冰川末端。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:冰心
  type: Concept
  subject: 语文
  title: 冰心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将冰心原名误写为‘谢婉滢’，正确为‘谢婉莹’。
    - 能指出并纠正这一错误：误以为《繁星》《春水》是散文集，实际是诗集。
  aliases:
    - 谢婉莹
  category: 作家作品
  explanation: 冰心（1900—1999），原名谢婉莹，福建长乐人，作家、诗人，著有诗集《繁星》《春水》，散文集《寄小读者》《樱花赞》等。
  misconceptions:
    - 将冰心原名误写为‘谢婉滢’，正确为‘谢婉莹’。
    - 误以为《繁星》《春水》是散文集，实际是诗集。
    - 误把冰心当当代作家，她是现代作家。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:冼星海
  type: Concept
  subject: 语文
  title: 冼星海
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘冼’字写成‘洗’或读成xǐ，正确读音为xiǎn
    - 能指出并纠正这一错误：误说《黄河大合唱》作词者为冼星海，作文者为光未然
  aliases: []
  category: 文学常识
  explanation: 中国近代著名作曲家，代表作品有《黄河大合唱》等。
  misconceptions:
    - 把‘冼’字写成‘洗’或读成xǐ，正确读音为xiǎn
    - 误说《黄河大合唱》作词者为冼星海，作文者为光未然
    - 认为冼星海是诗人，与光未然身份混淆
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:凋谢与不朽的辩证统一
  type: Concept
  subject: 语文
  title: 凋谢与不朽的辩证统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为个体凋谢后生命整体随之消亡，没看到繁衍带来的延续。
    - 能指出并纠正这一错误：将凋谢与不朽视为完全对立，认为二者不可共存，实际是统一关系。
  aliases: []
  category: 哲理
  explanation: 生命在个体凋谢中延续，凋谢与不朽看似矛盾，实则统一，体现了生命的奇迹。
  misconceptions:
    - 认为个体凋谢后生命整体随之消亡，没看到繁衍带来的延续。
    - 将凋谢与不朽视为完全对立，认为二者不可共存，实际是统一关系。
    - 误把'不朽'理解为个体肉身永远不死，而非生命整体的延续。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:凋零
  type: Concept
  subject: 语文
  title: 凋零
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“凋零”写成“雕零”或“凋凌”，受同音字干扰。
    - 能指出并纠正这一错误：把“凋零”误用为“掉落”，如“衣服上的扣子凋零了”，应改为“掉了”。
  aliases: []
  category: 词语
  explanation: 草木凋谢零落。
  misconceptions:
    - 把“凋零”写成“雕零”或“凋凌”，受同音字干扰。
    - 把“凋零”误用为“掉落”，如“衣服上的扣子凋零了”，应改为“掉了”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:凡职业都是有趣味的
  type: Concept
  subject: 语文
  title: 凡职业都是有趣味的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为这句话是说所有职业都轻松有趣，忽略了“肯继续做”的条件。
    - 能指出并纠正这一错误：将此观点说成是胡适写的，实际出自梁启超。
  aliases: []
  category: 论点
  explanation: 只要肯继续做下去，职业趣味自然会发生，从四个角度论证职业趣味性。
  misconceptions:
    - 认为这句话是说所有职业都轻松有趣，忽略了“肯继续做”的条件。
    - 将此观点说成是胡适写的，实际出自梁启超。
    - 把“职业趣味”理解为职业本身有趣，而不是从劳作中发现乐趣。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:凫水
  type: Concept
  subject: 语文
  title: 凫水
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误读“凫”为“fǔ”或“niǎo”。
    - 能指出并纠正这一错误：把“凫”写成“浮”，写作“浮水”。
  aliases: []
  category: 词语
  explanation: 游泳。
  misconceptions:
    - 误读“凫”为“fǔ”或“niǎo”。
    - 把“凫”写成“浮”，写作“浮水”。
    - 认为“凫水”专指“狗刨式”，实际泛指游泳。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:出淤泥而不染
  type: Concept
  subject: 语文
  title: 出淤泥而不染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“出淤泥而不染”中“染”误写成“杂”，或右上角多加一点
    - 能指出并纠正这一错误：把“出淤泥而不染”直译为“从泥里出来却不染色”，丢掉了比喻义
  aliases: []
  category: 名句
  explanation: 出自《爱莲说》，比喻从污俗的环境中出来却能保持纯洁的品德。
  misconceptions:
    - 将“出淤泥而不染”中“染”误写成“杂”，或右上角多加一点
    - 把“出淤泥而不染”直译为“从泥里出来却不染色”，丢掉了比喻义
    - 误将“淤泥”写成“污泥”，以为两者意思相同
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:分号的用法
  type: Concept
  subject: 语文
  title: 分号的用法
  conceptType: 概念型
  aliases: []
  category: 语法
  explanation: 分号用在并列的几个分句之间，表示比逗号更大的停顿。当分句里已经用了逗号，并列的部分之间就用分号隔开。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:分条陈述理由
  type: Concept
  subject: 语文
  title: 分条陈述理由
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 说明理由时用一、二、三等把几条理由分开来写或说，条理清楚，别人一听就明白。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:分裂说
  type: Concept
  subject: 语文
  title: 分裂说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“分裂”误写为“分列”，如“分列说”。
    - 能指出并纠正这一错误：误认为分裂说认为月球是被地球引力俘获，与俘获说内容混淆。
  aliases: []
  category: 天文学假说
  explanation: 认为月球是从早期地球赤道部分甩出的物质形成的，但存在轨道倾角等疑难。
  misconceptions:
    - 将“分裂”误写为“分列”，如“分列说”。
    - 误认为分裂说认为月球是被地球引力俘获，与俘获说内容混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:分角色朗读
  type: Concept
  subject: 语文
  title: 分角色朗读
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读对话多的课文时，不同的人读不同的话，就像演戏一样。比如大雨点儿和小雨点儿的对话，可以和同学分着读，读出各自的样子。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C9/sections/S3.md
- id: concept:语文:分角色表演故事
  type: Concept
  subject: 语文
  title: 分角色表演故事
  conceptType: 程序型
  aliases:
    - 分角色演一演
    - 演一演故事
  category: 方法
  explanation: 几个人分别扮演青蛙、老牛、野鸭等角色，加上动作把故事演出来，比只读课文更有趣。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C7/sections/S3.md
- id: concept:语文:列夫·托尔斯泰
  type: Concept
  subject: 语文
  title: 列夫·托尔斯泰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《战争与和平》误记为屠格涅夫或陀思妥耶夫斯基的作品。
    - 能指出并纠正这一错误：将“列夫·托尔斯泰”中的“列夫”读成lèi fū，误为多音字。
  aliases:
    - 托尔斯泰
  category: 文学常识
  explanation: 俄国作家，代表作有《战争与和平》《安娜·卡列尼娜》《复活》等，本文通过外貌描写展现其精神世界。
  misconceptions:
    - 把《战争与和平》误记为屠格涅夫或陀思妥耶夫斯基的作品。
    - 将“列夫·托尔斯泰”中的“列夫”读成lèi fū，误为多音字。
    - 误认为《安娜·卡列尼娜》是高尔基所写，因同为俄国作家而混淆。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:列小标题
  type: Concept
  subject: 语文
  title: 列小标题
  conceptType: 程序型
  aliases:
    - 写小标题
  category: 方法
  explanation: 把长课文按事情分成几个部分，给每件事用几个字概括出小标题。列小标题能帮我们理清文章脉络，把握主要内容。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C8/sections/S3.md
- id: concept:语文:刘备
  type: Concept
  subject: 语文
  title: 刘备
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将刘备与曹操、孙权并称时误写为“刘禅”，混淆父子关系。
    - 能指出并纠正这一错误：认为“三顾茅庐”请的是周瑜，或把诸葛亮当成刘备的兄长。
  aliases:
    - 刘玄德
    - 先主
  category: 人物
  explanation: 字玄德，三国时蜀汉政权的建立者，以仁德著称，三顾茅庐请诸葛亮出山。
  misconceptions:
    - 将刘备与曹操、孙权并称时误写为“刘禅”，混淆父子关系。
    - 认为“三顾茅庐”请的是周瑜，或把诸葛亮当成刘备的兄长。
    - 误以为刘备是《三国演义》中虚构人物，忽略其真实历史身份。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:刘姥姥
  type: Concept
  subject: 语文
  title: 刘姥姥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为刘姥姥是《西游记》中的角色，因“姥姥”联想到老妇而错归。
    - 能指出并纠正这一错误：把刘姥姥说成贾府的正式主子，实际她只是远房亲戚。
  aliases: []
  category: 人物
  explanation: 《红楼梦》中乡村老妇，朴实风趣，进贾府闹出许多笑话。
  misconceptions:
    - 认为刘姥姥是《西游记》中的角色，因“姥姥”联想到老妇而错归。
    - 把刘姥姥说成贾府的正式主子，实际她只是远房亲戚。
    - 误记刘姥姥为《水浒传》人物，因书中也有“刘”姓角色。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:刘姥姥进大观园
  type: Concept
  subject: 语文
  title: 刘姥姥进大观园
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把情节写成“刘姥姥进大花园”或“进御花园”，地点名称记错。
    - 能指出并纠正这一错误：认为该情节出自《水浒传》，将贾府误作梁山泊背景。
  aliases: []
  category: 文学常识
  explanation: 《红楼梦》中的经典情节，通过刘姥姥的视角展现贾府的奢华，并引发一系列笑料。
  misconceptions:
    - 把情节写成“刘姥姥进大花园”或“进御花园”，地点名称记错。
    - 认为该情节出自《水浒传》，将贾府误作梁山泊背景。
    - 误解情节为刘姥姥专程来炫耀，忽略其“打秋风”的实质。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:刘柳情谊
  type: Concept
  subject: 语文
  title: 刘柳情谊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为柳宗元主动请求去柳州，实则是为让刘禹锡去更近的播州，说成“刘禹锡被贬柳州”。
    - 能指出并纠正这一错误：将刘禹锡与柳宗元的友谊说成“刘白之情”，与白居易混淆。
  aliases:
    - 刘柳之交
  category: 历史典故
  explanation: 指刘禹锡和柳宗元之间的真挚友谊，柳宗元愿以柳州换播州，使刘禹锡能照顾老母，体现了朋友间的体谅与牺牲。
  misconceptions:
    - 误以为柳宗元主动请求去柳州，实则是为让刘禹锡去更近的播州，说成“刘禹锡被贬柳州”。
    - 将刘禹锡与柳宗元的友谊说成“刘白之情”，与白居易混淆。
    - 写“以柳州换播州”时把“播”写成“拨”或“潘”，字形错误。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:刘桢
  type: Concept
  subject: 语文
  title: 刘桢
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘刘桢’误写为‘刘真’或‘刘贞’，形近字混淆
    - 能指出并纠正这一错误：误将刘桢的《赠从弟》记为刘禹锡所作，因同姓刘而张冠李戴
  aliases: []
  category: 文学常识
  explanation: 东汉末年诗人，'建安七子'之一，以五言诗著称。
  misconceptions:
    - 把‘刘桢’误写为‘刘真’或‘刘贞’，形近字混淆
    - 误将刘桢的《赠从弟》记为刘禹锡所作，因同姓刘而张冠李戴
    - 误认为刘桢是‘三曹’之一，与曹操、曹植并称
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S8.md
- id: concept:语文:刘禹锡
  type: Concept
  subject: 语文
  title: 刘禹锡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《陋室铭》的作者误记为周敦颐，因同是“铭”文体
    - 能指出并纠正这一错误：将刘禹锡的字“梦得”写成“梦德”，音同形不同
  aliases: []
  category: 作者
  explanation: 唐代文学家，字梦得，有“诗豪”之称，代表作有《陋室铭》《乌衣巷》等。
  misconceptions:
    - 把《陋室铭》的作者误记为周敦颐，因同是“铭”文体
    - 将刘禹锡的字“梦得”写成“梦德”，音同形不同
    - 误认为刘禹锡是北宋人，与周敦颐时代混淆
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:刘绍棠
  type: Concept
  subject: 语文
  title: 刘绍棠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《蒲柳人家》记作孙犁或老舍的作品，张冠李戴。
    - 能指出并纠正这一错误：认为刘绍棠是“山药蛋派”作家，实际其作品具乡土气息。
  aliases: []
  category: 作家作品
  explanation: 当代作家，本文《蒲柳人家》是其代表作，具有浓郁的乡土气息。
  misconceptions:
    - 误把《蒲柳人家》记作孙犁或老舍的作品，张冠李戴。
    - 认为刘绍棠是“山药蛋派”作家，实际其作品具乡土气息。
    - 错写“刘绍棠”为“刘绍堂”，字形混淆。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:创作科幻故事
  type: Concept
  subject: 语文
  title: 创作科幻故事
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：脱离科学基础胡编乱造，把科幻写成魔法世界，比如靠咒语穿越宇宙。
    - 能指出并纠正这一错误：用错科学概念，如描述“在木星表面行走”而不提气态巨行星的实际情况。
  aliases:
    - 科幻故事创作
  category: 写作任务
  explanation: 基于现实科技知识，结合合理预测与想象，创作科幻故事，表达对未来的憧憬和对科学的思考。
  misconceptions:
    - 脱离科学基础胡编乱造，把科幻写成魔法世界，比如靠咒语穿越宇宙。
    - 用错科学概念，如描述“在木星表面行走”而不提气态巨行星的实际情况。
    - 为了表达“未来憧憬”而通篇空喊口号，没有依托具体故事和人物情节。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:创造
  type: Concept
  subject: 语文
  title: 创造
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“创造”仅理解为发明新事物，忽略教育中创造真善美的人
    - 能指出并纠正这一错误：误认为创造只属于天才，普通人无法创造
  aliases: []
  category: 核心概念
  explanation: 本文中创造指教育者创造真善美的活人，以及一切在平凡中创造不平凡的行为。
  misconceptions:
    - 把“创造”仅理解为发明新事物，忽略教育中创造真善美的人
    - 误认为创造只属于天才，普通人无法创造
    - 将“创造”等同于“制造”，忽略其中的精神意义
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:创造宣言
  type: Concept
  subject: 语文
  title: 创造宣言
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“创造宣言”当作演讲稿，未注意它与议论文论点的区别
    - 能指出并纠正这一错误：误以为“处处创造”就是任何地方都要动手做，忽略心境与态度
  aliases: []
  category: 课文主旨
  explanation: 陶行知号召人们培养创造性思维，处处、天天、人人皆可创造。
  misconceptions:
    - 把“创造宣言”当作演讲稿，未注意它与议论文论点的区别
    - 误以为“处处创造”就是任何地方都要动手做，忽略心境与态度
    - 把陶行知的创造宣言与鲁迅的《中国人失掉自信力了吗》混为一谈
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:创造性思维
  type: Concept
  subject: 语文
  title: 创造性思维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把创造性思维等同于天马行空的想象，忽略知识基础
    - 能指出并纠正这一错误：误以为创造性思维就是标新立异，否定一切常规答案
  aliases:
    - 创造力
  category: 核心概念
  explanation: 创造性思维指不满足于一个答案，探求新思路、新方法，并运用知识进行创新的思维。
  misconceptions:
    - 把创造性思维等同于天马行空的想象，忽略知识基础
    - 误以为创造性思维就是标新立异，否定一切常规答案
    - 将“不满足于一个答案”理解为所有问题都无唯一答案
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:判断
  type: Concept
  subject: 语文
  title: 判断
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为凡是含有“是”字的句子就是判断，如“他是李华”是判断，“他走了”就不是。
    - 能指出并纠正这一错误：误认为判断没有真假，只是个人观点。
  aliases: []
  category: 逻辑
  explanation: 以肯定或否定的形式反映事物情况的思维形式，有真假之别，一般用陈述句表示。
  misconceptions:
    - 误认为凡是含有“是”字的句子就是判断，如“他是李华”是判断，“他走了”就不是。
    - 误认为判断没有真假，只是个人观点。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:判断句
  type: Concept
  subject: 语文
  title: 判断句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为句中只要有'是'就是判断句，如'是日更定'的'是'是'这'
    - 能指出并纠正这一错误：认为判断句必须用'者''也'，忽略'为''乃''即'也可表判断
  aliases: []
  category: 文言句式
  explanation: 用“者”“也”等表示判断的句子，如“南阳刘子骥，高尚士也”。
  misconceptions:
    - 误以为句中只要有'是'就是判断句，如'是日更定'的'是'是'这'
    - 认为判断句必须用'者''也'，忽略'为''乃''即'也可表判断
    - 把'南阳刘子骥，高尚士也'当成一般陈述句，未识别'也'字
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:别云间
  type: Concept
  subject: 语文
  title: 别云间
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将作者“夏完淳”写成“夏存淳”或“夏纯淳”。
    - 能指出并纠正这一错误：误以为“别云间”是告别云间的送别诗，实际是诀别故乡。
  aliases: []
  category: 诗歌
  explanation: 夏完淳被捕后所作，表达对故乡的依恋和抗清失败的悲愤。
  misconceptions:
    - 将作者“夏完淳”写成“夏存淳”或“夏纯淳”。
    - 误以为“别云间”是告别云间的送别诗，实际是诀别故乡。
    - 与《过零丁洋》混淆，认为夏完淳写过“人生自古谁无死”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:刮目相待
  type: Concept
  subject: 语文
  title: 刮目相待
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“刮”写成“乱”或“括”，如写“乱目相待”。
    - 能指出并纠正这一错误：误以为“刮目相待”是“小看人”的意思，把句子用反。
  aliases:
    - 刮目相看
  category: 成语
  explanation: 指用新的眼光来看待，出自本文。
  misconceptions:
    - 把“刮”写成“乱”或“括”，如写“乱目相待”。
    - 误以为“刮目相待”是“小看人”的意思，把句子用反。
    - 用“刮目相待”形容自己变化，如“我刮目相待自己”，对象应是他人。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:制作成长纪念册
  type: Concept
  subject: 语文
  title: 制作成长纪念册
  conceptType: 程序型
  aliases:
    - 成长纪念册
  category: 方法
  explanation: 借助时间轴回忆小学生活，收集筛选有纪念意义的照片、作品和寄语，把印象最深的人或事记录下来，珍藏成长的记忆。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:剧本阅读策略
  type: Concept
  subject: 语文
  title: 剧本阅读策略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：阅读剧本时忽略舞台说明，只看人物对话，导致错过关键信息。
    - 能指出并纠正这一错误：把剧本当小说阅读，过多关注叙述性语言，而剧本没有叙述者。
  aliases:
    - 阅读策略
  category: 学习方法
  explanation: 包括梳理情节、分析人物、品味台词、关注舞台说明、了解背景等，用于深入理解剧本。
  misconceptions:
    - 阅读剧本时忽略舞台说明，只看人物对话，导致错过关键信息。
    - 把剧本当小说阅读，过多关注叙述性语言，而剧本没有叙述者。
    - 分析人物时，只看台词内容，不结合动作、表情提示。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:副词
  type: Concept
  subject: 语文
  title: 副词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘忽然’当副词，把‘突然’当形容词，其实‘突然’也能作副词，如‘突然出现’
    - 能指出并纠正这一错误：误将‘很’直接修饰名词，写出‘很书’这类搭配，实际上副词不能修饰名词
  aliases: []
  category: 语法
  explanation: 副词一般用在动词或形容词前边，起修饰或限制作用，表示程度、范围、时间、频率或语气等。
  misconceptions:
    - 把‘忽然’当副词，把‘突然’当形容词，其实‘突然’也能作副词，如‘突然出现’
    - 误将‘很’直接修饰名词，写出‘很书’这类搭配，实际上副词不能修饰名词
    - 把‘不’和‘没’混用，如‘他从来不说谎’误写为‘他从来没说谎’，时态不同
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:加冠
  type: Concept
  subject: 语文
  title: 加冠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为加冠是女子十五岁或男子二十岁都可，实际仅指男子二十岁。
    - 能指出并纠正这一错误：与“及笄”混淆，将加冠说成女子成年礼。
  aliases:
    - 冠礼
  category: 古代礼仪
  explanation: 古代男子二十岁举行的束发戴帽仪式，表示成年。
  misconceptions:
    - 认为加冠是女子十五岁或男子二十岁都可，实际仅指男子二十岁。
    - 与“及笄”混淆，将加冠说成女子成年礼。
    - 误以为加冠就是随便戴帽子，忽视其成年仪式意义。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:加减偏旁识字
  type: Concept
  subject: 语文
  title: 加减偏旁识字
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 学过的字加上或减去偏旁就变成新字，比如口加少是吵，飘减去风是票。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C8/sections/S4.md
- id: concept:语文:动宾短语
  type: Concept
  subject: 语文
  title: 动宾短语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“心情舒畅”误判为动宾短语，实际是主谓短语。
    - 能指出并纠正这一错误：把“阳光灿烂”中的“阳光”当成宾语，误以为动宾。
  aliases: []
  category: 语法
  explanation: 由动词和宾语组成的短语，如“判断方位”“俯瞰北京”。
  misconceptions:
    - 将“心情舒畅”误判为动宾短语，实际是主谓短语。
    - 把“阳光灿烂”中的“阳光”当成宾语，误以为动宾。
    - 误认为“判断方位”中“判断”是宾语，动词应是“做”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:动态助词
  type: Concept
  subject: 语文
  title: 动态助词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘他走了’中的‘了’只当动态助词，忽略其兼表陈述语气。
    - 能指出并纠正这一错误：将‘我去过北京’写成‘我去北京了’，丢失‘曾经经历’的语法意义。
  aliases: []
  category: 语法
  explanation: 动态助词包括“着”“了”“过”，附着在动词后，表示动作行为的状态。
  misconceptions:
    - 误把‘他走了’中的‘了’只当动态助词，忽略其兼表陈述语气。
    - 将‘我去过北京’写成‘我去北京了’，丢失‘曾经经历’的语法意义。
    - 认为‘着’只表示动作进行，如把‘门开着’说成动作正在做，实为状态持续。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:动物尾巴的用处
  type: Concept
  subject: 语文
  title: 动物尾巴的用处
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 小鱼的尾巴能拨水，老牛的尾巴能赶蝇子，燕子的尾巴能掌握方向，小壁虎断了尾巴还能长出新的。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C8/sections/S3.md
- id: concept:语文:动词
  type: Concept
  subject: 语文
  title: 动词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘可爱’‘美丽’等形容词误认为动词，如说‘他很可爱’中‘可爱’是动词。
    - 能指出并纠正这一错误：误认为‘是’不是动词，实际它是判断动词。
  aliases: []
  category: 语法
  explanation: 动词是表示动作行为、心理活动、发展变化的词。包括一般动词（走、跑、爱、恨等）、判断动词“是”、存在动词“有”、趋向动词（如“过去”“上来”）和能愿动词（如“能”“会”“愿意”）。
  misconceptions:
    - 把‘可爱’‘美丽’等形容词误认为动词，如说‘他很可爱’中‘可爱’是动词。
    - 误认为‘是’不是动词，实际它是判断动词。
    - 把‘能’‘会’误认为副词，实际是能愿动词。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:动词和宾语搭配不当
  type: Concept
  subject: 语文
  title: 动词和宾语搭配不当
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“养成高尚的品质”搭配正确，实际上“养成”应搭配“习惯”。
    - 能指出并纠正这一错误：把“改进缺点”当作正确，应改为“改正缺点”。
  aliases:
    - 动宾搭配不当
  category: 语法
  explanation: 动词和宾语在语义上不能搭配，导致句子不通顺。
  misconceptions:
    - 认为“养成高尚的品质”搭配正确，实际上“养成”应搭配“习惯”。
    - 把“改进缺点”当作正确，应改为“改正缺点”。
    - 误判“克服困难”是动宾不当，实际正确。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:动词的准确使用
  type: Concept
  subject: 语文
  title: 动词的准确使用
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 不同的动作要用不同的词，比如掰玉米、扛玉米、扔桃子、摘桃子、捧西瓜、追兔子。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C7/sections/S4.md
- id: concept:语文:助词
  type: Concept
  subject: 语文
  title: 助词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘我在吃饭’中的‘在’当作助词，实际是副词，助词不能单独做成分
    - 能指出并纠正这一错误：写‘高兴地’时误写为‘高兴的’，‘地’后用动词，‘的’后用名词
  aliases: []
  category: 语法
  explanation: 助词是起辅助作用的词，不能单独使用，没有实在意义，分为结构助词、动态助词和语气助词。
  misconceptions:
    - 把‘我在吃饭’中的‘在’当作助词，实际是副词，助词不能单独做成分
    - 写‘高兴地’时误写为‘高兴的’，‘地’后用动词，‘的’后用名词
    - 认为‘了’只有语气词一种，忘了它也可表动作完成的动态助词
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:劳碌
  type: Concept
  subject: 语文
  title: 劳碌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“碌”误写成“录”或“绿”，如“劳绿”。
    - 能指出并纠正这一错误：误读“碌”为“lǜ”，受“绿”字影响。
  aliases: []
  category: 词语
  explanation: 辛苦忙碌。
  misconceptions:
    - 把“碌”误写成“录”或“绿”，如“劳绿”。
    - 误读“碌”为“lǜ”，受“绿”字影响。
    - 将“劳碌”等同于“忙碌”，缺少辛苦操劳之意。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:勃朗峰
  type: Concept
  subject: 语文
  title: 勃朗峰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为勃朗峰位于瑞士国内，实际在法国与意大利边境。
    - 能指出并纠正这一错误：将'勃朗峰'写成'博朗峰'。
  aliases:
    - 阿尔卑斯之王
  category: 地理常识
  explanation: 欧洲阿尔卑斯山脉的主峰，海拔4808.73米，山势陡峻，为欧洲名胜之一。
  misconceptions:
    - 误以为勃朗峰位于瑞士国内，实际在法国与意大利边境。
    - 将'勃朗峰'写成'博朗峰'。
    - 误以为勃朗峰是世界最高峰，实际是阿尔卑斯山最高峰。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:勤苦求学
  type: Concept
  subject: 语文
  title: 勤苦求学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《送东阳马生序》作者宋濂误记为宋祁或刘基。
    - 能指出并纠正这一错误：认为宋濂写此文是为了炫耀自己的苦难经历，而非勉励后辈。
  aliases: []
  category: 主题思想
  explanation: 宋濂通过自述早年求学的艰辛，勉励后辈珍惜优越条件，专心治学。
  misconceptions:
    - 将《送东阳马生序》作者宋濂误记为宋祁或刘基。
    - 认为宋濂写此文是为了炫耀自己的苦难经历，而非勉励后辈。
    - 把“勤苦求学”理解为主人公学习不刻苦，只看到表象。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:勿以善小而不为，勿以恶小而为之
  type: Concept
  subject: 语文
  title: 勿以善小而不为，勿以恶小而为之
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“勿”误写为“务”，如“务以善小而不为”。
    - 能指出并纠正这一错误：误将“为”读作wèi，理解为“为了”。
  aliases: []
  category: 引用论证
  explanation: 刘备遗诏中的名句，说明善恶有大小之别，小善应为之，小恶不应为之。
  misconceptions:
    - 把“勿”误写为“务”，如“务以善小而不为”。
    - 误将“为”读作wèi，理解为“为了”。
    - 认为小恶偶尔为之无所谓，如“偷拿小东西不算错”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:包围结构字的书写
  type: Concept
  subject: 语文
  title: 包围结构字的书写
  conceptType: 程序型
  aliases:
    - 书写提示
  category: 法则
  explanation: 写包围结构的字有窍门：左上包围的字，撇要写得舒展；左下包围的字，捺要写得舒展，这样字才好看。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:化未知为已知
  type: Concept
  subject: 语文
  title: 化未知为已知
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：遇到生僻词直接跳过，不联系上下文，导致曲解文意
    - 能指出并纠正这一错误：把'化未知为已知'当作望文生义，如将'但少闲人'的'但'猜成'但是'
  aliases: []
  category: 阅读方法
  explanation: 阅读知识性作品时，遇到陌生内容可通过上下文、工具书或相关资料来理解其含义。
  misconceptions:
    - 遇到生僻词直接跳过，不联系上下文，导致曲解文意
    - 把'化未知为已知'当作望文生义，如将'但少闲人'的'但'猜成'但是'
    - 认为只能查辞典，不能借助注释和上下文推断
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:化石
  type: Concept
  subject: 语文
  title: 化石
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为化石一定是生物遗体，不包括遗迹（如恐龙脚印）。
    - 能指出并纠正这一错误：误认为化石是岩石本身，不是古生物遗体或遗迹经石化形成。
  aliases: []
  category: 科学知识
  explanation: 古代生物的遗体或遗迹经矿物质填充和石化作用形成的，是研究地球历史的重要证据。
  misconceptions:
    - 误认为化石一定是生物遗体，不包括遗迹（如恐龙脚印）。
    - 误认为化石是岩石本身，不是古生物遗体或遗迹经石化形成。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:化静为动
  type: Concept
  subject: 语文
  title: 化静为动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把比喻句视为化静为动，如“瀑布像一条白练”只是静态比喻，未让景物动起来
    - 能指出并纠正这一错误：误将“以动衬静”当“化静为动”，如“蝉噪林逾静”以声音反衬寂静，并非让静物本身产生动态
  aliases: []
  category: 写作手法
  explanation: 将静态的事物用动态的词语或描写来表现，使其生动形象，如“花朵儿一串挨着一串，彼此推着挤着”。
  misconceptions:
    - 把比喻句视为化静为动，如“瀑布像一条白练”只是静态比喻，未让景物动起来
    - 误将“以动衬静”当“化静为动”，如“蝉噪林逾静”以声音反衬寂静，并非让静物本身产生动态
    - 认为只要用上动词就是化静为动，如“山峰屹立”中“屹立”虽含动作感，但仍是静态描写，没有化静为动
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:北朝民歌
  type: Concept
  subject: 语文
  title: 北朝民歌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认《木兰诗》为南朝民歌或汉乐府，将其与《孔雀东南飞》混淆
    - 能指出并纠正这一错误：把郭茂倩当成《木兰诗》的作者，实际上他是《乐府诗集》的编选者
  aliases: []
  category: 文学常识
  explanation: 北朝时期产生的民歌，风格质朴刚健，多反映战争和人民生活。
  misconceptions:
    - 误认《木兰诗》为南朝民歌或汉乐府，将其与《孔雀东南飞》混淆
    - 把郭茂倩当成《木兰诗》的作者，实际上他是《乐府诗集》的编选者
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:十二生肖
  type: Concept
  subject: 语文
  title: 十二生肖
  conceptType: 概念型
  aliases:
    - 属相
    - 生肖
  category: 文化常识
  explanation: 古人用十二种动物代表十二个年份，依次是鼠、牛、虎、兔、龙、蛇、马、羊、猴、鸡、狗、猪，每个人出生的那一年都有一种动物作属相。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:千里之堤，溃于蚁穴
  type: Concept
  subject: 语文
  title: 千里之堤，溃于蚁穴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“堤”误写为“提”，“溃”误写为“遗”。
    - 能指出并纠正这一错误：认为蚁穴只比喻小毛病，与善恶无关。
  aliases: []
  category: 引用论证
  explanation: 比喻小恶不除会发展成大恶，说明大小善恶之间常有联系。
  misconceptions:
    - 把“堤”误写为“提”，“溃”误写为“遗”。
    - 认为蚁穴只比喻小毛病，与善恶无关。
    - 认定大祸只由大错引起，小错不会酿成灾难。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:千里马
  type: Concept
  subject: 语文
  title: 千里马
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“千里马”只当跑得快的马，写“伯乐识千里马”时忘其喻指人才。
    - 能指出并纠正这一错误：写“千里马”误为“千里吗”，或认为“千里马”专指马而非有才能者。
  aliases: []
  category: 文学意象
  explanation: 日行千里的马，比喻有才能的人。
  misconceptions:
    - 把“千里马”只当跑得快的马，写“伯乐识千里马”时忘其喻指人才。
    - 写“千里马”误为“千里吗”，或认为“千里马”专指马而非有才能者。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:单义词
  type: Concept
  subject: 语文
  title: 单义词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“桑树”有“故乡”的象征义，忽略单义词只有一个确定意义。
    - 能指出并纠正这一错误：给“公里”强行加义项，说“这公里路走得很累”中的“公里”表示“路程遥远”。
  aliases: []
  category: 词汇知识
  explanation: 单义词是只有一个意义的词，如“桑树”“公里”等。
  misconceptions:
    - 误认为“桑树”有“故乡”的象征义，忽略单义词只有一个确定意义。
    - 给“公里”强行加义项，说“这公里路走得很累”中的“公里”表示“路程遥远”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:单句
  type: Concept
  subject: 语文
  title: 单句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“下雨了”不是单句，因缺少主语，其实它是无主句，能独立表达完整意思。
    - 能指出并纠正这一错误：把“因为下雨，所以地面湿了”拆成两个单句，忽略分句组合后是复句，不能独立成句。
  aliases: []
  category: 语法
  explanation: 由词或短语构成，有特定语调，能独立表达一个完整意思的句子。
  misconceptions:
    - 误认为“下雨了”不是单句，因缺少主语，其实它是无主句，能独立表达完整意思。
    - 把“因为下雨，所以地面湿了”拆成两个单句，忽略分句组合后是复句，不能独立成句。
    - 认为单句只能是主谓齐全，将“好美的花！”因成分不全而否定其单句身份。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:卖炭翁
  type: Concept
  subject: 语文
  title: 卖炭翁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《卖炭翁》作者说成杜甫，与《石壕吏》混淆。
    - 能指出并纠正这一错误：认为卖炭翁只是写老人辛苦，忽略揭露宫市掠夺的罪恶。
  aliases: []
  category: 诗歌
  explanation: 白居易《新乐府》组诗第三十二首，通过卖炭翁的遭遇揭露宫市掠夺的罪恶。
  misconceptions:
    - 把《卖炭翁》作者说成杜甫，与《石壕吏》混淆。
    - 认为卖炭翁只是写老人辛苦，忽略揭露宫市掠夺的罪恶。
    - 把“宫市”误解为皇宫中的集市，实际是宦官强买强卖。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:南京大屠杀
  type: Concept
  subject: 语文
  title: 南京大屠杀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘惨绝人寰’写成‘惨绝人环’，‘寰’字漏写‘宀’或误为‘环’
    - 能指出并纠正这一错误：将南京大屠杀时间误记为1937年7月7日，与卢沟桥事变混淆
  aliases:
    - 南京大屠杀惨案
  category: 历史事件
  explanation: 1937年12月13日侵华日军在南京制造的惨绝人寰的大屠杀，30多万中国同胞惨遭杀戮。
  misconceptions:
    - 把‘惨绝人寰’写成‘惨绝人环’，‘寰’字漏写‘宀’或误为‘环’
    - 将南京大屠杀时间误记为1937年7月7日，与卢沟桥事变混淆
    - 认为遇难人数是3万或300万，未记住‘30多万’这个关键数字
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:南仁东
  type: Concept
  subject: 语文
  title: 南仁东
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘南仁东’写成‘南人东’或‘南仁冬’
    - 能指出并纠正这一错误：将南仁东与黄大年、袁隆平等科学家事迹混为一谈
  aliases:
    - 南仁东星
  category: 人物
  explanation: 本文传主，中国天文学家，“中国天眼”首席科学家兼总工程师，被授予“人民科学家”国家荣誉称号。
  misconceptions:
    - 把‘南仁东’写成‘南人东’或‘南仁冬’
    - 将南仁东与黄大年、袁隆平等科学家事迹混为一谈
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:南冠
  type: Concept
  subject: 语文
  title: 南冠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“南冠”误写为“南官”或“南寇”。
    - 能指出并纠正这一错误：误认为“南冠”指南方人戴的帽子，实际特指俘虏。
  aliases: []
  category: 典故
  explanation: 原指楚国的冠，后成为俘虏的代称。
  misconceptions:
    - 将“南冠”误写为“南官”或“南寇”。
    - 误认为“南冠”指南方人戴的帽子，实际特指俘虏。
    - 不明“南冠”代指俘虏的典故，以为与楚国无关。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:南安军
  type: Concept
  subject: 语文
  title: 南安军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为作者文天祥是抗金名将，实际是抗元英雄。
    - 能指出并纠正这一错误：误将“南安军”的“军”理解为军队，实际是地名。
  aliases: []
  category: 诗歌
  explanation: 文天祥被元军押解北行途经南安时所作，表达国破家亡的悲痛和绝食殉国的决心。
  misconceptions:
    - 认为作者文天祥是抗金名将，实际是抗元英雄。
    - 误将“南安军”的“军”理解为军队，实际是地名。
    - 把“文天祥”写成“文天详”或“文天翔”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:卜算子·咏梅
  type: Concept
  subject: 语文
  title: 卜算子·咏梅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将陆游《卜算子·咏梅》与毛泽东同名词作混为同一首。
    - 能指出并纠正这一错误：只赏梅花高洁，忽视托物言志，误以为是单纯咏物。
  aliases: []
  category: 宋词
  explanation: 陆游借咏梅表现孤高傲世、坚持正道的情怀。
  misconceptions:
    - 将陆游《卜算子·咏梅》与毛泽东同名词作混为同一首。
    - 只赏梅花高洁，忽视托物言志，误以为是单纯咏物。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:卜算子·黄州定慧院寓居作
  type: Concept
  subject: 语文
  title: 卜算子·黄州定慧院寓居作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把苏轼这首词与陆游《咏梅》作者张冠李戴。
    - 能指出并纠正这一错误：将“孤鸿”理解为实写大雁，不知是苏轼自喻孤独心境。
  aliases:
    - 卜算子·黄州定慧院寓居作
  category: 宋词
  explanation: 苏轼被贬黄州时所作，借孤鸿形象表现孤独心境和高洁品性。
  misconceptions:
    - 把苏轼这首词与陆游《咏梅》作者张冠李戴。
    - 将“孤鸿”理解为实写大雁，不知是苏轼自喻孤独心境。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:卢沟桥
  type: Concept
  subject: 语文
  title: 卢沟桥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把卢沟桥说成独拱石桥，与赵州桥混淆，其实它是联拱石桥。
    - 能指出并纠正这一错误：将'卢沟桥'写成'芦沟桥'，'卢'和'芦'字形混淆。
  aliases: []
  category: 说明对象
  explanation: 卢沟桥位于北京丰台区，建于1189-1192年，是联拱石桥，以石刻狮子闻名，也是抗日战争纪念地。
  misconceptions:
    - 把卢沟桥说成独拱石桥，与赵州桥混淆，其实它是联拱石桥。
    - 将'卢沟桥'写成'芦沟桥'，'卢'和'芦'字形混淆。
    - 误以为卢沟桥事变发生在南京，实际地点是北京丰台区的卢沟桥。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:即席讲话
  type: Concept
  subject: 语文
  title: 即席讲话
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把“即席”误写成“既席”，不理解即席是当场之意。
    - 能指出并纠正这一错误：认为即席讲话可以事先写稿并背诵，实际是临时发言。
  aliases:
    - 即兴演讲
  category: 口语交际
  explanation: 在无充分准备的情况下临时发表讲话，要就地取材，言简意赅，观点明确。
  misconceptions:
    - 把“即席”误写成“既席”，不理解即席是当场之意。
    - 认为即席讲话可以事先写稿并背诵，实际是临时发言。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:历史不容否认
  type: Concept
  subject: 语文
  title: 历史不容否认
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘否认’误写作‘否定’，混淆了‘不承认事实’与‘不同意观点’的差别
    - 能指出并纠正这一错误：认为‘历史不容否认’的意思是历史会随时代变化而改变，事实可因抵赖而消失
  aliases: []
  category: 观点
  explanation: 历史不会因时代变迁而改变，事实不会因抵赖而消失，日本右翼否认历史的行为遭到国际社会谴责。
  misconceptions:
    - 把‘否认’误写作‘否定’，混淆了‘不承认事实’与‘不同意观点’的差别
    - 认为‘历史不容否认’的意思是历史会随时代变化而改变，事实可因抵赖而消失
    - 误以为日本右翼否认历史只是个人言论，不会遭国际社会谴责
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:历史剧
  type: Concept
  subject: 语文
  title: 历史剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为历史剧必须完全符合史实，不能有任何虚构。
    - 能指出并纠正这一错误：把历史剧当历史教材，要求每个细节都有出处。
  aliases:
    - 历史戏剧
  category: 文学体裁
  explanation: 以历史事件和人物为题材的戏剧，允许艺术虚构，但需基于历史背景。
  misconceptions:
    - 认为历史剧必须完全符合史实，不能有任何虚构。
    - 把历史剧当历史教材，要求每个细节都有出处。
    - 误以为历史剧可以完全脱离历史，随意编造人物和事件。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:历史演义小说
  type: Concept
  subject: 语文
  title: 历史演义小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《水浒传》归类为历史演义小说，混淆英雄传奇与历史演义的题材界限。
    - 能指出并纠正这一错误：认为历史演义小说所有人物和事件都完全符合史实，忽略艺术加工。
  aliases: []
  category: 文学体裁
  explanation: 以历史事件为题材，加以艺术加工的小说类型，《三国演义》是其代表作。
  misconceptions:
    - 将《水浒传》归类为历史演义小说，混淆英雄传奇与历史演义的题材界限。
    - 认为历史演义小说所有人物和事件都完全符合史实，忽略艺术加工。
    - 误以为《三国演义》是古代白话小说，因其语言并非纯白话。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:叉港
  type: Concept
  subject: 语文
  title: 叉港
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写“叉港”为“汊港”，混用“汊”字。
    - 能指出并纠正这一错误：把“叉港”的“叉”读成“岔”音，写作“岔港”。
  aliases: []
  category: 词语
  explanation: 和大河相通的小河道。
  misconceptions:
    - 误写“叉港”为“汊港”，混用“汊”字。
    - 把“叉港”的“叉”读成“岔”音，写作“岔港”。
    - 把“叉港”理解为主航道交叉处，而不是小河道。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:双关
  type: Concept
  subject: 语文
  title: 双关
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“柳”谐音“留”误判为象征手法，而非谐音双关。
    - 能指出并纠正这一错误：认为双关只存在于诗词中，否定它在小说和日常口语中的使用。
  aliases: []
  category: 修辞手法
  explanation: 利用词语的多义或谐音使语句具有双重意义，如《无题》中“丝”谐音“思”。
  misconceptions:
    - 把“柳”谐音“留”误判为象征手法，而非谐音双关。
    - 认为双关只存在于诗词中，否定它在小说和日常口语中的使用。
    - 将双关与比喻混同，分析“东边日出西边雨”时错说成比喻。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:双线结构
  type: Concept
  subject: 语文
  title: 双线结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把明线说成吴用等人智取生辰纲，暗线说成杨志押送，明暗颠倒。
    - 能指出并纠正这一错误：只关注杨志的押送过程，完全忽略吴用等人策划的暗线。
  aliases:
    - 明暗结合
  category: 写作手法
  explanation: 小说采用明暗两条线索交织展开情节，明线是杨志押送生辰纲，暗线是吴用等人智取生辰纲。
  misconceptions:
    - 把明线说成吴用等人智取生辰纲，暗线说成杨志押送，明暗颠倒。
    - 只关注杨志的押送过程，完全忽略吴用等人策划的暗线。
    - 认为两条线索都是明线，混淆“明暗”与“主次”的概念。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:反义词
  type: Concept
  subject: 语文
  title: 反义词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'喜欢'的反义词写成'不喜欢'，忽略词语本身而非加否定词。
    - 能指出并纠正这一错误：认为反义词必须字数相同，如把'容易'的反义词写成'难'，其实'困难'更合适。
  aliases: []
  category: 词汇
  explanation: 意义相反或相对的词互为反义词，常用于对比、映衬，增强表达效果。
  misconceptions:
    - 把'喜欢'的反义词写成'不喜欢'，忽略词语本身而非加否定词。
    - 认为反义词必须字数相同，如把'容易'的反义词写成'难'，其实'困难'更合适。
    - 混淆多义词反义词，如'深'的反义词只写'浅'，忽略河水深可对'浅'，感情深可对'淡'。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:反复
  type: Concept
  subject: 语文
  title: 反复
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“我们爱着，我们走着”中“我们”被隔开，不是反复，实为间隔反复。
    - 能指出并纠正这一错误：把排比误认为反复，如“有桃花，有杏花，有梨花”句式相似，但词语不重复。
  aliases: []
  category: 修辞
  explanation: 为了强调某种意思或突出某种情感，重复使用某些词语或句子的修辞手法。
  misconceptions:
    - 认为“我们爱着，我们走着”中“我们”被隔开，不是反复，实为间隔反复。
    - 把排比误认为反复，如“有桃花，有杏花，有梨花”句式相似，但词语不重复。
    - 认为反复只是简单重复，任意重复词语都算反复，不顾是否为了强调。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:反对
  type: Concept
  subject: 语文
  title: 反对
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“反对”当作动词“不同意”，如“我反对你的观点”。
    - 能指出并纠正这一错误：将“海内存知己，天涯若比邻”误判为反对，实际是正对。
  aliases: []
  category: 修辞手法
  explanation: 对偶的一种，上下句语义相反，互相映衬。
  misconceptions:
    - 把“反对”当作动词“不同意”，如“我反对你的观点”。
    - 将“海内存知己，天涯若比邻”误判为反对，实际是正对。
    - 认为反对就是对比，不需要结构相对。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:反语
  type: Concept
  subject: 语文
  title: 反语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“标致”当赞美，认为清国留学生真的外貌漂亮
    - 能指出并纠正这一错误：将反语混同于夸张，如说“标致极了”是夸大相貌
  aliases:
    - 说反话
  category: 修辞手法
  explanation: 反语是使用与本来意思相反的词语来表达意思，常含讽刺或幽默意味。如文中用“标致”讽刺清国留学生的丑态。
  misconceptions:
    - 把“标致”当赞美，认为清国留学生真的外貌漂亮
    - 将反语混同于夸张，如说“标致极了”是夸大相貌
    - 认为反语只表示幽默，不含讽刺或批判
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:反问
  type: Concept
  subject: 语文
  title: 反问
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“你怎么能这样？”当作疑问句，实际是反问。
    - 能指出并纠正这一错误：误以为反问句必须有“难道”“怎么”，没有就不是反问。
  aliases: []
  category: 修辞手法
  explanation: 只问不答，答案包含在问句中，从反面发问以加重语气。
  misconceptions:
    - 把“你怎么能这样？”当作疑问句，实际是反问。
    - 误以为反问句必须有“难道”“怎么”，没有就不是反问。
    - 把“谁不说俺家乡好”说是设问，实际是反问。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:取义成仁
  type: Concept
  subject: 语文
  title: 取义成仁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“成仁”误写成“成人”，如“取义成人”。
    - 能指出并纠正这一错误：误写“杀身成仁”为“杀生成仁”，丢掉“身”的意义。
  aliases: []
  category: 成语
  explanation: 即“舍生取义”“杀身成仁”，为了成全仁义，不惜牺牲生命。
  misconceptions:
    - 把“成仁”误写成“成人”，如“取义成人”。
    - 误写“杀身成仁”为“杀生成仁”，丢掉“身”的意义。
    - 认为“取义成仁”仅指讲义气，忽视牺牲生命。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:变色龙
  type: Concept
  subject: 语文
  title: 变色龙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《变色龙》作者是莫泊桑或欧·亨利，实际是契诃夫。
    - 能指出并纠正这一错误：认为变色龙奥楚蔑洛夫最后将狗处死，实际是放走了狗。
  aliases:
    - 《变色龙》
  category: 文学常识
  explanation: 契诃夫的短篇小说，通过描写警官奥楚蔑洛夫对狗咬人事件的态度随狗主人身份变化而反复改变，讽刺了沙俄社会的媚上欺下和趋炎附势。
  misconceptions:
    - 误以为《变色龙》作者是莫泊桑或欧·亨利，实际是契诃夫。
    - 认为变色龙奥楚蔑洛夫最后将狗处死，实际是放走了狗。
    - 把“变色龙”理解为一种动物，忽略其比喻义。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:叙事作品的曲折之美
  type: Concept
  subject: 语文
  title: 叙事作品的曲折之美
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为情节越离奇越好，如写“掉下悬崖捡到秘籍”才算曲折，忽略了生活真实和合理性。
    - 能指出并纠正这一错误：把“波折”理解为单纯加篇帽，随写随换，不注重事件发展的因果关系，读来杂乱无章。
  aliases:
    - 曲折之美
    - 文似看山不喜平
  category: 写作技巧
  explanation: 好的叙事作品讲究情节的曲折变化，通过事件选择、内容组织、详略安排等手法，使文章波澜起伏，避免平铺直叙。
  misconceptions:
    - 认为情节越离奇越好，如写“掉下悬崖捡到秘籍”才算曲折，忽略了生活真实和合理性。
    - 把“波折”理解为单纯加篇帽，随写随换，不注重事件发展的因果关系，读来杂乱无章。
    - 误以为多用成语和修辞就能使文章曲折，忽略了关键在事件本身的冲突与变化。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:叙事视角
  type: Concept
  subject: 语文
  title: 叙事视角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为第一人称“我”就是作者本人，如认定莫泊桑去过海边
    - 能指出并纠正这一错误：说《我的叔叔于勒》用第三人称全知视角，实际是第一人称有限视角
  aliases:
    - 叙述视角
    - 小说叙述视角
  category: 文学常识
  explanation: 叙事视角是叙述故事的角度，如第一人称、第三人称等，影响读者对故事的感受。
  misconceptions:
    - 认为第一人称“我”就是作者本人，如认定莫泊桑去过海边
    - 说《我的叔叔于勒》用第三人称全知视角，实际是第一人称有限视角
    - 混淆叙事视角与人称代词，如认为用“你”就是第二人称视角
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:叙事诗
  type: Concept
  subject: 语文
  title: 叙事诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为叙事诗只讲故事不动情，忽略《木兰诗》中细腻的抒情细节
    - 能指出并纠正这一错误：将《木兰诗》归为抒情诗，只因其用了排比、比喻等修辞就分不清体裁
  aliases: []
  category: 诗歌体裁
  explanation: 通过叙述故事来塑造人物、表达情感的诗歌。
  misconceptions:
    - 认为叙事诗只讲故事不动情，忽略《木兰诗》中细腻的抒情细节
    - 将《木兰诗》归为抒情诗，只因其用了排比、比喻等修辞就分不清体裁
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:叙述视角
  type: Concept
  subject: 语文
  title: 叙述视角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：分不清哪些是“童年的我”的感受，哪些是“成年的我”的评论，如把阿长讲长毛故事时的信以为真当作成年…
    - 能指出并纠正这一错误：认为文章只采用童年视角，忽略了结尾处成年人的深沉怀念。
  aliases: []
  category: 写作手法
  explanation: 文中“成年的我”与“童年的我”两种视角交错，体现回忆与感受的差异。
  misconceptions:
    - 分不清哪些是“童年的我”的感受，哪些是“成年的我”的评论，如把阿长讲长毛故事时的信以为真当作成年鲁迅的观点。
    - 认为文章只采用童年视角，忽略了结尾处成年人的深沉怀念。
    - 将“怀念阿长”的情感完全归为童年时的感受，没有意识到是成年后追忆。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:叠音词
  type: Concept
  subject: 语文
  title: 叠音词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“唧唧”理解成织机声，实为叹息声
    - 能指出并纠正这一错误：错写叠音词字形：将“溅溅”写作“浅浅”，“啾啾”写作“揪揪”
  aliases:
    - 叠词
  category: 语言特点
  explanation: 由两个相同音节重叠构成的词，用于描绘事物或声音，增强韵律感。
  misconceptions:
    - 把“唧唧”理解成织机声，实为叹息声；“溅溅”“啾啾”才是模拟自然声响
    - 错写叠音词字形：将“溅溅”写作“浅浅”，“啾啾”写作“揪揪”
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:口头讲解的方法
  type: Concept
  subject: 语文
  title: 口头讲解的方法
  conceptType: 程序型
  aliases:
    - 讲解
  category: 方法
  explanation: 作讲解要先确定内容、搜集资料并列好提纲，讲解时条理清楚、语气语速适当，还可以根据听众的反应调整讲解的内容。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C7/sections/S4.md
- id: concept:语文:口语化表达
  type: Concept
  subject: 语文
  title: 口语化表达
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为演讲词中不得使用口语词，把“无耻啊！无耻啊！”视为不规范。
    - 能指出并纠正这一错误：把口语化表达当成随便喊口号，忽略其简练有力的要求。
  aliases: []
  category: 语言特点
  explanation: 演讲词使用口语化、短句、感叹词等，使语言生动有力，如“无耻啊！无耻啊！”。
  misconceptions:
    - 认为演讲词中不得使用口语词，把“无耻啊！无耻啊！”视为不规范。
    - 把口语化表达当成随便喊口号，忽略其简练有力的要求。
    - 误以为用方言俚语就是口语化表达，不考虑听众接受度。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:口语化语言
  type: Concept
  subject: 语文
  title: 口语化语言
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘占工夫’‘伙食’等口语词视为不规范方言，不知道它们是北方方言常语。
    - 能指出并纠正这一错误：认为口语化就是完全不用修辞，忽略文中比喻、对比等手法的朴素表达。
  aliases: []
  category: 语言特色
  explanation: 本文大量使用富有地方特色的口语，清新质朴，具有浓厚的泥土气息。
  misconceptions:
    - 将‘占工夫’‘伙食’等口语词视为不规范方言，不知道它们是北方方言常语。
    - 认为口语化就是完全不用修辞，忽略文中比喻、对比等手法的朴素表达。
    - 把‘妞儿’等称呼误当成书面雅称，实际是富有生活气息的口语称谓。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:口语实践
  type: Concept
  subject: 语文
  title: 口语实践
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：口语实践中只顾自己说，忽略倾听和回应他人观点
    - 能指出并纠正这一错误：主持人只是念流程，不会引导深入讨论
  aliases:
    - 口语实践练习
  category: 口语交际
  explanation: 通过模拟讨论情境（如名人塑像、有教养、带手机等话题）进行口语交际练习，强调思路开阔、有重点、主持人作用、主动思考、记录整理等。
  misconceptions:
    - 口语实践中只顾自己说，忽略倾听和回应他人观点
    - 主持人只是念流程，不会引导深入讨论
    - 把口语实践当成背诵稿子，不根据现场反应调整
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:古人读书求学的成语
  type: Concept
  subject: 语文
  title: 古人读书求学的成语
  conceptType: 概念型
  aliases:
    - 读书求学的成语
  category: 文化常识
  explanation: 囊萤夜读、悬梁刺股、凿壁偷光、程门立雪等成语都出自古人勤学的故事，赞许了刻苦读书的精神。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:古今差异
  type: Concept
  subject: 语文
  title: 古今差异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“古今”误写为“古金”，或把“差异”写成“差宜”。
    - 能指出并纠正这一错误：误认为古今差异只指物候现象提前，不包含推迟。
  aliases: []
  category: 时间概念
  explanation: 物候现象来临的迟早还有古今差异，如英国南部春初乔木抽青和开花日期现代比古代提前。
  misconceptions:
    - 将“古今”误写为“古金”，或把“差异”写成“差宜”。
    - 误认为古今差异只指物候现象提前，不包含推迟。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:古今差异对物候的影响
  type: Concept
  subject: 语文
  title: 古今差异对物候的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为这种影响仅由人类活动造成，忽略自然因素。
    - 能指出并纠正这一错误：误认为古代和现代物候差异很小，不可测量。
  aliases: []
  category: 科学原理
  explanation: 物候现象来临的迟早还有古今差异，根据长期记录，现代春天比过去提前。
  misconceptions:
    - 误认为这种影响仅由人类活动造成，忽略自然因素。
    - 误认为古代和现代物候差异很小，不可测量。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:古今异义
  type: Concept
  subject: 语文
  title: 古今异义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“虽我之死”的“虽”译成“虽然”，忽略“即使”的假设义
    - 能指出并纠正这一错误：误将“河阳之北”的“阳”理解为山南水北，实际此处指黄河北岸
  aliases:
    - 古今异义词
    - 古今词义异同
  category: 文言词汇
  explanation: 文言文中某些词语的意义与现代汉语不同，如“虽”在文中表示“即使”，现代汉语表示“虽然”。
  misconceptions:
    - 把“虽我之死”的“虽”译成“虽然”，忽略“即使”的假设义
    - 误将“河阳之北”的“阳”理解为山南水北，实际此处指黄河北岸
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:古代年龄称谓
  type: Concept
  subject: 语文
  title: 古代年龄称谓
  conceptType: 概念型
  aliases:
    - 年龄的代称
  category: 文化常识
  explanation: 古人常用专门的词语表示年龄，如豆蔻年华指女子十三四岁，弱冠指男子二十岁左右，花甲指六十岁，古稀指七十岁。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:古代汉语称谓
  type: Concept
  subject: 语文
  title: 古代汉语称谓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“卿”当成敬称，称老师为“卿”。
    - 能指出并纠正这一错误：误以为“孤”是孤单谦称，如说“我很孤”。
  aliases: []
  category: 文言知识
  explanation: 古代汉语中称谓有自称、爱称、敬称等，如“孤”是自称，“卿”是爱称，“大兄”是敬称。
  misconceptions:
    - 把“卿”当成敬称，称老师为“卿”。
    - 误以为“孤”是孤单谦称，如说“我很孤”。
    - 把“大兄”当成自称，如自称为“大兄”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:古代白话小说
  type: Concept
  subject: 语文
  title: 古代白话小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《三国演义》当作古代白话小说，误以为其语言是通俗口语。
    - 能指出并纠正这一错误：认为古代白话小说的语言与现代汉语完全一致，忽略古今差异。
  aliases:
    - 白话小说
  category: 文学体裁
  explanation: 古代白话小说是在宋元以来民间故事和说书底本基础上再创作而成的，具有英雄传奇色彩，语言贴近生活，叙事多采用单线结构。
  misconceptions:
    - 把《三国演义》当作古代白话小说，误以为其语言是通俗口语。
    - 认为古代白话小说的语言与现代汉语完全一致，忽略古今差异。
    - 将《聊斋志异》归入古代白话小说，实际它是文言短篇小说集。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:古代称谓：卿、孤、大兄
  type: Concept
  subject: 语文
  title: 古代称谓：卿、孤、大兄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“卿”是敬称，对朋友长辈称“卿”。
    - 能指出并纠正这一错误：把“孤”理解为失意时的谦称，如“我孤很失败”。
  aliases: []
  category: 古代称谓
  explanation: 卿是古代君对臣的爱称，孤是古代王侯的自称，大兄是对朋友辈的敬称。
  misconceptions:
    - 认为“卿”是敬称，对朋友长辈称“卿”。
    - 把“孤”理解为失意时的谦称，如“我孤很失败”。
    - 见“大兄”就按现代“大哥”亲称理解，忽略敬称语境。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:古代诗歌四首
  type: Concept
  subject: 语文
  title: 古代诗歌四首
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《观沧海》归为五言律诗，因其诗句整齐且押韵，实际是四言古诗。
    - 能指出并纠正这一错误：误认为《次北固山下》是七言绝句，实际是五言律诗。
  aliases: []
  category: 文学常识
  explanation: 本课选取了曹操《观沧海》、王湾《次北固山下》、李白《闻王昌龄左迁龙标遥有此寄》和马致远《天净沙·秋思》四首古代诗歌，涵盖四言古诗、五言律诗、七言绝句和元曲小令。
  misconceptions:
    - 误将《观沧海》归为五言律诗，因其诗句整齐且押韵，实际是四言古诗。
    - 误认为《次北固山下》是七言绝句，实际是五言律诗。
    - 混淆《闻王昌龄左迁龙标遥有此寄》体裁，误认为七言律诗。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:古体诗
  type: Concept
  subject: 语文
  title: 古体诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《饮酒》归入近体诗，认为它讲究平仄对仗，其实古体诗较自由。
    - 能指出并纠正这一错误：认为古体诗必须每句字数相同，将《春望》误判为古体诗（实际是五律）。
  aliases:
    - 古诗
    - 古风
  category: 文学体裁
  explanation: 古体诗是古代诗歌的一种，形式较为自由，不拘平仄，不限句数，押韵较宽，如《饮酒》《春望》等。
  misconceptions:
    - 误把《饮酒》归入近体诗，认为它讲究平仄对仗，其实古体诗较自由。
    - 认为古体诗必须每句字数相同，将《春望》误判为古体诗（实际是五律）。
    - 混淆古体诗与乐府诗，认为所有古体诗都配乐可唱。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:古文
  type: Concept
  subject: 语文
  title: 古文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《说文解字》中的‘古文’等同于文言文，写成‘古文就是古代文言文’
    - 能指出并纠正这一错误：认为‘古文’指所有古代文字，忽略其特指战国时期六国文字等义项
  aliases: []
  category: 词语释义
  explanation: 在《说文解字》中“古文”指古代某一类文字，与文言文不同；有多个义项。
  misconceptions:
    - 把《说文解字》中的‘古文’等同于文言文，写成‘古文就是古代文言文’
    - 认为‘古文’指所有古代文字，忽略其特指战国时期六国文字等义项
    - 将‘古文’与‘今文’相对，误以为今文就是现代白话文
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:古诗书写格式
  type: Concept
  subject: 语文
  title: 古诗书写格式
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 书写古诗时，每一行诗句都居中写，注意上下、左右文字对齐，还要注意笔画和结构的细节。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:句号问号感叹号的用法
  type: Concept
  subject: 语文
  title: 句号问号感叹号的用法
  conceptType: 概念型
  aliases: []
  category: 语法
  explanation: 说感叹的话用感叹号，提出问题用问号，一般说明用句号；标点不同，读的语气也不同。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:句子含义理解
  type: Concept
  subject: 语文
  title: 句子含义理解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：解释“这是我的叔叔……”时只看到反复，不体会若瑟夫的同情和无奈
    - 能指出并纠正这一错误：把“改乘圣玛洛船”理解为“不愿见到于勒”而忽略躲避的深层原因
  aliases:
    - 句意理解
  category: 阅读方法
  explanation: 理解句子在文中的深层含义，需结合上下文和作者意图。
  misconceptions:
    - 解释“这是我的叔叔……”时只看到反复，不体会若瑟夫的同情和无奈
    - 把“改乘圣玛洛船”理解为“不愿见到于勒”而忽略躲避的深层原因
    - 只看字面意思，如“希望本是无所谓有”就认为鲁迅否定希望
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:句子成分搭配要恰当
  type: Concept
  subject: 语文
  title: 句子成分搭配要恰当
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写句子时把状语当定语，如“他高兴地跳起来”误写成“他高兴的跳起来”。
    - 能指出并纠正这一错误：判断主干时把补语也算进去，如“他跑得很快”误认为主干是“他跑得快”。
  aliases:
    - 句子成分搭配
  category: 语法
  explanation: 句子成分之间的关系是语义搭配关系，搭配要合乎事理且符合语言习惯，包括主干成分搭配和修饰语与中心语搭配。
  misconceptions:
    - 写句子时把状语当定语，如“他高兴地跳起来”误写成“他高兴的跳起来”。
    - 判断主干时把补语也算进去，如“他跑得很快”误认为主干是“他跑得快”。
    - 搭配不当却认为正确，如“提高效率”误说成“改善效率”，忽视习惯搭配。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:句子成分残缺
  type: Concept
  subject: 语文
  title: 句子成分残缺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“通过这次活动，使我明白了环保”不是成分残缺，其实缺主语。
    - 能指出并纠正这一错误：误认为缺宾语不算成分残缺，如“懂得了”缺宾语。
  aliases:
    - 成分残缺
  category: 语法
  explanation: 句子缺少必要的成分（如主语、宾语中心语），导致结构不完整，影响表达。
  misconceptions:
    - 误认为“通过这次活动，使我明白了环保”不是成分残缺，其实缺主语。
    - 误认为缺宾语不算成分残缺，如“懂得了”缺宾语。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:句子的主干
  type: Concept
  subject: 语文
  title: 句子的主干
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：找主干时误将宾语保留，如把“他认真地写作业”的主干写成“他写作业”而不是“他写”。
    - 能指出并纠正这一错误：把否定词看作状语去掉，如“他不去”的主干错写成“他去”，实际应保留“不”为“他不去”。
  aliases:
    - 主干
  category: 语法
  explanation: 句子的主干是指把句子中的定语、状语、补语压缩掉后剩下的部分。找出主干可以看出基本句型，检查结构是否完整、搭配是否得当。
  misconceptions:
    - 找主干时误将宾语保留，如把“他认真地写作业”的主干写成“他写作业”而不是“他写”。
    - 把否定词看作状语去掉，如“他不去”的主干错写成“他去”，实际应保留“不”为“他不去”。
    - 压缩定语时保留“的”字结构，如“红红的花”主干误为“红红的花”，应去掉“红红的”得“花”。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:句子的成分
  type: Concept
  subject: 语文
  title: 句子的成分
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：划分'他在教室里读书'时，把'在教室里'当作主语，实际是状语。
    - 能指出并纠正这一错误：将'美丽的校园'中'美丽的'说成状语，实际是定语。
  aliases:
    - 句子成分
  category: 语法
  explanation: 句子由主语、谓语、宾语、定语、状语、补语等成分构成，各成分在句中承担不同功能。
  misconceptions:
    - 划分'他在教室里读书'时，把'在教室里'当作主语，实际是状语。
    - 将'美丽的校园'中'美丽的'说成状语，实际是定语。
    - 分析'他跑得很快'时，把'很快'当成宾语，实际是补语。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:句子语气
  type: Concept
  subject: 语文
  title: 句子语气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为带感叹号的句子一定是感叹句，如'禁止吸烟！'实为祈使句。
    - 能指出并纠正这一错误：以为祈使句都必须用感叹号，其实语气委婉时可用句号，如'请坐。'
  aliases:
    - 句子的语气
  category: 语法知识
  explanation: 根据语气不同，句子分为陈述句、疑问句、感叹句和祈使句，书面语中用标点符号表示。
  misconceptions:
    - 认为带感叹号的句子一定是感叹句，如'禁止吸烟！'实为祈使句。
    - 以为祈使句都必须用感叹号，其实语气委婉时可用句号，如'请坐。'
    - 看到'啊'就认为是感叹句，但'你去哪儿啊？'是疑问句。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:句子顺序合理
  type: Concept
  subject: 语文
  title: 句子顺序合理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：叙述事件时间顺序颠倒，例如先写“他完成了作业”，再写“他起床了”，违背生活逻辑。
    - 能指出并纠正这一错误：描写景物时不按远近或观察顺序，忽而写远处群山，忽而写脚下小草，读起来跳跃。
  aliases:
    - 语序合理
  category: 写作知识
  explanation: 围绕一个话题的各个句子，应有合理的顺序，使句子间逻辑清晰，读起来连贯。
  misconceptions:
    - 叙述事件时间顺序颠倒，例如先写“他完成了作业”，再写“他起床了”，违背生活逻辑。
    - 描写景物时不按远近或观察顺序，忽而写远处群山，忽而写脚下小草，读起来跳跃。
    - 列举理由时随意堆砌，把次要原因放在主要原因前，逻辑强弱不分。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:句式杂糅
  type: Concept
  subject: 语文
  title: 句式杂糅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为'因为……所以……'是句式杂糅，实为关联词误用。
    - 能指出并纠正这一错误：把'关键在于……十分重要'视为正确，典型杂糅错误。
  aliases:
    - 结构混乱
  category: 语法
  explanation: 句式杂糅是指把两种不同的句式结构混在一起，造成句子结构混乱的语病。
  misconceptions:
    - 误认为'因为……所以……'是句式杂糅，实为关联词误用。
    - 把'关键在于……十分重要'视为正确，典型杂糅错误。
    - 说不出病句类型，只凭语感判断，常把杂糅说成成分残缺。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:句间关系
  type: Concept
  subject: 语文
  title: 句间关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把时间先后说成因果关系，例如认为‘先打雷后下雨’所以‘打雷是下雨的原因’。
    - 能指出并纠正这一错误：分析段落层次时只数句子，不找‘因此’‘总之’等逻辑词，错把分说当总说。
  aliases: []
  category: 阅读方法
  explanation: 段落内部句子之间的逻辑联系，如总分、并列、因果等，用于分析段落层次。
  misconceptions:
    - 把时间先后说成因果关系，例如认为‘先打雷后下雨’所以‘打雷是下雨的原因’。
    - 分析段落层次时只数句子，不找‘因此’‘总之’等逻辑词，错把分说当总说。
    - 认为句间关系只有一种，忽略先并列后递进等组合关系。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:可持续发展
  type: Concept
  subject: 语文
  title: 可持续发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“持续”误写为“继续”，如“可继续发展”。
    - 能指出并纠正这一错误：误认为可持续发展只指经济持续增长，忽略环境和社会因素。
  aliases: []
  category: 发展理念
  explanation: 既满足当代人需求又不损害后代人满足其需求的发展模式。
  misconceptions:
    - 将“持续”误写为“继续”，如“可继续发展”。
    - 误认为可持续发展只指经济持续增长，忽略环境和社会因素。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:可歌可泣
  type: Concept
  subject: 语文
  title: 可歌可泣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把'泣'写成'气'，变成'可歌可气'。
    - 能指出并纠正这一错误：误用为'激动人心'，忽略其'使人流泪'的核心语义。
  aliases: []
  category: 成语
  explanation: 值得歌颂、赞美，使人感动流泪。形容英勇悲壮的感人事迹。
  misconceptions:
    - 误把'泣'写成'气'，变成'可歌可气'。
    - 误用为'激动人心'，忽略其'使人流泪'的核心语义。
    - 按字面理解成'可以唱歌，可以哭泣'。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:台词
  type: Concept
  subject: 语文
  title: 台词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆“台词”与“潜台词”，认为台词就是言外之意。
    - 能指出并纠正这一错误：误以为只有对话才算台词，忽略独白和旁白。
  aliases:
    - 人物语言
  category: 戏剧术语
  explanation: 戏剧中人物所说的话，包括对话、独白等，是推进剧情、刻画人物、表现主题的主要手段。
  misconceptions:
    - 混淆“台词”与“潜台词”，认为台词就是言外之意。
    - 误以为只有对话才算台词，忽略独白和旁白。
    - 把剧中角色的歌唱（如唱段）说成是台词，混淆戏曲与话剧用语。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:史铁生
  type: Concept
  subject: 语文
  title: 史铁生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为史铁生先天双腿瘫痪，实际他是18岁赴延安插队时生病致残，并非生来如此。
    - 能指出并纠正这一错误：把《秋天的怀念》作者记为老舍或沈从文，与史铁生《我与地坛》等作品张冠李戴。
  aliases: []
  category: 作家
  explanation: 当代作家，双腿瘫痪，作品带有独特气质，代表作有《我与地坛》等。
  misconceptions:
    - 误以为史铁生先天双腿瘫痪，实际他是18岁赴延安插队时生病致残，并非生来如此。
    - 把《秋天的怀念》作者记为老舍或沈从文，与史铁生《我与地坛》等作品张冠李戴。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:叶圣陶
  type: Concept
  subject: 语文
  title: 叶圣陶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为叶圣陶原名叶绍钧，但把“钧”写成“均”或“军”。
    - 能指出并纠正这一错误：将《苏州园林》作者记为朱自清或巴金，张冠李戴。
  aliases:
    - 叶绍钧
  category: 文学常识
  explanation: 原名叶绍钧，江苏苏州人，作家、教育家、出版家，代表作有《倪焕之》《稻草人》等。
  misconceptions:
    - 误以为叶圣陶原名叶绍钧，但把“钧”写成“均”或“军”。
    - 将《苏州园林》作者记为朱自清或巴金，张冠李戴。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:司马光
  type: Concept
  subject: 语文
  title: 司马光
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将司马光当作西汉史学家，与司马迁混淆。
    - 能指出并纠正这一错误：认为司马光主编《史记》，实际是《资治通鉴》。
  aliases: []
  category: 历史人物
  explanation: 北宋史学家，主编《资治通鉴》，对裴矩的评论强调君主纳谏的重要性。
  misconceptions:
    - 误将司马光当作西汉史学家，与司马迁混淆。
    - 认为司马光主编《史记》，实际是《资治通鉴》。
    - 错写“司马光”为“司马广”，或误以为他写了《汉书》。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:司马迁
  type: Concept
  subject: 语文
  title: 司马迁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为司马迁是东汉史学家，实际是西汉。
    - 能指出并纠正这一错误：将司马迁与司马光混淆，错把《资治通鉴》记为司马迁所作。
  aliases:
    - 司马子长
  category: 人物
  explanation: 西汉史学家、文学家，著有《史记》。
  misconceptions:
    - 误以为司马迁是东汉史学家，实际是西汉。
    - 将司马迁与司马光混淆，错把《资治通鉴》记为司马迁所作。
    - 认为《史记》完全为汉武帝歌功颂德，忽略了其中的批判性。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:吃大户
  type: Concept
  subject: 语文
  title: 吃大户
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：按字面理解成“吃大餐”，忽略饥民夺食的历史背景。
    - 能指出并纠正这一错误：误认为“大户”是“大户人家请客吃饭”。
  aliases: []
  category: 词语
  explanation: 旧时遇荒年，饥民聚集到地主富豪家去吃饭或夺取粮食。
  misconceptions:
    - 按字面理解成“吃大餐”，忽略饥民夺食的历史背景。
    - 误认为“大户”是“大户人家请客吃饭”。
    - 将“吃大户”理解为“到富人家里盛情聚餐”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:吃砸八地的
  type: Concept
  subject: 语文
  title: 吃砸八地的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“吃砸八地的”就是“砸八地”的流氓本人，忽略“吃”表示盘剥。
    - 能指出并纠正这一错误：把“砸八地”理解成用东西砸地，实为称霸一方的地痞流氓。
  aliases: []
  category: 文化常识
  explanation: 指盘剥“砸八地”的大流氓头子。“砸八地”指称霸一方的地痞流氓。
  misconceptions:
    - 误以为“吃砸八地的”就是“砸八地”的流氓本人，忽略“吃”表示盘剥。
    - 把“砸八地”理解成用东西砸地，实为称霸一方的地痞流氓。
    - 将“砸八地”写作“砸巴地”或“砸吧地”，字形错误。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:各拉丹冬
  type: Concept
  subject: 语文
  title: 各拉丹冬
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为各拉丹冬属于昆仑山脉，实际是唐古拉山脉。
    - 能指出并纠正这一错误：把'丹冬'写成'丹东'，与辽宁省丹东市混淆。
  aliases: []
  category: 地理景观
  explanation: 唐古拉山脉最高的一组雪山群，主峰海拔6621米，是长江源头之一。
  misconceptions:
    - 误以为各拉丹冬属于昆仑山脉，实际是唐古拉山脉。
    - 把'丹冬'写成'丹东'，与辽宁省丹东市混淆。
    - 误以为各拉丹冬是长江中游的山，实际是长江源头之一。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:合体字
  type: Concept
  subject: 语文
  title: 合体字
  conceptType: 概念型
  aliases:
    - 上下结构的字
  category: 概念
  explanation: 由两个或几个部分上下合在一起组成的字叫合体字，比如男是田加力，笔是竹加毛。把字分成两部分，更容易记住。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C9/sections/S4.md
- id: concept:语文:合作编小诗集
  type: Concept
  subject: 语文
  title: 合作编小诗集
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把收集的诗和自己写的诗，按诗人、内容、形式等角度分类编排，配上插图，制作封面和目录，装订成小诗集在班里展示。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:同义词
  type: Concept
  subject: 语文
  title: 同义词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“他做事很果断”写成“他做事很武断”，没区分感情色彩。
    - 能指出并纠正这一错误：认为“父亲”和“爸爸”在任何场合都能互换，忽视语体差异。
  aliases:
    - 近义词
  category: 词汇知识
  explanation: 意义相同或相近的词，包括等义词和近义词，在语言中常可换用，但存在细微差别。
  misconceptions:
    - 把“他做事很果断”写成“他做事很武断”，没区分感情色彩。
    - 认为“父亲”和“爸爸”在任何场合都能互换，忽视语体差异。
    - 将“坚定”和“坚强”混为一谈，如“意志坚定”误作“意志坚强”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:同源说
  type: Concept
  subject: 语文
  title: 同源说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把同源说误认为能解释月球表面熔融，实际它无法解释。
    - 能指出并纠正这一错误：将同源说与分裂说混淆，认为月球是从地球分裂出去的。
  aliases: []
  category: 天文学假说
  explanation: 认为月球与地球由同一块气体-尘埃云凝聚形成，但无法解释月球表面熔融状态。
  misconceptions:
    - 把同源说误认为能解释月球表面熔融，实际它无法解释。
    - 将同源说与分裂说混淆，认为月球是从地球分裂出去的。
    - 误写“同源”为“同原”，忽略“源”表来源。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:同盟会
  type: Concept
  subject: 语文
  title: 同盟会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把同盟会创建者记成“黄兴”，忽略孙中山的领导。
    - 能指出并纠正这一错误：误记同盟会成立于1911年，与辛亥革命时间混淆。
  aliases: []
  category: 词语
  explanation: 即中国同盟会，1905年由孙中山倡导成立的中国资产阶级革命政党，1912年改组为国民党。
  misconceptions:
    - 把同盟会创建者记成“黄兴”，忽略孙中山的领导。
    - 误记同盟会成立于1911年，与辛亥革命时间混淆。
    - 将同盟会与“兴中会”混为一谈，不知后者是1894年成立。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:同音字辨析
  type: Concept
  subject: 语文
  title: 同音字辨析
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读音相同的字意思不一样，要想清楚意思再选字，比如青山的“青”和清泉的“清”。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:名句的衍生意义
  type: Concept
  subject: 语文
  title: 名句的衍生意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“落红不是无情物”是在写落花对枝头的留恋，忽略了它常用来指奉献精神。
    - 能指出并纠正这一错误：把“山重水复疑无路”按字面理解为山水阻挡前路，不知道其衍生义是绝处逢生。
  aliases: []
  category: 文学鉴赏
  explanation: 古诗文中的名句在后世被反复引用，往往衍生出与原意不同的新含义，需要结合语境理解。
  misconceptions:
    - 误认为“落红不是无情物”是在写落花对枝头的留恋，忽略了它常用来指奉献精神。
    - 把“山重水复疑无路”按字面理解为山水阻挡前路，不知道其衍生义是绝处逢生。
    - 认为“会当凌绝顶”的衍生意义是形容人骄傲自大，而非勇攀高峰的决心。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:名词
  type: Concept
  subject: 语文
  title: 名词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用能否作主语判断名词，把'游泳是运动'中的'游泳'误判为名词。
    - 能指出并纠正这一错误：混淆抽象名词与形容词，认为'美丽'也是名词，因为它能表示事物特点。
  aliases: []
  category: 语法
  explanation: 表示人、事物、时间、地点等名称的词，包括具体名词和抽象名词。
  misconceptions:
    - 用能否作主语判断名词，把'游泳是运动'中的'游泳'误判为名词。
    - 混淆抽象名词与形容词，认为'美丽'也是名词，因为它能表示事物特点。
    - 以为名词都指具体事物，见到'思想'就认为不是名词。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:名词作状语
  type: Concept
  subject: 语文
  title: 名词作状语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘任意东西’中的‘东西’理解为‘东西方向’两个名词，而不知道是‘向东向西’作状语。
    - 能指出并纠正这一错误：误认为名词作状语就是名词作主语，如把‘任意东西’中的‘东西’当成动作的对象。
  aliases: []
  category: 文言语法
  explanation: 名词放在动词前，起修饰限制作用，表示动作的方式、状态、处所等。如'任意东西'中'东西'意为'向东向西'。
  misconceptions:
    - 把‘任意东西’中的‘东西’理解为‘东西方向’两个名词，而不知道是‘向东向西’作状语。
    - 误认为名词作状语就是名词作主语，如把‘任意东西’中的‘东西’当成动作的对象。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:向别人推荐
  type: Concept
  subject: 语文
  title: 向别人推荐
  conceptType: 应用型
  aliases:
    - 推荐
    - 介绍喜欢的东西
  category: 方法
  explanation: 把喜欢的东西介绍给别人，说说它给你留下的印象、最吸引人的地方，说话速度适中让别人听清楚，自己也要认真听别人讲。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:向别人请教
  type: Concept
  subject: 语文
  title: 向别人请教
  conceptType: 应用型
  aliases:
    - 请教
  category: 方法
  explanation: 请教别人要选对方方便的时候，把问题说清楚，不清楚的地方及时追问，不管有没有解决问题都要表示感谢。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:含数字的成语
  type: Concept
  subject: 语文
  title: 含数字的成语
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 很多成语里带有数字，如“百发百中”“四面八方”“七上八下”，读起来好记又有趣。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:含蓄不露
  type: Concept
  subject: 语文
  title: 含蓄不露
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把含蓄等同于晦涩难懂，认为越难懂越含蓄。
    - 能指出并纠正这一错误：认为含蓄就是不表达情感，完全藏而不露，让人摸不着头脑。
  aliases:
    - 含蓄
  category: 美学概念
  explanation: 含蓄不露指艺术表现中不直接流露情感，而是通过暗示、留白等方式让欣赏者体会。
  misconceptions:
    - 把含蓄等同于晦涩难懂，认为越难懂越含蓄。
    - 认为含蓄就是不表达情感，完全藏而不露，让人摸不着头脑。
    - 误以为含蓄就是少写或留白越多越好，忽略暗示与意蕴。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:含身体部位的成语
  type: Concept
  subject: 语文
  title: 含身体部位的成语
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 许多成语里带有人的身体部位，如“摇头晃脑”“面红耳赤”。记住其中的身体部位，能帮助我们理解和记忆成语。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:启事
  type: Concept
  subject: 语文
  title: 启事
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把“启事”写成“启示”，如写“寻物启示”，混淆文体与道理。
    - 能指出并纠正这一错误：写交友启事时只写“我要交朋友”，没写清楚我的情况或期望，语言笼统。
  aliases:
    - 征友启事
  category: 应用文
  explanation: 启事是公开声明某事的应用文，用于寻求帮助或信息。本课要求发布交友启事，需写清楚所求、所思，语言准确鲜明。
  misconceptions:
    - 把“启事”写成“启示”，如写“寻物启示”，混淆文体与道理。
    - 写交友启事时只写“我要交朋友”，没写清楚我的情况或期望，语言笼统。
    - 启事开头写“通知”或“公告”，用错应用文体。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:吴下阿蒙
  type: Concept
  subject: 语文
  title: 吴下阿蒙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写错为“吴下阿濛”或“吴下阿蒙”加三点水。
    - 能指出并纠正这一错误：用“吴下阿蒙”夸人进步大，如“你真是吴下阿蒙啊”。
  aliases: []
  category: 成语
  explanation: 指学识浅陋的人，出自本文，原指吕蒙。
  misconceptions:
    - 写错为“吴下阿濛”或“吴下阿蒙”加三点水。
    - 用“吴下阿蒙”夸人进步大，如“你真是吴下阿蒙啊”。
    - 误认为“吴下”是地名“吴国山下”，解释成“吴国山下有个阿蒙”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:吴均三书
  type: Concept
  subject: 语文
  title: 吴均三书
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《与朱元思书》误记为《与施从事书》或《与顾章书》的作者是陶弘景。
    - 能指出并纠正这一错误：将‘吴均三书’与《答谢中书书》混淆，以为后者也属于吴均三书。
  aliases: []
  category: 文学常识
  explanation: 指吴均的《与施从事书》《与顾章书》和《与朱元思书》，都是描写山水的名篇。
  misconceptions:
    - 把《与朱元思书》误记为《与施从事书》或《与顾章书》的作者是陶弘景。
    - 将‘吴均三书’与《答谢中书书》混淆，以为后者也属于吴均三书。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:吴承恩
  type: Concept
  subject: 语文
  title: 吴承恩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为吴承恩写了《三国演义》，张冠李戴。
    - 能指出并纠正这一错误：把吴承恩的号“射阳山人”记成“耐庵居士”。
  aliases:
    - 射阳山人
  category: 文学常识
  explanation: 吴承恩（约1500—约1582），字汝忠，别号射阳山人，山阳（今江苏淮安）人，明代小说家，一般认为《西游记》的作者。
  misconceptions:
    - 误认为吴承恩写了《三国演义》，张冠李戴。
    - 把吴承恩的号“射阳山人”记成“耐庵居士”。
    - 误以为吴承恩是元代小说家，实际是明代。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:吴敬梓
  type: Concept
  subject: 语文
  title: 吴敬梓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《儒林外史》作者误写作吴承恩，因姓氏相同而张冠李戴。
    - 能指出并纠正这一错误：认为吴敬梓是宋代人，混淆其清代作家身份。
  aliases: []
  category: 作家作品
  explanation: 清代小说家，著有长篇讽刺小说《儒林外史》。
  misconceptions:
    - 将《儒林外史》作者误写作吴承恩，因姓氏相同而张冠李戴。
    - 认为吴敬梓是宋代人，混淆其清代作家身份。
    - 误认吴敬梓写了《水浒传》，与施耐庵相混。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:吴用
  type: Concept
  subject: 语文
  title: 吴用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把吴用说成《三国演义》中的谋士，因他与诸葛亮都足智多谋。
    - 能指出并纠正这一错误：将吴用的绰号“智多星”误写为“智多兴”或“智多心”。
  aliases:
    - 智多星
  category: 人物形象
  explanation: 《水浒传》中的人物，绰号智多星，足智多谋，是智取生辰纲的主要策划者。
  misconceptions:
    - 把吴用说成《三国演义》中的谋士，因他与诸葛亮都足智多谋。
    - 将吴用的绰号“智多星”误写为“智多兴”或“智多心”。
    - 误以为吴用是《红楼梦》中人物，与“补天”情节混为一谈。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:周亚夫
  type: Concept
  subject: 语文
  title: 周亚夫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为周亚夫是战国名将，实际是西汉。
    - 能指出并纠正这一错误：认为细柳军、霸上军、棘门军都是周亚夫统领，实际霸上和棘门是别人。
  aliases:
    - 周亚夫
  category: 人物
  explanation: 西汉名将，治军严明，驻军细柳，因军纪严整被汉文帝称为“真将军”。
  misconceptions:
    - 误以为周亚夫是战国名将，实际是西汉。
    - 认为细柳军、霸上军、棘门军都是周亚夫统领，实际霸上和棘门是别人。
    - 把周亚夫治军严明说成体恤士兵、放松军纪。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:周敦颐
  type: Concept
  subject: 语文
  title: 周敦颐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《爱莲说》的作者记成陶渊明，因文中提到陶渊明爱菊
    - 能指出并纠正这一错误：将周敦颐的字“茂叔”误写为“茂书”或“茂熟”
  aliases: []
  category: 作者
  explanation: 北宋哲学家，字茂叔，道州营道人，著有《太极图说》《通书》等。
  misconceptions:
    - 把《爱莲说》的作者记成陶渊明，因文中提到陶渊明爱菊
    - 将周敦颐的字“茂叔”误写为“茂书”或“茂熟”
    - 误认为周敦颐是唐代文学家，与刘禹锡同朝代
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:周济
  type: Concept
  subject: 语文
  title: 周济
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“周济”误写成“周剂”或“周挤”。
    - 能指出并纠正这一错误：误将“周济”等同于“救济”，忽视个人接济和官方救助的区别。
  aliases: []
  category: 词语
  explanation: 对穷困的人给予物质上的帮助。
  misconceptions:
    - 把“周济”误写成“周剂”或“周挤”。
    - 误将“周济”等同于“救济”，忽视个人接济和官方救助的区别。
    - 按“周到”拆词理解，译成“周全地帮助”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:呼告
  type: Concept
  subject: 语文
  title: 呼告
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把呼告误认为拟人，如将‘土地，你让我热血沸腾’说成是拟人而非呼告。
    - 能指出并纠正这一错误：认为呼告必须带感叹号或‘啊’，忽略直接呼唤或倾诉的本质。
  aliases:
    - 直呼
  category: 修辞手法
  explanation: 在叙述或描写中，直接对叙述对象或读者发出呼唤、倾诉的修辞方式，增强抒情性。
  misconceptions:
    - 把呼告误认为拟人，如将‘土地，你让我热血沸腾’说成是拟人而非呼告。
    - 认为呼告必须带感叹号或‘啊’，忽略直接呼唤或倾诉的本质。
    - 将呼告与反复混淆，认为反复出现‘土地’就是呼告。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:咆哮
  type: Concept
  subject: 语文
  title: 咆哮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“咆哮”的“哮”写成“啸”，或用“呼啸”代替“咆哮”形容人发怒
    - 能指出并纠正这一错误：认为“咆哮”只能形容人暴怒喊叫，不能用于水声、风声等自然声响
  aliases: []
  category: 词语
  explanation: 形容水流的奔腾轰鸣，也形容人的暴怒喊叫。文中形容发动机的轰鸣声。
  misconceptions:
    - 把“咆哮”的“哮”写成“啸”，或用“呼啸”代替“咆哮”形容人发怒
    - 认为“咆哮”只能形容人暴怒喊叫，不能用于水声、风声等自然声响
    - 误把“咆哮”读作“bāo xiào”，忽略了“咆”的正确读音
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:和为贵
  type: Concept
  subject: 语文
  title: 和为贵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“和为贵”当无原则和稀泥，认为应事事忍让不求是非。
    - 能指出并纠正这一错误：将“和为贵”与道家“无为”混同，不知是儒家倡导。
  aliases:
    - 以和为贵
  category: 思想观念
  explanation: 儒家倡导的以和谐为贵的思想，强调人际关系的和睦与包容。
  misconceptions:
    - 把“和为贵”当无原则和稀泥，认为应事事忍让不求是非。
    - 将“和为贵”与道家“无为”混同，不知是儒家倡导。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:和平
  type: Concept
  subject: 语文
  title: 和平
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘和平’写成‘合平’，忽略‘和’表和睦、协调的含义
    - 能指出并纠正这一错误：将‘珍爱和平’误写为‘珍爱平和’，混淆‘平’与‘和’
  aliases: []
  category: 价值观
  explanation: 本文强调铭记历史、珍爱和平，中国矢志捍卫世界和平。
  misconceptions:
    - 把‘和平’写成‘合平’，忽略‘和’表和睦、协调的含义
    - 将‘珍爱和平’误写为‘珍爱平和’，混淆‘平’与‘和’
    - 认为和平仅指没有战争，与‘和谐’‘安宁’完全等同，忽略其国际关系中的特定含义
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:和而不同
  type: Concept
  subject: 语文
  title: 和而不同
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“和而不同”就是表面和气内心不一致，忽视“不苟同”之意。
    - 能指出并纠正这一错误：把“同”理解为相同，误以为“和而不同”是既和谐又完全一样。
  aliases: []
  category: 文化理念
  explanation: 君子在人际交往中能够与他人保持和谐，但不盲目苟同，是中华传统文化核心命题之一。
  misconceptions:
    - 认为“和而不同”就是表面和气内心不一致，忽视“不苟同”之意。
    - 把“同”理解为相同，误以为“和而不同”是既和谐又完全一样。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:和自然逼真
  type: Concept
  subject: 语文
  title: 和自然逼真
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘和’读成hé，理解为‘和平’的‘和’，误以为是‘与自然逼真’。
    - 能指出并纠正这一错误：认为美术作品应完全复制自然，越真实越好，拒绝艺术加工。
  aliases: []
  category: 美学原理
  explanation: 和自然逼真指美术作品要真实反映自然，但并非完全复制，而是经过艺术加工。
  misconceptions:
    - 把‘和’读成hé，理解为‘和平’的‘和’，误以为是‘与自然逼真’。
    - 认为美术作品应完全复制自然，越真实越好，拒绝艺术加工。
    - 把‘和自然逼真’理解为一种修辞手法，与拟人混同。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:咏月诗
  type: Concept
  subject: 语文
  title: 咏月诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为咏月诗必须全篇写月，如“月”字出现才算，否则不是。
    - 能指出并纠正这一错误：将《静夜思》排除在咏月诗外，因它表达思乡，但借月抒情正是咏月。
  aliases: []
  category: 诗歌题材
  explanation: 以月亮为吟咏对象的诗歌，常借月抒情或言志。
  misconceptions:
    - 认为咏月诗必须全篇写月，如“月”字出现才算，否则不是。
    - 将《静夜思》排除在咏月诗外，因它表达思乡，但借月抒情正是咏月。
    - 误以为咏月诗都是借月表达思乡，忽视还可言志或写景。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:咏物诗
  type: Concept
  subject: 语文
  title: 咏物诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把单纯描写事物的诗当作托物言志，如认为《咏鹅》也是托物言志
    - 能指出并纠正这一错误：将咏物诗与山水诗混为一谈，看到咏雪诗就归入写景诗
  aliases: []
  category: 诗歌体裁
  explanation: 以某一物为描写对象，借物抒情或托物言志的诗歌。
  misconceptions:
    - 把单纯描写事物的诗当作托物言志，如认为《咏鹅》也是托物言志
    - 将咏物诗与山水诗混为一谈，看到咏雪诗就归入写景诗
    - 认为咏物诗只能托物言志，忽略其也可借物抒情
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S8.md
- id: concept:语文:咏雪
  type: Concept
  subject: 语文
  title: 咏雪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘未若柳絮因风起’的‘因’误译为‘因为’，实际是‘趁、乘’。
    - 能指出并纠正这一错误：误以为‘柳絮因风起’是谢朗所作，实际是谢道韫。
  aliases: []
  category: 文言文
  explanation: 《咏雪》选自《世说新语·言语》，讲述谢安与儿女咏雪的故事，谢道韫以“柳絮因风起”比喻雪花，表现其才思敏捷。
  misconceptions:
    - 将‘未若柳絮因风起’的‘因’误译为‘因为’，实际是‘趁、乘’。
    - 误以为‘柳絮因风起’是谢朗所作，实际是谢道韫。
    - 说谢道韫是谢安的女儿，实际是侄女。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:品味诗句
  type: Concept
  subject: 语文
  title: 品味诗句
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：只直译诗句意思，如把“大漠孤烟直”译成“烟直直上升”就完事，不分析手法情感。
    - 能指出并纠正这一错误：误把拟人当比喻，如说“感时花溅泪”是比喻作者流泪。
  aliases:
    - 赏析诗句
  category: 语文技能
  explanation: 品味诗句指深入理解诗句的含义、修辞手法和表达效果，体会诗人的情感。
  misconceptions:
    - 只直译诗句意思，如把“大漠孤烟直”译成“烟直直上升”就完事，不分析手法情感。
    - 误把拟人当比喻，如说“感时花溅泪”是比喻作者流泪。
    - 品味诗句时总写“表达了对祖国山河的赞美”，却不结合具体词句说明。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:响晴
  type: Concept
  subject: 语文
  title: 响晴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“响晴”写成“响情”或“响睛”，忽略“晴”是日字旁。
    - 能指出并纠正这一错误：将“响晴”理解成“天空有响声”，与“响亮”混为一谈。
  aliases: []
  category: 词语理解
  explanation: 晴朗无云，天空明亮。
  misconceptions:
    - 把“响晴”写成“响情”或“响睛”，忽略“晴”是日字旁。
    - 将“响晴”理解成“天空有响声”，与“响亮”混为一谈。
    - 用“响晴”形容声音，如“歌声响晴”，误当成形容词。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:哥伦比亚号航天飞机事故
  type: Concept
  subject: 语文
  title: 哥伦比亚号航天飞机事故
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把哥伦比亚号事故误认为挑战者号或阿波罗号失事。
    - 能指出并纠正这一错误：将事故年份写成1986年或2001年，而非2003年。
  aliases:
    - 哥伦比亚号事故
  category: 历史事件
  explanation: 2003年美国哥伦比亚号航天飞机因防热板裂缝导致解体，造成7名宇航员遇难。
  misconceptions:
    - 把哥伦比亚号事故误认为挑战者号或阿波罗号失事。
    - 将事故年份写成1986年或2001年，而非2003年。
    - 误以为解体原因是燃料箱爆炸，而非防热板裂缝。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:哲理诗
  type: Concept
  subject: 语文
  title: 哲理诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为哲理诗必须直接讲道理，不能借助意象，所以把《未选择的路》排除在哲理诗之外。
    - 能指出并纠正这一错误：把凡含有议论句的诗都归为哲理诗，如误判《登鹳雀楼》只是说理而忽略其哲理。
  aliases: []
  category: 诗歌体裁
  explanation: 哲理诗是表现诗人对人生、社会、自然等深刻思考和感悟的诗歌，常蕴含哲理。
  misconceptions:
    - 认为哲理诗必须直接讲道理，不能借助意象，所以把《未选择的路》排除在哲理诗之外。
    - 把凡含有议论句的诗都归为哲理诗，如误判《登鹳雀楼》只是说理而忽略其哲理。
    - 将哲理诗与寓言诗混为一谈，认为《龟兔赛跑》分行写就是哲理诗。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:唐宋八大家
  type: Concept
  subject: 语文
  title: 唐宋八大家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“唐宋八大家”全是宋代人，把韩愈、柳宗元说成北宋人。
    - 能指出并纠正这一错误：把李白、杜甫算进唐宋八大家中，混淆了散文家与诗人的身份。
  aliases: []
  category: 文学常识
  explanation: 唐宋八大家是唐代韩愈、柳宗元和宋代欧阳修、苏洵、苏轼、苏辙、王安石、曾巩八位散文家的合称。
  misconceptions:
    - 误以为“唐宋八大家”全是宋代人，把韩愈、柳宗元说成北宋人。
    - 把李白、杜甫算进唐宋八大家中，混淆了散文家与诗人的身份。
    - 漏算“三苏”中的苏洵或苏辙，或把王安石归为唐代文学家。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:唐诗
  type: Concept
  subject: 语文
  title: 唐诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把崔颢的《黄鹤楼》记成李白所作。
    - 能指出并纠正这一错误：认为唐诗全都是近体诗，不知道还有古体诗。
  aliases:
    - 唐代诗歌
  category: 文学史
  explanation: 唐代诗歌是中国古代诗歌的巅峰，流派众多，名家辈出，代表诗人有李白、杜甫、王维等。
  misconceptions:
    - 误把崔颢的《黄鹤楼》记成李白所作。
    - 认为唐诗全都是近体诗，不知道还有古体诗。
    - 将李白归为现实主义诗人，将杜甫归为浪漫主义诗人。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:唐诗三百首
  type: Concept
  subject: 语文
  title: 唐诗三百首
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《唐诗三百首》是唐代人编的，或以为是李白选编，实为清代孙洙选编。
    - 能指出并纠正这一错误：以为书名“三百首”表示全书正好收录三百首诗，实际是约数，共选三百余首。
  aliases: []
  category: 文学作品
  explanation: 清代孙洙选编的唐诗选集，选篇精当，流传广泛，是学习唐诗的重要读本。
  misconceptions:
    - 误认为《唐诗三百首》是唐代人编的，或以为是李白选编，实为清代孙洙选编。
    - 以为书名“三百首”表示全书正好收录三百首诗，实际是约数，共选三百余首。
    - 把《唐诗三百首》与《全唐诗》混淆，认为它收录了全部唐代诗歌。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:唐雎不辱使命
  type: Concept
  subject: 语文
  title: 唐雎不辱使命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把唐雎误认为安陵君，以为是他亲自去秦国谈判。
    - 能指出并纠正这一错误：将“唐雎”写成“唐睢”或“唐睢”，字形混淆。
  aliases: []
  category: 历史故事
  explanation: 记叙了唐雎出使秦国，不畏强暴，维护国家尊严的故事。
  misconceptions:
    - 把唐雎误认为安陵君，以为是他亲自去秦国谈判。
    - 将“唐雎”写成“唐睢”或“唐睢”，字形混淆。
    - 认为唐雎是武将，靠武力威胁秦王，而非辞令取胜。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:商鞅立木
  type: Concept
  subject: 语文
  title: 商鞅立木
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“徙木立信”误写为“徒木立信”，字形混淆
    - 能指出并纠正这一错误：误认为商鞅“立木”是“树立木头”，忽略“徙”是搬移
  aliases:
    - 徙木立信
  category: 典故
  explanation: 商鞅通过徙木立信取信于民，推行变法，体现国家之信的重要性。
  misconceptions:
    - 把“徙木立信”误写为“徒木立信”，字形混淆
    - 误认为商鞅“立木”是“树立木头”，忽略“徙”是搬移
    - 误称商鞅为魏国人，实际是卫国人
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:喜幛子
  type: Concept
  subject: 语文
  title: 喜幛子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“幛”写成“障”或“嶂”，如“喜障子”
    - 能指出并纠正这一错误：误以为喜幛子是蚊帐或窗帘，忽略了贺词红绸的用途
  aliases: []
  category: 文化常识
  explanation: 题上贺词的整幅绸布，用以贺喜，多为红色。
  misconceptions:
    - 把“幛”写成“障”或“嶂”，如“喜障子”
    - 误以为喜幛子是蚊帐或窗帘，忽略了贺词红绸的用途
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:喜极而疯
  type: Concept
  subject: 语文
  title: 喜极而疯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为范进是《水浒传》中人物，将他与宋江等混淆。
    - 能指出并纠正这一错误：把范进中举说成考中状元，忽略“举人”的身份。
  aliases: []
  category: 情节内容
  explanation: 范进中举后因过度高兴而发疯，是本文的核心情节，具有强烈的讽刺效果。
  misconceptions:
    - 认为范进是《水浒传》中人物，将他与宋江等混淆。
    - 把范进中举说成考中状元，忽略“举人”的身份。
    - 将“喜极而疯”解释为“乐极生悲”，淡化讽刺意味。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:四书
  type: Concept
  subject: 语文
  title: 四书
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为四书包括《诗经》《尚书》，实际是《大学》《中庸》《论语》《孟子》
    - 能指出并纠正这一错误：将‘四书’的合称时间说成唐代，实际是宋代由朱熹确立
  aliases: []
  category: 文学常识
  explanation: 《大学》《中庸》《论语》《孟子》的合称，宋代确立。
  misconceptions:
    - 误认为四书包括《诗经》《尚书》，实际是《大学》《中庸》《论语》《孟子》
    - 将‘四书’的合称时间说成唐代，实际是宋代由朱熹确立
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:四字短语
  type: Concept
  subject: 语文
  title: 四字短语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘春寒料峭’误写为‘春寒料俏’或‘春寒料鞘’。
    - 能指出并纠正这一错误：认为四字短语必须是成语，像‘往来行人’这种不能算。
  aliases: []
  category: 语言运用
  explanation: 文中大量使用四字短语，如“春寒料峭”“摩肩接踵”，使语言凝练生动。
  misconceptions:
    - 把‘春寒料峭’误写为‘春寒料俏’或‘春寒料鞘’。
    - 认为四字短语必须是成语，像‘往来行人’这种不能算。
    - 将‘摩肩接踵’误读为‘mó jiān jiē zhǒng’写成‘磨肩接踵’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:四方街
  type: Concept
  subject: 语文
  title: 四方街
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为四方街是古城内的复杂道路，实际是中心广场。
    - 能指出并纠正这一错误：误以为四方街由木氏土司单独建造，实际是木氏家族率百姓筑成。
  aliases: []
  category: 文化常识
  explanation: 丽江古城的中心广场，由木氏家族率领百姓筑成，是丽江古城的标志性地点。
  misconceptions:
    - 误以为四方街是古城内的复杂道路，实际是中心广场。
    - 误以为四方街由木氏土司单独建造，实际是木氏家族率百姓筑成。
    - 把'四方街'写成'四方阶'，音同字误。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:四线三格
  type: Concept
  subject: 语文
  title: 四线三格
  conceptType: 概念型
  aliases:
    - 拼音四线格
  category: 概念
  explanation: 写拼音用的本子上有四条线，分成上、中、下三个格子。每个拼音字母都有自己的位置，要写在自己该待的格子里。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:回塘
  type: Concept
  subject: 语文
  title: 回塘
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘回’理解为‘返回’，把‘回塘’解释为‘回到池塘’
    - 能指出并纠正这一错误：将‘回塘’的‘回’误写成‘洄’，且不知‘回’有曲折之意
  aliases: []
  category: 词语解释
  explanation: 边沿曲折的池塘。
  misconceptions:
    - 误将‘回’理解为‘返回’，把‘回塘’解释为‘回到池塘’
    - 将‘回塘’的‘回’误写成‘洄’，且不知‘回’有曲折之意
    - 以为‘回塘’是‘回旋的水塘’，而非‘边沿曲折的池塘’
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:回忆性散文
  type: Concept
  subject: 语文
  title: 回忆性散文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为回忆性散文可以虚构人物情节，如把藤野先生当虚构形象
    - 能指出并纠正这一错误：将《藤野先生》归为议论文，只因文中有议论性语句
  aliases: []
  category: 文体知识
  explanation: 回忆性散文是以回忆往事为主要内容的散文，通过叙述亲身经历的人和事，表达作者的情感与思考。本文《藤野先生》即属于此类。
  misconceptions:
    - 认为回忆性散文可以虚构人物情节，如把藤野先生当虚构形象
    - 将《藤野先生》归为议论文，只因文中有议论性语句
    - 把回忆性散文与小说混淆，认为有人物有情节就是小说
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:回忆我的母亲
  type: Concept
  subject: 语文
  title: 回忆我的母亲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把作者张冠李戴为“毛泽东”或“周恩来”。
    - 能指出并纠正这一错误：认为文章仅写母亲的勤劳，忽略结尾升华到劳动人民。
  aliases: []
  category: 课文
  explanation: 朱德回忆母亲勤劳一生，表达对母亲的怀念与感激，并升华到对劳动人民的赞颂。
  misconceptions:
    - 把作者张冠李戴为“毛泽东”或“周恩来”。
    - 认为文章仅写母亲的勤劳，忽略结尾升华到劳动人民。
    - 误判文体为小说，实为回忆性散文。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:因果复句
  type: Concept
  subject: 语文
  title: 因果复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘只要……就……’误判为因果复句，实为条件复句。
    - 能指出并纠正这一错误：认为没有关联词的复句不是因果复句，如‘他生病了，没来上课’也是因果。
  aliases:
    - 因果关系复句
  category: 语法知识
  explanation: 因果复句是分句间有原因和结果关系的复句，常用“因为”“所以”“因此”等关联词连接。
  misconceptions:
    - 把‘只要……就……’误判为因果复句，实为条件复句。
    - 认为没有关联词的复句不是因果复句，如‘他生病了，没来上课’也是因果。
    - 将‘之所以……是因为……’错当成转折复句。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:围绕一个意思写话
  type: Concept
  subject: 语文
  title: 围绕一个意思写话
  conceptType: 程序型
  aliases:
    - 围绕一个意思写
  category: 方法
  explanation: 写一段话时先想好要说的意思，再围绕这个意思一句一句地写具体。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:围绕中心选择材料
  type: Concept
  subject: 语文
  title: 围绕中心选择材料
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写《我的老师》却花大半篇幅写同学趣事，只因为这件事有趣，与表现老师无关。
    - 能指出并纠正这一错误：认为材料越多越好，把积累的所有素材都塞进作文，不管是否服务于中心。
  aliases:
    - 中心决定材料
  category: 写作方法
  explanation: 文章的中心决定材料的取舍和详略安排，与中心无关的材料舍弃，相关的材料分清主次，重点展开最有利于表现中心的材料。
  misconceptions:
    - 写《我的老师》却花大半篇幅写同学趣事，只因为这件事有趣，与表现老师无关。
    - 认为材料越多越好，把积累的所有素材都塞进作文，不管是否服务于中心。
    - 把与中心有关的材料平均用力，不区分详略，导致中心不突出。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:围绕中心，不旁生枝节
  type: Concept
  subject: 语文
  title: 围绕中心，不旁生枝节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写“我的老师”却大段写同学间的趣事，内容跑题。
    - 能指出并纠正这一错误：叙述事件时插入与主题无关的景物描写，如写考试却详写窗外景色。
  aliases: []
  category: 写作方法
  explanation: 行文时要围绕中心来写，不插入偏离中心的句子，使语段表意集中。
  misconceptions:
    - 写“我的老师”却大段写同学间的趣事，内容跑题。
    - 叙述事件时插入与主题无关的景物描写，如写考试却详写窗外景色。
    - 行文中任意发挥，想到一句话就写，脱离中心句。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:围绕话题发表看法
  type: Concept
  subject: 语文
  title: 围绕话题发表看法
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 和别人交流时，发言要紧扣讨论的话题，不跑题。还要认真听别人发言，判断他说的是不是和话题相关。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:国家公祭日
  type: Concept
  subject: 语文
  title: 国家公祭日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把国家公祭日日期写成9月30日，与烈士纪念日混淆
    - 能指出并纠正这一错误：认为国家公祭日是为庆祝抗战胜利而设立，忽略了悼念死难同胞的初衷
  aliases:
    - 南京大屠杀死难者国家公祭日
  category: 纪念日
  explanation: 为悼念南京大屠杀死难者设立的纪念日，中国以隆重公祭仪式悼念死难同胞。
  misconceptions:
    - 把国家公祭日日期写成9月30日，与烈士纪念日混淆
    - 认为国家公祭日是为庆祝抗战胜利而设立，忽略了悼念死难同胞的初衷
    - 把‘公祭’写成‘公忌’，如出现‘国家公忌日’的写法
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:国家公祭鼎
  type: Concept
  subject: 语文
  title: 国家公祭鼎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国家公祭鼎是古代文物，而不知是当代为铭记历史铸造的
    - 能指出并纠正这一错误：把国家公祭鼎位置说成在战场遗址或博物馆，而非侵华日军南京大屠杀遇难同胞纪念馆集会广场
  aliases:
    - 公祭鼎
  category: 文物
  explanation: 设立于侵华日军南京大屠杀遇难同胞纪念馆集会广场，铭文讲述南京大屠杀史实和设立国家公祭日的初衷。
  misconceptions:
    - 认为国家公祭鼎是古代文物，而不知是当代为铭记历史铸造的
    - 把国家公祭鼎位置说成在战场遗址或博物馆，而非侵华日军南京大屠杀遇难同胞纪念馆集会广场
    - 将鼎上铭文内容误认为是《和平宣言》，而不是史实和设立初衷
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:国民阅读状况调查
  type: Concept
  subject: 语文
  title: 国民阅读状况调查
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把国民阅读调查报告中的数据当成每个国民的真实情况，如认为人均读4本自己也要读4本。
    - 能指出并纠正这一错误：混淆“阅读率”和“阅读量”，把“有阅读行为的比例”错当成“人年均读书本数”。
  aliases:
    - 阅读调查
  category: 语文综合性学习
  explanation: 通过专业机构发布的调查数据，了解国民阅读状况，包括阅读率、阅读量等指标。
  misconceptions:
    - 把国民阅读调查报告中的数据当成每个国民的真实情况，如认为人均读4本自己也要读4本。
    - 混淆“阅读率”和“阅读量”，把“有阅读行为的比例”错当成“人年均读书本数”。
    - 误以为国民阅读调查数据来自政府普查，实际多为专业机构抽样发布，却忽略样本误差。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:国际主义精神
  type: Concept
  subject: 语文
  title: 国际主义精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国际主义就是外国人来中国援助，而中国援助外国不算国际主义
    - 能指出并纠正这一错误：把国际主义精神简单等同于跨国医疗救援，忽略无产阶级联合斗争的实质
  aliases:
    - 国际主义
  category: 精神品质
  explanation: 指资本主义国家的无产阶级要拥护殖民地半殖民地人民的解放斗争，殖民地半殖民地的无产阶级要拥护资本主义国家的无产阶级的解放斗争，世界革命才能胜利。白求恩同志实践了这一条列宁主义路线。
  misconceptions:
    - 认为国际主义就是外国人来中国援助，而中国援助外国不算国际主义
    - 把国际主义精神简单等同于跨国医疗救援，忽略无产阶级联合斗争的实质
    - 误以为国际主义与爱国主义对立，认为爱国就不可能支持别国解放
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:图书目录
  type: Concept
  subject: 语文
  title: 图书目录
  conceptType: 概念型
  aliases:
    - 目录
  category: 概念
  explanation: 目录在书的最前面，告诉我们书里主要写了什么、要读的内容从哪一页开始，能帮我们选感兴趣的内容来读。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:图案画与美术画
  type: Concept
  subject: 语文
  title: 图案画与美术画
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错误认为苏州园林讲究对称，属于图案画。
    - 能指出并纠正这一错误：把“美术画”理解为一幅画，而非园林美学风格。
  aliases: []
  category: 概念辨析
  explanation: 图案画讲究对称，美术画讲究自然之趣，苏州园林属于美术画。
  misconceptions:
    - 错误认为苏州园林讲究对称，属于图案画。
    - 把“美术画”理解为一幅画，而非园林美学风格。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:圆明园
  type: Concept
  subject: 语文
  title: 圆明园
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为圆明园是1860年八国联军焚毁，实际是英法联军。
    - 能指出并纠正这一错误：误以为圆明园是明朝所建，实际始建于清朝。
  aliases: []
  category: 历史
  explanation: 中国清代皇家园林，1860年被英法联军劫掠并焚毁，雨果在信中谴责了英法联军的暴行。
  misconceptions:
    - 误以为圆明园是1860年八国联军焚毁，实际是英法联军。
    - 误以为圆明园是明朝所建，实际始建于清朝。
    - 认为雨果写信是为了谴责法国，实际他谴责的是英法两国的劫掠行径。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:圈点勾画
  type: Concept
  subject: 语文
  title: 圈点勾画
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把圈点勾画当成整段抄写，在笔记本上重抄原文，费时且无益。
    - 能指出并纠正这一错误：在图书馆借来的书上随意划线，错误地以为能在公共书上做符号。
  aliases:
    - 勾画
    - 圈画
  category: 阅读方法
  explanation: 在阅读过程中用符号标记重要语句或内容，以帮助理解和记忆。
  misconceptions:
    - 把圈点勾画当成整段抄写，在笔记本上重抄原文，费时且无益。
    - 在图书馆借来的书上随意划线，错误地以为能在公共书上做符号。
    - 所有符号都用直线，不分重点、疑问、关键句，标记后无法区分。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:圈点批注
  type: Concept
  subject: 语文
  title: 圈点批注
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：圈点时随意画线，没有统一符号，批注只写“好”“妙”等空话
    - 能指出并纠正这一错误：把批注当成翻译，在空白处逐句译写，不加理解和评价
  aliases:
    - 圈点批注法
    - 圈点
    - 批注
  category: 阅读方法
  explanation: 在阅读时用符号标记重点，并在旁边写下自己的理解和感悟，是一种精读方法。
  misconceptions:
    - 圈点时随意画线，没有统一符号，批注只写“好”“妙”等空话
    - 把批注当成翻译，在空白处逐句译写，不加理解和评价
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:圣明
  type: Concept
  subject: 语文
  title: 圣明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘圣明’当形容词，解释为‘神圣英明’，而非代指皇帝
    - 能指出并纠正这一错误：把‘圣明’写成‘圣名’，混淆字形
  aliases:
    - 皇上
  category: 文学常识
  explanation: 指皇帝，古代对皇帝的尊称。
  misconceptions:
    - 误将‘圣明’当形容词，解释为‘神圣英明’，而非代指皇帝
    - 把‘圣明’写成‘圣名’，混淆字形
    - 认为‘圣明’是普通百姓的尊称，不知专指皇帝
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:在具体叙述中流露情感
  type: Concept
  subject: 语文
  title: 在具体叙述中流露情感
  conceptType: 概念型
  aliases:
    - 融情于事
  category: 方法
  explanation: 把情感融入具体的人、事或景物之中，在叙述中自然而然地流露出来。《那个星期天》通过写"跳房子""看着云彩走"等举动，表达了等待时焦急又兴奋的心情。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:在生活中识字
  type: Concept
  subject: 语文
  title: 在生活中识字
  conceptType: 程序型
  aliases:
    - 生活识字
  category: 方法
  explanation: 不只是课本，生活中到处都能认字。同学的名字卡片、写字本上，都可以认识新字，认得越多越开心。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:地名的拼音拼写
  type: Concept
  subject: 语文
  title: 地名的拼音拼写
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 路牌上的地名用拼音拼写，字母全部大写，专名和通名分写，如 FUXING LU。用拼音拼写名字时也按姓氏和名分开写。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:场面
  type: Concept
  subject: 语文
  title: 场面
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把戏曲“场面”当成舞台布景或热闹场景
    - 能指出并纠正这一错误：将“场面”误读为cháng，与“场院”混同
  aliases: []
  category: 文化常识
  explanation: 指戏曲演出时伴奏的人员与乐器。
  misconceptions:
    - 把戏曲“场面”当成舞台布景或热闹场景
    - 将“场面”误读为cháng，与“场院”混同
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:坍塌
  type: Concept
  subject: 语文
  title: 坍塌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘坍’读作dān，与‘丹’混淆，正确为tān。
    - 能指出并纠正这一错误：将‘坍塌’误写为‘摊塌’或‘瘫塌’。
  aliases: []
  category: 词语
  explanation: 倒塌，崩塌。
  misconceptions:
    - 把‘坍’读作dān，与‘丹’混淆，正确为tān。
    - 将‘坍塌’误写为‘摊塌’或‘瘫塌’。
    - 误用‘坍塌’形容抽象信心，如‘信心坍塌’应说‘崩溃’。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:堂头
  type: Concept
  subject: 语文
  title: 堂头
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“堂头”是堂倌的头头或大堂顶部
    - 能指出并纠正这一错误：把“堂”写成“膛”，写作“膛头”
  aliases: []
  category: 文化常识
  explanation: 主要负责迎客座、介绍饭菜、送菜斟酒、口算结账等。
  misconceptions:
    - 误认为“堂头”是堂倌的头头或大堂顶部
    - 把“堂”写成“膛”，写作“膛头”
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:堆房
  type: Concept
  subject: 语文
  title: 堆房
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“堆房”当动词，如“把杂物堆房在角落”
    - 能指出并纠正这一错误：与“库房”混用，忽略其存储杂物的临时性
  aliases: []
  category: 文化常识
  explanation: 贮藏杂物或货物的房间。
  misconceptions:
    - 误将“堆房”当动词，如“把杂物堆房在角落”
    - 与“库房”混用，忽略其存储杂物的临时性
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:士别三日
  type: Concept
  subject: 语文
  title: 士别三日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“士”写成“土”，如“土别三日”。
    - 能指出并纠正这一错误：误以为“士”指士兵，说“士兵分别三天”。
  aliases: []
  category: 成语
  explanation: 指分别一段时间后，要用新的眼光看待，出自本文。
  misconceptions:
    - 把“士”写成“土”，如“土别三日”。
    - 误以为“士”指士兵，说“士兵分别三天”。
    - 把“三日”理解成确指三天，忽略泛指时间短。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:声旁表音
  type: Concept
  subject: 语文
  title: 声旁表音
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: “包”加上不同的偏旁，变成饱、泡、跑、袍、炮，读音都和“包”差不多。这样的部件能提示字的读音。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:声母和韵母相拼
  type: Concept
  subject: 语文
  title: 声母和韵母相拼
  conceptType: 程序型
  aliases:
    - 两拼音节
  category: 方法
  explanation: 把声母和韵母连在一起快快读，就能拼出一个音节，比如 b 和 a 相拼就读 ba。前声母轻短，后韵母响亮，两音相连猛一碰。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:声调
  type: Concept
  subject: 语文
  title: 声调
  conceptType: 概念型
  aliases:
    - 四声
  category: 概念
  explanation: 读音的高低升降叫声调，普通话有四个声调，就像小汽车走平路、上坡、下坡再上坡、下坡。同一个字母加上不同的声调符号，读音和意思就不一样。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:壶口瀑布
  type: Concept
  subject: 语文
  title: 壶口瀑布
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为壶口瀑布在长江上，实际在黄河中游。
    - 能指出并纠正这一错误：把'秦晋大峡谷'误写为'秦豫大峡谷'。
  aliases:
    - 壶口
  category: 地理景观
  explanation: 位于黄河中游秦晋大峡谷，河床狭窄如壶口，河水急跌而下，形成壮观瀑布。
  misconceptions:
    - 误以为壶口瀑布在长江上，实际在黄河中游。
    - 把'秦晋大峡谷'误写为'秦豫大峡谷'。
    - 误以为壶口瀑布是因河床断裂形成，实际是河床狭窄如壶口。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:复句
  type: Concept
  subject: 语文
  title: 复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到逗号就判为复句，如“我喜欢苹果、香蕉”只是并列宾语，实为单句。
    - 能指出并纠正这一错误：认为复句必须有关系词，把“你过来，我有话对你说”误判为单句，实为承接复句。
  aliases: []
  category: 语法
  explanation: 由两个或两个以上的单句（分句）按照某种逻辑联系组合在一起的复杂句子。
  misconceptions:
    - 看到逗号就判为复句，如“我喜欢苹果、香蕉”只是并列宾语，实为单句。
    - 认为复句必须有关系词，把“你过来，我有话对你说”误判为单句，实为承接复句。
    - 把“他一边开车一边打电话”当作单句，认为只有一个主语就不是复句。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:复述课文
  type: Concept
  subject: 语文
  title: 复述课文
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：复述时直接背诵原文，没有转换成自己的语言，不符合‘复述’要求。
    - 能指出并纠正这一错误：复述时加入原文没有的细节，如‘卖油翁大笑’等，改变故事情节。
  aliases: []
  category: 阅读方法
  explanation: 复述课文要求既贴近原文又生动形象，需要把握故事情节和人物对话，用自己的话重新表述。
  misconceptions:
    - 复述时直接背诵原文，没有转换成自己的语言，不符合‘复述’要求。
    - 复述时加入原文没有的细节，如‘卖油翁大笑’等，改变故事情节。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:复韵母
  type: Concept
  subject: 语文
  title: 复韵母
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 由两个字母合在一起发一个音的韵母叫复韵母，比如 ai、ei、ui。读的时候前一个字母的音滑到后一个字母，一口气读出来。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:夏洛蒂·勃朗特
  type: Concept
  subject: 语文
  title: 夏洛蒂·勃朗特
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《简·爱》作者误记为艾米莉·勃朗特，实际是夏洛蒂。
    - 能指出并纠正这一错误：把“夏洛蒂”写成“夏洛地”或“夏洛特”。
  aliases: []
  category: 文学常识
  explanation: 英国作家，勃朗特三姐妹之一，《简·爱》作者。
  misconceptions:
    - 将《简·爱》作者误记为艾米莉·勃朗特，实际是夏洛蒂。
    - 把“夏洛蒂”写成“夏洛地”或“夏洛特”。
    - 误认为夏洛蒂·勃朗特是法国作家，实际是英国作家。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:夏目漱石
  type: Concept
  subject: 语文
  title: 夏目漱石
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“漱”写成“嗽”或“溂”。
    - 能指出并纠正这一错误：误以为《我是猫》作者是芥川龙之介或太宰治。
  aliases: []
  category: 文学常识
  explanation: 日本作家，《我是猫》作者，以猫眼看世界。
  misconceptions:
    - 将“漱”写成“嗽”或“溂”。
    - 误以为《我是猫》作者是芥川龙之介或太宰治。
    - 把夏目漱石当成中国作家，实际是日本作家。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:外交辞令
  type: Concept
  subject: 语文
  title: 外交辞令
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为外交辞令就是花言巧语、欺骗对方，忽略其有理有节。
    - 能指出并纠正这一错误：将“辞令”写成“词令”，或误以为外交部的命令。
  aliases: []
  category: 语言艺术
  explanation: 外交场合使用的委婉而有力的言辞，唐雎的语言有理有节。
  misconceptions:
    - 认为外交辞令就是花言巧语、欺骗对方，忽略其有理有节。
    - 将“辞令”写成“词令”，或误以为外交部的命令。
    - 误以为只有现代外交官才使用外交辞令，古代没有。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:外国小说阅读方法
  type: Concept
  subject: 语文
  title: 外国小说阅读方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看情节，忽略创作背景，导致理解偏差。
    - 能指出并纠正这一错误：忽略叙事角度，误把“我”当作作者本人。
  aliases:
    - 阅读外国小说
  category: 阅读方法
  explanation: 阅读外国小说需关注创作背景、文化内涵、叙事角度和语言特点。
  misconceptions:
    - 只看情节，忽略创作背景，导致理解偏差。
    - 忽略叙事角度，误把“我”当作作者本人。
    - 不关注文化内涵，用中国文化观念硬套外国小说。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:外貌描写
  type: Concept
  subject: 语文
  title: 外貌描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：从头到脚一笔笔罗列，如“黑头发、大眼睛、高鼻子、小嘴巴”，无主次，像写户口本。
    - 能指出并纠正这一错误：外貌与性格断裂，如写“他戴眼镜”却不体现“文气”，外貌只是装饰，不服务人物。
  aliases:
    - 肖像描写
  category: 写作方法
  explanation: 通过描写人物的五官、头发、脸色、神情、穿着等外在特征来表现人物，要抓住独特之处。
  misconceptions:
    - 从头到脚一笔笔罗列，如“黑头发、大眼睛、高鼻子、小嘴巴”，无主次，像写户口本。
    - 外貌与性格断裂，如写“他戴眼镜”却不体现“文气”，外貌只是装饰，不服务人物。
    - 用词单调重复，如所有人物都用“圆脸”“乌黑发亮”，近义词误用，分不清“慈祥”和“和蔼”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:多义词
  type: Concept
  subject: 语文
  title: 多义词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到“他的嘴真甜”中的“甜”只想到糖的味道，不懂“甜”此处是“动听”的引申义。
    - 能指出并纠正这一错误：将“意思”的多个义项混为一谈，认为“有意思”就是“有意义”，不懂“趣味”义。
  aliases: []
  category: 词汇知识
  explanation: 多义词是指有两个以上意义的词，其意义之间往往有联系，包括本义、引申义和比喻义。
  misconceptions:
    - 看到“他的嘴真甜”中的“甜”只想到糖的味道，不懂“甜”此处是“动听”的引申义。
    - 将“意思”的多个义项混为一谈，认为“有意思”就是“有意义”，不懂“趣味”义。
    - 忽略语境，把“思想包袱”中的“包袱”解释为包裹，忘记其“负担”的比喻义。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:多件事文章的主要内容
  type: Concept
  subject: 语文
  title: 多件事文章的主要内容
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 有的文章写了不止一件事。先弄清每件事讲了什么，再把几件事连起来，就能把握文章的主要内容。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C8/sections/S2.md
- id: concept:语文:多余的人
  type: Concept
  subject: 语文
  title: 多余的人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“多余的人”理解为没用的废物，实际是特定知识分子形象。
    - 能指出并纠正这一错误：把“多余的人”与“小人物”混淆，如将巴什马奇金看作“多余的人”。
  aliases:
    - 多余人
  category: 文学概念
  explanation: 指19世纪俄国文学中一类对现实不满、无力反抗、自命清高却无所事事的知识分子形象。
  misconceptions:
    - 将“多余的人”理解为没用的废物，实际是特定知识分子形象。
    - 把“多余的人”与“小人物”混淆，如将巴什马奇金看作“多余的人”。
    - 误认为“多余的人”仅指奥勃洛摩夫，实际上还有毕巧林、罗亭等。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:多感官互通
  type: Concept
  subject: 语文
  title: 多感官互通
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“她的笑声像银铃”判为通感，实际这是比喻，通感需将不同感官感觉直接沟通，如“她的笑很甜”
    - 能指出并纠正这一错误：误把多种感官描写同时出现当通感，如“眼前有美景，耳边有鸟鸣”只是感官并用，没有感觉互换
  aliases:
    - 通感
  category: 写作手法
  explanation: 将视觉、听觉、嗅觉等多种感官的描写相互沟通，增强表现力，如“香气似乎也是浅紫色的”。
  misconceptions:
    - 将“她的笑声像银铃”判为通感，实际这是比喻，通感需将不同感官感觉直接沟通，如“她的笑很甜”
    - 误把多种感官描写同时出现当通感，如“眼前有美景，耳边有鸟鸣”只是感官并用，没有感觉互换
    - 认为通感必须出现“仿佛”“好像”等词，其实通感往往是直接移用，如“沉闷的红色”
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:多感官描写
  type: Concept
  subject: 语文
  title: 多感官描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：描写花园只写“红的桃花、白的梨花”，没有嗅觉和触觉，如忽略花香和花瓣的柔软。
    - 能指出并纠正这一错误：机械罗列感官词，如“看到了…听到了…闻到了…”却无真实细节，像“看到风、听到光”般不合逻辑。
  aliases:
    - 感官描写
  category: 写作方法
  explanation: 描写景物时不仅描述视觉感受，还可调动听觉、嗅觉、触觉等多种感官，使景物描写更加生动形象。
  misconceptions:
    - 描写花园只写“红的桃花、白的梨花”，没有嗅觉和触觉，如忽略花香和花瓣的柔软。
    - 机械罗列感官词，如“看到了…听到了…闻到了…”却无真实细节，像“看到风、听到光”般不合逻辑。
    - 认为多感官就是越多越好，把想象当视觉，如“看到鸟鸣”混淆听觉和视觉。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:多感官观察
  type: Concept
  subject: 语文
  title: 多感官观察
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 观察时可以用眼睛看、耳朵听、手摸、鼻子闻，有时还可以尝一尝，这样对事物的了解才全面。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:多角度观察与描写
  type: Concept
  subject: 语文
  title: 多角度观察与描写
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：描写山景只写“远望雄伟”，没有俯视或仰视视角，如站在山脚却写“俯瞰山谷”导致角度矛盾。
    - 能指出并纠正这一错误：角度变化但景物无变化，如“从左边看是树，从右边看也是树”，没有突出不同角度的特点。
  aliases:
    - 多角度描写
  category: 写作方法
  explanation: 从俯视、仰视、近观、远望等不同角度，以及静态、动态、不同时段等不同方面描写景物，使景物更加丰满。
  misconceptions:
    - 描写山景只写“远望雄伟”，没有俯视或仰视视角，如站在山脚却写“俯瞰山谷”导致角度矛盾。
    - 角度变化但景物无变化，如“从左边看是树，从右边看也是树”，没有突出不同角度的特点。
    - 写动态景物却用静态词，如把飞瀑写成“挂着的白布”，忽略其流动和声响。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:多音字
  type: Concept
  subject: 语文
  title: 多音字
  conceptType: 概念型
  aliases:
    - 一字多音
  category: 概念
  explanation: 一个字有几个不同的读音，在不同的词语里读不同的音，比如种葡萄读 zhòng、好客读 hào、水分读 fèn。要根据词语的意思来定读音。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:大丈夫
  type: Concept
  subject: 语文
  title: 大丈夫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“大丈夫”等同于有权势或有财富的人
    - 能指出并纠正这一错误：把“富贵不能淫”的“淫”误解为淫乱、好色
  aliases: []
  category: 概念
  explanation: 孟子认为大丈夫应居仁、立礼、行义，富贵不能乱其心，贫贱不能改其志，威武不能屈其节。
  misconceptions:
    - 把“大丈夫”等同于有权势或有财富的人
    - 把“富贵不能淫”的“淫”误解为淫乱、好色
    - 认为大丈夫必须成就一番大事业，忽视坚守道义
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:大同社会
  type: Concept
  subject: 语文
  title: 大同社会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“大同社会”是道家理想，实际是儒家提出的社会形态。
    - 能指出并纠正这一错误：写“天下为公”误为“天下为功”，或认为大同社会在历史上真实存在过。
  aliases:
    - 大同
  category: 思想观念
  explanation: 儒家理想中的社会形态，天下为公，选贤与能，讲信修睦，人人各得其所。
  misconceptions:
    - 认为“大同社会”是道家理想，实际是儒家提出的社会形态。
    - 写“天下为公”误为“天下为功”，或认为大同社会在历史上真实存在过。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:大善与大恶
  type: Concept
  subject: 语文
  title: 大善与大恶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把对个人有利当成大善，如“升官发财就是大善”。
    - 能指出并纠正这一错误：将帮同学捡文具等小事误认作大善。
  aliases: []
  category: 概念界定
  explanation: 凡对国家、人民、人类发展前途有利的是大善，反之是大恶。
  misconceptions:
    - 把对个人有利当成大善，如“升官发财就是大善”。
    - 将帮同学捡文具等小事误认作大善。
    - 把“大善”等同于“大善人”，认为只有慈善家才行大善。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:大小善恶的联系
  type: Concept
  subject: 语文
  title: 大小善恶的联系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为小善必然积累成大善，如“每天扫一次地就是大善”。
    - 能指出并纠正这一错误：觉得大小善恶互不相干，小贪不是大贪。
  aliases: []
  category: 论证方法
  explanation: 大小善恶之间常有联系，小恶可能发展为大恶，如贪污由小恶演变为大恶。
  misconceptions:
    - 认为小善必然积累成大善，如“每天扫一次地就是大善”。
    - 觉得大小善恶互不相干，小贪不是大贪。
    - 忽视从量变到质变的条件，认为“贪污一点没关系”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:大泽乡起义
  type: Concept
  subject: 语文
  title: 大泽乡起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为起义领导者是刘邦、项羽，实际是陈胜、吴广。
    - 能指出并纠正这一错误：将“大泽乡”写成“大择乡”或“大泽香”。
  aliases:
    - 陈胜吴广起义
  category: 历史事件
  explanation: 秦末陈胜、吴广发动的农民起义，揭开了秦末农民战争的序幕。
  misconceptions:
    - 误认为起义领导者是刘邦、项羽，实际是陈胜、吴广。
    - 将“大泽乡”写成“大择乡”或“大泽香”。
    - 误认为起义发生在西汉初年，实际是秦末。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:大碰撞说
  type: Concept
  subject: 语文
  title: 大碰撞说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为大碰撞说已证实，实际仍是假说。
    - 能指出并纠正这一错误：把大碰撞说当成月球分裂出去形成的，与分裂说混淆。
  aliases:
    - 撞击说
  category: 天文学假说
  explanation: 认为月球是由一个火星大小的天体与早期地球碰撞后抛出的物质凝聚而成，是目前较主流的假说。
  misconceptions:
    - 误以为大碰撞说已证实，实际仍是假说。
    - 把大碰撞说当成月球分裂出去形成的，与分裂说混淆。
    - 认为碰撞后抛出的物质直接成月球，忽略凝聚过程。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:大观园
  type: Concept
  subject: 语文
  title: 大观园
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把大观园当成《水浒传》中梁山泊的园林，与本节《智取生辰纲》背景混淆。
    - 能指出并纠正这一错误：误以为大观园是皇家园林，不知它是贾府私园。
  aliases: []
  category: 文学常识
  explanation: 《红楼梦》中贾府为元妃省亲而建的园林，是主要人物活动场所。
  misconceptions:
    - 把大观园当成《水浒传》中梁山泊的园林，与本节《智取生辰纲》背景混淆。
    - 误以为大观园是皇家园林，不知它是贾府私园。
    - 将“园”误写为“圆”，如“大观圆”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:大陆漂移说
  type: Concept
  subject: 语文
  title: 大陆漂移说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将大陆漂移说与板块构造学说混为一谈，忽略前者仅指大陆移动。
    - 能指出并纠正这一错误：误认为大陆像船一样在海洋表面漂移，而非岩石圈板块运动。
  aliases:
    - 板块构造理论
  category: 地质学理论
  explanation: 地壳由缓慢运动的大板块构成，大陆随板块运动而漂移，解释了恐龙化石分布等地质现象。
  misconceptions:
    - 将大陆漂移说与板块构造学说混为一谈，忽略前者仅指大陆移动。
    - 误认为大陆像船一样在海洋表面漂移，而非岩石圈板块运动。
    - 认为大陆漂移说能解释所有地质现象，实际后来被板块构造说补充。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:大革命
  type: Concept
  subject: 语文
  title: 大革命
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“大革命”等同“辛亥革命”，错在时间与性质。
    - 能指出并纠正这一错误：误认为大革命是中国共产党独立领导，忽略国共第一次合作。
  aliases: []
  category: 词语
  explanation: 指1924年到1927年的第一次国内革命战争。
  misconceptions:
    - 把“大革命”等同“辛亥革命”，错在时间与性质。
    - 误认为大革命是中国共产党独立领导，忽略国共第一次合作。
    - 记混时间，认为大革命是1927—1937年的土地革命。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:天净沙·秋思
  type: Concept
  subject: 语文
  title: 天净沙·秋思
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“秋思”当作曲牌名，其实“天净沙”才是曲牌名。
    - 能指出并纠正这一错误：认为“小桥流水人家”传达温馨快乐，忽略其以乐景衬哀情的反衬手法。
  aliases: []
  category: 诗歌内容
  explanation: 马致远的《天净沙·秋思》是一首元曲小令，通过景物组合营造出萧瑟悲凉的氛围，抒发游子思乡之情。
  misconceptions:
    - 误把“秋思”当作曲牌名，其实“天净沙”才是曲牌名。
    - 认为“小桥流水人家”传达温馨快乐，忽略其以乐景衬哀情的反衬手法。
    - 把“断肠人在天涯”理解为诗人思念妻子，未点出游子思乡之愁。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:天府之土
  type: Concept
  subject: 语文
  title: 天府之土
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：望文生义，认为“天府之土”是指天上的神仙土地，而非四川等肥沃地区。
    - 能指出并纠正这一错误：把“天府”和“天朝”混淆，误指朝廷统治区域。
  aliases: []
  category: 文言词语
  explanation: 指土地肥沃、物产丰富的地区，常指四川。
  misconceptions:
    - 望文生义，认为“天府之土”是指天上的神仙土地，而非四川等肥沃地区。
    - 把“天府”和“天朝”混淆，误指朝廷统治区域。
    - 将“土”误写为“地”，写作“天府之地”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:天时不如地利，地利不如人和
  type: Concept
  subject: 语文
  title: 天时不如地利，地利不如人和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三者的关系理解成“天时>地利>人和”，实际是人和最重要
    - 能指出并纠正这一错误：认为这句话只讲战争，不适用于其他领域
  aliases: []
  category: 观点
  explanation: 在战争中，有利的时机不如有利的地势，有利的地势不如人心所向、内部团结。
  misconceptions:
    - 把三者的关系理解成“天时>地利>人和”，实际是人和最重要
    - 认为这句话只讲战争，不适用于其他领域
    - 把“人和”解释为人与人之间和气，而非民心归附、上下团结
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:天然的指南针
  type: Concept
  subject: 语文
  title: 天然的指南针
  conceptType: 概念型
  aliases:
    - 大自然的指南针
  category: 概念
  explanation: 大自然里有很多帮忙辨别方向的东西：中午太阳在南边、树影指着北方；北极星高挂在北方；大树枝叶稠的南面、稀的北面；沟渠里化得快的那边是北。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:太学
  type: Concept
  subject: 语文
  title: 太学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“太学”写成“大学”，忽略古代最高学府的含义。
    - 能指出并纠正这一错误：认为太学是地方学校，或与私塾混为一谈。
  aliases:
    - 国子监
  category: 古代制度
  explanation: 古代最高学府，明代称国子监，本文指明代中央官学。
  misconceptions:
    - 把“太学”写成“大学”，忽略古代最高学府的含义。
    - 认为太学是地方学校，或与私塾混为一谈。
    - 记错朝代，以为太学始于宋代，其实汉代已有。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:太常引·建康中秋夜为吕叔潜赋·辛弃疾
  type: Concept
  subject: 语文
  title: 太常引·建康中秋夜为吕叔潜赋·辛弃疾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把词牌名“太常引”误认为题目，或省略题目直接说“太常引”。
    - 能指出并纠正这一错误：张冠李戴：以为是苏轼所作，或误写为“辛弃疾《水调歌头》”。
  aliases:
    - 太常引
  category: 古诗词
  explanation: 辛弃疾词作，借中秋明月，抒发对山河沦陷的感慨和收复失地的愿望。
  misconceptions:
    - 把词牌名“太常引”误认为题目，或省略题目直接说“太常引”。
    - 张冠李戴：以为是苏轼所作，或误写为“辛弃疾《水调歌头》”。
    - 认为这首词表达中秋团圆之乐，忽视山河沦陷的悲愤。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:失重
  type: Concept
  subject: 语文
  title: 失重
  conceptType: 概念型
  aliases:
    - 失重状态
  category: 现象
  explanation: 在太空里东西不会往下掉，水也不会往下流，人一不留神就会飘起来。所以航天员要睡在固定好的睡袋里，喝水要用带吸管的饮水袋。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:夸张
  type: Concept
  subject: 语文
  title: 夸张
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“他跑得像飞一样”误判为比喻，实际是夸张，因为飞不可能是真实动作。
    - 能指出并纠正这一错误：看到“白发三千丈”就认为是在写实，没有意识到这是故意夸大的修辞。
  aliases: []
  category: 修辞手法
  explanation: 夸张是故意言过其实，对人或事物作扩大或缩小的描述，以强调或突出某一方面特点的修辞手法。
  misconceptions:
    - 把“他跑得像飞一样”误判为比喻，实际是夸张，因为飞不可能是真实动作。
    - 看到“白发三千丈”就认为是在写实，没有意识到这是故意夸大的修辞。
    - 将“教室里静得连针掉地都能听见”理解为对事实的陈述，忽略了其强调效果的夸张本质。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:夸张手法
  type: Concept
  subject: 语文
  title: 夸张手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把夸张当成比喻，如认为“他的说法太夸张”就是修辞手法。
    - 能指出并纠正这一错误：认为夸张可以不分场合乱用，忽略其增强讽刺效果的目的。
  aliases: []
  category: 写作手法
  explanation: 通过夸大人物言行或情节来增强讽刺效果，如奥楚蔑洛夫态度的急剧转变和语言的夸张。
  misconceptions:
    - 误把夸张当成比喻，如认为“他的说法太夸张”就是修辞手法。
    - 认为夸张可以不分场合乱用，忽略其增强讽刺效果的目的。
    - 将“夸张”与“夸大”等同，认为就是说话不真实。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:夸父逐日
  type: Concept
  subject: 语文
  title: 夸父逐日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把夸父逐日当成真实历史事件，认为古代真有巨人追太阳。
    - 能指出并纠正这一错误：说夸父自不量力，是反面典型，忽略其执着追求理想的精神。
  aliases:
    - 夸父追日
  category: 文学意象
  explanation: 夸父逐日是中国古代神话，在文中象征执着追求理想、不惜牺牲的精神。
  misconceptions:
    - 把夸父逐日当成真实历史事件，认为古代真有巨人追太阳。
    - 说夸父自不量力，是反面典型，忽略其执着追求理想的精神。
    - 把“逐日”写成“追日”，或与“精卫填海”“愚公移山”的精神混为一谈。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:契诃夫
  type: Concept
  subject: 语文
  title: 契诃夫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把契诃夫当成法国作家，与莫泊桑国籍混淆。
    - 能指出并纠正这一错误：写错为‘契可夫’或‘契柯夫’，忽略‘诃’字字形。
  aliases: []
  category: 文学常识
  explanation: 俄国作家，世界短篇小说之王，作品描绘19世纪俄国社会众生相。
  misconceptions:
    - 把契诃夫当成法国作家，与莫泊桑国籍混淆。
    - 写错为‘契可夫’或‘契柯夫’，忽略‘诃’字字形。
    - 认为《变色龙》是欧·亨利写的，张冠李戴。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:奥本海默
  type: Concept
  subject: 语文
  title: 奥本海默
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把奥本海默当成中国科学家。
    - 能指出并纠正这一错误：与苏联科学家库尔恰托夫张冠李戴。
  aliases: []
  category: 人物
  explanation: 美国原子弹设计的领导人，性格锋芒毕露，与邓稼先形成鲜明对比。
  misconceptions:
    - 误把奥本海默当成中国科学家。
    - 与苏联科学家库尔恰托夫张冠李戴。
    - 误将'奥本海默'的'默'写成'墨'。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:奥楚蔑洛夫
  type: Concept
  subject: 语文
  title: 奥楚蔑洛夫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“奥楚蔑洛夫”写成“奥楚梅洛夫”，出现字形和读音错误。
    - 能指出并纠正这一错误：认为他最后坚持公正，实际他见风使舵、趋炎附势。
  aliases:
    - 警官奥楚蔑洛夫
  category: 文学形象
  explanation: 契诃夫小说《变色龙》中的警官，见风使舵、趋炎附势，是沙俄专制统治下奴才形象的典型代表。
  misconceptions:
    - 误把“奥楚蔑洛夫”写成“奥楚梅洛夫”，出现字形和读音错误。
    - 认为他最后坚持公正，实际他见风使舵、趋炎附势。
    - 把“奥楚蔑洛夫”当作一条狗的名字，忽略他是警官。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:女娲造人
  type: Concept
  subject: 语文
  title: 女娲造人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把女娲造人说成用泥捏了所有人，忽略后用藤条蘸泥浆甩出人的情节
    - 能指出并纠正这一错误：误将‘女娲造人’与《圣经》中的上帝造人混为一谈
  aliases:
    - 女娲抟土造人
  category: 神话故事
  explanation: 中国上古神话，讲述女娲用黄泥造人并建立婚姻制度，解释人类起源。
  misconceptions:
    - 把女娲造人说成用泥捏了所有人，忽略后用藤条蘸泥浆甩出人的情节
    - 误将‘女娲造人’与《圣经》中的上帝造人混为一谈
    - 认为女娲造人是为了统治世界，而非源于寂寞和孤独
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:好收吾骨瘴江边
  type: Concept
  subject: 语文
  title: 好收吾骨瘴江边
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘好’读作hào，解释为‘喜欢’或‘爱好’
    - 能指出并纠正这一错误：将‘收吾骨’误解为‘收我的骨头’，忘记‘收殓’之意
  aliases: []
  category: 诗句理解
  explanation: 意为在瘴气弥漫的江边收殓我的尸骨，表达沉痛凄凉之情。
  misconceptions:
    - 误把‘好’读作hào，解释为‘喜欢’或‘爱好’
    - 将‘收吾骨’误解为‘收我的骨头’，忘记‘收殓’之意
    - 误写‘瘴’为‘漳’，把‘瘴江’当成地名‘漳江’
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:如梦令
  type: Concept
  subject: 语文
  title: 如梦令
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“如梦令”当作诗题，导致赏析时答非所问。
    - 能指出并纠正这一错误：认为词中“溪亭”写的是秋天，实际是夏日傍晚。
  aliases: []
  category: 词牌名
  explanation: 词牌名，李清照回忆溪亭游玩之作。
  misconceptions:
    - 误把“如梦令”当作诗题，导致赏析时答非所问。
    - 认为词中“溪亭”写的是秋天，实际是夏日傍晚。
    - 默写时将“争渡”误写成“争度”或“争镀”。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:如雷贯耳
  type: Concept
  subject: 语文
  title: 如雷贯耳
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“如雷贯耳”误解为雷声很大震耳朵，实际指名声大。
    - 能指出并纠正这一错误：将“贯”误写为“灌”，写成“如雷灌耳”。
  aliases: []
  category: 成语
  explanation: 形容名声很大，像雷声传入耳朵一样。
  misconceptions:
    - 把“如雷贯耳”误解为雷声很大震耳朵，实际指名声大。
    - 将“贯”误写为“灌”，写成“如雷灌耳”。
    - 误用为形容人说话声音响亮，如“他的声音如雷贯耳”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:妇孺皆知
  type: Concept
  subject: 语文
  title: 妇孺皆知
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'孺'误写为'儒'，写成'妇儒皆知'。
    - 能指出并纠正这一错误：误用为'所有人都知道'，忽略了'妇孺'限定的范围。
  aliases: []
  category: 成语
  explanation: 妇女和小孩都知道，指某件事物众所周知，流传得很广。
  misconceptions:
    - 把'孺'误写为'儒'，写成'妇儒皆知'。
    - 误用为'所有人都知道'，忽略了'妇孺'限定的范围。
    - 与'家喻户晓'混用，未区分前者侧重老幼皆知。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:妯娌
  type: Concept
  subject: 语文
  title: 妯娌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“妯娌”误写成“轴理”或“妯俚”，形近、音近致误。
    - 能指出并纠正这一错误：误以为“妯娌”指姐妹关系，实际指哥哥妻子和弟弟妻子的合称。
  aliases: []
  category: 词语
  explanation: 哥哥妻子和弟弟妻子的合称。
  misconceptions:
    - 把“妯娌”误写成“轴理”或“妯俚”，形近、音近致误。
    - 误以为“妯娌”指姐妹关系，实际指哥哥妻子和弟弟妻子的合称。
    - 读错“妯”的读音，常误读为yóu，正确应为zhóu。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:委实
  type: Concept
  subject: 语文
  title: 委实
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写“委实”为“萎实”。
    - 能指出并纠正这一错误：误作形容词，如“这事很委实”。
  aliases: []
  category: 词语
  explanation: 确实，实在。
  misconceptions:
    - 误写“委实”为“萎实”。
    - 误作形容词，如“这事很委实”。
    - 与“属实”混用，如“情况委实属实”重复。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:姮娥奔月
  type: Concept
  subject: 语文
  title: 姮娥奔月
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“姮娥”写成“嫦娥”或“恒娥”，不知避汉文帝刘恒讳。
    - 能指出并纠正这一错误：只讲嫦娥偷灵药的故事，忽略课文中对理想追求与月光寒冷的思考。
  aliases:
    - 嫦娥奔月
  category: 文学意象
  explanation: 姮娥奔月是中国古代神话，在文中象征对美好理想的追求，也引发对月光寒冷的思考。
  misconceptions:
    - 把“姮娥”写成“嫦娥”或“恒娥”，不知避汉文帝刘恒讳。
    - 只讲嫦娥偷灵药的故事，忽略课文中对理想追求与月光寒冷的思考。
    - 误以为姮娥就是月亮上的仙女，与吴刚、玉兔的角色混淆。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:娴熟
  type: Concept
  subject: 语文
  title: 娴熟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“娴熟”与“熟悉”混用，如“他对这条路很娴熟”应改为“熟悉”
    - 能指出并纠正这一错误：把“娴”写成“闲”或“贤”，写成“闲熟”“贤熟”
  aliases: []
  category: 词语
  explanation: 熟练。文中形容辽宁舰官兵操纵航空母舰的技术熟练。
  misconceptions:
    - 将“娴熟”与“熟悉”混用，如“他对这条路很娴熟”应改为“熟悉”
    - 把“娴”写成“闲”或“贤”，写成“闲熟”“贤熟”
    - 误认为“娴熟”形容不熟练，写出“他的操作还很娴熟”这类相反句子
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:婉约派
  type: Concept
  subject: 语文
  title: 婉约派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为婉约派只写闺情，忽略其家国忧思。
    - 能指出并纠正这一错误：将苏轼、辛弃疾归为婉约派，混淆流派归属。
  aliases: []
  category: 文学流派
  explanation: 宋词流派，风格婉约细腻，代表词人有晏殊、欧阳修、李清照等。
  misconceptions:
    - 以为婉约派只写闺情，忽略其家国忧思。
    - 将苏轼、辛弃疾归为婉约派，混淆流派归属。
    - 认定李清照是豪放派词人，与婉约派划清界限。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:婵娟
  type: Concept
  subject: 语文
  title: 婵娟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘婵娟’理解为‘女子’或‘美女’，不知此处指月亮
    - 能指出并纠正这一错误：把‘婵娟’写作‘蝉娟’，‘婵’误加偏旁
  aliases: []
  category: 词语理解
  explanation: 本义指妇女姿态美好的样子，这里指月亮。
  misconceptions:
    - 误将‘婵娟’理解为‘女子’或‘美女’，不知此处指月亮
    - 把‘婵娟’写作‘蝉娟’，‘婵’误加偏旁
    - 误以为‘婵娟’指太阳，与‘日月’混淆
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:子由
  type: Concept
  subject: 语文
  title: 子由
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘子由’当作苏轼的字，实际苏轼字子瞻
    - 能指出并纠正这一错误：将‘子由’指认为苏洵，误记父子辈分
  aliases: []
  category: 人物称谓
  explanation: 苏轼的弟弟苏辙，字子由。
  misconceptions:
    - 误把‘子由’当作苏轼的字，实际苏轼字子瞻
    - 将‘子由’指认为苏洵，误记父子辈分
    - 把‘子由’写成‘子猷’，混淆王徽之的字
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:孔子
  type: Concept
  subject: 语文
  title: 孔子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记孔子为战国末期人，其生活于春秋末期
    - 能指出并纠正这一错误：把孔子的字‘仲尼’误写成‘伯尼’，或与孟子的字混淆
  aliases:
    - 孔丘
    - 仲尼
  category: 文学常识
  explanation: 名丘，字仲尼，春秋末期思想家、政治家、教育家，儒家学派创始人，被尊为“至圣先师”。
  misconceptions:
    - 误记孔子为战国末期人，其生活于春秋末期
    - 把孔子的字‘仲尼’误写成‘伯尼’，或与孟子的字混淆
    - 将孔子尊号‘至圣先师’误记为‘亚圣’，‘亚圣’实指孟子
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:孙悟空
  type: Concept
  subject: 语文
  title: 孙悟空
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将孙悟空称为“小圣”，把二郎神称为“大圣”。
    - 能指出并纠正这一错误：把孙悟空的兵器说成九齿钉耙，猪八戒的武器记成金箍棒。
  aliases:
    - 齐天大圣
    - 美猴王
  category: 文学常识
  explanation: 孙悟空是《西游记》中的主要人物，又称“大圣”，具有神通广大的本领。
  misconceptions:
    - 误将孙悟空称为“小圣”，把二郎神称为“大圣”。
    - 把孙悟空的兵器说成九齿钉耙，猪八戒的武器记成金箍棒。
    - 误认为孙悟空由普通猴子修炼成精，忽略仙石所生。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:孙权
  type: Concept
  subject: 语文
  title: 孙权
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把孙权说成蜀汉或曹魏的建立者，与刘备、曹操张冠李戴。
    - 能指出并纠正这一错误：误认为孙权是《水浒传》中的人物，与本节故事年代混淆。
  aliases:
    - 孙仲谋
  category: 人物
  explanation: 字仲谋，三国时吴国的建立者，据有江东，已历三世。
  misconceptions:
    - 把孙权说成蜀汉或曹魏的建立者，与刘备、曹操张冠李戴。
    - 误认为孙权是《水浒传》中的人物，与本节故事年代混淆。
    - 将“权”误写为“全”，写成“孙全”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:孙权劝学
  type: Concept
  subject: 语文
  title: 孙权劝学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把出处《资治通鉴》写成《史记》或《战国策》。
    - 能指出并纠正这一错误：误以为《资治通鉴》是纪传体，实际是编年体。
  aliases: []
  category: 文言文
  explanation: 本文选自《资治通鉴》，讲述孙权劝吕蒙学习，吕蒙学有所成，鲁肃惊叹的故事。
  misconceptions:
    - 把出处《资治通鉴》写成《史记》或《战国策》。
    - 误以为《资治通鉴》是纪传体，实际是编年体。
    - 人物搞混，说“鲁肃劝吕蒙学习”或“孙权向鲁肃劝学”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:孙犁
  type: Concept
  subject: 语文
  title: 孙犁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：张冠李戴：把《山地回忆》记成赵树理的作品，孙犁的代表作还包括《荷花淀》。
    - 能指出并纠正这一错误：误称孙犁为‘山药蛋派’作家，其应为‘荷花淀派’代表人物。
  aliases: []
  category: 文学常识
  explanation: 孙犁，现代作家，代表作有《白洋淀纪事》等，其作品风格清新质朴，富有泥土气息。
  misconceptions:
    - 张冠李戴：把《山地回忆》记成赵树理的作品，孙犁的代表作还包括《荷花淀》。
    - 误称孙犁为‘山药蛋派’作家，其应为‘荷花淀派’代表人物。
    - 将孙犁与诗人艾青混淆，忘记他是小说家，《白洋淀纪事》是小说散文集。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:孝亲敬老
  type: Concept
  subject: 语文
  title: 孝亲敬老
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“孝亲”只指孝敬父母，不包括尊敬其他长辈
    - 能指出并纠正这一错误：把“孝”等同于无条件顺从，认为父母错误指示也必须照办
  aliases:
    - 孝老爱亲
  category: 传统美德
  explanation: 孝亲敬老指孝敬父母、尊敬长辈，是传统美德在现代社会的体现。
  misconceptions:
    - 认为“孝亲”只指孝敬父母，不包括尊敬其他长辈
    - 把“孝”等同于无条件顺从，认为父母错误指示也必须照办
    - 将“孝亲敬老”与“尊老爱幼”混同，认为它包含对幼小的爱护
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:孟子
  type: Concept
  subject: 语文
  title: 孟子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把孟子的“性善论”和荀子的“性恶论”搞反
    - 能指出并纠正这一错误：认为孟子是春秋时期人，与孔子同时代
  aliases:
    - 孟轲
  category: 文学常识
  explanation: 战国时期儒家代表人物，被尊为“亚圣”，主张“仁政”“性善论”。
  misconceptions:
    - 把孟子的“性善论”和荀子的“性恶论”搞反
    - 认为孟子是春秋时期人，与孔子同时代
    - 误将孟子列为法家代表人物
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:学习之道
  type: Concept
  subject: 语文
  title: 学习之道
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘学而不思则罔’的‘罔’误写成‘惘’，理解成迷惘，实际意为迷惑而无所得
    - 能指出并纠正这一错误：错认为‘温故而知新’指随便温习旧知就能凭空得到新知识，忽略了需要主动思考和复习
  aliases: []
  category: 思想内容
  explanation: 孔子及其弟子关于学习方法的观点，如“学而时习之”“温故而知新”“学而不思则罔”等。
  misconceptions:
    - 把‘学而不思则罔’的‘罔’误写成‘惘’，理解成迷惘，实际意为迷惑而无所得
    - 错认为‘温故而知新’指随便温习旧知就能凭空得到新知识，忽略了需要主动思考和复习
    - 将‘学而时习之’的‘时’理解为‘时常’，忽视古义‘按时’的用法
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:学会商量
  type: Concept
  subject: 语文
  title: 学会商量
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 有事想和别人商量时，要用商量时语气把想法说清楚，别人不同意也不生气，可以说没关系，再想想别的办法。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:学写留言条
  type: Concept
  subject: 语文
  title: 学写留言条
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 找不着人又想告诉他事情时，可以写留言条。先写标题留言条，再写给谁，然后写什么事，最后写自己的名字和日期。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:学徒
  type: Concept
  subject: 语文
  title: 学徒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“徒”写成“徙”，写成“学徙”
    - 能指出并纠正这一错误：误以为学徒是上学读书，忽视学手艺和店铺背景
  aliases: []
  category: 文化常识
  explanation: 在店铺中学习技艺的年轻人，地位较低。
  misconceptions:
    - 把“徒”写成“徙”，写成“学徙”
    - 误以为学徒是上学读书，忽视学手艺和店铺背景
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:安史之乱
  type: Concept
  subject: 语文
  title: 安史之乱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把安史之乱发生的朝代写成宋朝，或误认为安禄山是宋代人。
    - 能指出并纠正这一错误：将“安史之乱”写成“安石之乱”，与王安石混淆。
  aliases: []
  category: 历史事件
  explanation: 唐代由安禄山和史思明发动的叛乱，是唐朝由盛转衰的转折点。
  misconceptions:
    - 把安史之乱发生的朝代写成宋朝，或误认为安禄山是宋代人。
    - 将“安史之乱”写成“安石之乱”，与王安石混淆。
    - 认为唐朝由盛转衰的转折点是黄巢起义而非安史之乱。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:安妮·曼斯菲尔德·莎莉文
  type: Concept
  subject: 语文
  title: 安妮·曼斯菲尔德·莎莉文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“莎莉文”误写成“莎利文”或“沙利文”，记错姓氏用字
    - 能指出并纠正这一错误：误认为莎莉文是盲人教师，实际她只是视力不佳而非全盲
  aliases:
    - 莎莉文老师
  category: 文学常识
  explanation: 美国教育家，海伦·凯勒的家庭教师，自1887年起担任，对海伦的成长至关重要。
  misconceptions:
    - 把“莎莉文”误写成“莎利文”或“沙利文”，记错姓氏用字
    - 误认为莎莉文是盲人教师，实际她只是视力不佳而非全盲
    - 误将盲文的发明者认作莎莉文老师，实际是路易·布莱叶
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:安徒生
  type: Concept
  subject: 语文
  title: 安徒生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《皇帝的新装》作者误记为格林兄弟，实为丹麦安徒生
    - 能指出并纠正这一错误：认为安徒生是英国作家，常与莎士比亚或狄更斯混淆
  aliases: []
  category: 文学常识
  explanation: 安徒生（1805—1875），丹麦作家，代表作有童话《卖火柴的小女孩》《海的女儿》《丑小鸭》等。
  misconceptions:
    - 把《皇帝的新装》作者误记为格林兄弟，实为丹麦安徒生
    - 认为安徒生是英国作家，常与莎士比亚或狄更斯混淆
    - 将《丑小鸭》归入《格林童话》，忘记它出自安徒生
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:安慰他人的方法
  type: Concept
  subject: 语文
  title: 安慰他人的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 安慰别人时，要先设身处地想想对方的心情，再选择合适的方式去安慰。语气要诚恳，态度要真诚。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C7/sections/S5.md
- id: concept:语文:官渡之战
  type: Concept
  subject: 语文
  title: 官渡之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把官渡之战说成是孙权、刘备联军大败曹操的战役，实际是曹操与袁绍之战。
    - 能指出并纠正这一错误：误认为官渡之战胜者是袁绍，不知曹操以少胜多。
  aliases: []
  category: 历史事件
  explanation: 公元200年曹操以少胜多击败袁绍的战役，奠定了曹操统一北方的基础。
  misconceptions:
    - 把官渡之战说成是孙权、刘备联军大败曹操的战役，实际是曹操与袁绍之战。
    - 误认为官渡之战胜者是袁绍，不知曹操以少胜多。
    - 将“官渡”误写为“观渡”或“官渡”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:定中关系
  type: Concept
  subject: 语文
  title: 定中关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“飞快地跑”误判为定中关系，实际是状中关系。
    - 能指出并纠正这一错误：认为“她的眼睛”中“她”是中心语，实际中心语是“眼睛”。
  aliases: []
  category: 语法
  explanation: 定中关系是偏正短语的一种，修饰语为定语，中心语为名词或代词，如“她的眼睛”。
  misconceptions:
    - 把“飞快地跑”误判为定中关系，实际是状中关系。
    - 认为“她的眼睛”中“她”是中心语，实际中心语是“眼睛”。
    - 误将“非常美丽”视为定中关系，实际是状中关系。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:实验精神
  type: Concept
  subject: 语文
  title: 实验精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为实验精神只适用于自然科学，误以为文科学习不需要动手实践。
    - 能指出并纠正这一错误：以为只要动手做实验就是实验精神，忽略有计划、有目标地探测和观察。
  aliases: []
  category: 概念
  explanation: 新的知识只能通过实地实验得到，需要积极探测、有计划、有目标。
  misconceptions:
    - 认为实验精神只适用于自然科学，误以为文科学习不需要动手实践。
    - 以为只要动手做实验就是实验精神，忽略有计划、有目标地探测和观察。
    - 把“格物致知”等同于死记硬背知识，认为读书多就能获得新知识。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:审题
  type: Concept
  subject: 语文
  title: 审题
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：忽略题目中的“也”字，如作文“这也是一种美”只围绕“美”写，变成了写一般的美。
    - 能指出并纠正这一错误：把“不正确的”看成“正确的”，答题时选出了正确项导致失分。
  aliases: []
  category: 写作方法
  explanation: 审题是审察题意，明确题目要求，包括注意限制条件、分析题目含义等。
  misconceptions:
    - 忽略题目中的“也”字，如作文“这也是一种美”只围绕“美”写，变成了写一般的美。
    - 把“不正确的”看成“正确的”，答题时选出了正确项导致失分。
    - 审题时只看关键词，忽视了“结合具体事例”等限制，导致答案空洞。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:客此
  type: Concept
  subject: 语文
  title: 客此
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘客此’的‘客’误当名词，解释成‘客人在此地’。
    - 能指出并纠正这一错误：误将‘客此’的‘客’理解为客气，译为‘在此客气地居住’。
  aliases: []
  category: 文言词语
  explanation: 客居此地。
  misconceptions:
    - 把‘客此’的‘客’误当名词，解释成‘客人在此地’。
    - 误将‘客此’的‘客’理解为客气，译为‘在此客气地居住’。
    - 认为‘客此’是‘此客’，即这个客人，颠倒语序。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:客观事实与主观评价
  type: Concept
  subject: 语文
  title: 客观事实与主观评价
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“我军英勇善战”这类评价当作客观事实，实际是主观评价。
    - 能指出并纠正这一错误：认为新闻中所有内容都是客观事实，否定主观评价的存在。
  aliases: []
  category: 阅读方法
  explanation: 新闻注重准确性，作者的态度和倾向隐含在字里行间，阅读时要区分客观事实与主观评价。
  misconceptions:
    - 把“我军英勇善战”这类评价当作客观事实，实际是主观评价。
    - 认为新闻中所有内容都是客观事实，否定主观评价的存在。
    - 将“三十万人民解放军”误认为主观评价，而它其实是客观数据。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:宫市
  type: Concept
  subject: 语文
  title: 宫市
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“宫市”理解为皇宫里的店铺，不知是宦官市场上强夺民财。
    - 能指出并纠正这一错误：将“宫市”写成“宫室”，或误以为宫市是公平买卖制度。
  aliases: []
  category: 历史制度
  explanation: 唐代宫廷派宦官到市场强行买卖货物的制度，实际是掠夺民财。
  misconceptions:
    - 把“宫市”理解为皇宫里的店铺，不知是宦官市场上强夺民财。
    - 将“宫市”写成“宫室”，或误以为宫市是公平买卖制度。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:家喻户晓
  type: Concept
  subject: 语文
  title: 家喻户晓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'喻'误写为'愈'或'渝'，写成'家愈户晓'。
    - 能指出并纠正这一错误：与'妇孺皆知'完全等同，忽略'家喻户晓'侧重每家每户。
  aliases: []
  category: 成语
  explanation: 家家户户都知道，形容人所共知。
  misconceptions:
    - 把'喻'误写为'愈'或'渝'，写成'家愈户晓'。
    - 与'妇孺皆知'完全等同，忽略'家喻户晓'侧重每家每户。
    - 误以为'喻'是比喻的意思，导致理解偏差。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:家国情怀
  type: Concept
  subject: 语文
  title: 家国情怀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《灯笼》的作者误记为鲁迅。
    - 能指出并纠正这一错误：将“家国情怀”等同于“爱国主义”，忽略家的部分。
  aliases: []
  category: 情感
  explanation: 作者由个人对灯笼的记忆，升华到对国家民族命运的关切，表达愿为保家卫国贡献力量的誓愿。
  misconceptions:
    - 把《灯笼》的作者误记为鲁迅。
    - 将“家国情怀”等同于“爱国主义”，忽略家的部分。
    - 认为“家国情怀”只指对国家的责任感，不包含个人情感。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:家训
  type: Concept
  subject: 语文
  title: 家训
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为家训必须写成书面文字，口头叮嘱不算家训
    - 能指出并纠正这一错误：将家训与家风混用，如“这个家家训真好”实指家风
  aliases:
    - 家规
    - 家书
  category: 家庭文化
  explanation: 家训是家庭对子孙立身处世、持家治业的教诲，常以文字形式记载。
  misconceptions:
    - 认为家训必须写成书面文字，口头叮嘱不算家训
    - 将家训与家风混用，如“这个家家训真好”实指家风
    - 认为只有祖辈传下的才叫家训，现代父母不能自创家训
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:家风
  type: Concept
  subject: 语文
  title: 家风
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把家风等同于家里张贴的规章制度，忽视实际言行
    - 能指出并纠正这一错误：认为家风只体现在大事上，日常小节与家风无关
  aliases:
    - 门风
  category: 家庭文化
  explanation: 家风是家庭或家族的传统风尚，体现在家庭成员的言行举止和家庭氛围中。
  misconceptions:
    - 把家风等同于家里张贴的规章制度，忽视实际言行
    - 认为家风只体现在大事上，日常小节与家风无关
    - 将家风与家教混淆，认为家风就是父母教育子女的方法
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:宽厚
  type: Concept
  subject: 语文
  title: 宽厚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“宽厚”误写成“宽后”，未注意“厚”表厚道。
    - 能指出并纠正这一错误：把“宽厚”与“宽大”混用，如“宽厚处理”不合语境。
  aliases: []
  category: 词语
  explanation: 待人宽容厚道。
  misconceptions:
    - 将“宽厚”误写成“宽后”，未注意“厚”表厚道。
    - 把“宽厚”与“宽大”混用，如“宽厚处理”不合语境。
    - 误用“宽厚”形容器物，如“宽厚的桌面”，重在人品。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:宿儒
  type: Concept
  subject: 语文
  title: 宿儒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“宿”理解为住宿，认为宿儒是住宿的读书人
    - 能指出并纠正这一错误：误读成xiǔ（一宿的宿），实际应读sù
  aliases: []
  category: 词语理解
  explanation: 老成博学的读书人。宿，长久从事某事的。
  misconceptions:
    - 把“宿”理解为住宿，认为宿儒是住宿的读书人
    - 误读成xiǔ（一宿的宿），实际应读sù
    - 认为宿儒只指年老，忽视了博学的含义
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:寓公
  type: Concept
  subject: 语文
  title: 寓公
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：望文生义为“住在公寓的男人”
    - 能指出并纠正这一错误：误用为普通退休老人，忽略“失势官僚”的特定含义
  aliases: []
  category: 文化常识
  explanation: 寄居他国的诸侯、贵族，后泛指失势寄居他乡的官僚、绅士。
  misconceptions:
    - 望文生义为“住在公寓的男人”
    - 误用为普通退休老人，忽略“失势官僚”的特定含义
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:寓言
  type: Concept
  subject: 语文
  title: 寓言
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将寓言与童话混为一谈，以为有幻想的故事就是寓言。
    - 能指出并纠正这一错误：误认为寓言必须用动物作主角，排斥人物形象。
  aliases: []
  category: 文学体裁
  explanation: 寓言是用假托的故事或自然物的拟人手法来说明某个道理或教训的文学作品，常带有讽刺或劝诫的性质。
  misconceptions:
    - 将寓言与童话混为一谈，以为有幻想的故事就是寓言。
    - 误认为寓言必须用动物作主角，排斥人物形象。
    - 以为寓言中的道理是直接说出的，忽略其讽喻和劝诫。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:寓言说理
  type: Concept
  subject: 语文
  title: 寓言说理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把寓言说理等同于比喻修辞，忽略其通过故事阐述道理的特点。
    - 能指出并纠正这一错误：认为寓言中的事都是真实发生的，不懂虚构故事也承载说理。
  aliases:
    - 寓言
  category: 文学手法
  explanation: 通过虚构的故事或比喻来阐述道理，使抽象的观点形象化。
  misconceptions:
    - 把寓言说理等同于比喻修辞，忽略其通过故事阐述道理的特点。
    - 认为寓言中的事都是真实发生的，不懂虚构故事也承载说理。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:对仗
  type: Concept
  subject: 语文
  title: 对仗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为律诗中首联和尾联也必须像颔联颈联一样严格对仗。
    - 能指出并纠正这一错误：认为对仗只要求字数相等，不要求词性相对、结构相同。
  aliases:
    - 对偶
  category: 修辞手法
  explanation: 对仗是律诗中颔联和颈联必须使用的修辞手法，要求上下句字数相等、词性相对、结构相同。
  misconceptions:
    - 误认为律诗中首联和尾联也必须像颔联颈联一样严格对仗。
    - 认为对仗只要求字数相等，不要求词性相对、结构相同。
    - 把对仗与对偶完全等同，忽略对仗还须平仄相对。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:对偶句
  type: Concept
  subject: 语文
  title: 对偶句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将'两岸连山，略无阙处'视为对偶，实则字数不等且结构不相对。
    - 能指出并纠正这一错误：认为对偶句必须意思相反，不知'相对或相近'均可。
  aliases:
    - 对仗
    - 对偶句式
  category: 修辞手法
  explanation: 用结构相同、字数相等的一对句子表达相对或相近的意思。
  misconceptions:
    - 误将'两岸连山，略无阙处'视为对偶，实则字数不等且结构不相对。
    - 认为对偶句必须意思相反，不知'相对或相近'均可。
    - 把排比句当成对偶，忽视了只要求两句成对。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:对比手法
  type: Concept
  subject: 语文
  title: 对比手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘蝉噪林逾静，鸟鸣山更幽’视为对比，实际是衬托
    - 能指出并纠正这一错误：认为对比必须把好坏两个事物并列，导致找不出对比中的对立面
  aliases:
    - 对照
  category: 表现手法
  explanation: 把对立的事物或事物的两个方面放在一起比较，以突出事物的特征。
  misconceptions:
    - 将‘蝉噪林逾静，鸟鸣山更幽’视为对比，实际是衬托
    - 认为对比必须把好坏两个事物并列，导致找不出对比中的对立面
    - 分析‘朱门酒肉臭，路有冻死骨’时误判为夸张或比喻
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:对比衬托
  type: Concept
  subject: 语文
  title: 对比衬托
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把对比和衬托混为一谈，认为“对比就是衬托”，忽视衬托有主次之分。
    - 能指出并纠正这一错误：说“海鸥与海燕形成对比”，实际是用海鸥、海鸭、企鹅的胆怯衬托海燕的勇敢。
  aliases:
    - 衬托
  category: 表现手法
  explanation: 对比衬托是通过对比不同形象来突出主要形象的特征，如用海鸥、海鸭、企鹅的胆怯衬托海燕的勇敢。
  misconceptions:
    - 把对比和衬托混为一谈，认为“对比就是衬托”，忽视衬托有主次之分。
    - 说“海鸥与海燕形成对比”，实际是用海鸥、海鸭、企鹅的胆怯衬托海燕的勇敢。
    - 把主次颠倒，如说“用海燕的勇敢衬托海鸥的胆怯”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:对比衬托手法
  type: Concept
  subject: 语文
  title: 对比衬托手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文中对比是突出霸上、棘门军纪律差，实际是为了衬托周亚夫的严明。
    - 能指出并纠正这一错误：混淆对比与衬托：对比不分主次，衬托有主次之分。
  aliases:
    - 对比
    - 衬托
  category: 写作手法
  explanation: 通过对比或衬托突出人物形象，如文中霸上、棘门军与细柳军的对比，衬托周亚夫治军严明。
  misconceptions:
    - 认为文中对比是突出霸上、棘门军纪律差，实际是为了衬托周亚夫的严明。
    - 混淆对比与衬托：对比不分主次，衬托有主次之分。
    - 说‘细柳军与霸上军形成对比’就认为双方同等重要，忽略衬托作用。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:对比论证
  type: Concept
  subject: 语文
  title: 对比论证
  conceptType: 推理型
  masteryCriteria:
    - 能指出并纠正这一错误：误把比喻论证当对比论证，认为‘像’就是对比。
    - 能指出并纠正这一错误：认为只要文中出现正反两方面就是对比论证，未判断是否论证论点。
  aliases:
    - 正反对比论证
  category: 论证方法
  explanation: 将正反两方面的事实或道理进行对比，在对比中证明论点的方法。
  misconceptions:
    - 误把比喻论证当对比论证，认为‘像’就是对比。
    - 认为只要文中出现正反两方面就是对比论证，未判断是否论证论点。
    - 混淆论证方法中的‘对比’与修辞手法中的‘对比’，二者作用不同。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:对称句式
  type: Concept
  subject: 语文
  title: 对称句式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“他爱唱歌，我爱跳舞”当作对称句式，其实结构相同但语义缺少相对或相关。
    - 能指出并纠正这一错误：认为对称句式必须字数、结构完全一致，导致不承认“小草偷偷地钻出来”和“嫩嫩的，绿绿的”是对称。
  aliases:
    - 对称句
  category: 写作手法
  explanation: 对称句式是指结构相同或相似、意思相对或相关的两个或两个以上的句子并列使用，使语句整齐匀称，增强节奏感和表现力。
  misconceptions:
    - 把“他爱唱歌，我爱跳舞”当作对称句式，其实结构相同但语义缺少相对或相关。
    - 认为对称句式必须字数、结构完全一致，导致不承认“小草偷偷地钻出来”和“嫩嫩的，绿绿的”是对称。
    - 将三句以上的排比误认为对称句式，如“我是学生，你是老师，他是医生”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:对联
  type: Concept
  subject: 语文
  title: 对联
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：贴对联时将平声收尾的下联当上联贴在右边，如把‘福满人间’贴右侧，把‘春回大地’贴左侧。
    - 能指出并纠正这一错误：认为对仗只要字数相等，如用‘春回大地’对‘国泰民安’，忽略词性和结构对应。
  aliases:
    - 楹联
    - 对子
  category: 传统文化
  explanation: 对联是我国传统文化的瑰宝，是活的文化遗产，讲究对仗工整、平仄协调，广泛应用于日常生活。
  misconceptions:
    - 贴对联时将平声收尾的下联当上联贴在右边，如把‘福满人间’贴右侧，把‘春回大地’贴左侧。
    - 认为对仗只要字数相等，如用‘春回大地’对‘国泰民安’，忽略词性和结构对应。
    - 把‘绿柳舒眉观新岁’中的‘舒眉’看作比喻，实为拟人，修辞判断错误。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S8.md
- id: concept:语文:对话标点的用法
  type: Concept
  subject: 语文
  title: 对话标点的用法
  conceptType: 概念型
  aliases:
    - 提示语与标点
  category: 语法
  explanation: 引用人物说的话，提示语后面要用冒号，说的话要用引号。提示语在中间或后面时，标点也要跟着变化。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:对课
  type: Concept
  subject: 语文
  title: 对课
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“对课”是对着课程表或复习课业
    - 能指出并纠正这一错误：把“对课”理解为师生对话，不是对对子
  aliases:
    - 对对子
  category: 文化常识
  explanation: 即对对子，旧时学习词句和准备作诗的一种练习，一般先生出上联，学生对下联。
  misconceptions:
    - 误以为“对课”是对着课程表或复习课业
    - 把“对课”理解为师生对话，不是对对子
    - 写“对课”时写成“对科”
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:对韵歌
  type: Concept
  subject: 语文
  title: 对韵歌
  conceptType: 概念型
  aliases:
    - 对子歌
  category: 文化常识
  explanation: 把意思相对的词两两对在一起编成的歌，像云对雨、雪对风。读起来朗朗上口，还能帮我们认识很多字。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C7/sections/S1.md
- id: concept:语文:导演手记
  type: Concept
  subject: 语文
  title: 导演手记
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：与“导演阐述”混淆，误以为是对外宣传的正式文章
  aliases: []
  category: 戏剧活动
  explanation: 导演在排练过程中记录对剧本理解、角色分析、舞台设计等思考的文字。
  misconceptions:
    - 与“导演阐述”混淆，误以为是对外宣传的正式文章
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:导语
  type: Concept
  subject: 语文
  title: 导语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把消息的标题当作导语，以为标题就是第一句话。
    - 能指出并纠正这一错误：认为导语必须包含所有六要素，缺一不可。
  aliases: []
  category: 文体知识
  explanation: 导语是消息开头的第一句或第一段，用简明扼要的文字概括新闻中最主要的事实。
  misconceptions:
    - 把消息的标题当作导语，以为标题就是第一句话。
    - 认为导语必须包含所有六要素，缺一不可。
    - 找导语时从第二段开始，忽略开头最前面的第一段。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:小丑
  type: Concept
  subject: 语文
  title: 小丑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“小丑”理解为杂技团里的丑角，忽略它是戏曲行当之一。
    - 能指出并纠正这一错误：认为小丑专演反面人物，实际扮演滑稽人物，与“净”角混淆。
  aliases: []
  category: 戏曲常识
  explanation: 戏曲行当之一，扮演滑稽人物。
  misconceptions:
    - 误将“小丑”理解为杂技团里的丑角，忽略它是戏曲行当之一。
    - 认为小丑专演反面人物，实际扮演滑稽人物，与“净”角混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:小令
  type: Concept
  subject: 语文
  title: 小令
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《如梦令》《浣溪沙》误称为“曲牌名”。
    - 能指出并纠正这一错误：认为小令就是五言绝句，或强行对应字数。
  aliases: []
  category: 文体知识
  explanation: 词的一种形式，篇幅短小，晏殊、欧阳修均擅长。
  misconceptions:
    - 把《如梦令》《浣溪沙》误称为“曲牌名”。
    - 认为小令就是五言绝句，或强行对应字数。
    - 分不清小令与中调，超过58字仍称小令。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:小善与小恶
  type: Concept
  subject: 语文
  title: 小善与小恶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把扶老人过马路这类人际小善误当作大善。
    - 能指出并纠正这一错误：将随地吐痰这类公德小恶误当作大恶。
  aliases: []
  category: 概念界定
  explanation: 凡对处理人际关系、保持社会安定团结有利的是小善，反之是小恶。
  misconceptions:
    - 把扶老人过马路这类人际小善误当作大善。
    - 将随地吐痰这类公德小恶误当作大恶。
    - 仅凭个人喜好区分小善小恶，不以安团结为标准。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:小序
  type: Concept
  subject: 语文
  title: 小序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“小序”误写成“小叙”，混淆“序”与“叙”。
    - 能指出并纠正这一错误：误以为“小序”是正文开头的话，实为诗歌前的说明性文字。
  aliases: []
  category: 文体
  explanation: 诗歌前的一段说明性文字，交代写作背景。
  misconceptions:
    - 将“小序”误写成“小叙”，混淆“序”与“叙”。
    - 误以为“小序”是正文开头的话，实为诗歌前的说明性文字。
    - 把“小序”等同于长篇“序言”，忽略“小”字指简短。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:小旦
  type: Concept
  subject: 语文
  title: 小旦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把小旦当成丫鬟或次要配角，实为扮演年轻女子的行当。
    - 能指出并纠正这一错误：将小旦与小生混淆，忽略性别差异，小旦演女、小生演男。
  aliases: []
  category: 戏曲常识
  explanation: 戏曲行当之一，扮演年轻女子。
  misconceptions:
    - 误把小旦当成丫鬟或次要配角，实为扮演年轻女子的行当。
    - 将小旦与小生混淆，忽略性别差异，小旦演女、小生演男。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:小生
  type: Concept
  subject: 语文
  title: 小生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“小生”写成“小笙”或“小牲”，因音同而字形混淆。
    - 能指出并纠正这一错误：误认为小生就是书生，忽略它扮演年轻男子，还包括武将等角色。
  aliases: []
  category: 戏曲常识
  explanation: 戏曲行当之一，扮演年轻男子。
  misconceptions:
    - 把“小生”写成“小笙”或“小牲”，因音同而字形混淆。
    - 误认为小生就是书生，忽略它扮演年轻男子，还包括武将等角色。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:小说
  type: Concept
  subject: 语文
  title: 小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为小说中的故事都是真实发生的，忽略其虚构性。
    - 能指出并纠正这一错误：把小说与记叙文等同，认为小说必须写真人真事。
  aliases: []
  category: 文学体裁
  explanation: 小说是一种以刻画人物形象为中心，通过完整的故事情节和环境描写来反映社会生活的文学体裁。
  misconceptions:
    - 误认为小说中的故事都是真实发生的，忽略其虚构性。
    - 把小说与记叙文等同，认为小说必须写真人真事。
    - 误以为小说只要有情节，不需要刻画人物形象。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:小说三要素
  type: Concept
  subject: 语文
  title: 小说三要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把小说三要素说成‘人物、情节、主题’，漏掉环境，或把环境等同为自然环境。
    - 能指出并纠正这一错误：认为本文是散文，忽略其通过人物对话和细节塑造典型的虚构小说特征。
  aliases: []
  category: 文学知识
  explanation: 小说三要素包括人物、情节、环境，本文通过人物对话和细节描写塑造妞儿形象。
  misconceptions:
    - 把小说三要素说成‘人物、情节、主题’，漏掉环境，或把环境等同为自然环境。
    - 认为本文是散文，忽略其通过人物对话和细节塑造典型的虚构小说特征。
    - 误以为情节就是完整故事，忽略本文在对话中展开的片段式叙事方式。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:小说主题
  type: Concept
  subject: 语文
  title: 小说主题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《故乡》主题概括为“回忆美好童年”，忽略对旧社会的批判
    - 能指出并纠正这一错误：认为主题就是主角的命运，如“于勒的遭遇”不是主题
  aliases:
    - 中心思想
  category: 文学常识
  explanation: 小说主题是作者通过故事情节和人物形象所表达的中心思想，是作品的灵魂。
  misconceptions:
    - 把《故乡》主题概括为“回忆美好童年”，忽略对旧社会的批判
    - 认为主题就是主角的命运，如“于勒的遭遇”不是主题
    - 多主题时只抓一点，比如只谈“希望”而忽视“隔膜”
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:小说主题理解
  type: Concept
  subject: 语文
  title: 小说主题理解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把主题理解为赞美父亲勤劳坚韧，忽略物质追求背后精神尊严的失落
    - 能指出并纠正这一错误：误以为父亲建成台阶后心满意足，看不出他身体垮掉后的茫然与不适
  aliases: []
  category: 阅读方法
  explanation: 理解小说通过父亲的故事反映农民对尊严的追求及精神困境。
  misconceptions:
    - 把主题理解为赞美父亲勤劳坚韧，忽略物质追求背后精神尊严的失落
    - 误以为父亲建成台阶后心满意足，看不出他身体垮掉后的茫然与不适
    - 将‘台阶’单纯看作住房改善，未联系到农村社会地位与人格尊严的象征
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:小说人物形象塑造
  type: Concept
  subject: 语文
  title: 小说人物形象塑造
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“他一把推开椅子，冲出门去”归为心理描写，实际是动作描写。
    - 能指出并纠正这一错误：误将外貌描写和神态描写等同，如“他满脸皱纹”说成神态描写。
  aliases:
    - 人物刻画
  category: 文学知识
  explanation: 小说通过外貌、语言、动作、神态等描写手法塑造人物形象，反映社会生活。
  misconceptions:
    - 把“他一把推开椅子，冲出门去”归为心理描写，实际是动作描写。
    - 误将外貌描写和神态描写等同，如“他满脸皱纹”说成神态描写。
    - 分析人物时直接贴“善良”“勇敢”标签，却不结合文本具体描写。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:小说人物档案卡片
  type: Concept
  subject: 语文
  title: 小说人物档案卡片
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：制作卡片时大量抄录原文，缺少概括和点评
    - 能指出并纠正这一错误：点评人物只用“善良”“虚伪”等形容词，不结合具体事件
  aliases:
    - 人物卡片
  category: 学习方法
  explanation: 小说人物档案卡片是一种记录小说人物基本信息、外貌、语言、动作、事件和点评的卡片，用于整理和展示人物形象。
  misconceptions:
    - 制作卡片时大量抄录原文，缺少概括和点评
    - 点评人物只用“善良”“虚伪”等形容词，不结合具体事件
    - 将人物事件与性格特点分离，写事件不带人物分析
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:小说情节梳理
  type: Concept
  subject: 语文
  title: 小说情节梳理
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把插叙的于勒美洲经历当成开端，实际是插叙内容
    - 能指出并纠正这一错误：认为高潮是“于勒来信”，实际上船上的相遇才是高潮
  aliases:
    - 情节梳理
  category: 阅读方法
  explanation: 梳理小说情节，即理清故事的开端、发展、高潮和结局，把握叙事线索。
  misconceptions:
    - 把插叙的于勒美洲经历当成开端，实际是插叙内容
    - 认为高潮是“于勒来信”，实际上船上的相遇才是高潮
    - 以“于勒贫富变化”为线索，而正确线索是菲利普夫妇的态度变化
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:小说笔法
  type: Concept
  subject: 语文
  title: 小说笔法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为小说笔法意味着内容虚构，忽略其增强真实性的作用。
    - 能指出并纠正这一错误：把'小说笔法'等同于'夸张'修辞手法。
  aliases: []
  category: 写作手法
  explanation: 本文写下山时以小说笔法，叙述奇人奇事，富有传奇色彩。
  misconceptions:
    - 误认为小说笔法意味着内容虚构，忽略其增强真实性的作用。
    - 把'小说笔法'等同于'夸张'修辞手法。
    - 误以为小说笔法只出现在小说中，散文不能使用。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:小说语言欣赏
  type: Concept
  subject: 语文
  title: 小说语言欣赏
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：只会写“生动形象地写出了……”却说不清如何生动，缺乏具体词句赏析。
    - 能指出并纠正这一错误：把“比喻”说成“拟人”，如“落叶像蝴蝶飞舞”说是拟人。
  aliases:
    - 语言品味
  category: 阅读方法
  explanation: 品味小说中富有表现力的语言，了解多样化的风格。
  misconceptions:
    - 只会写“生动形象地写出了……”却说不清如何生动，缺乏具体词句赏析。
    - 把“比喻”说成“拟人”，如“落叶像蝴蝶飞舞”说是拟人。
    - 分析语言风格时忽略人物身份，如认为《孔乙己》中的语言是华丽辞藻。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:小说语言特色
  type: Concept
  subject: 语文
  title: 小说语言特色
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为口语就是“土话”，是不规范的语言，否定其表现力。
    - 能指出并纠正这一错误：把“歇后语”当“成语”，如“外甥打灯笼——照旧”说成是成语。
  aliases: []
  category: 文学知识
  explanation: 大量使用口语、歇后语，借鉴传统小说和评书的语言，富有乡土气息。
  misconceptions:
    - 认为口语就是“土话”，是不规范的语言，否定其表现力。
    - 把“歇后语”当“成语”，如“外甥打灯笼——照旧”说成是成语。
    - 只举出“口语化”的例子，却不说明其乡土气息和人物塑造作用。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:居里夫人
  type: Concept
  subject: 语文
  title: 居里夫人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为居里夫人是波兰国籍，忽略了她后来加入法国国籍。
    - 能指出并纠正这一错误：把1903年诺贝尔物理学奖和1911年诺贝尔化学奖的获奖年份记反。
  aliases:
    - 玛丽·斯可罗多夫斯卡
    - 居里夫人
  category: 人物知识
  explanation: 玛丽·居里（1867-1934），法国物理学家、化学家，原籍波兰，先后获1903年诺贝尔物理学奖和1911年诺贝尔化学奖。本文记述了她和丈夫在艰苦条件下提取镭的过程。
  misconceptions:
    - 误以为居里夫人是波兰国籍，忽略了她后来加入法国国籍。
    - 把1903年诺贝尔物理学奖和1911年诺贝尔化学奖的获奖年份记反。
    - 将居里夫人与她的女儿伊雷娜·约里奥-居里混淆，后者获1935年化学奖。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:屏人促席
  type: Concept
  subject: 语文
  title: 屏人促席
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“屏”读作píng，误以为“屏人”是屏风后面的人，实际读bǐng意为退避。
    - 能指出并纠正这一错误：将“促席”误解为催促入席，实际是靠近座位。
  aliases: []
  category: 文言词语
  explanation: 叫他人回避，将座席靠近，表示密谈。
  misconceptions:
    - 把“屏”读作píng，误以为“屏人”是屏风后面的人，实际读bǐng意为退避。
    - 将“促席”误解为催促入席，实际是靠近座位。
    - 把“屏”误写为“摒”，写作“摒人促席”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:展开想象写故事
  type: Concept
  subject: 语文
  title: 展开想象写故事
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 写想象作文时，围绕自己和喜欢的故事人物，大胆想象会发生什么事，把经过写清楚、写有趣。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:山坡羊
  type: Concept
  subject: 语文
  title: 山坡羊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘山坡羊’误认为词牌名，如称《山坡羊·潼关怀古》为词。
    - 能指出并纠正这一错误：将曲牌名与题目混为一谈，认为‘山坡羊’就是诗歌内容。
  aliases: []
  category: 文学常识
  explanation: 曲牌名，用于散曲小令。
  misconceptions:
    - 把‘山坡羊’误认为词牌名，如称《山坡羊·潼关怀古》为词。
    - 将曲牌名与题目混为一谈，认为‘山坡羊’就是诗歌内容。
    - 写曲词时把‘山坡羊’当作者，如标明‘山坡羊 张养浩’颠倒位置。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:山坡羊·骊山怀古
  type: Concept
  subject: 语文
  title: 山坡羊·骊山怀古
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《山坡羊·骊山怀古》的作者是马致远，与《天净沙·秋思》混淆。
    - 能指出并纠正这一错误：误把‘骊山怀古’当作《山坡羊·潼关怀古》的别名，其实两篇内容不同。
  aliases: []
  category: 散曲
  explanation: 张养浩所作，借骊山阿房宫的兴废，抒发世事无常、兴亡皆归尘土的历史感慨。
  misconceptions:
    - 认为《山坡羊·骊山怀古》的作者是马致远，与《天净沙·秋思》混淆。
    - 误把‘骊山怀古’当作《山坡羊·潼关怀古》的别名，其实两篇内容不同。
    - 将‘骊山阿房宫’说成是楚霸王所建，史实错误。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:山水游记
  type: Concept
  subject: 语文
  title: 山水游记
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《答谢中书书》误认作山水游记，它实为书信体山水小品。
    - 能指出并纠正这一错误：认为山水游记一定要写游览经过，忽视《记承天寺夜游》重在夜游所见所感。
  aliases:
    - 游记
  category: 文体知识
  explanation: 山水游记是描写山水景物、抒发作者情感的散文体裁，常借景抒情，表达对自然和人生的感悟。
  misconceptions:
    - 将《答谢中书书》误认作山水游记，它实为书信体山水小品。
    - 认为山水游记一定要写游览经过，忽视《记承天寺夜游》重在夜游所见所感。
    - 把纯粹写景的诗歌也归为山水游记，如王维的山水诗。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:山水田园诗派
  type: Concept
  subject: 语文
  title: 山水田园诗派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为王维的《使至塞上》是山水田园诗，其实是边塞诗。
    - 能指出并纠正这一错误：认为山水田园诗派只有王维一个人，不知道孟浩然也是代表。
  aliases:
    - 田园诗派
  category: 文学流派
  explanation: 盛唐时期以王维、孟浩然为代表的诗歌流派，多描写自然山水和田园生活，风格清新淡雅。
  misconceptions:
    - 误认为王维的《使至塞上》是山水田园诗，其实是边塞诗。
    - 认为山水田园诗派只有王维一个人，不知道孟浩然也是代表。
    - 将东晋的陶渊明当作盛唐山水田园诗派代表人物。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:山河表里
  type: Concept
  subject: 语文
  title: 山河表里
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘山河表里’理解为山河壮丽，忽视‘表里’指外内。
    - 能指出并纠正这一错误：误将‘河’指黄河，但‘山’误为泰山，实际是华山。
  aliases:
    - 表里山河
  category: 文言词语
  explanation: 外有黄河，内有华山，形容潼关一带地势险要。
  misconceptions:
    - 把‘山河表里’理解为山河壮丽，忽视‘表里’指外内。
    - 误将‘河’指黄河，但‘山’误为泰山，实际是华山。
    - 在翻译时颠倒内外关系，说成‘内黄河，外华山’。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:岩石破坏作用
  type: Concept
  subject: 语文
  title: 岩石破坏作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为岩石破坏只包括风化，忽略侵蚀和搬运等外力作用。
    - 能指出并纠正这一错误：误把“风化”当“风的作用”，实际包括物理、化学和生物作用。
  aliases:
    - 风化侵蚀
  category: 地质学
  explanation: 岩石受到风化、侵蚀、搬运等外力作用而破碎、分解的过程，包括物理、化学和生物作用。
  misconceptions:
    - 认为岩石破坏只包括风化，忽略侵蚀和搬运等外力作用。
    - 误把“风化”当“风的作用”，实际包括物理、化学和生物作用。
    - 认为岩石破坏是短期过程，实际需漫长地质时间。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:岩石记录时间
  type: Concept
  subject: 语文
  title: 岩石记录时间
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为岩层越厚时间越长，忽略沉积速率可能不同。
    - 能指出并纠正这一错误：认为所有岩石都能记录时间，变质岩和岩浆岩难保留层序。
  aliases:
    - 地质记录
  category: 地质学
  explanation: 岩石的沉积、变形和破坏过程记录了地球历史的时间信息，如岩层厚度代表时间跨度。
  misconceptions:
    - 误认为岩层越厚时间越长，忽略沉积速率可能不同。
    - 认为所有岩石都能记录时间，变质岩和岩浆岩难保留层序。
    - 将岩层中的化石年代当作岩石本身的形成年代。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:岳阳楼记
  type: Concept
  subject: 语文
  title: 岳阳楼记
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《岳阳楼记》是欧阳修在政治上失意时写的。
    - 能指出并纠正这一错误：把‘先天下之忧而忧’误写为‘先天下之忧而乐’。
  aliases: []
  category: 文言文
  explanation: 范仲淹所作，通过描绘岳阳楼景色，抒发作者“先天下之忧而忧，后天下之乐而乐”的政治抱负。
  misconceptions:
    - 误以为《岳阳楼记》是欧阳修在政治上失意时写的。
    - 把‘先天下之忧而忧’误写为‘先天下之忧而乐’。
    - 混淆《岳阳楼记》与《醉翁亭记》的作者和思想主旨。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:峰回路转
  type: Concept
  subject: 语文
  title: 峰回路转
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在形容山路崎岖难行时误用‘峰回路转’。
    - 能指出并纠正这一错误：把‘峰回路转’等同于‘柳暗花明’，忽略其山回路转的本义。
  aliases: []
  category: 成语
  explanation: 出自《醉翁亭记》，原指山势回环，路也跟着转弯，后比喻事情出现转机。
  misconceptions:
    - 在形容山路崎岖难行时误用‘峰回路转’。
    - 把‘峰回路转’等同于‘柳暗花明’，忽略其山回路转的本义。
    - 误写为‘峰回陆转’，把‘路’写成‘陆’。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:川剧
  type: Concept
  subject: 语文
  title: 川剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写“川”为“穿”，如“穿剧”
    - 能指出并纠正这一错误：认为变脸是京剧绝活，或把梅兰芳当作川剧演员
  aliases: []
  category: 戏曲剧种
  explanation: 流行于四川、重庆等地的地方戏曲，以高腔和变脸等绝技闻名。
  misconceptions:
    - 误写“川”为“穿”，如“穿剧”
    - 认为变脸是京剧绝活，或把梅兰芳当作川剧演员
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:左右结构字的宽窄
  type: Concept
  subject: 语文
  title: 左右结构字的宽窄
  conceptType: 程序型
  aliases: []
  category: 法则
  explanation: 左右结构的字有的左边窄右边宽，有的左边宽右边窄。写之前先看清两部分的宽窄，字才匀称好看。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:左迁
  type: Concept
  subject: 语文
  title: 左迁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“左迁”当升迁，因现代“左迁”一词不常用，误以为左是上。
    - 能指出并纠正这一错误：混淆“左迁”与“右迁”，不知左迁为降职却误以为右迁降职。
  aliases: []
  category: 文言词语
  explanation: 指降职。古代以右为尊，左为卑，故称降职为左迁。
  misconceptions:
    - 误把“左迁”当升迁，因现代“左迁”一词不常用，误以为左是上。
    - 混淆“左迁”与“右迁”，不知左迁为降职却误以为右迁降职。
    - 望文生义，把“左迁”解释为“向左边迁移”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:己亥杂诗
  type: Concept
  subject: 语文
  title: 己亥杂诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“己亥”当成作者龚自珍的字，其实“己亥”是干支纪年。
    - 能指出并纠正这一错误：认为《己亥杂诗》只有一首，不知道它是315首的组诗。
  aliases: []
  category: 作品
  explanation: 《己亥杂诗》是龚自珍在己亥年（1839年）辞官离京期间创作的组诗，共315首，本课选其第五首。
  misconceptions:
    - 误把“己亥”当成作者龚自珍的字，其实“己亥”是干支纪年。
    - 认为《己亥杂诗》只有一首，不知道它是315首的组诗。
    - 把“浩荡离愁白日斜”中的“离愁”理解为离开家人，实为辞官离京。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:巴特农神庙
  type: Concept
  subject: 语文
  title: 巴特农神庙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘巴特农’写成‘帕特农’，虽通用但教材中应为巴特农。
    - 能指出并纠正这一错误：误以为巴特农神庙是罗马建筑，实际是古希腊建筑。
  aliases:
    - 帕特农神庙
  category: 建筑
  explanation: 古希腊雅典卫城上的神庙，是古希腊文明的象征。
  misconceptions:
    - 误将‘巴特农’写成‘帕特农’，虽通用但教材中应为巴特农。
    - 误以为巴特农神庙是罗马建筑，实际是古希腊建筑。
    - 认为巴特农神庙位于埃及，与金字塔同属古埃及文明。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:巴特勒上尉
  type: Concept
  subject: 语文
  title: 巴特勒上尉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为巴特勒上尉是英国军官，实际他是法国军官。
    - 能指出并纠正这一错误：误认为他写信是支持雨果谴责英法，实际他是想为法国远征辩护。
  aliases: []
  category: 人物
  explanation: 法国军官，英法联军远征中国时给雨果写信征询看法。
  misconceptions:
    - 误以为巴特勒上尉是英国军官，实际他是法国军官。
    - 误认为他写信是支持雨果谴责英法，实际他是想为法国远征辩护。
    - 把‘巴特勒’错写成‘巴特雷’或‘巴顿’。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:巴金
  type: Concept
  subject: 语文
  title: 巴金
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把巴金原名“李尧棠”写成“李尧堂”或“李尧唐”。
    - 能指出并纠正这一错误：将巴金的《家》《春》《秋》和《雾》《雨》《电》混淆，说成爱情三部曲。
  aliases:
    - 李尧棠
  category: 作家
  explanation: 巴金（1904—2005），原名李尧棠，现代著名作家，主要作品有《家》《春》《秋》等。
  misconceptions:
    - 把巴金原名“李尧棠”写成“李尧堂”或“李尧唐”。
    - 将巴金的《家》《春》《秋》和《雾》《雨》《电》混淆，说成爱情三部曲。
    - 把老舍的《茶馆》安到巴金头上，或说巴金是“人民艺术家”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:布局谋篇
  type: Concept
  subject: 语文
  title: 布局谋篇
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把“布局谋篇”等同于列提纲，忽视对材料组织的整体规划。
    - 能指出并纠正这一错误：认为布局谋篇只涉及段落顺序，不包括开头结尾的呼应。
  aliases: []
  category: 写作知识
  explanation: 布局谋篇是在审题立意、选材之后，对材料的组织、结构的安排等做整体谋划，包括列提纲等。
  misconceptions:
    - 把“布局谋篇”等同于列提纲，忽视对材料组织的整体规划。
    - 认为布局谋篇只涉及段落顺序，不包括开头结尾的呼应。
    - 误将“谋篇”写成“谋遍”，或与“选材”混为一谈。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:希望
  type: Concept
  subject: 语文
  title: 希望
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“希望”理解为具体的物质目标，如“有钱”或“好生活”
    - 能指出并纠正这一错误：将“其实地上本没有路”理解成“无路可走”，忽略“走的人多了”的主动创造
  aliases: []
  category: 主题思想
  explanation: 《故乡》结尾关于希望的议论，表达了作者对新的生活的向往和探索。
  misconceptions:
    - 把“希望”理解为具体的物质目标，如“有钱”或“好生活”
    - 将“其实地上本没有路”理解成“无路可走”，忽略“走的人多了”的主动创造
    - 认为鲁迅否定希望，说“希望是虚无的”，实际是号召人们去创造
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:帝室之胄
  type: Concept
  subject: 语文
  title: 帝室之胄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“胄”误写为“胃”，写成“帝室之胃”。
    - 能指出并纠正这一错误：误认为“胄”是头盔，把“帝室之胄”解释为帝王戴的头盔。
  aliases: []
  category: 文言词语
  explanation: 帝王或贵族的后代，胄指后代。
  misconceptions:
    - 将“胄”误写为“胃”，写成“帝室之胃”。
    - 误认为“胄”是头盔，把“帝室之胄”解释为帝王戴的头盔。
    - 把“帝室之胄”与“帝王之师”混淆，指帝王老师。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:常用偏旁名称
  type: Concept
  subject: 语文
  title: 常用偏旁名称
  conceptType: 概念型
  aliases:
    - 偏旁名称
  category: 概念
  explanation: 偏旁是字的组成部分，每个偏旁都有名字，比如三点水、草字头、宝盖头。叫得出偏旁的名字，写字和认字都更方便。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C13/sections/S1.md
- id: concept:语文:干戈寥落
  type: Concept
  subject: 语文
  title: 干戈寥落
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘干戈’写成‘干弋’或‘千戈’，字形混淆。
    - 能指出并纠正这一错误：将‘寥落’误认为‘辽阔’，导致理解成战争规模宏大。
  aliases: []
  category: 文言词语
  explanation: 指抗元战事逐渐消歇，干戈代指战争。
  misconceptions:
    - 把‘干戈’写成‘干弋’或‘千戈’，字形混淆。
    - 将‘寥落’误认为‘辽阔’，导致理解成战争规模宏大。
    - 解释‘干戈寥落’为‘武器稀少’，忽略其指战事渐息。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:平舌音和翘舌音
  type: Concept
  subject: 语文
  title: 平舌音和翘舌音
  conceptType: 概念型
  aliases:
    - 平翘舌音
  category: 概念
  explanation: z、c、s 是平舌音，发音时舌头平平地抵住牙齿；zh、ch、sh 是翘舌音，发音时舌头要翘起来。读的时候要分清，比如擦玻璃和蜘蛛的声母不同。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:并列复句
  type: Concept
  subject: 语文
  title: 并列复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将承接复句误判为并列复句，如‘他推开门，走进教室’是承接。
    - 能指出并纠正这一错误：认为没有关联词的复句不是并列复句，如‘风停了，雨住了’也是并列。
  aliases: []
  category: 语法
  explanation: 几个分句是并列关系，没有主次之分，或表明一正一反两方面的情况，或说明一件事情的几个方面，或叙述相关的几件事情。
  misconceptions:
    - 将承接复句误判为并列复句，如‘他推开门，走进教室’是承接。
    - 认为没有关联词的复句不是并列复句，如‘风停了，雨住了’也是并列。
    - 把并列复句与递进复句混淆，如‘他不但聪明，而且勤奋’是递进。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:幽默
  type: Concept
  subject: 语文
  title: 幽默
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'车夫之王'是车夫自大，实为幽默自称。
    - 能指出并纠正这一错误：将幽默视为讽刺，认为本文批评车夫。
  aliases: []
  category: 语言风格
  explanation: 本文语言幽默，如车夫自称“车夫之王”，富有情趣。
  misconceptions:
    - 误以为'车夫之王'是车夫自大，实为幽默自称。
    - 将幽默视为讽刺，认为本文批评车夫。
    - 误以为幽默就是随意搞笑，不理解其语言情趣。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:庄子
  type: Concept
  subject: 语文
  title: 庄子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把庄子归入儒家，与孔子、孟子并列，实际他是道家代表人物。
    - 能指出并纠正这一错误：将庄子名“周”理解为周朝，误写为“庄周”即“庄周朝”。
  aliases:
    - 庄周
  category: 文学常识
  explanation: 战国时期哲学家，道家学派代表人物，名周，宋国蒙人，著有《庄子》一书。
  misconceptions:
    - 把庄子归入儒家，与孔子、孟子并列，实际他是道家代表人物。
    - 将庄子名“周”理解为周朝，误写为“庄周”即“庄周朝”。
    - 认为《庄子》是庄子和惠子合著，实际惠子是辩论对手非作者。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:应用场合
  type: Concept
  subject: 语文
  title: 应用场合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：给朋友贺卡写“此致敬礼”，给校长写信写“嗨”，场合用语错位。
    - 能指出并纠正这一错误：在正式报告中使用“给力”“yyds”等网络词，破坏庄重感。
  aliases:
    - 场合
  category: 写作要素
  explanation: 根据文章应用的场合（如正式场合或非正式场合）选择庄重或轻松的用语。
  misconceptions:
    - 给朋友贺卡写“此致敬礼”，给校长写信写“嗨”，场合用语错位。
    - 在正式报告中使用“给力”“yyds”等网络词，破坏庄重感。
    - 认为正式场合只要内容对，语言风格无所谓。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:座右铭
  type: Concept
  subject: 语文
  title: 座右铭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“座右铭”误写成“坐右铭”或“座右名”，混淆“座”与“坐”、“铭”与“名”的字形。
    - 能指出并纠正这一错误：认为座右铭必须出自名家，自己写的句子不能算座右铭。
  aliases:
    - 格言
    - 箴言
  category: 文化常识
  explanation: 座右铭是置于座右用以自警的格言，常选取富有哲理或激励作用的语句。
  misconceptions:
    - 把“座右铭”误写成“坐右铭”或“座右名”，混淆“座”与“坐”、“铭”与“名”的字形。
    - 认为座右铭必须出自名家，自己写的句子不能算座右铭。
    - 以为座右铭只能是一句完整的话，像“学无止境”这样的短语不算座右铭。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:延安精神
  type: Concept
  subject: 语文
  title: 延安精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将延安精神与长征精神、井冈山精神混为一谈，忽略其自力更生、实事求是的独特内涵。
    - 能指出并纠正这一错误：把“延安”误写为“延岸”或“延按”，字音相同导致字形混淆。
  aliases: []
  category: 文化常识
  explanation: 延安时期形成的革命精神，包括自力更生、艰苦奋斗、实事求是、为人民服务等内涵。
  misconceptions:
    - 将延安精神与长征精神、井冈山精神混为一谈，忽略其自力更生、实事求是的独特内涵。
    - 把“延安”误写为“延岸”或“延按”，字音相同导致字形混淆。
    - 认为延安精神只强调艰苦奋斗，缺失为人民服务等内涵。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:建安风骨
  type: Concept
  subject: 语文
  title: 建安风骨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘建安风骨’理解为刚正不阿的人格风骨，而非诗歌风格
    - 能指出并纠正这一错误：误认为建安风骨指建安七子的散文风格，与诗歌无关
  aliases:
    - 建安风力
  category: 文学风格
  explanation: 汉末建安时期诗歌所表现出的刚健遒劲、慷慨悲凉的风格。
  misconceptions:
    - 把‘建安风骨’理解为刚正不阿的人格风骨，而非诗歌风格
    - 误认为建安风骨指建安七子的散文风格，与诗歌无关
    - ‘遒劲’的‘遒’误写为‘酋’或‘求’，字形混淆
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S8.md
- id: concept:语文:开头和结尾的作用
  type: Concept
  subject: 语文
  title: 开头和结尾的作用
  conceptType: 概念型
  aliases:
    - 文章的开头和结尾
  category: 方法
  explanation: 好的开头能激发读者的阅读兴趣，好的结尾能增强文章的感染力，令人回味无穷。如《十六年前的回忆》首尾都点明日期，令人难忘。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:弃医从文
  type: Concept
  subject: 语文
  title: 弃医从文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为鲁迅弃医是受藤野先生批评或成绩不好刺激
    - 能指出并纠正这一错误：将幻灯片事件说成是中国人被俄国人枪毙
  aliases: []
  category: 文学常识
  explanation: 鲁迅在仙台学医时，因观看日俄战争幻灯片中中国人围观同胞被枪毙而深受刺激，决定放弃医学，转而从事文艺运动，以改变国民精神。
  misconceptions:
    - 误以为鲁迅弃医是受藤野先生批评或成绩不好刺激
    - 将幻灯片事件说成是中国人被俄国人枪毙
    - 认为弃医从文是回国后才决定的，而非在仙台
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:弄潮的好手
  type: Concept
  subject: 语文
  title: 弄潮的好手
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“弄潮”理解为兴风作浪或玩弄潮水，忽略其游水驾船的本义。
    - 能指出并纠正这一错误：将“好手”错解为“好人”，实际指技艺高超、善于游泳的人。
  aliases: []
  category: 词语
  explanation: 懂得水性、善于游水驾船的人。
  misconceptions:
    - 把“弄潮”理解为兴风作浪或玩弄潮水，忽略其游水驾船的本义。
    - 将“好手”错解为“好人”，实际指技艺高超、善于游泳的人。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:引用
  type: Concept
  subject: 语文
  title: 引用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为只有直接引用原话才算引用，间接转述他人的话不算引用。
    - 能指出并纠正这一错误：把引用与反复混同，认为文中重复出现的语句就是引用。
  aliases: []
  category: 写作手法
  explanation: 引用是在文章中直接或间接引用他人的话语或文字，以增强文章的真实性和说服力。本文多次引用居里夫人的话，补充历史细节，展示传主心理。
  misconceptions:
    - 以为只有直接引用原话才算引用，间接转述他人的话不算引用。
    - 把引用与反复混同，认为文中重复出现的语句就是引用。
    - 误以为引用只能用来证明观点，忽略了引用还能展示人物心理。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:引用资料
  type: Concept
  subject: 语文
  title: 引用资料
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：引用数据时凭印象写，如把“约80%”写成“80%”，不核实原始资料。
    - 能指出并纠正这一错误：引用图表却不标注来源，让读者误以为是自己调查所得。
  aliases: []
  category: 写作方法
  explanation: 恰当引用数据、图表、历史文献等资料，有助于说清楚事物的特征。
  misconceptions:
    - 引用数据时凭印象写，如把“约80%”写成“80%”，不核实原始资料。
    - 引用图表却不标注来源，让读者误以为是自己调查所得。
    - 引用的资料与说明对象无关，如说明猫的习性却引用天气预报。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:弗罗斯特
  type: Concept
  subject: 语文
  title: 弗罗斯特
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《未选择的路》作者记为普希金，填作者时写错。
    - 能指出并纠正这一错误：认为弗罗斯特是英国浪漫主义诗人，忽略其美国国籍。
  aliases: []
  category: 文学常识
  explanation: 弗罗斯特（1874—1963），美国诗人，代表作有《未选择的路》等。
  misconceptions:
    - 误把《未选择的路》作者记为普希金，填作者时写错。
    - 认为弗罗斯特是英国浪漫主义诗人，忽略其美国国籍。
    - 将弗罗斯特的《未选择的路》与普希金的《假如生活欺骗了你》内容记混，导致作者错配。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:张乡绅
  type: Concept
  subject: 语文
  title: 张乡绅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为张乡绅是《范进中举》中中举的人，实际中举的是范进。
    - 能指出并纠正这一错误：把张乡绅说成《水浒传》中的乡绅，与本节《智取生辰纲》人物混杂。
  aliases:
    - 张静斋
  category: 人物形象
  explanation: 中举后主动结交范进的乡绅，体现官场攀附之风。
  misconceptions:
    - 误认为张乡绅是《范进中举》中中举的人，实际中举的是范进。
    - 把张乡绅说成《水浒传》中的乡绅，与本节《智取生辰纲》人物混杂。
    - 将“绅”误写为“伸”，写成“张乡伸”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:张养浩
  type: Concept
  subject: 语文
  title: 张养浩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：与孟浩然混淆，认为张养浩字浩然，号孟山人。
    - 能指出并纠正这一错误：误认为张养浩是宋代或清代人，朝代张冠李戴。
  aliases:
    - 张希孟
    - 张云庄
  category: 文学常识
  explanation: 元代文学家，字希孟，号云庄，散曲以豪放著称，《山坡羊·潼关怀古》作者。
  misconceptions:
    - 与孟浩然混淆，认为张养浩字浩然，号孟山人。
    - 误认为张养浩是宋代或清代人，朝代张冠李戴。
    - 把《山坡羊·潼关怀古》的作者记为张岱，同姓不同人。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:张岱
  type: Concept
  subject: 语文
  title: 张岱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错记张岱为宋代人，因《湖心亭看雪》带宋人风范。
    - 能指出并纠正这一错误：将张岱的字‘宗子’与号‘陶庵’颠倒成字陶庵号宗子。
  aliases: []
  category: 文学常识
  explanation: 明末清初文学家，字宗子，号陶庵，著有《陶庵梦忆》《西湖梦寻》等。
  misconceptions:
    - 错记张岱为宋代人，因《湖心亭看雪》带宋人风范。
    - 将张岱的字‘宗子’与号‘陶庵’颠倒成字陶庵号宗子。
    - 把张岱的《陶庵梦忆》误记为《浮生六记》。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:张择端
  type: Concept
  subject: 语文
  title: 张择端
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把张择端说成是南宋或元代画家，误记其朝代。
    - 能指出并纠正这一错误：误写张择端的字为‘正德’或‘子端’，混淆其名与字。
  aliases: []
  category: 历史人物
  explanation: 北宋末年画家，字正道，山东东武人，擅长界画，代表作有《清明上河图》。
  misconceptions:
    - 把张择端说成是南宋或元代画家，误记其朝代。
    - 误写张择端的字为‘正德’或‘子端’，混淆其名与字。
    - 将《清明上河图》的作者张冠李戴为李嵩或仇英。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:弥漫
  type: Concept
  subject: 语文
  title: 弥漫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：常把“弥漫”写成“迷漫”，如“烟雾迷漫”。
    - 能指出并纠正这一错误：用“弥漫”描写声音，如“教室里弥漫着读书声”，应改为“充满”。
  aliases: []
  category: 词语
  explanation: 充满，布满。
  misconceptions:
    - 常把“弥漫”写成“迷漫”，如“烟雾迷漫”。
    - 用“弥漫”描写声音，如“教室里弥漫着读书声”，应改为“充满”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:归省
  type: Concept
  subject: 语文
  title: 归省
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“归省”中“省”读成shěng，误为省份的省，正确应读xǐng。
    - 能指出并纠正这一错误：误把“归省”写成“归醒”，因音同混淆字形。
  aliases: []
  category: 文言词语
  explanation: 回家探望父母。省，探望、问候（多指对尊长）。
  misconceptions:
    - 将“归省”中“省”读成shěng，误为省份的省，正确应读xǐng。
    - 误把“归省”写成“归醒”，因音同混淆字形。
    - 把“省”理解成节省，不知此处意为探望问候。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:当之无愧
  type: Concept
  subject: 语文
  title: 当之无愧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'愧'误写为'鬼'，写成'当之无鬼'。
    - 能指出并纠正这一错误：误理解为'应该无所惭愧'，实际是'毫无愧色'。
  aliases: []
  category: 成语
  explanation: 担得起某种荣誉或称号，毫无愧色。
  misconceptions:
    - 把'愧'误写为'鬼'，写成'当之无鬼'。
    - 误理解为'应该无所惭愧'，实际是'毫无愧色'。
    - 与'问心无愧'混用，忽略'当之'的前提。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:形声字
  type: Concept
  subject: 语文
  title: 形声字
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 由表示意义的形符和表示读音的声符组成的字。如“星”“凤”是在象形字上加声符，“蜀”“祭”是在象形字上加形符变来的。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:形容词
  type: Concept
  subject: 语文
  title: 形容词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'害怕'误当形容词，因为能说'很害怕'，其实它是动词，形容词如'恐惧'。
    - 能指出并纠正这一错误：认为所有形容词都可用'很'修饰，如'雪白'不能说'很雪白'，要说'非常白'。
  aliases: []
  category: 语法
  explanation: 形容词是表示人或事物性质、状态、颜色、形状等的词，常用来修饰名词或代词，可用程度副词修饰。
  misconceptions:
    - 把'害怕'误当形容词，因为能说'很害怕'，其实它是动词，形容词如'恐惧'。
    - 认为所有形容词都可用'很'修饰，如'雪白'不能说'很雪白'，要说'非常白'。
    - 把'忽然'当作形容词，实际是副词，形容词应是'突然'，用法不同。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:形容词作动词
  type: Concept
  subject: 语文
  title: 形容词作动词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘负势竞上’中的‘上’当作名词‘上面’，没看出它临时用作动词‘向上伸展’。
    - 能指出并纠正这一错误：认为形容词作动词就是形容词后面必须带宾语，忽略‘上’在这里是不及物动词。
  aliases: []
  category: 文言语法
  explanation: 形容词在句中临时用作动词，表示某种性质或状态的变化。如'负势竞上'中'上'意为'向上伸展'。
  misconceptions:
    - 误把‘负势竞上’中的‘上’当作名词‘上面’，没看出它临时用作动词‘向上伸展’。
    - 认为形容词作动词就是形容词后面必须带宾语，忽略‘上’在这里是不及物动词。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:形象思维
  type: Concept
  subject: 语文
  title: 形象思维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“柳树像小姑娘”就是形象思维，却分不清比喻和联想。
    - 能指出并纠正这一错误：把抽象推理（如数学证明）也当成形象思维，混淆思维方式。
  aliases:
    - 具象思维
  category: 文学理论
  explanation: 通过具体生动的形象来认识和反映客观世界的思维方式，有助于形成深刻记忆。
  misconceptions:
    - 认为“柳树像小姑娘”就是形象思维，却分不清比喻和联想。
    - 把抽象推理（如数学证明）也当成形象思维，混淆思维方式。
    - 觉得形象思维只用在写景中，分析人物形象时想不到它。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:形近字辨析
  type: Concept
  subject: 语文
  title: 形近字辨析
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 长得像的字要仔细看清楚再用，比如“午”和“牛”，只差一小竖。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C8/sections/S4.md
- id: concept:语文:形销骨立
  type: Concept
  subject: 语文
  title: 形销骨立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘销’误写为‘消’，写成‘形消骨立’。
    - 能指出并纠正这一错误：误用为形容孤独，如‘他形销骨立地走在路上’应指瘦，不是孤独。
  aliases: []
  category: 成语
  explanation: 形容身体极其消瘦。
  misconceptions:
    - 把‘销’误写为‘消’，写成‘形消骨立’。
    - 误用为形容孤独，如‘他形销骨立地走在路上’应指瘦，不是孤独。
    - 认为‘形销骨立’是形容精神疲倦，实际是形容形体消瘦。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:彭荆风
  type: Concept
  subject: 语文
  title: 彭荆风
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《驿路梨花》选自《红岩》，作者是罗广斌等
    - 能指出并纠正这一错误：将彭荆风与魏巍混淆，把《谁是最可爱的人》安到彭荆风头上
  aliases: []
  category: 文学常识
  explanation: 彭荆风（1929—2018），江西萍乡人，作家，著有小说集《驿路梨花》。
  misconceptions:
    - 误以为《驿路梨花》选自《红岩》，作者是罗广斌等
    - 将彭荆风与魏巍混淆，把《谁是最可爱的人》安到彭荆风头上
    - 把彭荆风当作清代作家，其实他是现代作家
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:征铎
  type: Concept
  subject: 语文
  title: 征铎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘铎’误写成‘驿’，‘征铎’写成了‘征驿’。
    - 能指出并纠正这一错误：误以为‘征铎’是古代战争时用的号角。
  aliases:
    - 铎
  category: 词语解释
  explanation: 远行车马所挂的铃铛。
  misconceptions:
    - 把‘铎’误写成‘驿’，‘征铎’写成了‘征驿’。
    - 误以为‘征铎’是古代战争时用的号角。
    - 将‘征铎’的‘征’理解为‘征讨’，认为与打仗有关。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:律诗
  type: Concept
  subject: 语文
  title: 律诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为律诗是四句的诗，把绝句当成律诗。
    - 能指出并纠正这一错误：认为《黄鹤楼》不是律诗，因其首联没有对仗，不知律诗仅要求颔联颈联对仗。
  aliases:
    - 格律诗
  category: 文学体裁
  explanation: 律诗是近体诗的一种，讲究平仄、对仗和押韵，通常为八句，分为首联、颔联、颈联和尾联。
  misconceptions:
    - 误以为律诗是四句的诗，把绝句当成律诗。
    - 认为《黄鹤楼》不是律诗，因其首联没有对仗，不知律诗仅要求颔联颈联对仗。
    - 认为律诗押韵可随意押仄声韵，不知通常须押平声韵。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:徐霞客
  type: Concept
  subject: 语文
  title: 徐霞客
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《徐霞客游记》的作者误记为郦道元，实际徐霞客是明代人。
    - 能指出并纠正这一错误：把“霞”写成“暇”，如“徐暇客”，混淆形近字。
  aliases: []
  category: 历史人物
  explanation: 明代地理学家、旅行家，著有《徐霞客游记》，曾到访丽江并记录玉龙雪山和丽江古城。
  misconceptions:
    - 将《徐霞客游记》的作者误记为郦道元，实际徐霞客是明代人。
    - 把“霞”写成“暇”，如“徐暇客”，混淆形近字。
    - 误以为徐霞客是唐朝诗人，与李白混为一谈。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:得道多助，失道寡助
  type: Concept
  subject: 语文
  title: 得道多助，失道寡助
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“得道”理解成得到方法或找到道路
    - 能指出并纠正这一错误：认为“多助”是朋友多，而非支持帮助的人多
  aliases:
    - 得道者多助，失道者寡助
  category: 观点
  explanation: 指施行仁政、合乎道义的人会得到多数人的帮助，反之则少有人帮助。
  misconceptions:
    - 把“得道”理解成得到方法或找到道路
    - 认为“多助”是朋友多，而非支持帮助的人多
    - 把此句与“生于忧患，死于安乐”混淆
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:心旷神怡
  type: Concept
  subject: 语文
  title: 心旷神怡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘神怡’的‘怡’误写成‘饴’或‘贻’。
    - 能指出并纠正这一错误：形容一个人工作成功后感到很累，误用‘心旷神怡’。
  aliases: []
  category: 成语
  explanation: 出自《岳阳楼记》，意为心境开阔，精神愉快。
  misconceptions:
    - 把‘神怡’的‘怡’误写成‘饴’或‘贻’。
    - 形容一个人工作成功后感到很累，误用‘心旷神怡’。
    - 误以为‘心旷神怡’指心胸宽广，能容忍别人。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:心理描写
  type: Concept
  subject: 语文
  title: 心理描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“他心想”误认为是语言描写，因为用了“想”字
    - 能指出并纠正这一错误：把人物说出的“我很害怕”当成心理描写，实为语言描写
  aliases: []
  category: 文学手法
  explanation: 心理描写是直接描写人物内心活动的方法，用以揭示人物性格和情感变化，如杜小康在孤独中的心理变化。
  misconceptions:
    - 将“他心想”误认为是语言描写，因为用了“想”字
    - 把人物说出的“我很害怕”当成心理描写，实为语言描写
    - 认为心理描写只能是“他想”的直接式，忽略梦境、幻觉等间接心理
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:志不强者智不达，言不信者行不果
  type: Concept
  subject: 语文
  title: 志不强者智不达，言不信者行不果
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“智不达”理解成“智商不发达”，正确是“智慧不通达”
    - 能指出并纠正这一错误：把“行不果”理解成“行动没有结果”，实际是“行动不果敢”
  aliases: []
  category: 名言警句
  explanation: 出自《墨子·修身》，意为意志不坚定的人智慧不会通达，言语不诚信的人行动不会果敢。
  misconceptions:
    - 把“智不达”理解成“智商不发达”，正确是“智慧不通达”
    - 把“行不果”理解成“行动没有结果”，实际是“行动不果敢”
    - 将名言误记为孟子所说，实为墨子
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:忠为衣兮信为裳
  type: Concept
  subject: 语文
  title: 忠为衣兮信为裳
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“裳”误读为shang，正确读cháng，指下裙
    - 能指出并纠正这一错误：误以为“衣”与“裳”都指上衣，不知二者有上下之分
  aliases: []
  category: 名言警句
  explanation: 出自卢照邻《中和乐九章·总歌第九》，以衣和裳比喻忠信是人的基本品德。
  misconceptions:
    - 将“裳”误读为shang，正确读cháng，指下裙
    - 误以为“衣”与“裳”都指上衣，不知二者有上下之分
    - 因有“兮”字，误认为出自《楚辞》，实为卢照邻
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:快速阅读
  type: Concept
  subject: 语文
  title: 快速阅读
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：快速阅读时逐字慢读，遇到生词非要查词典才肯继续。
    - 能指出并纠正这一错误：误以为快速阅读等于随便翻翻，完全不理解故事大意。
  aliases: []
  category: 阅读方法
  explanation: 快速阅读要求保持较快的阅读速度，了解故事大意，遇到不认识的生字或不理解的词语可以先跳过去。
  misconceptions:
    - 快速阅读时逐字慢读，遇到生词非要查词典才肯继续。
    - 误以为快速阅读等于随便翻翻，完全不理解故事大意。
    - 认为快速阅读不能跳过任何内容，否则会漏掉重要信息。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:忽复乘舟梦日边
  type: Concept
  subject: 语文
  title: 忽复乘舟梦日边
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为此句典故是姜太公吕尚遇文王的故事。
    - 能指出并纠正这一错误：把‘梦日边’理解成在太阳身边做梦，不懂用典。
  aliases: []
  category: 典故
  explanation: 相传伊尹受商汤任用前，曾梦见乘船经过太阳旁边。
  misconceptions:
    - 误以为此句典故是姜太公吕尚遇文王的故事。
    - 把‘梦日边’理解成在太阳身边做梦，不懂用典。
    - 误写‘忽复’为‘忽忽’，遗忘了原句。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:怀古
  type: Concept
  subject: 语文
  title: 怀古
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘怀古’等同于‘咏史诗’，认为两者完全一样，忽略怀古更侧重古迹。
    - 能指出并纠正这一错误：见到有‘古’字的诗就称怀古诗，如误将《古风》归类。
  aliases:
    - 咏史
  category: 文学体裁
  explanation: 一种诗歌题材，借古事古迹抒发感慨，如《山坡羊·潼关怀古》。
  misconceptions:
    - 把‘怀古’等同于‘咏史诗’，认为两者完全一样，忽略怀古更侧重古迹。
    - 见到有‘古’字的诗就称怀古诗，如误将《古风》归类。
    - 认为怀古诗只能写历史事件，不能抒发个人情感。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:怀古诗
  type: Concept
  subject: 语文
  title: 怀古诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《登幽州台歌》只是抒发孤独，不是怀古诗，其实它借古抒怀。
    - 能指出并纠正这一错误：把怀古诗与咏物诗混为一谈，认为咏史就是写景状物。
  aliases:
    - 咏史诗
  category: 诗歌体裁
  explanation: 怀古诗是借古抒怀、以历史事件或遗迹为题材的诗歌，通过咏史寄托个人感慨。
  misconceptions:
    - 误认为《登幽州台歌》只是抒发孤独，不是怀古诗，其实它借古抒怀。
    - 把怀古诗与咏物诗混为一谈，认为咏史就是写景状物。
    - 认为怀古诗必须写到具体历史人物，忽略借古迹寄托感慨的形式。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:怀疑精神
  type: Concept
  subject: 语文
  title: 怀疑精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把怀疑精神理解为否定一切，凡事都唱反调
    - 能指出并纠正这一错误：误以为怀疑就是找茬，不讲究证据和推理
  aliases:
    - 怀疑态度
  category: 核心概念
  explanation: 怀疑精神指不轻信、不盲从，对事物进行思考、辨别是非的态度，是做学问的基本条件。
  misconceptions:
    - 把怀疑精神理解为否定一切，凡事都唱反调
    - 误以为怀疑就是找茬，不讲究证据和推理
    - 认为怀疑精神只适用文科，不适用于数理公式
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:思维的严密性
  type: Concept
  subject: 语文
  title: 思维的严密性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：分析说明要点时只抓一处细节，忽略其他段落，导致结论片面。
    - 能指出并纠正这一错误：推理时凭主观印象，不用原文语句作依据，如认为‘列了数字就绝对准确’。
  aliases: []
  category: 思维品质
  explanation: 思考问题全面、细致，无漏洞，推理严谨。
  misconceptions:
    - 分析说明要点时只抓一处细节，忽略其他段落，导致结论片面。
    - 推理时凭主观印象，不用原文语句作依据，如认为‘列了数字就绝对准确’。
    - 回答‘为什么’时跳过限制条件，直接说因为所以而漏掉前提。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:思维的条理性
  type: Concept
  subject: 语文
  title: 思维的条理性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：答题不按文章顺序，想到哪写到哪，例如概括特点时先写结尾处的。
    - 能指出并纠正这一错误：分点回答时序号混乱，前后内容重复或矛盾。
  aliases: []
  category: 思维品质
  explanation: 思考问题有条理、有逻辑，能清晰有序地组织信息。
  misconceptions:
    - 答题不按文章顺序，想到哪写到哪，例如概括特点时先写结尾处的。
    - 分点回答时序号混乱，前后内容重复或矛盾。
    - 整理信息时把不同类信息混在一起，如把特征和成因混为一谈。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:思贤如渴
  type: Concept
  subject: 语文
  title: 思贤如渴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“思贤如渴”写成“思闲如渴”，误用“闲”代“贤”。
    - 能指出并纠正这一错误：误以为此成语是形容思念亲人如饥似渴，与求贤无关。
  aliases: []
  category: 成语
  explanation: 比喻迫切希望得到有才德的人，就像口渴想喝水一样。
  misconceptions:
    - 把“思贤如渴”写成“思闲如渴”，误用“闲”代“贤”。
    - 误以为此成语是形容思念亲人如饥似渴，与求贤无关。
    - 近义词误用，把“思贤如渴”当成“见贤思齐”来用。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:总说与分说
  type: Concept
  subject: 语文
  title: 总说与分说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为全文结构先分说各景点，再总说整体特征。
    - 能指出并纠正这一错误：将第二段误认为分说，其实它是对总特征的具体说明。
  aliases:
    - 总分结构
  category: 写作手法
  explanation: 先总述苏州园林的整体特征，再从布局、配合、映衬、层次等方面分说。
  misconceptions:
    - 认为全文结构先分说各景点，再总说整体特征。
    - 将第二段误认为分说，其实它是对总特征的具体说明。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:恐龙灭绝的撞击说
  type: Concept
  subject: 语文
  title: 恐龙灭绝的撞击说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为斯石英只能在撞击中形成，实际火山高压也可能形成。
    - 能指出并纠正这一错误：认为铱元素异常是恐龙尸体造成的，实际来自小行星。
  aliases:
    - 撞击事件
  category: 科学假说
  explanation: 认为恐龙灭绝是由小行星或彗星撞击地球导致的，证据包括斯石英的存在和铱元素异常。
  misconceptions:
    - 误以为斯石英只能在撞击中形成，实际火山高压也可能形成。
    - 认为铱元素异常是恐龙尸体造成的，实际来自小行星。
    - 将撞击说与火山说混淆，认为两者都强调火山作用。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:恐龙灭绝的火山说
  type: Concept
  subject: 语文
  title: 恐龙灭绝的火山说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为斯石英的存在支持火山说，实际文中用斯石英否定火山说。
    - 能指出并纠正这一错误：将火山说与撞击说混为一谈，认为恐龙灭绝主因是火山喷发。
  aliases: []
  category: 科学假说
  explanation: 认为恐龙灭绝是由大规模火山活动引起的，但本文通过斯石英证据否定了这一假说。
  misconceptions:
    - 误认为斯石英的存在支持火山说，实际文中用斯石英否定火山说。
    - 将火山说与撞击说混为一谈，认为恐龙灭绝主因是火山喷发。
    - 认为火山说的证据是铱元素异常，实际铱异常是撞击说证据。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:悬念
  type: Concept
  subject: 语文
  title: 悬念
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把人物内心的疑惑当作悬念，例如‘他心中不解’不是叙事悬念
    - 能指出并纠正这一错误：将悬念与伏笔混为一谈，伏笔是暗示后文，悬念是制造急切期待
  aliases: []
  category: 写作手法
  explanation: 悬念是作者在叙述中设置疑问或矛盾，以引起读者好奇心和期待感的写作手法。
  misconceptions:
    - 把人物内心的疑惑当作悬念，例如‘他心中不解’不是叙事悬念
    - 将悬念与伏笔混为一谈，伏笔是暗示后文，悬念是制造急切期待
    - 认为悬念必须在结尾揭晓，其实文中任何位置都可设置悬念
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:悲剧命运
  type: Concept
  subject: 语文
  title: 悲剧命运
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为祥子堕落是因为懒惰，忽视旧社会军阀、虎妞等压迫因素
    - 能指出并纠正这一错误：把悲剧命运等同于“结局惨”，不理解个人奋斗的必然失败
  aliases:
    - 悲剧
  category: 主题思想
  explanation: 祥子从勤劳善良到堕落麻木的历程，揭示了旧社会对底层人民的压迫和摧残。
  misconceptions:
    - 认为祥子堕落是因为懒惰，忽视旧社会军阀、虎妞等压迫因素
    - 把悲剧命运等同于“结局惨”，不理解个人奋斗的必然失败
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:情感变化
  type: Concept
  subject: 语文
  title: 情感变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘我’对父亲的情感始终如一，忽略了从暗笑到流泪再到怀念的变化过程。
    - 能指出并纠正这一错误：把开头的‘暗笑他的迂’理解为儿子讨厌父亲，其实只是不理解父亲的举动。
  aliases: []
  category: 人物分析
  explanation: “我”对父亲的情感从最初的不解、暗笑其迂，到后来看到背影而感动流泪，再到多年后怀念，体现了情感的变化过程。
  misconceptions:
    - 认为‘我’对父亲的情感始终如一，忽略了从暗笑到流泪再到怀念的变化过程。
    - 把开头的‘暗笑他的迂’理解为儿子讨厌父亲，其实只是不理解父亲的举动。
    - 说情感变化是突然发生的，忽视了车站送别、买橘子等细节的铺垫作用。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:情感表达
  type: Concept
  subject: 语文
  title: 情感表达
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为情感表达就是多用“啊！我真幸福！”之类的感叹句，直白空洞，缺乏细节支撑。
    - 能指出并纠正这一错误：写家庭温暖时只写“妈妈很爱我”，没有通过具体事例和动作表情来表达，干巴巴。
  aliases:
    - 抒情
  category: 写作知识
  explanation: 情感表达是写作中通过语言、细节等传达作者情感，使文章充实饱满、有感染力。要求恰如其分地表达情感。
  misconceptions:
    - 认为情感表达就是多用“啊！我真幸福！”之类的感叹句，直白空洞，缺乏细节支撑。
    - 写家庭温暖时只写“妈妈很爱我”，没有通过具体事例和动作表情来表达，干巴巴。
    - 把“情感表达”理解为修辞手法，如用比喻就是表达情感，误用术语。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:情景交融
  type: Concept
  subject: 语文
  title: 情景交融
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写景时不带情感，结尾硬加“我高兴极了”，如描写阴雨却无压抑感，情与景脱节。
    - 能指出并纠正这一错误：把“情景交融”理解成直接抒情，如写“这景色真美啊”却无具体景物承载情感。
  aliases:
    - 寓情于景
  category: 写作方法
  explanation: 在景物描写中融入作者的情感，使客观景物带上主观色彩，增强文章的感染力。
  misconceptions:
    - 写景时不带情感，结尾硬加“我高兴极了”，如描写阴雨却无压抑感，情与景脱节。
    - 把“情景交融”理解成直接抒情，如写“这景色真美啊”却无具体景物承载情感。
    - 情感与景物特征不符，如写丰收田野却用“凄凉”“萧瑟”的词语，违背情景协调。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:情节梳理
  type: Concept
  subject: 语文
  title: 情节梳理
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把《故乡》中回忆少年闰土的片段误认为倒叙，实际是插叙
    - 能指出并纠正这一错误：梳理情节时只按事件先后顺序，忽略因果和悬念，导致概括不完整
  aliases:
    - 情节分析
  category: 阅读方法
  explanation: 通过梳理小说的开端、发展、高潮、结局，把握故事脉络，理解情节的因果关系和悬念设置。
  misconceptions:
    - 把《故乡》中回忆少年闰土的片段误认为倒叙，实际是插叙
    - 梳理情节时只按事件先后顺序，忽略因果和悬念，导致概括不完整
    - 误以为高潮一定是故事中间部分，不知高潮是矛盾最尖锐处
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:情节结构
  type: Concept
  subject: 语文
  title: 情节结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为每篇小说都必须有序幕和尾声，忽略很多小说直接从开头写起
    - 能指出并纠正这一错误：把情节结构和叙述顺序混为一谈，认为倒叙就是结构上的颠倒
  aliases: []
  category: 文学常识
  explanation: 小说的情节一般包括开端、发展、高潮、结局，有时有序幕和尾声。
  misconceptions:
    - 认为每篇小说都必须有序幕和尾声，忽略很多小说直接从开头写起
    - 把情节结构和叙述顺序混为一谈，认为倒叙就是结构上的颠倒
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:惬意
  type: Concept
  subject: 语文
  title: 惬意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘惬意’误读为‘xiá yì’，因与‘侠’字形相近
    - 能指出并纠正这一错误：把‘惬意’写成‘怯意’，误以为是胆小害怕的意思
  aliases: []
  category: 词语
  explanation: 满意，称心。
  misconceptions:
    - 将‘惬意’误读为‘xiá yì’，因与‘侠’字形相近
    - 把‘惬意’写成‘怯意’，误以为是胆小害怕的意思
    - 用‘惬意’表示骄傲自满，如‘他考了满分，很惬意’
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:想象
  type: Concept
  subject: 语文
  title: 想象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把想象与联想混为一谈，以为由甲想到乙就是想象。
    - 能指出并纠正这一错误：误以为想象可以完全脱离现实，忽视其源于生活经验。
  aliases: []
  category: 文学概念
  explanation: 想象是人类与生俱来的一种能力，借助想象可以超越自身局限，体验更广大的世界。
  misconceptions:
    - 把想象与联想混为一谈，以为由甲想到乙就是想象。
    - 误以为想象可以完全脱离现实，忽视其源于生活经验。
    - 认为只有神话才需要想象，写实作品不需要想象。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:想象与夸张
  type: Concept
  subject: 语文
  title: 想象与夸张
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'皇帝穿新衣'看作夸张，实际是想象出的虚构情节
    - 能指出并纠正这一错误：写作文时认为想象可以脱离实际胡编乱造，毫无逻辑
  aliases: []
  category: 写作手法
  explanation: 想象是在头脑中创造出未曾有过的新形象，夸张是对事物进行夸大或缩小，两者结合使童话情节荒诞离奇。
  misconceptions:
    - 把'皇帝穿新衣'看作夸张，实际是想象出的虚构情节
    - 写作文时认为想象可以脱离实际胡编乱造，毫无逻辑
    - 混淆二者：夸大事物特征是夸张，创造不存在形象是想象
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:想象与虚构
  type: Concept
  subject: 语文
  title: 想象与虚构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将虚构等同于胡编乱造，认为虚构可以完全脱离现实生活
    - 能指出并纠正这一错误：误以为想象就是幻想，忽视想象需基于生活逻辑和人物性格
  aliases:
    - 虚构
  category: 写作方法
  explanation: 想象是小说创作的重要手法，虚构是小说创作的基本特征，通过想象和虚构创造艺术世界。
  misconceptions:
    - 将虚构等同于胡编乱造，认为虚构可以完全脱离现实生活
    - 误以为想象就是幻想，忽视想象需基于生活逻辑和人物性格
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:想象雄奇瑰丽
  type: Concept
  subject: 语文
  title: 想象雄奇瑰丽
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“想象雄奇瑰丽”用来形容杜甫诗作，不解这是《庄子》特色。
    - 能指出并纠正这一错误：认为雄奇瑰丽只指场面宏大，忽略《庄子》神奇怪诞的想象。
  aliases: []
  category: 文学风格
  explanation: 指《庄子》中想象奇特、气势恢宏的艺术特色。
  misconceptions:
    - 把“想象雄奇瑰丽”用来形容杜甫诗作，不解这是《庄子》特色。
    - 认为雄奇瑰丽只指场面宏大，忽略《庄子》神奇怪诞的想象。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:意匠
  type: Concept
  subject: 语文
  title: 意匠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘意匠’当作‘意境’的近义词，混淆二者。
    - 能指出并纠正这一错误：认为意匠只是绘画技巧，与思想感情无关，无需精心设计。
  aliases:
    - 表现方法
    - 表现手段
  category: 美学概念
  explanation: 意匠即表现方法、表现手段的设计，简单说就是加工手段，是传达思想感情的具体艺术手法。
  misconceptions:
    - 把‘意匠’当作‘意境’的近义词，混淆二者。
    - 认为意匠只是绘画技巧，与思想感情无关，无需精心设计。
    - 将‘意匠’理解为艺术家的‘匠心’，忽略其作为表现手法的具体性。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:意境
  type: Concept
  subject: 语文
  title: 意境
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为意境就是景物描写，分析时只找写景句，完全忽略情感
    - 能指出并纠正这一错误：把“借景抒情”直接等同于意境，混淆表现手法与整体效果
  aliases: []
  category: 文学理论
  explanation: 意境是文学作品通过形象描写表现出的境界和情调，是情与景的融合。
  misconceptions:
    - 认为意境就是景物描写，分析时只找写景句，完全忽略情感
    - 把“借景抒情”直接等同于意境，混淆表现手法与整体效果
    - 误以为只有诗歌才有意境，散文和小说没有意境可言
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:意境与意匠的关系
  type: Concept
  subject: 语文
  title: 意境与意匠的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为意境和意匠是独立的，先有意境再随意配上方法即可。
    - 能指出并纠正这一错误：认为意匠比意境更重要，忽略意境是灵魂。
  aliases: []
  category: 美学原理
  explanation: 意境和意匠是山水画的两个关键，有了意境没有意匠，意境就会落空；意匠是为传达意境服务的。
  misconceptions:
    - 认为意境和意匠是独立的，先有意境再随意配上方法即可。
    - 认为意匠比意境更重要，忽略意境是灵魂。
    - 以为有了意境就自然有意匠，无需刻意经营。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:意境的获得
  type: Concept
  subject: 语文
  title: 意境的获得
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要身临其境观察，就能自动获得意境，无需思想感情。
    - 能指出并纠正这一错误：把‘深刻认识对象’理解为走马观花看个大概，导致意境浮浅。
  aliases:
    - 创造意境
  category: 美学概念
  explanation: 获得意境需要深刻认识对象，有强烈真挚的思想感情，并身临其境长期观察。
  misconceptions:
    - 认为只要身临其境观察，就能自动获得意境，无需思想感情。
    - 把‘深刻认识对象’理解为走马观花看个大概，导致意境浮浅。
    - 认为意境可以凭空想象，不必长期观察和真情实感。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:意象
  type: Concept
  subject: 语文
  title: 意象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为意象就是客观景物，忽略其中寄托的作者情感。
    - 能指出并纠正这一错误：将“子规”啼声当作意象，实际子规鸟的意象是表达哀怨凄凉。
  aliases: []
  category: 文学理论
  explanation: 诗歌中融入诗人情感的客观物象，如“杨花”“子规”等。
  misconceptions:
    - 误以为意象就是客观景物，忽略其中寄托的作者情感。
    - 将“子规”啼声当作意象，实际子规鸟的意象是表达哀怨凄凉。
    - 混淆意象与意境，误认为意象就是整首诗的氛围。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:愚公移山
  type: Concept
  subject: 语文
  title: 愚公移山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把寓言当成真实历史事件，认为愚公移山是纪实故事
    - 能指出并纠正这一错误：认为愚公精神只靠蛮力硬挖，忽略其象征意义和坚持不懈的智慧
  aliases:
    - 愚公移山的故事
  category: 寓言
  explanation: 《列子》中的一则寓言，讲述愚公不畏艰难，坚持不懈挖山，最终感动天帝而将山移走的故事，寓意只要有坚定的信念和毅力，就能克服困难。
  misconceptions:
    - 把寓言当成真实历史事件，认为愚公移山是纪实故事
    - 认为愚公精神只靠蛮力硬挖，忽略其象征意义和坚持不懈的智慧
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:感动中国年度人物
  type: Concept
  subject: 语文
  title: 感动中国年度人物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为感动中国年度人物由政府评选，实际由媒体评选
    - 能指出并纠正这一错误：误以为颁奖词由获奖者本人撰写，实际是组委会撰写
  aliases: []
  category: 社会荣誉
  explanation: 感动中国年度人物是媒体评选的年度人物，其颁奖词常被引用。
  misconceptions:
    - 认为感动中国年度人物由政府评选，实际由媒体评选
    - 误以为颁奖词由获奖者本人撰写，实际是组委会撰写
    - 把感动中国与全国道德模范视为同一评选机制，混淆两者性质
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:感受小说人物形象
  type: Concept
  subject: 语文
  title: 感受小说人物形象
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读小说时可以关注情节，从人物做的事情中感受他的品格；可以把自己想象成小说中的人物；还可以借助环境描写来体会人物形象。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:感受神话中神奇的想象
  type: Concept
  subject: 语文
  title: 感受神话中神奇的想象
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读神话时，边读边想象那些神奇的情节和画面，感受神话的魅力，说说人物给自己留下的印象。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:感受童话的奇妙
  type: Concept
  subject: 语文
  title: 感受童话的奇妙
  conceptType: 程序型
  aliases:
    - 体会童话的奇妙
  category: 方法
  explanation: 读童话时边读边想象画面，体会故事中奇妙的想象和人物真善美的形象，如巨人花园里花儿会跳舞、春天会迟到。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C8/sections/S2.md
- id: concept:语文:感叹句
  type: Concept
  subject: 语文
  title: 感叹句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为句子末尾带感叹号就是感叹句，比如‘快跑！’其实祈使句也用感叹号。
    - 能指出并纠正这一错误：误以为感叹句必须含有‘啊、呀’等语气词，没有就不算。
  aliases: []
  category: 语法知识
  explanation: 用来表示某种感情的句子，如赞美、惊讶等。
  misconceptions:
    - 认为句子末尾带感叹号就是感叹句，比如‘快跑！’其实祈使句也用感叹号。
    - 误以为感叹句必须含有‘啊、呀’等语气词，没有就不算。
    - 把‘这画太美了！’说成是祈使句，混淆表达感情与要求动作。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:感情基调
  type: Concept
  subject: 语文
  title: 感情基调
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《秋天的怀念》的感情基调只有沉痛和悲伤，忽略了文中“好好儿活”所传达的坚强与希望。
    - 能指出并纠正这一错误：朗读时从始至终都使用缓慢低沉的声调，没有根据情感变化调整节奏，导致感情基调单一。
  aliases: []
  category: 阅读方法
  explanation: 文章整体情感倾向，朗读时需把握。
  misconceptions:
    - 误以为《秋天的怀念》的感情基调只有沉痛和悲伤，忽略了文中“好好儿活”所传达的坚强与希望。
    - 朗读时从始至终都使用缓慢低沉的声调，没有根据情感变化调整节奏，导致感情基调单一。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:感谢信
  type: Concept
  subject: 语文
  title: 感谢信
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：称呼不当，直呼老师为“老李”，对长辈说“你”而不用“您”。
    - 能指出并纠正这一错误：感谢内容空洞，只重复“谢谢”却不写具体帮助细节。
  aliases: []
  category: 应用文
  explanation: 一种表达感谢的书信，要求用语恭敬、热情、恳切，注意称呼和问候语。
  misconceptions:
    - 称呼不当，直呼老师为“老李”，对长辈说“你”而不用“您”。
    - 感谢内容空洞，只重复“谢谢”却不写具体帮助细节。
    - 结尾用命令语气，如“以后有事找我”，不够恳切恭敬。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:愧赧
  type: Concept
  subject: 语文
  title: 愧赧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“赧”误写为“赫”或“郝”，写错字形。
    - 能指出并纠正这一错误：将“愧赧”误解为因羞愧而大喊，与“赧”本义脸红无关。
  aliases: []
  category: 文言词语
  explanation: 因羞惭而脸红，形容羞愧。
  misconceptions:
    - 把“赧”误写为“赫”或“郝”，写错字形。
    - 将“愧赧”误解为因羞愧而大喊，与“赧”本义脸红无关。
    - 误读“赧”为bào，不知读nǎn。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:慰勉
  type: Concept
  subject: 语文
  title: 慰勉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“慰勉”误写为“慰免”，把“勉”字写错。
    - 能指出并纠正这一错误：混用“慰勉”与“安慰”，忽略“勉”含勉励之意。
  aliases: []
  category: 词语
  explanation: 安慰勉励。
  misconceptions:
    - 将“慰勉”误写为“慰免”，把“勉”字写错。
    - 混用“慰勉”与“安慰”，忽略“勉”含勉励之意。
    - 误以为“慰勉”就是慰问，缺少鼓励义。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:慷慨激昂
  type: Concept
  subject: 语文
  title: 慷慨激昂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘慷慨激昂’写作‘慷概激昂’，误将‘慨’写成‘概’。
    - 能指出并纠正这一错误：用‘慷慨激昂’形容乐于助人的大方行为，混同于‘慷慨解囊’。
  aliases: []
  category: 成语
  explanation: 形容情绪、语调激动昂扬而充满正气。
  misconceptions:
    - 把‘慷慨激昂’写作‘慷概激昂’，误将‘慨’写成‘概’。
    - 用‘慷慨激昂’形容乐于助人的大方行为，混同于‘慷慨解囊’。
    - 认为‘激昂’是‘激励’的意思，导致造句为‘他的话激昂了我’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:戍垒
  type: Concept
  subject: 语文
  title: 戍垒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“戍”误读为“xū”或“wù”，与“戌”“戊”字形混淆。
    - 能指出并纠正这一错误：误写“戍垒”为“戌垒”或“戊垒”，意思变成边防营垒。
  aliases: []
  category: 文言词语
  explanation: 边防驻军的营垒。
  misconceptions:
    - 把“戍”误读为“xū”或“wù”，与“戌”“戊”字形混淆。
    - 误写“戍垒”为“戌垒”或“戊垒”，意思变成边防营垒。
    - 认为戍垒是“戍守的城墙”，忽略营垒的军事驻防功能。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:戍鼓
  type: Concept
  subject: 语文
  title: 戍鼓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘戍’写成‘戌’或‘戊’，因字形相近混淆。
    - 能指出并纠正这一错误：误以为‘戍鼓’是城楼上报更的鼓声。
  aliases: []
  category: 词语理解
  explanation: 边防驻军的鼓声。
  misconceptions:
    - 将‘戍’写成‘戌’或‘戊’，因字形相近混淆。
    - 误以为‘戍鼓’是城楼上报更的鼓声。
    - 把‘戍鼓’解释为‘戍守的士兵’，不指鼓声。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:戏剧冲突
  type: Concept
  subject: 语文
  title: 戏剧冲突
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看到人物争吵，忽略人物与环境的矛盾及内心冲突
    - 能指出并纠正这一错误：把“冲突”等同于日常“矛盾”，未突出戏剧性
  aliases:
    - 冲突
  category: 文学概念
  explanation: 戏剧中人物之间、人物与环境之间或人物内心的矛盾与斗争，是推动剧情发展的核心。
  misconceptions:
    - 只看到人物争吵，忽略人物与环境的矛盾及内心冲突
    - 把“冲突”等同于日常“矛盾”，未突出戏剧性
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:戏剧排练
  type: Concept
  subject: 语文
  title: 戏剧排练
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：与“彩排”混用，误以为排练就是带妆连排
    - 能指出并纠正这一错误：认为排练只对台词，不考虑走位、动作等调度
  aliases:
    - 排练
  category: 戏剧活动
  explanation: 演员在导演指导下反复练习台词、动作、走位等，为正式演出做准备的过程。
  misconceptions:
    - 与“彩排”混用，误以为排练就是带妆连排
    - 认为排练只对台词，不考虑走位、动作等调度
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:成语
  type: Concept
  subject: 语文
  title: 成语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把成语‘不耻下问’用在上级对下级，实际是指乐于向地位、学问不如自己的人请教
    - 能指出并纠正这一错误：将‘温故知新’写成‘温故知心’，误解为‘内心知道’，脱离原文含义
  aliases: []
  category: 语言知识
  explanation: 汉语中结构固定、意义完整的短语，多来自古代文献，如“温故知新”“不耻下问”等。
  misconceptions:
    - 把成语‘不耻下问’用在上级对下级，实际是指乐于向地位、学问不如自己的人请教
    - 将‘温故知新’写成‘温故知心’，误解为‘内心知道’，脱离原文含义
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:手卷
  type: Concept
  subject: 语文
  title: 手卷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为手卷可以挂在墙上欣赏，实际它只能摊开在案头看。
    - 能指出并纠正这一错误：把手卷和立轴混为一谈，认为都是竖挂的长幅。
  aliases: []
  category: 绘画形式
  explanation: 裱成横幅的书画长卷，供案头观赏，能卷舒，不能悬挂。
  misconceptions:
    - 误以为手卷可以挂在墙上欣赏，实际它只能摊开在案头看。
    - 把手卷和立轴混为一谈，认为都是竖挂的长幅。
    - 认为手卷的‘卷’读四声，实际作为量词或名词常读三声，导致读音错误。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:手影戏
  type: Concept
  subject: 语文
  title: 手影戏
  conceptType: 概念型
  aliases:
    - 玩手影
  category: 文化常识
  explanation: 手影戏是把手的形状放在灯光前，让影子变出各种动物的游戏。故事里两个男孩用手影比本事，最后用鸽子表示和好。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:打电话的礼貌
  type: Concept
  subject: 语文
  title: 打电话的礼貌
  conceptType: 程序型
  aliases:
    - 电话礼仪
  category: 方法
  explanation: 打电话要先问好，说清楚自己是谁，请对方帮忙要用“请”“好吗”；接电话时要主动向对方问好。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:托物寓意
  type: Concept
  subject: 语文
  title: 托物寓意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“托物寓意”当作修辞手法，答《马说》时只写“比喻”而忽略“天下无马”的讽喻。
    - 能指出并纠正这一错误：只描写物象本身，不点明象征意义，如写青松却不提坚贞品格。
  aliases:
    - 托物言志
  category: 表现手法
  explanation: 通过描写某一事物来寄托作者的思想感情或表达某种道理。
  misconceptions:
    - 把“托物寓意”当作修辞手法，答《马说》时只写“比喻”而忽略“天下无马”的讽喻。
    - 只描写物象本身，不点明象征意义，如写青松却不提坚贞品格。
    - 混用“托物寓意”和“借景抒情”，将《陋室铭》说成借景抒情。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:托物言志
  type: Concept
  subject: 语文
  title: 托物言志
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将托物言志与借景抒情混为一谈，分不清‘物’与‘景’的侧重
    - 能指出并纠正这一错误：认为托物言志必须在结尾直接抒情，否则就不是，忽视含蓄表达
  aliases:
    - 借物抒情
  category: 表现手法
  explanation: 通过对某一事物的描写或刻画，来表达作者的某种志向或情感。
  misconceptions:
    - 将托物言志与借景抒情混为一谈，分不清‘物’与‘景’的侧重
    - 认为托物言志必须在结尾直接抒情，否则就不是，忽视含蓄表达
    - 把比喻句当作托物言志，如认为‘忽如一夜春风来’是托物言志
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S8.md
- id: concept:语文:扩写
  type: Concept
  subject: 语文
  title: 扩写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把扩写当成续写，如扩写《皇帝的新装》时写揭露后发生的事。
    - 能指出并纠正这一错误：扩写时随意加原文章没有的人物和情节，如给《丑小鸭》加个巫师。
  aliases: []
  category: 写作方法
  explanation: 扩写是对本来较为简略、概括的文章或片段加以扩展、补充，使之成为篇幅更长、内容更充实的文章的写作方式。
  misconceptions:
    - 把扩写当成续写，如扩写《皇帝的新装》时写揭露后发生的事。
    - 扩写时随意加原文章没有的人物和情节，如给《丑小鸭》加个巫师。
    - 以为扩写就是把每句加修饰语，导致重复啰嗦，不增加实际内容。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:扩写的一致与连贯
  type: Concept
  subject: 语文
  title: 扩写的一致与连贯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：扩写时改变人称，原文用“他”的，扩写时写成“我”来叙述。
    - 能指出并纠正这一错误：情节跳过关键环节，如扩写《狼》时直接写屠户被杀，没有过程过渡。
  aliases: []
  category: 写作要求
  explanation: 扩写时人称和语气要保持前后一致，情节发展或论述推进要合乎逻辑，要有必要过渡，增添细节要与全文协调。
  misconceptions:
    - 扩写时改变人称，原文用“他”的，扩写时写成“我”来叙述。
    - 情节跳过关键环节，如扩写《狼》时直接写屠户被杀，没有过程过渡。
    - 增添细节与原文风格冲突，在古文中加入“手机”“网络”等现代词汇。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:扩写要忠于原文
  type: Concept
  subject: 语文
  title: 扩写要忠于原文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：为求创新而改变原文中心，如把《愚公移山》扩写成愚公放弃搬家。
    - 能指出并纠正这一错误：改变原文体裁，如把《静夜思》扩写成议论文并发表观点。
  aliases: []
  category: 写作原则
  explanation: 扩写首先要准确理解原文的中心思想，把握主要内容，遵循原文体裁，在此基础上发散思维，大胆创造。
  misconceptions:
    - 为求创新而改变原文中心，如把《愚公移山》扩写成愚公放弃搬家。
    - 改变原文体裁，如把《静夜思》扩写成议论文并发表观点。
    - 扩写时只注意添加背景，如写李白喝酒，忽略《静夜思》的思乡主题。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:扩写要找准扩写点
  type: Concept
  subject: 语文
  title: 扩写要找准扩写点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：对原文每处都平均用力扩写，篇幅长了但重点不突出。
    - 能指出并纠正这一错误：选次要细节作扩写点，如扩写《背影》大篇幅写车站环境，忽略爬月台动作。
  aliases: []
  category: 写作方法
  explanation: 扩写要根据表达中心的需要，选择确定适合的点，有针对性地进行扩写，不要平均用力。
  misconceptions:
    - 对原文每处都平均用力扩写，篇幅长了但重点不突出。
    - 选次要细节作扩写点，如扩写《背影》大篇幅写车站环境，忽略爬月台动作。
    - 扩写点偏离中心，如扩写《纪念白求恩》详写医术，略写国际主义精神。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:扩大的夸张
  type: Concept
  subject: 语文
  title: 扩大的夸张
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“巴掌大的地方”说成扩大夸张，实际是缩小夸张，误把往小处说当成扩大。
    - 能指出并纠正这一错误：认为扩大夸张必须用具体数字，如“千钧一发”中没有数字就不算扩大，实则“千钧”已是极度夸大。
  aliases: []
  category: 修辞手法
  explanation: 扩大的夸张是把人或事物故意往大、多、快、长、强等方面说的夸张形式。
  misconceptions:
    - 把“巴掌大的地方”说成扩大夸张，实际是缩小夸张，误把往小处说当成扩大。
    - 认为扩大夸张必须用具体数字，如“千钧一发”中没有数字就不算扩大，实则“千钧”已是极度夸大。
    - 看到“飞流直下三千尺”就只想到数字大，没有结合语境理解是故意往长、往大的方向说。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:扬雄
  type: Concept
  subject: 语文
  title: 扬雄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“扬雄”的“扬”误写成“杨”，写成“杨雄”
    - 能指出并纠正这一错误：误以为扬雄是东汉人，而实际是西汉人
  aliases:
    - 扬子云
  category: 人物
  explanation: 西汉哲学家、文学家，字子云，蜀郡成都人。
  misconceptions:
    - 把“扬雄”的“扬”误写成“杨”，写成“杨雄”
    - 误以为扬雄是东汉人，而实际是西汉人
    - 误认为“西蜀子云亭”中的“子云”是诸葛亮，实际是扬雄
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:扶植年轻人
  type: Concept
  subject: 语文
  title: 扶植年轻人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把王选“扶植年轻人”理解为个人喜好，忽视这是历史规律和科研传承的需要。
    - 能指出并纠正这一错误：将卡文迪许实验室的例子记成是牛顿的实验室，导致论据与观点错位。
  aliases: []
  category: 观点
  explanation: 王选认为扶植年轻人是历史规律，通过卡文迪许实验室的例子论证。
  misconceptions:
    - 误把王选“扶植年轻人”理解为个人喜好，忽视这是历史规律和科研传承的需要。
    - 将卡文迪许实验室的例子记成是牛顿的实验室，导致论据与观点错位。
    - 写议论文时把“扶植年轻人”等同于“尊重老年人”，论证方向跑偏。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:批注
  type: Concept
  subject: 语文
  title: 批注
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把批注写成摘抄，只抄原文好句，不写任何个人见解
    - 能指出并纠正这一错误：批注内容空泛，只写“好”“妙”，没有具体分析
  aliases:
    - 作批注
  category: 阅读方法
  explanation: 批注是一种常用的读书方法，可以记录感悟、理解、评价或困惑，提示重点或精彩之处。
  misconceptions:
    - 把批注写成摘抄，只抄原文好句，不写任何个人见解
    - 批注内容空泛，只写“好”“妙”，没有具体分析
    - 误以为批注必须写满整页，忽略只在重点处批注即可
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:承接复句
  type: Concept
  subject: 语文
  title: 承接复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“他不但学习好，而且品德好”当成承接复句，实为递进复句，因非时间先后。
    - 能指出并纠正这一错误：认为承接复句必须有“接着、然后”等关联词，对“他吃完饭，就上学去了”反而不会判。
  aliases: []
  category: 语法
  explanation: 各分句按照时间顺序分别说出连续的动作或相关情况，具有先后相承关系的复句。
  misconceptions:
    - 把“他不但学习好，而且品德好”当成承接复句，实为递进复句，因非时间先后。
    - 认为承接复句必须有“接着、然后”等关联词，对“他吃完饭，就上学去了”反而不会判。
    - 把“既会唱歌，又会跳舞”误认为承接，因觉得动作有先后，实为并列复句。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:把一件事写清楚
  type: Concept
  subject: 语文
  title: 把一件事写清楚
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 写事时要把事情的起因、经过、结果写清楚，时间、地点、人物交代明白，还可以把看到的、听到的、想到的都写下来。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:把事情的过程写清楚
  type: Concept
  subject: 语文
  title: 把事情的过程写清楚
  conceptType: 程序型
  aliases:
    - 写清做事的经过
  category: 方法
  explanation: 写学做一件事的经历，要按步骤写清是怎么一步步学会的，遇到了什么困难、怎么克服的，心情有哪些变化。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:把人物当时的表现写具体
  type: Concept
  subject: 语文
  title: 把人物当时的表现写具体
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 写人时从面部表情、不寻常的举动、说话的语气等多个角度，把人物当时的表现写具体，反映出他的内心。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:把原因写具体
  type: Concept
  subject: 语文
  title: 把原因写具体
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 写某个话题让生活更美好时，要结合自己的生活体验，想一想它是怎样影响生活的，把觉得美好的原因写具体，读者才能感同身受。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:把句子说具体
  type: Concept
  subject: 语文
  title: 把句子说具体
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 一步一步把话说完整：先说花儿，再说花儿开放，最后说花儿在阳光下开放，句子就越说越具体了。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:把握文章的主要内容
  type: Concept
  subject: 语文
  title: 把握文章的主要内容
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把握文章主要内容有多种方法：关注主要人物的言行、借助关键语句、弄清事情的起因经过结果等，要根据文章的特点选择合适的方法。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C8/sections/S6.md
- id: concept:语文:把握长文章的主要内容
  type: Concept
  subject: 语文
  title: 把握长文章的主要内容
  conceptType: 程序型
  aliases:
    - 列小标题
    - 把长文章分成几个部分
  category: 方法
  explanation: 长文章往往分成几个部分，给每个部分列出小标题，再把各部分的主要意思连起来，就能把握课文的主要内容。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:把画面写具体
  type: Concept
  subject: 语文
  title: 把画面写具体
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把一句话扩写成一段话，写出事物是什么样子、在怎样动，加上看到的、听到的细节，简单的句子就变成具体生动的画面。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C7/sections/S5.md
- id: concept:语文:抒情
  type: Concept
  subject: 语文
  title: 抒情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为抒情只能直接感叹，如“啊，真美啊！”，不会借景或借物含蓄表达，使情感直白空洞。
    - 能指出并纠正这一错误：写抒情时通篇使用“我非常高兴”“我很悲伤”等抽象标签，不用具体动作或细节支撑，读者难共鸣。
  aliases:
    - 抒情手法
  category: 写作手法
  explanation: 抒情是表达情感的方式，即“情动于中而形于言”，在写作中抒发真情实感。
  misconceptions:
    - 认为抒情只能直接感叹，如“啊，真美啊！”，不会借景或借物含蓄表达，使情感直白空洞。
    - 写抒情时通篇使用“我非常高兴”“我很悲伤”等抽象标签，不用具体动作或细节支撑，读者难共鸣。
    - 混淆抒情与议论，在叙事中突然插入“因此我们要珍惜时间”等说理句，以道理代替情感抒发。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:抒情主人公
  type: Concept
  subject: 语文
  title: 抒情主人公
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为抒情主人公一定是诗人本人，如说《天净沙·秋思》就是马致远，忽略“断肠人”形象。
    - 能指出并纠正这一错误：把诗歌中出现的其他形象当作抒情主人公，如认为《沁园春·雪》的抒情主人公是“风流人物”。
  aliases: []
  category: 文学理论
  explanation: 抒情主人公是诗歌中直接抒发情感的形象，可以是诗人自己，也可以是虚构的形象。
  misconceptions:
    - 误以为抒情主人公一定是诗人本人，如说《天净沙·秋思》就是马致远，忽略“断肠人”形象。
    - 把诗歌中出现的其他形象当作抒情主人公，如认为《沁园春·雪》的抒情主人公是“风流人物”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:抒情手法
  type: Concept
  subject: 语文
  title: 抒情手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：分析时将‘比喻’‘拟人’等修辞手法误答为抒情手法
    - 能指出并纠正这一错误：认为抒情手法只有‘借景抒情’，忽略直抒胸臆
  aliases: []
  category: 写作手法
  explanation: 在叙述中融入情感，增强感染力。本文在平实叙述中融入深沉情感，具有浓厚抒情意味。
  misconceptions:
    - 分析时将‘比喻’‘拟人’等修辞手法误答为抒情手法
    - 认为抒情手法只有‘借景抒情’，忽略直抒胸臆
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:抒情方式
  type: Concept
  subject: 语文
  title: 抒情方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把借景抒情误认为直接抒情，如认为《天净沙·秋思》是直抒胸臆
    - 能指出并纠正这一错误：混淆直接抒情和间接抒情，认为只要是抒情就是直接抒情
  aliases:
    - 抒情手法
  category: 文学知识
  explanation: 抒情方式包括直接抒情和间接抒情，本单元要求关注抒情方式及其表达效果。
  misconceptions:
    - 把借景抒情误认为直接抒情，如认为《天净沙·秋思》是直抒胸臆
    - 混淆直接抒情和间接抒情，认为只要是抒情就是直接抒情
    - 误以为“他高兴地跳起来”是间接抒情，实际是直接描写动作
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:抓住动作语言神态体会内心
  type: Concept
  subject: 语文
  title: 抓住动作语言神态体会内心
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 阅读时抓住描写人物动作、语言、神态的语句，体会人物的内心世界，如从毛主席“一支接着一支地吸着烟”读懂他的悲痛。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:抓住景物特征
  type: Concept
  subject: 语文
  title: 抓住景物特征
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：描写荷花写成“金黄色的花瓣”，混淆荷花与菊花，没抓住荷花粉白或粉红的特征。
    - 能指出并纠正这一错误：写冬景“大雪纷飞，绿草如茵”，季节特征混乱，没准确捕捉冬天草木枯萎的实景。
  aliases:
    - 景物特征
  category: 写作方法
  explanation: 描写景物时要抓住景物在形状、色彩等方面的独特之处，通过细致观察和准确表达来突出其特点。
  misconceptions:
    - 描写荷花写成“金黄色的花瓣”，混淆荷花与菊花，没抓住荷花粉白或粉红的特征。
    - 写冬景“大雪纷飞，绿草如茵”，季节特征混乱，没准确捕捉冬天草木枯萎的实景。
    - 只用“很漂亮”“很美丽”概括，如形容梅花只说“好看”，忽略其傲雪独立的形态和暗香。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:抓住特点介绍自己
  type: Concept
  subject: 语文
  title: 抓住特点介绍自己
  conceptType: 应用型
  aliases:
    - 写出自己的特点
  category: 方法
  explanation: 介绍自己要抓住外貌、性格、爱好特长等方面的特点来写，还可以用具体的事例来说明，让别人读了觉得“像”。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C7/sections/S6.md
- id: concept:语文:投赠诗
  type: Concept
  subject: 语文
  title: 投赠诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《望洞庭湖赠张丞相》误判为送别诗，因题目有‘赠’字
    - 能指出并纠正这一错误：认为投赠诗就是朋友间赠答诗，忽略其求荐引的干谒目的
  aliases:
    - 干谒诗
  category: 诗歌体裁
  explanation: 以诗歌为媒介向达官贵人投赠，表达请求引荐或干谒之意，如《望洞庭湖赠张丞相》。
  misconceptions:
    - 把《望洞庭湖赠张丞相》误判为送别诗，因题目有‘赠’字
    - 认为投赠诗就是朋友间赠答诗，忽略其求荐引的干谒目的
    - 以为投赠诗只表达赞美，不知常隐含请求或自荐之意
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:抗美援朝战争
  type: Concept
  subject: 语文
  title: 抗美援朝战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把抗美援朝开始时间记为1949年，实际是1950年10月。
    - 能指出并纠正这一错误：把抗美援朝说成中国入侵朝鲜，忽略其援助朝鲜、保家卫国的正义性质。
  aliases:
    - 抗美援朝
  category: 历史背景
  explanation: 1950年10月至1953年7月，中国人民志愿军为援助朝鲜、保卫中国安全而进行的正义战争。本文以抗美援朝战争为背景。
  misconceptions:
    - 误把抗美援朝开始时间记为1949年，实际是1950年10月。
    - 把抗美援朝说成中国入侵朝鲜，忽略其援助朝鲜、保家卫国的正义性质。
    - 字形上把‘援’写成‘缓’，如将‘抗美援朝’错写为‘抗美缓朝’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:护国战争
  type: Concept
  subject: 语文
  title: 护国战争
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把护国战争的时间记成1911年辛亥革命，混淆反封建与反复辟的不同。
    - 能指出并纠正这一错误：误以为护国军最先在武昌起义，实际是在云南首举义旗。
  aliases:
    - 护国运动
  category: 历史背景
  explanation: 1915年至1916年反对袁世凯复辟帝制的战争，护国军最初在云南起义。
  misconceptions:
    - 把护国战争的时间记成1911年辛亥革命，混淆反封建与反复辟的不同。
    - 误以为护国军最先在武昌起义，实际是在云南首举义旗。
    - 将护国战争与护法运动混为一谈，认为都是孙中山领导的。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:押韵
  type: Concept
  subject: 语文
  title: 押韵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为律诗每一句末尾都要押韵，不知道一般只押二四六八句。
    - 能指出并纠正这一错误：认为只要韵母相同的字即可押韵，忽视律诗押韵还须声调一致（通常平声）。
  aliases:
    - 压韵
  category: 诗歌格律
  explanation: 押韵是诗歌中在句末使用韵母相同或相近的字，以增强节奏感和音乐美。律诗通常押平声韵。
  misconceptions:
    - 误认为律诗每一句末尾都要押韵，不知道一般只押二四六八句。
    - 认为只要韵母相同的字即可押韵，忽视律诗押韵还须声调一致（通常平声）。
    - 将押韵误解为句子的开头一个字必须相同。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:招牌语言规范
  type: Concept
  subject: 语文
  title: 招牌语言规范
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写招牌时把‘家具’误写成‘家俱’，因‘俱’与‘具’音近，误以为同义。
    - 能指出并纠正这一错误：用繁体字时错用，把‘理发’写作‘理發’，不知道头发之‘发’繁体是‘髮’。
  aliases: []
  category: 语言文字规范
  explanation: 招牌、广告等应使用规范汉字，符合国家通用语言文字法，避免错别字和拼音错误。
  misconceptions:
    - 写招牌时把‘家具’误写成‘家俱’，因‘俱’与‘具’音近，误以为同义。
    - 用繁体字时错用，把‘理发’写作‘理發’，不知道头发之‘发’繁体是‘髮’。
    - 把‘排骨’的拼音标成‘pái gú’，‘骨’误标为二声，应读三声gǔ。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S8.md
- id: concept:语文:拜谒
  type: Concept
  subject: 语文
  title: 拜谒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“谒”误写为“竭”，写成“拜竭”。
    - 能指出并纠正这一错误：误以为“拜谒”是“拜见”的书面语，可用于平辈随意拜见，忽略尊长含义。
  aliases: []
  category: 文言词语
  explanation: 拜见，谒见，常用于拜访尊长或敬仰的人。
  misconceptions:
    - 将“谒”误写为“竭”，写成“拜竭”。
    - 误以为“拜谒”是“拜见”的书面语，可用于平辈随意拜见，忽略尊长含义。
    - 把“拜谒”与“拜别”混淆，认为拜谒是告别。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:拜金主义
  type: Concept
  subject: 语文
  title: 拜金主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘拜金主义’解释为‘崇拜黄金’，忽略其指以金钱为核心价值观。
    - 能指出并纠正这一错误：将‘拜金主义’与享乐主义、物质主义混为一谈，不做区分。
  aliases: []
  category: 社会现象
  explanation: 把金钱视为最高价值、一切以金钱为中心的思想观念。
  misconceptions:
    - 把‘拜金主义’解释为‘崇拜黄金’，忽略其指以金钱为核心价值观。
    - 将‘拜金主义’与享乐主义、物质主义混为一谈，不做区分。
    - 误认为拜金主义是主张‘君子爱财，取之有道’的积极思想。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:拟人
  type: Concept
  subject: 语文
  title: 拟人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把拟人等同于比喻，如将‘土地像母亲’视为拟人，实为比喻。
    - 能指出并纠正这一错误：误以为称土地为‘她’是因为土地有性别，而非赋予人的特征。
  aliases:
    - 人格化
  category: 修辞手法
  explanation: 把物当作人来写，赋予物以人的动作、情感，本文中“土地”被称作“她”并呼唤作者。
  misconceptions:
    - 把拟人等同于比喻，如将‘土地像母亲’视为拟人，实为比喻。
    - 误以为称土地为‘她’是因为土地有性别，而非赋予人的特征。
    - 认为只有描写动植物才用拟人，忽略对无生命物如土地的拟人化。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:拟声词
  type: Concept
  subject: 语文
  title: 拟声词
  conceptType: 概念型
  aliases:
    - 象声词
  category: 概念
  explanation: 模仿声音的词叫拟声词，像叮当、哗啦哗啦、叽叽喳喳。把拟声词放进句子，声音就像在耳边响起来一样。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C8/sections/S4.md
- id: concept:语文:拟物
  type: Concept
  subject: 语文
  title: 拟物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“他像老虎一样凶”判为拟物，实际这是比喻，拟物应省去比喻词。
    - 能指出并纠正这一错误：误以为“小鸟在唱歌”是拟物，把拟人当成了拟物。
  aliases: []
  category: 修辞手法
  explanation: 把人当作物来写，或把甲物当乙物来写的修辞手法。
  misconceptions:
    - 把“他像老虎一样凶”判为拟物，实际这是比喻，拟物应省去比喻词。
    - 误以为“小鸟在唱歌”是拟物，把拟人当成了拟物。
    - 将“青山如黛”当作拟物，实际是比喻，不是把甲物当乙物来写。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:拿糖
  type: Concept
  subject: 语文
  title: 拿糖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：按字面理解成拿糖果做事，未懂方言引申义
    - 能指出并纠正这一错误：把“糖”写成“搪”，写作“拿搪”
  aliases:
    - 拿乔
  category: 文化常识
  explanation: 方言，装模作样或故意为难，抬高身价。
  misconceptions:
    - 按字面理解成拿糖果做事，未懂方言引申义
    - 把“糖”写成“搪”，写作“拿搪”
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:按事情发展顺序讲故事
  type: Concept
  subject: 语文
  title: 按事情发展顺序讲故事
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 讲故事或复述课文时，按照事情的起因、经过、结果的顺序来说，把过程讲清楚。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:按步骤介绍制作过程
  type: Concept
  subject: 语文
  title: 按步骤介绍制作过程
  conceptType: 程序型
  aliases:
    - 按步骤有条理地说明
  category: 方法
  explanation: 介绍制作东西的过程时，先写要准备的材料和工具，再用“第一、第二”等词语按步骤有条理地写清楚每一步怎么做。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:按游览顺序写景物
  type: Concept
  subject: 语文
  title: 按游览顺序写景物
  conceptType: 程序型
  aliases:
    - 移步换景
  category: 方法
  explanation: 写游览的地方时，按照游览的先后顺序，一个地方一个地方地写，还可以用表示过渡的句子把景点连接起来。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:按顺序说话
  type: Concept
  subject: 语文
  title: 按顺序说话
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 介绍自己做过的事情时，按先做什么、再做什么、最后做什么的顺序说，别人才能听明白；听的人要注意听，记住主要信息。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:挑顶子
  type: Concept
  subject: 语文
  title: 挑顶子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“挑”读成tiāo，理解为挑选屋顶或顶珠
    - 能指出并纠正这一错误：误以为“顶子”是清朝官员帽顶，忽视拆修之意
  aliases: []
  category: 文化常识
  explanation: 拆修房顶。
  misconceptions:
    - 把“挑”读成tiāo，理解为挑选屋顶或顶珠
    - 误以为“顶子”是清朝官员帽顶，忽视拆修之意
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:挟天子以令诸侯
  type: Concept
  subject: 语文
  title: 挟天子以令诸侯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“挟”误写为“携”，写成“携天子以令诸侯”。
    - 能指出并纠正这一错误：误认为“挟天子以令诸侯”是诸葛亮为刘备献的计策，张冠李戴。
  aliases: []
  category: 历史典故
  explanation: 指挟持皇帝来号令诸侯，曹操以此取得政治优势。
  misconceptions:
    - 将“挟”误写为“携”，写成“携天子以令诸侯”。
    - 误认为“挟天子以令诸侯”是诸葛亮为刘备献的计策，张冠李戴。
    - 把这个成语误解为“带着天子命令诸侯”，忽略挟持之意。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:换位思考
  type: Concept
  subject: 语文
  title: 换位思考
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 站在别人的角度想一想他为什么这样想、这样担心。讨论协商时换位思考，才能理解不同意见，找到大家都能接受的办法。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:捷报
  type: Concept
  subject: 语文
  title: 捷报
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“捷报”误写成“接报”，同音致误。
    - 能指出并纠正这一错误：把“捷报”当普通消息，忽略其特指胜利的消息。
  aliases: []
  category: 词语
  explanation: 胜利的消息。
  misconceptions:
    - 将“捷报”误写成“接报”，同音致误。
    - 把“捷报”当普通消息，忽略其特指胜利的消息。
    - 与“喜报”混用，未突出“捷”表胜利。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:掌柜
  type: Concept
  subject: 语文
  title: 掌柜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“掌柜”写作“掌贵”，丢中间“柜”字字形。
    - 能指出并纠正这一错误：认为掌柜就是饭店老板，忽略其受东家聘请、负责经营的雇工身份。
  aliases: []
  category: 文化常识
  explanation: 店铺的负责人，受东家聘请管理经营。
  misconceptions:
    - 误将“掌柜”写作“掌贵”，丢中间“柜”字字形。
    - 认为掌柜就是饭店老板，忽略其受东家聘请、负责经营的雇工身份。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:排比
  type: Concept
  subject: 语文
  title: 排比
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把只有两句的对偶句式误判为排比
    - 能指出并纠正这一错误：认为排比只需要两个结构相同的句子
  aliases: []
  category: 修辞手法
  explanation: 用三个或三个以上结构相同或相似、内容相关的短语或句子排列在一起，以增强语势。
  misconceptions:
    - 把只有两句的对偶句式误判为排比
    - 认为排比只需要两个结构相同的句子
    - 将排比和反复混为一谈，如‘反复’是重复相同语句
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:排比修辞
  type: Concept
  subject: 语文
  title: 排比修辞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把两个句子并列当成排比，忽略至少三个结构相似的要求
    - 能指出并纠正这一错误：排比句写成字数完全相同的对偶，误把对偶当排比
  aliases: []
  category: 修辞手法
  explanation: 排比是用三个或三个以上结构相同或相似的短语或句子排列起来，增强语势，如“埋头苦干的人，拼命硬干的人……”。
  misconceptions:
    - 把两个句子并列当成排比，忽略至少三个结构相似的要求
    - 排比句写成字数完全相同的对偶，误把对偶当排比
    - 辨识时只看“也、又、还”等词，忽略结构相似性
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:推测人物的思维过程
  type: Concept
  subject: 语文
  title: 推测人物的思维过程
  conceptType: 程序型
  aliases:
    - 了解人物的思维过程
  category: 方法
  explanation: 读课文时推测人物是怎样分析情况、想出办法的，如孙膑根据双方马的脚力合理安排出场顺序，这样能加深对课文的理解。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:描写动物外形
  type: Concept
  subject: 语文
  title: 描写动物外形
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 像课文那样，抓住动物羽毛、翅膀、尾巴等特点，用准确的词语把外形写具体。
  sourceRef: content/三年级/下册/语文/PEP-3-2-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:提出问题并试着解决
  type: Concept
  subject: 语文
  title: 提出问题并试着解决
  conceptType: 程序型
  aliases:
    - 提问并解决问题
  category: 方法
  explanation: 读书时遇到不懂的问题先记下来，再通过联系上下文、查资料或请教别人去解决，这样能读得更深入。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:提取主干
  type: Concept
  subject: 语文
  title: 提取主干
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：提取主干时保留“不”“没有”等状语，如“他不在家”提取为“他不在”错误应“他在家”。
    - 能指出并纠正这一错误：把宾语前的定语当成宾语，如“美丽的校园”提取主干为“校园”而非“美丽的校园”。
  aliases:
    - 提取主干法
  category: 语法
  explanation: 通过找出句子的主语、谓语、宾语等核心成分，检查句子结构是否完整的方法。
  misconceptions:
    - 提取主干时保留“不”“没有”等状语，如“他不在家”提取为“他不在”错误应“他在家”。
    - 把宾语前的定语当成宾语，如“美丽的校园”提取主干为“校园”而非“美丽的校园”。
    - 无主语句强行找主语，如“下雨了”错误提取为“雨下了”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:提取信息
  type: Concept
  subject: 语文
  title: 提取信息
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把举例中的具体数据当成说明对象的总体特征。
    - 能指出并纠正这一错误：只看每段首句，忽略次要句子，漏掉关键限定语。
  aliases: []
  category: 阅读方法
  explanation: 从文章中筛选出关键信息，是理解说明文内容的基础能力。
  misconceptions:
    - 把举例中的具体数据当成说明对象的总体特征。
    - 只看每段首句，忽略次要句子，漏掉关键限定语。
    - 提取时抄写大段原文，不去除修饰成分，找不到核心词。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:提取关键信息
  type: Concept
  subject: 语文
  title: 提取关键信息
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 阅读时先找出提示段落主要意思的语句，再画出关键词句，把需要的信息提取出来。这样能又快又准地解决问题。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:提高书写速度
  type: Concept
  subject: 语文
  title: 提高书写速度
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 集中注意力，掌握正确的运笔方式，一句话连贯地写出来，书写速度均匀，就能越写越快。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:搜集资料
  type: Concept
  subject: 语文
  title: 搜集资料
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“百度一下”搜到的内容都可靠，直接引用个人博客或论坛观点，不核实来源。
    - 能指出并纠正这一错误：只复制粘贴原文，不标注作者、出处和日期，导致资料无法溯源。
  aliases:
    - 资料搜集
  category: 学习方法
  explanation: 通过可靠、权威的途径获取相关信息，并进行筛选和整理的过程。
  misconceptions:
    - 认为“百度一下”搜到的内容都可靠，直接引用个人博客或论坛观点，不核实来源。
    - 只复制粘贴原文，不标注作者、出处和日期，导致资料无法溯源。
    - 将“搜集资料”误写成“收集资料”，忽略“搜集”强调主动寻找、辨析筛选。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:摘录
  type: Concept
  subject: 语文
  title: 摘录
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：摘录时只抄句子，不写作者和出处，日后引用时常找不到来源。
    - 能指出并纠正这一错误：摘录后从不回看思考，以为抄写下来就等于掌握了文章内容。
  aliases:
    - 摘抄
  category: 阅读方法
  explanation: 从文章中选取重要或精彩的语句记录下来，以便积累和思考。
  misconceptions:
    - 摘录时只抄句子，不写作者和出处，日后引用时常找不到来源。
    - 摘录后从不回看思考，以为抄写下来就等于掌握了文章内容。
    - 把摘录当抄写，把整篇文章都抄到本子上，模糊了摘录和抄写的界限。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:摘抄积累
  type: Concept
  subject: 语文
  title: 摘抄积累
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：摘抄保尔名言时不写书名和章节，过后想引用却找不到出处。
    - 能指出并纠正这一错误：把摘抄当成抄写课文，一字不落整段搬抄，没有筛选重点。
  aliases: []
  category: 阅读方法
  explanation: 将作品中的精彩语句、格言警句等抄录下来，以便积累和运用。
  misconceptions:
    - 摘抄保尔名言时不写书名和章节，过后想引用却找不到出处。
    - 把摘抄当成抄写课文，一字不落整段搬抄，没有筛选重点。
    - 摘抄时把‘人最宝贵的是生命’记成‘人的生命最宝贵’，改变原意。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:撞击说
  type: Concept
  subject: 语文
  title: 撞击说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为撞击说认为恐龙灭绝是渐进过程，实际主张突然灭绝。
    - 能指出并纠正这一错误：将撞击说与火山说的证据混用，如把铱异常归因于火山。
  aliases: []
  category: 科学假说
  explanation: 认为恐龙灭绝是由小行星或彗星撞击地球引起的，证据是沉积物中铱含量异常。
  misconceptions:
    - 误以为撞击说认为恐龙灭绝是渐进过程，实际主张突然灭绝。
    - 将撞击说与火山说的证据混用，如把铱异常归因于火山。
    - 认为所有恐龙都在撞击瞬间死亡，实际是生态系统崩溃所致。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:撺掇
  type: Concept
  subject: 语文
  title: 撺掇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“撺掇”写成“撺缀”或“蹿掇”，形近字混淆。
    - 能指出并纠正这一错误：误认为“撺掇”只是催促，忽略其从旁鼓动人做某事之义。
  aliases: []
  category: 词语
  explanation: 从旁鼓动人做某事。
  misconceptions:
    - 把“撺掇”写成“撺缀”或“蹿掇”，形近字混淆。
    - 误认为“撺掇”只是催促，忽略其从旁鼓动人做某事之义。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:改写
  type: Concept
  subject: 语文
  title: 改写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：改写时把原文关键情节改掉，如“杨志中计”改成“杨志识破”，违背忠于原作。
    - 能指出并纠正这一错误：将改写与缩写混淆，仅删减内容不改变文体或叙述角度。
  aliases: []
  category: 写作方法
  explanation: 改写是在忠于原作内容的基础上，通过改变文体、语体和叙述角度等进行再创作，以服务于特定需要。
  misconceptions:
    - 改写时把原文关键情节改掉，如“杨志中计”改成“杨志识破”，违背忠于原作。
    - 将改写与缩写混淆，仅删减内容不改变文体或叙述角度。
    - 改写人称时未同步调整语气，如把“我”改成“他”后，心理描写仍用第一人称。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:放射性
  type: Concept
  subject: 语文
  title: 放射性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为放射性是化学反应产生的，实际是原子核衰变等核变化。
    - 能指出并纠正这一错误：认为放射性只有镭才有，忽略了钋以及许多其他元素也具有放射性。
  aliases: []
  category: 科学知识
  explanation: 放射性是指元素自发地放出射线的性质。镭和钋都具有放射性，本文提到镭的放射性极强。
  misconceptions:
    - 误以为放射性是化学反应产生的，实际是原子核衰变等核变化。
    - 认为放射性只有镭才有，忽略了钋以及许多其他元素也具有放射性。
    - 将放射性等同于腐蚀性，以为有放射性的物质一定会腐蚀其他物品。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:放晦气的民俗
  type: Concept
  subject: 语文
  title: 放晦气的民俗
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 旧时人们放风筝时故意剪断线让风筝飞走，认为可以把坏运气一起放走，这是一种民俗。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:政通人和
  type: Concept
  subject: 语文
  title: 政通人和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘政通人和’的‘通’误写为‘同’。
    - 能指出并纠正这一错误：误用‘政通人和’形容朋友关系融洽。
  aliases: []
  category: 成语
  explanation: 出自《岳阳楼记》，意为政事顺利，百姓和乐。
  misconceptions:
    - 把‘政通人和’的‘通’误写为‘同’。
    - 误用‘政通人和’形容朋友关系融洽。
    - 将‘政通人和’理解为‘政治透明，人民和睦’，‘通’解释为透明。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:故乡
  type: Concept
  subject: 语文
  title: 故乡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：张冠李戴，误记《故乡》选自小说集《彷徨》，实际是《呐喊》
    - 能指出并纠正这一错误：把《故乡》中“我”的见闻当作鲁迅真实经历，忽略小说人物是艺术形象
  aliases: []
  category: 文学常识
  explanation: 《故乡》选自鲁迅小说集《呐喊》，通过“我”回乡的见闻，反映旧中国农村的衰败和农民生活的困苦。
  misconceptions:
    - 张冠李戴，误记《故乡》选自小说集《彷徨》，实际是《呐喊》
    - 把《故乡》中“我”的见闻当作鲁迅真实经历，忽略小说人物是艺术形象
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:故乡的变化
  type: Concept
  subject: 语文
  title: 故乡的变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看到闰土由活泼变麻木，忽视杨二嫂由文静变泼辣的变化
    - 能指出并纠正这一错误：误将故乡变化理解为人物外貌变化，忽略社会根源和主题揭示
  aliases: []
  category: 主题思想
  explanation: 《故乡》通过对比故乡人物和景物的变化，揭示了旧社会农村衰败和人性扭曲的主题。
  misconceptions:
    - 只看到闰土由活泼变麻木，忽视杨二嫂由文静变泼辣的变化
    - 误将故乡变化理解为人物外貌变化，忽略社会根源和主题揭示
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:故乡的变迁
  type: Concept
  subject: 语文
  title: 故乡的变迁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《故乡》结尾只表达批判，忽略“希望”的积极意义
    - 能指出并纠正这一错误：把“地上本没有路”理解成悲观绝望，未看出对新生活的向往
  aliases:
    - 故乡变化
  category: 主题思想
  explanation: 通过故乡景物的萧索和人物的变化，表达了对旧社会的批判和对新生活的希望。
  misconceptions:
    - 认为《故乡》结尾只表达批判，忽略“希望”的积极意义
    - 把“地上本没有路”理解成悲观绝望，未看出对新生活的向往
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:故事情节
  type: Concept
  subject: 语文
  title: 故事情节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把故事情节等同于故事梗概，只罗列事件不讲因果和关联
    - 能指出并纠正这一错误：误以为情节中每个事件都是独立的，无前后铺垫和伏笔
  aliases:
    - 情节
  category: 文学常识
  explanation: 故事情节是小说中一系列事件的发展过程，通常包括开端、发展、高潮、结局。
  misconceptions:
    - 把故事情节等同于故事梗概，只罗列事件不讲因果和关联
    - 误以为情节中每个事件都是独立的，无前后铺垫和伏笔
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:故事提纲
  type: Concept
  subject: 语文
  title: 故事提纲
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把故事提纲写成详细故事内容，而不是框架，失去提纲作用
    - 能指出并纠正这一错误：忘记包含时间地点人物事件等要素，只写事件梗概
  aliases:
    - 提纲
  category: 写作方法
  explanation: 撰写故事提纲需要包含基本要素（时间、地点、人物、事件）和故事内容（起因、经过、结果），并考虑叙述方式。
  misconceptions:
    - 把故事提纲写成详细故事内容，而不是框架，失去提纲作用
    - 忘记包含时间地点人物事件等要素，只写事件梗概
    - 忽略叙述方式，总是按时间顺序，不知道可倒叙、插叙
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:教养
  type: Concept
  subject: 语文
  title: 教养
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为学历高就等于有教养，如‘博士必然有教养’。
    - 能指出并纠正这一错误：将‘教养’与‘礼貌’等同，认为说‘谢谢’就是有教养。
  aliases: []
  category: 概念
  explanation: 教养指一般文化和品德的修养，体现在言谈举止的细节中，本质是尊重。
  misconceptions:
    - 误以为学历高就等于有教养，如‘博士必然有教养’。
    - 将‘教养’与‘礼貌’等同，认为说‘谢谢’就是有教养。
    - 认为教养是天生的，与后天环境和教育无关。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:教学相长
  type: Concept
  subject: 语文
  title: 教学相长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“教学相长”的“长”读作cháng，误以为指长时间的教与学。
    - 能指出并纠正这一错误：认为“教学相长”只强调学生受益，忽略“教然后知困”中教师提升。
  aliases: []
  category: 教育理念
  explanation: 教与学互相促进，教别人也能增长自己的学问。
  misconceptions:
    - 将“教学相长”的“长”读作cháng，误以为指长时间的教与学。
    - 认为“教学相长”只强调学生受益，忽略“教然后知困”中教师提升。
    - 把“相长”写作“相涨”或“相张”，字形混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:教科书插图与书法
  type: Concept
  subject: 语文
  title: 教科书插图与书法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为丁永康是教科书插图作者，把硬笔书法范字当成图画的作者
    - 能指出并纠正这一错误：把李晨、查家伍误认为书法范字的书写者，与丁永康的身份颠倒
  aliases: []
  category: 教材信息
  explanation: 丁永康为教科书'读读写写'栏目写了硬笔书法范字，李晨、查家伍绘制了部分插图。
  misconceptions:
    - 误以为丁永康是教科书插图作者，把硬笔书法范字当成图画的作者
    - 把李晨、查家伍误认为书法范字的书写者，与丁永康的身份颠倒
    - 以为教科书所有插图都出自同一人之手，忽略部分插图由查家伍绘制
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S8.md
- id: concept:语文:教科书编写修订
  type: Concept
  subject: 语文
  title: 教科书编写修订
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《义务教育教科书语文》是2022年首次出版，忽略2017年已投入使用
    - 能指出并纠正这一错误：把总主编温儒敏写成其他人，如叶圣陶或课程教材研究所
  aliases: []
  category: 教材信息
  explanation: 2017年投入使用的《义务教育教科书语文》由温儒敏担任总主编，2022年根据《义务教育语文课程标准（2022年版）》进行修订。
  misconceptions:
    - 误认为《义务教育教科书语文》是2022年首次出版，忽略2017年已投入使用
    - 把总主编温儒敏写成其他人，如叶圣陶或课程教材研究所
    - 混淆'编写'与'修订'，以为2022年修订后不再依据2011年版课标
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S8.md
- id: concept:语文:教科书试教试用
  type: Concept
  subject: 语文
  title: 教科书试教试用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为试教试用是全国统一开展，忽略只在部分省份学校进行
    - 能指出并纠正这一错误：认为试教试用后未经修改就直接出版，不清楚还要征求专家和一线教师意见
  aliases: []
  category: 教材信息
  explanation: 教科书在北京、内蒙古、吉林、浙江、山东、湖北、湖南、广东、重庆、四川等地部分学校进行了试教试用，并征求了专家和一线教师的意见。
  misconceptions:
    - 误以为试教试用是全国统一开展，忽略只在部分省份学校进行
    - 认为试教试用后未经修改就直接出版，不清楚还要征求专家和一线教师意见
    - 把试教试用说成在教材正式使用后进行，颠倒时间顺序
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S8.md
- id: concept:语文:散文
  type: Concept
  subject: 语文
  title: 散文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《背影》误认为小说，因为文章有人物和情节，混淆了散文与小说的界限。
    - 能指出并纠正这一错误：认为散文‘形散神聚’就是可以随意乱写，没有中心，忽略了‘神’的统领作用。
  aliases: []
  category: 文学体裁
  explanation: 散文是一种自由灵活的记叙性文学体裁，注重真实情感和细节描写，语言平实而富有表现力。
  misconceptions:
    - 将《背影》误认为小说，因为文章有人物和情节，混淆了散文与小说的界限。
    - 认为散文‘形散神聚’就是可以随意乱写，没有中心，忽略了‘神’的统领作用。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:散文的特点
  type: Concept
  subject: 语文
  title: 散文的特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为散文必须写大事或抒情强烈，忽略“琐细事物”也可成文，如评价《昆明的雨》是“记流水账”。
    - 能指出并纠正这一错误：把散文特点与小说混淆，认为所有散文都需要虚构情节和人物形象，导致分析时强行找戏剧冲突。
  aliases: []
  category: 文学常识
  explanation: 散文往往拾取生活中的琐细事物，娓娓道来，如话家常，平淡自然，却饶有趣味。本文通过写昆明的雨展现景物的美、滋味的美、人情的美、氛围的美。
  misconceptions:
    - 认为散文必须写大事或抒情强烈，忽略“琐细事物”也可成文，如评价《昆明的雨》是“记流水账”。
    - 把散文特点与小说混淆，认为所有散文都需要虚构情节和人物形象，导致分析时强行找戏剧冲突。
    - 只强调“平淡自然”，忽略“饶有趣味”，误以为越平淡越好，不懂从日常细节中发现趣味。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:散文的自由笔法
  type: Concept
  subject: 语文
  title: 散文的自由笔法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为散文自由笔法就是随意散漫，不必有中心思想。
    - 能指出并纠正这一错误：将“思绪流动”等同于杂乱无章，认为散文不需要结构。
  aliases:
    - 形散神聚
  category: 文学
  explanation: 散文以自由灵活的笔法，按照思绪的流动组织材料，不受严格结构限制，表达个人情感和思考。
  misconceptions:
    - 误以为散文自由笔法就是随意散漫，不必有中心思想。
    - 将“思绪流动”等同于杂乱无章，认为散文不需要结构。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:散文笔法
  type: Concept
  subject: 语文
  title: 散文笔法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为散文笔法等于小说虚构，将文中奇景当成想象情节。
    - 能指出并纠正这一错误：把“笔法多变”误解为随意乱写，没有游记线索。
  aliases: []
  category: 写作手法
  explanation: 本文写上山时用散文笔法，描绘山中奇景，笔法多变，妙趣横生。
  misconceptions:
    - 认为散文笔法等于小说虚构，将文中奇景当成想象情节。
    - 把“笔法多变”误解为随意乱写，没有游记线索。
    - 将散文笔法与“修辞手法”等同，忽视其文章组织结构特点。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:散文诗
  type: Concept
  subject: 语文
  title: 散文诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为散文诗不分行押韵，所以把它归为散文，忽视其诗的情绪与想象。
    - 能指出并纠正这一错误：误以为散文诗必须押韵，如用韵脚衡量《金色花》。
  aliases: []
  category: 文学体裁
  explanation: 散文诗是兼有散文和诗的特点的一种文学体裁，有诗的情绪与想象，像诗一样精粹、凝练，但不像诗歌那样分行与押韵，而是以散文形式呈现。
  misconceptions:
    - 认为散文诗不分行押韵，所以把它归为散文，忽视其诗的情绪与想象。
    - 误以为散文诗必须押韵，如用韵脚衡量《金色花》。
    - 把散文诗写成普通叙事散文，缺少精粹凝练的意象。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:敬业
  type: Concept
  subject: 语文
  title: 敬业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“敬业”等同于“加班”，认为工作时间越长越敬业。
    - 能指出并纠正这一错误：写“专心于职业”时，误写成“专心致志于职业”觉得是病句。
  aliases: []
  category: 核心概念
  explanation: 敬业指专心于学业或职业，将全副精力集中在一件事上，忠实于自己的职责。
  misconceptions:
    - 把“敬业”等同于“加班”，认为工作时间越长越敬业。
    - 写“专心于职业”时，误写成“专心致志于职业”觉得是病句。
    - 将敬业与乐业割裂，认为敬业只是尽义务，不需要从中寻找乐趣。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:敬业与乐业
  type: Concept
  subject: 语文
  title: 敬业与乐业
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“乐业”理解为“对工作不感到痛苦”，忽视趣味是主动寻找的。
    - 能指出并纠正这一错误：将梁启超的观点概括为“要选择喜欢的职业”，而原文强调无论何种职业都要敬业乐业。
  aliases: []
  category: 论点
  explanation: 敬业即责任心，乐业即趣味，是梁启超提出的关于职业态度的核心观点。
  misconceptions:
    - 误把“乐业”理解为“对工作不感到痛苦”，忽视趣味是主动寻找的。
    - 将梁启超的观点概括为“要选择喜欢的职业”，而原文强调无论何种职业都要敬业乐业。
    - 写演讲稿时把“敬业与乐业”的出处记成《饮冰室合集》外的一篇文章，张冠李戴。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:敬辞与谦辞
  type: Concept
  subject: 语文
  title: 敬辞与谦辞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误用‘家父’称呼对方父亲，实际应谦称自己父亲。
    - 能指出并纠正这一错误：误用‘令尊’称呼自己父亲，实际应敬称对方父亲。
  aliases:
    - 敬语
    - 谦语
  category: 古代文化常识
  explanation: 敬辞是用于尊敬对方的词语，如“令尊”“惠顾”；谦辞是用于谦称自己或与自己有关的人或事物的词语，如“家父”“拙作”。
  misconceptions:
    - 误用‘家父’称呼对方父亲，实际应谦称自己父亲。
    - 误用‘令尊’称呼自己父亲，实际应敬称对方父亲。
    - 误以为‘惠顾’是谦辞，实际是敬辞，用于感谢顾客光临。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:数词
  type: Concept
  subject: 语文
  title: 数词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把量词当数词，说“一个苹果”的“个”是数词。
    - 能指出并纠正这一错误：认为只有“一、二、三”是数词，把“第一、初五”排除在数词外。
  aliases: []
  category: 语法
  explanation: 表示数目和次序的词，包括确数、概数和序数。
  misconceptions:
    - 误把量词当数词，说“一个苹果”的“个”是数词。
    - 认为只有“一、二、三”是数词，把“第一、初五”排除在数词外。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:数量词
  type: Concept
  subject: 语文
  title: 数量词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“一个”整体叫量词，或只说“个”是数量词，忽略了数词“一”。
    - 能指出并纠正这一错误：认为数量词只能放在名词前，不能作补语，如“跑三圈”的“三圈”被误判为不是数量词。
  aliases:
    - 数量短语
  category: 语法
  explanation: 数词和量词结合使用，表示数量。
  misconceptions:
    - 把“一个”整体叫量词，或只说“个”是数量词，忽略了数词“一”。
    - 认为数量词只能放在名词前，不能作补语，如“跑三圈”的“三圈”被误判为不是数量词。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:整体认读音节
  type: Concept
  subject: 语文
  title: 整体认读音节
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 有些音节不用拼，要一口气直接读出来，比如 zi、ci、si。看到它们整个认读就行，不把声母和韵母分开拼。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:整句与散句
  type: Concept
  subject: 语文
  title: 整句与散句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以字数相等判断整句，如“他来了，下雨了”误判为整句，实际分句结构不同。
    - 能指出并纠正这一错误：认为散句是结构混乱的病句，如“天晴了，我们出发吧”是散句，却是规范句。
  aliases:
    - 整句
    - 散句
  category: 修辞手法
  explanation: 整句指结构相同或相似的短语或分句组成的句子，具有整齐美；散句指结构错落有致的句子，具有错综美。
  misconceptions:
    - 以字数相等判断整句，如“他来了，下雨了”误判为整句，实际分句结构不同。
    - 认为散句是结构混乱的病句，如“天晴了，我们出发吧”是散句，却是规范句。
    - 将对偶句与整句划等号，认为只有对仗工整才算整句，其实“春天来了，花儿开了”不是对偶，但也是整句。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:整合信息
  type: Concept
  subject: 语文
  title: 整合信息
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把各段中心句简单罗列，不做归纳，答成‘文段大意’而非‘整体理解’。
    - 能指出并纠正这一错误：合并时只删重词，不调整语序，导致表达不连贯。
  aliases: []
  category: 阅读方法
  explanation: 将提取的零散信息进行归纳、综合，形成对文章内容的整体理解。
  misconceptions:
    - 把各段中心句简单罗列，不做归纳，答成‘文段大意’而非‘整体理解’。
    - 合并时只删重词，不调整语序，导致表达不连贯。
    - 整合时加入自己的猜测，如‘由此可见’后接原文没有的内容。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:整本书阅读方法
  type: Concept
  subject: 语文
  title: 整本书阅读方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：读整本书时从中间章节开始读，打乱‘全体—局部—全体’顺序
    - 能指出并纠正这一错误：把‘全体’理解成全书梗概，只读内容简介而不细读局部
  aliases:
    - 全体—局部—全体
  category: 阅读方法
  explanation: 阅读整本书时，可以按照“全体—局部—全体”的次序进行梳理，先了解整体结构，再细读各部分，最后把握全书体系。
  misconceptions:
    - 读整本书时从中间章节开始读，打乱‘全体—局部—全体’顺序
    - 把‘全体’理解成全书梗概，只读内容简介而不细读局部
    - 认为‘局部’就是任意片段，不按书中原有结构梳理
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:整理表格
  type: Concept
  subject: 语文
  title: 整理表格
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：表格项目设置随意，如把“成就”和“过程”合并，导致信息无法对照。
    - 能指出并纠正这一错误：大段照抄原文，不做概括，使表格变成“资料堆砌”，失去条理性。
  aliases:
    - 表格编制
  category: 学习方法
  explanation: 将搜集到的信息按照一定项目（如名称、成就、过程等）进行归纳和呈现，要求内容概括、条理清晰。
  misconceptions:
    - 表格项目设置随意，如把“成就”和“过程”合并，导致信息无法对照。
    - 大段照抄原文，不做概括，使表格变成“资料堆砌”，失去条理性。
    - 把“过程”写成“结果”，如“研制疫苗的过程”误填为“研制成功”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:文化遗产
  type: Concept
  subject: 语文
  title: 文化遗产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文化遗产仅指有形文物，不包括传统民俗，如不把端午节视为文化遗产。
    - 能指出并纠正这一错误：混用‘文化遗产’与‘文化遗迹’，将民间故事称为‘文化遗迹’。
  aliases:
    - 文化遗存
  category: 文化概念
  explanation: 文化遗产包括物质文化遗产和非物质文化遗产，是彰显人文价值、凝聚历史记忆的宝贵资源。
  misconceptions:
    - 认为文化遗产仅指有形文物，不包括传统民俗，如不把端午节视为文化遗产。
    - 混用‘文化遗产’与‘文化遗迹’，将民间故事称为‘文化遗迹’。
    - 认为只有古代遗物是遗产，近代的优秀建筑不属于，如认为人民英雄纪念碑不是文化遗产。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:文化遗产保护
  type: Concept
  subject: 语文
  title: 文化遗产保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为保护就是完全不动，任其自然损毁，如反对修补风化古墙。
    - 能指出并纠正这一错误：以为保护只是政府责任，个人无需作为，如看到文物被刻画也不制止。
  aliases:
    - 遗产保护
  category: 文化政策
  explanation: 对文化遗产进行保护、传承和弘扬的措施，强调科学修缮、合理利用和公众教育。
  misconceptions:
    - 认为保护就是完全不动，任其自然损毁，如反对修补风化古墙。
    - 以为保护只是政府责任，个人无需作为，如看到文物被刻画也不制止。
    - 把保护误解为拆旧建新，如拆除老街修建仿古一条街。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:文化遗产日
  type: Concept
  subject: 语文
  title: 文化遗产日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为文化遗产日每年固定是同一天，如认为必在6月10日。
    - 能指出并纠正这一错误：认为文化遗产日和自然遗产日是分开的两个节日，不知2016年后合并。
  aliases:
    - 文化和自然遗产日
  category: 文化制度
  explanation: 自2006年起，每年6月的第二个星期六定为文化遗产日，2016年调整为文化和自然遗产日。
  misconceptions:
    - 误以为文化遗产日每年固定是同一天，如认为必在6月10日。
    - 认为文化遗产日和自然遗产日是分开的两个节日，不知2016年后合并。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:文天祥
  type: Concept
  subject: 语文
  title: 文天祥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把文天祥当作北宋人或明初人，与朝代记忆混乱。
    - 能指出并纠正这一错误：将文天祥与明代画家文征明混淆，认为同一家族或同一时期。
  aliases:
    - 文履善
    - 文宋瑞
    - 文信国
  category: 文学常识
  explanation: 南宋末年政治家、文学家，民族英雄，《过零丁洋》作者。
  misconceptions:
    - 把文天祥当作北宋人或明初人，与朝代记忆混乱。
    - 将文天祥与明代画家文征明混淆，认为同一家族或同一时期。
    - 误认《过零丁洋》是岳飞所作，一‘过’一‘满江红’张冠李戴。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:文字与意境的关系
  type: Concept
  subject: 语文
  title: 文字与意境的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为文字本身即是意境，看懂字面就领会了意境，无需想象。
    - 能指出并纠正这一错误：把意境看成文字之外可有可无的装饰，忽略文字承载作用。
  aliases: []
  category: 文艺鉴赏
  explanation: 文字是表达意境的载体，读者需透过文字，借助想象，才能领会作者的意境。
  misconceptions:
    - 认为文字本身即是意境，看懂字面就领会了意境，无需想象。
    - 把意境看成文字之外可有可无的装饰，忽略文字承载作用。
    - 认为意境好的文章可以不用讲究文字，随意表达也行。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:文心雕龙·神思
  type: Concept
  subject: 语文
  title: 文心雕龙·神思
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《文心雕龙》作者记成刘向，实际应为刘勰
    - 能指出并纠正这一错误：将“神思”理解为神奇的思维，不知道是指艺术构思
  aliases: []
  category: 文学常识
  explanation: 《文心雕龙》是南朝刘勰所著文学理论著作，《神思》篇论述艺术构思，此处引用强调情与景的融合。
  misconceptions:
    - 把《文心雕龙》作者记成刘向，实际应为刘勰
    - 将“神思”理解为神奇的思维，不知道是指艺术构思
    - 认为《神思》讲的是修改文章的方法，而非构思过程
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:文房四宝
  type: Concept
  subject: 语文
  title: 文房四宝
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 笔、墨、纸、砚合称“文房四宝”。类似的文化常识还有雅人四好“琴棋书画”、中医四诊“望闻问切”。
  sourceRef: content/三年级/下册/语文/PEP-3-2-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:文章题目的作用
  type: Concept
  subject: 语文
  title: 文章题目的作用
  conceptType: 概念型
  aliases:
    - 拟题方法
  category: 概念
  explanation: 好的题目能激发读者的阅读兴趣，对文章起画龙点睛的作用。可以用主要人物、主要事件或主要事物来作题目。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C8/sections/S6.md
- id: concept:语文:文者无形之画，画者有形之文
  type: Concept
  subject: 语文
  title: 文者无形之画，画者有形之文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为“文者无形之画”是苏轼的话，其实是孔武仲提出
    - 能指出并纠正这一错误：把“无形之画”理解成没有画面感，否定文字的形象性
  aliases:
    - 文画同趣
  category: 文学理论
  explanation: 宋代孔武仲提出的观点，强调文学与绘画在本质上的相通性，即文字与图像虽形式不同，但艺术旨趣相同。
  misconceptions:
    - 误认为“文者无形之画”是苏轼的话，其实是孔武仲提出
    - 把“无形之画”理解成没有画面感，否定文字的形象性
    - 只觉得是比喻，不能理解文画在艺术本质上的相通
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:文言句式
  type: Concept
  subject: 语文
  title: 文言句式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把省略句误认为病句，如“（孟子）曰”说缺少主语
    - 能指出并纠正这一错误：滥用倒装句，将“甚矣汝之不惠”硬改成“汝之不惠甚矣”
  aliases:
    - 文言特殊句式
  category: 语法
  explanation: 文言文中的特殊句式，如判断句、省略句、倒装句等，本单元强调四字句与其他句式的穿插运用。
  misconceptions:
    - 把省略句误认为病句，如“（孟子）曰”说缺少主语
    - 滥用倒装句，将“甚矣汝之不惠”硬改成“汝之不惠甚矣”
    - 认为四字句必须整齐划一，不懂与散句穿插变化
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:文言句式“将复何及”
  type: Concept
  subject: 语文
  title: 文言句式“将复何及”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'将复何及'翻译成'又算什么呢'，忽略'复'是'又、再'，及是'来得及'。
    - 能指出并纠正这一错误：将'复'误解为'复习'，导致整句翻译成'将要复习怎么来得及'。
  aliases: []
  category: 文言文
  explanation: “将复何及”意为又怎么来得及。
  misconceptions:
    - 把'将复何及'翻译成'又算什么呢'，忽略'复'是'又、再'，及是'来得及'。
    - 将'复'误解为'复习'，导致整句翻译成'将要复习怎么来得及'。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言句式“无以”
  type: Concept
  subject: 语文
  title: 文言句式“无以”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'无以'直接翻译成'没有'，丢掉'用来……的办法'这层意思，如'无以成'译成'没有成功'。
    - 能指出并纠正这一错误：与'无从'混淆，把'无以致远'译成'无从走到远方'，其实应为'没有什么可以拿来达到远方'。
  aliases: []
  category: 文言文
  explanation: “无以”意为没有什么可以拿来，没办法。
  misconceptions:
    - 把'无以'直接翻译成'没有'，丢掉'用来……的办法'这层意思，如'无以成'译成'没有成功'。
    - 与'无从'混淆，把'无以致远'译成'无从走到远方'，其实应为'没有什么可以拿来达到远方'。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言句式：倒装句
  type: Concept
  subject: 语文
  title: 文言句式：倒装句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘吾射不亦精乎’直译为‘我的射箭不也很精心吗？’未译出反问语气。
    - 能指出并纠正这一错误：把‘尔安敢轻吾射’的‘安’误作‘安全’，译成‘你怎么敢安全轻视我’。
  aliases: []
  category: 文言语法
  explanation: “吾射不亦精乎”是反问句，意为“我射箭的本领不也很精湛吗？”；“尔安敢轻吾射”是疑问句，意为“你怎么敢轻视我射箭的本领！”
  misconceptions:
    - 将‘吾射不亦精乎’直译为‘我的射箭不也很精心吗？’未译出反问语气。
    - 把‘尔安敢轻吾射’的‘安’误作‘安全’，译成‘你怎么敢安全轻视我’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:文言句式：判断句
  type: Concept
  subject: 语文
  title: 文言句式：判断句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为‘我亦无他，惟手熟尔’缺少‘者’‘也’就不是判断句。
    - 能指出并纠正这一错误：把‘惟手熟尔’的‘尔’当作代词‘你’，导致‘手熟尔’译成‘手熟你’。
  aliases: []
  category: 文言语法
  explanation: 文言文中判断句常用“……者……也”或“乃、为、即”等表示。本文中“我亦无他，惟手熟尔”是判断句，意为“我也没有别的（奥妙），只是手法熟练罢了”。
  misconceptions:
    - 误认为‘我亦无他，惟手熟尔’缺少‘者’‘也’就不是判断句。
    - 把‘惟手熟尔’的‘尔’当作代词‘你’，导致‘手熟尔’译成‘手熟你’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:文言句式：省略句
  type: Concept
  subject: 语文
  title: 文言句式：省略句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：翻译‘自钱孔入’时直接译为‘从钱孔进入’，未补出省略的主语‘油’。
    - 能指出并纠正这一错误：误以为‘自钱孔入’省略的是‘钱’，补充成‘钱从孔进入’。
  aliases: []
  category: 文言语法
  explanation: “自钱孔入”省略主语“油”，即“（油）自钱孔入”。
  misconceptions:
    - 翻译‘自钱孔入’时直接译为‘从钱孔进入’，未补出省略的主语‘油’。
    - 误以为‘自钱孔入’省略的是‘钱’，补充成‘钱从孔进入’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:文言实词
  type: Concept
  subject: 语文
  title: 文言实词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“沉鳞竞跃”的“竞”译成“竞争”，应为“争相”。
    - 能指出并纠正这一错误：误认“颓”为“颓废”，在“夕日欲颓”中是“坠落”。
  aliases: []
  category: 文言知识
  explanation: 文言实词指文言文中具有实际意义的词，如“交晖”“俱备”“颓”“竞跃”等，理解其含义是读懂文言文的基础。
  misconceptions:
    - 将“沉鳞竞跃”的“竞”译成“竞争”，应为“争相”。
    - 误认“颓”为“颓废”，在“夕日欲颓”中是“坠落”。
    - 混淆“交晖”的“晖”和“光辉”的“辉”，前者指日光。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:文言实词“励精”
  type: Concept
  subject: 语文
  title: 文言实词“励精”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'励精'写成'厉精'或'历精'，混淆同音字，应写'励'。
    - 能指出并纠正这一错误：把'励'理解成'鼓励'，翻译成'鼓励精神'，实际是'振奋'，如'励精图治'是振奋精神。
  aliases: []
  category: 文言文
  explanation: “励精”意为振奋精神，“励”是振奋。
  misconceptions:
    - 把'励精'写成'厉精'或'历精'，混淆同音字，应写'励'。
    - 把'励'理解成'鼓励'，翻译成'鼓励精神'，实际是'振奋'，如'励精图治'是振奋精神。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“尔”的用法
  type: Concept
  subject: 语文
  title: 文言实词“尔”的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘但手熟尔’的‘尔’当成代词‘你’，译成‘只是手熟你’。
    - 能指出并纠正这一错误：把‘尔安敢轻吾射’的‘尔’当成语气词‘罢了’，译成‘罢了你怎么敢轻视我’。
  aliases: []
  category: 文言词汇
  explanation: “尔”在文言文中可作代词，意为“你”，如“尔安敢轻吾射”；也可作语气词，同“耳”，相当于“罢了”，如“但手熟尔”。
  misconceptions:
    - 把‘但手熟尔’的‘尔’当成代词‘你’，译成‘只是手熟你’。
    - 把‘尔安敢轻吾射’的‘尔’当成语气词‘罢了’，译成‘罢了你怎么敢轻视我’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:文言实词“广”
  type: Concept
  subject: 语文
  title: 文言实词“广”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'广才'翻译成'广大才能'，忽略了'广'在此作动词'增长'，不是形容词。
    - 能指出并纠正这一错误：把'广'读成'kuàng'，与'旷'混淆，在文中应读guǎng，意为增长。
  aliases: []
  category: 文言文
  explanation: “广”在文中意为增长。
  misconceptions:
    - 把'广才'翻译成'广大才能'，忽略了'广'在此作动词'增长'，不是形容词。
    - 把'广'读成'kuàng'，与'旷'混淆，在文中应读guǎng，意为增长。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“接世”
  type: Concept
  subject: 语文
  title: 文言实词“接世”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'接世'翻译成'迎接世界'，把'接'当'迎接'，实际是'接触社会'。
    - 能指出并纠正这一错误：把'接世'写成'结世'，理解为'结交世人'，偏离'承担社会责任'之意。
  aliases: []
  category: 文言文
  explanation: “接世”意为接触社会，承担社会责任。
  misconceptions:
    - 把'接世'翻译成'迎接世界'，把'接'当'迎接'，实际是'接触社会'。
    - 把'接世'写成'结世'，理解为'结交世人'，偏离'承担社会责任'之意。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“明志”
  type: Concept
  subject: 语文
  title: 文言实词“明志”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'明志'翻译成'明亮的志向'，将'明'当作形容词，实际是动词'明确'。
    - 能指出并纠正这一错误：把'明'理解为'明白'，译成'明白志向'，应为'明确、坚定志向'，如'非淡泊无以明志'。
  aliases: []
  category: 文言文
  explanation: “明志”意为明确志向，其中“明”是明确、坚定的意思。
  misconceptions:
    - 把'明志'翻译成'明亮的志向'，将'明'当作形容词，实际是动词'明确'。
    - 把'明'理解为'明白'，译成'明白志向'，应为'明确、坚定志向'，如'非淡泊无以明志'。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“枯落”
  type: Concept
  subject: 语文
  title: 文言实词“枯落”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'枯落'翻译成'枯干落下'，只解字面意思，忽略其比喻年老志衰。
    - 能指出并纠正这一错误：把'枯落'与'落叶'混淆，写成'枯叶'，实际是'凋落、衰残'，指人无成。
  aliases: []
  category: 文言文
  explanation: “枯落”指凋落、衰残，比喻人年老志衰，没有用处。
  misconceptions:
    - 把'枯落'翻译成'枯干落下'，只解字面意思，忽略其比喻年老志衰。
    - 把'枯落'与'落叶'混淆，写成'枯叶'，实际是'凋落、衰残'，指人无成。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“治性”
  type: Concept
  subject: 语文
  title: 文言实词“治性”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'治性'翻译成'治理性格'，把'治'当'治理'，实际是'修养'。
    - 能指出并纠正这一错误：把'治'写成'制'，认为'制性'是控制脾性，但原文是'治性'，意为修养性情。
  aliases: []
  category: 文言文
  explanation: “治性”意为修养性情，“治”是修养。
  misconceptions:
    - 把'治性'翻译成'治理性格'，把'治'当'治理'，实际是'修养'。
    - 把'治'写成'制'，认为'制性'是控制脾性，但原文是'治性'，意为修养性情。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“淡泊”
  type: Concept
  subject: 语文
  title: 文言实词“淡泊”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'淡泊'写成'淡薄'，如'淡薄名利'，应为'淡泊'，意为恬淡不慕名利。
    - 能指出并纠正这一错误：把'淡泊'理解成'冷淡'，说'对名利很冷淡'，其实'淡泊'是内心恬淡，不是冷漠。
  aliases: []
  category: 文言文
  explanation: “淡泊”指内心恬淡，不慕名利。
  misconceptions:
    - 把'淡泊'写成'淡薄'，如'淡薄名利'，应为'淡泊'，意为恬淡不慕名利。
    - 把'淡泊'理解成'冷淡'，说'对名利很冷淡'，其实'淡泊'是内心恬淡，不是冷漠。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“淫慢”
  type: Concept
  subject: 语文
  title: 文言实词“淫慢”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“淫慢”的“淫”理解成“沉迷女色”，写句子时误用为“淫慢无度”。
    - 能指出并纠正这一错误：将“淫慢”与“懒惰”完全等同，忽略“淫”有放纵之意，翻译时只写“懈怠”。
  aliases: []
  category: 文言文
  explanation: “淫慢”指放纵懈怠，“淫”是放纵，“慢”是懈怠。
  misconceptions:
    - 把“淫慢”的“淫”理解成“沉迷女色”，写句子时误用为“淫慢无度”。
    - 将“淫慢”与“懒惰”完全等同，忽略“淫”有放纵之意，翻译时只写“懈怠”。
    - 误写“淫慢”的“淫”为“银”或“寅”，字形混淆导致默写失分。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“穷庐”
  type: Concept
  subject: 语文
  title: 文言实词“穷庐”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“穷庐”的“穷”当“贫穷”，译成“贫穷的房子”，未想到“穷”有困厄之意。
    - 能指出并纠正这一错误：把“穷庐”与“陋室”混为一谈，忽略“穷庐”专指不得志者的住处。
  aliases: []
  category: 文言文
  explanation: “穷庐”指穷困潦倒之人住的陋室。
  misconceptions:
    - 误把“穷庐”的“穷”当“贫穷”，译成“贫穷的房子”，未想到“穷”有困厄之意。
    - 把“穷庐”与“陋室”混为一谈，忽略“穷庐”专指不得志者的住处。
    - 写“穷庐”时容易写成“穷炉”或“穹庐”，混淆字音相近的词。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“致远”
  type: Concept
  subject: 语文
  title: 文言实词“致远”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“致远”的“致”写成“至”，认为“至远”也是到远方的意思。
    - 能指出并纠正这一错误：把“致远”理解成“使自己走得更远”，忽略“达到远大目标”中“致”是达到。
  aliases: []
  category: 文言文
  explanation: “致远”意为达到远大目标，“致”是达到的意思。
  misconceptions:
    - 误将“致远”的“致”写成“至”，认为“至远”也是到远方的意思。
    - 把“致远”理解成“使自己走得更远”，忽略“达到远大目标”中“致”是达到。
    - 写“淡泊明志，宁静致远”时，误将“致远”写成“志远”，词语颠倒。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“险躁”
  type: Concept
  subject: 语文
  title: 文言实词“险躁”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“险躁”的“险”解释为“危险”，理解成“危险急躁”，偏离轻薄浮躁。
    - 能指出并纠正这一错误：误将“险躁”的“躁”写成“燥”，把“干燥”和“急躁”混淆。
  aliases: []
  category: 文言文
  explanation: “险躁”指轻薄浮躁，与“宁静”相对，“险”是轻薄。
  misconceptions:
    - 把“险躁”的“险”解释为“危险”，理解成“危险急躁”，偏离轻薄浮躁。
    - 误将“险躁”的“躁”写成“燥”，把“干燥”和“急躁”混淆。
    - 认为“险躁”与“宁静”只是反义，但说不清“险”的具体含义。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“静”
  type: Concept
  subject: 语文
  title: 文言实词“静”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“静”等同于“安静”，认为环境安静即可，忽略内心屏除杂念。
    - 能指出并纠正这一错误：写“静”时误写成“净”，将“宁静”与“干净”混淆。
  aliases: []
  category: 文言文
  explanation: “静”指屏除杂念和干扰，宁静专一。
  misconceptions:
    - 把“静”等同于“安静”，认为环境安静即可，忽略内心屏除杂念。
    - 写“静”时误写成“净”，将“宁静”与“干净”混淆。
    - 翻译“静以修身”时，将“静”直接译为“安静”，未译出“宁静专一”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词“驰”
  type: Concept
  subject: 语文
  title: 文言实词“驰”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“驰”当“奔驰”，解释成“马跑得快”，实际指时光疾行。
    - 能指出并纠正这一错误：将“驰”与“弛”混淆，把“驰”写成“松弛”的“弛”。
  aliases: []
  category: 文言文
  explanation: “驰”意为疾行，指迅速逝去。
  misconceptions:
    - 误把“驰”当“奔驰”，解释成“马跑得快”，实际指时光疾行。
    - 将“驰”与“弛”混淆，把“驰”写成“松弛”的“弛”。
    - 翻译“年与时驰”时，把“驰”译为“奔跑”，没体现时间迅速逝去。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言实词一词多义
  type: Concept
  subject: 语文
  title: 文言实词一词多义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'自非亭午夜分'的'自'解释成'从'，应作'如果'。
    - 能指出并纠正这一错误：将'沿溯阻绝'的'绝'释为'绝对'，实为'断'。
  aliases: []
  category: 文言文
  explanation: 文言文中同一个词在不同语境下意义不同，如“自”“绝”“素”等。
  misconceptions:
    - 把'自非亭午夜分'的'自'解释成'从'，应作'如果'。
    - 将'沿溯阻绝'的'绝'释为'绝对'，实为'断'。
    - 把'则素湍绿潭'的'素'理解成'朴素'，应为'白色'。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:文言文
  type: Concept
  subject: 语文
  title: 文言文
  conceptType: 概念型
  aliases:
    - 古文
  category: 概念
  explanation: 用古代汉语写的文章，语言很简练，和我们现在说的话不一样。读文言文要读准字音、把握好停顿，再借助注释弄懂意思。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C8/sections/S1.md
- id: concept:语文:文言文朗读节奏
  type: Concept
  subject: 语文
  title: 文言文朗读节奏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：朗读“非学/无以广才”时，在“学”后停顿，忽略了“非学无以”的语义连贯。
    - 能指出并纠正这一错误：把“夫/君子之行”读成“夫君子/之行”，将句首语气词误当实词。
  aliases: []
  category: 文言文
  explanation: 文言文朗读时需注意句内停顿，以体现韵律美。
  misconceptions:
    - 朗读“非学/无以广才”时，在“学”后停顿，忽略了“非学无以”的语义连贯。
    - 把“夫/君子之行”读成“夫君子/之行”，将句首语气词误当实词。
    - 认为所有四字句都按“二二”节奏读，如“静以/修身”误读为“静/以修身”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言文翻译方法
  type: Concept
  subject: 语文
  title: 文言文翻译方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把专有名词也硬译，如将“燕王”译为“燕子王”。
    - 能指出并纠正这一错误：替词时用现代汉语直接替换，如“妻子”译成“妻子”，应译“妻子儿女”。
  aliases:
    - 翻译方法
    - 文言翻译
  category: 文言文阅读
  explanation: 翻译文言文常用的方法有留、替、调、补、删，分别对应保留专有名词、替换单音节词、调整语序、补充省略成分、删去无实义词。
  misconceptions:
    - 把专有名词也硬译，如将“燕王”译为“燕子王”。
    - 替词时用现代汉语直接替换，如“妻子”译成“妻子”，应译“妻子儿女”。
    - 调序时漏掉倒装句，如“何陋之有”直译成“什么简陋有”而不调整语序。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:文言文诵读
  type: Concept
  subject: 语文
  title: 文言文诵读
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：读“乃石性坚重”时停顿成“乃/石性”，误把“乃”单独断开
    - 能指出并纠正这一错误：通假字按今音读，如“说”读shuō，而应读yuè
  aliases:
    - 诵读
  category: 学习方法
  explanation: 通过反复诵读文言文，读准字音、停顿，注意节奏、韵律，以体会文言之美并增强表达能力。
  misconceptions:
    - 读“乃石性坚重”时停顿成“乃/石性”，误把“乃”单独断开
    - 通假字按今音读，如“说”读shuō，而应读yuè
    - 只顾摇头晃脑地读，不关注节奏和情感表达
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:文言虚词
  type: Concept
  subject: 语文
  title: 文言虚词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘之’的代词用法和助词‘的’混淆，如‘辍耕之垄上’的‘之’解释为‘的’
    - 能指出并纠正这一错误：认为‘其’只有‘他的’意思，不知还可表‘大概’‘难道’等语气
  aliases: []
  category: 文言文
  explanation: 文言文中常见的虚词如“之”“其”“而”等，在句中起连接或辅助作用。
  misconceptions:
    - 把‘之’的代词用法和助词‘的’混淆，如‘辍耕之垄上’的‘之’解释为‘的’
    - 认为‘其’只有‘他的’意思，不知还可表‘大概’‘难道’等语气
    - 把‘而’的转折关系当成顺承，如‘人不知而不愠’误译成‘并且’
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:文言虚词“之”的用法
  type: Concept
  subject: 语文
  title: 文言虚词“之”的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘睨之久而不去’的‘之’误指卖油翁，实际指陈尧咨射箭。
    - 能指出并纠正这一错误：把‘以我酌油知之’的‘之’误指‘油’，实际指‘熟能生巧的道理’。
  aliases: []
  category: 文言语法
  explanation: “之”在文言文中常作代词、助词或动词。本文中“睨之久而不去”的“之”代指陈尧咨射箭，“以我酌油知之”的“之”代指射箭是凭手熟的道理，“康肃笑而遣之”的“之”代指卖油翁。
  misconceptions:
    - 把‘睨之久而不去’的‘之’误指卖油翁，实际指陈尧咨射箭。
    - 把‘以我酌油知之’的‘之’误指‘油’，实际指‘熟能生巧的道理’。
    - 把‘康肃笑而遣之’的‘之’误指陈尧咨自己，实际指卖油翁。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:文言虚词“以”
  type: Concept
  subject: 语文
  title: 文言虚词“以”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“静以修身”的“以”译成“因为”，不知道此处表目的，应译“来”。
    - 能指出并纠正这一错误：把“以”当成介词“用”，翻译“穷庐”时出现“以”的错位理解。
  aliases: []
  category: 文言文
  explanation: “以”作连词，表示后者是前者的目的，相当于“来”。
  misconceptions:
    - 误将“静以修身”的“以”译成“因为”，不知道此处表目的，应译“来”。
    - 把“以”当成介词“用”，翻译“穷庐”时出现“以”的错位理解。
    - 默写时漏写“以”或误写成“已”，虚词掌握不扎实。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言虚词“以”的用法
  type: Concept
  subject: 语文
  title: 文言虚词“以”的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘以我酌油知之’的‘以’误译为‘用’，变成‘用我酌油知道它’。
    - 能指出并纠正这一错误：把‘以钱覆其口’的‘以’误译为‘凭靠’，变成‘凭靠铜钱盖住它的口’。
  aliases: []
  category: 文言语法
  explanation: “以”在文言文中常作介词，表示凭借、原因、工具等。本文中“以我酌油知之”的“以”意为“凭、靠”，“以钱覆其口”的“以”意为“用”。
  misconceptions:
    - 把‘以我酌油知之’的‘以’误译为‘用’，变成‘用我酌油知道它’。
    - 把‘以钱覆其口’的‘以’误译为‘凭靠’，变成‘凭靠铜钱盖住它的口’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:文言虚词“夫”
  type: Concept
  subject: 语文
  title: 文言虚词“夫”
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“夫”当第三人称代词“他”，译成“他的君子之行”。
    - 能指出并纠正这一错误：把“夫”读作“fū”还是“fú”混淆，在朗读时用错声调。
  aliases: []
  category: 文言文
  explanation: “夫”是句首语气助词，用于表示将发议论。
  misconceptions:
    - 误把“夫”当第三人称代词“他”，译成“他的君子之行”。
    - 把“夫”读作“fū”还是“fú”混淆，在朗读时用错声调。
    - 认为“夫”在句首都是发语词，忽略“夫”作实词“丈夫”时的用法。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:文言虚词“而”的用法
  type: Concept
  subject: 语文
  title: 文言虚词“而”的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘释担而立’的‘而’误认为表转折，实际上‘释担’与‘立’是先后承接。
    - 能指出并纠正这一错误：把‘自钱孔入，而钱不湿’的‘而’误认为表承接，实际上表转折。
  aliases: []
  category: 文言语法
  explanation: “而”在文言文中常作连词，表示并列、承接、转折、修饰等关系。本文中“释担而立”表承接，“自钱孔入，而钱不湿”表转折，“康肃笑而遣之”表修饰。
  misconceptions:
    - 把‘释担而立’的‘而’误认为表转折，实际上‘释担’与‘立’是先后承接。
    - 把‘自钱孔入，而钱不湿’的‘而’误认为表承接，实际上表转折。
    - 把‘康肃笑而遣之’的‘而’误认为表并列，实际上‘笑’修饰‘遣’，表修饰。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:文言虚词：邪、耳、乎
  type: Concept
  subject: 语文
  title: 文言虚词：邪、耳、乎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“邪”读成“xié”，理解成奸邪之意。
    - 能指出并纠正这一错误：把“耳”当成耳朵，如“不听耳”解释为不听耳朵。
  aliases: []
  category: 文言虚词
  explanation: 邪、耳、乎均为语气词，分别表示反问、限止和感叹语气。
  misconceptions:
    - 把“邪”读成“xié”，理解成奸邪之意。
    - 把“耳”当成耳朵，如“不听耳”解释为不听耳朵。
    - 把“邪”当感叹词，“耳”当反问词，语气功能搞反。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:文言词语古今异义
  type: Concept
  subject: 语文
  title: 文言词语古今异义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘妻子’的古今义混淆，在文言文中仍理解为‘妻子’一人，忽略古义指妻子和儿女。
    - 能指出并纠正这一错误：将‘阡陌交通’中的‘交通’解释为现代交通道路，实为交错相通。
  aliases:
    - 古今异义
  category: 文言知识
  explanation: 文言文中某些词语的意义和现代汉语不同，如“牺牲”古指祭祀用的牲畜，今指为正义事业献身。
  misconceptions:
    - 把‘妻子’的古今义混淆，在文言文中仍理解为‘妻子’一人，忽略古义指妻子和儿女。
    - 将‘阡陌交通’中的‘交通’解释为现代交通道路，实为交错相通。
    - 翻译‘牺牲玉帛’时把‘牺牲’说成‘为正义而死’，忽略其本指祭祀品的牲畜。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:断人行
  type: Concept
  subject: 语文
  title: 断人行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘断人行’理解为道路坍塌，截断了行人的去路。
    - 能指出并纠正这一错误：误以为‘断人行’是‘人不能行走’，指生病或残疾。
  aliases: []
  category: 词语理解
  explanation: 指实行宵禁，禁止人行走。
  misconceptions:
    - 把‘断人行’理解为道路坍塌，截断了行人的去路。
    - 误以为‘断人行’是‘人不能行走’，指生病或残疾。
    - 把‘断人行’解释为‘禁止路人通行’，只针对行人而非宵禁。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:断章取义
  type: Concept
  subject: 语文
  title: 断章取义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“断章取义”误用为“断章取意”，认为取的是自己的意思。
    - 能指出并纠正这一错误：写作文时把“断章取义”当作褒义词，用来形容自己引用名言。
  aliases: []
  category: 成语
  explanation: 不顾全篇文章内容，只根据需要孤立截取其中一段或一句的意思。
  misconceptions:
    - 把“断章取义”误用为“断章取意”，认为取的是自己的意思。
    - 写作文时把“断章取义”当作褒义词，用来形容自己引用名言。
    - 辨析“断章取义”与“寻章摘句”时，认为两者都是贬义且用法完全相同。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:断肠
  type: Concept
  subject: 语文
  title: 断肠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：望文生义，把“断肠”理解为肠子断裂，如说“断肠人”是肠子断了的人。
    - 能指出并纠正这一错误：与“断魂”混淆，误写为“断魂人在天涯”。
  aliases: []
  category: 文言词语
  explanation: 形容悲伤到极点。在《天净沙·秋思》中“断肠人在天涯”指漂泊天涯的游子极度悲伤。
  misconceptions:
    - 望文生义，把“断肠”理解为肠子断裂，如说“断肠人”是肠子断了的人。
    - 与“断魂”混淆，误写为“断魂人在天涯”。
    - 把“断肠”程度减轻，误以为只是“难过”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:斯石英
  type: Concept
  subject: 语文
  title: 斯石英
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把斯石英当成普通二氧化硅，忽略其在超高压下原子排列更紧密。
    - 能指出并纠正这一错误：认为斯石英在常温常压下很快分解，实际可保持数百万年。
  aliases:
    - 被压扁的沙子
  category: 矿物学概念
  explanation: 二氧化硅在超高压下形成的致密矿物，比普通沙子重，可保持数百万年。
  misconceptions:
    - 误把斯石英当成普通二氧化硅，忽略其在超高压下原子排列更紧密。
    - 认为斯石英在常温常压下很快分解，实际可保持数百万年。
    - 将斯石英与石英混淆，认为两者硬度相同（斯石英密度更高）。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:新乐府
  type: Concept
  subject: 语文
  title: 新乐府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“新乐府”当作汉代乐府机构，混淆时代。
    - 能指出并纠正这一错误：将“新乐府”主张说成“以古讽今”，实际是“为事而作”。
  aliases: []
  category: 文学体裁
  explanation: 白居易倡导的诗歌革新运动，主张“文章合为时而著，歌诗合为事而作”。
  misconceptions:
    - 误把“新乐府”当作汉代乐府机构，混淆时代。
    - 将“新乐府”主张说成“以古讽今”，实际是“为事而作”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:新军
  type: Concept
  subject: 语文
  title: 新军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“新军”指“新的军队”或革命军，实为清末新式陆军。
    - 能指出并纠正这一错误：将“新军”与“新兵”混为一谈，忽略历史特定含义。
  aliases: []
  category: 词语
  explanation: 清末按西方国家军制编练的新式陆军。
  misconceptions:
    - 误以为“新军”指“新的军队”或革命军，实为清末新式陆军。
    - 将“新军”与“新兵”混为一谈，忽略历史特定含义。
    - 在课文中误认为“新军”是共产党军队，实为历史名称。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:新编故事
  type: Concept
  subject: 语文
  title: 新编故事
  conceptType: 应用型
  aliases:
    - 创编故事
  category: 方法
  explanation: 根据已有故事的内容，发挥想象创编新的情节，比如奶奶讲了宝葫芦的故事，可以接着编下去讲给同学听。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C8/sections/S1.md
- id: concept:语文:新诗
  type: Concept
  subject: 语文
  title: 新诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把新诗定义为“新写的诗”，认为今天写的所有诗都是新诗，包括格律诗。
    - 能指出并纠正这一错误：误以为新诗完全不讲形式，随意断句分行就算新诗。
  aliases:
    - 现代诗
  category: 文学体裁
  explanation: 新诗指五四运动前后产生的、以白话作为基本语言手段的诗歌体裁，与古典诗歌相对。
  misconceptions:
    - 把新诗定义为“新写的诗”，认为今天写的所有诗都是新诗，包括格律诗。
    - 误以为新诗完全不讲形式，随意断句分行就算新诗。
    - 把新诗等同于自由诗，用是否押韵来判定新诗，如认为押韵的就不是新诗。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻
  type: Concept
  subject: 语文
  title: 新闻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新闻可以虚构，比如为了生动而添加想象细节。
    - 能指出并纠正这一错误：把新闻等同于消息，忽略了通讯、特写等也是新闻。
  aliases:
    - 消息
    - 新闻报道
  category: 文体知识
  explanation: 新闻是对新近发生的事实的报道，通过报纸、广播、电视、互联网等媒介传播，记录历史进程和社会发展。
  misconceptions:
    - 认为新闻可以虚构，比如为了生动而添加想象细节。
    - 把新闻等同于消息，忽略了通讯、特写等也是新闻。
    - 认为新闻必须是新近发生，但“旧闻”报道不算新闻。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻体裁
  type: Concept
  subject: 语文
  title: 新闻体裁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把消息和通讯混为一谈，不知道消息更简短、通讯更详细。
    - 能指出并纠正这一错误：认为新闻特写就是消息的缩写，忽略了描写和细节刻画。
  aliases:
    - 新闻类型
  category: 文体知识
  explanation: 新闻体裁包括消息、新闻特写、通讯、新闻评论等，不同体裁在篇幅、时效性、表达方式上各有特点。
  misconceptions:
    - 把消息和通讯混为一谈，不知道消息更简短、通讯更详细。
    - 认为新闻特写就是消息的缩写，忽略了描写和细节刻画。
    - 以为新闻评论是客观事实的报道，其实带有作者观点。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻体裁比较
  type: Concept
  subject: 语文
  title: 新闻体裁比较
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为消息的篇幅一定比通讯长，实际消息更短。
    - 能指出并纠正这一错误：认为通讯的时效性比消息强，实际消息通常更快。
  aliases: []
  category: 阅读方法
  explanation: 通过比较不同新闻体裁在篇幅、时效性、表达方式上的差异，归纳各自特点。
  misconceptions:
    - 认为消息的篇幅一定比通讯长，实际消息更短。
    - 认为通讯的时效性比消息强，实际消息通常更快。
    - 比较时只看篇幅，忽略表达方式上的叙述与描写之别。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻六要素
  type: Concept
  subject: 语文
  title: 新闻六要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记不全六要素，常漏掉“何故”或“如何”。
    - 能指出并纠正这一错误：把“何时”写成“什么时候”后，与“何地”顺序颠倒。
  aliases:
    - 六要素
  category: 阅读方法
  explanation: 新闻的六要素包括何时、何地、何事、何人、何故、如何，是把握新闻内容的基本角度。
  misconceptions:
    - 记不全六要素，常漏掉“何故”或“如何”。
    - 把“何时”写成“什么时候”后，与“何地”顺序颠倒。
    - 将“何人”理解成记者，而非新闻事件中的人物。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻写作
  type: Concept
  subject: 语文
  title: 新闻写作
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：写作时加入自己的想象和虚构，不符合新闻真实性。
    - 能指出并纠正这一错误：不按照导语、主体等结构写，而是像作文一样自由抒情。
  aliases: []
  category: 实践技能
  explanation: 新闻写作是根据采访素材撰写新闻稿的过程，包括消息、特写、通讯等不同体裁的写作。
  misconceptions:
    - 写作时加入自己的想象和虚构，不符合新闻真实性。
    - 不按照导语、主体等结构写，而是像作文一样自由抒情。
    - 把采访素材原样照抄，不会筛选和概括重点。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:新闻媒介
  type: Concept
  subject: 语文
  title: 新闻媒介
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新闻媒介只有报纸和电视，忘记广播和互联网。
    - 能指出并纠正这一错误：把媒介当成新闻本身，例如说“报纸是新闻”而不是载体。
  aliases:
    - 媒体
  category: 文体知识
  explanation: 新闻媒介是传播新闻的渠道，包括报纸、广播、电视、互联网等。
  misconceptions:
    - 认为新闻媒介只有报纸和电视，忘记广播和互联网。
    - 把媒介当成新闻本身，例如说“报纸是新闻”而不是载体。
    - 以为新闻媒介只传播新闻，不能传播其他信息。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻特写
  type: Concept
  subject: 语文
  title: 新闻特写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为特写必须写完整事件，像消息一样概括全过程。
    - 能指出并纠正这一错误：把特写等同于通讯，忽视特写聚焦在某个片段或场景。
  aliases: []
  category: 文体知识
  explanation: 新闻特写是新闻体裁的一种，以描写和细节刻画突出新闻事件的某个片段或场景。
  misconceptions:
    - 认为特写必须写完整事件，像消息一样概括全过程。
    - 把特写等同于通讯，忽视特写聚焦在某个片段或场景。
    - 写特写时通篇叙述，缺少细致描写和细节刻画。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻特写与消息的区别
  type: Concept
  subject: 语文
  title: 新闻特写与消息的区别
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为消息比新闻特写更有现场感和细节，把消息当作特写的详细版。
    - 能指出并纠正这一错误：误以为新闻特写必须报道事件全过程，而消息只写片段，正好颠倒。
  aliases: []
  category: 文体知识
  explanation: 消息报道新闻事件的全过程，新闻特写主要描绘新闻事件中的片段。
  misconceptions:
    - 认为消息比新闻特写更有现场感和细节，把消息当作特写的详细版。
    - 误以为新闻特写必须报道事件全过程，而消息只写片段，正好颠倒。
    - 将‘现场感’归为消息的特点，认为特写只有概括性，忽视特写的瞬间描写。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:新闻特写与通讯的区别
  type: Concept
  subject: 语文
  title: 新闻特写与通讯的区别
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为通讯是简短扼要的报道，特写才是长篇完整叙述，混淆两者篇幅。
    - 能指出并纠正这一错误：误以为特写展示纵剖面，通讯展示横剖面，将其特点彻底颠倒。
  aliases: []
  category: 文体知识
  explanation: 通讯展示新闻事件的纵剖面，来龙去脉完整；新闻特写展示横剖面，着重描写精彩瞬间，更强调时效性和现场感。
  misconceptions:
    - 认为通讯是简短扼要的报道，特写才是长篇完整叙述，混淆两者篇幅。
    - 误以为特写展示纵剖面，通讯展示横剖面，将其特点彻底颠倒。
    - 说‘通讯只描写精彩瞬间’，没有意识到通讯需要交代来龙去脉。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:新闻的导语
  type: Concept
  subject: 语文
  title: 新闻的导语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把新闻标题直接当作导语，如认为《首届诺贝尔奖颁发》就是导语
    - 能指出并纠正这一错误：认为导语必须包含新闻的全部要素，缺少'何故'就不算导语
  aliases:
    - 导语
  category: 文体知识
  explanation: 导语是新闻开头的第一段或第一句话，简明扼要地揭示新闻的核心内容。
  misconceptions:
    - 把新闻标题直接当作导语，如认为《首届诺贝尔奖颁发》就是导语
    - 认为导语必须包含新闻的全部要素，缺少'何故'就不算导语
    - 把电头当作导语的开头，说'路透社斯德哥尔摩1901年12月10日电'是导语内容
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:新闻的权威性
  type: Concept
  subject: 语文
  title: 新闻的权威性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘从……获悉’当省略性废话，认为删掉也不影响权威性。
    - 能指出并纠正这一错误：将‘权威性’与‘真实性’划等号，以为权威发布就绝对真实。
  aliases:
    - 信息来源
  category: 新闻文体
  explanation: 新闻通过交代信息来源（如“从中国载人航天工程办公室获悉”）体现其权威性。
  misconceptions:
    - 把‘从……获悉’当省略性废话，认为删掉也不影响权威性。
    - 将‘权威性’与‘真实性’划等号，以为权威发布就绝对真实。
    - 误认为用夸张标题能增强权威性，实际靠信息源头可靠。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:新闻的电头
  type: Concept
  subject: 语文
  title: 新闻的电头
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把电头误认为新闻标题，如认为'路透社斯德哥尔摩1901年12月10日电'是文题
    - 能指出并纠正这一错误：认为电头中的时间是新闻事件发生时间，将发电时间与事发时间划等号
  aliases:
    - 电头
  category: 文体知识
  explanation: 电头是新闻稿件中表明消息来源、发电地点和时间的部分，如“路透社斯德哥尔摩1901年12月10日电”。
  misconceptions:
    - 把电头误认为新闻标题，如认为'路透社斯德哥尔摩1901年12月10日电'是文题
    - 认为电头中的时间是新闻事件发生时间，将发电时间与事发时间划等号
    - 把电头当作新闻的结语，认为消息来源应在文末出现
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻的简洁性
  type: Concept
  subject: 语文
  title: 新闻的简洁性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘简洁’写成‘简结’，或与‘简单’混用，认为越短越好。
    - 能指出并纠正这一错误：以为简洁可删去必要信息，如时间、地点、具体任务。
  aliases: []
  category: 新闻文体
  explanation: 新闻语言简洁，信息完备，如概述后续工作。
  misconceptions:
    - 把‘简洁’写成‘简结’，或与‘简单’混用，认为越短越好。
    - 以为简洁可删去必要信息，如时间、地点、具体任务。
    - 误认为‘概述后续工作’是含糊其辞，而非精炼概括。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:新闻的结构
  type: Concept
  subject: 语文
  title: 新闻的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新闻结构必须包含背景和结语，缺一部分就不完整
    - 能指出并纠正这一错误：把电头列为新闻结构的一部分，称新闻包含标题、电头、导语、主体等
  aliases:
    - 消息结构
  category: 文体知识
  explanation: 新闻一般包括标题、导语、主体、背景和结语五部分，本课重点学习电头和导语。
  misconceptions:
    - 认为新闻结构必须包含背景和结语，缺一部分就不完整
    - 把电头列为新闻结构的一部分，称新闻包含标题、电头、导语、主体等
    - 混淆主体与背景，将介绍诺贝尔遗嘱的内容当作新闻主体
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:新闻的要素
  type: Concept
  subject: 语文
  title: 新闻的要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新闻要素是六个，在五W之外加上'如何（How）'
    - 能指出并纠正这一错误：将获奖者的国籍当作'何人'，如说'德国是新闻要素中的人'
  aliases:
    - 5W
  category: 文体知识
  explanation: 新闻要素包括何时、何地、何人、何事、何故，即“5W”，本课通过首届诺贝尔奖颁发报道体现。
  misconceptions:
    - 认为新闻要素是六个，在五W之外加上'如何（How）'
    - 将获奖者的国籍当作'何人'，如说'德国是新闻要素中的人'
    - 把电头中的时间当作新闻要素的'何时'，忽略那是发电时间
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:新闻的语言特点
  type: Concept
  subject: 语文
  title: 新闻的语言特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写新闻时加入'多么伟大啊'等抒情语句，以为能增强感染力
    - 能指出并纠正这一错误：认为新闻可运用夸张修辞，如把获奖成就写成'惊天动地'
  aliases:
    - 新闻语言特点
  category: 文体知识
  explanation: 新闻语言要求准确、简洁、客观，本课通过列举获奖者信息体现。
  misconceptions:
    - 写新闻时加入'多么伟大啊'等抒情语句，以为能增强感染力
    - 认为新闻可运用夸张修辞，如把获奖成就写成'惊天动地'
    - 用'大约'等模糊词代替确切数字，如'大约1901年'
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻线索
  type: Concept
  subject: 语文
  title: 新闻线索
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为新闻线索就是已经写好的新闻稿，可以直接发表。
    - 能指出并纠正这一错误：以为线索是记者凭空想出的，不需要真实依据。
  aliases: []
  category: 实践技能
  explanation: 新闻线索是发现新闻事件的初步信息，是新闻采访的起点。
  misconceptions:
    - 认为新闻线索就是已经写好的新闻稿，可以直接发表。
    - 以为线索是记者凭空想出的，不需要真实依据。
    - 把任何传闻都当作可靠线索，不加核实就去采访。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻要素梳理
  type: Concept
  subject: 语文
  title: 新闻要素梳理
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：梳理时把“如何”和“何故”混淆，分不清过程和原因。
    - 能指出并纠正这一错误：梳理要素时直接抄原文，没有概括成简洁的关键词。
  aliases: []
  category: 阅读方法
  explanation: 阅读新闻时，通过梳理六要素来把握主要内容，可以分条列举或画图表。
  misconceptions:
    - 梳理时把“如何”和“何故”混淆，分不清过程和原因。
    - 梳理要素时直接抄原文，没有概括成简洁的关键词。
    - 认为六要素必须都要有，没有“如何”就梳理不出来。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻评论
  type: Concept
  subject: 语文
  title: 新闻评论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把新闻评论当作消息，只转述事实而不表达自己的观点和立场。
    - 能指出并纠正这一错误：认为新闻评论可以像小说一样虚构人物和情节，用来增强说服力。
  aliases: []
  category: 文体知识
  explanation: 新闻评论是新闻体裁的一种，对新闻事件发表观点和评论，表达立场和态度。
  misconceptions:
    - 把新闻评论当作消息，只转述事实而不表达自己的观点和立场。
    - 认为新闻评论可以像小说一样虚构人物和情节，用来增强说服力。
    - 误以为新闻评论的语言必须绝对客观，不能出现“我认为”“我建议”等词。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:新闻采访
  type: Concept
  subject: 语文
  title: 新闻采访
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：以为采访前只要到了现场就能开口提问，不需要制订方案和草拟提纲。
    - 能指出并纠正这一错误：把采访记录原封不动写成稿子，不筛选、不整理，导致消息散乱。
  aliases: []
  category: 实践技能
  explanation: 新闻采访是新闻工作者为获取新闻素材而进行的调查访问活动，包括确定题材、制订方案、草拟提纲等步骤。
  misconceptions:
    - 以为采访前只要到了现场就能开口提问，不需要制订方案和草拟提纲。
    - 把采访记录原封不动写成稿子，不筛选、不整理，导致消息散乱。
    - 误认为新闻采访只能访问当事人，不能观察现场或查阅资料。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:方位名词
  type: Concept
  subject: 语文
  title: 方位名词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'在桌子上'的'上'看成介词，忽略它其实表方位、是方位名词。
    - 能指出并纠正这一错误：误将'教室前'的'前'当形容词，以为描摹位置状态的就是形容词。
  aliases:
    - 方位词
  category: 语法
  explanation: 表示方向或位置的词，如“前”“后”“东”“西”“里头”“外边”等，常放在其他名词后表示位置或范围。
  misconceptions:
    - 把'在桌子上'的'上'看成介词，忽略它其实表方位、是方位名词。
    - 误将'教室前'的'前'当形容词，以为描摹位置状态的就是形容词。
    - 混淆方位名词与动词，因'上'可作动词，便把'桌子上'的'上'也当动词。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:施耐庵
  type: Concept
  subject: 语文
  title: 施耐庵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把施耐庵当作《红楼梦》作者，与曹雪芹张冠李戴。
    - 能指出并纠正这一错误：误记施耐庵为明代小说家，忽略其生活于元末明初。
  aliases: []
  category: 文学常识
  explanation: 元末明初小说家，《水浒传》的作者。
  misconceptions:
    - 把施耐庵当作《红楼梦》作者，与曹雪芹张冠李戴。
    - 误记施耐庵为明代小说家，忽略其生活于元末明初。
    - 将施耐庵的字号与罗贯中混淆，如误称“湖海散人”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:旁征博引
  type: Concept
  subject: 语文
  title: 旁征博引
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“旁征博引”写成“旁证博引”，混淆“征”和“证”。
    - 能指出并纠正这一错误：误以为“旁征博引”是贬义词，形容说话啰嗦。
  aliases: []
  category: 论证方法
  explanation: 引用经典、事例来证明观点，增强说服力，如引用孔子、庄子、百丈禅师等。
  misconceptions:
    - 把“旁征博引”写成“旁证博引”，混淆“征”和“证”。
    - 误以为“旁征博引”是贬义词，形容说话啰嗦。
    - 写议论文时只说“我旁征博引”，却不举具体例子，导致论证空洞。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:旋空
  type: Concept
  subject: 语文
  title: 旋空
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“旋空”的“旋”读成xuàn，仿照“旋风”误读。
    - 能指出并纠正这一错误：误以为“旋空”等于“空中”，说“在空中旋空”造成语义重复。
  aliases: []
  category: 词语
  explanation: 在空中盘旋。
  misconceptions:
    - 把“旋空”的“旋”读成xuàn，仿照“旋风”误读。
    - 误以为“旋空”等于“空中”，说“在空中旋空”造成语义重复。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:旌旗
  type: Concept
  subject: 语文
  title: 旌旗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“旌旗”误写成“精旗”或“晶旗”，形近致误。
    - 能指出并纠正这一错误：把“旌旗”借指军士的借代修辞误判为比喻。
  aliases: []
  category: 词语
  explanation: 旗帜的总称。这里借指军士。
  misconceptions:
    - 将“旌旗”误写成“精旗”或“晶旗”，形近致误。
    - 把“旌旗”借指军士的借代修辞误判为比喻。
    - 误以为“旌旗”只指旗帜，忽略在语境中借指军士。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:无产阶级战士
  type: Concept
  subject: 语文
  title: 无产阶级战士
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为无产阶级战士必须出身工人，所以否认保尔是无产阶级战士。
    - 能指出并纠正这一错误：把无产阶级战士理解为穷人或流浪汉，认为只要贫穷就是战士。
  aliases: []
  category: 文学形象
  explanation: 指在无产阶级革命斗争中成长起来的战士，具有坚定的革命信念和牺牲精神。
  misconceptions:
    - 认为无产阶级战士必须出身工人，所以否认保尔是无产阶级战士。
    - 把无产阶级战士理解为穷人或流浪汉，认为只要贫穷就是战士。
    - 认为保尔加入红军之前就不是无产阶级战士，忽略他贫穷的出身。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:无言之美
  type: Concept
  subject: 语文
  title: 无言之美
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘无言’理解为完全不写一个字，以为留白就等同于无言。
    - 能指出并纠正这一错误：认为所有作品都应追求无言，语言表达越多越低级。
  aliases:
    - 含蓄美
  category: 美学概念
  explanation: 无言之美指艺术作品通过含蓄、留白等方式，让欣赏者自行领会，从而产生更深刻的美感。
  misconceptions:
    - 把‘无言’理解为完全不写一个字，以为留白就等同于无言。
    - 认为所有作品都应追求无言，语言表达越多越低级。
    - 将‘无言之美’与‘言不尽意’混为一谈，不知前者重在美感。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:日记
  type: Concept
  subject: 语文
  title: 日记
  conceptType: 概念型
  aliases:
    - 日记二则
  category: 文化常识
  explanation: 日记是把自己当天做的事情和想法写下来的文字，开头要写上日期。读日记能知道别人做过什么、想过什么。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:旧体诗
  type: Concept
  subject: 语文
  title: 旧体诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为旧体诗仅指绝句和律诗，把《诗经》《古诗十九首》等古体诗排除在外。
    - 能指出并纠正这一错误：把现代人写的五言“古风”歌词当作旧体诗，忽略其不合平仄、对仗等格律要求。
  aliases:
    - 古体诗
  category: 文学体裁
  explanation: 旧体诗指用文言文和传统格律创作的诗歌，如绝句、律诗等。
  misconceptions:
    - 误以为旧体诗仅指绝句和律诗，把《诗经》《古诗十九首》等古体诗排除在外。
    - 把现代人写的五言“古风”歌词当作旧体诗，忽略其不合平仄、对仗等格律要求。
    - 认为旧体诗必须使用文言文，其实乐府诗等可用部分口语。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:旧部
  type: Concept
  subject: 语文
  title: 旧部
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“旧部”误解为“旧部门”或“老部下”，忽略特指牺牲同志。
    - 能指出并纠正这一错误：误写“旧部”为“旧布”，同音混淆。
  aliases: []
  category: 词语
  explanation: 过去的部下。这里指为革命牺牲的同志。
  misconceptions:
    - 将“旧部”误解为“旧部门”或“老部下”，忽略特指牺牲同志。
    - 误写“旧部”为“旧布”，同音混淆。
    - 在诗中误以为“旧部”指过去的部队，实际指人。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:时效性
  type: Concept
  subject: 语文
  title: 时效性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“时效性”写成“实效性”，混淆了字音和字形。
    - 能指出并纠正这一错误：认为新闻发布比事件发生晚得越多，时效性越强，说反了时间差。
  aliases: []
  category: 文体知识
  explanation: 时效性指新闻发布与事件发生之间的时间差，时间差越小，时效性越强。
  misconceptions:
    - 将“时效性”写成“实效性”，混淆了字音和字形。
    - 认为新闻发布比事件发生晚得越多，时效性越强，说反了时间差。
    - 把时效性与真实性对立，认为抢时间发新闻就可以不核实事实。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:时间变化和地点转移的叙事线索
  type: Concept
  subject: 语文
  title: 时间变化和地点转移的叙事线索
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“时间变化和地点转移”误认为记叙顺序，而非叙事线索
    - 能指出并纠正这一错误：认为课文线索是“老山界”或“红军”，忽略时间与地点的双重推进
  aliases:
    - 叙事线索
  category: 文学
  explanation: 本文按照时间变化和地点转移展开叙述，是记叙文常用的叙事线索。
  misconceptions:
    - 把“时间变化和地点转移”误认为记叙顺序，而非叙事线索
    - 认为课文线索是“老山界”或“红军”，忽略时间与地点的双重推进
    - 答题时只说“时间顺序”，漏掉“地点转移”这一要素
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:时间顺序
  type: Concept
  subject: 语文
  title: 时间顺序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为时间顺序必须写出具体年份日期，没有就判为其他顺序
    - 能指出并纠正这一错误：把倒叙误认为时间顺序，如‘从晚年写起’也说是时间顺序
  aliases:
    - 顺叙
  category: 写作手法
  explanation: 按照时间先后顺序叙述事件，使文章条理清晰。本文从南仁东童年写到逝世，依时间顺序展开。
  misconceptions:
    - 认为时间顺序必须写出具体年份日期，没有就判为其他顺序
    - 把倒叙误认为时间顺序，如‘从晚年写起’也说是时间顺序
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:昆曲
  type: Concept
  subject: 语文
  title: 昆曲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为昆曲起源于北京，实际发源于江苏昆山一带。
    - 能指出并纠正这一错误：将“昆曲”的“昆”误写为“琨”，混淆字形。
  aliases:
    - 昆剧
  category: 戏曲剧种
  explanation: 中国最古老的戏曲剧种之一，以婉转细腻的唱腔和优美的舞蹈著称。
  misconceptions:
    - 误认为昆曲起源于北京，实际发源于江苏昆山一带。
    - 将“昆曲”的“昆”误写为“琨”，混淆字形。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:明喻
  type: Concept
  subject: 语文
  title: 明喻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘他像他爸爸’当明喻，这是同类比较，无喻体，不是比喻。
    - 能指出并纠正这一错误：把‘好像’表推测当明喻，如‘他好像走了’并非比喻。
  aliases: []
  category: 修辞手法
  explanation: 明喻是比喻的一种，本体和喻体之间用“像”“好像”“仿佛”等比喻词连接。
  misconceptions:
    - 把‘他像他爸爸’当明喻，这是同类比较，无喻体，不是比喻。
    - 把‘好像’表推测当明喻，如‘他好像走了’并非比喻。
    - 认为明喻固定用‘像’，忽略‘仿佛’‘如同’等也是明喻标志。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:明暗双线结构
  type: Concept
  subject: 语文
  title: 明暗双线结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为明线是晁盖智取，暗线是杨志押送，方向颠倒。
    - 能指出并纠正这一错误：把明暗双线简单理解为两条都直接描写，忽略暗线需侧写。
  aliases:
    - 双线结构
  category: 写作手法
  explanation: 小说采用明线和暗线交织的叙事结构，明线是杨志押送生辰纲，暗线是吴用等人智取生辰纲。
  misconceptions:
    - 认为明线是晁盖智取，暗线是杨志押送，方向颠倒。
    - 把明暗双线简单理解为两条都直接描写，忽略暗线需侧写。
    - 分析时只提一条线，如只说杨志押送，忽略吴用等暗线存在。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:明贬实褒的表达方法
  type: Concept
  subject: 语文
  title: 明贬实褒的表达方法
  conceptType: 概念型
  aliases:
    - 明贬实褒
    - 贬义词表达喜爱之情
  category: 方法
  explanation: 表面看像是在责备、不喜欢，实际上字里行间藏着深深的爱，如说猫“古怪”、鹅“架子十足”，都是贬中含爱。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:易混声母辨析
  type: Concept
  subject: 语文
  title: 易混声母辨析
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 有的声母长得像，发音却不一样，比如 b 和 d、f 和 t。要看清它们的方向和样子，读准音，才不会拼错字。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:易混韵母辨析
  type: Concept
  subject: 语文
  title: 易混韵母辨析
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 有的韵母字母相同、先后不同，读音就不一样，比如 ie 和 ei、iu 和 ui。要仔细比较，读准音，才不会写错认错。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:星汉
  type: Concept
  subject: 语文
  title: 星汉
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“星汉”解为“星星和汉朝”，不知是银河的通称。
    - 能指出并纠正这一错误：误将“星汉”等同于“星辰”，未指出银河之意。
  aliases:
    - 银河
  category: 文言词语
  explanation: 银河。在《观沧海》中“星汉灿烂”指银河灿烂。
  misconceptions:
    - 把“星汉”解为“星星和汉朝”，不知是银河的通称。
    - 误将“星汉”等同于“星辰”，未指出银河之意。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:春赛
  type: Concept
  subject: 语文
  title: 春赛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“春赛”理解为春天举办的体育比赛，忽略它是民俗赛会。
    - 能指出并纠正这一错误：误认为“春赛”只是春天游玩，忽略其祭祀游艺性质。
  aliases: []
  category: 文化常识
  explanation: 春天举行的赛会。
  misconceptions:
    - 把“春赛”理解为春天举办的体育比赛，忽略它是民俗赛会。
    - 误认为“春赛”只是春天游玩，忽略其祭祀游艺性质。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:晋察冀抗日根据地
  type: Concept
  subject: 语文
  title: 晋察冀抗日根据地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为晋察冀抗日根据地在江西、安徽一带，实际在华北五省部分地区
    - 能指出并纠正这一错误：认为晋察冀是根据地是国民党建立的，实际是共产党领导建立的敌后根据地
  aliases:
    - 晋察冀边区
    - 晋察冀根据地
  category: 历史地理
  explanation: 抗日战争时期中国共产党领导的敌后抗日根据地之一，包括山西、察哈尔、河北、热河、辽宁五省的部分地区。
  misconceptions:
    - 误以为晋察冀抗日根据地在江西、安徽一带，实际在华北五省部分地区
    - 认为晋察冀是根据地是国民党建立的，实际是共产党领导建立的敌后根据地
    - 记不清‘晋’指山西，‘察’指察哈尔，‘冀’指河北，位置容易混淆
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:晏殊
  type: Concept
  subject: 语文
  title: 晏殊
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将晏殊与晏几道视为同代一人，混淆父与子。
    - 能指出并纠正这一错误：认为晏殊是南宋词人，实际是北宋。
  aliases: []
  category: 文学常识
  explanation: 北宋词人，与欧阳修齐名，词风典雅。
  misconceptions:
    - 将晏殊与晏几道视为同代一人，混淆父与子。
    - 认为晏殊是南宋词人，实际是北宋。
    - 把“无可奈何花落去”记在欧阳修或苏轼名下。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:普希金
  type: Concept
  subject: 语文
  title: 普希金
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《致大海》作者写成弗罗斯特，实际是普希金。
    - 能指出并纠正这一错误：说普希金是英国或美国诗人，忽略其俄国作家身份。
  aliases: []
  category: 文学常识
  explanation: 普希金（1799—1837），俄国诗人、作家，代表作有《自由颂》《致大海》《叶甫盖尼·奥涅金》等，对俄国文学和语言发展影响很大。
  misconceptions:
    - 误将《致大海》作者写成弗罗斯特，实际是普希金。
    - 说普希金是英国或美国诗人，忽略其俄国作家身份。
    - 把《未选择的路》安到普希金名下，与弗罗斯特作品张冠李戴。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:景物描写
  type: Concept
  subject: 语文
  title: 景物描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“太阳出来了”当成景物描写，认为出现自然景物就是描写，实际没有描写性内容。
    - 能指出并纠正这一错误：分析作用时只写“写出了景物的美丽”，忽略烘托人物心情，如“新绿”衬托散步时的愉悦。
  aliases:
    - 环境描写
  category: 写作手法
  explanation: 景物描写是对自然景物或环境的描写，在叙事中穿插景物描写可以烘托气氛、衬托人物心情、推动情节发展、深化主题。
  misconceptions:
    - 把“太阳出来了”当成景物描写，认为出现自然景物就是描写，实际没有描写性内容。
    - 分析作用时只写“写出了景物的美丽”，忽略烘托人物心情，如“新绿”衬托散步时的愉悦。
    - 误将“街上人来人往”的场面描写当作景物描写，因为内容不是自然景物。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:景物描写方法
  type: Concept
  subject: 语文
  title: 景物描写方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：描写景物时只用视觉，没有运用听觉、嗅觉等感官
    - 能指出并纠正这一错误：认为动静结合就是写一个动物和一个静物，没有真正融合
  aliases: []
  category: 写作手法
  explanation: 描写景物时，可运用多种感官（视觉、听觉、味觉等），动静结合，远近结合，使景物生动形象。
  misconceptions:
    - 描写景物时只用视觉，没有运用听觉、嗅觉等感官
    - 认为动静结合就是写一个动物和一个静物，没有真正融合
    - 写景时没有按远近、高低顺序，想到什么写什么
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:景物特征
  type: Concept
  subject: 语文
  title: 景物特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'素湍绿潭'是夏季景色，实为春冬之景。
    - 能指出并纠正这一错误：将'林寒涧肃'归为春冬，原文是秋季凄清之象。
  aliases: []
  category: 写作手法
  explanation: 抓住三峡不同季节的景物特征：夏季水急，春冬清幽，秋季凄清。
  misconceptions:
    - 误以为'素湍绿潭'是夏季景色，实为春冬之景。
    - 将'林寒涧肃'归为春冬，原文是秋季凄清之象。
    - 说夏季三峡'清幽宁静'，与'夏水襄陵，沿溯阻绝'的湍急相悖。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:智取生辰纲
  type: Concept
  subject: 语文
  title: 智取生辰纲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记智取地点为黄泥冈，说是“野猪林”或“飞云浦”。
    - 能指出并纠正这一错误：认为智取是由宋江策划，忽略晁盖、吴用等人。
  aliases:
    - 智取生辰纲
  category: 文学常识
  explanation: 《水浒传》第十六回中的经典情节，讲述了杨志押送生辰纲被晁盖等人智取的故事。
  misconceptions:
    - 误记智取地点为黄泥冈，说是“野猪林”或“飞云浦”。
    - 认为智取是由宋江策划，忽略晁盖、吴用等人。
    - 把“生辰纲”写成“生辰钢”，字形混淆。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:暗喻
  type: Concept
  subject: 语文
  title: 暗喻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘他是老师’当暗喻，这是判断句，不是比喻。
    - 能指出并纠正这一错误：认为暗喻只用‘是’，其实‘变成’‘成为’及破折号也可构成暗喻。
  aliases:
    - 隐喻
  category: 修辞手法
  explanation: 暗喻是比喻的一种，本体和喻体之间用“是”“就是”“变成”等词语连接，或使用破折号。
  misconceptions:
    - 把‘他是老师’当暗喻，这是判断句，不是比喻。
    - 认为暗喻只用‘是’，其实‘变成’‘成为’及破折号也可构成暗喻。
    - 把‘时间就是金钱’当暗喻没错，但‘他就是门卫’这类直言判断也误当暗喻。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:曲牌名
  type: Concept
  subject: 语文
  title: 曲牌名
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“天净沙”误认为词牌名，混淆曲牌和词牌。
    - 能指出并纠正这一错误：误把《秋思》当作曲牌名，实为题目。
  aliases: []
  category: 文学常识
  explanation: 曲牌是元曲的曲调名称，如“天净沙”即为曲牌名。
  misconceptions:
    - 将“天净沙”误认为词牌名，混淆曲牌和词牌。
    - 误把《秋思》当作曲牌名，实为题目。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:更定
  type: Concept
  subject: 语文
  title: 更定
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘更定’理解为‘五更’时分，即天快亮时。
    - 能指出并纠正这一错误：误以为‘更定’就是‘定更’，但不清楚是晚上八时左右。
  aliases:
    - 定更
  category: 古代计时
  explanation: 古代夜间计时单位，一夜分为五更，每更约两小时；晚上八时左右打鼓报告初更开始，称为“定更”。
  misconceptions:
    - 把‘更定’理解为‘五更’时分，即天快亮时。
    - 误以为‘更定’就是‘定更’，但不清楚是晚上八时左右。
    - 将‘更定’的‘定’写成‘订’，记成‘更订’。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:曹刿论战
  type: Concept
  subject: 语文
  title: 曹刿论战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《曹刿论战》出自《战国策》，而非《左传》。
    - 能指出并纠正这一错误：把主人公‘曹刿’写成‘曹操’，将‘刿’字误读为guì。
  aliases: []
  category: 文言文
  explanation: 《左传》中的名篇，记述曹刿向鲁庄公献策，并在长勺之战中指挥鲁军击败齐军的故事，体现了曹刿的军事才能和政治远见。
  misconceptions:
    - 误认为《曹刿论战》出自《战国策》，而非《左传》。
    - 把主人公‘曹刿’写成‘曹操’，将‘刿’字误读为guì。
    - 认为曹刿是鲁庄公的将军，忽略其本为平民，犯身份错位。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:曹操
  type: Concept
  subject: 语文
  title: 曹操
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为曹操是三国蜀汉人物，将其与刘备并列
    - 能指出并纠正这一错误：把《龟虽寿》记为曹植所作，张冠李戴
  aliases:
    - 魏武帝
  category: 文学常识
  explanation: 东汉末年政治家、军事家、诗人，代表作有《龟虽寿》《观沧海》等。
  misconceptions:
    - 误认为曹操是三国蜀汉人物，将其与刘备并列
    - 把《龟虽寿》记为曹植所作，张冠李戴
    - 误将曹操列为‘建安七子’之一
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S8.md
- id: concept:语文:曹植
  type: Concept
  subject: 语文
  title: 曹植
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为曹植是曹操的弟弟，实际是曹操之子
    - 能指出并纠正这一错误：把曹植的《洛神赋》误记为曹丕作品
  aliases: []
  category: 文学常识
  explanation: 三国时期曹魏著名文学家，曹操之子，代表作有《洛神赋》《七步诗》等。
  misconceptions:
    - 误认为曹植是曹操的弟弟，实际是曹操之子
    - 把曹植的《洛神赋》误记为曹丕作品
    - 误认为曹植属于‘建安七子’之一
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S8.md
- id: concept:语文:曹雪芹
  type: Concept
  subject: 语文
  title: 曹雪芹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为曹雪芹是元末明初人，与施耐庵同时代。
    - 能指出并纠正这一错误：把曹雪芹的字“梦阮”与白居易的字“乐天”混淆。
  aliases: []
  category: 文学常识
  explanation: 清代小说家，名霑，字梦阮，号雪芹，著有《红楼梦》。
  misconceptions:
    - 误以为曹雪芹是元末明初人，与施耐庵同时代。
    - 把曹雪芹的字“梦阮”与白居易的字“乐天”混淆。
    - 认为《红楼梦》写的是宋江起义，与《水浒传》内容混淆。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:曾子烹彘
  type: Concept
  subject: 语文
  title: 曾子烹彘
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“烹”误认为就是“杀”，实际上“烹”是“煮”
    - 能指出并纠正这一错误：误将“曾子”认为是孔子的儿子，其实是孔子学生曾参
  aliases: []
  category: 典故
  explanation: 曾子为兑现妻子对孩子的承诺而杀猪，体现父母对孩子诚信教育的重要性。
  misconceptions:
    - 把“烹”误认为就是“杀”，实际上“烹”是“煮”
    - 误将“曾子”认为是孔子的儿子，其实是孔子学生曾参
    - 把“彘”说成小猪，实际“彘”是大猪，“豚”才是小猪
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:最可爱的人
  type: Concept
  subject: 语文
  title: 最可爱的人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘最可爱的人’理解为外貌可爱的人，忽略其指志愿军战士的崇高品质。
    - 能指出并纠正这一错误：误以为‘最可爱的人’专指黄继光等个别英雄，其实是对全体志愿军的称呼。
  aliases: []
  category: 核心称呼
  explanation: 本文对中国人民志愿军战士的亲切称呼，表达了作者对志愿军战士崇高品质的赞美和敬意。
  misconceptions:
    - 把‘最可爱的人’理解为外貌可爱的人，忽略其指志愿军战士的崇高品质。
    - 误以为‘最可爱的人’专指黄继光等个别英雄，其实是对全体志愿军的称呼。
    - 将‘最可爱的人’与‘最可敬的人’混用，体会不出‘可爱’中的亲昵与赞美。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:月亮的圆缺变化
  type: Concept
  subject: 语文
  title: 月亮的圆缺变化
  conceptType: 概念型
  aliases:
    - 月相变化
    - 月亮形状变化
  category: 现象
  explanation: 月亮的形状每天都在慢慢变化，有时细细弯弯像眉毛，有时又变得圆圆的像盘子，所以裁缝总也做不好合适的衣裳。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C7/sections/S7.md
- id: concept:语文:月夜忆舍弟
  type: Concept
  subject: 语文
  title: 月夜忆舍弟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记作者为苏轼，因其表达思念常与‘水调歌头’混淆。
    - 能指出并纠正这一错误：把‘舍弟’误用为称呼别人的弟弟，如‘你的舍弟’。
  aliases: []
  category: 诗题理解
  explanation: 杜甫诗，写于安史之乱中，表达对弟弟的思念。舍弟，对人谦称自己的弟弟。
  misconceptions:
    - 误记作者为苏轼，因其表达思念常与‘水调歌头’混淆。
    - 把‘舍弟’误用为称呼别人的弟弟，如‘你的舍弟’。
    - 将‘月夜忆舍弟’的‘忆’写成‘意’，或与‘月夜忆山弟’混淆。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:月球起源假说
  type: Concept
  subject: 语文
  title: 月球起源假说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为月球起源只有大碰撞说一种，忽略分裂说、俘获说等。
    - 能指出并纠正这一错误：将俘获说误认为月球是地球分裂出去的，实际是地球引力俘获。
  aliases:
    - 月球起源学说
  category: 天文学
  explanation: 关于月球形成原因的多种科学假说，包括分裂说、俘获说、同源说和大碰撞说。
  misconceptions:
    - 误认为月球起源只有大碰撞说一种，忽略分裂说、俘获说等。
    - 将俘获说误认为月球是地球分裂出去的，实际是地球引力俘获。
    - 认为同源说能够解释月球熔融，实际它无法解释。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:有业之必要
  type: Concept
  subject: 语文
  title: 有业之必要
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“有业之必要”理解为“一定要有铁饭碗”，忽视正当职业的多样性。
    - 能指出并纠正这一错误：将“无业游民是社会的蛀虫”中的“蛀虫”误认为比喻义不变，实为贬义强化。
  aliases: []
  category: 核心概念
  explanation: 有业是敬业和乐业的前提，人人都要有正当职业并不断劳作，无业游民是社会的蛀虫。
  misconceptions:
    - 把“有业之必要”理解为“一定要有铁饭碗”，忽视正当职业的多样性。
    - 将“无业游民是社会的蛀虫”中的“蛀虫”误认为比喻义不变，实为贬义强化。
    - 写段落论证时只空喊“有业重要”，不引用梁启超或孔子例子。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:有为有不为
  type: Concept
  subject: 语文
  title: 有为有不为
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“有为”就是“有作为、成功”，如“他是有为青年”。
    - 能指出并纠正这一错误：误以为“有不为”就是“什么都不做”，如“佛系就是有不为”。
  aliases: []
  category: 核心观点
  explanation: “为”即做，应该做的事必须做是“有为”，不应该做的事必不能做是“有不为”，关键在于“应该”二字。
  misconceptions:
    - 误以为“有为”就是“有作为、成功”，如“他是有为青年”。
    - 误以为“有不为”就是“什么都不做”，如“佛系就是有不为”。
    - 忽视“应该”与否的标准，凭个人感情决定做不做。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:有创意地表达
  type: Concept
  subject: 语文
  title: 有创意地表达
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：认为有创意地表达就是刻意使用生造词和怪异句式，忽视内容实质。
    - 能指出并纠正这一错误：将‘有创意’混同于‘标新立异’，认为越脱离主题越有创意。
  aliases:
    - 创意表达
  category: 写作方法
  explanation: 写作时在选材、角度、语言、形式等方面追求新意，不落俗套。
  misconceptions:
    - 认为有创意地表达就是刻意使用生造词和怪异句式，忽视内容实质。
    - 将‘有创意’混同于‘标新立异’，认为越脱离主题越有创意。
    - 写作时放弃常见素材，认为只有科幻想象才算创意，忽略日常新角度。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:有感情地朗读
  type: Concept
  subject: 语文
  title: 有感情地朗读
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读儿歌和诗歌时，要读出快乐、高兴的心情，让别人感受到你的喜爱。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:有新鲜感的词句
  type: Concept
  subject: 语文
  title: 有新鲜感的词句
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 课文中让人读了感到新奇、好像看见了画面的词句。读到这样的词句可以多读几遍，画下来再抄写积累。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:有条理地表达
  type: Concept
  subject: 语文
  title: 有条理地表达
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 交流之后整理记录，根据整理好的内容按一定顺序把了解到的情况和自己的感受说清楚。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:有目的地阅读
  type: Concept
  subject: 语文
  title: 有目的地阅读
  conceptType: 程序型
  aliases:
    - 根据阅读目的选方法
  category: 方法
  explanation: 阅读前先明确自己的阅读目的，再决定关注哪些内容、用哪种方法读。目的不同，关注的内容和读法就不同：有的内容细读，有的浏览即可。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:朗诵技巧
  type: Concept
  subject: 语文
  title: 朗诵技巧
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为重音就是加大音量，把强调的“悄悄”读得特别响，忽视重音也可轻读或延长。
    - 能指出并纠正这一错误：停连时随意换气，如“春/风/又/绿/江/南/岸”一字一顿，破坏词语和语义连贯。
  aliases: []
  category: 语文实践
  explanation: 包括重音、停连、节奏、语气、语调、语速等，用于准确传达诗歌情感。
  misconceptions:
    - 认为重音就是加大音量，把强调的“悄悄”读得特别响，忽视重音也可轻读或延长。
    - 停连时随意换气，如“春/风/又/绿/江/南/岸”一字一顿，破坏词语和语义连贯。
    - 朗诵整首诗都用同一种语速和语调，没有随情感起伏调整，使诗歌缺乏感染力。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:朗读技巧
  type: Concept
  subject: 语文
  title: 朗读技巧
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：朗读疑问句时用降调，如‘你到哪儿去了’读成陈述句。
    - 能指出并纠正这一错误：把节奏等同于语速，认为急促就是读得快，忽视轻重缓急变化。
  aliases: []
  category: 语文技能
  explanation: 朗读时要注意语调（升调、降调）和节奏（轻快、凝重、高亢、低沉、舒缓、急促），以表达作品的思想感情。
  misconceptions:
    - 朗读疑问句时用降调，如‘你到哪儿去了’读成陈述句。
    - 把节奏等同于语速，认为急促就是读得快，忽视轻重缓急变化。
    - 朗读时一味提高音量，认为高亢就是大声喊，没有情感起伏。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:朗读的语气
  type: Concept
  subject: 语文
  title: 朗读的语气
  conceptType: 程序型
  aliases:
    - 注意对话的语气
    - 读出恰当的语气
  category: 方法
  explanation: 读人物对话时，要读出这个人当时的心情和口气，像老师耐心问话、同学不好意思回答，读法就不一样。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:朝天子·咏喇叭
  type: Concept
  subject: 语文
  title: 朝天子·咏喇叭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《朝天子·咏喇叭》的作者误记为张养浩，实为王磐。
    - 能指出并纠正这一错误：认为散曲是直接讽刺喇叭，忽略借物讽喻宦官作威作福。
  aliases: []
  category: 散曲
  explanation: 王磐借咏喇叭讽刺明朝宦官作威作福、鱼肉百姓的社会现实。
  misconceptions:
    - 把《朝天子·咏喇叭》的作者误记为张养浩，实为王磐。
    - 认为散曲是直接讽刺喇叭，忽略借物讽喻宦官作威作福。
    - 将“朝天子”当作词牌名，实际是曲牌名。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:朝气蓬勃
  type: Concept
  subject: 语文
  title: 朝气蓬勃
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘蓬勃’写作‘篷勃’或‘膊勃’，如‘朝气篷勃’
    - 能指出并纠正这一错误：将‘朝气蓬勃’误用于老年人，如‘爷爷朝气蓬勃’
  aliases: []
  category: 成语
  explanation: 形容充满生气和活力。文中引用毛主席的话，鼓励青年。
  misconceptions:
    - 把‘蓬勃’写作‘篷勃’或‘膊勃’，如‘朝气篷勃’
    - 将‘朝气蓬勃’误用于老年人，如‘爷爷朝气蓬勃’
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:木兰形象
  type: Concept
  subject: 语文
  title: 木兰形象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只强调木兰英勇善战，忽视她“当窗理云鬓，对镜帖花黄”的女儿情态
    - 能指出并纠正这一错误：误认为木兰辞官只因不慕荣利，其实更核心的原因是思念父母、渴望归家
  aliases:
    - 木兰
  category: 人物形象
  explanation: 木兰兼具英雄气概和女儿情怀，勤劳孝顺、勇敢坚毅、不慕荣利。
  misconceptions:
    - 只强调木兰英勇善战，忽视她“当窗理云鬓，对镜帖花黄”的女儿情态
    - 误认为木兰辞官只因不慕荣利，其实更核心的原因是思念父母、渴望归家
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:木氏家族
  type: Concept
  subject: 语文
  title: 木氏家族
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认木氏家族是汉族，不知其是丽江纳西族土司。
    - 能指出并纠正这一错误：将木府等同于北京故宫，混淆建筑归属。
  aliases:
    - 木氏土司
  category: 历史常识
  explanation: 明代丽江纳西族土司家族，曾统治丽江地区，主持修筑四方街。
  misconceptions:
    - 误认木氏家族是汉族，不知其是丽江纳西族土司。
    - 将木府等同于北京故宫，混淆建筑归属。
    - 把“木氏”写成“目氏”，字形混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:本心
  type: Concept
  subject: 语文
  title: 本心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“本心”理解为“原本的想法”，忽略孟子所指的羞恶之心。
    - 能指出并纠正这一错误：误认为与“初心”同义，都是最初的心愿。
  aliases:
    - 羞恶之心
  category: 哲学概念
  explanation: 指人的羞恶之心，即人所固有的善良本性，孟子认为贤者能保持本心。
  misconceptions:
    - 把“本心”理解为“原本的想法”，忽略孟子所指的羞恶之心。
    - 误认为与“初心”同义，都是最初的心愿。
    - 认为本心只有圣人才能保有，普通人没有。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:本真之美
  type: Concept
  subject: 语文
  title: 本真之美
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为‘本真之美’指不加修饰的原始状态，即使是丑陋的也算美
    - 能指出并纠正这一错误：把‘本真’写成‘本贞’，以为与坚贞有关
  aliases: []
  category: 审美概念
  explanation: 指事物最美好、最纯净、最圣洁的原始状态，不掺杂任何人为修饰。
  misconceptions:
    - 误认为‘本真之美’指不加修饰的原始状态，即使是丑陋的也算美
    - 把‘本真’写成‘本贞’，以为与坚贞有关
    - 用‘本真之美’形容人精心化妆后的美丽，如‘她化了妆，显得本真之美’
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:本草纲目
  type: Concept
  subject: 语文
  title: 本草纲目
  conceptType: 概念型
  aliases:
    - 一部药物书
  category: 文化常识
  explanation: 本草纲目是明朝医药学家李时珍编写的药物书。他一边行医一边采药、请教别人，用了近三十年才写成这部伟大的书。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C8/sections/S6.md
- id: concept:语文:朱德
  type: Concept
  subject: 语文
  title: 朱德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《回忆我的母亲》作者误记为毛泽东或周恩来。
    - 能指出并纠正这一错误：把朱德的字“玉阶”误记为“玉楷”或“玉价”。
  aliases: []
  category: 作者
  explanation: 朱德（1886—1976），字玉阶，四川仪陇人，伟大的马克思主义者，无产阶级革命家、政治家、军事家，中国人民解放军主要缔造者之一，开国元勋。
  misconceptions:
    - 将《回忆我的母亲》作者误记为毛泽东或周恩来。
    - 把朱德的字“玉阶”误记为“玉楷”或“玉价”。
    - 误记朱德籍贯为四川达县或湖南，实为四川仪陇。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:朱敦儒
  type: Concept
  subject: 语文
  title: 朱敦儒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记成北宋词人，未察觉其跨两宋身份。
    - 能指出并纠正这一错误：认为其词始终婉约，不知后期忧国之作。
  aliases: []
  category: 文学常识
  explanation: 南宋词人，词作由柔美婉约转为忧国忧民。
  misconceptions:
    - 记成北宋词人，未察觉其跨两宋身份。
    - 认为其词始终婉约，不知后期忧国之作。
    - 将《相见欢》误为李煜所作，因李煜也有此词牌。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:朱自清
  type: Concept
  subject: 语文
  title: 朱自清
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《背影》的作者写成老舍或巴金，出现作者与作品张冠李戴。
    - 能指出并纠正这一错误：将朱自清的《荷塘月色》误记为冰心或叶圣陶的作品。
  aliases: []
  category: 作家
  explanation: 朱自清（1898-1948），中国现代散文家、诗人，代表作有《背影》《荷塘月色》等，其散文以真挚情感和朴素语言著称。
  misconceptions:
    - 把《背影》的作者写成老舍或巴金，出现作者与作品张冠李戴。
    - 将朱自清的《荷塘月色》误记为冰心或叶圣陶的作品。
    - 书写作者姓名时把‘自清’错写成‘子清’，字形混淆。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:李代桃僵
  type: Concept
  subject: 语文
  title: 李代桃僵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'僵'写成'疆'，如'李代桃疆'，误认为与边疆有关。
    - 能指出并纠正这一错误：误认为'李代桃僵'与'桃李满天下'同义，形容学生众多。
  aliases: []
  category: 成语
  explanation: 原比喻兄弟互相帮助，后借指以此代彼或代人受过。
  misconceptions:
    - 把'僵'写成'疆'，如'李代桃疆'，误认为与边疆有关。
    - 误认为'李代桃僵'与'桃李满天下'同义，形容学生众多。
    - 只知'代人受过'，忽略'以此代彼'，如实物替代也能用。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:李公朴遇难事件
  type: Concept
  subject: 语文
  title: 李公朴遇难事件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把李公朴遇难时间记成1946年7月15日，误与闻一多遇刺同日。
    - 能指出并纠正这一错误：将暗杀李公朴的凶手说成是军统，而实际是国民党特务，具体机构不明。
  aliases:
    - 李公朴遇难
  category: 历史背景
  explanation: 1946年7月11日，爱国民主人士李公朴在昆明被国民党特务暗杀，引发闻一多等人的抗议。
  misconceptions:
    - 把李公朴遇难时间记成1946年7月15日，误与闻一多遇刺同日。
    - 将暗杀李公朴的凶手说成是军统，而实际是国民党特务，具体机构不明。
    - 写闻一多《最后一次讲演》时，误把李公朴当成演讲者本人。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:李清照
  type: Concept
  subject: 语文
  title: 李清照
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写“争渡”时误以为李清照是豪放派。
    - 能指出并纠正这一错误：将“常记溪亭日暮”的“常”写成“长”。
  aliases: []
  category: 文学常识
  explanation: 宋代女词人，婉约派代表，作品清新自然。
  misconceptions:
    - 写“争渡”时误以为李清照是豪放派。
    - 将“常记溪亭日暮”的“常”写成“长”。
    - 把《如梦令》归为晏殊或欧阳修之作。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:李白
  type: Concept
  subject: 语文
  title: 李白
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将白居易号“香山居士”安到李白头上，实李白号“青莲居士”。
    - 能指出并纠正这一错误：误把《次北固山下》作者王湾写成李白。
  aliases:
    - 李太白
    - 青莲居士
  category: 文学常识
  explanation: 李白（701—762），字太白，号青莲居士，唐代诗人，《闻王昌龄左迁龙标遥有此寄》为其作品。
  misconceptions:
    - 误将白居易号“香山居士”安到李白头上，实李白号“青莲居士”。
    - 误把《次北固山下》作者王湾写成李白。
    - 将李白时代误作宋代，忽略其唐代诗人身份。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:材料要典型
  type: Concept
  subject: 语文
  title: 材料要典型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写“坚强”选“考试没考好哭鼻子”，人人都会写，不能体现人物独特品质。
    - 能指出并纠正这一错误：认为典型材料就是名人事例，套用屈原、司马迁，不贴合文章中心。
  aliases:
    - 典型材料
  category: 写作方法
  explanation: 典型材料指最能表现人物性格或事物本质的材料，如《邓稼先》中“我不能走”的事例。
  misconceptions:
    - 写“坚强”选“考试没考好哭鼻子”，人人都会写，不能体现人物独特品质。
    - 认为典型材料就是名人事例，套用屈原、司马迁，不贴合文章中心。
    - 用“帮妈妈洗碗”表现母爱，材料不典型，不能突出人物精神本质。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:材料要真实、新颖
  type: Concept
  subject: 语文
  title: 材料要真实、新颖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：为追求新颖编造“外星人教我学语文”等离奇情节，完全失去真实性。
    - 能指出并纠正这一错误：把“新颖”理解为必须写奇闻异事，忽视身边小事的新角度。
  aliases:
    - 真实新颖
  category: 写作方法
  explanation: 真实指材料来自亲历或经得起推敲，新颖指材料别致、与众不同，有新的体验和感悟。
  misconceptions:
    - 为追求新颖编造“外星人教我学语文”等离奇情节，完全失去真实性。
    - 把“新颖”理解为必须写奇闻异事，忽视身边小事的新角度。
    - 写母爱仍用“深夜冒雨送我去医院”的俗套材料，没有新的体验和感悟。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:杜甫
  type: Concept
  subject: 语文
  title: 杜甫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“会当凌绝顶”说成李白《登金陵凤凰台》中的诗句，张冠李戴。
    - 能指出并纠正这一错误：将杜甫的字“子美”写成“子由”或“子安”，字形字音混淆。
  aliases:
    - 杜子美
    - 诗圣
  category: 作家作品
  explanation: 杜甫（712—770），字子美，唐代伟大的现实主义诗人，被尊为“诗圣”，代表作《望岳》等。
  misconceptions:
    - 误把“会当凌绝顶”说成李白《登金陵凤凰台》中的诗句，张冠李戴。
    - 将杜甫的字“子美”写成“子由”或“子安”，字形字音混淆。
    - 认为杜甫是“诗仙”，实际上他是“诗圣”，与李白称号混淆。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:杜陵
  type: Concept
  subject: 语文
  title: 杜陵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写成“杜凌”，把“陵”误写成“凌”。
    - 能指出并纠正这一错误：将“杜陵”理解为杜甫的陵墓，联想到杜甫。
  aliases: []
  category: 文学常识
  explanation: 地名，在今陕西西安东南，诗人曾自称为“杜陵游客”，此处代指故乡。
  misconceptions:
    - 写成“杜凌”，把“陵”误写成“凌”。
    - 将“杜陵”理解为杜甫的陵墓，联想到杜甫。
    - 翻译“杜陵游客”为“在杜陵游玩的客人”，未想到代指故乡。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:杞人忧天
  type: Concept
  subject: 语文
  title: 杞人忧天
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘杞人忧天’的‘杞’读成‘jǐ’或写成‘己人忧天’
    - 能指出并纠正这一错误：只认为是贬义词，忽略它也包含忧患意识的积极含义
  aliases: []
  category: 寓言故事
  explanation: 讽刺不必要的担忧，也体现忧患意识，出自《列子》。
  misconceptions:
    - 把‘杞人忧天’的‘杞’读成‘jǐ’或写成‘己人忧天’
    - 只认为是贬义词，忽略它也包含忧患意识的积极含义
    - 误把故事讽刺对象说成是‘不关心实际事务的人’
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:条件复句
  type: Concept
  subject: 语文
  title: 条件复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将条件复句与假设复句混淆，如把“如果下雨就带伞”当条件复句
    - 能指出并纠正这一错误：误用关联词，把“只有……才……”写进条件复句，但忽视了必要条件关系
  aliases: []
  category: 语法
  explanation: 条件复句是表示满足某种条件的话会出现怎样的结果的复句，常用关联词语有“不论”“只要”等。
  misconceptions:
    - 将条件复句与假设复句混淆，如把“如果下雨就带伞”当条件复句
    - 误用关联词，把“只有……才……”写进条件复句，但忽视了必要条件关系
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:杨二嫂
  type: Concept
  subject: 语文
  title: 杨二嫂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为杨二嫂是勤劳善良的正面人物，没看出她的尖酸刻薄
    - 能指出并纠正这一错误：漏掉杨二嫂偷拿手套等细节，将其简单概括为“大大咧咧”
  aliases:
    - 豆腐西施
  category: 人物形象
  explanation: 杨二嫂是小说中的次要人物，尖酸刻薄，自私贪婪，反映了小市民的劣根性。
  misconceptions:
    - 认为杨二嫂是勤劳善良的正面人物，没看出她的尖酸刻薄
    - 漏掉杨二嫂偷拿手套等细节，将其简单概括为“大大咧咧”
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:杨二嫂形象
  type: Concept
  subject: 语文
  title: 杨二嫂形象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“豆腐西施”理解成夸赞杨二嫂美貌，忽略其讽刺意味
    - 能指出并纠正这一错误：误以为杨二嫂年轻时和中年后性格一致，未抓住前后对比变化
  aliases:
    - 豆腐西施
  category: 人物形象
  explanation: 杨二嫂是小说中的次要人物，年轻时被称为“豆腐西施”，中年后变得尖酸刻薄、自私贪小。
  misconceptions:
    - 把“豆腐西施”理解成夸赞杨二嫂美貌，忽略其讽刺意味
    - 误以为杨二嫂年轻时和中年后性格一致，未抓住前后对比变化
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:杨利伟
  type: Concept
  subject: 语文
  title: 杨利伟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把杨利伟说成神舟六号航天员，实际神舟五号。
    - 能指出并纠正这一错误：误以为杨利伟完成了出舱行走，实为翟志刚首次出舱。
  aliases: []
  category: 人物
  explanation: 中国第一位进入太空的航天员，本文选自其自传《天地九重》。
  misconceptions:
    - 误把杨利伟说成神舟六号航天员，实际神舟五号。
    - 误以为杨利伟完成了出舱行走，实为翟志刚首次出舱。
    - 将《天地九重》作者说成费俊龙，张冠李戴。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:杨志
  type: Concept
  subject: 语文
  title: 杨志
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把杨志绰号记成“豹子头”，实为林冲绰号。
    - 能指出并纠正这一错误：误以为杨志性格谨慎隐忍，忽略其急躁暴烈的一面。
  aliases:
    - 青面兽
  category: 人物形象
  explanation: 《水浒传》中的人物，绰号青面兽，武艺高强，但性格急躁，在押送生辰纲时中计。
  misconceptions:
    - 把杨志绰号记成“豹子头”，实为林冲绰号。
    - 误以为杨志性格谨慎隐忍，忽略其急躁暴烈的一面。
    - 把杨志塑造成智勇双全的正面英雄，忘记他押送时鞭打士卒。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:杨振宁
  type: Concept
  subject: 语文
  title: 杨振宁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把本文作者记为邓稼先。
    - 能指出并纠正这一错误：误以为杨振宁也是'两弹元勋'。
  aliases: []
  category: 人物
  explanation: 著名物理学家，与邓稼先有50年友谊，本文作者。
  misconceptions:
    - 误把本文作者记为邓稼先。
    - 误以为杨振宁也是'两弹元勋'。
    - 将'振'误写为'震'，写成'杨震宁'。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:松骨峰战斗
  type: Concept
  subject: 语文
  title: 松骨峰战斗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记松骨峰战斗持续8天，实际是打退敌人多次冲锋的8小时。
    - 能指出并纠正这一错误：认为松骨峰战斗中志愿军最终顺利撤离，忽略了几乎全部牺牲的壮烈。
  aliases:
    - 书堂站战斗
  category: 历史事件
  explanation: 抗美援朝战争中的一次壮烈战斗，志愿军一个连的战士与敌人激战8小时，打退敌人多次冲锋，最终几乎全部牺牲，但为主力部队聚歼敌人赢得了时间。
  misconceptions:
    - 误记松骨峰战斗持续8天，实际是打退敌人多次冲锋的8小时。
    - 认为松骨峰战斗中志愿军最终顺利撤离，忽略了几乎全部牺牲的壮烈。
    - 把松骨峰战斗与上甘岭战役混淆，记错战斗名称或发生地点。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:板块构造学说
  type: Concept
  subject: 语文
  title: 板块构造学说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为板块就是大陆，忽略板块包含地壳和地幔顶部岩石圈。
    - 能指出并纠正这一错误：认为板块运动只导致水平移动，忽略俯冲和抬升等垂直运动。
  aliases:
    - 板块构造理论
  category: 地质学
  explanation: 地球岩石圈由板块组成，板块运动导致海沟、山脉等地质现象。
  misconceptions:
    - 误认为板块就是大陆，忽略板块包含地壳和地幔顶部岩石圈。
    - 认为板块运动只导致水平移动，忽略俯冲和抬升等垂直运动。
    - 误以为地震和火山只发生在板块张裂处，实际也发生在碰撞带。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:林庚《〈西游记〉漫话》
  type: Concept
  subject: 语文
  title: 林庚《〈西游记〉漫话》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为林庚是《西游记》中的人物，与孙悟空的作者混淆。
    - 能指出并纠正这一错误：把《〈西游记〉漫话》当作西游记原著，而非评论性著作。
  aliases: []
  category: 文学评论
  explanation: 林庚在《〈西游记〉漫话》中认为小说创造了游戏的童话气氛，表现儿童的心理与行为。
  misconceptions:
    - 误以为林庚是《西游记》中的人物，与孙悟空的作者混淆。
    - 把《〈西游记〉漫话》当作西游记原著，而非评论性著作。
    - 误认为“游戏的童话气氛”指《西游记》是儿童读物，忽略深层意义。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:枯燥
  type: Concept
  subject: 语文
  title: 枯燥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“枯燥”写成“枯躁”，受“急躁”影响。
    - 能指出并纠正这一错误：用“枯燥”形容天气或地面缺水，如“天气枯燥”，应改为“干燥”。
  aliases: []
  category: 词语
  explanation: 单调，没有趣味。
  misconceptions:
    - 把“枯燥”写成“枯躁”，受“急躁”影响。
    - 用“枯燥”形容天气或地面缺水，如“天气枯燥”，应改为“干燥”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:标本
  type: Concept
  subject: 语文
  title: 标本
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“标本”写成“标芩”或“标苯”，字形混淆。
    - 能指出并纠正这一错误：认为“标本”在文中指生物标本，误解为实物样本。
  aliases: []
  category: 词语理解
  explanation: 文中指苏州园林是中国各地园林的典范和代表。
  misconceptions:
    - 把“标本”写成“标芩”或“标苯”，字形混淆。
    - 认为“标本”在文中指生物标本，误解为实物样本。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:标点符号的表达作用
  type: Concept
  subject: 语文
  title: 标点符号的表达作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为标点只表示停顿和语气，无情感作用，如分析“多美的花啊。”时忽略叹号传递的赞美之情。
    - 能指出并纠正这一错误：给标点情感贴标签，见叹号就答“强烈激动”，见省略号就答“话没说完”，不结合具体语境。
  aliases:
    - 叹号的表达效果
  category: 语法知识
  explanation: 标点符号除表示停顿和语气外，还能与文字配合表达思想、传递情感，如叹号可增强情感表达。
  misconceptions:
    - 认为标点只表示停顿和语气，无情感作用，如分析“多美的花啊。”时忽略叹号传递的赞美之情。
    - 给标点情感贴标签，见叹号就答“强烈激动”，见省略号就答“话没说完”，不结合具体语境。
    - 混淆问号的疑问与反问功能，如“你怎么能这样？”误以为只是一般疑问，不知反问实际表达批评。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:标语创作
  type: Concept
  subject: 语文
  title: 标语创作
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：标语“我们要讲文明”缺乏号召性，不如“文明你我他”生动。
    - 能指出并纠正这一错误：为“和”主题写“和谐相处”四字，过于宽泛，未体现标语创意。
  aliases: []
  category: 语文实践
  explanation: 创作宣传标语需有针对性、思想性，语言要新颖、朗朗上口，如以“和”为主题的标语。
  misconceptions:
    - 标语“我们要讲文明”缺乏号召性，不如“文明你我他”生动。
    - 为“和”主题写“和谐相处”四字，过于宽泛，未体现标语创意。
    - 滥用谐音把“其乐无穷”写成“骑乐无穷”，造成不良导向。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:标题
  type: Concept
  subject: 语文
  title: 标题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把标题当作导语，以为标题必须把时间、地点、人物、事件全部写全。
    - 能指出并纠正这一错误：认为标题越长越好，越能概括新闻内容，忽略了简明醒目的要求。
  aliases: []
  category: 文体知识
  explanation: 标题是新闻的题目，要求简明、醒目、概括性强。
  misconceptions:
    - 把标题当作导语，以为标题必须把时间、地点、人物、事件全部写全。
    - 认为标题越长越好，越能概括新闻内容，忽略了简明醒目的要求。
    - 拟写标题时只写事件结果，缺少主要人物或地点，如把“我军横渡长江”写成“横渡成功”。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:栖迟
  type: Concept
  subject: 语文
  title: 栖迟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“栖迟”解释为“栖息得很晚”，把“迟”当“晚”讲。
    - 能指出并纠正这一错误：误将“栖迟”写作“凄迟”，误以为有凄凉之意。
  aliases: []
  category: 文言词语
  explanation: 停留，居留。
  misconceptions:
    - 将“栖迟”解释为“栖息得很晚”，把“迟”当“晚”讲。
    - 误将“栖迟”写作“凄迟”，误以为有凄凉之意。
    - 将“栖迟”与“栖身”等同，翻译成“暂时居住”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:核磁共振
  type: Concept
  subject: 语文
  title: 核磁共振
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“核磁共振”误写成“核磁共震”，“振”“震”不分。
    - 能指出并纠正这一错误：把“共振”的“共”读成gōng，正确应为gòng。
  aliases:
    - NMR
  category: 物理学
  explanation: 原子核在外加磁场作用下对特定频率电磁波产生共振吸收的现象，可用于探测物质结构。
  misconceptions:
    - 将“核磁共振”误写成“核磁共震”，“振”“震”不分。
    - 把“共振”的“共”读成gōng，正确应为gòng。
    - 认为核磁共振是“核爆炸产生的震动”，误将物理现象与核武器关联。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:根据提问读句子
  type: Concept
  subject: 语文
  title: 根据提问读句子
  conceptType: 程序型
  aliases:
    - 读出重音
  category: 方法
  explanation: 别人问什么，读句子时就把回答的词语读得重一些。比如问"什么睡在泥土里"，就要把"种子"读得响亮。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:根据资料写介绍
  type: Concept
  subject: 语文
  title: 根据资料写介绍
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 把整理好的资料用自己的话写下来，也可以引用别人的话，但要写明资料来源，还可以配上图片、表格。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:根据需要写动物的特点
  type: Concept
  subject: 语文
  title: 根据需要写动物的特点
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 介绍动物朋友时，要根据情境和对象决定写什么：请人代养就写它的习性，请人帮忙寻找就写它的外形特点。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:格物致知
  type: Concept
  subject: 语文
  title: 格物致知
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“格物致知”的“格”误释为“标准”，导致整个词义理解出错。
    - 能指出并纠正这一错误：认为“格物致知”只指研究物理，不涉及个人修养和道德实践。
  aliases:
    - 格物
    - 致知
  category: 概念
  explanation: 从探察物体而得到知识，现代学术基础是实地探察即实验。
  misconceptions:
    - 把“格物致知”的“格”误释为“标准”，导致整个词义理解出错。
    - 认为“格物致知”只指研究物理，不涉及个人修养和道德实践。
    - 写“实验精神”时，将“格物”等同于“格竹”，忽视朱熹与王阳明的区别。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:梁启超与《敬业与乐业》
  type: Concept
  subject: 语文
  title: 梁启超与《敬业与乐业》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《敬业与乐业》的作者误记为康有为或章太炎。
    - 能指出并纠正这一错误：将演讲时间1922年错写为1921年，或地点误为北京大学。
  aliases: []
  category: 文学常识
  explanation: 梁启超是近代思想家、学者，1922年在上海中华职业学校发表演讲《敬业与乐业》，阐述敬业与乐业的重要性。
  misconceptions:
    - 把《敬业与乐业》的作者误记为康有为或章太炎。
    - 将演讲时间1922年错写为1921年，或地点误为北京大学。
    - 写论证方法时，把梁启超的“职业神圣”观点当成是儒家原话，引用错误。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:梅岭三章
  type: Concept
  subject: 语文
  title: 梅岭三章
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《梅岭三章》作者是毛泽东，实为陈毅。
    - 能指出并纠正这一错误：将“梅岭三章”误写为“梅岭三首”，混淆“章”与“首”。
  aliases: []
  category: 课文
  explanation: 陈毅在梅山被围时写下的三首绝命诗，表现革命者视死如归的壮志和必胜信念。
  misconceptions:
    - 误以为《梅岭三章》作者是毛泽东，实为陈毅。
    - 将“梅岭三章”误写为“梅岭三首”，混淆“章”与“首”。
    - 误以为“三章”是文章三部分，实为三首绝命诗。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:楚客
  type: Concept
  subject: 语文
  title: 楚客
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“楚客”指所有楚地的人，翻译成“楚地的客人”。
    - 能指出并纠正这一错误：在《长沙过贾谊宅》中，把“楚客”误指屈原，实指贾谊。
  aliases: []
  category: 词语理解
  explanation: 这里指客居楚地的贾谊。
  misconceptions:
    - 认为“楚客”指所有楚地的人，翻译成“楚地的客人”。
    - 在《长沙过贾谊宅》中，把“楚客”误指屈原，实指贾谊。
    - 将“楚客”与“谪宦”混淆，认为都是泛指被贬的人。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:概括人物：人+事+品格
  type: Concept
  subject: 语文
  title: 概括人物：人+事+品格
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：概括时只写“他是一个热心的人”，没有任何事件支撑，缺了“事”这—要素。
    - 能指出并纠正这一错误：概括为“他帮奶奶过马路”，只罗列事件不提炼品格，格式不完整。
  aliases:
    - 人物概括法
  category: 阅读方法
  explanation: 用“人+事+品格”的格式概括人物，即先指出人物身份，再叙述其典型事件，最后提炼其品格特点。
  misconceptions:
    - 概括时只写“他是一个热心的人”，没有任何事件支撑，缺了“事”这—要素。
    - 概括为“他帮奶奶过马路”，只罗列事件不提炼品格，格式不完整。
    - 把身份写错，将文中次要人物的事迹安到主要人物身上，导致“人”与“事”不匹配。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:概括式叙述
  type: Concept
  subject: 语文
  title: 概括式叙述
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘概括式叙述’理解为概括文章中心思想，而不是一种叙述法
    - 能指出并纠正这一错误：认为概括式叙述就是完全省略细节，不能有任何描写
  aliases: []
  category: 写作手法
  explanation: 用简洁的语言概括叙述事件，本文以概括式叙述为主，穿插具体描写。
  misconceptions:
    - 把‘概括式叙述’理解为概括文章中心思想，而不是一种叙述法
    - 认为概括式叙述就是完全省略细节，不能有任何描写
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:横格书写规范
  type: Concept
  subject: 语文
  title: 横格书写规范
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 在横格上写字时，字的中心要对准横格中线，保持水平；字距要差不多，标点符号和字之间留出一定距离。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:次北固山下
  type: Concept
  subject: 语文
  title: 次北固山下
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“次”解作“第二次”，实为“停宿”之意。
    - 能指出并纠正这一错误：误以为此诗是五言绝句，忽略两联对仗，实为五言律诗。
  aliases: []
  category: 诗歌内容
  explanation: 王湾的《次北固山下》是一首五言律诗，通过描绘旅途中的景色，表达了思乡之情。
  misconceptions:
    - 把“次”解作“第二次”，实为“停宿”之意。
    - 误以为此诗是五言绝句，忽略两联对仗，实为五言律诗。
    - 误将作者记作王维，与王湾混淆。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:欧阳修
  type: Concept
  subject: 语文
  title: 欧阳修
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记欧阳修为南宋人，忽略其北宋文学家身份。
    - 能指出并纠正这一错误：把“采桑子”词牌误认为诗题，如写成“采桑曲”。
  aliases: []
  category: 文学常识
  explanation: 北宋文学家，词风深挚，长于小令。
  misconceptions:
    - 误记欧阳修为南宋人，忽略其北宋文学家身份。
    - 把“采桑子”词牌误认为诗题，如写成“采桑曲”。
    - 将“轻舟短棹西湖好”理解为杭州西湖，实为颍州。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:欧阳询楷书
  type: Concept
  subject: 语文
  title: 欧阳询楷书
  conceptType: 概念型
  aliases:
    - 欧体
  category: 文化常识
  explanation: 欧阳询是初唐著名书法家，他的楷书用笔方整、笔力刚劲，字形竖长、结构严谨，代表作有《九成宫醴泉铭》。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:欲扬先抑
  type: Concept
  subject: 语文
  title: 欲扬先抑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“欲扬先抑”说成“先扬后抑”，称文章先赞美白杨再写高原单调。
    - 能指出并纠正这一错误：认为作者意在贬低黄土高原，实则用“单调”反衬白杨的不平凡。
  aliases:
    - 先抑后扬
  category: 写作手法
  explanation: 先贬抑再颂扬，形成对比，突出所写对象。本文先写高原单调，再写白杨树的不平凡。
  misconceptions:
    - 将“欲扬先抑”说成“先扬后抑”，称文章先赞美白杨再写高原单调。
    - 认为作者意在贬低黄土高原，实则用“单调”反衬白杨的不平凡。
    - 把欲扬先抑与对比混淆，说“用高原的单调对比白杨的不凡”就是欲扬先抑。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:歇后语
  type: Concept
  subject: 语文
  title: 歇后语
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 歇后语前半句打比方，破折号后面说出意思，如“芝麻开花——节节高”。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:歌行体
  type: Concept
  subject: 语文
  title: 歌行体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为歌行体必须严格符合平仄对仗，忽视其格律自由。
    - 能指出并纠正这一错误：把《白雪歌送武判官归京》归为律诗或绝句，实际是歌行体。
  aliases: []
  category: 文学体裁
  explanation: 歌行体是古代诗歌的一种体裁，音节、格律较自由，形式灵活，如《白雪歌送武判官归京》。
  misconceptions:
    - 认为歌行体必须严格符合平仄对仗，忽视其格律自由。
    - 把《白雪歌送武判官归京》归为律诗或绝句，实际是歌行体。
    - 以为歌行体只能写边塞题材，其实题材不限。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:正对
  type: Concept
  subject: 语文
  title: 正对
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为正对是上下句意思完全相同，不须互为补充。
    - 能指出并纠正这一错误：将正对与流水对混淆，忽视“语义相近”这一判定标准。
  aliases: []
  category: 修辞手法
  explanation: 对偶的一种，上下句语义相近，互为补充。
  misconceptions:
    - 误认为正对是上下句意思完全相同，不须互为补充。
    - 将正对与流水对混淆，忽视“语义相近”这一判定标准。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:正面描写
  type: Concept
  subject: 语文
  title: 正面描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把通过观众反应表现吕伟的技巧当作正面描写，实际是侧面描写。
    - 能指出并纠正这一错误：认为环境描写烘托人物就是正面描写，混淆直接描写与间接烘托。
  aliases:
    - 直接描写
  category: 写作手法
  explanation: 正面描写是直接描写人物的外貌、动作、心理等，如直接描写吕伟的跳水动作。
  misconceptions:
    - 把通过观众反应表现吕伟的技巧当作正面描写，实际是侧面描写。
    - 认为环境描写烘托人物就是正面描写，混淆直接描写与间接烘托。
    - 写‘她微微一笑’当成侧面描写，实际直接描写人物神态是正面描写。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:殚精竭虑
  type: Concept
  subject: 语文
  title: 殚精竭虑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“殚精竭虑”的“殚”写成“惮”或“弹”，误以为与“担心”有关
    - 能指出并纠正这一错误：将“殚精竭虑”与“费尽心机”等同，忽略一褒一贬
  aliases: []
  category: 成语
  explanation: 用尽精力，费尽心思。文中形容科研人员为攻克技术难关而竭尽全力。
  misconceptions:
    - 把“殚精竭虑”的“殚”写成“惮”或“弹”，误以为与“担心”有关
    - 将“殚精竭虑”与“费尽心机”等同，忽略一褒一贬
    - 误把“殚精竭虑”解释为“精力耗尽而忧虑”，忽略了“竭虑”是费尽心思
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:段落开头空两格
  type: Concept
  subject: 语文
  title: 段落开头空两格
  conceptType: 程序型
  aliases: []
  category: 法则
  explanation: 写一段话时，第一行开头要先空出两格，这是写文章的基本格式。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:殷汝耕
  type: Concept
  subject: 语文
  title: 殷汝耕
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“殷汝耕”写成“殷如耕”或“殷汝更”，字形混淆。
    - 能指出并纠正这一错误：误认为殷汝耕是抗日的英雄，与史实相反。
  aliases: []
  category: 历史人物
  explanation: 抗日战争时期的汉奸，曾任伪冀东防共自治政府主席。文中提到他。
  misconceptions:
    - 把“殷汝耕”写成“殷如耕”或“殷汝更”，字形混淆。
    - 误认为殷汝耕是抗日的英雄，与史实相反。
    - 将殷汝耕与石敬瑭混为一谈，说他是后晋皇帝。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:毅魄
  type: Concept
  subject: 语文
  title: 毅魄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“毅魄”写成“意魄”或“义魄”，字形混淆。
    - 能指出并纠正这一错误：认为毅魄指一般人的魂魄，忽视其刚毅英魂之意。
  aliases: []
  category: 典故
  explanation: 英魂，语出屈原《九歌·国殇》，指刚毅的魂魄。
  misconceptions:
    - 把“毅魄”写成“意魄”或“义魄”，字形混淆。
    - 认为毅魄指一般人的魂魄，忽视其刚毅英魂之意。
    - 将“毅魄”理解为“坚毅的体魄”，混淆“魄”与“体魄”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:比兴手法
  type: Concept
  subject: 语文
  title: 比兴手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘关关雎鸠，在河之洲’认为是比喻，实际是起兴（兴）
    - 能指出并纠正这一错误：区分不了比与兴，认为比就是借物抒情，兴才是比喻
  aliases: []
  category: 表现手法
  explanation: 比即比喻，兴即先言他物以引起所咏之词，是《诗经》常用的手法。
  misconceptions:
    - 把‘关关雎鸠，在河之洲’认为是比喻，实际是起兴（兴）
    - 区分不了比与兴，认为比就是借物抒情，兴才是比喻
    - 写题时把‘比兴’当成一种修辞方法，忽略其在诗歌结构上的作用
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:比喻
  type: Concept
  subject: 语文
  title: 比喻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘他像哥哥一样高’当作比喻，误以为有‘像’就是比喻，实际是同类比较。
    - 能指出并纠正这一错误：将‘她像一只飞燕’误认为拟人，比喻和拟人修辞手法辨识不清。
  aliases:
    - 打比方
  category: 修辞手法
  explanation: 比喻是用相似的事物来描写另一事物的修辞手法，如将吕伟的身体比作‘飞天’、‘箭’。
  misconceptions:
    - 把‘他像哥哥一样高’当作比喻，误以为有‘像’就是比喻，实际是同类比较。
    - 将‘她像一只飞燕’误认为拟人，比喻和拟人修辞手法辨识不清。
    - 认为比喻的本体和喻体必须同属一类，忽略不同类事物相似性才是比喻。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:比喻义
  type: Concept
  subject: 语文
  title: 比喻义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到“思想包袱”就当作比喻句，忽略了“包袱”的比喻义是固定词义，不是临时修辞。
    - 能指出并纠正这一错误：将“他像只小老虎”中的“老虎”直接说有比喻义“凶猛的人”，但此处是临时比喻。
  aliases: []
  category: 词汇知识
  explanation: 比喻义是通过比喻产生的词义，如“包袱”的“负担”义。
  misconceptions:
    - 看到“思想包袱”就当作比喻句，忽略了“包袱”的比喻义是固定词义，不是临时修辞。
    - 将“他像只小老虎”中的“老虎”直接说有比喻义“凶猛的人”，但此处是临时比喻。
    - 混淆比喻义和引申义，把“深秋”的“深”说成比喻义，实际是引申义。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:比喻论证
  type: Concept
  subject: 语文
  title: 比喻论证
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：答题时写成'运用了比喻的修辞手法'，而非'比喻论证'，混淆论证方法与修辞手法。
    - 能指出并纠正这一错误：误把比喻论证等同于举例论证，认为只要用了比喻讲故事都是在举例。
  aliases:
    - 喻证法
  category: 论证方法
  explanation: 用人们熟知的事物作比喻来证明论点的方法。
  misconceptions:
    - 答题时写成'运用了比喻的修辞手法'，而非'比喻论证'，混淆论证方法与修辞手法。
    - 误把比喻论证等同于举例论证，认为只要用了比喻讲故事都是在举例。
    - 将比喻论证与类比论证混为一谈，如'人生如航船'误判为类比论证。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:比拟
  type: Concept
  subject: 语文
  title: 比拟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“比拟”专指拟人，忽略了也包括拟物。
    - 能指出并纠正这一错误：把“他像箭一般冲出去”称作比拟，比拟不需要“像”这类喻词。
  aliases:
    - 拟人
    - 拟物
  category: 修辞手法
  explanation: 比拟是把物当作人来写（拟人），或把人当作物来写、把甲物当乙物来写（拟物）的修辞手法。
  misconceptions:
    - 认为“比拟”专指拟人，忽略了也包括拟物。
    - 把“他像箭一般冲出去”称作比拟，比拟不需要“像”这类喻词。
    - 将“排比”误认为“比拟”，只因都有“比”字而混淆修辞格。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:比较阅读
  type: Concept
  subject: 语文
  title: 比较阅读
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：比较阅读只管内容异同，忽略写法，如比较两篇写景散文只谈景物差异，不比较比喻、拟人等修辞手法。
    - 能指出并纠正这一错误：拿毫无共同点的文章硬比，如将说明文与抒情诗比较说明方法，找不出真正可比之处。
  aliases:
    - 对比阅读
  category: 阅读方法
  explanation: 将两篇或多篇有相似之处的文章放在一起比较，以显示各自特点的阅读方法。
  misconceptions:
    - 比较阅读只管内容异同，忽略写法，如比较两篇写景散文只谈景物差异，不比较比喻、拟人等修辞手法。
    - 拿毫无共同点的文章硬比，如将说明文与抒情诗比较说明方法，找不出真正可比之处。
    - 只罗列异同不深入分析，如写“甲用倒叙，乙不用”，却不说倒叙增强了怎样的表达效果。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:毕业赠言
  type: Concept
  subject: 语文
  title: 毕业赠言
  conceptType: 应用型
  aliases:
    - 临别赠言
  category: 方法
  explanation: 毕业时写给老师或同学的临别话语，可以回忆共同度过的美好时光，表达惜别之情和美好的祝愿，语言要真挚感人。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:毕昇
  type: Concept
  subject: 语文
  title: 毕昇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“毕昇”的“昇”误写成“升”或“生”
    - 能指出并纠正这一错误：误以为毕昇是唐朝雕版印刷的工匠，而非北宋平民
  aliases: []
  category: 文学常识
  explanation: 北宋平民，发明了活字印刷术，是活字印刷术的创始人。
  misconceptions:
    - 把“毕昇”的“昇”误写成“升”或“生”
    - 误以为毕昇是唐朝雕版印刷的工匠，而非北宋平民
    - 将毕昇与蔡伦混淆，认为他发明了造纸术
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:毫不利己专门利人的精神
  type: Concept
  subject: 语文
  title: 毫不利己专门利人的精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为毫不利己专门利人就是完全不考虑个人利益，甚至要求人不食人间烟火
    - 能指出并纠正这一错误：把这种精神简单理解为不占便宜，忽视了对工作极端负责和对人民极端热忱
  aliases:
    - 毫不利己专门利人
  category: 精神品质
  explanation: 指对工作的极端的负责任，对同志对人民的极端的热忱，是白求恩同志精神的核心表现。
  misconceptions:
    - 认为毫不利己专门利人就是完全不考虑个人利益，甚至要求人不食人间烟火
    - 把这种精神简单理解为不占便宜，忽视了对工作极端负责和对人民极端热忱
    - 误以为只有白求恩本人能做到，普通人无法学习这种精神，认识过于绝对
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:民间故事
  type: Concept
  subject: 语文
  title: 民间故事
  conceptType: 概念型
  aliases:
    - 民间传说
  category: 文化常识
  explanation: 民间故事是人们口口相传留下来的故事。鲁班被带齿的小草划破手，仔细观察后发明了锯，就是有名的民间故事。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:民间歌谣
  type: Concept
  subject: 语文
  title: 民间歌谣
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 民间歌谣是老百姓口口相传的韵文，读起来顺口好记。十二月花名歌就按月份唱出各个月开的花。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:气死风
  type: Concept
  subject: 语文
  title: 气死风
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“气死风”写成“气死疯”，不理解灯罩密实则风无法吹灭。
    - 能指出并纠正这一错误：误以为“气死风”是指一种风的名字，实际是灯笼。
  aliases: []
  category: 文化常识
  explanation: 一种灯笼，因其灯罩密实，火不易被风吹灭，故名。
  misconceptions:
    - 误将“气死风”写成“气死疯”，不理解灯罩密实则风无法吹灭。
    - 误以为“气死风”是指一种风的名字，实际是灯笼。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:气象万千
  type: Concept
  subject: 语文
  title: 气象万千
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“气象”错解为“天气”，形容天气多变。
    - 能指出并纠正这一错误：写成“气像万千”，用“像”代替“象”。
  aliases: []
  category: 成语
  explanation: 出自《岳阳楼记》，形容景象或事物壮丽而多变化。
  misconceptions:
    - 把“气象”错解为“天气”，形容天气多变。
    - 写成“气像万千”，用“像”代替“象”。
    - 造句“他的表情气象万千”误用于人的神情。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:水墨画
  type: Concept
  subject: 语文
  title: 水墨画
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把文中“小水墨画”理解成真实的画作，忽略了比喻手法。
    - 能指出并纠正这一错误：误以为水墨画是彩色水粉画，混淆“水墨”与“水彩”的概念。
  aliases: []
  category: 文化常识
  explanation: 纯用水墨不着彩色的国画，文中用来比喻济南冬天的景色。
  misconceptions:
    - 把文中“小水墨画”理解成真实的画作，忽略了比喻手法。
    - 误以为水墨画是彩色水粉画，混淆“水墨”与“水彩”的概念。
    - 错判“这是张小水墨画”为拟人，实际应是比喻。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:水落石出
  type: Concept
  subject: 语文
  title: 水落石出
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为成语出自《岳阳楼记》而不是《醉翁亭记》。
    - 能指出并纠正这一错误：在描写湖面时用“水落石出”表达水位下降，不知比喻义。
  aliases: []
  category: 成语
  explanation: 出自《醉翁亭记》，原指水落下去石头露出来，后比喻真相大白。
  misconceptions:
    - 误认为成语出自《岳阳楼记》而不是《醉翁亭记》。
    - 在描写湖面时用“水落石出”表达水位下降，不知比喻义。
    - 与“水到渠成”混用，写“真相水到渠成”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:水调歌头
  type: Concept
  subject: 语文
  title: 水调歌头
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“水调歌头”当作诗题，说苏轼作了一首“水调歌头”诗。
    - 能指出并纠正这一错误：答“水调歌头”是苏轼的词牌名，却不写题目，实际上题目是“明月几时有”？
  aliases: []
  category: 词牌名
  explanation: 词牌名，苏轼以此调写了中秋词。
  misconceptions:
    - 把“水调歌头”当作诗题，说苏轼作了一首“水调歌头”诗。
    - 答“水调歌头”是苏轼的词牌名，却不写题目，实际上题目是“明月几时有”？
    - 与“念奴娇”混淆，说“大江东去”是水调歌头。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:永垂不朽
  type: Concept
  subject: 语文
  title: 永垂不朽
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘永垂不朽’写成‘永垂不巧’，‘朽’误作‘巧’。
    - 能指出并纠正这一错误：用‘永垂不朽’形容普通人的事迹，如‘他的玩具设计永垂不朽’。
  aliases: []
  category: 成语
  explanation: 指光辉的事迹和伟大的精神永远流传，不会磨灭。
  misconceptions:
    - 把‘永垂不朽’写成‘永垂不巧’，‘朽’误作‘巧’。
    - 用‘永垂不朽’形容普通人的事迹，如‘他的玩具设计永垂不朽’。
    - 混淆‘永垂不朽’与‘流芳百世’，认为二者完全等同，忽略了前者侧重精神事迹的永不磨灭。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:汇总小组意见
  type: Concept
  subject: 语文
  title: 汇总小组意见
  conceptType: 程序型
  aliases:
    - 小组意见汇总
  category: 方法
  explanation: 小组讨论时先记录每个同学的想法，再把相近的意见整合在一起，标记出大多数同学认同的想法，最后有条理地向全班汇报。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:汉字基本笔画
  type: Concept
  subject: 语文
  title: 汉字基本笔画
  conceptType: 概念型
  aliases:
    - 笔画名称
  category: 概念
  explanation: 汉字是一笔一笔写成的，每一笔都有自己的名字，比如横、竖、撇、捺、点。认识笔画名称，才能听懂写字的要求。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C12/sections/S1.md
- id: concept:语文:汉字字体的演变
  type: Concept
  subject: 语文
  title: 汉字字体的演变
  conceptType: 概念型
  aliases:
    - 汉字的演变
  category: 文化常识
  explanation: 汉字有三四千年历史，主要经历了甲骨文、金文、小篆、隶书、楷书五种典型字体，字形从象形逐渐变得规整、便于书写和认读。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:汉室倾颓
  type: Concept
  subject: 语文
  title: 汉室倾颓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“倾颓”写成“顷颓”或“倾颓”，字形错误。
    - 能指出并纠正这一错误：误以为“倾颓”指兴起，理解为“汉室兴盛”。
  aliases: []
  category: 文言词语
  explanation: 指汉朝统治衰败，倾颓意为衰败、崩溃。
  misconceptions:
    - 将“倾颓”写成“顷颓”或“倾颓”，字形错误。
    - 误以为“倾颓”指兴起，理解为“汉室兴盛”。
    - 把“汉室倾颓”解释为“汉朝宫殿倒塌”，忽略衰败的引申义。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:汉文
  type: Concept
  subject: 语文
  title: 汉文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“汉文”理解为“汉朝的文章”，在翻译“汉文有道恩犹薄”时译错。
    - 能指出并纠正这一错误：误将“汉文”指汉武帝，而不是汉文帝。
  aliases: []
  category: 人物称谓
  explanation: 指汉文帝刘恒。
  misconceptions:
    - 将“汉文”理解为“汉朝的文章”，在翻译“汉文有道恩犹薄”时译错。
    - 误将“汉文”指汉武帝，而不是汉文帝。
    - 把“汉文”写成“汉纹”，字形混淆。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:汉文帝
  type: Concept
  subject: 语文
  title: 汉文帝
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为劳军的皇帝是汉武帝刘彻，实际是汉文帝刘恒。
    - 能指出并纠正这一错误：认为汉文帝对周亚夫不满，实际是赞赏并称‘真将军’。
  aliases:
    - 文帝
  category: 人物
  explanation: 西汉皇帝，亲自劳军，对周亚夫治军赞赏有加。
  misconceptions:
    - 误以为劳军的皇帝是汉武帝刘彻，实际是汉文帝刘恒。
    - 认为汉文帝对周亚夫不满，实际是赞赏并称‘真将军’。
    - 将汉文帝与汉景帝混淆，认为他是东汉皇帝。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:汗青
  type: Concept
  subject: 语文
  title: 汗青
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“汗青”误写为“汉青”，代指史册的典故易混。
    - 能指出并纠正这一错误：认为汗青是竹简上的汗水，忘记引申义史册。
  aliases:
    - 史册
    - 青史
  category: 文言词语
  explanation: 古代在竹简上写字前用火炙烤竹片，水分蒸发如汗，故称“汗青”，代指史册。
  misconceptions:
    - 将“汗青”误写为“汉青”，代指史册的典故易混。
    - 认为汗青是竹简上的汗水，忘记引申义史册。
    - 把“汗青”解释为“竹简”本身，实际代指史书。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:江姐
  type: Concept
  subject: 语文
  title: 江姐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把江姐原型说成刘胡兰或赵一曼，混淆不同英雄人物
    - 能指出并纠正这一错误：将江姐的真名误写为“江竹君”，“筠”被写成同音字“君”
  aliases:
    - 江竹筠
  category: 文学形象
  explanation: 《红岩》中的人物，面对敌人毒刑拷打坚贞不屈的共产党员，其名言“共产党员的意志是钢铁”广为流传。
  misconceptions:
    - 把江姐原型说成刘胡兰或赵一曼，混淆不同英雄人物
    - 将江姐的真名误写为“江竹君”，“筠”被写成同音字“君”
    - 误以为江姐牺牲于重庆解放后，颠倒了就义时间顺序
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:汪曾祺
  type: Concept
  subject: 语文
  title: 汪曾祺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将汪曾祺的《大淖记事》写成《大泽记事》或《大淖纪事》，因字形相近而误写。
    - 能指出并纠正这一错误：把汪曾祺与沈从文混淆，误认为其代表作是《边城》，忽视他独立于“京派”的创作风格。
  aliases: []
  category: 文学常识
  explanation: 汪曾祺（1920—1997），江苏高邮人，作家。代表作有小说《受戒》《大淖记事》等。其散文风格平淡自然，饶有趣味。
  misconceptions:
    - 将汪曾祺的《大淖记事》写成《大泽记事》或《大淖纪事》，因字形相近而误写。
    - 把汪曾祺与沈从文混淆，误认为其代表作是《边城》，忽视他独立于“京派”的创作风格。
    - 误认汪曾祺是当代作家或源自山东，实际为江苏高邮人，故答题时张冠李戴。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:沆砀
  type: Concept
  subject: 语文
  title: 沆砀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“砀”读成“yáng”，误读为“荡”。
    - 能指出并纠正这一错误：默写时写成“雾凇沆荡”，把“砀”写成“荡”。
  aliases: []
  category: 文言词语
  explanation: 白汽弥漫的样子。
  misconceptions:
    - 将“砀”读成“yáng”，误读为“荡”。
    - 默写时写成“雾凇沆荡”，把“砀”写成“荡”。
    - 认为“沆砀”是“水汽浩大”的意思，忽略了“白汽弥漫”的“白”色。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:沈括
  type: Concept
  subject: 语文
  title: 沈括
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把沈括的《梦溪笔谈》记成宋应星的《天工开物》
    - 能指出并纠正这一错误：误认为沈括是南宋人，实际他是北宋科学家
  aliases: []
  category: 文学常识
  explanation: 北宋科学家、政治家，著有《梦溪笔谈》，记录了毕昇发明活字印刷术的事迹。
  misconceptions:
    - 把沈括的《梦溪笔谈》记成宋应星的《天工开物》
    - 误认为沈括是南宋人，实际他是北宋科学家
    - 误将沈括的字“存中”说成是“梦溪”
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:沉舟侧畔千帆过，病树前头万木春
  type: Concept
  subject: 语文
  title: 沉舟侧畔千帆过，病树前头万木春
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将作者写成白居易，与“沉舟”句混淆。
    - 能指出并纠正这一错误：修辞判断错误，认为主要是对偶，不知比喻象征。
  aliases: []
  category: 诗句理解
  explanation: 以沉舟、病树比喻自己，千帆、万木比喻新人，表达新事物必将取代旧事物的哲理。
  misconceptions:
    - 将作者写成白居易，与“沉舟”句混淆。
    - 修辞判断错误，认为主要是对偶，不知比喻象征。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:沥青铀矿
  type: Concept
  subject: 语文
  title: 沥青铀矿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'铀'写成'油'，误以为沥青铀矿和石油有关。
    - 能指出并纠正这一错误：误以为沥青铀矿可以直接提炼出镭，而不知是用其残渣提取。
  aliases: []
  category: 科学知识
  explanation: 沥青铀矿是一种含铀矿物，是提取镭和钋的原料。居里夫妇用其残渣提炼镭。
  misconceptions:
    - 把'铀'写成'油'，误以为沥青铀矿和石油有关。
    - 误以为沥青铀矿可以直接提炼出镭，而不知是用其残渣提取。
    - 将沥青铀矿等同于铺路的沥青，以为它是筑路材料。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:沼泽
  type: Concept
  subject: 语文
  title: 沼泽
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“沼”读成zhào，按声旁“召”猜音，正确的是zhǎo。
    - 能指出并纠正这一错误：把“泽”写成“择”或“译”，如“沼择”“沼译”。
  aliases: []
  category: 词语
  explanation: 水草茂密的泥泞地带。
  misconceptions:
    - 把“沼”读成zhào，按声旁“召”猜音，正确的是zhǎo。
    - 把“泽”写成“择”或“译”，如“沼择”“沼译”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:泉台
  type: Concept
  subject: 语文
  title: 泉台
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“泉台”理解为“泉水边的台子”，忽略指阴间。
    - 能指出并纠正这一错误：将“泉台”误写为“全台”或“泉苔”，形近致误。
  aliases: []
  category: 词语
  explanation: 指人死后埋葬的地方，也指“阴间”。
  misconceptions:
    - 误将“泉台”理解为“泉水边的台子”，忽略指阴间。
    - 将“泉台”误写为“全台”或“泉苔”，形近致误。
    - 在“此去泉台招旧部”中，误以为指地点而非阴间。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:泉路
  type: Concept
  subject: 语文
  title: 泉路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“泉路”写成“全路”，误为阳间道路。
    - 能指出并纠正这一错误：认为泉路是泉水汇聚的小路，忽略指阴间。
  aliases: []
  category: 文言词语
  explanation: 指地下，即阴间。
  misconceptions:
    - 将“泉路”写成“全路”，误为阳间道路。
    - 认为泉路是泉水汇聚的小路，忽略指阴间。
    - 把“泉路”直接等同于“黄泉”，但不知是借代。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:法天象地
  type: Concept
  subject: 语文
  title: 法天象地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“法天象地”误写成“法天像地”，弄混“象”与“像”。
    - 能指出并纠正这一错误：误以为法天象地是变成天地，而非变得巨大。
  aliases: []
  category: 文学常识
  explanation: 法天象地是《西游记》中的法术名称，指变得顶天立地般巨大。
  misconceptions:
    - 将“法天象地”误写成“法天像地”，弄混“象”与“像”。
    - 误以为法天象地是变成天地，而非变得巨大。
    - 把法天象地与“筋斗云”混为一谈，认为是飞行法术。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:泛大陆
  type: Concept
  subject: 语文
  title: 泛大陆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“泛大陆”是分布广泛的大陆，忽略了它是所有大陆汇聚成的整体。
    - 能指出并纠正这一错误：将“泛”写成“乏”或“范”，混淆形近字。
  aliases: []
  category: 地质学概念
  explanation: 板块运动将大陆汇聚在一起形成的单一陆地，约2.25亿年前最后一次完整形成，后分裂。
  misconceptions:
    - 误以为“泛大陆”是分布广泛的大陆，忽略了它是所有大陆汇聚成的整体。
    - 将“泛”写成“乏”或“范”，混淆形近字。
    - 认为泛大陆至今仍完整存在，不知道已分裂漂移。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:泛览
  type: Concept
  subject: 语文
  title: 泛览
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“泛览”当作精读，读一遍就以为掌握所有细节，实际应不求甚解地广读。
    - 能指出并纠正这一错误：将“泛览”与“走马观花”完全等同，以为可以不做任何思考，忽略了泛览也需积累。
  aliases:
    - 泛读
  category: 阅读方法
  explanation: 广泛阅读各类书籍，不局限于本专业或课内内容，以开阔眼界、增长见识。
  misconceptions:
    - 误把“泛览”当作精读，读一遍就以为掌握所有细节，实际应不求甚解地广读。
    - 将“泛览”与“走马观花”完全等同，以为可以不做任何思考，忽略了泛览也需积累。
    - 认为泛览就是随便读什么都行，不区分优劣，导致读了大量低质内容。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:注解本
  type: Concept
  subject: 语文
  title: 注解本
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为注解本就是印有注释的书，而不是自己补充注解形成的本子
    - 能指出并纠正这一错误：以为只要在书上划线、抄写原文注释就构成注解本
  aliases: []
  category: 阅读方法
  explanation: 读者在阅读时通过页边旁批、文下注释等方式为原书补充注解，形成自己独特的注解本。
  misconceptions:
    - 认为注解本就是印有注释的书，而不是自己补充注解形成的本子
    - 以为只要在书上划线、抄写原文注释就构成注解本
    - 把注解本理解为完整抄录他人注释，忽略个人理解与旁批
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:泰山
  type: Concept
  subject: 语文
  title: 泰山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将泰山归为世界文化遗产，忽略其同时是自然遗产，漏答‘双重遗产’。
    - 能指出并纠正这一错误：把‘五岳独尊’写成‘五岳之尊’或‘五岳独长’，固定说法记错。
  aliases:
    - 岱宗
  category: 世界遗产实例
  explanation: 世界文化与自然双重遗产，位于山东泰安，主峰玉皇顶海拔1532.7米，有“五岳独尊”的美誉，是中外闻名的游览胜地。
  misconceptions:
    - 误将泰山归为世界文化遗产，忽略其同时是自然遗产，漏答‘双重遗产’。
    - 把‘五岳独尊’写成‘五岳之尊’或‘五岳独长’，固定说法记错。
    - 将泰山所在地‘泰安’误写为‘济南’或‘曲阜’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:泰戈尔
  type: Concept
  subject: 语文
  title: 泰戈尔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为泰戈尔是英国诗人，实际是印度作家。
    - 能指出并纠正这一错误：误把《吉檀迦利》当作散文集，实际是诗集。
  aliases: []
  category: 作家作品
  explanation: 泰戈尔（1861—1941），印度作家、诗人，主要作品有诗集《吉檀迦利》《新月集》《园丁集》《飞鸟集》等，获1913年诺贝尔文学奖。
  misconceptions:
    - 误以为泰戈尔是英国诗人，实际是印度作家。
    - 误把《吉檀迦利》当作散文集，实际是诗集。
    - 误记泰戈尔获1913年诺贝尔文学奖为物理奖，实际是文学奖。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:洗三
  type: Concept
  subject: 语文
  title: 洗三
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“洗三”是婴儿出生后连续洗三次澡。
    - 能指出并纠正这一错误：把“洗三”与“满月”混同，说成是满月时的庆祝活动。
  aliases: []
  category: 民俗
  explanation: 旧俗在婴儿出生后第三天举行沐浴仪式，会集亲友为婴儿祝福。文中一丈青大娘为孙子何满子办洗三。
  misconceptions:
    - 认为“洗三”是婴儿出生后连续洗三次澡。
    - 把“洗三”与“满月”混同，说成是满月时的庆祝活动。
    - 拆字理解“洗三”为“洗三遍”，忽略其特定民俗含义。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:活字印刷术
  type: Concept
  subject: 语文
  title: 活字印刷术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为毕昇的活字是用木头雕刻的，实际是胶泥刻字
    - 能指出并纠正这一错误：认为活字印刷术发明于唐代，早于雕版印刷（实际晚于）
  aliases:
    - 活板
  category: 科技史实
  explanation: 北宋毕昇发明的用胶泥刻字、火烧令坚，可重复使用的印刷技术，是我国古代四大发明之一。
  misconceptions:
    - 误以为毕昇的活字是用木头雕刻的，实际是胶泥刻字
    - 认为活字印刷术发明于唐代，早于雕版印刷（实际晚于）
    - 写“印刷术”时把“刷”误写成“剧”
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:流水对
  type: Concept
  subject: 语文
  title: 流水对
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把流水对误认为上下句语义并列或相反，实际是顺承关系。
    - 能指出并纠正这一错误：见到“春种一粒粟，秋收万颗子”就判为正对，不知它是时间先后。
  aliases: []
  category: 修辞手法
  explanation: 对偶的一种，上下句内容存在时间上的先后顺序或事理上的顺承关系。
  misconceptions:
    - 把流水对误认为上下句语义并列或相反，实际是顺承关系。
    - 见到“春种一粒粟，秋收万颗子”就判为正对，不知它是时间先后。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:浣溪沙
  type: Concept
  subject: 语文
  title: 浣溪沙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“浣”字写成“焕”或“婉”，造成错别字。
    - 能指出并纠正这一错误：将《浣溪沙》视为诗题，与内容混为一谈。
  aliases: []
  category: 词牌名
  explanation: 词牌名，晏殊代表作之一，表达对时光流逝的感慨。
  misconceptions:
    - 把“浣”字写成“焕”或“婉”，造成错别字。
    - 将《浣溪沙》视为诗题，与内容混为一谈。
    - 认为“一曲新词酒一杯”是苏轼或李清照的名句。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:浪漫主义手法
  type: Concept
  subject: 语文
  title: 浪漫主义手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为浪漫主义只存在于外国文学，中国古典小说没有。
    - 能指出并纠正这一错误：把现实主义写实手法误判为浪漫主义，如认为《水浒传》的暴力描写是浪漫。
  aliases: []
  category: 写作手法
  explanation: 运用想象、夸张等手法表现理想和情感，在《聊斋志异》中体现为奇幻世界的描绘。
  misconceptions:
    - 认为浪漫主义只存在于外国文学，中国古典小说没有。
    - 把现实主义写实手法误判为浪漫主义，如认为《水浒传》的暴力描写是浪漫。
    - 混淆浪漫主义与“浪漫”，认为写爱情即浪漫主义。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:浮雕
  type: Concept
  subject: 语文
  title: 浮雕
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为浮雕是像圆雕那样完全立体的雕像，实际是平面上的凹凸起伏。
    - 能指出并纠正这一错误：把‘浮雕’误解为‘浮在水面上的雕刻’，忽略它是在平面上雕刻。
  aliases: []
  category: 艺术
  explanation: 在平面上雕刻出凹凸起伏形象的一种雕塑，本文介绍了纪念碑上的十幅大浮雕，按历史顺序表现中国近代革命史。
  misconceptions:
    - 认为浮雕是像圆雕那样完全立体的雕像，实际是平面上的凹凸起伏。
    - 把‘浮雕’误解为‘浮在水面上的雕刻’，忽略它是在平面上雕刻。
    - 写‘浮雕’时把‘浮’写成‘俘’或‘扶’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:海伦·凯勒
  type: Concept
  subject: 语文
  title: 海伦·凯勒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“海伦·凯勒”中的“勒”误写成“乐”或“了”
    - 能指出并纠正这一错误：误以为海伦是先天失聪失明，实际是幼年生病导致残疾
  aliases: []
  category: 文学常识
  explanation: 美国盲聋作家、教育家，代表作《假如给我三天光明》。
  misconceptions:
    - 将“海伦·凯勒”中的“勒”误写成“乐”或“了”
    - 误以为海伦是先天失聪失明，实际是幼年生病导致残疾
    - 把海伦·凯勒的国籍说成英国或法国，忘记她是美国人
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:消息
  type: Concept
  subject: 语文
  title: 消息
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为消息必须以第一人称“我”来写，才能体现真实感。
    - 能指出并纠正这一错误：将消息与通讯混为一谈，认为消息也可以大量描写和抒情。
  aliases:
    - 新闻消息
  category: 文体知识
  explanation: 消息是新闻的一种，以简明扼要的文字迅速报道新近发生的事实，通常包括标题、导语、主体等部分。
  misconceptions:
    - 误认为消息必须以第一人称“我”来写，才能体现真实感。
    - 将消息与通讯混为一谈，认为消息也可以大量描写和抒情。
    - 忽略消息的电头，把“新华社长江前线二十二日二时电”当成正文首句。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:清客
  type: Concept
  subject: 语文
  title: 清客
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“清客”理解为“清廉的客人”或“清高的游客”。
    - 能指出并纠正这一错误：误以为清客是指身份高贵的宾客，忽略其帮闲性质。
  aliases: []
  category: 文化常识
  explanation: 旧时在富贵人家帮闲凑趣的门客。
  misconceptions:
    - 将“清客”理解为“清廉的客人”或“清高的游客”。
    - 误以为清客是指身份高贵的宾客，忽略其帮闲性质。
    - 把“清客”与“门客”完全等同，忽略清客侧重凑趣。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:清楚地表达想法
  type: Concept
  subject: 语文
  title: 清楚地表达想法
  conceptType: 应用型
  aliases:
    - 表达想法并说明理由
  category: 方法
  explanation: 说话时把想法说清楚，还要简单说说为什么这样想。别人讲的时候认真听，对感兴趣的地方再多问一问。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:渣滓洞和白公馆
  type: Concept
  subject: 语文
  title: 渣滓洞和白公馆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“渣滓洞”误写成“渣子洞”，不会写“滓”就换成“子”
    - 能指出并纠正这一错误：误认为白公馆是罗广斌的私人住宅，实际是国民党秘密监狱
  aliases:
    - 渣滓洞
    - 白公馆
  category: 历史地点
  explanation: 重庆的秘密监狱，是《红岩》中地下党人进行反压迫、争自由斗争的特殊战场。
  misconceptions:
    - 把“渣滓洞”误写成“渣子洞”，不会写“滓”就换成“子”
    - 误认为白公馆是罗广斌的私人住宅，实际是国民党秘密监狱
    - 以为渣滓洞和白公馆在南京，弄错了关押地下党人的地点
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:温晴
  type: Concept
  subject: 语文
  title: 温晴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“温晴”写成“温情”，把天气特点误作情感词语。
    - 能指出并纠正这一错误：把“温晴”等同于“温和”，忽略了其指天气晴朗的特定含义。
  aliases: []
  category: 词语理解
  explanation: 温暖晴朗，是济南冬天的主要特点。
  misconceptions:
    - 将“温晴”写成“温情”，把天气特点误作情感词语。
    - 把“温晴”等同于“温和”，忽略了其指天气晴朗的特定含义。
    - 误写为“温清”，与“清凉”混淆，丢失了日字旁“晴”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:游记散文
  type: Concept
  subject: 语文
  title: 游记散文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为游记散文必须完全真实，不允许任何想象或夸张。
    - 能指出并纠正这一错误：把本文线索概括为“情感变化”，忽略“游览经历”为主线。
  aliases:
    - 游记
  category: 文体知识
  explanation: 游记散文是记述游览经历、描绘山水景物、抒发作者感受的散文体裁。本文以游览勃朗峰的经历为线索，描绘了山中奇景和下山奇遇。
  misconceptions:
    - 误认为游记散文必须完全真实，不允许任何想象或夸张。
    - 把本文线索概括为“情感变化”，忽略“游览经历”为主线。
    - 以为游记散文只需写景，不用抒发感受和议论。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:湖心亭看雪
  type: Concept
  subject: 语文
  title: 湖心亭看雪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：作者张冠李戴，写成欧阳修。
    - 能指出并纠正这一错误：内容理解成“春游湖心亭”，误为“看花”。
  aliases: []
  category: 文言文
  explanation: 张岱所作，记叙雪夜独往湖心亭看雪的经历，表现作者孤高自赏、痴情山水的情趣。
  misconceptions:
    - 作者张冠李戴，写成欧阳修。
    - 内容理解成“春游湖心亭”，误为“看花”。
    - 概括中心为“抒发对雪景的喜爱”，忽略“痴”和孤高自赏。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:溜索
  type: Concept
  subject: 语文
  title: 溜索
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“溜索”写成“溜锁”或“流索”，字形字音错误。
    - 能指出并纠正这一错误：认为溜索是一种游乐设施，如过山车或滑梯，忽略了渡河功能。
  aliases:
    - 过溜索
  category: 民俗文化
  explanation: 一种渡河工具，用绳索连接两岸，人畜通过滑索过江，本文描写了马帮溜索的惊险过程。
  misconceptions:
    - 把“溜索”写成“溜锁”或“流索”，字形字音错误。
    - 认为溜索是一种游乐设施，如过山车或滑梯，忽略了渡河功能。
    - 将溜索与索道完全等同，说不出区别，如认为都是缆车。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:演讲
  type: Concept
  subject: 语文
  title: 演讲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为演讲等于朗读课文，只要背熟稿子就行
    - 能指出并纠正这一错误：演讲时只顾自己说，不看听众，不进行眼神交流
  aliases: []
  category: 表达技能
  explanation: 在公众场合就某一话题发表见解的口头表达形式，注重与听众的沟通交流。
  misconceptions:
    - 误认为演讲等于朗读课文，只要背熟稿子就行
    - 演讲时只顾自己说，不看听众，不进行眼神交流
    - 误以为演讲必须辞藻华丽，忽略了观点和逻辑清晰
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:演讲的观点与思路
  type: Concept
  subject: 语文
  title: 演讲的观点与思路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：观点藏在故事里，不直接说，听众听完不知道主张什么。
    - 能指出并纠正这一错误：思路随意跳跃，先讲原因再讲结果，没有逻辑主线。
  aliases: []
  category: 演讲技巧
  explanation: 演讲要有鲜明的观点、明确的态度、清晰的思路和充实的内容，围绕观点设计思路和组织内容。
  misconceptions:
    - 观点藏在故事里，不直接说，听众听完不知道主张什么。
    - 思路随意跳跃，先讲原因再讲结果，没有逻辑主线。
    - 把罗列事例当作思路，事例间无层次或关联。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:演讲的语言技巧
  type: Concept
  subject: 语文
  title: 演讲的语言技巧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为多用排比就是有文采，结果排比冗长，内容空洞。
    - 能指出并纠正这一错误：口语化变成口水化，'嗯''啊''然后'不断，显得啰嗦。
  aliases: []
  category: 演讲技巧
  explanation: 演讲者常借助排比、反问、反复等修辞手法和口语化表达来增强感染力与说服力。
  misconceptions:
    - 误以为多用排比就是有文采，结果排比冗长，内容空洞。
    - 口语化变成口水化，'嗯''啊''然后'不断，显得啰嗦。
    - 修辞使用不当，如把反问改成设问，语气变弱，说服力下降。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:演讲的针对性
  type: Concept
  subject: 语文
  title: 演讲的针对性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：对中学生演讲用大量专业术语，不考虑听众理解能力。
    - 能指出并纠正这一错误：对老年人演讲乱用网络流行语，显得轻浮不合场合。
  aliases:
    - 演讲稿的针对性
    - 心中有听众
  category: 演讲技巧
  explanation: 演讲的针对性指演讲内容要针对特定的听众、场合和目的，包括听众的身份、文化水平、心理需求以及演讲的场合、背景等因素。
  misconceptions:
    - 对中学生演讲用大量专业术语，不考虑听众理解能力。
    - 对老年人演讲乱用网络流行语，显得轻浮不合场合。
    - 误以为针对性就是开头说'各位领导'，后面内容千篇一律。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:演讲稿的开头技巧
  type: Concept
  subject: 语文
  title: 演讲稿的开头技巧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：开头绕圈子讲无关的笑话，迟迟不进入主题，听众易走神。
    - 能指出并纠正这一错误：每次都用'今天天气很好'开头，与演讲主题毫无关联。
  aliases:
    - 开头方式
  category: 写作
  explanation: 演讲开头可从问候、感谢、缘起、现场氛围、开门见山或提问等方式吸引听众。
  misconceptions:
    - 开头绕圈子讲无关的笑话，迟迟不进入主题，听众易走神。
    - 每次都用'今天天气很好'开头，与演讲主题毫无关联。
    - 开头自我介绍过长，像做工作报告，浪费听众耐心。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:演讲稿的结语设计
  type: Concept
  subject: 语文
  title: 演讲稿的结语设计
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：结语突然说'我就讲到这里'，没有总结观点，显得仓促。
    - 能指出并纠正这一错误：以为喊口号就是好结语，空洞地'让我们奋斗吧'，缺少支撑。
  aliases:
    - 结语技巧
  category: 写作
  explanation: 结语可重申观点、提出号召、幽默调侃等，以提升演讲效果。
  misconceptions:
    - 结语突然说'我就讲到这里'，没有总结观点，显得仓促。
    - 以为喊口号就是好结语，空洞地'让我们奋斗吧'，缺少支撑。
    - 结语重复正文内容，拖沓冗长，听众觉得啰嗦。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:演讲稿的观点和思路
  type: Concept
  subject: 语文
  title: 演讲稿的观点和思路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用了'第一''第二'，但内容无关，只是表面有条理。
    - 能指出并纠正这一错误：观点表达用'大概''可能'，态度含糊，听众无法判断立场。
  aliases:
    - 演讲思路
  category: 写作
  explanation: 演讲中要明确表达观点，清晰展现思路，运用提示性词语、关联词和过渡句提高辨识度。
  misconceptions:
    - 用了'第一''第二'，但内容无关，只是表面有条理。
    - 观点表达用'大概''可能'，态度含糊，听众无法判断立场。
    - 认为思路清晰就是多分点，实际内在逻辑混乱，前后矛盾。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:演讲稿的观点表达
  type: Concept
  subject: 语文
  title: 演讲稿的观点表达
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：一篇演讲稿提出三个互不相关的中心，听众抓不住重点。
    - 能指出并纠正这一错误：只叙述事实或故事，不提自己的观点，以为事例就能说明。
  aliases:
    - 观点明确
  category: 写作
  explanation: 演讲中观点要明确，思路要清晰，运用提示性词语、关联词和过渡句提高辨识度。
  misconceptions:
    - 一篇演讲稿提出三个互不相关的中心，听众抓不住重点。
    - 只叙述事实或故事，不提自己的观点，以为事例就能说明。
    - 将举例当成观点，如'有人成功了'，却没说出主张。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:演讲稿的语言锤炼
  type: Concept
  subject: 语文
  title: 演讲稿的语言锤炼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把书面语当口语，写'吾辈当自强'，而不说'我们'。
    - 能指出并纠正这一错误：堆砌华丽词藻，如'璀璨''馥郁'，反而显得做作，不朴实。
  aliases:
    - 语言风格
  category: 写作
  explanation: 语言应口语化、大众化，多用短句，运用修辞手法增强感染力，锤炼金句。
  misconceptions:
    - 把书面语当口语，写'吾辈当自强'，而不说'我们'。
    - 堆砌华丽词藻，如'璀璨''馥郁'，反而显得做作，不朴实。
    - 用太长的复合句，演讲时换气困难，听众也听不懂。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:演讲词
  type: Concept
  subject: 语文
  title: 演讲词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把演讲词当成个人日记，没有听众意识，只写自己感受。
    - 能指出并纠正这一错误：认为演讲词像普通作文，忽略其鼓动性和针对性，缺少激情。
  aliases:
    - 演讲稿
    - 讲演词
  category: 文体知识
  explanation: 演讲词是在重要场合或群众集会上发表讲话的文稿，具有针对性、鼓动性和语言感染力等特点。
  misconceptions:
    - 把演讲词当成个人日记，没有听众意识，只写自己感受。
    - 认为演讲词像普通作文，忽略其鼓动性和针对性，缺少激情。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:濡养
  type: Concept
  subject: 语文
  title: 濡养
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'濡'读成rǔ，误读为'乳养'。
    - 能指出并纠正这一错误：写成'儒养'或'孺养'，误以为与儒家或儿童有关。
  aliases: []
  category: 词语
  explanation: 滋养。
  misconceptions:
    - 将'濡'读成rǔ，误读为'乳养'。
    - 写成'儒养'或'孺养'，误以为与儒家或儿童有关。
    - 把'濡养'等同于'滋润'，忽视其多用于精神文化层面。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:火山说
  type: Concept
  subject: 语文
  title: 火山说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“说”当作动词“说话”，把“火山说”理解成火山在说话。
    - 能指出并纠正这一错误：认为恐龙灭绝只有“火山说”一种观点，忽略了撞击说等其他假说。
  aliases: []
  category: 科学假说
  explanation: 认为恐龙灭绝是由地球突然经历火山爆发期，大量火山同时喷发造成的。
  misconceptions:
    - 误把“说”当作动词“说话”，把“火山说”理解成火山在说话。
    - 认为恐龙灭绝只有“火山说”一种观点，忽略了撞击说等其他假说。
    - 将“火山说”写成“火山论”，混淆“说”与“论”的用法。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:灯笼的文化内涵
  type: Concept
  subject: 语文
  title: 灯笼的文化内涵
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为灯笼只是照明工具，忽略其承载的家庭温情与家国情怀。
    - 能指出并纠正这一错误：将灯笼文化内涵窄化为元宵节灯笼，忽视日常民俗中的象征意义。
  aliases: []
  category: 文化
  explanation: 灯笼在电灯未普及的时代是生活必需品，承载着家庭温情、乡情民俗、历史记忆和家国情怀等多重文化意义。
  misconceptions:
    - 认为灯笼只是照明工具，忽略其承载的家庭温情与家国情怀。
    - 将灯笼文化内涵窄化为元宵节灯笼，忽视日常民俗中的象征意义。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:灵旗
  type: Concept
  subject: 语文
  title: 灵旗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“灵旗”写作“令旗”，误为号令之旗。
    - 能指出并纠正这一错误：认为灵旗是坟前挂的幡，实际是出征时的战旗。
  aliases: []
  category: 文言词语
  explanation: 战旗，古代出征前祭祷以求旗开得胜。
  misconceptions:
    - 将“灵旗”写作“令旗”，误为号令之旗。
    - 认为灵旗是坟前挂的幡，实际是出征时的战旗。
    - 把“灵旗”理解成神灵的旗帜，忽略古代祭祷出征的语境。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:点面结合写场面
  type: Concept
  subject: 语文
  title: 点面结合写场面
  conceptType: 概念型
  aliases:
    - 点面结合
  category: 方法
  explanation: 写场面时既从整体上写整个群体的情景，又抓住个别人物的动作、神态等细节来写。点面结合能让场面既有气势又有感染力。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:炼字
  type: Concept
  subject: 语文
  title: 炼字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为炼字就是多用华丽辞藻，把“悠然见南山”的“见”换成“观”以为更雅。
    - 能指出并纠正这一错误：认为“见”与“望”都表看见，没悟出“见”字写出无意间看到的情趣。
  aliases:
    - 遣词
  category: 语言特色
  explanation: 炼字指精心选用词语以增强表现力，如《饮酒》中“见”字妙在无意得之。
  misconceptions:
    - 误以为炼字就是多用华丽辞藻，把“悠然见南山”的“见”换成“观”以为更雅。
    - 认为“见”与“望”都表看见，没悟出“见”字写出无意间看到的情趣。
    - 把炼字当成修辞手法，回答“用了炼字的修辞”。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:烂柯人
  type: Concept
  subject: 语文
  title: 烂柯人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“柯”解释为“树枝”，说“烂了树枝的人”。
    - 能指出并纠正这一错误：认为“烂柯人”是指“砍柴的樵夫”，不知道是王质。
  aliases: []
  category: 典故
  explanation: 指晋人王质，上山砍柴看童子下棋，棋终斧柄已朽，回村已过百年。柯，斧柄。
  misconceptions:
    - 把“柯”解释为“树枝”，说“烂了树枝的人”。
    - 认为“烂柯人”是指“砍柴的樵夫”，不知道是王质。
    - 在刘禹锡诗中，将“烂柯人”与“闻笛赋”同指向秀，混淆典故。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:热泪盈眶
  type: Concept
  subject: 语文
  title: 热泪盈眶
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘眼眶’的‘眶’写成‘框’，成为‘热泪盈框’
    - 能指出并纠正这一错误：将‘热泪盈眶’误用于愤怒时，如‘热泪盈眶地指责’
  aliases: []
  category: 成语
  explanation: 因激动而泪水充满眼眶。文中描写南仁东看到“天眼”建成时的激动。
  misconceptions:
    - 把‘眼眶’的‘眶’写成‘框’，成为‘热泪盈框’
    - 将‘热泪盈眶’误用于愤怒时，如‘热泪盈眶地指责’
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:烽烟
  type: Concept
  subject: 语文
  title: 烽烟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“烽烟”误写为“风烟”或“峰烟”，形近混淆。
    - 能指出并纠正这一错误：误以为“烽烟”指炊烟或烟雾，未注意其战火义。
  aliases: []
  category: 词语
  explanation: 古代边境有敌人入侵时，在烽火台上点起的报警用的烟火，后泛指战火或战争。
  misconceptions:
    - 将“烽烟”误写为“风烟”或“峰烟”，形近混淆。
    - 误以为“烽烟”指炊烟或烟雾，未注意其战火义。
    - 把“烽烟”代指战争的借代误判为借喻。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:焉得
  type: Concept
  subject: 语文
  title: 焉得
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：翻译“焉得”为“哪里得到”，在“焉得更有此人”中译成“哪里能得到此外的人”。
    - 能指出并纠正这一错误：将“焉”误释为“于此”，解释为“在这里得到”。
  aliases: []
  category: 文言词语
  explanation: 哪能，表示反问。
  misconceptions:
    - 翻译“焉得”为“哪里得到”，在“焉得更有此人”中译成“哪里能得到此外的人”。
    - 将“焉”误释为“于此”，解释为“在这里得到”。
    - 与“焉知”混淆，认为“焉得”表示“怎么知道”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:照样子说句子
  type: Concept
  subject: 语文
  title: 照样子说句子
  conceptType: 程序型
  aliases:
    - 仿照课文说一说
  category: 方法
  explanation: 学着课文里句子的样子，换上自己的想法说一说，比如照着"小草从地下探出头来"说春天里别的事物。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:爱国主义
  type: Concept
  subject: 语文
  title: 爱国主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把爱国等同于“爱政府”，认为批评政府就是不爱国。
    - 能指出并纠正这一错误：以为只有上战场、捐躯才算爱国，忽略日常遵纪守法、敬业奉献。
  aliases: []
  category: 思想情感
  explanation: 爱国主义是对祖国的忠诚和热爱，是个人对祖国的依存关系。
  misconceptions:
    - 把爱国等同于“爱政府”，认为批评政府就是不爱国。
    - 以为只有上战场、捐躯才算爱国，忽略日常遵纪守法、敬业奉献。
    - 将爱国与排外混同，认为抵制一切外国商品就是爱国。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:爱莲说
  type: Concept
  subject: 语文
  title: 爱莲说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“说”理解为“说话”的“说”，将《爱莲说》当作讲故事
    - 能指出并纠正这一错误：把“说”这种文体当作现代文中的“说明文”，忽视其议论性
  aliases: []
  category: 课文
  explanation: 周敦颐所作，通过对莲花的描写，表达作者洁身自好、不慕名利的生活态度。
  misconceptions:
    - 把“说”理解为“说话”的“说”，将《爱莲说》当作讲故事
    - 把“说”这种文体当作现代文中的“说明文”，忽视其议论性
    - 把《爱莲说》的主旨概括为“赞美莲花的美”，忽略洁身自好的品德
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:父子深情
  type: Concept
  subject: 语文
  title: 父子深情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为父亲‘迂’是不爱儿子的表现，把父亲的叮嘱当成多余。
    - 能指出并纠正这一错误：把儿子流泪解释为懦弱或嫌弃父亲，而不是因感动而心生愧疚。
  aliases:
    - 父爱
  category: 主题思想
  explanation: 文章通过父亲送别、买橘子等细节，表现了父亲对儿子的深切关爱，以及儿子对父亲由不解到感动的变化，体现了父子之间的深厚情感。
  misconceptions:
    - 认为父亲‘迂’是不爱儿子的表现，把父亲的叮嘱当成多余。
    - 把儿子流泪解释为懦弱或嫌弃父亲，而不是因感动而心生愧疚。
    - 只强调父亲的爱，忽略儿子从不解到愧疚的情感转变。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:物候
  type: Concept
  subject: 语文
  title: 物候
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“物候”的“候”写成“侯”，混淆“候”与“侯”的字形。
    - 能指出并纠正这一错误：误认为物候只指植物变化，不包括动物如候鸟去来。
  aliases:
    - 大自然的语言
  category: 科学概念
  explanation: 指草木荣枯、候鸟去来等自然现象，这些现象与气候密切相关，古代劳动人民称之为物候。
  misconceptions:
    - 将“物候”的“候”写成“侯”，混淆“候”与“侯”的字形。
    - 误认为物候只指植物变化，不包括动物如候鸟去来。
    - 把“物候”等同于“节气”，不清楚节气是固定的时间点。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:物候学
  type: Concept
  subject: 语文
  title: 物候学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为物候学就是气象学，只研究天气变化，不关注生物反应。
    - 能指出并纠正这一错误：将“物候学”的“候”写错，或认为“物候学”即“物候”的同义词，不知道其学科属性。
  aliases: []
  category: 科学概念
  explanation: 利用物候知识研究农业生产的一门科学，记录植物的生长荣枯和动物的养育往来，以了解气候变化及其对生物的影响。
  misconceptions:
    - 误以为物候学就是气象学，只研究天气变化，不关注生物反应。
    - 将“物候学”的“候”写错，或认为“物候学”即“物候”的同义词，不知道其学科属性。
    - 认为物候学是古代农民的迷信知识，缺乏科学依据。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:物候学的研究意义
  type: Concept
  subject: 语文
  title: 物候学的研究意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只记住“预报农时”一个用途，忽略安排农作物区划、引种植物等。
    - 能指出并纠正这一错误：误认为物候学只能用于农业，不能为生态文明建设服务。
  aliases: []
  category: 科学应用
  explanation: 物候学的研究首先是为了预报农时，选择播种日期，此外还可用于安排农作物区划、确定造林日期、引种植物、避免害虫侵害等。
  misconceptions:
    - 只记住“预报农时”一个用途，忽略安排农作物区划、引种植物等。
    - 误认为物候学只能用于农业，不能为生态文明建设服务。
    - 将“研究物候学”与“学习二十四节气”混为一谈，认为没有区别。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:物我交融
  type: Concept
  subject: 语文
  title: 物我交融
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将借景抒情当作物我交融，如“看到秋叶飘落，我感到凄凉”是触景生情，不是物我瞬间合一
    - 能指出并纠正这一错误：误以为物我交融必定有拟人手法，如“花在笑”是拟人，但物我交融强调主客观浑然，非单方面拟人
  aliases: []
  category: 写作手法
  explanation: 将客观景物与主观情感融为一体，达到情景交融的境界，如“流向人的心底”。
  misconceptions:
    - 将借景抒情当作物我交融，如“看到秋叶飘落，我感到凄凉”是触景生情，不是物我瞬间合一
    - 误以为物我交融必定有拟人手法，如“花在笑”是拟人，但物我交融强调主客观浑然，非单方面拟人
    - 认为只要写景时带有心情就算物我交融，如“青山绿水，心情舒畅”是情景并列，不是融为一体的境界
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:物质文化遗产
  type: Concept
  subject: 语文
  title: 物质文化遗产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为物质文化遗产全为不可移动的，如否认故宫文物属于它。
    - 能指出并纠正这一错误：把物质文化遗产和非物质文化遗产倒置，例如把古琴曲归入物质文化遗产。
  aliases:
    - 有形文化遗产
  category: 文化概念
  explanation: 具有历史、艺术和科学价值的文物，包括古遗址、古建筑、可移动文物等。
  misconceptions:
    - 认为物质文化遗产全为不可移动的，如否认故宫文物属于它。
    - 把物质文化遗产和非物质文化遗产倒置，例如把古琴曲归入物质文化遗产。
    - 认为物质文化遗产必须年代久远，如认为20世纪的工业遗产不算。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:特殊句式
  type: Concept
  subject: 语文
  title: 特殊句式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把宾语前置句“何苦而不平”译成“什么苦不克服”，未调整为“苦什么”
    - 能指出并纠正这一错误：误将“甚矣，汝之不惠”当主谓倒装句，却错译成“你不聪明太严重了”
  aliases:
    - 倒装句
  category: 文言语法
  explanation: 文言文中不同于现代汉语的句式，如倒装句“甚矣，汝之不惠”等。
  misconceptions:
    - 把宾语前置句“何苦而不平”译成“什么苦不克服”，未调整为“苦什么”
    - 误将“甚矣，汝之不惠”当主谓倒装句，却错译成“你不聪明太严重了”
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:犯上
  type: Concept
  subject: 语文
  title: 犯上
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“犯上”误写成“范上”或“泛上”，形近字混淆。
    - 能指出并纠正这一错误：误认为“犯上”即“犯法”，如“他犯了上”表示违法。
  aliases: []
  category: 文言词语
  explanation: 触犯长辈或者地位比自己高的人。
  misconceptions:
    - 将“犯上”误写成“范上”或“泛上”，形近字混淆。
    - 误认为“犯上”即“犯法”，如“他犯了上”表示违法。
    - 把“犯上”与“冒犯”等同，说“犯上长辈”造成重复。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:状中关系
  type: Concept
  subject: 语文
  title: 状中关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“美丽的校园”误判为状中关系，实际是定中关系。
    - 能指出并纠正这一错误：认为“仔细地看”中“看”是状语，实际是中心语。
  aliases: []
  category: 语法
  explanation: 状中关系是偏正短语的一种，修饰语为状语，中心语为动词或形容词，如“好奇地问”。
  misconceptions:
    - 把“美丽的校园”误判为状中关系，实际是定中关系。
    - 认为“仔细地看”中“看”是状语，实际是中心语。
    - 误以为状中关系的中心语只能是动词，忽略了形容词也可作中心语。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:独白
  type: Concept
  subject: 语文
  title: 独白
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“独白”与“旁白”混淆，误认为独白是对其他人物说的台词。
    - 能指出并纠正这一错误：误写“独白”为“读白”，忽略独自一人时大段台词的含义。
  aliases:
    - 内心独白
  category: 戏剧术语
  explanation: 剧中人物独自一人时所说的大段台词，用于表达内心情感和思想。
  misconceptions:
    - 将“独白”与“旁白”混淆，误认为独白是对其他人物说的台词。
    - 误写“独白”为“读白”，忽略独自一人时大段台词的含义。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:狼的文学形象
  type: Concept
  subject: 语文
  title: 狼的文学形象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“狼子野心”理解为有远大志向，如造句“他狼子野心，想当科学家”。
    - 能指出并纠正这一错误：认为“狼心狗肺”形容人忠诚善良，完全颠倒贬义色彩。
  aliases: []
  category: 文化常识
  explanation: 在中国传统文化中，狼常被赋予贪婪、凶狠、狡诈的形象，如成语“狼心狗肺”“狼子野心”等。
  misconceptions:
    - 把“狼子野心”理解为有远大志向，如造句“他狼子野心，想当科学家”。
    - 认为“狼心狗肺”形容人忠诚善良，完全颠倒贬义色彩。
    - 将狼的形象视为正义勇敢的化身，忽略其贪婪凶恶的传统文化象征。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:猜字谜的方法
  type: Concept
  subject: 语文
  title: 猜字谜的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 猜字谜时要想一想谜面说的字是什么样子，比如从左右结构去想，或者给字加上不同的偏旁组成新字。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:猜读法
  type: Concept
  subject: 语文
  title: 猜读法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：猜读时只看生词，不结合上下文，直接乱猜
    - 能指出并纠正这一错误：猜完就不管了，不通过后文验证，导致理解偏差
  aliases: []
  category: 阅读方法
  explanation: 遇到生字生词时，根据上下文猜测其意思的阅读方法。
  misconceptions:
    - 猜读时只看生词，不结合上下文，直接乱猜
    - 猜完就不管了，不通过后文验证，导致理解偏差
    - 把猜读法当成略读，认为不用仔细看文章
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:玉盘珍羞直万钱
  type: Concept
  subject: 语文
  title: 玉盘珍羞直万钱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“直”误译为“直接”，导致句意变成“玉盘里珍美的食物直接值万钱”。
    - 能指出并纠正这一错误：把“羞”写成“馐”，忽略“羞”是通假字，未掌握本字“馐”的意义。
  aliases: []
  category: 诗句理解
  explanation: 盘子里装满价值万钱的佳肴。羞，同“馐”，美味的食物；直，同“值”，价值。
  misconceptions:
    - 将“直”误译为“直接”，导致句意变成“玉盘里珍美的食物直接值万钱”。
    - 把“羞”写成“馐”，忽略“羞”是通假字，未掌握本字“馐”的意义。
    - 误以为“万钱”是“一万枚钱币”，忽视“万”是虚指，极言价值高。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:玉龙雪山
  type: Concept
  subject: 语文
  title: 玉龙雪山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：称玉龙雪山是北半球最高峰，实际是北半球最南的大雪山。
    - 能指出并纠正这一错误：把“玉龙雪山”写成“玉龙山雪”，语序颠倒。
  aliases: []
  category: 地理常识
  explanation: 位于云南省丽江市境内，是北半球最南的大雪山，山顶终年积雪。
  misconceptions:
    - 称玉龙雪山是北半球最高峰，实际是北半球最南的大雪山。
    - 把“玉龙雪山”写成“玉龙山雪”，语序颠倒。
    - 将玉龙雪山与梅里雪山混为一谈，位置张冠李戴。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:王安石
  type: Concept
  subject: 语文
  title: 王安石
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为王安石是唐代人，或不在唐宋八大家之列。
    - 能指出并纠正这一错误：把“不畏浮云遮望眼”当作王之涣《登鹳雀楼》中的诗句。
  aliases:
    - 王介甫
    - 半山
  category: 作家作品
  explanation: 王安石（1021—1086），字介甫，号半山，北宋政治家、文学家，“唐宋八大家”之一，代表作《登飞来峰》。
  misconceptions:
    - 误认为王安石是唐代人，或不在唐宋八大家之列。
    - 把“不畏浮云遮望眼”当作王之涣《登鹳雀楼》中的诗句。
    - 将《登飞来峰》与《题西林壁》混淆，忘记两者作者不同。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:王湾
  type: Concept
  subject: 语文
  title: 王湾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把王湾与王维混淆，误将“空山新雨后”当作王湾所作。
    - 能指出并纠正这一错误：误记王湾朝代，说成宋代。
  aliases: []
  category: 文学常识
  explanation: 王湾，唐代诗人，生卒年不详，洛阳人，《次北固山下》为其代表作。
  misconceptions:
    - 把王湾与王维混淆，误将“空山新雨后”当作王湾所作。
    - 误记王湾朝代，说成宋代。
    - 误将《次北固山下》中“海日生残夜”归为王勃。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:王熙凤
  type: Concept
  subject: 语文
  title: 王熙凤
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为王熙凤是《水浒传》中人物，与潘金莲混淆。
    - 能指出并纠正这一错误：把王熙凤的形象特点说成“温柔贤淑”，忽略其精明泼辣。
  aliases:
    - 凤姐
    - 凤辣子
  category: 人物
  explanation: 《红楼梦》中贾府管家，精明泼辣，善于捉弄人。
  misconceptions:
    - 误以为王熙凤是《水浒传》中人物，与潘金莲混淆。
    - 把王熙凤的形象特点说成“温柔贤淑”，忽略其精明泼辣。
    - 将王熙凤写为“王西凤”，字形错误。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:环境描写的作用
  type: Concept
  subject: 语文
  title: 环境描写的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：分析环境描写的作用时只写“渲染气氛”，忽略烘托人物心理
    - 能指出并纠正这一错误：误以为《孤独之旅》中暴风雨环境只能推动情节，不能体现杜小康成长
  aliases: []
  category: 文学手法
  explanation: 环境描写在小说中起烘托人物心理、渲染气氛、推动情节发展的作用，如《孤独之旅》中暴风雨的环境描写烘托了杜小康的成长。
  misconceptions:
    - 分析环境描写的作用时只写“渲染气氛”，忽略烘托人物心理
    - 误以为《孤独之旅》中暴风雨环境只能推动情节，不能体现杜小康成长
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:现代诗的特点
  type: Concept
  subject: 语文
  title: 现代诗的特点
  conceptType: 概念型
  aliases:
    - 现代诗歌的特点
  category: 概念
  explanation: 现代诗读起来朗朗上口、有节奏感，常常表达诗人独特的感受，蕴含着丰富的想象和真挚的情感，语言表达也很独特。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:现实主义
  type: Concept
  subject: 语文
  title: 现实主义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为现实主义就是记流水账，排斥任何想象与夸张。
    - 能指出并纠正这一错误：把《西游记》归为现实主义，因其讽刺社会，忽略浪漫主义特征。
  aliases: []
  category: 文学流派
  explanation: 文学创作中的一种基本方法，主张客观地反映现实生活，揭示社会矛盾。
  misconceptions:
    - 认为现实主义就是记流水账，排斥任何想象与夸张。
    - 把《西游记》归为现实主义，因其讽刺社会，忽略浪漫主义特征。
    - 将“揭露社会矛盾”当作现实主义的唯一标准，忽视其客观反映生活的一面。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:现实主义诗歌
  type: Concept
  subject: 语文
  title: 现实主义诗歌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把李白的《早发白帝城》归为现实主义诗歌，因写实景。
    - 能指出并纠正这一错误：认为现实主义诗歌不能使用夸张想象，如“白发三千丈”。
  aliases: []
  category: 文学流派
  explanation: 以反映现实生活、关注民生疾苦为特点的诗歌创作。
  misconceptions:
    - 误把李白的《早发白帝城》归为现实主义诗歌，因写实景。
    - 认为现实主义诗歌不能使用夸张想象，如“白发三千丈”。
    - 把“关注民生疾苦”当作现实主义诗歌的唯一特征，忽视其它。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:班史编写
  type: Concept
  subject: 语文
  title: 班史编写
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把“班史”等同于班级日志，以为只需按日记事即可。
    - 能指出并纠正这一错误：误认为班史编写是个人作业，不需要成立编委会和分工合作。
  aliases:
    - 班级史
  category: 综合性学习
  explanation: 班史编写是初中毕业前制作班级纪念册的活动，包括成立编委会、搜集资料、编辑加工等步骤。
  misconceptions:
    - 把“班史”等同于班级日志，以为只需按日记事即可。
    - 误认为班史编写是个人作业，不需要成立编委会和分工合作。
    - 认为只要收集照片和奖状，忽略文字编辑和资料整理过程。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:理清小说人物关系
  type: Concept
  subject: 语文
  title: 理清小说人物关系
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 小说里人物往往很多，理清他们和主人公之间的关系，就能分清各个人物，更好地读懂故事。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:理清故事的起因经过结果
  type: Concept
  subject: 语文
  title: 理清故事的起因经过结果
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读故事时先弄清事情为什么发生、经过怎样、结果如何，再按这个顺序说出故事的主要内容。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:理解故事内容
  type: Concept
  subject: 语文
  title: 理解故事内容
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读故事要想清楚故事里谁做了什么、为什么。比如兰兰的小手帮爸爸拿过拖鞋、帮妈妈洗过手绢，所以全家都喜欢这幅画。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:理解词语的方法
  type: Concept
  subject: 语文
  title: 理解词语的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 遇到不理解的词语，可以查字典、联系上下文或结合生活经验来弄懂它的意思。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:琼楼玉宇
  type: Concept
  subject: 语文
  title: 琼楼玉宇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写为“群楼玉宇”，将“琼”写成同音字。
    - 能指出并纠正这一错误：把“宇”解释为“宇宙”，整词变成“美玉般的楼阁和宇宙”。
  aliases: []
  category: 词语理解
  explanation: 美玉砌成的楼宇，指想象中的月中仙宫。
  misconceptions:
    - 误写为“群楼玉宇”，将“琼”写成同音字。
    - 把“宇”解释为“宇宙”，整词变成“美玉般的楼阁和宇宙”。
    - 认为指凡间豪华建筑，忽略是想象中的月中仙宫。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:生于忧患，死于安乐
  type: Concept
  subject: 语文
  title: 生于忧患，死于安乐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“生”“死”理解为出生和死亡，而实际指生存发展和衰亡
    - 能指出并纠正这一错误：把“于”字理解为“在”，错译成“在忧患中出生”
  aliases: []
  category: 观点
  explanation: 忧患祸患能使人生存发展，安逸享乐使人萎靡灭亡。
  misconceptions:
    - 把“生”“死”理解为出生和死亡，而实际指生存发展和衰亡
    - 把“于”字理解为“在”，错译成“在忧患中出生”
    - 把“安乐”等同于快乐幸福，忽略其指安逸享乐
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:生动形象的说明方法
  type: Concept
  subject: 语文
  title: 生动形象的说明方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：为了生动，把说明文写成“塔高得刺破天”，夸张失实，违反准确性。
    - 能指出并纠正这一错误：把打比方误称为拟人，如“石笋像竹笋”说是拟人。
  aliases: []
  category: 写作方法
  explanation: 运用比喻等生动形象的说明方法，突出事物特征，避免文章枯燥乏味。
  misconceptions:
    - 为了生动，把说明文写成“塔高得刺破天”，夸张失实，违反准确性。
    - 把打比方误称为拟人，如“石笋像竹笋”说是拟人。
    - 混淆打比方与作比较，认为有“像”就是打比方，忽略比较的目的。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:生动描写
  type: Concept
  subject: 语文
  title: 生动描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只用‘非常开心’‘十分生气’等概括性词语，缺少动作神态，如‘她非常着急’不如‘她来回踱步’。
    - 能指出并纠正这一错误：堆砌比喻，如‘他的眼睛像星星，像珍珠，像钻石’，显得浮夸且不准确。
  aliases: []
  category: 写作手法
  explanation: 指用语生动、简洁，使读者如见其人、如睹其物、如临其境。
  misconceptions:
    - 只用‘非常开心’‘十分生气’等概括性词语，缺少动作神态，如‘她非常着急’不如‘她来回踱步’。
    - 堆砌比喻，如‘他的眼睛像星星，像珍珠，像钻石’，显得浮夸且不准确。
    - 认为用上网络流行语和夸张语气就生动，如‘真是绝绝子’代替具体描写。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:生命自身的不朽
  type: Concept
  subject: 语文
  title: 生命自身的不朽
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'生命自身的不朽'指每个生物个体都不会死亡，如认为人不会老死。
    - 能指出并纠正这一错误：把生命不死归因于灵魂或神，而非依靠个体的繁衍与延续。
  aliases:
    - 永久的生命
  category: 哲理
  explanation: 生命作为整体是永存的，它通过个体的繁衍和延续而不断存在，个体生命虽短暂，但生命本身不朽。
  misconceptions:
    - 误以为'生命自身的不朽'指每个生物个体都不会死亡，如认为人不会老死。
    - 把生命不死归因于灵魂或神，而非依靠个体的繁衍与延续。
    - 认为只有人类生命不朽，忽略动植物等一切生命形式的整体延续。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:生态文明建设
  type: Concept
  subject: 语文
  title: 生态文明建设
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为生态文明建设只是多种树，忽略了节能减排等综合措施。
    - 能指出并纠正这一错误：将“生态文明”写成“生太文明”，混淆“态”与“太”。
  aliases:
    - 生态文明
  category: 政治概念
  explanation: 指通过尊重自然、顺应自然、保护自然，实现人与自然和谐共生的现代化建设过程。
  misconceptions:
    - 误以为生态文明建设只是多种树，忽略了节能减排等综合措施。
    - 将“生态文明”写成“生太文明”，混淆“态”与“太”。
    - 认为生态文明建设就是回到原始时代，不发展工业。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:生活教育
  type: Concept
  subject: 语文
  title: 生活教育
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“生活即教育”窄化为“在生活中学习”，忽略“社会即学校”
    - 能指出并纠正这一错误：误以为教学做合一就是边教边学，忽略“做”是核心
  aliases: []
  category: 教育思想
  explanation: 陶行知的主要教育理论，包括生活即教育、社会即学校、教学做合一。
  misconceptions:
    - 把“生活即教育”窄化为“在生活中学习”，忽略“社会即学校”
    - 误以为教学做合一就是边教边学，忽略“做”是核心
    - 将陶行知的生活教育与杜威的实用主义教育混为一谈
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:生辰纲
  type: Concept
  subject: 语文
  title: 生辰纲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“生辰纲”写成“生日纲”或“生辰刚”，字形错误。
    - 能指出并纠正这一错误：认为生辰纲是普通货物，忽略其是生日贺礼的特定含义。
  aliases: []
  category: 文化常识
  explanation: 指为庆祝生日而运送的礼物，这里指梁中书送给蔡京的生日贺礼。
  misconceptions:
    - 把“生辰纲”写成“生日纲”或“生辰刚”，字形错误。
    - 认为生辰纲是普通货物，忽略其是生日贺礼的特定含义。
    - 误以为“生辰纲”是军队编制，与“纲”的本义混淆。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:用一连串问句抒情
  type: Concept
  subject: 语文
  title: 用一连串问句抒情
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 把心里想说的话用一连串的问句直接写出来，能强烈地表达内心的感受。《匆匆》用一连串问句表达了对时间飞逝的惋惜和感叹，容易打动读者。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:用不同方式介绍事物
  type: Concept
  subject: 语文
  title: 用不同方式介绍事物
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 介绍同一事物可以用不同的方式，比如用散文生动地描写，或用数据、示意图、批注来呈现，各有各的好处。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C7/sections/S3.md
- id: concept:语文:用不同词语表达同一意思
  type: Concept
  subject: 语文
  title: 用不同词语表达同一意思
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 同一个意思可以用不同的词语来表达，使语言更丰富。如"一律""清一色""都是"都表示"全部"；"勇夺第一""喜获金牌""摘得桂冠"都表示"获得第一"。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:用具体事例写人物特点
  type: Concept
  subject: 语文
  title: 用具体事例写人物特点
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 写人时要结合具体的事例，把人物的特点写出来，特别是把印象最深的地方写清楚，这样人物才真实、鲜活。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:用具体事例写情感变化
  type: Concept
  subject: 语文
  title: 用具体事例写情感变化
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 用几个具体的事例把情感的变化过程写出来，读起来真实自然。例文中用默书进步、老师送书、同学留言等事例，写出了"我"对语文课的情感变化。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:用具体事例说明观点
  type: Concept
  subject: 语文
  title: 用具体事例说明观点
  conceptType: 概念型
  aliases:
    - 用事例证明观点
  category: 方法
  explanation: 为了证明自己的观点，列举具体的事例，每个事例按一定顺序写清楚。《真理诞生于一百个问号之后》就用了三个科学史上的事例来证明观点。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:用具体情景表现成语
  type: Concept
  subject: 语文
  title: 用具体情景表现成语
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 许多成语能让人联想到具体的人和事。把成语的意思放到一个具体的情景里写出来，读者就能明白成语的含义。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:用典
  type: Concept
  subject: 语文
  title: 用典
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《赤壁》中“东风”当成用典，实际是自然现象，不是典故。
    - 能指出并纠正这一错误：误以为用典等于比喻，说“东风不与周郎便”是比喻。
  aliases:
    - 用事
  category: 表现手法
  explanation: 用典是在诗中引用历史故事或前人诗句来表达情感，如《赤壁》用周瑜火烧赤壁的典故。
  misconceptions:
    - 把《赤壁》中“东风”当成用典，实际是自然现象，不是典故。
    - 误以为用典等于比喻，说“东风不与周郎便”是比喻。
    - 不知“铜雀春深锁二乔”借二乔指东吴，误认为写实。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:用动作描写表现心情
  type: Concept
  subject: 语文
  title: 用动作描写表现心情
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 写心情时，不直接说"害怕""着急"，而是用人物的动作把这种心情表现出来，这样更生动。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C7/sections/S7.md
- id: concept:语文:用武之地
  type: Concept
  subject: 语文
  title: 用武之地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“用武之地”解释为“使用武器的场所”，望文生义。
    - 能指出并纠正这一错误：误写成“用武之低”，字形错误。
  aliases: []
  category: 成语
  explanation: 指用兵之地，比喻可以施展才能的地方。
  misconceptions:
    - 将“用武之地”解释为“使用武器的场所”，望文生义。
    - 误写成“用武之低”，字形错误。
    - 认为“用武之地”只能指战场，忽略其比喻义。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:田字格
  type: Concept
  subject: 语文
  title: 田字格
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 写汉字用的方格纸，里面有横中线和竖中线，把格子分成四个小格。写字时要注意笔画在田字格中的位置，字才写得端正。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:甲骨文
  type: Concept
  subject: 语文
  title: 甲骨文
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 刻在龟甲或兽骨上的文字，主要在商周时期使用，是目前能见到的最早的成熟汉字，1899 年由王懿荣首先发现其价值。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:申遗
  type: Concept
  subject: 语文
  title: 申遗
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为申遗是个人行为，如村民自行向联合国申请自家祠堂。
    - 能指出并纠正这一错误：认为申遗只是提交报告，省略评选答辩环节，如申请后便宣称已是遗产。
  aliases:
    - 申报文化遗产
  category: 活动概念
  explanation: 申请将某项目列入文化遗产名录的过程，包括推荐、评选、撰写申请报告和答辩等环节。
  misconceptions:
    - 误以为申遗是个人行为，如村民自行向联合国申请自家祠堂。
    - 认为申遗只是提交报告，省略评选答辩环节，如申请后便宣称已是遗产。
    - 把申遗与非遗混淆，说‘端午节申遗’就是‘端午节非遗’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:电头
  type: Concept
  subject: 语文
  title: 电头
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把电头写在文章结尾，当成通讯社的落款或日期。
    - 能指出并纠正这一错误：将电头中的“新华社”误认为记者姓名，答题时说作者是新华社。
  aliases: []
  category: 文体知识
  explanation: 电头是消息开头表明通讯社名称、地点和时间的部分，如“新华社长江前线二十二日二时电”。
  misconceptions:
    - 把电头写在文章结尾，当成通讯社的落款或日期。
    - 将电头中的“新华社”误认为记者姓名，答题时说作者是新华社。
    - 抄写电头时漏掉时间或地点，只写“新华社电”，缺少地点和日期。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:画龙点睛
  type: Concept
  subject: 语文
  title: 画龙点睛
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在结尾强行喊口号，如‘这件事让我懂得了要好好学习’，但前文细节从未涉及学习。
    - 能指出并纠正这一错误：认为点题就要长篇大论发表议论，结果喧宾夺主，冲淡细节描写。
  aliases: []
  category: 写作手法
  explanation: 比喻在关键处用精辟的语句或细节点明主旨，使内容更加生动传神。
  misconceptions:
    - 在结尾强行喊口号，如‘这件事让我懂得了要好好学习’，但前文细节从未涉及学习。
    - 认为点题就要长篇大论发表议论，结果喧宾夺主，冲淡细节描写。
    - 在无关紧要处加一句哲理，如描写早餐时突然写‘人生如梦’，与内容毫无关联。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:界画
  type: Concept
  subject: 语文
  title: 界画
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为界画是用‘界尺’画山水，实际主要题材是宫室楼台。
    - 能指出并纠正这一错误：把界画当作文人画，忽略了它使用界笔直尺求工整的特点。
  aliases: []
  category: 绘画术语
  explanation: 中国画的一种，作画时使用界笔直尺，主要题材是宫室、楼台、屋宇等。
  misconceptions:
    - 误以为界画是用‘界尺’画山水，实际主要题材是宫室楼台。
    - 把界画当作文人画，忽略了它使用界笔直尺求工整的特点。
    - 将界画的‘界’理解为界限，认为是画中分界的线。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:畏罪潜逃
  type: Concept
  subject: 语文
  title: 畏罪潜逃
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘潜’误读为‘qiǎn’或写成‘前’
    - 能指出并纠正这一错误：把‘畏罪潜逃’用于没写作业就逃走的同学，忽略了‘犯罪’的语义
  aliases: []
  category: 成语
  explanation: 犯罪后害怕被制裁而逃走。
  misconceptions:
    - 将‘潜’误读为‘qiǎn’或写成‘前’
    - 把‘畏罪潜逃’用于没写作业就逃走的同学，忽略了‘犯罪’的语义
    - 误写‘畏罪潜逃’为‘畏罪欠逃’，不理解‘潜’是暗中逃走
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:留守儿童
  type: Concept
  subject: 语文
  title: 留守儿童
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“留守”写作“流守”，把“留”写成“流”。
    - 能指出并纠正这一错误：认为父母一方在家也算留守儿童，忽略“外出务工”这一前提。
  aliases: []
  category: 社会现象
  explanation: 指父母外出务工而留在家乡由祖辈或其他亲属照顾的儿童。
  misconceptions:
    - 误将“留守”写作“流守”，把“留”写成“流”。
    - 认为父母一方在家也算留守儿童，忽略“外出务工”这一前提。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:略读
  type: Concept
  subject: 语文
  title: 略读
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：略读时一字不漏地读全文，不敢跳读，结果既慢又抓不住大意。
    - 能指出并纠正这一错误：略读只注意段落首句，完全忽略结尾和过渡句，导致理解片面。
  aliases:
    - 浏览
  category: 阅读方法
  explanation: 一种快速浏览的阅读方法，旨在快速了解文章大意和主要内容。
  misconceptions:
    - 略读时一字不漏地读全文，不敢跳读，结果既慢又抓不住大意。
    - 略读只注意段落首句，完全忽略结尾和过渡句，导致理解片面。
    - 略读后复述时只罗列细节，不能概括主要内容，如只说“讲了某物”而说不出观点。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:疑问句
  type: Concept
  subject: 语文
  title: 疑问句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为'难道你不知道？'是陈述句，因为答案明确，其实是疑问句中的反问句。
    - 能指出并纠正这一错误：混淆一般疑问句和选择疑问句，如'你去北京还是上海？'实际是选择疑问句。
  aliases: []
  category: 语法知识
  explanation: 疑问句用于提出问题，包括一般疑问句、特殊疑问句、选择疑问句和反问句等。
  misconceptions:
    - 误认为'难道你不知道？'是陈述句，因为答案明确，其实是疑问句中的反问句。
    - 混淆一般疑问句和选择疑问句，如'你去北京还是上海？'实际是选择疑问句。
    - 以为带'吗'的就是一般疑问句，但'你难道没看见吗？'是反问句。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:瘴江边
  type: Concept
  subject: 语文
  title: 瘴江边
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“瘴江”当成一条具体河流，实则指岭南、潮州一带。
    - 能指出并纠正这一错误：将“瘴”读作zhāng或写成“障”，字形字音混淆。
  aliases:
    - 岭南
  category: 文学常识
  explanation: 指岭南，古时岭南多瘴气，此处指潮州。
  misconceptions:
    - 把“瘴江”当成一条具体河流，实则指岭南、潮州一带。
    - 将“瘴”读作zhāng或写成“障”，字形字音混淆。
    - 只译“有瘴气的江边”，未点明是韩愈贬所潮州。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:白手起家
  type: Concept
  subject: 语文
  title: 白手起家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“白手起家”理解为靠暴力或抢夺起家，受“白手”字面义误导
    - 能指出并纠正这一错误：认为“白手起家”就是形容人从贫穷到富裕，忽略了特指创立一番事业
  aliases: []
  category: 成语
  explanation: 比喻原来没有基础或条件很差而创立起一番事业。文中指中国舰载战斗机事业从零开始。
  misconceptions:
    - 把“白手起家”理解为靠暴力或抢夺起家，受“白手”字面义误导
    - 认为“白手起家”就是形容人从贫穷到富裕，忽略了特指创立一番事业
    - 将“白手起家”与“手无寸铁”混用，用来形容赤手空拳打架
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:白描
  type: Concept
  subject: 语文
  title: 白描
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为白描是浓墨重彩地细描，如“黑瘦”是细致刻画
    - 能指出并纠正这一错误：把白描说成是比喻手法，如说“八字须”是借代
  aliases: []
  category: 表现手法
  explanation: 白描是用简练的笔墨不加渲染地勾勒出人物或事物的特征。文中对藤野先生的外貌描写（黑瘦、八字须、戴眼镜）即运用了白描手法。
  misconceptions:
    - 认为白描是浓墨重彩地细描，如“黑瘦”是细致刻画
    - 把白描说成是比喻手法，如说“八字须”是借代
    - 误以为白描只用于写景，不能写人物外貌
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:白描手法
  type: Concept
  subject: 语文
  title: 白描手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把白描等同于比喻、拟人等修辞手法，如认为“朱自清写背影时用了白描手法表现父亲穿着”是修辞
    - 能指出并纠正这一错误：认为白描只能写景，不能写人，如评价《故乡》中闰土外貌时怀疑“这不是白描”
  aliases: []
  category: 写作手法
  explanation: 用简练的笔墨不加烘托地描绘形象，如《行香子》中直接描写田园景物。
  misconceptions:
    - 把白描等同于比喻、拟人等修辞手法，如认为“朱自清写背影时用了白描手法表现父亲穿着”是修辞
    - 认为白描只能写景，不能写人，如评价《故乡》中闰土外貌时怀疑“这不是白描”
    - 以为白描就是毫无修饰的流水账，如把“我今天吃饭了”也当成白描
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:白杨礼赞
  type: Concept
  subject: 语文
  title: 白杨礼赞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“礼赞”理解成“以礼相待”，解释题目为“白杨有礼貌地赞美”。
    - 能指出并纠正这一错误：认为“白杨礼赞”是主谓短语，解说成“白杨在歌颂”，实际上是偏正短语“对白杨的赞颂”。
  aliases: []
  category: 课文内容
  explanation: 茅盾写于1941年，通过赞美白杨树，歌颂北方农民及民族解放斗争中的精神。
  misconceptions:
    - 把“礼赞”理解成“以礼相待”，解释题目为“白杨有礼貌地赞美”。
    - 认为“白杨礼赞”是主谓短语，解说成“白杨在歌颂”，实际上是偏正短语“对白杨的赞颂”。
    - 认为文章主旨只是咏物，忽略白杨象征北方军民及民族解放斗争精神。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:白求恩
  type: Concept
  subject: 语文
  title: 白求恩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为白求恩是美国人，实际他是加拿大人，而且是加拿大共产党党员
    - 能指出并纠正这一错误：认为白求恩牺牲在战场上，实际是因抢救伤员感染细菌，1939年在河北唐县逝世
  aliases:
    - 诺尔曼·白求恩
  category: 人物
  explanation: 白求恩（1890—1939），国际主义战士、加拿大共产党党员、著名医生。他率领医疗队来华支援中国抗日战争，因抢救伤员感染细菌，1939年11月12日在河北唐县逝世。
  misconceptions:
    - 误以为白求恩是美国人，实际他是加拿大人，而且是加拿大共产党党员
    - 认为白求恩牺牲在战场上，实际是因抢救伤员感染细菌，1939年在河北唐县逝世
    - 将白求恩的国籍与末路的另一外国医生混淆，记混其支援的国家和身份
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:白话小说
  type: Concept
  subject: 语文
  title: 白话小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为白话小说就是用现代白话写的小说，如把鲁迅《呐喊》归入古代白话小说
    - 能指出并纠正这一错误：混淆白话小说和笔记小说，认为《世说新语》是白话小说
  aliases: []
  category: 文学常识
  explanation: 用白话写成的古代小说，明清时期达到顶峰，如《水浒传》《红楼梦》等。
  misconceptions:
    - 认为白话小说就是用现代白话写的小说，如把鲁迅《呐喊》归入古代白话小说
    - 混淆白话小说和笔记小说，认为《世说新语》是白话小说
    - 以为所有明清小说都是白话小说，忽略《聊斋志异》等文言小说
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:白鹿原
  type: Concept
  subject: 语文
  title: 白鹿原
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为白鹿原位于陕北或河南，实际在陕西蓝田
    - 能指出并纠正这一错误：误认为白鹿原因地形像白鹿而得名，实际因传说有白鹿出现
  aliases: []
  category: 文化常识
  explanation: 白鹿原位于陕西蓝田，相传周平王时这里有白鹿出现，由此得名。
  misconceptions:
    - 误以为白鹿原位于陕北或河南，实际在陕西蓝田
    - 误认为白鹿原因地形像白鹿而得名，实际因传说有白鹿出现
    - 误以为白鹿原是小说虚构的地名，实际真实存在
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:百家衣
  type: Concept
  subject: 语文
  title: 百家衣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“百家衣”是花一百家钱买的衣服，误解“百家”为价格。
    - 能指出并纠正这一错误：把“百家衣”写成“百佳衣”或“百嫁衣”，字形混淆。
  aliases: []
  category: 民俗
  explanation: 旧俗向邻里乞讨零碎布头缝制的衣服，给婴儿穿，寓意吉祥。文中一丈青大娘为孙子缝制百家衣。
  misconceptions:
    - 认为“百家衣”是花一百家钱买的衣服，误解“百家”为价格。
    - 把“百家衣”写成“百佳衣”或“百嫁衣”，字形混淆。
    - 认为百家衣是百家布拼成的衣服，但不知有乞讨零碎布头的习俗。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:百草园
  type: Concept
  subject: 语文
  title: 百草园
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为百草园是鲁迅家的大花园，实际是后面的一个园子
    - 能指出并纠正这一错误：说百草园在三味书屋后面，其实百草园在鲁迅家后面
  aliases: []
  category: 课文内容
  explanation: 鲁迅家后面的一个园子，是少年鲁迅的乐园，充满生机与趣味。
  misconceptions:
    - 误以为百草园是鲁迅家的大花园，实际是后面的一个园子
    - 说百草园在三味书屋后面，其实百草园在鲁迅家后面
    - 认为百草园是专门玩乐的游乐场，忘了它是鲁迅家的园子
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:百行业为先，万恶懒为首
  type: Concept
  subject: 语文
  title: 百行业为先，万恶懒为首
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'行'读成xíng，应读háng，指行业、职业。
    - 能指出并纠正这一错误：误以为'百行业'是'百行'，写作文时漏掉'业'字，写成'百行为先'。
  aliases: []
  category: 名言警句
  explanation: 梁启超提出的观点，强调职业的重要性，懒惰是万恶之源。
  misconceptions:
    - 把'行'读成xíng，应读háng，指行业、职业。
    - 误以为'百行业'是'百行'，写作文时漏掉'业'字，写成'百行为先'。
    - 只强调'懒'是恶，却丢了'业'的正面意义，理解片面。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:益虫和益鸟
  type: Concept
  subject: 语文
  title: 益虫和益鸟
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 燕子、啄木鸟、青蛙、七星瓢虫都会捉害虫，是保护庄稼的好帮手。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C8/sections/S1.md
- id: concept:语文:直抒胸臆
  type: Concept
  subject: 语文
  title: 直抒胸臆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将直抒胸臆等同于大声喊叫，忽略内心情感的直接抒发方式。
    - 能指出并纠正这一错误：误以为借景物抒情也是直抒胸臆，如认为‘举头望明月’直接抒情。
  aliases:
    - 直接抒情
  category: 抒情方式
  explanation: 直接抒发内心情感，不借助其他手法，本文中作者大声呼告直接表达爱国之情。
  misconceptions:
    - 将直抒胸臆等同于大声喊叫，忽略内心情感的直接抒发方式。
    - 误以为借景物抒情也是直抒胸臆，如认为‘举头望明月’直接抒情。
    - 认为只有诗歌才有直抒胸臆，忽略散文中也可直接倾诉爱国之情。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:直接抒情
  type: Concept
  subject: 语文
  title: 直接抒情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘啊！黄河！你是中华民族的摇篮！’是间接抒情，因用了比喻
    - 能指出并纠正这一错误：把‘望黄河滚滚’这类景物描写归为直接抒情，实为间接抒情
  aliases:
    - 直抒胸臆
  category: 文学表现手法
  explanation: 直接抒情是作者或作品中人物直接抒发情感的方式，不借助其他事物。本诗主要采用直接抒情，如“啊！黄河！你是中华民族的摇篮！”等句。
  misconceptions:
    - 认为‘啊！黄河！你是中华民族的摇篮！’是间接抒情，因用了比喻
    - 把‘望黄河滚滚’这类景物描写归为直接抒情，实为间接抒情
    - 以为直接抒情必须用‘啊’‘我爱’等词，否则就不是
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:相公
  type: Concept
  subject: 语文
  title: 相公
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“相公”理解为“丈夫”，忽略旧时对士人尊称的语境。
    - 能指出并纠正这一错误：误写成“相功”，同音替代导致错字。
  aliases: []
  category: 古代称谓
  explanation: 旧时对士人的尊称。
  misconceptions:
    - 将“相公”理解为“丈夫”，忽略旧时对士人尊称的语境。
    - 误写成“相功”，同音替代导致错字。
    - 以为“相公”专指宰相，不知也用作一般士人尊称。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:相得益彰
  type: Concept
  subject: 语文
  title: 相得益彰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'彰'写成'章'，误作'相得益章'。
    - 能指出并纠正这一错误：误用为'互相配合使缺点更突出'，如'他的懒惰与她的勤奋相得益彰'。
  aliases: []
  category: 成语
  explanation: 指互相帮助，互相补充，更能显出各自的长处。
  misconceptions:
    - 把'彰'写成'章'，误作'相得益章'。
    - 误用为'互相配合使缺点更突出'，如'他的懒惰与她的勤奋相得益彰'。
    - 与'相辅相成'不加区分，忽略'更能显出各自长处'这一层。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:相见欢
  type: Concept
  subject: 语文
  title: 相见欢
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将作者朱敦儒误作李煜，因李煜也有《相见欢》。
    - 能指出并纠正这一错误：把“相见欢”的“欢”写成“观”或“还”。
  aliases: []
  category: 词牌名
  explanation: 词牌名，朱敦儒抒发爱国情怀之作。
  misconceptions:
    - 将作者朱敦儒误作李煜，因李煜也有《相见欢》。
    - 把“相见欢”的“欢”写成“观”或“还”。
    - 认为该词写的是儿女情长，实为忧国忧民。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:省略句
  type: Concept
  subject: 语文
  title: 省略句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为省略句就是句子缺成分，但不具体判断省略了主语还是宾语
    - 能指出并纠正这一错误：把省略句与倒装句混淆，如‘便要还家’误认为状语后置
  aliases: []
  category: 文言句式
  explanation: 文言文中省略主语、宾语或介词等成分的句子，如“便要还家”省略主语。
  misconceptions:
    - 认为省略句就是句子缺成分，但不具体判断省略了主语还是宾语
    - 把省略句与倒装句混淆，如‘便要还家’误认为状语后置
    - 不会补出省略内容，如‘一鼓作气，再而衰’不知省略‘鼓’
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:省略号的作用
  type: Concept
  subject: 语文
  title: 省略号的作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 省略号表示话没有说完、列举的省略或语意的延续。读句子时要体会省略号省去了什么内容。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:看图写故事
  type: Concept
  subject: 语文
  title: 看图写故事
  conceptType: 程序型
  aliases:
    - 看图写话
  category: 方法
  explanation: 先看清每幅图画了什么，再用"早上、过了一会儿、到了下午、天黑了"这样的时间词，按顺序把故事写清楚。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:看图写话
  type: Concept
  subject: 语文
  title: 看图写话
  conceptType: 程序型
  aliases:
    - 看图写故事
  category: 方法
  explanation: 先仔细看图，弄清图上有什么、在做什么，再想想接下来会怎样，和同学说一说后写下来。注意书写工整。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C7/sections/S4.md
- id: concept:语文:看图讲故事
  type: Concept
  subject: 语文
  title: 看图讲故事
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 先弄清每幅图的内容，再把几幅图连起来，按顺序把故事讲清楚。讲的时候认真听别人讲，判断他讲的是哪幅图。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:看客形象
  type: Concept
  subject: 语文
  title: 看客形象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“看客”理解为普通的观众或旁观者，忽略了冷漠麻木的特点。
    - 能指出并纠正这一错误：误认为鲁迅笔下的看客是正面形象，如认为是热心围观的群众。
  aliases:
    - 看客
  category: 文学知识
  explanation: 鲁迅笔下常见的冷漠、麻木的旁观者形象，反映国民劣根性。
  misconceptions:
    - 把“看客”理解为普通的观众或旁观者，忽略了冷漠麻木的特点。
    - 误认为鲁迅笔下的看客是正面形象，如认为是热心围观的群众。
    - 将“看客”与“阿Q”混同，说阿Q也是看客，但阿Q是自欺欺人的人物。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:瞄准
  type: Concept
  subject: 语文
  title: 瞄准
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“瞄准”的“瞄”写成“描”，如“描准”。
    - 能指出并纠正这一错误：误以为“瞄准”只能用于武器，说“目光瞄准前方”不对，其实也可指视线对准目标。
  aliases: []
  category: 词语
  explanation: 把视线、枪口等对准目标。
  misconceptions:
    - 把“瞄准”的“瞄”写成“描”，如“描准”。
    - 误以为“瞄准”只能用于武器，说“目光瞄准前方”不对，其实也可指视线对准目标。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:瞠目结舌
  type: Concept
  subject: 语文
  title: 瞠目结舌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘瞠目结舌’的‘瞠’读成táng，写作‘堂’
    - 能指出并纠正这一错误：将‘结舌’写作‘接舌’或‘结舍’
  aliases: []
  category: 成语
  explanation: 瞪着眼睛说不出话来，形容受窘或惊呆的样子。文中形容工程推进速度之快令人惊讶。
  misconceptions:
    - 把‘瞠目结舌’的‘瞠’读成táng，写作‘堂’
    - 将‘结舌’写作‘接舌’或‘结舍’
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:瞭高儿
  type: Concept
  subject: 语文
  title: 瞭高儿
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“瞭高儿”写作“了高儿”，丢掉“目”字旁。
    - 能指出并纠正这一错误：误认为是站在高处望风的人，实际是迎送客人、兼账房的服务员。
  aliases: []
  category: 文化常识
  explanation: 负责迎送客人、让座儿打招呼的职务，兼账房。
  misconceptions:
    - 误将“瞭高儿”写作“了高儿”，丢掉“目”字旁。
    - 误认为是站在高处望风的人，实际是迎送客人、兼账房的服务员。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:瞻仰
  type: Concept
  subject: 语文
  title: 瞻仰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘瞻仰’读成shàn yǎng，误将‘瞻’读作‘赡’。
    - 能指出并纠正这一错误：将‘瞻仰’写成‘赡仰’，与‘赡养’的‘赡’混淆。
  aliases: []
  category: 词语
  explanation: 怀着恭敬的心情仰望。
  misconceptions:
    - 把‘瞻仰’读成shàn yǎng，误将‘瞻’读作‘赡’。
    - 将‘瞻仰’写成‘赡仰’，与‘赡养’的‘赡’混淆。
    - 用‘瞻仰’表示随便看看，如‘我瞻仰了电视节目’，忽略恭敬严肃的意味。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:矗立
  type: Concept
  subject: 语文
  title: 矗立
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'矗'读成zhù，误同'直立'。
    - 能指出并纠正这一错误：写作'矗力'，误解为笔直地用力。
  aliases: []
  category: 词语
  explanation: 高耸地立着。
  misconceptions:
    - 将'矗'读成zhù，误同'直立'。
    - 写作'矗力'，误解为笔直地用力。
    - 用'矗立'形容人，如'他矗立在门口'，应改为'站立'。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:知之者不如好之者，好之者不如乐之者
  type: Concept
  subject: 语文
  title: 知之者不如好之者，好之者不如乐之者
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'好'读成hǎo，误作'好坏'的好，正确为hào，意为喜好。
    - 能指出并纠正这一错误：将作者记为孟子或荀子，实际是孔子。
  aliases: []
  category: 名言
  explanation: 孔子的话，强调兴趣和乐趣对于学习或做事的重要性。
  misconceptions:
    - 把'好'读成hǎo，误作'好坏'的好，正确为hào，意为喜好。
    - 将作者记为孟子或荀子，实际是孔子。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:知识性作品阅读方法
  type: Concept
  subject: 语文
  title: 知识性作品阅读方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：读知识性作品只记零散知识点，不梳理各部分的条理和层次
    - 能指出并纠正这一错误：认为观其大略就是只看开头结尾，忽略中间论证过程
  aliases: []
  category: 阅读方法
  explanation: 阅读知识性作品需观其大略、把握条理、了解知识系统。
  misconceptions:
    - 读知识性作品只记零散知识点，不梳理各部分的条理和层次
    - 认为观其大略就是只看开头结尾，忽略中间论证过程
    - 把知识性作品当作文学作品逐字赏析，不关注知识系统
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:短视频脚本创作
  type: Concept
  subject: 语文
  title: 短视频脚本创作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写短视频脚本只有画面描述，如‘拍一个人在走路’，缺少镜头序号、时长、景别等要素。
    - 能指出并纠正这一错误：把拍摄角度‘仰拍’当作景别填写，混淆了‘景别’与‘拍摄角度’概念。
  aliases: []
  category: 语文实践
  explanation: 短视频脚本包括镜头序号、时长、景别、镜头运动、画面内容、解说词、音乐等要素，用于指导视频制作。
  misconceptions:
    - 写短视频脚本只有画面描述，如‘拍一个人在走路’，缺少镜头序号、时长、景别等要素。
    - 把拍摄角度‘仰拍’当作景别填写，混淆了‘景别’与‘拍摄角度’概念。
    - 解说词与画面内容不符，如画面是夜晚却写解说词‘早晨阳光洒满大地’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S8.md
- id: concept:语文:石印
  type: Concept
  subject: 语文
  title: 石印
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“石印”写成“石映”或“石应”，字形混淆。
    - 能指出并纠正这一错误：认为石印就是在石头上刻字印刷，与雕版印刷混同。
  aliases: []
  category: 文化常识
  explanation: 一种平版印刷技术，利用多孔石质平版做印版进行印刷。文中何满子的父亲学徒学的是石印。
  misconceptions:
    - 把“石印”写成“石映”或“石应”，字形混淆。
    - 认为石印就是在石头上刻字印刷，与雕版印刷混同。
    - 误以为石印是用石头做的印章，用于盖章。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:石拱桥
  type: Concept
  subject: 语文
  title: 石拱桥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为石桥都是石拱桥，如平板石桥也叫石拱桥，忽略了桥洞成弧形的特征。
    - 能指出并纠正这一错误：以为桥洞必须是半圆，但概念只说弧形，弧形可以不是半圆。
  aliases:
    - 拱桥
  category: 说明对象
  explanation: 石拱桥是一种桥洞成弧形、形式优美且结构坚固的桥梁，在世界桥梁史上出现较早。
  misconceptions:
    - 认为石桥都是石拱桥，如平板石桥也叫石拱桥，忽略了桥洞成弧形的特征。
    - 以为桥洞必须是半圆，但概念只说弧形，弧形可以不是半圆。
    - 认为石拱桥仅中国有，实际上世界桥梁史上出现较早，其他国家也有。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:石敬瑭
  type: Concept
  subject: 语文
  title: 石敬瑭
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“敬瑭”写成“敬唐”或“敬塘”，字形字音错误。
    - 能指出并纠正这一错误：误认为石敬瑭是唐朝皇帝，或与石重贵混淆朝代。
  aliases: []
  category: 历史人物
  explanation: 五代时期后晋皇帝，曾向契丹称儿皇帝，割让燕云十六州。文中周檎骂殷汝耕是石敬瑭。
  misconceptions:
    - 把“敬瑭”写成“敬唐”或“敬塘”，字形字音错误。
    - 误认为石敬瑭是唐朝皇帝，或与石重贵混淆朝代。
    - 认为石敬瑭是民族英雄，因他建立了后晋，忽略了“儿皇帝”的屈辱。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:石炭纪
  type: Concept
  subject: 语文
  title: 石炭纪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“石炭纪”误写成“石碳纪”，混淆“炭”和“碳”。
    - 能指出并纠正这一错误：误以为石炭纪是“煤炭堆积的时期”仅限于此，忽略它属于古生代。
  aliases: []
  category: 科学知识
  explanation: 古生代的一个纪，约3.59亿年前至2.99亿年前，是煤形成的重要时期。
  misconceptions:
    - 将“石炭纪”误写成“石碳纪”，混淆“炭”和“碳”。
    - 误以为石炭纪是“煤炭堆积的时期”仅限于此，忽略它属于古生代。
    - 将“纪”与“记”混淆，写成“石炭记”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:破坏文化遗产的主要因素
  type: Concept
  subject: 语文
  title: 破坏文化遗产的主要因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只列举人为因素如战争、过度开发，忘记举例自然灾害如洪水、地震。
    - 能指出并纠正这一错误：将‘游客不文明行为’归为自然因素，实际属于人为因素。
  aliases:
    - 遗产破坏因素
  category: 文化保护知识
  explanation: 包括人为因素（战争、过度开发、游客不文明行为等）和非人为因素（洪水、风蚀、地震等自然灾害）。
  misconceptions:
    - 只列举人为因素如战争、过度开发，忘记举例自然灾害如洪水、地震。
    - 将‘游客不文明行为’归为自然因素，实际属于人为因素。
    - 误以为‘风蚀’是人为因素，实际属于非人为因素。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:砾岩
  type: Concept
  subject: 语文
  title: 砾岩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“砾岩”的“砾”误读为lè或shuò，正确读lì。
    - 能指出并纠正这一错误：误以为砾岩是光滑的石头，不知道它粗糙含鹅卵石。
  aliases: []
  category: 科学知识
  explanation: 一种包含鹅卵石的粗糙岩石，形成于陆地边缘。
  misconceptions:
    - 将“砾岩”的“砾”误读为lè或shuò，正确读lì。
    - 误以为砾岩是光滑的石头，不知道它粗糙含鹅卵石。
    - 将“砾”写成“栎”或“烁”，形近字混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:碑文
  type: Concept
  subject: 语文
  title: 碑文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为碑文是周总理起草、毛主席书写的，实际相反。
    - 能指出并纠正这一错误：记错碑文中的时间，将‘三年以来’说成抗日战争以来。
  aliases: []
  category: 文体
  explanation: 刻在碑上的文字，本文中为毛主席起草、周总理书写的三段式碑文，分别纪念三年以来、三十年以来和一千八百四十年以来牺牲的人民英雄。
  misconceptions:
    - 误认为碑文是周总理起草、毛主席书写的，实际相反。
    - 记错碑文中的时间，将‘三年以来’说成抗日战争以来。
    - 以为碑文只有一段，忽略三段分别纪念不同时期的英雄。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:碳中和
  type: Concept
  subject: 语文
  title: 碳中和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为碳中和是不排放二氧化碳，忽略了通过植树造林或技术抵消。
    - 能指出并纠正这一错误：将“碳中和”写成“碳中合”，混淆“和”与“合”。
  aliases: []
  category: 气候政策
  explanation: 指通过植树造林、节能减排等形式，抵消自身产生的二氧化碳排放，实现二氧化碳零排放。
  misconceptions:
    - 误认为碳中和是不排放二氧化碳，忽略了通过植树造林或技术抵消。
    - 将“碳中和”写成“碳中合”，混淆“和”与“合”。
    - 把“碳中和”与“碳达峰”混为一谈，认为两者相同。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:碳达峰
  type: Concept
  subject: 语文
  title: 碳达峰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为碳达峰是碳排放达到最高值后立刻持续下降，忽略平台期。
    - 能指出并纠正这一错误：将“峰”误写成“锋”，用错形近字。
  aliases: []
  category: 气候政策
  explanation: 指二氧化碳排放量达到历史最高值后，经历平台期进入持续下降的过程。
  misconceptions:
    - 误认为碳达峰是碳排放达到最高值后立刻持续下降，忽略平台期。
    - 将“峰”误写成“锋”，用错形近字。
    - 认为碳达峰就是碳中和，不理解两者先后关系。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:礼貌用语
  type: Concept
  subject: 语文
  title: 礼貌用语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“家父”用于对方父亲，说出“你家父”，误用谦辞为敬辞。
    - 能指出并纠正这一错误：说自己“明天光临你家”，光临只用于对方到来，自己应用“拜访”。
  aliases:
    - 敬辞
    - 谦辞
  category: 语言知识
  explanation: 恰当使用敬辞和谦辞，如“拜访”“光临”“令尊”“家父”等，以体现礼貌和尊重。
  misconceptions:
    - 把“家父”用于对方父亲，说出“你家父”，误用谦辞为敬辞。
    - 说自己“明天光临你家”，光临只用于对方到来，自己应用“拜访”。
    - 误用“惠存”为保存，如“请惠存我的书”，应为“请惠存”表敬请保存。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:社会环境描写
  type: Concept
  subject: 语文
  title: 社会环境描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘天气阴沉’等自然环境描写当成社会环境描写
    - 能指出并纠正这一错误：认为社会环境描写只包括时代背景，忽略生活场景和人际关系
  aliases:
    - 背景描写
  category: 文学知识
  explanation: 通过描写人物所处的时代背景、生活场景等，揭示人物性格和命运的社会根源。
  misconceptions:
    - 把‘天气阴沉’等自然环境描写当成社会环境描写
    - 认为社会环境描写只包括时代背景，忽略生活场景和人际关系
    - 误以为社会环境描写只能揭示时代灾难，不能表现乡土人情
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:社戏
  type: Concept
  subject: 语文
  title: 社戏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“社戏”的“社”误写成“射戏”。
    - 能指出并纠正这一错误：认为“社戏”指社会上的戏剧，与祭祀无关。
  aliases:
    - 年规戏
  category: 文学常识
  explanation: 社戏是中国农村举行祭祀或节庆活动时所演的戏，在江南尤为盛行。
  misconceptions:
    - 将“社戏”的“社”误写成“射戏”。
    - 认为“社戏”指社会上的戏剧，与祭祀无关。
    - 误记《社戏》作者为沈从文，实为鲁迅。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:祈使句
  type: Concept
  subject: 语文
  title: 祈使句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把‘请勿触摸’当感叹句，实际它是表禁止的祈使句。
    - 能指出并纠正这一错误：认为祈使句只能表示命令，忘了还有请求、催促等语气。
  aliases: []
  category: 语法知识
  explanation: 用于要求别人做什么或不做什么的句子，有命令、请求、催促、劝说等语气。
  misconceptions:
    - 误把‘请勿触摸’当感叹句，实际它是表禁止的祈使句。
    - 认为祈使句只能表示命令，忘了还有请求、催促等语气。
    - 将‘你过来一下。’标点为句号就认为不是祈使句，忽略语调的作用。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:神棚
  type: Concept
  subject: 语文
  title: 神棚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“神棚”写成“神篷”，误用“篷”字。
    - 能指出并纠正这一错误：误以为神棚是演戏舞台，忽略供奉神像的作用。
  aliases: []
  category: 词语
  explanation: 演戏时搭的供奉神像的棚。
  misconceptions:
    - 把“神棚”写成“神篷”，误用“篷”字。
    - 误以为神棚是演戏舞台，忽略供奉神像的作用。
    - 认为神棚是神仙住的居所，而非临时搭的棚。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:神舟九号与天宫一号对接
  type: Concept
  subject: 语文
  title: 神舟九号与天宫一号对接
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把神舟九号对接说成自动对接，实际是手控交会对接。
    - 能指出并纠正这一错误：将对接时间记成2011年或2013年，忘了2012年6月24日。
  aliases: []
  category: 史实
  explanation: 2012年6月24日实现手控交会对接，与蛟龙号深潜同日进行。
  misconceptions:
    - 误把神舟九号对接说成自动对接，实际是手控交会对接。
    - 将对接时间记成2011年或2013年，忘了2012年6月24日。
    - 误以为神舟九号是第一艘与天宫一号对接的飞船，实际是神舟八号先自动对接。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:神舟九号与天宫一号手控交会对接
  type: Concept
  subject: 语文
  title: 神舟九号与天宫一号手控交会对接
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将手控交会对接写成自动交会对接，忽略“手控”二字。
    - 能指出并纠正这一错误：误以为与蛟龙号深潜是同一天，但记成是2013年。
  aliases: []
  category: 史实
  explanation: 2012年6月24日实现，与蛟龙号深潜同日，创造“上天入海”奇迹。
  misconceptions:
    - 误将手控交会对接写成自动交会对接，忽略“手控”二字。
    - 误以为与蛟龙号深潜是同一天，但记成是2013年。
    - 认为手控对接是航天员完全手动操作，无需自动系统辅助。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:神舟五号载人飞船
  type: Concept
  subject: 语文
  title: 神舟五号载人飞船
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为神舟五号搭载了多名航天员，实际仅杨利伟一人。
    - 能指出并纠正这一错误：将神舟五号发射时间记成2005年，实为2003年10月15日。
  aliases:
    - 神舟五号
  category: 史实
  explanation: 2003年10月15日发射升空，杨利伟成为我国第一位进入太空的航天员。
  misconceptions:
    - 误以为神舟五号搭载了多名航天员，实际仅杨利伟一人。
    - 将神舟五号发射时间记成2005年，实为2003年10月15日。
    - 误说神舟五号完成了太空行走，实际是神舟七号。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:神话
  type: Concept
  subject: 语文
  title: 神话
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把神话与迷信画等号，认为神话是欺骗人的谎话。
    - 能指出并纠正这一错误：误以为神话是真实历史的记录，忽略其幻想色彩。
  aliases: []
  category: 文学体裁
  explanation: 神话是古代人民对自然现象和社会生活的一种天真的解释和美丽的向往，具有浓厚的幻想色彩。
  misconceptions:
    - 把神话与迷信画等号，认为神话是欺骗人的谎话。
    - 误以为神话是真实历史的记录，忽略其幻想色彩。
    - 将神话和童话混为一谈，认为神话也是儿童文学的一种。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:神话传说
  type: Concept
  subject: 语文
  title: 神话传说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把神话传说当作真实历史，认为“昔人”实有其人。
    - 能指出并纠正这一错误：认为诗歌引用神话传说是迷信，没有浪漫色彩。
  aliases: []
  category: 文学常识
  explanation: 神话传说是古代人民对自然现象和社会生活的想象和解释，常被诗人引用以增强作品的浪漫色彩。
  misconceptions:
    - 误把神话传说当作真实历史，认为“昔人”实有其人。
    - 认为诗歌引用神话传说是迷信，没有浪漫色彩。
    - 将神话与寓言混为一谈，如把“精卫填海”当作寓言故事。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:祥子
  type: Concept
  subject: 语文
  title: 祥子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为祥子是北京土著，忘了他来自农村
    - 能指出并纠正这一错误：把祥子当作《茶馆》或《四世同堂》中的人物
  aliases:
    - 骆驼祥子
  category: 人物形象
  explanation: 《骆驼祥子》的主人公，一个从农村到城市拉洋车的青年，经历三起三落后走向堕落。
  misconceptions:
    - 误以为祥子是北京土著，忘了他来自农村
    - 把祥子当作《茶馆》或《四世同堂》中的人物
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:福聚德
  type: Concept
  subject: 语文
  title: 福聚德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“福聚德”写作“福具德”或“福剧德”，音同形异。
    - 能指出并纠正这一错误：误以为福聚德是真实存在的老字号，实际是剧中虚构场景。
  aliases: []
  category: 文化常识
  explanation: 剧中老字号烤鸭店，是故事的主要场景，象征传统商业的兴衰。
  misconceptions:
    - 误将“福聚德”写作“福具德”或“福剧德”，音同形异。
    - 误以为福聚德是真实存在的老字号，实际是剧中虚构场景。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:离析
  type: Concept
  subject: 语文
  title: 离析
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'离析'写成'离淅'或'离晰'，字形混淆。
    - 能指出并纠正这一错误：误以为离析是化学变化，实际上是从混合物中分离物质的物理方法。
  aliases: []
  category: 科学知识
  explanation: 离析指从混合物中分离出某种物质的方法。本文指从矿石中提取镭的过程。
  misconceptions:
    - 将'离析'写成'离淅'或'离晰'，字形混淆。
    - 误以为离析是化学变化，实际上是从混合物中分离物质的物理方法。
    - 把离析与过滤、蒸馏混为一谈，不知离析特指从矿石等中提取成分。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:私塾
  type: Concept
  subject: 语文
  title: 私塾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“私塾”写成“私熟”或“私孰”
    - 能指出并纠正这一错误：误认为私塾是政府办的公立学校
  aliases:
    - 书塾
  category: 文化常识
  explanation: 旧时家庭、宗族或教师自己设立的教学场所，如三味书屋。
  misconceptions:
    - 把“私塾”写成“私熟”或“私孰”
    - 误认为私塾是政府办的公立学校
    - 以为私塾先生古代才有，现在没有
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:科举制度
  type: Concept
  subject: 语文
  title: 科举制度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为科举考试的级别顺序是“院试—会试—乡试—殿试”，把乡试和会试顺序搞反
    - 能指出并纠正这一错误：认为状元、榜眼、探花是科举的固定层级，而非殿试前三名
  aliases: []
  category: 文化常识
  explanation: 中国古代通过考试选拔官吏的制度，明清时期有秀才、举人、进士等层级。
  misconceptions:
    - 以为科举考试的级别顺序是“院试—会试—乡试—殿试”，把乡试和会试顺序搞反
    - 认为状元、榜眼、探花是科举的固定层级，而非殿试前三名
    - 以为范进中举后就能直接当官，忽略还需参加会试和殿试
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:科学精神
  type: Concept
  subject: 语文
  title: 科学精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“科技成就”当作“科学精神”，如写“钱学森领导研制导弹”这一成就，而未提炼出奉献精神。
    - 能指出并纠正这一错误：认为科学精神只属于科学家，普通人严谨求知的态度不叫科学精神。
  aliases: []
  category: 核心素养
  explanation: 科技工作者在科学探索中体现出的求真务实、勇于创新、团结协作等精神品质。
  misconceptions:
    - 误将“科技成就”当作“科学精神”，如写“钱学森领导研制导弹”这一成就，而未提炼出奉献精神。
    - 认为科学精神只属于科学家，普通人严谨求知的态度不叫科学精神。
    - 将“求真务实”误写为“求珍务实”，音近字错误。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:科幻作品特点
  type: Concept
  subject: 语文
  title: 科幻作品特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为科幻小说等于奇幻/魔幻小说，看到会飞的龙、精灵就归类为科幻。
    - 能指出并纠正这一错误：把科幻作品当科普书阅读，只关注其中的科学知识，忽视其想象与人文思考。
  aliases:
    - 科幻小说特点
  category: 文学知识
  explanation: 科幻作品以科学为基础，融合想象与预测，探讨人与科学、自然的关系。
  misconceptions:
    - 认为科幻小说等于奇幻/魔幻小说，看到会飞的龙、精灵就归类为科幻。
    - 把科幻作品当科普书阅读，只关注其中的科学知识，忽视其想象与人文思考。
    - 反对“所有科幻都有机器人”，但也误以为科幻必须出现外星人或宇宙飞船。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:科幻小说
  type: Concept
  subject: 语文
  title: 科幻小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《西游记》当作科幻小说，实际是神魔小说。
    - 能指出并纠正这一错误：认为科幻小说必须完全符合科学事实，忽略其幻想性。
  aliases: []
  category: 文学体裁
  explanation: 科幻小说是以科学幻想为内容的小说体裁，常以科学设定为线索展开故事，寄托对人性、生命等主题的思考。
  misconceptions:
    - 把《西游记》当作科幻小说，实际是神魔小说。
    - 认为科幻小说必须完全符合科学事实，忽略其幻想性。
    - 把科幻小说等同于科普读物，认为它旨在传授科学知识。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:科技工作者画像
  type: Concept
  subject: 语文
  title: 科技工作者画像
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：照抄新闻报道原文，不加提取概括，看不出学生自己的人物画像。
    - 能指出并纠正这一错误：混淆“大事年表”与“科学成就”，把科研获奖当大事年表，忽略早年求学等经历。
  aliases:
    - 为探索者画像
  category: 写作方法
  explanation: 通过提取新闻报道、传记等资料中的关键信息，用文字描绘科技工作者的形象，可包括大事年表、主要经历或科学精神分析。
  misconceptions:
    - 照抄新闻报道原文，不加提取概括，看不出学生自己的人物画像。
    - 混淆“大事年表”与“科学成就”，把科研获奖当大事年表，忽略早年求学等经历。
    - 分析科学精神时只会用“坚持不懈”等套话，不能结合具体事例展开（如举两弹一星元勋的具体细节）。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:科技成就
  type: Concept
  subject: 语文
  title: 科技成就
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“神舟”系列飞船写为“嫦娥”系列，张冠李戴航天工程名。
    - 能指出并纠正这一错误：误将文学作品获奖（如莫言获诺贝尔文学奖）当作科技成就。
  aliases:
    - 科技成果
  category: 主题概念
  explanation: 指科学技术领域取得的重大成果和突破，包括航空航天、深海探测、数字通信等领域的成就。
  misconceptions:
    - 把“神舟”系列飞船写为“嫦娥”系列，张冠李戴航天工程名。
    - 误将文学作品获奖（如莫言获诺贝尔文学奖）当作科技成就。
    - 认为只有“世界第一”才算科技成就，忽略重要的科技发展进步。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S5.md
- id: concept:语文:秩秩斯干幽幽南山
  type: Concept
  subject: 语文
  title: 秩秩斯干幽幽南山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“干”误读为gān并解释为树干，应为jiàn即涧。
    - 能指出并纠正这一错误：误记出处为《诗经·大雅》，实际是小雅·斯干。
  aliases: []
  category: 文言诗句
  explanation: 语出《诗经·小雅·斯干》，意思是潺潺的山涧水，深远的南山。
  misconceptions:
    - 将“干”误读为gān并解释为树干，应为jiàn即涧。
    - 误记出处为《诗经·大雅》，实际是小雅·斯干。
    - 把“秩秩”写成“失失”，音近字混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:移步换景
  type: Concept
  subject: 语文
  title: 移步换景
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为移步换景是景随人动，实际是随游踪变化写景。
    - 能指出并纠正这一错误：把移步换景等同于定点观察，只写一处景色。
  aliases: []
  category: 写作手法
  explanation: 游记中随着游踪变化描写不同景物的手法，使文章层次清晰。
  misconceptions:
    - 误以为移步换景是景随人动，实际是随游踪变化写景。
    - 把移步换景等同于定点观察，只写一处景色。
    - 将“移步换景”写成“移步换影”，同音字混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:空巢老人
  type: Concept
  subject: 语文
  title: 空巢老人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“空巢”写作“空朝”，混淆“巢”与“朝”。
    - 能指出并纠正这一错误：误认为空巢老人指无儿无女的老人，实际是子女离家的老人。
  aliases: []
  category: 社会现象
  explanation: 指子女离家后独居或与配偶共同生活的老年人，常缺乏子女陪伴。
  misconceptions:
    - 误将“空巢”写作“空朝”，混淆“巢”与“朝”。
    - 误认为空巢老人指无儿无女的老人，实际是子女离家的老人。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:空间顺序
  type: Concept
  subject: 语文
  title: 空间顺序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把本文的说明顺序判断为时间顺序，实际是从远到近、从整体到局部的空间顺序。
    - 能指出并纠正这一错误：认为空间顺序必须从高到低，不理解本文从远到近、从整体到局部也是空间顺序。
  aliases: []
  category: 写作手法
  explanation: 按照空间位置依次说明事物的顺序，本文从远到近、从整体到局部、从碑身到浮雕进行介绍。
  misconceptions:
    - 把本文的说明顺序判断为时间顺序，实际是从远到近、从整体到局部的空间顺序。
    - 认为空间顺序必须从高到低，不理解本文从远到近、从整体到局部也是空间顺序。
    - 混淆空间顺序与逻辑顺序，将‘从碑身到浮雕’误认为逻辑顺序。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:穿井得一人
  type: Concept
  subject: 语文
  title: 穿井得一人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘穿井’理解为‘穿过井’，实际应为‘挖掘水井’
    - 能指出并纠正这一错误：把‘得一人’误解为‘挖出一个人’，实为‘得到一个人的劳力’
  aliases: []
  category: 寓言故事
  explanation: 告诫人们不要轻信传言，要调查研究，出自《吕氏春秋》。
  misconceptions:
    - 把‘穿井’理解为‘穿过井’，实际应为‘挖掘水井’
    - 把‘得一人’误解为‘挖出一个人’，实为‘得到一个人的劳力’
    - 将出处《吕氏春秋》错记为《列子》或《山海经》
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:窗棂
  type: Concept
  subject: 语文
  title: 窗棂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'棂'读成lín，写作'窗棱'，正确读líng。
    - 能指出并纠正这一错误：写作'窗欞'或'窗楞'，误以为与木条有关。
  aliases: []
  category: 词语
  explanation: 窗格子。
  misconceptions:
    - 把'棂'读成lín，写作'窗棱'，正确读líng。
    - 写作'窗欞'或'窗楞'，误以为与木条有关。
    - 将'窗棂'理解为窗户上的窗帘或玻璃，实际是窗格子。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:立意
  type: Concept
  subject: 语文
  title: 立意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把立意等同于标题，认为“我们是一家人”就是中心思想，不再挖掘深层意义。
    - 能指出并纠正这一错误：作文立意泛泛而谈“家庭温暖”，没有紧扣“一家人”体现的亲情可贵，甚至跑题去写学校班级。
  aliases:
    - 中心思想
  category: 写作知识
  explanation: 立意是文章的中心思想，是写作的核心。本文要求以“我们是一家人”为题，围绕家庭温暖、亲情可贵进行立意。
  misconceptions:
    - 把立意等同于标题，认为“我们是一家人”就是中心思想，不再挖掘深层意义。
    - 作文立意泛泛而谈“家庭温暖”，没有紧扣“一家人”体现的亲情可贵，甚至跑题去写学校班级。
    - 误以为立意可以凭空想象，不结合生活实际，导致文章虚假。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:章回体小说
  type: Concept
  subject: 语文
  title: 章回体小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为章回体小说每回故事完全独立，可任意跳读，忽略其连贯性
    - 能指出并纠正这一错误：把笔记小说也归入章回体，如称《聊斋志异》是章回体小说
  aliases: []
  category: 文学体裁
  explanation: 中国古代长篇小说的一种形式，分回标目，每回故事相对独立又相互连贯。
  misconceptions:
    - 认为章回体小说每回故事完全独立，可任意跳读，忽略其连贯性
    - 把笔记小说也归入章回体，如称《聊斋志异》是章回体小说
    - 混淆“回目”和“题目”，以为每回的标题可以随意更换
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:童话
  type: Concept
  subject: 语文
  title: 童话
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为童话等同于寓言，忽视童话重在想象和趣味。
    - 能指出并纠正这一错误：认为童话只适合儿童阅读，成年人不能有所收获。
  aliases: []
  category: 文学体裁
  explanation: 童话是儿童文学的一种，通过丰富的想象、幻想和夸张来塑造形象，反映生活，对儿童进行思想教育。
  misconceptions:
    - 误以为童话等同于寓言，忽视童话重在想象和趣味。
    - 认为童话只适合儿童阅读，成年人不能有所收获。
    - 把童话与神话混为一谈，以为所有幻想故事都是童话。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:童谣
  type: Concept
  subject: 语文
  title: 童谣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“童谣”写作“童遥”，混淆“谣”与“遥”。
    - 能指出并纠正这一错误：误认为童谣都是由儿童自己创作的，实际多为成人编写流传。
  aliases:
    - 儿歌
  category: 文学体裁
  explanation: 流传于儿童之间的歌谣，语言简单，节奏明快，常反映儿童生活或民间习俗。
  misconceptions:
    - 误将“童谣”写作“童遥”，混淆“谣”与“遥”。
    - 误认为童谣都是由儿童自己创作的，实际多为成人编写流传。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:端午节
  type: Concept
  subject: 语文
  title: 端午节
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 农历五月初五是端午节，人们煮粽子、吃粽子，传说是为了纪念爱国诗人屈原。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:笔记小说
  type: Concept
  subject: 语文
  title: 笔记小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为笔记小说就是用白话写的日记，如把《世说新语》当成古人的日记
    - 能指出并纠正这一错误：混淆笔记小说和章回体，以为《儒林外史》是笔记小说
  aliases: []
  category: 文学体裁
  explanation: 一种以简洁笔法记录见闻、人物言行的文言小说形式，篇幅短小，注重传神。
  misconceptions:
    - 认为笔记小说就是用白话写的日记，如把《世说新语》当成古人的日记
    - 混淆笔记小说和章回体，以为《儒林外史》是笔记小说
    - 以为笔记小说篇幅一定很长，看到短篇就否定其小说身份
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:笔顺规则
  type: Concept
  subject: 语文
  title: 笔顺规则
  conceptType: 程序型
  aliases: []
  category: 法则
  explanation: 写汉字要按一定的顺序一笔一笔写。比如先写横再写竖，先写撇再写捺，按顺序写又快又好。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:第一人称叙述
  type: Concept
  subject: 语文
  title: 第一人称叙述
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为第一人称叙述中的‘我’一定是作者本人，读小说时也这样理解。
    - 能指出并纠正这一错误：把本文中的‘我’当成读者自己，其实‘我’是以作者魏巍的身份在叙述。
  aliases: []
  category: 写作手法
  explanation: 以“我”的口吻叙述，增强真实感和亲切感，便于直接抒发感情。本文以“我”的见闻和感受展开叙述。
  misconceptions:
    - 误以为第一人称叙述中的‘我’一定是作者本人，读小说时也这样理解。
    - 把本文中的‘我’当成读者自己，其实‘我’是以作者魏巍的身份在叙述。
    - 认为第一人称叙述只能写自己的事，不能写所见所闻的他人事迹。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:第四纪冰期
  type: Concept
  subject: 语文
  title: 第四纪冰期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“第四纪”是“第四个季节”，而不是地质年代。
    - 能指出并纠正这一错误：将“纪”误写为“记”，或把“冰期”写成“冰其”。
  aliases:
    - 第四纪冰河时期
  category: 科学知识
  explanation: 地球历史上最近的一次大冰期，约80万年前至1万年前，气候寒冷，冰川广布。
  misconceptions:
    - 误以为“第四纪”是“第四个季节”，而不是地质年代。
    - 将“纪”误写为“记”，或把“冰期”写成“冰其”。
    - 认为第四纪冰期是唯一的冰期，不知道地球历史上曾多次发生冰期。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:筛选问题
  type: Concept
  subject: 语文
  title: 筛选问题
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 阅读中产生的问题很多，要学会筛选：有的问题不影响理解课文，有的能帮助理解内容，有的能引发深入思考。选出对理解课文最有帮助的问题来思考。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:简·爱
  type: Concept
  subject: 语文
  title: 简·爱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《简·爱》的作者误记为艾米莉·勃朗特，实际是夏洛蒂。
    - 能指出并纠正这一错误：认为简·爱是法国作家雨果笔下的人物。
  aliases:
    - Jane Eyre
  category: 文学常识
  explanation: 夏洛蒂·勃朗特代表作，塑造了追求独立人格与尊严的女性形象。
  misconceptions:
    - 将《简·爱》的作者误记为艾米莉·勃朗特，实际是夏洛蒂。
    - 认为简·爱是法国作家雨果笔下的人物。
    - 把《简·爱》当作长诗或自传，忽视其小说体裁。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:简·爱形象
  type: Concept
  subject: 语文
  title: 简·爱形象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为简·爱最后放弃爱情，实际她坚持独立又获得爱情。
    - 能指出并纠正这一错误：误以为简·爱始终逆来顺受，忽视她对不公的反抗。
  aliases:
    - Jane Eyre
  category: 人物形象
  explanation: 简·爱是追求人格独立、爱情和尊严的女性形象，具有自尊和反抗精神。
  misconceptions:
    - 认为简·爱最后放弃爱情，实际她坚持独立又获得爱情。
    - 误以为简·爱始终逆来顺受，忽视她对不公的反抗。
    - 把简·爱等同于灰姑娘式柔弱女孩，忽略其自尊与独立。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:管鲍之交
  type: Concept
  subject: 语文
  title: 管鲍之交
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“管鲍之交”说成是“管仲和鲍叔牙”互相对立，或者误记鲍叔牙是管仲的敌人。
    - 能指出并纠正这一错误：误以为鲍叔牙让位给管仲，实则是鲍叔牙推荐管仲为相，不是让位。
  aliases:
    - 管鲍之谊
  category: 历史典故
  explanation: 指管仲和鲍叔牙之间的深厚友谊，鲍叔牙知人善任，推荐管仲为相，体现了朋友间的信任与举荐。
  misconceptions:
    - 把“管鲍之交”说成是“管仲和鲍叔牙”互相对立，或者误记鲍叔牙是管仲的敌人。
    - 误以为鲍叔牙让位给管仲，实则是鲍叔牙推荐管仲为相，不是让位。
    - 将“管鲍”误写为“管饱”或“管包”，字形错误。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:箪食壶浆
  type: Concept
  subject: 语文
  title: 箪食壶浆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“箪”误写为“单”或“殚”，如写成“单食壶浆”
    - 能指出并纠正这一错误：以为“浆”是米汤或豆浆，不知道这里指酒水
  aliases: []
  category: 成语
  explanation: 用箪盛饭，用壶盛浆，形容百姓欢迎犒劳军队。
  misconceptions:
    - 把“箪”误写为“单”或“殚”，如写成“单食壶浆”
    - 以为“浆”是米汤或豆浆，不知道这里指酒水
    - 误用为形容百姓送食物给官员，而非犒劳军队
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:箭扣长城修缮
  type: Concept
  subject: 语文
  title: 箭扣长城修缮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为修缮长城就是完全重建，忽略‘修缮、考古、研究并重’原则。
    - 能指出并纠正这一错误：误将‘箭扣’写为‘剑扣’或‘箭扣’，用字混淆。
  aliases:
    - 研究性修缮
  category: 遗产保护实践
  explanation: 北京箭扣长城修缮引入考古环节，坚持修缮、考古、研究并重，并运用数字化技术、智能传感器等监测，形成可推广的经验。
  misconceptions:
    - 认为修缮长城就是完全重建，忽略‘修缮、考古、研究并重’原则。
    - 误将‘箭扣’写为‘剑扣’或‘箭扣’，用字混淆。
    - 以为修缮只靠传统工艺，没意识到运用数字化技术和智能传感器。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:类比
  type: Concept
  subject: 语文
  title: 类比
  conceptType: 推理型
  masteryCriteria:
    - 能指出并纠正这一错误：把类比误认为比喻，分析《爱莲说》时称“菊、牡丹、莲”是打比方
    - 能指出并纠正这一错误：把类比与对比混淆，认为菊和牡丹是对比而非类比
  aliases: []
  category: 修辞手法
  explanation: 根据两种事物在某些特征上的相似，推出它们在其他特征上也可能相似的推理方法。
  misconceptions:
    - 把类比误认为比喻，分析《爱莲说》时称“菊、牡丹、莲”是打比方
    - 把类比与对比混淆，认为菊和牡丹是对比而非类比
    - 误认为类比是一种修辞手法，与比喻、拟人并列
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:类比论证
  type: Concept
  subject: 语文
  title: 类比论证
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把类比论证和比喻论证混为一谈，如说“鱼与熊掌”是比喻。
    - 能指出并纠正这一错误：认为类比论证只用于说明事物相似，不用于证明论点。
  aliases:
    - 类比说理
  category: 论证方法
  explanation: 通过类似事物的比较来证明论点的方法，如以鱼与熊掌类比生与义。
  misconceptions:
    - 把类比论证和比喻论证混为一谈，如说“鱼与熊掌”是比喻。
    - 认为类比论证只用于说明事物相似，不用于证明论点。
    - 误将“类比”写成“类此”，或认为类比就是举例论证。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:精神小屋
  type: Concept
  subject: 语文
  title: 精神小屋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'精神小屋'就是'精神的三间小屋'，将两者混为一谈。
    - 能指出并纠正这一错误：把作者记为冰心，实际是毕淑敏。
  aliases:
    - 三间小屋
  category: 文学概念
  explanation: 毕淑敏在文中提出的比喻，指人的精神世界需要安放情感、事业和自身三个空间。
  misconceptions:
    - 认为'精神小屋'就是'精神的三间小屋'，将两者混为一谈。
    - 把作者记为冰心，实际是毕淑敏。
    - 写作时把'精神小屋'当作实指的房子，忽略其比喻意义。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:精神的三间小屋
  type: Concept
  subject: 语文
  title: 精神的三间小屋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记错三间小屋的内容，误写为'亲情、友情、爱情'，实际是'爱恨、事业、自身'。
    - 能指出并纠正这一错误：将'精神的三间小屋'与'精神小屋'等同，认为每间小屋各有三间。
  aliases: []
  category: 文章内容
  explanation: 毕淑敏提出的比喻，指人的心灵需要空间，分为三间：盛放爱恨、事业、自身。
  misconceptions:
    - 记错三间小屋的内容，误写为'亲情、友情、爱情'，实际是'爱恨、事业、自身'。
    - 将'精神的三间小屋'与'精神小屋'等同，认为每间小屋各有三间。
    - 作者张冠李戴，误记为'林清玄'，实际是毕淑敏。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:精读
  type: Concept
  subject: 语文
  title: 精读
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：精读时只查字音字形，不思考词句在语境中的含义，如把“亡羊补牢”的“亡”解释为死亡。
    - 能指出并纠正这一错误：精读只找出修辞手法，不分析表达效果，如只说“用了比喻”却不说明喻什么情感。
  aliases:
    - 细读
  category: 阅读方法
  explanation: 一种深入细致的阅读方法，旨在全面理解文本内容、结构、语言和深层含义。
  misconceptions:
    - 精读时只查字音字形，不思考词句在语境中的含义，如把“亡羊补牢”的“亡”解释为死亡。
    - 精读只找出修辞手法，不分析表达效果，如只说“用了比喻”却不说明喻什么情感。
    - 精读过度抠字眼，脱离整体，如因某词多义而误解全文主旨。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:精读和跳读
  type: Concept
  subject: 语文
  title: 精读和跳读
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“跳读”等同于随意翻书，以为可以不读任何内容，实际是有选择地跳过。
    - 能指出并纠正这一错误：认为“精读”就是逐字读，忽略抓重点，实际需品读关键情节和语言。
  aliases: []
  category: 阅读方法
  explanation: 阅读《西游记》时，可以结合精读和跳读，精读感受情节和想象，跳读略过不感兴趣的内容。
  misconceptions:
    - 把“跳读”等同于随意翻书，以为可以不读任何内容，实际是有选择地跳过。
    - 认为“精读”就是逐字读，忽略抓重点，实际需品读关键情节和语言。
    - 误以为跳读不需要任何依据，实际应结合阅读目的选择跳读内容。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:素材整理
  type: Concept
  subject: 语文
  title: 素材整理
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把采访记录原封不动照抄进新闻稿，未核实数据、人名等关键信息
    - 能指出并纠正这一错误：整理素材时只挑有趣内容，忽略能说明主题的典型细节
  aliases: []
  category: 新闻活动
  explanation: 素材整理是采访结束后对素材进行梳理、去粗存精、核实关键信息的过程，为新闻写作做准备。
  misconceptions:
    - 把采访记录原封不动照抄进新闻稿，未核实数据、人名等关键信息
    - 整理素材时只挑有趣内容，忽略能说明主题的典型细节
    - 认为素材越多越好，不做取舍，导致新闻重点不突出
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:红军精神
  type: Concept
  subject: 语文
  title: 红军精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将红军精神仅概括为“不怕牺牲”，忽略革命乐观主义精神
    - 能指出并纠正这一错误：把红军精神与长征精神完全等同，忽视本文中克服具体困难的表现
  aliases:
    - 长征精神
  category: 思想
  explanation: 红军在翻越老山界时克服困难，体现了坚强的意志和革命乐观主义精神。
  misconceptions:
    - 将红军精神仅概括为“不怕牺牲”，忽略革命乐观主义精神
    - 把红军精神与长征精神完全等同，忽视本文中克服具体困难的表现
    - 认为红军精神只体现在翻山过程中，忽视与瑶民交往等细节
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:纪传体通史
  type: Concept
  subject: 语文
  title: 纪传体通史
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为纪传体是以时间顺序编排史事（实为编年体特点）。
    - 能指出并纠正这一错误：误以为‘通史’就是只记载一个朝代，实际是贯通多个朝代。
  aliases:
    - 纪传体
  category: 文学常识
  explanation: 以人物传记为中心叙述史实的史书体裁，通史指贯通古今的史书。《史记》是我国第一部纪传体通史。
  misconceptions:
    - 认为纪传体是以时间顺序编排史事（实为编年体特点）。
    - 误以为‘通史’就是只记载一个朝代，实际是贯通多个朝代。
    - 把《史记》说成断代史，或把《汉书》说成通史。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:纬度
  type: Concept
  subject: 语文
  title: 纬度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘纬度’写成‘维度’，‘纬’字少绞丝旁
    - 能指出并纠正这一错误：认为越往北桃花开得越早，实际应越迟，方向记反
  aliases: []
  category: 地理概念
  explanation: 影响物候现象的第一个因素，越往北桃花开得越迟，候鸟来得越晚。
  misconceptions:
    - 误将‘纬度’写成‘维度’，‘纬’字少绞丝旁
    - 认为越往北桃花开得越早，实际应越迟，方向记反
    - 把纬度对物候的影响说成‘越往东越迟’，与经度混淆
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:纬度对物候的影响
  type: Concept
  subject: 语文
  title: 纬度对物候的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为南北物候差异日数全年相同，忽略因季节而不同
    - 能指出并纠正这一错误：将‘首要因素’误写成‘主要因素’，削弱了程度
  aliases: []
  category: 科学原理
  explanation: 纬度是影响物候现象来临的首要因素，越往北桃花开得越迟，候鸟来得越晚，且南北差异的日数因季节而不同。
  misconceptions:
    - 误以为南北物候差异日数全年相同，忽略因季节而不同
    - 将‘首要因素’误写成‘主要因素’，削弱了程度
    - 认为候鸟来得晚是因为北方更暖，颠倒了因果
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:纳兰性德
  type: Concept
  subject: 语文
  title: 纳兰性德
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为纳兰性德是唐代诗人，或与李白、杜甫同时代。
    - 能指出并纠正这一错误：把“纳兰性德”写成“纳南性德”，或误以为字“容若”是别号。
  aliases:
    - 纳兰成德
    - 容若
  category: 文学常识
  explanation: 清代满族词人，原名纳兰成德，字容若，著有《侧帽集》《饮水词》。
  misconceptions:
    - 误认为纳兰性德是唐代诗人，或与李白、杜甫同时代。
    - 把“纳兰性德”写成“纳南性德”，或误以为字“容若”是别号。
    - 将他的作品《饮水词》误记为《饮水集》或《侧帽词》。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:纳西族
  type: Concept
  subject: 语文
  title: 纳西族
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“纳西族”写成“那西族”，音近字混淆。
    - 能指出并纠正这一错误：误认为纳西族主要聚居在西藏，实际主要在云南丽江。
  aliases: []
  category: 民族常识
  explanation: 中国少数民族之一，主要聚居在云南丽江等地，有独特的东巴文化。
  misconceptions:
    - 把“纳西族”写成“那西族”，音近字混淆。
    - 误认为纳西族主要聚居在西藏，实际主要在云南丽江。
    - 将东巴文化说成藏文化，混淆民族特色。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:纸钱
  type: Concept
  subject: 语文
  title: 纸钱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“纸钱”写成“纸线”或“只钱”，忽视“钱”是金属旁，且“纸”右边是“氏”。
    - 能指出并纠正这一错误：认为纸钱是真实货币，烧纸钱就是给死人送真钱，不理解它只是祭扫的冥币。
  aliases: []
  category: 词语
  explanation: 旧时在祭祀时焚化给死者或鬼神当钱用的纸片。
  misconceptions:
    - 把“纸钱”写成“纸线”或“只钱”，忽视“钱”是金属旁，且“纸”右边是“氏”。
    - 认为纸钱是真实货币，烧纸钱就是给死人送真钱，不理解它只是祭扫的冥币。
    - 将“纸钱”与“纸鸢”混淆，把清明节烧纸钱误认为是放风筝。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:线索
  type: Concept
  subject: 语文
  title: 线索
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把本文线索误认为是‘南仁东’，而非‘看星星’
    - 能指出并纠正这一错误：把线索与主题混淆，认为爱国主义就是线索
  aliases: []
  category: 写作手法
  explanation: 贯穿全文的脉络，本文以“看星星”为线索，串联南仁东的一生。
  misconceptions:
    - 把本文线索误认为是‘南仁东’，而非‘看星星’
    - 把线索与主题混淆，认为爱国主义就是线索
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:细心观察
  type: Concept
  subject: 语文
  title: 细心观察
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：观察只盯着静态特征，如“衣服颜色、高矮胖瘦”，忽略说话语气、走路姿态等动态细节。
    - 能指出并纠正这一错误：观察后不加筛选，把看到的都写入作文，如“桌上三本书、两枝笔”全写，特征淹没在琐碎中。
  aliases:
    - 观察
  category: 写作方法
  explanation: 要写好人物，首先需要细心观察，抓住人物的特点。
  misconceptions:
    - 观察只盯着静态特征，如“衣服颜色、高矮胖瘦”，忽略说话语气、走路姿态等动态细节。
    - 观察后不加筛选，把看到的都写入作文，如“桌上三本书、两枝笔”全写，特征淹没在琐碎中。
    - 认为观察就是上课盯人看，不懂在日常相处中积累，导致写同学时无独特素材可用。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:细节描写
  type: Concept
  subject: 语文
  title: 细节描写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把外貌、动作等所有具体描写都称为细节描写，忽略细节描写是细小处描绘
    - 能指出并纠正这一错误：认为细节描写就是篇幅较长的描写，与‘细致描写’等同
  aliases: []
  category: 写作手法
  explanation: 对人物、环境、场景等进行细致描绘，使人物形象生动。本文通过语言、动作、环境等细节展现南仁东的形象。
  misconceptions:
    - 把外貌、动作等所有具体描写都称为细节描写，忽略细节描写是细小处描绘
    - 认为细节描写就是篇幅较长的描写，与‘细致描写’等同
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:经世奇才
  type: Concept
  subject: 语文
  title: 经世奇才
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“经世”写成“惊世”，误作“惊世奇才”
    - 能指出并纠正这一错误：以为“经世”指读过很多经书，而非治理天下
  aliases: []
  category: 成语
  explanation: 指具有治理天下才能的杰出人才。
  misconceptions:
    - 把“经世”写成“惊世”，误作“惊世奇才”
    - 以为“经世”指读过很多经书，而非治理天下
    - 混淆“经世奇才”与“经济之才”，认为专指善于经商
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:经度
  type: Concept
  subject: 语文
  title: 经度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为近海地区因靠海，春天比内陆暖和，忽视‘春天寒冷’
    - 能指出并纠正这一错误：将‘经度’错写成‘经纬度’，概念指代不清
  aliases: []
  category: 地理概念
  explanation: 影响物候现象的第二个因素，近海地区比同纬度内陆冬天温和，春天反而寒冷，春季来临较迟。
  misconceptions:
    - 误认为近海地区因靠海，春天比内陆暖和，忽视‘春天寒冷’
    - 将‘经度’错写成‘经纬度’，概念指代不清
    - 把‘近海地区’理解为‘北方地区’，导致因素分析错误
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:经度对物候的影响
  type: Concept
  subject: 语文
  title: 经度对物候的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将沿海春天迟归因于纬度，而非经度（海陆位置）
    - 能指出并纠正这一错误：忽略‘同纬度’前提，认为所有沿海春天都比内陆迟
  aliases: []
  category: 科学原理
  explanation: 经度差异是影响物候的第二个因素，近海地区比同纬度内陆冬天温和、春天寒冷，因此沿海地区春天来临比内陆迟。
  misconceptions:
    - 误将沿海春天迟归因于纬度，而非经度（海陆位置）
    - 忽略‘同纬度’前提，认为所有沿海春天都比内陆迟
    - 把‘春天寒冷’误写成‘冬天寒冷’，季节错位
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:结构助词
  type: Concept
  subject: 语文
  title: 结构助词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘觉得’中的‘得’误认为是结构助词，实际是构词成分
    - 能指出并纠正这一错误：在‘她唱得真好’中误用‘的’，‘得’连接补语表程度
  aliases: []
  category: 语法
  explanation: 结构助词包括“的”“地”“得”“所”“似的”，用于连接词语，表示修饰、限制或补充关系。
  misconceptions:
    - 把‘觉得’中的‘得’误认为是结构助词，实际是构词成分
    - 在‘她唱得真好’中误用‘的’，‘得’连接补语表程度
    - 认为‘似的’是比喻词，如‘像鸟似的’中‘似的’是结构助词
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:结语
  type: Concept
  subject: 语文
  title: 结语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写结语时把前文内容再概括一遍，形成重复，而不是总结或补充。
    - 能指出并纠正这一错误：认为每条消息都必须单独写结语段，忘记结语有时可暗含在主体中。
  aliases: []
  category: 消息写作
  explanation: 结语是消息正文的结尾部分，有时暗含在主体中，用于总结或补充。
  misconceptions:
    - 写结语时把前文内容再概括一遍，形成重复，而不是总结或补充。
    - 认为每条消息都必须单独写结语段，忘记结语有时可暗含在主体中。
    - 在结语中发表议论或号召，违背消息客观性的要求。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:绕口令
  type: Concept
  subject: 语文
  title: 绕口令
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 绕口令把读音差不多的字放在一起，念快了容易绕口，能帮我们练习发音。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:绝句
  type: Concept
  subject: 语文
  title: 绝句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为绝句是八句，律诗是四句，把《闻王昌龄左迁龙标遥有此寄》说成律诗。
    - 能指出并纠正这一错误：误将《闻王昌龄左迁龙标遥有此寄》断为五言绝句，忽略每句七字。
  aliases: []
  category: 文学常识
  explanation: 绝句是近体诗的一种，每首四句，分五言、七言。《闻王昌龄左迁龙标遥有此寄》是七言绝句。
  misconceptions:
    - 误以为绝句是八句，律诗是四句，把《闻王昌龄左迁龙标遥有此寄》说成律诗。
    - 误将《闻王昌龄左迁龙标遥有此寄》断为五言绝句，忽略每句七字。
    - 认为绝句可随意换韵，忽略押韵规则。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:续写
  type: Concept
  subject: 语文
  title: 续写
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：续写时把闰土写成开朗健谈、积极乐观，与原文人物性格不符
    - 能指出并纠正这一错误：续写情节随意脱离原文结局，忽略“我”与故乡的疏离感
  aliases: []
  category: 写作方法
  explanation: 续写是根据原文内容，发挥想象，继续写下去，要求情节连贯、人物性格一致。
  misconceptions:
    - 续写时把闰土写成开朗健谈、积极乐观，与原文人物性格不符
    - 续写情节随意脱离原文结局，忽略“我”与故乡的疏离感
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:绰号
  type: Concept
  subject: 语文
  title: 绰号
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为绰号都是贬义的，不懂‘一丈青’是褒扬泼辣勇武
    - 能指出并纠正这一错误：把绰号与人物本名等同，忽略其突出性格的作用
  aliases: []
  category: 文学常识
  explanation: 根据人物特点起的别称，如“一丈青”“何大学问”，突出人物性格或身份。
  misconceptions:
    - 以为绰号都是贬义的，不懂‘一丈青’是褒扬泼辣勇武
    - 把绰号与人物本名等同，忽略其突出性格的作用
    - 写‘外号’时误写成‘喝号’等错别字
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:绿水青山就是金山银山
  type: Concept
  subject: 语文
  title: 绿水青山就是金山银山
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘绿水青山’误写为‘青水绿山’，词序颠倒
    - 能指出并纠正这一错误：误认为‘金山银山’仅指物质财富，忽略与生态的辩证关系
  aliases:
    - 两山理论
  category: 发展理念
  explanation: 习近平提出的重要发展理念，强调生态环境保护与经济发展相互促进。
  misconceptions:
    - 将‘绿水青山’误写为‘青水绿山’，词序颠倒
    - 误认为‘金山银山’仅指物质财富，忽略与生态的辩证关系
    - 将此理念张冠李戴，归为其他领导人提出
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:缄默
  type: Concept
  subject: 语文
  title: 缄默
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“缄”误读成xián或jiǎn，写成“减默”。
    - 能指出并纠正这一错误：用“缄默”形容性格，如“他性格缄默”，应改为“沉默”或“内向”。
  aliases: []
  category: 词语
  explanation: 闭口不说话。
  misconceptions:
    - 把“缄”误读成xián或jiǎn，写成“减默”。
    - 用“缄默”形容性格，如“他性格缄默”，应改为“沉默”或“内向”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:编童话故事
  type: Concept
  subject: 语文
  title: 编童话故事
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 编童话要先想好故事里有哪些角色、发生在什么时间什么地点，再想象他们之间会发生什么事，把故事写下来。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:缘物寄情
  type: Concept
  subject: 语文
  title: 缘物寄情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘缘’理解为‘缘故’，误以为‘缘物’是‘因为某物’。
    - 能指出并纠正这一错误：认为缘物寄情就是单纯写景状物，无需寄托情感。
  aliases:
    - 借景抒情
  category: 美学概念
  explanation: 通过描写客观事物来寄托作者的思想感情，写景即写情。
  misconceptions:
    - 把‘缘’理解为‘缘故’，误以为‘缘物’是‘因为某物’。
    - 认为缘物寄情就是单纯写景状物，无需寄托情感。
    - 写景时先写景后强行抒情，情感与景物脱节，未能做到寓情于景。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:缩写
  type: Concept
  subject: 语文
  title: 缩写
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：缩写时加入自己的评价，如“我读后很感动”，改变了原文中心。
    - 能指出并纠正这一错误：缩写时直接摘抄原文大量句子，没有概括，篇幅仍然很长。
  aliases: []
  category: 写作方法
  explanation: 缩写是在保持中心思想不变的前提下，压缩文章篇幅，用简洁的语言概括原文内容，要求“保持主干，删除枝叶”，并做到“自成一文”。
  misconceptions:
    - 缩写时加入自己的评价，如“我读后很感动”，改变了原文中心。
    - 缩写时直接摘抄原文大量句子，没有概括，篇幅仍然很长。
    - 缩写时删去所有细节，却丢失必要的过渡，使文章不连贯。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:缩小的夸张
  type: Concept
  subject: 语文
  title: 缩小的夸张
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“一眨眼功夫”当成实指时间短，误以为不是夸张，实际是缩小的夸张。
    - 能指出并纠正这一错误：将“教室里静得针掉地都能听见”归为缩小，实际是扩大（声音放大），混淆了夸大与缩小。
  aliases: []
  category: 修辞手法
  explanation: 缩小的夸张是把人或事物故意往小、少、慢、短、弱等方面说的夸张形式。
  misconceptions:
    - 把“一眨眼功夫”当成实指时间短，误以为不是夸张，实际是缩小的夸张。
    - 将“教室里静得针掉地都能听见”归为缩小，实际是扩大（声音放大），混淆了夸大与缩小。
    - 认为“千里送鹅毛”是缩小的夸张，实际鹅毛是“轻”的缩小，但“千里”是扩大，误判整体方向。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:网络诚信
  type: Concept
  subject: 语文
  title: 网络诚信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为网络是虚拟世界，现实中守信，网上可以随意发言
    - 能指出并纠正这一错误：把网络诚信等同于网络文明，认为只要不说脏话就算诚信
  aliases: []
  category: 现代概念
  explanation: 指网络空间活动中尊崇道德、遵守法律、履行契约、恪守承诺的状态，是网络文化的道德基础。
  misconceptions:
    - 认为网络是虚拟世界，现实中守信，网上可以随意发言
    - 把网络诚信等同于网络文明，认为只要不说脏话就算诚信
    - 误以为网络诚信只是不骗钱，不包括不传谣、不造假
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:罗汉豆
  type: Concept
  subject: 语文
  title: 罗汉豆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写成“罗汗豆”，多了一点。
    - 能指出并纠正这一错误：误以为罗汉豆是豌豆，其实指蚕豆。
  aliases:
    - 蚕豆
  category: 文化常识
  explanation: 即蚕豆，一种常见蔬菜。
  misconceptions:
    - 写成“罗汗豆”，多了一点。
    - 误以为罗汉豆是豌豆，其实指蚕豆。
    - 认为罗汉豆是豆角的一种，新鲜时吃荚。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:罗贯中
  type: Concept
  subject: 语文
  title: 罗贯中
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《水浒传》的作者说成罗贯中，与施耐庵混淆
    - 能指出并纠正这一错误：以为罗贯中是明代人，而非元末明初
  aliases: []
  category: 文学常识
  explanation: 元末明初小说家、戏曲家，生卒年不详，著有《三国演义》等。
  misconceptions:
    - 把《水浒传》的作者说成罗贯中，与施耐庵混淆
    - 以为罗贯中是明代人，而非元末明初
    - 把《三国志》当成罗贯中写的，误为史书
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:羁旅
  type: Concept
  subject: 语文
  title: 羁旅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“羁”写成“寄”或“基”，形近致误。
    - 能指出并纠正这一错误：认为羁旅指快乐的旅行，忽略漂泊无依之感。
  aliases: []
  category: 文言词语
  explanation: 指长久在外漂泊。
  misconceptions:
    - 将“羁”写成“寄”或“基”，形近致误。
    - 认为羁旅指快乐的旅行，忽略漂泊无依之感。
    - 把羁旅解释为“被束缚的旅途”，不强调长久在外。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:羁旅之思
  type: Concept
  subject: 语文
  title: 羁旅之思
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“羁”写成“寄”，误认为“寄居他乡”而忽略“羁”本义。
    - 能指出并纠正这一错误：只概括为“思念家乡”，漏掉客居他乡的愁苦（羁旅之意）。
  aliases:
    - 思乡之情
  category: 主题思想
  explanation: 指客居他乡的愁苦与思乡之情，是《商山早行》的主题。
  misconceptions:
    - 将“羁”写成“寄”，误认为“寄居他乡”而忽略“羁”本义。
    - 只概括为“思念家乡”，漏掉客居他乡的愁苦（羁旅之意）。
    - 读错“羁”为jǐ或gē，字音不准确。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:美女蛇的故事
  type: Concept
  subject: 语文
  title: 美女蛇的故事
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把故事里老和尚送的“飞蜈蚣”说成“飞蛇”
    - 能指出并纠正这一错误：误以为美女蛇直接吃人，其实她只叫名字
  aliases: []
  category: 课文内容
  explanation: 长妈妈讲给鲁迅的故事，讲述读书人遇美女蛇，老和尚赠飞蜈蚣治蛇，告诫陌生人叫名字不要答应。
  misconceptions:
    - 把故事里老和尚送的“飞蜈蚣”说成“飞蛇”
    - 误以为美女蛇直接吃人，其实她只叫名字
    - 记成是闰土的父亲讲给鲁迅的，实际是长妈妈
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:老山界
  type: Concept
  subject: 语文
  title: 老山界
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为老山界是越城岭的主峰，实为土名，指整座山
    - 能指出并纠正这一错误：说老山界是“长征中翻越的第一座山”，漏掉“难走的”这一限定
  aliases:
    - 越城岭
  category: 地理
  explanation: 老山界是越城岭的土名，位于广西，是红军长征中翻越的第一座难走的山。
  misconceptions:
    - 误以为老山界是越城岭的主峰，实为土名，指整座山
    - 说老山界是“长征中翻越的第一座山”，漏掉“难走的”这一限定
    - 将老山界的地理位置错答为贵州或四川
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:老旦
  type: Concept
  subject: 语文
  title: 老旦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为老旦扮演老年男子，实际扮演老年女子。
    - 能指出并纠正这一错误：写成“老但”，少“日”旁。
  aliases: []
  category: 戏曲常识
  explanation: 戏曲行当之一，扮演老年女子。
  misconceptions:
    - 误以为老旦扮演老年男子，实际扮演老年女子。
    - 写成“老但”，少“日”旁。
    - 把老旦归为生行，与老生混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:老舍
  type: Concept
  subject: 语文
  title: 老舍
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：答“老舍原名老舍”，忘记原名是舒庆春，字舍予。
    - 能指出并纠正这一错误：把《四世同堂》说成巴金或茅盾的作品，张冠李戴。
  aliases:
    - 舒庆春
  category: 文学常识
  explanation: 老舍（1899-1966），原名舒庆春，字舍予，北京人，中国现代著名作家，代表作有《骆驼祥子》《四世同堂》等。
  misconceptions:
    - 答“老舍原名老舍”，忘记原名是舒庆春，字舍予。
    - 把《四世同堂》说成巴金或茅盾的作品，张冠李戴。
    - 误以为“老舍”是字，而“舍予”是笔名，弄反了称谓。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:职业的神圣
  type: Concept
  subject: 语文
  title: 职业的神圣
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有当科学家、医生才神圣，清洁工等职业低贱。
    - 能指出并纠正这一错误：觉得'神圣'就是高不可攀，不理解凡职业都无高下之分。
  aliases: []
  category: 核心概念
  explanation: 凡职业都是神圣的，没有高下之分，只要认真去做，都是合理的生活。
  misconceptions:
    - 认为只有当科学家、医生才神圣，清洁工等职业低贱。
    - 觉得'神圣'就是高不可攀，不理解凡职业都无高下之分。
    - 只看到职业的谋生功能，忽视其社会价值，不认为平凡工作神圣。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:联想
  type: Concept
  subject: 语文
  title: 联想
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把联想和想象混为一谈，如看到白云想到棉花糖，却说成是想象
    - 能指出并纠正这一错误：认为联想只能由相似事物触发，忽略由黑暗想到光明的对比联想
  aliases: []
  category: 文学概念
  explanation: 联想是由一事物想到另一事物的心理过程，在阅读中发挥联想有助于理解作品。
  misconceptions:
    - 把联想和想象混为一谈，如看到白云想到棉花糖，却说成是想象
    - 认为联想只能由相似事物触发，忽略由黑暗想到光明的对比联想
    - 误以为联想必须有逻辑依据，随意联想如由粉笔想到宇宙被判为错误
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:联想和想象的关系
  type: Concept
  subject: 语文
  title: 联想和想象的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“看到月亮想起家人”是想象，实际是联想。
    - 能指出并纠正这一错误：认为“联想”与“想象”完全不同，实际二者在写作中常结合。
  aliases: []
  category: 写作知识
  explanation: 联想和想象在概念上有区别，但在实际写作中往往又交织在一起。
  misconceptions:
    - 误以为“看到月亮想起家人”是想象，实际是联想。
    - 认为“联想”与“想象”完全不同，实际二者在写作中常结合。
    - 把“由某物创造出新形象”说成联想，实际是想象。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:联想和想象的运用要点
  type: Concept
  subject: 语文
  title: 联想和想象的运用要点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为联想可随意牵强附会，不讲究相关性和自然过渡。
    - 能指出并纠正这一错误：认为想象就是胡编乱造，忽视合情合理、源于生活。
  aliases: []
  category: 写作知识
  explanation: 运用联想和想象时，要自然恰切、合情合理、有新意。
  misconceptions:
    - 以为联想可随意牵强附会，不讲究相关性和自然过渡。
    - 认为想象就是胡编乱造，忽视合情合理、源于生活。
    - 为求新意刻意求奇怪，忽视想象合理性与主题表达。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:联系上下文理解词语
  type: Concept
  subject: 语文
  title: 联系上下文理解词语
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 遇到不明白的词，先读读它前后的句子，从句子里猜出词的意思，比如从八路军藏在山里，猜出隐蔽就是躲起来不让人发现。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:肯将衰朽惜残年
  type: Concept
  subject: 语文
  title: 肯将衰朽惜残年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“肯”译为“愿意”，导致句意变为愿意为衰老爱惜生命，与原意相反。
    - 能指出并纠正这一错误：把“惜”理解成“珍惜”，未意识到此处“惜”是“吝惜、舍不得”。
  aliases: []
  category: 诗句理解
  explanation: 意思是哪能以衰老为由吝惜残余的生命呢，表达诗人忠君报国的决心。
  misconceptions:
    - 将“肯”译为“愿意”，导致句意变为愿意为衰老爱惜生命，与原意相反。
    - 把“惜”理解成“珍惜”，未意识到此处“惜”是“吝惜、舍不得”。
    - 误将“衰朽”写作“衰修”或“衰休”，字形错误。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:背影
  type: Concept
  subject: 语文
  title: 背影
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘背影’指父亲走路时的普通背影，忽略了‘蹒跚’和‘爬月台’的特定场景。
    - 能指出并纠正这一错误：把‘背影’说成是比喻父爱的修辞，其实它是贯穿全文的线索和情感寄托。
  aliases:
    - 父亲的背影
  category: 文学意象
  explanation: 《背影》是朱自清散文中的核心意象，指父亲在车站为“我”买橘子时爬上月台的背影，承载着深沉的父爱，是全文的线索和情感寄托。
  misconceptions:
    - 认为‘背影’指父亲走路时的普通背影，忽略了‘蹒跚’和‘爬月台’的特定场景。
    - 把‘背影’说成是比喻父爱的修辞，其实它是贯穿全文的线索和情感寄托。
    - 误将‘背影’与《荷塘月色》中的‘荷塘’意象混为一谈。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:背景
  type: Concept
  subject: 语文
  title: 背景
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把背景当作消息主体，大段介绍历史，反而冲淡了最新消息本身。
    - 能指出并纠正这一错误：认为背景只能放在最后，其实背景可灵活穿插在主体中甚至暗含其中。
  aliases:
    - 新闻背景
  category: 消息写作
  explanation: 背景是消息正文的一部分，提供新闻事件的社会历史背景或深层原因，有时暗含在主体中。
  misconceptions:
    - 把背景当作消息主体，大段介绍历史，反而冲淡了最新消息本身。
    - 认为背景只能放在最后，其实背景可灵活穿插在主体中甚至暗含其中。
    - 不区分背景与事件，把几年前的相关事件当作本次新闻的主标题事实。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S8.md
- id: concept:语文:胡屠户
  type: Concept
  subject: 语文
  title: 胡屠户
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为胡屠户是范进的父亲或弟弟，忽视其岳父身份
    - 能指出并纠正这一错误：以为胡屠户一开始就尊重范进，看不出前倨后恭
  aliases: []
  category: 人物形象
  explanation: 范进的岳父，前倨后恭，势利庸俗，通过其态度变化反映社会现实。
  misconceptions:
    - 误认为胡屠户是范进的父亲或弟弟，忽视其岳父身份
    - 以为胡屠户一开始就尊重范进，看不出前倨后恭
    - 把胡屠户的行为理解为真实的关心，而非趋炎附势
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:脱贫攻坚精神
  type: Concept
  subject: 语文
  title: 脱贫攻坚精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将黄文秀精神概括为‘艰苦奋斗、无私奉献’，但未提‘不忘初心、牢记使命’这一核心。
    - 能指出并纠正这一错误：误以为脱贫攻坚精神只存在于扶贫干部，与学生无关，忽视其普遍价值。
  aliases: []
  category: 主题思想
  explanation: 课文表现黄文秀不忘初心、牢记使命，勇于担当、甘于奉献的精神，是脱贫攻坚精神的体现。
  misconceptions:
    - 将黄文秀精神概括为‘艰苦奋斗、无私奉献’，但未提‘不忘初心、牢记使命’这一核心。
    - 误以为脱贫攻坚精神只存在于扶贫干部，与学生无关，忽视其普遍价值。
    - 把脱贫攻坚精神与‘抗疫精神’混为一谈，没有区分‘精准扶贫’的具体内涵。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:臧克家
  type: Concept
  subject: 语文
  title: 臧克家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《有的人》作者写成鲁迅，实际是臧克家为纪念鲁迅而作
    - 能指出并纠正这一错误：将‘臧’写成‘藏’，误认为‘藏克家’，注意字形区别
  aliases: []
  category: 人物
  explanation: 本文作者，现代诗人，语言精致凝练，富有诗意。
  misconceptions:
    - 把《有的人》作者写成鲁迅，实际是臧克家为纪念鲁迅而作
    - 将‘臧’写成‘藏’，误认为‘藏克家’，注意字形区别
    - 以为臧克家是闻一多的学生，实际两人是亦师亦友关系，但文中所写并非亲授
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:自力更生
  type: Concept
  subject: 语文
  title: 自力更生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘自力更生’的‘更’误读成gèng，正确读音是gēng。
    - 能指出并纠正这一错误：将‘自力更生’写成‘自立更生’，‘力’是力量，‘立’是站立，意思不同。
  aliases: []
  category: 精神品质
  explanation: 依靠自己的力量把事情办成，本文体现南仁东独立自主建设“中国天眼”的精神。
  misconceptions:
    - 把‘自力更生’的‘更’误读成gèng，正确读音是gēng。
    - 将‘自力更生’写成‘自立更生’，‘力’是力量，‘立’是站立，意思不同。
    - 误将‘自力更生’与‘自食其力’等同，忽视其侧重依靠自身力量开创事业、改变现状的深意。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:自失
  type: Concept
  subject: 语文
  title: 自失
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：与“自卑”混淆，认为自失是自我看不起。
    - 能指出并纠正这一错误：写成“自逝”，同音字混淆。
  aliases: []
  category: 词语
  explanation: 指听得出神而忘了自己。
  misconceptions:
    - 与“自卑”混淆，认为自失是自我看不起。
    - 写成“自逝”，同音字混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:自强不息
  type: Concept
  subject: 语文
  title: 自强不息
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为语出《论语》，实际出自《周易》。
    - 能指出并纠正这一错误：与'厚德载物'混淆，忽略'自强不息'侧重自我奋进不懈。
  aliases: []
  category: 文化概念
  explanation: 语出《周易》，指君子处世应像天道一样刚健有力，永不止息，努力奋进。
  misconceptions:
    - 误认为语出《论语》，实际出自《周易》。
    - 与'厚德载物'混淆，忽略'自强不息'侧重自我奋进不懈。
    - 把'息'理解为'休息'，误以为不断自加压力不休息，实际'息'是停止。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:自惭形秽
  type: Concept
  subject: 语文
  title: 自惭形秽
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'秽'读成suì，误读'秽'为'岁'。
    - 能指出并纠正这一错误：写成'自渐形秽'或'自惭形愧'，字形写错。
  aliases: []
  category: 成语
  explanation: 原指因自己的容貌举止不如别人而感到惭愧，后来泛指自愧不如别人。
  misconceptions:
    - 把'秽'读成suì，误读'秽'为'岁'。
    - 写成'自渐形秽'或'自惭形愧'，字形写错。
    - 认为'形秽'指身体脏，忽略其原指容貌丑陋而惭愧。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:自我介绍
  type: Concept
  subject: 语文
  title: 自我介绍
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：自我介绍时只说姓名“我叫某某”，觉得其他内容不重要，忽略特长和兴趣。
    - 能指出并纠正这一错误：介绍时说话太快、声音太小，或者低头看地，不自信。
  aliases:
    - 自我展示
  category: 口语交际
  explanation: 自我介绍是向别人展示自己的口语交际手段，需介绍姓名、家庭情况、特长、兴趣爱好等，要求自信、声音响亮、语言简洁清晰。
  misconceptions:
    - 自我介绍时只说姓名“我叫某某”，觉得其他内容不重要，忽略特长和兴趣。
    - 介绍时说话太快、声音太小，或者低头看地，不自信。
    - 把自我介绍写成简历或自荐信，用书面语较多，不符合口语交际要求。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:自欺力
  type: Concept
  subject: 语文
  title: 自欺力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“自欺力”解释为欺骗别人的能力，实际是自我麻醉
    - 能指出并纠正这一错误：误以为“自欺力”与“自信力”意思相近，实际相反
  aliases: []
  category: 词语理解
  explanation: 指用自欺欺人的方式麻醉自己，逃避现实。
  misconceptions:
    - 把“自欺力”解释为欺骗别人的能力，实际是自我麻醉
    - 误以为“自欺力”与“自信力”意思相近，实际相反
    - 将“自欺力”写成“自期力”，字形混淆
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:自然段
  type: Concept
  subject: 语文
  title: 自然段
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 文章里一段一段的话就是自然段，每段开头要空两个格。数一数开头空两格的地方，就知道课文有几个自然段。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:自由体诗
  type: Concept
  subject: 语文
  title: 自由体诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自由体诗不需要押韵，就完全忽略节奏，写成大白话断行也算诗。
    - 能指出并纠正这一错误：把分行的散文当作自由体诗，认为只要形式自由，不需要内在情感和意象。
  aliases:
    - 自由诗
  category: 诗歌体裁
  explanation: 不拘泥于传统格律，形式自由，注重内在节奏和情感表达。
  misconceptions:
    - 认为自由体诗不需要押韵，就完全忽略节奏，写成大白话断行也算诗。
    - 把分行的散文当作自由体诗，认为只要形式自由，不需要内在情感和意象。
    - 认为自由体诗没有格律限制，所以可以胡乱写，不讲究语言凝练。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:至死不懈
  type: Concept
  subject: 语文
  title: 至死不懈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'懈'误写为'解'或'邂'，写成'至死不解'。
    - 能指出并纠正这一错误：与'至死不渝'混用，忽略'渝'是改变，'懈'是松懈。
  aliases: []
  category: 成语
  explanation: 到死都不松懈，形容坚持到底。
  misconceptions:
    - 把'懈'误写为'解'或'邂'，写成'至死不解'。
    - 与'至死不渝'混用，忽略'渝'是改变，'懈'是松懈。
    - 误以为'不懈'是不停歇，与'不松懈'意思有别。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:舍生取义
  type: Concept
  subject: 语文
  title: 舍生取义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“舍生取义”写成“舍身取义”，改变原意。
    - 能指出并纠正这一错误：误认为“舍生取义”等同于“杀身成仁”，忽视“义”的特定内涵。
  aliases:
    - 舍生而取义
  category: 思想观点
  explanation: 指为了正义的事业而牺牲生命，是孟子提出的重要道德准则。
  misconceptions:
    - 把“舍生取义”写成“舍身取义”，改变原意。
    - 误认为“舍生取义”等同于“杀身成仁”，忽视“义”的特定内涵。
    - 认为舍生取义是鲁莽送死，不珍爱生命。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:舞台说明
  type: Concept
  subject: 语文
  title: 舞台说明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“舞台说明”当作演员说的台词，实际是提示性文字。
    - 能指出并纠正这一错误：误写“舞台说明”为“武台说明”，混淆“舞”与“武”。
  aliases:
    - 舞台提示
  category: 戏剧术语
  explanation: 剧作者提供给导演和演员的说明性文字，交代时间、地点、服装、道具、布景以及人物的表情、动作等。
  misconceptions:
    - 误将“舞台说明”当作演员说的台词，实际是提示性文字。
    - 误写“舞台说明”为“武台说明”，混淆“舞”与“武”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:舟子
  type: Concept
  subject: 语文
  title: 舟子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“舟子”解释为“小船”，误把“子”当作名词小称。
    - 能指出并纠正这一错误：把“舟子”写成“舟梓”或“周子”，同音字错写。
  aliases: []
  category: 文言词语
  explanation: 船夫。
  misconceptions:
    - 将“舟子”解释为“小船”，误把“子”当作名词小称。
    - 把“舟子”写成“舟梓”或“周子”，同音字错写。
    - 误以为“舟子”是“船桨”，忽略其指船夫。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:航天精神
  type: Concept
  subject: 语文
  title: 航天精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只强调勇敢无畏，忽略严谨、沉着、爱国等品质。
    - 能指出并纠正这一错误：将航天精神简单等同于“不怕牺牲”，缺乏具体内涵。
  aliases: []
  category: 人文主题
  explanation: 体现航天员严谨、勇敢、沉着、爱国等精神品质。
  misconceptions:
    - 只强调勇敢无畏，忽略严谨、沉着、爱国等品质。
    - 将航天精神简单等同于“不怕牺牲”，缺乏具体内涵。
    - 认为航天精神仅指航天员个人，不包含整个团队。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:艺术与技术
  type: Concept
  subject: 语文
  title: 艺术与技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为假山堆叠完全是技术活，没有艺术性。
    - 能指出并纠正这一错误：混淆“艺术”与“技术”，以为艺术等同于技术。
  aliases: []
  category: 概念辨析
  explanation: 艺术强调创造性和审美，技术强调操作技能；假山堆叠是艺术而不仅是技术。
  misconceptions:
    - 认为假山堆叠完全是技术活，没有艺术性。
    - 混淆“艺术”与“技术”，以为艺术等同于技术。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:艾青
  type: Concept
  subject: 语文
  title: 艾青
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《再别康桥》当作艾青的作品，实际作者是徐志摩，张冠李戴。
    - 能指出并纠正这一错误：认为艾青是“新月派”或“朦胧派”代表，实际是自由体诗派，爱国诗人。
  aliases: []
  category: 作家
  explanation: 中国现当代文学史上的著名诗人，代表作《大堰河——我的保姆》，诗歌风格自由、朴素，充满爱国情怀。
  misconceptions:
    - 误把《再别康桥》当作艾青的作品，实际作者是徐志摩，张冠李戴。
    - 认为艾青是“新月派”或“朦胧派”代表，实际是自由体诗派，爱国诗人。
    - 将艾青的《大堰河——我的保姆》误写为“大燕河”，字形混淆。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:花鼓
  type: Concept
  subject: 语文
  title: 花鼓
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为花鼓是花做的鼓，实际是民间歌舞形式。
    - 能指出并纠正这一错误：将“花鼓”与“腰鼓”混淆，忽略二人对舞、边敲边歌的特点。
  aliases: []
  category: 文化常识
  explanation: 一种民间舞蹈，一般由男女二人对舞，边敲打边歌舞。
  misconceptions:
    - 误认为花鼓是花做的鼓，实际是民间歌舞形式。
    - 将“花鼓”与“腰鼓”混淆，忽略二人对舞、边敲边歌的特点。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:苏州园林
  type: Concept
  subject: 语文
  title: 苏州园林
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为本文是一篇游记或抒情散文，而非说明文。
    - 能指出并纠正这一错误：将作者记为叶圣陶，但认为文章选自《稻草人》集子。
  aliases: []
  category: 文学常识
  explanation: 叶圣陶写的一篇说明文，介绍了苏州园林的整体特征和具体说明角度。
  misconceptions:
    - 误以为本文是一篇游记或抒情散文，而非说明文。
    - 将作者记为叶圣陶，但认为文章选自《稻草人》集子。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:苏轼
  type: Concept
  subject: 语文
  title: 苏轼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《记承天寺夜游》误记为苏辙或苏洵所作。
    - 能指出并纠正这一错误：误说苏轼号“东坡居士”是“易安居士”，与李清照混淆。
  aliases:
    - 苏东坡
  category: 文学常识
  explanation: 苏轼，北宋文学家，号东坡居士，唐宋八大家之一，《记承天寺夜游》写于贬谪黄州期间。
  misconceptions:
    - 将《记承天寺夜游》误记为苏辙或苏洵所作。
    - 误说苏轼号“东坡居士”是“易安居士”，与李清照混淆。
    - 认为苏轼被贬黄州是因为“乌台诗案”，却不知作此文时已含豁达。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:苏轼《定风波》
  type: Concept
  subject: 语文
  title: 苏轼《定风波》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《定风波》是诗，不是词，忽略其词牌属性。
    - 能指出并纠正这一错误：把作者误认为辛弃疾，或把“也无风雨也无晴”理解为消极悲观。
  aliases:
    - 定风波
    - 定风波·苏轼
  category: 古诗词
  explanation: 苏轼词作，通过途中遇雨的生活小事，表现乐观旷达的人生态度，体现“也无风雨也无晴”的豁达境界。
  misconceptions:
    - 误以为《定风波》是诗，不是词，忽略其词牌属性。
    - 把作者误认为辛弃疾，或把“也无风雨也无晴”理解为消极悲观。
    - 将词牌名“定风波”写作“定风波”，或与《念奴娇》混淆。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:若为
  type: Concept
  subject: 语文
  title: 若为
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“若为”直译为“如果为了”，忽略其在文中是“怎样的”意思。
    - 能指出并纠正这一错误：误将“若为”的“为”读作“wèi”，正确应为“wéi”。
  aliases: []
  category: 文言词语
  explanation: 意为“怎样的”，出自本课注释。
  misconceptions:
    - 把“若为”直译为“如果为了”，忽略其在文中是“怎样的”意思。
    - 误将“若为”的“为”读作“wèi”，正确应为“wéi”。
    - 在翻译“若为佣耕”时错译成“如果做雇工”，实际是“怎么样做雇工”。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:若有人兮天一方，忠为衣兮信为裳
  type: Concept
  subject: 语文
  title: 若有人兮天一方，忠为衣兮信为裳
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“若有人”的“若”理解为“如果”，实际是“好像”
    - 能指出并纠正这一错误：误将“天一方”写成“天各一方”，改变了诗句意思
  aliases: []
  category: 名言警句
  explanation: 出自卢照邻《中和乐九章·总歌第九》，以忠信为衣裳，比喻忠信是人的外在表现。
  misconceptions:
    - 把“若有人”的“若”理解为“如果”，实际是“好像”
    - 误将“天一方”写成“天各一方”，改变了诗句意思
    - 误以为“忠为衣兮信为裳”中“衣”和“裳”是统称衣服，不晓上下之别
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:若瑟夫
  type: Concept
  subject: 语文
  title: 若瑟夫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把若瑟夫当作成年人，误以为他是于勒的同辈人。
    - 能指出并纠正这一错误：认为若瑟夫是作者莫泊桑本人，混淆叙述者与作者。
  aliases: []
  category: 人物形象
  explanation: 若瑟夫是《我的叔叔于勒》中的叙述者，善良、有同情心，与父母形成对比。
  misconceptions:
    - 把若瑟夫当作成年人，误以为他是于勒的同辈人。
    - 认为若瑟夫是作者莫泊桑本人，混淆叙述者与作者。
    - 误以为若瑟夫在船上用金币付牡蛎钱，实则是铜钱。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:英法联军
  type: Concept
  subject: 语文
  title: 英法联军
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将火烧圆明园记为1840年，实际是1860年第二次鸦片战争期间。
    - 能指出并纠正这一错误：误写为'英法八国联军'，与1900年的八国联军混淆。
  aliases: []
  category: 历史事件
  explanation: 第二次鸦片战争期间，英国和法国组成的联军，对中国进行侵略，并劫掠圆明园。
  misconceptions:
    - 将火烧圆明园记为1840年，实际是1860年第二次鸦片战争期间。
    - 误写为'英法八国联军'，与1900年的八国联军混淆。
    - 认为英法联军是第一次鸦片战争中组成，实际是第二次鸦片战争。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:英法联军火烧圆明园
  type: Concept
  subject: 语文
  title: 英法联军火烧圆明园
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把火烧圆明园错记为八国联军所为，时间写成1900年。
    - 能指出并纠正这一错误：将“圆明园”误写为“圆明圆”或“园明园”。
  aliases:
    - 火烧圆明园
    - 圆明园劫难
  category: 历史事件
  explanation: 1860年英法联军在第二次鸦片战争期间攻占北京，劫掠并焚毁了圆明园，这是中国近代史上的重大损失。
  misconceptions:
    - 把火烧圆明园错记为八国联军所为，时间写成1900年。
    - 将“圆明园”误写为“圆明圆”或“园明园”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:英法联军远征中国
  type: Concept
  subject: 语文
  title: 英法联军远征中国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“远征”写成“远证”，或误当成第一次鸦片战争。
    - 能指出并纠正这一错误：误认为英法联军在甲午战争期间攻占北京。
  aliases: []
  category: 历史
  explanation: 指第二次鸦片战争期间，英法联军对中国的侵略行动，包括劫掠圆明园。
  misconceptions:
    - 把“远征”写成“远证”，或误当成第一次鸦片战争。
    - 误认为英法联军在甲午战争期间攻占北京。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:英雄传奇
  type: Concept
  subject: 语文
  title: 英雄传奇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆英雄传奇和历史演义，认为《三国演义》也是英雄传奇
    - 能指出并纠正这一错误：以为英雄传奇只能写侠客，忽略智取生辰纲这类平民英雄
  aliases: []
  category: 小说类型
  explanation: 以英雄人物为中心，讲述其传奇经历和事迹的小说类型，如《水浒传》中的故事。
  misconceptions:
    - 混淆英雄传奇和历史演义，认为《三国演义》也是英雄传奇
    - 以为英雄传奇只能写侠客，忽略智取生辰纲这类平民英雄
    - 认为英雄传奇和章回体是同一概念，如说《水浒传》是英雄传奇所以不是章回体
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:范仲淹
  type: Concept
  subject: 语文
  title: 范仲淹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《醉翁亭记》作者记成范仲淹，与欧阳修张冠李戴。
    - 能指出并纠正这一错误：把范仲淹的字“希文”记为“子厚”（柳宗元）或“永叔”。
  aliases: []
  category: 文学常识
  explanation: 北宋政治家、文学家，字希文，谥号文正，著有《范文正公集》。
  misconceptions:
    - 将《醉翁亭记》作者记成范仲淹，与欧阳修张冠李戴。
    - 把范仲淹的字“希文”记为“子厚”（柳宗元）或“永叔”。
    - 误写谥号“文正”为“文忠”（欧阳修），或忽略谥号。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:范进
  type: Concept
  subject: 语文
  title: 范进
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为范进是历史真实人物，而非小说虚构角色
    - 能指出并纠正这一错误：把范进与范仲淹混淆，认为他是宋代名臣
  aliases: []
  category: 人物形象
  explanation: 本文主人公，中举后喜极而疯，反映科举对读书人的毒害。
  misconceptions:
    - 误以为范进是历史真实人物，而非小说虚构角色
    - 把范进与范仲淹混淆，认为他是宋代名臣
    - 以为范进中举前已考中秀才，忽略他考了二十余次秀才未中
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:范进中举
  type: Concept
  subject: 语文
  title: 范进中举
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为范进中举的是状元，不知道“中举”指中举人
    - 能指出并纠正这一错误：误以为《范进中举》出自《水浒传》，实际出自《儒林外史》
  aliases: []
  category: 文学常识
  explanation: 《儒林外史》中的经典情节，描写范进中举后喜极而疯的故事，讽刺科举制度。
  misconceptions:
    - 以为范进中举的是状元，不知道“中举”指中举人
    - 误以为《范进中举》出自《水浒传》，实际出自《儒林外史》
    - 把范进喜极而疯理解为正常喜悦，未看出讽刺意味
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:茅屋为秋风所破歌
  type: Concept
  subject: 语文
  title: 茅屋为秋风所破歌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记《茅屋为秋风所破歌》作者为李白，或认为杜甫是南宋人。
    - 能指出并纠正这一错误：把“歌”看作词牌名，误认此诗为词。
  aliases: []
  category: 诗歌
  explanation: 杜甫作于唐肃宗上元二年（761），描写茅屋被秋风所破的遭遇，抒发忧国忧民的情怀。
  misconceptions:
    - 误记《茅屋为秋风所破歌》作者为李白，或认为杜甫是南宋人。
    - 把“歌”看作词牌名，误认此诗为词。
    - 只强调“屋漏偏逢连夜雨”的苦，看不到诗人推己及人的博大胸怀。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:茅盾
  type: Concept
  subject: 语文
  title: 茅盾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把茅盾的原名写成“沈雁冰”，实际沈雁冰是字，原名沈德鸿。
    - 能指出并纠正这一错误：将笔名“茅盾”误写为“矛盾”，以为取其揭露现实矛盾之意。
  aliases:
    - 沈德鸿
    - 沈雁冰
  category: 文学常识
  explanation: 原名沈德鸿，字雁冰，浙江桐乡人，作家、社会活动家，代表作有《子夜》《林家铺子》等。
  misconceptions:
    - 把茅盾的原名写成“沈雁冰”，实际沈雁冰是字，原名沈德鸿。
    - 将笔名“茅盾”误写为“矛盾”，以为取其揭露现实矛盾之意。
    - 把《林家铺子》记为巴金作品，或把《子夜》记为《四世同堂》。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:茨威格
  type: Concept
  subject: 语文
  title: 茨威格
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把茨威格的国籍写成德国或瑞士，忘了他是奥地利人。
    - 能指出并纠正这一错误：将《一个陌生女人的来信》误记为莫泊桑的作品，因同为短篇名家。
  aliases:
    - 斯蒂芬·茨威格
  category: 文学常识
  explanation: 奥地利作家，本文作者，擅长传记和小说创作。
  misconceptions:
    - 把茨威格的国籍写成德国或瑞士，忘了他是奥地利人。
    - 将《一个陌生女人的来信》误记为莫泊桑的作品，因同为短篇名家。
    - 误读“茨”为cì，正确应是cí；或将“茨威格”写成“次威格”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:草甸
  type: Concept
  subject: 语文
  title: 草甸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“草甸”等同于“草地”，忽略低湿环境特点。
    - 能指出并纠正这一错误：把“草甸”写成“草店”，同音字误用。
  aliases: []
  category: 词汇
  explanation: 长满野草的低湿地。
  misconceptions:
    - 将“草甸”等同于“草地”，忽略低湿环境特点。
    - 把“草甸”写成“草店”，同音字误用。
    - 误认为草甸就是沼泽，混淆两种地貌。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:荷叶·母亲
  type: Concept
  subject: 语文
  title: 荷叶·母亲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《荷叶·母亲》作者是泰戈尔，实际是冰心。
    - 能指出并纠正这一错误：误把文中‘荷叶’理解为作者自己，实际应是母亲。
  aliases: []
  category: 文学意象
  explanation: 冰心的散文诗《荷叶·母亲》中，用荷叶覆盖红莲比喻母亲对子女的庇护，赞颂母爱的伟大。
  misconceptions:
    - 误认为《荷叶·母亲》作者是泰戈尔，实际是冰心。
    - 误把文中‘荷叶’理解为作者自己，实际应是母亲。
    - 误将文章主题概括为‘赞颂荷花出淤泥不染’，而非母爱。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:菲利普夫妇
  type: Concept
  subject: 语文
  title: 菲利普夫妇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为菲利普夫妇是勤劳善良的典范，忽略其虚荣和势利。
    - 能指出并纠正这一错误：误以为菲利普先生是主要人物，忘了夫妇合称中太太更决断。
  aliases:
    - 克拉丽丝
  category: 人物形象
  explanation: 菲利普夫妇是《我的叔叔于勒》中的人物，虚荣、势利、冷酷，反映了资本主义社会金钱至上的观念。
  misconceptions:
    - 认为菲利普夫妇是勤劳善良的典范，忽略其虚荣和势利。
    - 误以为菲利普先生是主要人物，忘了夫妇合称中太太更决断。
    - 把菲利普夫妇的冷酷归因于贫穷，而不是金钱至上的观念。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:落子
  type: Concept
  subject: 语文
  title: 落子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将“落子”理解为下棋时落下一子，实际是曲艺杂耍。
    - 能指出并纠正这一错误：误写“落子”为“烙子”或“落籽”，字形混淆。
  aliases:
    - 莲花落
  category: 文化常识
  explanation: 民间曲艺莲花落的俗称，泛指北方地区的各种曲艺杂耍。
  misconceptions:
    - 误将“落子”理解为下棋时落下一子，实际是曲艺杂耍。
    - 误写“落子”为“烙子”或“落籽”，字形混淆。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:落日工程
  type: Concept
  subject: 语文
  title: 落日工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“落日工程”是探索太阳的太空工程，实际是地心探险。
    - 能指出并纠正这一错误：把“落日工程”理解为描写日落景象的文学工程，忽略其科幻设定。
  aliases: []
  category: 科幻设定
  explanation: 小说中与太空探险方向相反的探险工程，飞船潜入地球深处，探索地心。
  misconceptions:
    - 误以为“落日工程”是探索太阳的太空工程，实际是地心探险。
    - 把“落日工程”理解为描写日落景象的文学工程，忽略其科幻设定。
    - 认为“落日工程”与“落日六号”无关，两者概念混淆。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:落水洞
  type: Concept
  subject: 语文
  title: 落水洞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为落水洞是人工开凿的排水口，实际是自然形成的地貌。
    - 能指出并纠正这一错误：将落水洞等同于喀斯特溶洞，混淆洞体与洞口。
  aliases: []
  category: 地理常识
  explanation: 指地表水流入地下的洞穴，文中指丽江高山溪流跌落地下的地方。
  misconceptions:
    - 误认为落水洞是人工开凿的排水口，实际是自然形成的地貌。
    - 将落水洞等同于喀斯特溶洞，混淆洞体与洞口。
    - 把“落水洞”写成“落水动”，形近字混淆。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:蒙疆政府
  type: Concept
  subject: 语文
  title: 蒙疆政府
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘蒙疆’写作‘蒙彊’，‘疆’字内缺‘土’
    - 能指出并纠正这一错误：误以为蒙疆政府是蒙古族自治政府，不是傀儡政权
  aliases: []
  category: 历史常识
  explanation: 日本侵华期间在内蒙古地区扶植的傀儡政权，文中提到“德王的蒙疆政府”。
  misconceptions:
    - 将‘蒙疆’写作‘蒙彊’，‘疆’字内缺‘土’
    - 误以为蒙疆政府是蒙古族自治政府，不是傀儡政权
    - 与‘伪满洲国’混淆，不知其存在于内蒙古地区
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:蒲松龄
  type: Concept
  subject: 语文
  title: 蒲松龄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把蒲松龄的字“留仙”误说成号，或误称“聊斋先生”为字。
    - 能指出并纠正这一错误：将《聊斋志异》与纪昀的《阅微草堂笔记》张冠李戴。
  aliases:
    - 聊斋先生
  category: 文学常识
  explanation: 清代文学家，字留仙，世称聊斋先生，著有文言小说集《聊斋志异》。
  misconceptions:
    - 把蒲松龄的字“留仙”误说成号，或误称“聊斋先生”为字。
    - 将《聊斋志异》与纪昀的《阅微草堂笔记》张冠李戴。
    - 写错作者名字，如把“蒲松龄”写成“蒲松林”或“蒲松令”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:蒲柳人家
  type: Concept
  subject: 语文
  title: 蒲柳人家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《蒲柳人家》说成是刘白羽的散文
    - 能指出并纠正这一错误：误以为‘蒲柳’是普通柳树，不懂指水杨且暗喻早衰
  aliases: []
  category: 文学常识
  explanation: 刘绍棠的中篇小说，以运河岸边普通农家生活为背景，展现乡土人情。本文节选前两节。
  misconceptions:
    - 把《蒲柳人家》说成是刘白羽的散文
    - 误以为‘蒲柳’是普通柳树，不懂指水杨且暗喻早衰
    - 将‘刘绍棠’与‘刘绍铭’混为同一作家
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:蕴藻
  type: Concept
  subject: 语文
  title: 蕴藻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写成“蕴枣”，误以为与枣有关。
    - 能指出并纠正这一错误：误以为蕴藻是“包含文采”的意思。
  aliases: []
  category: 词语
  explanation: 水草。
  misconceptions:
    - 写成“蕴枣”，误以为与枣有关。
    - 误以为蕴藻是“包含文采”的意思。
    - 不知道是水草，猜为一种乐器或食品。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:藤野先生
  type: Concept
  subject: 语文
  title: 藤野先生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为藤野先生是中国人，或认为他是鲁迅的同学
    - 能指出并纠正这一错误：认为藤野先生对鲁迅有民族偏见，如歧视他考试作弊
  aliases:
    - 藤野严九郎
  category: 人物形象
  explanation: 藤野先生是鲁迅在仙台学医时的老师，他治学严谨、正直热忱、没有民族偏见，对鲁迅关怀备至，是鲁迅最感激的老师。
  misconceptions:
    - 误以为藤野先生是中国人，或认为他是鲁迅的同学
    - 认为藤野先生对鲁迅有民族偏见，如歧视他考试作弊
    - 将藤野先生与《范爱农》中人物混淆，如以为他是范爱农
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:虚实相映
  type: Concept
  subject: 语文
  title: 虚实相映
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将梦境（虚）说成实写，眼前景（实）说成虚写，虚实判断颠倒。
    - 能指出并纠正这一错误：把“虚实相映”等同于“借景抒情”，未点出眼前与梦境的交织。
  aliases:
    - 虚实结合
  category: 表现手法
  explanation: 将眼前的实景与心中的故乡梦境交织，丰富诗歌意蕴。
  misconceptions:
    - 将梦境（虚）说成实写，眼前景（实）说成虚写，虚实判断颠倒。
    - 把“虚实相映”等同于“借景抒情”，未点出眼前与梦境的交织。
    - 误以为“虚”就是“虚假”，写诗时把想象的内容当成虚假回避。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:蚊子和狮子
  type: Concept
  subject: 语文
  title: 蚊子和狮子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把寓意概括为‘骄兵必败’，未突出打败大人物却被小人物打败的关键
    - 能指出并纠正这一错误：将《蚊子和狮子》的出处错记为《列子》或《庄子》
  aliases: []
  category: 寓言故事
  explanation: 讽刺打败大人物却被小人物打败的人，出自《伊索寓言》。
  misconceptions:
    - 把寓意概括为‘骄兵必败’，未突出打败大人物却被小人物打败的关键
    - 将《蚊子和狮子》的出处错记为《列子》或《庄子》
    - 误把蚊子最后被蜘蛛网粘住，说成是被青蛙吃掉
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:蛟龙号载人潜水器
  type: Concept
  subject: 语文
  title: 蛟龙号载人潜水器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为蛟龙号下潜深度超过万米，实际是冲击7000米成功。
    - 能指出并纠正这一错误：将蛟龙号写成无人潜水器，实为载人潜水器。
  aliases:
    - 蛟龙号
  category: 史实
  explanation: 2012年6月在马里亚纳海沟冲击7000米深潜成功，创造世界纪录。
  misconceptions:
    - 误以为蛟龙号下潜深度超过万米，实际是冲击7000米成功。
    - 将蛟龙号写成无人潜水器，实为载人潜水器。
    - 误以为蛟龙号是在大西洋下潜，实际是太平洋马里亚纳海沟。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:蜜蜂采蜜式读书法
  type: Concept
  subject: 语文
  title: 蜜蜂采蜜式读书法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为蜜蜂采蜜式读书法就是像蜜蜂一样勤奋，所以是好方法，但此比喻指凭兴趣随意阅读。
    - 能指出并纠正这一错误：把蜜蜂采蜜式与“泛览”画等号，忽略了它更强调缺乏系统性和专一性。
  aliases:
    - 兴趣式阅读
  category: 阅读方法
  explanation: 凭兴趣随意阅读，如蜜蜂采蜜般广泛涉猎，但缺乏系统性和专一性。
  misconceptions:
    - 误以为蜜蜂采蜜式读书法就是像蜜蜂一样勤奋，所以是好方法，但此比喻指凭兴趣随意阅读。
    - 把蜜蜂采蜜式与“泛览”画等号，忽略了它更强调缺乏系统性和专一性。
    - 认为蜜蜂采蜜式就是“博采众长”，实际这种读法缺乏目标，难以形成知识体系。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:血雨腥风
  type: Concept
  subject: 语文
  title: 血雨腥风
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“腥”写成“猩”，变成“血雨猩风”，误以为猩猩的血。
    - 能指出并纠正这一错误：将“血雨腥风”用来形容下大雨刮大风，如“台风登陆真是血雨腥风”，忽略其象征残酷屠杀。
  aliases: []
  category: 成语
  explanation: 形容残酷屠杀的景象。
  misconceptions:
    - 把“腥”写成“猩”，变成“血雨猩风”，误以为猩猩的血。
    - 将“血雨腥风”用来形容下大雨刮大风，如“台风登陆真是血雨腥风”，忽略其象征残酷屠杀。
    - 认为“血雨腥风”是中性词，可夸赞比赛激烈，实际是贬义，用于残酷屠杀景象。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:行头
  type: Concept
  subject: 语文
  title: 行头
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“行头”的“行”读成 háng，误以为指“行业”的着装，正确应读 xíng。
    - 能指出并纠正这一错误：误写为“形头”，以为指演员的头饰造型，实际上泛指整套演出服装。
  aliases: []
  category: 文化常识
  explanation: 戏曲演员演出时穿的服装。
  misconceptions:
    - 把“行头”的“行”读成 háng，误以为指“行业”的着装，正确应读 xíng。
    - 误写为“形头”，以为指演员的头饰造型，实际上泛指整套演出服装。
    - 认为“行头”仅指帽子或头饰，用它指代全部穿戴是错的。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:行款整齐
  type: Concept
  subject: 语文
  title: 行款整齐
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 抄写语段时，字距要比行距小，字的大小基本一致，两边留的空白大致相等，这样写出来才整齐美观。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:行而宜之之谓义
  type: Concept
  subject: 语文
  title: 行而宜之之谓义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“宜”误写为“谊”或“怡”。
    - 能指出并纠正这一错误：误将“之谓”理解为“说的”，如“行而宜之说的就是义”。
  aliases: []
  category: 引用论证
  explanation: 韩愈语，意为做事合乎适宜就是义，作者借此说明“应该”即“合宜”。
  misconceptions:
    - 把“宜”误写为“谊”或“怡”。
    - 误将“之谓”理解为“说的”，如“行而宜之说的就是义”。
    - 把“义”等同于哥们义气，如“为朋友两肋插刀就是义”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:行路难
  type: Concept
  subject: 语文
  title: 行路难
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《行路难》是词牌名，实则乐府古题。
    - 能指出并纠正这一错误：认为“行路难”是写道路崎岖难行，忽略了乐府古题的寓意（世路艰难）。
  aliases: []
  category: 乐府古题
  explanation: 乐府古题，李白以此为题写了三首诗，这是第一首。
  misconceptions:
    - 误以为《行路难》是词牌名，实则乐府古题。
    - 认为“行路难”是写道路崎岖难行，忽略了乐府古题的寓意（世路艰难）。
    - 把《行路难》作者说成杜甫或高适，与李白张冠李戴。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:行辈
  type: Concept
  subject: 语文
  title: 行辈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“行”读为xíng，如“行辈”读同行走。
    - 能指出并纠正这一错误：写成“形辈”，音同形异。
  aliases: []
  category: 文言词语
  explanation: 辈分。
  misconceptions:
    - 将“行”读为xíng，如“行辈”读同行走。
    - 写成“形辈”，音同形异。
    - 误认为“行辈”是行业中的辈分。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:衔接过渡
  type: Concept
  subject: 语文
  title: 衔接过渡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：强加关联词，例如“因为下雨，所以妈妈做的菜很好吃”，前后无因果关系。
    - 能指出并纠正这一错误：该用转折却用递进，如“他很聪明，而且总是很粗心”，应改为“但总是很粗心”。
  aliases:
    - 过渡衔接
  category: 写作知识
  explanation: 运用关联词语、提示性语句或过渡句，使句子之间衔接自然，是语言连贯的重要方法。
  misconceptions:
    - 强加关联词，例如“因为下雨，所以妈妈做的菜很好吃”，前后无因果关系。
    - 该用转折却用递进，如“他很聪明，而且总是很粗心”，应改为“但总是很粗心”。
    - 段落之间没有过渡句，直接跳转话题，比如上一段写校园风景，下一段突然写考试成绩。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:衙门
  type: Concept
  subject: 语文
  title: 衙门
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“衙门”写成“衙们”，误以为“们”表示复数，实际是“门”字。
    - 能指出并纠正这一错误：认为“衙门”泛指所有古代政府机构，包括中央六部，实际多指地方官员办公处。
  aliases: []
  category: 词语
  explanation: 旧时官员办公的机关。
  misconceptions:
    - 把“衙门”写成“衙们”，误以为“们”表示复数，实际是“门”字。
    - 认为“衙门”泛指所有古代政府机构，包括中央六部，实际多指地方官员办公处。
    - 把“衙门”理解为关押犯人的监狱，如说出“关进衙门”，实际是官员办公场所。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:表示颜色的词语
  type: Concept
  subject: 语文
  title: 表示颜色的词语
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 在表示颜色的词前面加上东西的名字，颜色就写得更具体，比如雪白、米白、火红、草绿。平时可以多观察多积累。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:表达得体
  type: Concept
  subject: 语文
  title: 表达得体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：对长辈说“你太牛了”，直呼老师姓名，不注意身份和辈分。
    - 能指出并纠正这一错误：在书面通知中写“求求大家来”，语气恳求，失去正式得体感。
  aliases:
    - 得体
    - 语言得体
  category: 写作原则
  explanation: 在书面或口头交流中，根据写作目的、读者对象、应用场合等，恰当选择用语，使表达符合语境和身份，体现尊重和礼貌。
  misconceptions:
    - 对长辈说“你太牛了”，直呼老师姓名，不注意身份和辈分。
    - 在书面通知中写“求求大家来”，语气恳求，失去正式得体感。
    - 认为只要不写错字、语法正确，就必然表达得体，忽略语境。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:表达愿望的句式
  type: Concept
  subject: 语文
  title: 表达愿望的句式
  conceptType: 概念型
  aliases: []
  category: 句型
  explanation: 用“我多想……”来讲述自己心里特别想做的事，把愿望说清楚。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:表达方式
  type: Concept
  subject: 语文
  title: 表达方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将比喻、拟人、排比归入表达方式，混淆了修辞手法与表达方式。
    - 能指出并纠正这一错误：认为消息中只能使用叙述，用描写、议论就是不合格的新闻。
  aliases: []
  category: 文体知识
  explanation: 表达方式包括叙述、描写、议论、抒情等，不同新闻体裁使用的表达方式各有侧重。
  misconceptions:
    - 将比喻、拟人、排比归入表达方式，混淆了修辞手法与表达方式。
    - 认为消息中只能使用叙述，用描写、议论就是不合格的新闻。
    - 分析课文时分不清“叙述”和“议论”，把记者发表的评论当作事实来概括。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:表达真情实感
  type: Concept
  subject: 语文
  title: 表达真情实感
  conceptType: 概念型
  aliases:
    - 让真情自然流露
  category: 方法
  explanation: 写作文时把印象深刻的内容写具体，让情感真实自然地表达出来；如果事情发展过程中情感有变化，也要把情感的变化写清楚。
  sourceRef: content/六年级/下册/语文/PEP-6-2-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:衬托手法
  type: Concept
  subject: 语文
  title: 衬托手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“桃花潭水深千尺，不及汪伦送我情”说成对比，实际是正衬（以潭水衬托友情）。
    - 能指出并纠正这一错误：误以为衬托必须有“像”“仿佛”等比喻词，忽略“以景衬情”等无标志的衬托。
  aliases: []
  category: 表现手法
  explanation: 衬托是为了突出主要事物，用类似或相反的事物作陪衬。
  misconceptions:
    - 把“桃花潭水深千尺，不及汪伦送我情”说成对比，实际是正衬（以潭水衬托友情）。
    - 误以为衬托必须有“像”“仿佛”等比喻词，忽略“以景衬情”等无标志的衬托。
    - 将衬托与烘托混为一谈，认为烘托也是用次要事物陪衬主要事物，其实烘托多指环境描写。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:袁鹰
  type: Concept
  subject: 语文
  title: 袁鹰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《紫藤萝瀑布》的作者记成袁鹰，实际是宗璞。
    - 能指出并纠正这一错误：误以为袁鹰写过《紫藤萝瀑布》，将其代表作与宗璞作品混淆。
  aliases:
    - 田钟洛
  category: 文学常识
  explanation: 袁鹰（1924—2023），原名田钟洛，江苏淮安人，作家。本文作者，其作品以散文、诗歌为主。
  misconceptions:
    - 把《紫藤萝瀑布》的作者记成袁鹰，实际是宗璞。
    - 误以为袁鹰写过《紫藤萝瀑布》，将其代表作与宗璞作品混淆。
    - 将“袁鹰”错写为“元鹰”或“袁英”，字形书写错误。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:裴矩
  type: Concept
  subject: 语文
  title: 裴矩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘裴矩’的‘矩’读成jù，实际应读jǔ
    - 能指出并纠正这一错误：将裴矩与唐朝名相裴度张冠李戴
  aliases: []
  category: 历史人物
  explanation: 初唐名臣，在隋朝时阿谀逢迎，在唐朝时忠直敢谏，司马光评论其行为随君主态度而变。
  misconceptions:
    - 把‘裴矩’的‘矩’读成jù，实际应读jǔ
    - 将裴矩与唐朝名相裴度张冠李戴
    - 误认为裴矩只在唐朝忠直，忽略其在隋朝谄媚的一面
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:观后感
  type: Concept
  subject: 语文
  title: 观后感
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把观后感写成剧情复述，大段介绍故事内容而没有感想
    - 能指出并纠正这一错误：认为观后感可以与影视内容无关，直接写自己的经历
  aliases: []
  category: 写作知识
  explanation: 观看影视作品后的感想，写法与读后感类似，需注意影视媒介特点。
  misconceptions:
    - 把观后感写成剧情复述，大段介绍故事内容而没有感想
    - 认为观后感可以与影视内容无关，直接写自己的经历
    - 忽略影视镜头的表现手法，只谈情节，不联系媒介特点
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:观察与比较
  type: Concept
  subject: 语文
  title: 观察与比较
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：观察只看局部，如写荷花只写花瓣颜色，忽略整体株型。
    - 能指出并纠正这一错误：比较时标准不一，如比较两个湖泊，一个比面积，一个比深度。
  aliases: []
  category: 写作方法
  explanation: 通过细致观察事物的总体面貌和局部，并进行比较，以把握事物的特征。
  misconceptions:
    - 观察只看局部，如写荷花只写花瓣颜色，忽略整体株型。
    - 比较时标准不一，如比较两个湖泊，一个比面积，一个比深度。
    - 把偶发现象当特征，如见一只白乌鸦就说乌鸦是白色的。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:观察事物的变化
  type: Concept
  subject: 语文
  title: 观察事物的变化
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 事物会随时间发生变化。在不同的时间多看几次，比较前后有什么不同，就能发现其中的奥秘。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:观沧海
  type: Concept
  subject: 语文
  title: 观沧海
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《观沧海》作者写成曹植，或认为曹操是三国蜀汉人。
    - 能指出并纠正这一错误：将“沧海”误写为“苍海”，“澹澹”误读为zhān。
  aliases: []
  category: 诗歌内容
  explanation: 曹操的《观沧海》是一首四言古诗，通过描写大海的壮阔景象，抒发了诗人统一天下的雄心壮志。
  misconceptions:
    - 把《观沧海》作者写成曹植，或认为曹操是三国蜀汉人。
    - 将“沧海”误写为“苍海”，“澹澹”误读为zhān。
    - 把“日月之行，若出其中”修辞说成比喻，实为夸张和想象。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:观点与材料
  type: Concept
  subject: 语文
  title: 观点与材料
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把观点当成材料，如用例子开头当论点
    - 能指出并纠正这一错误：材料与观点脱节，用无关事例支撑论点
  aliases:
    - 论点与论据
  category: 论证知识
  explanation: 观点是作者的主张，材料是支撑观点的论据，二者需紧密联系。
  misconceptions:
    - 把观点当成材料，如用例子开头当论点
    - 材料与观点脱节，用无关事例支撑论点
    - 误以为权威名人说的话都是观点，忽略其作为论据的属性
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:观点要明确
  type: Concept
  subject: 语文
  title: 观点要明确
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写议论文时只说“我认为某个问题”，却不亮明具体态度。
    - 能指出并纠正这一错误：观点表述模棱两可，如“我觉得这样做有好有坏”。
  aliases: []
  category: 写作方法
  explanation: 议论性文章需要明确地表达自己的观点，主张什么，反对什么，都要清清楚楚，态度鲜明。
  misconceptions:
    - 写议论文时只说“我认为某个问题”，却不亮明具体态度。
    - 观点表述模棱两可，如“我觉得这样做有好有坏”。
    - 把别人的观点当作自己的观点，全文没有明确主张。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:觥筹交错
  type: Concept
  subject: 语文
  title: 觥筹交错
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“觥”(gōng)读成guāng或写成“躬”，读音字形混淆。
    - 能指出并纠正这一错误：把“筹”写成“愁”，不懂得“酒筹”是行酒令的筹码。
  aliases: []
  category: 成语
  explanation: 出自《醉翁亭记》，形容宴饮时酒杯和酒筹交互错杂的热闹情景。
  misconceptions:
    - 将“觥”(gōng)读成guāng或写成“躬”，读音字形混淆。
    - 把“筹”写成“愁”，不懂得“酒筹”是行酒令的筹码。
    - 用于形容工作或会议忙碌，背离了宴饮时热闹的特定语境。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:言不及义
  type: Concept
  subject: 语文
  title: 言不及义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“言不及义”理解成“话没说完”。
    - 能指出并纠正这一错误：用“言不及义”形容人说话幽默风趣。
  aliases: []
  category: 成语
  explanation: 只说些无聊的话，不涉及正经道理。
  misconceptions:
    - 把“言不及义”理解成“话没说完”。
    - 用“言不及义”形容人说话幽默风趣。
    - 写成“言不及意”或“言不达义”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:言不尽意
  type: Concept
  subject: 语文
  title: 言不尽意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为语言不能表达意思，干脆不写或随意乱写。
    - 能指出并纠正这一错误：把‘言不尽意’当作写作目标，追求话说到一半让人猜，忽略含蓄的艺术性。
  aliases: []
  category: 文学原理
  explanation: 语言难以完全传达思想情感，文学创作中往往通过含蓄表达来获得更好的艺术效果。
  misconceptions:
    - 认为语言不能表达意思，干脆不写或随意乱写。
    - 把‘言不尽意’当作写作目标，追求话说到一半让人猜，忽略含蓄的艺术性。
    - 误以为言尽意才是好文章，忽视言外之意的美感。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:言与意
  type: Concept
  subject: 语文
  title: 言与意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：修改文章时只改词句不顺，不调整立意，误以为润色文字就是改言。
    - 能指出并纠正这一错误：把“言”和“意”割裂，认为先定内容再改文字，忽略两者互相影响。
  aliases: []
  category: 写作理论
  explanation: 言指言辞和表达，意指立意和思想内容；修改文章要兼顾言和意。
  misconceptions:
    - 修改文章时只改词句不顺，不调整立意，误以为润色文字就是改言。
    - 把“言”和“意”割裂，认为先定内容再改文字，忽略两者互相影响。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:言之有据
  type: Concept
  subject: 语文
  title: 言之有据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“据”写成“居”，误为“言之有居”，字形混淆。
    - 能指出并纠正这一错误：把“言之有据”说成“言之有理”，忽略“据”指材料证据。
  aliases: []
  category: 写作方法
  explanation: 议论要提出观点，还要有能证明观点的材料，材料要准确、与观点一致、丰富。
  misconceptions:
    - 将“据”写成“居”，误为“言之有居”，字形混淆。
    - 把“言之有据”说成“言之有理”，忽略“据”指材料证据。
    - 认为只要提出观点就是有据，未意识到须有准确、一致、丰富的材料支撑。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:言外之意
  type: Concept
  subject: 语文
  title: 言外之意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“但少闲人”仅译成“只是缺少我们两个闲人”，忽略自嘲与悲凉。
    - 能指出并纠正这一错误：认为言外之意就是修辞手法，把“庭下如积水空明”当成言外之意。
  aliases:
    - 弦外之音
  category: 阅读理解
  explanation: 文章字面意思之外隐含的深层含义，需结合背景和语境理解。
  misconceptions:
    - 将“但少闲人”仅译成“只是缺少我们两个闲人”，忽略自嘲与悲凉。
    - 认为言外之意就是修辞手法，把“庭下如积水空明”当成言外之意。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:认真倾听与记录
  type: Concept
  subject: 语文
  title: 认真倾听与记录
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 交流时要认真、耐心地听别人讲话，一边听一边作简要记录，不随意打断，不明白或感兴趣的地方可以适当追问。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:讨论中的合作避短扬长
  type: Concept
  subject: 语文
  title: 讨论中的合作避短扬长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：讨论中只顾陈述己见，不倾听他人，最后各说各话
    - 能指出并纠正这一错误：把讨论当成辩论，认为必须驳倒对方才算参与
  aliases:
    - 避短扬长
  category: 口语交际
  explanation: 讨论是合作避短、共同扬长的过程，通过交流弥补个人局限性，发挥集体优势。
  misconceptions:
    - 讨论中只顾陈述己见，不倾听他人，最后各说各话
    - 把讨论当成辩论，认为必须驳倒对方才算参与
    - 只挑别人的错，不补充自己的不足，忘了合作避短
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:讨论中的理性客观与坦诚谦虚
  type: Concept
  subject: 语文
  title: 讨论中的理性客观与坦诚谦虚
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：听到不同观点立刻情绪化反驳，不能理性分析
    - 能指出并纠正这一错误：觉得承认对方有理就是示弱，坚持错误也不改
  aliases:
    - 理性客观
    - 坦诚谦虚
  category: 口语交际
  explanation: 在讨论中遇到观点碰撞时，应理性客观地发表意见，坦诚谦虚地对待不同看法，以营造互相信任、互相帮助的氛围。
  misconceptions:
    - 听到不同观点立刻情绪化反驳，不能理性分析
    - 觉得承认对方有理就是示弱，坚持错误也不改
    - 讨论时只按个人喜好站队，不依据事实判断
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:讨论的参与态度
  type: Concept
  subject: 语文
  title: 讨论的参与态度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：担心观点不成熟而不敢发言，全程沉默
    - 能指出并纠正这一错误：讨论时积极抢话，打断别人，只顾表达自己
  aliases:
    - 讨论态度
  category: 口语交际
  explanation: 参与者应积极发言，即使观点不成熟也要大胆表达；理性客观地发表意见，坦诚谦虚对待不同看法，在互相信任、互相帮助的氛围中进行讨论。
  misconceptions:
    - 担心观点不成熟而不敢发言，全程沉默
    - 讨论时积极抢话，打断别人，只顾表达自己
    - 轻易附和他人观点，缺乏独立思考和个性表达
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:讨论的意义
  type: Concept
  subject: 语文
  title: 讨论的意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为讨论就是闲聊，不需要准备和聚焦问题
    - 能指出并纠正这一错误：觉得讨论无法解决问题，不如独自思考效率高
  aliases:
    - 讨论的作用
  category: 口语交际
  explanation: 讨论是合作避短、共同扬长的过程，通过交流观点，互相启发，促进问题的解决。
  misconceptions:
    - 认为讨论就是闲聊，不需要准备和聚焦问题
    - 觉得讨论无法解决问题，不如独自思考效率高
    - 把讨论理解为各抒己见，不寻求互相启发和共识
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:讨论规则
  type: Concept
  subject: 语文
  title: 讨论规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：讨论时随意打断发言，认为抢话能加快进度。
    - 能指出并纠正这一错误：主持人率先亮明观点，破坏中立立场。
  aliases:
    - 讨论守则
  category: 学习方法
  explanation: 为保证讨论有序、高效进行而制定的规则，如预先公布要求、主持人中立、发言机会均等、就事论事等。
  misconceptions:
    - 讨论时随意打断发言，认为抢话能加快进度。
    - 主持人率先亮明观点，破坏中立立场。
    - 对不同意见者冷嘲热讽，违背“就事论事”原则。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:议论
  type: Concept
  subject: 语文
  title: 议论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在记叙文中，“啊，母亲真伟大！”是抒情，却错答成议论，区别在于是否直接抒发情感。
    - 能指出并纠正这一错误：认为人物张口说话就是议论，如“母亲说”后面的话被误判为议论，实际是语言描写。
  aliases: []
  category: 表达方式
  explanation: 作者对人物或事件发表看法，表明观点和态度。在记叙文中穿插议论，可以揭示主旨，深化主题。
  misconceptions:
    - 在记叙文中，“啊，母亲真伟大！”是抒情，却错答成议论，区别在于是否直接抒发情感。
    - 认为人物张口说话就是议论，如“母亲说”后面的话被误判为议论，实际是语言描写。
    - 以为只有长篇大论才算议论，忽视画龙点睛的短句也是作者表态，如“这是我能做到的。”
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:议论与抒情结合
  type: Concept
  subject: 语文
  title: 议论与抒情结合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写景后直接写“啊，真美！”就当成发表议论，其实这是抒情。
    - 能指出并纠正这一错误：把“我爱这土地”这类直接抒情的句子误判为议论句。
  aliases: []
  category: 写作手法
  explanation: 在写景基础上发表议论，表达作者观点，如《岳阳楼记》中的议论。
  misconceptions:
    - 写景后直接写“啊，真美！”就当成发表议论，其实这是抒情。
    - 把“我爱这土地”这类直接抒情的句子误判为议论句。
    - 认为议论文中不能有写景抒情，出现景物描写就认为文体错误。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:议论性散文
  type: Concept
  subject: 语文
  title: 议论性散文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为散文只能抒情，不能议论，故判本文为议论文。
    - 能指出并纠正这一错误：把“议论性散文”等同于“议论文”，忽略文学性。
  aliases: []
  category: 文体知识
  explanation: 以议论为主要表达方式的散文，本文短小精悍，观点明确，条理清晰。
  misconceptions:
    - 认为散文只能抒情，不能议论，故判本文为议论文。
    - 把“议论性散文”等同于“议论文”，忽略文学性。
    - 认为短小精悍就没有条理，如“几百字谈不上条理清晰”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:议论性文章
  type: Concept
  subject: 语文
  title: 议论性文章
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把含有议论的记叙文当成议论文。
    - 能指出并纠正这一错误：认为议论文必须以名人名言开头才算有说服力。
  aliases:
    - 议论文
  category: 文体知识
  explanation: 以议论为主要表达方式，通过摆事实、讲道理来阐明观点、主张的文章。
  misconceptions:
    - 把含有议论的记叙文当成议论文。
    - 认为议论文必须以名人名言开头才算有说服力。
    - 混淆议论与说明，认为“介绍事物特点”也是议论。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:议论要言之有据
  type: Concept
  subject: 语文
  title: 议论要言之有据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：提出“阅读很重要”后只反复强调，不举任何事例或名言。
    - 能指出并纠正这一错误：编造名言如“鲁迅说：阅读使人进步”，实则杜撰。
  aliases: []
  category: 写作方法
  explanation: 议论不仅要提出观点，还要有能证明观点的材料，言之有据才能让人信服。
  misconceptions:
    - 提出“阅读很重要”后只反复强调，不举任何事例或名言。
    - 编造名言如“鲁迅说：阅读使人进步”，实则杜撰。
    - 论证“勤奋”却举爱迪生发明电灯的例子，但完全没说勤奋细节。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:记事
  type: Concept
  subject: 语文
  title: 记事
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：记事时按时间顺序记流水账，如‘我起床、吃饭、上学’，无细节和重点。
    - 能指出并纠正这一错误：写事只写事情经过，不写起因结果，或忽略人物感受。
  aliases: []
  category: 写作
  explanation: 记事是基本的写作能力，要求写清楚事情的起因、经过和结果，并传达情感，注意细节和语言表达。
  misconceptions:
    - 记事时按时间顺序记流水账，如‘我起床、吃饭、上学’，无细节和重点。
    - 写事只写事情经过，不写起因结果，或忽略人物感受。
    - 记事作文中忽略‘经过’的详写，把起因经过结果平均用力，主次不分。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:记叙、描写、抒情、议论的综合运用
  type: Concept
  subject: 语文
  title: 记叙、描写、抒情、议论的综合运用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为一篇文章只能有一种表达方式。
    - 能指出并纠正这一错误：把描写当成记叙，如“教室里很安静”是描写不是记叙。
  aliases: []
  category: 写作
  explanation: 本文综合运用多种表达方式，如叙述往事、描写场景、抒发情感、发表议论，以增强表现力和感染力。
  misconceptions:
    - 误以为一篇文章只能有一种表达方式。
    - 把描写当成记叙，如“教室里很安静”是描写不是记叙。
    - 认为抒情必须直抒胸臆，间接抒情不算抒情。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:记叙中的议论和抒情
  type: Concept
  subject: 语文
  title: 记叙中的议论和抒情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘他们的品质是那样的纯洁和高尚’误判为描写，实际是议论。
    - 能指出并纠正这一错误：以为记叙文中的议论和抒情只能放在篇末，不能穿插在事件叙述中。
  aliases: []
  category: 写作手法
  explanation: 在记叙文中，作者在叙述事件的基础上，穿插议论和抒情，以表达观点、抒发感情，增强文章的感染力和说服力。本文多处运用这一手法。
  misconceptions:
    - 把‘他们的品质是那样的纯洁和高尚’误判为描写，实际是议论。
    - 以为记叙文中的议论和抒情只能放在篇末，不能穿插在事件叙述中。
    - 将抒情句‘我爱你，祖国’误认为议论，分不清抒情与议论的区别。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:记叙文六要素
  type: Concept
  subject: 语文
  title: 记叙文六要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把六要素中的“起因”写成“原因”，“结果”写成“结局”
    - 能指出并纠正这一错误：认为每篇记叙文都必须明确写出全部六要素，否则不算合格
  aliases: []
  category: 写作知识
  explanation: 记叙文包含时间、地点、人物、起因、经过、结果六要素，本文通过具体事件展现人物成长。
  misconceptions:
    - 误把六要素中的“起因”写成“原因”，“结果”写成“结局”
    - 认为每篇记叙文都必须明确写出全部六要素，否则不算合格
    - 混淆“时间”和“地点”，例如把“早晨”误当作地点要素
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:记叙文写作
  type: Concept
  subject: 语文
  title: 记叙文写作
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：写流水账，所有事件平均用力，如从起床到睡觉每件事都写500字。
    - 能指出并纠正这一错误：以为记叙文可以完全脱离真实，随意编造离奇情节。
  aliases: []
  category: 写作
  explanation: 以记叙为主要表达方式，写人记事，需注意详略得当、细节描写和真情实感。
  misconceptions:
    - 写流水账，所有事件平均用力，如从起床到睡觉每件事都写500字。
    - 以为记叙文可以完全脱离真实，随意编造离奇情节。
    - 只重叙事，忽略细节描写和情感表达，如写妈妈做饭只写“她做了饭”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:记叙顺序
  type: Concept
  subject: 语文
  title: 记叙顺序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把全文按时间顺序误判为倒叙，因开头先写返回。
    - 能指出并纠正这一错误：认为时间顺序就是毫无波澜的流水账，忽略其条理作用。
  aliases:
    - 时间顺序
  category: 写作知识
  explanation: 按时间顺序叙述事件发展过程，使文章条理清晰。
  misconceptions:
    - 把全文按时间顺序误判为倒叙，因开头先写返回。
    - 认为时间顺序就是毫无波澜的流水账，忽略其条理作用。
    - 与插叙混淆，把文中的回忆内容当成插叙手法。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:讲故事的方法
  type: Concept
  subject: 语文
  title: 讲故事的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 讲故事前要多读几遍记住内容，讲的时候注意语气、表情的变化，做到自然大方。
  sourceRef: content/三年级/下册/语文/PEP-3-2-Chinese/chapters/C8/sections/S4.md
- id: concept:语文:讲笑话的方法
  type: Concept
  subject: 语文
  title: 讲笑话的方法
  conceptType: 程序型
  aliases:
    - 讲笑话
  category: 方法
  explanation: 讲笑话要熟记内容，尽量表现出人物的神态、语气和动作，克服口头禅、重复等不良口语习惯，还要沉住气不笑场。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C8/sections/S4.md
- id: concept:语文:讲解词
  type: Concept
  subject: 语文
  title: 讲解词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为讲解词可以随意说，不讲条理和准确。
    - 能指出并纠正这一错误：把讲解词写成书面文章，没有口语化表达。
  aliases:
    - 解说词
  category: 文体知识
  explanation: 讲解词是一种用于口头介绍事物或场所的文体，要求内容准确、条理清晰、语言生动，以适应特定场合和听众。
  misconceptions:
    - 认为讲解词可以随意说，不讲条理和准确。
    - 把讲解词写成书面文章，没有口语化表达。
    - 以为讲解词只需介绍景物，不需要文化信息。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:论与辩
  type: Concept
  subject: 语文
  title: 论与辩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为“辩”只需揭露对方错误，不须正面论证己方观点。
    - 能指出并纠正这一错误：把“论”和“辩”混为一谈，认为反驳对方就是在论证己方观点。
  aliases: []
  category: 辩论技巧
  explanation: 论是正面论证己方观点，辩是辩驳对方错误或疏漏。
  misconceptions:
    - 误以为“辩”只需揭露对方错误，不须正面论证己方观点。
    - 把“论”和“辩”混为一谈，认为反驳对方就是在论证己方观点。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:论据
  type: Concept
  subject: 语文
  title: 论据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“司马迁忍辱负重写《史记》”这类事实论据误认为道理论据。
    - 能指出并纠正这一错误：将“高尔基说‘书籍是人类进步的阶梯’”当作事实论据。
  aliases: []
  category: 写作知识
  explanation: 用来证明观点的材料，包括事实论据和道理论据。
  misconceptions:
    - 把“司马迁忍辱负重写《史记》”这类事实论据误认为道理论据。
    - 将“高尔基说‘书籍是人类进步的阶梯’”当作事实论据。
    - 认为论据必须全是名人名言，身边的生活事例不能作论据。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:论点
  type: Concept
  subject: 语文
  title: 论点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把论题当论点，如“论读书”是论点。
    - 能指出并纠正这一错误：认为论点必须放在结尾才深刻。
  aliases:
    - 中心论点
  category: 议论文要素
  explanation: 作者对所论述问题的见解和主张，是议论文的灵魂。
  misconceptions:
    - 把论题当论点，如“论读书”是论点。
    - 认为论点必须放在结尾才深刻。
    - 将论点写成疑问句或祈使句，如“我们要不要努力？”
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:论证
  type: Concept
  subject: 语文
  title: 论证
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：举例后不加分析，直接得出观点，缺乏论证过程
    - 能指出并纠正这一错误：把名人名言当作事实论据，不能证明观点
  aliases: []
  category: 写作方法
  explanation: 用道理和事实对观点进行证明，包括立论和驳论。
  misconceptions:
    - 举例后不加分析，直接得出观点，缺乏论证过程
    - 把名人名言当作事实论据，不能证明观点
    - 写议论文时只立论不驳论，或只驳论不立论
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:论证方法
  type: Concept
  subject: 语文
  title: 论证方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“引用名言”说成举例论证。
    - 能指出并纠正这一错误：分不清举例论证与道理论证，认为“讲故事”是道理论证。
  aliases: []
  category: 议论文
  explanation: 议论性文章常用的论证方法有举例论证、对比论证、道理论证、比喻论证等，本文运用了举例论证和道理论证等。
  misconceptions:
    - 将“引用名言”说成举例论证。
    - 分不清举例论证与道理论证，认为“讲故事”是道理论证。
    - 认为比喻论证就是修辞手法，不能作为论证方法。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:论证要合理
  type: Concept
  subject: 语文
  title: 论证要合理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用偶然个例证明普遍规律，如某人抽烟长寿就说吸烟无害
    - 能指出并纠正这一错误：论据与论点不匹配，谈奋斗却用天赋例子
  aliases:
    - 合理论证
  category: 写作方法
  explanation: 写议论文时，论证要合乎逻辑，材料要支持论点，选择恰当论证方法，结构要清晰。
  misconceptions:
    - 用偶然个例证明普遍规律，如某人抽烟长寿就说吸烟无害
    - 论据与论点不匹配，谈奋斗却用天赋例子
    - 用比喻代替逻辑推理，如'因为像钢铁，所以很坚强'
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:讽刺
  type: Concept
  subject: 语文
  title: 讽刺
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为讽刺只是搞笑逗乐，忽略了揭露丑恶的批判目的
    - 能指出并纠正这一错误：误以为本文讽刺说真话的小孩，实际讽刺虚伪的大臣和皇帝
  aliases: []
  category: 表现手法
  explanation: 讽刺是用夸张、反语等手法揭露和批判社会生活中的丑恶现象，本文通过皇帝和大臣的愚蠢行为讽刺了统治者的虚伪。
  misconceptions:
    - 认为讽刺只是搞笑逗乐，忽略了揭露丑恶的批判目的
    - 误以为本文讽刺说真话的小孩，实际讽刺虚伪的大臣和皇帝
    - 将讽刺与幽默等同，不懂讽刺需借助夸张或反语批判现实
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:讽刺作品
  type: Concept
  subject: 语文
  title: 讽刺作品
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把讽刺作品等同于直接骂人，如认为《儒林外史》是在讽刺范进本人，而非批判科举制度。
    - 能指出并纠正这一错误：认为讽刺只能带来笑果，忽略其揭露社会黑暗的严肃意图，如读《围城》只觉好玩。
  aliases: []
  category: 文学体裁
  explanation: 讽刺作品是用夸张、反讽等手法揭露社会黑暗或人性弱点的文学作品，如《儒林外史》。
  misconceptions:
    - 把讽刺作品等同于直接骂人，如认为《儒林外史》是在讽刺范进本人，而非批判科举制度。
    - 认为讽刺只能带来笑果，忽略其揭露社会黑暗的严肃意图，如读《围城》只觉好玩。
    - 混淆夸张与讽刺，认为用了夸张就是讽刺，如把《皇帝的新装》中的夸张看作纯粹搞笑。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:讽刺小说
  type: Concept
  subject: 语文
  title: 讽刺小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将《官场现形记》当作讽刺小说代表作，实际属谴责小说。
    - 能指出并纠正这一错误：误以为讽刺小说就是幽默搞笑小说，忽略其揭露批判的严肃目的。
  aliases: []
  category: 文学体裁
  explanation: 用讽刺手法揭露社会黑暗和人性弱点的长篇小说，《儒林外史》是代表作。
  misconceptions:
    - 将《官场现形记》当作讽刺小说代表作，实际属谴责小说。
    - 误以为讽刺小说就是幽默搞笑小说，忽略其揭露批判的严肃目的。
    - 认为《儒林外史》是才子佳人小说，而非长篇讽刺小说。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:讽刺手法
  type: Concept
  subject: 语文
  title: 讽刺手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把夸张手法直接说成是讽刺手法，忘记讽刺必须带批判倾向。
    - 能指出并纠正这一错误：误将讽刺手法归为修辞手法，实际是表现手法的一种。
  aliases:
    - 讽刺
  category: 写作手法
  explanation: 通过夸张、对比等手法，对人物或社会现象进行揭露和批判，本文中用于讽刺科举制度和世态炎凉。
  misconceptions:
    - 把夸张手法直接说成是讽刺手法，忘记讽刺必须带批判倾向。
    - 误将讽刺手法归为修辞手法，实际是表现手法的一种。
    - 认为讽刺手法只用于反派角色，不能用于讽刺社会现象。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:讽刺文学传统
  type: Concept
  subject: 语文
  title: 讽刺文学传统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为讽刺文学始于近代鲁迅，不知《诗经》中已有'美刺'传统。
    - 能指出并纠正这一错误：把'美刺'理解成只有赞美，忽略'刺'即讽刺批评功能。
  aliases:
    - 讽刺文学
  category: 文学知识
  explanation: 讽刺文学源远流长，西方可追溯至古希腊寓言和喜剧，中国则导源于《诗经》的“美刺”和史传的“惩劝”。
  misconceptions:
    - 认为讽刺文学始于近代鲁迅，不知《诗经》中已有'美刺'传统。
    - 把'美刺'理解成只有赞美，忽略'刺'即讽刺批评功能。
    - 误以为西方讽刺传统仅源于喜剧，不知古希腊寓言也有讽刺。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:讽谏
  type: Concept
  subject: 语文
  title: 讽谏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“讽谏”理解为讥讽批评，忘记是委婉规劝。
    - 能指出并纠正这一错误：误用“讽谏”指下级对一般人的提意见，实际多用于臣对君。
  aliases: []
  category: 文言词语
  explanation: 用含蓄的话委婉地规劝，是古代臣子向君主进谏的一种方式。
  misconceptions:
    - 将“讽谏”理解为讥讽批评，忘记是委婉规劝。
    - 误用“讽谏”指下级对一般人的提意见，实际多用于臣对君。
    - 把“讽谏”写作“风谏”，且不知其义。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:设色
  type: Concept
  subject: 语文
  title: 设色
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为设色是修辞手法，答“这首诗用了设色手法”。
    - 能指出并纠正这一错误：忽略色彩词营造的视觉效果，只找颜色词，不知道“黑云”“燕脂”有比喻象征。
  aliases:
    - 着色
  category: 艺术特色
  explanation: 设色指诗歌中运用色彩词语描绘画面，如《雁门太守行》中“黑云”“金鳞”“燕脂”等。
  misconceptions:
    - 误以为设色是修辞手法，答“这首诗用了设色手法”。
    - 忽略色彩词营造的视觉效果，只找颜色词，不知道“黑云”“燕脂”有比喻象征。
    - 把“金鳞”理解为鱼鳞，没看出是形容铠甲闪光。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:设问
  type: Concept
  subject: 语文
  title: 设问
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'难道不是这样吗？'当设问，实际是反问，答案已在句中。
    - 能指出并纠正这一错误：设问后不回答，或自问自答时答非所问，让听众困惑。
  aliases: []
  category: 修辞手法
  explanation: 自问自答，引起听众注意，如“业有什么可敬呢？为什么”。
  misconceptions:
    - 把'难道不是这样吗？'当设问，实际是反问，答案已在句中。
    - 设问后不回答，或自问自答时答非所问，让听众困惑。
    - 误认为设问就是疑问句，未意识到设问需自问自答，引起思考。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:访问提纲
  type: Concept
  subject: 语文
  title: 访问提纲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：访问提纲写成了采访记录，忘记提纲是事前计划，不需要写回答。
    - 能指出并纠正这一错误：提纲中只列了问题，遗漏访问目的、时间、对象等必要项目。
  aliases: []
  category: 写作
  explanation: 访问提纲是访问前准备的计划，包括目的、问题、步骤等。
  misconceptions:
    - 访问提纲写成了采访记录，忘记提纲是事前计划，不需要写回答。
    - 提纲中只列了问题，遗漏访问目的、时间、对象等必要项目。
    - 把访问提纲与调查问卷混淆，问卷是设计选择题，提纲是开放性问题。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:词牌
  type: Concept
  subject: 语文
  title: 词牌
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为词牌就是词的题目，影响对内容的理解。
    - 能指出并纠正这一错误：以为词牌规定了词的内容主题，实为格律格式。
  aliases: []
  category: 文体知识
  explanation: 词的格式名称，决定词的格律。
  misconceptions:
    - 认为词牌就是词的题目，影响对内容的理解。
    - 以为词牌规定了词的内容主题，实为格律格式。
    - 把“词牌”和“曲牌”混为一谈，两者来源不同。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:词牌名
  type: Concept
  subject: 语文
  title: 词牌名
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'江城子'当成词的题目，如认为《江城子·密州出猎》的题目是'江城子'。
    - 能指出并纠正这一错误：认为同词牌名的词内容一定相同，如认为所有《满江红》都写爱国。
  aliases: []
  category: 文学常识
  explanation: 词牌名是词的格式的名称，如“渔家傲”“江城子”“破阵子”“满江红”等，决定词的格律。
  misconceptions:
    - 把'江城子'当成词的题目，如认为《江城子·密州出猎》的题目是'江城子'。
    - 认为同词牌名的词内容一定相同，如认为所有《满江红》都写爱国。
    - 写字词时误写，如把'渔家傲'写成'渔家敖'。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:词类活用
  type: Concept
  subject: 语文
  title: 词类活用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把通假字（如‘反’通‘返’）也当成词类活用，混淆了两种文言现象。
    - 能指出并纠正这一错误：误以为词类活用是词义的古今变化，而不是特定语境下的临时用法。
  aliases: []
  category: 文言语法
  explanation: 文言文中某些词在特定语境下临时改变词性或用法，如名词作状语、形容词作动词等。
  misconceptions:
    - 把通假字（如‘反’通‘返’）也当成词类活用，混淆了两种文言现象。
    - 误以为词类活用是词义的古今变化，而不是特定语境下的临时用法。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:词类活用：名词作动词
  type: Concept
  subject: 语文
  title: 词类活用：名词作动词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘颔’直译为‘下巴’，导致‘但微颔之’译成‘只是微微下巴了一下’。
    - 能指出并纠正这一错误：认为‘颔’是动词‘含’，与‘颔首’混淆，译成‘微微含着它’。
  aliases: []
  category: 文言语法
  explanation: “轻吾射”中的“轻”是形容词作动词，意为“轻视”；“但微颔之”中的“颔”是名词作动词，意为“点头”。
  misconceptions:
    - 将‘颔’直译为‘下巴’，导致‘但微颔之’译成‘只是微微下巴了一下’。
    - 认为‘颔’是动词‘含’，与‘颔首’混淆，译成‘微微含着它’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:词类活用：形容词作动词
  type: Concept
  subject: 语文
  title: 词类活用：形容词作动词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘尔安敢轻吾射’的‘轻’直接译成‘轻快’，忽略作动词‘轻视’。
    - 能指出并纠正这一错误：把‘轻’理解为意动用法‘以……为轻’，但此处是形容词直接作动词‘轻视’。
  aliases: []
  category: 文言语法
  explanation: “尔安敢轻吾射”中“轻”本为形容词，此处活用作动词，意为“轻视”。
  misconceptions:
    - 把‘尔安敢轻吾射’的‘轻’直接译成‘轻快’，忽略作动词‘轻视’。
    - 把‘轻’理解为意动用法‘以……为轻’，但此处是形容词直接作动词‘轻视’。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:词语含义理解
  type: Concept
  subject: 语文
  title: 词语含义理解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：解释词语时只写词典义，不考虑文中语境，如“折腾”误译为“翻来覆去”。
    - 能指出并纠正这一错误：把比喻义当本义，如“脸色苍白”理解成纸的颜色。
  aliases:
    - 词义理解
  category: 阅读方法
  explanation: 理解词语在具体语境中的含义，包括本义、引申义、比喻义等。
  misconceptions:
    - 解释词语时只写词典义，不考虑文中语境，如“折腾”误译为“翻来覆去”。
    - 把比喻义当本义，如“脸色苍白”理解成纸的颜色。
    - 混淆引申义和比喻义，认为两者等同，不加区分。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:词语搭配
  type: Concept
  subject: 语文
  title: 词语搭配
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 把动作和事物搭配好，句子才通顺。比如春风要吹、秋霜要降、冬雪要飘。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:词语的感情色彩
  type: Concept
  subject: 语文
  title: 词语的感情色彩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘狭隘’是中性词，实际它带有贬抑、否定的感情色彩
    - 能指出并纠正这一错误：把‘高尚’‘纯粹’误判为中性词，忽略了汉语词语常带有褒贬等情感倾向
  aliases:
    - 褒义词
    - 贬义词
  category: 语文知识
  explanation: 汉语中有些词语带有褒贬等感情色彩，如“高尚”“纯粹”带有赞美、肯定的情感，“狭隘”带有贬抑、否定的情感。
  misconceptions:
    - 认为‘狭隘’是中性词，实际它带有贬抑、否定的感情色彩
    - 把‘高尚’‘纯粹’误判为中性词，忽略了汉语词语常带有褒贬等情感倾向
    - 分不清词语感情色彩与词义的区别，例如将‘顽强’‘顽固’都看作褒义词
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:词语的新含义
  type: Concept
  subject: 语文
  title: 词语的新含义
  conceptType: 概念型
  aliases:
    - 新词新义
  category: 概念
  explanation: 有的词语是近几十年才出现的，如“云技术”“多媒体”；有的词语在原有意思的基础上有了新的意思，如“窗口”“潜水”。要注意积累和辨别。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:词语积累
  type: Concept
  subject: 语文
  title: 词语积累
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“截然”的“截”误写为“接”，形成“接然不同”的错误写法
    - 能指出并纠正这一错误：把“不求甚解”的“甚”理解为“很”，错解为“不很理解”，实际“甚”是“深”
  aliases: []
  category: 基础知识
  explanation: 掌握“截然、不求甚解、恍然大悟”等词语的音形义。
  misconceptions:
    - 将“截然”的“截”误写为“接”，形成“接然不同”的错误写法
    - 把“不求甚解”的“甚”理解为“很”，错解为“不很理解”，实际“甚”是“深”
    - 写“恍然大悟”时把“恍”误写成“晃”，或把“悟”误写成“误”
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:诗歌创作
  type: Concept
  subject: 语文
  title: 诗歌创作
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写诗时直白抒情，如“我很高兴，我很开心”，缺少对意象的运用。
    - 能指出并纠正这一错误：认为只要词语优美、押韵就行，写“春风温柔地吹”却不表达独特感受。
  aliases:
    - 写诗
  category: 写作方法
  explanation: 通过联想和想象，借助意象表达情感，注意语言的简洁凝练和节奏韵律。
  misconceptions:
    - 写诗时直白抒情，如“我很高兴，我很开心”，缺少对意象的运用。
    - 认为只要词语优美、押韵就行，写“春风温柔地吹”却不表达独特感受。
    - 堆砌“月亮、星星、花朵”等意象却不关联情感，读者感受不到想表达什么。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诗歌意境
  type: Concept
  subject: 语文
  title: 诗歌意境
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“两个黄鹂鸣翠柳”理解为只是写景，没体会出生机勃勃的意境。
    - 能指出并纠正这一错误：认为意境就是意象的排列，说“枯藤老树昏鸦”是意境，忽略了情感交融。
  aliases: []
  category: 文学
  explanation: 诗人的主观情感与客观景物交融而形成的艺术境界。
  misconceptions:
    - 把“两个黄鹂鸣翠柳”理解为只是写景，没体会出生机勃勃的意境。
    - 认为意境就是意象的排列，说“枯藤老树昏鸦”是意境，忽略了情感交融。
    - 误将“驿外断桥边”的客观环境当意境，不看作者在其中的情感投射。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诗歌意象
  type: Concept
  subject: 语文
  title: 诗歌意象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有出现在诗里的景物都是意象，如“窗含西岭千秋雪”中的“窗”是视点非意象。
    - 能指出并纠正这一错误：把“月亮”的意象固化为思乡，见到“秦时明月汉时关”也解释成思乡，忽略边塞意蕴。
  aliases: []
  category: 文学
  explanation: 诗歌中融入诗人思想感情的物象，是构成诗歌意境的元素。
  misconceptions:
    - 认为所有出现在诗里的景物都是意象，如“窗含西岭千秋雪”中的“窗”是视点非意象。
    - 把“月亮”的意象固化为思乡，见到“秦时明月汉时关”也解释成思乡，忽略边塞意蕴。
    - 混淆意象和意境，说“这个意象很凄凉”，凄凉是意境特点，不是意象本身。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诗歌感情基调
  type: Concept
  subject: 语文
  title: 诗歌感情基调
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：根据个别词语判断基调，如《春望》见“花”“鸟”就说生机勃勃，忽略“溅泪”“惊心”。
    - 能指出并纠正这一错误：认为全诗基调必须前后一致，看到《茅屋为秋风所破歌》前悲后扬就判定矛盾。
  aliases: []
  category: 文学
  explanation: 诗歌整体所呈现的情感倾向和氛围，如豪迈、哀婉、激昂等。
  misconceptions:
    - 根据个别词语判断基调，如《春望》见“花”“鸟”就说生机勃勃，忽略“溅泪”“惊心”。
    - 认为全诗基调必须前后一致，看到《茅屋为秋风所破歌》前悲后扬就判定矛盾。
    - 把“哀婉”说成“悲伤”，未区分委婉含蓄与直接悲痛，对基调把握不准。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诗歌朗诵
  type: Concept
  subject: 语文
  title: 诗歌朗诵
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：朗读时只求声音大，读成喊叫，缺乏节奏和情感
    - 能指出并纠正这一错误：把朗诵等同于背书，语速均匀，没有轻重缓急
  aliases:
    - 朗诵
  category: 语文实践
  explanation: 通过声音、节奏、情感等表现诗歌内容与韵律的朗读方式，本课要求读出气势和节奏感。
  misconceptions:
    - 朗读时只求声音大，读成喊叫，缺乏节奏和情感
    - 把朗诵等同于背书，语速均匀，没有轻重缓急
    - 朗诵‘黄河！’时读成上扬调，不会用停顿和重音表现气势
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:诗歌的理性美
  type: Concept
  subject: 语文
  title: 诗歌的理性美
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有哲理诗才有理性美，抒情诗如《你是人间的四月天》没有。
    - 能指出并纠正这一错误：把诗歌中的哲理当作直白道理，如将‘山重水复疑无路’只理解为坚持。
  aliases:
    - 哲理美
  category: 文学概念
  explanation: 诗歌在情感之外蕴含的哲理和思考，通过意象和语言体现。
  misconceptions:
    - 认为只有哲理诗才有理性美，抒情诗如《你是人间的四月天》没有。
    - 把诗歌中的哲理当作直白道理，如将‘山重水复疑无路’只理解为坚持。
    - 忽略意象载体，直接概括抽象哲理，如把‘沉舟侧畔千帆过’仅说成新事物必胜。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诗歌节奏
  type: Concept
  subject: 语文
  title: 诗歌节奏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：朗读时只按标点停顿，在‘轻轻的我走了’的‘的’后也停顿。
    - 能指出并纠正这一错误：认为节奏就是押韵，把押韵的字作为划分节奏的唯一依据。
  aliases:
    - 韵律
  category: 诗歌形式
  explanation: 诗歌语言的韵律和节奏，使诗歌读起来朗朗上口，增强表现力。
  misconceptions:
    - 朗读时只按标点停顿，在‘轻轻的我走了’的‘的’后也停顿。
    - 认为节奏就是押韵，把押韵的字作为划分节奏的唯一依据。
    - 将节奏等同于语速，以为读得快就是节奏感强。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诗歌鉴赏
  type: Concept
  subject: 语文
  title: 诗歌鉴赏
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：鉴赏时不结合注释，把‘蜡炬成灰泪始干’理解为写蜡烛燃烧。
    - 能指出并纠正这一错误：只翻译诗句不分析意象意境，如对‘大漠孤烟直’仅解释景象。
  aliases:
    - 诗歌赏析
  category: 文学鉴赏
  explanation: 通过独立阅读、结合注释、反复朗诵等方式，理解诗歌意蕴、体会艺术魅力，并分析感情基调、意象、意境等。
  misconceptions:
    - 鉴赏时不结合注释，把‘蜡炬成灰泪始干’理解为写蜡烛燃烧。
    - 只翻译诗句不分析意象意境，如对‘大漠孤烟直’仅解释景象。
    - 套用感情模板，见‘愁’字就定为忧愁，忽略全诗基调。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诗歌韵律
  type: Concept
  subject: 语文
  title: 诗歌韵律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为押韵就是每句末字韵母相同，不管平仄和韵部，如“生”和“风”误以为同韵。
    - 能指出并纠正这一错误：误以为绝句四句都必须押韵，实际一般二、四句押韵，首句可押可不押。
  aliases:
    - 节奏
  category: 文学理论
  explanation: 韵律指诗歌中的押韵和节奏，是诗歌形式美的重要体现。
  misconceptions:
    - 认为押韵就是每句末字韵母相同，不管平仄和韵部，如“生”和“风”误以为同韵。
    - 误以为绝句四句都必须押韵，实际一般二、四句押韵，首句可押可不押。
    - 将七言诗节奏一律划为“四三”，如“两个黄鹂/鸣翠柳”，忽略“二二三”的固有节奏。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:诙谐幽默
  type: Concept
  subject: 语文
  title: 诙谐幽默
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“伟大的神力”中的反语当作真实赞美，忽略其调侃意味。
    - 能指出并纠正这一错误：认为本文语言幽默只是为了有趣，未能体会幽默中蕴含的深情。
  aliases: []
  category: 语言风格
  explanation: 文中用夸张、反语等手法，使语言风趣，如“伟大的神力”。
  misconceptions:
    - 把“伟大的神力”中的反语当作真实赞美，忽略其调侃意味。
    - 认为本文语言幽默只是为了有趣，未能体会幽默中蕴含的深情。
    - 认为“她却能够做成功”是讽刺阿长的愚昧，忽略了这句话褒扬的意味。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:话剧
  type: Concept
  subject: 语文
  title: 话剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为话剧包含唱段，写成“话剧以唱歌为主”，实际以对话和动作为主。
    - 能指出并纠正这一错误：把话剧和戏曲混为一谈，认为话剧也有程式化动作和脸谱。
  aliases:
    - 戏剧
  category: 文学常识
  explanation: 以对话和动作为主要表现手段的戏剧形式，通过舞台演出呈现故事情节。
  misconceptions:
    - 误以为话剧包含唱段，写成“话剧以唱歌为主”，实际以对话和动作为主。
    - 把话剧和戏曲混为一谈，认为话剧也有程式化动作和脸谱。
    - 写“话剧的表演形式是边说边唱”，混淆话剧与歌剧的特点。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:话题统一
  type: Concept
  subject: 语文
  title: 话题统一
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写“我的妈妈”时，突然用大半段写自己养的小狗，完全偏离中心话题。
    - 能指出并纠正这一错误：一句话说学校，下一句说外星人，且没有交代，话题凭空跳跃。
  aliases:
    - 话题一致
  category: 写作知识
  explanation: 一段话中的所有句子都应围绕共同的话题展开，保持话题的前后统一，这是语言连贯的基本要求。
  misconceptions:
    - 写“我的妈妈”时，突然用大半段写自己养的小狗，完全偏离中心话题。
    - 一句话说学校，下一句说外星人，且没有交代，话题凭空跳跃。
    - 写景时穿插与景物无关的内心独白，如描写春天又突然感叹“我很想吃西瓜”，导致话题分裂。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:详写与略写
  type: Concept
  subject: 语文
  title: 详写与略写
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为详写就是写得多，略写就是写少，不清楚依据是主旨需要。
    - 能指出并纠正这一错误：把略写战斗生活判断为作者不重视，实际是借助日常生活展现军民关系。
  aliases: []
  category: 写作手法
  explanation: 详写与略写是安排材料详略的方法，本文详写与妞儿一家的交往，略写战斗生活。
  misconceptions:
    - 误认为详写就是写得多，略写就是写少，不清楚依据是主旨需要。
    - 把略写战斗生活判断为作者不重视，实际是借助日常生活展现军民关系。
    - 认为详写部分必须平铺直叙，忽略文中对话和细节的穿插安排。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:详略得当
  type: Concept
  subject: 语文
  title: 详略得当
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为买《山海经》部分是略写，将阿长叫“我”起床等琐事当作详写。
    - 能指出并纠正这一错误：误以为详写的是阿长买《山海经》的经过，实际上买书过程写得简略，详写的是阿长其人及“我”的渴慕。
  aliases: []
  category: 写作手法
  explanation: 文章详写阿长买《山海经》等事，略写其他，突出中心人物。
  misconceptions:
    - 误以为买《山海经》部分是略写，将阿长叫“我”起床等琐事当作详写。
    - 误以为详写的是阿长买《山海经》的经过，实际上买书过程写得简略，详写的是阿长其人及“我”的渴慕。
    - 分析详略时只笼统说“详略分明”，说不出哪些内容详写、哪些略写及其作用。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:语境
  type: Concept
  subject: 语文
  title: 语境
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：孤立理解“他那天很高兴”中的“高兴”为“喜欢”，脱离语境，实际指“愉快”。
    - 能指出并纠正这一错误：认为语境只对多义词有作用，而“打酱油”“打毛衣”中的“打”无需语境就能确定。
  aliases:
    - 语言环境
  category: 词汇知识
  explanation: 语境是语言使用的环境，对词义有制约作用，阅读时要根据语境确定多义词的具体意义，语境有时赋予词临时意义。
  misconceptions:
    - 孤立理解“他那天很高兴”中的“高兴”为“喜欢”，脱离语境，实际指“愉快”。
    - 认为语境只对多义词有作用，而“打酱油”“打毛衣”中的“打”无需语境就能确定。
    - 忽略语境赋予的临时意义，把“这孩子真皮”中的“皮”解释为“皮肤”，不懂临时指“调皮”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:语序要合理
  type: Concept
  subject: 语文
  title: 语序要合理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：多项定语顺序错乱，如“一个我的新书包”应为“我的一个新书包”。
    - 能指出并纠正这一错误：误以为语序不影响意思，任意颠倒。
  aliases:
    - 语序
  category: 语法
  explanation: 句子中词语的排列顺序要符合逻辑和习惯，多项定语的一般顺序为领属（范围）+数量+形容或描写。
  misconceptions:
    - 多项定语顺序错乱，如“一个我的新书包”应为“我的一个新书包”。
    - 误以为语序不影响意思，任意颠倒。
    - 误认为“他的黑色的帽子”语序不对，坚持说“黑色的他的帽子”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:语气助词
  type: Concept
  subject: 语文
  title: 语气助词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘天晴了’的‘了’误认为动态助词，实际上它主要表示陈述语气。
    - 能指出并纠正这一错误：误将‘啊’‘吧’当作叹词，如‘快来啊’中的‘啊’被看作叹词。
  aliases:
    - 语气词
  category: 语法
  explanation: 语气助词包括“了”“啊”“啦”“吗”“呢”“吧”“呀”等，放在句末表示陈述、疑问、祈使或感叹等语气。
  misconceptions:
    - 把‘天晴了’的‘了’误认为动态助词，实际上它主要表示陈述语气。
    - 误将‘啊’‘吧’当作叹词，如‘快来啊’中的‘啊’被看作叹词。
    - 疑问句该用‘吗’却用‘呢’，如写‘你去呢？’造成语气错误。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:语言简明
  type: Concept
  subject: 语文
  title: 语言简明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把简明当作简短，删去必要词语，如“我的爸爸是工人”写成“爸工人”。
    - 能指出并纠正这一错误：为了简洁省略主语，导致句意不明，如“吃完饭去散步”不知谁去。
  aliases:
    - 简明
  category: 写作知识
  explanation: 简明就是简要、明白，行文时当简则简，语言精练不重复啰唆，同时表达清楚明白不让人误解。
  misconceptions:
    - 把简明当作简短，删去必要词语，如“我的爸爸是工人”写成“爸工人”。
    - 为了简洁省略主语，导致句意不明，如“吃完饭去散步”不知谁去。
    - 过度压缩句子，漏掉关键信息，如“他打球受伤”缺时间地点。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:语言连贯
  type: Concept
  subject: 语文
  title: 语言连贯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：两个句子毫无逻辑关联，如“他吃了一个面包，天空很蓝”，读来莫名其妙。
    - 能指出并纠正这一错误：前后人称不一致，上文用“你”，下文突然变成“我”，视角混乱。
  aliases:
    - 连贯性
  category: 写作知识
  explanation: 语言连贯是指写文章和说话时，句子之间逻辑关系紧密，衔接自然，前后不脱节，条理清晰。
  misconceptions:
    - 两个句子毫无逻辑关联，如“他吃了一个面包，天空很蓝”，读来莫名其妙。
    - 前后人称不一致，上文用“你”，下文突然变成“我”，视角混乱。
    - 重复使用同一个名词而不加代词或同义词，如“小明看见小明的小狗，小明很高兴”，啰嗦不连贯。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S5.md
- id: concept:语文:语言风格
  type: Concept
  subject: 语文
  title: 语言风格
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为本文语言华丽、多用排比夸张，实际是平实朴素而饱含深情。
    - 能指出并纠正这一错误：把‘蹒跚’与‘徘徊’误用，用时表示‘从容不迫’的意思。
  aliases:
    - 素朴典雅
  category: 写作特色
  explanation: 本文语言平实朴素，但饱含情感，简净细致，具有极强的表现力，如“蹒跚”“探身”等词语的运用。
  misconceptions:
    - 认为本文语言华丽、多用排比夸张，实际是平实朴素而饱含深情。
    - 把‘蹒跚’与‘徘徊’误用，用时表示‘从容不迫’的意思。
    - 将‘探身’‘攀着’等动作描写识别为拟人修辞，而非白描细节。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:误会
  type: Concept
  subject: 语文
  title: 误会
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将误会与悬念等同，实际上误会是人物错误理解，悬念是读者期待
    - 能指出并纠正这一错误：认为误会是修辞手法，其实它是推动情节的写作手法
  aliases: []
  category: 写作手法
  explanation: 误会是作者故意让作品中的人物产生错误理解，从而推动情节发展的写作手法。
  misconceptions:
    - 将误会与悬念等同，实际上误会是人物错误理解，悬念是读者期待
    - 认为误会是修辞手法，其实它是推动情节的写作手法
    - 把‘误解’和‘误会’混同，误会是作者有意安排人物错误理解
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:说新闻
  type: Concept
  subject: 语文
  title: 说新闻
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把最近了解到的新闻讲给别人听，要说明新闻的来源，把内容讲清楚、不随意更改，最后还可以说说自己的看法。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:说明事物要抓住特征
  type: Concept
  subject: 语文
  title: 说明事物要抓住特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把次要特征当主要特征，如说明大象只强调耳朵大，不写鼻子。
    - 能指出并纠正这一错误：面面俱到，每个特点只写一句，结果没有突出主要特征。
  aliases:
    - 抓住特征说明
  category: 写作方法
  explanation: 写作说明文时，要抓住事物的特征，通过观察、比较、引用资料、运用生动说明等方法，准确清晰地说明事物。
  misconceptions:
    - 把次要特征当主要特征，如说明大象只强调耳朵大，不写鼻子。
    - 面面俱到，每个特点只写一句，结果没有突出主要特征。
    - 只写与相似事物的共同点，如说明狼只写“像狗”，不写独有特征。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:说明对象
  type: Concept
  subject: 语文
  title: 说明对象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把标题当说明对象，如将‘苏州园林’的说明对象答成‘园林的景色’。
    - 能指出并纠正这一错误：把某个突出说明对象误认为全文中心，如‘赵州桥’答成对象。
  aliases: []
  category: 阅读方法
  explanation: 说明文所介绍或阐释的事物或事理，是文章说明的中心。
  misconceptions:
    - 把标题当说明对象，如将‘苏州园林’的说明对象答成‘园林的景色’。
    - 把某个突出说明对象误认为全文中心，如‘赵州桥’答成对象。
    - 分不清事理说明文的对象，把‘为什么’答成‘是什么’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:说明对象的特征
  type: Concept
  subject: 语文
  title: 说明对象的特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把说明对象的用途、功能误当特征，如说‘石拱桥可以过河’。
    - 能指出并纠正这一错误：概括特征时只写一个方面，如只写‘历史悠久’漏掉‘结构坚固’。
  aliases: []
  category: 阅读方法
  explanation: 说明对象区别于其他事物的标志，是说明文的核心内容，把握特征是理解文章的关键。
  misconceptions:
    - 把说明对象的用途、功能误当特征，如说‘石拱桥可以过河’。
    - 概括特征时只写一个方面，如只写‘历史悠久’漏掉‘结构坚固’。
    - 混淆不同对象的特征，如把‘赵州桥’的特征安到‘卢沟桥’上。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:说明性文章
  type: Concept
  subject: 语文
  title: 说明性文章
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在说明文中寻找人物情感，像读记叙文一样分析‘感动’等情绪。
    - 能指出并纠正这一错误：认为说明文只能平实，看见生动描写就判定不是说明文。
  aliases:
    - 说明文
  category: 文体知识
  explanation: 以说明为主要表达方式，客观地介绍事物或阐明事理的文章，具有知识性、科学性和准确性。
  misconceptions:
    - 在说明文中寻找人物情感，像读记叙文一样分析‘感动’等情绪。
    - 认为说明文只能平实，看见生动描写就判定不是说明文。
    - 忽视科学性，认为‘大概’‘可能’等词语是多余或不严谨的。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:说明文
  type: Concept
  subject: 语文
  title: 说明文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将本文的说明对象误认为是苏州各园林的具体景点。
    - 能指出并纠正这一错误：把“隔而不隔”的说明方法说成“打比方”，实为作诠释。
  aliases: []
  category: 文体知识
  explanation: 以说明为主要表达方式，客观地介绍事物或阐明事理的文章。本文是说明文。
  misconceptions:
    - 将本文的说明对象误认为是苏州各园林的具体景点。
    - 把“隔而不隔”的说明方法说成“打比方”，实为作诠释。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:说明文的结构
  type: Concept
  subject: 语文
  title: 说明文的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：见到‘首先’‘其次’就断定是递进，其实‘首先…其次…然后…’常是并列。
    - 能指出并纠正这一错误：套用‘总—分—总’万能结构，遇到《生物入侵者》这种递进结构也硬套。
  aliases: []
  category: 说明文知识
  explanation: 说明文全篇或段落的组织方式，如总分、并列、递进等，体现条理性。
  misconceptions:
    - 见到‘首先’‘其次’就断定是递进，其实‘首先…其次…然后…’常是并列。
    - 套用‘总—分—总’万能结构，遇到《生物入侵者》这种递进结构也硬套。
    - 把说明文结构等同于段落划分，认为每写一段就是一层结构。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:说明文语言特点
  type: Concept
  subject: 语文
  title: 说明文语言特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为'大约''左右'使说明不精确，应删去，实际这些词恰恰体现准确性。
    - 能指出并纠正这一错误：以为限制性词语如'一般'多余，去掉后不影响意思，但可能改变说明范围。
  aliases: []
  category: 语言特点
  explanation: 说明文语言要求准确、严谨，常使用约数、限制性词语等来体现科学性。
  misconceptions:
    - 认为'大约''左右'使说明不精确，应删去，实际这些词恰恰体现准确性。
    - 以为限制性词语如'一般'多余，去掉后不影响意思，但可能改变说明范围。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:说明方法
  type: Concept
  subject: 语文
  title: 说明方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘打比方’说成‘比喻’或‘拟人’，混淆修辞与说明方法。
    - 能指出并纠正这一错误：作比较与列数字混淆，如‘比……大’只答列数字，漏掉作比较。
  aliases: []
  category: 写作手法
  explanation: 说明文中为了清楚说明事物特征而采用的方法，如举例子、列数字、打比方、作比较等。
  misconceptions:
    - 把‘打比方’说成‘比喻’或‘拟人’，混淆修辞与说明方法。
    - 作比较与列数字混淆，如‘比……大’只答列数字，漏掉作比较。
    - 答说明方法不写具体内容，如只说‘举例子’但没说举什么例。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:说明特征
  type: Concept
  subject: 语文
  title: 说明特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把说明方法的作用当作说明特征，如看到列数字就说‘特征是准确’。
    - 能指出并纠正这一错误：找特征时只看外观，忽略本质，如说‘松鼠的特征是有一条大尾巴’而漏掉‘驯良’。
  aliases: []
  category: 说明文知识
  explanation: 说明对象区别于其他事物的标志性特点，是说明文的核心。
  misconceptions:
    - 把说明方法的作用当作说明特征，如看到列数字就说‘特征是准确’。
    - 找特征时只看外观，忽略本质，如说‘松鼠的特征是有一条大尾巴’而漏掉‘驯良’。
    - 认为只要是对象的特点都可并列为主特征，不区分本质和非本质。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:说明语言的特点
  type: Concept
  subject: 语文
  title: 说明语言的特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘大约’‘几乎’等限制词显得不准确，是多余词语。
    - 能指出并纠正这一错误：只分析生动性，忽略准确严谨，如看到‘像’就只说打比方。
  aliases: []
  category: 语言特点
  explanation: 说明性文章的语言要求准确、严谨，具有科学性，同时也可生动形象。
  misconceptions:
    - 认为‘大约’‘几乎’等限制词显得不准确，是多余词语。
    - 只分析生动性，忽略准确严谨，如看到‘像’就只说打比方。
    - 换词题答‘换了也可以’，不知顺序、范围、程度对准确性的影响。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:说明顺序
  type: Concept
  subject: 语文
  title: 说明顺序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为本文按时间顺序，从早到晚介绍画卷内容。
    - 能指出并纠正这一错误：将‘从开卷到中段再到后段’说成逻辑顺序，忽略空间位移。
  aliases: []
  category: 写作知识
  explanation: 本文按照空间顺序介绍《清明上河图》，从开卷、中段到后段，条理分明。
  misconceptions:
    - 误以为本文按时间顺序，从早到晚介绍画卷内容。
    - 将‘从开卷到中段再到后段’说成逻辑顺序，忽略空间位移。
    - 认为空间顺序必须是从上到下，不理解手卷的观赏顺序是横向展开。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:说服别人的方法
  type: Concept
  subject: 语文
  title: 说服别人的方法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 请求别人支持时，要礼貌诚恳地说明来意，把想法和目的讲清楚，再设想对方可能担心什么，用充分的理由打消顾虑。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:说话的基本要求
  type: Concept
  subject: 语文
  title: 说话的基本要求
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 说话时声音要洪亮，吐字要清楚，让别人听得明白。别人说话的时候，要安静地认真听。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C2/sections/S6.md
- id: concept:语文:说话的语气
  type: Concept
  subject: 语文
  title: 说话的语气
  conceptType: 应用型
  aliases:
    - 说话语气
  category: 方法
  explanation: 说话时用合适的语气，能让听的人感到舒服。语气不要太生硬，尽量温和一点，比如多用"请"和"好吗"。
  sourceRef: content/二年级/下册/语文/PEP-2-2-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:说话的音量
  type: Concept
  subject: 语文
  title: 说话的音量
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 说话的声音要看场合，有时候要大声说，让别人听清楚；有时候要小声说，不影响别人。想一想该大声还是小声，再说出来。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:诵读
  type: Concept
  subject: 语文
  title: 诵读
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：诵读时声音平直像念经，没有抑扬顿挫的起伏
    - 能指出并纠正这一错误：认为诵读就是大声朗读，不加体会，读不出作者情感
  aliases:
    - 朗读
  category: 学习方法
  explanation: 通过反复朗读文言文，体会节奏、韵律和情感，是学习文言文的重要方法。
  misconceptions:
    - 诵读时声音平直像念经，没有抑扬顿挫的起伏
    - 认为诵读就是大声朗读，不加体会，读不出作者情感
    - 只注意停顿位置，忽视韵律和语气的变化
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:诸葛亮
  type: Concept
  subject: 语文
  title: 诸葛亮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：颠倒诸葛亮的字与号，误说字卧龙、号孔明。
    - 能指出并纠正这一错误：误以为诸葛亮是《三国演义》虚构人物，不知史书《三国志》有记载。
  aliases:
    - 孔明
    - 卧龙
  category: 人物
  explanation: 字孔明，号卧龙，蜀汉丞相，杰出的政治家、军事家，在隆中为刘备提出三分天下的战略。
  misconceptions:
    - 颠倒诸葛亮的字与号，误说字卧龙、号孔明。
    - 误以为诸葛亮是《三国演义》虚构人物，不知史书《三国志》有记载。
    - 将诸葛亮与庞统的称号混淆，称诸葛亮为凤雏。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:诺贝尔
  type: Concept
  subject: 语文
  title: 诺贝尔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：称诺贝尔是法国化学家，把国籍记成法籍
    - 能指出并纠正这一错误：认为诺贝尔奖金由诺贝尔本人颁发，其实他去世后由基金会颁发
  aliases:
    - 阿尔弗雷德·诺贝尔
  category: 人物
  explanation: 瑞典化学家、工程师，发明黄色炸药，设立诺贝尔奖。
  misconceptions:
    - 称诺贝尔是法国化学家，把国籍记成法籍
    - 认为诺贝尔奖金由诺贝尔本人颁发，其实他去世后由基金会颁发
    - 说诺贝尔是物理学家，忽略其化学家身份
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:诺贝尔奖
  type: Concept
  subject: 语文
  title: 诺贝尔奖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为诺贝尔奖有数学奖，如说'高斯的成就能得诺贝尔数学奖'
    - 能指出并纠正这一错误：说首届诺贝尔奖就颁发了经济学奖，忽略经济学奖是1969年增设
  aliases:
    - 诺贝尔奖金
  category: 文化常识
  explanation: 根据诺贝尔遗嘱设立，每年颁发给在物理学、化学、生理学或医学、文学及和平事业方面为人类作出最大贡献的人。
  misconceptions:
    - 以为诺贝尔奖有数学奖，如说'高斯的成就能得诺贝尔数学奖'
    - 说首届诺贝尔奖就颁发了经济学奖，忽略经济学奖是1969年增设
    - 将奖项名'生理学或医学'简称为'医学奖'，漏掉生理学
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S3.md
- id: concept:语文:读书的方法
  type: Concept
  subject: 语文
  title: 读书的方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有书都该“咀嚼消化”，不懂对浅显书可“浅尝”。
    - 能指出并纠正这一错误：把“吞食”理解为快速囫囵读，而忽略了它指粗略涉猎。
  aliases:
    - 读书之道
  category: 文学观点
  explanation: 培根提出读书应推敲细思，区分浅尝、吞食、咀嚼消化等不同方式，并强调用书之智在书外。
  misconceptions:
    - 认为所有书都该“咀嚼消化”，不懂对浅显书可“浅尝”。
    - 把“吞食”理解为快速囫囵读，而忽略了它指粗略涉猎。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:读书的目的与作用
  type: Concept
  subject: 语文
  title: 读书的目的与作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“傅彩”的“傅”写成“附”或“赋”，字形混淆。
    - 能指出并纠正这一错误：误以为“长才”的“长”读cháng，实际读zhǎng，表示增长。
  aliases:
    - 读书之益
  category: 文学观点
  explanation: 培根认为读书足以怡情、傅彩、长才，并指出不同学科对性格的塑造作用。
  misconceptions:
    - 把“傅彩”的“傅”写成“附”或“赋”，字形混淆。
    - 误以为“长才”的“长”读cháng，实际读zhǎng，表示增长。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:读书计划
  type: Concept
  subject: 语文
  title: 读书计划
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把读书计划只写成“每天读30分钟”，缺少阅读内容、阅读方式等要素，计划不完整。
    - 能指出并纠正这一错误：认为读书计划一成不变，从不根据实际调整，导致计划无法执行。
  aliases:
    - 阅读计划
  category: 语文学习策略
  explanation: 根据自身阅读状况制定的包含阅读量、阅读时间、阅读内容、阅读方式等要素的规划。
  misconceptions:
    - 把读书计划只写成“每天读30分钟”，缺少阅读内容、阅读方式等要素，计划不完整。
    - 认为读书计划一成不变，从不根据实际调整，导致计划无法执行。
    - 将读书计划等同于阅读目标，只写“本学期读5本书”，没有时间安排和具体步骤。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:读后感
  type: Concept
  subject: 语文
  title: 读后感
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：读后感只摘抄原文句子，不写自己的思考和感悟
    - 能指出并纠正这一错误：认为读后感可以脱离原文，光写生活体会，不引述原文
  aliases: []
  category: 写作知识
  explanation: 阅读后写下的感想，需引述原文、深入思考、联系生活经验。
  misconceptions:
    - 读后感只摘抄原文句子，不写自己的思考和感悟
    - 认为读后感可以脱离原文，光写生活体会，不引述原文
    - 把读后感写成书评，着重评价作者写作技巧而忽略个人感受
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:读者对象
  type: Concept
  subject: 语文
  title: 读者对象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：给老人写健康建议，通篇用“元宇宙”“抓手”等新词，不顾读者年龄。
    - 能指出并纠正这一错误：给小学生写介绍信，用“纷至沓来”等成语而不解释，超出读者水平。
  aliases:
    - 对象
    - 受众
  category: 写作要素
  explanation: 写作时要考虑读者的年龄、性别、职业等特征，用语应适应读者，如对长辈尊敬，对平辈亲切。
  misconceptions:
    - 给老人写健康建议，通篇用“元宇宙”“抓手”等新词，不顾读者年龄。
    - 给小学生写介绍信，用“纷至沓来”等成语而不解释，超出读者水平。
    - 认为读者对象只影响内容，不影响语言风格，导致千篇一律。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:读诗句想画面
  type: Concept
  subject: 语文
  title: 读诗句想画面
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读古诗时，一边读一边在脑子里想象诗中写的景色，再用自己的话说一说。这样能读得更明白，感受诗里的美。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:谐音
  type: Concept
  subject: 语文
  title: 谐音
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 利用读音相同或相近的字造成有趣的表达，如歇后语“外甥打灯笼——照旧（舅）”，写错谐音字还可能闹出“枇杷”“琵琶”的笑话。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:象形字
  type: Concept
  subject: 语文
  title: 象形字
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 照着东西的样子画出来的字，比如日像太阳，月像月亮。看懂了图画，就能猜出这个字是什么意思。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:象征意义
  type: Concept
  subject: 语文
  title: 象征意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把象征等同于比喻，认为“红旗象征革命”就是比喻句。
    - 能指出并纠正这一错误：误以为象征物与被象征物必须有外形相似，如“白鸽象征和平”只因颜色相似。
  aliases:
    - 象征
  category: 文学理论
  explanation: 象征是通过特定形象表现与之相似或相近的概念、思想或情感的艺术手法。
  misconceptions:
    - 把象征等同于比喻，认为“红旗象征革命”就是比喻句。
    - 误以为象征物与被象征物必须有外形相似，如“白鸽象征和平”只因颜色相似。
    - 认为一个象征体只有一种固定象征义，忽略语境不同象征义可变。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:象征手法
  type: Concept
  subject: 语文
  title: 象征手法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把文中“白杨树像北方农民”说成象征，实际这是比喻句，象征是全文的整体手法。
    - 能指出并纠正这一错误：认为象征就是借代，举例“用白杨代指北方农民”是象征，混淆了修辞与表现手法。
  aliases:
    - 象征
  category: 写作手法
  explanation: 通过特定事物表现某种精神或品格，使文章含蓄深刻。本文以白杨树象征北方农民及民族解放斗争中的精神。
  misconceptions:
    - 把文中“白杨树像北方农民”说成象征，实际这是比喻句，象征是全文的整体手法。
    - 认为象征就是借代，举例“用白杨代指北方农民”是象征，混淆了修辞与表现手法。
    - 将象征与拟人混同，说“白杨树倔强挺立”是象征，实际是赋予人的性格。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:负责任地表达
  type: Concept
  subject: 语文
  title: 负责任地表达
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：表述观点时爱用“肯定”“必须”，如“他这样做肯定是错的”。
    - 能指出并纠正这一错误：引用网络段子当论据，不核实真伪，如“听说喝醋能治病”。
  aliases: []
  category: 写作原则
  explanation: 在表达观点时做到实事求是、言之有据、客观公允，避免情绪化和不负责任的言论。
  misconceptions:
    - 表述观点时爱用“肯定”“必须”，如“他这样做肯定是错的”。
    - 引用网络段子当论据，不核实真伪，如“听说喝醋能治病”。
    - 为了说服别人，故意夸大对方观点再反驳，如“你说尊重，就是凡事都听别人的”。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S7.md
- id: concept:语文:质疑阅读
  type: Concept
  subject: 语文
  title: 质疑阅读
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把质疑阅读当成抬杠，认为凡是课文都可否定，如说‘卖油翁就是嫉妒陈尧咨’
    - 能指出并纠正这一错误：脱离文本凭空提问，如问‘陈尧咨为何不姓陈’，忽略了文中已交代的信息
  aliases: []
  category: 阅读方法
  explanation: 阅读时对文本内容提出疑问，如“高超的箭法真的等同于往葫芦里灌油吗”，有助于深入理解文章主旨。
  misconceptions:
    - 把质疑阅读当成抬杠，认为凡是课文都可否定，如说‘卖油翁就是嫉妒陈尧咨’
    - 脱离文本凭空提问，如问‘陈尧咨为何不姓陈’，忽略了文中已交代的信息
    - 分不清‘质疑’与‘怀疑’，将‘质疑’误写成‘置疑’或‘智疑’
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:贾母
  type: Concept
  subject: 语文
  title: 贾母
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将贾母当成贾宝玉的母亲，实际她是贾宝玉的祖母。
    - 能指出并纠正这一错误：误以为贾母姓贾，实际娘家姓史，又称史太君。
  aliases:
    - 史太君
  category: 人物
  explanation: 《红楼梦》中贾府的最高权威，慈祥而风趣。
  misconceptions:
    - 误将贾母当成贾宝玉的母亲，实际她是贾宝玉的祖母。
    - 误以为贾母姓贾，实际娘家姓史，又称史太君。
    - 把贾母与王夫人的角色地位混淆，王夫人是贾母儿媳。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:资料搜集与选择
  type: Concept
  subject: 语文
  title: 资料搜集与选择
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：搜集资料时不看写作目的，把与主题无关的内容也抄进去，如写议论文却大段引用诗歌抒情
    - 能指出并纠正这一错误：对资料只摘抄不加工，导致文章前后矛盾，如先引用数据说A好，又引用另一处说A差，没有整合取舍
  aliases:
    - 材料选择
  category: 写作方法
  explanation: 根据写作目的、对象和场合，对搜集到的资料进行筛选和整合，使内容更贴合需要。
  misconceptions:
    - 搜集资料时不看写作目的，把与主题无关的内容也抄进去，如写议论文却大段引用诗歌抒情
    - 对资料只摘抄不加工，导致文章前后矛盾，如先引用数据说A好，又引用另一处说A差，没有整合取舍
    - 忽略读者身份，写科普文章却用大量专业术语，或写给小学生看时直接引用学术论文原文
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:赋比兴
  type: Concept
  subject: 语文
  title: 赋比兴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘赋’解释为“铺陈直叙”时，误认为是‘抒发感情’或‘描绘景物’
    - 能指出并纠正这一错误：认为‘比’就是比喻修辞，不知其用于借物譬喻人物或道理
  aliases:
    - 赋、比、兴
  category: 表现手法
  explanation: 赋是直陈其事，比是借物譬喻，兴是托物起兴，是《诗经》主要的表现手法。
  misconceptions:
    - 把‘赋’解释为“铺陈直叙”时，误认为是‘抒发感情’或‘描绘景物’
    - 认为‘比’就是比喻修辞，不知其用于借物譬喻人物或道理
    - 把‘兴’看成固定的开头格式，不知它还要引起下文的所咏之词
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:赌注
  type: Concept
  subject: 语文
  title: 赌注
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“赌注”写成“堵住”或“睹注”，同音写错。
    - 能指出并纠正这一错误：把“赌注”当动词用，如“他把钱赌注在股票上”，应说“押上赌注”。
  aliases: []
  category: 词语
  explanation: 赌博时所押的财物，比喻为达到某种目的而承担的风险。
  misconceptions:
    - 把“赌注”写成“堵住”或“睹注”，同音写错。
    - 把“赌注”当动词用，如“他把钱赌注在股票上”，应说“押上赌注”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:赠序
  type: Concept
  subject: 语文
  title: 赠序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《送东阳马生序》当作书序，以为是给书写的序言。
    - 能指出并纠正这一错误：认为赠序只用于长辈对晚辈，不知也可同辈相赠。
  aliases:
    - 序
  category: 文体知识
  explanation: 古代文体之一，用于临别赠言，本文是宋濂写给同乡后学的赠序。
  misconceptions:
    - 把《送东阳马生序》当作书序，以为是给书写的序言。
    - 认为赠序只用于长辈对晚辈，不知也可同辈相赠。
    - 写赠序文体时误写成记叙文，忽略其议论抒情的临别赠言性质。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:赫耳墨斯和雕像者
  type: Concept
  subject: 语文
  title: 赫耳墨斯和雕像者
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把赫耳墨斯误认为是众神之王宙斯，或把雕像者说成是国王
    - 能指出并纠正这一错误：误以为寓意是讽刺雕像者不尊重神，实际是讽刺爱慕虚荣的人
  aliases: []
  category: 寓言故事
  explanation: 讽刺爱慕虚荣而不被重视的人，出自《伊索寓言》。
  misconceptions:
    - 把赫耳墨斯误认为是众神之王宙斯，或把雕像者说成是国王
    - 误以为寓意是讽刺雕像者不尊重神，实际是讽刺爱慕虚荣的人
    - 把‘赫耳墨斯’写成‘赫尔墨斯’或‘赫耳穆斯’，字形混淆
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:赵州桥
  type: Concept
  subject: 语文
  title: 赵州桥
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为赵州桥是联拱石桥，它实际是独拱石桥，与卢沟桥不同。
    - 能指出并纠正这一错误：将'赵州桥'写成'赵洲桥'，'州'误用为'洲'。
  aliases:
    - 安济桥
  category: 说明对象
  explanation: 赵州桥位于河北省赵县，是世界著名的古代石拱桥，建于公元605年左右，具有独特的设计特点。
  misconceptions:
    - 误以为赵州桥是联拱石桥，它实际是独拱石桥，与卢沟桥不同。
    - 将'赵州桥'写成'赵洲桥'，'州'误用为'洲'。
    - 误以为赵州桥建于1189年，它是公元605年建造，而1189年是卢沟桥的建造时间。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:越剧
  type: Concept
  subject: 语文
  title: 越剧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为越剧发源于广东，因“越”字联想到越秀区，实际流行于浙江、上海。
    - 能指出并纠正这一错误：把越剧唱腔说成“高亢嘹亮”，实际是柔美婉转。
  aliases: []
  category: 戏曲剧种
  explanation: 流行于浙江、上海等地的地方戏曲，唱腔柔美，多以才子佳人故事为题材。
  misconceptions:
    - 误以为越剧发源于广东，因“越”字联想到越秀区，实际流行于浙江、上海。
    - 把越剧唱腔说成“高亢嘹亮”，实际是柔美婉转。
    - 写“越剧多表现英雄豪杰故事”，实际多以才子佳人题材为主。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:踌躇
  type: Concept
  subject: 语文
  title: 踌躇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为踌躇只是犹豫不决，忽略此处指心潮起伏。
    - 能指出并纠正这一错误：将“踌躇”写成“筹躇”或“愁躇”，字形错误。
  aliases: []
  category: 文言词语
  explanation: 迟疑不决，此处形容心潮起伏。
  misconceptions:
    - 认为踌躇只是犹豫不决，忽略此处指心潮起伏。
    - 将“踌躇”写成“筹躇”或“愁躇”，字形错误。
    - 把“踌躇满志”中的踌躇与本课“踌躇”混为一谈，词义不同。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:身临其境与长期观察
  type: Concept
  subject: 语文
  title: 身临其境与长期观察
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“身临其境”就是亲眼所见，忽略想象和体验也能达到。
    - 能指出并纠正这一错误：以为只要到了现场就能写出意境，不重视长期观察积累。
  aliases:
    - 深入观察
  category: 创作方法
  explanation: 要深入认识对象，必须身临其境，长期观察，才能把握精神实质，创造意境。
  misconceptions:
    - 认为“身临其境”就是亲眼所见，忽略想象和体验也能达到。
    - 以为只要到了现场就能写出意境，不重视长期观察积累。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:转折复句
  type: Concept
  subject: 语文
  title: 转折复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“不仅……而且……”误判为转折复句。
    - 能指出并纠正这一错误：将“虽然……但是……”归为选择复句。
  aliases:
    - 转折关系复句
  category: 语法知识
  explanation: 转折复句是前后分句意思相反或相对的复句，常用“但”“而”“却”等关联词连接。
  misconceptions:
    - 把“不仅……而且……”误判为转折复句。
    - 将“虽然……但是……”归为选择复句。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:转述句
  type: Concept
  subject: 语文
  title: 转述句
  conceptType: 程序型
  aliases:
    - 间接引语
  category: 句型
  explanation: 把别人说的话改成自己的话转述给别人听时，要把“我”改成“他”，去掉冒号和引号。
  sourceRef: content/三年级/下册/语文/PEP-3-2-Chinese/chapters/C8/sections/S6.md
- id: concept:语文:轻声
  type: Concept
  subject: 语文
  title: 轻声
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 有的词后面的字要读得又轻又短，比如爸爸、妈妈、粽子、眼睛、故事。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:轻诺必寡信
  type: Concept
  subject: 语文
  title: 轻诺必寡信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“轻诺”理解为“轻视诺言”，实际是“轻易许诺”
    - 能指出并纠正这一错误：将“寡信”理解为“别人很少相信自己”，正确是“自己缺乏信用”
  aliases: []
  category: 名言警句
  explanation: 出自《老子》，意为轻易许下的诺言必然缺乏信用，强调承诺要慎重。
  misconceptions:
    - 误把“轻诺”理解为“轻视诺言”，实际是“轻易许诺”
    - 将“寡信”理解为“别人很少相信自己”，正确是“自己缺乏信用”
    - 误把该句归于孔子，实际出自《老子》
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S7.md
- id: concept:语文:载人航天
  type: Concept
  subject: 语文
  title: 载人航天
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为载人航天就是太空行走，忽略乘航天器飞行。
    - 能指出并纠正这一错误：把神舟五号误写成神舟六号或嫦娥号飞船。
  aliases:
    - 载人飞行
  category: 航天领域
  explanation: 人类驾驶和乘坐航天器进入太空的活动，文中指神舟五号首次载人飞行。
  misconceptions:
    - 认为载人航天就是太空行走，忽略乘航天器飞行。
    - 把神舟五号误写成神舟六号或嫦娥号飞船。
    - 只提“进入太空”，漏掉“驾驶和乘坐”这一关键。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:载人航天返回流程
  type: Concept
  subject: 语文
  title: 载人航天返回流程
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把返回流程写成“调姿—制动—穿越—抛伞—着陆”后颠倒顺序。
    - 能指出并纠正这一错误：漏掉“调姿”或“制动”步骤，直接说穿越大气层。
  aliases:
    - 返回程序
  category: 科学知识
  explanation: 描述了飞船从轨道制动、调姿、穿越大气层、抛伞到着陆的完整返回过程。
  misconceptions:
    - 把返回流程写成“调姿—制动—穿越—抛伞—着陆”后颠倒顺序。
    - 漏掉“调姿”或“制动”步骤，直接说穿越大气层。
    - 把“抛伞”说成“开伞”并放在穿越大气层之前。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:辛弃疾《太常引》
  type: Concept
  subject: 语文
  title: 辛弃疾《太常引》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《太常引·建康中秋夜为吕叔潜赋》的作者误记为苏轼。
    - 能指出并纠正这一错误：认为此词仅写中秋赏月之乐，忽略其借月抒怀的忧国之情。
  aliases:
    - 太常引
  category: 古诗词
  explanation: 辛弃疾词作，借中秋赏月抒发对时光流逝的感慨和对沦陷山河的怀念，想象奇特，寓意深远。
  misconceptions:
    - 把《太常引·建康中秋夜为吕叔潜赋》的作者误记为苏轼。
    - 认为此词仅写中秋赏月之乐，忽略其借月抒怀的忧国之情。
    - 将'被白发欺人奈何'理解为慨叹年老丧志，而不知是抒发壮志难酬。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:辩论
  type: Concept
  subject: 语文
  title: 辩论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把辩论当成吵架，认为气势和音量就能压过对方，忽略逻辑。
    - 能指出并纠正这一错误：误以为辩论赛可以随意打断对方发言，不遵守程序规则。
  aliases:
    - 辩论赛
  category: 口语交际
  explanation: 一种口语交际方式，有确定的论题、正反双方和特定程序，以驳倒对方、确立己方观点为目的。
  misconceptions:
    - 把辩论当成吵架，认为气势和音量就能压过对方，忽略逻辑。
    - 误以为辩论赛可以随意打断对方发言，不遵守程序规则。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:辩论中的情商
  type: Concept
  subject: 语文
  title: 辩论中的情商
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：对方发言时急于反驳而不倾听，认为辩论只需智商不需情商。
    - 能指出并纠正这一错误：胜辩后得意忘形，输辩后失态，不明白风度比输赢更重要。
  aliases: []
  category: 口语交际
  explanation: 辩论不仅是智商的交锋，也是情商的考验，需要保持良好的仪态风度，胜不骄败不馁。
  misconceptions:
    - 对方发言时急于反驳而不倾听，认为辩论只需智商不需情商。
    - 胜辩后得意忘形，输辩后失态，不明白风度比输赢更重要。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:辩论准备
  type: Concept
  subject: 语文
  title: 辩论准备
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：只准备己方论点，不预测对方可能的观点和反驳依据。
    - 能指出并纠正这一错误：分工不明确，一辩二辩三辩抢着说，立论和驳论脱节。
  aliases: []
  category: 口语交际
  explanation: 包括组织队伍、设计辩论提纲等，辩手分工明确，需立论与驳论结合。
  misconceptions:
    - 只准备己方论点，不预测对方可能的观点和反驳依据。
    - 分工不明确，一辩二辩三辩抢着说，立论和驳论脱节。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:辩论原则
  type: Concept
  subject: 语文
  title: 辩论原则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为辩论要用华丽辞藻，忽略观点鲜明和语言严谨。
    - 能指出并纠正这一错误：只顾自己发言，不聆听对方，导致反驳不到点子上。
  aliases: []
  category: 口语交际
  explanation: 辩论应遵循表达清晰、观点鲜明、善于聆听、语言严谨等原则，以保证辩论的有效性和说服力。
  misconceptions:
    - 以为辩论要用华丽辞藻，忽略观点鲜明和语言严谨。
    - 只顾自己发言，不聆听对方，导致反驳不到点子上。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:辩论技巧
  type: Concept
  subject: 语文
  title: 辩论技巧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为技巧就是夸张表演，内容空洞也能靠技巧取胜。
    - 能指出并纠正这一错误：过度使用手势和语气，喧宾夺主，忽略语言简洁有力。
  aliases: []
  category: 口语交际
  explanation: 辩论技巧包括声情并茂、协同作战、快速反应、语言简洁有力等，有助于提高辩论水平。
  misconceptions:
    - 以为技巧就是夸张表演，内容空洞也能靠技巧取胜。
    - 过度使用手势和语气，喧宾夺主，忽略语言简洁有力。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:辩论赛环节
  type: Concept
  subject: 语文
  title: 辩论赛环节
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把攻辩环节当成自由辩论，混淆环节的规则和目的。
    - 能指出并纠正这一错误：总结陈词时提出新论点，忽略总结应归纳己方已有观点。
  aliases:
    - 辩论流程
  category: 口语交际
  explanation: 辩论赛一般分为立论、攻辩、自由辩论和总结陈词等环节，每个环节正反方轮流发言，时间大致相等。
  misconceptions:
    - 把攻辩环节当成自由辩论，混淆环节的规则和目的。
    - 总结陈词时提出新论点，忽略总结应归纳己方已有观点。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:边塞词
  type: Concept
  subject: 语文
  title: 边塞词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为边塞词都像范仲淹《渔家傲》一样悲凉，忽略辛弃疾词中的豪放。
    - 能指出并纠正这一错误：把边塞词等同于边塞诗，认为词牌名'渔家傲'就是边塞词专用。
  aliases: []
  category: 词作题材
  explanation: 描写边塞风光和戍边生活的词作，多表现豪迈或思乡之情。
  misconceptions:
    - 认为边塞词都像范仲淹《渔家傲》一样悲凉，忽略辛弃疾词中的豪放。
    - 把边塞词等同于边塞诗，认为词牌名'渔家傲'就是边塞词专用。
    - 误将思乡词贴上边塞词标签，如《天净沙·秋思》并非边塞词。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:边塞诗派
  type: Concept
  subject: 语文
  title: 边塞诗派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'秦时明月汉时关'的作者误记为高适或岑参，实际是王昌龄。
    - 能指出并纠正这一错误：认为边塞诗派仅产生于盛唐，忽略中晚唐也有边塞诗创作。
  aliases:
    - 边塞诗
  category: 文学流派
  explanation: 盛唐时期以高适、岑参、王昌龄等为代表的诗歌流派，多描写边塞风光和军旅生活，风格雄浑豪放。
  misconceptions:
    - 把'秦时明月汉时关'的作者误记为高适或岑参，实际是王昌龄。
    - 认为边塞诗派仅产生于盛唐，忽略中晚唐也有边塞诗创作。
    - 把王翰的《凉州词》归入高适名下，混淆诗人与作品。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:边读边想象画面
  type: Concept
  subject: 语文
  title: 边读边想象画面
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读书时，根据文章里的描写，在脑海中浮现出相应的画面和声音。这样能帮助我们更真切地感受课文内容。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:迁徙
  type: Concept
  subject: 语文
  title: 迁徙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“迁徙”误写成“迁徒”，形近字混淆。
    - 能指出并纠正这一错误：误认为“迁徙”只用于人类搬迁，不用于鸟类或动物。
  aliases: []
  category: 词语
  explanation: 迁移，多指鸟类随季节变化而改变栖息地。
  misconceptions:
    - 把“迁徙”误写成“迁徒”，形近字混淆。
    - 误认为“迁徙”只用于人类搬迁，不用于鸟类或动物。
    - 将“迁徙”与“迁移”完全等同，忽略“迁徙”多指鸟类随季节规律性移动。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:过渡句的作用
  type: Concept
  subject: 语文
  title: 过渡句的作用
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 过渡句承接上文、引出下文，能提示课文各部分主要写什么，帮助我们理清文章的思路。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C6/sections/S6.md
- id: concept:语文:过载
  type: Concept
  subject: 语文
  title: 过载
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为过载就是超重或失重感，而非惯性力与重力比值。
    - 能指出并纠正这一错误：把过载单位写成“牛顿”或“千克”，正确应为G。
  aliases:
    - G值
  category: 物理概念
  explanation: 物体在加速或减速时受到的惯性力与重力的比值，以G为单位，文中指飞船返回时产生的近4G过载。
  misconceptions:
    - 认为过载就是超重或失重感，而非惯性力与重力比值。
    - 把过载单位写成“牛顿”或“千克”，正确应为G。
    - 误以为飞船过载越大越安全，实际近4G已较大。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:近义词辨析
  type: Concept
  subject: 语文
  title: 近义词辨析
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 意思相近的词语要仔细比较，如“陆续、继续、连续”，它们的意思和用法不同，不能随便调换。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C8/sections/S7.md
- id: concept:语文:近体诗
  type: Concept
  subject: 语文
  title: 近体诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为近体诗包括古体诗，将《饮酒》归入近体诗。
    - 能指出并纠正这一错误：认为绝句和律诗可随意换韵，不知近体诗一韵到底。
  aliases:
    - 格律诗
    - 今体诗
  category: 文学体裁
  explanation: 近体诗又称格律诗，包括绝句和律诗，讲究平仄、对仗和押韵，如《赤壁》是七言绝句。
  misconceptions:
    - 误以为近体诗包括古体诗，将《饮酒》归入近体诗。
    - 认为绝句和律诗可随意换韵，不知近体诗一韵到底。
    - 混淆律诗与绝句，将《赤壁》说成是五言绝句（实际七绝）。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:连夜
  type: Concept
  subject: 语文
  title: 连夜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“连夜”理解为连续几个夜晚，如“他连夜工作三天”不成立，实际是当天夜里。
    - 能指出并纠正这一错误：认为“连夜赶路”指走一整夜到天亮，实际是当天夜里立即上路，不一定通宵。
  aliases: []
  category: 词语
  explanation: 当天夜里（就做）。
  misconceptions:
    - 把“连夜”理解为连续几个夜晚，如“他连夜工作三天”不成立，实际是当天夜里。
    - 认为“连夜赶路”指走一整夜到天亮，实际是当天夜里立即上路，不一定通宵。
    - 将“连夜”写成“联夜”或“连液”，忽略“连”与“夜”的常写。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:连续动作描写
  type: Concept
  subject: 语文
  title: 连续动作描写
  conceptType: 概念型
  aliases:
    - 连续的动作
  category: 方法
  explanation: 用几个连贯的动词把一个动作过程写具体，如“抓住窗框、蹬着车厢、攀上窗口”，人物就写活了。
  sourceRef: content/四年级/下册/语文/PEP-4-2-Chinese/chapters/C7/sections/S7.md
- id: concept:语文:连词成句地读
  type: Concept
  subject: 语文
  title: 连词成句地读
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 读文章时不要一个字一个字地读，要尽量把词语连成句子，一眼看几个词，这样能读得更快，也读得懂。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:送别诗
  type: Concept
  subject: 语文
  title: 送别诗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到送别诗就认为一定表达离愁别绪，忽视《送杜少府之任蜀州》的昂扬
    - 能指出并纠正这一错误：把《送元二使安西》的‘更尽一杯酒’误读为喜悦之情
  aliases: []
  category: 诗歌体裁
  explanation: 以送别为题材的诗歌，常表达离愁别绪，但《送杜少府之任蜀州》却一扫悲戚，积极向上。
  misconceptions:
    - 看到送别诗就认为一定表达离愁别绪，忽视《送杜少府之任蜀州》的昂扬
    - 把《送元二使安西》的‘更尽一杯酒’误读为喜悦之情
    - 认为送别诗只写送别场景，不涉及对友人的劝勉或祝福
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:送友人
  type: Concept
  subject: 语文
  title: 送友人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把李白《送友人》记成王维《送元二使安西》，题目张冠李戴。
    - 能指出并纠正这一错误：把“孤蓬”理解为孤单的蓬草，未联系“万里征”知其为友人象征。
  aliases: []
  category: 古诗
  explanation: 唐代李白所作送别诗，通过青山白水、孤蓬浮云等意象表达对友人的依依惜别之情。
  misconceptions:
    - 把李白《送友人》记成王维《送元二使安西》，题目张冠李戴。
    - 把“孤蓬”理解为孤单的蓬草，未联系“万里征”知其为友人象征。
    - 误将“班马”写成“斑马”，未解为离群之马。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:选取典型事例写人
  type: Concept
  subject: 语文
  title: 选取典型事例写人
  conceptType: 概念型
  aliases:
    - 选用典型事例
  category: 方法
  explanation: 写人要选择最能表现人物特点的典型事例，并把它写具体，如严监生临死惦记两茎灯草的事例写出他的吝啬。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:选择复句
  type: Concept
  subject: 语文
  title: 选择复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“不是……而是……”误认为选择复句。
    - 能指出并纠正这一错误：把“与其……不如……”当成并列复句。
  aliases: []
  category: 语法
  explanation: 各个分句分别叙述一种可能的情况，表示从中选择一个。
  misconceptions:
    - 把“不是……而是……”误认为选择复句。
    - 把“与其……不如……”当成并列复句。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:选材
  type: Concept
  subject: 语文
  title: 选材
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：先选一个有趣的素材，再临时编中心，导致材料与中心脱节。
    - 能指出并纠正这一错误：看到题目立刻套用某篇范文的素材，不管是否扣题，直接照搬。
  aliases:
    - 选择材料
  category: 写作方法
  explanation: 选材是根据文章中心从积累的材料中选择最合适、最典型、最真实新颖的材料来表现主题的过程。
  misconceptions:
    - 先选一个有趣的素材，再临时编中心，导致材料与中心脱节。
    - 看到题目立刻套用某篇范文的素材，不管是否扣题，直接照搬。
    - 在几个材料中挑选时只看哪个“好听”，不判断哪个最能表现主题。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:递进复句
  type: Concept
  subject: 语文
  title: 递进复句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘他不但学习好，而且品德好’误判为并列复句。
    - 能指出并纠正这一错误：用‘不仅…还…’时前后无递进，如‘他不仅吃饭，还喝水’。
  aliases: []
  category: 语法
  explanation: 后一分句表示的意思比前一分句更进一层的复句。
  misconceptions:
    - 把‘他不但学习好，而且品德好’误判为并列复句。
    - 用‘不仅…还…’时前后无递进，如‘他不仅吃饭，还喝水’。
    - 认为递进复句必须带关联词，省略关联词就不算递进。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:通假字
  type: Concept
  subject: 语文
  title: 通假字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘窥谷忘反’的‘反’误写为‘返’，认为原句就是‘返’字，没注意通假。
    - 能指出并纠正这一错误：误把‘反’理解为‘相反’或‘反对’，不知道它通‘返’表示‘返回’。
  aliases: []
  category: 文言语法
  explanation: 用读音相同或相近的字代替本字的现象。如'窥谷忘反'中'反'通'返'。
  misconceptions:
    - 将‘窥谷忘反’的‘反’误写为‘返’，认为原句就是‘返’字，没注意通假。
    - 误把‘反’理解为‘相反’或‘反对’，不知道它通‘返’表示‘返回’。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:通知的要素
  type: Concept
  subject: 语文
  title: 通知的要素
  conceptType: 概念型
  aliases:
    - 口头通知
  category: 方法
  explanation: 发通知要把什么时间、在什么地点、做什么事说清楚，别人才能准时参加。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C7/sections/S3.md
- id: concept:语文:通讯
  type: Concept
  subject: 语文
  title: 通讯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为通讯就是消息的缩写，内容越简短越好，忽略了细节和生动。
    - 能指出并纠正这一错误：误以为通讯允许虚构合情合理的情节，把它等同于小说创作。
  aliases: []
  category: 文体知识
  explanation: 通讯是新闻体裁的一种，比消息更详细、生动地报道新闻事件或人物。
  misconceptions:
    - 认为通讯就是消息的缩写，内容越简短越好，忽略了细节和生动。
    - 误以为通讯允许虚构合情合理的情节，把它等同于小说创作。
    - 把通讯和新闻评论混淆，认为通讯主要是发表观点而不是报道事件。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:通过事件展现人物
  type: Concept
  subject: 语文
  title: 通过事件展现人物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只写结果不写过程，如“他帮我拿药”，不写拿药时着急、安慰等细节，人物立不起来。
    - 能指出并纠正这一错误：事件与特点脱节，如写“勇敢”却详写打游戏，选例不典型，无法证明人物特点。
  aliases:
    - 事件描写
    - 细节描写
  category: 写作方法
  explanation: 通过具体事件和细节描写来展现人物的内在精神品质。
  misconceptions:
    - 只写结果不写过程，如“他帮我拿药”，不写拿药时着急、安慰等细节，人物立不起来。
    - 事件与特点脱节，如写“勇敢”却详写打游戏，选例不典型，无法证明人物特点。
    - 用评价代替叙事，如“他真是个好人”连续三遍，不写任何具体事件，内容空洞。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S6.md
- id: concept:语文:造纸术
  type: Concept
  subject: 语文
  title: 造纸术
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 造纸术是我国对世界文明的伟大贡献。东汉时蔡伦改进了造纸术，用便宜易得的原料造出轻便好用的纸，后来传遍了世界。
  sourceRef: content/三年级/下册/语文/PEP-3-2-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:逻辑顺序
  type: Concept
  subject: 语文
  title: 逻辑顺序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将逻辑顺序等同于时间顺序，如把‘从古到今’也归入逻辑顺序
    - 能指出并纠正这一错误：把‘从概括到具体’说成‘从具体到概括’，顺序颠倒
  aliases: []
  category: 写作
  explanation: 按照事物内在的逻辑关系安排说明内容，如从概括到具体、从现象到本质、从主要到次要、从结果到原因等。
  misconceptions:
    - 误将逻辑顺序等同于时间顺序，如把‘从古到今’也归入逻辑顺序
    - 把‘从概括到具体’说成‘从具体到概括’，顺序颠倒
    - 判断说明顺序时，将空间‘由远及近’误认为逻辑顺序
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:道家学派
  type: Concept
  subject: 语文
  title: 道家学派
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为老子、庄子是儒家代表，与孔子并称。
    - 能指出并纠正这一错误：认为“无为”就是什么都不做，主张消极避世。
  aliases:
    - 道家
  category: 哲学思想
  explanation: 以老子、庄子为代表的学派，主张顺应自然、无为而治。
  misconceptions:
    - 误以为老子、庄子是儒家代表，与孔子并称。
    - 认为“无为”就是什么都不做，主张消极避世。
    - 将道家“顺应自然”等同道教炼丹修仙，混同概念。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:道理论据
  type: Concept
  subject: 语文
  title: 道理论据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：引用孔子“学而不思则罔”时不注明出处，只当普通句子。
    - 能指出并纠正这一错误：把“据统计，80%的学生喜欢阅读”这一事实数据当作道理论据。
  aliases: []
  category: 写作知识
  explanation: 用名言警句、民间谚语、精辟的理论等作为论据。
  misconceptions:
    - 引用孔子“学而不思则罔”时不注明出处，只当普通句子。
    - 把“据统计，80%的学生喜欢阅读”这一事实数据当作道理论据。
    - 认为道理论据只能是名言警句，不能是民间谚语或自然科学定律。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:道理论证
  type: Concept
  subject: 语文
  title: 道理论证
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把道理论证等同于引用名言，如认为引用孔子的话就是举例论证。
    - 能指出并纠正这一错误：认为正反对比不是道理论证，实际对比论证也包含讲道理。
  aliases: []
  category: 论证方法
  explanation: 运用讲道理的方式论证论点，本文从正反两方面进行道理论证。
  misconceptions:
    - 把道理论证等同于引用名言，如认为引用孔子的话就是举例论证。
    - 认为正反对比不是道理论证，实际对比论证也包含讲道理。
    - 把分析问题说成道理论证，如认为摆事实就是讲道理。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:避免词语的重复
  type: Concept
  subject: 语文
  title: 避免词语的重复
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：一段话里连续使用“然后”连接事件，如“然后…然后…”。
    - 能指出并纠正这一错误：写人物时反复用同一个动作词，如“他笑了笑…他又笑了笑”。
  aliases: []
  category: 写作方法
  explanation: 在没有特殊表达需要时，要避免词语的重复，以免显得啰唆。
  misconceptions:
    - 一段话里连续使用“然后”连接事件，如“然后…然后…”。
    - 写人物时反复用同一个动作词，如“他笑了笑…他又笑了笑”。
    - 多次重复主语，如“小明…小明…小明”，可用代词而未用。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S6.md
- id: concept:语文:邀请
  type: Concept
  subject: 语文
  title: 邀请
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“邀请”误写成“邀情”，形近字混淆。
    - 能指出并纠正这一错误：把“邀请”与“应邀”混用，如“我邀请了他的邀请”错误表达。
  aliases: []
  category: 词语
  explanation: 请人到自己的地方来或到约定的地方去。
  misconceptions:
    - 将“邀请”误写成“邀情”，形近字混淆。
    - 把“邀请”与“应邀”混用，如“我邀请了他的邀请”错误表达。
    - 误用对象，对物发出邀请，如“邀请电脑”参加活动。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:邀请函
  type: Concept
  subject: 语文
  title: 邀请函
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：时间地点不具体，写“明天下午”，无时刻和详细地址，等于没说。
    - 能指出并纠正这一错误：语气生硬，写“你必须来”，而非“诚邀您光临”，缺少尊敬。
  aliases: []
  category: 应用文
  explanation: 用于邀请他人参加活动的书面通知，需写明时间、地点、主题，语言简洁大方，体现尊敬。
  misconceptions:
    - 时间地点不具体，写“明天下午”，无时刻和详细地址，等于没说。
    - 语气生硬，写“你必须来”，而非“诚邀您光临”，缺少尊敬。
    - 不写明活动主题，被邀请人不知参加什么，影响赴约意愿。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:邓稼先
  type: Concept
  subject: 语文
  title: 邓稼先
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'稼'误写为'嫁'或'价'。
    - 能指出并纠正这一错误：误以为邓稼先只参与了原子弹，没有参与氢弹。
  aliases:
    - 两弹元勋
  category: 人物
  explanation: 中国核武器研制工作的杰出科学家，被誉为'两弹元勋'，成功设计了原子弹和氢弹。
  misconceptions:
    - 把'稼'误写为'嫁'或'价'。
    - 误以为邓稼先只参与了原子弹，没有参与氢弹。
    - 误称他为'两弹一星'元勋，而文中是'两弹元勋'。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:邹忌讽齐王纳谏
  type: Concept
  subject: 语文
  title: 邹忌讽齐王纳谏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为邹忌是直接批评齐王，实际是设喻类推。
    - 能指出并纠正这一错误：把“讽”字理解成讽刺，导致文意理解偏颇。
  aliases: []
  category: 文言文
  explanation: 《战国策》中的名篇，讲述邹忌以自身经历设喻，委婉劝谏齐威王广开言路，最终使齐国政治修明的故事。
  misconceptions:
    - 认为邹忌是直接批评齐王，实际是设喻类推。
    - 把“讽”字理解成讽刺，导致文意理解偏颇。
    - 将“纳谏”误写为“纳柬”，或误认为齐王未采纳意见。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:郑振铎
  type: Concept
  subject: 语文
  title: 郑振铎
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把郑振铎的笔名“西谛”记成“东谛”或“西裫”，混淆常见笔名。
    - 能指出并纠正这一错误：误将郑振铎当成诗人郑愁予，作者与作品张冠李戴。
  aliases:
    - 西谛
  category: 文学常识
  explanation: 郑振铎（1898—1958），笔名西谛，福建长乐人，作家、翻译家、文学史家，本文《猫》选自《郑振铎选集》。
  misconceptions:
    - 把郑振铎的笔名“西谛”记成“东谛”或“西裫”，混淆常见笔名。
    - 误将郑振铎当成诗人郑愁予，作者与作品张冠李戴。
    - 以为郑振铎是小说家，忽略他翻译家、文学史家的身份。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:郦道元
  type: Concept
  subject: 语文
  title: 郦道元
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将郦道元记为南朝人，实为北魏人。
    - 能指出并纠正这一错误：把'郦'写成'丽'或'骊'，形近字混淆。
  aliases: []
  category: 文学常识
  explanation: 北魏地理学家、散文家，著有《水经注》，以描写山水见长。
  misconceptions:
    - 误将郦道元记为南朝人，实为北魏人。
    - 把'郦'写成'丽'或'骊'，形近字混淆。
    - 将郦道元与柳宗元混为一谈，说《小石潭记》也是他写的。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:部首查字法
  type: Concept
  subject: 语文
  title: 部首查字法
  conceptType: 程序型
  aliases:
    - 部首检字法
  category: 方法
  explanation: 遇到不认识的字，先确定它的部首，数清部首笔画，在部首目录里找到页码，再按除去部首的笔画数在检字表里找到这个字。
  sourceRef: content/二年级/上册/语文/PEP-2-1-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:酬乐天扬州初逢席上见赠
  type: Concept
  subject: 语文
  title: 酬乐天扬州初逢席上见赠
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“酬”理解成“报酬、酬谢”，不知道是“以诗相答”。
    - 能指出并纠正这一错误：认为“乐天”是李白，将刘禹锡与白居易的赠答关系搞混。
  aliases: []
  category: 诗题理解
  explanation: 刘禹锡在扬州遇到白居易，白居易写了《醉赠刘二十八使君》，刘禹锡作此诗答谢。酬，以诗相答；乐天，白居易的字。
  misconceptions:
    - 把“酬”理解成“报酬、酬谢”，不知道是“以诗相答”。
    - 认为“乐天”是李白，将刘禹锡与白居易的赠答关系搞混。
    - 把“见赠”解释为“看见别人赠送”，实际是“赠给我”。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:醉翁之意不在酒
  type: Concept
  subject: 语文
  title: 醉翁之意不在酒
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只按字面理解“喝酒的本意不在酒”，用在不想喝酒的场合。
    - 能指出并纠正这一错误：把“醉翁之意不在酒”当作中性词，用在帮助他人的褒义句里。
  aliases: []
  category: 名句
  explanation: 出自《醉翁亭记》，比喻本意不在此而在别的方面，现多指别有用心。
  misconceptions:
    - 只按字面理解“喝酒的本意不在酒”，用在不想喝酒的场合。
    - 把“醉翁之意不在酒”当作中性词，用在帮助他人的褒义句里。
    - 忘了其多含贬义，误以为就是“注意力在别处”的通用表达。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:醉翁亭记
  type: Concept
  subject: 语文
  title: 醉翁亭记
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《醉翁亭记》作者记成苏轼或王安石，同列唐宋八大家而混淆。
    - 能指出并纠正这一错误：认为“醉翁”是欧阳修的朋友或亭子的名字，实际指自己。
  aliases: []
  category: 文言文
  explanation: 欧阳修所作，描写醉翁亭周围美景，表达作者寄情山水、与民同乐的情怀。
  misconceptions:
    - 把《醉翁亭记》作者记成苏轼或王安石，同列唐宋八大家而混淆。
    - 认为“醉翁”是欧阳修的朋友或亭子的名字，实际指自己。
    - 概括主旨只说“寄情山水”，漏掉“与民同乐”这一核心。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:采桑子
  type: Concept
  subject: 语文
  title: 采桑子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记作者为晏殊或辛弃疾，实为欧阳修。
    - 能指出并纠正这一错误：把“采桑子”当菜名或农事诗名，实为词牌。
  aliases: []
  category: 词牌名
  explanation: 词牌名，欧阳修歌咏颍州西湖春景之作。
  misconceptions:
    - 误记作者为晏殊或辛弃疾，实为欧阳修。
    - 把“采桑子”当菜名或农事诗名，实为词牌。
    - 认为描写的是杭州西湖，忘记是颍州西湖春景。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:采薇
  type: Concept
  subject: 语文
  title: 采薇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“采薇”误写成“采微”或“采萎”，以为“薇”是微小之意。
    - 能指出并纠正这一错误：误以为“采薇”描写田园隐居之乐，忽略其守节不食周粟的典故。
  aliases: []
  category: 典故
  explanation: 指伯夷、叔齐不食周粟，采薇而食，后饿死首阳山的故事，后世用以表示坚守气节。
  misconceptions:
    - 把“采薇”误写成“采微”或“采萎”，以为“薇”是微小之意。
    - 误以为“采薇”描写田园隐居之乐，忽略其守节不食周粟的典故。
    - 将“采薇”与“采菊”混淆，认为都是隐逸闲适，忘记伯夷叔齐的气节。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:采访提纲
  type: Concept
  subject: 语文
  title: 采访提纲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：提纲只写问题，漏写采访时间、地点、对象等基本要素
    - 能指出并纠正这一错误：问题如'你能谈谈感受吗'，没考虑开放性与针对性
  aliases: []
  category: 新闻活动
  explanation: 采访提纲是采访前拟定的问题清单，包括时间、地点、对象、目的、方式、问题等，问题要具体、客观、有针对性。
  misconceptions:
    - 提纲只写问题，漏写采访时间、地点、对象等基本要素
    - 问题如'你能谈谈感受吗'，没考虑开放性与针对性
    - 将提问顺序随意排列，前后问题无递进或衔接
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:采访方案
  type: Concept
  subject: 语文
  title: 采访方案
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：方案中没有明确报道题材和采访目的，现场临时抓瞎
    - 能指出并纠正这一错误：分工不具体，如'大家分工合作'，未落实到人
  aliases: []
  category: 新闻活动
  explanation: 采访方案是采访前制定的具体计划，包括报道题材、采访对象、分工、方式等。
  misconceptions:
    - 方案中没有明确报道题材和采访目的，现场临时抓瞎
    - 分工不具体，如'大家分工合作'，未落实到人
    - 未提前联系采访对象，或未查其背景，导致采访无法深入
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:采访礼仪
  type: Concept
  subject: 语文
  title: 采访礼仪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：采访对象拒绝时仍不依不饶，强行要求对方回答
    - 能指出并纠正这一错误：未经允许偷拍偷录，或录音前不征得同意
  aliases: []
  category: 新闻活动
  explanation: 采访礼仪指采访过程中尊重采访对象、言行得体的行为规范，如不强迫回答、征得同意等。
  misconceptions:
    - 采访对象拒绝时仍不依不饶，强行要求对方回答
    - 未经允许偷拍偷录，或录音前不征得同意
    - 对长者直呼其名，或使用不当称呼，显得不礼貌
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:采访问题设计
  type: Concept
  subject: 语文
  title: 采访问题设计
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：提问'你是不是觉得……'，带有诱导和倾向性
    - 能指出并纠正这一错误：问题范围过大，如'你对这次比赛有什么感想'，对象不知从何答起
  aliases: []
  category: 新闻活动
  explanation: 采访问题设计是采访提纲的核心，要求问题具体、客观、有针对性，且问题之间要有逻辑联系。
  misconceptions:
    - 提问'你是不是觉得……'，带有诱导和倾向性
    - 问题范围过大，如'你对这次比赛有什么感想'，对象不知从何答起
    - 问题间缺乏逻辑联系，东一榔头西一棒子
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S7.md
- id: concept:语文:重章叠句
  type: Concept
  subject: 语文
  title: 重章叠句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为重章叠句就是完全重复的诗句，实际上它只更换几个字，形成回环往复。
    - 能指出并纠正这一错误：把重章叠句误认为排比，排比是句式并列，重章叠句是章节间结构。
  aliases:
    - 重章叠唱
  category: 艺术手法
  explanation: 上下句或上下章基本相同，只更换几个字，形成回环往复的表达效果。
  misconceptions:
    - 认为重章叠句就是完全重复的诗句，实际上它只更换几个字，形成回环往复。
    - 把重章叠句误认为排比，排比是句式并列，重章叠句是章节间结构。
    - 将重章叠句当作对偶，对偶要求字数相等、结构对称，与重章叠句的换字不同。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:重音
  type: Concept
  subject: 语文
  title: 重音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为重音就是读得越重越好，实际是相对突出，过重会失真。
    - 能指出并纠正这一错误：把重音固定放某个词上，忽略了语境变化时重音位置也应改变。
  aliases: []
  category: 朗读技巧
  explanation: 重音指朗读时为了突出强调某个词语而读得较重的声音。
  misconceptions:
    - 认为重音就是读得越重越好，实际是相对突出，过重会失真。
    - 把重音固定放某个词上，忽略了语境变化时重音位置也应改变。
    - 将重音与停顿混为一谈，重音是音强突出，停连是声音中断连接。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:量词
  type: Concept
  subject: 语文
  title: 量词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：量词搭配错误，如“一只马”应为“一匹马”，“一头牛”等。
    - 能指出并纠正这一错误：认为量词只包括度量衡单位，忽略“个、次、张”等个体量词和动量词。
  aliases: []
  category: 语法
  explanation: 表示计算单位的词，包括度量衡单位和动作行为的单位。
  misconceptions:
    - 量词搭配错误，如“一只马”应为“一匹马”，“一头牛”等。
    - 认为量词只包括度量衡单位，忽略“个、次、张”等个体量词和动量词。
    - 将“量词”与“数词”混为一谈，如说“三个”中“三”是量词。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:金樽清酒斗十千
  type: Concept
  subject: 语文
  title: 金樽清酒斗十千
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“斗十千”翻译成“一斗酒十千毫升”，不懂是形容酒价昂贵。
    - 能指出并纠正这一错误：认为这句诗在描写宴饮奢华，忽略了反衬诗人内心苦闷。
  aliases: []
  category: 诗句理解
  explanation: 酒樽里盛着价格昂贵的清醇美酒。金樽，对酒樽的美称；斗十千，一斗值十千钱，形容酒美价贵。
  misconceptions:
    - 把“斗十千”翻译成“一斗酒十千毫升”，不懂是形容酒价昂贵。
    - 认为这句诗在描写宴饮奢华，忽略了反衬诗人内心苦闷。
    - 把“金樽”解释为“金色的酒杯”，不理解是对酒樽的美称。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:金色花
  type: Concept
  subject: 语文
  title: 金色花
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘金色花’指向日葵或菊花，实际是印度圣树黄兰的花朵。
    - 能指出并纠正这一错误：把‘我’变成金色花理解为真实事件，实际是儿童想象。
  aliases:
    - 黄兰
  category: 文学意象
  explanation: 金色花即黄兰，木兰科常绿乔木，开金黄色花朵，印度视为圣树。在泰戈尔的《金色花》中，孩子想象自己变成金色花，以此表达对母亲的依恋。
  misconceptions:
    - 误以为‘金色花’指向日葵或菊花，实际是印度圣树黄兰的花朵。
    - 把‘我’变成金色花理解为真实事件，实际是儿童想象。
    - 误以为《金色花》是赞美老师，实际表达对母亲的依恋。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S3.md
- id: concept:语文:金钱观
  type: Concept
  subject: 语文
  title: 金钱观
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为《我的叔叔于勒》批判所有金钱，而非资本主义下人际关系的异化。
    - 能指出并纠正这一错误：误以为菲利普夫妇冷酷是因为于勒品行不好，与金钱无关。
  aliases: []
  category: 主题思想
  explanation: 《我的叔叔于勒》批判了资本主义社会中人与人之间赤裸裸的金钱关系。
  misconceptions:
    - 认为《我的叔叔于勒》批判所有金钱，而非资本主义下人际关系的异化。
    - 误以为菲利普夫妇冷酷是因为于勒品行不好，与金钱无关。
    - 把于勒的破产归因于个人懒惰，忽视社会制度对人性的扭曲。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:铁头老生
  type: Concept
  subject: 语文
  title: 铁头老生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘铁头老生’理解成角色姓名，以为他是叫‘铁头’的演员，而非外号
    - 能指出并纠正这一错误：误认为‘老生’指老年女性，或与‘小生’‘武生’混为一谈，不知其扮演中年以上男子
  aliases: []
  category: 戏曲常识
  explanation: 那个演员的外号。老生，戏曲行当之一，扮演中年以上男子。
  misconceptions:
    - 把‘铁头老生’理解成角色姓名，以为他是叫‘铁头’的演员，而非外号
    - 误认为‘老生’指老年女性，或与‘小生’‘武生’混为一谈，不知其扮演中年以上男子
    - 看到‘铁头’就认为是武生，觉得会武打，其实老生以唱做为主，不重武打
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:铺陈排比
  type: Concept
  subject: 语文
  title: 铺陈排比
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“东市买骏马，西市买鞍鞯”判为互文，实际是铺陈排比，各句独立不互补
    - 能指出并纠正这一错误：以为排比就是简单重复词语，忽略铺陈排比在渲染氛围、增强节奏上的作用
  aliases:
    - 铺排
  category: 表现手法
  explanation: 用铺叙和排比的手法描述行为情态，增强语势和节奏感。
  misconceptions:
    - 将“东市买骏马，西市买鞍鞯”判为互文，实际是铺陈排比，各句独立不互补
    - 以为排比就是简单重复词语，忽略铺陈排比在渲染氛围、增强节奏上的作用
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S5.md
- id: concept:语文:锋芒毕露
  type: Concept
  subject: 语文
  title: 锋芒毕露
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'毕'误写为'必'，写成'锋芒必露'。
    - 能指出并纠正这一错误：误认为该词是褒义，忽略其常用于形容好表现自我。
  aliases: []
  category: 成语
  explanation: 比喻锐气和才干全都显露出来，多形容人好表现自己。
  misconceptions:
    - 把'毕'误写为'必'，写成'锋芒必露'。
    - 误认为该词是褒义，忽略其常用于形容好表现自我。
    - 与'才华横溢'混用，未突出'显露'且带逼人意味。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:镌刻
  type: Concept
  subject: 语文
  title: 镌刻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“镌刻”的“镌”写成“隽”或“携”，写成“隽刻”“携刻”
    - 能指出并纠正这一错误：误读“镌”为“juàn”，实际应读“juān”
  aliases: []
  category: 词语
  explanation: 雕刻。文中指飞行员的形象永远铭刻在共和国的史册上。
  misconceptions:
    - 把“镌刻”的“镌”写成“隽”或“携”，写成“隽刻”“携刻”
    - 误读“镌”为“juàn”，实际应读“juān”
    - 认为“镌刻”只能用于在石头上刻字，不能用于记忆、历史等抽象事物
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:长勺之战
  type: Concept
  subject: 语文
  title: 长勺之战
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为长勺之战是晋楚争霸的城濮之战，把作战双方记错。
    - 能指出并纠正这一错误：把“长勺”写成“长芍”或“长灼”，音形混写。
  aliases:
    - 齐鲁长勺之战
  category: 历史事件
  explanation: 春秋时期齐鲁两国之间的一场战争，鲁国以弱胜强，是著名的以少胜多的战例。
  misconceptions:
    - 误以为长勺之战是晋楚争霸的城濮之战，把作战双方记错。
    - 把“长勺”写成“长芍”或“长灼”，音形混写。
    - 误将长勺之战与巨鹿之战混淆，认为也是项羽指挥的以少胜多。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:长命锁
  type: Concept
  subject: 语文
  title: 长命锁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘长命锁’的‘锁’写成‘琐’或‘唢’
    - 能指出并纠正这一错误：误以为长命锁是成人礼饰品，实际是婴儿周岁戴
  aliases: []
  category: 民俗
  explanation: 旧俗挂在婴儿颈上的饰物，寓意长寿。文中何满子一周岁生日时打造了包铜镀金长命锁。
  misconceptions:
    - 把‘长命锁’的‘锁’写成‘琐’或‘唢’
    - 误以为长命锁是成人礼饰品，实际是婴儿周岁戴
    - 认为长命锁用普通铁制，忽略文中‘包铜镀金’的细节
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:长征
  type: Concept
  subject: 语文
  title: 长征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将长征时间记成1935～1936年，漏掉1934年开始
    - 能指出并纠正这一错误：误认为长征只是军事撤退，未点明“战略转移”性质
  aliases:
    - 红军长征
  category: 历史
  explanation: 长征是1934年至1936年中国工农红军进行的战略转移，本文记叙了红军翻越老山界的经历。
  misconceptions:
    - 将长征时间记成1935～1936年，漏掉1934年开始
    - 误认为长征只是军事撤退，未点明“战略转移”性质
    - 把本文写的老山界视为长征中唯一难走的山，忽视其他艰险
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S2.md
- id: concept:语文:长沙过贾谊宅
  type: Concept
  subject: 语文
  title: 长沙过贾谊宅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《长沙过贾谊宅》作者记成贾谊本人，混淆了汉唐人物。
    - 能指出并纠正这一错误：认为诗歌只是哀悼贾谊，忽略了刘长卿对自身遭际的感慨。
  aliases: []
  category: 诗题理解
  explanation: 刘长卿经过贾谊故居所作，表达对贾谊的凭吊和自身遭遇的感慨。
  misconceptions:
    - 把《长沙过贾谊宅》作者记成贾谊本人，混淆了汉唐人物。
    - 认为诗歌只是哀悼贾谊，忽略了刘长卿对自身遭际的感慨。
    - 把“过”解释为“责怪”，不知道是“经过”的意思。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S6.md
- id: concept:语文:长短句互换
  type: Concept
  subject: 语文
  title: 长短句互换
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：互换时擅自增删信息，如“他推开门，大步走进教室”改成“他走进教室”，丢失动作细节。
    - 能指出并纠正这一错误：误以为短句就是去掉修饰语，导致“他高兴地跳起来”变“他跳起来”，情感消失。
  aliases:
    - 长短句变换
  category: 写作技巧
  explanation: 长句表达完备精细，短句表达简洁有力，长短句错落使用可以增强文章表现力。
  misconceptions:
    - 互换时擅自增删信息，如“他推开门，大步走进教室”改成“他走进教室”，丢失动作细节。
    - 误以为短句就是去掉修饰语，导致“他高兴地跳起来”变“他跳起来”，情感消失。
    - 把两个短句强行合并时颠倒因果，如“他生病了。他没来上课。”合并成“因为没来上课，所以生病了。”
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:长篇小说
  type: Concept
  subject: 语文
  title: 长篇小说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《朝花夕拾》等散文集误认为长篇小说，只因篇幅较长。
    - 能指出并纠正这一错误：认为字数达到十万以上就是长篇小说，忽略情节和人物塑造标准。
  aliases: []
  category: 文学体裁
  explanation: 长篇小说是小说的一种，篇幅长、容量大，情节复杂，人物众多，能够反映广阔的社会生活。
  misconceptions:
    - 把《朝花夕拾》等散文集误认为长篇小说，只因篇幅较长。
    - 认为字数达到十万以上就是长篇小说，忽略情节和人物塑造标准。
    - 将《钢铁是怎样炼成的》说成完全是真实传记，忽视了文学加工。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:长风破浪会有时
  type: Concept
  subject: 语文
  title: 长风破浪会有时
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“会”解释为“会议、会面”，不知道是“终将”的意思。
    - 能指出并纠正这一错误：与“乘风破浪”混为一谈，忘了此句比喻终将实现理想。
  aliases: []
  category: 诗句理解
  explanation: 比喻终将实现远大理想。会，终将。
  misconceptions:
    - 把“会”解释为“会议、会面”，不知道是“终将”的意思。
    - 与“乘风破浪”混为一谈，忘了此句比喻终将实现理想。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:问卷调查
  type: Concept
  subject: 语文
  title: 问卷调查
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把问卷调查当成随意聊天，不设计标准问题，就问身边几个人就下结论。
    - 能指出并纠正这一错误：问卷中设置诱导性问题，如“您是否也认为读书很重要”，导致结果失真。
  aliases:
    - 问卷
  category: 语文综合性学习
  explanation: 一种以问卷形式收集信息的研究方法，用于了解调查对象的状况、态度等。
  misconceptions:
    - 把问卷调查当成随意聊天，不设计标准问题，就问身边几个人就下结论。
    - 问卷中设置诱导性问题，如“您是否也认为读书很重要”，导致结果失真。
    - 认为问卷题目越多越好，冗长烦人，被调查者乱答，影响数据真实性。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:问答歌
  type: Concept
  subject: 语文
  title: 问答歌
  conceptType: 概念型
  aliases:
    - 问答式儿歌
  category: 概念
  explanation: 一问一答编成的儿歌叫问答歌，像谁会飞？鸟会飞。读着问答歌，可以一边玩一边记住好多知识。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C4/sections/S7.md
- id: concept:语文:闰土
  type: Concept
  subject: 语文
  title: 闰土
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为少年闰土和中年闰土性格一样，都是沉默寡言。
    - 能指出并纠正这一错误：误以为闰土是《故乡》的作者，把故事背景当成鲁迅本人经历。
  aliases: []
  category: 人物形象
  explanation: 闰土是小说中的主要人物，少年时天真活泼，中年时麻木迟钝，反映了旧社会对农民的压迫。
  misconceptions:
    - 认为少年闰土和中年闰土性格一样，都是沉默寡言。
    - 误以为闰土是《故乡》的作者，把故事背景当成鲁迅本人经历。
    - 把闰土称呼鲁迅为“老爷”当作尊敬，忽略其中的隔膜和等级观念。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:闰土形象
  type: Concept
  subject: 语文
  title: 闰土形象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只强调闰土少年时的机智勇敢，忽略中年后的麻木迟钝。
    - 能指出并纠正这一错误：误以为闰土形象就是勤劳朴实，缺少对旧社会压迫的批判。
  aliases:
    - 闰土
  category: 人物形象
  explanation: 闰土是小说中的主要人物，少年时天真活泼，中年时麻木辛苦，反映了旧社会农民的生活状况。
  misconceptions:
    - 只强调闰土少年时的机智勇敢，忽略中年后的麻木迟钝。
    - 误以为闰土形象就是勤劳朴实，缺少对旧社会压迫的批判。
    - 把闰土的巨变归因于年龄增长，而不是社会压迫和阶级鸿沟。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:闲人
  type: Concept
  subject: 语文
  title: 闲人
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“闲人”解释为“无事可做的人”，忽略其不慕名利、从容赏景的深层含义。
    - 能指出并纠正这一错误：只说“闲人”表达被贬的悲凉，忽视其中包含的豁达与自嘲。
  aliases: []
  category: 词语理解
  explanation: “闲人”在文中指不汲汲于名利而能从容流连光景的人，既含自嘲，又暗含被贬的悲凉与豁达。
  misconceptions:
    - 将“闲人”解释为“无事可做的人”，忽略其不慕名利、从容赏景的深层含义。
    - 只说“闲人”表达被贬的悲凉，忽视其中包含的豁达与自嘲。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:闲来垂钓碧溪上
  type: Concept
  subject: 语文
  title: 闲来垂钓碧溪上
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“垂钓”理解为普通钓鱼，不联想姜太公遇周文王的典故。
    - 能指出并纠正这一错误：把姜尚与姜子牙当成两个人，其实姜尚就是姜子牙。
  aliases: []
  category: 典故
  explanation: 相传姜尚（姜太公）遇到周文王前曾在渭水的磻溪垂钓，后辅佐周武王灭商。
  misconceptions:
    - 把“垂钓”理解为普通钓鱼，不联想姜太公遇周文王的典故。
    - 把姜尚与姜子牙当成两个人，其实姜尚就是姜子牙。
    - 误以为典故是孔子在溪边垂钓，张冠李戴。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:间不容发
  type: Concept
  subject: 语文
  title: 间不容发
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“发”读成fā，正确应读fà。
    - 能指出并纠正这一错误：误用它来形容事物之间距离大，与“间不容息”混淆。
  aliases: []
  category: 成语
  explanation: 两物中间容不下一根头发，形容事物之间距离极小。
  misconceptions:
    - 把“发”读成fā，正确应读fà。
    - 误用它来形容事物之间距离大，与“间不容息”混淆。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:间接抒情
  type: Concept
  subject: 语文
  title: 间接抒情
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为‘黄河以它英雄的气魄’是对景物的客观描写，不是抒情
    - 能指出并纠正这一错误：将间接抒情与直接抒情混淆，误把‘啊！黄河！’当间接抒情
  aliases:
    - 借景抒情
    - 托物言志
  category: 文学表现手法
  explanation: 间接抒情是通过叙述、描写、议论等方式间接表达情感，如借景抒情、托物言志等。本诗中也包含间接抒情，如对黄河景象的描绘。
  misconceptions:
    - 认为‘黄河以它英雄的气魄’是对景物的客观描写，不是抒情
    - 将间接抒情与直接抒情混淆，误把‘啊！黄河！’当间接抒情
    - 以为所有写景句子都是间接抒情，忽略议论和叙述也能间接抒情
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:闻一多
  type: Concept
  subject: 语文
  title: 闻一多
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为闻一多是‘五四运动’的发起者，实际他参与并领导的是学生运动，并非发起
    - 能指出并纠正这一错误：将《春》《背影》的作者朱自清与闻一多混淆，两人都是民主战士但作品不同
  aliases: []
  category: 人物
  explanation: 本文传主，既是学者、诗人，又是民主战士，其言行体现了“口的巨人，行的高标”。
  misconceptions:
    - 误以为闻一多是‘五四运动’的发起者，实际他参与并领导的是学生运动，并非发起
    - 将《春》《背影》的作者朱自清与闻一多混淆，两人都是民主战士但作品不同
    - 以为闻一多‘口的巨人’指口才好，其实强调他言行一致、勇于呐喊
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S2.md
- id: concept:语文:闻一多与《最后一次讲演》
  type: Concept
  subject: 语文
  title: 闻一多与《最后一次讲演》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《最后一次讲演》误认作闻一多在“一二·一”运动追悼会上的发言，实际是李公朴追悼会。
    - 能指出并纠正这一错误：将闻一多与朱自清混淆，误以为《最后一次讲演》是朱自清为悼念李公朴所作。
  aliases:
    - 最后一次演讲
  category: 文学常识
  explanation: 闻一多是现代诗人、学者，1946年7月15日在李公朴追悼会上发表《最后一次讲演》，当天被国民党特务暗杀。
  misconceptions:
    - 把《最后一次讲演》误认作闻一多在“一二·一”运动追悼会上的发言，实际是李公朴追悼会。
    - 将闻一多与朱自清混淆，误以为《最后一次讲演》是朱自清为悼念李公朴所作。
    - 认为闻一多是新月派代表诗人，且此演讲属于散文作品，不属演讲词。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:闻王昌龄左迁龙标遥有此寄
  type: Concept
  subject: 语文
  title: 闻王昌龄左迁龙标遥有此寄
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“左迁”理解为升官，实际是降职。
    - 能指出并纠正这一错误：误将本诗作者记作王昌龄，或与《芙蓉楼送辛渐》混淆。
  aliases: []
  category: 诗歌内容
  explanation: 李白的《闻王昌龄左迁龙标遥有此寄》是一首七言绝句，表达了对友人被贬的同情和关切。
  misconceptions:
    - 把“左迁”理解为升官，实际是降职。
    - 误将本诗作者记作王昌龄，或与《芙蓉楼送辛渐》混淆。
    - 将“子规”误以为是一种鸟的叫声，实际指杜鹃鸟。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:闻笛赋
  type: Concept
  subject: 语文
  title: 闻笛赋
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《闻笛赋》的作者记成嵇康，实际上是向秀悼念嵇康。
    - 能指出并纠正这一错误：把“闻笛赋”与“折柳”混为一谈，不知其出自《思旧赋》。
  aliases: []
  category: 典故
  explanation: 指西晋向秀所作的《思旧赋》，向秀经过嵇康故居时听见笛声而作。
  misconceptions:
    - 把《闻笛赋》的作者记成嵇康，实际上是向秀悼念嵇康。
    - 把“闻笛赋”与“折柳”混为一谈，不知其出自《思旧赋》。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:阅读
  type: Concept
  subject: 语文
  title: 阅读
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为阅读只是默读，不包含朗读，把朗读完全排除在阅读之外。
    - 能指出并纠正这一错误：将“阅读”等同于“看”，以为眼睛扫过文字就是阅读，忽视了理解和思考。
  aliases:
    - 读书
  category: 语文学习方式
  explanation: 阅读是获取知识、启智增慧、培养道德的重要途径，也是重要的语文学习方式。
  misconceptions:
    - 认为阅读只是默读，不包含朗读，把朗读完全排除在阅读之外。
    - 将“阅读”等同于“看”，以为眼睛扫过文字就是阅读，忽视了理解和思考。
    - 误以为阅读只为了应付考试，忽略其启智增慧、培养道德的重要作用。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:阅读古典名著的方法
  type: Concept
  subject: 语文
  title: 阅读古典名著的方法
  conceptType: 程序型
  aliases:
    - 读古典名著的方法
  category: 方法
  explanation: 读古典名著时，可以联系上下文猜测语句的意思，难懂的词语不必反复琢磨，还可以借助资料和看过的影视作品加深理解。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C2/sections/S7.md
- id: concept:语文:阅读时想开去
  type: Concept
  subject: 语文
  title: 阅读时想开去
  conceptType: 程序型
  aliases:
    - 从所读的内容想开去
  category: 方法
  explanation: 读文章时联系生活经验或读过的其他文章，从内容展开联想。这样能加深对文章的理解，还能活跃思维、激发创造力。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C1/sections/S5.md
- id: concept:语文:阅读时提出问题
  type: Concept
  subject: 语文
  title: 阅读时提出问题
  conceptType: 程序型
  aliases:
    - 提问
  category: 方法
  explanation: 读课文时积极动脑，把想到的问题写下来。养成敢于提问、善于提问的习惯，能让思考更深入。
  sourceRef: content/四年级/上册/语文/PEP-4-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:阎罗
  type: Concept
  subject: 语文
  title: 阎罗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“阎罗”写成“闫罗”或“盐罗”，“阎”易与姓“闫”相混。
    - 能指出并纠正这一错误：认为阎罗是中国本土神，实际源自印度佛教“阎魔王”，是梵语音译。
  aliases: []
  category: 词语
  explanation: 即阎罗王，也称“阎王”，民间传说中掌管“阴间”的神。
  misconceptions:
    - 把“阎罗”写成“闫罗”或“盐罗”，“阎”易与姓“闫”相混。
    - 认为阎罗是中国本土神，实际源自印度佛教“阎魔王”，是梵语音译。
    - 将“阎罗”与“龙王”“大帝”混同，不知其专管阴间，如说“阎罗管下雨”。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:阜平
  type: Concept
  subject: 语文
  title: 阜平
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把阜平划到山西省，实际它属于河北省保定市，晋察冀核心区。
    - 能指出并纠正这一错误：不了解阜平革命历史，误以为根据地只在太行山南段，不知其是重点县。
  aliases: []
  category: 历史地理
  explanation: 阜平位于河北省，是晋察冀抗日根据地的核心区域，具有光荣的革命历史。
  misconceptions:
    - 误把阜平划到山西省，实际它属于河北省保定市，晋察冀核心区。
    - 不了解阜平革命历史，误以为根据地只在太行山南段，不知其是重点县。
    - 把‘阜平’的‘阜’读作‘fù’（正确为fù）或写作‘垖平’，字音字形混淆。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:防烧蚀层
  type: Concept
  subject: 语文
  title: 防烧蚀层
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为防烧蚀层只是单纯隔热，忽略剥落散热原理。
    - 能指出并纠正这一错误：把防烧蚀层写成“防摩擦层”或“隔热瓦”。
  aliases:
    - 防热层
  category: 科学知识
  explanation: 飞船表面耐高温材料，通过剥落带走热量以保护船体。
  misconceptions:
    - 误认为防烧蚀层只是单纯隔热，忽略剥落散热原理。
    - 把防烧蚀层写成“防摩擦层”或“隔热瓦”。
    - 认为烧蚀层可重复使用，实际上是一次性烧蚀消耗。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S2.md
- id: concept:语文:阿城
  type: Concept
  subject: 语文
  title: 阿城
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《溜索》的作者写成沈从文或阿来
    - 能指出并纠正这一错误：误将《溜索》选自《遍地风流》说成《边城》
  aliases: []
  category: 作家作品
  explanation: 当代作家，本文《溜索》选自其小说集《遍地风流》，语言简洁凝练，富有特色。
  misconceptions:
    - 把《溜索》的作者写成沈从文或阿来
    - 误将《溜索》选自《遍地风流》说成《边城》
    - 把‘阿城’误认为是地名，不知是作家身份
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:阿房宫
  type: Concept
  subject: 语文
  title: 阿房宫
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“阿房”读作ā fáng，实际应读ē páng。
    - 能指出并纠正这一错误：误以为阿房宫是汉朝修建的，或以为是刘邦所毁。
  aliases:
    - 阿房
  category: 历史建筑
  explanation: 秦朝宫殿群，规模宏大，后被项羽焚毁。
  misconceptions:
    - 将“阿房”读作ā fáng，实际应读ē páng。
    - 误以为阿房宫是汉朝修建的，或以为是刘邦所毁。
    - 把“房”误写成“坊”或“旁”，字形不辨。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C6/index.md
- id: concept:语文:阿长与《山海经》
  type: Concept
  subject: 语文
  title: 阿长与《山海经》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《阿长与〈山海经〉》当成选自《呐喊》或《野草》。
    - 能指出并纠正这一错误：把“阿长”误认为鲁迅的母亲，或认为她是虚构的人物。
  aliases: []
  category: 文学常识
  explanation: 鲁迅回忆保姆阿长的散文，选自《朝花夕拾》，通过阿长为“我”买《山海经》等事，表现对阿长的怀念与敬意。
  misconceptions:
    - 误把《阿长与〈山海经〉》当成选自《呐喊》或《野草》。
    - 把“阿长”误认为鲁迅的母亲，或认为她是虚构的人物。
    - 将《阿长与〈山海经〉》的文体说成小说，而非散文。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:陆游
  type: Concept
  subject: 语文
  title: 陆游
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“陆游”的名字写成“陆尤”或“陆由”，字形混淆。
    - 能指出并纠正这一错误：误认为陆游是北宋人，实际上他是南宋爱国诗人。
  aliases:
    - 陆务观
    - 放翁
  category: 作家作品
  explanation: 陆游（1125—1210），字务观，号放翁，南宋爱国诗人，代表作《游山西村》等。
  misconceptions:
    - 把“陆游”的名字写成“陆尤”或“陆由”，字形混淆。
    - 误认为陆游是北宋人，实际上他是南宋爱国诗人。
    - 误把《游山西村》中的“山西”理解为山西省，实为山西村。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:陈与义《临江仙》
  type: Concept
  subject: 语文
  title: 陈与义《临江仙》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《临江仙·夜登小阁忆洛中旧游》作者误记为苏轼或辛弃疾。
    - 能指出并纠正这一错误：认为上阕写的是太平盛世的欢乐，忽略写于靖康之变后的背景。
  aliases:
    - 临江仙
  category: 古诗词
  explanation: 陈与义词作，回忆洛阳旧游，抒发国破家亡后的落寞孤寂情怀，以清新之语写怅惘之情。
  misconceptions:
    - 把《临江仙·夜登小阁忆洛中旧游》作者误记为苏轼或辛弃疾。
    - 认为上阕写的是太平盛世的欢乐，忽略写于靖康之变后的背景。
    - 将'杏花疏影里，吹笛到天明'理解为恬静美好，忘记其蕴含的国破之痛。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:陈太丘与友期行
  type: Concept
  subject: 语文
  title: 陈太丘与友期行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将‘期日中’的‘期’误译为‘日期’，实际应为‘约定’。
    - 能指出并纠正这一错误：把‘相委而去’的‘委’误译为‘委托’，实际是‘舍弃、丢下’。
  aliases: []
  category: 文言文
  explanation: 《陈太丘与友期行》选自《世说新语·方正》，讲述陈元方七岁时机智应对父亲友人失信无礼的故事，体现其方正品格。
  misconceptions:
    - 将‘期日中’的‘期’误译为‘日期’，实际应为‘约定’。
    - 把‘相委而去’的‘委’误译为‘委托’，实际是‘舍弃、丢下’。
    - 将‘入门不顾’的‘顾’误译为‘照顾’，实际是‘回头看’。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C2/sections/S4.md
- id: concept:语文:陈子昂
  type: Concept
  subject: 语文
  title: 陈子昂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《登幽州台歌》归为李白或李商隐所作，作者判断错误。
    - 能指出并纠正这一错误：将“陈子昂”的字“伯玉”与“子美”混淆，记错人物字号。
  aliases: []
  category: 作家作品
  explanation: 陈子昂（659—700），字伯玉，唐代文学家，其诗风骨峥嵘，代表作《登幽州台歌》。
  misconceptions:
    - 误把《登幽州台歌》归为李白或李商隐所作，作者判断错误。
    - 将“陈子昂”的字“伯玉”与“子美”混淆，记错人物字号。
    - 认为“前不见古人”中的“古人”指古代所有人，其实指燕昭王等贤君。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:陈尧咨
  type: Concept
  subject: 语文
  title: 陈尧咨
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把陈康肃公的‘康肃’当作姓名，误认为他姓康名肃，实际是谥号
    - 能指出并纠正这一错误：将陈尧咨误记为《卖油翁》的作者，与欧阳修张冠李戴
  aliases:
    - 陈康肃
  category: 文学常识
  explanation: 陈尧咨（970—1034），字嘉谟，谥号康肃，北宋官员，善射箭，本文中的“陈康肃公”即指他。
  misconceptions:
    - 把陈康肃公的‘康肃’当作姓名，误认为他姓康名肃，实际是谥号
    - 将陈尧咨误记为《卖油翁》的作者，与欧阳修张冠李戴
    - 把陈尧咨的谥号‘康肃’与欧阳修的‘文忠’互换，导致常识错误
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:陈忠实
  type: Concept
  subject: 语文
  title: 陈忠实
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《白鹿原》看成路遥的作品
    - 能指出并纠正这一错误：误认为本文《我的白鸽》的作者是贾平凹
  aliases: []
  category: 文学常识
  explanation: 陈忠实（1942—2016），陕西西安人，作家，代表作有长篇小说《白鹿原》等。
  misconceptions:
    - 误将《白鹿原》看成路遥的作品
    - 误认为本文《我的白鸽》的作者是贾平凹
    - 把陈忠实的籍贯写作陕西延安，实际是陕西西安
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:陈毅
  type: Concept
  subject: 语文
  title: 陈毅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《回忆我的母亲》的作者误记为陈毅，实际是朱德，张冠李戴。
    - 能指出并纠正这一错误：将陈毅与陈独秀混淆，认为他是新文化运动领导者，实际陈毅是革命家和军事家。
  aliases: []
  category: 作者
  explanation: 陈毅（1901—1972），字仲弘，四川乐至人，中国人民解放军创建人和领导人之一，无产阶级革命家、军事家。
  misconceptions:
    - 把《回忆我的母亲》的作者误记为陈毅，实际是朱德，张冠李戴。
    - 将陈毅与陈独秀混淆，认为他是新文化运动领导者，实际陈毅是革命家和军事家。
    - 因学过《梅岭三章》就认为陈毅是诗人，忽略其无产阶级革命家、军事家身份。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S3.md
- id: concept:语文:陈涉世家
  type: Concept
  subject: 语文
  title: 陈涉世家
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为《陈涉世家》选自《资治通鉴》，实为《史记》。
    - 能指出并纠正这一错误：把“陈涉”写成“陈陟”或“涉”写成“步”，字形混淆。
  aliases: []
  category: 文言文
  explanation: 《史记》中的一篇，记述陈胜、吴广领导的大泽乡起义，是中国历史上第一次大规模农民起义。
  misconceptions:
    - 误以为《陈涉世家》选自《资治通鉴》，实为《史记》。
    - 把“陈涉”写成“陈陟”或“涉”写成“步”，字形混淆。
    - 误以为陈涉是姓名，实际陈胜字涉，作品题名用的是字。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:陈胜吴广起义
  type: Concept
  subject: 语文
  title: 陈胜吴广起义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为起义发生在秦二世三年而非秦二世元年。
    - 能指出并纠正这一错误：把“大泽乡”写成“大泽向”或“泽”写成“择”，字形混淆。
  aliases:
    - 大泽乡起义
  category: 历史事件
  explanation: 秦末陈胜、吴广在大泽乡发动起义，是中国历史上第一次大规模农民起义，揭开了秦末农民战争的序幕。
  misconceptions:
    - 误认为起义发生在秦二世三年而非秦二世元年。
    - 把“大泽乡”写成“大泽向”或“泽”写成“择”，字形混淆。
    - 误以为起义是农民反抗项羽暴政，张冠李戴。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:陶弘景
  type: Concept
  subject: 语文
  title: 陶弘景
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将《答谢中书书》作者当作谢灵运，因“谢中书”是姓氏。
    - 能指出并纠正这一错误：说陶弘景是唐代人，实际他生活于南朝齐梁时期。
  aliases:
    - 陶隐居
  category: 文学常识
  explanation: 陶弘景，南朝齐梁时思想家、医学家，人称“山中宰相”，《答谢中书书》是其山水小品名篇。
  misconceptions:
    - 误将《答谢中书书》作者当作谢灵运，因“谢中书”是姓氏。
    - 说陶弘景是唐代人，实际他生活于南朝齐梁时期。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:陶渊明
  type: Concept
  subject: 语文
  title: 陶渊明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把陶渊明的字“元亮”误写为“元量”或“元良”
    - 能指出并纠正这一错误：误认为陶渊明是唐代山水田园诗人，与王维、孟浩然混淆
  aliases: []
  category: 人物
  explanation: 东晋诗人，一名潜，字元亮，田园诗派创始人，爱菊。
  misconceptions:
    - 把陶渊明的字“元亮”误写为“元量”或“元良”
    - 误认为陶渊明是唐代山水田园诗人，与王维、孟浩然混淆
    - 误写为“陶渊明爱莲，周敦颐爱菊”，将两人的爱好张冠李戴
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S4.md
- id: concept:语文:隆中对
  type: Concept
  subject: 语文
  title: 隆中对
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《隆中对》是诸葛亮本人撰写的文章，实际出自陈寿《三国志》。
    - 能指出并纠正这一错误：将'隆中对'的'对'理解为对联，不知是'对答'之意。
  aliases:
    - 草庐对
  category: 历史事件
  explanation: 诸葛亮在隆中为刘备分析天下大势，提出跨有荆益、西和诸戎、南抚夷越、外结孙权、内修政理，待天下有变则两路北伐的战略规划。
  misconceptions:
    - 误认为《隆中对》是诸葛亮本人撰写的文章，实际出自陈寿《三国志》。
    - 将'隆中对'的'对'理解为对联，不知是'对答'之意。
    - 混淆'隆中对'与'出师表'的内容，把北伐计划当作隆中对策。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:隔而不隔，界而未界
  type: Concept
  subject: 语文
  title: 隔而不隔，界而未界
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错误理解为景物被完全隔开，没有关联和层次。
    - 能指出并纠正这一错误：写错字，“隔”误写为“阁”，“界”误写为“介”。
  aliases: []
  category: 语句理解
  explanation: 指花墙和廊子使景物有分隔但又不完全隔绝，增加了景致的层次和深度。
  misconceptions:
    - 错误理解为景物被完全隔开，没有关联和层次。
    - 写错字，“隔”误写为“阁”，“界”误写为“介”。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:隔膜
  type: Concept
  subject: 语文
  title: 隔膜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“隔膜”理解为物理上的厚墙壁，误以为是具体的障碍物。
    - 能指出并纠正这一错误：认为“隔膜”只是个人之间不交流，没有意识到它是社会等级造成的。
  aliases:
    - 隔阂
  category: 文学概念
  explanation: 指人与人之间思想感情上的隔阂、疏远。在《故乡》中，作者用“厚障壁”比喻这种隔膜。
  misconceptions:
    - 把“隔膜”理解为物理上的厚墙壁，误以为是具体的障碍物。
    - 认为“隔膜”只是个人之间不交流，没有意识到它是社会等级造成的。
    - 误以为《故乡》中的“隔膜”指故乡与我有隔膜，忽略主要指人与人之间。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:雕版印刷
  type: Concept
  subject: 语文
  title: 雕版印刷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“雕版”的“版”误写成“板”
    - 能指出并纠正这一错误：误以为雕版印刷是毕昇发明的，实际毕昇发明的是活字
  aliases:
    - 板印
  category: 科技史实
  explanation: 在整块木板上刻字进行印刷的技术，是活字印刷术发明前的主要印刷方式。
  misconceptions:
    - 把“雕版”的“版”误写成“板”
    - 误以为雕版印刷是毕昇发明的，实际毕昇发明的是活字
    - 认为雕版印刷可以灵活换字，其实整版刻字不能单换
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:雨打萍
  type: Concept
  subject: 语文
  title: 雨打萍
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“雨打萍”理解为比喻国家动荡，实际比喻个人身世坎坷。
    - 能指出并纠正这一错误：误用“雨打萍”形容漂泊无依，但忽略了是“身世浮沉”的意象。
  aliases: []
  category: 修辞手法
  explanation: 比喻身世坎坷，如雨中浮萍，漂泊无根。
  misconceptions:
    - 把“雨打萍”理解为比喻国家动荡，实际比喻个人身世坎坷。
    - 误用“雨打萍”形容漂泊无依，但忽略了是“身世浮沉”的意象。
    - 将“雨打萍”的修辞错判为拟人，实际是比喻。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:雨果
  type: Concept
  subject: 语文
  title: 雨果
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把雨果当成英国作家，代表作写成《双城记》。
    - 能指出并纠正这一错误：将《悲惨世界》记为巴尔扎克的作品。
  aliases:
    - 维克多·雨果
  category: 文学常识
  explanation: 维克多·雨果是法国19世纪浪漫主义文学的代表作家，代表作有《巴黎圣母院》《悲惨世界》等。
  misconceptions:
    - 把雨果当成英国作家，代表作写成《双城记》。
    - 将《悲惨世界》记为巴尔扎克的作品。
    - 认为《巴黎圣母院》是莫泊桑写的。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:雾凇
  type: Concept
  subject: 语文
  title: 雾凇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'凇'写成'淞'或'松'，误以为雾凇与水或松树有关。
    - 能指出并纠正这一错误：将'凇'误读为'zhōng'或'cōng'，因与'淞'、'松'字形相近而读错。
  aliases: []
  category: 自然现象
  explanation: 天气寒冷时，雾冻结在树木的枝叶上形成的白色松散冰晶。
  misconceptions:
    - 把'凇'写成'淞'或'松'，误以为雾凇与水或松树有关。
    - 将'凇'误读为'zhōng'或'cōng'，因与'淞'、'松'字形相近而读错。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:露从今夜白
  type: Concept
  subject: 语文
  title: 露从今夜白
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为'露从今夜白'中的'白'指天色发白，实际指白露节气。
    - 能指出并纠正这一错误：将'露'理解为动词'显露'，把句子错解为'露水从今夜开始显现'。
  aliases: []
  category: 诗句理解
  explanation: 恰逢白露时节。
  misconceptions:
    - 误以为'露从今夜白'中的'白'指天色发白，实际指白露节气。
    - 将'露'理解为动词'显露'，把句子错解为'露水从今夜开始显现'。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:静态描写和动态描写
  type: Concept
  subject: 语文
  title: 静态描写和动态描写
  conceptType: 概念型
  aliases:
    - 动静结合
  category: 方法
  explanation: 静态描写写景物安静时的样子，动态描写写景物的活动变化，两者恰当结合能呈现景物独特的魅力，如荷兰牧场的悠闲与宁静。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C7/sections/S2.md
- id: concept:语文:非物质文化遗产
  type: Concept
  subject: 语文
  title: 非物质文化遗产
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非遗完全没有物质形式，如以为传统技艺中的工具不属于非遗。
    - 能指出并纠正这一错误：把建筑文物归入非遗，如称故宫为非物质文化遗产。
  aliases:
    - 无形文化遗产
  category: 文化概念
  explanation: 以非物质形态存在的传统文化表现形式，如口头传统、表演艺术、民俗活动等。
  misconceptions:
    - 认为非遗完全没有物质形式，如以为传统技艺中的工具不属于非遗。
    - 把建筑文物归入非遗，如称故宫为非物质文化遗产。
    - 认为非遗必须原样固守，如改动一项传统技艺就被视为破坏。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S7.md
- id: concept:语文:革命精神
  type: Concept
  subject: 语文
  title: 革命精神
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《红岩》的革命精神只概括为“不怕死”，忽略舍己为人、互相支持等内涵
    - 能指出并纠正这一错误：误将革命精神等同于爱国精神，没有结合小说中坚贞不屈的具体表现
  aliases: []
  category: 主题思想
  explanation: 《红岩》中贯串的革命精神，包括舍己为人、互相支持、坚贞不屈等高贵品质。
  misconceptions:
    - 把《红岩》的革命精神只概括为“不怕死”，忽略舍己为人、互相支持等内涵
    - 误将革命精神等同于爱国精神，没有结合小说中坚贞不屈的具体表现
    - 认为只有江姐才能体现革命精神，看不见许云峰等人物身上的品质
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C4/sections/S6.md
- id: concept:语文:鞠躬尽瘁，死而后已
  type: Concept
  subject: 语文
  title: 鞠躬尽瘁，死而后已
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把'瘁'误写为'粹'或'萃'。
    - 能指出并纠正这一错误：把'已'误写为'己'或'巳'，写成'死而后己'。
  aliases: []
  category: 成语
  explanation: 形容勤勤恳恳，竭尽心力，到死为止。文中用来概括邓稼先的一生。
  misconceptions:
    - 把'瘁'误写为'粹'或'萃'。
    - 把'已'误写为'己'或'巳'，写成'死而后己'。
    - 误解释为'鞠躬就尽瘁，死后才停止'，实际是'到死为止'。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:韩愈
  type: Concept
  subject: 语文
  title: 韩愈
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把韩愈当作宋代人，误与欧阳修同朝。
    - 能指出并纠正这一错误：把《马说》记成柳宗元作品，张冠李戴。
  aliases:
    - 韩昌黎
  category: 文学常识
  explanation: 唐代文学家，古文运动倡导者，唐宋八大家之一，本文《马说》为其《杂说》第四篇。
  misconceptions:
    - 把韩愈当作宋代人，误与欧阳修同朝。
    - 把《马说》记成柳宗元作品，张冠李戴。
    - 以为“古文”泛指所有文言文，不明指先秦西汉散体文。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S4.md
- id: concept:语文:音序查字法
  type: Concept
  subject: 语文
  title: 音序查字法
  conceptType: 程序型
  aliases:
    - 音序查字
  category: 方法
  explanation: 知道字的读音时，先找拼音的第一个大写字母，再找音节和页码，就能在字典里查到这个字。
  sourceRef: content/一年级/下册/语文/PEP-1-2-Chinese/chapters/C3/sections/S4.md
- id: concept:语文:顶天立地
  type: Concept
  subject: 语文
  title: 顶天立地
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘顶天立地’写成‘顶天立第’，‘地’误作‘第’。
    - 能指出并纠正这一错误：用‘顶天立地’形容小树苗，不符合‘形象高大、气概雄伟’的语境。
  aliases: []
  category: 成语
  explanation: 形容形象高大，气概雄伟豪迈。
  misconceptions:
    - 把‘顶天立地’写成‘顶天立第’，‘地’误作‘第’。
    - 用‘顶天立地’形容小树苗，不符合‘形象高大、气概雄伟’的语境。
    - 认为‘顶天立地’就是‘头顶天脚踩地’，忽略其比喻义。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:顺庆
  type: Concept
  subject: 语文
  title: 顺庆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“顺庆”写成“顺亲”或“顺床”，忽视它是地名，不是词语。
    - 能指出并纠正这一错误：认为顺庆是今天的重庆市，实际是四川南充，因“庆”字联想到“重庆”。
  aliases: []
  category: 词语
  explanation: 指清顺庆府，治所在今四川南充。
  misconceptions:
    - 把“顺庆”写成“顺亲”或“顺床”，忽视它是地名，不是词语。
    - 认为顺庆是今天的重庆市，实际是四川南充，因“庆”字联想到“重庆”。
    - 将“顺庆府”误作“顺天府”（今北京），两词读音相近，位置不同。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:顿号的用法
  type: Concept
  subject: 语文
  title: 顿号的用法
  conceptType: 概念型
  aliases: []
  category: 语法
  explanation: 句子中并列的词语之间要用顿号隔开，如“粮食、蔬菜、水果、肉类”，它表示并列词语之间短暂的停顿。
  sourceRef: content/五年级/上册/语文/PEP-5-1-Chinese/chapters/C8/sections/S5.md
- id: concept:语文:顿开茅塞
  type: Concept
  subject: 语文
  title: 顿开茅塞
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'茅塞'的'茅'误写成'矛'，错成'顿开矛塞'。
    - 能指出并纠正这一错误：误将'顿开茅塞'用于形容心情突然变好，实际指领悟道理。
  aliases: []
  category: 成语
  explanation: 比喻忽然开窍，领悟道理，茅塞被打开。
  misconceptions:
    - 将'茅塞'的'茅'误写成'矛'，错成'顿开矛塞'。
    - 误将'顿开茅塞'用于形容心情突然变好，实际指领悟道理。
    - 以为'茅塞顿开'是错误写法，不知两者意思相通。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C6/sections/S3.md
- id: concept:语文:预测
  type: Concept
  subject: 语文
  title: 预测
  conceptType: 程序型
  aliases:
    - 预测阅读
  category: 方法
  explanation: 读书时根据题目、插图和内容里的线索，猜一猜后面会发生什么，再对照原文看猜得对不对。
  sourceRef: content/三年级/上册/语文/PEP-3-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:领字
  type: Concept
  subject: 语文
  title: 领字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《沁园春·雪》中的‘望’当作谓语动词，不认为它是领字。
    - 能指出并纠正这一错误：将‘惜’字后面的‘秦皇汉武’整体误作领字。
  aliases: []
  category: 诗词知识
  explanation: 词中引领下文的一个字，如《沁园春·雪》中的“望”和“惜”。
  misconceptions:
    - 把《沁园春·雪》中的‘望’当作谓语动词，不认为它是领字。
    - 将‘惜’字后面的‘秦皇汉武’整体误作领字。
    - 混淆领字与修饰语，误把‘稍逊’的‘稍’当作领字。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:领起句
  type: Concept
  subject: 语文
  title: 领起句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：找领起句只看第一句，忽略后文内容，如《往事依依》首段是总起。
    - 能指出并纠正这一错误：把过渡句“不仅…而且…”误认为领起句，没看清引出下文的作用。
  aliases:
    - 总起句
  category: 阅读方法
  explanation: 在文章中起统领或引出下文作用的句子，常用于把握文章结构和内容。
  misconceptions:
    - 找领起句只看第一句，忽略后文内容，如《往事依依》首段是总起。
    - 把过渡句“不仅…而且…”误认为领起句，没看清引出下文的作用。
    - 认为领起句一定是完整句子，有时却说成短语或标题，判断错误。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:题破山寺后禅院
  type: Concept
  subject: 语文
  title: 题破山寺后禅院
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'曲径通幽处'误写为'屈径通幽处'，混淆同音形近字'曲'与'屈'
    - 能指出并纠正这一错误：误以为'破山寺'是破败的寺庙，实际是寺名，与寺庙破败与否无关
  aliases: []
  category: 古诗
  explanation: 唐代常建所作五言律诗，描绘清晨游破山寺的所见所感，表现禅院的幽静和诗人的淡泊情怀。
  misconceptions:
    - 将'曲径通幽处'误写为'屈径通幽处'，混淆同音形近字'曲'与'屈'
    - 误以为'破山寺'是破败的寺庙，实际是寺名，与寺庙破败与否无关
    - 把作者常建误记为盛唐诗人王维，导致作者作品对应错误
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:颜真卿的楷书
  type: Concept
  subject: 语文
  title: 颜真卿的楷书
  conceptType: 概念型
  aliases:
    - 颜体
  category: 文化常识
  explanation: 颜真卿是唐代著名书法家、楷书四大家之一，他的楷书恢宏雄壮、大气磅礴，“颜筋柳骨”中的“颜筋”说的就是它，代表作有《颜勤礼碑》。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C8/sections/S6.md
- id: concept:语文:颜筋柳骨
  type: Concept
  subject: 语文
  title: 颜筋柳骨
  conceptType: 概念型
  aliases:
    - 柳公权楷书
  category: 文化常识
  explanation: 颜筋柳骨指颜真卿和柳公权的楷书风格：颜体笔画丰满有筋力，柳体瘦硬挺拔、骨力遒劲。柳公权的代表作有《玄秘塔碑》。
  sourceRef: content/六年级/上册/语文/PEP-6-1-Chinese/chapters/C8/sections/S6.md
- id: concept:语文:风烛残年
  type: Concept
  subject: 语文
  title: 风烛残年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误用于中年人，如“他三十岁就风烛残年”，应为晚年或临近死亡。
    - 能指出并纠正这一错误：将“风烛残年”写作“风浊残年”，形近字混淆。
  aliases: []
  category: 成语
  explanation: 比喻临近死亡的晚年，也指事物即将消亡。
  misconceptions:
    - 误用于中年人，如“他三十岁就风烛残年”，应为晚年或临近死亡。
    - 将“风烛残年”写作“风浊残年”，形近字混淆。
    - 忽略其比喻义，只按字面理解为风中蜡烛，不知比喻老人或事物将亡。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:风趣的语言
  type: Concept
  subject: 语文
  title: 风趣的语言
  conceptType: 概念型
  aliases:
    - 幽默的语言
  category: 方法
  explanation: 课文用风趣幽默的语言把五根手指写得像人一样各有姿态和性格，读来有趣，又能让人想到生活中类似的人。
  sourceRef: content/五年级/下册/语文/PEP-5-2-Chinese/chapters/C8/sections/S2.md
- id: concept:语文:风雅颂
  type: Concept
  subject: 语文
  title: 风雅颂
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为‘风’是宫廷乐歌，实际风是各地民歌。
    - 能指出并纠正这一错误：把‘雅’当作祭祀乐歌，雅是宫廷乐歌，颂才是祭祀用。
  aliases: []
  category: 文学常识
  explanation: 《诗经》按乐曲分类：风是民歌，雅是宫廷乐歌，颂是祭祀乐歌。
  misconceptions:
    - 误以为‘风’是宫廷乐歌，实际风是各地民歌。
    - 把‘雅’当作祭祀乐歌，雅是宫廷乐歌，颂才是祭祀用。
    - 将‘风雅颂’与‘赋比兴’混淆，前者是《诗经》分类，后者是表现手法。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:风飘絮
  type: Concept
  subject: 语文
  title: 风飘絮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“风飘絮”理解为比喻诗人自身漂泊，实际指大宋朝廷覆灭。
    - 能指出并纠正这一错误：误将“风飘絮”与“雨打萍”都当作个人身世之喻，混淆对象。
  aliases: []
  category: 修辞手法
  explanation: 比喻大宋朝廷如风中柳絮，失去根基，即将覆灭。
  misconceptions:
    - 把“风飘絮”理解为比喻诗人自身漂泊，实际指大宋朝廷覆灭。
    - 误将“风飘絮”与“雨打萍”都当作个人身世之喻，混淆对象。
    - 认为“风飘絮”是借代而非比喻，修辞手法辨识错误。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:飞蛾扑火
  type: Concept
  subject: 语文
  title: 飞蛾扑火
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为“飞蛾扑火”永远是贬义（自取灭亡），忽略本文中借以赞美追求光和热。
    - 能指出并纠正这一错误：把飞蛾扑火与“自焚”混同，看不到其象征的献身和追求精神。
  aliases: []
  category: 文学意象
  explanation: 飞蛾扑火在文中象征为追求光和热而牺牲生命的献身精神。
  misconceptions:
    - 认为“飞蛾扑火”永远是贬义（自取灭亡），忽略本文中借以赞美追求光和热。
    - 把飞蛾扑火与“自焚”混同，看不到其象征的献身和追求精神。
    - 误以为文中飞蛾扑火只是描写飞蛾的习性，没有象征意义。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:首尾呼应
  type: Concept
  subject: 语文
  title: 首尾呼应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把首尾呼应等同于开头结尾词句完全相同，如“我爱我家”头尾重复，却没有内容或情感上的深化
    - 能指出并纠正这一错误：将“倒叙”结构误认为首尾呼应，如开头写结局、结尾倒回起因，这是叙事顺序，不是照应
  aliases: []
  category: 写作手法
  explanation: 文章开头和结尾在内容或情感上相互照应，使结构完整，如《紫藤萝瀑布》开头“停住脚步”与结尾“加快脚步”。
  misconceptions:
    - 把首尾呼应等同于开头结尾词句完全相同，如“我爱我家”头尾重复，却没有内容或情感上的深化
    - 将“倒叙”结构误认为首尾呼应，如开头写结局、结尾倒回起因，这是叙事顺序，不是照应
    - 误以为只要开头或结尾提到同一物就算呼应，如开头写“白杨”，结尾又写“白杨”，但无内在关联，不能算首尾呼应
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:马克·吐温
  type: Concept
  subject: 语文
  title: 马克·吐温
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误称马克·吐温为英国作家，他是美国作家。
    - 能指出并纠正这一错误：将马克·吐温代表作记为《麦琪的礼物》，实际是欧·亨利的。
  aliases: []
  category: 文学常识
  explanation: 美国作家，代表作有《汤姆·索亚历险记》《哈克贝利·费恩历险记》等，本文作者。
  misconceptions:
    - 误称马克·吐温为英国作家，他是美国作家。
    - 将马克·吐温代表作记为《麦琪的礼物》，实际是欧·亨利的。
    - 把《登勃朗峰》作者说成别的作家，张冠李戴。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S2.md
- id: concept:语文:马太效应
  type: Concept
  subject: 语文
  title: 马太效应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将马太效应简单理解为“富人更富，穷人更穷”的贫富分化，忽略其反映社会对权威的过度重视。
    - 能指出并纠正这一错误：把马太效应等同于二八定律，误以为两者都指少数人占有多数资源，实则前者强调优势积累。
  aliases: []
  category: 概念
  explanation: 已经得到的会得到更多，不能得到的永远得不到，反映社会对权威的过度重视。
  misconceptions:
    - 将马太效应简单理解为“富人更富，穷人更穷”的贫富分化，忽略其反映社会对权威的过度重视。
    - 把马太效应等同于二八定律，误以为两者都指少数人占有多数资源，实则前者强调优势积累。
    - 错误认为马太效应中“不能得到的永远得不到”是宿命论，忽视努力和外界干预可改变结果。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:马帮
  type: Concept
  subject: 语文
  title: 马帮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为马帮只是放牧的马群，不承担驮运货物功能。
    - 能指出并纠正这一错误：把“马帮”写成“马邦”，同音字混淆。
  aliases: []
  category: 词汇
  explanation: 驮运货物的马队。
  misconceptions:
    - 认为马帮只是放牧的马群，不承担驮运货物功能。
    - 把“马帮”写成“马邦”，同音字混淆。
    - 误认为马帮是古代骑兵部队，混淆运输与作战。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S3.md
- id: concept:语文:马致远
  type: Concept
  subject: 语文
  title: 马致远
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把马致远当成宋代或明代人，实际是元代。
    - 能指出并纠正这一错误：认为《天净沙·秋思》是词牌名，实际“天净沙”是曲牌名。
  aliases:
    - 马东篱
  category: 文学常识
  explanation: 马致远（约1251—1321以后），号东篱，元代戏曲作家、散曲家，《天净沙·秋思》为其散曲代表作。
  misconceptions:
    - 误把马致远当成宋代或明代人，实际是元代。
    - 认为《天净沙·秋思》是词牌名，实际“天净沙”是曲牌名。
    - 把“断肠人在天涯”中的“断肠”误解为肠子断了，实际形容悲伤至极。
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C1/sections/S4.md
- id: concept:语文:马里亚纳海沟
  type: Concept
  subject: 语文
  title: 马里亚纳海沟
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写最深处为11034米，但记成11000米或12000米。
    - 能指出并纠正这一错误：误以为马里亚纳海沟位于大西洋，实际在太平洋。
  aliases: []
  category: 地理知识
  explanation: 世界上最深的海沟，最深处达11034米。
  misconceptions:
    - 误写最深处为11034米，但记成11000米或12000米。
    - 误以为马里亚纳海沟位于大西洋，实际在太平洋。
    - 把马里亚纳海沟名称中的“马里亚纳”写成“马里亚那”或“马里亚那海沟”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:驱遣想象
  type: Concept
  subject: 语文
  title: 驱遣想象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为驱遣想象就是随意联想，可以脱离文本天马行空。
    - 能指出并纠正这一错误：想象时只重现画面，不体会作者情感，无法与作者会面。
  aliases: []
  category: 阅读方法
  explanation: 读者在阅读文艺作品时，需要借助想象来理解作者的思想感情，与作者会面。
  misconceptions:
    - 认为驱遣想象就是随意联想，可以脱离文本天马行空。
    - 想象时只重现画面，不体会作者情感，无法与作者会面。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:驳论
  type: Concept
  subject: 语文
  title: 驳论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：驳论时只针对对方论据，不指出论点根本错误
    - 能指出并纠正这一错误：认为提出相反观点就是驳论，没有具体论证
  aliases: []
  category: 写作方法
  explanation: 论证对方论点不正确的一种论证方式。
  misconceptions:
    - 驳论时只针对对方论据，不指出论点根本错误
    - 认为提出相反观点就是驳论，没有具体论证
    - 断章取义，歪曲对方的话再批驳，失去说服力
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:驳论文
  type: Concept
  subject: 语文
  title: 驳论文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写驳论文时全篇立论，没有明确批驳的错误观点
    - 能指出并纠正这一错误：认为驳论文只能反驳，不能有自己的正面观点
  aliases:
    - 驳论
  category: 文体知识
  explanation: 驳论文是以反驳错误观点为主，通过批驳对方的论点、论据或论证来树立自己观点的议论文。
  misconceptions:
    - 写驳论文时全篇立论，没有明确批驳的错误观点
    - 认为驳论文只能反驳，不能有自己的正面观点
    - 将驳论文写成科普文，没有树立驳论靶子
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:驿路梨花
  type: Concept
  subject: 语文
  title: 驿路梨花
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《驿路梨花》是一篇抒情散文，实际是短篇小说
    - 能指出并纠正这一错误：把文章主旨概括为‘赞美梨花的洁白’，偏离了赞颂雷锋精神
  aliases: []
  category: 文学常识
  explanation: 《驿路梨花》是彭荆风创作的短篇小说，通过小茅屋的故事赞颂雷锋精神。
  misconceptions:
    - 误认为《驿路梨花》是一篇抒情散文，实际是短篇小说
    - 把文章主旨概括为‘赞美梨花的洁白’，偏离了赞颂雷锋精神
    - 以为‘梨花’专指哈尼小姑娘，忘了既指梨花也象征雷锋精神
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S1.md
- id: concept:语文:骈散结合
  type: Concept
  subject: 语文
  title: 骈散结合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“高峰入云，清流见底”判为散句，实际是骈句对偶。
    - 能指出并纠正这一错误：认为骈散结合就是两种文体混合，实际是句式交错使用。
  aliases: []
  category: 语言风格
  explanation: 骈散结合指文章中骈句（对偶句）与散句交错使用，使语言既有整齐之美，又有流畅自然之感。
  misconceptions:
    - 把“高峰入云，清流见底”判为散句，实际是骈句对偶。
    - 认为骈散结合就是两种文体混合，实际是句式交错使用。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:骈文
  type: Concept
  subject: 语文
  title: 骈文
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为骈文不用对仗，或把散文的散句当成骈文特点。
    - 能指出并纠正这一错误：误以为骈文就是全文都是四字句，忽略四六句交错和声律要求。
  aliases:
    - 骈体文
  category: 文体知识
  explanation: 本文是骈体文，讲究对仗和声律，多用四六句，语言精炼。
  misconceptions:
    - 认为骈文不用对仗，或把散文的散句当成骈文特点。
    - 误以为骈文就是全文都是四字句，忽略四六句交错和声律要求。
  sourceRef: content/八年级/上册/语文/PEP-8-1-Chinese/chapters/C3/sections/S3.md
- id: concept:语文:高下差异
  type: Concept
  subject: 语文
  title: 高下差异
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将‘高下差异’理解为‘质量高低’，而非地势高低
    - 能指出并纠正这一错误：认为秋天落叶越往高处越迟，实际应越早，与春夏相反
  aliases:
    - 海拔差异
  category: 地理概念
  explanation: 影响物候现象的第三个因素，植物的抽青、开花在春夏两季越往高处越迟，秋天落叶越往高处越早。
  misconceptions:
    - 误将‘高下差异’理解为‘质量高低’，而非地势高低
    - 认为秋天落叶越往高处越迟，实际应越早，与春夏相反
    - 把‘高下差异’等同于‘纬度差异’，如说‘高山桃花比山脚开得早’
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:高下差异对物候的影响
  type: Concept
  subject: 语文
  title: 高下差异对物候的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：忽视逆温层，把‘越高越迟’当成绝对规律，无条件套用
    - 能指出并纠正这一错误：误将‘逆温层’写成‘逆温曾’或‘凝温层’，字形混淆
  aliases:
    - 海拔对物候的影响
  category: 科学原理
  explanation: 高下差异是影响物候的第三个因素，春夏两季越往高处物候现象越迟，秋天落叶越早，但需考虑逆温层等特殊情况。
  misconceptions:
    - 忽视逆温层，把‘越高越迟’当成绝对规律，无条件套用
    - 误将‘逆温层’写成‘逆温曾’或‘凝温层’，字形混淆
    - 认为高下差异只影响春夏，忽略秋季落叶也受其影响
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:高尔基
  type: Concept
  subject: 语文
  title: 高尔基
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把《童年》《在人间》《我的大学》的作者记成列夫·托尔斯泰。
    - 能指出并纠正这一错误：误认为高尔基是英国或法国作家，因其名字像西方人。
  aliases:
    - 阿列克塞·马克西莫维奇·彼什科夫
  category: 作家
  explanation: 高尔基（1868—1936），苏联作家，代表作有自传体小说《童年》《在人间》《我的大学》等。
  misconceptions:
    - 把《童年》《在人间》《我的大学》的作者记成列夫·托尔斯泰。
    - 误认为高尔基是英国或法国作家，因其名字像西方人。
    - 将高尔基的代表作《海燕》误归为普希金或契诃夫。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:魏碑
  type: Concept
  subject: 语文
  title: 魏碑
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘魏碑’的‘碑’写成‘牌’或‘啤’
    - 能指出并纠正这一错误：误以为魏碑是唐代楷书，忽略其北朝碑刻特征
  aliases: []
  category: 书法常识
  explanation: 北朝碑刻书法字体，老秀才擅长写魏碑。
  misconceptions:
    - 把‘魏碑’的‘碑’写成‘牌’或‘啤’
    - 误以为魏碑是唐代楷书，忽略其北朝碑刻特征
    - 将魏碑风格混同于颜真卿的颜体，看不出方峻雄健
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:鲁迅
  type: Concept
  subject: 语文
  title: 鲁迅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将鲁迅原名误写为“周作人”或“周建人”。
    - 能指出并纠正这一错误：误以为《阿长与〈山海经〉》选自《呐喊》，而非《朝花夕拾》。
  aliases:
    - 周树人
  category: 文学常识
  explanation: 中国现代文学家，原名周树人，本文作者，其作品多收录于《朝花夕拾》等。
  misconceptions:
    - 将鲁迅原名误写为“周作人”或“周建人”。
    - 误以为《阿长与〈山海经〉》选自《呐喊》，而非《朝花夕拾》。
    - 把“周树人”的“树”误写作“竖”或“数”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:鲁迅《中国小说史略》
  type: Concept
  subject: 语文
  title: 鲁迅《中国小说史略》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将此评语记为吴承恩在《西游记》中自评，实为鲁迅《中国小说史略》所写
    - 能指出并纠正这一错误：误认引自《呐喊》或《朝花夕拾》，张冠李戴到其他鲁迅作品
  aliases: []
  category: 文学评论
  explanation: 鲁迅在《中国小说史略》中评价《西游记》“使神魔皆有人情，精魅亦通世故”。
  misconceptions:
    - 将此评语记为吴承恩在《西游记》中自评，实为鲁迅《中国小说史略》所写
    - 误认引自《呐喊》或《朝花夕拾》，张冠李戴到其他鲁迅作品
    - 把“人情世故”窄化为男女情爱，误以为鲁迅说神魔都在谈情说爱
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:鲜为人知
  type: Concept
  subject: 语文
  title: 鲜为人知
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误读“鲜”为xiān，误认为与“新鲜”相关，如理解成“新鲜到无人知晓”。
    - 能指出并纠正这一错误：误将“鲜为人知”等同于“不为人知”，忽略“很少”与“完全没有”的区别，如说“这秘密鲜为人知”意指…
  aliases: []
  category: 成语
  explanation: 很少有人知道。
  misconceptions:
    - 误读“鲜”为xiān，误认为与“新鲜”相关，如理解成“新鲜到无人知晓”。
    - 误将“鲜为人知”等同于“不为人知”，忽略“很少”与“完全没有”的区别，如说“这秘密鲜为人知”意指无人知晓。
    - 因“鲜”读xiǎn与“显”同音，易误写成“显为人知”，如作文中写“他的功劳显为人知”。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C1/sections/S1.md
- id: concept:语文:鸠占鹊巢
  type: Concept
  subject: 语文
  title: 鸠占鹊巢
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“鸠占鹊巢”写成“鸠占雀巢”。
    - 能指出并纠正这一错误：把它与“鹬蚌相争”混淆，用来形容两败俱伤。
  aliases:
    - 鹊巢鸠占
  category: 成语
  explanation: 比喻强占他人的居所或位置。
  misconceptions:
    - 将“鸠占鹊巢”写成“鸠占雀巢”。
    - 把它与“鹬蚌相争”混淆，用来形容两败俱伤。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:鸡声茅店月，人迹板桥霜
  type: Concept
  subject: 语文
  title: 鸡声茅店月，人迹板桥霜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到'鸡声'、'茅店'、'月'等名词排列，误判为拟人或比喻，实际是列锦手法。
    - 能指出并纠正这一错误：把'人迹板桥霜'理解成'人走过后板桥上的霜'，误将'迹'当动词。
  aliases: []
  category: 诗句理解
  explanation: 用名词组合描绘早行景象，纯然写景而意味自在其中。
  misconceptions:
    - 看到'鸡声'、'茅店'、'月'等名词排列，误判为拟人或比喻，实际是列锦手法。
    - 把'人迹板桥霜'理解成'人走过后板桥上的霜'，误将'迹'当动词。
    - 认为这两句是单纯写景的对仗，忽视了名词组合营造的意境。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S5.md
- id: concept:语文:鸭架桩
  type: Concept
  subject: 语文
  title: 鸭架桩
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“桩”写成“装”或“妆”，误以为指鸭架上的装饰。
    - 能指出并纠正这一错误：误以为鸭架桩是烤鸭时用的木桩，实际指片皮后的鸭骨架。
  aliases: []
  category: 文化常识
  explanation: 指片去皮肉后的烤鸭骨架。
  misconceptions:
    - 把“桩”写成“装”或“妆”，误以为指鸭架上的装饰。
    - 误以为鸭架桩是烤鸭时用的木桩，实际指片皮后的鸭骨架。
    - 把“鸭架桩”理解为一种腌制鸭子的调料，偏离原意。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C5/sections/S1.md
- id: concept:语文:鸳鸯
  type: Concept
  subject: 语文
  title: 鸳鸯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为鸳鸯是林黛玉贴身丫鬟，实际是贾母的丫鬟。
    - 能指出并纠正这一错误：将鸳鸯与袭人混为一谈，袭人是贾宝玉的丫鬟。
  aliases: []
  category: 人物
  explanation: 《红楼梦》中贾母的贴身丫鬟，聪明伶俐。
  misconceptions:
    - 误以为鸳鸯是林黛玉贴身丫鬟，实际是贾母的丫鬟。
    - 将鸳鸯与袭人混为一谈，袭人是贾宝玉的丫鬟。
    - 误以为鸳鸯是鸟名而非人物，在《红楼梦》中是贾母丫鬟。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:麈尾
  type: Concept
  subject: 语文
  title: 麈尾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将'麈尾'的'麈'误读为chén，与'尘'字混淆。
    - 能指出并纠正这一错误：误以为麈尾是马尾做的，实际用麋鹿尾毛制成。
  aliases: []
  category: 文化常识
  explanation: 古人闲谈时拿着驱虫、掸尘的用具，类似拂尘。
  misconceptions:
    - 将'麈尾'的'麈'误读为chén，与'尘'字混淆。
    - 误以为麈尾是马尾做的，实际用麋鹿尾毛制成。
    - 把麈尾当作普通拂尘工具，不知其在清谈中象征身份。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C3/sections/S2.md
- id: concept:语文:麾下
  type: Concept
  subject: 语文
  title: 麾下
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“麾”写作“挥”或“摩”，如误写“挥下”，未记住“麾”是古代指挥军队的旗子。
    - 能指出并纠正这一错误：把“麾下”读作“máo xià”，误认为与“毛”有关，正确音为“huī xià”。
  aliases: []
  category: 词语
  explanation: 将旗之下，这里指手下、手中。
  misconceptions:
    - 将“麾”写作“挥”或“摩”，如误写“挥下”，未记住“麾”是古代指挥军队的旗子。
    - 把“麾下”读作“máo xià”，误认为与“毛”有关，正确音为“huī xià”。
    - 误以为“麾下”仅指“旗帜下”的实物，忽略了“手下、手中”的引申义，导致翻译错误。
  sourceRef: content/九年级/上册/语文/PEP-9-1-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:黄文秀事迹
  type: Concept
  subject: 语文
  title: 黄文秀事迹
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将黄文秀的牺牲地写成云南或贵州，实际上她牺牲在广西百色百坭村。
    - 能指出并纠正这一错误：将《青春之光》的作者错记为他人，如答成‘魏巍’或‘李春雷’。
  aliases:
    - 黄文秀
  category: 文学常识
  explanation: 黄文秀是广西百色百坭村驻村第一书记，在脱贫攻坚中因公殉职，被授予“七一勋章”，是新时代青年楷模。
  misconceptions:
    - 误将黄文秀的牺牲地写成云南或贵州，实际上她牺牲在广西百色百坭村。
    - 将《青春之光》的作者错记为他人，如答成‘魏巍’或‘李春雷’。
    - 误说黄文秀逝世于2020年，实际是2019年6月17日。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C4/sections/S2.md
- id: concept:语文:黄梅戏
  type: Concept
  subject: 语文
  title: 黄梅戏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为黄梅戏只流行于安徽，忽略湖北等地，或说成“湖北黄梅戏”。
    - 能指出并纠正这一错误：把黄梅戏与越剧混淆，认为黄梅戏也是才子佳人柔美唱腔，实际曲调明快。
  aliases: []
  category: 戏曲剧种
  explanation: 流行于安徽、湖北等地的地方戏曲，曲调明快，富有生活气息。
  misconceptions:
    - 误以为黄梅戏只流行于安徽，忽略湖北等地，或说成“湖北黄梅戏”。
    - 把黄梅戏与越剧混淆，认为黄梅戏也是才子佳人柔美唱腔，实际曲调明快。
    - 错写“黄梅戏”为“黄莓戏”，因“梅”“莓”同音忽略字形。
  sourceRef: content/九年级/下册/语文/PEP-9-2-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:黄河大合唱
  type: Concept
  subject: 语文
  title: 黄河大合唱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误记《黄河大合唱》为光未然作曲、冼星海作词
    - 能指出并纠正这一错误：以为《黄河大合唱》只有一首歌，实为八个乐章的套曲
  aliases:
    - 黄河大合唱组诗
  category: 文学常识
  explanation: 光未然作词、冼星海谱曲的大型合唱声乐套曲，创作于1939年，由八个乐章组成，激发了中国军民的抗日热情。
  misconceptions:
    - 误记《黄河大合唱》为光未然作曲、冼星海作词
    - 以为《黄河大合唱》只有一首歌，实为八个乐章的套曲
    - 错记创作时间为1937年，应为1939年
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C2/sections/S1.md
- id: concept:语文:黑障区
  type: Concept
  subject: 语文
  title: 黑障区
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将“黑障区”写成“黑瘴区”，障、瘴混淆。
    - 能指出并纠正这一错误：误以为黑障区是航天员用黑布遮挡的区域。
  aliases: []
  category: 科学知识
  explanation: 飞船返回时距地面约80至40公里区域，与地面通信中断。
  misconceptions:
    - 将“黑障区”写成“黑瘴区”，障、瘴混淆。
    - 误以为黑障区是航天员用黑布遮挡的区域。
    - 认为黑障区只出现在发射上升段，实际是返回进入大气层时。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C6/sections/S1.md
- id: concept:语文:默读
  type: Concept
  subject: 语文
  title: 默读
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：默读时嘴唇不停动或发出小声，默读应完全不出声
    - 能指出并纠正这一错误：认为默读就是快速浏览，不注重理解，读后不知大意
  aliases: []
  category: 阅读方法
  explanation: 默读是一种不出声的阅读方式，可以提高阅读速度，有利于把握文章大意。默读时要集中注意力，不分心，不停顿，一口气读完全文。
  misconceptions:
    - 默读时嘴唇不停动或发出小声，默读应完全不出声
    - 认为默读就是快速浏览，不注重理解，读后不知大意
    - 默读时遇到不会的字就停下来查字典，违背不停顿要求
  sourceRef: content/七年级/上册/语文/PEP-7-1-Chinese/chapters/C3/sections/S1.md
- id: concept:语文:鼻韵母
  type: Concept
  subject: 语文
  title: 鼻韵母
  conceptType: 概念型
  aliases:
    - 前鼻韵母
    - 后鼻韵母
  category: 概念
  explanation: 由一个字母加鼻音尾巴 n 组成的韵母叫鼻韵母，比如 an、en、in、un、ün。读的时候最后鼻子要出气，像 an 就是先读 a 再把舌尖抵住上牙发 n。
  sourceRef: content/一年级/上册/语文/PEP-1-1-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:龚自珍
  type: Concept
  subject: 语文
  title: 龚自珍
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把《己亥杂诗》当作杜甫的作品，作者张冠李戴。
    - 能指出并纠正这一错误：将“己亥”误写为“乙亥”，干支纪年字形混淆。
  aliases:
    - 龚璱人
    - 定盦
  category: 作家作品
  explanation: 龚自珍（1792—1841），字璱人，号定盦，清代思想家、文学家，代表作《己亥杂诗》。
  misconceptions:
    - 误把《己亥杂诗》当作杜甫的作品，作者张冠李戴。
    - 将“己亥”误写为“乙亥”，干支纪年字形混淆。
    - 认为“龚自珍”是唐代文学家，忽略其清代身份。
  sourceRef: content/七年级/下册/语文/PEP-7-2-Chinese/chapters/C5/sections/S4.md
- id: concept:语文:游记写作
  type: Concept
  subject: 语文
  title: 游记写作
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为游记就是把行程按时间罗列一遍，忽略景物描写与情感表达。
    - 能指出并纠正这一错误：误认为游记必须面面俱到，忽略详略取舍。
  aliases:
    - 学写游记
  category: 写作方法
  explanation: 游记要写清游览过程，更要描写沿途景物并表达自己的感受；避免写成流水账，需围绕所见所感选材，做到线索清楚、详略得当。
  misconceptions:
    - 误认为游记就是把行程按时间罗列一遍，忽略景物描写与情感表达。
    - 误认为游记必须面面俱到，忽略详略取舍。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S5.md
- id: concept:语文:《昆虫记》
  type: Concept
  subject: 语文
  title: 《昆虫记》
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为《昆虫记》只是科普资料汇编，忽略其文学表达与观察精神。
  aliases:
    - 昆虫记
  category: 名著
  explanation: 《昆虫记》是法国昆虫学家法布尔的科学巨著，历时近三十年写成；作者以细致观察为基础，用文学笔法呈现昆虫世界，兼具科学性与文学性。
  misconceptions:
    - 误认为《昆虫记》只是科普资料汇编，忽略其文学表达与观察精神。
  sourceRef: content/八年级/下册/语文/PEP-8-2-Chinese/chapters/C5/sections/S6.md
