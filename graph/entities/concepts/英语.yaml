- id: concept:英语:can't表否定推测
  type: Concept
  subject: 英语
  title: can't表否定推测
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用mustn't表达‘一定不’，如‘He mustn't be in the room’。
    - 能指出并纠正这一错误：把can't理解为‘不能’，而非‘不可能’，如‘He can't be a teacher’。
  aliases:
    - 不可能
    - can't表推测
    - can't be
  category: 语法
  explanation: can't用于表示不可能，语气强烈，常用于否定推测。
  misconceptions:
    - 用mustn't表达‘一定不’，如‘He mustn't be in the room’。
    - 把can't理解为‘不能’，而非‘不可能’，如‘He can't be a teacher’。
    - 认为can't的语气弱于may not，实际can't更肯定。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C8/sections/S1.md
- id: concept:英语:care about
  type: Concept
  subject: 英语
  title: care about
