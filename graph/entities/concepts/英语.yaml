  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：连接主语时谓语用复数，如 "Not only he but also I are"，应就近用 a…
    - 能指出并纠正这一错误：not only 置于句首时忘记倒装，如 "Not only he came" 应为 "Not …
  aliases: []
  category: 语法
  explanation: 并列连词，表示“不但……而且……”，连接两个并列成分或分句，当连接分句时not only后可用倒装。
  misconceptions:
    - 连接主语时谓语用复数，如 "Not only he but also I are"，应就近用 am。
    - not only 置于句首时忘记倒装，如 "Not only he came" 应为 "Not only did he come"。
    - 连接成分不对称，如 "not only sings but also dancing"，前后形式应一致。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C19/sections/S1.md
- id: concept:英语:noun and verb conversion
  type: Concept
  subject: 英语
  title: noun and verb conversion
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将名词当动词，如把“书”当动词说“I will book a table”正确，但把“桌子”当…
    - 能指出并纠正这一错误：不知道“report”可作动词，写“give a report”时可改用“report”，但误说…
  aliases:
    - 词性转换
