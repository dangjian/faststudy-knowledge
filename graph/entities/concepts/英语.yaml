    - He made me to wait. 误加to，应wait
    - They made him working. 误用动名词，应work
    - She was made clean the room. 被动漏to，应为was made to clean
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C11/sections/S1.md
- id: concept:英语:make sure
  type: Concept
  subject: 英语
  title: make sure
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：后接宾语从句误用将来时：写 make sure you will lock the door，应…
    - 能指出并纠正这一错误：后接动名词错：写 make sure closing the door，应为 make sure…
  aliases:
    - 确保
  category: 短语
  explanation: To check or confirm that something is true or will happen.
  misconceptions:
    - 后接宾语从句误用将来时：写 make sure you will lock the door，应为 make sure you lock。
    - 后接动名词错：写 make sure closing the door，应为 make sure to close。
    - 漏掉动词：写 make sure the door，应为 make sure the door is locked。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C12/sections/S1.md
- id: concept:英语:make... feel at home
