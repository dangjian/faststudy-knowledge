  category: 功能句型
  explanation: 使用What kind of... do you like/enjoy? 询问喜好，用I like/enjoy... that...
    表达喜好，用I don't like... 表达厌恶。
  misconceptions:
    - 问句用How kind of...?，如How kind of music do you like?，应为What kind。
    - enjoy后接动词原形，如I enjoy watch movies，应为watching。
    - 回答时漏that，如I like music is loud，应为that is loud。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C9/sections/S1.md
- id: concept:英语:表达喜好和原因
