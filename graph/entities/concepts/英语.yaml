    - 能指出并纠正这一错误：用have a flu表示感冒，英语惯用have the flu
    - 能指出并纠正这一错误：用feel stomachache表达胃疼，feel后接形容词，应说have a stomach…
  aliases:
    - 表达疼痛
  category: 功能
  explanation: 用 have a + 疾病名词 或 feel + 形容词 表达身体不适，如 have a stomachache, have a toothache 等。
  misconceptions:
    - 用have a flu表示感冒，英语惯用have the flu
    - 用feel stomachache表达胃疼，feel后接形容词，应说have a stomachache
    - 说have headache漏掉不定冠词a，应是have a headache
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:身体部位与不适
