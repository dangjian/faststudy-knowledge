  misconceptions:
    - I am a stomachache. 把名词当形容词使用
    - I suffering from a sore throat. 缺少 am 和 from
    - I have sore throat. 漏掉冠词 a，sore throat 可数
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C2/sections/S1.md
- id: concept:英语:表达关爱的方式
