  sourceRef: content/三年级/下册/英语/PEP-3-2-English/chapters/C4/sections/S1.md
- id: concept:英语:表达爱好的常用句型
  type: Concept
  subject: 英语
  title: 表达爱好的常用句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把What do you do in your free time?误写成How do you …
    - 能指出并纠正这一错误：表达原因时误用for代替to，如I do it for relax，应写成I do it to …
  aliases:
    - talking about hobbies
  category: 功能句型
  explanation: 用于谈论空闲时间活动的句型，如：What do you do in your free time? I like to...
    以及表达原因的句型：I do it to...
  misconceptions:
    - 把What do you do in your free time?误写成How do you do in your free time?
    - 表达原因时误用for代替to，如I do it for relax，应写成I do it to relax
    - 回答爱好时直接用动词原形，如I like read books，漏掉to
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:表达穿着的句型
