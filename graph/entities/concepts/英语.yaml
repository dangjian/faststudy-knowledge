    - 问路时对陌生人不加礼貌用语，直接说“Where is the bank?”，显得生硬。
    - 在正式场合使用“Wanna”等口语缩写，不符合情境要求。
    - 忽视文化差异，初次见面就问“How much do you earn?”，造成失礼。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C3/sections/S1.md
