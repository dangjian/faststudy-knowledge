    - until-clauses
  category: Grammar
  explanation: Adverbial clauses of time often begin with 'until' and indicate the
    time up to which an action continues.
  misconceptions:
    - 写I will wait until he will come.，until从句用将来时
    - 把瞬间动词与until连用：I finished my homework until 8:00.，应改为didn't finish
    - 把until和unless混用：I will wait unless you come.，意思相反
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C3/sections/S1.md
- id: concept:英语:Alexander Graham Bell
