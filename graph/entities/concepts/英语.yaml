  category: 语法
  explanation: this/that 用于单数名词，these/those 用于复数名词；this/these 指近处，that/those 指远处。
  misconceptions:
    - 指着近处的书说 That is a book，远近不分
    - 用 this 指代复数名词，写 This are my books
    - 把远处的 those 说成 these，混淆指示代词
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C3/sections/S1.md
- id: concept:英语:指路用语
  type: Concept
  subject: 英语
