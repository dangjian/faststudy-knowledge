- id: concept:英语:描述人物外貌和性格
  type: Concept
  subject: 英语
  title: 描述人物外貌和性格
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：用“He has tall.”代替“He is tall.”，混淆have和be用于外貌描述。
    - 能指出并纠正这一错误：形容词顺序错误，如“a handsome tall man”应为“a tall handsome…
