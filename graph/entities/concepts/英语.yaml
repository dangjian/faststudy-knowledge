  misconceptions:
    - 误认为亚马逊雨林全部在巴西，实际覆盖多个国家。
    - 认为“地球之肺”意味着产生最多氧气，实际更多是吸收二氧化碳。
    - 把亚马逊雨林和亚马逊河的长度混淆。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S2.md
- id: concept:英语:The Great Barrier Reef
