    - Adverbial clauses of result
  category: 语法
  explanation: 用so...that引导的从句，表示结果。
  misconceptions:
    - so...that与such...that混用，如He is so smart boy that...。
    - 在so...that从句中重复使用so，如He was so tired so he slept。
    - 把that当副词修饰动词，误写The wind blew so strong that...。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C5/sections/S1.md
- id: concept:英语:给出建议的句型
