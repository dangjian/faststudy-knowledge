    - 将Stonehenge拼成Stonehedge，中间漏掉字母n。
    - 认为巨石阵是罗马人建造的，实际是史前遗迹。
    - 以为其用途已确定，如‘天文观测’，实际仍是谜。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C8/sections/S1.md
- id: concept:英语:Storm chasing
