    - 能指出并纠正这一错误：与trip、travel混用，把人生阶段说成“trip of life”，忽略journey的延…
  aliases: []
  category: 修辞
  explanation: journey本义为“旅程”，此处引申为“人生的阶段或行程”，是隐喻用法。
