  masteryCriteria:
    - 能指出并纠正这一错误：误说 I care you，漏掉介词 about，应为 care about you。
    - 能指出并纠正这一错误：混淆 care about 与 care for，认为都表示“关心”，但 care for 还有…
  aliases: []
  category: 短语
  explanation: 关心，在意。
  misconceptions:
    - 误说 I care you，漏掉介词 about，应为 care about you。
    - 混淆 care about 与 care for，认为都表示“关心”，但 care for 还有“照顾”之意。
    - 误写 care about to help，about 后接名词/动名词，不能接不定式。
