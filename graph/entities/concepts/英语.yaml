    - 把luggage当可数名词，写出“two luggages”，应改为“two pieces of luggage”。
    - 误用“put the table”表示摆餐具，实际上应说“set the table”。
    - 将set的过去式写成setted，忘记set的过去式仍是set（三态同形）。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C2/sections/S2.md
- id: concept:英语:描述恶劣天气
