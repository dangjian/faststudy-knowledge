  category: 文化
  explanation: 不同国家在问候、用餐、送礼等方面存在文化差异，了解这些差异有助于有效沟通。
  misconceptions:
    - 误以为在西方国家送礼后一定要当面拆，但在日本、韩国等不当面拆。
    - 误以为在穆斯林国家可以送酒，实际这是禁忌。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C6/sections/S1.md
- id: concept:英语:文化差异与问候礼仪
