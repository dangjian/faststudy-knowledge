  misconceptions:
    - 误认为 sand sea 是真正的海洋，用 ocean 替代
    - 把 sand sea 写成 sea of sands，sands 不可数
    - 将 sand sea 的数量表达为 much sand sea，误用 much 修饰可数
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:School Subjects
