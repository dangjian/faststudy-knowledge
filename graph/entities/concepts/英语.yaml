  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：书写时混淆小写b和d，把b写成d
    - 能指出并纠正这一错误：背字母表时把U和V顺序颠倒，先背V再背U
  aliases:
    - 英文字母
  category: 语音知识
  explanation: 英语26个字母的读音和书写，包括元音字母和辅音字母。
  misconceptions:
    - 书写时混淆小写b和d，把b写成d
    - 背字母表时把U和V顺序颠倒，先背V再背U
    - 大小写配错，把小写l认作大写I，实际l对应L
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C1/sections/S1.md
- id: concept:英语:字母顺序
