    - 按英语拼写误写为"Old Lang Syne"，因发音相似，实际是苏格兰语。
    - 误以为它是圣诞歌曲，在圣诞节演唱，实际在跨年（新年）时演唱。
    - 误认为"Auld Lang Syne"意为"友谊地久天长"，实际直译是"逝去已久的日子"。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
