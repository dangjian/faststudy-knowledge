    - when 和 while 混用，误以为都可接短暂动作，如 While he arrived, I left 错，应为 When。
    - 时间状语从句用将来时，如 I will call you when I will arrive，应为 when I arrive。
    - before 和 after 混淆，如 He left after I came 但实际想说先离开，误用 after 表“在……之前”。
