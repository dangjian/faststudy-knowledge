  subject: 英语
  title: 询问过去经历的句型
  conceptType: 概念型
  aliases: []
  category: 句型
  explanation: 用 What did you do...? Where did you go...? 等问句询问别人过去做了什么、去了哪里，回答也要用过去式。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C1/sections/S1.md
- id: concept:英语:询问颜色的句型
  type: Concept
  subject: 英语
  title: 询问颜色的句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：问“它们是什么颜色？”写成“What colour is they?”，应为“What colo…
    - 能指出并纠正这一错误：回答“They are reds”误加复数s，应为“They are red”，颜色本身不可数。
  aliases:
    - What colour
  category: 句型
  explanation: 用 What colour is it/are they? 询问物品颜色，用 It's/They're + 颜色回答。
  misconceptions:
    - 问“它们是什么颜色？”写成“What colour is they?”，应为“What colour are they?”，be动词与they搭配。
    - 回答“They are reds”误加复数s，应为“They are red”，颜色本身不可数。
    - 误用“What colour it is?”作为问句，正确语序应为“What colour is it?”，疑问句需倒装。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C2/sections/S2.md
- id: concept:英语:询问食物产地
  type: Concept
  subject: 英语
  title: 询问食物产地
  conceptType: 概念型
  aliases: []
  category: 句型
