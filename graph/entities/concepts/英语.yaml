- id: concept:英语:Adjective Clauses
  type: Concept
  subject: 英语
  title: Adjective Clauses
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用which指人，如'the teacher which taught us'（应用who/th…
    - 能指出并纠正这一错误：关系词后误加代词，如'the book that I bought it'。
  aliases:
    - relative clauses
  category: Grammar
  explanation: Clauses that modify nouns, often introduced by relative pronouns
    like who, which, that.
  misconceptions:
    - 用which指人，如'the teacher which taught us'（应用who/that）。
    - 关系词后误加代词，如'the book that I bought it'。
    - 混淆who/whom，如'the boy who I helped'（应用whom）。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Adjective Suffixes -ful and -less
  type: Concept
  subject: 英语
  title: Adjective Suffixes -ful and -less
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把careful误写成carefull，多写一个l
    - 能指出并纠正这一错误：误认为-less表示“少的”，例如把hopeless当作“少希望的”
  aliases: []
  category: Grammar
  explanation: The suffix -ful means 'full of' (e.g., joyful, thankful), while
    -less means 'without' (e.g., careless, hopeless).
  misconceptions:
    - 把careful误写成carefull，多写一个l
    - 误认为-less表示“少的”，例如把hopeless当作“少希望的”
    - 混淆词义，将harmless当作“有害的”，实际是“无害的”
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C3/sections/S1.md
- id: concept:英语:Adjective and Noun Forms
  type: Concept
  subject: 英语
  title: Adjective and Noun Forms
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写I feel loneliness，误把名词当形容词，应说I feel lonely
    - 能指出并纠正这一错误：把shocked误当名词：The news was a shocked to me，应说shoc…
