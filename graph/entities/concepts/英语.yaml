  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误写 make my own decide，decision 是名词，decide 是动词。
    - 能指出并纠正这一错误：误用代词不一致，如 He should make my own decision，应根据主语用 …
  aliases:
    - 做自己的决定
  category: 短语
  explanation: 自己做决定。
  misconceptions:
    - 误写 make my own decide，decision 是名词，decide 是动词。
    - 误用代词不一致，如 He should make my own decision，应根据主语用 his。
    - 误写 make a own decision，own 前用 my/his 等物主代词，不能加 a。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C19/sections/S1.md
- id: concept:英语:make plans
