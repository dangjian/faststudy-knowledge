  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C5/sections/S2.md
- id: concept:英语:语言学习策略
  type: Concept
  subject: 英语
  title: 语言学习策略
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：认为合作学习就是抄别人的作业，自己不思考。
    - 能指出并纠正这一错误：制作单词卡只写意思不写用法和例句，导致不会使用。
  aliases: []
  category: 学习策略
  explanation: 通过合作学习、制作单词卡、听磁带、看英文电影等方式提高英语水平。
  misconceptions:
    - 认为合作学习就是抄别人的作业，自己不思考。
    - 制作单词卡只写意思不写用法和例句，导致不会使用。
    - 认为听磁带只泛听一遍就够了，不反复精听。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C1/sections/S1.md
- id: concept:英语:语音：-ed的发音规则
  type: Concept
  subject: 英语
  title: 语音：-ed的发音规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把visited的-ed读成/t/，应为/ɪd/
    - 能指出并纠正这一错误：把played的-ed读成/t/，应为/d/
  aliases:
    - -ed的发音
  category: 语音
  explanation: 规则动词过去式-ed的发音有三种：清辅音后读/t/，浊辅音和元音后读/d/，t/d后读/ɪd/。
  misconceptions:
    - 把visited的-ed读成/t/，应为/ɪd/
    - 把played的-ed读成/t/，应为/d/
    - 一律把规则动词过去式-ed读成/d/，忽视清辅音后读/t/
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C7/sections/S1.md
- id: concept:英语:语音：元音音素
  type: Concept
  subject: 英语
  title: 语音：元音音素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把长元音/iː/和短元音/ɪ/读混，如sheep读成ship
    - 能指出并纠正这一错误：前元音/e/和/æ/嘴型不分，如bad读成bed导致词义混淆
  aliases:
    - vowel sounds
  category: 语音
  explanation: 本课练习/iː/, /ɪ/, /i/, /e/, /æ/等元音音素的发音及单词归类。
  misconceptions:
    - 把长元音/iː/和短元音/ɪ/读混，如sheep读成ship
    - 前元音/e/和/æ/嘴型不分，如bad读成bed导致词义混淆
    - 把非重读的/i/读得过长过重，如happy末尾读成/iː/
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C1/sections/S1.md
- id: concept:英语:语音：句子节奏
  type: Concept
  subject: 英语
  title: 语音：句子节奏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：每个单词都重读，造成单词间节奏均匀，如“I CAN GO to SCHOOL”
    - 能指出并纠正这一错误：弱读功能词不弱化，如把can在句中读成/kæn/而不读/kən/
  aliases:
    - sentence rhythm
  category: 语音
  explanation: 英语句子中重读和弱读的节奏模式，使语言更自然流畅。
  misconceptions:
    - 每个单词都重读，造成单词间节奏均匀，如“I CAN GO to SCHOOL”
    - 弱读功能词不弱化，如把can在句中读成/kæn/而不读/kən/
    - 忽略连读，把“not at all”三个词完全断开读
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C1/sections/S1.md
- id: concept:英语:语音：句子重音和弱读
  type: Concept
  subject: 英语
  title: 语音：句子重音和弱读
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：口语中重读was，读成/wæz/，没有弱读为/wəz/
    - 能指出并纠正这一错误：每个词都重读，助动词did在句中不弱读
  aliases:
    - 弱读
  category: 语音
  explanation: 在口语中，助动词和be动词常弱读，如was, wasn't, did, didn't等。
  misconceptions:
    - 口语中重读was，读成/wæz/，没有弱读为/wəz/
    - 每个词都重读，助动词did在句中不弱读
    - 把didn't在句中读得又重又长，未弱读为/dɪdnt/
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C7/sections/S1.md
- id: concept:英语:语音：字母组合ck, c, g, x的发音
  type: Concept
  subject: 英语
  title: 语音：字母组合ck, c, g, x的发音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把cat中的c读成/s/，见c就读/s/
