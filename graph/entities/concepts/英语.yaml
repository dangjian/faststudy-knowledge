  subject: 英语
  title: 被动语态中使役动词的处理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：make 的被动后误接动词原形，如 They were made work all day
    - 能指出并纠正这一错误：have 的被动错误理解为 have been had，如 The car was had re…
  aliases: []
  category: 语法
  explanation: 使役动词如 make, have 等变为被动时，后接不定式。
  misconceptions:
    - make 的被动后误接动词原形，如 They were made work all day
    - have 的被动错误理解为 have been had，如 The car was had repaired
    - 把 have sth done 当被动语态，如 I have my hair cut 误认为被动句
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中动名词被动
  type: Concept
  subject: 英语
  title: 被动语态中动名词被动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：动名词被动写成 being + 原形，如 He likes being praise
    - 能指出并纠正这一错误：分不清 being done 与 having done 的用法，如 After having …
  aliases: []
  category: 语法
  explanation: 动名词的被动形式为 being + 过去分词。
  misconceptions:
    - 动名词被动写成 being + 原形，如 He likes being praise
    - 分不清 being done 与 having done 的用法，如 After having told, he left
    - 在介词后用动名词被动却漏 being，如 He is afraid of laughed at
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中动词过去分词
  type: Concept
  subject: 英语
  title: 被动语态中动词过去分词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉 be 动词直接用过去分词，如 The window broken last night
    - 能指出并纠正这一错误：被动句中的动词用原形或过去式，如 The book was write by him
  aliases:
    - 过去分词
  category: 语法
  explanation: 规则动词加 -ed，不规则动词需特殊记忆。
  misconceptions:
    - 漏掉 be 动词直接用过去分词，如 The window broken last night
    - 被动句中的动词用原形或过去式，如 The book was write by him
    - 规则动词过去分词写错，如 stoped 而不是 stopped（重读闭音节双写）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中双宾语的处理
  type: Concept
  subject: 英语
  title: 被动语态中双宾语的处理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：直接宾语作主语时漏掉 to，如 A book was given me by him（应为 to…
    - 能指出并纠正这一错误：双宾语动词变被动时用人称代词主格，如 The book was given I by him
  aliases: []
  category: 语法
  explanation: 双宾语动词变为被动时，可将间接宾语或直接宾语变为主语。
  misconceptions:
    - 直接宾语作主语时漏掉 to，如 A book was given me by him（应为 to me）
    - 双宾语动词变被动时用人称代词主格，如 The book was given I by him
    - 主动 give me a book 变被动时误写为 A book was given to I
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中将来时被动
  type: Concept
  subject: 英语
  title: 被动语态中将来时被动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将来时被动漏掉 be，如 The meeting will hold next week
    - 能指出并纠正这一错误：把 will be done 写成 will done 或 will be do，如 The w…
  aliases: []
  category: 语法
  explanation: 一般将来时被动为 will be + 过去分词。
  misconceptions:
    - 将来时被动漏掉 be，如 The meeting will hold next week
    - 把 will be done 写成 will done 或 will be do，如 The work will done
    - 与现在完成时被动混淆，如 The house will have built next year 误用
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中情态动词的被动否定
  type: Concept
  subject: 英语
  title: 被动语态中情态动词的被动否定
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把not放在be后，写成must be not done（正确为must not be done…
    - 能指出并纠正这一错误：漏掉be动词，写成must not done（应为must not be done）
  aliases: []
  category: 语法
  explanation: 情态动词被动否定为情态动词 + not + be + 过去分词。
  misconceptions:
    - 把not放在be后，写成must be not done（正确为must not be done）
    - 漏掉be动词，写成must not done（应为must not be done）
    - 用don't代替情态动词，如The work doesn't be done（应为mustn't be done）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中情态动词的被动疑问
  type: Concept
  subject: 英语
  title: 被动语态中情态动词的被动疑问
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：疑问句把be提到情态动词前，如Must be the work done?（应为Must the…
    - 能指出并纠正这一错误：用Do开头，如Does the work must be done?（应为Must the wo…
  aliases: []
  category: 语法
  explanation: 情态动词被动疑问句为情态动词 + 主语 + be + 过去分词。
  misconceptions:
    - 疑问句把be提到情态动词前，如Must be the work done?（应为Must the work be done?）
    - 用Do开头，如Does the work must be done?（应为Must the work be done?）
    - 漏掉be，如Must the work done?（应为Must the work be done?）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中感官动词的处理
  type: Concept
  subject: 英语
  title: 被动语态中感官动词的处理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：被动后接动词原形，如He was seen enter the room（应为to enter）
    - 能指出并纠正这一错误：误认为被动后只能接现在分词，否定不定式形式，如He was seen to leave被判错
  aliases: []
  category: 语法
  explanation: 感官动词如 see, hear 等变为被动时，后接不定式或分词。
  misconceptions:
    - 被动后接动词原形，如He was seen enter the room（应为to enter）
    - 误认为被动后只能接现在分词，否定不定式形式，如He was seen to leave被判错
    - 被动后接过去式，如He was seen entered the room（应为to enter）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中时态的被动
  type: Concept
  subject: 英语
  title: 被动语态中时态的被动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：现在时被动漏掉be，如The book is write（应为is written）
    - 能指出并纠正这一错误：过去时被动用过去式代替过去分词，如The window was broke（应为broken）
  aliases:
    - 被动语态中时态的保持
  category: 语法
  explanation: 不同时态的被动语态形式，如一般现在时 am/is/are + 过去分词。
  misconceptions:
    - 现在时被动漏掉be，如The book is write（应为is written）
    - 过去时被动用过去式代替过去分词，如The window was broke（应为broken）
    - 进行时被动写成主动形式，如The house is building（应为is being built）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中现在完成时被动
  type: Concept
  subject: 英语
  title: 被动语态中现在完成时被动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉been，写成has done（被动应为has been done）
    - 能指出并纠正这一错误：主语单复数误用，如The books has been sold（应为have been）
  aliases: []
  category: 语法
  explanation: 现在完成时被动为 have/has been + 过去分词。
  misconceptions:
    - 漏掉been，写成has done（被动应为has been done）
    - 主语单复数误用，如The books has been sold（应为have been）
    - 过去分词形式错误，如have been wrote（应为written）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中语态的辨析
  type: Concept
  subject: 英语
  title: 被动语态中语态的辨析
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不及物动词用被动，如The accident was happened（应为happened）
    - 能指出并纠正这一错误：系动词用被动，如The flowers are smelled sweet（应为smell）
  aliases: []
  category: 语法
  explanation: 根据主语与动词的关系判断主动或被动。
  misconceptions:
    - 不及物动词用被动，如The accident was happened（应为happened）
    - 系动词用被动，如The flowers are smelled sweet（应为smell）
    - 把sells well误认为被动，写成The book is sold well（应为sells well）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中过去完成时被动
  type: Concept
  subject: 英语
  title: 被动语态中过去完成时被动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误用have been替代had been，如The letter has been sent …
    - 能指出并纠正这一错误：漏掉been，如The problem had solved（应为had been solved…
  aliases: []
