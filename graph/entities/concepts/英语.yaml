  title: 表示顺序的副词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：first 和 at first 混用，如 at first wash the vegetabl…
    - 能指出并纠正这一错误：after that 与 then 重复使用，写成 after that then add su…
  aliases:
    - sequence adverbs
    - sequencing words
  category: 词汇
  explanation: 如first, next, then, after that, finally等，用于描述步骤或过程。
  misconceptions:
    - first 和 at first 混用，如 at first wash the vegetables 应为 first wash the
      vegetables
    - after that 与 then 重复使用，写成 after that then add sugar
    - 用 at last 代替 finally 描述步骤的最后一步，如 at last put it in the oven
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S3.md
- id: concept:英语:表语从句
  type: Concept
  subject: 英语
  title: 表语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：从句误用疑问语序，如My question is where is he，应为where he …
    - 能指出并纠正这一错误：用if引导表语从句，如The problem is if he can come应使用wheth…
  aliases:
    - Predicative Clause
  category: 语法
  explanation: 表语从句位于连系动词之后，用that、whether或特殊疑问词引导，使用陈述语序。
  misconceptions:
    - 从句误用疑问语序，如My question is where is he，应为where he is。
    - 用if引导表语从句，如The problem is if he can come应使用whether。
    - 用because引导表语从句，如The reason is because he is ill，应为that。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:表达个人反应
