    - 误用have been替代had been，如The letter has been sent before he came（应为had been
      sent）
    - 漏掉been，如The problem had solved（应为had been solved）
    - 过去分词写成过去式，如The work had been did（应为done）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态的否定形式
  type: Concept
  subject: 英语
  title: 被动语态的否定形式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用didn't代替wasn't，如The window didn't broken（应为wasn…
    - 能指出并纠正这一错误：把not放错位置，如The window was broken not（应为was not br…
  aliases: []
  category: 语法
  explanation: 在 was/were 后加 not 构成否定。
  misconceptions:
    - 用didn't代替wasn't，如The window didn't broken（应为wasn't broken）
    - 把not放错位置，如The window was broken not（应为was not broken）
    - 否定时be动词人称数错，如The children was not taken care of（应为were not）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态的特殊疑问句
  type: Concept
  subject: 英语
  title: 被动语态的特殊疑问句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：疑问词后接陈述语序，如Who the book was written by?（应为Who wa…
    - 能指出并纠正这一错误：疑问词作主语时仍用被动语序，如What was happened?（应为What happene…
  aliases: []
  category: 语法
  explanation: 用疑问词（如 when, who, what）引导，后接一般疑问句语序。
  misconceptions:
    - 疑问词后接陈述语序，如Who the book was written by?（应为Who was the book written by?）
    - 疑问词作主语时仍用被动语序，如What was happened?（应为What happened?）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态的用法
  type: Concept
  subject: 英语
  title: 被动语态的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不及物动词误用于被动，如Great changes have been taken place。
    - 能指出并纠正这一错误：被动语态漏掉be动词，如The book written by him应为was written…
  aliases:
    - 被动语态中被动语态的用法
  category: 语法
  explanation: 当不知道或没必要说明动作执行者，或强调动作承受者时使用被动语态，常用于陈述事实。
  misconceptions:
    - 不及物动词误用于被动，如Great changes have been taken place。
    - 被动语态漏掉be动词，如The book written by him应为was written。
    - 被动语态时态错误，如The window is broken yesterday应为was broken。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:被动语态的疑问形式
  type: Concept
  subject: 英语
  title: 被动语态的疑问形式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用Did提问，如Did the work was done?（应为Was the work do…
    - 能指出并纠正这一错误：只加问号不改语序，如The work was done?（应为Was the work done…
  aliases: []
  category: 语法
  explanation: 将 was/were 提到主语前构成一般疑问句。
  misconceptions:
    - 用Did提问，如Did the work was done?（应为Was the work done?）
    - 只加问号不改语序，如The work was done?（应为Was the work done?）
    - was/were与主语不一致，如Was the rooms cleaned?（应为Were the rooms cleaned?）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:规则动词过去式
  type: Concept
  subject: 英语
  title: 规则动词过去式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：I maked a model plane. 动词make的过去式误加-ed
    - 能指出并纠正这一错误：He stoped quickly. 末尾辅音未双写，应为stopped
  aliases:
    - 规则动词的过去式
  category: 语法
  explanation: 规则动词的过去式通常在词尾加-ed，其发音有/t/、/d/、/ɪd/三种。
  misconceptions:
    - I maked a model plane. 动词make的过去式误加-ed
    - He stoped quickly. 末尾辅音未双写，应为stopped
    - We studyed English. 忽略了y变i加ed，应为studied
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C7/sections/S1.md
- id: concept:英语:规则的重要性
  type: Concept
  subject: 英语
  title: 规则的重要性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为没有规则世界更美好，如主张 'No rules, no problem'，忽略规则保护安全与…
    - 能指出并纠正这一错误：以为规则只是限制自由，如说 'Rules are just chains'，未看到规则维护秩序的…
  aliases:
    - No rules, no order
  category: 主题
  explanation: 规则有助于使世界更美好，没有规则就没有秩序。
  misconceptions:
    - 认为没有规则世界更美好，如主张 'No rules, no problem'，忽略规则保护安全与公平。
    - 以为规则只是限制自由，如说 'Rules are just chains'，未看到规则维护秩序的作用。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C2/sections/S3.md
- id: concept:英语:规则表达句型
  type: Concept
  subject: 英语
  title: 规则表达句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：表达规则时用 You can't 表示“禁止”，忽略 can't 常表示“不能”而非“不许”。
    - 能指出并纠正这一错误：把 We have to 与 We must 完全等同，忽略 have to 侧重客观要求。
  aliases: []
  category: 句型
  explanation: 表达规则常用 We must/mustn't... We can/can't... We have to... Don't... 等句型。
  misconceptions:
    - 表达规则时用 You can't 表示“禁止”，忽略 can't 常表示“不能”而非“不许”。
    - 把 We have to 与 We must 完全等同，忽略 have to 侧重客观要求。
    - 用 We mustn't 表达“不必”，正确应是 We don't have to。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C2/sections/S2.md
- id: concept:英语:让步状语从句
  type: Concept
  subject: 英语
  title: 让步状语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：although与but连用，如 Although he is poor, but he is …
    - 能指出并纠正这一错误：把despite当连词接句子，如 Despite he is rich, he is not g…
  aliases: []
  category: 语法
  explanation: 表示让步的状语从句，常用although、even though等引导。
  misconceptions:
    - although与but连用，如 Although he is poor, but he is happy.
    - 把despite当连词接句子，如 Despite he is rich, he is not generous.
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:识别文本类型和目的
  type: Concept
  subject: 英语
  title: 识别文本类型和目的
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把演讲稿误判为故事，因都有人物和时间，忽视演讲的呼吁性语言。
    - 能指出并纠正这一错误：认为作者目的只有娱乐或告知，忽略劝说、说服等目的，如看环保文章认为只是告知。
  aliases:
    - identifying text type and purpose
  category: 阅读策略
  explanation: 快速浏览文本以判断其文体（如故事、演讲、通知）、作者和写作目的。
  misconceptions:
    - 把演讲稿误判为故事，因都有人物和时间，忽视演讲的呼吁性语言。
    - 认为作者目的只有娱乐或告知，忽略劝说、说服等目的，如看环保文章认为只是告知。
    - 只看标题判断文体，不浏览内容，如标题Notice就认为是通知，实际可能是日记标题。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:词汇学习
  type: Concept
  subject: 英语
  title: 词汇学习
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：拼写stomachache时漏掉字母h，写成stomacheac或stomache
    - 能指出并纠正这一错误：将health与healthy混用，说eat health food，应为healthy
  aliases: []
  category: 词汇
  explanation: 本单元包含大量与健康、急救、情绪等主题相关的词汇，需要掌握其拼写、发音和用法。
  misconceptions:
    - 拼写stomachache时漏掉字母h，写成stomacheac或stomache
    - 将health与healthy混用，说eat health food，应为healthy
