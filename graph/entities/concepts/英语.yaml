  type: Concept
  subject: 英语
  title: 介绍家庭成员
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：用“My family has four people.”代替更地道的“There are fo…
    - 能指出并纠正这一错误：表达家庭成员时漏用所有格，如说“I brother is tall.”应为“My brother…
