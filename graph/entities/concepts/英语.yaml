  masteryCriteria:
    - 能指出并纠正这一错误：用 but 连接句子时，误加 however 造成语义重复，如 "He was sick, bu…
    - 能指出并纠正这一错误：but 连接并列成分时词性不一致，如 "He is poor but happiness" 正确…
  aliases: []
  category: 语法
  explanation: 用于连接两个形成对比或转折的想法。
