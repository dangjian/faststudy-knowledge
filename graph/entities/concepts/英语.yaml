  conceptType: 概念型
  aliases:
    - 蔬菜类词汇
  category: 概念
  explanation: 常见蔬菜的英文名称：tomato（西红柿）、potato（土豆）、carrot（胡萝卜）、green
    bean（青刀豆）、cucumber（黄瓜）。注意 tomato 和 potato 的复数加 -es。
  sourceRef: content/四年级/下册/英语/PEP-4-2-English/chapters/C5/sections/S2.md
- id: concept:英语:虚拟语气
  type: Concept
  subject: 英语
  title: 虚拟语气
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：if从句中误用would，如If I would be you, I would go，应为If…
    - 能指出并纠正这一错误：与过去事实相反时，主句用would do而不是would have done，如If you h…
  aliases:
    - subjunctive mood
  category: 语法
  explanation: 表示与事实相反的假设或愿望，如 if 从句中用过去式，主句用 would/could + 动词原形。
  misconceptions:
    - if从句中误用would，如If I would be you, I would go，应为If I were you。
    - 与过去事实相反时，主句用would do而不是would have done，如If you had come, you would see him。
    - 省略if的倒装句中，把were/had提前时误加do，如Had I known写成Did I known。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:行动呼吁（call to action）
  type: Concept
  subject: 英语
  title: 行动呼吁（call to action）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为行动呼吁就是重复主题，如结尾再说'保护环境很重要'。
    - 能指出并纠正这一错误：把行动呼吁写得太空泛，只说 Let's save the earth，没有具体行动。
  aliases:
    - call to action
  category: 文体特征
  explanation: 演讲中鼓励听众采取某种行动的部分，通常出现在结尾。
  misconceptions:
    - 认为行动呼吁就是重复主题，如结尾再说'保护环境很重要'。
    - 把行动呼吁写得太空泛，只说 Let's save the earth，没有具体行动。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:表示顺序的副词
