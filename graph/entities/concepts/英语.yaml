  title: 表达个人反应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：宾语从句语序错误：如I wonder where is he? 应为where he is。
    - 能指出并纠正这一错误：否定转移不当：用中式表达I think it is not good，英语习惯说I don't …
  aliases:
    - Give a personal reaction
  category: 功能
  explanation: 使用I think, I believe, I wonder等表达个人观点、信念或疑问。
  misconceptions:
    - 宾语从句语序错误：如I wonder where is he? 应为where he is。
    - 否定转移不当：用中式表达I think it is not good，英语习惯说I don't think it is good。
    - 时态误用：I believe he will come. 误写成I believe he comes. 表示未来计划应用will come。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:表达偏好
