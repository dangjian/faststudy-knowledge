    - 把WildAid误当联合国机构，实际上它是非营利性民间组织。
    - 拼写时加空格或改字母，如写成“Wild Aid”或“WildlifeAid”。
    - 与WWF混淆，误以为WildAid就是世界自然基金会。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:You are what you eat
