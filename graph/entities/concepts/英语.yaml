    - plan ahead
  category: 短语
  explanation: 制定计划，提前安排。
  misconceptions:
    - 漏写复数，写成make plan，泛指计划时误用单数。
    - 介词用错，写成make plans of the trip，应为make plans for。
    - 混淆名词和动词，造出make a planning，误把planning当名词用。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C10/sections/S1.md
- id: concept:英语:make sb. + adj.
