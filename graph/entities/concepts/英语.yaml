  explanation: 本课提到的保护环境的行动，如关灯、自带购物袋、骑自行车等。
  misconceptions:
    - 把“随手关灯”说成close the light，正确是turn off the light。
    - 认为“多开窗通风”是环保措施，实际与环保无关，如open the window。
    - 把“自带购物袋”说成take a bag for shopping，漏掉your own。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:环保行动
