  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在like/enjoy后接动词原形，如I enjoy listen to music，应为lis…
    - 能指出并纠正这一错误：定语从句漏关系代词，如I like movies make me laugh，应为that ma…
