  explanation: 生物与环境相互作用形成的统一整体，包括生物部分和非生物部分。
  misconceptions:
    - 把ecosystem误当不可数名词，表达多个生态系统时用much ecosystem。
    - 混淆ecosystem与ecology，误说the ecosystem of a country的污染。
    - 拼写错误：把ecosystem写成econsystem。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C12/sections/S1.md
- id: concept:英语:生日庆祝活动
  type: Concept
  subject: 英语
  title: 生日庆祝活动
