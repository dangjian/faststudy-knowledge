  category: 句型
  explanation: 可以对家人说 Love you，也可以用 make a card、draw a picture、sing and dance 等行动表达对家人的爱。
  sourceRef: content/三年级/下册/英语/PEP-3-2-English/chapters/C2/sections/S2.md
- id: concept:英语:表达兴趣和爱好
