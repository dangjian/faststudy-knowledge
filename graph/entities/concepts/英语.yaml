  explanation: 本单元围绕环保主题，讨论节约资源、减少污染、回收利用等具体行动。
  misconceptions:
    - environment 前漏 the，如 protect environment（应加 the）。
    - 中式英语：遮 earth 写成 care the earth，应为 care for the earth。
    - 混淆 recycle 和 reuse，把回收纸张说成 reuse paper。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C13/sections/S1.md
- id: concept:英语:环境保护
  type: Concept
  subject: 英语
  title: 环境保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在 prevent 后乱加 from，如 prevent from pollution（应为 p…
    - 能指出并纠正这一错误：时态误用：表达'已经保护了环境'写成 We had protected，应改为 We have …
