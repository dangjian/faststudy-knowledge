    - 过去分词误用过去式：“I have went to school.”应为gone
    - 混淆ring的过去式和过去分词：“He rung the bell.”应为rang
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
