  subject: 英语
  title: Sham El-Nessim
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为它是宗教节日，忽视其古埃及世俗庆祝的起源
    - 能指出并纠正这一错误：把涂彩蛋习俗与复活节混淆，误认为Sham El-Nessim就是复活节
  aliases:
