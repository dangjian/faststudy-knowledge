  conceptType: 应用型
  aliases: []
  category: 句型
  explanation: 用 I often take a walk there. 来说说人们在社区里常做的活动，如 go shopping、see a doctor。
  sourceRef: content/四年级/上册/英语/PEP-4-1-English/chapters/C3/sections/S2.md
- id: concept:英语:描述自然景观
