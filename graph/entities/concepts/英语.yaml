  misconceptions:
    - 把 sneeze 误当名词，说 I have a sneeze 表达打喷嚏
    - 混淆 sneeze 与 sniffle，把流鼻涕说成 sneeze
    - 拼错 sneeze 的现在分词 sneezeing，应去掉 e 加 ing
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Sneezing as a protective reflex
  type: Concept
  subject: 英语
  title: Sneezing as a protective reflex
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 protective 写成 protect，漏掉形容词后缀 -ive
    - 能指出并纠正这一错误：说 sneezing is protective reflex 漏掉冠词 a，应为 a prot…
  aliases:
    - sneeze reflex
  category: Biology
  explanation: Sneezing is the body's way of getting rid of harmful things like
    germs, dust, and smoke.
  misconceptions:
    - 把 protective 写成 protect，漏掉形容词后缀 -ive
    - 说 sneezing is protective reflex 漏掉冠词 a，应为 a protective reflex
    - 混淆 reflex 与 reflect，将 reflex 当动词用
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Social aspect of laughter
  type: Concept
  subject: 英语
  title: Social aspect of laughter
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说 a laughter 错误，laughter 不可数，应说 laughter
    - 能指出并纠正这一错误：把 social aspect 写成 society aspect，误用名词作定语
  aliases:
    - social laughter
