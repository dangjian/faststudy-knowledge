- id: concept:英语:鲨鱼鳍
  type: Concept
  subject: 英语
  title: 鲨鱼鳍
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为鲨鱼鳍可以再生，捕杀割鳍对生态影响不大。
    - 能指出并纠正这一错误：把 fin 拼成 fan，写成 shark fan。
  aliases:
    - shark fin
  category: 话题
  explanation: 鲨鱼鳍是制作鱼翅汤的原料，捕杀鲨鱼割鳍对海洋生态造成严重危害。
  misconceptions:
    - 误认为鲨鱼鳍可以再生，捕杀割鳍对生态影响不大。
    - 把 fin 拼成 fan，写成 shark fan。
    - 所有格滥用：写成 shark's fin 指单个鲨鱼鳍，但语境是物种时用 shark fin 更常见。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
