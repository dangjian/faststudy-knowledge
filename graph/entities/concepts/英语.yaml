  subject: 英语
  title: 方位介词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：in front of 和 in the front of 可互换使用，忽略了范围内外区别
    - 能指出并纠正这一错误：between 和 among 都表示中间，随意替换，忽略了两者与三者区别
  aliases:
    - 介词表位置
  category: 语法
  explanation: 描述位置关系的介词，如 in front of, behind, next to, between, across from 等。
  misconceptions:
    - in front of 和 in the front of 可互换使用，忽略了范围内外区别
    - between 和 among 都表示中间，随意替换，忽略了两者与三者区别
    - 把 across from 理解为对面，实际常指马路或街道对面
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C6/sections/S1.md
- id: concept:英语:日常作息
  type: Concept
  subject: 英语
  title: 日常作息
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：按中文语序直译，把“我每天七点起床”说成“I every day at seven get up…
    - 能指出并纠正这一错误：一般现在时第三人称单数漏-s，把“He gets up at 6”写成“He get up at…
  aliases:
    - daily routine
    - workday routine
  category: 话题
  explanation: 描述一个人一天中固定时间进行的活动，如起床、吃饭、工作、睡觉等。
  misconceptions:
