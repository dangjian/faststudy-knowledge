  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：单独使用过去完成时，如I had finished my homework.，没有过去时间参照点…
    - 能指出并纠正这一错误：误用have/has代替had，如She have gone before I arrived.…
