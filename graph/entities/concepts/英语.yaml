  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S1.md
- id: concept:英语:祈使句 Keep your room tidy.
  type: Concept
  subject: 英语
  title: 祈使句 Keep your room tidy.
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把"Keep your room tidy."写成"To keep your room tidy…
    - 能指出并纠正这一错误：说"You keep your room tidy."，祈使句误加主语
  aliases: []
  category: 语法
  explanation: 用于提出要求或建议，以动词原形开头。
  misconceptions:
    - 把"Keep your room tidy."写成"To keep your room tidy."，多加了to
    - 说"You keep your room tidy."，祈使句误加主语
    - 否定形式误用"Not keep your room tidy."，应为Don't keep your room tidy.
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C2/sections/S1.md
- id: concept:英语:祈使句表示规则
  type: Concept
  subject: 英语
  title: 祈使句表示规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：否定祈使句用 No 开头，如 No run in the hallway。
    - 能指出并纠正这一错误：在动词原形前加 to，如 To be quiet in the library。
  aliases:
    - Don't
  category: 语法
  explanation: 用动词原形开头的祈使句表示命令或建议，否定形式用 Don't。
  misconceptions:
    - 否定祈使句用 No 开头，如 No run in the hallway。
    - 在动词原形前加 to，如 To be quiet in the library。
    - 使用第三人称单数形式，如 He goes now 当作祈使句。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C2/sections/S2.md
- id: concept:英语:第一人称改写
  type: Concept
  subject: 英语
  title: 第一人称改写
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：改写时忘记去掉动词第三人称-s，如'I goes to school'。
    - 能指出并纠正这一错误：be动词变化错误，把He is改写成I is。
  aliases:
    - first person narrative
  category: 写作技巧
  explanation: 用第一人称（I/we）叙述，使内容更生动、有代入感。
  misconceptions:
    - 改写时忘记去掉动词第三人称-s，如'I goes to school'。
    - be动词变化错误，把He is改写成I is。
    - 只改主语没改所有格，如His book改成My book但后文还出现he。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C4/sections/S3.md
- id: concept:英语:简单将来时
  type: Concept
  subject: 英语
  title: 简单将来时
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用will表示已安排好的将来，如I will have a meeting tomorrow
    - 能指出并纠正这一错误：将will用于表示客观事实，如The sun will rise in the east
  aliases:
    - 一般将来时
  category: 语法
  explanation: 表示将来发生的动作或状态，常用will或be going to结构。
  misconceptions:
    - 用will表示已安排好的将来，如I will have a meeting tomorrow
    - 将will用于表示客观事实，如The sun will rise in the east
    - 混淆will与shall用法，认为所有人称都用will
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C12/sections/S1.md
- id: concept:英语:简单现在时（be动词）
  type: Concept
  subject: 英语
  title: 简单现在时（be动词）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在实义动词前加 be：I am play basketball every day
    - 能指出并纠正这一错误：否定句用 don't 加 be：I don't be a student
  aliases:
    - 一般现在时be
    - be动词用法
  category: 语法
  explanation: 用于描述事实、状态或习惯性动作，be动词（am/is/are）根据主语变化。
  misconceptions:
    - 在实义动词前加 be：I am play basketball every day
    - 否定句用 don't 加 be：I don't be a student
    - be 动词和实义动词混用：She is like apples（应说 She likes apples）
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C4/sections/S1.md
- id: concept:英语:简单过去时
