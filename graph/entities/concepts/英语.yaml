    - 把中国梯架设年份记成1960年，实际是1975年。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:生态系统
  type: Concept
  subject: 英语
  title: 生态系统
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把ecosystem误当不可数名词，表达多个生态系统时用much ecosystem。
    - 能指出并纠正这一错误：混淆ecosystem与ecology，误说the ecosystem of a country…
