  subject: 英语
  title: 词汇表
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：查词时只看拼写和词性，忽视音标导致发音错误
    - 能指出并纠正这一错误：按字母序孤立背单词，不记搭配，如只记look不知look after
