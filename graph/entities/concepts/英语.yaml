  aliases: []
  category: 语法
  explanation: 表示三者或三者以上都不，谓语动词用单数或复数。
  misconceptions:
    - 认为 "none of" 后只能接复数名词，忽略可接不可数名词。
    - 写 "None of the students are..." 认为必错，实际单复数均可。
    - 把 "none of" 和 "no one" 混用，如 "No one of my friends"。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:not only...but also...
