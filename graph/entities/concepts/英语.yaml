    - 把“go along the street”误说成“go along street”，漏掉定冠词the。
    - 将“turn left”误说成“turn to left”，多加了介词to。
    - 把“turn left at the second crossing”说成“turn left in the second
      crossing”，介词错误。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C3/sections/S1.md
- id: concept:英语:探索太空的方式
