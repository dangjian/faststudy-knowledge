  misconceptions:
    - 感叹句漏冠词，如 What beautiful flower! 应为 What a beautiful flower!
    - How 后误接名词，如 How beautiful flower! 应为 How beautiful the flower is!。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S2.md
- id: concept:英语:感叹句（What/How）
  type: Concept
  subject: 英语
  title: 感叹句（What/How）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把What和How修饰对象搞反，如What beautiful the sky is
    - 能指出并纠正这一错误：感叹句主谓不倒装，写How beautiful is she! 需改How beautiful …
  aliases:
    - 感叹句
  category: 语法
  explanation: 用What或How引导的感叹句，表达强烈情感。What修饰名词，How修饰形容词或副词。
  misconceptions:
    - 把What和How修饰对象搞反，如What beautiful the sky is
    - 感叹句主谓不倒装，写How beautiful is she! 需改How beautiful she is!
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:感叹句（What引导）
  type: Concept
  subject: 英语
  title: 感叹句（What引导）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉冠词a/an，写What nice day it is! 需What a nice day
    - 能指出并纠正这一错误：主语谓语倒置，写What a clever boy is he! 应What a clever …
  aliases:
    - What感叹句
  category: 语法
  explanation: 由What引导的感叹句，强调名词，结构为What (+形容词) + 名词 + 主语 + 谓语！
  misconceptions:
    - 漏掉冠词a/an，写What nice day it is! 需What a nice day
    - 主语谓语倒置，写What a clever boy is he! 应What a clever boy he is!
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:感官动词
  type: Concept
  subject: 英语
  title: 感官动词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用副词修饰感官动词，如 The soup tastes deliciously，应改为 deli…
    - 能指出并纠正这一错误：混淆感官动词与行为动词，如 He looks at the blackboard careful…
  aliases:
    - sense verbs
  category: 语法
  explanation: 表示感觉的动词，如feel, look, sound等，后接形容词。
  misconceptions:
    - 用副词修饰感官动词，如 The soup tastes deliciously，应改为 delicious。
    - 混淆感官动词与行为动词，如 He looks at the blackboard careful，careful 错应作 carefully。
    - 误以为 feel 后只能接形容词，忽略 feel like doing，写出 I feel like to go。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:感官动词 + 宾语 + 不带 to 的不定式
  type: Concept
  subject: 英语
  title: 感官动词 + 宾语 + 不带 to 的不定式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在感官动词后误加to，如see him to run，应为see him run。
    - 能指出并纠正这一错误：混淆不带to不定式与现在分词，认为两者完全一样，忽略不定式表全过程，doing表进行。
  aliases:
    - 感官动词的复合宾语
  category: 语法
  explanation: 感官动词如 feel, see, hear, watch 等后接宾语和省略 to 的动词不定式作宾补。
  misconceptions:
    - 在感官动词后误加to，如see him to run，应为see him run。
    - 混淆不带to不定式与现在分词，认为两者完全一样，忽略不定式表全过程，doing表进行。
    - 误认为所有动词都可接宾语+不带to不定式，如want him go，应用want him to go。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:感官动词 + 宾语 + 宾语补足语
  type: Concept
  subject: 英语
  title: 感官动词 + 宾语 + 宾语补足语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把宾补的动词原形误加to，如hear her to sing，应省略to。
    - 能指出并纠正这一错误：混淆宾补形式，认为see后必须接doing，忽略see sb do表全过程。
  aliases:
    - 感官动词
  category: 语法
  explanation: 感官动词（如 see, hear, feel 等）后接宾语和宾语补足语，表示感知到某人/物做某事或处于某种状态。
  misconceptions:
    - 把宾补的动词原形误加to，如hear her to sing，应省略to。
    - 混淆宾补形式，认为see后必须接doing，忽略see sb do表全过程。
    - 用形容词作宾补时误用副词，如I felt the cloth softly，应为soft。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:感官动词 feel 的用法
  type: Concept
  subject: 英语
  title: 感官动词 feel 的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：feel后接宾语加不定式时误带to，如feel my heart to beat。
    - 能指出并纠正这一错误：认为feel him leave和feel him leaving完全一样，忽略前者指离开整个动…
  aliases:
    - feel + 宾语 + 动词原形
  category: 语法
  explanation: 感官动词 feel 后接宾语和不带 to 的不定式作宾补，表示感觉到的动作。
  misconceptions:
    - feel后接宾语加不定式时误带to，如feel my heart to beat。
    - 认为feel him leave和feel him leaving完全一样，忽略前者指离开整个动作，后者指正在离开。
    - 把feel like doing和feel+宾语+do混淆，如feel like play误用，应为playing。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:感官动词后接不定式作宾补
  type: Concept
  subject: 英语
  title: 感官动词后接不定式作宾补
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：感官动词后加to，如“I saw him to run”而非see him run。
    - 能指出并纠正这一错误：误用ing形式表示全过程，如“I heard her sing”写成“I heard her s…
  aliases:
    - verbs of perception with bare infinitive
  category: 语法
  explanation: 感官动词（如see, watch, hear等）后接不定式作宾补时，不定式不带to。
  misconceptions:
    - 感官动词后加to，如“I saw him to run”而非see him run。
    - 误用ing形式表示全过程，如“I heard her sing”写成“I heard her singing”改变含义。
    - 被动语态中漏掉to，如“He was seen run”而非to run。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:成功学习者的四个习惯
  type: Concept
  subject: 英语
  title: 成功学习者的四个习惯
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：遗漏或混淆其中一个习惯，如把“提问”写成“回答问题”。
    - 能指出并纠正这一错误：认为四个习惯必须按固定顺序进行，不能同时存在。
  aliases:
    - four habits of successful learners
  category: 学习策略
  explanation: 包括培养兴趣、从错误中学习、发展学习技能和提问。
  misconceptions:
    - 遗漏或混淆其中一个习惯，如把“提问”写成“回答问题”。
    - 认为四个习惯必须按固定顺序进行，不能同时存在。
    - 认为只要拥有其中一个习惯就能成功，如只培养兴趣而不去实践。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C1/sections/S1.md
- id: concept:英语:户外安全建议
  type: Concept
  subject: 英语
  title: 户外安全建议
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 去爬山等户外活动前，要穿合适的鞋、带够水、查看天气预报，出发前还要告诉家人去向；遇到坏天气就不要出门。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C6/sections/S3.md
- id: concept:英语:扫读策略
  type: Concept
  subject: 英语
  title: 扫读策略
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：扫读时逐字阅读，导致速度慢找不到信息。
    - 能指出并纠正这一错误：只关注每个单词而非数字、地名等关键词，错过答案。
  aliases:
    - scanning
  category: 阅读策略
  explanation: 快速阅读以查找特定信息，如数字、年份、名称和地点。
  misconceptions:
    - 扫读时逐字阅读，导致速度慢找不到信息。
    - 只关注每个单词而非数字、地名等关键词，错过答案。
    - 把扫读和精读混淆，试图理解每句话而非查找特定信息。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:押韵词
  type: Concept
  subject: 英语
  title: 押韵词
  conceptType: 概念型
  aliases:
    - rhyming words
  category: 现象
  explanation: 押韵词是结尾读音相同的词，如 please、clean、green、sheep 都押 /iː/ 的韵。读诗歌时找出押韵词，能帮助我们把诗读得更好听。
  sourceRef: content/五年级/下册/英语/PEP-5-2-English/chapters/C4/sections/S2.md
- id: concept:英语:拼写姓名
  type: Concept
  subject: 英语
  title: 拼写姓名
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：用 How to spell your name? 问拼写，漏掉助动词 do，直接按中文语序硬译
    - 能指出并纠正这一错误：回答拼写时直接写出名字而不逐字母口述，误把拼写理解成写名字
  aliases:
    - 拼写名字
  category: 交际用语
  explanation: 询问或说明姓名拼写的方式，如 How do you spell your name? 和逐字母拼读。
  misconceptions:
    - 用 How to spell your name? 问拼写，漏掉助动词 do，直接按中文语序硬译
    - 回答拼写时直接写出名字而不逐字母口述，误把拼写理解成写名字
    - 拼读字母时混淆 G/J 或 V/W 的发音，如把 V 读成 wei
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C1/sections/S2.md
- id: concept:英语:指示代词 this/that 与 these/those
  type: Concept
  subject: 英语
