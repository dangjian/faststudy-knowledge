    - 把Whose写成Who's，混淆'谁的'和'谁是'，如Who's book is this?
    - 错误回答Whose bag is this? 用He is mine，应为It's mine或It's his。
    - 提问时语序颠倒，如Whose is this pen? 应为Whose pen is this?
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S2.md
- id: concept:英语:状语从句
