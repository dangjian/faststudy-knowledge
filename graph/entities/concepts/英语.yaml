  aliases: []
  category: 语音
  explanation: ck发/k/，c可发/s/或/k/，g可发/g/或/dʒ/，x发/ks/。
  misconceptions:
    - 把cat中的c读成/s/，见c就读/s/
    - 把game中的g读成/dʒ/，混淆g的两种发音
    - 把box中的x读成/gz/，不知道通常发/ks/
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C7/sections/S1.md
- id: concept:英语:语音：语调
