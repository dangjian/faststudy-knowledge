- id: concept:英语:词汇索引
  type: Concept
  subject: 英语
  title: 词汇索引
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：查词时忽略页码，直接翻到单词所在单元，浪费时间。
    - 能指出并纠正这一错误：认为词汇索引都按字母顺序排列，但教材按单元顺序，导致查不到。
  aliases:
    - Vocabulary Index
  category: 学习资源
  explanation: 本部分为教材词汇表，列出单词、音标、词性和页码，供学生查阅。
  misconceptions:
    - 查词时忽略页码，直接翻到单词所在单元，浪费时间。
    - 认为词汇索引都按字母顺序排列，但教材按单元顺序，导致查不到。
    - 只看单词不看音标，导致发音错误，如record重音不分。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:词汇表
