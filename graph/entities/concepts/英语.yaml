    - 拼错常见学科词，如把'geography'写成'geagraphy'或把'history'写成'histroy'。
    - 混淆'art'和'IT'，误把'美术'当作'信息技术'。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C7/sections/S1.md
- id: concept:英语:安慰他人的表达
