  subject: 英语
  title: 宾语从句（that引导）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在that从句中误用疑问语序，如I think that is he a student
    - 能指出并纠正这一错误：若that从句中再有if/whether，写成He asked that if I liked.…
  aliases:
    - that宾语从句
  category: 语法
  explanation: 由that引导的宾语从句，用于陈述事实或观点，that可省略。
  misconceptions:
    - 在that从句中误用疑问语序，如I think that is he a student
    - 若that从句中再有if/whether，写成He asked that if I liked..., 需去掉that
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:宾语从句（一般疑问句）
  type: Concept
  subject: 英语
  title: 宾语从句（一般疑问句）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：从句仍用疑问语序，如“I don't know if is she a teacher.”，正确…
    - 能指出并纠正这一错误：将whether与weather混淆拼写，如“I wonder weather he will …
  aliases:
    - if/whether引导的宾语从句
  category: 语法
  explanation: 由if/whether引导的宾语从句，表示“是否”，使用陈述语序。
  misconceptions:
    - 从句仍用疑问语序，如“I don't know if is she a teacher.”，正确为if she is a teacher。
    - 将whether与weather混淆拼写，如“I wonder weather he will come.”。
    - 在介词后误用if，如“I worry about if it will rain.”，介词后应用whether。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C3/sections/S1.md
- id: concept:英语:宾语从句（特殊疑问句）
  type: Concept
  subject: 英语
  title: 宾语从句（特殊疑问句）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：特殊疑问词引导的从句仍用疑问语序，如“Could you tell me where is th…
    - 能指出并纠正这一错误：主句过去时时，从句时态未同步，如“He asked me where was the stati…
  aliases:
    - 间接疑问句
  category: 语法
  explanation: 由特殊疑问词引导的宾语从句，使用陈述语序，如where the restrooms are。
  misconceptions:
    - 特殊疑问词引导的从句仍用疑问语序，如“Could you tell me where is the bank?”应为where the bank
      is。
    - 主句过去时时，从句时态未同步，如“He asked me where was the station.”应为where the station
      was。
    - 用that代替特殊疑问词，如“I don't know that he lives.”，而应用where he lives。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C3/sections/S1.md
- id: concept:英语:宾语从句（陈述句）
  type: Concept
  subject: 英语
  title: 宾语从句（陈述句）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：从句误用疑问语序，如“I think that is he a good student.”，正…
    - 能指出并纠正这一错误：误以为that必须省略，导致所有宾语从句都省略that，在书面语中失当。
  aliases:
    - that引导的宾语从句
  category: 语法
  explanation: 由that引导的宾语从句，that可省略，使用陈述语序。
  misconceptions:
    - 从句误用疑问语序，如“I think that is he a good student.”，正确为that he is。
    - 误以为that必须省略，导致所有宾语从句都省略that，在书面语中失当。
    - 将that与what混淆，如“I don't know that you said.”，应用what。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C3/sections/S1.md
- id: concept:英语:对话技巧
  type: Concept
  subject: 英语
  title: 对话技巧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：别人在倾诉时，急于插话分享自己的经历，不先听完对方。
    - 能指出并纠正这一错误：只顾聊自己感兴趣的话题，对对方的话题敷衍回应。
  aliases:
    - 沟通技巧
  category: 交际
  explanation: 包括倾听、选择合适话题、诚实真诚、注意肢体语言等，有助于进行更好的对话。
  misconceptions:
    - 别人在倾诉时，急于插话分享自己的经历，不先听完对方。
    - 只顾聊自己感兴趣的话题，对对方的话题敷衍回应。
    - 为了显得友好，明明不同意也说“你说得对”，不敢表达真实想法。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C8/sections/S2.md
- id: concept:英语:并列连词
