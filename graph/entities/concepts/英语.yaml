  explanation: be动词根据主语人称和数的变化，am用于第一人称单数，is用于第三人称单数，are用于复数或第二人称。
  misconceptions:
    - He are my friend. 主语he是第三人称单数，却用are。
    - My father are a teacher. 单数主语误用复数be动词。
    - There is two books on the desk. there be句型中忽略后面名词复数，应用are却用is。
