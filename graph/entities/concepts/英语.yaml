  explanation: 不同国家有不同的问候方式，如鞠躬、握手、亲吻脸颊等，体现了文化差异。
  misconceptions:
    - 误认为所有国家见面都握手，忽略日本人用鞠躬等差异。
    - 把亲吻脸颊当作全球通用问候，不知其在中东等地区不适用。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:新年庆祝活动
