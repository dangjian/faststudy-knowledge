  masteryCriteria:
    - 能指出并纠正这一错误：把adaptation误写成adaption，如'camel's adaption to des…
    - 能指出并纠正这一错误：误用adapt为名词，如'an adapt to environment'。
  aliases:
    - 适应
  category: 生物
  explanation: 生物为适应环境而发展出的特征或行为，如骆驼耐旱、耳廓狐大耳朵散热。
  misconceptions:
    - 把adaptation误写成adaption，如'camel's adaption to desert'。
    - 误用adapt为名词，如'an adapt to environment'。
