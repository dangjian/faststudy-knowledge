  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：主语是he/she/it时忘记给动词加s，如写He go to school，而正确应为He g…
    - 能指出并纠正这一错误：把一般现在时用于正在进行的动作，如He is watch TV now，误用时态
  aliases:
    - 一般现在时态
  category: 语法
  explanation: 用于描述习惯性动作、客观事实或普遍真理。主语为第三人称单数时，动词需加-s或-es。
  misconceptions:
    - 主语是he/she/it时忘记给动词加s，如写He go to school，而正确应为He goes
    - 把一般现在时用于正在进行的动作，如He is watch TV now，误用时态
    - 动词变第三人称单数时一律加s，忽略特殊变化，如write写成writes但teach应写成teaches
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C3/sections/S3.md
- id: concept:英语:一般现在时的被动语态
  type: Concept
  subject: 英语
  title: 一般现在时的被动语态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉be动词，如The book written by him.，应为is written。
    - 能指出并纠正这一错误：过去分词拼写错误，如The windows are breaked.，应为broken。
  aliases:
    - 被动语态（一般现在时）
  category: 语法
  explanation: 一般现在时的被动语态结构为am/is/are + 过去分词，表示经常性或习惯性的被动动作。
  misconceptions:
    - 漏掉be动词，如The book written by him.，应为is written。
    - 过去分词拼写错误，如The windows are breaked.，应为broken。
    - 与主动语态混淆，如The homework is does by me.，应为done。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C5/sections/S1.md
- id: concept:英语:一般现在时（be动词）
  type: Concept
  subject: 英语
  title: 一般现在时（be动词）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 be 动词随主语变化的规则搞混：I is a student，She are my frie…
    - 能指出并纠正这一错误：漏掉 be 动词：She a teacher，I 12 years old
  aliases:
    - simple present tense (be)
  category: 语法
  explanation: 用am/is/are表达身份、状态、来源等个人信息。
  misconceptions:
    - 把 be 动词随主语变化的规则搞混：I is a student，She are my friend
    - 漏掉 be 动词：She a teacher，I 12 years old
    - 用 do 替代 be 动词：Do you a student? 应说 Are you a student?
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C4/sections/S1.md
- id: concept:英语:一般现在时（do）
  type: Concept
  subject: 英语
  title: 一般现在时（do）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：主语是第三人称单数时，动词仍用原形，如写My mother go to work by bus。
    - 能指出并纠正这一错误：否定句用don't代替doesn't，且动词不还原，如Tom don't like apples…
  aliases:
    - simple present tense
  category: 语法
  explanation: 用于谈论习惯性动作或事实，主语为第三人称单数时动词加-s或-es。
  misconceptions:
    - 主语是第三人称单数时，动词仍用原形，如写My mother go to work by bus。
    - 否定句用don't代替doesn't，且动词不还原，如Tom don't like apples。
    - does开头的疑问句动词仍加s，如Does your father watches TV?
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S1.md
- id: concept:英语:一般疑问句
  type: Concept
  subject: 英语
  title: 一般疑问句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把助动词do和动词过去式同时用，如“Did you went?”应改为“Did you go?”
    - 能指出并纠正这一错误：用be动词替代助动词构成实义动词疑问句，如“Are you like apples?”应说“Do…
  aliases:
    - yes/no questions
  category: 语法
  explanation: 以助动词、be动词或情态动词开头，用yes/no回答的疑问句。
  misconceptions:
    - 把助动词do和动词过去式同时用，如“Did you went?”应改为“Did you go?”
    - 用be动词替代助动词构成实义动词疑问句，如“Are you like apples?”应说“Do you like apples?”
    - 回答一般疑问句时助动词用错，如“Does he like cats?”答“Yes, he do.”应为“Yes, he does.”
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C11/sections/S1.md
- id: concept:英语:一般疑问句Can you...?
  type: Concept
  subject: 英语
  title: 一般疑问句Can you...?
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：回答时直接说I can.，漏掉Yes开头，如问Can you swim? 答I can.
    - 能指出并纠正这一错误：把Can you...?当成一般现在时，回答用Yes, I do. 如Yes, I do.
  aliases:
    - Can you...?句型
    - 一般疑问句Can...?
    - Can引导的一般疑问句
  category: 语法
  explanation: 用Can you...?询问对方是否具备某种能力，肯定回答Yes, I can.，否定回答No, I can't.。
  misconceptions:
    - 回答时直接说I can.，漏掉Yes开头，如问Can you swim? 答I can.
    - 把Can you...?当成一般现在时，回答用Yes, I do. 如Yes, I do.
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C8/sections/S2.md
- id: concept:英语:一般疑问句及其回答
  type: Concept
  subject: 英语
  title: 一般疑问句及其回答
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：回答一般疑问句时直接用“Yes, I'm.”，应改为“Yes, I am.”。
    - 能指出并纠正这一错误：对“Is she your sister?”回答成“Yes, she's.”，应改为“Yes, …
  aliases:
    - yes/no questions
  category: 语法
  explanation: 用be动词开头的一般疑问句，回答用Yes/No，并注意简略形式。
  misconceptions:
    - 回答一般疑问句时直接用“Yes, I'm.”，应改为“Yes, I am.”。
    - 对“Is she your sister?”回答成“Yes, she's.”，应改为“Yes, she is.”。
    - 将“Are you a student?”误答为“Yes, I'm.”，忘记am不能缩写用于肯定回答结尾。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C4/sections/S2.md
- id: concept:英语:一般过去时
  type: Concept
  subject: 英语
  title: 一般过去时
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不规则动词过去式硬加-ed，如把go的过去式写成goed
    - 能指出并纠正这一错误：使用did后动词仍用过去式，如“Did they saw the movie?”应为“Did t…
  aliases:
    - simple past tense
  category: 语法
  explanation: 一般过去时用于描述过去发生的动作或状态，动词需用过去式。
  misconceptions:
    - 不规则动词过去式硬加-ed，如把go的过去式写成goed
    - 使用did后动词仍用过去式，如“Did they saw the movie?”应为“Did they see?”
    - was/were与主语搭配错误，如“I were happy”和“She were here”应为was
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C1/sections/S2.md
- id: concept:英语:一般过去时与过去进行时的区别
  type: Concept
  subject: 英语
  title: 一般过去时与过去进行时的区别
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：while后误用一般过去时：“While I did homework, he called m…
    - 能指出并纠正这一错误：when从句中两个动作都用过去进行：“I was walking when I was seei…
  aliases: []
  category: 语法
  explanation: 一般过去时表示过去发生的动作或状态，过去进行时表示过去正在进行的动作。
  misconceptions:
    - while后误用一般过去时：“While I did homework, he called me.”
    - when从句中两个动作都用过去进行：“I was walking when I was seeing an accident.”
    - 用一般过去时表示过去某刻正在进行：“At 8, I had breakfast.”应为“I was having breakfast.”
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:一般过去时的疑问句和否定句
  type: Concept
  subject: 英语
  title: 一般过去时的疑问句和否定句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：Did you went to school yesterday? 用了did还保留动词过去式
    - 能指出并纠正这一错误：你昨天去公园了吗？写成 You went to the park yesterday? 缺少助动…
  aliases:
    - 过去时的疑问句
    - 过去时的否定句
  category: 语法
  explanation: 一般过去时的疑问句和否定句需借助助动词did，后接动词原形。
  misconceptions:
    - Did you went to school yesterday? 用了did还保留动词过去式
    - 你昨天去公园了吗？写成 You went to the park yesterday? 缺少助动词did
    - She didn't came back. 否定句中误用动词过去式came
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C7/sections/S1.md
- id: concept:英语:一般过去时的被动语态
  type: Concept
  subject: 英语
  title: 一般过去时的被动语态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用was/were时与主语数不一致，如They was invited.，应为were。
    - 能指出并纠正这一错误：用动词过去式代替过去分词，如The window was broke.，应为broken。
  aliases:
    - 被动语态（一般过去时）
  category: 语法
  explanation: 一般过去时的被动语态结构为was/were + 过去分词，表示过去某个时间发生的被动动作。
  misconceptions:
    - 用was/were时与主语数不一致，如They was invited.，应为were。
    - 用动词过去式代替过去分词，如The window was broke.，应为broken。
    - 忘记使用被动结构，如The movie watched by us.，应为was watched。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C5/sections/S1.md
- id: concept:英语:三江源国家公园
  type: Concept
  subject: 英语
  title: 三江源国家公园
  conceptType: 概念型
  aliases: []
  category: 文化常识
  explanation: 三江源国家公园在青海省，是中国最大的国家公园。长江、黄河、澜沧江都从这里发源，这里被称为"中华水塔"。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C6/sections/S3.md
- id: concept:英语:不可数名词
  type: Concept
  subject: 英语
  title: 不可数名词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：给不可数名词加复数，如把两条建议写成two advices
    - 能指出并纠正这一错误：用a/an或数词直接修饰，如three waters、a bread
  aliases:
    - uncountable nouns
  category: 语法
  explanation: 不可数名词没有复数形式，不能用数词直接修饰，需用量词表示数量。
  misconceptions:
    - 给不可数名词加复数，如把两条建议写成two advices
    - 用a/an或数词直接修饰，如three waters、a bread
    - 误认为news、information是复数名词，说a news
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C4/sections/S2.md
- id: concept:英语:不定代词
  type: Concept
  subject: 英语
  title: 不定代词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不定代词作主语时谓语用复数，如“Everyone are here”应为“Everyone is…
    - 能指出并纠正这一错误：肯定句中误用anyone/anything表示“某人/某物”，如“Anyone is at th…
  aliases:
    - indefinite pronouns
  category: 语法
  explanation: 不定代词如someone, anyone, everyone, something, anything, everything,
    nothing, somewhere, anywhere等，用于指代不特定的人、事物或地点。
  misconceptions:
    - 不定代词作主语时谓语用复数，如“Everyone are here”应为“Everyone is here”
    - 肯定句中误用anyone/anything表示“某人/某物”，如“Anyone is at the door”应说“Someone”
    - 形容词修饰不定代词时放前面，如“nice something”应为“something nice”
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C12/sections/S1.md
- id: concept:英语:不定式作主语补足语
  type: Concept
  subject: 英语
  title: 不定式作主语补足语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏写形式主语it，写成“Is important to do”或“Is important th…
    - 能指出并纠正这一错误：把真正主语误当宾语，觉得“It is important to relax”中to relax是…
  aliases:
    - infinitive as subject
  category: 语法
  explanation: 在It is important to do结构中，不定式作真正的主语。例如：It's important not to forget
    to relax. 重要的是不要忘记放松。
  misconceptions:
    - 漏写形式主语it，写成“Is important to do”或“Is important that...”。
    - 把真正主语误当宾语，觉得“It is important to relax”中to relax是宾语。
    - 否定形式误写成“It's important don't forget”而非not to forget。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:不定式作宾语
  type: Concept
  subject: 英语
  title: 不定式作宾语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：decide后误接doing，写成“I decided going there”而非to go。
    - 能指出并纠正这一错误：want后直接接原形，写成“I want play football”而非to play。
  aliases:
    - infinitive as object
  category: 语法
  explanation: 不定式（to do）可以作动词的宾语，如decide to do, want to do等。例如：I decided to give
    it a go. 我决定试一试。
  misconceptions:
    - decide后误接doing，写成“I decided going there”而非to go。
    - want后直接接原形，写成“I want play football”而非to play。
    - 误将hope/agree等词后也用动名词，如“I hope seeing you”。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:不定式作宾语补足语
  type: Concept
  subject: 英语
  title: 不定式作宾语补足语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：tell sb. to do误写成tell sb. do，漏掉to，如“She told me …
    - 能指出并纠正这一错误：否定式误写成“She told me don't give up”而非not to give u…
  aliases:
    - infinitive as object complement
    - 动词不定式作宾语补足语
  category: 语法
  explanation: 不定式（to do）可以放在某些动词（如tell, ask, want,
    encourage等）的宾语后作宾语补足语，说明宾语的动作。例如：She told me not to give up so easily.
    她告诉我不要轻易放弃。
  misconceptions:
    - tell sb. to do误写成tell sb. do，漏掉to，如“She told me give up”。
    - 否定式误写成“She told me don't give up”而非not to give up。
    - 把宾语补足语当成谓语，在宾语后直接用动词原形而忽略to。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:不定式作目的状语
  type: Concept
  subject: 英语
  title: 不定式作目的状语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用for+动词原形表目的，如“I play flute for relax”而非to relax…
    - 能指出并纠正这一错误：误用to+doing，写成“I study hard to getting good grade…
  aliases:
    - infinitive as adverbial of purpose
  category: 语法
  explanation: 不定式（to do）可以放在动词后作目的状语，表示做某事的目的。例如：I play the flute to relax. 我吹笛子是为了放松。
  misconceptions:
    - 用for+动词原形表目的，如“I play flute for relax”而非to relax。
    - 误用to+doing，写成“I study hard to getting good grades”。
    - 目的状语和原因状语混淆，如“He came to see me”误解为原因。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:不定式并列时的省略
  type: Concept
  subject: 英语
  title: 不定式并列时的省略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为并列不定式第二个to必须省略，把He wants to go and to see.判为错…
    - 能指出并纠正这一错误：省略第一个to，如He wants go and see.，保留第二个to。
  aliases:
    - 不定式省略 to
    - 并列不定式省略 to
    - 不定式省略
  category: 语法
  explanation: 多个不定式并列时，第一个带 to，后面的可省略 to。
  misconceptions:
    - 误以为并列不定式第二个to必须省略，把He wants to go and to see.判为错。
    - 省略第一个to，如He wants go and see.，保留第二个to。
    - 在and连接两个不定式时，误加to到第二个，如He likes to swim and to run.，其实也正确。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:不定式的否定形式
  type: Concept
  subject: 英语
  title: 不定式的否定形式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把not放在do之后，写成“decide to not go”而非not to go。
    - 能指出并纠正这一错误：误用don't替换not，写成“I told him don't come”而非not to c…
  aliases:
    - negative infinitive
  category: 语法
  explanation: 不定式的否定形式是在to前加not，即not to do。
  misconceptions:
    - 把not放在do之后，写成“decide to not go”而非not to go。
    - 误用don't替换not，写成“I told him don't come”而非not to come。
    - 在否定形式中忘了to，直接写成“not do”而非not to do。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:不带to的动词不定式
  type: Concept
  subject: 英语
  title: 不带to的动词不定式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：被动语态漏掉to：“He was made clean the room.”
    - 能指出并纠正这一错误：感官动词后误加to：“I saw him to cross the street.”
  aliases:
    - 省略to的不定式
  category: 语法
  explanation: 感官动词（see、hear等）和使役动词（let、make、have等）后作宾语补足语的不定式不带to。
  misconceptions:
    - 被动语态漏掉to：“He was made clean the room.”
    - 感官动词后误加to：“I saw him to cross the street.”
    - 使役动词后误加to：“Let me to try again.”
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:不规则动词
