    - 漏掉介词at，写成make... feel home，结构错误。
    - 用feel at the home或feel in home代替feel at home。
    - 用house替代home，说feel at house，表达不地道。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:manners 的用法
