  subject: 英语
  title: 被动语态中不规则动词的过去分词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：按规则变化出错，如 drinked、bringed、buyed，如 The water was …
    - 能指出并纠正这一错误：混淆 slept 与 sleeped，swimmed 等，如 The river was swi…
  aliases: []
  category: 语法
  explanation: 如 invent-invented, drink-drunk, bring-brought, produce-produced,
    trade-traded。
  misconceptions:
    - 按规则变化出错，如 drinked、bringed、buyed，如 The water was drinked
    - 混淆 slept 与 sleeped，swimmed 等，如 The river was swimmed
    - 把过去式当过去分词，如 The work was did by him（应为 done）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中主谓一致
  type: Concept
  subject: 英语
  title: 被动语态中主谓一致
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：The students is praised by the teacher 中 be 动词用 …
    - 能指出并纠正这一错误：The news are listened carefully 中 news 不可数却用 are
  aliases: []
  category: 语法
  explanation: be 动词的形式需与主语的人称和数保持一致。
  misconceptions:
    - The students is praised by the teacher 中 be 动词用 is 未随主语变化
    - The news are listened carefully 中 news 不可数却用 are
    - There are many trees planted 中 be 动词与 trees 不一致，误用 is
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中使役动词的处理
