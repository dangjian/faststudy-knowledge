- id: concept:英语:元音字母的发音规则
  type: Concept
  subject: 英语
  title: 元音字母的发音规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把name中的a读成/æ/，应为/eɪ/
    - 能指出并纠正这一错误：把like中的i读成/i/，应为/aɪ/
  aliases:
    - 字母发音
    - 元音字母发音
    - 元音字母的发音
    - vowel sounds
  category: 语音
  explanation: 英语元音字母 a, e, i, o, u 在开音节中通常分别发 /eɪ/, /iː/, /aɪ/, /əʊ/, /juː/。
  misconceptions:
    - 把name中的a读成/æ/，应为/eɪ/；如读成/næm/，正确为/neɪm/。
    - 把like中的i读成/i/，应为/aɪ/；如读成/lik/，正确为/laɪk/。
    - 误认为所有元音字母在开音节中都发其字母音，忽略e在开音节中常发/iː/，如he中e读/iː/，但学生读作/he/。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C2/sections/S2.md
- id: concept:英语:元音字母的短音发音
  type: Concept
  subject: 英语
  title: 元音字母的短音发音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把闭音节中的a读成字母音/eɪ/，如把cat读成/keɪt/.
    - 能指出并纠正这一错误：将bed中的e误读为/iː/，长音短音不分.
  aliases:
    - 短元音
  category: 语音
  explanation: 英语元音字母 a, e, i, o, u 在重读闭音节中通常发短音，如 /æ/, /e/, /ɪ/, /ɒ/, /ʌ/。
  misconceptions:
    - 把闭音节中的a读成字母音/eɪ/，如把cat读成/keɪt/.
    - 将bed中的e误读为/iː/，长音短音不分.
    - 认为所有i都读/aɪ/，如把sit读成/saɪt/.
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C3/sections/S2.md
- id: concept:英语:元音字母的长音发音
  type: Concept
  subject: 英语
  title: 元音字母的长音发音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把开音节中的a读成/æ/，如把name读成/næm/.
    - 能指出并纠正这一错误：将like中的i读成/ɪ/，受闭音节影响.
  aliases:
    - 长元音
  category: 语音
  explanation: 英语元音字母在重读开音节中通常发字母本身的音，即长音，如 a /eɪ/, e /iː/, i /aɪ/, o /əʊ/, u /juː/。
  misconceptions:
    - 把开音节中的a读成/æ/，如把name读成/næm/.
    - 将like中的i读成/ɪ/，受闭音节影响.
    - 忽略magic e规则，如把home读成/hɒm/.
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C3/sections/S2.md
- id: concept:英语:元音字母组合发音
