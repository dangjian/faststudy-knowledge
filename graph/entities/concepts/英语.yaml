    - 英文表达写成Double Nine Festival，应为Double Ninth Festival，需用序数词。
    - 认为重阳节只与登高有关，忽略敬老、赏菊等文化内涵。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:重音
