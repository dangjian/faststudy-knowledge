  subject: 英语
  title: make a decision
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：make a decision 被拆成 make decision，漏掉冠词 a.
    - 能指出并纠正这一错误：与 make up one's mind 混淆，误认为 decision 必须用复数，如 mak…
  aliases:
    - decide
  category: 短语
  explanation: 做决定，相当于decide。
  misconceptions:
    - make a decision 被拆成 make decision，漏掉冠词 a.
    - 与 make up one's mind 混淆，误认为 decision 必须用复数，如 make decisions 在具体场景误用.
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S2.md
- id: concept:英语:make a difference
