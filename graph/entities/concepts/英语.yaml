    - 读一般疑问句用降调，如Are you a student?末尾应升调却读降。
    - 读特殊疑问句用升调，如What's your name?末尾应降调却读升。
    - 读陈述句用升调，如I like apples.末尾应降调却升。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C10/sections/S1.md
- id: concept:英语:语音：辅音音素
