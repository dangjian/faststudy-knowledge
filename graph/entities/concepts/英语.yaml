  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:环保措施
  type: Concept
  subject: 英语
  title: 环保措施
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“随手关灯”说成close the light，正确是turn off the light。
    - 能指出并纠正这一错误：认为“多开窗通风”是环保措施，实际与环保无关，如open the window。
