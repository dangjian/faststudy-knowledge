  category: grammar
  explanation: Reflexive pronouns (e.g., myself, yourself, himself) are used when
    the subject and object of a sentence refer to the same person or thing.
  misconceptions:
    - 主语与反身代词数不一致：They enjoyed himself at the party，应用themselves。
    - 在宾语与主语指同一人时仍用宾格代词：I made me a sandwich，应用myself。
    - 使用错误的变体hisself和theirselves，应使用himself和themselves。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C2/sections/S1.md
- id: concept:英语:regret doing sth.
