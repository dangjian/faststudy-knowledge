  subject: 英语
  title: 描述旅行经历
  conceptType: 应用型
  aliases: []
  category: 句型
  explanation: 用 Where did you go...? I went to... I ate... I saw... 等句子，按地点和活动说说自己的旅行经历。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C1/sections/S2.md
- id: concept:英语:描述植物的生长过程
