    - 能指出并纠正这一错误：Her words made me angrily. 误用副词，应为angry
  aliases: []
  category: 语法
  explanation: make 后接形容词作宾语补足语，表示“使某人感到……”。
  misconceptions:
    - The story made me to feel sad. 误加to
    - Her words made me angrily. 误用副词，应为angry
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C11/sections/S1.md
