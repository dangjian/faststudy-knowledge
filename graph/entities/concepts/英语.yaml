    - 把sweep the floor误写成sweep floor，漏掉冠词the
    - 将clean the bathroom说成clean bathroom，中式英语漏冠词
    - 混淆sweep（扫）和mop（拖），打扫地面时用错动词
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C2/sections/S1.md
