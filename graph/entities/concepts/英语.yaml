  masteryCriteria:
    - 能指出并纠正这一错误：by后接动词原形，如“by read English”，应使用动名词reading。
    - 能指出并纠正这一错误：把by错用为with表示方式，如“learn with watching movies”，应说b…
  aliases:
    - by doing sth.
  category: 语法
  explanation: 用介词 by 加动名词短语表示通过某种方式或手段做某事，常用于回答 how 引导的问句。
  misconceptions:
    - by后接动词原形，如“by read English”，应使用动名词reading。
    - 把by错用为with表示方式，如“learn with watching movies”，应说by watching movies。
    - 动名词双写末尾字母出错，如“by swiming”，正确为swimming。
