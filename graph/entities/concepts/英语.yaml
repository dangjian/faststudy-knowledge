  misconceptions:
    - 把rather than当作‘宁可’，如I would rather than go，实际应为I would rather go。
    - 前后结构不一致，如I like reading rather than to watch TV，应保持动名词或不定式一致。
    - 把rather than和other than混淆，写The book is different rather than yours，应为other
      than。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:reflexive pronouns
