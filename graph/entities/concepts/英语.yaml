  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把encourage sb. to do sth.写成encourage sb. doing s…
    - 能指出并纠正这一错误：鼓励别人时误用Give up!，把don't去掉，变成放弃的祈使句
  aliases:
    - encouraging expressions
  category: 功能句型
  explanation: 用于鼓励他人的表达，如：Don't give up. 不要放弃。encourage sb. to do sth. 鼓励某人做某事。
  misconceptions:
    - 把encourage sb. to do sth.写成encourage sb. doing sth.
    - 鼓励别人时误用Give up!，把don't去掉，变成放弃的祈使句
    - 混淆Don't give up.和Don't give in.，把不放弃写成不屈服，语义错位
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:被动语态
  type: Concept
  subject: 英语
  title: 被动语态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：被动语态漏掉 be 动词，如 The window broken by him，应为 was b…
    - 能指出并纠正这一错误：主动被动混淆，如 The book sells well 被误写成 is sold well，不…
  aliases:
    - passive voice
  category: 语法
  explanation: 被动语态表示主语是动作的承受者，结构为be+过去分词。
  misconceptions:
    - 被动语态漏掉 be 动词，如 The window broken by him，应为 was broken。
    - 主动被动混淆，如 The book sells well 被误写成 is sold well，不恰当。
    - 过去分词拼错，如 write 的过去分词写成 writen，应为 written。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:被动语态中 by 短语的使用
  type: Concept
  subject: 英语
  title: 被动语态中 by 短语的使用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：by后误用主格代词，如"The book was read by he"，应为him。
    - 能指出并纠正这一错误：by短语位置错误，如"By him the book was read"，应置于谓语后。
  aliases:
    - 被动语态中by短语的使用
  category: 语法
  explanation: 用 by 引出动作的执行者，可省略。
  misconceptions:
    - by后误用主格代词，如"The book was read by he"，应为him。
    - by短语位置错误，如"By him the book was read"，应置于谓语后。
    - 过度使用by，如"The cake was eaten by"，省略by后忘记写施动者，或随意省略本不可省的by。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中 by 短语的省略
  type: Concept
  subject: 英语
  title: 被动语态中 by 短语的省略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：执行者不重要时仍保留 by 短语，如 The window was broken by some…
    - 能指出并纠正这一错误：省略 by 后认为句子不完整，误加 by 人称代词，如 The book was read by…
  aliases: []
  category: 语法
  explanation: 当动作执行者不重要或不明时，可省略 by 短语。
  misconceptions:
    - 执行者不重要时仍保留 by 短语，如 The window was broken by someone 不省略而显累赘
    - 省略 by 后认为句子不完整，误加 by 人称代词，如 The book was read by him 强行保留
    - 不知道什么时候可省略，以为被动句必须带 by 短语
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中不定式符号 to 的保留
  type: Concept
  subject: 英语
  title: 被动语态中不定式符号 to 的保留
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：主动中省略 to 的动词变被动后仍不带 to，如 He was made cry by the …
    - 能指出并纠正这一错误：把 The boy was seen run away 中的 run 写成原形，忘了被动要加 t…
  aliases: []
  category: 语法
  explanation: 主动语态中省略 to 的不定式，变为被动时需恢复 to。
  misconceptions:
    - 主动中省略 to 的动词变被动后仍不带 to，如 He was made cry by the teacher
    - 把 The boy was seen run away 中的 run 写成原形，忘了被动要加 to
    - 认为所有被动语态的不定式都要省略 to，如 She was heard sing
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中不定式被动
