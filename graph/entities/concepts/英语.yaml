  title: 描述恶劣天气
  conceptType: 概念型
  aliases: []
  category: 句型
  explanation: 用 heavy rain（大雨）、flood（洪水）、fog（雾）、heavy snow（大雪）、strong
    wind（大风）等描述坏天气，并提醒大家注意安全。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C6/sections/S2.md
- id: concept:英语:描述所有物的句型
  type: Concept
  subject: 英语
  title: 描述所有物的句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：表达”我有一支红笔“说成“I have red pen”，漏掉冠词a，应为“I have a r…
    - 能指出并纠正这一错误：回答“What colour is it?”时，说“It's a red”，应为“It's re…
  aliases:
    - I have
  category: 句型
  explanation: 用 I have ... 表达拥有某物，并可用 What colour 询问颜色。
  misconceptions:
    - 表达”我有一支红笔“说成“I have red pen”，漏掉冠词a，应为“I have a red pen”。
    - 回答“What colour is it?”时，说“It's a red”，应为“It's red”，颜色前不加冠词。
    - 用“I have"描述第三人称时仍用have，如“She have a bag”，应为“She has a bag”。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C2/sections/S2.md
- id: concept:英语:描述旅行经历
