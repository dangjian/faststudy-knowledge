  explanation: 世界各地庆祝新年的不同方式，如英国的大本钟倒计时、美国时代广场的落球仪式、埃及的闻风节等。
  misconceptions:
    - 误以为所有国家都在1月1日庆祝新年，忽视中国春节
    - 把美国时代广场落球仪式和英国大本钟倒计时对调
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:方位介词
