  misconceptions:
    - Different countries have different custom 漏掉复数，custom 是可数名词。
    - Eating breakfast every day is a good custom 把个人习惯 habit 与社会习俗 custom 混用。
    - 把 customs 当作不可数名词：much customs 错，应 many customs。
