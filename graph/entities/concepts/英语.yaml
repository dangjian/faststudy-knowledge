  subject: 英语
  title: 总结文本技巧
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：总结时照抄原文整段内容，没有省略次要细节。
    - 能指出并纠正这一错误：总结时加入自己的评论，如'I think this is important'，混入了原文没有的…
  aliases:
    - summarizing
  category: 阅读策略
  explanation: 总结时省略不重要的细节，只保留主要点，有助于理解和记忆。
  misconceptions:
    - 总结时照抄原文整段内容，没有省略次要细节。
    - 总结时加入自己的评论，如'I think this is important'，混入了原文没有的信息。
    - 删去原文中的限制词，如把usually get headaches简化为get headaches，导致意思过于绝对。
