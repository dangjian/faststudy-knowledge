  explanation: 单词中某个音节读得比其他音节更重，如 library 的重音在第一音节。
  misconceptions:
    - 将 library 的重音读在第二音节 li-bra-ry，正确在第一音节
    - 认为重音只影响长度不影响清晰度，实际弱读音节需模糊
    - 单词重音位置随意移动，如 'important 重音放在第一音节
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C6/sections/S1.md
- id: concept:英语:量词短语
  type: Concept
  subject: 英语
  title: 量词短语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：a milk 直接加不定冠词，正确应为 a bottle/glass of milk
    - 能指出并纠正这一错误：two bottles of milks 量词后的名词加 s，正确应为 two bottles …
  aliases:
    - quantifiers
    - partitive expressions
  category: 语法
  explanation: 用“a + 量词 + of + 名词”结构表示不可数名词的数量，如a bottle of milk。
  misconceptions:
    - a milk 直接加不定冠词，正确应为 a bottle/glass of milk
    - two bottles of milks 量词后的名词加 s，正确应为 two bottles of milk
    - 量词与名词搭配不当，如 a piece of milk，正确应为 a bottle of milk
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S3.md
- id: concept:英语:键盘字母位置
  type: Concept
  subject: 英语
  title: 键盘字母位置
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为键盘第一行是按A-Z顺序排列，实际是QWERTY
    - 能指出并纠正这一错误：打字时把W和E位置记反，想按W却按到E
  aliases: []
  category: 学习策略
  explanation: 了解字母在键盘上的位置，有助于打字和记忆字母顺序。
  misconceptions:
    - 认为键盘第一行是按A-Z顺序排列，实际是QWERTY
    - 打字时把W和E位置记反，想按W却按到E
    - 以为字母A在键盘中央，实际A在第二行左端（左手小指）
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C1/sections/S1.md
- id: concept:英语:问候语
  type: Concept
  subject: 英语
  title: 问候语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：下午见面说‘Good morning’，正确说法是‘Good afternoon’
    - 能指出并纠正这一错误：听到‘Hello’后回答‘I’m fine.’，应直接回‘Hello’或‘Hi’
  aliases:
    - 打招呼
  category: 交际用语
  explanation: 用于见面时打招呼的常用表达，如Hello, Hi, Good morning等。
  misconceptions:
    - 下午见面说‘Good morning’，正确说法是‘Good afternoon’
    - 听到‘Hello’后回答‘I’m fine.’，应直接回‘Hello’或‘Hi’
    - 把‘Good morning’里的morning误写成‘moning’，漏掉r
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C1/sections/S1.md
- id: concept:英语:问题与解决办法
  type: Concept
  subject: 英语
  title: 问题与解决办法
  conceptType: 概念型
  aliases:
    - problem and solution
  category: 方法
  explanation: 读故事时可以梳理地点（place）、计划（plan）、遇到的问题（problem）和解决办法（solution），用表格把信息整理清楚。
  sourceRef: content/四年级/下册/英语/PEP-4-2-English/chapters/C7/sections/S3.md
- id: concept:英语:间接问句
  type: Concept
  subject: 英语
  title: 间接问句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：间接问句未变为陈述语序，如“Could you tell me where is the res…
    - 能指出并纠正这一错误：一般疑问句的间接问句遗漏if/whether，如“Could you tell me do yo…
  aliases:
    - indirect questions
  category: 语法
  explanation: 通过'Could you tell me...'等结构使提问更委婉礼貌。
  misconceptions:
    - 间接问句未变为陈述语序，如“Could you tell me where is the restroom?”。
    - 一般疑问句的间接问句遗漏if/whether，如“Could you tell me do you like tea?”。
    - 时态呼应错误，如“He asked me if I am free”应为if I was free。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C3/sections/S1.md
- id: concept:英语:阅读日志
  type: Concept
  subject: 英语
  title: 阅读日志
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：阅读日志只写摘要，缺少书名、作者、日期等基本信息
    - 能指出并纠正这一错误：照抄书中原句，没有用自己的话概括主要人物和情节
  aliases:
    - reading log
  category: 学习策略
  explanation: 阅读日志记录阅读日期、书名、作者、类型、主要人物、摘要和个人观点等。
  misconceptions:
    - 阅读日志只写摘要，缺少书名、作者、日期等基本信息
    - 照抄书中原句，没有用自己的话概括主要人物和情节
    - 个人观点只写“很好看”等空洞评价，无具体理由
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C7/sections/S2.md
- id: concept:英语:阿炳（Abing）
  type: Concept
  subject: 英语
  title: 阿炳（Abing）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为阿炳是唐代音乐家，实际是1893-1950年的近代音乐家。
    - 能指出并纠正这一错误：认为《二泉映月》是钢琴曲，实际是二胡曲。
  aliases:
    - 华彦钧
  category: 文化背景
  explanation: 阿炳（1893-1950）是中国民间音乐家，代表作《二泉映月》，其音乐充满悲伤与美感。
  misconceptions:
    - 认为阿炳是唐代音乐家，实际是1893-1950年的近代音乐家。
    - 认为《二泉映月》是钢琴曲，实际是二胡曲。
    - 把阿炳英文名拼错，如写成Abin，正确为Abing。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C9/sections/S1.md
- id: concept:英语:隐喻
  type: Concept
  subject: 英语
  title: 隐喻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把隐喻当明喻，看到没有like/as就认为不是修辞手法
    - 能指出并纠正这一错误：只按字面理解，如把life is a journey理解为人生真有旅途
  aliases:
    - 暗喻
  category: 修辞
  explanation: 一种修辞手法，将一种事物比作另一种事物，如journey隐喻人生阶段。
  misconceptions:
    - 把隐喻当明喻，看到没有like/as就认为不是修辞手法
    - 只按字面理解，如把life is a journey理解为人生真有旅途
    - 忽略文化差异，将英文隐喻直译成中文导致语义错位
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:青海湖
  type: Concept
  subject: 英语
  title: 青海湖
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为青海湖是中国最大的淡水湖。
    - 能指出并纠正这一错误：将青海湖面积记成4340平方公里却写成43400。
  aliases:
    - Qinghai Lake
  category: 地理
  explanation: 中国最大的咸水湖，位于青海省，面积4340平方公里。
  misconceptions:
    - 误认为青海湖是中国最大的淡水湖。
    - 将青海湖面积记成4340平方公里却写成43400。
    - 以为青海湖位于西藏而非青海省。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S2.md
- id: concept:英语:青蛙在生态系统中的作用
  type: Concept
  subject: 英语
  title: 青蛙在生态系统中的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：动名词误用：写by eat insects，应为by eating insects。
    - 能指出并纠正这一错误：主谓一致错误：写Frogs is an indicator species。
  aliases:
    - frogs' role
  category: 动物知识
  explanation: 青蛙通过捕食昆虫帮助农场，同时作为环境指示物种，对气候变化和生态系统研究有重要意义。
  misconceptions:
    - 动名词误用：写by eat insects，应为by eating insects。
    - 主谓一致错误：写Frogs is an indicator species。
    - 混淆effect与affect，写frogs affect positively the ecosystem。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C4/sections/S3.md
- id: concept:英语:非重读单词的弱读
  type: Concept
  subject: 英语
  title: 非重读单词的弱读
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将and强读为/ænd/，弱读位置应读/ənd/。
    - 能指出并纠正这一错误：将to强读为/tuː/，弱读时应读/tə/，如want to读/'wɒntə/。
  aliases: []
  category: 语音
  explanation: 在句子中，非重读的单词（如and, to, them, are等）通常弱读。
  misconceptions:
    - 将and强读为/ænd/，弱读位置应读/ənd/。
    - 将to强读为/tuː/，弱读时应读/tə/，如want to读/'wɒntə/。
    - 将them强读为/ðem/，弱读时读/ðəm/。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C1/sections/S1.md
- id: concept:英语:面对面交流
  type: Concept
  subject: 英语
  title: 面对面交流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：作定语时忘加连字符，写 face to face communication，应为 face-t…
    - 能指出并纠正这一错误：误以为面对面交流只靠语言，忽略 body language 和语音语调的作用
  aliases:
    - face-to-face communication
    - in-person communication
  category: 交际
  explanation: 面对面交流指人与人直接见面交谈，包括身体语言和语音语调，有助于建立信任和避免误解。
  misconceptions:
    - 作定语时忘加连字符，写 face to face communication，应为 face-to-face
    - 误以为面对面交流只靠语言，忽略 body language 和语音语调的作用
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C8/sections/S3.md
- id: concept:英语:音标 /h/ /w/ /θ/ /ð/ /k/ /kw/ /ʃ/ /ʒ/
  type: Concept
  subject: 英语
  title: 音标 /h/ /w/ /θ/ /ð/ /k/ /kw/ /ʃ/ /ʒ/
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把/θ/发成/s/，如将think读成sink
    - 能指出并纠正这一错误：把/w/与/v/混淆，如在very中误发成/w/
  aliases:
    - 发音
    - 音标
  category: 语音
  explanation: 本课练习了 /h/、/w/、/θ/、/ð/、/k/、/kw/、/ʃ/、/ʒ/ 等音标的发音，并注意字母组合的发音规律。
  misconceptions:
    - 把/θ/发成/s/，如将think读成sink
    - 把/w/与/v/混淆，如在very中误发成/w/
    - 读不准/ʒ/，常与/dʒ/混淆，如将usually中的/ʒ/读成/dʒ/
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C6/sections/S1.md
- id: concept:英语:音标/h/ /r/ /l/ /m/ /n/ /ŋ/ /w/ /j/
  type: Concept
  subject: 英语
  title: 音标/h/ /r/ /l/ /m/ /n/ /ŋ/ /w/ /j/
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把/ŋ/写成/ng/，如sing的音标写成/siŋg/（实际/siŋ/）。
    - 能指出并纠正这一错误：把/j/误认为字母j的发音，实际是y的辅音音素。
  aliases:
    - 辅音音标
  category: 语音
  explanation: 本单元学习的辅音音标及其发音。
  misconceptions:
    - 把/ŋ/写成/ng/，如sing的音标写成/siŋg/（实际/siŋ/）。
    - 把/j/误认为字母j的发音，实际是y的辅音音素。
    - 把/r/发成/l/，如red发成led。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C10/sections/S1.md
- id: concept:英语:频度表达
  type: Concept
  subject: 英语
  title: 频度表达
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉介词，写'once week'而应为'once a week'。
    - 能指出并纠正这一错误：频度副词与短语混用，如用'one time a week'代替'once a week'。
  aliases:
    - 频率短语
    - Frequency expressions
  category: 语法
  explanation: 表示频率的短语，如once a week, twice a month, three times a day等，用于回答how often的提问。
  misconceptions:
    - 漏掉介词，写'once week'而应为'once a week'。
    - 频度副词与短语混用，如用'one time a week'代替'once a week'。
    - 对how often的回答用'three times'缺少'day/week'等时间单位，如'three times'不完整。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C3/sections/S2.md
- id: concept:英语:频率副词
  type: Concept
  subject: 英语
  title: 频率副词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：频率副词位置错误，如“I go often to the gym.”应把 often 放在 go…
    - 能指出并纠正这一错误：双重否定，如“I don't never watch TV.”应为“I never watch …
  aliases:
    - 频度副词
  category: 语法
  explanation: 表示动作发生频率的副词，如 always, usually, often, sometimes, hardly ever, never
    等，通常放在实义动词之前、be动词之后。
  misconceptions:
    - 频率副词位置错误，如“I go often to the gym.”应把 often 放在 go 前：I often go to the gym.
    - 双重否定，如“I don't never watch TV.”应为“I never watch TV.”
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C3/sections/S1.md
- id: concept:英语:颜色词汇
  type: Concept
  subject: 英语
  title: 颜色词汇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把红色"red"误写成"read"，绿色"green"误写成"grean"
    - 能指出并纠正这一错误：说"I like red colour."，应说"I like red."或"I like th…
  aliases: []
  category: 词汇
  explanation: 描述物品颜色的形容词，如 red, blue, green 等。
  misconceptions:
    - 把红色"red"误写成"read"，绿色"green"误写成"grean"
    - 说"I like red colour."，应说"I like red."或"I like the colour red."
    - 把"黑色"说成"black color"，与colour重复，black本身就指颜色
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C2/sections/S1.md
- id: concept:英语:颜色询问
  type: Concept
  subject: 英语
  title: 颜色询问
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：问单数颜色误用“What colour are it?”，be动词应随单数用is。
    - 能指出并纠正这一错误：问复数颜色误用“What colour is they?”，be动词应随复数用are。
  aliases: []
  category: 语法
  explanation: 用“What colour is it/are they?”询问颜色。
  misconceptions:
    - 问单数颜色误用“What colour are it?”，be动词应随单数用is。
    - 问复数颜色误用“What colour is they?”，be动词应随复数用are。
    - 疑问句语序错误，写成“What colour it is?”，应为“What colour is it?”
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C3/sections/S2.md
- id: concept:英语:食物与饮料词汇
  type: Concept
  subject: 英语
  title: 食物与饮料词汇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用many修饰不可数名词，如"many mutton"（mutton不可数，应用much）
    - 能指出并纠正这一错误：可数名词复数漏加-s，如"two watermelon"（应说two watermelons）
  aliases: []
  category: 词汇
  explanation: 本单元涉及的食物和饮料名称，如watermelon, cabbage, mutton等。
  misconceptions:
    - 用many修饰不可数名词，如"many mutton"（mutton不可数，应用much）
    - 可数名词复数漏加-s，如"two watermelon"（应说two watermelons）
    - 误认为cabbage不可数，说"a cabbage"指一棵时其实可数，但"some cabbage"又作不可数，易混
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C4/sections/S1.md
- id: concept:英语:食物过敏
  type: Concept
  subject: 英语
  title: 食物过敏
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为食物过敏只是肠胃不适，忽视呼吸困难等严重症状
    - 能指出并纠正这一错误：误以为煮熟的食物不会再引起过敏，吃了仍出现反应
  aliases:
    - food allergy
  category: 健康知识
  explanation: 食物过敏是免疫系统对某些食物成分产生的过度反应，可能导致皮疹、呼吸困难等症状，严重时需紧急就医。
  misconceptions:
    - 认为食物过敏只是肠胃不适，忽视呼吸困难等严重症状
    - 误以为煮熟的食物不会再引起过敏，吃了仍出现反应
    - 把食物过敏等同于食物中毒，自行吃止泻药延误就医
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C2/sections/S2.md
- id: concept:英语:食物链
  type: Concept
  subject: 英语
  title: 食物链
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为食物链从消费者开始，实际应从生产者（植物）开始。
    - 能指出并纠正这一错误：把 chain 拼成 change，写成 food change。
  aliases:
    - food chain
  category: 概念
  explanation: 在生态系统中，生物之间通过吃与被吃的关系形成的链状结构。
  misconceptions:
    - 认为食物链从消费者开始，实际应从生产者（植物）开始。
    - 把 chain 拼成 change，写成 food change。
    - 泛指时误用复数 food chains，如 The food chain is important 写成 foods chains。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S2.md
- id: concept:英语:餐具词汇
  type: Concept
  subject: 英语
