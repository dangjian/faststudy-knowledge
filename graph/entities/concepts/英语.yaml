    - 只写情节复述，不写个人观点和推荐，书评变成内容简介。
    - 先写观点再写书籍信息，结构混乱。
    - 遗漏书籍基本信息，如作者、出版社等。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C7/sections/S1.md
- id: concept:英语:书评要素
