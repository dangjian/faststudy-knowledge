  masteryCriteria:
    - 能指出并纠正这一错误：宾语从句语序误用疑问句形式，如 I don't know where is he，应为 wher…
    - 能指出并纠正这一错误：that 引导宾语从句时随意省略，如 He said that he is busy 漏掉 th…
  aliases:
    - object clauses
  category: 语法
  explanation: 宾语从句在句中作宾语，通常由that、whether、疑问词等引导。
  misconceptions:
    - 宾语从句语序误用疑问句形式，如 I don't know where is he，应为 where he is。
    - that 引导宾语从句时随意省略，如 He said that he is busy 漏掉 that 可接受，但误以为所有 that 都可省。
    - 主句为过去时，从句误用现在时，如 He said he is a teacher，应改为 was。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S2.md
- id: concept:英语:宾语从句（if/whether引导）
