    - 误用动词原形或现在分词，将the book written by him写成the book writing by him
    - 忽略被动关系，把the castle built in 1800写成the castle building in 1800
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:过去完成时
