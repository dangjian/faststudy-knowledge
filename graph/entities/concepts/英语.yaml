    - 误把 regret doing 写成 regret to do 表示“后悔做过”，两者含义不同：doing 表已做，to do 表遗憾要做。
    - 误用 regret do sth，regret 后不能接动词原形，应接动名词或不定式。
    - 混淆 regret doing 与 regret having done，其实两者都对，但学生可能误将 having done 视为错误。
