    - topic sentence
  category: 阅读策略
  explanation: 通过识别段落主题句来理解文章结构，有助于把握文章大意。
  misconceptions:
    - 把段落中的具体例子当成主旨，如选‘小明喜欢游泳’而非‘小明喜欢水上运动’
    - 认为主题句必在首句，忽略段末或需自己概括
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:母亲节
  type: Concept
  subject: 英语
  title: 母亲节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为母亲节固定在5月的第一个星期日，实际是第二个
    - 能指出并纠正这一错误：以为所有国家母亲节都是五月的第二个星期日，忽略英国等日期不同
  aliases:
    - Mother's Day
  category: 文化
  explanation: 美国节日，在五月的第二个星期日，孩子们向母亲表达爱意。
  misconceptions:
    - 误以为母亲节固定在5月的第一个星期日，实际是第二个
    - 以为所有国家母亲节都是五月的第二个星期日，忽略英国等日期不同
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:比较级
  type: Concept
  subject: 英语
  title: 比较级
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不规则比较级按规则变化，如"gooder""badder"，应记better, worse。
    - 能指出并纠正这一错误：比较级后漏than，如"He is taller I"，比较结构不完整。
  aliases:
    - comparative degree
  category: 语法
  explanation: 用于比较两者差异，通常用形容词或副词的比较级形式加than构成。
  misconceptions:
    - 不规则比较级按规则变化，如"gooder""badder"，应记better, worse。
    - 比较级后漏than，如"He is taller I"，比较结构不完整。
    - 三者以上比较仍用比较级，如"She is taller in her class"，应使用最高级。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C12/sections/S1.md
- id: concept:英语:比较级句型
  type: Concept
  subject: 英语
  title: 比较级句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：比较级漏than，如"He is taller me"（应为taller than me）
    - 能指出并纠正这一错误：比较对象不对等，如"My school is bigger than you"（应为than y…
  aliases:
    - than比较
  category: 语法
  explanation: 用于比较两者，如funnier than, listens better than。
  misconceptions:
    - 比较级漏than，如"He is taller me"（应为taller than me）
    - 比较对象不对等，如"My school is bigger than you"（应为than yours）
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C3/sections/S3.md
- id: concept:英语:比较级和最高级
  type: Concept
  subject: 英语
  title: 比较级和最高级
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不规则变化按规则写，如good变成gooder，bad变成badder。
    - 能指出并纠正这一错误：单音节词前加more，如more big, more tall。
  aliases:
    - comparatives and superlatives
  category: 语法
  explanation: 用于比较事物之间差异的形容词形式，如bigger, biggest。
  misconceptions:
    - 不规则变化按规则写，如good变成gooder，bad变成badder。
    - 单音节词前加more，如more big, more tall。
    - 重读闭音节比较级不双写，如写成biger, hotter写为hoter。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:毕业演讲
  type: Concept
  subject: 英语
  title: 毕业演讲
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用中式英语表达感谢，如Thanks for your listen，应为Thanks for l…
    - 能指出并纠正这一错误：认为毕业演讲只能表达喜悦，不能表达伤感或遗憾。
  aliases:
    - graduation speech
  category: 文体
  explanation: 毕业演讲是在毕业典礼上发表的正式讲话，通常包含祝贺、回顾、感谢和展望。
  misconceptions:
    - 用中式英语表达感谢，如Thanks for your listen，应为Thanks for listening。
    - 认为毕业演讲只能表达喜悦，不能表达伤感或遗憾。
    - 在演讲结尾误用The end，应为Thank you或That's all。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:派生法
  type: Concept
  subject: 英语
  title: 派生法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有形容词都能加un-构成反义词，如把sad写成unsad。
    - 能指出并纠正这一错误：动词变名词时后缀混淆，把discuss的名词误写作discusion，漏一个s。
  aliases:
    - 词缀法
  category: 词汇
  explanation: 通过加前缀或后缀构成新词，如un-, dis-, -er, -tion等。
  misconceptions:
    - 认为所有形容词都能加un-构成反义词，如把sad写成unsad。
    - 动词变名词时后缀混淆，把discuss的名词误写作discusion，漏一个s。
    - 加后缀时拼写变化错误，如happy变名词happiness漏写y→i，写成happyness。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:流程图
  type: Concept
  subject: 英语
  title: 流程图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：流程顺序颠倒，比如先写结果再写原因，如先写"He was late"后写"He missed t…
    - 能指出并纠正这一错误：用"finally"描述中间步骤，如"First, I got up. Finally, I b…
  aliases:
    - flow chart
  category: 阅读策略
  explanation: 通过流程图梳理事件发生的顺序，帮助理解文本结构。
  misconceptions:
    - 流程顺序颠倒，比如先写结果再写原因，如先写"He was late"后写"He missed the bus"
    - 用"finally"描述中间步骤，如"First, I got up. Finally, I brushed my teeth."
    - 认为流程图只能用箭头，不知道可以用数字或连接词表示顺序
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C7/sections/S3.md
- id: concept:英语:海啸
  type: Concept
  subject: 英语
  title: 海啸
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为海啸只是普通大浪，忽略其由海底地震引发且破坏力巨大。
    - 能指出并纠正这一错误：把海啸和台风混为一谈，误认为两者成因相同。
  aliases:
    - tsunami
  category: 自然现象
  explanation: 由海底地震等引发的巨大海浪，具有极大破坏力。
  misconceptions:
    - 认为海啸只是普通大浪，忽略其由海底地震引发且破坏力巨大。
    - 把海啸和台风混为一谈，误认为两者成因相同。
    - 写The tsunami was happened，漏掉be动词或误用被动。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:海报制作要素
  type: Concept
  subject: 英语
  title: 海报制作要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：海报只写俱乐部名称和活动，忘记写时间地点和联系方式。
    - 能指出并纠正这一错误：把联系方式只写成"contact us"，没有具体电话或邮箱。
  aliases:
    - poster elements
  category: 写作
  explanation: 制作招募海报需包含俱乐部名称、成员活动、时间地点和联系方式。
  misconceptions:
    - 海报只写俱乐部名称和活动，忘记写时间地点和联系方式。
    - 把联系方式只写成"contact us"，没有具体电话或邮箱。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C8/sections/S2.md
- id: concept:英语:演讲特征
  type: Concept
  subject: 英语
  title: 演讲特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为演讲就是朗读稿子，没有与听众的眼神交流。
    - 能指出并纠正这一错误：开头平淡，没有吸引人的开场白，如直接说“今天我要讲的是”。
  aliases:
    - features of a speech
  category: 文体知识
  explanation: 演讲通常具有明确的目的、吸引人的开头、清晰的逻辑结构和有力的结尾。
  misconceptions:
    - 以为演讲就是朗读稿子，没有与听众的眼神交流。
    - 开头平淡，没有吸引人的开场白，如直接说“今天我要讲的是”。
    - 结尾没有总结或号召，戛然而止。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C7/sections/S1.md
- id: concept:英语:演讲的结构
  type: Concept
  subject: 英语
  title: 演讲的结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为演讲开头必须说 Today I'm going to talk about...，不要钩子。
    - 能指出并纠正这一错误：把结尾写成 That's all, thank you，没有总结和行动呼吁。
  aliases:
    - Speech structure
    - Hook
    - Call to action
  category: 语篇知识
  explanation: 演讲可以以吸引听众注意力的钩子开头，并以呼吁行动结尾。
  misconceptions:
    - 认为演讲开头必须说 Today I'm going to talk about...，不要钩子。
    - 把结尾写成 That's all, thank you，没有总结和行动呼吁。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:演讲的钩子（hook）
  type: Concept
  subject: 英语
  title: 演讲的钩子（hook）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为hook就是故事，认为所有演讲必须以讲故事开头。
    - 能指出并纠正这一错误：把hook写成 Hello, everyone 或 Good morning 等普通问候。
  aliases:
    - hook
  category: 文体特征
  explanation: 演讲开头用来吸引听众注意力的元素，可以是故事、有趣的事实或问题。
  misconceptions:
    - 以为hook就是故事，认为所有演讲必须以讲故事开头。
    - 把hook写成 Hello, everyone 或 Good morning 等普通问候。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:火灾安全知识
  type: Concept
  subject: 英语
  title: 火灾安全知识
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：油锅起火时直接浇水，导致油火飞溅
    - 能指出并纠正这一错误：身上着火时奔跑呼救，火势越烧越旺
  aliases:
    - 油锅起火
    - 灭火方法
  category: 安全常识
  explanation: 油锅起火不能用水浇，应使用灭火器；身上着火应就地打滚。
  misconceptions:
    - 油锅起火时直接浇水，导致油火飞溅
    - 身上着火时奔跑呼救，火势越烧越旺
    - 认为所有火灾都能用干粉灭火器，忽视油锅火需专用灭火器
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C2/sections/S1.md
- id: concept:英语:烹饪步骤表达
  type: Concept
  subject: 英语
  title: 烹饪步骤表达
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：描述步骤时不用顺序词，如“Cut up the vegetables. Pour the oil…
    - 能指出并纠正这一错误：动词使用错误，如“pour the meat” 应为“cut up the meat”或“add…
  aliases:
    - cooking instructions
  category: 功能表达
  explanation: 描述烹饪过程时常用 first, next, then, finally 等顺序词，以及 cut up, mix, pour, boil 等动词。
  misconceptions:
    - 描述步骤时不用顺序词，如“Cut up the vegetables. Pour the oil.” 应加First/Then/Finally
    - 动词使用错误，如“pour the meat” 应为“cut up the meat”或“add the meat”
    - 祈使句动词用了-ing形式，如“Boiling the water” 应为“Boil the water”
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S1.md
- id: concept:英语:爱好
  type: Concept
  subject: 英语
  title: 爱好
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：表达爱好时直接用原形，如“My hobby is play basketball”而非playi…
    - 能指出并纠正这一错误：把like doing误写成like to doing，如“I like to swimming…
  aliases:
    - hobby
    - hobbies
  category: 话题词汇
  explanation: 爱好是人们在空闲时间喜欢做的活动，如阅读、音乐、运动、创意活动等。
  misconceptions:
    - 表达爱好时直接用原形，如“My hobby is play basketball”而非playing/to play。
    - 把like doing误写成like to doing，如“I like to swimming”。
    - 混淆“hobby”和“habit”，将日常习惯当成爱好，如“My hobby is sleeping early”。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:爱护眼睛和牙齿
  type: Concept
  subject: 英语
  title: 爱护眼睛和牙齿
  conceptType: 概念型
  aliases:
    - 护眼护齿
  category: 概念
  explanation: 保护眼睛要少看手机和电视，让眼睛多休息；保护牙齿要少吃糖，每天刷牙两次。这些都是重要的健康习惯。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C4/sections/S2.md
- id: concept:英语:父亲节
  type: Concept
  subject: 英语
  title: 父亲节
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将父亲节日期记成六月的第二个星期日，实际是第三个星期日。
    - 能指出并纠正这一错误：误以为父亲节是中国的传统节日，实际源自美国。
  aliases:
    - Father's Day
  category: 文化
  explanation: 美国节日，在六月的第三个星期日，孩子们向父亲表达爱意。
  misconceptions:
    - 将父亲节日期记成六月的第二个星期日，实际是第三个星期日。
    - 误以为父亲节是中国的传统节日，实际源自美国。
    - 拼写时写成Fathers' Day，遗漏所有格符号，正确为Father's Day。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:物主代词
  type: Concept
  subject: 英语
  title: 物主代词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：名词性物主代词后加名词，如“This is mine book.”应为“my book”。
    - 能指出并纠正这一错误：形容词性物主代词单独使用，如“Whose pen? — It's my.”应为“mine”。
  aliases:
    - 所有格代词
  category: 语法
  explanation: 表示所有关系的代词，分为形容词性物主代词（my, your, his, her, its, our,
    their）和名词性物主代词（mine, yours, his, hers, its, ours,
    theirs）。名词性物主代词可独立使用，相当于“形容词性物主代词+名词”。
  misconceptions:
    - 名词性物主代词后加名词，如“This is mine book.”应为“my book”。
    - 形容词性物主代词单独使用，如“Whose pen? — It's my.”应为“mine”。
    - 混淆 its 和 it's，如“The dog wagged it's tail.”应为“its”。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C3/sections/S1.md
- id: concept:英语:特殊生日
  type: Concept
  subject: 英语
  title: 特殊生日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为莎士比亚生日是 4 月 26 日，实际是 4 月 23 日。
    - 能指出并纠正这一错误：认为特殊生日就是自己的生日，而不知道是纪念日。
  aliases:
    - special birthdays
  category: 文化
  explanation: 一些特殊人物的生日被定为纪念日，如莎士比亚生日为英语日。
  misconceptions:
    - 误以为莎士比亚生日是 4 月 26 日，实际是 4 月 23 日。
    - 认为特殊生日就是自己的生日，而不知道是纪念日。
    - 把英语日当成某个节日，但不记得莎士比亚生日。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C10/sections/S1.md
- id: concept:英语:特殊疑问句
  type: Concept
  subject: 英语
  title: 特殊疑问句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：特殊疑问句用陈述语序，如“Where you are going?”应为“Where are y…
    - 能指出并纠正这一错误：对主语提问时误加助动词do，如“Who did call you?”应为“Who called …
  aliases:
    - wh-questions
  category: 语法
  explanation: 以疑问词（如where, what, who, how等）开头的疑问句，用于询问具体信息。
  misconceptions:
    - 特殊疑问句用陈述语序，如“Where you are going?”应为“Where are you going?”
    - 对主语提问时误加助动词do，如“Who did call you?”应为“Who called you?”
    - 疑问词与助动词位置颠倒，如“What you did?”应为“What did you do?”
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C11/sections/S1.md
- id: concept:英语:特殊疑问句 How many
  type: Concept
  subject: 英语
  title: 特殊疑问句 How many
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：How many后接单数名词，如How many book do you have?
    - 能指出并纠正这一错误：误用How much询问可数名词，如How much apples are there?
  aliases: []
  category: 语法
  explanation: How many 用于询问可数名词的数量，后接复数名词，如 How many ducks does my uncle have?
  misconceptions:
    - How many后接单数名词，如How many book do you have?
    - 误用How much询问可数名词，如How much apples are there?
    - 助动词与主语单复数不一致，如How many ducks do your uncle have?
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C3/sections/S2.md
- id: concept:英语:特殊疑问句 What colour is/are...?
