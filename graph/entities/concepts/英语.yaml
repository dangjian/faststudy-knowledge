  title: 元音字母组合发音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为ai组合读/aɪ/，将rain读作/raɪn/，正确为/reɪn/。
    - 能指出并纠正这一错误：把walk中al读成/æl/，如/wælk/，实际应为/wɔːk/。
  aliases: []
  category: 语音
  explanation: 字母组合a, ai, ay, al, aw的发音规则，如game /eɪ/, fat /æ/, rain /eɪ/, way
    /eɪ/, walk /ɔː/, draw /ɔː/。
  misconceptions:
    - 误以为ai组合读/aɪ/，将rain读作/raɪn/，正确为/reɪn/。
    - 把walk中al读成/æl/，如/wælk/，实际应为/wɔːk/。
    - 把a在开音节game中读成/æ/，如/gæm/，正确为/eɪ/。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C1/sections/S1.md
- id: concept:英语:元音字母组合的发音
  type: Concept
  subject: 英语
  title: 元音字母组合的发音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把ar组合读成带卷舌的/ɑːr/，如把car读成/kɑːr/（英式应为/kɑː/）。
    - 能指出并纠正这一错误：把er/ir/ur组合读成/e/或/ə/，如把bird读成/bed/或/bərd/。
  aliases: []
  category: 语音
  explanation: ar, er, ir, or, ur在单词中的发音规则，如ar发/ɑː/，er/ir/ur发/ɜː/，or发/ɔː/。
  misconceptions:
    - 把ar组合读成带卷舌的/ɑːr/，如把car读成/kɑːr/（英式应为/kɑː/）。
    - 把er/ir/ur组合读成/e/或/ə/，如把bird读成/bed/或/bərd/。
    - 忽略or在w后发/ɜː/的规则，把work读成/wɔːk/。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C6/sections/S1.md
- id: concept:英语:元音音标
  type: Concept
  subject: 英语
  title: 元音音标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把双元音/eɪ/发成单元音/e/，如把'name'读成/nem/，没有滑向/ɪ/。
    - 能指出并纠正这一错误：混淆/ɪə/与/eə/，把'ear'读成/eə/或把'air'读成/ɪə/。
  aliases: []
  category: 语音
  explanation: 本单元学习双元音 /eɪ/, /aɪ/, /ɔɪ/, /əʊ/, /aʊ/, /ɪə/, /eə/, /ʊə/ 的发音。
  misconceptions:
    - 把双元音/eɪ/发成单元音/e/，如把'name'读成/nem/，没有滑向/ɪ/。
    - 混淆/ɪə/与/eə/，把'ear'读成/eə/或把'air'读成/ɪə/。
    - 读/aʊ/时滑动不足，只发/a/，把'now'读成/nɑː/。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C7/sections/S1.md
- id: concept:英语:元音音素 /ɔː/ /ɒ/ /uː/ /ʊ/
  type: Concept
  subject: 英语
  title: 元音音素 /ɔː/ /ɒ/ /uː/ /ʊ/
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为 pool 和 look 中的 oo 发音相同，都是 /uː/
    - 能指出并纠正这一错误：把 fox 中的 o 读成 /əʊ/，与 home 混淆
  aliases:
    - 元音发音
  category: 语音
  explanation: 英语中的四个元音音素，分别对应不同单词的发音，如 sport, fox, pool, look。
  misconceptions:
    - 认为 pool 和 look 中的 oo 发音相同，都是 /uː/
    - 把 fox 中的 o 读成 /əʊ/，与 home 混淆
    - 分不清 /ɒ/ 和 /ɔː/，把 dog 读成 /dɔːg/
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C6/sections/S1.md
- id: concept:英语:元音音素/iː/, /ɪ/, /e/, /æ/
  type: Concept
  subject: 英语
  title: 元音音素/iː/, /ɪ/, /e/, /æ/
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：长短音不分：把 sheep /iː/ 读成 ship /ɪ/，意思变成羊/船
    - 能指出并纠正这一错误：把 /e/ 和 /æ/ 混淆：bed 读成 bad，单词意思改变
  aliases:
    - 元音发音
  category: 语音
  explanation: 学习四个元音音素的发音，并区分长短音。
  misconceptions:
    - 长短音不分：把 sheep /iː/ 读成 ship /ɪ/，意思变成羊/船
    - 把 /e/ 和 /æ/ 混淆：bed 读成 bad，单词意思改变
    - 把 /iː/ 读成短音 /ɪ/：seat 读成 sit
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C4/sections/S1.md
- id: concept:英语:元音音素/juː/
  type: Concept
  subject: 英语
  title: 元音音素/juː/
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有含u的单词都发/juː/，如把bus读成/bjuːs/。
    - 能指出并纠正这一错误：将cute中的u读成/ʌ/，导致与cut发音混淆。
  aliases: []
  category: 语音
  explanation: 字母u在单词中常发/juː/音，如use, cute。
  misconceptions:
    - 认为所有含u的单词都发/juː/，如把bus读成/bjuːs/。
    - 将cute中的u读成/ʌ/，导致与cut发音混淆。
    - 把/juː/和/uː/混为一谈，将ruler中的u也读成/juː/。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C5/sections/S1.md
- id: concept:英语:元音音素/uː/
  type: Concept
  subject: 英语
  title: 元音音素/uː/
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为oo组合一律发/uː/，将good读成/guːd/。
    - 能指出并纠正这一错误：混淆/uː/和/ʊ/，把foot误读为/fuːt/。
  aliases: []
  category: 语音
  explanation: 字母组合oo或u有时发/uː/音，如true, ruler。
  misconceptions:
    - 认为oo组合一律发/uː/，将good读成/guːd/。
    - 混淆/uː/和/ʊ/，把foot误读为/fuːt/。
    - 将rule中的u误读为/juː/，实际应为/uː/。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C5/sections/S1.md
- id: concept:英语:元音音素/ʌ/
  type: Concept
  subject: 英语
  title: 元音音素/ʌ/
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把cut中的u读成/juː/，导致与cute同音。
    - 能指出并纠正这一错误：将run读成/ruːn/，误以为u在闭音节中发/uː/。
  aliases: []
  category: 语音
  explanation: 字母u有时发/ʌ/音，如run, cut。
  misconceptions:
    - 把cut中的u读成/juː/，导致与cute同音。
    - 将run读成/ruːn/，误以为u在闭音节中发/uː/。
    - 认为字母u在闭音节中一律发/ʌ/，忽略put中发/ʊ/。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C5/sections/S1.md
- id: concept:英语:关系代词that/which/who
  type: Concept
  subject: 英语
  title: 关系代词that/which/who
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用which指人，如This is the teacher which teaches us，应…
    - 能指出并纠正这一错误：用who指物，如I like the book who is interesting，应为whi…
  aliases: []
  category: 语法
  explanation: that可指人或物，which指物，who指人，在定语从句中作主语或宾语。
  misconceptions:
    - 用which指人，如This is the teacher which teaches us，应为who/that。
    - 用who指物，如I like the book who is interesting，应为which/that。
    - 认为that不能指人，实际that指人指物均可。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C9/sections/S1.md
- id: concept:英语:关系副词 where 引导的定语从句
  type: Concept
  subject: 英语
  title: 关系副词 where 引导的定语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误用 where 代替 which，如 This is the house where I vi…
    - 能指出并纠正这一错误：where 与介词重复，如 the room in where we live。
  aliases:
    - where 定语从句
    - 关系副词 where 引导定语从句
  category: 语法
  explanation: where 在定语从句中作地点状语，修饰表示地点的先行词。
  misconceptions:
    - 误用 where 代替 which，如 This is the house where I visited。
    - where 与介词重复，如 the room in where we live。
    - 先行词是时间或原因，误用 where，如 I remember the day where we met。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:写建议便条
  type: Concept
  subject: 英语
  title: 写建议便条
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 给同学写建议便条时，先写称呼，点出对方遇到的问题，再分条列出建议，最后署名，语气要友好。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C7/sections/S3.md
- id: concept:英语:写建议信
  type: Concept
  subject: 英语
  title: 写建议信
  conceptType: 程序型
  aliases:
    - 建议信
  category: 方法
  explanation: 建议信先写称呼和写信目的，再分条列出自己的建议，最后礼貌收尾，如 Dear Editor... Here are my ideas.
    Sincerely...。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C6/sections/S3.md
- id: concept:英语:写旅游评论
  type: Concept
  subject: 英语
  title: 写旅游评论
  conceptType: 程序型
  aliases:
    - travel review
  category: 方法
  explanation: 写旅游评论时，先写题目和开头句，再写自己看到了什么、做了什么、感受如何，最后总结并推荐给大家。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C1/sections/S3.md
- id: concept:英语:农场动物词汇
  type: Concept
  subject: 英语
  title: 农场动物词汇
  conceptType: 概念型
  aliases:
    - 农场动物
  category: 概念
  explanation: 常见农场动物的英文名称：cow（奶牛）、horse（马）、sheep（绵羊）、pig（猪）、chicken（鸡）。注意 sheep 单复数同形。
  sourceRef: content/四年级/下册/英语/PEP-4-2-English/chapters/C5/sections/S1.md
- id: concept:英语:农场劳作表达
  type: Concept
  subject: 英语
  title: 农场劳作表达
  conceptType: 概念型
  aliases:
    - 农场劳动短语
  category: 概念
  explanation: 农场劳动的动词短语：plant（种植）、water（浇水）、pick（采摘）、feed（喂养）、milk（挤奶），如 water
    the carrots、feed the chickens。这些短语能说清农民做了什么。
  sourceRef: content/四年级/下册/英语/PEP-4-2-English/chapters/C6/sections/S1.md
- id: concept:英语:初中回忆
  type: Concept
  subject: 英语
  title: 初中回忆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：描述过去初中生活用一般现在时，如 We are very happy then。
    - 能指出并纠正这一错误：混淆 remember doing 和 remember to do，如 I remember …
  aliases:
    - junior high school memories
  category: 话题
  explanation: 本课讨论的关于初中生活的记忆和感受。
  misconceptions:
    - 描述过去初中生活用一般现在时，如 We are very happy then。
    - 混淆 remember doing 和 remember to do，如 I remember to meet him in Grade 7。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:制定周末计划
  type: Concept
  subject: 英语
  title: 制定周末计划
  conceptType: 应用型
  aliases:
    - 周末计划
  category: 方法
  explanation: 做周末计划时可以写清楚：去哪里（place）、什么时间做什么（time and activities）、天气如何、要遵守的规则、要带的东西和要穿的衣服。
  sourceRef: content/四年级/下册/英语/PEP-4-2-English/chapters/C7/sections/S4.md
- id: concept:英语:制定消费计划
  type: Concept
  subject: 英语
  title: 制定消费计划
  conceptType: 程序型
  aliases:
    - spending plan
  category: 方法
  explanation: 花钱前先想一想：现在需要吗、贵不贵、钱够不够，把要买的东西列成消费计划，学会攒钱等降价。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C4/sections/S2.md
- id: concept:英语:前缀和后缀
  type: Concept
  subject: 英语
  title: 前缀和后缀
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为 un- 和 in- 可随意互换，把 unhappy 写成 inhappy。
    - 能指出并纠正这一错误：混淆后缀 -ful 和 -less，把 careless 当成'仔细的'（实为'粗心的'）。
  aliases:
    - prefixes and suffixes
  category: 词汇
  explanation: 前缀和后缀是构词法的一部分，前缀加在词根前，后缀加在词根后，改变词义或词性。
  misconceptions:
    - 认为 un- 和 in- 可随意互换，把 unhappy 写成 inhappy。
    - 混淆后缀 -ful 和 -less，把 careless 当成'仔细的'（实为'粗心的'）。
    - 拼写派生词时漏字母，如 disappear 写成 disapear。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:副词比较级
  type: Concept
  subject: 英语
  title: 副词比较级
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把quickly的比较级写成quicklier，应为more quickly
    - 能指出并纠正这一错误：不规则副词比较级记错，如认为well的比较级是gooder
  aliases: []
  category: 语法
  explanation: 用于比较动作方式，规则变化加-er或more，如faster, more quickly。
  misconceptions:
    - 把quickly的比较级写成quicklier，应为more quickly
    - 不规则副词比较级记错，如认为well的比较级是gooder
    - 用more+副词原级时误加-er，如more faster
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C3/sections/S1.md
- id: concept:英语:副词比较级和最高级
  type: Concept
  subject: 英语
  title: 副词比较级和最高级
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：副词比较级错误加er，如把more quickly写成quickerly。
    - 能指出并纠正这一错误：混淆good和well的比较级，把well的比较级误写成gooder。
  aliases: []
  category: 语法
  explanation: 用于比较动作方式，如farthest, closer等。
  misconceptions:
    - 副词比较级错误加er，如把more quickly写成quickerly。
    - 混淆good和well的比较级，把well的比较级误写成gooder。
    - 用更短形式比较，如“run more fast”而不是faster。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:动名词
  type: Concept
  subject: 英语
  title: 动名词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：动名词作主语时谓语动词用复数，如 Reading books are fun。
    - 能指出并纠正这一错误：对动名词进行否定时误加 to，如 I enjoy not to do homework。
  aliases:
    - Gerund
  category: 语法
  explanation: 动名词由动词+ing构成，具有名词性质，在句中可作主语、宾语等。
  misconceptions:
    - 动名词作主语时谓语动词用复数，如 Reading books are fun。
    - 对动名词进行否定时误加 to，如 I enjoy not to do homework。
    - 把 go doing 误写成 go to do，如 go to swim 而应为 go swimming。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:动名词作主语
  type: Concept
  subject: 英语
  title: 动名词作主语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用动词原形作主语，如“Read is fun”而非“Reading is fun”。
    - 能指出并纠正这一错误：动名词作主语时谓语动词误用复数，如“Swimming are good”。
  aliases:
    - gerund as subject
  category: 语法
  explanation: 动名词（动词-ing形式）可以作为句子的主语，表示一种习惯或活动。例如：Reading or listening to music
    can help us to calm down.
  misconceptions:
    - 用动词原形作主语，如“Read is fun”而非“Reading is fun”。
    - 动名词作主语时谓语动词误用复数，如“Swimming are good”。
    - 将“Playing games is fun”误写成“Play games is fun”。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:动名词作宾语
  type: Concept
  subject: 英语
  title: 动名词作宾语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：enjoy后误接不定式，如“enjoy to play basketball”，应为enjoy …
    - 能指出并纠正这一错误：动名词误用为动词原形，如“enjoy play basketball”，漏掉ing。
  aliases: []
  category: 语法
  explanation: 动名词（动词-ing形式）在句中作宾语，表示习惯性动作或一般性行为。
  misconceptions:
    - enjoy后误接不定式，如“enjoy to play basketball”，应为enjoy playing。
    - 动名词误用为动词原形，如“enjoy play basketball”，漏掉ing。
    - 形式变化错误，如“runing”，正确为running。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C1/sections/S1.md
- id: concept:英语:动物名词
  type: Concept
  subject: 英语
  title: 动物名词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把penguin拼成pengiun，漏掉字母u
    - 能指出并纠正这一错误：将shark当形容词用，写成a shark fish
  aliases: []
  category: 词汇
  explanation: 本课涉及的动物词汇，如elephant, penguin, shark等。
  misconceptions:
    - 把penguin拼成pengiun，漏掉字母u
    - 将shark当形容词用，写成a shark fish
    - 用horse指代海马，应为seahorse
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C1/sections/S2.md
- id: concept:英语:动词-ing形式作主语
  type: Concept
  subject: 英语
  title: 动词-ing形式作主语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把动名词主语写成动词原形，如 Play tennis is fun。
    - 能指出并纠正这一错误：动名词作主语时谓语用复数，如 Collecting stamps are my hobby。
  aliases:
    - 动名词作主语
  category: 语法
  explanation: 动词-ing形式（动名词）可在句中作主语，表示一般性动作。
  misconceptions:
    - 把动名词主语写成动词原形，如 Play tennis is fun。
    - 动名词作主语时谓语用复数，如 Collecting stamps are my hobby。
    - 混淆动名词和不定式作主语，如 It is no use to cry over spilt milk。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:动词-ing形式短语作后置定语
  type: Concept
  subject: 英语
  title: 动词-ing形式短语作后置定语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误用动词原形作定语，如 the boy run over there。
    - 能指出并纠正这一错误：分不清主动被动，将 the girl singing 误写成 the girl sung。
  aliases: []
  category: 语法
  explanation: 动词-ing形式短语可放在名词后作定语，修饰名词。
  misconceptions:
    - 误用动词原形作定语，如 the boy run over there。
    - 分不清主动被动，将 the girl singing 误写成 the girl sung。
    - 后置定语放错位置，如 running the boy 而不是 the boy running。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:动词-ing形式短语作表语
  type: Concept
  subject: 英语
  title: 动词-ing形式短语作表语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：表语用动词原形，如 My hobby is play chess。
    - 能指出并纠正这一错误：混淆现在分词表语和进行时，如 The story is interesting 误写成 The …
  aliases: []
  category: 语法
  explanation: 动词-ing形式短语可以在句中作表语，说明主语的内容。
  misconceptions:
    - 表语用动词原形，如 My hobby is play chess。
    - 混淆现在分词表语和进行时，如 The story is interesting 误写成 The story is interested。
    - 动名词作表语时忘了加ing，如 Seeing is believe。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:动词不定式
  type: Concept
  subject: 英语
  title: 动词不定式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把不定式误用为动词原形，如 want go home 漏掉 to，受情态动词后接动词原形影响。
    - 能指出并纠正这一错误：目的状语从句中误用 for+动词原形，如 I came here for see you，sho…
  aliases:
    - infinitive
  category: 语法
  explanation: 动词不定式由to+动词原形构成，可作目的、结果等状语。
  misconceptions:
    - 把不定式误用为动词原形，如 want go home 漏掉 to，受情态动词后接动词原形影响。
    - 目的状语从句中误用 for+动词原形，如 I came here for see you，should be to see you。
    - 将不定式误当名词，如 My job is teach English，漏掉 is 后的 to，写成 My job is teach English。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:动词不定式的否定式
  type: Concept
  subject: 英语
  title: 动词不定式的否定式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把not放在to后面：“He decided to not go.”应为“not to go”
    - 能指出并纠正这一错误：用don't代替not：“Please don't to smoke.”应为“not to sm…
  aliases: []
  category: 语法
  explanation: 动词不定式的否定形式由'not+动词不定式'构成。
  misconceptions:
    - 把not放在to后面：“He decided to not go.”应为“not to go”
    - 用don't代替not：“Please don't to smoke.”应为“not to smoke”
    - 漏掉to：“He wants not go.”应为“not to go”
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:动词不定式表目的
  type: Concept
  subject: 英语
  title: 动词不定式表目的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用for+原形表目的，如“He started programming for help peo…
    - 能指出并纠正这一错误：误用so that+原形，如“I study so that get high scores”缺…
  aliases:
    - infinitive of purpose
  category: 语法
  explanation: 动词不定式（to + 动词原形）可以用来表示目的，回答“为什么”的问题。例如：He started programming to help people.
  misconceptions:
    - 用for+原形表目的，如“He started programming for help people”。
    - 误用so that+原形，如“I study so that get high scores”缺主语。
    - 目的状语和结果状语混淆，如“He worked hard to fail”误当目的。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:动词不规则变化
  type: Concept
  subject: 英语
  title: 动词不规则变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆lie（躺）和lay（放置），把lie的过去式写成lied，应为lay
    - 能指出并纠正这一错误：ring的过去式写成rung，应为rang，过去分词写成rang，应为rung
  aliases: []
  category: 语法
  explanation: 动词的过去式和过去分词形式不规则，如 ring-rang-rung, lie-lay-lain。
  misconceptions:
    - 混淆lie（躺）和lay（放置），把lie的过去式写成lied，应为lay
    - ring的过去式写成rung，应为rang，过去分词写成rang，应为rung
    - 把come的过去分词写成came，应为come
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:动词原形
  type: Concept
  subject: 英语
  title: 动词原形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：情态动词后动词误用三单，如she can sings
    - 能指出并纠正这一错误：动词原形与不定式混淆，如want play
  aliases: []
  category: 语法
  explanation: 动词的基本形式，用于情态动词后或不定式等。
  misconceptions:
    - 情态动词后动词误用三单，如she can sings
    - 动词原形与不定式混淆，如want play
    - 介词后误用动词原形而不用-ing
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C12/sections/S1.md
- id: concept:英语:动词后接不定式或动名词的用法
  type: Concept
  subject: 英语
  title: 动词后接不定式或动名词的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：enjoy后误接不定式，如“I enjoy to play basketball”而非doing…
    - 能指出并纠正这一错误：want/hope后误接动名词，如“I want going home”而非to go。
  aliases:
    - verb + infinitive/gerund
  category: 语法
  explanation: 某些动词后接不定式（如decide, want, hope），某些动词后接动名词（如enjoy,
    finish），有些动词两者皆可但意义不同。本单元重点练习不定式。
  misconceptions:
    - enjoy后误接不定式，如“I enjoy to play basketball”而非doing。
    - want/hope后误接动名词，如“I want going home”而非to go。
    - 认为所有动词后接不定式和动名词都完全一样，忽略like等词含义差异。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:动词搭配
  type: Concept
  subject: 英语
  title: 动词搭配
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将hit的主语写成被动，如The earthquake was hit the city。
    - 能指出并纠正这一错误：用attack替换hit表示地震袭击，如The earthquake attacked the …
  aliases:
    - collocations
  category: 词汇用法
  explanation: 某些动词与特定名词搭配使用，如hit与earthquake搭配，表示“地震袭击”。
  misconceptions:
    - 将hit的主语写成被动，如The earthquake was hit the city。
    - 用attack替换hit表示地震袭击，如The earthquake attacked the city。
    - 把hit与happen混淆，写出The earthquake happened the city。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C5/sections/S2.md
- id: concept:英语:动词短语
  type: Concept
  subject: 英语
  title: 动词短语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：add salt into the soup 误用 into，正确搭配是 add salt to…
    - 能指出并纠正这一错误：pour the water the glass 漏掉 into，写成 pour the wat…
  aliases:
    - phrasal verbs
  category: 词汇
  explanation: 由动词加介词或副词构成的短语，如add...to, pour...into等，常用于描述烹饪过程。
  misconceptions:
    - add salt into the soup 误用 into，正确搭配是 add salt to the soup
    - pour the water the glass 漏掉 into，写成 pour the water the glass
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S3.md
- id: concept:英语:动词第三人称单数形式
  type: Concept
  subject: 英语
  title: 动词第三人称单数形式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：主语是he/she/it时，仍用动词原形，如写He like apples。
    - 能指出并纠正这一错误：把have三单写成have，正确应是has，如She have a pen。
  aliases:
    - 三单形式
  category: 语法
  explanation: 一般现在时中，主语为第三人称单数时，动词需加-s或-es。
  misconceptions:
    - 主语是he/she/it时，仍用动词原形，如写He like apples。
    - 把have三单写成have，正确应是has，如She have a pen。
    - 动词以辅音字母+y结尾时把y改i再加es，如study写成studys。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S2.md
- id: concept:英语:动词过去分词
  type: Concept
  subject: 英语
  title: 动词过去分词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把不规则动词过去式当过去分词，如用went构成完成时：He has went to Beijin…
    - 能指出并纠正这一错误：认为所有动词过去分词都加-ed，写出buyed、catched等错误形式。
  aliases:
    - 过去分词
  category: 语法
  explanation: 规则动词加-ed，不规则动词需特殊记忆，用于构成完成时态。
  misconceptions:
    - 把不规则动词过去式当过去分词，如用went构成完成时：He has went to Beijing。
    - 认为所有动词过去分词都加-ed，写出buyed、catched等错误形式。
    - 混淆过去分词与现在分词，用interesting修饰人表示‘感兴趣的’。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:动词过去式
  type: Concept
  subject: 英语
  title: 动词过去式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把不规则动词按规则加-ed，如将go写成goed、take写成taked。
    - 能指出并纠正这一错误：规则动词加-ed时拼写出错，如把stop写成stoped（应双写p），study写成studye…
  aliases:
    - past tense forms
  category: 词汇
  explanation: 规则动词加-ed，不规则动词需特殊记忆，用于一般过去时。
  misconceptions:
    - 把不规则动词按规则加-ed，如将go写成goed、take写成taked。
    - 规则动词加-ed时拼写出错，如把stop写成stoped（应双写p），study写成studyed（应变y为i）。
    - 用过去分词代替过去式，如说I seen it yesterday，而正确应为saw。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C1/sections/S3.md
- id: concept:英语:助动词do/does
  type: Concept
  subject: 英语
  title: 助动词do/does
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：主语是第三人称单数时用do，如Does he like? 错写成Do he like?
    - 能指出并纠正这一错误：does后动词仍用三单形式，如She does likes music。
  aliases:
    - do/does
  category: 语法
  explanation: 用于构成一般现在时的疑问句和否定句，does用于第三人称单数。
  misconceptions:
    - 主语是第三人称单数时用do，如Does he like? 错写成Do he like?
    - does后动词仍用三单形式，如She does likes music。
    - 否定句中用doesn't后加动词原形，却写成doesn't likes。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S2.md
- id: concept:英语:助动词do强调
  type: Concept
  subject: 英语
  title: 助动词do强调
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：助动词后动词忘了还原，如 She does likes apples。
    - 能指出并纠正这一错误：与实义动词do混淆，如 He did did his homework。
  aliases:
    - 强调句
  category: 语法
  explanation: 用助动词do/does/did对谓语动词进行强调，构成强调句。
  misconceptions:
    - 助动词后动词忘了还原，如 She does likes apples。
    - 与实义动词do混淆，如 He did did his homework。
    - 时态不一致，如 I did went to school yesterday。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:劳逸平衡
  type: Concept
  subject: 英语
  title: 劳逸平衡
  conceptType: 概念型
  aliases:
    - work-play balance
    - 工作与玩耍的平衡
  category: 观点
  explanation: 学习和玩耍要安排得当：既要认真完成作业，也要锻炼身体、好好休息、陪伴家人，做到 work-play balance。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C3/sections/S3.md
- id: concept:英语:区分好习惯和坏习惯
  type: Concept
  subject: 英语
  title: 区分好习惯和坏习惯
  conceptType: 概念型
  aliases: []
  category: 方法
  explanation: 每天吃三顿饭、多喝水、坚持锻炼、睡够觉是好习惯；经常玩手机、吃太多糖、睡不够是坏习惯。要学会分辨自己的习惯，把坏习惯改掉。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C4/sections/S3.md
- id: concept:英语:区分需要和想要
  type: Concept
  subject: 英语
  title: 区分需要和想要
  conceptType: 概念型
  aliases:
    - need 和 want
  category: 句型
  explanation: 需要（need）是必须买的东西，想要（want）是希望拥有的东西。花钱时先满足需要，再考虑想要。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C4/sections/S2.md
- id: concept:英语:升调与降调
  type: Concept
  subject: 英语
  title: 升调与降调
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：陈述句末尾用升调，听起来像疑问句
    - 能指出并纠正这一错误：特殊疑问句用升调，如What's your name?读成升调
  aliases:
    - 语调
  category: 语音
  explanation: 一般疑问句用升调，陈述句和特殊疑问句用降调，用于表达语气。
  misconceptions:
    - 陈述句末尾用升调，听起来像疑问句
    - 特殊疑问句用升调，如What's your name?读成升调
    - 一般疑问句用降调，如Are you a student?读成降调
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C11/sections/S1.md
- id: concept:英语:印度习俗
  type: Concept
  subject: 英语
  title: 印度习俗
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为印度人用左手吃饭，实际右手是吃饭用手，左手不洁。
    - 能指出并纠正这一错误：把合十礼写成‘双手合十’但误认为需要弯腰触地，或混淆为握手礼。
  aliases:
    - Indian customs
  category: 文化
  explanation: 印度有特殊的问候方式（合十礼）、用餐习惯（用右手吃饭）和饮食禁忌（不吃牛肉）。
  misconceptions:
    - 误以为印度人用左手吃饭，实际右手是吃饭用手，左手不洁。
    - 把合十礼写成‘双手合十’但误认为需要弯腰触地，或混淆为握手礼。
    - 认为印度不吃牛肉是因为宗教禁忌，但误写成‘不吃猪肉’。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C6/sections/S1.md
- id: concept:英语:原因状语从句
  type: Concept
  subject: 英语
  title: 原因状语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：because和so同时用于一个句子，如Because he was ill, so he di…
    - 能指出并纠正这一错误：将because of后接整句，如because of it rained
  aliases: []
  category: 语法
  explanation: 用because引导原因状语从句回答why提问，如'Because they're clever and funny.'
  misconceptions:
    - because和so同时用于一个句子，如Because he was ill, so he didn't come.
    - 将because of后接整句，如because of it rained
    - 回答why时用so，如Why? So it's funny.
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C1/sections/S1.md
- id: concept:英语:双重否定
  type: Concept
  subject: 英语
  title: 双重否定
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 never...without 按字面直译，如 He never goes out with…
    - 能指出并纠正这一错误：双重否定误当成否定，如 I don't know nothing 以为是否定。
  aliases:
    - 双重否定表肯定
  category: 语法
  explanation: 两个否定词连用表示肯定意义，如 never...without... 表示“一定”。
  misconceptions:
    - 把 never...without 按字面直译，如 He never goes out without umbrella 译成他从不带伞出去。
    - 双重否定误当成否定，如 I don't know nothing 以为是否定。
    - never 与 hardly 等混用，如 He never hardly comes。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:反义词
  type: Concept
  subject: 英语
  title: 反义词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为反义词必须加前缀，把fast的反义词写成unfast
    - 能指出并纠正这一错误：忽略词性，把quickly的反义词写成slow，应为slowly
  aliases:
    - opposites
  category: 词汇
  explanation: 意义相反的词，如fast-slow, tall-short。
  misconceptions:
    - 误以为反义词必须加前缀，把fast的反义词写成unfast
    - 忽略词性，把quickly的反义词写成slow，应为slowly
    - 把意义不相关的词当反义词，如把big的反义词写成tall
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C7/sections/S2.md
- id: concept:英语:反意疑问句
  type: Concept
  subject: 英语
  title: 反意疑问句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：前否定后否定，如 He isn't a teacher, isn't he? 应为 is he。
    - 能指出并纠正这一错误：陈述句有 never/hardly 时，后尾仍用否定，如 He never comes late…
  aliases:
    - tag question
  category: 语法
  explanation: 用于确认信息，结构为陈述句+简短问句。
  misconceptions:
    - 前否定后否定，如 He isn't a teacher, isn't he? 应为 is he。
    - 陈述句有 never/hardly 时，后尾仍用否定，如 He never comes late, doesn't he? 应为 does he。
    - 对 I think+从句反意，误跟主句，如 I think he is right, don't I? 应为 isn't he。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:反身代词
  type: Concept
  subject: 英语
  title: 反身代词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把himself写成hisself，把themselves写成theirselves，属于非标准…
    - 能指出并纠正这一错误：把ourselves写成ourself，把themselves写成themself，漏掉复数形式…
  aliases:
    - reflexive pronouns
  category: 语法
  explanation: 反身代词用于指代句子的主语，如myself, yourself等。
  misconceptions:
    - 把himself写成hisself，把themselves写成theirselves，属于非标准形式。
    - 把ourselves写成ourself，把themselves写成themself，漏掉复数形式。
    - 当you指多个人时仍用yourself，如You should all ask yourself... 应用yourselves。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:发明
  type: Concept
  subject: 英语
  title: 发明
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 invent 与 discover 混淆，说 Columbus invented Ameri…
    - 能指出并纠正这一错误：描述发明用途时用 invented for 代替 used for，如 The phone in…
  aliases:
    - invention
  category: 话题词汇
  explanation: 本单元围绕发明展开，学习描述发明的用途、发明者等信息。
  misconceptions:
    - 把 invent 与 discover 混淆，说 Columbus invented America（应为 discovered）
    - 描述发明用途时用 invented for 代替 used for，如 The phone invented for calling
    - 说 The telephone invented Bell，漏掉 by 或 was，变成主动语态
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:叙述过去事件
  type: Concept
  subject: 英语
  title: 叙述过去事件
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：叙述多个过去事件时一律用过去完成时，如Yesterday I had gone to the p…
    - 能指出并纠正这一错误：时态跳跃，如先一般过去，后现在时，再过去进行，缺乏统一基准。
  aliases:
    - Narrate past events
  category: 语篇
  explanation: 用一般过去时、过去进行时、过去完成时等时态按时间顺序叙述过去发生的事件。
  misconceptions:
    - 叙述多个过去事件时一律用过去完成时，如Yesterday I had gone to the park, had seen a
      bird.，应用一般过去时。
    - 时态跳跃，如先一般过去，后现在时，再过去进行，缺乏统一基准。
    - 没有按时间顺序，先发生的事反而用一般过去时，后发生的用过去完成时。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C12/sections/S1.md
- id: concept:英语:口语中的省略
  type: Concept
  subject: 英语
  title: 口语中的省略
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：正式写作中滥用省略，如 Invite him to the party 缺少主语。
    - 能指出并纠正这一错误：省略后动词形式错，如 Want some water? 误写成 Wants some water…
  aliases:
    - 省略
  category: 语法
  explanation: 在口语和非正式场合，可省略主语、介词等，使语言简洁。
  misconceptions:
    - 正式写作中滥用省略，如 Invite him to the party 缺少主语。
    - 省略后动词形式错，如 Want some water? 误写成 Wants some water?
    - 省略介词导致短语错误，如 I am looking forward your reply 漏掉 to。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:句子重读
  type: Concept
  subject: 英语
  title: 句子重读
  conceptType: 概念型
  aliases:
    - 句子重音
  category: 法则
  explanation: 说句子时，重要的词要读得重一些、慢一些，如 It's NOT SAFE. 小词像 a、is 通常读得轻而快。
  sourceRef: content/四年级/下册/英语/PEP-4-2-English/chapters/C12/sections/S1.md
- id: concept:英语:可数与不可数名词兼类
  type: Concept
  subject: 英语
  title: 可数与不可数名词兼类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘two chickens’理解为‘两只鸡肉’，实际该形式表示‘两只小鸡’
    - 能指出并纠正这一错误：误认为‘room’作不可数时意为‘房间’，如‘no room’被译作‘没有房间’
  aliases:
    - countable and uncountable nouns
  category: 语法
  explanation: 有些名词既可作可数名词也可作不可数名词，意义不同。
  misconceptions:
    - 把‘two chickens’理解为‘两只鸡肉’，实际该形式表示‘两只小鸡’
    - 误认为‘room’作不可数时意为‘房间’，如‘no room’被译作‘没有房间’
    - 将‘a paper’当作‘一张纸’，但在学生常见语境中多指‘一篇论文/一份报纸’
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C4/sections/S2.md
- id: concept:英语:可数名词
  type: Concept
  subject: 英语
  title: 可数名词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将复数形式拼错，如以辅音字母+y结尾的单词把city写成复数citys
    - 能指出并纠正这一错误：不规则复数按规则变化，如儿童写成childs而不是children
  aliases:
    - countable nouns
  category: 语法
  explanation: 可数名词有单复数形式，可以用数词或a/an修饰。
  misconceptions:
    - 将复数形式拼错，如以辅音字母+y结尾的单词把city写成复数citys
    - 不规则复数按规则变化，如儿童写成childs而不是children
    - 用量词much修饰可数名词复数，如much books（应为many books）
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C4/sections/S2.md
- id: concept:英语:可数名词与不可数名词
  type: Concept
  subject: 英语
  title: 可数名词与不可数名词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：给不可数名词加复数，如“two breads” 应为“two pieces of bread”
    - 能指出并纠正这一错误：给不可数名词加不定冠词，如“a water” 应为“a glass of water”
  aliases:
    - countable and uncountable nouns
  category: 语法
  explanation: 可数名词有单复数形式，不可数名词没有复数形式，且不能与不定冠词连用。
  misconceptions:
    - 给不可数名词加复数，如“two breads” 应为“two pieces of bread”
    - 给不可数名词加不定冠词，如“a water” 应为“a glass of water”
    - 把不可数名词当可数，如“many homeworks” 应为“much homework”
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C5/sections/S1.md
- id: concept:英语:合成法
  type: Concept
  subject: 英语
  title: 合成法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：合成词复数变化错，如 passer-bys 而应为 passers-by。
    - 能指出并纠正这一错误：合成词中间多空格，如 class room 而不是 classroom。
  aliases:
    - 复合词
  category: 词汇
  explanation: 由两个或两个以上的词合成一个新词，如classroom, blackboard等。
  misconceptions:
    - 合成词复数变化错，如 passer-bys 而应为 passers-by。
    - 合成词中间多空格，如 class room 而不是 classroom。
    - 名词+名词合成时用复数，如 teethbrush 而应为 toothbrush。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:名词单复数
  type: Concept
  subject: 英语
  title: 名词单复数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：复数名词忘加-s，如There are many book on the desk.。
    - 能指出并纠正这一错误：主语是复数时be动词用错，如Those student is my classmates.。
  aliases: []
  category: 语法
  explanation: 名词有单数和复数形式，be 动词和代词需与之匹配。
  misconceptions:
    - 复数名词忘加-s，如There are many book on the desk.。
    - 主语是复数时be动词用错，如Those student is my classmates.。
    - 把不规则复数写成加-s形式，如I see two sheeps on the hill.。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C2/sections/S2.md
- id: concept:英语:名词后缀 -ance, -(t)ion, -ness, -ity
  type: Concept
  subject: 英语
  title: 名词后缀 -ance, -(t)ion, -ness, -ity
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把describe变名词写成describtion，正确是description。
    - 能指出并纠正这一错误：误认为所有形容词加-ness变名词，如把true写成trueness（应为truth）。
  aliases:
    - 名词化后缀
  category: 语法
  explanation: 这些后缀可以加在动词或形容词后构成名词，表示状态、性质或动作的结果。
  misconceptions:
    - 把describe变名词写成describtion，正确是description。
    - 误认为所有形容词加-ness变名词，如把true写成trueness（应为truth）。
    - 混淆-ance和-ence，把dependence误写成dependance。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C4/sections/S3.md
- id: concept:英语:名词复数
  type: Concept
  subject: 英语
  title: 名词复数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以元音字母+y结尾的词也变ies，如把boy写成boies
    - 能指出并纠正这一错误：不规则复数直接加s，如把child写成childs
  aliases:
    - 复数形式
  category: 语法
  explanation: 英语名词变复数的规则，包括规则变化和不规则变化。
  misconceptions:
    - 以元音字母+y结尾的词也变ies，如把boy写成boies
    - 不规则复数直接加s，如把child写成childs
    - 认为sheep和fish永远有复数形式，写出sheeps或fishes（表示不同种类时fishes才正确）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:名词复数规则
  type: Concept
  subject: 英语
  title: 名词复数规则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把cats的复数词尾s读成/z/，正确应为/s/。
    - 能指出并纠正这一错误：把以s结尾的box直接加s写成boxs，应为boxes。
  aliases: []
  category: 语音/语法
  explanation: 名词复数词尾-(e)s的发音规则，如sharks, lions, boxes, cats等。
  misconceptions:
    - 把cats的复数词尾s读成/z/，正确应为/s/。
    - 把以s结尾的box直接加s写成boxs，应为boxes。
    - 把不规则复数man写成mans，应为men。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C1/sections/S1.md
- id: concept:英语:名词性物主代词的用法
  type: Concept
  subject: 英语
  title: 名词性物主代词的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把mine当作形容词修饰名词，写出'This is mine book'，应为'my book'…
    - 能指出并纠正这一错误：混淆名词性与形容词性物主代词，将'your'写成'yours'放在名词前，如'yours pen…
  aliases:
    - 独立物主代词
  category: 语法
  explanation: 名词性物主代词在句中可作主语、宾语或表语，避免名词重复，如'This is mine.'中的mine相当于my + 名词。
  misconceptions:
    - 把mine当作形容词修饰名词，写出'This is mine book'，应为'my book'或'This book is mine'。
    - 混淆名词性与形容词性物主代词，将'your'写成'yours'放在名词前，如'yours pen'。
    - 在双宾语中误用，如'Give it to I'变成'Give it to mine'，应用宾格me。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C3/sections/S2.md
- id: concept:英语:名词所有格
  type: Concept
  subject: 英语
  title: 名词所有格
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把复数名词所有格写成my parent's home，应为my parents' home。
    - 能指出并纠正这一错误：混淆所有格与复数，将三个老师写成three teacher's。
  aliases:
    - "'s所有格"
    - 名词所有格（-'s）
    - 所有格
    - possessive case
  category: 语法
  explanation: 表示所属关系，通常在名词后加's，如Li Xin's erhu。
  misconceptions:
    - 把复数名词所有格写成my parent's home，应为my parents' home。
    - 混淆所有格与复数，将三个老师写成three teacher's。
    - 表示两人共同所有时，写成Tom's and Jack's room，应为Tom and Jack's room。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S2.md
- id: concept:英语:后缀法
  type: Concept
  subject: 英语
  title: 后缀法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为以-ly结尾的词一定是副词，如把friendly误判为副词，但它是形容词。
    - 能指出并纠正这一错误：在名词后加-less时误改变词尾，如把hope误加为hopeless时写成hopless，漏掉e…
  aliases:
    - Suffixation
  category: 构词法
  explanation: 通过在词根后添加后缀构成新词的方法，如-less表示“没有”，-ly表示“副词或形容词”。
  misconceptions:
    - 认为以-ly结尾的词一定是副词，如把friendly误判为副词，但它是形容词。
    - 在名词后加-less时误改变词尾，如把hope误加为hopeless时写成hopless，漏掉e。
    - 认为后缀只能改变词性不改变词义，如helpful和helpless都当'有帮助的'，混淆反义。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:否定句
  type: Concept
  subject: 英语
  title: 否定句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在doesn't后误用动词三单，如"She doesn't likes it"，应为like。
    - 能指出并纠正这一错误：与be动词混用，写"She doesn't is a teacher"，应说"She isn't…
  aliases:
    - negative sentences
  category: 语法
  explanation: 在动词前加don't或doesn't，后接动词原形。
  misconceptions:
    - 在doesn't后误用动词三单，如"She doesn't likes it"，应为like。
    - 与be动词混用，写"She doesn't is a teacher"，应说"She isn't a teacher"。
    - 过去时否定误用don't，如"I don't went"，应为didn't go。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C5/sections/S1.md
- id: concept:英语:否定形容词
  type: Concept
  subject: 英语
  title: 否定形容词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为否定形容词必须带un-或im-前缀，把negative当成名词。
    - 能指出并纠正这一错误：把否定形容词误用为动词，如‘He negatived the plan’。
  aliases: []
  category: 语法
  explanation: 用于表达否定或消极意义的形容词，如 negative。
  misconceptions:
    - 认为否定形容词必须带un-或im-前缀，把negative当成名词。
    - 把否定形容词误用为动词，如‘He negatived the plan’。
    - 混淆negative和passive，如用‘negative voice’表示被动语态。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:告别语
  type: Concept
  subject: 英语
  title: 告别语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 Goodbye 误写成 Good buy，因为 bye 和 buy 同音所以混用
    - 能指出并纠正这一错误：对老师说 Bye 以为和 Goodbye 一样正式，忽略 Bye 更口语化
  aliases:
    - 再见
  category: 交际用语
  explanation: 用于结束对话或离开时的表达，如 Goodbye, Bye。
  misconceptions:
    - 把 Goodbye 误写成 Good buy，因为 bye 和 buy 同音所以混用
    - 对老师说 Bye 以为和 Goodbye 一样正式，忽略 Bye 更口语化
    - 误以为 Good night 是晚上再见时的通用告别语，下午分别时也随口说 Good night
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C1/sections/S2.md
- id: concept:英语:地点状语从句
  type: Concept
  subject: 英语
  title: 地点状语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用where引导地点状语从句时误加先行词，如‘This is the place where h…
    - 能指出并纠正这一错误：混淆where和which，在定语从句中写‘This is the house which I …
  aliases: []
  category: 语法
  explanation: 表示地点的状语从句，常用where、wherever等引导。
  misconceptions:
    - 用where引导地点状语从句时误加先行词，如‘This is the place where he lives’被误认为错误。
    - 混淆where和which，在定语从句中写‘This is the house which I lived’漏掉介词in。
    - 认为wherever只能引导让步状语从句，不能引导地点状语从句。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:地球与太阳月球的关系
  type: Concept
  subject: 英语
  title: 地球与太阳月球的关系
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 地球是行星，绕着太阳转；月球是地球的邻居，绕着地球转；人造卫星也绕着地球运行。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C5/sections/S1.md
- id: concept:英语:基数词 1-20
  type: Concept
  subject: 英语
  title: 基数词 1-20
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 twelve 拼成 twelf，漏掉字母 v
    - 能指出并纠正这一错误：把 fourteen 写成 fourten，漏掉字母 e
  aliases:
    - numbers 1-20
  category: 词汇
  explanation: 掌握数字 one 到 twenty 的拼写和读音。
  misconceptions:
    - 把 twelve 拼成 twelf，漏掉字母 v
    - 把 fourteen 写成 fourten，漏掉字母 e
    - 把 fifteen 写成 fiveteen，没有将 five 变为 fif
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C3/sections/S1.md
- id: concept:英语:大堡礁
  type: Concept
  subject: 英语
  title: 大堡礁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为大堡礁是石头构成的，实际是珊瑚虫的石灰质骨骼。
    - 能指出并纠正这一错误：认为它是世界上最大的单一珊瑚，实际是珊瑚礁系统。
  aliases:
    - Great Barrier Reef
  category: 地理
  explanation: 位于澳大利亚东北海岸的珊瑚礁系统，是世界上最大的活体结构。
  misconceptions:
    - 误以为大堡礁是石头构成的，实际是珊瑚虫的石灰质骨骼。
    - 认为它是世界上最大的单一珊瑚，实际是珊瑚礁系统。
    - 混淆位置，写成在印度洋。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:大数字
  type: Concept
  subject: 英语
  title: 大数字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写数字时漏掉单位，如只写“6 million”而不写square kilometres。
    - 能指出并纠正这一错误：混淆面积和距离的单位，如把公里写成米。
  aliases:
    - large numbers
  category: 语言技能
  explanation: 在描述地理事实时使用的大数值，如6 million square kilometres。
  misconceptions:
    - 写数字时漏掉单位，如只写“6 million”而不写square kilometres。
    - 混淆面积和距离的单位，如把公里写成米。
    - 朗读大数字时千位与百万位混淆，如1,200,000读成1.2百万而不是120万？
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:天气词汇
  type: Concept
  subject: 英语
  title: 天气词汇
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用名词cloud代替形容词cloudy，说It's cloud. 表示“多云”。
    - 能指出并纠正这一错误：拼写易混词weather与whether，如把“天气”写成whether。
  aliases: []
  category: 词汇
  explanation: 描述天气状况的词汇，如cloudy, dry, lightning, stormy, windy等。
  misconceptions:
    - 用名词cloud代替形容词cloudy，说It's cloud. 表示“多云”。
    - 拼写易混词weather与whether，如把“天气”写成whether。
    - 把weather当可数名词，说a weather或weathers。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C6/sections/S1.md
- id: concept:英语:失爆现象
  type: Concept
  subject: 英语
  title: 失爆现象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：失爆时完全省略该音，如'good morning'读成'goo morning'，缺失口型。
    - 能指出并纠正这一错误：将'not today'中的/t/完整读出，未做到不完全爆破。
  aliases:
    - 不完全爆破
  category: 语音
  explanation: 英语中，当爆破音/p/ /b/ /t/ /d/ /k/ /g/后紧跟另一个辅音时，前一个爆破音不完全爆破，只做口型不发音。
  misconceptions:
    - 失爆时完全省略该音，如'good morning'读成'goo morning'，缺失口型。
    - 将'not today'中的/t/完整读出，未做到不完全爆破。
    - 以为所有爆破音后都失爆，忽略后跟元音时需正常发音。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C8/sections/S1.md
- id: concept:英语:姓氏与名字
  type: Concept
  subject: 英语
  title: 姓氏与名字
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把 Peter Brown 中的 Peter 当姓，Brown 当名
    - 能指出并纠正这一错误：把英语姓名写成姓在前名在后：Brown Peter
  aliases:
    - 英文姓名结构
  category: 文化知识
  explanation: 英语中姓名顺序为名在前姓在后，如Peter Brown，Brown是姓氏。
  misconceptions:
    - 误把 Peter Brown 中的 Peter 当姓，Brown 当名
    - 把英语姓名写成姓在前名在后：Brown Peter
    - 认为 last name 是 Peter 而不是 Brown
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C4/sections/S1.md
- id: concept:英语:嫦娥奔月故事
  type: Concept
  subject: 英语
  title: 嫦娥奔月故事
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为后羿也吃仙药成功奔月，实际只有嫦娥飞升
    - 能指出并纠正这一错误：将嫦娥奔月与后羿射日混为同一事件，时间顺序颠倒
  aliases:
    - Chang'e story
  category: 文化
  explanation: 中国民间传说，讲述嫦娥因服用仙药飞升月宫的故事，与中秋节相关。
  misconceptions:
    - 以为后羿也吃仙药成功奔月，实际只有嫦娥飞升
    - 将嫦娥奔月与后羿射日混为同一事件，时间顺序颠倒
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:字母与发音的对应
  type: Concept
  subject: 英语
  title: 字母与发音的对应
  conceptType: 概念型
  aliases:
    - 字母发音
    - letter sounds
  category: 语音
  explanation: 每个字母在单词里都有自己的发音，比如 Aa 发 /æ/（apple）、Bb 发 /b/（bag）。认识字母的同时要会读它对应的音。
  sourceRef: content/三年级/上册/英语/PEP-3-1-English/chapters/C1/sections/S1.md
- id: concept:英语:字母发音分类
  type: Concept
  subject: 英语
  title: 字母发音分类
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把字母J和G都归入/eɪ/组，实际G发/iː/音，J发/eɪ/音
    - 能指出并纠正这一错误：把字母F和X归入/iː/音组，实际它们都含/e/音
  aliases:
    - 字母音素分类
  category: 语音知识
  explanation: 按元音音素将字母分类，如/eɪ/组、/iː/组等，帮助记忆字母读音。
  misconceptions:
    - 把字母J和G都归入/eɪ/组，实际G发/iː/音，J发/eɪ/音
    - 把字母F和X归入/iː/音组，实际它们都含/e/音
    - 认为字母R与A同组，因为R听起来像ar，实际R发/ɑːr/不属于/eɪ/组
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C1/sections/S1.md
- id: concept:英语:字母组合 ai/ay 的发音
