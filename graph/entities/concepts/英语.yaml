  masteryCriteria:
    - 能指出并纠正这一错误：漏掉冠词a，写成make difference，导致结构不完整。
    - 能指出并纠正这一错误：误用复数，说make differences表示多种影响，此处固定用单数。
  aliases: []
  category: 短语
  explanation: 表示“对……产生影响或作用”。
  misconceptions:
    - 漏掉冠词a，写成make difference，导致结构不完整。
    - 误用复数，说make differences表示多种影响，此处固定用单数。
    - 介词搭配错误，说make a difference for，应为make a difference to。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:make one's own decision
