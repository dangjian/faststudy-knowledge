  title: 描述植物的生长过程
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 用 "First, we plant the seed. Then... Next... Finally..."
    这样的句式，按步骤介绍一种植物是怎么播种、发芽、长大的。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C5/sections/S3.md
- id: concept:英语:描述正在进行的活动
  type: Concept
  subject: 英语
  title: 描述正在进行的活动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写进行时漏掉be动词，如He painting. 应为He is painting.
    - 能指出并纠正这一错误：动词ing拼写错：write写writeing，run写runing，正确为writing和ru…
  aliases: []
  category: 功能句型
  explanation: 使用现在进行时描述他人正在做的事情，如'He is painting.' 'She is playing the piano.'
  misconceptions:
    - 写进行时漏掉be动词，如He painting. 应为He is painting.
    - 动词ing拼写错：write写writeing，run写runing，正确为writing和running
    - 用一般现在时表正在做：She plays the piano（常态），正在弹应为She is playing the piano.
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C5/sections/S3.md
- id: concept:英语:描述活动的现在进行时句型
