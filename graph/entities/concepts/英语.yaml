- id: concept:英语:cause and effect
  type: Concept
  subject: 英语
  title: cause and effect
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把结果当原因，如“因为地湿，所以下雨了”，颠倒了因果顺序。
    - 能指出并纠正这一错误：只看到表面原因，忽略深层原因，如分析战争只归因于刺客，不分析社会矛盾。
  aliases:
    - 因果关系
  category: 阅读策略
  explanation: 因果关系是分析事件之间联系的方法，用于理解故事中事件发生的原因和结果。
  misconceptions:
    - 把结果当原因，如“因为地湿，所以下雨了”，颠倒了因果顺序。
    - 只看到表面原因，忽略深层原因，如分析战争只归因于刺客，不分析社会矛盾。
    - 把时间先后误当因果，如“他先出门，所以下雨了”。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C7/sections/S1.md
- id: concept:英语:certain 的用法
  type: Concept
  subject: 英语
  title: certain 的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 certain 当“确定的”讲时也放在名词前，如 a certain man 被误认为“一个…
    - 能指出并纠正这一错误：混淆 certain 和 sure，写出 I am certain he is right 时以…
  aliases: []
  category: 词汇
  explanation: certain 表示“某一，某个”，仅用于名词前。
  misconceptions:
    - 把 certain 当“确定的”讲时也放在名词前，如 a certain man 被误认为“一个确定的男人”（实际是“某个男人”）
    - 混淆 certain 和 sure，写出 I am certain he is right 时以为 certain 只能修饰名词，实际这里作表语
    - 用 certain 修饰不可数名词，如 certain water (应说 some water 或 a certain amount of
      water)
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
