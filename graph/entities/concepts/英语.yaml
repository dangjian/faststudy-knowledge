  misconceptions:
    - 把 air pollution 写成 air pollute，词性错误。
    - 误将 pollution 当可数，写 air pollutions 表示多种污染。
    - 写 noises pollution，实际上 noise 在此不可数，应为 noise pollution。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C13/sections/S1.md
- id: concept:英语:现在完成时
  type: Concept
  subject: 英语
  title: 现在完成时
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：过去分词形式错误，如“I have went to Beijing”。
    - 能指出并纠正这一错误：与一般过去时混用，如“I have seen the movie yesterday”。
  aliases:
    - present perfect tense
  category: 语法
  explanation: 表示过去发生的动作对现在造成的影响或结果，或从过去持续到现在的动作或状态。
  misconceptions:
    - 过去分词形式错误，如“I have went to Beijing”。
    - 与一般过去时混用，如“I have seen the movie yesterday”。
    - 漏掉助动词，如“He finished already”而不是“He has finished”。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:现在完成时与一般过去时的区别
  type: Concept
  subject: 英语
  title: 现在完成时与一般过去时的区别
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只要时间在过去就用现在完成时，如“I have met him last week”。
    - 能指出并纠正这一错误：认为现在完成时只表示过去动作，不强调影响。
  aliases:
    - 现在完成时和一般过去时的区别
  category: 语法
  explanation: 一般过去时强调过去发生的动作，不强调对现在的影响；现在完成时强调过去的动作对现在的影响或结果。
  misconceptions:
    - 只要时间在过去就用现在完成时，如“I have met him last week”。
    - 认为现在完成时只表示过去动作，不强调影响。
    - 混淆“have been to”和“have gone to”，如“I have gone to Beijing”当“去过”用。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:现在完成时的时间状语
  type: Concept
  subject: 英语
  title: 现在完成时的时间状语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把for和since混用，如 for 2010 和 since three years。
    - 能指出并纠正这一错误：在否定句中用already，如 I haven't already seen it，应为yet。
  aliases: []
  category: 语法
  explanation: 常与already, yet, ever, never, just, before, for, since等连用。
  misconceptions:
    - 把for和since混用，如 for 2010 和 since three years。
    - 在否定句中用already，如 I haven't already seen it，应为yet。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:现在完成时的构成
  type: Concept
  subject: 英语
  title: 现在完成时的构成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：第三人称单数用have，如“He have finished”。
    - 能指出并纠正这一错误：过去分词用原形或过去式，如“She has write a letter”。
  aliases: []
  category: 语法
  explanation: 由 have/has + 过去分词构成，主语为第三人称单数时用 has，其余用 have。
  misconceptions:
    - 第三人称单数用have，如“He have finished”。
    - 过去分词用原形或过去式，如“She has write a letter”。
    - 把“has”用在复数主语，如“They has arrived”。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:现在完成时的标志词
  type: Concept
  subject: 英语
  title: 现在完成时的标志词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“already”用于否定句，如“I haven't already finished”。
    - 能指出并纠正这一错误：把“yet”用于肯定句，如“He has yet arrived”。
  aliases: []
  category: 语法
  explanation: 常与 ever, never, just, already, yet 等副词连用，表示经验、完成或未完成。
  misconceptions:
    - 把“already”用于否定句，如“I haven't already finished”。
    - 把“yet”用于肯定句，如“He has yet arrived”。
    - 误认为“ever”只用于肯定句，其实常用于疑问句。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C7/sections/S1.md
- id: concept:英语:现在完成时的用法
  type: Concept
  subject: 英语
  title: 现在完成时的用法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把现在完成时与一般过去时混用，如“I have seen that movie yesterda…
    - 能指出并纠正这一错误：瞬间动词误用为延续性，如“He has joined the army for three ye…
  aliases: []
  category: 语法
  explanation: 表示过去的经验、已完成或未完成的动作、持续到现在的状态等。
  misconceptions:
    - 把现在完成时与一般过去时混用，如“I have seen that movie yesterday.”
    - 瞬间动词误用为延续性，如“He has joined the army for three years.”
    - 忽视主语人称，如“She have finished her homework.”
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:现在完成时（since/for）
  type: Concept
  subject: 英语
  title: 现在完成时（since/for）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆for和since，如“I have lived here since five years…
    - 能指出并纠正这一错误：since后接时间段，如“since two hours”误用为“since two hours…
  aliases:
    - present perfect tense with since and for
  category: 语法
  explanation: 现在完成时用于表示从过去持续到现在的动作或状态，常与since（自从）和for（持续一段时间）连用。
  misconceptions:
    - 混淆for和since，如“I have lived here since five years.”
    - since后接时间段，如“since two hours”误用为“since two hours ago”
    - since从句用了现在完成时，如“It has been three years since I have met him.”
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:现在完成进行时
  type: Concept
  subject: 英语
  title: 现在完成进行时
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：结构误写成have/has been+过去分词，如 He has been worked her…
    - 能指出并纠正这一错误：忘记been，写成 He has working since 8 a.m.
  aliases:
    - present perfect continuous tense
  category: 语法
  explanation: 表示从过去开始一直持续到现在的动作，结构为have/has been + 现在分词。
  misconceptions:
    - 结构误写成have/has been+过去分词，如 He has been worked here since 2020.
    - 忘记been，写成 He has working since 8 a.m.
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:现在进行时
  type: Concept
  subject: 英语
  title: 现在进行时
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏写be动词，如将He is going写成He going。
    - 能指出并纠正这一错误：动词-ing形式拼写错误，如把write的现在分词写成writting。
  aliases:
    - present continuous tense
  category: 语法
  explanation: 表示现在正在进行的动作或状态，结构为be动词（am/is/are）+动词-ing形式。
  misconceptions:
    - 漏写be动词，如将He is going写成He going。
    - 动词-ing形式拼写错误，如把write的现在分词写成writting。
    - 与一般现在时混淆，如She is like apples（应为likes）。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C5/sections/S1.md
- id: concept:英语:现在进行时与一般现在时的区别
  type: Concept
  subject: 英语
  title: 现在进行时与一般现在时的区别
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到now就以为必须用现在进行时，但‘I usually play basketball now…
    - 能指出并纠正这一错误：把一般现在时的标志词用于进行时，如‘He is watching TV every day’错，…
  aliases: []
  category: 语法
  explanation: 现在进行时强调此刻正在进行的动作，一般现在时强调经常性或习惯性动作。
  misconceptions:
    - 看到now就以为必须用现在进行时，但‘I usually play basketball now’中now表示习惯，应为一般现在时。
    - 把一般现在时的标志词用于进行时，如‘He is watching TV every day’错，应用watches。
    - 认为‘Look’或‘Listen’后只能用一般现在时，实际提示正在进行，应用现在进行时。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C6/sections/S2.md
- id: concept:英语:珠穆朗玛峰相关史实
