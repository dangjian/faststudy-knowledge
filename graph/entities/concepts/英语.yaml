    - 误以为它是宗教节日，忽视其古埃及世俗庆祝的起源
    - 把涂彩蛋习俗与复活节混淆，误认为Sham El-Nessim就是复活节
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:Sneezing
  type: Concept
  subject: 英语
  title: Sneezing
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 sneeze 误当名词，说 I have a sneeze 表达打喷嚏
