  title: 被动语态中不定式被动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把不定式被动写成 to done 或 to be do，如 The work is expect…
    - 能指出并纠正这一错误：误用 to being done，如 The house is said to being re…
  aliases: []
  category: 语法
  explanation: 不定式的被动形式为 to be + 过去分词。
  misconceptions:
    - 把不定式被动写成 to done 或 to be do，如 The work is expected done tomorrow
    - 误用 to being done，如 The house is said to being rebuilt
    - 分不清不定式主动与被动的意义，如 The question is easy to answer 误写成 to be answered
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C6/sections/S1.md
- id: concept:英语:被动语态中不规则动词的过去分词
