  masteryCriteria:
    - 能指出并纠正这一错误：将 maths 误用为可数，如 'I have many maths'，应为 much math…
    - 能指出并纠正这一错误：混淆 gym 和 P.E.，写 'I like gym class' 但拼成 'gym' 没问题…
