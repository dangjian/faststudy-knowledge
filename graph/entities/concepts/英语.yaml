    - 混淆back和backache，说I have a back表示背疼，实际是have a backache
    - 将ache类词当可数名词滥用复数，如two backaches，通常不用复数
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:转化法
  type: Concept
  subject: 英语
  title: 转化法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为词性转换后词义必须变化，如water动词“浇水”与名词“水”无关。
    - 能指出并纠正这一错误：忽略转化后发音变化，如record名词重音在前，动词重音在后，学生读一样。
  aliases:
    - Conversion
  category: 构词法
  explanation: 一个单词由一种词类转换为另一种词类，意义往往与之前联系密切，如名词转化为动词、形容词转化为动词等。
  misconceptions:
    - 认为词性转换后词义必须变化，如water动词“浇水”与名词“水”无关。
    - 忽略转化后发音变化，如record名词重音在前，动词重音在后，学生读一样。
    - 认为所有动词加ing才能变名词，如walk名词本身就是“散步”，不需要加ing。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:过去分词短语作后置定语
