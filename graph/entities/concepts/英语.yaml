    - 能指出并纠正这一错误：拼写错误，如将mother写成mather，father写成farther。
  aliases:
    - Family members
  category: 词汇
  explanation: 用于称呼家庭成员的词汇，如father, mother, brother, sister等。
  misconceptions:
    - 混淆brother和sister，把“姐姐”说成brother，或把“弟弟”说成sister。
    - 拼写错误，如将mother写成mather，father写成farther。
    - 把uncle用于女性长辈，aunt用于男性长辈，如称阿姨为uncle。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S2.md
- id: concept:英语:宾语从句
