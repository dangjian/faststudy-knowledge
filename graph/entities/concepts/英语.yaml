    - 介绍照片中的人时指代错误，如说“This is my mother.”但照片中其实是爸爸。
    - 介绍过去照片中的家人时误用一般现在时：“Here is my father”却描述的是十年前。
    - “This is my mother is a teacher.”多余is，应是“This is my mother. She is a
      teacher.”
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S2.md
