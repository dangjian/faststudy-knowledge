  misconceptions:
    - 误将 mistake 写成 mistak，漏掉 e，如错写 by mistak。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:by the end of
