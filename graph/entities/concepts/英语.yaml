  explanation: 用What's your favourite subject?询问最喜欢的科目，用My favourite subject
    is...回答，用Because...说明原因。
  misconceptions:
    - 把favourite当动词，如I favourite English，应为My favourite subject is English。
    - 用Because回答只说Because，不补充完整句子。
    - 用中文语序问Your favourite subject is what?，应为What's your favourite subject?
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C7/sections/S1.md
- id: concept:英语:表达情绪和感受
