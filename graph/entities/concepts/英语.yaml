  title: 不规则动词过去式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把go的过去式写成goed，不规则动词按规则动词加-ed
    - 能指出并纠正这一错误：I see a movie yesterday. 该用saw却用了原形see
  aliases:
