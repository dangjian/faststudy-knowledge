  category: 句型
  explanation: 表示“取决于……”，口语中常省略介词 on。
  misconceptions:
    - 将疑问词引导的从句写成疑问语序，如"It depends on what does he want."，应保持陈述语序。
    - 在口语中省略on后误加that，如"It depends that if it rains."，应说"It depends whether it
      rains."
    - 忘记加形式主语it，写成"Depends on what he says."，主语it不可省。
