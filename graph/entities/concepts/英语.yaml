    - 用sister称呼堂姐，以为英文sister包括所有女性同辈亲戚。
    - 认为grandfather只能指爷爷，不能指外公，造出foreign grandfather。
    - 混淆aunt和uncle的性别，把叔叔写成aunt。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S1.md
