  misconceptions:
    - 误认为《二泉映月》表达欢快喜悦，实际表达深沉悲伤与痛苦。
    - 误以为《二泉映月》是古琴曲，实际是二胡曲。
    - 误认为作者是刘天华，实际作者是阿炳。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C11/sections/S2.md
