  subject: 英语
  title: 简单过去时
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把不规则动词规则化，如把'go'的过去式写成'goed'，或把'see'写成'seed'。
    - 能指出并纠正这一错误：用过去时描述过去，但句中带有'now'或'today'就误用一般现在时，如'Yesterday …
  aliases:
    - 一般过去时
  category: 语法
  explanation: 用于描述过去发生的动作或状态，常与表示过去的时间状语连用。
  misconceptions:
    - 把不规则动词规则化，如把'go'的过去式写成'goed'，或把'see'写成'seed'。
    - 用过去时描述过去，但句中带有'now'或'today'就误用一般现在时，如'Yesterday he plays football.'。
    - 混淆'was'和'were'的人称搭配，如'you was'或'we was'，或忘记在否定句中加'didn't'后用动词原形。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C8/sections/S1.md
- id: concept:英语:管理零花钱
