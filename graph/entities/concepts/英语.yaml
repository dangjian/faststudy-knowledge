  aliases: []
  category: 句型
  explanation: 用 forest（森林）、river（河流）、lake（湖）、mountain（山）、waterfall（瀑布）等词，结合 there
    be 句型描述自然公园里的景色。
  sourceRef: content/五年级/上册/英语/PEP-5-1-English/chapters/C6/sections/S1.md
- id: concept:英语:描述节日活动
  type: Concept
  subject: 英语
  title: 描述节日活动
  conceptType: 应用型
  aliases: []
  category: 句型
  explanation: 用 What did you do at/for...? 询问节日里做了什么，用过去式描述贴福字、吃月饼、看晚会等节日活动。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C2/sections/S1.md
- id: concept:英语:提供食物与礼貌回应
