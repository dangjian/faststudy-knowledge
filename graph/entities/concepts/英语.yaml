  title: 管理零花钱
  conceptType: 程序型
  aliases:
    - spend, share and save
  category: 方法
  explanation: 可以把零花钱分成三份：一份用来花，一份用来分享、送礼物，一份攒起来买大件，这样就能把钱管理好。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C4/sections/S3.md
- id: concept:英语:终身学习
  type: Concept
  subject: 英语
  title: 终身学习
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为终身学习只针对成年人，学生不需要考虑。
    - 能指出并纠正这一错误：认为只有学校教育才算学习，日常生活中学习不算学习。
