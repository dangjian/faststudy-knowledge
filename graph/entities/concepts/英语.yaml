  aliases:
    - note
  category: 词汇
  explanation: 意为“乐符”，在音乐主题下常简写为 note。
  misconceptions:
    - 把“音符”写成 "music note" 而非 "musical note"。
    - 只记住 note 表示“笔记”，看到 "musical note" 不知道是乐符。
    - 误以为 "musical note" 只能指“音乐笔记”，实际表示乐符。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:must表肯定推测
  type: Concept
  subject: 英语
  title: must表肯定推测
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用mustn't表‘一定不’，如‘That mustn't be true’。
    - 能指出并纠正这一错误：对过去肯定推测用must be，如‘He must be at home yesterday’应…
  aliases:
    - 一定
    - must表推测
    - must be
    - must have
  category: 语法
  explanation: must用于表示肯定推测，语气较强，意为“一定”。
  misconceptions:
    - 用mustn't表‘一定不’，如‘That mustn't be true’。
    - 对过去肯定推测用must be，如‘He must be at home yesterday’应为must have been。
    - 以为must的否定形式是must not be，实际推测否定用can't。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C8/sections/S1.md
- id: concept:英语:neither...nor...
  type: Concept
  subject: 英语
  title: neither...nor...
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为谓语动词与neither后的主语一致，如写 Neither Tom nor his fri…
    - 能指出并纠正这一错误：在neither...nor后多余加not，如写 I don't like neither ap…
  aliases: []
  category: 语法
  explanation: 表示“既不……也不……”，连接两个并列成分，谓语动词遵循就近原则。
  misconceptions:
    - 误认为谓语动词与neither后的主语一致，如写 Neither Tom nor his friends is going，正确应为are going
    - 在neither...nor后多余加not，如写 I don't like neither apples nor oranges，造成双重否定
    - 连接成分不平行，如写 He neither can swim nor ski，正确应为 He can neither swim nor ski
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C11/sections/S1.md
- id: concept:英语:nervous 紧张的
