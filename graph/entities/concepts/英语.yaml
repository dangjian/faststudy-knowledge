    - lifelong journey
  category: 学习理念
  explanation: 学习是一生的旅程，每天都有新事物可学。
  misconceptions:
    - 认为终身学习只针对成年人，学生不需要考虑。
    - 认为只有学校教育才算学习，日常生活中学习不算学习。
    - 认为终身学习就是永远待在学校，不离开校园。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C1/sections/S1.md
- id: concept:英语:结果状语从句
  type: Concept
  subject: 英语
  title: 结果状语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：so...that与such...that混用，如He is so smart boy that…
    - 能指出并纠正这一错误：在so...that从句中重复使用so，如He was so tired so he slept…
