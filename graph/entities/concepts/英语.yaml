  title: It is impolite to do
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写成 It is impolite doing，漏掉不定式 to，如 It is impolit…
    - 能指出并纠正这一错误：用 not impolite 表示“不礼貌”，如 He is not impolite to i…
  aliases:
    - It's rude to
    - It's impolite to do
  category: 语法
  explanation: 表示做某事是不礼貌的，用于指出社交中的不当行为。
  misconceptions:
    - 写成 It is impolite doing，漏掉不定式 to，如 It is impolite talking loudly。
    - 用 not impolite 表示“不礼貌”，如 He is not impolite to interrupt，实际成了“他打断并不失礼”。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C10/sections/S1.md
- id: concept:英语:It is said that... 句式
  type: Concept
  subject: 英语
  title: It is said that... 句式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误用"It is told that..."表示"据说"，said才是正确过去分词。
    - 能指出并纠正这一错误：漏掉be动词，写成"It said that he is ill."，应为"It is said…
  aliases: []
  category: 句型
  explanation: 表示“据说……”，that 后接完整句子。
  misconceptions:
    - 误用"It is told that..."表示"据说"，said才是正确过去分词。
    - 漏掉be动词，写成"It said that he is ill."，应为"It is said that..."
    - 误将that从句改为不定式，如"It is said him to be rich."，应为"It is said that he is rich."
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:It's time for/to 句型
  type: Concept
  subject: 英语
  title: It's time for/to 句型
  conceptType: 概念型
  aliases:
    - 该做某事了的表达
  category: 句型
  explanation: 表达该做某事了：It's time for + 名词，如 It's time for dinner.；It's time to +
    动词，如 It's time to get up. for 后接事情，to 后接动作。
  sourceRef: content/四年级/下册/英语/PEP-4-2-English/chapters/C3/sections/S1.md
- id: concept:英语:Large numbers
  type: Concept
  subject: 英语
  title: Large numbers
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆数字单位，如把6 million写成6 billion。
    - 能指出并纠正这一错误：读大数字时漏掉逗号分隔，如误读1,500,000为15,000。
  aliases:
    - 大数字
  category: 语言技能
  explanation: 使用大数字描述地理事实，如面积、距离等。
  misconceptions:
    - 混淆数字单位，如把6 million写成6 billion。
    - 读大数字时漏掉逗号分隔，如误读1,500,000为15,000。
    - 写数字时误用thousand代替million，如写2 thousand而不是2 million。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:Laughter
  type: Concept
  subject: 英语
  title: Laughter
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为笑会减少体内氧气，实际笑时身体会吸入更多氧气。
    - 能指出并纠正这一错误：把 laugh 和 smile 混为一谈，laugh 是出声大笑，smile 是无声微笑。
  aliases:
    - 笑
    - 大笑
  category: 生理心理现象
  explanation: 笑是自然的生理反应，对身心健康有益，能促进氧气摄入、放松肌肉、改善情绪。
  misconceptions:
    - 误认为笑会减少体内氧气，实际笑时身体会吸入更多氧气。
    - 把 laugh 和 smile 混为一谈，laugh 是出声大笑，smile 是无声微笑。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Lucky numbers
  type: Concept
  subject: 英语
  title: Lucky numbers
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为数字4是幸运数字，实际因谐音‘死’在中国文化中被视为不吉利。
    - 能指出并纠正这一错误：记混六和九的吉凶，认为六不好而九好，实际六、九在中国都是幸运数字。
  aliases:
    - 幸运数字
  category: 文化知识
  explanation: 某些数字因谐音而在中国被视为幸运或不幸运，如六、八、九为幸运，四为不幸运。
  misconceptions:
    - 误以为数字4是幸运数字，实际因谐音‘死’在中国文化中被视为不吉利。
    - 记混六和九的吉凶，认为六不好而九好，实际六、九在中国都是幸运数字。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C9/sections/S1.md
- id: concept:英语:Lucky numbers in Chinese culture
  type: Concept
  subject: 英语
  title: Lucky numbers in Chinese culture
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆‘二’和‘四’的谐音，以为二不吉利，实际二常象征双数吉祥。
    - 能指出并纠正这一错误：忽略数字吉凶因语境而变，如‘四’在车牌号中有时被回避，但在某些组合中可接受。
  aliases:
    - 幸运数字
  category: 文化知识
  explanation: 某些数字因谐音而具有吉祥含义，如六、二、八、九，而四因谐音“死”而不吉利。
  misconceptions:
    - 混淆‘二’和‘四’的谐音，以为二不吉利，实际二常象征双数吉祥。
    - 忽略数字吉凶因语境而变，如‘四’在车牌号中有时被回避，但在某些组合中可接受。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Making a Difference
  type: Concept
  subject: 英语
  title: Making a Difference
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 make a difference 漏掉冠词写成 make difference。
    - 能指出并纠正这一错误：误以为 make a difference 必须指巨大变革，忽略日常小行动也可使用。
  aliases:
    - 产生影响
  category: 主题
  explanation: 本单元主题为“做出改变”，强调个人通过志愿服务等行动对他人和社会产生积极影响。
  misconceptions:
    - 把 make a difference 漏掉冠词写成 make difference。
    - 误以为 make a difference 必须指巨大变革，忽略日常小行动也可使用。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Mind + 名词/代词
  type: Concept
  subject: 英语
  title: Mind + 名词/代词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将警示句"Mind your head"译为"介意你的头"，实际应为"当心碰头"。
    - 能指出并纠正这一错误：与"mind doing"（介意做）混淆，如把"Mind the gap"理解成"介意缝隙"。
  aliases:
    - Mind your...
    - 当心
  category: 句型
  explanation: Mind 用于警示，表示“注意；当心”。
  misconceptions:
    - 将警示句"Mind your head"译为"介意你的头"，实际应为"当心碰头"。
    - 与"mind doing"（介意做）混淆，如把"Mind the gap"理解成"介意缝隙"。
    - 误在Mind后加to do，如"Mind to open the door"，警示用法应直接接名词。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:Mind... 警示句型
  type: Concept
  subject: 英语
  title: Mind... 警示句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将"Mind the cold"理解为"不介意冷"，实际是"当心着凉"。
    - 能指出并纠正这一错误：误把"Mind you!"理解成"你介意吗？"，实际它是固定短语，表示"当心！"或"听着！"。
  aliases:
    - Mind your...
  category: 句型
  explanation: Mind... 表示“注意，当心”，后接名词或代词。
  misconceptions:
    - 误将"Mind the cold"理解为"不介意冷"，实际是"当心着凉"。
    - 误把"Mind you!"理解成"你介意吗？"，实际它是固定短语，表示"当心！"或"听着！"。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:Natural wonders
  type: Concept
  subject: 英语
  title: Natural wonders
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为自然奇观一定是巨大或壮观的，忽略小型独特地貌。
    - 能指出并纠正这一错误：把人工建筑如金字塔当自然奇观。
  aliases:
    - 自然奇观
  category: 地理概念
  explanation: 自然奇观是指自然界中壮观、独特的地理特征，如湖泊、山脉、森林等。
  misconceptions:
    - 认为自然奇观一定是巨大或壮观的，忽略小型独特地貌。
    - 把人工建筑如金字塔当自然奇观。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:Negative prefixes un-, in-, im-
  type: Concept
  subject: 英语
  title: Negative prefixes un-, in-, im-
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把possible的反义词写成unpossible，应为impossible。
    - 能指出并纠正这一错误：把polite的反义词写成unpolite，应为impolite。
  aliases:
    - 否定前缀
    - negative prefixes un- and in-/im-
  category: Grammar
  explanation: Adding un-, in-, or im- to adjectives creates their negative forms,
    e.g., safe→unsafe, formal→informal, possible→impossible.
  misconceptions:
    - 把possible的反义词写成unpossible，应为impossible。
    - 把polite的反义词写成unpolite，应为impolite。
    - 把healthy的反义词写成imhealthy，应为unhealthy。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C6/sections/S1.md
- id: concept:英语:New Year's resolution
  type: Concept
  subject: 英语
  title: New Year's resolution
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 New Year's resolution 写成 New Year resolution，漏…
    - 能指出并纠正这一错误：将 resolution 当动词用，如 I resolution to exercise，应为 …
  aliases:
    - 新年决心
  category: 文化
  explanation: A common type of resolution made at the start of the year to
    improve one's life.
  misconceptions:
    - 把 New Year's resolution 写成 New Year resolution，漏掉所有格撇号。
    - 将 resolution 当动词用，如 I resolution to exercise，应为 I make a resolution to
      exercise。
    - 单复数混用：说 many New Year's resolution，少加 s。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C6/sections/S2.md
- id: concept:英语:No way!
  type: Concept
  subject: 英语
  title: No way!
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将口语"No way!"直译成"没有路"，在阅读理解中误解为"无路可走"。
    - 能指出并纠正这一错误：误用"No way!"表示"没关系"或"不用谢"，如别人说Thanks时回答No way!。
  aliases: []
  category: 口语
  explanation: 口语中表示“不行；不可能”，用于直接拒绝。
  misconceptions:
    - 将口语"No way!"直译成"没有路"，在阅读理解中误解为"无路可走"。
    - 误用"No way!"表示"没关系"或"不用谢"，如别人说Thanks时回答No way!。
    - 误以为"No way!"是书面正式表达，在写作中用来代替"impossible"，实际很口语化。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:Oxygen
  type: Concept
  subject: 英语
  title: Oxygen
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为氧气是笑产生的，实际是笑时吸入更多氧气。
    - 能指出并纠正这一错误：把 oxygen 和 hydrogen 混淆，写作文时用错化学元素名称。
  aliases:
    - 氧气
  category: 化学物质
  explanation: 氧气是身体各部分正常工作所需的气体，笑时身体会吸入更多氧气。
  misconceptions:
    - 误认为氧气是笑产生的，实际是笑时吸入更多氧气。
    - 把 oxygen 和 hydrogen 混淆，写作文时用错化学元素名称。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Past Simple Tense
  type: Concept
  subject: 英语
  title: Past Simple Tense
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把不规则动词过去式当规则变化，如写成 goed、feeld。
    - 能指出并纠正这一错误：用 ago 和 since 都表示过去，但 ago 用于一般过去时，since 用于完成时。
  aliases: []
  category: Grammar
  explanation: Used to describe completed actions in the past.
  misconceptions:
    - 把不规则动词过去式当规则变化，如写成 goed、feeld。
    - 用 ago 和 since 都表示过去，但 ago 用于一般过去时，since 用于完成时。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Positive and Negative Emotions
  type: Concept
  subject: 英语
  title: Positive and Negative Emotions
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“stressed”归为积极情绪，实际是消极
    - 能指出并纠正这一错误：写I am very anger.，误用anger为形容词，应用angry
  aliases:
    - 积极和消极情绪
  category: Vocabulary
  explanation: Words describing emotions can be grouped into positive (e.g.,
    joyful, thankful) and negative (e.g., angry, stressed) categories.
  misconceptions:
    - 把“stressed”归为积极情绪，实际是消极
    - 写I am very anger.，误用anger为形容词，应用angry
    - 把“thankful”归为负面情绪，实际是正面
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C3/sections/S1.md
- id: concept:英语:Present Perfect Tense with since and for
  type: Concept
  subject: 英语
  title: Present Perfect Tense with since and for
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 for 和 since 用反，说成 since two years / for last M…
    - 能指出并纠正这一错误：用短暂动词完成时加 for 时间段，如 I have bought this book for …
  aliases:
    - 现在完成时
  category: 语法
  explanation: 现在完成时用 since 或 for 表示动作持续的时间，since 后接时间点，for 后接时间段。
  misconceptions:
    - 把 for 和 since 用反，说成 since two years / for last Monday。
    - 用短暂动词完成时加 for 时间段，如 I have bought this book for two weeks。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:Present simple tense
  type: Concept
  subject: 英语
  title: Present simple tense
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：第三人称单数忘加 -s，如写成 he play football every day。
    - 能指出并纠正这一错误：疑问句误用 does 后仍用三单形式，如 Does he goes?。
  aliases:
    - 一般现在时
  category: 语法点
  explanation: 一般现在时用于描述习惯性动作、事实或状态。
  misconceptions:
    - 第三人称单数忘加 -s，如写成 he play football every day。
    - 疑问句误用 does 后仍用三单形式，如 Does he goes?。
    - 用一般现在时描述过去发生的事，如 Yesterday I go to school。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:Proverb
  type: Concept
  subject: 英语
  title: Proverb
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 proverb 拼成 proberb，拼写错误导致失分。
    - 能指出并纠正这一错误：误以为 proverb 必须出自《圣经》，忽略中西方都有广泛流传的谚语。
  aliases:
    - saying
  category: Literary Device
  explanation: A short, well-known saying that expresses a common truth or piece of advice.
  misconceptions:
    - 把 proverb 拼成 proberb，拼写错误导致失分。
    - 误以为 proverb 必须出自《圣经》，忽略中西方都有广泛流传的谚语。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Red as a cultural symbol
  type: Concept
  subject: 英语
  title: Red as a cultural symbol
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为红色在西方永远象征好运，忽略股市中红色表示亏损下跌。
    - 能指出并纠正这一错误：把红色和所有中国传统节日强绑定，忽略有些场合不使用红色。
  aliases:
    - 红色
    - The colour red
  category: 文化知识
  explanation: 红色在中国象征好运和财富，在西方文化中也有积极意义，但有时表示亏损。
  misconceptions:
    - 认为红色在西方永远象征好运，忽略股市中红色表示亏损下跌。
    - 把红色和所有中国传统节日强绑定，忽略有些场合不使用红色。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C9/sections/S1.md
- id: concept:英语:Red ink / in the red
  type: Concept
  subject: 英语
  title: Red ink / in the red
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 in the red 直译为‘穿着红衣服’，实际表示‘亏损、赤字’。
    - 能指出并纠正这一错误：误以为 red ink 只是红色墨水，不理解在财务语境中代表亏损记录。
  aliases:
    - 赤字
  category: 习语
  explanation: 表示亏损，公司亏损时用红色墨水记账。
  misconceptions:
    - 把 in the red 直译为‘穿着红衣服’，实际表示‘亏损、赤字’。
    - 误以为 red ink 只是红色墨水，不理解在财务语境中代表亏损记录。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C8/sections/S1.md
- id: concept:英语:Sahara Desert
  type: Concept
  subject: 英语
  title: Sahara Desert
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 Sahara Desert 写作 Sahara Dessert，混淆沙漠与甜点
    - 能指出并纠正这一错误：说 in Sahara Desert 漏掉 the，应为 in the Sahara Deser…
  aliases:
    - 撒哈拉沙漠
  category: 地理
  explanation: 位于非洲，是世界上最大的热沙漠，面积约900万平方公里，至少有460万年历史。
  misconceptions:
    - 把 Sahara Desert 写作 Sahara Dessert，混淆沙漠与甜点
    - 说 in Sahara Desert 漏掉 the，应为 in the Sahara Desert
    - 误用最高级 a largest desert，应为 the largest hot desert
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:Sand sea
