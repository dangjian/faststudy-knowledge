  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：宾语从句保留疑问语序，例如I don't know if is he free
    - 能指出并纠正这一错误：在介词后用if引导，如depend on if he comes，须改为whether
  aliases:
    - if/whether宾语从句
  category: 语法
  explanation: 由if或whether引导的宾语从句，表示“是否”，用于疑问或不确定的情况。
  misconceptions:
    - 宾语从句保留疑问语序，例如I don't know if is he free
    - 在介词后用if引导，如depend on if he comes，须改为whether
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:宾语从句（that引导）
