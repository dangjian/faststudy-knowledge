    - 比较级和最高级形式混用，如把bigger写成more bigger。
    - 比较对象不一致，如说“Tom is taller than any student in his class”误认为包括自己。
    - 最高级前漏the，如写成“He is tallest in our class”。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: "concept:英语:Conjunctions: and, but, because"
  type: Concept
  subject: 英语
  title: "Conjunctions: and, but, because"
  aliases: []
  category: Grammar
  explanation: "Conjunctions used to join information: 'and' for addition, 'but'
    for contrast, 'because' for reason."
  misconceptions:
    - because 和 so 连用，写 'Because I like music, so I choose it.'，中式英语。
    - 用 but 表示原因，如 'I like English and I don't like maths'，应用 but 表转折。
    - 把 because 当介词，后接名词，如 'Because English, I like it.'，应为 because of English。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C7/sections/S2.md
