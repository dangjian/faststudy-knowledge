    - 能指出并纠正这一错误：The movie made me exciting. 误用-ing形容词，应为excited
  aliases: []
  category: 语法
  explanation: make 后接宾语和形容词作补语，表示“使某人感到……”。
  misconceptions:
    - We make our classroom cleanly. 误用副词，应填clean
    - The movie made me exciting. 误用-ing形容词，应为excited
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C11/sections/S1.md
- id: concept:英语:make sb. do sth.
