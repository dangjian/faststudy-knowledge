  explanation: 亚历山大·格雷厄姆·贝尔是电话的发明者，出生于苏格兰，美国发明家。
  misconceptions:
    - 把爱迪生发明的电灯安到贝尔头上，误称"Bell invented the light bulb"。
    - 误以为贝尔是英国发明家，忽略其入籍美国，实际是苏格兰裔美国发明家。
    - 误将"Graham"拼成"Gram"，如"Alexander Gram Bell"。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:Allergy
