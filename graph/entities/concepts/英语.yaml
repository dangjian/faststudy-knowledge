    - 把工厂生产汽车说成The factory grows cars，生产应用produce。
    - 把种树说成produce trees，栽种行为应用plant或grow。
    - 混淆grow和plant，认为grow只指生长而plant只指栽种，忽略grow也可表示种植过程。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
