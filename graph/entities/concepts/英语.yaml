    - 把 nervous 写成名词，如 "I have nervous" 表达“我紧张”。
    - 拼错为 "nervious" 或 "nervouse"，正确拼写是 nervous。
    - 将 nervous 当作副词修饰动词，如 "He spoke nervous"，应为 nervously。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:no matter what
  type: Concept
  subject: 英语
  title: no matter what
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉what后的动词，如"No matter what, I'll do it"，误认为what…
  aliases: []
  category: 语法
  explanation: no matter what表示无论什么，引导让步状语从句。
