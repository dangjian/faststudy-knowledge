- id: concept:英语:(as) pale as chalk
  type: Concept
  subject: 英语
  title: (as) pale as chalk
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将"(as) pale as chalk"用于描述墙壁、雪等物品白，如"The wall is …
    - 能指出并纠正这一错误：误把"pale"换成"white"，如"as white as chalk"来描述病态脸色，丢失…
  aliases:
    - pale as chalk
  category: 修辞
  explanation: 明喻修辞结构，表示“惨白；苍白”，不可直译。
  misconceptions:
    - 将"(as) pale as chalk"用于描述墙壁、雪等物品白，如"The wall is as pale as
      chalk"，实际仅用于人脸色惨白。
    - 误把"pale"换成"white"，如"as white as chalk"来描述病态脸色，丢失"惨白"的病态含义。
