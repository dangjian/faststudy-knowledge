  misconceptions:
    - 把be good at后的动词用原形，如I'm good at play basketball，应为playing。
    - 混淆interested和interesting，误说I'm interesting in music，应为interested。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C8/sections/S2.md
- id: concept:英语:表达喜好与厌恶
  type: Concept
