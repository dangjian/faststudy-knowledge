    - 把'科学'笼统说成 science，但初中 science 单指综合科学课，物理化学不是 science。
    - 用 do lessons 表示上课，应说 have lessons，如 'I do math lesson' 典型中式。
    - 将语言学科首字母小写，如 'i like chinese'，应大写 Chinese。
