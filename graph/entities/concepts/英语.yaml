- id: concept:英语:描述人物外貌和性格的形容词
  type: Concept
  subject: 英语
  title: 描述人物外貌和性格的形容词
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用beautiful形容男性，如“He is beautiful.”应改为“He is hand…
    - 能指出并纠正这一错误：混淆“funny”和“kind”，把幽默说成善良，如“He is funny”误写成“He is…
  aliases:
    - adjectives for describing people
