    - 把吴刚砍桂、玉兔捣药都塞进嫦娥奔月的情节里
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C2/sections/S1.md
- id: concept:英语:主动语态
  type: Concept
  subject: 英语
  title: 主动语态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把含 by 的句子当主动语态，如 The cake was eaten by Tom 被当成主…
    - 能指出并纠正这一错误：主语是动作承受者却用主动结构，如说 The cake ate 表示蛋糕吃掉了
  aliases:
    - Active Voice
  category: 语法
  explanation: 主动语态表示主语是动作的执行者，与被动语态相对。
  misconceptions:
    - 误把含 by 的句子当主动语态，如 The cake was eaten by Tom 被当成主动
    - 主语是动作承受者却用主动结构，如说 The cake ate 表示蛋糕吃掉了
    - 主动与被动转换时只改动词，如 The boy opens the door 变成 The door opens by the boy
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C18/sections/S1.md
- id: concept:英语:主动语态与被动语态的转换
  type: Concept
  subject: 英语
  title: 主动语态与被动语态的转换
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：宾语变主语时人称代词格不变，如"I love her"改为被动误写"Her is loved b…
  aliases:
    - 被动语态与主动语态的转换
  category: 语法
  explanation: 主动语态中动作的执行者作主语，被动语态中动作的承受者作主语，转换时需调整语序并添加be动词。
  misconceptions:
    - 宾语变主语时人称代词格不变，如"I love her"改为被动误写"Her is loved by me"，应为She。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C5/sections/S1.md
- id: concept:英语:主语从句
  type: Concept
  subject: 英语
  title: 主语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用if引导位于句首的主语从句，如If she comes is unknown.，应为Wheth…
    - 能指出并纠正这一错误：语序错误，如Whether did he come isn't known.，应为Whether…
  aliases: []
  category: 语法
  explanation: 主语从句是充当主语的从句，如Whether you did it right or wrong isn't so important.。
  misconceptions:
    - 用if引导位于句首的主语从句，如If she comes is unknown.，应为Whether。
    - 语序错误，如Whether did he come isn't known.，应为Whether he came。
    - 混淆that和whether，如That he will come is not decided.，应为Whether。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:主谓一致
  type: Concept
  subject: 英语
  title: 主谓一致
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：主语和谓语不一致，如The number of students are large.，应为is…
    - 能指出并纠正这一错误：受就近名词影响，如A box of apples are on the table.，应为is。
  aliases: []
  category: 语法
  explanation: 主语和谓语在数上保持一致，单数主语用单数谓语，复数主语用复数谓语。
  misconceptions:
    - 主语和谓语不一致，如The number of students are large.，应为is。
    - 受就近名词影响，如A box of apples are on the table.，应为is。
    - 把news当作复数，如The news are good.，应为is。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C16/sections/S1.md
- id: concept:英语:习语（idiom）
  type: Concept
  subject: 英语
  title: 习语（idiom）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：按字面翻译习语，将a piece of cake理解为“一块蛋糕”而忽视“小菜一碟”。
    - 能指出并纠正这一错误：把serve somebody right直译为“为某人服务”，实际意思是“活该”。
  aliases:
    - 习惯用语
  category: 词汇
  explanation: 习语是固定表达，意思往往不是字面含义，如a piece of cake表示“小菜一碟”，serve somebody right表示“活该”。
  misconceptions:
    - 按字面翻译习语，将a piece of cake理解为“一块蛋糕”而忽视“小菜一碟”。
    - 把serve somebody right直译为“为某人服务”，实际意思是“活该”。
    - 把kick the bucket字面理解为“踢水桶”，忽略了“去世”的喻义。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:书评结构
  type: Concept
  subject: 英语
  title: 书评结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只写情节复述，不写个人观点和推荐，书评变成内容简介。
