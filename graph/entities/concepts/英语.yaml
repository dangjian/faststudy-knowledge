  masteryCriteria:
    - 能指出并纠正这一错误：用 "big number" 或 "small number" 修饰数值，应使用 high 或 …
    - 能指出并纠正这一错误：混淆 "the number of"（谓语单数）与 "a number of"（谓语复数），如 …
