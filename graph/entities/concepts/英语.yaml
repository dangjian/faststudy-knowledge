    - 用逗号连接两个完整句子，如‘I like tea, he likes coffee’缺少并列连词。
    - both...and...连接三个并列成分，如‘both A, B and C’。
    - 混淆but和and，在转折关系中用and，如‘He is poor and honest’应为but。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C11/sections/S1.md
- id: concept:英语:序数词
