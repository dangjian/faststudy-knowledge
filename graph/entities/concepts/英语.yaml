  masteryCriteria:
    - 能指出并纠正这一错误：把'科学'笼统说成 science，但初中 science 单指综合科学课，物理化学不是 sci…
    - 能指出并纠正这一错误：用 do lessons 表示上课，应说 have lessons，如 'I do math l…
