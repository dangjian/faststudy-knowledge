  subject: 英语
  title: Adverbial Clauses of Purpose
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写I got up early so that I catch the first bus.，s…
    - 能指出并纠正这一错误：写He spoke slowly so that everyone understood him…
  aliases:
    - so that-clauses
  category: Grammar
  explanation: Adverbial clauses of purpose often begin with 'so that' and express
    the purpose or intention of the action in the main clause.
  misconceptions:
    - 写I got up early so that I catch the first bus.，so that后缺少can/could
    - 写He spoke slowly so that everyone understood him.，应用could understand
    - 在so that后误用will：I study hard so that I will pass.，应用can或may
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C3/sections/S1.md
- id: concept:英语:Adverbial Clauses of Time
