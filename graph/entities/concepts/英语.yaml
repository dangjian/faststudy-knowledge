    - 把 fun 误写成 funny，如 'Maths is funny' 成了滑稽的，不是有趣。
    - 用名词 interest 代替 interesting，写 'English is very interest'，缺少 -ing。
    - 用 -ed 形容词描述科目，如 'I'm boring in science'，应为 boring 形容物、bored 形容人。
