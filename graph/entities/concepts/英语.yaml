    - 用 "a manner" 表示“一种礼貌”，实际 manners 是复数名词。
    - 将 "table manners" 写成 "table manner"，漏掉 s 后意思变成“餐桌方式”。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:might/could表推测
  type: Concept
  subject: 英语
  title: might/could表推测
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：以为might只能用于过去时，如‘He might be at home’不能指现在。
    - 能指出并纠正这一错误：误用couldn't表示‘不可能’，语气弱于can't。
  aliases:
    - might be
    - could be
  category: 语法
  explanation: might和could用于表示某事可能是真的，但不确定。
  misconceptions:
    - 以为might只能用于过去时，如‘He might be at home’不能指现在。
    - 误用couldn't表示‘不可能’，语气弱于can't。
    - 忽略might not表示‘可能不’，不是‘不可能’。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C8/sections/S1.md
- id: concept:英语:musical note
  type: Concept
  subject: 英语
