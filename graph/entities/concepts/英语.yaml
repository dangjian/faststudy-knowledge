  misconceptions:
    - 混淆小说类型，如把科幻误写为历史小说。
    - 只写主要人物，不写作者或书名。
    - 把书评要素与演讲要素混淆，写作者而不是作者。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C7/sections/S1.md
- id: concept:英语:事实与观点
  type: Concept
  subject: 英语
  title: 事实与观点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到“I think”就断定是观点，但“I think the earth is round”其…
    - 能指出并纠正这一错误：把所有带be动词的句子都当成事实，如“The movie is boring”是观点。
  aliases:
    - fact and opinion
  category: 阅读理解
  explanation: 事实是真实的陈述，观点表达感受或信念，可能真实也可能不真实。通过关键词如“think”或“believe”来识别观点。
  misconceptions:
    - 看到“I think”就断定是观点，但“I think the earth is round”其实是事实。
    - 把所有带be动词的句子都当成事实，如“The movie is boring”是观点。
    - 将“believe that”之后的从句一律视为观点，忽略客观事实部分。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C1/sections/S1.md
- id: concept:英语:五感动词
