    - 认为学习习惯只是制定计划，不执行也没关系，如只列计划不行动。
    - 把学习习惯等同于天赋，认为聪明人不需要学习习惯。
    - 认为学习习惯只有上课认真听讲，忽视主动复习和提问。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C15/sections/S1.md
- id: concept:英语:学校旅行
