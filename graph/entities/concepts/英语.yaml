    lonely/loneliness, shocked/shock, stressed/stress, worried/worry.
  misconceptions:
    - 写I feel loneliness，误把名词当形容词，应说I feel lonely
    - 把shocked误当名词：The news was a shocked to me，应说shock
    - 写Don't have too much worried，误用形容词worried当名词
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C3/sections/S1.md
- id: concept:英语:Adjectives ending in -ed and -ing
  type: Concept
  subject: 英语
  title: Adjectives ending in -ed and -ing
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：“I am boring”想表达“我感到无聊”，实际应说“I am bored”。
    - 能指出并纠正这一错误：“The book is interested”想表达“这本书有意思”，实际应说“The boo…
  aliases:
    - -ed/-ing形容词
    - adjective endings -ed and -ing
    - 形容词后缀
  category: Grammar
  explanation: -ed adjectives describe feelings, -ing adjectives describe things
    that cause feelings, e.g., confused vs. confusing.
  misconceptions:
    - “I am boring”想表达“我感到无聊”，实际应说“I am bored”。
    - “The book is interested”想表达“这本书有意思”，实际应说“The book is interesting”。
    - “He was exciting about the trip”应改为“excited”，因为描述人的感受。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C6/sections/S1.md
- id: concept:英语:Adjectives to Describe Subjects
