  misconceptions:
    - "'开礼物'误用open presents，却漏掉复数，写成open present"
    - 描述过去生日时用一般现在时，如'I eat cake yesterday'
    - 把'拍照'说成take photo，漏掉冠词a，应说take a photo
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C10/sections/S2.md
