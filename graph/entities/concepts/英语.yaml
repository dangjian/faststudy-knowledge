  subject: 英语
  title: 描述活动的现在进行时句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏掉be动词，如‘I shopping now’错，应说‘I'm shopping’。
    - 能指出并纠正这一错误：动词ing形式拼错，如‘writeing’‘runing’，正确为writing、running…
  aliases: []
  category: 句型
  explanation: 用现在进行时描述正在进行的活动，如I'm shopping. What are you doing?
  misconceptions:
    - 漏掉be动词，如‘I shopping now’错，应说‘I'm shopping’。
    - 动词ing形式拼错，如‘writeing’‘runing’，正确为writing、running。
    - 疑问句语序错误，如‘What you are doing?’错，应为‘What are you doing?’。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C6/sections/S2.md
- id: concept:英语:描述电的用途
  type: Concept
  subject: 英语
  title: 描述电的用途
  conceptType: 应用型
  aliases: []
  category: 句型
  explanation: 用 We use electricity to light/heat/cool... 说说电可以用来照明、取暖、制冷和让机器运转。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C6/sections/S1.md
- id: concept:英语:描述病症的句型
  type: Concept
  subject: 英语
  title: 描述病症的句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用I am a stomachache描述胃痛，正确应为I have a stomachache…
    - 能指出并纠正这一错误：在My throat hurts中多加is，写成My throat is hurts。
  aliases:
    - 表达不适
  category: 句型
  explanation: 如I have a stomachache. My throat hurts. 用于描述自身症状。
  misconceptions:
    - 用I am a stomachache描述胃痛，正确应为I have a stomachache。
    - 在My throat hurts中多加is，写成My throat is hurts。
    - 混淆hurt和pain，说I am pain，实际应为I am in pain或I have a pain。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C2/sections/S1.md
- id: concept:英语:描述社区里的活动
