  misconceptions:
    - 把8,848.86读成eight thousand eight hundred forty-eight point eight six，漏掉and。
    - 小数部分误读为整数，如point eighty-six而非point eight six。
    - 误把数字中的逗号当小数点，读出错误数字。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C4/sections/S1.md
- id: concept:英语:文化差异
