  type: Concept
  subject: 英语
  title: make + 宾语 + 形容词/动词原形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：She made me to laugh. 误加to
    - 能指出并纠正这一错误：The news made me sadly. 误用副词，应为sad
  aliases:
    - make sb. do
    - make sb. adj.
  category: 语法
  explanation: 使役动词 make 后接宾语和宾语补足语，表示“使某人/某物处于某种状态或做某事”。宾语补足语可以是形容词、名词或省略 to 的动词不定式。
  misconceptions:
    - She made me to laugh. 误加to
    - The news made me sadly. 误用副词，应为sad
    - He made the baby crying. 误用动名词，应为cry
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C11/sections/S1.md
- id: concept:英语:make a decision
