  category: 表达
  explanation: 使用句型如“This is...”和“He/She is...”介绍家庭成员及其特征。
  misconceptions:
    - 用“My family has four people.”代替更地道的“There are four people in my family.”
    - 表达家庭成员时漏用所有格，如说“I brother is tall.”应为“My brother is tall.”
    - “There is four people”中be动词用is，未与复数people保持一致。
