  title: 提供食物与礼貌回应
  conceptType: 概念型
  aliases: []
  category: 句型
  explanation: 用 Would you like some...? 问别人要不要吃点什么，想要就说 Yes, please，不想要就礼貌地说 No, thank you。
  sourceRef: content/三年级/下册/英语/PEP-3-2-English/chapters/C4/sections/S2.md
- id: concept:英语:提建议的句型
  type: Concept
  subject: 英语
  title: 提建议的句型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：What about后误接动词原形，如“What about go swimming?”应为go…
    - 能指出并纠正这一错误：How about后误接完整句子，如“How about we go?”，标准用法后接名词或动名…
  aliases:
    - What about...?
    - How about...?
  category: 语法
  explanation: 用 What about...? 或 How about...? 提出建议，后接名词或动名词。
  misconceptions:
    - What about后误接动词原形，如“What about go swimming?”应为going。
    - How about后误接完整句子，如“How about we go?”，标准用法后接名词或动名词。
    - 不知道What about和How about可以互换，误以为一个只能接名词一个只能接动名词。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C1/sections/S1.md
- id: concept:英语:支持性细节（Supporting Details）
  type: Concept
  subject: 英语
  title: 支持性细节（Supporting Details）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写段落只给主题句，没有例子或原因，如Doing exercise is good后无任何说明。
    - 能指出并纠正这一错误：找支撑细节时误将段落首句当作细节，而它通常是主题句。
  aliases:
    - 细节支撑
  category: 阅读策略
  explanation: 支持性细节是段落中用于支撑主要观点的例子、原因、观点或详细信息。
  misconceptions:
    - 写段落只给主题句，没有例子或原因，如Doing exercise is good后无任何说明。
    - 找支撑细节时误将段落首句当作细节，而它通常是主题句。
    - 认为所有细节都同等重要，忽略与主要观点的关联度。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C9/sections/S1.md
- id: concept:英语:故事叙述
  type: Concept
  subject: 英语
  title: 故事叙述
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：讲过去的故事时突然用一般现在时，比如'He walked into the room and s…
    - 能指出并纠正这一错误：按时间顺序讲故事却先写结局再倒回开头，没有用flashback的标记词，让读者困惑。
  aliases:
    - 叙事
  category: 语篇
  explanation: 通过时间顺序和情节发展讲述故事，常使用过去时态。
  misconceptions:
    - 讲过去的故事时突然用一般现在时，比如'He walked into the room and sees a letter'，时态不一致。
    - 按时间顺序讲故事却先写结局再倒回开头，没有用flashback的标记词，让读者困惑。
    - 用'at first'和'finally'只连两句，中间情节用'and then'一逗到底，故事缺乏节奏感。
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C8/sections/S1.md
- id: concept:英语:故事寓意
  type: Concept
  subject: 英语
  title: 故事寓意
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把故事内容复述一遍当寓意，如只说丑小鸭变成了天鹅，不提不要以貌取人
    - 能指出并纠正这一错误：从故事中读出非原意的道理，如认为丑小鸭成功全靠运气，忽视坚持自我
  aliases:
    - 主题
    - moral
  category: 阅读策略
  explanation: 从故事中提炼道理，如丑小鸭故事教导不要以貌取人，要接纳不同。
  misconceptions:
    - 把故事内容复述一遍当寓意，如只说丑小鸭变成了天鹅，不提不要以貌取人
    - 从故事中读出非原意的道理，如认为丑小鸭成功全靠运气，忽视坚持自我
    - 用‘这个道理是’开头空谈，如‘要努力’，而不结合故事具体情节
  sourceRef: content/七年级/下册/英语/PEP-7-2-English/chapters/C8/sections/S3.md
- id: concept:英语:故事时间线
  type: Concept
  subject: 英语
  title: 故事时间线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看事件开头和结尾，忽略中间时间标记词，导致顺序颠倒。
    - 能指出并纠正这一错误：将next和then都理解为同时发生，误以为故事没有先后顺序。
  aliases:
    - timeline
  category: 阅读策略
  explanation: 通过识别故事的开头、中间和结尾来理解事件顺序，注意时间标记词如next, then, finally等。
  misconceptions:
    - 只看事件开头和结尾，忽略中间时间标记词，导致顺序颠倒。
    - 将next和then都理解为同时发生，误以为故事没有先后顺序。
    - 找不到finally，把结尾事件误当中间情节。
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C5/sections/S2.md
- id: concept:英语:教室物品词汇
