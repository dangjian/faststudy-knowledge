  subject: 英语
  title: Adverbial Clauses of Condition
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写If it will rain tomorrow, we will cancel the pi…
    - 能指出并纠正这一错误：If you will come, I will be happy.，will出现在if从句中
  aliases:
    - if-clauses
  category: Grammar
  explanation: Adverbial clauses of condition often begin with 'if' and express a
    condition that must be met for the main clause to happen.
  misconceptions:
    - 写If it will rain tomorrow, we will cancel the picnic.，if从句误用将来时
    - If you will come, I will be happy.，will出现在if从句中
    - 主句用一般现在时：If you come, I go.，主句应用将来时
  sourceRef: content/八年级/下册/英语/PEP-8-2-English/chapters/C3/sections/S1.md
- id: concept:英语:Adverbial Clauses of Purpose
