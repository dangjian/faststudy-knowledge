  misconceptions:
    - 用beautiful形容男性，如“He is beautiful.”应改为“He is handsome.”
    - 混淆“funny”和“kind”，把幽默说成善良，如“He is funny”误写成“He is kind”。
    - 比较级误用，如“more taller”应改为“taller”，双重比较级错误。
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C5/sections/S2.md
- id: concept:英语:描述他人的职业
