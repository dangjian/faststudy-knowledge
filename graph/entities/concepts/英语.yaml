  aliases:
    - taikonaut 中国航天员
  category: 概念
  explanation: 中国航天员叫 taikonauts。在太空里他们用湿布洗脸、用特殊牙膏刷牙，还要种蔬菜、给孩子们上课，每天锻炼保持健康。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C5/sections/S3.md
- id: concept:英语:描述家庭成员的动词短语
  type: Concept
  subject: 英语
  title: 描述家庭成员的动词短语
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把luggage当可数名词，写出“two luggages”，应改为“two pieces of…
    - 能指出并纠正这一错误：误用“put the table”表示摆餐具，实际上应说“set the table”。
  aliases: []
  category: 词汇
  explanation: 课文使用具体动词短语描述家庭成员的行为，如 pull luggage, set the table 等。
