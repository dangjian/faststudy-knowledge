- id: concept:英语:时间状语从句
  type: Concept
  subject: 英语
  title: 时间状语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：when 和 while 混用，误以为都可接短暂动作，如 While he arrived, I…
