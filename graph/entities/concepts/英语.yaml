      are"。
    - 误用 amount 修饰可数名词，如 "a large amount of students"。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:objects of beauty
  type: Concept
  subject: 英语
  title: objects of beauty
