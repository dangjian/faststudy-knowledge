  title: 字母组合 wh 的发音
  conceptType: 概念型
  aliases:
    - wh 的发音
  category: 法则
  explanation: 字母组合 wh 通常发 /w/ 音，如 what、where；但在 who、whose 里发 /h/ 音。
  sourceRef: content/四年级/上册/英语/PEP-4-1-English/chapters/C6/sections/S1.md
- id: concept:英语:字母表
