    - 询问物品误用 What is the number? 应直接问 How many
    - 对 How many 提问回答 It's five，忽略了直接回答数字
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C3/sections/S1.md
- id: concept:英语:特殊疑问词
