  subject: 英语
  title: 字母顺序
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为字母顺序是从后往前排，或混淆大小写顺序，如把‘Apple’排在‘banana’后面
    - 能指出并纠正这一错误：查字典时忽略第二个字母及以后的顺序，只比较首字母，如把‘act’排在‘ate’前面
  aliases:
    - alphabetical order
  category: 词汇学习策略
  explanation: 按字母表顺序排列单词的方法，用于查字典。
  misconceptions:
    - 认为字母顺序是从后往前排，或混淆大小写顺序，如把‘Apple’排在‘banana’后面
    - 查字典时忽略第二个字母及以后的顺序，只比较首字母，如把‘act’排在‘ate’前面
    - 按单词长度而非字母顺序排列，如把‘long’排在‘little’前面
  sourceRef: content/七年级/上册/英语/PEP-7-1-English/chapters/C1/sections/S2.md
- id: concept:英语:学习习惯
