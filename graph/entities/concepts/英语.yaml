  explanation: 3R 指 Reduce（少用）、Reuse（重复使用）、Recycle（回收利用），比如少开空调、自带购物袋、回收旧瓶旧衣。
  sourceRef: content/六年级/上册/英语/PEP-6-1-English/chapters/C6/sections/S2.md
- id: concept:英语:Adaptation
