  subject: 英语
  title: 交朋友
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：Can we make a friend? 中式英语表达交友意愿，应说Would you lik…
    - 能指出并纠正这一错误：I want to make friends with you. 在主动交友场合显得生硬，缺乏礼…
  aliases:
    - making friends
  category: 交际功能
  explanation: 用礼貌用语表达交友意愿，如Would you like to be my friend?
  misconceptions:
    - Can we make a friend? 中式英语表达交友意愿，应说Would you like to be my friend?
