    - 能指出并纠正这一错误：误以为只有by the time和before才能用过去完成时，忽略after等也可。
    - 能指出并纠正这一错误：时间状语位置放错，如I had by 8 o'clock finished it.，应放在句首或…
  aliases: []
  category: 语法
  explanation: 常与by the time, before等引导的时间状语从句连用，表示动作发生的先后顺序。
  misconceptions:
    - 误以为只有by the time和before才能用过去完成时，忽略after等也可。
    - 时间状语位置放错，如I had by 8 o'clock finished it.，应放在句首或句尾。
    - 混淆by the time和when，以为必须用when才能用过去完成时。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C12/sections/S1.md
- id: concept:英语:过去进行时
