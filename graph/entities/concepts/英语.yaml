- id: concept:英语:by the time 引导的时间状语从句
  type: Concept
  subject: 英语
  title: by the time 引导的时间状语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将by the time当作在...期间，如By the time I was eating,…
    - 能指出并纠正这一错误：主句误用一般过去时，如By the time I got home, he already le…
  aliases:
    - by the time引导的时间状语从句
  category: 语法
  explanation: by the time 意为“到……时候”，引导时间状语从句，主句常用过去完成时。
  misconceptions:
    - 误将by the time当作在...期间，如By the time I was eating, he came. 实际是到...时候。
    - 主句误用一般过去时，如By the time I got home, he already left. 应该用had left。
    - 主句从句时态颠倒，如By the time I had arrived, he left.，主句用过去完成时，从句用一般过去时。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C12/sections/S1.md
- id: concept:英语:by the time...
  type: Concept
  subject: 英语
  title: by the time...
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：主句用一般过去时，如 by the time I arrived, he left（应为 had…
    - 能指出并纠正这一错误：把 by the time 当成 until 用，写成 I waited by the time…
  aliases: []
  category: 语法
  explanation: 表示“在……以前”，引导时间状语从句，主句常用过去完成时。
  misconceptions:
    - 主句用一般过去时，如 by the time I arrived, he left（应为 had left）
    - 把 by the time 当成 until 用，写成 I waited by the time he came（应为 until）
    - 从句和主句都写成过去完成时，如 by the time he had come, I had left（从句用一般过去时）
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:call in
