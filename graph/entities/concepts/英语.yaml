- id: concept:英语:定语从句
  type: Concept
  subject: 英语
  title: 定语从句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用what引导定语从句，如The house what she built is big，混淆w…
    - 能指出并纠正这一错误：认为关系代词作宾语时可省略，但介词后也省略，如the house in that she liv…
  aliases:
    - 关系从句
  category: 语法
  explanation: 在复合句中修饰名词或代词的从句，如that she built herself out of rubbish修饰house。
  misconceptions:
    - 用what引导定语从句，如The house what she built is big，混淆what和that/which。
    - 认为关系代词作宾语时可省略，但介词后也省略，如the house in that she lives，应用in which。
    - 混淆when和where，如The day where we met is special，应用when。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C14/sections/S1.md
- id: concept:英语:定语从句（关系代词that/who）
  type: Concept
  subject: 英语
  title: 定语从句（关系代词that/who）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：遗漏关系代词，如The girl wears red dress is my sister，应加…
    - 能指出并纠正这一错误：关系代词作主语时谓语单复数错，如I like music that are exciting，应…
  aliases:
    - 关系代词
    - 定语从句
    - 定语从句（关系代词 who, that, which）
  category: 语法
  explanation: 定语从句用于修饰名词或代词，关系代词that指物或人，who指人。例如：I like music that I can dance
    to. / She likes musicians who write their own lyrics.
  misconceptions:
    - 遗漏关系代词，如The girl wears red dress is my sister，应加who/that。
    - 关系代词作主语时谓语单复数错，如I like music that are exciting，应为that is。
    - 混淆that与who，如He is the man which helped me，应用who/that。
  sourceRef: content/九年级/全一册/英语/PEP-9-0-English/chapters/C9/sections/S1.md
