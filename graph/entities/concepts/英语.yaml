- id: concept:英语:only 引导的倒装句
  type: Concept
  subject: 英语
  title: only 引导的倒装句
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写 "Only after school he came home" 忘记倒装，应为 "did …
    - 能指出并纠正这一错误：误以为只要句首有 only 就倒装，如 "Only can he do it"，实际修饰主语时不…
