    - Blue Whale
  category: 动物知识
  explanation: 蓝鲸是地球上最大最重的动物，生活在除北冰洋外的所有海洋，以微小生物为食，寿命可达90年，对生态系统有重要作用。
  misconceptions:
    - 比较级误用，写Blue whales are bigger than any animal，应为the biggest。
    - 最高级缺the，写成blue whale is biggest animal。
    - 误用a blue whale表示整个物种，应用the blue whale。
  sourceRef: content/八年级/上册/英语/PEP-8-1-English/chapters/C4/sections/S2.md
- id: concept:英语:蔬菜词汇
  type: Concept
  subject: 英语
