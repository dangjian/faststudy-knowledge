  title: 10个一千是一万
  conceptType: 概念型
  aliases:
    - 万的认识
  category: 法则
  explanation: 9999再添1就是10000，一万里面有10个一千。万位上1个珠子表示1个万。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C5/sections/S3.md
- id: concept:数学:10个一是1个十
