  aliases:
    - 十个一是十个
  category: 概念
  explanation: 把10根小棒捆成1捆，就是1个十。10个一合起来是1个十，这样数数更方便。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:10个一百是一千
  type: Concept
  subject: 数学
  title: 10个一百是一千
  conceptType: 概念型
  aliases:
    - 千的认识
  category: 法则
  explanation: 999再添1就是1000，一千里面有10个一百。千位上1个珠子表示1个千。
