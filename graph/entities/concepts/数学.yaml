  explanation: 在游戏和生活中用 10 以内的加减法解决问题，一边摸牌一边算和，根据结果决定还摸不摸牌。
  sourceRef: content/一年级/上册/数学/BSDU-1-1-Math/chapters/C7/sections/S1.md
- id: concept:数学:10以内数的写法
