  aliases: []
  category: 函数性质
  explanation: b 决定图象与 y 轴的交点位置，b 相同则图象交于 y 轴同一点 (0,b)。
  misconceptions:
    - 误认为b是直线与x轴交点的横坐标，如把y=2x+3与x轴交点写成(3,0)。
    - 误认为b相同则两直线平行，如认为y=2x+1与y=3x+1平行，实际它们交于(0,1)。
    - 忽略b=0时图象过原点，误把y=x+1也当成过原点。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:k值对函数图象倾斜程度的影响
  type: Concept
  subject: 数学
  title: k值对函数图象倾斜程度的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为k值越大图象越陡，忽略负数，如认为y=-5x比y=2x平缓，实际|-5|>|2|，y=-5…
    - 能指出并纠正这一错误：误认为k的绝对值越小直线越陡，把陡峭程度与绝对值大小记反。
  aliases:
    - k的绝对值与倾斜程度
  category: 函数性质
  explanation: k的绝对值越大，直线越陡峭，即y随x变化越快。
  misconceptions:
    - 误认为k值越大图象越陡，忽略负数，如认为y=-5x比y=2x平缓，实际|-5|>|2|，y=-5x更陡。
    - 误认为k的绝对值越小直线越陡，把陡峭程度与绝对值大小记反。
    - 认为k的正负决定陡峭程度，正数比负数陡，实际正负只影响方向。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:k值对函数图象的影响
  type: Concept
  subject: 数学
  title: k值对函数图象的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆k的符号与陡峭，如认为k=-2比k=1平缓且下降，实际k=-2更陡。
    - 能指出并纠正这一错误：误认为k>0时图象必过第一、二、三象限，如y=2x-3实际过一、三、四象限。
  aliases: []
  category: 函数性质
  explanation: k 的绝对值越大，直线越陡峭，y 随 x 变化的速度越快；k 的正负决定增减性。
  misconceptions:
    - 混淆k的符号与陡峭，如认为k=-2比k=1平缓且下降，实际k=-2更陡。
    - 误认为k>0时图象必过第一、二、三象限，如y=2x-3实际过一、三、四象限。
    - 误认为k<0时y随x增大而增大，与一次函数增减性混淆。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:k值相同的两个一次函数图象平行
  type: Concept
  subject: 数学
  title: k值相同的两个一次函数图象平行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为b相同则两直线平行，如y=2x+1与y=3x+1平行，实际相交于(0,1)。
    - 能指出并纠正这一错误：误认为k互为相反数时平行，如y=2x+1与y=-2x+1平行，实际相交。
  aliases:
    - 平行条件
  category: 函数图象
  explanation: 如果两个一次函数的k值相同，则它们的图象平行。
  misconceptions:
    - 误认为b相同则两直线平行，如y=2x+1与y=3x+1平行，实际相交于(0,1)。
    - 误认为k互为相反数时平行，如y=2x+1与y=-2x+1平行，实际相交。
    - 误认为k相同且b也相同时两直线平行，实际重合不是平行。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:k和b对一次函数图象的影响
  type: Concept
  subject: 数学
  title: k和b对一次函数图象的影响
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为k越大直线越陡，忽略了k为负数时需比较绝对值（如k=-3比k=2更陡）
    - 能指出并纠正这一错误：误把b当成直线与x轴交点的横坐标，如y=2x+3认为过点(3,0)
  aliases: []
  category: 函数性质
  explanation: k决定直线的倾斜程度和方向，b决定直线与y轴的交点位置。
  misconceptions:
    - 认为k越大直线越陡，忽略了k为负数时需比较绝对值（如k=-3比k=2更陡）
    - 误把b当成直线与x轴交点的横坐标，如y=2x+3认为过点(3,0)
    - 忽略b的正负对图象位置的影响，如认为k>0时必过一、二、三象限，实际上b<0时过一、三、四象限
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:√(a²)=|a|
  type: Concept
  subject: 数学
  title: √(a²)=|a|
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为√(a²)=a，如√((-5)²)写成-5，正确应为5
    - 能指出并纠正这一错误：把√(a²)写成±a，如√4=±2，但算术平方根非负只取2
  aliases: []
  category: 数学公式
  explanation: 对于任意实数a，√(a²)等于a的绝对值，即√(a²)=|a|。
  misconceptions:
    - 认为√(a²)=a，如√((-5)²)写成-5，正确应为5
    - 把√(a²)写成±a，如√4=±2，但算术平方根非负只取2
    - 忽略绝对值符号，直接去掉平方，如√((-7)²)=7，未体现|-7|
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S2.md
- id: concept:数学:∛(a³)=a
  type: Concept
  subject: 数学
  title: ∛(a³)=a
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：类比√(a²)=|a|，把∛(a³)写成|a|，如a=-2时得2，正确为-2
    - 能指出并纠正这一错误：认为负数的立方根是正数，如∛((-2)³)=∛(-8)=2
  aliases: []
  category: 数学公式
  explanation: 对于任意实数a，∛(a³)=a。
  misconceptions:
    - 类比√(a²)=|a|，把∛(a³)写成|a|，如a=-2时得2，正确为-2
    - 认为负数的立方根是正数，如∛((-2)³)=∛(-8)=2
    - 计算∛((-3)³)时，先立方得-27，开立方忘负号得3
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S2.md
- id: concept:数学:《九章算术》盈不足术
  type: Concept
  subject: 数学
  title: 《九章算术》盈不足术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把‘盈3’和‘不足4’都写成加号，列成8x+3=y、7x+4=y，实际应为8x-3=y、7x+4…
    - 能指出并纠正这一错误：用(8x-3)-(7x+4)推导人数时，误将减法写成加法，导致x值增大，如得到2x=7。
  aliases:
    - 盈不足问题
  category: 数学史
  explanation: 中国古代数学著作《九章算术》中解决盈亏问题的方法，可抽象为二元一次方程组。
  misconceptions:
    - 把‘盈3’和‘不足4’都写成加号，列成8x+3=y、7x+4=y，实际应为8x-3=y、7x+4=y。
    - 用(8x-3)-(7x+4)推导人数时，误将减法写成加法，导致x值增大，如得到2x=7。
    - 只列一个方程8x-3=7x+4求人数，漏设物价y，导致二元一次方程组不完整。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S7.md
- id: concept:数学:一元一次不等式
  type: Concept
  subject: 数学
  title: 一元一次不等式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 x^2+1>0 误认为一元一次不等式，忽略未知数次数是2。
    - 能指出并纠正这一错误：把 1/x>1 误认为一元一次不等式，忽略左边不是整式。
  aliases: []
  category: 定义
  explanation: 左右两边都是整式，只含有一个未知数，并且未知数的次数都是1的不等式。
  misconceptions:
    - 把 x^2+1>0 误认为一元一次不等式，忽略未知数次数是2。
    - 把 1/x>1 误认为一元一次不等式，忽略左边不是整式。
    - 认为含参数 a 的 ax>b 一定是一元一次不等式，未讨论 a=0 的情况。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:一元一次不等式与一元一次方程的联系
  type: Concept
  subject: 数学
  title: 一元一次不等式与一元一次方程的联系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为一元一次不等式的解集就是对应一元一次方程的根。
    - 能指出并纠正这一错误：解 ax+b>0 时，只看方程 ax+b=0 的根，不关注 a 的正负，导致范围方向相反。
  aliases: []
  category: 联系
  explanation: 一元一次方程的解是对应一次函数与x轴交点的横坐标，而一元一次不等式的解集是函数图像在x轴上方或下方时自变量的取值范围。
  misconceptions:
    - 误认为一元一次不等式的解集就是对应一元一次方程的根。
    - 解 ax+b>0 时，只看方程 ax+b=0 的根，不关注 a 的正负，导致范围方向相反。
    - 认为不等式与函数图像无关，只靠代数求解，不会利用图像判断 x 的取值范围。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:一元一次不等式与一次函数的关系
  type: Concept
  subject: 数学
  title: 一元一次不等式与一次函数的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求 kx+b>0 的解集时，总是取交点右侧 x>交点，忽略 k<0 时图像下降应取左侧。
    - 能指出并纠正这一错误：认为“函数值大于0”对应函数图像在 x 轴下方，把上方下方搞反。
  aliases:
    - 不等式与函数
    - 一元一次不等式与一次函数
  category: 联系
  explanation: 一元一次不等式可以看作一次函数值大于或小于0的情形，解不等式相当于求函数图像在x轴上方或下方时自变量的取值范围。
  misconceptions:
    - 求 kx+b>0 的解集时，总是取交点右侧 x>交点，忽略 k<0 时图像下降应取左侧。
    - 认为“函数值大于0”对应函数图像在 x 轴下方，把上方下方搞反。
    - 解不等式时不会将不等式化为 y=kx+b，而是随意代入点，导致得不出范围。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:一元一次不等式组
  type: Concept
  subject: 数学
  title: 一元一次不等式组
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 x>1 与 y<2 合在一起称为一元一次不等式组，未知数不同。
    - 能指出并纠正这一错误：认为不等式组内可以包含分式不等式，如 1/x>2 与 x>1 合起来仍是一元一次不等式组。
  aliases: []
  category: 数学概念
  explanation: 关于同一个未知数的几个一元一次不等式合在一起，就组成一个一元一次不等式组。
  misconceptions:
    - 把 x>1 与 y<2 合在一起称为一元一次不等式组，未知数不同。
    - 认为不等式组内可以包含分式不等式，如 1/x>2 与 x>1 合起来仍是一元一次不等式组。
    - 把两个一元二次不等式合在一起当成一元一次不等式组。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S4.md
- id: concept:数学:一元一次不等式组的应用
  type: Concept
  subject: 数学
  title: 一元一次不等式组的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把“至少”列成 > 号，漏掉等号，如至少2人写成 x>2。
    - 能指出并纠正这一错误：求出不等式组的解集后，未根据实际意义取整数解，直接写整个范围。
  aliases:
    - 不等式组应用
  category: 应用
  explanation: 利用一元一次不等式组解决实际问题，关键是找出题目中的不等关系，列出不等式组，并求解。
  misconceptions:
    - 把“至少”列成 > 号，漏掉等号，如至少2人写成 x>2。
    - 求出不等式组的解集后，未根据实际意义取整数解，直接写整个范围。
    - 设未知数时单位不统一，如一边用米一边用厘米，导致列不等式错误。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S4.md
- id: concept:数学:一元一次不等式组的解集
  type: Concept
  subject: 数学
  title: 一元一次不等式组的解集
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求交集时，把 x≥2 与 x>3 的公共部分写成 x≥2，忽略 x>3 更严格。
    - 能指出并纠正这一错误：使用“同大取大”口诀时，不区分是否含等号，例如 x>3 与 x≥2 取 x≥3，实际应取 x>3…
  aliases:
    - 不等式组的解集
  category: 数学概念
  explanation: 一元一次不等式组中各个不等式的解集的公共部分，叫作这个一元一次不等式组的解集。
  misconceptions:
    - 求交集时，把 x≥2 与 x>3 的公共部分写成 x≥2，忽略 x>3 更严格。
    - 使用“同大取大”口诀时，不区分是否含等号，例如 x>3 与 x≥2 取 x≥3，实际应取 x>3。
    - 画数轴找公共部分时，端点虚实点标错，把空心圆圈画成实心，导致多取端点。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S4.md
- id: concept:数学:一元一次方程
  type: Concept
  subject: 数学
  title: 一元一次方程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：方程两边同除以含字母的式子会丢解或产生谬误（如 2x=5x 两边除以 x 得 2=5）
    - 能指出并纠正这一错误：移项不变号，或去分母时漏乘整数项
  aliases:
    - 线性方程
  category: 数学概念
  explanation: 只含有一个未知数，且方程中的代数式都是整式，未知数的次数都是1的方程。
  misconceptions:
    - 方程两边同除以含字母的式子会丢解或产生谬误（如 2x=5x 两边除以 x 得 2=5）
    - 移项不变号，或去分母时漏乘整数项
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C5/sections/S1.md
- id: concept:数学:一元一次方程的应用
  type: Concept
  subject: 数学
  title: 一元一次方程的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：设未知数时不带单位，解出后也不写单位，如设年龄为x，答时写'x岁'导致无单位
    - 能指出并纠正这一错误：找等量关系时凭'多、少'二字定加减，如'甲比乙少3'误列甲=乙+3，实际应为甲=乙-3
  aliases:
    - 列方程解应用题
  category: 数学建模
  explanation: 利用一元一次方程解决实际问题，关键是找出问题中的等量关系，设未知数，列方程求解。
  misconceptions:
    - 设未知数时不带单位，解出后也不写单位，如设年龄为x，答时写'x岁'导致无单位
    - 找等量关系时凭'多、少'二字定加减，如'甲比乙少3'误列甲=乙+3，实际应为甲=乙-3
    - 解方程后不检验，得数为分数还作答人数，如解得x=2.5人
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C5/sections/S3.md
- id: concept:数学:一元二次方程
  type: Concept
  subject: 数学
  title: 一元二次方程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将3x²+1=2x化为一般形式时，错写成3x²+2x+1=0（移项未变号）
    - 能指出并纠正这一错误：认为x²+1=0不是一元二次方程，因它没有一次项
  aliases:
    - quadratic equation with one unknown
  category: 方程
  explanation: 只含有一个未知数x的整式方程，并且都可以化成ax²+bx+c=0（a，b，c为常数，a≠0）的形式，这样的方程叫做一元二次方程。
  misconceptions:
    - 将3x²+1=2x化为一般形式时，错写成3x²+2x+1=0（移项未变号）
    - 认为x²+1=0不是一元二次方程，因它没有一次项
    - 忽略a≠0，把方程2x²+5x=3写成一般形式后，常数项写成-3（移项忘变号）
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S1.md
- id: concept:数学:一元二次方程根的判别式
  type: Concept
  subject: 数学
  title: 一元二次方程根的判别式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算判别式时，将b²误算为-b²，如方程x²-3x+2=0中b=-3，却算成-3²-4×1×2
    - 能指出并纠正这一错误：认为Δ<0时方程没有根，但初中应说‘没有实数根’
  aliases:
    - 判别式
  category: 数学概念
  explanation: 判别式Δ=b²-4ac用于判断一元二次方程根的情况：Δ>0有两个不等实根，Δ=0有两个相等实根，Δ<0无实根。
  misconceptions:
    - 计算判别式时，将b²误算为-b²，如方程x²-3x+2=0中b=-3，却算成-3²-4×1×2
    - 认为Δ<0时方程没有根，但初中应说‘没有实数根’
    - 判别式用错，把一次项系数b直接当正数，忽略b本身带符号
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S7.md
- id: concept:数学:一元二次方程的一般形式
  type: Concept
  subject: 数学
  title: 一元二次方程的一般形式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将方程5-3x=2x²化为一般形式时，写成2x²-3x+5=0，但正确应为2x²+3x-5=0
    - 能指出并纠正这一错误：认为一般形式ax²+bx+c=0中a可以等于0，只要方程是一次式或常数式就行
  aliases:
    - 标准形式
  category: 方程
  explanation: ax²+bx+c=0（a，b，c为常数，a≠0）称为一元二次方程的一般形式，其中ax²，bx，c分别称为二次项、一次项和常数项，a，b分别称为二次项系数和一次项系数。
  misconceptions:
    - 将方程5-3x=2x²化为一般形式时，写成2x²-3x+5=0，但正确应为2x²+3x-5=0
    - 认为一般形式ax²+bx+c=0中a可以等于0，只要方程是一次式或常数式就行
    - 写各项系数时漏掉符号，如4x²-7x+1=0的一次项系数写成7
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S1.md
- id: concept:数学:一元二次方程的应用
  type: Concept
  subject: 数学
  title: 一元二次方程的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：列方程解得两解后，直接把负根也当作答案，未根据实际意义舍去负根
    - 能指出并纠正这一错误：设未知数不带单位，或方程中单位不统一，如路程方程中时间用小时长度用米忘换算
  aliases:
    - 列一元二次方程解应用题
  category: 数学应用
  explanation: 利用一元二次方程解决实际生活中的问题，包括几何、经济、行程等问题，关键在于建立等量关系并求解。
  misconceptions:
    - 列方程解得两解后，直接把负根也当作答案，未根据实际意义舍去负根
    - 设未知数不带单位，或方程中单位不统一，如路程方程中时间用小时长度用米忘换算
    - 平均增长率问题中，把a(1+x)²=b误写成a(1+2x)=b
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S1.md
- id: concept:数学:一元二次方程的根与系数的关系
  type: Concept
  subject: 数学
  title: 一元二次方程的根与系数的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用韦达定理求两根和时，误写成x1+x2=b/a，漏掉负号
    - 能指出并纠正这一错误：未验证方程是否有实数根，直接对无实根的方程应用韦达定理
  aliases:
    - 韦达定理
  category: 定理
  explanation: 若一元二次方程ax²+bx+c=0（a≠0）有两个实数根x1、x2，则x1+x2=-b/a，x1x2=c/a。
  misconceptions:
    - 用韦达定理求两根和时，误写成x1+x2=b/a，漏掉负号
    - 未验证方程是否有实数根，直接对无实根的方程应用韦达定理
    - 求x1²+x2²时，错误地写成(x1+x2)²，忽略减去2x1x2
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S5.md
- id: concept:数学:一元二次方程的求根公式
  type: Concept
  subject: 数学
  title: 一元二次方程的求根公式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求根公式记忆错误，将分母2a写成2，或把-b写成b
    - 能指出并纠正这一错误：代入公式前未把方程化为一般形式，导致a、b、c取值错误
  aliases:
    - 求根公式
  category: 公式
  explanation: 对于一元二次方程ax²+bx+c=0（a≠0），当b²-4ac≥0时，根为x=(-b±√(b²-4ac))/(2a)。
  misconceptions:
    - 求根公式记忆错误，将分母2a写成2，或把-b写成b
    - 代入公式前未把方程化为一般形式，导致a、b、c取值错误
    - 当b²-4ac<0时，仍用求根公式硬算，未判断方程无实根
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:一元二次方程的解法
  type: Concept
  subject: 数学
  title: 一元二次方程的解法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：用直接开平方法解(2x-1)²=9时，只写2x-1=3，漏掉2x-1=-3
    - 能指出并纠正这一错误：配方法解x²+6x+5=0时，在两边加上9，但忘记等式右边也要加，或加错常数
  aliases:
    - 解一元二次方程
  category: 数学方法
  explanation: 包括直接开平方法、配方法、公式法、因式分解法等，用于求解一元二次方程。
  misconceptions:
    - 用直接开平方法解(2x-1)²=9时，只写2x-1=3，漏掉2x-1=-3
    - 配方法解x²+6x+5=0时，在两边加上9，但忘记等式右边也要加，或加错常数
    - 解方程x²=5x时，两边同除以x得x=5，丢根x=0
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S1.md
- id: concept:数学:一元方程
  type: Concept
  subject: 数学
  title: 一元方程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为一元方程中未知数只能出现一次，认为 2x+3=x 不是一元方程
    - 能指出并纠正这一错误：把字母都当未知数，认为 ax+b=0（x 为未知数）含 a、x 两个未知数，不是一元方程
  aliases: []
  category: 数学概念
  explanation: 我国古代称未知数为元，只含有一个未知数的方程叫一元方程，一元方程的解也叫根。
  misconceptions:
    - 误以为一元方程中未知数只能出现一次，认为 2x+3=x 不是一元方程
    - 把字母都当未知数，认为 ax+b=0（x 为未知数）含 a、x 两个未知数，不是一元方程
    - 将一元方程与一元一次方程混为一谈，认为 x²=4 不是一元方程
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C5/sections/S1.md
- id: concept:数学:一次函数
  type: Concept
  subject: 数学
  title: 一次函数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 y=3 当成一次函数，忽略了一次函数必须满足 k≠0，k=0时是常函数。
    - 能指出并纠正这一错误：认为 y=kx+b 中 b 不能为0，误以为 b=0 时不是一次函数，实际正比例函数也是特殊的一…
  aliases:
    - 线性函数
  category: 函数概念
  explanation: 一般地，形如y=kx+b（k，b是常数，k≠0）的函数，叫做一次函数。当b=0时，y=kx是正比例函数。
  misconceptions:
    - 把 y=3 当成一次函数，忽略了一次函数必须满足 k≠0，k=0时是常函数。
    - 认为 y=kx+b 中 b 不能为0，误以为 b=0 时不是一次函数，实际正比例函数也是特殊的一次函数。
    - 将 y=x²+1 误认为一次函数，没有抓住变量的指数必须为1这一关键特征。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:一次函数与一元一次方程的关系
  type: Concept
  subject: 数学
  title: 一次函数与一元一次方程的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：解 kx+b=0 时，误把常数项 b 当作自变量的值，如由 y=2x+3 得解为 3
    - 能指出并纠正这一错误：认为函数图象与 y 轴交点的横坐标是方程的解，实际应是 x 轴交点的横坐标
  aliases:
    - 一次函数与方程的联系
  category: 函数与方程
  explanation: 当一次函数 y=kx+b 的函数值为0时，相应的自变量的值就是方程 kx+b=0 的解；从图象上看，一次函数图象与x轴交点的横坐标就是方程的解。
  misconceptions:
    - 解 kx+b=0 时，误把常数项 b 当作自变量的值，如由 y=2x+3 得解为 3
    - 认为函数图象与 y 轴交点的横坐标是方程的解，实际应是 x 轴交点的横坐标
    - 将方程 kx+b=0 的解等同于函数值 y，忽略解是 x 的值
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S4.md
- id: concept:数学:一次函数与反比例函数图象的交点
  type: Concept
  subject: 数学
  title: 一次函数与反比例函数图象的交点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：联立方程后只取正根，如求 y=2/x 与 y=x-1 的交点，解得 x=2 或 -1，却把 -1…
    - 能指出并纠正这一错误：解出 x 后不代回任一表达式求 y，直接写交点坐标为 (x,0)，漏掉纵坐标
  aliases: []
  category: 函数图象
  explanation: 两个函数图象的交点坐标满足两个函数的表达式，可通过联立方程求解。
  misconceptions:
    - 联立方程后只取正根，如求 y=2/x 与 y=x-1 的交点，解得 x=2 或 -1，却把 -1 舍去，漏掉第二象限交点
    - 解出 x 后不代回任一表达式求 y，直接写交点坐标为 (x,0)，漏掉纵坐标
    - 把两函数表达式相加或相减，而不是令 y 相等，导致所得方程不是交点坐标应满足的方程
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C6/sections/S1.md
- id: concept:数学:一次函数与坐标轴围成的三角形面积
  type: Concept
  subject: 数学
  title: 一次函数与坐标轴围成的三角形面积
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求三角形面积时忘记除以2，如y=2x+4与坐标轴围成面积直接算成8，正确为4
    - 能指出并纠正这一错误：把y=kx+b中的b当横截距，如y=2x+4用b=4作x截距，面积算成8而非4
  aliases: []
  category: 几何应用
  explanation: 一次函数图象与两坐标轴围成的三角形，其面积可通过截距计算。
  misconceptions:
    - 求三角形面积时忘记除以2，如y=2x+4与坐标轴围成面积直接算成8，正确为4
    - 把y=kx+b中的b当横截距，如y=2x+4用b=4作x截距，面积算成8而非4
    - 截距相乘时不取绝对值，得负面积，如y=x-3面积算成-4.5（正确4.5）
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:一次函数中k的实际意义
  type: Concept
  subject: 数学
  title: 一次函数中k的实际意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为k等于直线上某点的y/x，如y=2x+1上的(1,3)，误说k=3
    - 能指出并纠正这一错误：忽略k的负号，说x增加1时y增加|k|，如y=-2x+3说y增加2
  aliases:
    - 斜率的意义
    - 变化率
  category: 函数概念
  explanation: 在一次函数y=kx+b中，k表示自变量x每增加1个单位时，因变量y的变化量，即变化率或速度。
  misconceptions:
    - 认为k等于直线上某点的y/x，如y=2x+1上的(1,3)，误说k=3
    - 忽略k的负号，说x增加1时y增加|k|，如y=-2x+3说y增加2
    - 把k和b混淆，认为k是直线与y轴交点的纵坐标，如y=3x+2说k=2
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:一次函数图象与二元一次方程组的解的关系
  type: Concept
  subject: 数学
  title: 一次函数图象与二元一次方程组的解的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把方程组的解写成坐标时，误将x和y对调，如解为x=1,y=2，却写成交点(2,1)
    - 能指出并纠正这一错误：认为两条一次函数图象不相交（平行）时，方程组一定无解，却忽略两直线重合时有无穷多组解
  aliases:
    - 图象法解方程组
    - 一次函数与二元一次方程组的关系
  category: 数学原理
  explanation: 两条一次函数图象的交点坐标就是对应二元一次方程组的解；反之，二元一次方程组的解对应两条直线的交点坐标。
  misconceptions:
    - 把方程组的解写成坐标时，误将x和y对调，如解为x=1,y=2，却写成交点(2,1)
    - 认为两条一次函数图象不相交（平行）时，方程组一定无解，却忽略两直线重合时有无穷多组解
    - 解出交点坐标后只代入一个方程验证，误以为正确，实际可能不满足另一个方程
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S4.md
- id: concept:数学:一次函数图象与正比例函数图象的关系
  type: Concept
  subject: 数学
  title: 一次函数图象与正比例函数图象的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为y=kx+b是y=kx向上平移b个单位，如b=-3时也向上平移，实际应向下平移3个单位。
    - 能指出并纠正这一错误：误认为y=kx+b的图象过点(b,0)，如y=2x+3过(3,0)，实际过(0,3)。
  aliases:
    - 平移关系
  category: 函数图象
  explanation: 一次函数 y=kx+b 的图象与正比例函数 y=kx 的图象平行，且经过点(0,b)。
  misconceptions:
    - 误认为y=kx+b是y=kx向上平移b个单位，如b=-3时也向上平移，实际应向下平移3个单位。
    - 误认为y=kx+b的图象过点(b,0)，如y=2x+3过(3,0)，实际过(0,3)。
    - 误认为y=kx+b与y=kx的图象交于(0,b)，实际两直线平行无交点（b≠0时）。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:一次函数图象的交点
  type: Concept
  subject: 数学
  title: 一次函数图象的交点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求交点时误将两函数相加为零，如y=2x+1与y=-x+4列成(2x+1)+(-x+4)=0，得x…
    - 能指出并纠正这一错误：联立后移项变号出错，如解2x+3=-x+6写成2x+x=6+3，得x=3（正确x=1）
  aliases:
    - 函数交点
  category: 函数图象
  explanation: 两个一次函数图象的交点坐标表示两个函数值相等时的自变量和因变量值，常用于解决相遇、追及等问题。
  misconceptions:
    - 求交点时误将两函数相加为零，如y=2x+1与y=-x+4列成(2x+1)+(-x+4)=0，得x=-5
    - 联立后移项变号出错，如解2x+3=-x+6写成2x+x=6+3，得x=3（正确x=1）
    - 解出x后忘求y，把交点错写成(1,1)，如y=x+2与y=-x+4
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:一次函数图象的应用
  type: Concept
  subject: 数学
  title: 一次函数图象的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：读图时把纵轴当横轴，导致取错自变量对应的函数值
    - 能指出并纠正这一错误：只看两条线交点位置，不读出交点坐标，无法得到实际数值
  aliases:
    - 利用图象解决问题
  category: 函数应用
  explanation: 通过观察一次函数图象，可以获取函数值、自变量的值以及变化趋势等信息，解决实际问题。
  misconceptions:
    - 读图时把纵轴当横轴，导致取错自变量对应的函数值
    - 只看两条线交点位置，不读出交点坐标，无法得到实际数值
    - 忽略图象与坐标轴交点的实际意义，如出发时刻、距离等
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S4.md
- id: concept:数学:一次函数的图象
  type: Concept
  subject: 数学
  title: 一次函数的图象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：画一次函数图象时只描一个点就连线，忽略两点确定一条直线，导致图象位置错误。
    - 能指出并纠正这一错误：认为 y=2x+1 的图象经过原点，实际当 x=0 时 y=1，图象不过原点。
  aliases:
    - 直线
    - 一次函数图象
    - 直线 y=kx+b
  category: 函数图象
  explanation: 一次函数的图象是一条直线，正比例函数的图象是经过原点的一条直线。
  misconceptions:
    - 画一次函数图象时只描一个点就连线，忽略两点确定一条直线，导致图象位置错误。
    - 认为 y=2x+1 的图象经过原点，实际当 x=0 时 y=1，图象不过原点。
    - 把一次函数图象画成射线或线段，忘记它是一条向两方无限延伸的直线。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:一次函数的图象与性质
  type: Concept
  subject: 数学
  title: 一次函数的图象与性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为k>0时直线必过一、二、三象限，忽略b<0时实际过一、三、四象限（如y=2x-3）
    - 能指出并纠正这一错误：误把b当作直线与x轴交点的横坐标，实际是y轴截距，如y=x+2与y轴交于(0,2)非(-2,0)
  aliases: []
  category: 函数性质
  explanation: 一次函数y=kx+b的图象是一条直线，k决定直线的倾斜方向，b决定直线与y轴的交点位置。
  misconceptions:
    - 认为k>0时直线必过一、二、三象限，忽略b<0时实际过一、三、四象限（如y=2x-3）
    - 误把b当作直线与x轴交点的横坐标，实际是y轴截距，如y=x+2与y轴交于(0,2)非(-2,0)
    - 画图时先由k的斜率直接画，不先找(0,b)，导致直线平移错误，如画y=2x+1仅画y=2x过原点
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:一次函数的增减性
  type: Concept
  subject: 数学
  title: 一次函数的增减性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为k>0时y随x增大而减小，把增减性记反。
    - 能指出并纠正这一错误：误认为b的正负影响增减性，如认为y=2x+1递增，y=2x-1递减，实际k相同增减性相同。
  aliases:
    - k对增减性的影响
  category: 函数性质
  explanation: 在一次函数 y=kx+b 中，当k>0时，y随x增大而增大；当k<0时，y随x增大而减小。
  misconceptions:
    - 误认为k>0时y随x增大而减小，把增减性记反。
    - 误认为b的正负影响增减性，如认为y=2x+1递增，y=2x-1递减，实际k相同增减性相同。
    - 误认为k<0时x越大y越大，实际k<0时y随x增大而减小。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:一次函数的应用
  type: Concept
  subject: 数学
  title: 一次函数的应用
  conceptType: 建模型
  masteryCriteria:
    - 能指出并纠正这一错误：实际问题中忽略自变量取值范围，如弹簧长度超过弹性限度，x仍取正数导致结果无意义
    - 能指出并纠正这一错误：将蜡烛燃烧剩余长度误写成 y=4x+20，正确应为 y=20-4x
  aliases: []
  category: 实际应用
  explanation: 利用一次函数模型解决实际问题，如弹簧长度、蜡烛燃烧等。
  misconceptions:
    - 实际问题中忽略自变量取值范围，如弹簧长度超过弹性限度，x仍取正数导致结果无意义
    - 将蜡烛燃烧剩余长度误写成 y=4x+20，正确应为 y=20-4x
    - 把一次函数关系式y=kx+b中的b当起始量时忽略单位换算，如厘米米混用
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S4.md
- id: concept:数学:一次函数的性质
  type: Concept
  subject: 数学
  title: 一次函数的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：函数y=-2x+1中，k<0但误认为y随x增大而增大
    - 能指出并纠正这一错误：比较函数值时只看k不看x，认为k>0则任意x都有y>0
  aliases:
    - 增减性
  category: 函数性质
  explanation: 当k>0时，y随x增大而增大；当k<0时，y随x增大而减小。
  misconceptions:
    - 函数y=-2x+1中，k<0但误认为y随x增大而增大
    - 比较函数值时只看k不看x，认为k>0则任意x都有y>0
    - 误以为增减性与b有关，认为b为正则y随x增大而增大
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S3.md
- id: concept:数学:一次函数的表示方式
  type: Concept
  subject: 数学
  title: 一次函数的表示方式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为表格、图象、表达式三者可以无条件精确互化，忽略表格只能表示有限个点，图象读数有误差
    - 能指出并纠正这一错误：画一次函数图象时不考虑自变量取值范围，误将实际问题的图象画成无限直线
  aliases:
    - 表示方法
  category: 函数表示
  explanation: 一次函数可以用表格、图象和表达式三种方式表示，它们可以相互转化。
  misconceptions:
    - 认为表格、图象、表达式三者可以无条件精确互化，忽略表格只能表示有限个点，图象读数有误差
    - 画一次函数图象时不考虑自变量取值范围，误将实际问题的图象画成无限直线
    - 从表格中取两点求表达式时，若横坐标相同仍认为能确定一次函数，实际不存在竖直的一次函数图象
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:一次函数表达式中k和b的实际意义
  type: Concept
  subject: 数学
  title: 一次函数表达式中k和b的实际意义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在 y=2x+5 中，把 2 当初始值，5 当变化率，颠倒了 k 和 b 的作用
    - 能指出并纠正这一错误：行程问题中误把总路程当 k，实际 k 是速度，b 是初始路程
  aliases:
    - k和b的几何意义
    - 一次函数参数的实际意义
  category: 函数应用
  explanation: 在一次函数 y=kx+b 中，k表示变化率（如速度、单价等），b表示初始值（如初始高度、固定成本等）。
  misconceptions:
    - 在 y=2x+5 中，把 2 当初始值，5 当变化率，颠倒了 k 和 b 的作用
    - 行程问题中误把总路程当 k，实际 k 是速度，b 是初始路程
    - 忽视 k 的符号，如 k 为负表示减少，却仍按增加计算
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S4.md
- id: concept:数学:一次项系数
  type: Concept
  subject: 数学
  title: 一次项系数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为k越大直线越陡，忽略k<0时k越小（绝对值越大）越陡，如k=-3比k=1更陡
    - 能指出并纠正这一错误：误以为k就是直线与x轴夹角的度数，实际上k=tanα，需通过反正切求角
  aliases:
    - 斜率
  category: 函数参数
  explanation: 一次函数y=kx+b中k称为一次项系数，它表示直线的斜率，反映函数值随自变量变化的速率。
  misconceptions:
    - 认为k越大直线越陡，忽略k<0时k越小（绝对值越大）越陡，如k=-3比k=1更陡
    - 误以为k就是直线与x轴夹角的度数，实际上k=tanα，需通过反正切求角
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:一组对边平行且相等的四边形是平行四边形
  type: Concept
  subject: 数学
  title: 一组对边平行且相等的四边形是平行四边形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只证一组对边平行，另一组对边相等就判定为平行四边形，等腰梯形是反例。
    - 能指出并纠正这一错误：把“一组对边平行且相等”误拆成“一组平行、另一组相等”分落在两条边上。
  aliases: []
  category: 判定定理
  explanation: 如果一个四边形的一组对边平行且相等，那么这个四边形是平行四边形。
  misconceptions:
    - 只证一组对边平行，另一组对边相等就判定为平行四边形，等腰梯形是反例。
    - 把“一组对边平行且相等”误拆成“一组平行、另一组相等”分落在两条边上。
    - 只看到一组对边平行，就忽略这组对边是否相等，直接判定平行四边形。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C6/sections/S1.md
- id: concept:数学:七巧板
  type: Concept
  subject: 数学
  title: 七巧板
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 七巧板由7块板组成，里面有三角形、正方形和平行四边形。用这7块板能拼出小动物、房子等各种有趣的图案。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C8/sections/S3.md
- id: concept:数学:万以上的数
  type: Concept
  subject: 数学
  title: 万以上的数
  conceptType: 概念型
  aliases:
    - 大数
    - 比万大的数
  category: 概念
  explanation: 比一万大得多的数，比如全国人口十四亿多、公路总里程五百多万千米。要认识它们，需要新的计数单位和数位。
  sourceRef: content/四年级/上册/数学/BSDU-4-1-Math/chapters/C1/sections/S1.md
- id: concept:数学:万以内数的口算加减法
  type: Concept
  subject: 数学
  title: 万以内数的口算加减法
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 整百、几百几十的数相加减，可以把相同计数单位的数直接相加减。比如4个百加3个百是7个百，400+300=700，也可以在数线上一百一百地数。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C8/sections/S1.md
- id: concept:数学:万以内数的认识
  type: Concept
  subject: 数学
  title: 万以内数的认识
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 万以内的数可以用多种方式表示，比如用计数器、数线，或写成几个千加几个百、几个十、几个一的和。本节综合复习认数、加减法、有余数除法等内容。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C11/sections/S1.md
- id: concept:数学:万以内数的读写
  type: Concept
  subject: 数学
  title: 万以内数的读写
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 写数时几个千就在千位写几，几个百就在百位写几，哪一位上一个也没有就写0。读数时从高位读起，中间的0要读出来，末尾的0不读。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C5/sections/S4.md
- id: concept:数学:三个内角分别相等的两个三角形不一定全等
  type: Concept
  subject: 数学
  title: 三个内角分别相等的两个三角形不一定全等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为三角分别相等就全等，如边长为2和3的两个等边三角形，三个内角都是60°但不全等。
    - 能指出并纠正这一错误：误把AAA当全等判定，忽视三角形大小可变，只保证形状相同。
  aliases: []
  category: 反例
  explanation: 仅三个内角相等不能保证三角形全等，因为形状相同但大小可能不同。
  misconceptions:
    - 认为三角分别相等就全等，如边长为2和3的两个等边三角形，三个内角都是60°但不全等。
    - 误把AAA当全等判定，忽视三角形大小可变，只保证形状相同。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S3.md
- id: concept:数学:三个角都相等的三角形是等边三角形
  type: Concept
  subject: 数学
  title: 三个角都相等的三角形是等边三角形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为有两个角相等就一定有三边相等，忽略了第三个角也要相等。
    - 能指出并纠正这一错误：将“三个角都等于60°”错记为“三个角都等于90°”，导致误判等边三角形。
  aliases:
    - 等边三角形判定定理1
  category: 定理
  explanation: 如果一个三角形的三个角都相等，那么这个三角形是等边三角形。
  misconceptions:
    - 认为有两个角相等就一定有三边相等，忽略了第三个角也要相等。
    - 将“三个角都等于60°”错记为“三个角都等于90°”，导致误判等边三角形。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三位数乘两位数竖式
  type: Concept
  subject: 数学
  title: 三位数乘两位数竖式
  conceptType: 程序型
  aliases:
    - 三位数乘两位数
  category: 方法
  explanation: 用两位数个位、十位上的数分别去乘三位数，再把两次的积对位相加。乘数中间或末尾有 0、计算中有进位时要特别小心。
  sourceRef: content/四年级/上册/数学/BSDU-4-1-Math/chapters/C4/sections/S4.md
- id: concept:数学:三位数加减法竖式
  type: Concept
  subject: 数学
  title: 三位数加减法竖式
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 用竖式计算三位数的加减法，要把相同数位对齐，从个位算起。也可以先加减整百数，再加减剩下的数来口算。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C8/sections/S2.md
- id: concept:数学:三位数的进位加法
  type: Concept
  subject: 数学
  title: 三位数的进位加法
  conceptType: 程序型
  aliases:
    - 连续进位加法
  category: 法则
  explanation: 用竖式算三位数加法，哪一位上的数相加满十，就向前一位进1。如果有进位，算下一位时别忘了加上进来的1。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C8/sections/S3.md
- id: concept:数学:三位数的退位减法
  type: Concept
  subject: 数学
  title: 三位数的退位减法
  conceptType: 程序型
  aliases:
    - 连续退位减法
  category: 法则
  explanation: 用竖式算三位数减法，哪一位不够减，就从前一位退1当10再减。退走的1要记得减掉，中间有0的数要连续退位，比如402减89。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C8/sections/S4.md
- id: concept:数学:三位数连减
  type: Concept
  subject: 数学
  title: 三位数连减
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 从一个数里连续减去两个数，可以从左往右依次减，也可以先把两个减数加起来再一起减。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:三位数连加
  type: Concept
  subject: 数学
  title: 三位数连加
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 计算三个三位数相加，可以用竖式依次相加，也可以先把能凑成整百的数先加；列竖式时别忘了加进位的数。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:三元一次方程
  type: Concept
  subject: 数学
  title: 三元一次方程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为含有三个未知数的方程就是三元一次方程，如把x^2+y+z=1错判为三元一次，忽略x的指数为2…
    - 能指出并纠正这一错误：将xy+z=1误认为三元一次，因为xy这一项的次数是2，不是“项的次数都是1”。
  aliases: []
  category: 数学概念
  explanation: 含有三个未知数，并且含有未知数的项的次数都是1的方程叫做三元一次方程。
  misconceptions:
    - 认为含有三个未知数的方程就是三元一次方程，如把x^2+y+z=1错判为三元一次，忽略x的指数为2。
    - 将xy+z=1误认为三元一次，因为xy这一项的次数是2，不是“项的次数都是1”。
    - 看到x+y=1，认为它也是三元一次方程，但其中只含两个未知数，不满足“含有三个未知数”。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S5.md
- id: concept:数学:三元一次方程组
  type: Concept
  subject: 数学
  title: 三元一次方程组
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为方程组中每个方程都必须含三个未知数，若有一个方程只含两个未知数，就误判不是三元一次方程组。
    - 能指出并纠正这一错误：把两个方程组成的方程组（如x+y+z=1和x-y=2）误认为三元一次方程组，方程个数必须是三个。
  aliases: []
  category: 数学概念
  explanation: 共含有三个未知数的三个一次方程所组成的一组方程，叫做三元一次方程组。
  misconceptions:
    - 认为方程组中每个方程都必须含三个未知数，若有一个方程只含两个未知数，就误判不是三元一次方程组。
    - 把两个方程组成的方程组（如x+y+z=1和x-y=2）误认为三元一次方程组，方程个数必须是三个。
    - 当方程组中某个方程出现x^2或xy时，仍把它当三元一次方程组，忽略“一次”限制。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S5.md
- id: concept:数学:三元一次方程组的解
  type: Concept
  subject: 数学
  title: 三元一次方程组的解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求出x、y后直接认为z=0，而不代入原方程组验证，导致解不是公共解。
    - 能指出并纠正这一错误：只把解代入前两个方程看是否成立，未检验第三个方程，误把非公共解当最终解。
  aliases: []
  category: 数学概念
  explanation: 三元一次方程组中各个方程的公共解，叫做这个三元一次方程组的解。
  misconceptions:
    - 求出x、y后直接认为z=0，而不代入原方程组验证，导致解不是公共解。
    - 只把解代入前两个方程看是否成立，未检验第三个方程，误把非公共解当最终解。
    - 认为三元一次方程组的解只需满足“两个未知数取定，另一个任意”，实际必须三个值同时满足所有方程。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S5.md
- id: concept:数学:三种视图的画法规则
  type: Concept
  subject: 数学
  title: 三种视图的画法规则
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：画左视图时误把物体的左侧面画在视图左侧，实际左视图反映的是物体右侧面形状
    - 能指出并纠正这一错误：将俯视图的长对应到左视图的宽，导致宽不相等
  aliases: []
  category: 法则
  explanation: 主视图反映物体的长和高，俯视图反映物体的长和宽，左视图反映物体的高和宽；画图时对应部分长度相等，俯视图在主视图下方，左视图在主视图右方。
  misconceptions:
    - 画左视图时误把物体的左侧面画在视图左侧，实际左视图反映的是物体右侧面形状
    - 将俯视图的长对应到左视图的宽，导致宽不相等
    - 画图时主视图和左视图的高度不一致，违背高平齐规则
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C5/sections/S1.md
- id: concept:数学:三角函数
  type: Concept
  subject: 数学
  title: 三角函数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为正弦和余弦值都随角度增大而增大，忽视余弦在0°到90°递减。
    - 能指出并纠正这一错误：在任意三角形中直接用两边比求三角函数值，未限定在直角三角形。
  aliases:
    - 三角比
  category: 数学概念
  explanation: 锐角A的正弦、余弦和正切都是∠A的三角函数。
  misconceptions:
    - 认为正弦和余弦值都随角度增大而增大，忽视余弦在0°到90°递减。
    - 在任意三角形中直接用两边比求三角函数值，未限定在直角三角形。
    - 混淆sin、cos、tan定义，把对边比斜边当作cosA。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三角函数的应用
  type: Concept
  subject: 数学
  title: 三角函数的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：在非直角三角形中直接套用sin、cos求解边长。
    - 能指出并纠正这一错误：测高时忘记加上观测者眼睛或仪器的高度，导致结果偏矮。
  aliases: []
  category: 应用方法
  explanation: 利用直角三角形的边角关系解决实际问题，如测量高度、距离、坡度等。
  misconceptions:
    - 在非直角三角形中直接套用sin、cos求解边长。
    - 测高时忘记加上观测者眼睛或仪器的高度，导致结果偏矮。
    - 坡度问题中把坡角的正切值与坡角本身混为一谈。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三角形
  type: Concept
  subject: 数学
  title: 三角形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：三条线段首尾相接就一定是三角形，如1cm、2cm、3cm也画成三角形
    - 能指出并纠正这一错误：认为三角形是由直线或射线围成的图形，而不是线段首尾相接
  aliases:
    - triangle
  category: 定义
  explanation: 由不在同一直线上的三条线段首尾顺次相接所组成的图形叫作三角形。三角形有三条边、三个内角和三个顶点。
  misconceptions:
    - 三条线段首尾相接就一定是三角形，如1cm、2cm、3cm也画成三角形
    - 认为三角形是由直线或射线围成的图形，而不是线段首尾相接
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形三边关系定理
  type: Concept
  subject: 数学
  title: 三角形三边关系定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：判断能否组成三角形时只检查一组两边之和，如3、4、8中4+8>3就认为可以
    - 能指出并纠正这一错误：认为2、3、5能组成三角形，因为2+3=5满足‘不小于’
  aliases:
    - 三角形两边之和大于第三边
    - 三角形两边之差小于第三边
  category: 定理
  explanation: 三角形的任意两边之和大于第三边，任意两边之差小于第三边。
  misconceptions:
    - 判断能否组成三角形时只检查一组两边之和，如3、4、8中4+8>3就认为可以
    - 认为2、3、5能组成三角形，因为2+3=5满足‘不小于’
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形三边垂直平分线的性质
  type: Concept
  subject: 数学
  title: 三角形三边垂直平分线的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为三边垂直平分线的交点到三边的距离相等，实际是到三个顶点的距离相等。
    - 能指出并纠正这一错误：认为所有三角形的三边垂直平分线交点都在三角形内部，钝角三角形交点其实在外部。
  aliases:
    - 外心性质
  category: 定理
  explanation: 三角形三条边的垂直平分线相交于一点，并且这一点到三个顶点的距离相等。
  misconceptions:
    - 误以为三边垂直平分线的交点到三边的距离相等，实际是到三个顶点的距离相等。
    - 认为所有三角形的三边垂直平分线交点都在三角形内部，钝角三角形交点其实在外部。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三角形全等的判定
  type: Concept
  subject: 数学
  title: 三角形全等的判定
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用SSA判定全等，如∠A=∠D，AB=DE，AC=DF但两三角形不全等，反例存在。
    - 能指出并纠正这一错误：误将HL定理用于一般三角形，以为两边及其中一边对角相等即可全等。
  aliases:
    - 全等三角形判定
    - 全等三角形的判定
    - 全等判定
  category: 定理
  explanation: 判定两个三角形全等的方法包括SSS、SAS、ASA、AAS等，以及直角三角形中的HL。
  misconceptions:
    - 用SSA判定全等，如∠A=∠D，AB=DE，AC=DF但两三角形不全等，反例存在。
    - 误将HL定理用于一般三角形，以为两边及其中一边对角相等即可全等。
    - 写全等时对应顶点顺序不对，如ΔABC≌ΔDFE，导致对应边角判错。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S3.md
- id: concept:数学:三角形全等的判定条件SSS
  type: Concept
  subject: 数学
  title: 三角形全等的判定条件SSS
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把'边边角'当'边边边'，如已知两边和其中一边对角相等就判定全等
    - 能指出并纠正这一错误：用三个角分别相等判定全等，反例：边长2和3的等边三角形三角都是60°但不全等
  aliases:
    - 边边边
  category: 定理
  explanation: 三边分别相等的两个三角形全等。
  misconceptions:
    - 误把'边边角'当'边边边'，如已知两边和其中一边对角相等就判定全等
    - 用三个角分别相等判定全等，反例：边长2和3的等边三角形三角都是60°但不全等
    - 写全等时对应顶点不按顺序，导致对应边配对错误
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S5.md
- id: concept:数学:三角形全等的条件（三边）
  type: Concept
  subject: 数学
  title: 三角形全等的条件（三边）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：已知两边相等就直呼全等，漏掉第三边，如AB=DE、AC=DF再加SSS才能判定。
    - 能指出并纠正这一错误：把SSA当SSS使用，如两边及其中一边对角相等，不能判定全等。
  aliases:
    - 边边边
    - SSS
  category: 判定定理
  explanation: 三边分别相等的两个三角形全等（SSS），是探索三角形全等条件之一。
  misconceptions:
    - 已知两边相等就直呼全等，漏掉第三边，如AB=DE、AC=DF再加SSS才能判定。
    - 把SSA当SSS使用，如两边及其中一边对角相等，不能判定全等。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S3.md
- id: concept:数学:三角形内角和定理
  type: Concept
  subject: 数学
  title: 三角形内角和定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求第三个内角时用360°减去两个已知角，如40°、60°的第三个角算成260°
    - 能指出并纠正这一错误：已知两角为40°和60°，第三个角直接写成40°+60°=100°
  aliases:
    - 三角形内角和为180°
  category: 定理
  explanation: 三角形三个内角的和等于180°。
  misconceptions:
    - 求第三个内角时用360°减去两个已知角，如40°、60°的第三个角算成260°
    - 已知两角为40°和60°，第三个角直接写成40°+60°=100°
    - 设三个角为2x、3x、4x，列方程时写成2x+3x+4x=360°
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三角形外角大于不相邻内角
  type: Concept
  subject: 数学
  title: 三角形外角大于不相邻内角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：说三角形的一个外角大于任何内角，忘了相邻内角可能比外角大。
    - 能指出并纠正这一错误：比较外角与内角时，误将相邻内角也算进去，没有排除不相邻条件。
  aliases:
    - 外角大于不相邻内角
  category: 推论
  explanation: 三角形的一个外角大于任何一个与它不相邻的内角。
  misconceptions:
    - 说三角形的一个外角大于任何内角，忘了相邻内角可能比外角大。
    - 比较外角与内角时，误将相邻内角也算进去，没有排除不相邻条件。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三角形外角定理
  type: Concept
  subject: 数学
  title: 三角形外角定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算外角时，误把相邻内角也加进去，得到“外角等于三个内角和”。
    - 能指出并纠正这一错误：把外角定理写成“外角等于两个内角的差”，或已知两内角求外角时用360°减。
  aliases:
    - 外角定理
    - 外角性质
  category: 定理
  explanation: 三角形的一个外角等于与它不相邻的两个内角的和；三角形的一个外角大于任何一个与它不相邻的内角。
  misconceptions:
    - 计算外角时，误把相邻内角也加进去，得到“外角等于三个内角和”。
    - 把外角定理写成“外角等于两个内角的差”，或已知两内角求外角时用360°减。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三角形外角的定义
  type: Concept
  subject: 数学
  title: 三角形外角的定义
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：画外角时把三角形内部的角当作外角，外角必须在边的延长线上。
    - 能指出并纠正这一错误：把外角理解为三角形的一边与另一边的延长线组成的角，漏了“反向”两字。
  aliases:
    - 外角
  category: 定义
  explanation: 三角形内角的一条边与另一条边的反向延长线所组成的角，叫作三角形的外角。
  misconceptions:
    - 画外角时把三角形内部的角当作外角，外角必须在边的延长线上。
    - 把外角理解为三角形的一边与另一边的延长线组成的角，漏了“反向”两字。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:三角形的三条角平分线交于一点
  type: Concept
  subject: 数学
  title: 三角形的三条角平分线交于一点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为只有等腰三角形或等边三角形的三条角平分线才交于一点，任意三角形则不一定。
    - 能指出并纠正这一错误：把三角形的角平分线画成从顶点到对边中点的线段，与中线混淆，导致交点错误。
  aliases: []
  category: 几何定理
  explanation: 三角形的三条角平分线交于一点。
  misconceptions:
    - 误认为只有等腰三角形或等边三角形的三条角平分线才交于一点，任意三角形则不一定。
    - 把三角形的角平分线画成从顶点到对边中点的线段，与中线混淆，导致交点错误。
    - 误以为三条角平分线的交点与三条中线的交点位置相同。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形的三条高所在的直线交于一点
  type: Concept
  subject: 数学
  title: 三角形的三条高所在的直线交于一点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为钝角三角形三条高线交点在形内，忘记高线是直线可以延伸，交点在外部。
    - 能指出并纠正这一错误：画钝角三角形高时，不延长对边，将垂线段画在形内，导致三条高线无法交于一点。
  aliases: []
  category: 几何定理
  explanation: 三角形的三条高所在的直线交于一点。
  misconceptions:
    - 误以为钝角三角形三条高线交点在形内，忘记高线是直线可以延伸，交点在外部。
    - 画钝角三角形高时，不延长对边，将垂线段画在形内，导致三条高线无法交于一点。
    - 认为直角三角形只有一条高线，忽略两条直角边也是高，因而无法理解三条高线交于直角顶点。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形的中位线
  type: Concept
  subject: 数学
  title: 三角形的中位线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把三角形中位线画成顶点到对边中点的连线，误当中线使用。
    - 能指出并纠正这一错误：认为中位线必须经过三角形顶点。
  aliases:
    - 中位线
  category: 定义
  explanation: 连接三角形两边中点的线段叫作三角形的中位线。
  misconceptions:
    - 把三角形中位线画成顶点到对边中点的连线，误当中线使用。
    - 认为中位线必须经过三角形顶点。
    - 把连接两边任意两点的线段都当成中位线，忘了必须同时经过两边中点。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C6/sections/S1.md
- id: concept:数学:三角形的中位线定理
  type: Concept
  subject: 数学
  title: 三角形的中位线定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只记中位线等于第三边的一半，丢掉“平行于第三边”这一条件。
    - 能指出并纠正这一错误：误把中位线等于它相邻边的一半，而定理说的是第三边。
  aliases:
    - 中位线定理
    - 三角形中位线定理
  category: 定理
  explanation: 三角形的中位线平行于第三边，且等于第三边的一半。
  misconceptions:
    - 只记中位线等于第三边的一半，丢掉“平行于第三边”这一条件。
    - 误把中位线等于它相邻边的一半，而定理说的是第三边。
    - 应用时把中位线与第三边的倍数关系写反，比如写成第三边等于中位线一半。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C6/sections/S1.md
- id: concept:数学:三角形的中线
  type: Concept
  subject: 数学
  title: 三角形的中线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为三角形的中线是直线而不是线段，误以为它无限延伸。
    - 能指出并纠正这一错误：把中线与高线混淆，误认为中线一定垂直于对边。
  aliases: []
  category: 几何概念
  explanation: 在三角形中，连接一个顶点与它对边中点的线段叫作三角形的中线。
  misconceptions:
    - 认为三角形的中线是直线而不是线段，误以为它无限延伸。
    - 把中线与高线混淆，误认为中线一定垂直于对边。
    - 误以为任意连接顶点和对边一点的线段都是中线，未检查是否过中点。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形的任意两边之和大于第三边
  type: Concept
  subject: 数学
  title: 三角形的任意两边之和大于第三边
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：判断三边2,5,8时，只看2+8>5和5+8>2，忽略2+5<8，误认为能构成三角形。
    - 能指出并纠正这一错误：认为两边之和等于第三边也能构成三角形，如三边2,3,5被误判为可行。
  aliases:
    - 三角形三边关系
  category: 定理
  explanation: 三角形的任意两边之和大于第三边。
  misconceptions:
    - 判断三边2,5,8时，只看2+8>5和5+8>2，忽略2+5<8，误认为能构成三角形。
    - 认为两边之和等于第三边也能构成三角形，如三边2,3,5被误判为可行。
    - 三边3,4,7中，因7-4=3满足‘两边之差小于第三边’就以为能构成，忽略3+4=7。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形的内切圆
  type: Concept
  subject: 数学
  title: 三角形的内切圆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把内心当作三边垂直平分线交点，导致画错内切圆圆心。
    - 能指出并纠正这一错误：认为内心到三角形三个顶点距离相等，实际是到三边距离相等。
  aliases:
    - 内切圆
    - 内心
  category: 定义
  explanation: 和三角形三边都相切的圆叫做三角形的内切圆，内切圆的圆心是三角形三条角平分线的交点，叫做三角形的内心。
  misconceptions:
    - 把内心当作三边垂直平分线交点，导致画错内切圆圆心。
    - 认为内心到三角形三个顶点距离相等，实际是到三边距离相等。
    - 求内切圆半径时直接用面积除以三边之和，忘乘2，实际r=2S/(a+b+c)。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S8.md
- id: concept:数学:三角形的分类
  type: Concept
  subject: 数学
  title: 三角形的分类
  conceptType: 概念型
  aliases:
    - 三角形分类
  category: 概念
  explanation: 按角分，三角形有锐角三角形、直角三角形和钝角三角形三类；按边分，有等腰三角形、等边三角形和三边都不相等的三角形。
  sourceRef: content/四年级/下册/数学/BSDU-4-2-Math/chapters/C2/sections/S2.md
- id: concept:数学:三角形的外接圆
  type: Concept
  subject: 数学
  title: 三角形的外接圆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为外心到三边距离相等，实际是到三个顶点距离相等。
    - 能指出并纠正这一错误：钝角三角形外心画在三角形内部，实际应在外部。
  aliases:
    - 外接圆
    - 外心
  category: 定义
  explanation: 三角形的三个顶点确定一个圆，这个圆叫做三角形的外接圆，外接圆的圆心是三角形三边垂直平分线的交点，叫做三角形的外心。
  misconceptions:
    - 认为外心到三边距离相等，实际是到三个顶点距离相等。
    - 钝角三角形外心画在三角形内部，实际应在外部。
    - 把外心与重心混淆，不知外心是垂直平分线交点。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S6.md
- id: concept:数学:三角形的稳定性
  type: Concept
  subject: 数学
  title: 三角形的稳定性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为边长3、4、5的三角形可作锐角或钝角，忽视三边固定则形状唯一。
    - 能指出并纠正这一错误：以为四边形添加对角线后仍不稳定，实际分割成三角形后已稳定。
  aliases:
    - 三角形稳定
  category: 几何性质
  explanation: 三角形三边长度确定后，其形状和大小完全确定，因此三角形具有稳定性，即三角形框架不易变形。
  misconceptions:
    - 认为边长3、4、5的三角形可作锐角或钝角，忽视三边固定则形状唯一。
    - 以为四边形添加对角线后仍不稳定，实际分割成三角形后已稳定。
    - 将稳定性理解为只有等边三角形稳定，等腰或不等边三角形易变形。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S3.md
- id: concept:数学:三角形的角平分线
  type: Concept
  subject: 数学
  title: 三角形的角平分线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为三角形的角平分线是射线而不是线段，误以为它可无限延伸。
    - 能指出并纠正这一错误：误以为三角形的角平分线平分对边，将其性质与中线混淆。
  aliases: []
  category: 几何概念
  explanation: 在三角形中，一个内角的角平分线与它的对边相交，这个角的顶点与交点之间的线段叫作三角形的角平分线。
  misconceptions:
    - 认为三角形的角平分线是射线而不是线段，误以为它可无限延伸。
    - 误以为三角形的角平分线平分对边，将其性质与中线混淆。
    - 把三角形的角平分线画成过顶点且垂直于对边的线段，与高线混淆。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形的重心
  type: Concept
  subject: 数学
  title: 三角形的重心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为重心是三条角平分线的交点，实际是三条中线的交点。
    - 能指出并纠正这一错误：误认为重心是三条高的交点，与垂心混淆。
  aliases: []
  category: 几何概念
  explanation: 三角形的三条中线交于一点，这个点称为三角形的重心。
  misconceptions:
    - 误认为重心是三条角平分线的交点，实际是三条中线的交点。
    - 误认为重心是三条高的交点，与垂心混淆。
    - 以为重心可能在三角形外部或边上，实际它一定在三角形内部。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形的高
  type: Concept
  subject: 数学
  title: 三角形的高
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：画钝角三角形的高时，不延长对边，将垂线段画在三角形内部，导致高线位置错误。
    - 能指出并纠正这一错误：误以为直角三角形只有一条高，忽略两条直角边也是高。
  aliases:
    - 高线
  category: 几何概念
  explanation: 从三角形的一个顶点向它的对边所在直线作垂线，顶点和垂足之间的线段叫作三角形的高线，简称三角形的高。
  misconceptions:
    - 画钝角三角形的高时，不延长对边，将垂线段画在三角形内部，导致高线位置错误。
    - 误以为直角三角形只有一条高，忽略两条直角边也是高。
    - 认为三角形的高是直线而非线段，画图时没有顶点和垂足两端界限。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:三角形面积公式
  type: Concept
  subject: 数学
  title: 三角形面积公式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算三角形面积时忘记乘½，直接用底×高。
    - 能指出并纠正这一错误：底和高不垂直，误将斜边当底，高取另一条边。
  aliases: []
  category: 几何公式
  explanation: 三角形面积等于底乘以高的一半，即S=1/2×底×高。
  misconceptions:
    - 计算三角形面积时忘记乘½，直接用底×高。
    - 底和高不垂直，误将斜边当底，高取另一条边。
    - 已知两边长度直接相乘求面积，忽略夹角。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S1.md
- id: concept:数学:三边成比例的两个三角形相似
  type: Concept
  subject: 数学
  title: 三边成比例的两个三角形相似
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只比较两边成比例就判定相似，忽略第三边。如2,3,4与4,6,9，两边比相等但三边不成比例。
    - 能指出并纠正这一错误：对应边搞错，比如把最长边对应最短边，导致三边成比例判断失误。
  aliases:
    - SSS相似定理
  category: 定理
  explanation: 如果两个三角形的三边对应成比例，则这两个三角形相似。
  misconceptions:
    - 只比较两边成比例就判定相似，忽略第三边。如2,3,4与4,6,9，两边比相等但三边不成比例。
    - 对应边搞错，比如把最长边对应最短边，导致三边成比例判断失误。
    - 计算比例时单位不统一，一条边用米另一条用厘米，得到错误比例。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:三阶幻方
  type: Concept
  subject: 数学
  title: 三阶幻方
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只检查每行每列的和相等，忽略两条对角线也要和相等，导致填数不符合幻方。
    - 能指出并纠正这一错误：误认为三阶幻方中心格必须填最小数或最大数，实则需要根据数字序列综合确定。
  aliases:
    - 九宫格
  category: 数学概念
  explanation: 由3×3方格组成，每行、每列及两条对角线上的数字之和相等的方阵。
  misconceptions:
    - 只检查每行每列的和相等，忽略两条对角线也要和相等，导致填数不符合幻方。
    - 误认为三阶幻方中心格必须填最小数或最大数，实则需要根据数字序列综合确定。
    - 填幻方时盲目试数，不先求幻方和，导致后续行、列、对角线反复冲突。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C5/sections/S4.md
- id: concept:数学:上北下南左西右东
  type: Concept
  subject: 数学
  title: 上北下南左西右东
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 画平面图或看路线图时，通常按上面是北、下面是南、左面是西、右面是东来确定方向。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C6/sections/S1.md
- id: concept:数学:不可能事件
  type: Concept
  subject: 数学
  title: 不可能事件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“很少发生”当作“不可能发生”，如认为“连续抛硬币10次都正面”是不可能事件
    - 能指出并纠正这一错误：认为不可能事件的概率可以是负数，如写成 -1
  aliases:
    - 确定事件
  category: 数学概念
  explanation: 在一定条件下不可能发生的事件，其概率为0。
  misconceptions:
    - 把“很少发生”当作“不可能发生”，如认为“连续抛硬币10次都正面”是不可能事件
    - 认为不可能事件的概率可以是负数，如写成 -1
    - 将“没有发生”的事件误认为不可能事件，例如“今天没下雨”就是不可能事件
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C3/sections/S1.md
- id: concept:数学:不等式
  type: Concept
  subject: 数学
  title: 不等式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为不等式一定含有未知数，如 3>1 不是不等式。
    - 能指出并纠正这一错误：把 2≠3 当作不等式，教材中不等式用 <、>、≤、≥ 连接，通常不含≠。
  aliases: []
  category: 定义
  explanation: 用符号“<”（或“≤”），“>”（或“≥”）连接的式子叫作不等式。
  misconceptions:
    - 认为不等式一定含有未知数，如 3>1 不是不等式。
    - 把 2≠3 当作不等式，教材中不等式用 <、>、≤、≥ 连接，通常不含≠。
    - 认为不等式只有 > 和 <，漏掉了 ≥ 和 ≤ 也是不等号。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不等式、函数、方程的联系
  type: Concept
  subject: 数学
  title: 不等式、函数、方程的联系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一元一次不等式的解集就是方程的所有解，忽略解是范围。
    - 能指出并纠正这一错误：解 ax+b>0 时，不会联系一次函数图像，只能死算，导致对参数问题束手无策。
  aliases: []
  category: 思想
  explanation: 不等式、函数、方程都是刻画数量关系的重要模型，它们之间有着密切的联系，例如一次函数与一元一次方程、一元一次不等式的关系。
  misconceptions:
    - 认为一元一次不等式的解集就是方程的所有解，忽略解是范围。
    - 解 ax+b>0 时，不会联系一次函数图像，只能死算，导致对参数问题束手无策。
    - 误以为方程与函数、不等式三者是孤立的，不知道一次函数图像与 x 轴交点联系着方程的解。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不等式与分式方程的综合
  type: Concept
  subject: 数学
  title: 不等式与分式方程的综合
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：解分式方程得x=2，未验根就代入不等式，实际x=2使分母为零应舍去
    - 能指出并纠正这一错误：由不等式x<5直接取x=1,2,3,4，忽略人数需为正整数且满足方程中分母不为零
  aliases: []
  category: 数学方法
  explanation: 在分式方程应用中，常需结合不等式确定未知数的取值范围，如根据购买数量限制确定人数范围。
  misconceptions:
    - 解分式方程得x=2，未验根就代入不等式，实际x=2使分母为零应舍去
    - 由不等式x<5直接取x=1,2,3,4，忽略人数需为正整数且满足方程中分母不为零
    - 不等式两边同乘负数未变号，如解-2x>4得x>-2
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:不等式的基本性质
  type: Concept
  subject: 数学
  title: 不等式的基本性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：两边乘同一个负数时，忘记改变不等号方向，如 -2x>4 解得 x>-2。
    - 能指出并纠正这一错误：两边乘（或除以）含未知数的式子时，不讨论其正负，直接约去，如 ax>b 得 x>b/a。
  aliases:
    - 不等式性质
  category: 性质
  explanation: 不等式的基本性质包括：不等式两边加（或减）同一个数（或式子），不等号的方向不变；不等式两边乘（或除以）同一个正数，不等号的方向不变；不等式两边乘（或除以）同一个负数，不等号的方向改变。
  misconceptions:
    - 两边乘同一个负数时，忘记改变不等号方向，如 -2x>4 解得 x>-2。
    - 两边乘（或除以）含未知数的式子时，不讨论其正负，直接约去，如 ax>b 得 x>b/a。
    - 认为两边同乘以0，不等号方向不变，但实际得到等式不再是不等式。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不等式的基本性质1
  type: Concept
  subject: 数学
  title: 不等式的基本性质1
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：移项时没有变号，如 x-2>3 得 x>3-2。
    - 能指出并纠正这一错误：认为两边都加同一个负数，不等号方向要改变，如 x>1 两边加 -2 得 x> -1，但方向不变。
  aliases: []
  category: 性质
  explanation: 不等式的两边都加（或减）同一个代数式，不等号的方向不变。
  misconceptions:
    - 移项时没有变号，如 x-2>3 得 x>3-2。
    - 认为两边都加同一个负数，不等号方向要改变，如 x>1 两边加 -2 得 x> -1，但方向不变。
    - 把移项变号与乘除负数变号混淆，如 x-2<5 移项得 x<7 正确，但写成 x>7。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不等式的基本性质2
  type: Concept
  subject: 数学
  title: 不等式的基本性质2
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：两边乘或除以正数时，误以为不等号方向要改变，如 2x>6 除以2得 x<3。
    - 能指出并纠正这一错误：认为“正数”不包括分数和字母，如两边乘 1/3 不敢用性质，不知道 1/3 是正数。
  aliases: []
  category: 性质
  explanation: 不等式的两边都乘（或除以）同一个正数，不等号的方向不变。
  misconceptions:
    - 两边乘或除以正数时，误以为不等号方向要改变，如 2x>6 除以2得 x<3。
    - 认为“正数”不包括分数和字母，如两边乘 1/3 不敢用性质，不知道 1/3 是正数。
    - 两边乘正数时，只乘一边，另一边漏乘，如 (x+1)/2 > 1 两边乘2只乘左边，得 x+1>1。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不等式的基本性质3
  type: Concept
  subject: 数学
  title: 不等式的基本性质3
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：两边除以负数时忘记变号，如 -3x<9 解得 x<-3。
    - 能指出并纠正这一错误：两边乘负数时，不等号方向变了但符号运算错，如 -x<2 乘 -1 得 x<-2，实际 x>-2。
  aliases: []
  category: 性质
  explanation: 不等式的两边都乘（或除以）同一个负数，不等号的方向改变。
  misconceptions:
    - 两边除以负数时忘记变号，如 -3x<9 解得 x<-3。
    - 两边乘负数时，不等号方向变了但符号运算错，如 -x<2 乘 -1 得 x<-2，实际 x>-2。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不等式的解
  type: Concept
  subject: 数学
  title: 不等式的解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为x>3的解只有一个，比如4，而忽略所有大于3的数都是解
    - 能指出并纠正这一错误：把某个具体值代入成立就说是这个不等式的解集，如说x=5是x>3的解集
  aliases: []
  category: 定义
  explanation: 在一个含有未知数的不等式中，能使不等式成立的未知数的值，叫作不等式的解。
  misconceptions:
    - 认为x>3的解只有一个，比如4，而忽略所有大于3的数都是解
    - 把某个具体值代入成立就说是这个不等式的解集，如说x=5是x>3的解集
    - 解是具体的数值，解集是取值范围，但常被混为一谈
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不等式的解集
  type: Concept
  subject: 数学
  title: 不等式的解集
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：在数轴上表示x>2时向左画，方向反了
    - 能指出并纠正这一错误：认为解集必须包含所有整数，漏掉分数和小数
  aliases:
    - 解集
  category: 定义
  explanation: 一个含有未知数的不等式的所有解，组成这个不等式的解集。
  misconceptions:
    - 在数轴上表示x>2时向左画，方向反了
    - 认为解集必须包含所有整数，漏掉分数和小数
    - 把解集写成{3,4,5}，而不是用范围表示全体
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:不计算比较算式大小
  type: Concept
  subject: 数学
  title: 不计算比较算式大小
  conceptType: 推理型
  aliases: []
  category: 方法
  explanation: 不用算出得数也能比较算式的大小：如果一个加数相同，另一个加数大的算式结果就大；没有相同数时，可以把数拆一拆再比。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C8/sections/S1.md
- id: concept:数学:两三位数乘一位数竖式
  type: Concept
  subject: 数学
  title: 两三位数乘一位数竖式
  conceptType: 程序型
  aliases:
    - 多位数乘一位数的竖式计算
  category: 方法
  explanation: 把两、三位数按数位拆开，分别去乘一位数，再把结果加起来。用竖式计算时，从个位乘起，相同数位对齐。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:两三位数除以一位数竖式
  type: Concept
  subject: 数学
  title: 两三位数除以一位数竖式
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 总复习回顾除法的竖式计算方法：从高位算起，注意商中间和末尾的 0，算完要验算。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C11/sections/S1.md
- id: concept:数学:两个图形成轴对称
  type: Concept
  subject: 数学
  title: 两个图形成轴对称
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为两个全等图形一定成轴对称，忽略还需沿某条直线折叠完全重合
    - 能指出并纠正这一错误：误认为对称轴只能是竖直或水平方向，斜线不能作为两个图形的对称轴
  aliases:
    - 成轴对称
  category: 定义
  explanation: 如果两个平面图形沿一条直线折叠后能够完全重合，那么称这两个图形成轴对称，这条直线叫作这两个图形的对称轴。
  misconceptions:
    - 认为两个全等图形一定成轴对称，忽略还需沿某条直线折叠完全重合
    - 误认为对称轴只能是竖直或水平方向，斜线不能作为两个图形的对称轴
    - 混淆'两个图形成轴对称'与'轴对称图形'，例如把两个分开的三角形说成轴对称图形
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:两位数乘一位数口算
  type: Concept
  subject: 数学
  title: 两位数乘一位数口算
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把两位数拆成整十数和一位数，分别去乘一位数，再把两次的积加起来。比如 14×3 先算 10×3=30、4×3=12，得 42。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C12/sections/S1.md
- id: concept:数学:两位数乘两位数
  type: Concept
  subject: 数学
  title: 两位数乘两位数
  conceptType: 程序型
  aliases:
    - 点子图算乘法
    - 表格算法
  category: 方法
  explanation: 把两个乘数分别拆成整十数和一位数，先分开算再把结果相加，可以借助点子图或表格。如 14×12=14×10+14×2=168。
  sourceRef: content/四年级/上册/数学/BSDU-4-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:两位数乘两位数竖式
  type: Concept
  subject: 数学
  title: 两位数乘两位数竖式
  conceptType: 程序型
  aliases:
    - 两位数乘两位数的笔算
  category: 方法
  explanation: 竖式计算时，先用第二个乘数个位上的数去乘，再用十位上的数去乘（这一步的积表示多少个十），最后把两次的结果相加。
  sourceRef: content/四年级/上册/数学/BSDU-4-1-Math/chapters/C4/sections/S3.md
- id: concept:数学:两位数加减一位数
  type: Concept
  subject: 数学
  title: 两位数加减一位数
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 算45减3时，先把个位上的5减3，十位不变。两位数加减一位数，个位上直接加减。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C7/sections/S2.md
- id: concept:数学:两位数加减两位数
  type: Concept
  subject: 数学
  title: 两位数加减两位数
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 相同数位对齐后再计算：个位和个位相加减，十位和十位相加减。可以用竖式帮助计算。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C10/sections/S1.md
- id: concept:数学:两位数加减整十数
  type: Concept
  subject: 数学
  title: 两位数加减整十数
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 算45加30时，先把十位上的40和30相加，个位不变。整十数只和十位上的数相加减。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C7/sections/S2.md
- id: concept:数学:两位数除以一位数口算
  type: Concept
  subject: 数学
  title: 两位数除以一位数口算
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把两位数拆成整十数和一位数，分别去除，再把两次的商加起来。比如 45÷3 先算 30÷3=10、15÷3=5，得 15。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C12/sections/S1.md
- id: concept:数学:两点之间的距离
  type: Concept
  subject: 数学
  title: 两点之间的距离
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为两点之间的距离就是连接两点的线段，忽略距离是线段的长度。
    - 能指出并纠正这一错误：测量距离时刻度尺没有拉直，沿曲线测量导致读数偏大。
  aliases:
    - 距离
  category: 几何概念
  explanation: 两点之间线段的长度，叫作这两点之间的距离。
  misconceptions:
    - 误认为两点之间的距离就是连接两点的线段，忽略距离是线段的长度。
    - 测量距离时刻度尺没有拉直，沿曲线测量导致读数偏大。
    - 混淆‘线段AB’与‘AB的长度’，说成‘距离是线段AB’。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:两点之间线段最短
  type: Concept
  subject: 数学
  title: 两点之间线段最短
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把结论错说成‘两点之间直线最短’，直线无限长，应为线段最短。
    - 能指出并纠正这一错误：误用‘垂线段最短’到任意两点间，那是点到直线的距离性质。
  aliases: []
  category: 公理
  explanation: 两点之间的所有连线中，线段最短。
  misconceptions:
    - 把结论错说成‘两点之间直线最短’，直线无限长，应为线段最短。
    - 误用‘垂线段最短’到任意两点间，那是点到直线的距离性质。
    - 比较路径长度时认为折线一定比曲线短，实际两点间线段才最短。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:两点确定一条直线
  type: Concept
  subject: 数学
  title: 两点确定一条直线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为过两点可以画无数条直线，实际只有一条。
    - 能指出并纠正这一错误：把‘两点确定一条直线’错写成‘两点确定一条射线’。
  aliases:
    - 经过两点有且只有一条直线
  category: 公理
  explanation: 经过两点有且只有一条直线，简述为两点确定一条直线。
  misconceptions:
    - 误认为过两点可以画无数条直线，实际只有一条。
    - 把‘两点确定一条直线’错写成‘两点确定一条射线’。
    - 忽略‘有且只有一条’，以为经过两点的直线至少有一条，但可以不只一条。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:两直线平行，内错角相等
  type: Concept
  subject: 数学
  title: 两直线平行，内错角相等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到内错角就相等，忽略前提是两直线平行（如不平行的两条线被截，内错角不等）
    - 能指出并纠正这一错误：找内错角时，误把同旁内角当成内错角，导致等量关系用错
  aliases:
    - 平行线性质定理2
  category: 定理
  explanation: 两条平行直线被第三条直线所截，内错角相等。
  misconceptions:
    - 看到内错角就相等，忽略前提是两直线平行（如不平行的两条线被截，内错角不等）
    - 找内错角时，误把同旁内角当成内错角，导致等量关系用错
    - 在平行线中，把内错角与同位角混用，如将内错角写成同位角
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S3.md
- id: concept:数学:两直线平行，同位角相等
  type: Concept
  subject: 数学
  title: 两直线平行，同位角相等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：忽略两直线平行，直接说同位角相等（如两条不平行直线被截，同位角不相等）
    - 能指出并纠正这一错误：找同位角时，位置判断错，把同侧但不同位置的角当同位角
  aliases:
    - 平行线性质定理1
  category: 定理
  explanation: 两条平行直线被第三条直线所截，同位角相等。
  misconceptions:
    - 忽略两直线平行，直接说同位角相等（如两条不平行直线被截，同位角不相等）
    - 找同位角时，位置判断错，把同侧但不同位置的角当同位角
    - 平行线中，误将内错角当同位角来求角相等
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S3.md
- id: concept:数学:两直线平行，同旁内角互补
  type: Concept
  subject: 数学
  title: 两直线平行，同旁内角互补
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把同旁内角记成相等，如认为∠1=∠2，其实应∠1+∠2=180°
    - 能指出并纠正这一错误：忽略平行前提，认为同旁内角一定互补
  aliases:
    - 平行线性质定理3
  category: 定理
  explanation: 两条平行直线被第三条直线所截，同旁内角互补。
  misconceptions:
    - 把同旁内角记成相等，如认为∠1=∠2，其实应∠1+∠2=180°
    - 忽略平行前提，认为同旁内角一定互补
    - 计算同旁内角互补时，将互补理解为互余（加起来90°）
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S3.md
- id: concept:数学:两组对边分别相等的四边形是平行四边形
  type: Concept
  subject: 数学
  title: 两组对边分别相等的四边形是平行四边形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只验证两组邻边分别相等就判定平行四边形，如筝形。
    - 能指出并纠正这一错误：一组对边相等、另一组对边平行不一定是平行四边形，等腰梯形是反例。
  aliases: []
  category: 判定定理
  explanation: 如果一个四边形的两组对边分别相等，那么这个四边形是平行四边形。
  misconceptions:
    - 只验证两组邻边分别相等就判定平行四边形，如筝形。
    - 一组对边相等、另一组对边平行不一定是平行四边形，等腰梯形是反例。
    - 认为两组对边分别相等还不够，非要再加一个直角才认可平行四边形。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C6/sections/S1.md
- id: concept:数学:两角分别相等的两个三角形相似
  type: Concept
  subject: 数学
  title: 两角分别相等的两个三角形相似
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只验证一个角相等就判定相似，如∠A=∠D，但∠B不一定等于∠E。
    - 能指出并纠正这一错误：把两角分别相等误认为两角之和相等，例如两个三角形各有一组角和为120°就判定相似。
  aliases:
    - AA相似定理
  category: 定理
  explanation: 如果两个三角形的两角分别相等，则这两个三角形相似。
  misconceptions:
    - 只验证一个角相等就判定相似，如∠A=∠D，但∠B不一定等于∠E。
    - 把两角分别相等误认为两角之和相等，例如两个三角形各有一组角和为120°就判定相似。
    - 在直角三角形中，误认为必须两个锐角都相等，其实一个锐角相等另一个必相等。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:两边及其中一边的对角对应相等不能判定全等
  type: Concept
  subject: 数学
  title: 两边及其中一边的对角对应相等不能判定全等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：已知AB=DE，AC=DF，∠B=∠E就判定全等，忽略∠B是AC的对角而非夹角。
    - 能指出并纠正这一错误：以为SSA与SAS只是字母顺序不同，本质等价，实际SSA不足以保证全等。
  aliases:
    - SSA不能判定全等
  category: 全等三角形判定
  explanation: 两边分别相等且其中一组等边的对角相等的两个三角形不一定全等，这是全等三角形判定的一个反例。
  misconceptions:
    - 已知AB=DE，AC=DF，∠B=∠E就判定全等，忽略∠B是AC的对角而非夹角。
    - 以为SSA与SAS只是字母顺序不同，本质等价，实际SSA不足以保证全等。
    - 画图时两边及一边对角相等，画出两个不同三角形，仍坚持它们全等。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S4.md
- id: concept:数学:两边成比例且夹角相等的两个三角形相似
  type: Concept
  subject: 数学
  title: 两边成比例且夹角相等的两个三角形相似
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：错用SSA：两边成比例且其中一边的对角相等，如AB/DE=AC/DF，∠B=∠E，但∠B不是夹角…
    - 能指出并纠正这一错误：忽视两边的夹角必须对应相等，误用一边的对角或另一边成比例。
  aliases:
    - SAS相似定理
  category: 定理
  explanation: 如果两个三角形的两组对应边成比例，并且夹角相等，则这两个三角形相似。
  misconceptions:
    - 错用SSA：两边成比例且其中一边的对角相等，如AB/DE=AC/DF，∠B=∠E，但∠B不是夹角。
    - 忽视两边的夹角必须对应相等，误用一边的对角或另一边成比例。
    - 比例式写对但夹角取错，如AB与AC的夹角是∠A，却用∠B来判定。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:个体
  type: Concept
  subject: 数学
  title: 个体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：调查体重时把'学生'当个体，实际应为'每名学生的体重'
    - 能指出并纠正这一错误：误把样本中的单个数值当作个体，如身高数值本身就是个体
  aliases: []
  category: 统计概念
  explanation: 组成总体的每一个考察对象称为个体。
  misconceptions:
    - 调查体重时把'学生'当个体，实际应为'每名学生的体重'
    - 误把样本中的单个数值当作个体，如身高数值本身就是个体
    - 认为个体只能是人，忽略考察对象也可以是物或事
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C6/sections/S2.md
- id: concept:数学:中位数
  type: Concept
  subject: 数学
  title: 中位数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求中位数前不排序，直接取原始数据的中间位置
    - 能指出并纠正这一错误：数据个数为偶数时，取中间两个数之和作为中位数，未除以2
  aliases:
    - median
  category: 统计概念
  explanation: 将一组数据按大小顺序排列后，处于中间位置的一个数据（或中间两个数据的平均数）称为这组数据的中位数。
  misconceptions:
    - 求中位数前不排序，直接取原始数据的中间位置
    - 数据个数为偶数时，取中间两个数之和作为中位数，未除以2
    - 奇数个数据时，误将中间位置左边或右边的数当作中位数
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C6/sections/S2.md
- id: concept:数学:中心对称
  type: Concept
  subject: 数学
  title: 中心对称
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为两个图形只要某点旋转后重合就是中心对称，忽略必须旋转180°，如旋转90°重合也被当作中心…
    - 能指出并纠正这一错误：把中心对称当成轴对称，认为关于一条直线对称也是中心对称
  aliases:
    - 关于点对称
  category: 概念
  explanation: 把一个图形绕着某一点旋转180°，如果它能够与另一个图形重合，那么就说这两个图形关于这个点对称或成中心对称，这个点叫作对称中心。
  misconceptions:
    - 误以为两个图形只要某点旋转后重合就是中心对称，忽略必须旋转180°，如旋转90°重合也被当作中心对称
    - 把中心对称当成轴对称，认为关于一条直线对称也是中心对称
    - 认为两个中心对称图形的对应点连线不一定经过对称中心，如以为可以偏离中点
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C3/sections/S1.md
- id: concept:数学:中心对称图形
  type: Concept
  subject: 数学
  title: 中心对称图形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为等边三角形是中心对称图形，它绕中心旋转180°后不能与原图重合
    - 能指出并纠正这一错误：认为中心对称图形旋转任意角度都能与自身重合，导致把等边三角形也当成中心对称图形
  aliases: []
  category: 概念
  explanation: 把一个图形绕某个点旋转180°，如果旋转后的图形能与原来的图形重合，那么这个图形叫作中心对称图形，这个点叫作它的对称中心。
  misconceptions:
    - 误以为等边三角形是中心对称图形，它绕中心旋转180°后不能与原图重合
    - 认为中心对称图形旋转任意角度都能与自身重合，导致把等边三角形也当成中心对称图形
    - 混淆中心对称图形与中心对称，认为一个图形能绕点旋转180°与另一个图形重合就叫中心对称图形
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C3/sections/S2.md
- id: concept:数学:中心对称的性质
  type: Concept
  subject: 数学
  title: 中心对称的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为对应点所连线段平行且相等，把平移性质套在中心对称上
    - 能指出并纠正这一错误：认为对称中心是任意一点，不一定是对应点连线的中点
  aliases: []
  category: 定理
  explanation: 成中心对称的两个图形中，对应点所连线段经过对称中心，且被对称中心平分。
  misconceptions:
    - 误以为对应点所连线段平行且相等，把平移性质套在中心对称上
    - 认为对称中心是任意一点，不一定是对应点连线的中点
    - 认为对应点所连线段不经过对称中心，如以为它们只是互相垂直
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C3/sections/S2.md
- id: concept:数学:中心投影
  type: Concept
  subject: 数学
  title: 中心投影
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为太阳光属于中心投影，因为太阳是点光源，实际太阳光可看作平行光
    - 能指出并纠正这一错误：认为中心投影的光线互相平行，实际是从一点发出的发散光线
  aliases: []
  category: 定义
  explanation: 由一点发出的光线所形成的投影称为中心投影，如手电筒、路灯的光线。
  misconceptions:
    - 误认为太阳光属于中心投影，因为太阳是点光源，实际太阳光可看作平行光
    - 认为中心投影的光线互相平行，实际是从一点发出的发散光线
    - 误以为中心投影下物体离光源越远影子越大，实际影子越小
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C5/sections/S1.md
- id: concept:数学:中括号的作用
  type: Concept
  subject: 数学
  title: 中括号的作用
  conceptType: 程序型
  aliases:
    - "[ ]"
  category: 概念
  explanation: 中括号用来改变运算顺序：有中括号时，先算小括号里的，再算中括号里的，最后算括号外面的。
  sourceRef: content/四年级/上册/数学/BSDU-4-1-Math/chapters/C6/sections/S1.md
- id: concept:数学:乘数中有0的乘法
  type: Concept
  subject: 数学
  title: 乘数中有0的乘法
  conceptType: 程序型
  aliases:
    - 中间有0的乘法
    - 末尾有0的乘法
  category: 方法
  explanation: 竖式计算时，中间或末尾有 0 也要照常去乘，0 乘几就写 0。比如 203×3、240×2。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C1/sections/S3.md
- id: concept:数学:乘数末尾有0的乘法
  type: Concept
  subject: 数学
  title: 乘数末尾有0的乘法
  conceptType: 程序型
  aliases:
    - 整十数乘整十数
  category: 法则
  explanation: 乘数末尾有 0 时，可以先算 0 前面的数相乘，再看两个乘数末尾一共有几个 0，就在积的末尾添上几个 0。比如 30×20，先算
    3×2=6，再添两个 0 得 600。
  sourceRef: content/四年级/上册/数学/BSDU-4-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:乘方
  type: Concept
  subject: 数学
  title: 乘方
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把乘方当乘法：2^3=2×3=6，忽略乘方是相同因数相乘
    - 能指出并纠正这一错误：对负数底数不加括号：-3^2=9，实际应为-9，(-3)^2=9
  aliases:
    - 幂
  category: 数学概念
  explanation: 求n个相同因数a的积的运算叫作乘方，记作a^n，其中a为底数，n为指数。
  misconceptions:
    - 把乘方当乘法：2^3=2×3=6，忽略乘方是相同因数相乘
    - 对负数底数不加括号：-3^2=9，实际应为-9，(-3)^2=9
    - 混淆底数与指数：认为2^3中2是指数、3是底数，导致计算颠倒
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C2/sections/S4.md
- id: concept:数学:乘法交换律
  type: Concept
  subject: 数学
  title: 乘法交换律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：交换因数位置时漏掉负号，如(-3)×4交换成4×3，错得12，正确为-12。
    - 能指出并纠正这一错误：误以为减法也有交换律，直接写a-b=b-a，如5-3=3-5。
  aliases: []
  category: 运算律
  explanation: 两个数相乘，交换因数的位置，积不变，即ab=ba。
  misconceptions:
    - 交换因数位置时漏掉负号，如(-3)×4交换成4×3，错得12，正确为-12。
    - 误以为减法也有交换律，直接写a-b=b-a，如5-3=3-5。
    - 误以为除法也有交换律，直接写a÷b=b÷a，如8÷2=2÷8。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:乘法分配律
  type: Concept
  subject: 数学
  title: 乘法分配律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：a(b+c) 漏乘一项写成 ab+c，如 3(x+2)=3x+2。
    - 能指出并纠正这一错误：把分配律套到 c÷(a+b)，写成 c÷a+c÷b，如 12÷(3+4)=4+3。
  aliases:
    - 分配律
  category: 运算律
  explanation: 乘法对加法的分配律：a(b+c)=ab+ac，用于合并同类项和去括号。
  misconceptions:
    - a(b+c) 漏乘一项写成 ab+c，如 3(x+2)=3x+2。
    - 把分配律套到 c÷(a+b)，写成 c÷a+c÷b，如 12÷(3+4)=4+3。
    - 逆用分配律提取负号时符号错，如 -2x+4 写成 -2(x+2)。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:乘法对加法的分配律
  type: Concept
  subject: 数学
  title: 乘法对加法的分配律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：漏乘括号内的某一项，如5(x+2)=5x+2，漏乘5×2。
    - 能指出并纠正这一错误：把分配律反用于加法乘乘法，如a+(b×c)=(a+b)×(a+c)，错。
  aliases:
    - 分配律
  category: 运算律
  explanation: 一个数同两个数的和相乘，等于把这个数分别同这两个数相乘，再把积相加，即a(b+c)=ab+ac。
  misconceptions:
    - 漏乘括号内的某一项，如5(x+2)=5x+2，漏乘5×2。
    - 把分配律反用于加法乘乘法，如a+(b×c)=(a+b)×(a+c)，错。
    - 将分配律错用于除法，如a÷(b+c)=a÷b+a÷c，应无此性质。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:乘法的初步认识
  type: Concept
  subject: 数学
  title: 乘法的初步认识
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 求几个相同加数的和，可以用乘法计算。比如2+2+2是3个2相加，可以写成2×3=6，用乘法表示更简便。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:乘法竖式中的进位
  type: Concept
  subject: 数学
  title: 乘法竖式中的进位
  conceptType: 程序型
  aliases: []
  category: 法则
  explanation: 竖式乘法中，哪一位上的数乘完满十，就要向前一位进 1，后一位相乘后别忘了加上进来的 1。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C1/sections/S2.md
- id: concept:数学:乘法算式各部分名称
  type: Concept
  subject: 数学
  title: 乘法算式各部分名称
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 乘号前面和后面的两个数都叫乘数，乘得的结果叫积，2×3读作2乘3。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:乘法结合律
  type: Concept
  subject: 数学
  title: 乘法结合律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为除法也有结合律，如(a÷b)÷c=a÷(b÷c)，导致运算结果错误。
    - 能指出并纠正这一错误：在连乘中改变结合顺序后，未重新数负号个数，如(-2)×(-3)×(-4)算成24，应为-24。
  aliases: []
  category: 运算律
  explanation: 三个数相乘，先把前两个数相乘，或者先把后两个数相乘，积不变，即(ab)c=a(bc)。
  misconceptions:
    - 误以为除法也有结合律，如(a÷b)÷c=a÷(b÷c)，导致运算结果错误。
    - 在连乘中改变结合顺序后，未重新数负号个数，如(-2)×(-3)×(-4)算成24，应为-24。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:乘法表
  type: Concept
  subject: 数学
  title: 乘法表
  conceptType: 概念型
  aliases:
    - 乘法口诀表
    - 九九乘法表
  category: 概念
  explanation: 把乘法算式按规律排成表就是乘法表。观察乘法表能发现很多规律，比如同一行或同一列里，得数一个比一个多。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C9/sections/S4.md
- id: concept:数学:乘除法的互逆关系
  type: Concept
  subject: 数学
  title: 乘除法的互逆关系
  conceptType: 概念型
  aliases: []
  category: 性质
  explanation: 乘法和除法互为逆运算，知道□×2=60 可以用 60÷2 求出□，算完还可以倒过来检查。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C8/sections/S5.md
- id: concept:数学:二元一次方程与一次函数的关系
  type: Concept
  subject: 数学
  title: 二元一次方程与一次函数的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把二元一次方程 2x+y=3 化为 y=-2x+3 后，认为方程的解不是函数图像上的点。
    - 能指出并纠正这一错误：由 x-y=2 化一次函数时变号错误，写成 y=x+2，实际应为 y=x-2。
  aliases:
    - 二元一次方程与一次函数图象关系
  category: 数学概念
  explanation: 以一个二元一次方程的解为坐标的点组成的图象与相应的一次函数的图象相同，是同一条直线。
  misconceptions:
    - 把二元一次方程 2x+y=3 化为 y=-2x+3 后，认为方程的解不是函数图像上的点。
    - 由 x-y=2 化一次函数时变号错误，写成 y=x+2，实际应为 y=x-2。
    - 误以为二元一次方程只有两个解，对应图像上两点，忽略其图像是一条直线。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S3.md
- id: concept:数学:二元一次方程组
  type: Concept
  subject: 数学
  title: 二元一次方程组
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把含xy项的方程组误判为二元一次方程组，如x+y=3与xy=4，未注意xy的次数是2
    - 能指出并纠正这一错误：未知数出现在分母中仍当作一次，如1/x+y=2，忽略整式要求
  aliases:
    - 二元一次方程组
  category: 数学概念
  explanation: 含有两个未知数，且含未知数的项的次数都是1的方程组。
  misconceptions:
    - 把含xy项的方程组误判为二元一次方程组，如x+y=3与xy=4，未注意xy的次数是2
    - 未知数出现在分母中仍当作一次，如1/x+y=2，忽略整式要求
    - 只知两个未知数一次，忽略系数不为零，如0·x+2y=3仍认为二元一次
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S2.md
- id: concept:数学:二元一次方程组的应用
  type: Concept
  subject: 数学
  title: 二元一次方程组的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：设未知数不带单位，速度用千米/时而时间用分钟直接相乘，导致方程错误
    - 能指出并纠正这一错误：解方程组后不代入原题检验，得负值或分数也当答案，忽略人数、件数须为整数
  aliases:
    - 列方程组解应用题
  category: 数学建模
  explanation: 利用二元一次方程组解决实际问题，关键是找出题目中的等量关系并设未知数列方程组。
  misconceptions:
    - 设未知数不带单位，速度用千米/时而时间用分钟直接相乘，导致方程错误
    - 解方程组后不代入原题检验，得负值或分数也当答案，忽略人数、件数须为整数
    - 等量关系找错，把'甲比乙大3'列成甲+3=乙，实际应为甲=乙+3
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S3.md
- id: concept:数学:二元一次方程组的解
  type: Concept
  subject: 数学
  title: 二元一次方程组的解
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：验算时只代入一个方程，如认为(1,2)是方程组x+y=3、x-y=1的解，因1+2=3，但1-2…
    - 能指出并纠正这一错误：把方程组的解答成‘x=2’或‘y=1’这类单一数值，忽略二元一次方程组的解是一对有序数对(x,y…
  aliases:
    - 方程组的解
  category: 数学概念
  explanation: 使方程组中每个方程都成立的未知数的值。
  misconceptions:
    - 验算时只代入一个方程，如认为(1,2)是方程组x+y=3、x-y=1的解，因1+2=3，但1-2=-1≠1。
    - 把方程组的解答成‘x=2’或‘y=1’这类单一数值，忽略二元一次方程组的解是一对有序数对(x,y)。
    - 认为{x+y=1, x+y=2}也有解，计算时发现矛盾仍强行凑出一组解，忽略无解情形。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S7.md
- id: concept:数学:二分法
  type: Concept
  subject: 数学
  title: 二分法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：二分法要求初始区间两端点函数值异号，常误以为同号也可以
    - 能指出并纠正这一错误：二分法计算中，判断中点函数值与零的大小符号写反，导致区间选错
  aliases:
    - 二分逼近法
  category: 数值方法
  explanation: 通过不断缩小范围确定一元二次方程近似解的方法，具体做法是找出初始范围的中间点，判断解在中间点的哪一侧，得到新的范围，重复操作直到满足精确度。
  misconceptions:
    - 二分法要求初始区间两端点函数值异号，常误以为同号也可以
    - 二分法计算中，判断中点函数值与零的大小符号写反，导致区间选错
    - 精确度理解错误，要求精确到0.1却中点是0.05就停止，未保证区间长度小于0.1
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数
  type: Concept
  subject: 数学
  title: 二次函数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为y=ax²+bx+c就是二次函数，忽略a≠0，如把y=2x+3当二次函数
    - 能指出并纠正这一错误：把y=x²+x+1/x或y=√x+2当二次函数，忽略了最高次必须是整式2次
  aliases:
    - quadratic function
  category: 函数定义
  explanation: 一般地，若两个变量x，y之间的对应关系可以表示成y=ax²+bx+c（a，b，c是常数，a≠0）的形式，则称y是x的二次函数。
  misconceptions:
    - 认为y=ax²+bx+c就是二次函数，忽略a≠0，如把y=2x+3当二次函数
    - 把y=x²+x+1/x或y=√x+2当二次函数，忽略了最高次必须是整式2次
    - 认为二次函数必须同时含二次项、一次项和常数项，如y=x²也是二次函数
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S2.md
- id: concept:数学:二次函数与一元二次方程的关系
  type: Concept
  subject: 数学
  title: 二次函数与一元二次方程的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为图象与x轴交点的纵坐标是方程的根，实际是横坐标
    - 能指出并纠正这一错误：计算交点时只求x=0的y值，把与y轴交点当根
  aliases:
    - 二次函数与一元二次方程
  category: 定理
  explanation: 二次函数 y=ax^2+bx+c 的图象与 x 轴交点的横坐标就是一元二次方程 ax^2+bx+c=0 的根。
  misconceptions:
    - 误认为图象与x轴交点的纵坐标是方程的根，实际是横坐标
    - 计算交点时只求x=0的y值，把与y轴交点当根
    - 忽略根的个数，认为交点横坐标一定有两个，实际可能一个或无
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数图象与x轴的交点情况
  type: Concept
  subject: 数学
  title: 二次函数图象与x轴的交点情况
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把有一个交点说成方程有一个不等实根，应为两个相等实根
    - 能指出并纠正这一错误：用判别式时把b²-4ac算错，如b=-3时误写成-9而不是9
  aliases: []
  category: 性质
  explanation: 二次函数图象与x轴的交点有三种情况：有两个交点、有一个交点、没有交点，对应一元二次方程有两个不等实根、两个相等实根、无实根。
  misconceptions:
    - 把有一个交点说成方程有一个不等实根，应为两个相等实根
    - 用判别式时把b²-4ac算错，如b=-3时误写成-9而不是9
    - 未分类讨论：当a=0时虽不是二次函数，但仍硬套判别式判断交点
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数图象的平移
  type: Concept
  subject: 数学
  title: 二次函数图象的平移
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到y=a(x-1)²+3，认为是向左平移1个单位，实际向右
    - 能指出并纠正这一错误：平移时只移动h或k，忘记a不变，例如把y=2x²平移写成y=(2x-1)²
  aliases: []
  category: 图象变换
  explanation: 二次函数y=a(x-h)²+k的图象可由y=ax²的图象平移得到：h决定左右平移，k决定上下平移。
  misconceptions:
    - 看到y=a(x-1)²+3，认为是向左平移1个单位，实际向右
    - 平移时只移动h或k，忘记a不变，例如把y=2x²平移写成y=(2x-1)²
    - 先左右平移后上下平移，但顶点坐标写反，如y=a(x-1)²+2顶点写成(-1,2)
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数图象的开口方向
  type: Concept
  subject: 数学
  title: 二次函数图象的开口方向
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只看x²的系数绝对值，忽略符号，如y=-x²+2x开口向上
    - 能指出并纠正这一错误：认为a>0时开口向下，a<0时开口向上，正好记反
  aliases:
    - 二次函数的开口方向
  category: 性质
  explanation: 二次函数 y=ax^2+bx+c 中，当 a>0 时开口向上，当 a<0 时开口向下。
  misconceptions:
    - 只看x²的系数绝对值，忽略符号，如y=-x²+2x开口向上
    - 认为a>0时开口向下，a<0时开口向上，正好记反
    - 由y=a(x-h)²+k中k的正负判断开口方向，把k当a
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次函数图象的顶点坐标
  type: Concept
  subject: 数学
  title: 二次函数图象的顶点坐标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记错顶点横坐标公式，写成-b/a或b/(2a)，如y=x²-2x顶点横坐标误算为1? 实际是1，…
    - 能指出并纠正这一错误：顶点式中符号混淆：y=a(x+2)²+3的顶点错写成(2,3)，实际是(-2,3)
  aliases: []
  category: 性质
  explanation: 二次函数 y=ax^2+bx+c 的顶点坐标为 (-b/(2a), (4ac-b^2)/(4a))，顶点式 y=a(x-h)^2+k
    的顶点为 (h,k)。
  misconceptions:
    - 记错顶点横坐标公式，写成-b/a或b/(2a)，如y=x²-2x顶点横坐标误算为1? 实际是1，但错误公式可能得-1或2
    - 顶点式中符号混淆：y=a(x+2)²+3的顶点错写成(2,3)，实际是(-2,3)
    - 计算4ac-b²时符号错误，如b=-1时误算得1而不是-1
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S4.md
- id: concept:数学:二次函数的一般式
  type: Concept
  subject: 数学
  title: 二次函数的一般式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为一般式必须包含b、c，即b、c不能为0，把y=x²不是一般式
    - 能指出并纠正这一错误：把顶点式y=a(x-h)²+k也说成一般式
  aliases:
    - 一般式
  category: 概念
  explanation: 形如 y=ax^2+bx+c (a≠0) 的函数称为二次函数的一般式。
  misconceptions:
    - 认为一般式必须包含b、c，即b、c不能为0，把y=x²不是一般式
    - 把顶点式y=a(x-h)²+k也说成一般式
    - 忽略a≠0，把y=5x²+3x中的a写成5，但还有隐含条件a≠0
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的三种表示方法
  type: Concept
  subject: 数学
  title: 二次函数的三种表示方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为表格法只能表示有限对应关系，不能表示函数全部，实际可表示足够多对应点
    - 能指出并纠正这一错误：认为图象法是精确的，实际作图象是近似的
  aliases:
    - 表示方法
  category: 函数表示
  explanation: 二次函数可以用解析式、表格和图象三种方法表示，它们可以相互转化。
  misconceptions:
    - 认为表格法只能表示有限对应关系，不能表示函数全部，实际可表示足够多对应点
    - 认为图象法是精确的，实际作图象是近似的
    - 认为三种表示方法可以任意互换且结果完全相同，忽略表格可能漏点
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S1.md
- id: concept:数学:二次函数的图象
  type: Concept
  subject: 数学
  title: 二次函数的图象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把抛物线画成两支曲线，像双曲线那样，实际是一条连续曲线
    - 能指出并纠正这一错误：认为所有抛物线都开口向上或向下，忽略a的正负影响形状
  aliases:
    - 抛物线
  category: 函数图象
  explanation: 二次函数的图象是一条抛物线，具有对称轴和顶点。
  misconceptions:
    - 把抛物线画成两支曲线，像双曲线那样，实际是一条连续曲线
    - 认为所有抛物线都开口向上或向下，忽略a的正负影响形状
    - 认为抛物线一定经过原点，如y=x²+1不经过原点
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的增减性
  type: Concept
  subject: 数学
  title: 二次函数的增减性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：不论a的正负，都断言y随x增大而增大，如y=-x²在对称轴右侧实际减小
    - 能指出并纠正这一错误：用对称轴左边时，错误地认为x<0时y随x增大而减小，但对称轴不一定是y轴
  aliases: []
  category: 性质
  explanation: 当 a>0 时，在对称轴左侧 y 随 x 增大而减小，右侧增大而增大；当 a<0 时相反。
  misconceptions:
    - 不论a的正负，都断言y随x增大而增大，如y=-x²在对称轴右侧实际减小
    - 用对称轴左边时，错误地认为x<0时y随x增大而减小，但对称轴不一定是y轴
    - 盲目套用二次函数性质，忽略对称轴位置，如y=(x-2)²在x>2时递增，却认为x>0就递增
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的对称轴
  type: Concept
  subject: 数学
  title: 二次函数的对称轴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把对称轴公式记成x=-b/a 或 x=b/(2a)
    - 能指出并纠正这一错误：对于顶点式y=a(x-h)²+k，把对称轴写成x=k，实际是x=h
  aliases:
    - 二次函数图象的对称轴
  category: 图象性质
  explanation: 抛物线是轴对称图形，其对称轴为直线x=h（对于y=a(x-h)²+k的形式）。
  misconceptions:
    - 把对称轴公式记成x=-b/a 或 x=b/(2a)
    - 对于顶点式y=a(x-h)²+k，把对称轴写成x=k，实际是x=h
    - 求对称轴时，用顶点横坐标但符号搞错，如y=a(x+3)²对称轴写成x=3，实际x=-3
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的应用
  type: Concept
  subject: 数学
  title: 二次函数的应用
  conceptType: 建模型
  masteryCriteria:
    - 能指出并纠正这一错误：求最大面积时，设变量后忽略自变量取值范围，如边长不能为负
    - 能指出并纠正这一错误：将实际问题中的x范围误取全体实数，导致最大值点不在范围内
  aliases: []
  category: 应用
  explanation: 利用二次函数解决实际问题，如最大面积、最大高度等。
  misconceptions:
    - 求最大面积时，设变量后忽略自变量取值范围，如边长不能为负
    - 将实际问题中的x范围误取全体实数，导致最大值点不在范围内
    - 配方时符号错误，如把y=-x²+4x配方成y=-(x-2)²+4，但括号内符号弄反得到顶点横坐标-2
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的性质
  type: Concept
  subject: 数学
  title: 二次函数的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为二次函数在整个定义域上单调递增或递减，忽略对称轴两侧增减性不同，如y=x^2在x<0递减、x…
    - 能指出并纠正这一错误：开口向下时，以为y随x增大一直减小，实际上对称轴左侧y随x增大而增大。
  aliases: []
  category: 函数性质
  explanation: 二次函数的增减性、最值等性质由开口方向和顶点决定。
  misconceptions:
    - 认为二次函数在整个定义域上单调递增或递减，忽略对称轴两侧增减性不同，如y=x^2在x<0递减、x>0递增。
    - 开口向下时，以为y随x增大一直减小，实际上对称轴左侧y随x增大而增大。
    - 只根据a的正负判断增减性，忘了顶点横坐标分界，例如y=-x^2在x>0时y随x增大而减小，但x<0时增大。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S2.md
- id: concept:数学:二次函数的最值
  type: Concept
  subject: 数学
  title: 二次函数的最值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为开口向上的二次函数一定有最大值，忽略其只有最小值。
  aliases:
    - 最大值
    - 最小值
    - 二次函数最值
    - 二次函数的最大值
    - 二次函数的最小值
  category: 函数性质
  explanation: 当开口向下时，顶点处取得最大值；开口向上时，顶点处取得最小值。
  misconceptions:
    - 认为开口向上的二次函数一定有最大值，忽略其只有最小值。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的最值应用
  type: Concept
  subject: 数学
  title: 二次函数的最值应用
  conceptType: 建模型
  masteryCriteria:
    - 能指出并纠正这一错误：求最大利润时直接取顶点横坐标，但不检查该值是否满足实际取值范围，如x代表商品件数，却算出x=3.…
    - 能指出并纠正这一错误：求围栏面积时忽略边长必须大于0，直接令x=-b/2a，结果x为负数，仍把对应面积当最大值。
  aliases: []
  category: 应用
  explanation: 利用二次函数的顶点坐标解决实际问题中的最大（小）值问题，如面积、利润等。
  misconceptions:
    - 求最大利润时直接取顶点横坐标，但不检查该值是否满足实际取值范围，如x代表商品件数，却算出x=3.5而忽略件数需为整数。
    - 求围栏面积时忽略边长必须大于0，直接令x=-b/2a，结果x为负数，仍把对应面积当最大值。
    - 把二次函数顶点坐标中的横坐标当作实际问题的最大利润，实际纵坐标才是最值。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的顶点
  type: Concept
  subject: 数学
  title: 二次函数的顶点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为顶点坐标是(-b/2a, c)，漏掉纵坐标需代入函数计算，例如y=x^2+2x+3，误写顶点…
    - 能指出并纠正这一错误：认为顶点一定在对称轴与y轴的交点处，把(0,c)当顶点。
  aliases: []
  category: 图象性质
  explanation: 抛物线的顶点是图象的最高点或最低点，其坐标为(h,k)（对于y=a(x-h)²+k的形式）。
  misconceptions:
    - 认为顶点坐标是(-b/2a, c)，漏掉纵坐标需代入函数计算，例如y=x^2+2x+3，误写顶点为(-1,3)。
    - 认为顶点一定在对称轴与y轴的交点处，把(0,c)当顶点。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次函数的顶点式
  type: Concept
  subject: 数学
  title: 二次函数的顶点式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将对称轴记成x=k，顶点横坐标与纵坐标混淆，如y=-2(x-1)^2+3，说对称轴为x=3。
    - 能指出并纠正这一错误：忽略顶点式中a≠0，把a=0也当作二次函数处理。
  aliases:
    - 顶点式
  category: 概念
  explanation: 形如 y=a(x-h)^2+k (a≠0) 的二次函数，顶点为 (h,k)，对称轴为直线 x=h。
  misconceptions:
    - 将对称轴记成x=k，顶点横坐标与纵坐标混淆，如y=-2(x-1)^2+3，说对称轴为x=3。
    - 忽略顶点式中a≠0，把a=0也当作二次函数处理。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:二次根式
  type: Concept
  subject: 数学
  title: 二次根式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把√(-3)²当成无意义或等于-3，忽略√a本身非负。
    - 能指出并纠正这一错误：误认为√a中a可取任意实数，如写√(-4)=±2。
  aliases: []
  category: 定义
  explanation: 形如√a（a≥0）的式子叫作二次根式，a叫作被开方数。
  misconceptions:
    - 把√(-3)²当成无意义或等于-3，忽略√a本身非负。
    - 误认为√a中a可取任意实数，如写√(-4)=±2。
    - 将√(a²)直接化简为a，忽视a<0时应为-a。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S4.md
- id: concept:数学:二次根式的乘法公式
  type: Concept
  subject: 数学
  title: 二次根式的乘法公式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：算 (√3+2)^2 时写成 3+4=7，漏掉 2·√3·2。
    - 能指出并纠正这一错误：用平方差公式时写成 (√13+3)(√13-3)=13-3=10，忘记 3 也要平方。
  aliases:
    - 乘法公式
  category: 法则
  explanation: 包括平方差公式和完全平方公式在二次根式中的应用，如(a+b)(a-b)=a^2-b^2。
  misconceptions:
    - 算 (√3+2)^2 时写成 3+4=7，漏掉 2·√3·2。
    - 用平方差公式时写成 (√13+3)(√13-3)=13-3=10，忘记 3 也要平方。
    - 在 (2√7+1)(2√7-1) 中把 2√7 的平方算成 2×7，漏掉系数 2 的平方。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次根式的乘法法则
  type: Concept
  subject: 数学
  title: 二次根式的乘法法则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把√a·√b=√(ab)用错为√(ab)=a·b，如√(4×9)写成36。
    - 能指出并纠正这一错误：忽略a≥0、b≥0，直接算√(-2)·√(-8)=√16=4。
  aliases: []
  category: 法则
  explanation: √a·√b=√ab（a≥0，b≥0）。
  misconceptions:
    - 把√a·√b=√(ab)用错为√(ab)=a·b，如√(4×9)写成36。
    - 忽略a≥0、b≥0，直接算√(-2)·√(-8)=√16=4。
    - 认为乘法法则可推广为√a·√b=√(a+b)，如√2·√3=√5。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次根式的乘除法则
  type: Concept
  subject: 数学
  title: 二次根式的乘除法则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：√a·√b 错误记成 √a+√b，如 √2×√3=√5。
    - 能指出并纠正这一错误：系数相乘时漏乘或相加：2√3×3√5 写成 5√15，正确为 6√15。
  aliases:
    - 二次根式的乘除法
  category: 法则
  explanation: √a·√b=√(ab)（a≥0,b≥0），√a/√b=√(a/b)（a≥0,b>0）。
  misconceptions:
    - √a·√b 错误记成 √a+√b，如 √2×√3=√5。
    - 系数相乘时漏乘或相加：2√3×3√5 写成 5√15，正确为 6√15。
    - 忽略 a≥0，把 √(-4)·√(-9) 硬算成 √36=6。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次根式的加减法则
  type: Concept
  subject: 数学
  title: 二次根式的加减法则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把 √2+√3 合并成 √5，误以为根号内可以相加。
    - 能指出并纠正这一错误：先不化简就合并：√8+√2 写成 √10，实际应为 3√2。
  aliases:
    - 二次根式的加减法
    - 合并同类二次根式
  category: 法则
  explanation: 先将各二次根式化为最简二次根式，再合并同类二次根式。
  misconceptions:
    - 把 √2+√3 合并成 √5，误以为根号内可以相加。
    - 先不化简就合并：√8+√2 写成 √10，实际应为 3√2。
    - 合并同类项时系数相加、根号内也相加：2√3+3√3=5√6。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次根式的加减运算
  type: Concept
  subject: 数学
  title: 二次根式的加减运算
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把被开方数相同的项合并时，误将根号外的系数相加而根号内也相加，如 2√3+3√3=5√6
    - 能指出并纠正这一错误：化简不彻底就直接合并，比如把 √12 当 2√3 而误写成 4√3
  aliases:
    - 合并同类二次根式
  category: 法则
  explanation: 二次根式加减时，先将各项化为最简二次根式，再合并被开方数相同的项。
  misconceptions:
    - 把被开方数相同的项合并时，误将根号外的系数相加而根号内也相加，如 2√3+3√3=5√6
    - 化简不彻底就直接合并，比如把 √12 当 2√3 而误写成 4√3
    - 只合并系数，漏掉根号部分，如 5√2-2√2=3
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次根式的化简
  type: Concept
  subject: 数学
  title: 二次根式的化简
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：分母有理化时只把分子分母同乘根号，而忘记化简系数，如 2/√2 化为 2√2 而不是 √2
    - 能指出并纠正这一错误：忽略被开方数中平方因数的符号，如认为√(a²)=a，忽略 a<0 时应为 |a|
  aliases:
    - 化简二次根式
  category: 法则
  explanation: 利用二次根式的性质，将被开方数中的平方因数开方，并化去分母中的根号，使结果成为最简二次根式。
  misconceptions:
    - 分母有理化时只把分子分母同乘根号，而忘记化简系数，如 2/√2 化为 2√2 而不是 √2
    - 忽略被开方数中平方因数的符号，如认为√(a²)=a，忽略 a<0 时应为 |a|
    - 化去分母中的根号时，误将根号移到分子上，如 1/√3 写成 √3/3 但分母仍含根号
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S4.md
- id: concept:数学:二次根式的混合运算
  type: Concept
  subject: 数学
  title: 二次根式的混合运算
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：使用分配律时漏乘项，如 (√2+1)(√3-1) 只乘第一项得√6-1
    - 能指出并纠正这一错误：乘法公式用错符号，如 (√5+√3)² 误算为 5+3=8，忘记加中间项 2√15
  aliases: []
  category: 法则
  explanation: 二次根式的混合运算遵循实数的运算法则和运算律，结果需化为最简二次根式。
  misconceptions:
    - 使用分配律时漏乘项，如 (√2+1)(√3-1) 只乘第一项得√6-1
    - 乘法公式用错符号，如 (√5+√3)² 误算为 5+3=8，忘记加中间项 2√15
    - 混合运算中先算加减后算乘除，如 √2×√3+√2 先算加法再乘
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次根式的运算
  type: Concept
  subject: 数学
  title: 二次根式的运算
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：对根号内的加法拆开：√(4+9)=√4+√9=5，实际为√13。
    - 能指出并纠正这一错误：乘法分配律漏乘：√2(√6+√3)=√12+√3，漏乘√2×√3。
  aliases: []
  category: 法则
  explanation: 二次根式的加减乘除运算规则，包括合并同类二次根式、乘法公式等。
  misconceptions:
    - 对根号内的加法拆开：√(4+9)=√4+√9=5，实际为√13。
    - 乘法分配律漏乘：√2(√6+√3)=√12+√3，漏乘√2×√3。
    - 完全平方公式漏中间项：(√5-√2)^2=5-2=3，实际为7-2√10。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:二次根式的除法法则
  type: Concept
  subject: 数学
  title: 二次根式的除法法则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把√a/√b=√(a/b)中b>0漏掉，允许b=0时除以0。
    - 能指出并纠正这一错误：将√(9/16)算成(√9)/(√16)=3/4，却写成√(3/4)形式。
  aliases: []
  category: 法则
  explanation: √a/√b=√(a/b)（a≥0，b>0）。
  misconceptions:
    - 把√a/√b=√(a/b)中b>0漏掉，允许b=0时除以0。
    - 将√(9/16)算成(√9)/(√16)=3/4，却写成√(3/4)形式。
    - 误用除法法则：√(a/b)=√a/√b，当b<0时也套用，如√(4/(-9))=√4/√-9。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S4.md
- id: concept:数学:互余的角
  type: Concept
  subject: 数学
  title: 互余的角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把互余误认为两角和为180°（与互补混淆）
    - 能指出并纠正这一错误：认为互余的两个角必须有一条公共边
  aliases:
    - 余角
  category: 几何概念
  explanation: 如果两个角的和等于90°，那么这两个角互为余角。
  misconceptions:
    - 把互余误认为两角和为180°（与互补混淆）
    - 认为互余的两个角必须有一条公共边
    - 认为一个角的余角一定比该角小
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S4.md
- id: concept:数学:互补的角
  type: Concept
  subject: 数学
  title: 互补的角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把互补误认为两角和为90°（与互余混淆）
    - 能指出并纠正这一错误：误以为两个锐角也能互补（其和小于180°）
  aliases:
    - 补角
  category: 几何概念
  explanation: 如果两个角的和等于180°，那么这两个角互为补角。
  misconceptions:
    - 把互补误认为两角和为90°（与互余混淆）
    - 误以为两个锐角也能互补（其和小于180°）
    - 认为互补的两个角一定相邻
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S2.md
- id: concept:数学:互逆命题
  type: Concept
  subject: 数学
  title: 互逆命题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把逆命题写成否命题，如“如果p那么q”的逆命题错写为“如果非p那么非q”。
    - 能指出并纠正这一错误：认为原命题正确逆命题一定正确，如“对顶角相等”的逆命题“相等的角是对顶角”是假命题。
  aliases:
    - 逆命题
  category: 概念
  explanation: 在两个命题中，如果一个命题的条件和结论分别是另一个命题的结论和条件，那么这两个命题称为互逆命题。
  misconceptions:
    - 把逆命题写成否命题，如“如果p那么q”的逆命题错写为“如果非p那么非q”。
    - 认为原命题正确逆命题一定正确，如“对顶角相等”的逆命题“相等的角是对顶角”是假命题。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:互逆定理
  type: Concept
  subject: 数学
  title: 互逆定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为只要是定理，它的逆命题经过证明就一定是逆定理，忽略有些逆命题是假命题。
    - 能指出并纠正这一错误：将互逆定理误以为原定理和逆定理都正确，但未验证逆命题的真假就称其为逆定理。
  aliases:
    - 逆定理
  category: 概念
  explanation: 如果一个定理的逆命题经过证明是真命题，那么它也是一个定理，其中一个定理称为另一个定理的逆定理。
  misconceptions:
    - 误认为只要是定理，它的逆命题经过证明就一定是逆定理，忽略有些逆命题是假命题。
    - 将互逆定理误以为原定理和逆定理都正确，但未验证逆命题的真假就称其为逆定理。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:从三个方向观察几何体
  type: Concept
  subject: 数学
  title: 从三个方向观察几何体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：画圆柱三视图时，从正面看画成圆，实际从正面看圆柱应是长方形。
    - 能指出并纠正这一错误：把从左面看到的图画成从右面看到的图，导致内部虚实线位置颠倒。
  aliases:
    - 三视图
    - 主视图
    - 左视图
    - 俯视图
  category: 几何
  explanation: 从正面、左面（或右面）和上面三个不同方向观察同一物体，得到的形状图称为三视图（或主视图、左视图、俯视图）。
  misconceptions:
    - 画圆柱三视图时，从正面看画成圆，实际从正面看圆柱应是长方形。
    - 把从左面看到的图画成从右面看到的图，导致内部虚实线位置颠倒。
    - 画三视图时只画可见轮廓线，漏画看不见但能确定位置的棱（虚线）。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C1/sections/S2.md
- id: concept:数学:从三个方向观察物体
  type: Concept
  subject: 数学
  title: 从三个方向观察物体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只凭一个方向的形状图就确定立体图形，如正面看是正方形就说是正方体。
    - 能指出并纠正这一错误：只知道一个方向看到长方形，就断定原物体是长方体，实际也可能是圆柱侧面。
  aliases:
    - 三视图
  category: 几何概念
  explanation: 从正面、左面（或右面）和上面三个不同方向观察同一物体时看到的形状图，用于描述立体图形的形状。
  misconceptions:
    - 只凭一个方向的形状图就确定立体图形，如正面看是正方形就说是正方体。
    - 只知道一个方向看到长方形，就断定原物体是长方体，实际也可能是圆柱侧面。
    - 从正面、左面、上面看同一物体后，认为三个形状图一定不同，没有意识到球从三个方向看都是圆。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C1/sections/S2.md
- id: concept:数学:从不同位置观察物体
  type: Concept
  subject: 数学
  title: 从不同位置观察物体
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 从正面、侧面、后面、上面等不同位置观察同一个物体，看到的样子可能不同。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C12/sections/S2.md
- id: concept:数学:从图象获取信息
  type: Concept
  subject: 数学
  title: 从图象获取信息
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：读速度-时间图象时，把图象上的点当成运动轨迹点，误以为上升就表示物体在向上运动。
    - 能指出并纠正这一错误：忽略图象横纵坐标轴单位，导致读取的数据与实际数值相差10倍或100倍。
  aliases: []
  category: 数学技能
  explanation: 能够从图象中读取变量的变化趋势、特殊点等信息，并进行分析和预测。
  misconceptions:
    - 读速度-时间图象时，把图象上的点当成运动轨迹点，误以为上升就表示物体在向上运动。
    - 忽略图象横纵坐标轴单位，导致读取的数据与实际数值相差10倍或100倍。
    - 比较两条图线时，不检查坐标轴刻度是否一致，仅凭图线陡峭程度判断变化快慢。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C6/sections/S5.md
- id: concept:数学:从表格中获取信息
  type: Concept
  subject: 数学
  title: 从表格中获取信息
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 看统计表要先弄清每行每列表示什么，再比较数据，就能发现变化快慢的规律。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C4/sections/S4.md
- id: concept:数学:代入消元法
  type: Concept
  subject: 数学
  title: 代入消元法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：由 x-y=3 变形时写成 x=y-3，正确应为 x=y+3，符号未随移项变号。
    - 能指出并纠正这一错误：将 y=2x+1 代入另一方程时，只代 y 为 2x，漏掉 +1，导致结果错误。
  aliases:
    - 代入法
  category: 数学方法
  explanation: 将方程组中的一个方程变形，用含一个未知数的代数式表示另一个未知数，然后代入另一个方程，从而消去一个未知数，化二元一次方程组为一元一次方程求解的方法。
  misconceptions:
    - 由 x-y=3 变形时写成 x=y-3，正确应为 x=y+3，符号未随移项变号。
    - 将 y=2x+1 代入另一方程时，只代 y 为 2x，漏掉 +1，导致结果错误。
    - 代入后去括号：若 y=2x-1，代入 3x-(y) 写成 3x-2x-1，漏变号，应为 3x-2x+1。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S2.md
- id: concept:数学:代数式
  type: Concept
  subject: 数学
  title: 代数式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为带等号的式子（如 x+1=2）也是代数式，但代数式不含等号。
    - 能指出并纠正这一错误：认为单独一个数 3 不是代数式，忽略单独一个数也是代数式。
  aliases: []
  category: 概念
  explanation: 用运算符号把数和字母连接而成的式子叫做代数式。单独一个数或一个字母也是代数式。
  misconceptions:
    - 认为带等号的式子（如 x+1=2）也是代数式，但代数式不含等号。
    - 认为单独一个数 3 不是代数式，忽略单独一个数也是代数式。
    - 认为 2a+3 中的加号不是运算符号，所以不是代数式。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C3/sections/S1.md
- id: concept:数学:代数式求值
  type: Concept
  subject: 数学
  title: 代数式求值
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：代入负数时不加括号，如 x=-2 代入 x² 得 -4 而不是 4
    - 能指出并纠正这一错误：求值前不化简，直接代入导致运算复杂易出错
  aliases: []
  category: 数学方法
  explanation: 将字母取具体数值代入代数式进行计算，得到代数式的值。
  misconceptions:
    - 代入负数时不加括号，如 x=-2 代入 x² 得 -4 而不是 4
    - 求值前不化简，直接代入导致运算复杂易出错
    - 先算加减后算乘方，如代入后 2+3² 误算为 25
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C3/sections/S4.md
- id: concept:数学:代数式的值
  type: Concept
  subject: 数学
  title: 代数式的值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：代入负数时不加括号，如 x=-2 时算 x²=-4，实际应为 (-2)²=4。
    - 能指出并纠正这一错误：忽略字母取值使分母为 0 时无意义，仍强行代入计算。
  aliases: []
  category: 概念
  explanation: 用具体数值代替代数式中的字母，按照代数式中的运算关系计算得出的结果叫做代数式的值。
  misconceptions:
    - 代入负数时不加括号，如 x=-2 时算 x²=-4，实际应为 (-2)²=4。
    - 忽略字母取值使分母为 0 时无意义，仍强行代入计算。
    - 代入后忽略运算顺序，如 x=2 时把 3x² 算成 (3x)²=36，应为 12。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C3/sections/S1.md
- id: concept:数学:代数式表示
  type: Concept
  subject: 数学
  title: 代数式表示
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：顺流速度写成静水速度-水流速度，逆流写成静水速度+水流速度，正好记反
    - 能指出并纠正这一错误：两次分别买a千克、b千克，单价p、q，平均单价写成(p+q)/2，正确应为总价/总质量
  aliases:
    - 列代数式
  category: 数学表达
  explanation: 用字母表示数，将实际问题中的数量关系用代数式表示，如顺流逆流时间、平均单价等。
  misconceptions:
    - 顺流速度写成静水速度-水流速度，逆流写成静水速度+水流速度，正好记反
    - 两次分别买a千克、b千克，单价p、q，平均单价写成(p+q)/2，正确应为总价/总质量
    - 代数式‘x的平方与y的差’写成(x-y)^2，应为x^2-y
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:以小估大
  type: Concept
  subject: 数学
  title: 以小估大
  conceptType: 程序型
  aliases:
    - 由小推大
  category: 方法
  explanation: 数量太大不好直接估计时，可以先量出或数出一小部分，再一步一步推算出整体的多少，比如从1本书的厚度推出2800张纸的厚度。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C5/sections/S7.md
- id: concept:数学:仰角
  type: Concept
  subject: 数学
  title: 仰角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把视线与竖直方向的夹角误认为仰角，正确应是视线与水平线的夹角。
    - 能指出并纠正这一错误：从高处看低处时，错误地使用仰角，实际是俯角。
  aliases: []
  category: 几何概念
  explanation: 当从低处观测高处的目标时，视线与水平线所成的锐角称为仰角。
  misconceptions:
    - 把视线与竖直方向的夹角误认为仰角，正确应是视线与水平线的夹角。
    - 从高处看低处时，错误地使用仰角，实际是俯角。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C1/sections/S5.md
- id: concept:数学:仰角与俯角
  type: Concept
  subject: 数学
  title: 仰角与俯角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：画仰角时把视线画在水平线下方，方向搞反。
    - 能指出并纠正这一错误：认为仰角和俯角是同一个角，只看位置高低而不看视线方向。
  aliases:
    - 仰角
    - 俯角
  category: 数学概念
  explanation: 仰角是视线在水平线上方时与水平线的夹角，俯角是视线在水平线下方时与水平线的夹角。
  misconceptions:
    - 画仰角时把视线画在水平线下方，方向搞反。
    - 认为仰角和俯角是同一个角，只看位置高低而不看视线方向。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:众数
  type: Concept
  subject: 数学
  title: 众数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为众数只能有一个，忽略多个众数或所有数出现次数相同时无众数的情况
    - 能指出并纠正这一错误：把众数出现的次数当成众数，如数据1,2,2,3，误答众数是2次
  aliases:
    - mode
  category: 统计量
  explanation: 一组数据中出现次数最多的数据叫作这组数据的众数。
  misconceptions:
    - 误以为众数只能有一个，忽略多个众数或所有数出现次数相同时无众数的情况
    - 把众数出现的次数当成众数，如数据1,2,2,3，误答众数是2次
    - 将中位数或平均数当作众数，如数据1,2,3,4,5，误答众数是3
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C6/sections/S1.md
- id: concept:数学:优化
  type: Concept
  subject: 数学
  title: 优化
  conceptType: 应用型
  aliases:
    - 合理安排时间
    - 统筹安排
  category: 方法
  explanation: 做事情时要合理安排顺序，能同时做的事情同时做，可以节省时间，如沏茶时烧水的同时洗茶杯、找茶叶；烙多张饼时每次都烙两张，不空锅。
  sourceRef: content/四年级/下册/数学/BSDU-4-2-Math/chapters/C7/sections/S3.md
- id: concept:数学:优弧
  type: Concept
  subject: 数学
  title: 优弧
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到弧较长就说是优弧，未考虑半径不同，弧长不能比较。
    - 能指出并纠正这一错误：把大于180°的圆心角所对弧叫优弧，实际是大于半圆。
  aliases: []
  category: 几何概念
  explanation: 大于半圆的弧。
  misconceptions:
    - 看到弧较长就说是优弧，未考虑半径不同，弧长不能比较。
    - 把大于180°的圆心角所对弧叫优弧，实际是大于半圆。
    - 误以为优弧包含半圆，但半圆不是优弧。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S1.md
- id: concept:数学:估算
  type: Concept
  subject: 数学
  title: 估算
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把每个数看成接近的整十、整百数先估一估，能很快知道大约是多少，也能帮助检查结果大致对不对。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:估计不规则图形的面积
  type: Concept
  subject: 数学
  title: 估计不规则图形的面积
  conceptType: 程序型
  aliases:
    - 数格子估计面积
  category: 方法
  explanation: 把落叶描在方格纸上，用整格数加半格数的一半来估计；也可以选有代表性的落叶分类求平均后再估总面积。
  sourceRef: content/五年级/上册/数学/BSDU-5-1-Math/chapters/C11/sections/S3.md
- id: concept:数学:位似中心
  type: Concept
  subject: 数学
  title: 位似中心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为位似中心一定在两个图形之间，忽略两个图形在同侧时位似中心在外部。
    - 能指出并纠正这一错误：误把对应边延长线的交点当位似中心，实际应为对应顶点连线的交点。
  aliases: []
  category: 定义
  explanation: 位似多边形中，对应顶点所在直线交于一点，该点称为位似中心。
  misconceptions:
    - 认为位似中心一定在两个图形之间，忽略两个图形在同侧时位似中心在外部。
    - 误把对应边延长线的交点当位似中心，实际应为对应顶点连线的交点。
    - 认为位似中心只能在图形外部，忽略可在图形内部或边上。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:位似变换与坐标
  type: Concept
  subject: 数学
  title: 位似变换与坐标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：忽略k可为负数，认为坐标乘正数才位似，实际上k=-2也成立且图形翻转。
    - 能指出并纠正这一错误：误把坐标乘k写成加k，如(x,y)变为(x+k,y+k)，导致位似错误。
  aliases: []
  category: 性质
  explanation: 在平面直角坐标系中，将一个多边形每个顶点的横坐标、纵坐标都乘同一个数k（k≠0），所对应的图形与原图形位似，位似中心是坐标原点，相似比为|k|。
  misconceptions:
    - 忽略k可为负数，认为坐标乘正数才位似，实际上k=-2也成立且图形翻转。
    - 误把坐标乘k写成加k，如(x,y)变为(x+k,y+k)，导致位似错误。
    - 认为相似比为k，忘取绝对值，当k=-2时误报相似比为-2。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:位似图形
  type: Concept
  subject: 数学
  title: 位似图形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把所有相似多边形都当作位似图形，忽略对应顶点连线必须交于一点。
    - 能指出并纠正这一错误：把轴对称图形误认为位似，如对应点连线被对称轴垂直平分但不共点。
  aliases:
    - 位似
  category: 图形变换
  explanation: 两个多边形不仅相似，而且对应顶点的连线相交于一点，这样的相似叫做位似，交点叫做位似中心。
  misconceptions:
    - 误把所有相似多边形都当作位似图形，忽略对应顶点连线必须交于一点。
    - 把轴对称图形误认为位似，如对应点连线被对称轴垂直平分但不共点。
    - 认为位似图形必须全等，忽略位似比可不为1。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S8.md
- id: concept:数学:位似多边形
  type: Concept
  subject: 数学
  title: 位似多边形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：忽略k可为负，认为位似比只能正，导致对应点在O同侧还是异侧判断错误。
    - 能指出并纠正这一错误：只验证两组对应顶点连线相交就认为是位似，忽略所有连线需同一点。
  aliases:
    - 位似图形
  category: 定义
  explanation: 如果两个相似多边形任意一组对应顶点所在的直线都经过同一点O，且有OP'=k·OP（k≠0），那么这样的两个多边形叫做位似多边形，点O叫做位似中心。
  misconceptions:
    - 忽略k可为负，认为位似比只能正，导致对应点在O同侧还是异侧判断错误。
    - 只验证两组对应顶点连线相交就认为是位似，忽略所有连线需同一点。
    - 误认为对应边不平行也可能位似，实际位似多边形对应边必平行（或共线）。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S8.md
- id: concept:数学:位置的相对性
  type: Concept
  subject: 数学
  title: 位置的相对性
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 左和右、前和后要看站在哪边说。面对面的两个人，一个人举右手，另一个人看到的却是左手边。
  sourceRef: content/一年级/上册/数学/BSDU-1-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:体积
  type: Concept
  subject: 数学
  title: 体积
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 物体所占空间的大小叫作物体的体积。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:体积单位
  type: Concept
  subject: 数学
  title: 体积单位
  conceptType: 概念型
  aliases:
    - 立方厘米
    - 立方分米
    - 立方米
  category: 概念
  explanation: 常用的体积单位有立方厘米、立方分米和立方米，分别是棱长 1 厘米、1 分米、1 米的正方体的体积。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C4/sections/S2.md
- id: concept:数学:体积单位的换算
  type: Concept
  subject: 数学
  title: 体积单位的换算
  conceptType: 概念型
  aliases:
    - 体积单位间的进率
  category: 法则
  explanation: 相邻两个体积单位之间的进率是 1000，即 1 m³=1000 dm³，1 dm³=1000 cm³；1 L=1000 mL。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C4/sections/S4.md
- id: concept:数学:体积等于底面积乘高
  type: Concept
  subject: 数学
  title: 体积等于底面积乘高
  conceptType: 概念型
  aliases:
    - 底面积乘高求体积
  category: 法则
  explanation: 长方体和正方体的体积都可以用底面积乘高来计算，即 V=Sh。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C4/sections/S3.md
- id: concept:数学:余弦
  type: Concept
  subject: 数学
  title: 余弦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把cosA定义为对边比斜边，与正弦混淆。
    - 能指出并纠正这一错误：把余弦值写成邻边比对边，遗漏斜边作为分母。
  aliases:
    - cos
  category: 数学概念
  explanation: 在直角三角形中，锐角A的邻边与斜边的比叫做∠A的余弦，记作cosA。
  misconceptions:
    - 把cosA定义为对边比斜边，与正弦混淆。
    - 把余弦值写成邻边比对边，遗漏斜边作为分母。
    - 在非直角三角形中直接求锐角的余弦值，认为任意三角形都适用。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:余数
  type: Concept
  subject: 数学
  title: 余数
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 平均分时剩下的、不够再分一份的数叫余数。它写在算式里商的后面，中间用省略号隔开。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C3/sections/S1.md
- id: concept:数学:余数比除数小
  type: Concept
  subject: 数学
  title: 余数比除数小
  conceptType: 概念型
  aliases:
    - 余数必须小于除数
  category: 法则
  explanation: 平均分时，剩下的数如果够再分一份，就还能继续分，所以余数一定要比除数小。比如除数是4，余数只能是1、2、3。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C3/sections/S2.md
- id: concept:数学:余角
  type: Concept
  subject: 数学
  title: 余角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求一个角的余角时误用180°减去它，如30°的余角写成150°。
    - 能指出并纠正这一错误：认为互余的两个角必须相邻且有公共边，忽略位置无关。
  aliases:
    - complementary angles
  category: 几何概念
  explanation: 如果两个角的和是90°，那么称这两个角互为余角。
  misconceptions:
    - 求一个角的余角时误用180°减去它，如30°的余角写成150°。
    - 认为互余的两个角必须相邻且有公共边，忽略位置无关。
    - 把互余记成“和为180°”，导致判断两个角是否互余出错。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:余角与补角
  type: Concept
  subject: 数学
  title: 余角与补角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为两个角互余或互补时必须共顶点且共边，忽略只需角度和满足条件
    - 能指出并纠正这一错误：求120°的补角用90°-120°得-30°，正确应为180°-120°=60°
  aliases:
    - 互余
    - 互补
  category: 概念
  explanation: 如果两个角的和等于90°，那么这两个角互为余角；如果两个角的和等于180°，那么这两个角互为补角。
  misconceptions:
    - 认为两个角互余或互补时必须共顶点且共边，忽略只需角度和满足条件
    - 求120°的补角用90°-120°得-30°，正确应为180°-120°=60°
    - 计算余角时直接度数相减不带单位换算，如90°-30°25'得59°75'
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:俯角
  type: Concept
  subject: 数学
  title: 俯角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把俯角画成水平线上方的角，方向错误。
    - 能指出并纠正这一错误：从低处观测高处目标时也使用俯角，实际应为仰角。
  aliases: []
  category: 几何概念
  explanation: 当从高处观测低处的目标时，视线与水平线所成的锐角称为俯角。
  misconceptions:
    - 把俯角画成水平线上方的角，方向错误。
    - 从低处观测高处目标时也使用俯角，实际应为仰角。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C1/sections/S5.md
- id: concept:数学:倍数与因数
  type: Concept
  subject: 数学
  title: 倍数与因数
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 回顾倍数与因数的知识：能找出一个数的因数和倍数，会求最大公因数和最小公倍数，会判断质数、合数。
  sourceRef: content/五年级/上册/数学/BSDU-5-1-Math/chapters/C12/sections/S1.md
- id: concept:数学:倍的认识
  type: Concept
  subject: 数学
  title: 倍的认识
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 一个数里有几个另一个数，就说这个数是另一个数的几倍。比如鹅有6只，是3个3只，鹅的只数就是猴子的2倍。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C4/sections/S5.md
- id: concept:数学:倒数
  type: Concept
  subject: 数学
  title: 倒数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为0的倒数是0，因为0乘0等于0？不对，应不存在倒数。
    - 能指出并纠正这一错误：求负数的倒数时漏掉负号，如-3的倒数是3，正确应为-1/3。
  aliases:
    - 互为倒数
  category: 定义
  explanation: 如果两个有理数的乘积为1，那么称其中一个数是另一个数的倒数。
  misconceptions:
    - 误认为0的倒数是0，因为0乘0等于0？不对，应不存在倒数。
    - 求负数的倒数时漏掉负号，如-3的倒数是3，正确应为-1/3。
    - 求小数的倒数时直接交换小数点位置，如0.2的倒数是2.0，正确应为5。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:借助单位换算算小数
  type: Concept
  subject: 数学
  title: 借助单位换算算小数
  conceptType: 程序型
  aliases:
    - 用小数表示测量结果
  category: 方法
  explanation: 利用米与厘米、千克与克等单位之间的进率，把复名数改写成小数，如36厘米=0.36米，12克=0.012千克。
  sourceRef: content/四年级/下册/数学/BSDU-4-2-Math/chapters/C1/sections/S2.md
- id: concept:数学:借助单位换算算小数加减
  type: Concept
  subject: 数学
  title: 借助单位换算算小数加减
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把元换成角来算，比如 12.5 元=125 角，算完再换回小数，这样能明白小数加减法的道理。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C9/sections/S4.md
- id: concept:数学:借助点子图计算
  type: Concept
  subject: 数学
  title: 借助点子图计算
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 用点子图把数分成两部分圈一圈，能直观地看出拆开计算的道理。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C8/sections/S2.md
- id: concept:数学:假命题
  type: Concept
  subject: 数学
  title: 假命题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：举出8、10是合数，就认为‘所有偶数都是合数’是真命题，忽略2是反例。
    - 能指出并纠正这一错误：举反例时条件不满足，如判断‘若a>b，则a²>b²’为假，举a=1,b=2（不满足a>b），不是…
  aliases: []
  category: 数学概念
  explanation: 不正确的命题称为假命题。
  misconceptions:
    - 举出8、10是合数，就认为‘所有偶数都是合数’是真命题，忽略2是反例。
    - 举反例时条件不满足，如判断‘若a>b，则a²>b²’为假，举a=1,b=2（不满足a>b），不是有效反例。
    - 把未经验证的猜测直接说成假命题，如断言‘两个锐角之和一定是钝角’是假命题，却不给出反例。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C7/sections/S2.md
- id: concept:数学:元角分的换算
  type: Concept
  subject: 数学
  title: 元角分的换算
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 1元=10角，1角=10分，元、角、分相邻两个单位之间的进率都是10。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C11/sections/S1.md
- id: concept:数学:先求中间量再解决问题
  type: Concept
  subject: 数学
  title: 先求中间量再解决问题
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 有的数量没有直接告诉我们，要先用已知条件把它算出来，再求最后的问题。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C4/sections/S3.md
- id: concept:数学:光的反射定律
  type: Concept
  subject: 数学
  title: 光的反射定律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把入射角当成入射光线与镜面的夹角，如入射光线与镜面成30°时错写入射角为30°（应为60°）。
    - 能指出并纠正这一错误：画图时忽略法线，导致反射光线与入射光线不在同一平面内，无法正确判断位置关系。
  aliases:
    - 反射定律
  category: 物理定律
  explanation: 反射光线与入射光线、法线在同一平面内，反射角等于入射角。
  misconceptions:
    - 把入射角当成入射光线与镜面的夹角，如入射光线与镜面成30°时错写入射角为30°（应为60°）。
    - 画图时忽略法线，导致反射光线与入射光线不在同一平面内，无法正确判断位置关系。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C7/sections/S4.md
- id: concept:数学:克、千克、吨
  type: Concept
  subject: 数学
  title: 克、千克、吨
  conceptType: 概念型
  aliases:
    - 质量单位
  category: 概念
  explanation: 总复习回顾质量单位克、千克、吨：1 千克=1000 克，1 吨=1000 千克，要根据物体轻重选择合适的单位。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C11/sections/S4.md
- id: concept:数学:克和千克
  type: Concept
  subject: 数学
  title: 克和千克
  conceptType: 概念型
  aliases:
    - 千克与克
  category: 概念
  explanation: 1 克很轻，像几枚曲别针那么重；1 千克大约是 4 个苹果的重量。1 千克=1000 克。称重的工具是秤。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C4/sections/S2.md
- id: concept:数学:全等三角形
  type: Concept
  subject: 数学
  title: 全等三角形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为形状相同就是全等，忽略大小，边长不同的两个等边三角形形状相同但不全等。
    - 能指出并纠正这一错误：用面积相等判断全等，如底2高3与底1高6的三角形面积都是3，但形状大小不同。
  aliases: []
  category: 几何概念
  explanation: 能够完全重合的两个三角形叫作全等三角形。
  misconceptions:
    - 认为形状相同就是全等，忽略大小，边长不同的两个等边三角形形状相同但不全等。
    - 用面积相等判断全等，如底2高3与底1高6的三角形面积都是3，但形状大小不同。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S2.md
- id: concept:数学:全等三角形的对应边相等
  type: Concept
  subject: 数学
  title: 全等三角形的对应边相等
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为全等三角形所有边都相等，混淆'对应边'与'任意边'
    - 能指出并纠正这一错误：不按字母顺序找对应边，如∠A对应∠D时误写AB对应DF
  aliases: []
  category: 性质
  explanation: 全等三角形的对应边相等。
  misconceptions:
    - 误认为全等三角形所有边都相等，混淆'对应边'与'任意边'
    - 不按字母顺序找对应边，如∠A对应∠D时误写AB对应DF
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S5.md
- id: concept:数学:全等三角形的性质
  type: Concept
  subject: 数学
  title: 全等三角形的性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：由面积相等或周长相等反推全等，例如面积都为6的三角形未必全等。
    - 能指出并纠正这一错误：写对应边时随意找，或认为对应角相等必然对应边相等，实际需按重合关系。
  aliases: []
  category: 定理
  explanation: 全等三角形的对应边相等、对应角相等。
  misconceptions:
    - 由面积相等或周长相等反推全等，例如面积都为6的三角形未必全等。
    - 写对应边时随意找，或认为对应角相等必然对应边相等，实际需按重合关系。
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:全等三角形的表示
  type: Concept
  subject: 数学
  title: 全等三角形的表示
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：记作△ABC≌△DEF时不按对应位置写，如写成△ABC≌△EDF，导致对应关系错乱。
    - 能指出并纠正这一错误：用“=”代替“≌”，如写△ABC=△DEF，混淆全等与相等。
  aliases: []
  category: 符号表示
  explanation: 两个三角形全等用符号“≌”表示，记作△ABC≌△DEF，对应顶点写在对应位置。
  misconceptions:
    - 记作△ABC≌△DEF时不按对应位置写，如写成△ABC≌△EDF，导致对应关系错乱。
    - 用“=”代替“≌”，如写△ABC=△DEF，混淆全等与相等。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S3.md
- id: concept:数学:全等图形
  type: Concept
  subject: 数学
  title: 全等图形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为面积相等就是全等，如边长2的正方形与长4宽1的长方形面积都是4，但形状不同。
    - 能指出并纠正这一错误：认为周长相等就是全等，如边长3的正方形与长5宽1的长方形周长都是12，形状不同。
  aliases: []
  category: 几何概念
  explanation: 能够完全重合的两个图形叫做全等图形。
  misconceptions:
    - 认为面积相等就是全等，如边长2的正方形与长4宽1的长方形面积都是4，但形状不同。
    - 认为周长相等就是全等，如边长3的正方形与长5宽1的长方形周长都是12，形状不同。
    - 认为形状相同但大小不同也算全等，如边长比为2:1的两个相似三角形，不能完全重合。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C1/sections/S1.md
- id: concept:数学:公因式
  type: Concept
  subject: 数学
  title: 公因式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：提公因式时只提字母，忽略系数的最大公约数，如6a²b+4ab²误提ab得ab(6a+4b)
    - 能指出并纠正这一错误：认为公因式只能是单项式，忽略多项式整体如(a+b)也可作为公因式
  aliases: []
  category: 数学概念
  explanation: 多项式各项都含有的相同因式，叫作这个多项式各项的公因式。
  misconceptions:
    - 提公因式时只提字母，忽略系数的最大公约数，如6a²b+4ab²误提ab得ab(6a+4b)
    - 认为公因式只能是单项式，忽略多项式整体如(a+b)也可作为公因式
    - 首项为负时提负公因式，括号内各项未全部变号，如-a²+ab提-a误写成-a(a+b)
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:公式法
  type: Concept
  subject: 数学
  title: 公式法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆平方差与完全平方公式，如把a²+2ab-b²误当成完全平方公式
    - 能指出并纠正这一错误：平方差公式忽略项的正负，如-a²+b²误分解成(a+b)(a-b)，正确应为(b+a)(b-a)
  aliases: []
  category: 数学方法
  explanation: 根据因式分解与整式乘法的关系，利用乘法公式（如平方差公式、完全平方公式）把某些多项式因式分解的方法叫作公式法。
  misconceptions:
    - 混淆平方差与完全平方公式，如把a²+2ab-b²误当成完全平方公式
    - 平方差公式忽略项的正负，如-a²+b²误分解成(a+b)(a-b)，正确应为(b+a)(b-a)
    - 完全平方公式漏写中间项2ab，如a²+b²误写成(a+b)²
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:公式法因式分解
  type: Concept
  subject: 数学
  title: 公式法因式分解
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：对x²+4硬套平方差公式，误写成(x+2)(x-2)但原式不能分解
    - 能指出并纠正这一错误：完全平方公式中中间项符号判断错误，如x²+4x+4误写成(x-2)²
  aliases:
    - 公式法
  category: 数学方法
  explanation: 利用乘法公式（如平方差公式、完全平方公式）将多项式因式分解的方法。
  misconceptions:
    - 对x²+4硬套平方差公式，误写成(x+2)(x-2)但原式不能分解
    - 完全平方公式中中间项符号判断错误，如x²+4x+4误写成(x-2)²
    - 分解不彻底，如x⁴-1分解成(x²+1)(x²-1)后未继续分解x²-1
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:公理
  type: Concept
  subject: 数学
  title: 公理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把需要证明的定理当作公理，如认为‘对顶角相等’是公理，实际它是定理。
    - 能指出并纠正这一错误：认为公理也要经过证明才能使用，导致做题时不敢直接用‘两点之间线段最短’。
  aliases:
    - 基本事实
  category: 数学概念
  explanation: 公认的真命题称为公理，是证明其他命题的出发点和依据。
  misconceptions:
    - 把需要证明的定理当作公理，如认为‘对顶角相等’是公理，实际它是定理。
    - 认为公理也要经过证明才能使用，导致做题时不敢直接用‘两点之间线段最短’。
    - 混淆公理与定义，如把‘三角形有三条边’当作公理，实际是定义。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C7/sections/S2.md
- id: concept:数学:公顷与平方千米
  type: Concept
  subject: 数学
  title: 公顷与平方千米
  conceptType: 概念型
  aliases:
    - 公顷
    - 平方千米
  category: 概念
  explanation: 测量和计算土地面积时用公顷、平方千米作单位：边长100米的正方形面积是1公顷，1公顷=10000平方米；1平方千米=100公顷。
  sourceRef: content/五年级/上册/数学/BSDU-5-1-Math/chapters/C6/sections/S7.md
- id: concept:数学:关于x轴对称的点的坐标特征
  type: Concept
  subject: 数学
  title: 关于x轴对称的点的坐标特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把(3,-2)关于x轴对称写成(-3,2)，误认为横纵坐标都变号
    - 能指出并纠正这一错误：画图时只看纵坐标相反，却把横坐标也取相反数，如得(-2,-5)
  aliases:
    - x轴对称坐标关系
  category: 坐标与轴对称
  explanation: 关于x轴对称的两个点，横坐标相同，纵坐标互为相反数；反之，横坐标相同、纵坐标互为相反数的两个点关于x轴对称。
  misconceptions:
    - 把(3,-2)关于x轴对称写成(-3,2)，误认为横纵坐标都变号
    - 画图时只看纵坐标相反，却把横坐标也取相反数，如得(-2,-5)
    - 求解析式时把x换成-x，把y换成-y，实际只需y变号
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C3/sections/S3.md
- id: concept:数学:关于y轴对称的点的坐标特征
  type: Concept
  subject: 数学
  title: 关于y轴对称的点的坐标特征
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把(5,-2)关于y轴对称写成(-5,2)，误以为横纵坐标都变号
    - 能指出并纠正这一错误：求(5,-2)关于y轴对称时写成(5,2)，把y也取了相反数
  aliases:
    - y轴对称坐标关系
  category: 坐标与轴对称
  explanation: 关于y轴对称的两个点，纵坐标相同，横坐标互为相反数；反之，纵坐标相同、横坐标互为相反数的两个点关于y轴对称。
  misconceptions:
    - 把(5,-2)关于y轴对称写成(-5,2)，误以为横纵坐标都变号
    - 求(5,-2)关于y轴对称时写成(5,2)，把y也取了相反数
    - 混淆x轴和y轴规律，把y轴对称写成横坐标相同纵坐标相反
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C3/sections/S3.md
- id: concept:数学:关于坐标轴对称的点的坐标关系
  type: Concept
  subject: 数学
  title: 关于坐标轴对称的点的坐标关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：关于x轴对称时，误认为横坐标也变为相反数，如点(2,3)关于x轴对称写成(-2,3)
    - 能指出并纠正这一错误：关于y轴对称时，误认为纵坐标也变为相反数，如点(2,3)关于y轴对称写成(2,-3)
  aliases:
    - 轴对称坐标关系
  category: 数学性质
  explanation: 关于x轴对称的两点，横坐标相同，纵坐标互为相反数；关于y轴对称的两点，纵坐标相同，横坐标互为相反数。
  misconceptions:
    - 关于x轴对称时，误认为横坐标也变为相反数，如点(2,3)关于x轴对称写成(-2,3)
    - 关于y轴对称时，误认为纵坐标也变为相反数，如点(2,3)关于y轴对称写成(2,-3)
    - 将关于坐标轴对称与关于原点对称混为一谈，如点(2,3)关于x轴对称写成(-2,-3)
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C3/sections/S3.md
- id: concept:数学:关系式
  type: Concept
  subject: 数学
  title: 关系式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写关系式时只写代数式不写等号和因变量，如写成'2x+3'而不是'y=2x+3'。
    - 能指出并纠正这一错误：列关系式时颠倒自变量和因变量，如正方形周长C与边长a，错误写为a=4C。
  aliases:
    - 函数关系式
  category: 数学概念
  explanation: 用含有自变量的代数式表示因变量的等式，称为关系式，是表示变量之间关系的一种常用方法。
  misconceptions:
    - 写关系式时只写代数式不写等号和因变量，如写成'2x+3'而不是'y=2x+3'。
    - 列关系式时颠倒自变量和因变量，如正方形周长C与边长a，错误写为a=4C。
    - 把关系式当成方程求解，如将y=3x+2错误变形为3x+2=0。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C6/sections/S2.md
- id: concept:数学:关系式法
  type: Concept
  subject: 数学
  title: 关系式法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：写关系式时忽略自变量取值范围，如y=10/x不注明x≠0，导致x=0时无意义。
    - 能指出并纠正这一错误：把关系式与方程混为一谈，认为y=3x+2必须写成等号左边是y的形式才是关系式。
  aliases:
    - 解析式法
  category: 数学方法
  explanation: 用数学式子表示变量之间的关系。
  misconceptions:
    - 写关系式时忽略自变量取值范围，如y=10/x不注明x≠0，导致x=0时无意义。
    - 把关系式与方程混为一谈，认为y=3x+2必须写成等号左边是y的形式才是关系式。
    - 用关系式表示变量关系时，随意改变自变量和因变量的位置，如由y=2x+3写成x=2y+3，却不说明谁是谁的函数。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C6/sections/S5.md
- id: concept:数学:内错角
  type: Concept
  subject: 数学
  title: 内错角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为内错角一定相等，忽略两条被截线不平行时它们不等。
    - 能指出并纠正这一错误：找内错角时只看两角在两条直线之间，未检查是否在截线两侧，误把同旁内角当内错角。
  aliases:
    - alternate interior angles
  category: 几何概念
  explanation: 两条直线被第三条直线所截，在被截两直线之间，且位置交错（在截线两侧）的角称为内错角。
  misconceptions:
    - 认为内错角一定相等，忽略两条被截线不平行时它们不等。
    - 找内错角时只看两角在两条直线之间，未检查是否在截线两侧，误把同旁内角当内错角。
    - 在复杂图形中只认“Z”形，不按“被截线之间、截线两侧”逐一判断。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S2.md
- id: concept:数学:内错角相等，两直线平行
  type: Concept
  subject: 数学
  title: 内错角相等，两直线平行
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把内错角相等作为性质用，而不是判定，方向搞反
    - 能指出并纠正这一错误：判定平行时，误将同旁内角相等作为依据（应互补）
  aliases:
    - 内错角相等两直线平行
  category: 定理
  explanation: 两条直线被第三条直线所截，如果内错角相等，那么这两条直线平行。
  misconceptions:
    - 把内错角相等作为性质用，而不是判定，方向搞反
    - 判定平行时，误将同旁内角相等作为依据（应互补）
    - 在四边形中，用一对内错角相等直接证明两对边平行，但忽略了被截线是另两条
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C2/sections/S2.md
- id: concept:数学:减法的性质
  type: Concept
  subject: 数学
  title: 减法的性质
  conceptType: 概念型
  aliases:
    - 连减的简便计算
  category: 法则
  explanation: 一个数连续减去两个数，等于减去这两个数的和，如 100−24−36=100−(24+36)。这样有时算得更简便。
  sourceRef: content/四年级/上册/数学/BSDU-4-1-Math/chapters/C6/sections/S3.md
- id: concept:数学:减法表的规律
  type: Concept
  subject: 数学
  title: 减法表的规律
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 把 10 以内的减法算式按顺序排成减法表，竖着看减号前面的数不变，横着看或斜着看得数有变化，按顺序观察能发现规律。
  sourceRef: content/一年级/上册/数学/BSDU-1-1-Math/chapters/C6/sections/S9.md
- id: concept:数学:凑十法
  type: Concept
  subject: 数学
  title: 凑十法
  conceptType: 程序型
  aliases:
    - 凑十
  category: 方法
  explanation: 算9加几时，先从另一个数里拿1个，凑成10，再加剩下的数。先凑成10，计算就更方便。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C1/sections/S4.md
- id: concept:数学:凑整巧算
  type: Concept
  subject: 数学
  title: 凑整巧算
  conceptType: 程序型
  aliases:
    - 凑整法
  category: 方法
  explanation: 像 1000-372-210，可以把 1000 看成 999+1，先凑成整百数再算，算起来更快。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C4/sections/S2.md
- id: concept:数学:几何体
  type: Concept
  subject: 数学
  title: 几何体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为课本上的图形就是几何体本身，忽略几何体是抽象概念，如把画出的圆柱当成立体图形
    - 能指出并纠正这一错误：把三角形、圆等平面图形误认为几何体，实际几何体是立体图形，如球、棱柱
  aliases:
    - 立体图形
  category: 几何概念
  explanation: 几何体是从实物中抽象出的各种图形，如圆柱、圆锥、正方体、长方体、棱柱、球等。
  misconceptions:
    - 认为课本上的图形就是几何体本身，忽略几何体是抽象概念，如把画出的圆柱当成立体图形
    - 把三角形、圆等平面图形误认为几何体，实际几何体是立体图形，如球、棱柱
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C1/sections/S1.md
- id: concept:数学:几何概率
  type: Concept
  subject: 数学
  title: 几何概率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求圆内随机点距圆心小于r/2的概率，误用长度比r/2÷r=1/2，正确应为面积比π(r/2)²/…
    - 能指出并纠正这一错误：用面积比计算概率时，忽略两个图形单位需一致，如半径用cm、面积用m²直接比。
  aliases: []
  category: 概率
  explanation: 几何概率是通过几何度量（如面积、长度）来计算事件发生的概率。
  misconceptions:
    - 求圆内随机点距圆心小于r/2的概率，误用长度比r/2÷r=1/2，正确应为面积比π(r/2)²/πr²=1/4。
    - 用面积比计算概率时，忽略两个图形单位需一致，如半径用cm、面积用m²直接比。
    - 误认为几何概率等于部分周长除以总周长，如扇形区域概率用弧长比计算。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:几和第几
  type: Concept
  subject: 数学
  title: 几和第几
  conceptType: 概念型
  aliases:
    - 序数
  category: 概念
  explanation: 几个表示一共有多少个，第几表示按顺序排在哪个位置。总数一样时，第几和几个的意思不一样。
  sourceRef: content/一年级/上册/数学/BSDU-1-1-Math/chapters/C2/sections/S1.md
- id: concept:数学:几点钟方向
  type: Concept
  subject: 数学
  title: 几点钟方向
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 以自己为参照，把周围像钟面一样分成 12 个方向：正前方是 12 点钟方向，正后方是 6 点钟方向。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C3/sections/S2.md
- id: concept:数学:凸多边形
  type: Concept
  subject: 数学
  title: 凸多边形
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把五角星这类有凹进部分的多边形当作凸多边形，误以为顶点都朝外就是凸。
    - 能指出并纠正这一错误：判断凸性时只检查部分边，如凹四边形中某一边满足同侧就判凸，忽略了必须任意边都满足。
  aliases: []
  category: 几何概念
  explanation: 多边形总在其任意一条边所在直线的同一侧，本书所说的多边形都是指凸多边形。
  misconceptions:
    - 把五角星这类有凹进部分的多边形当作凸多边形，误以为顶点都朝外就是凸。
    - 判断凸性时只检查部分边，如凹四边形中某一边满足同侧就判凸，忽略了必须任意边都满足。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C4/sections/S3.md
- id: concept:数学:出入相补原理
  type: Concept
  subject: 数学
  title: 出入相补原理
  conceptType: 概念型
  aliases:
    - 以盈补虚
  category: 性质
  explanation: 把图形分割后移补到别处，形状变了但面积没有改变，这个原理也叫以盈补虚。
  sourceRef: content/五年级/上册/数学/BSDU-5-1-Math/chapters/C6/sections/S1.md
- id: concept:数学:函数
  type: Concept
  subject: 数学
  title: 函数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为 x²+y²=1 是函数，因为给一个 x 对应两个 y，违背了唯一确定原则。
    - 能指出并纠正这一错误：把 y²=x 当作函数，忽略一个 x 对应两个 y 值时就不满足函数定义。
  aliases: []
  category: 函数概念
  explanation: 一般地，在一个变化过程中，如果有两个变量x与y，并且对于x的每一个确定的值，y都有唯一确定的值与其对应，那么我们就说x是自变量，y是x的函数。
  misconceptions:
    - 认为 x²+y²=1 是函数，因为给一个 x 对应两个 y，违背了唯一确定原则。
    - 把 y²=x 当作函数，忽略一个 x 对应两个 y 值时就不满足函数定义。
    - 认为函数的自变量取值范围一定是全体实数，如 y=1/x 中 x≠0，忽略了分母不为零的限制。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S1.md
- id: concept:数学:函数图象
  type: Concept
  subject: 数学
  title: 函数图象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：描点画图象时把横纵坐标对调，如把点 (1,2) 描成 (2,1)，导致图象错误。
    - 能指出并纠正这一错误：认为函数图象只能是一条连续不断的曲线，忽略了某些函数图象可以是离散的点。
  aliases:
    - 图像
  category: 函数概念
  explanation: 把一个函数自变量的每一个值与对应的函数值分别作为点的横坐标和纵坐标，在平面直角坐标系中描出相应的点，所有这些点组成的图形叫作该函数的图象。
  misconceptions:
    - 描点画图象时把横纵坐标对调，如把点 (1,2) 描成 (2,1)，导致图象错误。
    - 认为函数图象只能是一条连续不断的曲线，忽略了某些函数图象可以是离散的点。
    - 画 y=1/x 的图象时只画第一象限部分，忽略了 x<0 时还有另一支。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C4/sections/S3.md
- id: concept:数学:函数图象的交点
  type: Concept
  subject: 数学
  title: 函数图象的交点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为交点坐标一定在第一象限，忽略 x 或 y 为负的情况
    - 能指出并纠正这一错误：解方程得到重根时仍说有两个交点，如 y=(x-1)^2 与 y=0 只有一个交点
  aliases: []
  category: 函数图象
  explanation: 两个函数图象的交点坐标同时满足两个函数的表达式，可通过联立方程求解。
  misconceptions:
    - 认为交点坐标一定在第一象限，忽略 x 或 y 为负的情况
    - 解方程得到重根时仍说有两个交点，如 y=(x-1)^2 与 y=0 只有一个交点
    - 只画草图数交点，不联立方程，容易漏掉坐标很大或很小的交点
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C6/sections/S1.md
- id: concept:数学:分割图形解决问题
  type: Concept
  subject: 数学
  title: 分割图形解决问题
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 数排列复杂的图案时，可以把它分成几块相同的部分，分别用乘法算，再加起来或减去。同一个问题可以用多种思路解决。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C9/sections/S3.md
- id: concept:数学:分式
  type: Concept
  subject: 数学
  title: 分式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为π是字母，把x/π当分式，π是常数，分母不含字母不是分式
    - 能指出并纠正这一错误：分式(x-1)/(x-1)的值为零时，直接得x=1，忽略分母为零无意义
  aliases:
    - fraction
  category: 概念
  explanation: 用A，B表示两个整式，A÷B可以表示成A/B的形式，如果B中含有字母，那么称A/B为分式，其中A称为分子，B称为分母。
  misconceptions:
    - 认为π是字母，把x/π当分式，π是常数，分母不含字母不是分式
    - 分式(x-1)/(x-1)的值为零时，直接得x=1，忽略分母为零无意义
    - 把3/x当分式，却误认为x/3也是分式，后者分母不含字母
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:分式方程
  type: Concept
  subject: 数学
  title: 分式方程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把x/2=3误认为分式方程，分母不含未知数，是整式方程
    - 能指出并纠正这一错误：解分式方程后不检验，导致增根如x=1代入分母为零仍保留
  aliases:
    - fractional equation
  category: 方程
  explanation: 分母中含有未知数的方程叫作分式方程。
  misconceptions:
    - 把x/2=3误认为分式方程，分母不含未知数，是整式方程
    - 解分式方程后不检验，导致增根如x=1代入分母为零仍保留
    - 去分母时漏乘不含分母的项，如1/(x+1)=2去分母得1=2(x+1)漏乘常数
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S3.md
- id: concept:数学:分式方程的应用
  type: Concept
  subject: 数学
  title: 分式方程的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：设轮船静水速度为x，列方程时顺流时间与逆流时间关系弄反，如顺流比逆流快却列成顺流时间长
    - 能指出并纠正这一错误：解出x=2.5支笔，直接作答，忽略笔的数量应为整数
  aliases:
    - 分式方程应用题
  category: 数学应用
  explanation: 利用分式方程解决实际问题，如购物优惠、行程问题、经济问题等，通过设未知数、列方程求解。
  misconceptions:
    - 设轮船静水速度为x，列方程时顺流时间与逆流时间关系弄反，如顺流比逆流快却列成顺流时间长
    - 解出x=2.5支笔，直接作答，忽略笔的数量应为整数
    - 实际问题中分式方程解出增根未舍去，如盐水浓度问题x使分母为零仍采用
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:分式有意义的条件
  type: Concept
  subject: 数学
  title: 分式有意义的条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分式1/(x-2)有意义需x≥2，实际只需x≠2
    - 能指出并纠正这一错误：对1/[(x-1)(x-2)]只写x≠1，漏掉x≠2
  aliases: []
  category: 法则
  explanation: 分式的分母不能为零，当分母的值等于零时，分式没有意义。
  misconceptions:
    - 认为分式1/(x-2)有意义需x≥2，实际只需x≠2
    - 对1/[(x-1)(x-2)]只写x≠1，漏掉x≠2
    - 忽略分母整体不为零，如x/(x^2-1)只考虑x≠0，实际x≠±1
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:分式比较大小
  type: Concept
  subject: 数学
  title: 分式比较大小
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：比较a/b与(a+1)/(b+1)，直接认为后者大，未考虑b<0时反而小
    - 能指出并纠正这一错误：作差法通分后，分子符号判断出错，如(a-b)/(b(b+1))只看a-b，忽略分母的符号
  aliases:
    - 分式大小比较
  category: 数学方法
  explanation: 通过作差法或作商法比较分式的大小，如比较a/b与(a+1)/(b+1)的大小。
  misconceptions:
    - 比较a/b与(a+1)/(b+1)，直接认为后者大，未考虑b<0时反而小
    - 作差法通分后，分子符号判断出错，如(a-b)/(b(b+1))只看a-b，忽略分母的符号
    - 作商法比较时，若a、b异号，乘除负数未变号，导致大小结论颠倒
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:分式的乘法法则
  type: Concept
  subject: 数学
  title: 分式的乘法法则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算(a/b)·(c/d)时，分子加分子、分母加分母，错误写成(a+c)/(b+d)
    - 能指出并纠正这一错误：约分时约去加法中的项，如(x+y)/x约去x得1+y，错误
  aliases: []
  category: 法则
  explanation: 两个分式相乘，把分子相乘的积作为积的分子，把分母相乘的积作为积的分母。
  misconceptions:
    - 计算(a/b)·(c/d)时，分子加分子、分母加分母，错误写成(a+c)/(b+d)
    - 约分时约去加法中的项，如(x+y)/x约去x得1+y，错误
    - 符号处理错误，如(-a)/b·c/d结果符号忘记判断，写成正值
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S2.md
- id: concept:数学:分式的基本性质
  type: Concept
  subject: 数学
  title: 分式的基本性质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将(a+b)/(b+c)分子分母同加一个数，认为值不变，如(2+1)/(3+1)=3/4≠2/3
    - 能指出并纠正这一错误：分子分母同乘(x-1)时未注明x≠1，导致x=1时取值改变
  aliases: []
  category: 性质
  explanation: 分式的分子与分母都乘（或除以）同一个不等于零的整式，分式的值不变。
  misconceptions:
    - 将(a+b)/(b+c)分子分母同加一个数，认为值不变，如(2+1)/(3+1)=3/4≠2/3
    - 分子分母同乘(x-1)时未注明x≠1，导致x=1时取值改变
    - 约分时把(a+b)/a中的a约掉得b，错误
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:分式的通分
  type: Concept
  subject: 数学
  title: 分式的通分
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：通分1/(2x)和1/(3x)时，公分母写成6x^2，未取最简公分母6x
    - 能指出并纠正这一错误：通分时只乘分母不改分子，如1/(2x)+1/(3x)错误写成(1+1)/(6x)
  aliases:
    - 通分
  category: 运算方法
  explanation: 根据分式的基本性质，把异分母的分式化为同分母的分式的过程称为通分。通分时通常取最简公分母作为共同分母。
  misconceptions:
    - 通分1/(2x)和1/(3x)时，公分母写成6x^2，未取最简公分母6x
    - 通分时只乘分母不改分子，如1/(2x)+1/(3x)错误写成(1+1)/(6x)
    - 通分后分子符号未处理，如(-x)/(x-1)通分时符号不变
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S2.md
- id: concept:数学:分式的除法法则
  type: Concept
  subject: 数学
  title: 分式的除法法则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算(a/b)÷(c/d)时未颠倒除式，错误写成(a/b)×(c/d)
    - 能指出并纠正这一错误：将除法运算中除式与被除式同时颠倒，如(a/b)÷(c/d)错写成(a/d)÷(c/b)
  aliases: []
  category: 法则
  explanation: 两个分式相除，把除式的分子和分母颠倒位置后再与被除式相乘。
  misconceptions:
    - 计算(a/b)÷(c/d)时未颠倒除式，错误写成(a/b)×(c/d)
    - 将除法运算中除式与被除式同时颠倒，如(a/b)÷(c/d)错写成(a/d)÷(c/b)
    - 除以一个负分式时漏掉负号，如(a/b)÷(-c/d)结果写成正值
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S2.md
- id: concept:数学:分数与小数的互化
  type: Concept
  subject: 数学
  title: 分数与小数的互化
  conceptType: 程序型
  aliases:
    - 分数化小数
    - 小数化分数
  category: 方法
  explanation: 分数化小数用分子除以分母；小数化分数根据小数的意义写成十分之几、百分之几，再约成最简分数。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C1/sections/S3.md
- id: concept:数学:分数与除法的关系
  type: Concept
  subject: 数学
  title: 分数与除法的关系
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 被除数除以除数可以写成分数，被除数相当于分子，除数相当于分母，即 a÷b=a/b（b 不为 0）。
  sourceRef: content/六年级/下册/数学/BSDU-6-2-Math/chapters/C7/sections/S1.md
- id: concept:数学:分数乘分数
  type: Concept
  subject: 数学
  title: 分数乘分数
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 分数乘分数，用分子相乘的积作分子，分母相乘的积作分母，能约分的可以先约分。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C3/sections/S3.md
- id: concept:数学:分数乘整数
  type: Concept
  subject: 数学
  title: 分数乘整数
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 分数乘整数，用分子与整数相乘的积作分子，分母不变；能约分的先约分，结果要化成最简分数。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C3/sections/S1.md
- id: concept:数学:分数混合运算的运算顺序
  type: Concept
  subject: 数学
  title: 分数混合运算的运算顺序
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 分数混合运算的顺序与整数相同：有括号先算括号里的，没有括号时先算乘除、后算加减。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C1/sections/S2.md
- id: concept:数学:分数的通分
  type: Concept
  subject: 数学
  title: 分数的通分
  conceptType: 程序型
  aliases:
    - 通分
  category: 方法
  explanation: 把分母不同的分数分别化成和原来相等的同分母分数，通常用分母的最小公倍数作公分母。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:分数除以整数
  type: Concept
  subject: 数学
  title: 分数除以整数
  conceptType: 概念型
  aliases: []
  category: 法则
  explanation: 分数除以不为 0 的整数，等于这个分数乘整数的倒数，如 4/7÷3=4/7×1/3。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C6/sections/S1.md
- id: concept:数学:分数除法的应用
  type: Concept
  subject: 数学
  title: 分数除法的应用
  conceptType: 应用型
  aliases:
    - 已知部分求整体
  category: 方法
  explanation: 已知一个数的几分之几是多少求这个数时，设这个数为 x，根据“这个数×几分之几=部分量”列出方程解答。
  sourceRef: content/五年级/下册/数学/BSDU-5-2-Math/chapters/C6/sections/S3.md
- id: concept:数学:分段整理数据
  type: Concept
  subject: 数学
  title: 分段整理数据
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 总复习回顾整理数据的方法：把调查收集的数据分类、分段整理并画图表示，根据数据作出判断。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C11/sections/S3.md
- id: concept:数学:分段求总路程
  type: Concept
  subject: 数学
  title: 分段求总路程
  conceptType: 应用型
  aliases: []
  category: 方法
  explanation: 路上换车分成几段时，先用乘法算出每一段的路程，再把各段加起来，就是总路程。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C1/sections/S4.md
- id: concept:数学:分母有理化
  type: Concept
  subject: 数学
  title: 分母有理化
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把 1/√3 化成 √3，改变原值，正确应为√3/3。
    - 能指出并纠正这一错误：1/(√5+√2) 分子分母同乘 √5+√2，分母含根号且不是平方差。
  aliases:
    - 有理化分母
  category: 法则
  explanation: 将分母中的根号去掉的过程，通常通过乘以分母的有理化因式实现。
  misconceptions:
    - 把 1/√3 化成 √3，改变原值，正确应为√3/3。
    - 1/(√5+√2) 分子分母同乘 √5+√2，分母含根号且不是平方差。
    - 有理化符号取反：1/(√3-√2) 乘 √3-√2，分母变成5-2√6，根号没去掉。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:分类
  type: Concept
  subject: 数学
  title: 分类
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 把用途或样子相同的东西放在一起，就是分类。整理房间时把同类物品放一起，房间就整齐了。
  sourceRef: content/一年级/上册/数学/BSDU-1-1-Math/chapters/C10/sections/S3.md
- id: concept:数学:分类记录数据
  type: Concept
  subject: 数学
  title: 分类记录数据
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 把同一类的记在一起，用画圈、画符号或画“正”字来计数，记录又快又清楚，最后还要核对数据。
  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C10/sections/S2.md
- id: concept:数学:切线
  type: Concept
  subject: 数学
  title: 切线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为过圆上一点的任意直线都是切线，实际上只有垂直于该点半径的直线才是切线。
    - 能指出并纠正这一错误：把切线长当作切线的长度，切线是直线不可度量，切线长指圆外一点到切点的线段长。
  aliases: []
  category: 几何
  explanation: 切线是与圆只有一个公共点的直线，切线与半径垂直。
  misconceptions:
    - 误以为过圆上一点的任意直线都是切线，实际上只有垂直于该点半径的直线才是切线。
    - 把切线长当作切线的长度，切线是直线不可度量，切线长指圆外一点到切点的线段长。
    - 判定切线时只证公共点唯一，不证垂直，导致把割线误判为切线。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C4/sections/S1.md
- id: concept:数学:切线的判定定理
  type: Concept
  subject: 数学
  title: 切线的判定定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只证直线垂直于半径，忽略直线必须过半径外端。
    - 能指出并纠正这一错误：认为与圆只有一个公共点的直线就是切线，但未用判定定理证明。
  aliases:
    - 切线判定定理
  category: 定理
  explanation: 过半径外端且垂直于这条半径的直线是圆的切线。
  misconceptions:
    - 只证直线垂直于半径，忽略直线必须过半径外端。
    - 认为与圆只有一个公共点的直线就是切线，但未用判定定理证明。
    - 判定切线时未说明半径的端点，直接下结论。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S7.md
- id: concept:数学:切线的性质与判定
  type: Concept
  subject: 数学
  title: 切线的性质与判定
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：已知切线时，辅助线不连接圆心和切点，无法利用垂直性质解题。
    - 能指出并纠正这一错误：误认为圆的切线垂直于圆内任意半径，实际只垂直于过切点的半径，如半径不过切点则不垂直。
  aliases: []
  category: 数学
  explanation: 圆的切线垂直于过切点的半径；过圆外一点可作两条切线，切线长相等。
  misconceptions:
    - 已知切线时，辅助线不连接圆心和切点，无法利用垂直性质解题。
    - 误认为圆的切线垂直于圆内任意半径，实际只垂直于过切点的半径，如半径不过切点则不垂直。
    - 使用切线长定理时，忽略两条切线需从同一点引出，误把不同点的切线长相加。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S7.md
- id: concept:数学:切线的性质定理
  type: Concept
  subject: 数学
  title: 切线的性质定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把切线垂直于过切点的半径写成垂直于任意半径。
    - 能指出并纠正这一错误：已知切线时，连接圆心和切点但不用垂直关系。
  aliases:
    - 切线性质定理
  category: 定理
  explanation: 圆的切线垂直于过切点的半径。
  misconceptions:
    - 把切线垂直于过切点的半径写成垂直于任意半径。
    - 已知切线时，连接圆心和切点但不用垂直关系。
    - 误认为圆的切线都平行于该圆的某条直径。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S7.md
- id: concept:数学:切线长定理
  type: Concept
  subject: 数学
  title: 切线长定理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：从圆外一点引两条切线，误以为两条切线长度一样，但切线长是到切点距离。
    - 能指出并纠正这一错误：忽略'外一点'条件，认为圆内点也有切线长相等。
  aliases:
    - 切线长定理
  category: 定理
  explanation: 过圆外一点画圆的两条切线，它们的切线长相等。
  misconceptions:
    - 从圆外一点引两条切线，误以为两条切线长度一样，但切线长是到切点距离。
    - 忽略'外一点'条件，认为圆内点也有切线长相等。
    - 把切线长定理推广到任意两条切线，其实必须从同一点引。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C3/sections/S8.md
- id: concept:数学:列二元一次方程组解决实际问题的一般步骤
  type: Concept
  subject: 数学
  title: 列二元一次方程组解决实际问题的一般步骤
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：设未知数时不带单位，造成方程两边单位不统一，如速度单位用千米/时，时间单位用分钟。
    - 能指出并纠正这一错误：解出方程组后不检验实际意义，例如人数为负或小数也直接作答。
  aliases:
    - 列方程组解应用题步骤
  category: 解题方法
  explanation: 列二元一次方程组解决实际问题的一般步骤包括：审题、设未知数、找等量关系、列方程组、解方程组、检验并作答。
  misconceptions:
    - 设未知数时不带单位，造成方程两边单位不统一，如速度单位用千米/时，时间单位用分钟。
    - 解出方程组后不检验实际意义，例如人数为负或小数也直接作答。
    - 找等量关系时重复使用同一条件，列出的两个方程不独立，导致方程组解不出正确答案。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S3.md
- id: concept:数学:列二元一次方程组解应用题
  type: Concept
  subject: 数学
  title: 列二元一次方程组解应用题
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：设未知数不带单位，如设铅笔x支、练习本y本，列式时x乘单价而y漏乘，导致等量关系错误。
    - 能指出并纠正这一错误：等量关系找错，如‘甲比乙大3岁’列成x+y=3，正确应为x-y=3。
  aliases:
    - 方程组应用
  category: 数学方法
  explanation: 根据实际问题中的等量关系，设未知数，列出二元一次方程组并求解。
  misconceptions:
    - 设未知数不带单位，如设铅笔x支、练习本y本，列式时x乘单价而y漏乘，导致等量关系错误。
    - 等量关系找错，如‘甲比乙大3岁’列成x+y=3，正确应为x-y=3。
    - 解出方程组后不检验实际意义，如解得人数为0.5，仍写为0.5人。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C5/sections/S7.md
- id: concept:数学:列代数式
  type: Concept
  subject: 数学
  title: 列代数式
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：把'x的3倍与y的和'误写成 3(x+y)，正确为 3x+y
    - 能指出并纠正这一错误：把'a与b的差的平方'误写成 a-b²，正确为 (a-b)²
  aliases: []
  category: 数学方法
  explanation: 根据实际问题中的数量关系，用含有字母的式子表示出来。
  misconceptions:
    - 把'x的3倍与y的和'误写成 3(x+y)，正确为 3x+y
    - 把'a与b的差的平方'误写成 a-b²，正确为 (a-b)²
    - 混淆'除以'与'除'，如 a 除以 b 误写成 b÷a
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C3/sections/S1.md
- id: concept:数学:列方程解应用题
  type: Concept
  subject: 数学
  title: 列方程解应用题
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：设未知数时不带单位，如设时间为x，实际x小时却当成分钟代入方程。
    - 能指出并纠正这一错误：找等量关系时把“甲比乙多2个”列成甲+2=乙，符号反了。
  aliases:
    - 方程建模
  category: 解题方法
  explanation: 通过设未知数、找等量关系、列方程并求解来解决实际问题的方法。
  misconceptions:
    - 设未知数时不带单位，如设时间为x，实际x小时却当成分钟代入方程。
    - 找等量关系时把“甲比乙多2个”列成甲+2=乙，符号反了。
    - 解出分数或负数解后不检验实际意义，直接作为答案，如人数为-3。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C5/sections/S4.md
- id: concept:数学:列表解决问题
