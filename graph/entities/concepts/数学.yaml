  aliases:
    - 列表比较方案
  category: 方法
  explanation: 买什么东西最省钱，可以把不同的买法用表格一一列出来，算出每种方案要花的钱，再比一比哪个最便宜。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C1/sections/S7.md
- id: concept:数学:判断观察者的方向
