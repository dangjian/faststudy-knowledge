- id: concept:数学:(√a)²=a
  type: Concept
  subject: 数学
  title: (√a)²=a
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：忽略√a中a≥0，如认为(√(-2))²=-2，实际√(-2)无意义
    - 能指出并纠正这一错误：把(√a)²与√(a²)混淆，如认为(√(-3))²=√9=3，但√(-3)无意义
  aliases: []
  category: 数学公式
  explanation: 对于非负实数a，(√a)²=a。
  misconceptions:
    - 忽略√a中a≥0，如认为(√(-2))²=-2，实际√(-2)无意义
    - 把(√a)²与√(a²)混淆，如认为(√(-3))²=√9=3，但√(-3)无意义
    - 由(√a)²=a推出a可为负，如写出(√(-1))²=-1，遗忘根号限制
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S2.md
- id: concept:数学:(∛a)³=a
  type: Concept
  subject: 数学
  title: (∛a)³=a
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为(∛a)³只对非负数成立，如a=-8时不敢算，实际结果也是-8
    - 能指出并纠正这一错误：受√(a²)=|a|影响，把(∛a)³写成|a|，如a=-8时得8
  aliases: []
  category: 数学公式
  explanation: 对于任意实数a，(∛a)³=a。
  misconceptions:
    - 认为(∛a)³只对非负数成立，如a=-8时不敢算，实际结果也是-8
    - 受√(a²)=|a|影响，把(∛a)³写成|a|，如a=-8时得8
    - 计算(∛(-8))³时，先开立方得-2，再立方却写成8
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C2/sections/S2.md
- id: concept:数学:0乘任何数都得0
  type: Concept
  subject: 数学
  title: 0乘任何数都得0
  conceptType: 概念型
  aliases:
    - 0的乘法
  category: 性质
  explanation: 0 乘任何数都等于 0，比如 0×3=0、200×0=0。因为 3 个 0 相加还是 0。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C1/sections/S3.md
- id: concept:数学:0的加减法
  type: Concept
  subject: 数学
  title: 0的加减法
  conceptType: 概念型
  aliases:
    - 与0有关的加减法
  category: 法则
  explanation: 一个数加 0 或减 0，结果还是这个数；两个相同的数相减，结果是 0。
  sourceRef: content/一年级/上册/数学/BSDU-1-1-Math/chapters/C3/sections/S3.md
- id: concept:数学:0的认识
  type: Concept
  subject: 数学
  title: 0的认识
  conceptType: 概念型
  aliases:
    - 认识0
    - 零的认识
  category: 概念
  explanation: 一个东西也没有，就用 0 表示。0 也是一个数，尺子的起点也写着 0。
  sourceRef: content/一年级/上册/数学/BSDU-1-1-Math/chapters/C2/sections/S3.md
- id: concept:数学:0除以任何非0数得0
  type: Concept
  subject: 数学
  title: 0除以任何非0数得0
  conceptType: 概念型
  aliases:
    - 0的除法
  category: 法则
  explanation: 0 个东西平均分给几只猴子，谁都分不到，所以 0 除以任何不是 0 的数都得 0，比如 0÷3=0。
  sourceRef: content/三年级/下册/数学/BSDU-3-2-Math/chapters/C5/sections/S3.md
- id: concept:数学:100以内数的组成
  type: Concept
  subject: 数学
  title: 100以内数的组成
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 两位数由几个十和几个一组成，比如37里有3个十和7个一。可以用小棒、计数器、图画等多种方式表示。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C10/sections/S1.md
- id: concept:数学:100以内数的读写
  type: Concept
  subject: 数学
  title: 100以内数的读写
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 有几个十就在十位上拨几个珠子，有几个一就在个位上拨几个珠子。读数写数都要看清楚每个数位上是几。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C5/sections/S3.md
- id: concept:数学:100以内数的连减
  type: Concept
  subject: 数学
  title: 100以内数的连减
  conceptType: 程序型
  aliases:
    - 两位数连减
  category: 方法
  explanation: 从一个数里连续减去两个数，就是连减。可以一次减一个数，也可以先把要减的数加起来，再一次减掉。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C1/sections/S2.md
- id: concept:数学:100以内数的连加
  type: Concept
  subject: 数学
  title: 100以内数的连加
  conceptType: 程序型
  aliases:
    - 两位数连加
  category: 方法
  explanation: 把三个两位数加在一起就是连加。可以先把整十数相加，再加个位上的数，也可以列竖式一次加一个数，算出总分。
  sourceRef: content/二年级/下册/数学/BSDU-2-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:100减两位数
  type: Concept
  subject: 数学
  title: 100减两位数
  conceptType: 程序型
  aliases: []
  category: 方法
  explanation: 算100减两位数，可以先把两位数拆成整十数和个位数，用100连续减；也可以先算99减它，再加1。
  sourceRef: content/二年级/上册/数学/BSDU-2-1-Math/chapters/C1/sections/S5.md
- id: concept:数学:10个一千是一万
  type: Concept
