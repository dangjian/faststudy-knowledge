  sourceRef: content/三年级/上册/数学/BSDU-3-1-Math/chapters/C5/sections/S4.md
- id: concept:数学:利息的计算
  type: Concept
  subject: 数学
  title: 利息的计算
  conceptType: 应用型
  aliases:
    - 本金
    - 利率
  category: 方法
  explanation: 年利率是一年利息占本金的百分之几，利息=本金×利率×时间。比较不同存法时要注意存期，选择合适的方式存款。
  sourceRef: content/六年级/上册/数学/BSDU-6-1-Math/chapters/C9/sections/S4.md
- id: concept:数学:利润率与折扣
  type: Concept
  subject: 数学
  title: 利润率与折扣
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：打八折写成标价×0.2，应为标价×0.8
    - 能指出并纠正这一错误：利润=成本×利润率，误写成利润=售价×利润率
  aliases: []
  category: 数学应用
  explanation: 涉及商品标价、成本、利润、折扣等关系，如标价比成本高p%，降价幅度不超过d%以保证不亏本。
  misconceptions:
    - 打八折写成标价×0.2，应为标价×0.8
    - 利润=成本×利润率，误写成利润=售价×利润率
    - 标价比成本高p%列式为标价=成本×(1-p%)，应为(1+p%)
  sourceRef: content/八年级/下册/数学/BSDU-8-2-Math/chapters/C5/sections/S1.md
- id: concept:数学:利润问题
  type: Concept
  subject: 数学
  title: 利润问题
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：计算利润率时用利润除以售价，如进价100元售价120元，误算利润率约为16.7%。
    - 能指出并纠正这一错误：混淆“先提价20%再打八折”与“价格不变”，实际变为原价的0.96倍。
  aliases:
    - 销售问题
  category: 应用题类型
  explanation: 涉及成本、售价、利润和利润率之间关系的实际问题。
  misconceptions:
    - 计算利润率时用利润除以售价，如进价100元售价120元，误算利润率约为16.7%。
    - 混淆“先提价20%再打八折”与“价格不变”，实际变为原价的0.96倍。
    - 把“打八折”理解为售价减去原价的20%，而忘记是乘以0.8，导致少算20%。
  sourceRef: content/七年级/上册/数学/BSDU-7-1-Math/chapters/C5/sections/S4.md
- id: concept:数学:利用三角函数测高
  type: Concept
  subject: 数学
  title: 利用三角函数测高
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：底部不可到达时只测一次仰角就计算高度，忽略需要两个观测点。
    - 能指出并纠正这一错误：把测量得到的斜边长度误当作水平距离代入计算。
  aliases: []
  category: 实践活动
  explanation: 通过测量倾斜角、距离等数据，利用直角三角形的边角关系计算物体的高度，包括底部可到达和不可到达两种情况。
  misconceptions:
    - 底部不可到达时只测一次仰角就计算高度，忽略需要两个观测点。
    - 把测量得到的斜边长度误当作水平距离代入计算。
    - 两次测量中忽略观测点高度不同，直接相减导致误差。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C1/sections/S1.md
- id: concept:数学:利用三角形全等测距离
  type: Concept
  subject: 数学
  title: 利用三角形全等测距离
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：构造全等时把已知边当成对应边，如将AB对应DE写成AB对应DF
    - 能指出并纠正这一错误：测距离时直接量不可到达的边，未转化到可测的对应边上
  aliases:
    - 全等三角形测距
  category: 数学应用
  explanation: 通过构造全等三角形，利用全等三角形的对应边相等，将不可直接测量的距离转化为可测量的距离。
  misconceptions:
    - 构造全等时把已知边当成对应边，如将AB对应DE写成AB对应DF
    - 测距离时直接量不可到达的边，未转化到可测的对应边上
    - 依据SAS判定时，误用两边及其中一边对角相等（SSA）来构造全等
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C4/sections/S6.md
- id: concept:数学:利用二次函数图象求一元二次方程的近似根
  type: Concept
  subject: 数学
  title: 利用二次函数图象求一元二次方程的近似根
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：把抛物线与x轴交点的纵坐标当作方程的根，如交点(2,0)误认为根是y=0。
    - 能指出并纠正这一错误：只看图象与x轴一个交点就写一个根，忽略可能有两个交点，如y=x^2-1与x轴交于(-1,0)和(…
  aliases:
    - 图象法求近似根
  category: 方法
  explanation: 通过观察二次函数图象与x轴交点的位置，用计算器逐步逼近，可得到一元二次方程的近似根，结果取到十分位。
  misconceptions:
    - 把抛物线与x轴交点的纵坐标当作方程的根，如交点(2,0)误认为根是y=0。
    - 只看图象与x轴一个交点就写一个根，忽略可能有两个交点，如y=x^2-1与x轴交于(-1,0)和(1,0)，只写x=1。
    - 用计算器逐步逼近时，精确到十分位但四舍五入错误，比如近似根为2.35却写成2.3，实际应为2.4。
  sourceRef: content/九年级/下册/数学/BSDU-9-2-Math/chapters/C2/sections/S1.md
- id: concept:数学:利用关系式求值
  type: Concept
  subject: 数学
  title: 利用关系式求值
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：代入负数时漏加括号，如y=x^2，x=-2误算为-4，正确应是4。
    - 能指出并纠正这一错误：忽视运算顺序，如y=3x+5，x=2时先算x+5得21，正确应先乘3再加5得11。
  aliases: []
  category: 数学方法
  explanation: 根据关系式，已知自变量的值可以求出对应的因变量的值。
  misconceptions:
    - 代入负数时漏加括号，如y=x^2，x=-2误算为-4，正确应是4。
    - 忽视运算顺序，如y=3x+5，x=2时先算x+5得21，正确应先乘3再加5得11。
    - 忽略自变量取值使分母为0，如y=6/x，x=0时仍代入求值，导致错误。
  sourceRef: content/七年级/下册/数学/BSDU-7-2-Math/chapters/C6/sections/S3.md
- id: concept:数学:利用坐标求图形面积
  type: Concept
  subject: 数学
  title: 利用坐标求图形面积
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：用铅锤法求面积时，把水平宽算成两点横坐标之和，如A(1,2)、B(4,2)误为5。
    - 能指出并纠正这一错误：分割图形时，三角形的高误用坐标绝对值相加，例如底在x轴上却用横坐标差当高。
  aliases:
    - 坐标法求面积
  category: 坐标与面积
  explanation: 在平面直角坐标系中，已知多边形各顶点坐标，可以通过分割或补形等方法计算其面积。
  misconceptions:
    - 用铅锤法求面积时，把水平宽算成两点横坐标之和，如A(1,2)、B(4,2)误为5。
    - 分割图形时，三角形的高误用坐标绝对值相加，例如底在x轴上却用横坐标差当高。
    - 求点坐标时，把到x轴距离当作横坐标，到y轴距离当作纵坐标，完全颠倒。
  sourceRef: content/八年级/上册/数学/BSDU-8-1-Math/chapters/C3/sections/S4.md
- id: concept:数学:利用相似三角形测高
  type: Concept
  subject: 数学
  title: 利用相似三角形测高
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：影子法测高时，忽略同一时刻太阳角度，用不同时刻影子比例导致误差。
    - 能指出并纠正这一错误：标杆法中标杆不垂直或与物体不平行，使构造的相似三角形不成立。
  aliases:
    - 相似三角形测高
  category: 数学应用
  explanation: 通过构造相似三角形，利用已知长度和比例关系测量旗杆等物体的高度，常用方法有影子法、标杆法和镜子反射法。
  misconceptions:
    - 影子法测高时，忽略同一时刻太阳角度，用不同时刻影子比例导致误差。
    - 标杆法中标杆不垂直或与物体不平行，使构造的相似三角形不成立。
    - 镜子反射法误用反射角，忽略眼睛、镜子、物体顶点共线，相似对应错。
  sourceRef: content/九年级/上册/数学/BSDU-9-1-Math/chapters/C4/sections/S6.md
- id: concept:数学:制作月历
