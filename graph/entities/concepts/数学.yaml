- id: concept:数学:10个十是一百
  type: Concept
  subject: 数学
  title: 10个十是一百
  conceptType: 概念型
  aliases: []
  category: 概念
  explanation: 10根小棒捆成1捆是1个十，10捆再捆成更大的一捆就是一百。10个十是一百，九十九再添一就是一百。
  sourceRef: content/一年级/下册/数学/BSDU-1-2-Math/chapters/C5/sections/S2.md
- id: concept:数学:10以内加减法
