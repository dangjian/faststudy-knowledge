- id: concept:物理:5G网络
  type: Concept
  subject: 物理
  title: 5G网络
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为5G网络就是Wi-Fi信号，无需SIM卡即可连接。
    - 能指出并纠正这一错误：把低时延理解为下载速度更快，其实时延指响应时间。
  aliases:
    - 第五代移动通信技术
  category: 通信技术
  explanation: 第五代移动通信技术，具有高速率、低时延等特点，支持物联网应用。
  misconceptions:
    - 误以为5G网络就是Wi-Fi信号，无需SIM卡即可连接。
    - 把低时延理解为下载速度更快，其实时延指响应时间。
    - 认为5G网络只用于手机，无法支持物联网设备。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:万有引力理论
  type: Concept
  subject: 物理
  title: 万有引力理论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为万有引力只适用于天体之间，地面上物体间没有引力
    - 能指出并纠正这一错误：把万有引力等同于地球引力，忽视月球与地球间也存在引力
  aliases:
    - 万有引力定律
  category: 物理学
  explanation: 牛顿创立的万有引力理论解释了天体运动的规律，使人们能用统一的观念认识天体运动。
  misconceptions:
    - 认为万有引力只适用于天体之间，地面上物体间没有引力
    - 把万有引力等同于地球引力，忽视月球与地球间也存在引力
    - 认为行星绕太阳运动不需要力，凭惯性维持
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:三线插头和三孔插座
  type: Concept
  subject: 物理
  title: 三线插头和三孔插座
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将三孔插座中的接地线接在零线上，导致金属外壳带电
    - 能指出并纠正这一错误：把三脚插头中的圆柱接地脚误认为零线或火线
  aliases:
    - 三脚插头
    - 三眼插座
    - 三线插头与三孔插座
  category: 安全用电
  explanation: 带有接地线的插头和插座，用于将用电器金属外壳接地，防止漏电触电。
  misconceptions:
    - 误将三孔插座中的接地线接在零线上，导致金属外壳带电
    - 把三脚插头中的圆柱接地脚误认为零线或火线
    - 以为外壳接地后即使火线破损，人接触外壳也绝对不会触电
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:不可再生能源
  type: Concept
  subject: 物理
  title: 不可再生能源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把煤、石油、天然气归为可再生能源，认为可人工合成。
    - 能指出并纠正这一错误：认为太阳能是不可再生能源，因为太阳终会熄灭。
  aliases: []
  category: 能源分类
  explanation: 需要经过数百万年才能形成，使用后逐渐减少，短期内无法恢复的能源，如煤、石油、天然气。
  misconceptions:
    - 误把煤、石油、天然气归为可再生能源，认为可人工合成。
    - 认为太阳能是不可再生能源，因为太阳终会熄灭。
    - 把核能归为可再生能源，因核燃料反应后没有消失。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:两种电荷
  type: Concept
  subject: 物理
  title: 两种电荷
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：混淆摩擦起电顺序，把丝绸摩擦玻璃棒记成带负电
    - 能指出并纠正这一错误：认为摩擦创造了电荷，实际是电荷的转移
  aliases:
    - 正电荷
    - 负电荷
  category: 物理概念
  explanation: 自然界只存在两种电荷：正电荷和负电荷。用丝绸摩擦过的有机玻璃棒带正电荷，用毛皮摩擦过的橡胶棒带负电荷。同种电荷相互排斥，异种电荷相互吸引。
  misconceptions:
    - 混淆摩擦起电顺序，把丝绸摩擦玻璃棒记成带负电
    - 认为摩擦创造了电荷，实际是电荷的转移
    - 用同种电荷吸引判断带电体吸引轻小物体，实际是带电体吸引不带电体
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:中子
  type: Concept
  subject: 物理
  title: 中子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为中子带正电，因为原子核带正电
    - 能指出并纠正这一错误：认为中子带负电，用来抵消质子正电
  aliases: []
  category: 物理粒子
  explanation: 中子是原子核的组成部分，不带电。
  misconceptions:
    - 认为中子带正电，因为原子核带正电
    - 认为中子带负电，用来抵消质子正电
    - 认为中子是质子与电子的组合体
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:串联电路
  type: Concept
  subject: 物理
  title: 串联电路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为串联电路中取下一个小灯泡，其他灯泡仍能发光（实际电路断路全灭）
    - 能指出并纠正这一错误：认为串联电路中开关位置不同控制作用就不同（实际位置不影响控制效果）
  aliases:
    - series circuit
  category: 物理概念
  explanation: 把电路元件逐个顺次连接起来组成的电路称为串联电路。
  misconceptions:
    - 误以为串联电路中取下一个小灯泡，其他灯泡仍能发光（实际电路断路全灭）
    - 认为串联电路中开关位置不同控制作用就不同（实际位置不影响控制效果）
    - 把两个灯泡并列连接说成是串联（应逐个顺次连接）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:串联电路电压特点
  type: Concept
  subject: 物理
  title: 串联电路电压特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为串联电路中各用电器两端电压一定相等（电阻不同则电压不同）
    - 能指出并纠正这一错误：求总电压时只加一个用电器电压，漏加其他用电器电压
  aliases:
    - 串联分压
  category: 物理规律
  explanation: 在串联电路中，电路两端的总电压等于各部分电路两端的电压之和。
  misconceptions:
    - 误认为串联电路中各用电器两端电压一定相等（电阻不同则电压不同）
    - 求总电压时只加一个用电器电压，漏加其他用电器电压
    - 把串联电压特点说成总电压等于各支路电压之和（与并联混淆）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:串联电路电流特点
  type: Concept
  subject: 物理
  title: 串联电路电流特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为电流经过用电器后会变小，灯泡越靠近负极电流越小
    - 能指出并纠正这一错误：认为串联电路中离电源正极越近的电流越大（实际处处相等）
  aliases:
    - 串联电路电流处处相等
  category: 物理规律
  explanation: 在串联电路中，电流处处相等。
  misconceptions:
    - 误认为电流经过用电器后会变小，灯泡越靠近负极电流越小
    - 认为串联电路中离电源正极越近的电流越大（实际处处相等）
    - 看到两个灯泡亮度不同，就断定通过它们的电流不相等
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:主光轴
  type: Concept
  subject: 物理
  title: 主光轴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：过光心的任意直线都叫主光轴，实际只有过两球面球心的直线才是
    - 能指出并纠正这一错误：画图时把主光轴画成与透镜表面平行，忽略了它必须垂直于透镜表面
  aliases: []
  category: 物理概念
  explanation: 通过光心且垂直于透镜表面的直线。
  misconceptions:
    - 过光心的任意直线都叫主光轴，实际只有过两球面球心的直线才是
    - 画图时把主光轴画成与透镜表面平行，忽略了它必须垂直于透镜表面
    - 认为主光轴是透镜的中间水平线，导致焦点画在透镜外面
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:乐音
  type: Concept
  subject: 物理
  title: 乐音
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为声音越响越动听就是乐音，忽视乐音需由有规律振动产生
    - 能指出并纠正这一错误：认为所有乐器发出的声音都是乐音，敲击过猛产生刺耳声也当作乐音
  aliases:
    - musical tone
  category: 声学概念
  explanation: 悦耳动听、令人愉悦的声音，由声源做有规律振动产生。
  misconceptions:
    - 认为声音越响越动听就是乐音，忽视乐音需由有规律振动产生
    - 认为所有乐器发出的声音都是乐音，敲击过猛产生刺耳声也当作乐音
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:二力平衡
  type: Concept
  subject: 物理
  title: 二力平衡
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要两个力大小相等、方向相反就平衡，没有检查是否作用在同一物体上。
    - 能指出并纠正这一错误：认为平衡状态只有静止，忽略匀速直线运动也是平衡状态。
  aliases: []
  category: 概念
  explanation: 物体在两个力作用下保持静止或匀速直线运动状态，这两个力相互平衡。
  misconceptions:
    - 认为只要两个力大小相等、方向相反就平衡，没有检查是否作用在同一物体上。
    - 认为平衡状态只有静止，忽略匀速直线运动也是平衡状态。
    - 把相互作用力当成一对平衡力，忽略它们作用在不同物体上。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:二力平衡的条件
  type: Concept
  subject: 物理
  title: 二力平衡的条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只记等大反向、共线，漏掉必须作用在同一物体上。
    - 能指出并纠正这一错误：认为大小相等、方向相反但不在同一直线上的两个力也能平衡。
  aliases: []
  category: 规律
  explanation: 作用在同一物体上的两个力，大小相等、方向相反且在同一直线上时，这两个力相互平衡。
  misconceptions:
    - 只记等大反向、共线，漏掉必须作用在同一物体上。
    - 认为大小相等、方向相反但不在同一直线上的两个力也能平衡。
    - 认为只要作用在同一物体上且大小相等，方向是否相反无所谓。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:交变电流
  type: Concept
  subject: 物理
  title: 交变电流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电流大小不变、方向周期变化不属于交流电，忽略了方向变化
    - 能指出并纠正这一错误：误将方向不变、大小变化的脉动电流当作交变电流
  aliases:
    - 交流电
  category: 物理概念
  explanation: 大小和方向随时间做周期性变化的电流叫交变电流，简称交流电。
  misconceptions:
    - 认为电流大小不变、方向周期变化不属于交流电，忽略了方向变化
    - 误将方向不变、大小变化的脉动电流当作交变电流
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S4.md
- id: concept:物理:交流
  type: Concept
  subject: 物理
  title: 交流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为交流只需说出自己的结论，不需要倾听或质疑他人观点
    - 能指出并纠正这一错误：认为实验结束后交流毫无意义，只会浪费时间
  aliases:
    - 科学交流
  category: 科学方法
  explanation: 科学探究需要进行交流，交流能促进对探究过程是否完善、证据是否充分、结论是否准确等进行反思与评估，甚至提出新的问题。
  misconceptions:
    - 认为交流只需说出自己的结论，不需要倾听或质疑他人观点
    - 认为实验结束后交流毫无意义，只会浪费时间
    - 把交流当成争论，一味要求对方接受自己的结论，拒绝反思
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:产生感应电流的条件
  type: Concept
  subject: 物理
  title: 产生感应电流的条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只要导体在磁场中运动就产生感应电流，忽略电路必须闭合且切割磁感线
    - 能指出并纠正这一错误：认为闭合电路整体在匀强磁场中平移能产生感应电流，实际磁通量不变
  aliases: []
  category: 物理规律
  explanation: 闭合电路的一部分导体在磁场中做切割磁感线运动时，电路中就会产生感应电流。
  misconceptions:
    - 只要导体在磁场中运动就产生感应电流，忽略电路必须闭合且切割磁感线
    - 认为闭合电路整体在匀强磁场中平移能产生感应电流，实际磁通量不变
    - 认为导体沿磁感线方向运动也是切割磁感线，也会产生感应电流
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S4.md
- id: concept:物理:介质
  type: Concept
  subject: 物理
  title: 介质
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为真空也是介质，因为光能穿过真空，从而推出声音也能在真空中传播
    - 能指出并纠正这一错误：把介质等同于空气，忽略固体液体也能传声，如误以为隔墙无空气就听不到声音
  aliases: []
  category: 物理概念
  explanation: 传播声音的物质，固体、液体和气体统称为介质。声音能在固体、液体和气体中传播。
  misconceptions:
    - 误认为真空也是介质，因为光能穿过真空，从而推出声音也能在真空中传播
    - 把介质等同于空气，忽略固体液体也能传声，如误以为隔墙无空气就听不到声音
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:伏安法测电阻
  type: Concept
  subject: 物理
  title: 伏安法测电阻
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：多次测量小灯泡电阻后取平均值，误以为能减小误差，实际灯泡电阻随温度变化不应求平均
    - 能指出并纠正这一错误：画电路图时让电压表与滑动变阻器并联，误以为测的是待测电阻电压
  aliases:
    - 伏安法
  category: 物理实验方法
  explanation: 利用欧姆定律的变形公式R=U/I，通过测量导体两端的电压和通过导体的电流来测量电阻的方法。
  misconceptions:
    - 多次测量小灯泡电阻后取平均值，误以为能减小误差，实际灯泡电阻随温度变化不应求平均
    - 画电路图时让电压表与滑动变阻器并联，误以为测的是待测电阻电压
    - 误认为伏安法测出的电阻值不受电表内阻影响，实际外接法电流表读数为电压表分流
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S4.md
- id: concept:物理:伏打电堆
  type: Concept
  subject: 物理
  title: 伏打电堆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为伏打电堆就是干电池（伏打电堆用浸盐水的湿布隔开金属片）
    - 能指出并纠正这一错误：误认为伏打电堆可以反复充电使用（它属于一次电池，不能充电）
  aliases:
    - 伏打电池
  category: 物理史实
  explanation: 伏打电堆是意大利物理学家伏打发明的世界上最早的电池，开启了人类研制电池、使用电池的时代。
  misconceptions:
    - 误以为伏打电堆就是干电池（伏打电堆用浸盐水的湿布隔开金属片）
    - 误认为伏打电堆可以反复充电使用（它属于一次电池，不能充电）
    - 把伏打电堆当成发电机，认为它能持续产生电流而不消耗材料
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S6.md
- id: concept:物理:传感器
  type: Concept
  subject: 物理
  title: 传感器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为传感器就是把测量到的物理量直接显示出来的仪表
    - 能指出并纠正这一错误：以为传感器就是开关，只能接通和断开电路
  aliases: []
  category: 物理概念
  explanation: 传感器能感受被测量并按照一定规律转换成可用输出信号的器件或装置，相当于控制电路工作状态的“侦察员”。
  misconceptions:
    - 认为传感器就是把测量到的物理量直接显示出来的仪表
    - 以为传感器就是开关，只能接通和断开电路
    - 将传感器与执行器混淆，认为传感器能直接控制电路工作
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:体积
  type: Concept
  subject: 物理
  title: 体积
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为1升等于1立方分米，但误以为1毫升等于1立方厘米时，1升等于1000毫升，实际1升=1立方分…
    - 能指出并纠正这一错误：计算物体体积时直接用长乘宽乘高，但忽略单位统一，如长用米、宽用厘米、高用分米，导致数字正确但单位…
  aliases: []
  category: 物理量
  explanation: 表示物体所占空间的大小，常用单位有立方米、升、毫升等。
  misconceptions:
    - 认为1升等于1立方分米，但误以为1毫升等于1立方厘米时，1升等于1000毫升，实际1升=1立方分米=1000立方厘米。
    - 计算物体体积时直接用长乘宽乘高，但忽略单位统一，如长用米、宽用厘米、高用分米，导致数字正确但单位错误。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S6.md
- id: concept:物理:保护电阻
  type: Concept
  subject: 物理
  title: 保护电阻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为保护电阻要并联在用电器两端，实际必须串联才能限制电流
    - 能指出并纠正这一错误：误认为保护电阻阻值越大越安全，忽略分压过多导致用电器电压不足
  aliases: []
  category: 电路元件
  explanation: 串联在电路中，用于限制电流或分压，保护用电器正常工作的电阻。
  misconceptions:
    - 误以为保护电阻要并联在用电器两端，实际必须串联才能限制电流
    - 误认为保护电阻阻值越大越安全，忽略分压过多导致用电器电压不足
    - 把保护电阻当成普通负载，计算时不考虑其分压作用
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S4.md
- id: concept:物理:信息
  type: Concept
  subject: 物理
  title: 信息
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为信息就是文字、图像或声音本身，混淆了信息与载体
    - 能指出并纠正这一错误：认为消息条数越多信息量就越大，忽略了消息内容含量
  aliases: []
  category: 物理概念
  explanation: 信息是各种事物发出的有意义的消息，消息中包含的内容越多，信息量就越大。
  misconceptions:
    - 认为信息就是文字、图像或声音本身，混淆了信息与载体
    - 认为消息条数越多信息量就越大，忽略了消息内容含量
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:做功改变物体内能
  type: Concept
  subject: 物理
  title: 做功改变物体内能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为做功只能增加物体内能，如气体膨胀对外做功时内能反而减少。
    - 能指出并纠正这一错误：将做功改变内能的实质说成内能转移，与热传递混淆。
  aliases:
    - 做功改变内能
  category: 物理规律
  explanation: 做功是改变物体内能的另一种方式，其实质是其他形式的能与内能之间的转化。
  misconceptions:
    - 误认为做功只能增加物体内能，如气体膨胀对外做功时内能反而减少。
    - 将做功改变内能的实质说成内能转移，与热传递混淆。
    - 误认为没有做功物体内能就不变，忽略热传递也能改变内能。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:做功的两个必要条件
  type: Concept
  subject: 物理
  title: 做功的两个必要条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：物体受到力但没有在力的方向上移动距离，误认为做功（如举重运动员举着杠铃不动）
    - 能指出并纠正这一错误：物体移动了距离但不受该力作用，误认为做功（如踢出去的足球因惯性滚动）
  aliases: []
  category: 物理规律
  explanation: 对物体有力的作用，且物体在力的方向上通过一段距离，二者缺一不可。
  misconceptions:
    - 物体受到力但没有在力的方向上移动距离，误认为做功（如举重运动员举着杠铃不动）
    - 物体移动了距离但不受该力作用，误认为做功（如踢出去的足球因惯性滚动）
    - 忽略力的方向与运动方向垂直的情况（如提着水桶水平行走，误认为拉力做功）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:像距
  type: Concept
  subject: 物理
  title: 像距
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：测量像距时从光屏量到透镜边缘，应量到光心
    - 能指出并纠正这一错误：把像距当成物体到像的直线距离
  aliases: []
  category: 物理概念
  explanation: 像到透镜的距离，用v表示。
  misconceptions:
    - 测量像距时从光屏量到透镜边缘，应量到光心
    - 把像距当成物体到像的直线距离
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S3.md
- id: concept:物理:光从水或玻璃斜射入空气中时折射角大于入射角
  type: Concept
  subject: 物理
  title: 光从水或玻璃斜射入空气中时折射角大于入射角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：光从水中斜射入空气时，误画成折射光线靠近法线，把折射角画得比入射角小。
    - 能指出并纠正这一错误：把折射角误当作折射光线与界面的夹角，从而在从玻璃射入空气时错判角的大小关系。
  aliases: []
  category: 物理规律
  explanation: 当光从水或玻璃斜射入空气中时，折射光线偏离法线，折射角大于入射角。
  misconceptions:
    - 光从水中斜射入空气时，误画成折射光线靠近法线，把折射角画得比入射角小。
    - 把折射角误当作折射光线与界面的夹角，从而在从玻璃射入空气时错判角的大小关系。
    - 误以为无论从哪种介质到空气，折射角都小于入射角，忽略光从水/玻璃进入空气时偏离法线。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:光从空气斜射入水或玻璃中时折射角小于入射角
  type: Concept
  subject: 物理
  title: 光从空气斜射入水或玻璃中时折射角小于入射角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：光从空气斜射入水中时，误认为折射角大于入射角，画出远离法线的折射光线。
    - 能指出并纠正这一错误：看水下物体时，把从水到空气的光路画错，将空气到水的折射规律套用到水到空气。
  aliases: []
  category: 物理规律
  explanation: 当光从空气斜射入水或玻璃中时，折射光线偏向法线，折射角小于入射角。
  misconceptions:
    - 光从空气斜射入水中时，误认为折射角大于入射角，画出远离法线的折射光线。
    - 看水下物体时，把从水到空气的光路画错，将空气到水的折射规律套用到水到空气。
    - 垂直入射时误认为折射角小于入射角，实际垂直入射折射光线不偏折，折射角为0。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:光在同种不均匀介质中的折射
  type: Concept
  subject: 物理
  title: 光在同种不均匀介质中的折射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光只在从一种介质进入另一种介质时才发生折射，忽略了同种介质疏密不均也能使光弯曲。
    - 能指出并纠正这一错误：把光在不均匀介质中的弯曲路径画成一条折线，实际上应是一条连续弯曲的曲线。
  aliases: []
  category: 物理现象
  explanation: 光在同一种介质中，如果介质疏密分布不均匀，也会发生折射。
  misconceptions:
    - 认为光只在从一种介质进入另一种介质时才发生折射，忽略了同种介质疏密不均也能使光弯曲。
    - 把光在不均匀介质中的弯曲路径画成一条折线，实际上应是一条连续弯曲的曲线。
    - 错误解释海市蜃楼，认为光是直线传播到人眼，没考虑大气密度不均匀引起的折射。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:光导纤维
  type: Concept
  subject: 物理
  title: 光导纤维
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光纤是金属导线，有电流流过，能导电。
    - 能指出并纠正这一错误：误以为光在光纤中沿直线传播，所以光纤不能弯曲。
  aliases:
    - 光纤
  category: 物理概念
  explanation: 能够传输光信号的极其纤细的材料，简称光纤。
  misconceptions:
    - 认为光纤是金属导线，有电流流过，能导电。
    - 误以为光在光纤中沿直线传播，所以光纤不能弯曲。
    - 把光导纤维与光缆混为一谈，认为两者结构完全相同。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:光年
  type: Concept
  subject: 物理
  title: 光年
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把光年当作时间单位，认为过了1光年
    - 能指出并纠正这一错误：将1光年换算成9.46×10^12米，少写10^15
  aliases:
    - l.y.
  category: 天文学
  explanation: 光在真空中传播一年所经过的距离，称为1光年，1光年等于9.46×10^15米。
  misconceptions:
    - 把光年当作时间单位，认为过了1光年
    - 将1光年换算成9.46×10^12米，少写10^15
    - 认为1光年就是光走一年，与光速大小混淆
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S5.md
- id: concept:物理:光心
  type: Concept
  subject: 物理
  title: 光心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光心就是透镜几何中心，厚透镜的光心不在中心
    - 能指出并纠正这一错误：误以为光线过光心后会会聚，实际传播方向不变
  aliases: []
  category: 物理概念
  explanation: 透镜的中心点，通常用O表示，光线通过光心时方向不变。
  misconceptions:
    - 认为光心就是透镜几何中心，厚透镜的光心不在中心
    - 误以为光线过光心后会会聚，实际传播方向不变
    - 把光心当焦点，认为光线都经过光心会聚
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:光源
  type: Concept
  subject: 物理
  title: 光源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将月亮当作光源，因夜晚明亮，实则月亮反射太阳光。
    - 能指出并纠正这一错误：把反光的镜子、抛光的金属当作光源，它们自身并不发光。
  aliases:
    - light source
  category: 物理概念
  explanation: 本身发光的物体叫作光源，如太阳、电灯；月亮不是光源。
  misconceptions:
    - 误将月亮当作光源，因夜晚明亮，实则月亮反射太阳光。
    - 把反光的镜子、抛光的金属当作光源，它们自身并不发光。
    - 认为只有发光发热的物体才是光源，忽略萤火虫、LED灯等冷光源。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S5.md
- id: concept:物理:光热转换
  type: Concept
  subject: 物理
  title: 光热转换
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为太阳能热水器是将光能转化为电能，实际是转化为热能。
    - 能指出并纠正这一错误：以为光热转换效率可达100%，忽略了热量散失。
  aliases: []
  category: 物理应用
  explanation: 将太阳光能转化为热能的方式，如太阳能热水器。
  misconceptions:
    - 误认为太阳能热水器是将光能转化为电能，实际是转化为热能。
    - 以为光热转换效率可达100%，忽略了热量散失。
    - 将光热转换与光电转换混淆，认为只有光伏板才属于光热转换。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:光电转换
  type: Concept
  subject: 物理
  title: 光电转换
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为光伏发电是先光→热→电，实际是直接光→电。
    - 能指出并纠正这一错误：认为光电转换效率能达到100%，忽略损耗。
  aliases: []
  category: 物理应用
  explanation: 将太阳光能直接转化为电能的方式，如光伏发电。
  misconceptions:
    - 误以为光伏发电是先光→热→电，实际是直接光→电。
    - 认为光电转换效率能达到100%，忽略损耗。
    - 将太阳能电池归类为光热转换装置。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:光的三原色
  type: Concept
  subject: 物理
  title: 光的三原色
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把光的三原色与颜料三原色混淆，误记为红、黄、蓝。
    - 能指出并纠正这一错误：认为三原色是红、橙、黄等彩虹色中的任意三种。
  aliases:
    - 三原色光
  category: 物理概念
  explanation: 红、绿、蓝三种色光按不同比例混合能产生其他颜色的光，而它们自身无法用其他色光混合得到，因此称为光的三原色。
  misconceptions:
    - 把光的三原色与颜料三原色混淆，误记为红、黄、蓝。
    - 认为三原色是红、橙、黄等彩虹色中的任意三种。
    - 误以为红、绿、蓝三原色等比例混合得到黑色，实际得到白光。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:光的反射
  type: Concept
  subject: 物理
  title: 光的反射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有光滑的镜面才发生反射，粗糙的黑板、墙壁不反射光
    - 能指出并纠正这一错误：认为光从空气斜射入水中时只发生折射，不发生反射
  aliases:
    - 反射
  category: 物理概念
  explanation: 光射到物体表面时，有一部分会被物体表面反射回来，这种现象称为光的反射。
  misconceptions:
    - 认为只有光滑的镜面才发生反射，粗糙的黑板、墙壁不反射光
    - 认为光从空气斜射入水中时只发生折射，不发生反射
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S3.md
- id: concept:物理:光的反射定律
  type: Concept
  subject: 物理
  title: 光的反射定律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把反射角误认为反射光线与镜面的夹角，如入射角30°时反射角写成60°
    - 能指出并纠正这一错误：认为反射光线、入射光线和法线不在同一平面内也符合反射定律
  aliases:
    - 反射定律
  category: 物理定律
  explanation: 光反射时，反射光线、入射光线和法线在同一平面内，反射光线、入射光线分居在法线两侧，反射角等于入射角。
  misconceptions:
    - 把反射角误认为反射光线与镜面的夹角，如入射角30°时反射角写成60°
    - 认为反射光线、入射光线和法线不在同一平面内也符合反射定律
    - 画反射光路时，让入射光线和反射光线位于法线同侧
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S3.md
- id: concept:物理:光的折射
  type: Concept
  subject: 物理
  title: 光的折射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光从空气斜入水中时折射角大于入射角，实际是小于
    - 能指出并纠正这一错误：认为光垂直入射时也偏折，实际方向不变
  aliases:
    - 折射
  category: 物理概念
  explanation: 光从一种介质斜射入另一种介质时，传播方向发生偏折的现象。
  misconceptions:
    - 认为光从空气斜入水中时折射角大于入射角，实际是小于
    - 认为光垂直入射时也偏折，实际方向不变
    - 混淆反射和折射：认为折射光线与入射光线在界面同侧，实际在法线两侧
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S3.md
- id: concept:物理:光的折射特点
  type: Concept
  subject: 物理
  title: 光的折射特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：画光路图时，把折射光线和入射光线画在法线的同侧，违背折射特点。
    - 能指出并纠正这一错误：误认为入射角增大时折射角减小，实际折射角随入射角增大而增大。
  aliases:
    - 折射定律
  category: 物理定律
  explanation: 光从一种介质斜射入另一种介质时，折射光线、入射光线和法线在同一平面内；折射光线和入射光线分别位于法线两侧；入射角增大（或减小）时，折射角也随之增大（或减小）。
  misconceptions:
    - 画光路图时，把折射光线和入射光线画在法线的同侧，违背折射特点。
    - 误认为入射角增大时折射角减小，实际折射角随入射角增大而增大。
    - 忘了折射光线、入射光线、法线三线共面，还以为折射光线单独在另一平面内。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:光的直线传播
  type: Concept
  subject: 物理
  title: 光的直线传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光只能在空气中传播，不能在真空中传播，如太阳光无法穿过宇宙空间。
    - 能指出并纠正这一错误：认为光在任何介质中都沿直线传播，忽略不均匀介质会使光弯曲，如海市蜃楼。
  aliases:
    - 光沿直线传播
  category: 物理规律
  explanation: 光在均匀介质中沿直线传播，光可以在空气、水等物质中传播，也可以在真空中传播。
  misconceptions:
    - 认为光只能在空气中传播，不能在真空中传播，如太阳光无法穿过宇宙空间。
    - 认为光在任何介质中都沿直线传播，忽略不均匀介质会使光弯曲，如海市蜃楼。
    - 认为光沿直线传播必须有介质，所以认为真空中的光不沿直线传播。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:光的色散
  type: Concept
  subject: 物理
  title: 光的色散
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为白光通过三棱镜后出现的颜色是棱镜‘染’上去的，而非白光本身具有。
    - 能指出并纠正这一错误：把色散后的光色顺序记错，写成红橙黄绿青蓝紫，漏掉了‘靛’。
  aliases:
    - dispersion
  category: 物理现象
  explanation: 太阳光通过三棱镜后分解为红、橙、黄、绿、蓝、靛、紫等色光的现象，表明白光由多种色光混合而成。
  misconceptions:
    - 认为白光通过三棱镜后出现的颜色是棱镜‘染’上去的，而非白光本身具有。
    - 把色散后的光色顺序记错，写成红橙黄绿青蓝紫，漏掉了‘靛’。
    - 认为只有三棱镜才能使太阳光发生色散，水滴、玻璃等其他透明体不能。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:光纤通信
  type: Concept
  subject: 物理
  title: 光纤通信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为光纤通信是利用光在空气中传播，易受天气影响。
    - 能指出并纠正这一错误：认为光纤通信传输的是电信号，不是光信号。
  aliases: []
  category: 通信方式
  explanation: 利用光波在光导纤维中传输信息的通信方式，具有容量大、抗干扰、耐腐蚀等优点。
  misconceptions:
    - 误以为光纤通信是利用光在空气中传播，易受天气影响。
    - 认为光纤通信传输的是电信号，不是光信号。
    - 把光纤通信的抗干扰看成弱点，认为它比电缆更容易被电磁干扰。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:光线
  type: Concept
  subject: 物理
  title: 光线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把光线当成真实存在的光束，认为有一条实际的光线在传播。
    - 能指出并纠正这一错误：画光路图时只画一条光线，认为一条光线代表全部光，实际应画多条表示光束。
  aliases:
    - light ray
  category: 物理模型
  explanation: 用带箭头的直线表示光的传播路径和方向，是研究光的传播而引入的物理模型。
  misconceptions:
    - 把光线当成真实存在的光束，认为有一条实际的光线在传播。
    - 画光路图时只画一条光线，认为一条光线代表全部光，实际应画多条表示光束。
    - 认为光线有粗细，光的传播路径是逐渐变宽的，实际光线是不带粗细的模型。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:光缆
  type: Concept
  subject: 物理
  title: 光缆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为一根光缆只包含一根光纤，只能传输一路信号。
    - 能指出并纠正这一错误：把光缆等同于电缆，认为里面传输的是电流。
  aliases: []
  category: 物理概念
  explanation: 由多根光纤制成的光信号传输线。
  misconceptions:
    - 误以为一根光缆只包含一根光纤，只能传输一路信号。
    - 把光缆等同于电缆，认为里面传输的是电流。
    - 认为光缆可以随意弯折拉伸，不会影响光的传输。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:光能
  type: Concept
  subject: 物理
  title: 光能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光能只能转化为内能，不能转化为电能，如太阳能电池。
    - 能指出并纠正这一错误：把光能误认为是一种力，认为光照到物体上只是施加推力。
  aliases: []
  category: 物理概念
  explanation: 光具有的能量称为光能，可通过一定方式转化为内能、化学能、电能等其他形式的能。
  misconceptions:
    - 认为光能只能转化为内能，不能转化为电能，如太阳能电池。
    - 把光能误认为是一种力，认为光照到物体上只是施加推力。
    - 认为光能不是能量，因为看不见摸不着。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:光路可逆
  type: Concept
  subject: 物理
  title: 光路可逆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：逆着反射光入射时，认为反射光仍沿原反射光方向，不会逆着原入射光射出
    - 能指出并纠正这一错误：认为光路可逆只适用于垂直入射，斜入射时不成立
  aliases:
    - 光路可逆性
  category: 物理原理
  explanation: 在反射现象中，光路是可逆的，即光逆着反射光的方向射到镜面，反射后的光会逆着原来入射光的方向射出。
  misconceptions:
    - 逆着反射光入射时，认为反射光仍沿原反射光方向，不会逆着原入射光射出
    - 认为光路可逆只适用于垂直入射，斜入射时不成立
    - 认为光从A点经镜面反射到B点后，就不能再从B点反射回A点
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S3.md
- id: concept:物理:光速
  type: Concept
  subject: 物理
  title: 光速
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为光在任何介质中速度都等于3×10^8 m/s，忽略水中光速小于真空。
    - 能指出并纠正这一错误：把光速写成3×10^8 km/s，单位换算错误，实际是m/s。
  aliases:
    - 光在真空中的速度
  category: 物理概念
  explanation: 光在真空中的传播速度约为3×10^8 m/s，光传播需要时间。
  misconceptions:
    - 认为光在任何介质中速度都等于3×10^8 m/s，忽略水中光速小于真空。
    - 把光速写成3×10^8 km/s，单位换算错误，实际是m/s。
    - 认为光传播不需要时间，所以闪电和雷声同时到达，忽略光速有限。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:入射角
  type: Concept
  subject: 物理
  title: 入射角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把入射光线与镜面的夹角当作入射角，如光线与镜面成30°时误认为入射角为30°
    - 能指出并纠正这一错误：当光线垂直射向镜面时，认为入射角为90°
  aliases: []
  category: 物理概念
  explanation: 入射光线与法线的夹角称为入射角。
  misconceptions:
    - 把入射光线与镜面的夹角当作入射角，如光线与镜面成30°时误认为入射角为30°
    - 当光线垂直射向镜面时，认为入射角为90°
    - 认为入射角是入射光线与反射光线的夹角
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:八大行星
  type: Concept
  subject: 物理
  title: 八大行星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把金星和地球的顺序弄反，认为金星离太阳更远
    - 能指出并纠正这一错误：将火星与木星对调，或把水星排在地球后
  aliases: []
  category: 天文学
  explanation: 按离太阳由近及远的顺序，八大行星分别是水星、金星、地球、火星、木星、土星、天王星、海王星。
  misconceptions:
    - 把金星和地球的顺序弄反，认为金星离太阳更远
    - 将火星与木星对调，或把水星排在地球后
    - 认为八大行星包括冥王星，漏掉海王星
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:内燃机
  type: Concept
  subject: 物理
  title: 内燃机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为汽油机做功冲程靠飞轮惯性完成，实际是燃气膨胀对活塞做功。
    - 能指出并纠正这一错误：混淆汽油机与柴油机的点火方式，误认为汽油机是压燃式。
  aliases: []
  category: 物理概念
  explanation: 内燃机是最常见的热机，燃料在汽缸内燃烧，直接推动活塞做功。按燃料不同分为汽油机、柴油机等。
  misconceptions:
    - 误认为汽油机做功冲程靠飞轮惯性完成，实际是燃气膨胀对活塞做功。
    - 混淆汽油机与柴油机的点火方式，误认为汽油机是压燃式。
    - 误认为一个工作循环活塞往返一次，实际往返两次。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:内能
  type: Concept
  subject: 物理
  title: 内能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为0℃的物体没有内能，其实一切物体在任何温度下都有内能。
    - 能指出并纠正这一错误：误认为温度升高内能一定增加，忽略内能还与质量、状态有关。
  aliases:
    - 内能
  category: 物理概念
  explanation: 物体内部所有分子动能与分子势能的总和，一切物体都具有内能。
  misconceptions:
    - 误认为0℃的物体没有内能，其实一切物体在任何温度下都有内能。
    - 误认为温度升高内能一定增加，忽略内能还与质量、状态有关。
    - 误认为内能就是热量，如说‘物体含有的热量’。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:凝华
  type: Concept
  subject: 物理
  title: 凝华
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为凝华要吸收热量，比如以为霜的形成会吸热
    - 能指出并纠正这一错误：以为凝华必须先经过液态，比如认为水蒸气先液化再凝固成冰
  aliases:
    - deposition
  category: 物态变化
  explanation: 物质由气态直接变为固态的过程，会放热。
  misconceptions:
    - 认为凝华要吸收热量，比如以为霜的形成会吸热
    - 以为凝华必须先经过液态，比如认为水蒸气先液化再凝固成冰
    - 把露珠说成凝华，其实露珠是水蒸气液化形成
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S4.md
- id: concept:物理:凝固
  type: Concept
  subject: 物理
  title: 凝固
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非晶体凝固时温度也不变，如蜡凝固时温度持续下降却以为保持固定凝固点
    - 能指出并纠正这一错误：认为液体温度降到凝固点就自动凝固，忽略还需继续放热，如0℃的水不继续放热仍不结冰
  aliases: []
  category: 物理概念
  explanation: 物质从液态变为固态的过程叫作凝固。
  misconceptions:
    - 认为非晶体凝固时温度也不变，如蜡凝固时温度持续下降却以为保持固定凝固点
    - 认为液体温度降到凝固点就自动凝固，忽略还需继续放热，如0℃的水不继续放热仍不结冰
    - 认为凝固放热所以温度一定升高，实际晶体凝固时温度保持不变
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:凝固点
  type: Concept
  subject: 物理
  title: 凝固点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有物质都有凝固点，如玻璃、沥青也有固定的凝固点
    - 能指出并纠正这一错误：认为同种晶体的凝固点与熔点不同，如冰的熔点是0℃而凝固点却是-5℃
  aliases: []
  category: 物理概念
  explanation: 晶体凝固时的温度，同种晶体的凝固点与熔点相同。
  misconceptions:
    - 认为所有物质都有凝固点，如玻璃、沥青也有固定的凝固点
    - 认为同种晶体的凝固点与熔点不同，如冰的熔点是0℃而凝固点却是-5℃
    - 认为达到凝固点就立刻凝固，例如水到0℃就自动结冰，忽略仍需放热
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:凸透镜
  type: Concept
  subject: 物理
  title: 凸透镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为凸透镜只能成正立放大像，物距大于2f时却成倒立缩小实像
    - 能指出并纠正这一错误：认为凸透镜对任何光都汇聚于焦点，实际只有平行主光轴的光才汇聚到焦点
  aliases:
    - 会聚透镜
  category: 物理概念
  explanation: 中央厚、边缘薄的透镜，对光有会聚作用，可成放大或缩小的像。
  misconceptions:
    - 认为凸透镜只能成正立放大像，物距大于2f时却成倒立缩小实像
    - 认为凸透镜对任何光都汇聚于焦点，实际只有平行主光轴的光才汇聚到焦点
    - 把会聚作用理解为光线一定相交，实际只是比原来更会聚
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:凸透镜对光的会聚作用
  type: Concept
  subject: 物理
  title: 凸透镜对光的会聚作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：平行光经凸透镜一定交于焦点，错在不平行于主光轴的光不会聚于焦点
    - 能指出并纠正这一错误：认为会聚作用等于能成像，没有光屏就不能显示像
  aliases: []
  category: 光学性质
  explanation: 凸透镜能使平行光会聚于焦点，对光有会聚作用。
  misconceptions:
    - 平行光经凸透镜一定交于焦点，错在不平行于主光轴的光不会聚于焦点
    - 认为会聚作用等于能成像，没有光屏就不能显示像
    - 认为凹透镜发散，凸透镜会聚，所以凸透镜折射光线都在焦点相交
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:凸透镜成像规律
  type: Concept
  subject: 物理
  title: 凸透镜成像规律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：物距等于焦距时也能成像，实际不成像，光屏上无像
    - 能指出并纠正这一错误：物距大于2f时成倒立等大的像，实际是倒立缩小实像
  aliases: []
  category: 物理规律
  explanation: 凸透镜成像的性质与物距和焦距的关系有关，包括倒立或正立、放大或缩小、实像或虚像等。
  misconceptions:
    - 物距等于焦距时也能成像，实际不成像，光屏上无像
    - 物距大于2f时成倒立等大的像，实际是倒立缩小实像
    - 把像距当物距，u>2f时像距写成大于2f，实际f<v<2f
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:凸面镜
  type: Concept
  subject: 物理
  title: 凸面镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把凸面镜当成会聚镜，认为对光有会聚作用（实际发散）。
    - 能指出并纠正这一错误：混淆汽车后视镜，误以为后视镜是凹面镜，说成‘凹面镜扩大视野’。
  aliases:
    - 凸镜
  category: 物理概念
  explanation: 反射面为凸面的镜子，对光有发散作用，能扩大视野，常用于汽车后视镜和道路拐弯处反光镜。
  misconceptions:
    - 把凸面镜当成会聚镜，认为对光有会聚作用（实际发散）。
    - 混淆汽车后视镜，误以为后视镜是凹面镜，说成‘凹面镜扩大视野’。
    - 认为凸面镜成的像能呈现在光屏上，实际成的是虚像。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:凹透镜
  type: Concept
  subject: 物理
  title: 凹透镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为凹透镜也能成实像，实际只能成正立缩小虚像
    - 能指出并纠正这一错误：认为凹透镜成的虚像倒立，实际正立
  aliases:
    - 发散透镜
  category: 物理概念
  explanation: 中央薄、边缘厚的透镜，对光有发散作用，只能成正立缩小的虚像。
  misconceptions:
    - 认为凹透镜也能成实像，实际只能成正立缩小虚像
    - 认为凹透镜成的虚像倒立，实际正立
    - 把近视镜当作凹透镜，却认为近视镜成实像
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:凹透镜对光的发散作用
  type: Concept
  subject: 物理
  title: 凹透镜对光的发散作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为平行光经凹透镜后没有交点，就说光线不传播了，实际反向延长线交于虚焦点
    - 能指出并纠正这一错误：认为发散作用就是光线永不汇聚，但会聚光入射后可能仍会聚
  aliases: []
  category: 光学性质
  explanation: 凹透镜能使平行光发散，对光有发散作用。
  misconceptions:
    - 认为平行光经凹透镜后没有交点，就说光线不传播了，实际反向延长线交于虚焦点
    - 认为发散作用就是光线永不汇聚，但会聚光入射后可能仍会聚
    - 把凹透镜的虚焦点当实焦点，认为光实际会聚到那里
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:凹面镜
  type: Concept
  subject: 物理
  title: 凹面镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把凹面镜当成发散镜，认为对光有发散作用（实际会聚）。
    - 能指出并纠正这一错误：误以为手电筒反光罩是凸面镜，说成‘利用凸面镜会聚光’。
  aliases:
    - 凹镜
  category: 物理概念
  explanation: 反射面为凹面的镜子，对光有会聚作用，可用于太阳灶、手电筒反光罩等。
  misconceptions:
    - 把凹面镜当成发散镜，认为对光有发散作用（实际会聚）。
    - 误以为手电筒反光罩是凸面镜，说成‘利用凸面镜会聚光’。
    - 认为凹面镜只能会聚平行光，想不到对来自焦点的光反射后也平行。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:分子
  type: Concept
  subject: 物理
  title: 分子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为分子是保持物质物理性质的最小微粒，如铁块具有延展性是因为铁分子有延展性。
    - 能指出并纠正这一错误：认为分子不可再分，忽略分子由原子构成，甚至把原子说成分子。
  aliases: []
  category: 物理概念
  explanation: 能保持物质化学性质的最小微粒称为分子，分子由原子构成。
  misconceptions:
    - 误认为分子是保持物质物理性质的最小微粒，如铁块具有延展性是因为铁分子有延展性。
    - 认为分子不可再分，忽略分子由原子构成，甚至把原子说成分子。
    - 误把宏观颗粒（如灰尘、沙粒）当作分子，认为分子肉眼可见。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:分子动理论
  type: Concept
  subject: 物理
  title: 分子动理论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为固体分子完全静止，只有液体、气体分子在运动。
    - 能指出并纠正这一错误：认为分子间只有引力或只有斥力，压缩时只出斥力，拉伸时只出引力。
  aliases:
    - 分子运动论
  category: 物理理论
  explanation: 物质由大量分子组成，分子间有空隙，分子在永不停息地做无规则运动，分子间存在引力和斥力。
  misconceptions:
    - 误认为固体分子完全静止，只有液体、气体分子在运动。
    - 认为分子间只有引力或只有斥力，压缩时只出斥力，拉伸时只出引力。
    - 误认为分子间空隙是宏观可见的，如物体膨胀就是分子空隙变大。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:分子间存在引力
  type: Concept
  subject: 物理
  title: 分子间存在引力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为分子间引力只在固体中存在，液体气体分子间没有
    - 能指出并纠正这一错误：将铅块粘在一起的原因说成大气压力，而非分子引力
  aliases: []
  category: 物理事实
  explanation: 分子间存在相互吸引的力，如两个铅块压紧后不易分开，说明分子间有引力。
  misconceptions:
    - 认为分子间引力只在固体中存在，液体气体分子间没有
    - 将铅块粘在一起的原因说成大气压力，而非分子引力
    - 认为分子间引力就是万有引力，对所有分子都一样
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:分子间存在斥力
  type: Concept
  subject: 物理
  title: 分子间存在斥力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为固体难压缩是因为分子间有间隙，忽略了斥力作用
    - 能指出并纠正这一错误：认为斥力在分子距离变大时消失，只有引力
  aliases: []
  category: 物理事实
  explanation: 分子间不仅存在引力，还存在斥力，使得固体和液体很难被压缩。
  misconceptions:
    - 认为固体难压缩是因为分子间有间隙，忽略了斥力作用
    - 认为斥力在分子距离变大时消失，只有引力
    - 认为分子间引力和斥力不会同时存在，要么引要么斥
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:制动距离
  type: Concept
  subject: 物理
  title: 制动距离
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为车速减半时制动距离也减半，实际制动距离与车速平方成正比。
    - 能指出并纠正这一错误：把制动距离误认为是从发现情况到车完全停下的距离，漏掉反应距离。
  aliases: []
  category: 物理概念
  explanation: 刹车后，车辆由于惯性继续向前滑行的距离称为制动距离。
  misconceptions:
    - 认为车速减半时制动距离也减半，实际制动距离与车速平方成正比。
    - 把制动距离误认为是从发现情况到车完全停下的距离，漏掉反应距离。
    - 认为制动距离只取决于车辆本身，忽略路面摩擦系数的影响。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:刻度尺的使用
  type: Concept
  subject: 物理
  title: 刻度尺的使用
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：读数时视线未正对刻度线，俯视或仰视导致读数偏大或偏小，如俯视读数偏大。
    - 能指出并纠正这一错误：测量时未将刻度尺的零刻度线对准被测物体一端，而是随意放置，导致测量结果不准确。
  aliases: []
  category: 实验技能
  explanation: 使用刻度尺测量长度时，要观察量程和分度值，正确放置并读数。
  misconceptions:
    - 读数时视线未正对刻度线，俯视或仰视导致读数偏大或偏小，如俯视读数偏大。
    - 测量时未将刻度尺的零刻度线对准被测物体一端，而是随意放置，导致测量结果不准确。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:力与运动的关系
  type: Concept
  subject: 物理
  title: 力与运动的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为力是维持运动的原因，撤去力物体就会立即停止。
    - 能指出并纠正这一错误：认为物体受力平衡时一定处于静止状态，忽略匀速直线运动。
  aliases: []
  category: 物理规律
  explanation: 力是改变物体运动状态的原因，物体受力平衡时运动状态不变，受力不平衡时运动状态改变。
  misconceptions:
    - 认为力是维持运动的原因，撤去力物体就会立即停止。
    - 认为物体受力平衡时一定处于静止状态，忽略匀速直线运动。
    - 认为物体运动方向一定与合力方向相同，如曲线运动中二者不共线。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:力是物体对物体的作用
  type: Concept
  subject: 物理
  title: 力是物体对物体的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为力可以脱离物体单独存在，比如没有受力物体的力。
    - 能指出并纠正这一错误：认为只有相互接触才能产生力，忽略重力、磁力等非接触力。
  aliases:
    - 力的定义
  category: 概念
  explanation: 力是物体对物体的作用，力的作用是相互的，施力物体同时也是受力物体。
  misconceptions:
    - 认为力可以脱离物体单独存在，比如没有受力物体的力。
    - 认为只有相互接触才能产生力，忽略重力、磁力等非接触力。
    - 认为施力物体不会受到力的作用，实际上力的作用是相互的。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S7.md
- id: concept:物理:力的三要素
  type: Concept
  subject: 物理
  title: 力的三要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把力的三要素说成大小、方向和单位，漏掉作用点。
    - 能指出并纠正这一错误：画力的示意图时只画了箭头，没有标出作用点。
  aliases: []
  category: 物理概念
  explanation: 力的大小、方向和作用点称为力的三要素。
  misconceptions:
    - 把力的三要素说成大小、方向和单位，漏掉作用点。
    - 画力的示意图时只画了箭头，没有标出作用点。
    - 认为只要大小、方向相同，力的作用效果就一定相同，忽略作用点的影响。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S5.md
- id: concept:物理:力的作用效果
  type: Concept
  subject: 物理
  title: 力的作用效果
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：只想到力改变运动状态，忽略力还能使物体发生形变。
    - 能指出并纠正这一错误：认为物体不受力就一定静止，实际上不受力时保持匀速直线运动。
  aliases: []
  category: 物理概念
  explanation: 力可以使物体发生形变，也可以改变物体的运动状态。
  misconceptions:
    - 只想到力改变运动状态，忽略力还能使物体发生形变。
    - 认为物体不受力就一定静止，实际上不受力时保持匀速直线运动。
    - 认为力的作用效果一定能使物体运动，实际上力是改变运动状态。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:力的作用是相互的
  type: Concept
  subject: 物理
  title: 力的作用是相互的
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为相互作用力作用在同一个物体上，如认为书对桌的压力和桌对书的支持力都作用在书上。
    - 能指出并纠正这一错误：认为相互作用力的方向相同。
  aliases: []
  category: 物理规律
  explanation: 一个物体对另一个物体施力时，另一个物体也同时对这个物体施力，即物体间力的作用是相互的。
  misconceptions:
    - 认为相互作用力作用在同一个物体上，如认为书对桌的压力和桌对书的支持力都作用在书上。
    - 认为相互作用力的方向相同。
    - 认为相互作用力大小相等、方向相反，可以相互抵消。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:力的测量
  type: Concept
  subject: 物理
  title: 力的测量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：读数时视线未与弹簧测力计刻度盘垂直，导致示数偏大或偏小
    - 能指出并纠正这一错误：将测力计倒挂使用前未调零，直接测重会不准确
  aliases:
    - 弹簧测力计
  category: 物理概念
  explanation: 力的大小用弹簧测力计测量，单位是牛顿，符号N。
  misconceptions:
    - 读数时视线未与弹簧测力计刻度盘垂直，导致示数偏大或偏小
    - 将测力计倒挂使用前未调零，直接测重会不准确
    - 认为弹簧测力计只能测重力，测拉力时就不用了
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:力的示意图
  type: Concept
  subject: 物理
  title: 力的示意图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把力的示意图当成的力图示，以为线段长度必须严格按比例表示力的大小。
    - 能指出并纠正这一错误：认为箭头代表作用点，实际箭头表示方向，作用点应在线段起点。
  aliases: []
  category: 物理方法
  explanation: 用带箭头的线段表示力的三要素的图，箭头表示方向，线段起点表示作用点，标注表示大小。
  misconceptions:
    - 把力的示意图当成的力图示，以为线段长度必须严格按比例表示力的大小。
    - 认为箭头代表作用点，实际箭头表示方向，作用点应在线段起点。
    - 画完图不标力的大小，导致无法比较力的大小。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:功率
  type: Concept
  subject: 物理
  title: 功率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算功率时把时间单位分钟直接代入公式，不换算成秒
    - 能指出并纠正这一错误：误认为功率大的机械做功一定多，忽略做功时间
  aliases: []
  category: 物理概念
  explanation: 功与做功所用时间之比叫作功率，表示做功的快慢，公式为P=W/t。单位是瓦特（W），1W=1J/s。
  misconceptions:
    - 计算功率时把时间单位分钟直接代入公式，不换算成秒
    - 误认为功率大的机械做功一定多，忽略做功时间
    - 误认为功率就是机械效率，把有用功与总功的比值代入P=W/t
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:加速器
  type: Concept
  subject: 物理
  title: 加速器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为加速器能加速任何物体，包括不带电的原子
    - 能指出并纠正这一错误：认为加速器是增大物体速度的日常工具，如汽车加速器
  aliases: []
  category: 物理装置
  explanation: 加速器是能使带电粒子加速到很高能量的装置，用于探索微观世界和多种应用。
  misconceptions:
    - 认为加速器能加速任何物体，包括不带电的原子
    - 认为加速器是增大物体速度的日常工具，如汽车加速器
    - 误以为加速器用于观察天体，而非研究微观粒子
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S3.md
- id: concept:物理:动滑轮
  type: Concept
  subject: 物理
  title: 动滑轮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为动滑轮一定省一半力，忽略滑轮自重和绳子摩擦
    - 能指出并纠正这一错误：使用动滑轮时，拉力方向与重物运动方向不平行时仍认为省一半力（如斜拉）
  aliases: []
  category: 简单机械
  explanation: 轴随物体一起运动的滑轮，实质是动力臂为阻力臂两倍的杠杆，最多省一半力。
  misconceptions:
    - 误认为动滑轮一定省一半力，忽略滑轮自重和绳子摩擦
    - 使用动滑轮时，拉力方向与重物运动方向不平行时仍认为省一半力（如斜拉）
    - 认为动滑轮轴固定不动，误当成定滑轮来使用
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:动能
  type: Concept
  subject: 物理
  title: 动能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为质量大的物体动能一定大，忽略速度影响（如静止的大石头与运动的小球）
    - 能指出并纠正这一错误：误认为速度增大一倍，动能也增大一倍，实际动能与速度平方成正比
  aliases: []
  category: 物理概念
  explanation: 物体由于运动而具有的能量叫作动能，其大小与质量和速度有关，质量越大、速度越大，动能越大。
  misconceptions:
    - 误认为质量大的物体动能一定大，忽略速度影响（如静止的大石头与运动的小球）
    - 误认为速度增大一倍，动能也增大一倍，实际动能与速度平方成正比
    - 误认为物体匀速运动时动能一定不变，忽略质量变化（如洒水车匀速洒水）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:动能和势能的相互转化
  type: Concept
  subject: 物理
  title: 动能和势能的相互转化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为物体上升时势能转化为动能，实际是动能转化为势能。
    - 能指出并纠正这一错误：忽略摩擦阻力，误认为机械能必然守恒，如滚摆上升高度不变。
  aliases:
    - 动能与势能转化
  category: 物理规律
  explanation: 动能和势能可以相互转化，如荡秋千、过山车等。
  misconceptions:
    - 误认为物体上升时势能转化为动能，实际是动能转化为势能。
    - 忽略摩擦阻力，误认为机械能必然守恒，如滚摆上升高度不变。
    - 误认为只有动能和势能可以相互转化，其他形式的能不能参与转化。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:势能
  type: Concept
  subject: 物理
  title: 势能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为重力势能只与高度有关，忽略质量大小。
    - 能指出并纠正这一错误：认为只有弹簧才有弹性势能，弓、跳板等发生弹性形变的物体也有。
  aliases: []
  category: 物理概念
  explanation: 重力势能和弹性势能统称为势能，是物体由于位置或形变而具有的能量。
  misconceptions:
    - 认为重力势能只与高度有关，忽略质量大小。
    - 认为只有弹簧才有弹性势能，弓、跳板等发生弹性形变的物体也有。
    - 认为重力势能是物体单独具有的，实际上它是物体和地球共有的。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:匀速直线运动
  type: Concept
  subject: 物理
  title: 匀速直线运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为速度大小不变的运动就是匀速直线运动，忽略方向必须沿直线不变（如匀速圆周运动）。
    - 能指出并纠正这一错误：误以为匀速直线运动的速度与路程成正比，与时间成反比，而实际速度不变。
  aliases: []
  category: 运动类型
  explanation: 物体沿直线且速度不变的运动叫作匀速直线运动，是最简单的运动。
  misconceptions:
    - 认为速度大小不变的运动就是匀速直线运动，忽略方向必须沿直线不变（如匀速圆周运动）。
    - 误以为匀速直线运动的速度与路程成正比，与时间成反比，而实际速度不变。
    - 认为每秒通过路程相等就是匀速直线运动，可能为变速运动中某段时间巧合。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:升华
  type: Concept
  subject: 物理
  title: 升华
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为升华会放出热量，如说干冰升华放热
    - 能指出并纠正这一错误：以为升华一定要先熔化成液体，比如说樟脑丸先熔化再汽化
  aliases:
    - sublimation
  category: 物态变化
  explanation: 物质由固态直接变为气态的过程，需要吸热。
  misconceptions:
    - 认为升华会放出热量，如说干冰升华放热
    - 以为升华一定要先熔化成液体，比如说樟脑丸先熔化再汽化
    - 认为升华只在高温下发生，如觉得常温下樟脑丸不会升华
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S4.md
- id: concept:物理:半导体
  type: Concept
  subject: 物理
  title: 半导体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为半导体在任何条件下导电性都不变，实际光敏、热敏阻值随条件改变
    - 能指出并纠正这一错误：误认为半导体就是绝缘体，所以电路中使用时不能导电
  aliases: []
  category: 物理概念
  explanation: 导电性能介于导体和绝缘体之间的物质叫半导体，如锗和硅。半导体可制成光敏电阻、热敏电阻、发光二极管等。
  misconceptions:
    - 误以为半导体在任何条件下导电性都不变，实际光敏、热敏阻值随条件改变
    - 误认为半导体就是绝缘体，所以电路中使用时不能导电
    - 书写半导体材料时误将其归为导体或绝缘体，忽略锗、硅具有中间导电性
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:单位
  type: Concept
  subject: 物理
  title: 单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国际单位制中长度的基本单位是千米，实际是米，导致换算时错误。
    - 能指出并纠正这一错误：混淆'单位'与'测量工具'，如认为测量长度时用单位'米'，测量工具是刻度尺，但不知道单位是标准量…
  aliases: []
  category: 物理概念
  explanation: 测量时采用的公认标准量，国际单位制中长度的基本单位是米。
  misconceptions:
    - 认为国际单位制中长度的基本单位是千米，实际是米，导致换算时错误。
    - 混淆'单位'与'测量工具'，如认为测量长度时用单位'米'，测量工具是刻度尺，但不知道单位是标准量，不是工具。
    - 认为不同国家使用的单位不同，但国际单位制是全球统一的，如任何国家测量长度都用米作为基本单位。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:南水北调工程
  type: Concept
  subject: 物理
  title: 南水北调工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为南水北调全程自流，忽略东线需泵站逐级提水
    - 能指出并纠正这一错误：把中线水源误认为长江下游，实际是丹江口水库
  aliases:
    - 南水北调
  category: 工程/地理
  explanation: 我国为解决北方缺水问题而实施的大型调水工程，包括东线、中线等，通过泵站提升水位，实现跨流域调水。
  misconceptions:
    - 认为南水北调全程自流，忽略东线需泵站逐级提水
    - 把中线水源误认为长江下游，实际是丹江口水库
    - 以为调水工程对生态无影响，忽视对水源区及沿线的影响
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S5.md
- id: concept:物理:卫星
  type: Concept
  subject: 物理
  title: 卫星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为卫星都是人造的，忽略月球是天然卫星
    - 能指出并纠正这一错误：把月球当作行星，因为它绕着地球转
  aliases: []
  category: 天文学
  explanation: 卫星是绕行星运行的天体，月球是地球唯一的天然卫星。
  misconceptions:
    - 认为卫星都是人造的，忽略月球是天然卫星
    - 把月球当作行星，因为它绕着地球转
    - 认为地球也是太阳的卫星，混淆行星与卫星概念
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:卫星通信
  type: Concept
  subject: 物理
  title: 卫星通信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为卫星通信需要铺设地面光缆来连接各地基站。
    - 能指出并纠正这一错误：认为卫星通信利用超声波传输信息，而不是微波。
  aliases: []
  category: 通信技术
  explanation: 利用人造地球卫星作为中继站的无线通信方式，通常采用微波传递信息。
  misconceptions:
    - 误以为卫星通信需要铺设地面光缆来连接各地基站。
    - 认为卫星通信利用超声波传输信息，而不是微波。
    - 把地球同步卫星误认为可以在任意轨道高度放置，不需赤道上方。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:压力
  type: Concept
  subject: 物理
  title: 压力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为压力总是等于物体重力，如斜面上物体对斜面的压力不等于重力。
    - 能指出并纠正这一错误：认为压力的方向总是竖直向下，实际上应垂直于受力面。
  aliases: []
  category: 物理概念
  explanation: 垂直作用在物体表面上的力叫做压力。压力的方向垂直于受力面并指向受力物体。
  misconceptions:
    - 认为压力总是等于物体重力，如斜面上物体对斜面的压力不等于重力。
    - 认为压力的方向总是竖直向下，实际上应垂直于受力面。
    - 把压力和重力当成同一种力，忽略压力不一定由重力产生。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:压强
  type: Concept
  subject: 物理
  title: 压强
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算压强时面积单位不换算，如2cm²直接代入，应为2×10⁻⁴m²。
    - 能指出并纠正这一错误：把受力面积当作物体总面积，如人站立时只算一只脚面积。
  aliases: []
  category: 物理概念
  explanation: 物体所受压力的大小与受力面积之比叫做压强，公式为p=F/S，单位是帕斯卡（Pa）。
  misconceptions:
    - 计算压强时面积单位不换算，如2cm²直接代入，应为2×10⁻⁴m²。
    - 把受力面积当作物体总面积，如人站立时只算一只脚面积。
    - 认为压力总是等于重力，导致F代入错误。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:压强公式
  type: Concept
  subject: 物理
  title: 压强公式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算压强时把重力当压力，如把斜面上的物体重力除以底面积。
    - 能指出并纠正这一错误：误用整个接触面积作为受力面积，实际只取相互挤压的那部分面积。
  aliases:
    - p=F/S
  category: 物理公式
  explanation: 压强等于压力除以受力面积，即p=F/S，其中p为压强，F为压力，S为受力面积。
  misconceptions:
    - 计算压强时把重力当压力，如把斜面上的物体重力除以底面积。
    - 误用整个接触面积作为受力面积，实际只取相互挤压的那部分面积。
    - 代入公式时面积单位不换算，用cm²直接算导致结果小10⁴倍。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:压强单位
  type: Concept
  subject: 物理
  title: 压强单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1Pa=1N/cm²，忘记1m²=10⁴cm²，换算错误。
    - 能指出并纠正这一错误：认为压强的单位就是N，把压强和压力混为一谈。
  aliases:
    - 帕斯卡
    - Pa
    - N/m²
  category: 物理单位
  explanation: 压强的国际单位是帕斯卡（Pa），1Pa=1N/m²，读作牛每平方米。
  misconceptions:
    - 误认为1Pa=1N/cm²，忘记1m²=10⁴cm²，换算错误。
    - 认为压强的单位就是N，把压强和压力混为一谈。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:原子核
  type: Concept
  subject: 物理
  title: 原子核
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为原子核中存在电子，所以带负电
    - 能指出并纠正这一错误：认为原子核带正电，所以核内不存在不带电的中子
  aliases: []
  category: 物理粒子
  explanation: 原子核位于原子中心，带正电，由质子和中子构成，半径约为10⁻¹⁵m。
  misconceptions:
    - 认为原子核中存在电子，所以带负电
    - 认为原子核带正电，所以核内不存在不带电的中子
    - 忽略原子核体积，认为它占据原子的大部分空间
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:原子结构
  type: Concept
  subject: 物理
  title: 原子结构
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为原子是实心球，不可再分
    - 能指出并纠正这一错误：认为电子沿固定圆周轨道绕核运动，实际是电子云
  aliases:
    - 原子的核式结构模型
  category: 物理概念
  explanation: 原子由带正电的原子核和带负电的电子构成，原子核位于中心，电子绕核运动。
  misconceptions:
    - 认为原子是实心球，不可再分
    - 认为电子沿固定圆周轨道绕核运动，实际是电子云
    - 认为原子由原子核和质子组成，漏掉电子或中子
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S3.md
- id: concept:物理:参照物
  type: Concept
  subject: 物理
  title: 参照物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有静止的地面才能选作参照物，不知道运动的物体也可作为参照物。
    - 能指出并纠正这一错误：以研究对象自身为参照物，得出其永远静止，不能判断运动状态。
  aliases:
    - 参考系
  category: 物理概念
  explanation: 判断物体运动或静止时，被选作标准的物体称为参照物。通常选取地面作为参照物。
  misconceptions:
    - 认为只有静止的地面才能选作参照物，不知道运动的物体也可作为参照物。
    - 以研究对象自身为参照物，得出其永远静止，不能判断运动状态。
    - 误以为选不同参照物，同一物体运动状态必然不同，忽略可能相同。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:双金属片
  type: Concept
  subject: 物理
  title: 双金属片
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为双金属片受热时向膨胀程度大的一侧弯曲
    - 能指出并纠正这一错误：认为双金属片冷却时仍向受热时弯曲的方向弯曲
  aliases:
    - 双金属条
  category: 物理元件
  explanation: 由两种不同金属片叠合制成，受热时因膨胀程度不同而弯曲，用于过载保护。
  misconceptions:
    - 误认为双金属片受热时向膨胀程度大的一侧弯曲
    - 认为双金属片冷却时仍向受热时弯曲的方向弯曲
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:反射角
  type: Concept
  subject: 物理
  title: 反射角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把反射光线与镜面的夹角当作反射角，导致计算错误
    - 能指出并纠正这一错误：垂直入射时，认为反射角为90°
  aliases: []
  category: 物理概念
  explanation: 反射光线与法线的夹角称为反射角。
  misconceptions:
    - 把反射光线与镜面的夹角当作反射角，导致计算错误
    - 垂直入射时，认为反射角为90°
    - 认为反射角大小与反射光线长度有关，反射光线越长反射角越大
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S3.md
- id: concept:物理:反应距离
  type: Concept
  subject: 物理
  title: 反应距离
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为反应距离只与反应时间有关，忽略车速的影响。
    - 能指出并纠正这一错误：把反应距离当成刹车后滑行的距离，混淆制动距离。
  aliases: []
  category: 物理概念
  explanation: 驾驶员从发现情况到开始刹车，车辆行驶的距离称为反应距离。
  misconceptions:
    - 认为反应距离只与反应时间有关，忽略车速的影响。
    - 把反应距离当成刹车后滑行的距离，混淆制动距离。
    - 认为车速增大时反应距离不变，实际上反应距离随车速成正比增大。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:发电机
  type: Concept
  subject: 物理
  title: 发电机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为发电机是将电能转化为机械能的装置，与电动机混淆
    - 能指出并纠正这一错误：认为发电机是利用通电线圈在磁场中受力转动的原理发电
  aliases: []
  category: 物理概念
  explanation: 发电机是利用电磁感应原理发电的装置，将机械能转化为电能。
  misconceptions:
    - 认为发电机是将电能转化为机械能的装置，与电动机混淆
    - 认为发电机是利用通电线圈在磁场中受力转动的原理发电
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:受控电路
  type: Concept
  subject: 物理
  title: 受控电路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为受控电路就是控制开关所在电路，实际上开关在控制电路中
    - 能指出并纠正这一错误：认为受控电路不包含执行设备，只有控制电路才有用电器
  aliases: []
  category: 物理概念
  explanation: 受控电路是被控制电路控制的电路，通常包含执行设备如电动机、指示灯等。
  misconceptions:
    - 认为受控电路就是控制开关所在电路，实际上开关在控制电路中
    - 认为受控电路不包含执行设备，只有控制电路才有用电器
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:变速直线运动
  type: Concept
  subject: 物理
  title: 变速直线运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为变速直线运动必然是速度方向在变，忽略了速度大小变化也可造成变速。
    - 能指出并纠正这一错误：认为平均速度就是各段速度的平均值，直接用速度值求算术平均。
  aliases: []
  category: 运动类型
  explanation: 速度变化的直线运动叫作变速直线运动，其速度是变化的。
  misconceptions:
    - 误以为变速直线运动必然是速度方向在变，忽略了速度大小变化也可造成变速。
    - 认为平均速度就是各段速度的平均值，直接用速度值求算术平均。
    - 误以为变速运动就是曲线运动，忽略变速直线运动仍可沿直线运动。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:可再生能源
  type: Concept
  subject: 物理
  title: 可再生能源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为风能、水能不可再生，因为风和水会停止出现。
    - 能指出并纠正这一错误：认为凡新能源都是可再生能源，如核能就归为可再生能源。
  aliases: []
  category: 能源分类
  explanation: 可以从自然界中源源不断地获得的能源，如太阳能、风能、水能等。
  misconceptions:
    - 误以为风能、水能不可再生，因为风和水会停止出现。
    - 认为凡新能源都是可再生能源，如核能就归为可再生能源。
    - 把天然气当成可再生能源，以为燃烧后还可以再生。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:可听声波
  type: Concept
  subject: 物理
  title: 可听声波
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将可听声波频率范围写成20dB～20000dB，混淆频率与响度单位。
    - 能指出并纠正这一错误：误认为频率低于20Hz和高于20000Hz的声音都叫次声波，忽略超声波。
  aliases:
    - 声音
  category: 物理概念
  explanation: 人耳能听到的声音叫作可听声波，其频率范围通常为20～20000Hz。
  misconceptions:
    - 将可听声波频率范围写成20dB～20000dB，混淆频率与响度单位。
    - 误认为频率低于20Hz和高于20000Hz的声音都叫次声波，忽略超声波。
    - 把20kHz换算成2000Hz，导致频率范围判断错误。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:合力
  type: Concept
  subject: 物理
  title: 合力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为合力一定大于任何一个分力，反向时合力可能小于分力。
    - 能指出并纠正这一错误：认为合力是真实存在的力，实际上是用等效替代法引入的。
  aliases: []
  category: 物理概念
  explanation: 如果一个力的作用效果与几个力共同作用的效果相同，这个力就叫作那几个力的合力。
  misconceptions:
    - 认为合力一定大于任何一个分力，反向时合力可能小于分力。
    - 认为合力是真实存在的力，实际上是用等效替代法引入的。
    - 把互成角度的两个力直接相加，忽略方向夹角，应用平行四边形定则。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:同一直线上二力的合成
  type: Concept
  subject: 物理
  title: 同一直线上二力的合成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：方向相反时合力大小算成两力之和，如3N与5N反向写成8N。
    - 能指出并纠正这一错误：方向相反时合力方向写错，方向应与较大力方向相同。
  aliases:
    - 力的合成
    - 同一直线上两个力的合成
  category: 物理概念
  explanation: 同一直线上方向相同的两个力，合力大小等于两力之和，方向与两力方向相同；方向相反时，合力大小等于两力之差，方向与较大力方向相同。
  misconceptions:
    - 方向相反时合力大小算成两力之和，如3N与5N反向写成8N。
    - 方向相反时合力方向写错，方向应与较大力方向相同。
    - 忽略同一直线条件，把有夹角的力也简单相加减。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:同名磁极相互排斥，异名磁极相互吸引
  type: Concept
  subject: 物理
  title: 同名磁极相互排斥，异名磁极相互吸引
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把同名磁极说成相互吸引，异名磁极说成相互排斥
    - 能指出并纠正这一错误：认为磁体之间不接触就没有相互作用力，忽略磁场存在
  aliases:
    - 磁极间相互作用规律
  category: 物理规律
  explanation: 磁体之间通过磁场相互作用，同名磁极相互排斥，异名磁极相互吸引。
  misconceptions:
    - 误把同名磁极说成相互吸引，异名磁极说成相互排斥
    - 认为磁体之间不接触就没有相互作用力，忽略磁场存在
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:周期
  type: Concept
  subject: 物理
  title: 周期
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用振动次数除以时间，把结果叫做周期，单位写成Hz。
    - 能指出并纠正这一错误：误以为频率越大周期越大，周期与频率成正比。
  aliases: []
  category: 物理量
  explanation: 振动一次所需要的时间，用字母T表示，单位是秒（s）。
  misconceptions:
    - 用振动次数除以时间，把结果叫做周期，单位写成Hz。
    - 误以为频率越大周期越大，周期与频率成正比。
    - 将周期的单位写成赫兹，或把频率单位写成秒。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S2.md
- id: concept:物理:哈勃定律
  type: Concept
  subject: 物理
  title: 哈勃定律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有星系都在远离我们，包括银河系内恒星
    - 能指出并纠正这一错误：认为距离越远，远离速度越慢，与定律相反
  aliases: []
  category: 天文学
  explanation: 哈勃定律指出银河系外的星系在远离我们而去，距离越远，远离速度越快，表明宇宙在膨胀。
  misconceptions:
    - 认为所有星系都在远离我们，包括银河系内恒星
    - 认为距离越远，远离速度越慢，与定律相反
    - 认为宇宙在收缩，或星系间距离保持不变
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S5.md
- id: concept:物理:响度
  type: Concept
  subject: 物理
  title: 响度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将响度等同于音调，以为响度大就是声音音调高
    - 能指出并纠正这一错误：把分贝当作响度的单位，混淆响度与声强级的概念
  aliases:
    - loudness
  category: 物理概念
  explanation: 人耳感觉到的声音的强弱，与声源的振幅有关，振幅越大响度越大。
  misconceptions:
    - 将响度等同于音调，以为响度大就是声音音调高
    - 把分贝当作响度的单位，混淆响度与声强级的概念
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:噪声
  type: Concept
  subject: 物理
  title: 噪声
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为响度大的声音是噪声，轻声细语则不可能是噪声
    - 能指出并纠正这一错误：认为只有机器声、汽车声才是噪声，音乐声在任何情况下都不是噪声
  aliases:
    - noise
  category: 声学概念
  explanation: 刺耳难听、令人厌烦的声音，干扰人们正常的学习、工作和休息。
  misconceptions:
    - 认为响度大的声音是噪声，轻声细语则不可能是噪声
    - 认为只有机器声、汽车声才是噪声，音乐声在任何情况下都不是噪声
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:噪声排放标准
  type: Concept
  subject: 物理
  title: 噪声排放标准
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有环境执行同一噪声标准，忽视居民区、工业区等不同限值。
    - 能指出并纠正这一错误：把噪声排放标准当成自愿遵守的指南，误以为违反不违法。
  aliases:
    - 噪声标准
  category: 物理法规
  explanation: 国家制定的不同环境下的噪声允许排放限值，用于法律治理噪声。
  misconceptions:
    - 认为所有环境执行同一噪声标准，忽视居民区、工业区等不同限值。
    - 把噪声排放标准当成自愿遵守的指南，误以为违反不违法。
    - 混淆分贝数值与具体环境，如认为90dB在任何地方都超标。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S3.md
- id: concept:物理:噪声的危害
  type: Concept
  subject: 物理
  title: 噪声的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为噪声只会损伤听力，不会诱发高血压等疾病
    - 能指出并纠正这一错误：认为短暂接触90dB以上噪声也无妨，忽视累积性听力损伤
  aliases: []
  category: 物理应用
  explanation: 噪声会使人烦躁、注意力分散，妨碍工作和休息，还会对人的健康产生不良影响，如听力下降、头昏、头痛、神经衰弱、消化不良，甚至诱发心脏病和高血压。
  misconceptions:
    - 认为噪声只会损伤听力，不会诱发高血压等疾病
    - 认为短暂接触90dB以上噪声也无妨，忽视累积性听力损伤
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S3.md
- id: concept:物理:噪声的控制
  type: Concept
  subject: 物理
  title: 噪声的控制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把减弱噪声理解为完全消除噪声，如认为隔音墙后应绝对无声。
    - 能指出并纠正这一错误：将隔音墙、绿化带归为在声源处减弱，实际应在传播过程中减弱。
  aliases:
    - 减弱噪声的途径
  category: 物理方法
  explanation: 控制噪声的三种途径：在声源处减弱、在传播过程中减弱、在人耳处减弱。
  misconceptions:
    - 把减弱噪声理解为完全消除噪声，如认为隔音墙后应绝对无声。
    - 将隔音墙、绿化带归为在声源处减弱，实际应在传播过程中减弱。
    - 认为控制噪声只能采用一种途径，而实际需多种途径综合运用。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S3.md
- id: concept:物理:噪声监测仪
  type: Concept
  subject: 物理
  title: 噪声监测仪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为噪声监测仪能直接降低噪声，其实它只监测不控制。
    - 能指出并纠正这一错误：误把监测仪显示的分贝当作声音的频率，或认为显示的是响度级。
  aliases: []
  category: 物理仪器
  explanation: 用于实时监测噪声的仪器，环保部门常在一些重点场所设置。
  misconceptions:
    - 认为噪声监测仪能直接降低噪声，其实它只监测不控制。
    - 误把监测仪显示的分贝当作声音的频率，或认为显示的是响度级。
    - 以为监测仪能识别噪声来源类型，例如区分车声或人声。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S3.md
- id: concept:物理:回声
  type: Concept
  subject: 物理
  title: 回声
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为只有山谷中才有回声，忽略了在教室里讲话也有回声，只是与原声混在一起
    - 能指出并纠正这一错误：计算回声距离时，直接用声速乘听到回声的时间，忘记时间要除以2，导致距离算成双倍
  aliases: []
  category: 物理现象
  explanation: 声波遇到障碍物反射回来形成的声音，如山谷中的回声。
  misconceptions:
    - 误以为只有山谷中才有回声，忽略了在教室里讲话也有回声，只是与原声混在一起
    - 计算回声距离时，直接用声速乘听到回声的时间，忘记时间要除以2，导致距离算成双倍
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:回声定位
  type: Concept
  subject: 物理
  title: 回声定位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为蝙蝠发出的是次声波，因为人耳听不到。
    - 能指出并纠正这一错误：认为回声定位只需发射超声波，不需要接收反射波。
  aliases:
    - 回声定位原理
  category: 物理原理
  explanation: 通过发射超声波并接收反射波来探测目标位置的技术，蝙蝠等动物利用此原理捕食。
  misconceptions:
    - 误认为蝙蝠发出的是次声波，因为人耳听不到。
    - 认为回声定位只需发射超声波，不需要接收反射波。
    - 认为回声定位只能测距离，无法判断目标方位。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S4.md
- id: concept:物理:固体、液体、气体的分子模型
  type: Concept
  subject: 物理
  title: 固体、液体、气体的分子模型
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为固体分子固定不动，其实它们在平衡位置附近振动
    - 能指出并纠正这一错误：误以为气体分子间作用力很大，导致气体有固定体积，实际气体分子间作用力极小
  aliases:
    - 物质三态的分子结构
  category: 物理模型
  explanation: 固体分子间作用力大，分子排列有规律，只能在固定位置附近振动，因此有一定体积和形状；液体分子间作用力较小，分子可在一定范围内运动，有一定体积无固定形状；气体分子间作用力最小，分子自由运动，无固定体积和形状。
  misconceptions:
    - 认为固体分子固定不动，其实它们在平衡位置附近振动
    - 误以为气体分子间作用力很大，导致气体有固定体积，实际气体分子间作用力极小
    - 把液体分子排列说成有规则，实际液体分子排列无规则但间距较小
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:国际单位制
  type: Concept
  subject: 物理
  title: 国际单位制
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为国际单位制中所有物理量的单位都是基本单位，实际导出单位如速度单位m/s也是国际单位制单位，但…
    - 能指出并纠正这一错误：误认为国际单位制只包含长度、质量、时间三个基本单位，实际还有电流、温度、物质的量、发光强度等。
  aliases:
    - SI
  category: 物理概念
  explanation: 国际通用的单位制，基本单位包括米、千克等。
  misconceptions:
    - 认为国际单位制中所有物理量的单位都是基本单位，实际导出单位如速度单位m/s也是国际单位制单位，但并非基本单位。
    - 误认为国际单位制只包含长度、质量、时间三个基本单位，实际还有电流、温度、物质的量、发光强度等。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:地心说
  type: Concept
  subject: 物理
  title: 地心说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为地心说完全错误而一无是处，实际它统治了天文学1300多年，有历史贡献
    - 能指出并纠正这一错误：混淆地心说和日心说的提出者，误把地心说归功于哥白尼
  aliases:
    - 托勒玫体系
  category: 天文学说
  explanation: 地心说由托勒玫提出，认为地球是宇宙中心，日月星辰围绕地球旋转，统治天文学1300多年。
  misconceptions:
    - 认为地心说完全错误而一无是处，实际它统治了天文学1300多年，有历史贡献
    - 混淆地心说和日心说的提出者，误把地心说归功于哥白尼
    - 以为地心说主张太阳绕地球转，但地心说中也认为行星绕地球转
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:地球静止轨道卫星
  type: Concept
  subject: 物理
  title: 地球静止轨道卫星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为静止轨道卫星在太空中真的是静止不动。
    - 能指出并纠正这一错误：认为在地球任意纬度上空都可以放置静止轨道卫星。
  aliases:
    - 同步卫星
  category: 航天技术
  explanation: 在地球赤道平面内距地面约35800km的轨道上运行，绕地球一周时间与地球自转周期相同，从地面看静止不动。
  misconceptions:
    - 误以为静止轨道卫星在太空中真的是静止不动。
    - 认为在地球任意纬度上空都可以放置静止轨道卫星。
    - 把静止轨道卫星的周期说成与月球相同，绕地一周需一月。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:地磁场
  type: Concept
  subject: 物理
  title: 地磁场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为地磁N极在地理北极附近，导致指南针N极指向地理南极
    - 能指出并纠正这一错误：认为地磁场方向就是地理南北方向，忽略了磁偏角
  aliases: []
  category: 物理概念
  explanation: 地球本身是一个巨大的磁体，其周围空间存在的磁场称为地磁场，地磁N极在地理南极附近，地磁S极在地理北极附近。
  misconceptions:
    - 认为地磁N极在地理北极附近，导致指南针N极指向地理南极
    - 认为地磁场方向就是地理南北方向，忽略了磁偏角
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:地线
  type: Concept
  subject: 物理
  title: 地线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为地线与零线可以互换使用，把地线直接接入电路
    - 能指出并纠正这一错误：认为地线的作用是防止用电器过载
  aliases:
    - 保护接地线
  category: 安全用电
  explanation: 与大地相连的导线，用于将用电器的金属外壳接地，防止触电。
  misconceptions:
    - 误以为地线与零线可以互换使用，把地线直接接入电路
    - 认为地线的作用是防止用电器过载
    - 误以为外壳接地后就不可能发生任何触电事故
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:增大和减小压强的方法
  type: Concept
  subject: 物理
  title: 增大和减小压强的方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为增大压力一定会增大压强，忽视受力面积可能同时变大。
    - 能指出并纠正这一错误：把磨刀减小受力面积说成是减小压强，实际是增大压强。
  aliases:
    - 改变压强的方法
  category: 物理方法
  explanation: 增大压强可通过增大压力或减小受力面积实现；减小压强可通过减小压力或增大受力面积实现。
  misconceptions:
    - 误以为增大压力一定会增大压强，忽视受力面积可能同时变大。
    - 把磨刀减小受力面积说成是减小压强，实际是增大压强。
    - 认为减小压强必须减小压力，忽视增大受力面积同样可以减小压强。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:增大和减小摩擦的方法
  type: Concept
  subject: 物理
  title: 增大和减小摩擦的方法
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为增大压力可以减小摩擦力，实际增大压力是增大摩擦的方法。
    - 能指出并纠正这一错误：认为变滑动为滚动是增大摩擦，实际是减小摩擦。
  aliases:
    - 增大或减小摩擦力的方法
  category: 物理应用
  explanation: 增大摩擦的方法有增大压力、增大接触面粗糙程度；减小摩擦的方法有减小压力、减小接触面粗糙程度、加润滑油、变滑动为滚动等。
  misconceptions:
    - 认为增大压力可以减小摩擦力，实际增大压力是增大摩擦的方法。
    - 认为变滑动为滚动是增大摩擦，实际是减小摩擦。
    - 认为加润滑油是为了增大接触面粗糙程度来增大摩擦。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:声呐
  type: Concept
  subject: 物理
  title: 声呐
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为声呐发射的是电磁波，与雷达原理相同。
    - 能指出并纠正这一错误：认为声呐在真空中也能正常工作，忽略声波需要介质传播。
  aliases:
    - 声纳
  category: 物理应用
  explanation: 声呐是利用超声波方向性好、在水中传播距离远等特性制成的定位与测距系统，用于水下探测等。
  misconceptions:
    - 误认为声呐发射的是电磁波，与雷达原理相同。
    - 认为声呐在真空中也能正常工作，忽略声波需要介质传播。
    - 将声呐与B超混为一谈，认为声呐也能诊断人体疾病。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S4.md
- id: concept:物理:声强级
  type: Concept
  subject: 物理
  title: 声强级
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将分贝当成频率单位，误以为50dB等于50Hz
    - 能指出并纠正这一错误：认为0dB表示没有声音，实则指人耳刚能听到的最弱声音
  aliases:
    - 声级
  category: 物理概念
  explanation: 用来客观描述声音强弱的物理量，单位是分贝（dB）。0dB是人耳刚好能听到的声音，90dB以上会对听力造成损伤。
  misconceptions:
    - 将分贝当成频率单位，误以为50dB等于50Hz
    - 认为0dB表示没有声音，实则指人耳刚能听到的最弱声音
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S3.md
- id: concept:物理:声波
  type: Concept
  subject: 物理
  title: 声波
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把声波想象成像水波一样上下起伏的横波，误以为声波是沿垂直于传播方向振动的
    - 能指出并纠正这一错误：误认为声波在真空中也能传播，因为波不需要介质，其实声波必须依靠介质
  aliases:
    - sound wave
  category: 物理概念
  explanation: 声音是一种波，称为声波，它通过介质的疏密变化传播，能传递能量。
  misconceptions:
    - 把声波想象成像水波一样上下起伏的横波，误以为声波是沿垂直于传播方向振动的
    - 误认为声波在真空中也能传播，因为波不需要介质，其实声波必须依靠介质
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:声波具有能量
  type: Concept
  subject: 物理
  title: 声波具有能量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为声波传递能量必须被耳朵听到，听不到的声音就没有能量，如超声波清洗机未听见声波却仍能清洗
    - 能指出并纠正这一错误：把声音传递能量与声音传递信息混淆，如认为“听到雷声”只说明信息，不说明能量
  aliases: []
  category: 物理性质
  explanation: 声波能够传递能量，例如音箱前的烛焰会晃动，人耳听到声音也是因为声波传递能量。
  misconceptions:
    - 误认为声波传递能量必须被耳朵听到，听不到的声音就没有能量，如超声波清洗机未听见声波却仍能清洗
    - 把声音传递能量与声音传递信息混淆，如认为“听到雷声”只说明信息，不说明能量
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:声源
  type: Concept
  subject: 物理
  title: 声源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把回声当成声源，认为正在发声的物体之外还有独立存在的“回声源”
    - 能指出并纠正这一错误：误以为只有固体振动才能发声，忽略液体和气体也能作为声源，如流水声、风声
  aliases: []
  category: 物理概念
  explanation: 正在发声的物体叫作声源。固体、液体、气体都能发声，都可以成为声源。
  misconceptions:
    - 误把回声当成声源，认为正在发声的物体之外还有独立存在的“回声源”
    - 误以为只有固体振动才能发声，忽略液体和气体也能作为声源，如流水声、风声
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S3.md
- id: concept:物理:声现象
  type: Concept
  subject: 物理
  title: 声现象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为声音可以在真空中传播，例如太空中的爆炸能直接听到
    - 能指出并纠正这一错误：误认为声音传播速度与光速相同，或比光速更快
  aliases: []
  category: 物理现象
  explanation: 本章主题，涉及声音的产生、传播等物理现象。
  misconceptions:
    - 误认为声音可以在真空中传播，例如太空中的爆炸能直接听到
    - 误认为声音传播速度与光速相同，或比光速更快
    - 误认为物体只要振动就一定能听到声音，忽略没有介质或距离太远
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:声速
  type: Concept
  subject: 物理
  title: 声速
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为声速在任何情况下都是340m/s，忽略温度、介质种类的影响，如冬天比夏天声速小
    - 能指出并纠正这一错误：比较固体、液体、气体中声速时，误以为液体一定比气体慢，忽略水中比空气中快得多
  aliases: []
  category: 物理概念
  explanation: 声波在不同介质中传播的速度不同，通常空气中约340m/s，水中约1500m/s，钢铁中约5200m/s。
  misconceptions:
    - 误认为声速在任何情况下都是340m/s，忽略温度、介质种类的影响，如冬天比夏天声速小
    - 比较固体、液体、气体中声速时，误以为液体一定比气体慢，忽略水中比空气中快得多
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:声音不能在真空中传播
  type: Concept
  subject: 物理
  title: 声音不能在真空中传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为声音能在真空中传播，混淆了光传播不需要介质与声音传播需要介质
    - 能指出并纠正这一错误：将“真空不能传声”理解为“真空不能产生振动”，其实物体在真空中也能振动，只是听不见
  aliases: []
  category: 物理规律
  explanation: 声音传播需要介质，真空不能传声。
  misconceptions:
    - 误以为声音能在真空中传播，混淆了光传播不需要介质与声音传播需要介质
    - 将“真空不能传声”理解为“真空不能产生振动”，其实物体在真空中也能振动，只是听不见
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S5.md
- id: concept:物理:声音的三要素
  type: Concept
  subject: 物理
  title: 声音的三要素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为三要素是响度、音量、音调，漏掉音色
    - 能指出并纠正这一错误：认为音调高则响度一定大，三要素相互决定
  aliases:
    - 声音三要素
  category: 物理概念
  explanation: 响度、音调和音色是描述声音特性的三个基本要素，称为声音的三要素。
  misconceptions:
    - 认为三要素是响度、音量、音调，漏掉音色
    - 认为音调高则响度一定大，三要素相互决定
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:声音的产生
  type: Concept
  subject: 物理
  title: 声音的产生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为敲击桌子后声音是由桌子的上下运动产生的，忽略桌子整体平移不等于振动，只有往复运动才能发声
    - 能指出并纠正这一错误：误认为物体发生位置变化一定发声，如抛出的篮球在空中运动却没有声音
  aliases: []
  category: 物理规律
  explanation: 声音是由物体振动产生的。
  misconceptions:
    - 误认为敲击桌子后声音是由桌子的上下运动产生的，忽略桌子整体平移不等于振动，只有往复运动才能发声
    - 误认为物体发生位置变化一定发声，如抛出的篮球在空中运动却没有声音
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S5.md
- id: concept:物理:声音的传播
  type: Concept
  subject: 物理
  title: 声音的传播
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为声音传播速度与频率有关，高音传播比低音快，实际同一介质中声速基本相同
    - 能指出并纠正这一错误：误认为声音只能沿直线传播，忽略声波遇到障碍物会反射、衍射，如隔墙能听到声音
  aliases: []
  category: 物理规律
  explanation: 声音传播需要介质，不能在真空中传播。
  misconceptions:
    - 误认为声音传播速度与频率有关，高音传播比低音快，实际同一介质中声速基本相同
    - 误认为声音只能沿直线传播，忽略声波遇到障碍物会反射、衍射，如隔墙能听到声音
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:大气压与海拔高度的关系
  type: Concept
  subject: 物理
  title: 大气压与海拔高度的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为海拔越高大气压越大，因为离太阳更近或离地心更远。
    - 能指出并纠正这一错误：误以为大气压随海拔升高均匀变小，实际不是线性关系，高处变化变慢。
  aliases:
    - 大气压与海拔的关系
  category: 物理规律
  explanation: 海拔越高，大气越稀薄，大气压越小。
  misconceptions:
    - 误认为海拔越高大气压越大，因为离太阳更近或离地心更远。
    - 误以为大气压随海拔升高均匀变小，实际不是线性关系，高处变化变慢。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:大气压强
  type: Concept
  subject: 物理
  title: 大气压强
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为大气压只向下作用，物体侧面和上方不受大气压。
    - 能指出并纠正这一错误：误认为物体在密闭容器内就不受大气压强，因为大气被容器隔绝，实际容器内气体也产生压强。
  aliases:
    - 大气压
  category: 物理概念
  explanation: 大气对处在其中的物体有压强，这种压强叫作大气压强，简称大气压。
  misconceptions:
    - 误认为大气压只向下作用，物体侧面和上方不受大气压。
    - 误认为物体在密闭容器内就不受大气压强，因为大气被容器隔绝，实际容器内气体也产生压强。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:大气压的变化
  type: Concept
  subject: 物理
  title: 大气压的变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为同一地点大气压恒定不变，忽略季节、天气和气候的影响。
    - 能指出并纠正这一错误：误以为风是大气压本身造成的，而不是气压差导致的空气流动。
  aliases: []
  category: 物理现象
  explanation: 同一地点大气压随季节、天气变化，气压差引起空气流动形成风。
  misconceptions:
    - 误认为同一地点大气压恒定不变，忽略季节、天气和气候的影响。
    - 误以为风是大气压本身造成的，而不是气压差导致的空气流动。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:大气压的测量
  type: Concept
  subject: 物理
  title: 大气压的测量
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：测量时遗漏活塞与注射器壁的摩擦力，导致测得的大气压偏大。
    - 能指出并纠正这一错误：误将小桶和重物的总重力当作大气对活塞的压力，未减去活塞重力和摩擦力。
  aliases:
    - 托里拆利实验
  category: 实验方法
  explanation: 利用注射器、小桶和重物等器材，通过测量大气对活塞的压力和活塞横截面积，用p=F/S计算大气压的值。
  misconceptions:
    - 测量时遗漏活塞与注射器壁的摩擦力，导致测得的大气压偏大。
    - 误将小桶和重物的总重力当作大气对活塞的压力，未减去活塞重力和摩擦力。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:大爆炸理论
  type: Concept
  subject: 物理
  title: 大爆炸理论
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为宇宙大爆炸是像炸弹一样在空间某点炸开，实际是空间本身膨胀
    - 能指出并纠正这一错误：把宇宙膨胀理解为天体在空间中快速移动，实际是星系间的距离增大
  aliases: []
  category: 宇宙学
  explanation: 大爆炸理论认为宇宙起源于约138亿年前的一次大爆炸，宇宙不断膨胀和演化。
  misconceptions:
    - 误以为宇宙大爆炸是像炸弹一样在空间某点炸开，实际是空间本身膨胀
    - 把宇宙膨胀理解为天体在空间中快速移动，实际是星系间的距离增大
    - 认为大爆炸产生了物质和能量，实际是宇宙初始状态极高温高密，目前仍膨胀演化
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S5.md
- id: concept:物理:太阳系
  type: Concept
  subject: 物理
  title: 太阳系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为太阳系中除了太阳和行星外没有其他天体，忽略卫星、彗星、小行星
    - 能指出并纠正这一错误：把太阳系当作银河系的全部，实际太阳系只是银河系中极小部分
  aliases: []
  category: 天文学
  explanation: 太阳系是由太阳、八大行星及其卫星、彗星和小行星等组成的天体系统。
  misconceptions:
    - 误认为太阳系中除了太阳和行星外没有其他天体，忽略卫星、彗星、小行星
    - 把太阳系当作银河系的全部，实际太阳系只是银河系中极小部分
    - 认为地球是太阳系的中心，实际太阳是中心
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:太阳能
  type: Concept
  subject: 物理
  title: 太阳能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把太阳能当作二次能源，实际是一次能源。
    - 能指出并纠正这一错误：认为太阳能分布均匀，忽略地域和天气影响。
  aliases:
    - 太阳辐射能
  category: 物理概念
  explanation: 太阳辐射出的能量，分布广阔、清洁无污染，是人类未来的理想能源之一。
  misconceptions:
    - 误把太阳能当作二次能源，实际是一次能源。
    - 认为太阳能分布均匀，忽略地域和天气影响。
    - 以为太阳能取之不尽就可以无限使用，不考虑成本与存储。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:夸克
  type: Concept
  subject: 物理
  title: 夸克
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为夸克可以直接被观测到，实际是通过间接证据推断的
    - 能指出并纠正这一错误：把夸克说成是构成原子核的基本粒子，实际是构成质子和中子
  aliases: []
  category: 物理粒子
  explanation: 夸克是构成质子和中子的更小微粒，20世纪60年代提出。
  misconceptions:
    - 误以为夸克可以直接被观测到，实际是通过间接证据推断的
    - 把夸克说成是构成原子核的基本粒子，实际是构成质子和中子
    - 认为夸克只有一种，实际有上夸克、下夸克等多种
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:宇宙
  type: Concept
  subject: 物理
  title: 宇宙
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为宇宙是永恒存在、无始无终的，实际有起源且不断膨胀演化
    - 能指出并纠正这一错误：认为宇宙就是太阳系或银河系，实际宇宙包含所有天体系统
  aliases: []
  category: 天文学
  explanation: 宇宙是物质、能量、时间、空间的总称，是一个有层次的天体结构系统，有起源且不断膨胀演化。
  misconceptions:
    - 误认为宇宙是永恒存在、无始无终的，实际有起源且不断膨胀演化
    - 认为宇宙就是太阳系或银河系，实际宇宙包含所有天体系统
    - 忽略宇宙包含时间和空间，只说宇宙是物质和能量的总和
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:宇宙结构层次
  type: Concept
  subject: 物理
  title: 宇宙结构层次
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把宇宙结构层次弄反，误以为恒星比星系大，实际星系包含恒星
    - 能指出并纠正这一错误：误认为宇宙结构层次是行星→恒星→星系→星系团，但漏掉了更高层次如超星系团
  aliases: []
  category: 天文学
  explanation: 宇宙是一个有层次的天体结构系统，包括行星、恒星、星系、星系团等。
  misconceptions:
    - 把宇宙结构层次弄反，误以为恒星比星系大，实际星系包含恒星
    - 误认为宇宙结构层次是行星→恒星→星系→星系团，但漏掉了更高层次如超星系团
    - 认为所有星星都在同一层次，实际有行星、恒星、星系等不同级别
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:安全电压
  type: Concept
  subject: 物理
  title: 安全电压
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为在任何环境（包括潮湿）下不高于36V都绝对安全
    - 能指出并纠正这一错误：把安全电压和安全电流混为一谈，将36V当成电流值
  aliases:
    - 安全特低电压
  category: 安全用电
  explanation: 对人体不构成危险的电压，一般不高于36V。
  misconceptions:
    - 误认为在任何环境（包括潮湿）下不高于36V都绝对安全
    - 把安全电压和安全电流混为一谈，将36V当成电流值
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:安培定则
  type: Concept
  subject: 物理
  title: 安培定则
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用左手握螺线管判断N极，将安培定则与左手定则混淆
    - 能指出并纠正这一错误：误将拇指所指方向当成电流方向，导致极性判断相反
  aliases:
    - 右手螺旋定则
  category: 物理规律
  explanation: 用右手握住螺线管，让弯曲的四指所指方向与电流方向一致，则拇指所指端为N极，用于判断通电螺线管的极性。
  misconceptions:
    - 用左手握螺线管判断N极，将安培定则与左手定则混淆
    - 误将拇指所指方向当成电流方向，导致极性判断相反
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S2.md
- id: concept:物理:定滑轮
  type: Concept
  subject: 物理
  title: 定滑轮
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为定滑轮能省力，实际上它不省力只能改变方向
    - 能指出并纠正这一错误：误认为定滑轮的实质是省力杠杆，实际是等臂杠杆
  aliases: []
  category: 简单机械
  explanation: 轴固定不动的滑轮，实质是等臂杠杆，不能省力但能改变施力方向。
  misconceptions:
    - 误认为定滑轮能省力，实际上它不省力只能改变方向
    - 误认为定滑轮的实质是省力杠杆，实际是等臂杠杆
    - 使用定滑轮时，拉力大小等于物重，但误以为拉力可以无限小（忽略摩擦）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:实像
  type: Concept
  subject: 物理
  title: 实像
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为实像一定是倒立缩小的，忽略放大和等大的实像
    - 能指出并纠正这一错误：误以为虚像无法用眼睛看到，其实虚像可以通过透镜看到
  aliases: []
  category: 物理概念
  explanation: 由实际光线会聚形成的像，能在光屏上呈现。
  misconceptions:
    - 认为实像一定是倒立缩小的，忽略放大和等大的实像
    - 误以为虚像无法用眼睛看到，其实虚像可以通过透镜看到
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:实际功率
  type: Concept
  subject: 物理
  title: 实际功率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为实际功率总是等于额定功率，与实际电压无关
    - 能指出并纠正这一错误：认为实际电压高于额定电压时实际功率一定小于额定功率
  aliases: []
  category: 物理概念
  explanation: 用电器在实际电压下工作时的电功率叫做实际功率，实际功率可能大于、小于或等于额定功率。
  misconceptions:
    - 误以为实际功率总是等于额定功率，与实际电压无关
    - 认为实际电压高于额定电压时实际功率一定小于额定功率
    - 把额定功率当成实际功率，忽略实际工况影响
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:家庭电路
  type: Concept
  subject: 物理
  title: 家庭电路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为家庭电路中各用电器是串联连接的
    - 能指出并纠正这一错误：认为电能表应安装在总开关之后，实际应在进户线后首先接入
  aliases:
    - 家庭用电电路
  category: 电路知识
  explanation: 家庭用电的电路系统，包括进户线、电能表、配电箱、插座、用电器等，采用并联连接。
  misconceptions:
    - 误以为家庭电路中各用电器是串联连接的
    - 认为电能表应安装在总开关之后，实际应在进户线后首先接入
    - 误认为家庭电路电压有时为380V
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:家庭电路的组成
  type: Concept
  subject: 物理
  title: 家庭电路的组成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为插座与灯泡在家庭电路中是串联的
    - 能指出并纠正这一错误：认为保险丝应接在零线上，断开时更安全
  aliases: []
  category: 物理知识
  explanation: 家庭电路主要包括进户线、电能表、配电箱、插座、用电器等，火线和零线间电压为220V，用电器并联。
  misconceptions:
    - 误以为插座与灯泡在家庭电路中是串联的
    - 认为保险丝应接在零线上，断开时更安全
    - 误把火线和零线之间的电压说成380V
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:密度
  type: Concept
  subject: 物理
  title: 密度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为同种物质的密度与质量成正比，与体积成反比，如说密度随质量增大而增大
    - 能指出并纠正这一错误：忽视温度影响，认为水在4℃时密度和别的温度完全一样
  aliases: []
  category: 物理概念
  explanation: 某种物质的物体，其质量与体积之比叫作这种物质的密度，公式为ρ=m/V，单位有kg/m³和g/cm³。
  misconceptions:
    - 认为同种物质的密度与质量成正比，与体积成反比，如说密度随质量增大而增大
    - 忽视温度影响，认为水在4℃时密度和别的温度完全一样
    - 密度单位换算随手写，把1g/cm³当作1kg/m³
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:密度公式
  type: Concept
  subject: 物理
  title: 密度公式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：直接用质量kg和体积cm³代入公式计算，忘了统一单位
    - 能指出并纠正这一错误：求体积时错误变形为V=mρ，比如要算体积却乘了密度
  aliases: []
  category: 物理公式
  explanation: 密度公式ρ=m/V，可变形为m=ρV和V=m/ρ，用于计算质量、体积或密度。
  misconceptions:
    - 直接用质量kg和体积cm³代入公式计算，忘了统一单位
    - 求体积时错误变形为V=mρ，比如要算体积却乘了密度
    - 认为密度公式只适用于实心规则物体，空心物体不能用
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:密度单位换算
  type: Concept
  subject: 物理
  title: 密度单位换算
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把1g/cm³和1kg/m³当成相等，导致换算错误
    - 能指出并纠正这一错误：把水的密度记成1×10³g/cm³，数字和单位不匹配
  aliases: []
  category: 物理单位
  explanation: 密度的常用单位有kg/m³和g/cm³，换算关系为1g/cm³=1×10³kg/m³。
  misconceptions:
    - 把1g/cm³和1kg/m³当成相等，导致换算错误
    - 把水的密度记成1×10³g/cm³，数字和单位不匹配
    - 换算时只改数字不改单位，写1g/cm³=1000kg/m³，误以为数值一样
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:密度知识的应用
  type: Concept
  subject: 物理
  title: 密度知识的应用
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：认为密度越大物体越重，忽略了体积因素
    - 能指出并纠正这一错误：用密度鉴别物质时忽略温度、状态影响，得出错误结论
  aliases: []
  category: 物理应用
  explanation: 密度可用于鉴别物质、检验样品是否合格、间接测量物体的质量或体积。
  misconceptions:
    - 认为密度越大物体越重，忽略了体积因素
    - 用密度鉴别物质时忽略温度、状态影响，得出错误结论
    - 认为密度只能测质量或体积，无法鉴别样品是否空心
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:导体
  type: Concept
  subject: 物理
  title: 导体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为酸、碱、盐的水溶液不导电，因为它们不是金属
    - 能指出并纠正这一错误：误以为导体永远容易导电，忽略温度变化会改变导电性能
  aliases: []
  category: 物理概念
  explanation: 容易导电的物体称为导体，如金属、石墨、人体、大地及酸、碱、盐的水溶液等。
  misconceptions:
    - 误认为酸、碱、盐的水溶液不导电，因为它们不是金属
    - 误以为导体永远容易导电，忽略温度变化会改变导电性能
    - 将石墨误认为绝缘体，因为颜色黑，实际石墨是导体
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:导体和绝缘体
  type: Concept
  subject: 物理
  title: 导体和绝缘体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为导体和绝缘体有绝对界限，如干木头是绝缘体但湿木头能导电
    - 能指出并纠正这一错误：误以为绝缘体不能带电，实际摩擦起电后绝缘体也能带电荷
  aliases: []
  category: 物理概念
  explanation: 容易导电的物体叫导体，如金属、石墨、人体等；不容易导电的物体叫绝缘体，如橡胶、玻璃、塑料等。导体和绝缘体之间没有绝对界限。
  misconceptions:
    - 误认为导体和绝缘体有绝对界限，如干木头是绝缘体但湿木头能导电
    - 误以为绝缘体不能带电，实际摩擦起电后绝缘体也能带电荷
    - 误以为纯净水是导体，实际纯净水几乎不导电，电解质溶液才导电
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:导热性
  type: Concept
  subject: 物理
  title: 导热性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有非金属都不导热，像木头、塑料就一点不导热
    - 能指出并纠正这一错误：把导热性当成物体本身的温度，说铁的导热性好所以铁温度高
  aliases: []
  category: 物理属性
  explanation: 导热性是物质传导热量的能力，金属导热性好，塑料导热性差。
  misconceptions:
    - 认为所有非金属都不导热，像木头、塑料就一点不导热
    - 把导热性当成物体本身的温度，说铁的导热性好所以铁温度高
    - 认为金属导热性好，所以金属温度一定比非金属高
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:导电性
  type: Concept
  subject: 物理
  title: 导电性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为绝缘体绝对不导电，没有条件限制
    - 能指出并纠正这一错误：以为半导体导电能力介于导体和绝缘体之间，但认为它一定不导电
  aliases: []
  category: 物理属性
  explanation: 导电性是物质传导电流的能力，半导体具有特殊导电性能。
  misconceptions:
    - 认为绝缘体绝对不导电，没有条件限制
    - 以为半导体导电能力介于导体和绝缘体之间，但认为它一定不导电
    - 把导电性和导磁性混为一谈，认为能导电的物质一定容易被磁化
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:小孔成像
  type: Concept
  subject: 物理
  title: 小孔成像
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为小孔成像所成的像是正立的，实际是倒立的实像。
    - 能指出并纠正这一错误：认为像的形状由小孔形状决定，如方形小孔会成方形像，实际像的形状与物体相同。
  aliases: []
  category: 物理现象
  explanation: 光通过小孔后形成倒立的实像，证明了光沿直线传播的特性。中国古代《墨经》和《梦溪笔谈》均有记载。
  misconceptions:
    - 认为小孔成像所成的像是正立的，实际是倒立的实像。
    - 认为像的形状由小孔形状决定，如方形小孔会成方形像，实际像的形状与物体相同。
    - 认为小孔成像的像是虚像，实际是光屏上可以接收的实像。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:干电池
  type: Concept
  subject: 物理
  title: 干电池
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为干电池用完后可以充电继续使用（干电池不可重复使用）
    - 能指出并纠正这一错误：误认为干电池是交流电源（干电池只提供直流电）
  aliases:
    - 锌锰干电池
  category: 物理概念
  explanation: 干电池是一种直流电源，常见的有普通锌锰干电池和碱性锌锰干电池，其优点是价格便宜、适用范围广，缺点是使用寿命较短、不可重复使用。
  misconceptions:
    - 误以为干电池用完后可以充电继续使用（干电池不可重复使用）
    - 误认为干电池是交流电源（干电池只提供直流电）
    - 认为干电池的正负极没有区分，接反了也能正常工作（多数电路接反不工作或损坏）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:干路
  type: Concept
  subject: 物理
  title: 干路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把支路当成干路（干路是各支路共用的那部分电路）
    - 能指出并纠正这一错误：认为干路只指电源正负极之间的导线，不包括共用的开关和用电器
  aliases: []
  category: 物理概念
  explanation: 并联电路中各元件共用的那部分电路称为干路。
  misconceptions:
    - 误把支路当成干路（干路是各支路共用的那部分电路）
    - 认为干路只指电源正负极之间的导线，不包括共用的开关和用电器
    - 误认为干路电流与各支路电流相等（干路电流应等于各支路电流之和）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:平均速度
  type: Concept
  subject: 物理
  title: 平均速度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：求平均速度时用各时刻速度相加除以时间，而不是总路程除以总时间。
    - 能指出并纠正这一错误：计算平均速度时忽略中途停车时间，总时间只算运动的时间。
  aliases: []
  category: 物理概念
  explanation: 用速度公式求得的速度，只能粗略反映物体运动的快慢。
  misconceptions:
    - 求平均速度时用各时刻速度相加除以时间，而不是总路程除以总时间。
    - 计算平均速度时忽略中途停车时间，总时间只算运动的时间。
    - 认为平均速度能准确描述物体每个时刻的快慢，实际只能粗略反映。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:平行光
  type: Concept
  subject: 物理
  title: 平行光
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为从点光源发出的光是平行光，因为光是沿直线传播的，实际点光源向四周发射。
    - 能指出并纠正这一错误：认为平行光一定是水平方向的，竖直或斜向的光不是平行光，实际平行光指方向相同。
  aliases: []
  category: 物理概念
  explanation: 从远处光源（如太阳）发出的光可近似看成平行光，用平行光线表示。
  misconceptions:
    - 认为从点光源发出的光是平行光，因为光是沿直线传播的，实际点光源向四周发射。
    - 认为平行光一定是水平方向的，竖直或斜向的光不是平行光，实际平行光指方向相同。
    - 认为只有太阳光才能近似看成平行光，其他光源发出的光永远不是平行光。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:平衡状态
  type: Concept
  subject: 物理
  title: 平衡状态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为速度为零就是平衡状态，如竖直上抛到最高点速度为零但合力不为零。
    - 能指出并纠正这一错误：认为速度大小不变就是平衡状态，如匀速圆周运动是平衡状态。
  aliases: []
  category: 概念
  explanation: 物体保持静止或做匀速直线运动的状态。
  misconceptions:
    - 认为速度为零就是平衡状态，如竖直上抛到最高点速度为零但合力不为零。
    - 认为速度大小不变就是平衡状态，如匀速圆周运动是平衡状态。
    - 认为只有静止才算平衡，匀速直线运动不算。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:平面镜
  type: Concept
  subject: 物理
  title: 平面镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有玻璃制成的镜子才是平面镜，金属平板反射面不是平面镜
    - 能指出并纠正这一错误：认为平面镜成像是由于光的折射产生的
  aliases:
    - 平面镜
  category: 物理概念
  explanation: 表面是平的镜子，能成像。
  misconceptions:
    - 认为只有玻璃制成的镜子才是平面镜，金属平板反射面不是平面镜
    - 认为平面镜成像是由于光的折射产生的
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S3.md
- id: concept:物理:平面镜成像特点
  type: Concept
  subject: 物理
  title: 平面镜成像特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为物体远离平面镜时像变小，靠近时像变大
    - 能指出并纠正这一错误：认为像是实像，能用光屏承接
  aliases:
    - 平面镜成像规律
  category: 物理规律
  explanation: 平面镜所成的像是虚像，像与物大小相等，像到镜面的距离等于物到镜面的距离，像与物关于镜面对称。
  misconceptions:
    - 认为物体远离平面镜时像变小，靠近时像变大
    - 认为像是实像，能用光屏承接
    - 认为平面镜所成的像上下颠倒，实际是左右颠倒
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:并联电路
  type: Concept
  subject: 物理
  title: 并联电路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为并联电路中一条支路断开，其他支路也停止工作（各支路独立工作）
    - 能指出并纠正这一错误：把两个灯泡首尾顺次相连说成并联（那是串联）
  aliases:
    - parallel circuit
  category: 物理概念
  explanation: 把电路元件并列连接起来组成的电路称为并联电路，各元件共用部分为干路，分支部分为支路。
  misconceptions:
    - 误以为并联电路中一条支路断开，其他支路也停止工作（各支路独立工作）
    - 把两个灯泡首尾顺次相连说成并联（那是串联）
    - 误认为并联电路中各支路用电器两端电压一定大于电源电压（实际相等）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S2.md
- id: concept:物理:并联电路电压特点
  type: Concept
  subject: 物理
  title: 并联电路电压特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为并联电路中各支路电压之和等于总电压（实际各支路电压相等）
    - 能指出并纠正这一错误：认为支路电阻越大，分得的电压越大（并联各支路电压均等于电源电压）
  aliases:
    - 并联各支路电压相等
  category: 物理规律
  explanation: 在并联电路中，电路两端的总电压与各支路两端的电压相等。
  misconceptions:
    - 误以为并联电路中各支路电压之和等于总电压（实际各支路电压相等）
    - 认为支路电阻越大，分得的电压越大（并联各支路电压均等于电源电压）
    - 误认为并联用电器越多，每个用电器两端电压就越低（理想情况下各支路电压仍相等）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:并联电路电流特点
  type: Concept
  subject: 物理
  title: 并联电路电流特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为并联电路中各支路电流一定相等（各支路电阻不同时电流不同）
    - 能指出并纠正这一错误：误认为干路电流等于各支路电流的平均值（应等于各支路电流之和）
  aliases:
    - 并联分流
  category: 物理规律
  explanation: 在并联电路中，干路电流等于各支路电流之和。
  misconceptions:
    - 误以为并联电路中各支路电流一定相等（各支路电阻不同时电流不同）
    - 误认为干路电流等于各支路电流的平均值（应等于各支路电流之和）
    - 认为支路越多，干路电流越小（并联总电阻变小，干路电流增大）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:幻日
  type: Concept
  subject: 物理
  title: 幻日
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为幻日是由凸透镜成像产生的，实际是冰晶折射反射
    - 能指出并纠正这一错误：误以为幻日是太阳的实像，能在光屏上呈现
  aliases:
    - 三日同辉
  category: 自然现象
  explanation: 太阳两侧出现明亮光斑，看起来像三个太阳，由冰晶折射反射形成。
  misconceptions:
    - 认为幻日是由凸透镜成像产生的，实际是冰晶折射反射
    - 误以为幻日是太阳的实像，能在光屏上呈现
    - 认为幻日出现在太阳下方，实际在太阳两侧
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:延展性
  type: Concept
  subject: 物理
  title: 延展性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有金属延展性都一样好，如铁和金银延展性相同
    - 能指出并纠正这一错误：把延展性等同于硬度，认为越硬延展性越好
  aliases: []
  category: 物理属性
  explanation: 延展性是物质在外力作用下能延伸成丝或展成薄片的性质，金、银延展性好。
  misconceptions:
    - 认为所有金属延展性都一样好，如铁和金银延展性相同
    - 把延展性等同于硬度，认为越硬延展性越好
    - 认为延展性好的物质不能拉成丝，只能展成片，分开理解
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S2.md
- id: concept:物理:弹力
  type: Concept
  subject: 物理
  title: 弹力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有弹簧和橡皮筋才有弹力，其他物体形变不产生弹力
    - 能指出并纠正这一错误：把弹力方向想成总竖直向上，忽视弹力要恢复原状的方向
  aliases: []
  category: 物理概念
  explanation: 形变物体力图恢复原状而对另一个物体产生的力叫弹力。
  misconceptions:
    - 认为只有弹簧和橡皮筋才有弹力，其他物体形变不产生弹力
    - 把弹力方向想成总竖直向上，忽视弹力要恢复原状的方向
    - 认为只要形变就一定有弹力，塑性形变也能恢复原状并产生弹力
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:弹性势能
  type: Concept
  subject: 物理
  title: 弹性势能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要物体发生形变就具有弹性势能，如把橡皮泥压扁后也有弹性势能。
    - 能指出并纠正这一错误：认为弹簧被压缩时没有弹性势能，只有被拉长才有。
  aliases: []
  category: 物理概念
  explanation: 发生弹性形变的物体具有的能量，如被拉开的弓、被压缩的弹簧。
  misconceptions:
    - 认为只要物体发生形变就具有弹性势能，如把橡皮泥压扁后也有弹性势能。
    - 认为弹簧被压缩时没有弹性势能，只有被拉长才有。
    - 认为弹性势能只与形变大小有关，忽略材料的影响。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:归纳法
  type: Concept
  subject: 物理
  title: 归纳法
  conceptType: 推理型
  masteryCriteria:
    - 能指出并纠正这一错误：通过一次实验就归纳出结论，没有多次实验排除偶然性。
    - 能指出并纠正这一错误：认为归纳出的结论一定正确，不需要再验证。
  aliases: []
  category: 方法
  explanation: 从经验事实中找出共同特征，概括出一般性原理或结论的思维方法。
  misconceptions:
    - 通过一次实验就归纳出结论，没有多次实验排除偶然性。
    - 认为归纳出的结论一定正确，不需要再验证。
    - 把个别现象直接当普遍规律，如看到一个铜块沉水就认为所有金属都沉水。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:形变
  type: Concept
  subject: 物理
  title: 形变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有弹性形变才算形变，塑性形变不是形变
    - 能指出并纠正这一错误：眼睛看不到微小形变就认为物体没有发生形变
  aliases: []
  category: 物理概念
  explanation: 物体形状的改变称为形变，撤去外力后能恢复原状的形变叫弹性形变。
  misconceptions:
    - 认为只有弹性形变才算形变，塑性形变不是形变
    - 眼睛看不到微小形变就认为物体没有发生形变
    - 把形变等同于碎裂，说没断掉就没有形变
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:影响压力作用效果的因素
  type: Concept
  subject: 物理
  title: 影响压力作用效果的因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为受力面积越大，压力作用效果越明显，实际相反。
    - 能指出并纠正这一错误：认为压力作用效果只由压力大小决定，忽略受力面积。
  aliases: []
  category: 物理规律
  explanation: 压力的作用效果与压力大小和受力面积有关：受力面积相同时，压力越大，效果越明显；压力相同时，受力面积越小，效果越明显。
  misconceptions:
    - 认为受力面积越大，压力作用效果越明显，实际相反。
    - 认为压力作用效果只由压力大小决定，忽略受力面积。
    - 比较效果时未控制变量，如压力和面积都不同就直接下结论。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:影响导体电阻大小的因素
  type: Concept
  subject: 物理
  title: 影响导体电阻大小的因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为电阻随电压增大而增大，随电流增大而减小（电阻是导体本身属性）
    - 能指出并纠正这一错误：认为同材料同粗细的导线越长电阻越小（越长电阻越大）
  aliases:
    - 电阻定律
    - 影响电阻大小的因素
  category: 物理规律
  explanation: 导体的电阻与导体的材料、长度、横截面积和温度有关。
  misconceptions:
    - 误认为电阻随电压增大而增大，随电流增大而减小（电阻是导体本身属性）
    - 认为同材料同粗细的导线越长电阻越小（越长电阻越大）
    - 误认为导线横截面积越大电阻越大（横截面积越大电阻越小）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:影响滑动摩擦力大小的因素
  type: Concept
  subject: 物理
  title: 影响滑动摩擦力大小的因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为滑动摩擦力大小与接触面积有关，面积越大摩擦力越大。
    - 能指出并纠正这一错误：认为滑动摩擦力大小与运动速度有关，速度越快摩擦力越大。
  aliases: []
  category: 物理规律
  explanation: 滑动摩擦力的大小与接触面的粗糙程度和压力大小有关，接触面越粗糙、压力越大，摩擦力越大。
  misconceptions:
    - 认为滑动摩擦力大小与接触面积有关，面积越大摩擦力越大。
    - 认为滑动摩擦力大小与运动速度有关，速度越快摩擦力越大。
    - 认为压力一定等于重力，如斜面上物体对斜面压力小于重力。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:影子长度的影响因素
  type: Concept
  subject: 物理
  title: 影子长度的影响因素
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为影子长度只由物体高度决定，与光源位置和角度无关
    - 能指出并纠正这一错误：误认为光源离物体越近影子一定越短，没有考虑光照角度变化
  aliases:
    - 影子的影响因素
  category: 物理现象
  explanation: 影子长度与物体到光源的距离、物体到影子落点的距离以及灯光照射的角度有关。
  misconceptions:
    - 误认为影子长度只由物体高度决定，与光源位置和角度无关
    - 误认为光源离物体越近影子一定越短，没有考虑光照角度变化
    - 误认为影子长度与物体到影子的距离总是成正比，忽视光源角度影响
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:恒星
  type: Concept
  subject: 物理
  title: 恒星
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为恒星是静止不动的，实际恒星相对地球也在运动
    - 能指出并纠正这一错误：认为太阳不是恒星，因为太阳看起来不是星点，实际太阳就是恒星
  aliases: []
  category: 天文学
  explanation: 恒星是自身能发光的球状天体，太阳就是一颗恒星，恒星实际上也在运动。
  misconceptions:
    - 误以为恒星是静止不动的，实际恒星相对地球也在运动
    - 认为太阳不是恒星，因为太阳看起来不是星点，实际太阳就是恒星
    - 以为只有夜晚能看到恒星，白昼太阳也是恒星
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S5.md
- id: concept:物理:惯性
  type: Concept
  subject: 物理
  title: 惯性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为速度越大惯性越大，实际上惯性只与质量有关。
    - 能指出并纠正这一错误：认为静止物体没有惯性，运动物体才有惯性。
  aliases: []
  category: 物理概念
  explanation: 物体保持原来运动状态不变的性质叫做惯性，一切物体都有惯性。
  misconceptions:
    - 认为速度越大惯性越大，实际上惯性只与质量有关。
    - 认为静止物体没有惯性，运动物体才有惯性。
    - 将惯性当作力，说“受到惯性作用”，实际上惯性是性质。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:感应电流
  type: Concept
  subject: 物理
  title: 感应电流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为感应电流是磁铁本身产生的电流，而非导体中产生的
    - 能指出并纠正这一错误：认为导体运动越快，感应电流不一定越大，忽略了速度的影响
  aliases: []
  category: 物理概念
  explanation: 电磁感应产生的电流称为感应电流。
  misconceptions:
    - 认为感应电流是磁铁本身产生的电流，而非导体中产生的
    - 认为导体运动越快，感应电流不一定越大，忽略了速度的影响
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:感应电流的方向
  type: Concept
  subject: 物理
  title: 感应电流的方向
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为感应电流的方向只由磁场方向决定，与导体运动方向无关
    - 能指出并纠正这一错误：认为导体切割方向改变时感应电流方向不变
  aliases: []
  category: 物理规律
  explanation: 感应电流的方向与磁场方向和导体运动方向有关。
  misconceptions:
    - 认为感应电流的方向只由磁场方向决定，与导体运动方向无关
    - 认为导体切割方向改变时感应电流方向不变
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S4.md
- id: concept:物理:托盘天平的使用
  type: Concept
  subject: 物理
  title: 托盘天平的使用
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：测量前游码未归零就开始调平衡螺母，导致测量起点错误
    - 能指出并纠正这一错误：读数时忘记加游码示数，或把游码按左端刻度来读
  aliases:
    - 天平使用
  category: 实验技能
  explanation: 使用托盘天平测量质量时，需水平放置、游码归零、调节平衡螺母使横梁平衡，左物右码，读数时砝码质量加游码示数。
  misconceptions:
    - 测量前游码未归零就开始调平衡螺母，导致测量起点错误
    - 读数时忘记加游码示数，或把游码按左端刻度来读
    - 称量时物体与砝码放反，仍用砝码加游码，结果偏大
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:托里拆利实验
  type: Concept
  subject: 物理
  title: 托里拆利实验
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为玻璃管倾斜时水银柱高度变高，实际竖直高度不变，只是水银柱长度变长。
    - 能指出并纠正这一错误：误认为玻璃管粗细影响水银柱高度，实际高度与管的横截面积无关。
  aliases: []
  category: 物理实验
  explanation: 托里拆利利用水银柱测量大气压，测得大气压相当于76cm水银柱产生的压强，约1.0×10⁵Pa。
  misconceptions:
    - 误认为玻璃管倾斜时水银柱高度变高，实际竖直高度不变，只是水银柱长度变长。
    - 误认为玻璃管粗细影响水银柱高度，实际高度与管的横截面积无关。
    - 误认为水银柱高度一定是76cm，忽略外界大气压会变化。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:折射角
  type: Concept
  subject: 物理
  title: 折射角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把折射角误认为折射光线与界面之间的夹角，正确应为与法线夹角。
    - 能指出并纠正这一错误：误以为折射角一定小于入射角，忽略了光从水到空气时折射角大于入射角。
  aliases: []
  category: 物理概念
  explanation: 折射光线与法线的夹角。
  misconceptions:
    - 把折射角误认为折射光线与界面之间的夹角，正确应为与法线夹角。
    - 误以为折射角一定小于入射角，忽略了光从水到空气时折射角大于入射角。
    - 计算时把入射光线与界面的夹角当成入射角，导致与折射角大小关系判断错误。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:指南针
  type: Concept
  subject: 物理
  title: 指南针
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为指南针N极指向地理南极，S极指向地理北极
    - 能指出并纠正这一错误：认为指南针在任何地方都指向地理正北，忽略磁偏角
  aliases:
    - 司南
  category: 物理史实
  explanation: 我国古代四大发明之一，利用磁体指示方向，最早记载见于《韩非子·有度》，北宋沈括在《梦溪笔谈》中记载了指南针的制作方法。
  misconceptions:
    - 认为指南针N极指向地理南极，S极指向地理北极
    - 认为指南针在任何地方都指向地理正北，忽略磁偏角
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:振动
  type: Concept
  subject: 物理
  title: 振动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为振动就是任意运动，如单方向的匀速直线运动也算振动，忽略“经过中心位置往复”这一条件
    - 能指出并纠正这一错误：误认为物体振动时一定会发出人耳可听见的声音，忽略了振动频率不在人耳听觉范围内
  aliases: []
  category: 物理概念
  explanation: 物体经过一个中心位置所做的往复运动，叫作振动。声音是由物体振动产生的。
  misconceptions:
    - 误认为振动就是任意运动，如单方向的匀速直线运动也算振动，忽略“经过中心位置往复”这一条件
    - 误认为物体振动时一定会发出人耳可听见的声音，忽略了振动频率不在人耳听觉范围内
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S5.md
- id: concept:物理:振幅
  type: Concept
  subject: 物理
  title: 振幅
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为振幅是每秒振动的次数，单位是赫兹。
    - 能指出并纠正这一错误：认为振幅越大，音调越高，把振幅与频率混为一谈。
  aliases:
    - amplitude
  category: 物理概念
  explanation: 振动的幅度，简称振幅，是决定响度的因素之一。
  misconceptions:
    - 误以为振幅是每秒振动的次数，单位是赫兹。
    - 认为振幅越大，音调越高，把振幅与频率混为一谈。
    - 把振幅说成振动快慢，振幅大的物体振动一定快。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:换向器
  type: Concept
  subject: 物理
  title: 换向器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为换向器的作用是改变磁场方向，而不是改变线圈中的电流方向
    - 能指出并纠正这一错误：认为换向器只在启动时改变电流，线圈转动后就不起作用
  aliases: []
  category: 物理概念
  explanation: 由两个半圆铜环组成，随线圈转动，用于改变线圈中的电流方向，使线圈在磁场中持续转动。
  misconceptions:
    - 认为换向器的作用是改变磁场方向，而不是改变线圈中的电流方向
    - 认为换向器只在启动时改变电流，线圈转动后就不起作用
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S3.md
- id: concept:物理:排水法测体积
  type: Concept
  subject: 物理
  title: 排水法测体积
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：读数时视线没与量筒内液面凹槽底部相平，读出差错
    - 能指出并纠正这一错误：水装太满，物体放进去有溢出，却仍用前后体积差计算
  aliases:
    - 排水法
  category: 实验方法
  explanation: 对于不规则固体，可将其浸没在量筒的水中，通过前后体积差测量其体积。
  misconceptions:
    - 读数时视线没与量筒内液面凹槽底部相平，读出差错
    - 水装太满，物体放进去有溢出，却仍用前后体积差计算
    - 测量浮在水面的物体时直接压入水中，未考虑排水体积不准确
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:探月工程
  type: Concept
  subject: 物理
  title: 探月工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为探月工程只是一次绕月飞行，实际包括落月探测和采样返回等阶段
    - 能指出并纠正这一错误：把探月工程说成是国际合作或商业行为，实际是中国自主航天工程
  aliases:
    - 嫦娥工程
  category: 科技成就
  explanation: 探月工程是中国对月球进行探测的航天工程，包括绕月探测、落月探测和采样返回等任务。
  misconceptions:
    - 误认为探月工程只是一次绕月飞行，实际包括落月探测和采样返回等阶段
    - 把探月工程说成是国际合作或商业行为，实际是中国自主航天工程
    - 认为探月工程已全部完成，实际仍在分步实施中
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:控制变量法
  type: Concept
  subject: 物理
  title: 控制变量法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：在探究电流与电阻关系时，改变电阻后没有移动滑动变阻器，导致电压改变
    - 能指出并纠正这一错误：误以为同时改变两个因素也能得出规律，如探究电阻与温度关系时电压也变化
  aliases: []
  category: 科学方法
  explanation: 在探究多个因素对某一物理量的影响时，每次只改变一个因素，保持其他因素不变，这种方法叫控制变量法。
  misconceptions:
    - 在探究电流与电阻关系时，改变电阻后没有移动滑动变阻器，导致电压改变
    - 误以为同时改变两个因素也能得出规律，如探究电阻与温度关系时电压也变化
    - 记录数据时只改变一个量，却忽略了必须保持其他量不变，如探究电流与电压关系时忘记保持电阻不变
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:控制电路
  type: Concept
  subject: 物理
  title: 控制电路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把控制电路和受控电路看成同一闭合回路，电磁继电器只是普通开关
    - 能指出并纠正这一错误：认为控制电路中必须有人工手动开关，忽略可用传感器实现自动控制
  aliases: []
  category: 物理概念
  explanation: 控制电路是控制受控电路工作的电路，通常包含传感器和电磁继电器等元件。
  misconceptions:
    - 把控制电路和受控电路看成同一闭合回路，电磁继电器只是普通开关
    - 认为控制电路中必须有人工手动开关，忽略可用传感器实现自动控制
    - 认为电磁铁吸合时受控电路一定连通，忽略常闭触点吸合时反而断开
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:摄氏温标
  type: Concept
  subject: 物理
  title: 摄氏温标
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把冰水混合物温度在任何气压下都当0℃，忽略标准大气压条件
    - 能指出并纠正这一错误：认为0℃表示没有温度，且摄氏温度不可以为负
  aliases:
    - 摄氏度
    - 摄氏温度
  category: 温标
  explanation: 由瑞典天文学家摄尔西斯创立，规定标准大气压下冰水混合物温度为0℃，水沸腾温度为100℃，其间等分100份，每份为1℃。
  misconceptions:
    - 把冰水混合物温度在任何气压下都当0℃，忽略标准大气压条件
    - 认为0℃表示没有温度，且摄氏温度不可以为负
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:摩擦力
  type: Concept
  subject: 物理
  title: 摩擦力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为摩擦力总是阻碍物体运动，例如传送带上加速物体所受摩擦力方向与运动方向相同，并非阻碍。
    - 能指出并纠正这一错误：认为只要接触面粗糙且物体接触就一定有摩擦力，忽略还必须有相对运动或相对运动趋势。
  aliases: []
  category: 物理概念
  explanation: 两个接触面间阻碍物体相对运动的力，包括滑动摩擦力等。
  misconceptions:
    - 认为摩擦力总是阻碍物体运动，例如传送带上加速物体所受摩擦力方向与运动方向相同，并非阻碍。
    - 认为只要接触面粗糙且物体接触就一定有摩擦力，忽略还必须有相对运动或相对运动趋势。
    - 受力分析时漏掉静摩擦力，如水平推物体未动就认为不受摩擦力，实际有静摩擦力与推力平衡。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:摩擦起电
  type: Concept
  subject: 物理
  title: 摩擦起电
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为摩擦起电创造了电荷，实际是电子转移
    - 能指出并纠正这一错误：认为两个物体摩擦后带同种电荷，实际摩擦后带异种电荷
  aliases: []
  category: 物理概念
  explanation: 用摩擦的方式使物体带电，称为摩擦起电。物体带电后能吸引轻小物体。
  misconceptions:
    - 误认为摩擦起电创造了电荷，实际是电子转移
    - 认为两个物体摩擦后带同种电荷，实际摩擦后带异种电荷
    - 看见物体吸引轻小物体就认为它一定带了电，未排除静电感应等其他可能
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:摩擦起电的原因
  type: Concept
  subject: 物理
  title: 摩擦起电的原因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为摩擦起电中质子发生转移，实际转移的是电子
    - 能指出并纠正这一错误：认为失去电子的物体带负电，实际失去电子带正电
  aliases: []
  category: 物理解释
  explanation: 摩擦起电不是产生了电荷，而是电子从一个物体转移到另一个物体，失去电子的带正电，得到电子的带负电。
  misconceptions:
    - 误以为摩擦起电中质子发生转移，实际转移的是电子
    - 认为失去电子的物体带负电，实际失去电子带正电
    - 把摩擦起电说成是产生了新电荷，实际只是电荷重新分布
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S3.md
- id: concept:物理:支路
  type: Concept
  subject: 物理
  title: 支路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为支路断开后干路电流不变（支路断路会使干路电流减小）
    - 能指出并纠正这一错误：把干路中的开关误认作支路开关（干路开关控制所有用电器）
  aliases: []
  category: 物理概念
  explanation: 并联电路中每一个分支电路称为支路。
  misconceptions:
    - 误以为支路断开后干路电流不变（支路断路会使干路电流减小）
    - 把干路中的开关误认作支路开关（干路开关控制所有用电器）
    - 误认为支路就是干路中任意一段导线（支路是并联电路的分支部分）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:数学方法在物理中的应用
  type: Concept
  subject: 物理
  title: 数学方法在物理中的应用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：由欧姆定律I=U/R推出R=U/I，就误认为电阻与电压成正比，与电流成反比
    - 能指出并纠正这一错误：误将正比例函数图像中过原点的直线等同于所有物理关系，如电阻的U-I图像过原点但R不变
  aliases: []
  category: 科学方法
  explanation: 用数学公式表达物理概念和规律，并通过逻辑推演得到推论。
  misconceptions:
    - 由欧姆定律I=U/R推出R=U/I，就误认为电阻与电压成正比，与电流成反比
    - 误将正比例函数图像中过原点的直线等同于所有物理关系，如电阻的U-I图像过原点但R不变
    - 在推导串联电阻时只套用数学相加，忽略欧姆定律的适用条件
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:断路
  type: Concept
  subject: 物理
  title: 断路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为断路就是电流被短路（断路是电路断开无电流，短路是电流不经过用电器）
    - 能指出并纠正这一错误：误认为断路时电路中所有位置都没有电压（断开处两端可能等于电源电压）
  aliases:
    - 开路
  category: 物理概念
  explanation: 断开开关，电路中没有电流，用电器停止工作的状态称为断路。
  misconceptions:
    - 误以为断路就是电流被短路（断路是电路断开无电流，短路是电流不经过用电器）
    - 误认为断路时电路中所有位置都没有电压（断开处两端可能等于电源电压）
    - 认为断路一定是因为开关断开造成的（也可能是导线断裂、接触不良）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:日心说
  type: Concept
  subject: 物理
  title: 日心说
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为日心说认为太阳是宇宙中心，实际太阳是太阳系中心
    - 能指出并纠正这一错误：认为哥白尼提出日心说时已有望远镜观测证据，实际后期伽利略等支持
  aliases:
    - 哥白尼体系
  category: 天文学说
  explanation: 日心说由哥白尼提出，认为太阳是宇宙中心，行星绕太阳运动，引发天文学革命。
  misconceptions:
    - 误以为日心说认为太阳是宇宙中心，实际太阳是太阳系中心
    - 认为哥白尼提出日心说时已有望远镜观测证据，实际后期伽利略等支持
    - 把日心说说成是完全正确、毫无问题，实际还有恒星视差等限制
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:日食
  type: Concept
  subject: 物理
  title: 日食
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为日食是地球在太阳和月球之间，挡住了太阳光形成的。
    - 能指出并纠正这一错误：认为日食每月都会发生，因为月球每月都会经过太阳和地球之间。
  aliases: []
  category: 天文现象
  explanation: 月球运行到地球和太阳之间，太阳光被月球挡住，在地球上形成阴影区，导致日食，分为日全食和日偏食。
  misconceptions:
    - 认为日食是地球在太阳和月球之间，挡住了太阳光形成的。
    - 认为日食每月都会发生，因为月球每月都会经过太阳和地球之间。
    - 认为日食发生时，地球上所有地方都能同时看到。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:时间
  type: Concept
  subject: 物理
  title: 时间
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为时间就是时刻，如说'用了3秒'，实际3秒是时间间隔，而'第3秒末'是时刻，混淆两者。
    - 能指出并纠正这一错误：认为时间只能由秒表测量，实际生活中钟表、手表也能测时间，秒表只是实验室更精确的工具。
  aliases: []
  category: 物理概念
  explanation: 描述运动过程持续性的物理量，单位有秒、分、时等。
  misconceptions:
    - 认为时间就是时刻，如说'用了3秒'，实际3秒是时间间隔，而'第3秒末'是时刻，混淆两者。
    - 认为时间只能由秒表测量，实际生活中钟表、手表也能测时间，秒表只是实验室更精确的工具。
    - 计算时间时未统一单位，如运动时间用分钟，速度用米每秒，导致结果错误，需先换算成秒。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:时间单位
  type: Concept
  subject: 物理
  title: 时间单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为1小时等于100分钟，实际1小时=60分钟，导致换算时数位错误。
    - 能指出并纠正这一错误：把时间单位换算与长度单位混淆，如认为1千米等于1000米，所以1小时也等于1000秒，实际1小时…
  aliases:
    - 时间单位换算
  category: 物理概念
  explanation: 时间的国际单位是秒，常用单位有分和小时，换算关系为1min=60s，1h=60min=3600s。
  misconceptions:
    - 认为1小时等于100分钟，实际1小时=60分钟，导致换算时数位错误。
    - 把时间单位换算与长度单位混淆，如认为1千米等于1000米，所以1小时也等于1000秒，实际1小时=3600秒。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:显微镜
  type: Concept
  subject: 物理
  title: 显微镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为显微镜的物镜成虚像、目镜成实像，实际上物镜成实像、目镜成虚像
    - 能指出并纠正这一错误：以为显微镜的物镜相当于放大镜，实际相当于投影仪
  aliases: []
  category: 光学仪器
  explanation: 显微镜用于观察近处微小物体，由物镜和目镜组成，文中提及但未详述。
  misconceptions:
    - 误认为显微镜的物镜成虚像、目镜成实像，实际上物镜成实像、目镜成虚像
    - 以为显微镜的物镜相当于放大镜，实际相当于投影仪
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:晶体
  type: Concept
  subject: 物理
  title: 晶体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为晶体熔化时温度不变就不吸热，如冰熔化时吸热但温度保持0℃却误以为不吸热
    - 能指出并纠正这一错误：认为所有固体都是晶体，把玻璃、松香等非晶体视为有固定熔点的晶体
  aliases: []
  category: 物理概念
  explanation: 有固定熔化温度的固体，熔化过程中温度保持不变。
  misconceptions:
    - 认为晶体熔化时温度不变就不吸热，如冰熔化时吸热但温度保持0℃却误以为不吸热
    - 认为所有固体都是晶体，把玻璃、松香等非晶体视为有固定熔点的晶体
    - 认为晶体熔化过程中温度不变所以内能不变，实际上吸热内能增加
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:月食
  type: Concept
  subject: 物理
  title: 月食
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为月食是月球在太阳和地球之间，挡住了太阳光形成的。
    - 能指出并纠正这一错误：认为月食每月都会发生，因为月球每月都会进入地球的影子。
  aliases: []
  category: 天文现象
  explanation: 地球在背对太阳一侧形成地影，月球进入地影时发生月食，分为月全食和月偏食。
  misconceptions:
    - 认为月食是月球在太阳和地球之间，挡住了太阳光形成的。
    - 认为月食每月都会发生，因为月球每月都会进入地球的影子。
    - 认为月食时月球从夜空中完全消失，实际只是被地球影子遮住变暗。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:有用功、额外功和总功
  type: Concept
  subject: 物理
  title: 有用功、额外功和总功
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把额外功误解为无用功，误认为可以避免，实际上额外功不可避免
    - 能指出并纠正这一错误：计算滑轮组总功时，误把物体上升距离当成绳子自由端移动距离
  aliases: []
  category: 物理概念
  explanation: 有用功是为达到目的必须做的功，额外功是克服摩擦和机械自重等不得不做的功，总功是动力所做的功，等于有用功与额外功之和。
  misconceptions:
    - 把额外功误解为无用功，误认为可以避免，实际上额外功不可避免
    - 计算滑轮组总功时，误把物体上升距离当成绳子自由端移动距离
    - 误认为总功等于有用功，忽略额外功的存在
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:望远镜
  type: Concept
  subject: 物理
  title: 望远镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把物镜焦距当成短的，目镜焦距当成长的
    - 能指出并纠正这一错误：认为望远镜最终成的是放大的实像，实际是倒立的虚像
  aliases:
    - 天文望远镜
  category: 光学仪器
  explanation: 望远镜由物镜和目镜组成，物镜焦距长，目镜焦距短，用于增大视角，看清远处物体。
  misconceptions:
    - 误把物镜焦距当成短的，目镜焦距当成长的
    - 认为望远镜最终成的是放大的实像，实际是倒立的虚像
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:机械效率
  type: Concept
  subject: 物理
  title: 机械效率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为机械效率可以大于1，实际上额外功存在，效率总小于100%
    - 能指出并纠正这一错误：计算时把W有用和W总颠倒，导致效率大于1或错误
  aliases: []
  category: 物理概念
  explanation: 有用功与总功的比值叫作机械效率，用百分数表示，公式为η=W有用/W总×100%。由于额外功的存在，机械效率总小于100%。
  misconceptions:
    - 误认为机械效率可以大于1，实际上额外功存在，效率总小于100%
    - 计算时把W有用和W总颠倒，导致效率大于1或错误
    - 误认为机械效率高的机械功率一定大，混淆效率与功率
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:机械波
  type: Concept
  subject: 物理
  title: 机械波
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为水波传播时，水分子随波一起向远处流动。
    - 能指出并纠正这一错误：认为机械波不需要介质，能在真空中传播，如声波。
  aliases:
    - 波
  category: 物理概念
  explanation: 振动形态在介质中的传播，如水波、声波、绳波等。
  misconceptions:
    - 误以为水波传播时，水分子随波一起向远处流动。
    - 认为机械波不需要介质，能在真空中传播，如声波。
    - 把机械波与电磁波等同，认为都是振动形态与能量的传播。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S2.md
- id: concept:物理:机械能
  type: Concept
  subject: 物理
  title: 机械能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为空中飞行的飞机只有动能，忽略它同时具有重力势能。
    - 能指出并纠正这一错误：误认为机械能守恒时动能和势能各自不变，实际可以相互转化。
  aliases:
    - 机械能
  category: 物理概念
  explanation: 动能和势能统称为机械能，一个物体可以同时具有动能和势能。
  misconceptions:
    - 误认为空中飞行的飞机只有动能，忽略它同时具有重力势能。
    - 误认为机械能守恒时动能和势能各自不变，实际可以相互转化。
    - 误认为机械能就是动能，漏掉势能。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:机械运动
  type: Concept
  subject: 物理
  title: 机械运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有相对于地面有位置变化才是机械运动，忽略相对其他物体也可成立。
    - 能指出并纠正这一错误：误以为静止的物体没有机械运动，其实静止是相对所选参照物而言。
  aliases:
    - 运动
  category: 物理概念
  explanation: 一个物体相对于另一个物体位置的变化叫作机械运动，简称运动。
  misconceptions:
    - 认为只有相对于地面有位置变化才是机械运动，忽略相对其他物体也可成立。
    - 误以为静止的物体没有机械运动，其实静止是相对所选参照物而言。
    - 把分子热运动、电磁运动等非机械运动误归于机械运动。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:杠杆
  type: Concept
  subject: 物理
  title: 杠杆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为杠杆必须是直的硬棒，认为弯棒不是杠杆
    - 能指出并纠正这一错误：误认为支点一定在杠杆的中间位置
  aliases: []
  category: 物理概念
  explanation: 一根硬棒，在力的作用下能绕固定点转动，这根硬棒就是杠杆。杠杆可以是直的，也可以是弯的。
  misconceptions:
    - 误认为杠杆必须是直的硬棒，认为弯棒不是杠杆
    - 误认为支点一定在杠杆的中间位置
    - 误认为杠杆只能绕端点转动，忽略中间支点的情况
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:杠杆的平衡条件
  type: Concept
  subject: 物理
  title: 杠杆的平衡条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算力臂时误把支点到力的作用点的距离当力臂，而不是到力的作用线的垂直距离
    - 能指出并纠正这一错误：代入F1l1=F2l2时，动力和阻力单位不统一（如一个用N，一个用kg）
  aliases:
    - 杠杆原理
  category: 物理规律
  explanation: 杠杆平衡时，动力乘以动力臂等于阻力乘以阻力臂，即F₁l₁=F₂l₂，也称杠杆原理。
  misconceptions:
    - 计算力臂时误把支点到力的作用点的距离当力臂，而不是到力的作用线的垂直距离
    - 代入F1l1=F2l2时，动力和阻力单位不统一（如一个用N，一个用kg）
    - 误认为杠杆平衡条件是动力等于阻力，忽略力臂的影响
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:标准大气压
  type: Concept
  subject: 物理
  title: 标准大气压
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为标准大气压就是76cm水柱产生的压强，实际是76cm水银柱，水柱约10.3m。
    - 能指出并纠正这一错误：误认为标准大气压的数值是固定不变的，忽略它只是人为规定的参考值。
  aliases:
    - atm
  category: 物理概念
  explanation: 通常把1.0×10⁵Pa的大气压称为标准大气压。
  misconceptions:
    - 误以为标准大气压就是76cm水柱产生的压强，实际是76cm水银柱，水柱约10.3m。
    - 误认为标准大气压的数值是固定不变的，忽略它只是人为规定的参考值。
    - 在计算时把标准大气压写成100Pa，丢掉了10⁵的数量级。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:核力
  type: Concept
  subject: 物理
  title: 核力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为核力是质子和中子间的万有引力，实际是强相互作用。
    - 能指出并纠正这一错误：认为核力是电磁力，混淆微观相互作用。
  aliases: []
  category: 物理概念
  explanation: 原子核内质子和中子之间存在的强相互作用，使它们紧密结合。
  misconceptions:
    - 误认为核力是质子和中子间的万有引力，实际是强相互作用。
    - 认为核力是电磁力，混淆微观相互作用。
    - 以为核力只在核裂变时存在，忽略原子核稳定时也有核力。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:核电站
  type: Concept
  subject: 物理
  title: 核电站
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为核电站利用的是核聚变，而非核裂变。
    - 能指出并纠正这一错误：认为核电站将核能直接转化为电能，忽略中间热能和机械能环节。
  aliases:
    - 核电厂
  category: 物理应用
  explanation: 利用核反应堆中裂变释放的能量转化为电能进行发电的设施。
  misconceptions:
    - 误认为核电站利用的是核聚变，而非核裂变。
    - 认为核电站将核能直接转化为电能，忽略中间热能和机械能环节。
    - 误以为核反应堆能完全被控制，不会有任何辐射泄漏。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:核能
  type: Concept
  subject: 物理
  title: 核能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为核能是原子外层电子变化释放的化学能。
    - 能指出并纠正这一错误：认为核能只指核裂变释放的能量，忽略聚变也属于核能。
  aliases:
    - 原子能
  category: 物理概念
  explanation: 原子核结构发生变化时释放出的巨大能量称为核能。
  misconceptions:
    - 误认为核能是原子外层电子变化释放的化学能。
    - 认为核能只指核裂变释放的能量，忽略聚变也属于核能。
    - 将核能等同于热能，认为核能就是原子核内储存的热量。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:次声波
  type: Concept
  subject: 物理
  title: 次声波
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将次声波按响度定义，认为音量小的声音就是次声波。
    - 能指出并纠正这一错误：认为频率为15Hz的声音是超声波，因为人耳听不到。
  aliases:
    - 次声
  category: 物理概念
  explanation: 频率低于20Hz的声音叫作次声波，人耳听不到，但某些动物可以听到。
  misconceptions:
    - 误将次声波按响度定义，认为音量小的声音就是次声波。
    - 认为频率为15Hz的声音是超声波，因为人耳听不到。
    - 认为次声波没有能量，所以不会产生任何危害。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:次声波的产生
  type: Concept
  subject: 物理
  title: 次声波的产生
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有核爆炸、火箭发射等人类活动产生次声波，忽略自然现象。
    - 能指出并纠正这一错误：误以为地震产生的是超声波，因能量大频率高。
  aliases: []
  category: 声学现象
  explanation: 自然现象如地震、火山爆发，人为活动如核爆炸、火箭发射等都会产生次声波。
  misconceptions:
    - 认为只有核爆炸、火箭发射等人类活动产生次声波，忽略自然现象。
    - 误以为地震产生的是超声波，因能量大频率高。
    - 认为只有剧烈爆炸才产生次声波，忽略机械运转也能产生次声波。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:次声波的危害
  type: Concept
  subject: 物理
  title: 次声波的危害
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为人耳听不到次声波，因此次声波对人体完全无害。
    - 能指出并纠正这一错误：误以为次声波只能损坏设备，不影响人体健康。
  aliases: []
  category: 声学现象
  explanation: 较强次声波可损害人体健康，甚至破坏设备建筑。
  misconceptions:
    - 认为人耳听不到次声波，因此次声波对人体完全无害。
    - 误以为次声波只能损坏设备，不影响人体健康。
    - 认为次声波传播速度比可听声波慢，所以危害有延迟。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:次声波的应用
  type: Concept
  subject: 物理
  title: 次声波的应用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误将次声波用于B超诊断，认为B超使用次声波。
    - 能指出并纠正这一错误：认为监测次声波能精确预报地震发生的时间和地点，忽略目前仅可预警。
  aliases: []
  category: 声学应用
  explanation: 通过监测次声波预报地震、台风等自然灾害。
  misconceptions:
    - 误将次声波用于B超诊断，认为B超使用次声波。
    - 认为监测次声波能精确预报地震发生的时间和地点，忽略目前仅可预警。
    - 把次声波应用与超声清洗、探伤混淆，误认为次声波可清洗物体。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:欧姆定律
  type: Concept
  subject: 物理
  title: 欧姆定律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为欧姆定律适用于所有电路，把电动机、导体电解液也算入纯电阻电路
    - 能指出并纠正这一错误：计算时单位不统一，如电压用毫伏、电流用安培直接代入公式
  aliases: []
  category: 物理定律
  explanation: 导体中的电流与导体两端的电压成正比，与导体的电阻成反比，公式为I=U/R。
  misconceptions:
    - 误以为欧姆定律适用于所有电路，把电动机、导体电解液也算入纯电阻电路
    - 计算时单位不统一，如电压用毫伏、电流用安培直接代入公式
    - 误认为电阻会随电压或电流改变，由U/I决定，忘记电阻是导体属性
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S3.md
- id: concept:物理:比热容
  type: Concept
  subject: 物理
  title: 比热容
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算时误将末温当作温度变化，如从20℃加热到80℃误代入80。
    - 能指出并纠正这一错误：误认为物质比热容与吸收热量成正比，与质量、温度变化成反比。
  aliases:
    - 比热容
  category: 物理概念
  explanation: 物体温度升高时吸收的热量与它的质量和升高温度的乘积之比，是物质的一种属性，单位是J/(kg·℃)。
  misconceptions:
    - 计算时误将末温当作温度变化，如从20℃加热到80℃误代入80。
    - 误认为物质比热容与吸收热量成正比，与质量、温度变化成反比。
    - 将比热容单位写成J/(kg·℃)或J/kg·℃，漏写℃或写错分母。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:比较物体运动快慢的方法
  type: Concept
  subject: 物理
  title: 比较物体运动快慢的方法
  conceptType: 应用型
  masteryCriteria:
    - 能指出并纠正这一错误：认为时间越短运动越快，忽略了路程也需相同。
    - 能指出并纠正这一错误：认为路程越长运动越快，忽略了时间也需相同。
  aliases:
    - 运动快慢比较
  category: 物理方法
  explanation: 比较物体运动快慢有两种方法：相同时间比路程，路程长则快；相同路程比时间，时间短则快。
  misconceptions:
    - 认为时间越短运动越快，忽略了路程也需相同。
    - 认为路程越长运动越快，忽略了时间也需相同。
    - 比较路程和时间都不相同的物体时，不会转换成相同时间或相同路程，直接看路程或时间下结论。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:气压计
  type: Concept
  subject: 物理
  title: 气压计
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为气压计只能测大气压，不能测密闭容器内气压。
    - 能指出并纠正这一错误：将空盒气压计与液体压强计混淆，误认为空盒气压计是利用液体柱高度来测压强的。
  aliases:
    - 空盒气压计
  category: 物理仪器
  explanation: 用于测量气体压强的仪器，常见的有空盒气压计等。
  misconceptions:
    - 误认为气压计只能测大气压，不能测密闭容器内气压。
    - 将空盒气压计与液体压强计混淆，误认为空盒气压计是利用液体柱高度来测压强的。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:氯氟碳化合物
  type: Concept
  subject: 物理
  title: 氯氟碳化合物
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为所有氯氟碳化合物都已被禁止，其实仅禁用了CFCs，HCFCs等仍在使用。
    - 能指出并纠正这一错误：误以为氯氟碳化合物只用于制冷，还会用作发泡剂、清洗剂和喷雾推进剂。
  aliases:
    - 氟利昂
  category: 化学物质
  explanation: 氯氟碳化合物是消耗臭氧层的物质，如氟利昂，被禁止用于家用电器。
  misconceptions:
    - 误以为所有氯氟碳化合物都已被禁止，其实仅禁用了CFCs，HCFCs等仍在使用。
    - 误以为氯氟碳化合物只用于制冷，还会用作发泡剂、清洗剂和喷雾推进剂。
    - 误以为氯氟碳化合物直接破坏臭氧，实际是分解产生氯原子催化臭氧分解。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S3.md
- id: concept:物理:水循环
  type: Concept
  subject: 物理
  title: 水循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水循环只有蒸发和降水两个环节，漏掉凝华和升华
    - 能指出并纠正这一错误：以为水循环中水的总量会减少，如认为蒸发后的水不存在了
  aliases:
    - 水循环系统
  category: 物态变化应用
  explanation: 地球上的水在陆地、海洋、大气之间通过蒸发、升华、液化、凝华、熔化等物态变化不断循环的过程。
  misconceptions:
    - 认为水循环只有蒸发和降水两个环节，漏掉凝华和升华
    - 以为水循环中水的总量会减少，如认为蒸发后的水不存在了
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S3.md
- id: concept:物理:水的状态变化
  type: Concept
  subject: 物理
  title: 水的状态变化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水的状态变化时温度一定改变，如冰熔化温度不变却误以为没有吸热
    - 能指出并纠正这一错误：认为水要变成水蒸气只能加热到100℃，忽略蒸发在任何温度下发生
  aliases:
    - 物态变化
  category: 物理
  explanation: 水有固态、液态、气态三种状态，变化时伴随吸热或放热。
  misconceptions:
    - 认为水的状态变化时温度一定改变，如冰熔化温度不变却误以为没有吸热
    - 认为水要变成水蒸气只能加热到100℃，忽略蒸发在任何温度下发生
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S4.md
- id: concept:物理:水资源
  type: Concept
  subject: 物理
  title: 水资源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：看到地球多水就认为水资源丰富，忽略淡水占比极少
    - 能指出并纠正这一错误：把两极冰川和深层地下水算作可利用淡水，实际难以利用
  aliases:
    - 淡水资源
  category: 地理/环境
  explanation: 地球上的水包括海水和淡水，其中淡水仅占总水量的2.5%，可利用的淡水不足淡水资源的1%。
  misconceptions:
    - 看到地球多水就认为水资源丰富，忽略淡水占比极少
    - 把两极冰川和深层地下水算作可利用淡水，实际难以利用
    - 误认为淡水占总水量25%，实际只有2.5%且可利用更少
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S5.md
- id: concept:物理:水资源利用与保护
  type: Concept
  subject: 物理
  title: 水资源利用与保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水是可再生资源就取之不尽，忽视局部水资源短缺
    - 能指出并纠正这一错误：将防止水污染等同于污水处理，忽略源头减排和节水
  aliases: []
  category: 社会议题
  explanation: 人类对水资源的合理利用和节约保护，包括节约用水、防止水污染等。
  misconceptions:
    - 认为水是可再生资源就取之不尽，忽视局部水资源短缺
    - 将防止水污染等同于污水处理，忽略源头减排和节水
    - 认为节约用水是限制用水，实际是合理高效利用水资源
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S5.md
- id: concept:物理:永动机
  type: Concept
  subject: 物理
  title: 永动机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为永动机只是技术难题，未来可能实现。
    - 能指出并纠正这一错误：认为永动机可以消耗少量能量而输出大量能量，不违反能量守恒。
  aliases: []
  category: 物理概念
  explanation: 不需要消耗能量却能永远运动并对外做功的假想机器，违背能量守恒定律，不可能实现。
  misconceptions:
    - 误以为永动机只是技术难题，未来可能实现。
    - 认为永动机可以消耗少量能量而输出大量能量，不违反能量守恒。
    - 误以为第一类永动机违反能量守恒，第二类永动机不违反。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S3.md
- id: concept:物理:汽化
  type: Concept
  subject: 物理
  title: 汽化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为汽化只指沸腾，忽略蒸发也是汽化的一种形式
    - 能指出并纠正这一错误：认为汽化必须达到沸点才能发生，实际蒸发在任何温度下都可进行
  aliases:
    - vaporization
  category: 物理概念
  explanation: 物质由液态变为气态的过程，包括蒸发和沸腾两种方式。
  misconceptions:
    - 认为汽化只指沸腾，忽略蒸发也是汽化的一种形式
    - 认为汽化必须达到沸点才能发生，实际蒸发在任何温度下都可进行
    - 认为汽化只在液体表面进行，忽略沸腾时内部也剧烈汽化
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:汽油机的工作循环
  type: Concept
  subject: 物理
  title: 汽油机的工作循环
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为一个工作循环飞轮转一圈，实际转两圈。
    - 能指出并纠正这一错误：误将压缩冲程认为内能转化为机械能，实际是机械能转化为内能。
  aliases:
    - 四冲程
  category: 物理过程
  explanation: 汽油机的一个工作循环包括吸气、压缩、做功、排气四个冲程，其中压缩冲程机械能转化为内能，做功冲程内能转化为机械能。
  misconceptions:
    - 误认为一个工作循环飞轮转一圈，实际转两圈。
    - 误将压缩冲程认为内能转化为机械能，实际是机械能转化为内能。
    - 误认为做功冲程进气门和排气门都打开，实际两个门都关闭。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:沸点
  type: Concept
  subject: 物理
  title: 沸点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水的沸点永远是100℃，忽略气压影响，高山上水不到100℃就沸腾
    - 能指出并纠正这一错误：认为沸点随加热时间改变，实际沸点是沸腾时的温度，与气压有关
  aliases: []
  category: 物理概念
  explanation: 液体沸腾时的温度叫作沸点，不同液体沸点不同，在标准大气压下水的沸点是100℃。
  misconceptions:
    - 认为水的沸点永远是100℃，忽略气压影响，高山上水不到100℃就沸腾
    - 认为沸点随加热时间改变，实际沸点是沸腾时的温度，与气压有关
    - 把沸点与凝固点混淆，误认为同种液体沸点等于凝固点
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:沸点与气压的关系
  type: Concept
  subject: 物理
  title: 沸点与气压的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为高山上煮饭烧不熟是因为气压高沸点高，实际海拔高气压低使沸点降低。
    - 能指出并纠正这一错误：误以为水沸腾后继续加热温度升高，从而推断气压改变不影响沸点。
  aliases: []
  category: 物理规律
  explanation: 液体的沸点随液面上方气压的减小而降低，随气压的增大而升高。
  misconceptions:
    - 认为高山上煮饭烧不熟是因为气压高沸点高，实际海拔高气压低使沸点降低。
    - 误以为水沸腾后继续加热温度升高，从而推断气压改变不影响沸点。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:沸腾
  type: Concept
  subject: 物理
  title: 沸腾
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为沸腾只在液体表面进行，与蒸发一样
    - 能指出并纠正这一错误：认为液体沸腾后温度会继续升高，实际温度保持不变
  aliases:
    - boiling
  category: 物理概念
  explanation: 在液体表面和内部同时发生的剧烈汽化现象，在一定温度下发生。
  misconceptions:
    - 认为沸腾只在液体表面进行，与蒸发一样
    - 认为液体沸腾后温度会继续升高，实际温度保持不变
    - 认为沸腾在任何温度下都能发生，实际需达到沸点并持续吸热
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:法线
  type: Concept
  subject: 物理
  title: 法线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把法线画成带箭头的实线，认为它是实际存在的光线
    - 能指出并纠正这一错误：画法线时画成垂直于入射光线，而不是垂直于镜面
  aliases: []
  category: 物理概念
  explanation: 过入射点并垂直于镜面的直线称为法线。
  misconceptions:
    - 把法线画成带箭头的实线，认为它是实际存在的光线
    - 画法线时画成垂直于入射光线，而不是垂直于镜面
    - 认为法线可以不过入射点，任意作垂线
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:波速
  type: Concept
  subject: 物理
  title: 波速
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为波速由频率决定，频率越高波传播越快。
    - 能指出并纠正这一错误：用v=λf时，认为波长越大波速越大，忽略波速由介质决定。
  aliases: []
  category: 物理量
  explanation: 波传播的速度，用字母v表示，单位是米/秒（m/s）。
  misconceptions:
    - 误以为波速由频率决定，频率越高波传播越快。
    - 用v=λf时，认为波长越大波速越大，忽略波速由介质决定。
    - 把波速当成质点振动速度，混淆波传播速度与振动快慢。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:波长
  type: Concept
  subject: 物理
  title: 波长
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把波长当成波在1秒内传播的距离，与波速混淆。
    - 能指出并纠正这一错误：认为波长等于波峰到波谷的距离，实则是两个相邻波峰的距离。
  aliases: []
  category: 物理量
  explanation: 波在一个周期内传播的距离，用字母λ表示，单位是米（m）。
  misconceptions:
    - 把波长当成波在1秒内传播的距离，与波速混淆。
    - 认为波长等于波峰到波谷的距离，实则是两个相邻波峰的距离。
    - 计算时忽略单位换算，如波长用km直接代入λ，导致结果错误。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:流体压强与流速的关系
  type: Concept
  subject: 物理
  title: 流体压强与流速的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为两张纸之间吹气时，纸会分开，实际流速大压强小，纸应靠近。
    - 能指出并纠正这一错误：把飞机升力归因于空气浮力，实际是机翼上下表面流速差产生压强差。
  aliases:
    - 伯努利原理
  category: 物理规律
  explanation: 流体的流速越大，压强越小。
  misconceptions:
    - 认为两张纸之间吹气时，纸会分开，实际流速大压强小，纸应靠近。
    - 把飞机升力归因于空气浮力，实际是机翼上下表面流速差产生压强差。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:测电笔
  type: Concept
  subject: 物理
  title: 测电笔
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为测电笔氖管发光说明接触的是零线
    - 能指出并纠正这一错误：使用测电笔时手触碰笔尖金属体，导致触电
  aliases:
    - 试电笔
  category: 电工工具
  explanation: 用于检测火线和零线的工具，氖管发光表示接触火线。
  misconceptions:
    - 误以为测电笔氖管发光说明接触的是零线
    - 使用测电笔时手触碰笔尖金属体，导致触电
    - 认为测电笔内部没有高电阻，直接接触火线也不会触电
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:测量
  type: Concept
  subject: 物理
  title: 测量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为测量就是简单的读数，忽略了测量前要观察量程和分度值，导致选择不合适的工具，如用米尺测量硬币厚…
    - 能指出并纠正这一错误：认为误差就是错误，实际错误可以避免，误差不可避免，如读数时看错刻度是错误，而估读不准确是误差。
  aliases: []
  category: 物理概念
  explanation: 测量是将待测量与标准量进行比较的过程，需要选择合适的工具并遵循正确操作。
  misconceptions:
    - 认为测量就是简单的读数，忽略了测量前要观察量程和分度值，导致选择不合适的工具，如用米尺测量硬币厚度。
    - 认为误差就是错误，实际错误可以避免，误差不可避免，如读数时看错刻度是错误，而估读不准确是误差。
    - 认为测量值可以完全等于真实值，实际任何测量都会存在误差，如多次测量取平均值只能减小误差，不能消除误差。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:测量固体密度
  type: Concept
  subject: 物理
  title: 测量固体密度
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：先测体积再测质量，物体沾水后质量偏大，导致密度偏大
    - 能指出并纠正这一错误：用排水法测体积时物体未完全浸没，测出体积偏小，密度偏大
  aliases: []
  category: 实验方法
  explanation: 用天平测质量，用量筒和水测体积（排水法），再根据密度公式计算密度。
  misconceptions:
    - 先测体积再测质量，物体沾水后质量偏大，导致密度偏大
    - 用排水法测体积时物体未完全浸没，测出体积偏小，密度偏大
    - 读数时俯视量筒液面，体积读数偏大，导致密度偏小
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:测量液体密度
  type: Concept
  subject: 物理
  title: 测量液体密度
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：先测空杯质量，再测总质量，最后倒入量筒测体积，烧杯残留使体积偏小，密度偏大
    - 能指出并纠正这一错误：将量筒置于天平上直接测液体质量，量筒较重且易倒，测量不准确
  aliases: []
  category: 实验方法
  explanation: 用天平测液体质量，用量筒测液体体积，再计算密度。
  misconceptions:
    - 先测空杯质量，再测总质量，最后倒入量筒测体积，烧杯残留使体积偏小，密度偏大
    - 将量筒置于天平上直接测液体质量，量筒较重且易倒，测量不准确
    - 认为液体密度与体积无关，但计算时误用量筒总量体积而非倒出部分体积
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S6.md
- id: concept:物理:测量物质的密度
  type: Concept
  subject: 物理
  title: 测量物质的密度
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：俯视量筒液面读数，认为读数偏小，实际偏大，密度计算值偏小
    - 能指出并纠正这一错误：认为先测体积后测质量对吸水物体无影响，导致质量偏大、密度偏大
  aliases: []
  category: 核心概念
  explanation: 自动从课文 prose 提取，待完善。
  misconceptions:
    - 俯视量筒液面读数，认为读数偏小，实际偏大，密度计算值偏小
    - 认为先测体积后测质量对吸水物体无影响，导致质量偏大、密度偏大
    - 换算密度单位时，误认为1g/cm³=1×10⁻³kg/m³，实际是10³kg/m³
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:浮力
  type: Concept
  subject: 物理
  title: 浮力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为沉在水底的物体不受浮力，只有漂浮或悬浮的物体才受浮力。
    - 能指出并纠正这一错误：误以为在空气中的物体不受浮力，实际物体在气体中也受竖直向上的浮力。
  aliases:
    - buoyancy force
  category: 物理概念
  explanation: 浸在液体或气体中的物体受到竖直向上的托力，这个力叫浮力。
  misconceptions:
    - 认为沉在水底的物体不受浮力，只有漂浮或悬浮的物体才受浮力。
    - 误以为在空气中的物体不受浮力，实际物体在气体中也受竖直向上的浮力。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:浮力产生的原因
  type: Concept
  subject: 物理
  title: 浮力产生的原因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为浮力只是液体对物体上表面的压力，忽略下表面压力方向向上。
    - 能指出并纠正这一错误：物体与容器底紧密接触时仍直接用上下表面压力差，实际此时下表面无液体压力，浮力消失。
  aliases: []
  category: 物理原理
  explanation: 浮力是由于物体上下表面受到液体或气体的压力差产生的。
  misconceptions:
    - 认为浮力只是液体对物体上表面的压力，忽略下表面压力方向向上。
    - 物体与容器底紧密接触时仍直接用上下表面压力差，实际此时下表面无液体压力，浮力消失。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S4.md
- id: concept:物理:液体压强
  type: Concept
  subject: 物理
  title: 液体压强
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为液体压强只跟深度有关，忽略液体密度的影响，如相同深度水和水银压强相等。
    - 能指出并纠正这一错误：认为液体对容器侧壁无压强，实际侧壁也有压强，深度越大侧壁压强越大。
  aliases:
    - 液体内部压强
  category: 物理概念
  explanation: 液体对容器底、容器壁和浸在其中的物体都有压强，液体内部各个方向都有压强。
  misconceptions:
    - 认为液体压强只跟深度有关，忽略液体密度的影响，如相同深度水和水银压强相等。
    - 认为液体对容器侧壁无压强，实际侧壁也有压强，深度越大侧壁压强越大。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:液体压强的特点
  type: Concept
  subject: 物理
  title: 液体压强的特点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：判断同一深度不同液体压强相等，误以为压强只受深度控制，如水中3米深处压强一定大于水银浅处。
    - 能指出并纠正这一错误：误以为深度增大压强一定增大，未考虑深度相同时密度不同导致压强不同，如深海与水浅处比较。
  aliases:
    - 液体压强规律
  category: 物理规律
  explanation: 液体内部各个方向都有压强；同一深度，压强相等；深度增大，压强增大；深度相同时，液体密度越大，压强越大。
  misconceptions:
    - 判断同一深度不同液体压强相等，误以为压强只受深度控制，如水中3米深处压强一定大于水银浅处。
    - 误以为深度增大压强一定增大，未考虑深度相同时密度不同导致压强不同，如深海与水浅处比较。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S2.md
- id: concept:物理:液体温度计
  type: Concept
  subject: 物理
  title: 液体温度计
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用前用力甩动实验室温度计，导致读数不准或损坏仪器
    - 能指出并纠正这一错误：认为液体温度计能测任何温度，超出量程仍继续使用
  aliases:
    - 温度计
    - thermometer
  category: 测量工具
  explanation: 利用测温液体热胀冷缩的性质制成的温度计，是实验室常用的测量工具。
  misconceptions:
    - 用前用力甩动实验室温度计，导致读数不准或损坏仪器
    - 认为液体温度计能测任何温度，超出量程仍继续使用
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S5.md
- id: concept:物理:液化
  type: Concept
  subject: 物理
  title: 液化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为液化是吸热过程，实际液化放热，水蒸气烫伤更严重
    - 能指出并纠正这一错误：认为只有降温才能液化，忽略压缩体积也可使气体液化
  aliases:
    - 凝结
  category: 物理概念
  explanation: 物质由气态变为液态的过程叫作液化，液化放热，可通过降温或压缩体积的方法实现。
  misconceptions:
    - 认为液化是吸热过程，实际液化放热，水蒸气烫伤更严重
    - 认为只有降温才能液化，忽略压缩体积也可使气体液化
    - 把冬天白气说成水蒸气，实际是液化形成的小水滴
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:清洁能源
  type: Concept
  subject: 物理
  title: 清洁能源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为清洁能源就是取之不尽、用之不竭的能源。
    - 能指出并纠正这一错误：认为天然气燃烧只产生二氧化碳，无污染物，属于清洁能源。
  aliases: []
  category: 能源分类
  explanation: 在使用时基本不产生污染物的能源，如太阳能、风能等。
  misconceptions:
    - 认为清洁能源就是取之不尽、用之不竭的能源。
    - 认为天然气燃烧只产生二氧化碳，无污染物，属于清洁能源。
    - 把水力发电视为非清洁能源，因大坝建设破坏生态。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:温室效应
  type: Concept
  subject: 物理
  title: 温室效应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为温室效应完全是人类活动造成的，实际自然也有温室效应
    - 能指出并纠正这一错误：认为温室效应是大气层直接吸收太阳辐射，实际是阻碍地面热量散失
  aliases: []
  category: 物理现象
  explanation: 大气层中的二氧化碳、水蒸气、甲烷等气体阻碍地表热量向大气层外散发，使地表和大气下层保持较高温度的现象。
  misconceptions:
    - 认为温室效应完全是人类活动造成的，实际自然也有温室效应
    - 认为温室效应是大气层直接吸收太阳辐射，实际是阻碍地面热量散失
    - 将温室效应与臭氧层空洞混为一谈
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:温度
  type: Concept
  subject: 物理
  title: 温度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把温度说成热量，例如'这杯水有30℃的热量'
    - 能指出并纠正这一错误：认为温度升高一定是吸收了热量，忽略做功也可改变温度
  aliases:
    - temperature
  category: 物理概念
  explanation: 表示物体冷热程度的物理量，与物态变化密切相关。
  misconceptions:
    - 把温度说成热量，例如'这杯水有30℃的热量'
    - 认为温度升高一定是吸收了热量，忽略做功也可改变温度
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:温度-时间图像
  type: Concept
  subject: 物理
  title: 温度-时间图像
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：描点作图时把温度作横轴、时间作纵轴，导致图像无法反映变化规律
    - 能指出并纠正这一错误：认为沸腾图像中温度不变的一段表示液体不再吸热，实际是吸热但温度不变
  aliases:
    - 温度随时间变化图像
  category: 数据处理
  explanation: 以时间为横轴、温度为纵轴绘制的图像，用于直观反映温度随时间的变化规律。
  misconceptions:
    - 描点作图时把温度作横轴、时间作纵轴，导致图像无法反映变化规律
    - 认为沸腾图像中温度不变的一段表示液体不再吸热，实际是吸热但温度不变
    - 把晶体熔化图像与液体沸腾图像完全等同，忽略二者的条件差异
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S5.md
- id: concept:物理:温度计的使用方法
  type: Concept
  subject: 物理
  title: 温度计的使用方法
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：玻璃泡接触容器底或壁，使读数与实际液体温度不符
    - 能指出并纠正这一错误：读数时把温度计从液体中拿出，示数变化导致读数错误
  aliases:
    - 使用温度计的注意事项
  category: 实验技能
  explanation: 使用温度计时，玻璃泡要与被测物体充分接触，读数时不能离开被测物体，视线要与液柱上表面相平。
  misconceptions:
    - 玻璃泡接触容器底或壁，使读数与实际液体温度不符
    - 读数时把温度计从液体中拿出，示数变化导致读数错误
    - 视线俯视液柱上表面，使读数偏大
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:滑动变阻器
  type: Concept
  subject: 物理
  title: 滑动变阻器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为滑片向右移时电阻一定变小，实际要看下端接线柱接哪边
    - 能指出并纠正这一错误：把滑动变阻器上下两接线柱同时接上，导致电阻接近零且滑片失灵
  aliases:
    - 变阻器
  category: 物理器件
  explanation: 滑动变阻器通过改变接入电路中电阻丝的长度来改变电阻，从而连续改变电路中的电流。
  misconceptions:
    - 误以为滑片向右移时电阻一定变小，实际要看下端接线柱接哪边
    - 把滑动变阻器上下两接线柱同时接上，导致电阻接近零且滑片失灵
    - 误认为滑动变阻器能直接测量电阻值，实际上只能改变阻值不能读数
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:滑动摩擦力
  type: Concept
  subject: 物理
  title: 滑动摩擦力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为滑动摩擦力大小与接触面积有关，如认为物体放倒后滑动摩擦力变大，实际与面积无关。
    - 能指出并纠正这一错误：误认为滑动摩擦力大小总是等于物体重力，如手压物在竖直墙面滑动时，滑动摩擦力由压力决定，不一定等于…
  aliases: []
  category: 物理概念
  explanation: 一个物体在另一个物体表面上滑动时受到的阻碍它运动的力。
  misconceptions:
    - 误认为滑动摩擦力大小与接触面积有关，如认为物体放倒后滑动摩擦力变大，实际与面积无关。
    - 误认为滑动摩擦力大小总是等于物体重力，如手压物在竖直墙面滑动时，滑动摩擦力由压力决定，不一定等于重力。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:滑轮组
  type: Concept
  subject: 物理
  title: 滑轮组
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：数承重绳子段数时，把定滑轮上的绳子也算进去，导致拉力计算错误
    - 能指出并纠正这一错误：误认为滑轮组拉力总是物重的1/n，忽略动滑轮重力
  aliases: []
  category: 简单机械
  explanation: 由定滑轮和动滑轮组合而成，既能省力又能改变施力方向，拉力约为物重的几分之一（取决于吊着物体的绳子段数）。
  misconceptions:
    - 数承重绳子段数时，把定滑轮上的绳子也算进去，导致拉力计算错误
    - 误认为滑轮组拉力总是物重的1/n，忽略动滑轮重力
    - 绕绳子时，误从定滑轮开始绕，导致不能改变力的方向或省力情况不对
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:漏电
  type: Concept
  subject: 物理
  title: 漏电
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将漏电与短路混淆，认为漏电就是火线和零线碰线
    - 能指出并纠正这一错误：误以为漏电保护器在电流过大时才会跳闸
  aliases:
    - 电流泄漏
  category: 安全用电
  explanation: 由于绝缘损坏或其他原因引起的电流泄漏现象。
  misconceptions:
    - 将漏电与短路混淆，认为漏电就是火线和零线碰线
    - 误以为漏电保护器在电流过大时才会跳闸
    - 认为只有用电器外壳带电才叫漏电，忽略火线破损漏电
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:漏电保护断路器
  type: Concept
  subject: 物理
  title: 漏电保护断路器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为漏电保护器与保险丝作用相同，都是防止电流过大
    - 能指出并纠正这一错误：认为漏电保护器跳闸后可以立即合闸，不需检查故障
  aliases:
    - 漏电保护器
    - 剩余电流动作保护器
  category: 安全用电
  explanation: 当电路出现漏电时自动切断电路的装置，保护人身安全。
  misconceptions:
    - 误以为漏电保护器与保险丝作用相同，都是防止电流过大
    - 认为漏电保护器跳闸后可以立即合闸，不需检查故障
    - 误以为漏电保护器可防止所有触电事故，包括双手触及火线和零线
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:漫反射
  type: Concept
  subject: 物理
  title: 漫反射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为漫反射不遵循光的反射定律，说‘漫反射是乱反射，定律不适用’。
    - 能指出并纠正这一错误：画图时标漫反射的反射角，把各条反射光线的反射角写成不相等。
  aliases:
    - diffuse reflection
  category: 物理概念
  explanation: 平行光入射到粗糙不平的表面时，反射光射向四面八方，这种反射称为漫反射。
  misconceptions:
    - 认为漫反射不遵循光的反射定律，说‘漫反射是乱反射，定律不适用’。
    - 画图时标漫反射的反射角，把各条反射光线的反射角写成不相等。
    - 看到黑板反光以为是漫反射，其实是镜面反射刺眼。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:潜艇的浮沉原理
  type: Concept
  subject: 物理
  title: 潜艇的浮沉原理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为潜艇上浮下潜靠改变自身体积来改变浮力，实际是改变水舱水量改变自重。
    - 能指出并纠正这一错误：误以为潜艇下潜时浮力不变，靠增加重力实现，但浮力大小也会因深度变化而改变。
  aliases: []
  category: 应用
  explanation: 通过改变潜艇水舱中的水量来改变自重，从而控制浮沉。
  misconceptions:
    - 认为潜艇上浮下潜靠改变自身体积来改变浮力，实际是改变水舱水量改变自重。
    - 误以为潜艇下潜时浮力不变，靠增加重力实现，但浮力大小也会因深度变化而改变。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:火星探测工程
  type: Concept
  subject: 物理
  title: 火星探测工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为火星探测任务只能实现其中一项，不知天问一号一次完成环绕、着陆、巡视。
    - 能指出并纠正这一错误：误以为天问一号是载人火星飞船，实际上它是无人探测器。
  aliases: []
  category: 航天工程
  explanation: 我国首次火星探测任务通过一次任务实现火星环绕、着陆和巡视，天问一号探测器成功实施。
  misconceptions:
    - 认为火星探测任务只能实现其中一项，不知天问一号一次完成环绕、着陆、巡视。
    - 误以为天问一号是载人火星飞船，实际上它是无人探测器。
    - 误认为天问一号直接着陆火星表面，而实际上先环绕火星运行后再实施着陆。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:火线和零线
  type: Concept
  subject: 物理
  title: 火线和零线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为火线与零线之间电压为380V
    - 能指出并纠正这一错误：误认为零线与地线之间电压为220V
  aliases:
    - 相线和中性线
  category: 电路知识
  explanation: 家庭电路中的两根电源线，火线（L）与零线（N）之间的电压为220V。
  misconceptions:
    - 误以为火线与零线之间电压为380V
    - 误认为零线与地线之间电压为220V
    - 认为火线和零线可以任意互换，不影响电路安全
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:点光源
  type: Concept
  subject: 物理
  title: 点光源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有体积很小的光源才是点光源，忽略距离远时大光源也可视为点光源。
    - 能指出并纠正这一错误：认为点光源发出的光是平行光，因为从一点向四周发出的光方向相同，实际是发散的。
  aliases: []
  category: 物理概念
  explanation: 当光源离我们较远时，可将其看成点光源，光由中心点向四周传播。
  misconceptions:
    - 认为只有体积很小的光源才是点光源，忽略距离远时大光源也可视为点光源。
    - 认为点光源发出的光是平行光，因为从一点向四周发出的光方向相同，实际是发散的。
    - 认为太阳永远不能看作点光源，实际在研究离太阳很远时，可把太阳看作点光源。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S2.md
- id: concept:物理:热传递
  type: Concept
  subject: 物理
  title: 热传递
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为热传递是从内能大的物体传到内能小的物体，实际从高温传到低温。
    - 能指出并纠正这一错误：误认为热传递传递的是温度，如说‘高温物体把温度传给低温物体’。
  aliases:
    - 热传递
  category: 物理概念
  explanation: 当物体或物体的不同部分之间存在温度差时，能量从高温处转移到低温处的过程，是改变物体内能的一种方式。
  misconceptions:
    - 误认为热传递是从内能大的物体传到内能小的物体，实际从高温传到低温。
    - 误认为热传递传递的是温度，如说‘高温物体把温度传给低温物体’。
    - 误认为热传递只发生在固体之间，忽略液体和气体也能发生。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:热传递改变物体内能
  type: Concept
  subject: 物理
  title: 热传递改变物体内能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为热传递改变内能是能量的转化，实际是内能的转移。
    - 能指出并纠正这一错误：误认为热传递后两物体温度一定相等，忽略未达到热平衡的情况。
  aliases: []
  category: 物理规律
  explanation: 热传递改变物体内能的实质是内能的转移。
  misconceptions:
    - 误认为热传递改变内能是能量的转化，实际是内能的转移。
    - 误认为热传递后两物体温度一定相等，忽略未达到热平衡的情况。
    - 误认为高温物体温度降低的度数一定等于低温物体升高的度数。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:热值
  type: Concept
  subject: 物理
  title: 热值
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为燃料燃烧不完全时热值变小，实际热值是燃料属性与燃烧情况无关。
    - 能指出并纠正这一错误：误认为热值大的燃料放出的热量一定多，忽略质量大小。
  aliases:
    - 燃料的热值
  category: 物理概念
  explanation: 燃料完全燃烧放出的热量与燃料的质量之比，称为热值，单位是J/kg。公式Q=mq。
  misconceptions:
    - 误认为燃料燃烧不完全时热值变小，实际热值是燃料属性与燃烧情况无关。
    - 误认为热值大的燃料放出的热量一定多，忽略质量大小。
    - 气体燃料热值单位误用J/kg，应为J/m³。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:热机
  type: Concept
  subject: 物理
  title: 热机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为热机是把机械能转化为内能的装置，实际是把内能转化为机械能。
    - 能指出并纠正这一错误：误认为热机效率可以达到100%，实际存在热量损失。
  aliases:
    - 热力发动机
  category: 物理概念
  explanation: 热机是将燃料燃烧产生的高温高压燃气的内能转化为机械能的装置。
  misconceptions:
    - 误认为热机是把机械能转化为内能的装置，实际是把内能转化为机械能。
    - 误认为热机效率可以达到100%，实际存在热量损失。
    - 误认为热机就是内燃机，忽略蒸汽机等其他热机。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:热量
  type: Concept
  subject: 物理
  title: 热量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为物体温度高含有的热量多，热量是过程量不能‘含有’。
    - 能指出并纠正这一错误：误认为热量单位是℃，实际单位是焦耳。
  aliases:
    - 热量
  category: 物理概念
  explanation: 物体在热传递过程中转移的能量，用符号Q表示，单位是焦耳。
  misconceptions:
    - 误认为物体温度高含有的热量多，热量是过程量不能‘含有’。
    - 误认为热量单位是℃，实际单位是焦耳。
    - 误认为吸收热量温度一定升高，如晶体熔化时吸热温度不变。
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:热量的计算
  type: Concept
  subject: 物理
  title: 热量的计算
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把“温度升高到”误读为温度变化量，如20℃升高到60℃算成Δt=60℃
    - 能指出并纠正这一错误：质量单位未换算，用g直接代入公式Q=cmΔt，导致结果差1000倍
  aliases:
    - 热量公式
  category: 物理规律
  explanation: 热量Q等于比热容c、质量m和温度变化Δt的乘积，即Q=cmΔt。温度升高时吸热，温度降低时放热。
  misconceptions:
    - 把“温度升高到”误读为温度变化量，如20℃升高到60℃算成Δt=60℃
    - 质量单位未换算，用g直接代入公式Q=cmΔt，导致结果差1000倍
    - 误认为物体温度越高含热量越多，忘记热量是过程量
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S3.md
- id: concept:物理:焦点
  type: Concept
  subject: 物理
  title: 焦点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为凹透镜也有实焦点，实际它的焦点是虚焦点，光线不会聚
    - 能指出并纠正这一错误：认为焦点在透镜上，实际焦点在主光轴上，不在透镜上
  aliases: []
  category: 物理概念
  explanation: 凸透镜能使平行于主光轴的光会聚于一点，该点称为焦点，用F表示。
  misconceptions:
    - 认为凹透镜也有实焦点，实际它的焦点是虚焦点，光线不会聚
    - 认为焦点在透镜上，实际焦点在主光轴上，不在透镜上
    - 认为任何光线经过凸透镜后都交于焦点，只有平行主光轴的光才交于焦点
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:焦耳
  type: Concept
  subject: 物理
  title: 焦耳
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为1J=1N/m，把距离单位写成米除以牛
    - 能指出并纠正这一错误：误认为焦耳是功率单位，与瓦特混淆
  aliases: []
  category: 物理单位
  explanation: 功的单位，符号J，1J=1N·m，为纪念英国物理学家焦耳而命名。
  misconceptions:
    - 误认为1J=1N/m，把距离单位写成米除以牛
    - 误认为焦耳是功率单位，与瓦特混淆
    - 误认为1J=1W/s，把瓦特秒写反
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:焦耳定律
  type: Concept
  subject: 物理
  title: 焦耳定律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算电热时直接用Q=UIt，忽略非纯电阻电路中电能部分转化为机械能，导致Q≠W
    - 能指出并纠正这一错误：认为Q与I成正比，错写为Q=IRt，忽略Q=I²Rt中电流的平方关系
  aliases:
    - 焦耳-楞次定律
  category: 物理定律
  explanation: 电流通过导体产生的热量与电流的平方成正比，与导体的电阻成正比，与通电时间成正比，公式为Q=I²Rt。
  misconceptions:
    - 计算电热时直接用Q=UIt，忽略非纯电阻电路中电能部分转化为机械能，导致Q≠W
    - 认为Q与I成正比，错写为Q=IRt，忽略Q=I²Rt中电流的平方关系
    - 计算时未将通电时间单位换算为秒，直接代入小时或分钟
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:焦距
  type: Concept
  subject: 物理
  title: 焦距
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把焦距当成透镜到物体的距离，混淆物距和焦距
    - 能指出并纠正这一错误：认为焦距就是透镜厚度，厚度越大焦距越大
  aliases: []
  category: 物理概念
  explanation: 焦点到光心的距离，用f表示。
  misconceptions:
    - 把焦距当成透镜到物体的距离，混淆物距和焦距
    - 认为焦距就是透镜厚度，厚度越大焦距越大
    - 测量焦距时以透镜边缘为起点，实际应是从光心到焦点距离
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:照相机
  type: Concept
  subject: 物理
  title: 照相机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为照相机成正立缩小的实像，实际是倒立缩小的实像
    - 能指出并纠正这一错误：认为照相机的像距大于二倍焦距，实际像距在一倍焦距和二倍焦距之间
  aliases: []
  category: 光学应用
  explanation: 照相机是利用凸透镜能成缩小实像的原理制成的，镜头相当于一个凸透镜。
  misconceptions:
    - 误以为照相机成正立缩小的实像，实际是倒立缩小的实像
    - 认为照相机的像距大于二倍焦距，实际像距在一倍焦距和二倍焦距之间
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S6.md
- id: concept:物理:熔化
  type: Concept
  subject: 物理
  title: 熔化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非晶体熔化时温度也保持不变，如蜡熔化时温度持续升高却以为不变
    - 能指出并纠正这一错误：把熔化与溶解混淆，如认为食盐溶于水是熔化，实际是溶解
  aliases:
    - 熔解
  category: 物理概念
  explanation: 物质从固态变为液态的过程叫作熔化。
  misconceptions:
    - 认为非晶体熔化时温度也保持不变，如蜡熔化时温度持续升高却以为不变
    - 把熔化与溶解混淆，如认为食盐溶于水是熔化，实际是溶解
    - 认为熔化必须吸热所以温度一定升高，忽略晶体熔化时吸热但温度不变
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:熔断器
  type: Concept
  subject: 物理
  title: 熔断器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：熔丝熔断后用铜丝或铁丝代替，电流过大时无法熔断，失去保护作用
    - 能指出并纠正这一错误：认为熔断器应安装在零线上，实际应接在火线上，换位置后不能有效切断电路
  aliases:
    - 保险丝
  category: 安全用电
  explanation: 含有熔丝的装置，电流过大时熔丝熔断切断电路。
  misconceptions:
    - 熔丝熔断后用铜丝或铁丝代替，电流过大时无法熔断，失去保护作用
    - 认为熔断器应安装在零线上，实际应接在火线上，换位置后不能有效切断电路
    - 认为熔丝越粗越好，熔丝过粗时熔断电流过大，无法保护电路
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:熔点
  type: Concept
  subject: 物理
  title: 熔点
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非晶体也有熔点，如玻璃有确定的熔点，实际上没有
    - 能指出并纠正这一错误：认为晶体达到熔点就立即全部熔化，忽略还需继续吸热，如0℃冰不吸热不会熔化
  aliases: []
  category: 物理概念
  explanation: 晶体熔化时的温度。
  misconceptions:
    - 认为非晶体也有熔点，如玻璃有确定的熔点，实际上没有
    - 认为晶体达到熔点就立即全部熔化，忽略还需继续吸热，如0℃冰不吸热不会熔化
    - 认为同种晶体的熔点与凝固点不同，如误认为冰的熔点是0℃而凝固点是-10℃
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:燃料完全燃烧放热公式
  type: Concept
  subject: 物理
  title: 燃料完全燃烧放热公式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算时误把热值单位J/m3与J/kg等同，气体燃料用体积时质量代错
    - 能指出并纠正这一错误：误以为燃料质量越大热值越大，认为热值与质量有关
  aliases:
    - Q=mq
  category: 物理规律
  explanation: 质量为m的燃料完全燃烧放出的热量Q放=mq，其中q为燃料的热值。
  misconceptions:
    - 计算时误把热值单位J/m3与J/kg等同，气体燃料用体积时质量代错
    - 误以为燃料质量越大热值越大，认为热值与质量有关
    - 未注意“完全燃烧”条件，用实际放热量套公式，认为Q=mq就是实际放热
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:牛顿第一定律
  type: Concept
  subject: 物理
  title: 牛顿第一定律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为没有外力时物体一定静止，也可能匀速直线运动。
    - 能指出并纠正这一错误：认为该定律可直接由实验验证，实际是理想实验推理。
  aliases:
    - 惯性定律
  category: 物理定律
  explanation: 一切物体在没有受到外力作用的时候，总保持静止状态或匀速直线运动状态。
  misconceptions:
    - 认为没有外力时物体一定静止，也可能匀速直线运动。
    - 认为该定律可直接由实验验证，实际是理想实验推理。
    - 认为力是维持运动的原因，与定律内容相悖。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:物体的浮沉条件
  type: Concept
  subject: 物理
  title: 物体的浮沉条件
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为漂浮时浮力大于重力，实际漂浮时浮力等于重力，只是物体部分露出液面。
    - 能指出并纠正这一错误：误以为悬浮时浮力小于重力，实际悬浮时浮力等于重力，物体可停在液体任意深度。
  aliases: []
  category: 物理规律
  explanation: 浸在液体中的物体，当浮力大于重力时上浮，浮力小于重力时下沉，浮力等于重力时漂浮或悬浮。
  misconceptions:
    - 认为漂浮时浮力大于重力，实际漂浮时浮力等于重力，只是物体部分露出液面。
    - 误以为悬浮时浮力小于重力，实际悬浮时浮力等于重力，物体可停在液体任意深度。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:物理学
  type: Concept
  subject: 物理
  title: 物理学
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为物理学只研究宏观物体，不包括声音、光等微观或抽象内容
  aliases: []
  category: 学科定义
  explanation: 物理学是自然科学领域的一门基础学科，与日常生活和社会发展息息相关。
  misconceptions:
    - 认为物理学只是背公式解题，与日常生活现象毫无关联
    - 误认为物理学只研究宏观物体，不包括声音、光等微观或抽象内容
    - 认为物理学习只需记忆结论，不需要动手实验和思考
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:物质的三态
  type: Concept
  subject: 物理
  title: 物质的三态
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为水蒸气是白色可见的，把'白气'误认为水蒸气
    - 能指出并纠正这一错误：认为所有固态物质都坚硬，把较软的蜡归为液体
  aliases:
    - 三态
    - 物态
  category: 物态
  explanation: 物质通常有固态、液态、气态三种状态，不同状态下的物质具有不同的形状和体积特征。
  misconceptions:
    - 认为水蒸气是白色可见的，把'白气'误认为水蒸气
    - 认为所有固态物质都坚硬，把较软的蜡归为液体
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S4.md
- id: concept:物理:物质的物理属性
  type: Concept
  subject: 物理
  title: 物质的物理属性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为物质物理属性只有密度和硬度，忽略导热性、导电性等
    - 能指出并纠正这一错误：认为同种物质状态变化后物理属性不变，如冰和水的硬度不同
  aliases:
    - 物理属性
  category: 物理概念
  explanation: 物质的物理属性包括密度、硬度、导热性、导电性、延展性等，不同物质属性不同，可用于鉴别物质和选择材料。
  misconceptions:
    - 认为物质物理属性只有密度和硬度，忽略导热性、导电性等
    - 认为同种物质状态变化后物理属性不变，如冰和水的硬度不同
    - 将导电性与导热性混为一谈，认为导电好的物质导热一定好
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:物距
  type: Concept
  subject: 物理
  title: 物距
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：测量物距时从物体量到透镜边缘，应量到光心
    - 能指出并纠正这一错误：误把物距当成像距，导致判断成像规律出错
  aliases: []
  category: 物理概念
  explanation: 物体到透镜的距离，用u表示。
  misconceptions:
    - 测量物距时从物体量到透镜边缘，应量到光心
    - 误把物距当成像距，导致判断成像规律出错
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S5.md
- id: concept:物理:用电器
  type: Concept
  subject: 物理
  title: 用电器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把开关、导线当作用电器，误认为电流流过的元件都消耗电能
    - 能指出并纠正这一错误：误以为用电器是提供电能的装置，将用电器和电源的功能混淆
  aliases: []
  category: 物理概念
  explanation: 用电器是利用电能工作的装置，它与电源连接后，可以将电能转化为我们需要的能。
  misconceptions:
    - 把开关、导线当作用电器，误认为电流流过的元件都消耗电能
    - 误以为用电器是提供电能的装置，将用电器和电源的功能混淆
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:电光转换技术
  type: Concept
  subject: 物理
  title: 电光转换技术
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把电光转换理解为将光信号变为电信号，方向搞反。
    - 能指出并纠正这一错误：认为光纤中直接传输电流，而不是光信号。
  aliases: []
  category: 技术
  explanation: 将电信号转变为光信号的技术，用于光纤通信的发送端。
  misconceptions:
    - 把电光转换理解为将光信号变为电信号，方向搞反。
    - 认为光纤中直接传输电流，而不是光信号。
    - 认为电光转换技术用于光纤通信的接收端。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:电功
  type: Concept
  subject: 物理
  title: 电功
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将1kW·h换算为J时误认为等于3.6×10³J，正确为3.6×10⁶J
    - 能指出并纠正这一错误：计算W=UIt时，电压电流用国际单位，时间用小时，直接相乘导致单位混乱
  aliases:
    - 电流做功
  category: 物理概念
  explanation: 电流所做的功叫做电功，电功的公式为W=UIt，单位是焦耳（J），常用单位是千瓦时（kW·h）。
  misconceptions:
    - 将1kW·h换算为J时误认为等于3.6×10³J，正确为3.6×10⁶J
    - 计算W=UIt时，电压电流用国际单位，时间用小时，直接相乘导致单位混乱
    - 误认为电功是描述电流做功快慢的物理量，实际电功率才描述快慢
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S5.md
- id: concept:物理:电功率
  type: Concept
  subject: 物理
  title: 电功率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电功率越大，用电器消耗电能越多，忽略时间，如100W灯泡一定比20W灯泡耗电多
    - 能指出并纠正这一错误：在非纯电阻电路（如电动机）中滥用P=U²/R计算电功率，该式只适用于纯电阻电路
  aliases:
    - 功率
  category: 物理概念
  explanation: 电功率是描述电流做功快慢的物理量，定义式为P=W/t，计算式为P=UI，单位是瓦特（W）。
  misconceptions:
    - 认为电功率越大，用电器消耗电能越多，忽略时间，如100W灯泡一定比20W灯泡耗电多
    - 在非纯电阻电路（如电动机）中滥用P=U²/R计算电功率，该式只适用于纯电阻电路
    - 将功率单位kW与电功单位kW·h混淆，kW·h不是功率单位
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:电动机
  type: Concept
  subject: 物理
  title: 电动机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为电动机的工作原理是电磁感应，实际是通电线圈在磁场中受力转动。
    - 能指出并纠正这一错误：误认为电动机工作时将机械能转化为电能，实际是电能转化为机械能。
  aliases:
    - motor
  category: 电器设备
  explanation: 电动机是利用通电线圈在磁场中受力转动的原理制成的。
  misconceptions:
    - 误认为电动机的工作原理是电磁感应，实际是通电线圈在磁场中受力转动。
    - 误认为电动机工作时将机械能转化为电能，实际是电能转化为机械能。
    - 将电动机与发电机混淆，认为电动机也能用来发电。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S3.md
- id: concept:物理:电压
  type: Concept
  subject: 物理
  title: 电压
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把电压当成电流，说‘电压从正极流向负极’
    - 能指出并纠正这一错误：单位换算错误，如1kV=100V（应为1000V）
  aliases:
    - voltage
  category: 物理概念
  explanation: 电路中形成电流的原因，用字母U表示，单位是伏特（V）。
  misconceptions:
    - 把电压当成电流，说‘电压从正极流向负极’
    - 单位换算错误，如1kV=100V（应为1000V）
    - 认为有电压就一定有电流，忽略还需要通路
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:电压表
  type: Concept
  subject: 物理
  title: 电压表
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将电压表串联在电路中，导致电路近乎断路，用电器不工作
    - 能指出并纠正这一错误：正负接线柱接反，指针反向偏转，可能损坏电表
  aliases:
    - voltmeter
  category: 物理概念
  explanation: 测量电路两端电压的仪表，使用时必须与待测电路并联。
  misconceptions:
    - 将电压表串联在电路中，导致电路近乎断路，用电器不工作
    - 正负接线柱接反，指针反向偏转，可能损坏电表
    - 读数时按电流表刻度读，或读错量程（如选0~3V却按0~15V读数）
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:电子
  type: Concept
  subject: 物理
  title: 电子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电子带正电，导致电荷正负判断错误。
    - 能指出并纠正这一错误：误认为电子是原子核的组成部分，实际上原子核由质子和中子组成。
  aliases: []
  category: 物理粒子
  explanation: 电子是比原子小得多的带负电荷的粒子，汤姆孙发现电子，说明原子可分。
  misconceptions:
    - 认为电子带正电，导致电荷正负判断错误。
    - 误认为电子是原子核的组成部分，实际上原子核由质子和中子组成。
    - 认为电子体积比原子大，实际上电子是比原子小得多的粒子。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:电池与环境保护
  type: Concept
  subject: 物理
  title: 电池与环境保护
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有电池都是环保电池，随意丢弃
    - 能指出并纠正这一错误：把废旧电池当作普通垃圾投放
  aliases:
    - 废电池污染
  category: 物理与社会
  explanation: 电池对环境有污染，我国颁布了废电池污染防治的相关政策和法规，促进电池生产改进工艺，研发新型电池。
  misconceptions:
    - 认为所有电池都是环保电池，随意丢弃
    - 把废旧电池当作普通垃圾投放
    - 认为电池生产改进与环境保护无关
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:电池的环境污染
  type: Concept
  subject: 物理
  title: 电池的环境污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电池没电后就不会再污染环境
    - 能指出并纠正这一错误：将废电池埋入土中，认为可自然降解无害
  aliases:
    - 电池污染
  category: 环境保护
  explanation: 废旧电池含有有害物质，随意丢弃会污染环境，需要回收处理并研发新型环保电池。
  misconceptions:
    - 认为电池没电后就不会再污染环境
    - 将废电池埋入土中，认为可自然降解无害
    - 只看到电池外壳，认为内部有害物质不会泄漏
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:电流
  type: Concept
  subject: 物理
  title: 电流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电流方向与自由电子定向移动方向相同（实际相反）
    - 能指出并纠正这一错误：单位换算错误，如1A=100mA（应为1000mA）
  aliases:
    - 电流强度
  category: 物理概念
  explanation: 表示电流大小的物理量，用字母I表示，单位是安培（A）。
  misconceptions:
    - 认为电流方向与自由电子定向移动方向相同（实际相反）
    - 单位换算错误，如1A=100mA（应为1000mA）
    - 认为电流是‘电荷的多少’，而不是‘每秒通过的电量’
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S3.md
- id: concept:物理:电流的热效应
  type: Concept
  subject: 物理
  title: 电流的热效应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有电阻大的导体才有热效应，实际任何导体（除超导体外）通电时都有热效应
    - 能指出并纠正这一错误：认为电流的热效应与电流方向有关，实际热效应与电流方向无关
  aliases:
    - 焦耳热效应
    - 电流热效应
    - 焦耳效应
  category: 物理现象
  explanation: 导体中有电流通过时会发热，电能转化为内能，这种现象称为电流的热效应。
  misconceptions:
    - 认为只有电阻大的导体才有热效应，实际任何导体（除超导体外）通电时都有热效应
    - 认为电流的热效应与电流方向有关，实际热效应与电流方向无关
    - 将电风扇当作利用电流热效应的设备，它主要将电能转化为机械能，热效应是次要的
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:电流的磁效应
  type: Concept
  subject: 物理
  title: 电流的磁效应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为通电导线周围磁场方向固定不变，改变电流方向后磁场方向不改变
    - 能指出并纠正这一错误：认为断电后通电导线周围仍有剩磁，实际电流消失磁场立即消失
  aliases:
    - 奥斯特实验
  category: 物理规律
  explanation: 通电导线周围存在磁场，其方向与电流方向有关，这一现象称为电流的磁效应，由奥斯特首先发现。
  misconceptions:
    - 认为通电导线周围磁场方向固定不变，改变电流方向后磁场方向不改变
    - 认为断电后通电导线周围仍有剩磁，实际电流消失磁场立即消失
    - 认为只有通电螺线管才有磁效应，单根通电导线周围不存在磁场
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:电流表
  type: Concept
  subject: 物理
  title: 电流表
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将电流表并联在电路中，烧坏电流表或电源
    - 能指出并纠正这一错误：正负接线柱接反，指针反向偏转
  aliases:
    - ammeter
  category: 物理概念
  explanation: 测量电路中电流大小的仪表，使用时必须串联在电路中，且电流从正接线柱流入。
  misconceptions:
    - 将电流表并联在电路中，烧坏电流表或电源
    - 正负接线柱接反，指针反向偏转
    - 把电流表直接接在电源两极上测短路电流
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S3.md
- id: concept:物理:电源
  type: Concept
  subject: 物理
  title: 电源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电源是制造电荷的装置，忽略电源是把其他能转化为电能
    - 能指出并纠正这一错误：误将电源当成消耗电能的用电器，如说电池是“用电的”
  aliases:
    - power supply
  category: 物理概念
  explanation: 电源是能持续供电的装置，从能量转化的角度看，电源通常是指把其他形式的能量转化为电能的装置。
  misconceptions:
    - 认为电源是制造电荷的装置，忽略电源是把其他能转化为电能
    - 误将电源当成消耗电能的用电器，如说电池是“用电的”
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:电热
  type: Concept
  subject: 物理
  title: 电热
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电流通过用电器做的功一定等于产生的热量，实际上非纯电阻电路中W>Q
    - 能指出并纠正这一错误：在电压一定时，认为电阻越大电热越多，但Q=U²t/R，电阻越大电热反而越小
  aliases:
    - 焦耳热
  category: 物理概念
  explanation: 电流通过导体时产生的热量，是电能转化为内能的过程。
  misconceptions:
    - 认为电流通过用电器做的功一定等于产生的热量，实际上非纯电阻电路中W>Q
    - 在电压一定时，认为电阻越大电热越多，但Q=U²t/R，电阻越大电热反而越小
    - 混淆Q=I²Rt和W=UIt，认为在任何电路中Q=W，忽略了额外能量转化
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:电热器
  type: Concept
  subject: 物理
  title: 电热器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为所有工作时发热的用电器都是电热器，如电脑、电视，它们不是利用热效应工作的
    - 能指出并纠正这一错误：认为电热器工作时电能转化为内能和机械能，实际电热器是纯电阻设备，电能全部转化为内能
  aliases:
    - 电加热器
  category: 电器设备
  explanation: 利用电流热效应工作的设备，将电能转化为内能。
  misconceptions:
    - 认为所有工作时发热的用电器都是电热器，如电脑、电视，它们不是利用热效应工作的
    - 认为电热器工作时电能转化为内能和机械能，实际电热器是纯电阻设备，电能全部转化为内能
    - 误以为电热器的电阻越大，在额定电压下发热功率越大，实际P=U²/R，电阻越大功率越小
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:电磁屏蔽
  type: Concept
  subject: 物理
  title: 电磁屏蔽
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为开有小孔的金属盒也能完全屏蔽电磁波，实际上必须密闭。
    - 能指出并纠正这一错误：把电磁屏蔽理解为金属将电磁波吸收掉，实则是反射或阻挡。
  aliases: []
  category: 物理现象
  explanation: 用金属等材料制成的密闭容器对电磁波有屏蔽作用，使电磁波无法穿透。
  misconceptions:
    - 认为开有小孔的金属盒也能完全屏蔽电磁波，实际上必须密闭。
    - 把电磁屏蔽理解为金属将电磁波吸收掉，实则是反射或阻挡。
    - 认为塑料外壳也能有效屏蔽电磁波，只有金属等导体才行。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:电磁感应
  type: Concept
  subject: 物理
  title: 电磁感应
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要导体在磁场中运动就能产生感应电流，忽略必须闭合电路且切割磁感线
    - 能指出并纠正这一错误：认为感应电流方向只由磁场方向决定，与导体运动方向无关
  aliases:
    - 磁生电
  category: 物理概念
  explanation: 利用磁场产生电流的现象叫电磁感应，产生的电流叫感应电流。
  misconceptions:
    - 认为只要导体在磁场中运动就能产生感应电流，忽略必须闭合电路且切割磁感线
    - 认为感应电流方向只由磁场方向决定，与导体运动方向无关
    - 认为电磁感应现象是奥斯特发现的，实际是法拉第发现的
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S4.md
- id: concept:物理:电磁污染
  type: Concept
  subject: 物理
  title: 电磁污染
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要有电磁波辐射就会造成污染，忽略剂量大小。
    - 能指出并纠正这一错误：把电磁污染等同于电磁波在环境中残留，像化学污染一样。
  aliases: []
  category: 环境问题
  explanation: 电磁波过度应用可能对人体健康造成危害，如扰乱生理节律等。
  misconceptions:
    - 认为只要有电磁波辐射就会造成污染，忽略剂量大小。
    - 把电磁污染等同于电磁波在环境中残留，像化学污染一样。
    - 认为手机辐射一定导致癌症，缺乏科学依据但学生信谣言。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S2.md
- id: concept:物理:电磁波
  type: Concept
  subject: 物理
  title: 电磁波
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电磁波不能在真空中传播，与声波混淆。
    - 能指出并纠正这一错误：把电磁波传播速度记成340 m/s，即声速。
  aliases:
    - 电磁辐射
  category: 物理概念
  explanation: 电磁场在空间中的传播，能在真空中传播，速度约为3×10^8 m/s。
  misconceptions:
    - 认为电磁波不能在真空中传播，与声波混淆。
    - 把电磁波传播速度记成340 m/s，即声速。
    - 认为电磁波在所有介质中传播速度都等于3×10^8 m/s。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:电磁波谱
  type: Concept
  subject: 物理
  title: 电磁波谱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为无线电波的频率比可见光高，实际无线电波波长更长频率更低。
    - 能指出并纠正这一错误：把电磁波谱顺序记反，如将γ射线排在波长最长一侧。
  aliases: []
  category: 物理概念
  explanation: 按波长（或频率）连续排列的电磁波序列，包括无线电波、红外线、可见光、紫外线、X射线、γ射线等。
  misconceptions:
    - 认为无线电波的频率比可见光高，实际无线电波波长更长频率更低。
    - 把电磁波谱顺序记反，如将γ射线排在波长最长一侧。
    - 认为电磁波谱中各波段是相互独立、不连续的。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S2.md
- id: concept:物理:电磁继电器
  type: Concept
  subject: 物理
  title: 电磁继电器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电磁继电器的控制电路和受控电路是连通的，二者之间有导线直接连接
    - 能指出并纠正这一错误：认为电磁铁断电后衔铁仍被吸引，受控电路仍保持接通状态
  aliases: []
  category: 物理概念
  explanation: 利用电磁铁控制电路的开关，由控制电路和受控电路组成，可实现低电压控制高电压、远程控制等。
  misconceptions:
    - 认为电磁继电器的控制电路和受控电路是连通的，二者之间有导线直接连接
    - 认为电磁铁断电后衔铁仍被吸引，受控电路仍保持接通状态
    - 认为电磁继电器只能低压控制高压，不能用于高压控制低压或同压控制
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:电磁铁
  type: Concept
  subject: 物理
  title: 电磁铁
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电磁铁磁性强弱只与电流大小有关，与线圈匝数无关
    - 能指出并纠正这一错误：认为电磁铁断电后磁性不会消失，铁芯会保留磁性
  aliases: []
  category: 物理概念
  explanation: 由线圈和铁芯组成，通电后产生磁性，磁性强弱与线圈匝数和电流大小有关，可通过通断电控制磁性有无。
  misconceptions:
    - 认为电磁铁磁性强弱只与电流大小有关，与线圈匝数无关
    - 认为电磁铁断电后磁性不会消失，铁芯会保留磁性
    - 认为电磁铁铁芯用钢制成效果更好，实际应用软铁以便断电消磁
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:电能
  type: Concept
  subject: 物理
  title: 电能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把瓦特当作电能的单位，混淆功率和能量。
    - 能指出并纠正这一错误：误算1千瓦时=3.6×10^3焦耳，正确为3.6×10^6焦耳。
  aliases:
    - electric energy
  category: 物理量
  explanation: 电能是电做功的能力，单位是焦耳或千瓦时。
  misconceptions:
    - 误把瓦特当作电能的单位，混淆功率和能量。
    - 误算1千瓦时=3.6×10^3焦耳，正确为3.6×10^6焦耳。
    - 认为电能只能用于发热，忽略其他形式的能量转化。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:电荷间的相互作用
  type: Concept
  subject: 物理
  title: 电荷间的相互作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为同种电荷相互吸引，异种电荷相互排斥。
    - 能指出并纠正这一错误：认为两个带电体不接触就不会有相互作用力，忽略电荷之间的力是非接触力。
  aliases: []
  category: 物理规律
  explanation: 同种电荷相互排斥，异种电荷相互吸引。
  misconceptions:
    - 误认为同种电荷相互吸引，异种电荷相互排斥。
    - 认为两个带电体不接触就不会有相互作用力，忽略电荷之间的力是非接触力。
    - 误认为电荷间作用力大小只与电荷量有关，与距离无关。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:电路
  type: Concept
  subject: 物理
  title: 电路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为短路时用电器仍然工作，只是电流更大
    - 能指出并纠正这一错误：认为电路中必须有开关才能形成通路
  aliases:
    - electric circuit
  category: 物理概念
  explanation: 用导线把电源、用电器、开关等元件连接起来组成的电流的路径称为电路。
  misconceptions:
    - 认为短路时用电器仍然工作，只是电流更大
    - 认为电路中必须有开关才能形成通路
    - 把断路当成短路，说‘断路时用电器可能被烧坏’
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:电路图
  type: Concept
  subject: 物理
  title: 电路图
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：电池符号长线为正极，画成短线为正极
    - 能指出并纠正这一错误：导线交叉相连处不打点，使电路连接关系不明
  aliases: []
  category: 物理概念
  explanation: 用电路元件符号表示电路连接的图称为电路图。
  misconceptions:
    - 电池符号长线为正极，画成短线为正极
    - 导线交叉相连处不打点，使电路连接关系不明
    - 将电路图画成实物图，元件符号写生
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:电路连接注意事项
  type: Concept
  subject: 物理
  title: 电路连接注意事项
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：连接电路时开关未断开就开始接线，导致短路损坏电源
    - 能指出并纠正这一错误：误认为短路只是烧坏电源，不知道会烧毁导线和仪表，甚至火灾
  aliases:
    - 连接电路注意事项
  category: 实验操作规范
  explanation: 连接电路时开关必须断开，导线要接牢，且不能将电源两极直接相连，以防损坏电源。
  misconceptions:
    - 连接电路时开关未断开就开始接线，导致短路损坏电源
    - 误认为短路只是烧坏电源，不知道会烧毁导线和仪表，甚至火灾
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:电阻
  type: Concept
  subject: 物理
  title: 电阻
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为电流越大电阻越小，电阻与电流成反比
    - 能指出并纠正这一错误：单位换算错误，如1kΩ=100Ω（应为1000Ω）
  aliases:
    - resistance
  category: 物理概念
  explanation: 电阻表示导体对电流的阻碍作用，导体的电阻越大，对电流的阻碍作用就越大。
  misconceptions:
    - 认为电流越大电阻越小，电阻与电流成反比
    - 单位换算错误，如1kΩ=100Ω（应为1000Ω）
    - 认为电阻随电压增大而增大，忽略电阻是导体本身属性
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:电阻单位及换算
  type: Concept
  subject: 物理
  title: 电阻单位及换算
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为1kΩ=100Ω，把千欧进率当成10²
    - 能指出并纠正这一错误：换算时只换数字不换单位，如0.5kΩ误写为0.5Ω
  aliases:
    - 电阻的单位
    - 欧姆
    - Ω
  category: 物理单位
  explanation: 电阻的国际单位是欧姆（Ω），常用单位有千欧（kΩ）和兆欧（MΩ），换算关系为1 MΩ=10³ kΩ，1 kΩ=10³ Ω。
  misconceptions:
    - 误以为1kΩ=100Ω，把千欧进率当成10²
    - 换算时只换数字不换单位，如0.5kΩ误写为0.5Ω
    - 误以为1MΩ=10⁶kΩ，实际1MΩ=10³kΩ
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:电阻是导体的一种属性
  type: Concept
  subject: 物理
  title: 电阻是导体的一种属性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为由R=U/I可知电阻随电压成正比、随电流成反比，忽略了R由材料决定
    - 能指出并纠正这一错误：误以为导体电阻只和材料有关，忘了长度、横截面积和温度也影响
  aliases: []
  category: 物理概念
  explanation: 电阻是导体本身的一种性质，其大小由导体的材料、长度、横截面积和温度决定，与电压和电流无关。
  misconceptions:
    - 误认为由R=U/I可知电阻随电压成正比、随电流成反比，忽略了R由材料决定
    - 误以为导体电阻只和材料有关，忘了长度、横截面积和温度也影响
    - 误认为同一导体电阻恒定，加热后电阻变化仍认为不变
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S5.md
- id: concept:物理:电阻箱
  type: Concept
  subject: 物理
  title: 电阻箱
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为电阻箱和滑动变阻器一样能连续改变电阻，实际只能按挡位跳跃变化
    - 能指出并纠正这一错误：读数时误将各旋钮数值相乘，实际应将各挡指示值相加
  aliases: []
  category: 电路元件
  explanation: 一种可以调节接入电路电阻值并能直接读出阻值的变阻器。
  misconceptions:
    - 误以为电阻箱和滑动变阻器一样能连续改变电阻，实际只能按挡位跳跃变化
    - 读数时误将各旋钮数值相乘，实际应将各挡指示值相加
    - 误以为电阻箱需要估读，实际其读数精确到固定挡位，不需要估读
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:白光组成
  type: Concept
  subject: 物理
  title: 白光组成
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为白光是一种单色光，因为看起来没有颜色。
    - 能指出并纠正这一错误：认为白光只由红、绿、蓝三种色光混合而成，忽略了其他色光。
  aliases:
    - 太阳光组成
  category: 物理概念
  explanation: 太阳光（白光）是由多种色光混合而成的，通过色散实验可以证实。
  misconceptions:
    - 认为白光是一种单色光，因为看起来没有颜色。
    - 认为白光只由红、绿、蓝三种色光混合而成，忽略了其他色光。
    - 认为白光只由七种色光组成，实际上七种只是典型代表，白光包含连续光谱。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S3.md
- id: concept:物理:直流电动机
  type: Concept
  subject: 物理
  title: 直流电动机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为直流电动机将机械能转化为电能，与发电机的工作原理混淆
    - 能指出并纠正这一错误：认为直流电动机是利用电磁感应原理工作的，实际是利用通电线圈在磁场中受力转动
  aliases: []
  category: 物理概念
  explanation: 直流电动机是利用通电线圈在磁场中受力转动的原理制成的，将电能转化为机械能。
  misconceptions:
    - 认为直流电动机将机械能转化为电能，与发电机的工作原理混淆
    - 认为直流电动机是利用电磁感应原理工作的，实际是利用通电线圈在磁场中受力转动
    - 认为换向器在线圈处于平衡位置时改变电流方向，实际是刚转过平衡位置时改变
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S3.md
- id: concept:物理:直流电动机的原理
  type: Concept
  subject: 物理
  title: 直流电动机的原理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为线圈在平衡位置时受力最大，实际受力为零，靠惯性通过平衡位置
    - 能指出并纠正这一错误：认为换向器每转一圈只改变一次电流方向，实际每转一圈改变两次
  aliases:
    - 直流电动机原理
  category: 物理概念
  explanation: 通电线圈在磁场中受力转动，利用换向器改变电流方向使线圈持续转动。
  misconceptions:
    - 认为线圈在平衡位置时受力最大，实际受力为零，靠惯性通过平衡位置
    - 认为换向器每转一圈只改变一次电流方向，实际每转一圈改变两次
    - 认为线圈转动方向只由电流方向决定，与磁场方向无关
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S3.md
- id: concept:物理:直线运动
  type: Concept
  subject: 物理
  title: 直线运动
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误把“沿直线运动”等同于“匀速直线运动”，忽略速度是否变化。
    - 能指出并纠正这一错误：认为直线运动的速度一定不变，而变速直线运动也是直线运动。
  aliases: []
  category: 运动分类
  explanation: 按运动路径的曲直，物体的运动可分为直线运动和曲线运动。
  misconceptions:
    - 误把“沿直线运动”等同于“匀速直线运动”，忽略速度是否变化。
    - 认为直线运动的速度一定不变，而变速直线运动也是直线运动。
    - 认为直线运动速度方向始终不变，忽略沿直线折返时方向会反向。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:省力杠杆
  type: Concept
  subject: 物理
  title: 省力杠杆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为省力杠杆既可以省力又省距离，实际省力必费距离
    - 能指出并纠正这一错误：把费力杠杆当成省力杠杆，如镊子，使用时动力臂小于阻力臂但误以为省力
  aliases: []
  category: 杠杆分类
  explanation: 动力臂大于阻力臂的杠杆，使用时动力小于阻力，省力但费距离。
  misconceptions:
    - 误认为省力杠杆既可以省力又省距离，实际省力必费距离
    - 把费力杠杆当成省力杠杆，如镊子，使用时动力臂小于阻力臂但误以为省力
    - 误认为省力杠杆能省功，实际任何简单机械都不省功
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:眼球
  type: Concept
  subject: 物理
  title: 眼球
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为眼睛靠改变像距来看清远近物体，实际靠调节晶状体焦距
    - 能指出并纠正这一错误：认为视网膜上成的是正立的像，实际是倒立缩小的实像
  aliases:
    - 眼睛
  category: 光学应用
  explanation: 人的眼球像一架照相机，晶状体相当于镜头，视网膜相当于感光器件，通过调节晶状体的焦距使物体成像在视网膜上。
  misconceptions:
    - 误以为眼睛靠改变像距来看清远近物体，实际靠调节晶状体焦距
    - 认为视网膜上成的是正立的像，实际是倒立缩小的实像
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:眼镜度数
  type: Concept
  subject: 物理
  title: 眼镜度数
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算眼镜度数时忘记将焦距换算成米，直接用厘米导致结果错百倍
    - 能指出并纠正这一错误：误认为近视镜是凸透镜，实际是凹透镜
  aliases:
    - 镜片度数
  category: 光学应用
  explanation: 眼镜的度数等于镜片焦距（以米为单位）倒数的100倍，远视镜片度数为正，近视镜片度数为负。
  misconceptions:
    - 计算眼镜度数时忘记将焦距换算成米，直接用厘米导致结果错百倍
    - 误认为近视镜是凸透镜，实际是凹透镜
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:短路
  type: Concept
  subject: 物理
  title: 短路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为短路时用电器仍能正常工作，只是电源发热
    - 能指出并纠正这一错误：认为短路就是电路中没有电流，实际电流很大
  aliases: []
  category: 物理概念
  explanation: 不经过用电器，用导线直接将电源两极相连的状态称为短路，会损坏电源甚至引发火灾。
  misconceptions:
    - 认为短路时用电器仍能正常工作，只是电源发热
    - 认为短路就是电路中没有电流，实际电流很大
    - 将电源短路误认为只是电源损坏，不会引发火灾
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:硬度
  type: Concept
  subject: 物理
  title: 硬度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为硬度大就是抗压抗敲击能力强，金刚石硬度大但脆，易被敲碎
    - 能指出并纠正这一错误：用钢针划玻璃判断硬度，实际玻璃硬度大于钢针，应使用金刚石
  aliases: []
  category: 物理属性
  explanation: 硬度是物质抵抗划刻或压入的能力，金刚石硬度大，可用于切割玻璃。
  misconceptions:
    - 认为硬度大就是抗压抗敲击能力强，金刚石硬度大但脆，易被敲碎
    - 用钢针划玻璃判断硬度，实际玻璃硬度大于钢针，应使用金刚石
    - 认为密度大的物质硬度一定大，如铅比金刚石密度大但硬度小
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S1.md
- id: concept:物理:碳中和
  type: Concept
  subject: 物理
  title: 碳中和
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为碳中和就是完全不排放二氧化碳。
    - 能指出并纠正这一错误：误认为碳中和仅靠植树造林即可，无需减少排放。
  aliases: []
  category: 环境概念
  explanation: 通过植树造林、节能减排等方式抵消人为产生的二氧化碳，实现净零排放，我国争取2060年前实现。
  misconceptions:
    - 误以为碳中和就是完全不排放二氧化碳。
    - 误认为碳中和仅靠植树造林即可，无需减少排放。
    - 将碳达峰和碳中和混为一谈，认为实现碳中和后就不再排放。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:碳达峰
  type: Concept
  subject: 物理
  title: 碳达峰
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为碳达峰是二氧化碳排放量达到峰值后急剧降至零。
    - 能指出并纠正这一错误：误认为碳达峰后排放量保持不变。
  aliases: []
  category: 环境概念
  explanation: 二氧化碳年排放总量在某时期达到历史最高值后逐步降低，我国力争2030年前实现。
  misconceptions:
    - 误以为碳达峰是二氧化碳排放量达到峰值后急剧降至零。
    - 误认为碳达峰后排放量保持不变。
    - 误以为我国已实现碳达峰，实际力争2030年前实现。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:磁体
  type: Concept
  subject: 物理
  title: 磁体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为将条形磁体摔断后每一段只有一个磁极，实际每段仍有N、S两个磁极
    - 能指出并纠正这一错误：认为磁体只有一个磁极，磁极可以单独存在，实际磁极总是成对出现
  aliases:
    - 磁铁
  category: 物理概念
  explanation: 具有磁性的物体称为磁体，磁体上磁性最强的部位称为磁极。
  misconceptions:
    - 认为将条形磁体摔断后每一段只有一个磁极，实际每段仍有N、S两个磁极
    - 认为磁体只有一个磁极，磁极可以单独存在，实际磁极总是成对出现
    - 认为磁体内部没有磁极，实际上磁体内部也有磁极但作用相互抵消
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:磁化
  type: Concept
  subject: 物理
  title: 磁化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为铜、铝等金属也能被磁化，实际只有铁、钴、镍等铁磁性物质能被磁化
    - 能指出并纠正这一错误：认为被磁化的物体磁性永久保留，不知道软磁体磁场消失后磁性也随之消失
  aliases: []
  category: 物理概念
  explanation: 使原来不显磁性的物体在磁场中获得磁性的过程。
  misconceptions:
    - 认为铜、铝等金属也能被磁化，实际只有铁、钴、镍等铁磁性物质能被磁化
    - 认为被磁化的物体磁性永久保留，不知道软磁体磁场消失后磁性也随之消失
    - 认为磁化过程使物体带上电荷，实际磁化是磁畴有序排列，与电荷无关
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:磁场
  type: Concept
  subject: 物理
  title: 磁场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为磁场是假想的，实际磁场是真实存在的特殊物质
    - 能指出并纠正这一错误：认为只有磁体周围存在磁场，通电导线周围没有磁场
  aliases: []
  category: 物理概念
  explanation: 磁体周围存在的一种特殊物质，对放入其中的磁体产生力的作用。
  misconceptions:
    - 认为磁场是假想的，实际磁场是真实存在的特殊物质
    - 认为只有磁体周围存在磁场，通电导线周围没有磁场
    - 认为磁场只对磁体有作用力，对铁钴镍等没有作用力
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:磁场对电流的作用
  type: Concept
  subject: 物理
  title: 磁场对电流的作用
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为通电导体在磁场中一定受力，当导体与磁感线平行时实际不受力
    - 能指出并纠正这一错误：认为通电导体受力的方向仅由电流方向决定，忽略磁场方向的影响
  aliases: []
  category: 物理规律
  explanation: 磁场对通电导体有力的作用，力的方向与电流方向和磁场方向有关。
  misconceptions:
    - 认为通电导体在磁场中一定受力，当导体与磁感线平行时实际不受力
    - 认为通电导体受力的方向仅由电流方向决定，忽略磁场方向的影响
    - 判断受力方向时错用右手定则，应用左手定则，导致方向判断相反
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S3.md
- id: concept:物理:磁场方向
  type: Concept
  subject: 物理
  title: 磁场方向
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为磁场方向是小磁针S极所指的方向，实际是N极所指方向
    - 能指出并纠正这一错误：认为磁场方向沿磁感线弯曲方向，实际上为该点磁感线切线方向
  aliases: []
  category: 物理概念
  explanation: 磁场中某点磁场方向规定为小磁针在该点静止时N极所指的方向。
  misconceptions:
    - 认为磁场方向是小磁针S极所指的方向，实际是N极所指方向
    - 认为磁场方向沿磁感线弯曲方向，实际上为该点磁感线切线方向
    - 认为磁场中某点放入不同小磁针，N极指向会不同，实际指向相同
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:磁性
  type: Concept
  subject: 物理
  title: 磁性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为磁铁能吸引所有金属，如铝、铜、金，实际上只能吸引铁、钴、镍等铁磁性物质
    - 能指出并纠正这一错误：认为磁性的本质是物体带电，磁铁吸引铁是因为带电，实际磁性是磁极间的相互作用
  aliases: []
  category: 物理概念
  explanation: 物体能够吸引铁、钴、镍等物质的性质称为磁性。
  misconceptions:
    - 认为磁铁能吸引所有金属，如铝、铜、金，实际上只能吸引铁、钴、镍等铁磁性物质
    - 认为磁性的本质是物体带电，磁铁吸引铁是因为带电，实际磁性是磁极间的相互作用
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:磁感线
  type: Concept
  subject: 物理
  title: 磁感线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为磁感线是真实存在的曲线，实际是人为假想的模型
    - 能指出并纠正这一错误：认为磁场中磁感线可以相交，实际任意两条磁感线不相交
  aliases:
    - 磁力线
  category: 物理概念
  explanation: 用来形象描述磁场的假想曲线，磁感线上任意一点的切线方向为该点磁场方向，磁感线从N极出发回到S极，疏密表示磁场强弱。
  misconceptions:
    - 认为磁感线是真实存在的曲线，实际是人为假想的模型
    - 认为磁场中磁感线可以相交，实际任意两条磁感线不相交
    - 认为磁感线从S极出发回到N极，实际从N极出发回到S极
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:磁极
  type: Concept
  subject: 物理
  title: 磁极
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为磁体中间部位磁性最强，两端磁性最弱，实际两端（磁极）磁性最强
    - 能指出并纠正这一错误：认为磁体分割后每块只有一个磁极，实际每块仍有N和S两个磁极
  aliases: []
  category: 物理概念
  explanation: 磁体上磁性最强的部位，分为N极（北极）和S极（南极）。
  misconceptions:
    - 认为磁体中间部位磁性最强，两端磁性最弱，实际两端（磁极）磁性最强
    - 认为磁体分割后每块只有一个磁极，实际每块仍有N和S两个磁极
    - 认为磁极就是磁性，两者是同义，实际上磁极是磁体上磁性最强的部位
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:科学探究
  type: Concept
  subject: 物理
  title: 科学探究
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为科学探究就是做实验，不需要先提出问题或进行猜想
    - 能指出并纠正这一错误：认为科学探究步骤必须固定不变，不能根据实际调整或跳过
  aliases: []
  category: 科学方法
  explanation: 科学探究是体验科学发现的过程，包括提出问题、观察实验等环节。
  misconceptions:
    - 误认为科学探究就是做实验，不需要先提出问题或进行猜想
    - 认为科学探究步骤必须固定不变，不能根据实际调整或跳过
    - 认为探究中只有得到预期结果才算成功，忽视意外发现
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:科技强国
  type: Concept
  subject: 物理
  title: 科技强国
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为发展科技强国只需应用技术，基础物理研究可有可无
    - 能指出并纠正这一错误：认为我国所有科技领域已全面领先，没有任何短板
  aliases: []
  category: 科技政策
  explanation: 强调物理学对科技发展的重要作用，以及我国在科技领域的成就。
  misconceptions:
    - 误认为发展科技强国只需应用技术，基础物理研究可有可无
    - 认为我国所有科技领域已全面领先，没有任何短板
    - 将科技成就只归功于个别科学家，忽略团队合作与长期积累
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:秒表的使用
  type: Concept
  subject: 物理
  title: 秒表的使用
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：使用秒表时，按停止键后指针会停在某一位置，但归零键要按正确顺序，若先按归零再按停止，会清掉本次测…
    - 能指出并纠正这一错误：认为秒表的分度值都是0.1秒，实际上不同秒表分度值可能不同，有的为0.2秒，读数时需估读到分度值…
  aliases:
    - 机械秒表
    - 电子秒表
  category: 实验技能
  explanation: 秒表是实验室常用的计时工具，通过按键控制启动、暂停和归零，用于测量时间间隔。
  misconceptions:
    - 使用秒表时，按停止键后指针会停在某一位置，但归零键要按正确顺序，若先按归零再按停止，会清掉本次测量数据。
    - 认为秒表的分度值都是0.1秒，实际上不同秒表分度值可能不同，有的为0.2秒，读数时需估读到分度值的下一位。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:空气断路器
  type: Concept
  subject: 物理
  title: 空气断路器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：跳闸后不查明原因直接合闸，再次跳闸仍强行合闸，忽略可能是短路或过载
    - 能指出并纠正这一错误：认为空气断路器像保险丝一样熔断后需更换，不能复位重接
  aliases:
    - 空气开关
  category: 安全用电
  explanation: 一种自动切断电路的装置，用于过载和短路保护，采用空气灭弧。
  misconceptions:
    - 跳闸后不查明原因直接合闸，再次跳闸仍强行合闸，忽略可能是短路或过载
    - 认为空气断路器像保险丝一样熔断后需更换，不能复位重接
    - 认为空气断路器靠空气降温灭火，只能用于高压电路，低压用保险丝即可
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:等臂杠杆
  type: Concept
  subject: 物理
  title: 等臂杠杆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为等臂杠杆可以省力，实际不省力也不费力
    - 能指出并纠正这一错误：把等臂杠杆的力臂误认为支点到杆端的距离，而非垂直距离
  aliases: []
  category: 杠杆分类
  explanation: 动力臂等于阻力臂的杠杆，使用时动力等于阻力，既不省力也不费力。
  misconceptions:
    - 认为等臂杠杆可以省力，实际不省力也不费力
    - 把等臂杠杆的力臂误认为支点到杆端的距离，而非垂直距离
    - 误以为等臂杠杆能改变力的方向，实际不能
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:紫外线
  type: Concept
  subject: 物理
  title: 紫外线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把紫外线误认为紫光，觉得能用肉眼观察到
    - 能指出并纠正这一错误：误以为紫外线可用于遥控，实际遥控用红外线
  aliases:
    - 紫外光
  category: 物理概念
  explanation: 紫外线是位于紫光外侧的不可见光，能使荧光物质发光，可用于验钞、消毒等。
  misconceptions:
    - 把紫外线误认为紫光，觉得能用肉眼观察到
    - 误以为紫外线可用于遥控，实际遥控用红外线
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S3.md
- id: concept:物理:红外线
  type: Concept
  subject: 物理
  title: 红外线
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为红外线是红色可见光
    - 能指出并纠正这一错误：把红外线的热效应套在紫外线上，混淆应用
  aliases:
    - 红外光
  category: 光学
  explanation: 红外线是位于红光外侧的不可见光，具有显著的热效应，可用于测温、遥控等。
  misconceptions:
    - 误认为红外线是红色可见光
    - 把红外线的热效应套在紫外线上，混淆应用
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S2.md
- id: concept:物理:纳米材料
  type: Concept
  subject: 物理
  title: 纳米材料
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为纳米材料就是纳米尺寸的材料，实际上它是由纳米量级结构构成的固体材料。
    - 能指出并纠正这一错误：认为“纳米”是质量单位，实际是长度单位，1nm=10^-9m。
  aliases: []
  category: 物理应用
  explanation: 纳米材料是由纳米量级（1~100nm）结构构成的固体材料，其性质与宏观材料不同，具有特殊应用。
  misconceptions:
    - 误认为纳米材料就是纳米尺寸的材料，实际上它是由纳米量级结构构成的固体材料。
    - 认为“纳米”是质量单位，实际是长度单位，1nm=10^-9m。
    - 认为纳米材料的性质与宏观材料完全相同，忽视了其特殊应用。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:绝缘体
  type: Concept
  subject: 物理
  title: 绝缘体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为绝缘体在任何情况下都不导电，如干燥的木头蘸水后仍当作绝缘体使用
    - 能指出并纠正这一错误：把绝缘体和导体看成绝对的，忽略绝缘体在高压或潮湿下可能变为导体
  aliases:
    - insulator
  category: 物理概念
  explanation: 不容易导电的物体称为绝缘体，如橡胶、玻璃、陶瓷、塑料、油等。
  misconceptions:
    - 认为绝缘体在任何情况下都不导电，如干燥的木头蘸水后仍当作绝缘体使用
    - 把绝缘体和导体看成绝对的，忽略绝缘体在高压或潮湿下可能变为导体
    - 认为绝缘体不能带电，实际上摩擦起电后绝缘体可以带电荷
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:聚变
  type: Concept
  subject: 物理
  title: 聚变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为聚变是原子核分裂成更小原子核的过程，实际是聚合。
    - 能指出并纠正这一错误：误以为聚变在任何温度下均可发生，实际需超高温高压。
  aliases:
    - 核聚变
  category: 物理概念
  explanation: 两个质量较轻的原子核在超高温高压下聚合生成较重原子核并释放巨大能量的过程。
  misconceptions:
    - 误认为聚变是原子核分裂成更小原子核的过程，实际是聚合。
    - 误以为聚变在任何温度下均可发生，实际需超高温高压。
    - 误认为聚变释放的能量远小于裂变，实际相同质量时聚变更大。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:能源与可持续发展
  type: Concept
  subject: 物理
  title: 能源与可持续发展
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为能源危机是因为能量总量减少，忽略能量守恒且只减少可利用能量
    - 能指出并纠正这一错误：认为多开发新能源就可不节约，忽视提高现有能源利用率也是可持续
  aliases: []
  category: 物理概念
  explanation: 能源利用面临不可再生能源有限和环境污染问题，需要开发新能源、节约能源、提高能源利用率，实现可持续发展。
  misconceptions:
    - 认为能源危机是因为能量总量减少，忽略能量守恒且只减少可利用能量
    - 认为多开发新能源就可不节约，忽视提高现有能源利用率也是可持续
    - 认为新能源完全无污染，如太阳能电池生产也会耗能排污
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:能源危机的原因
  type: Concept
  subject: 物理
  title: 能源危机的原因
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用能量守恒反驳能源危机，忽略能量转化的方向性导致不可再利用
    - 能指出并纠正这一错误：认为散失到环境的内能真的消失了，其实仍存在但无法自动再利用
  aliases: []
  category: 物理概念
  explanation: 虽然能量守恒，但能量转化和转移具有方向性，转化过程中总有部分能量变成内能散失，无法再利用，导致可利用能量减少，从而产生能源危机。
  misconceptions:
    - 用能量守恒反驳能源危机，忽略能量转化的方向性导致不可再利用
    - 认为散失到环境的内能真的消失了，其实仍存在但无法自动再利用
    - 把方向性理解为热量可自发从低温物体传到高温物体
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:能量
  type: Concept
  subject: 物理
  title: 能量
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为只有做功的物体才有能量，静止不动的物体没有能量，如悬挂着的重物虽不做功但具有重力势能
    - 能指出并纠正这一错误：误认为能量就是力，认为力越大能量越多，忽略了能量是做功本领，与力有本质区别
  aliases:
    - energy
  category: 物理概念
  explanation: 物体做功的本领，是物理学的基本概念。
  misconceptions:
    - 误认为只有做功的物体才有能量，静止不动的物体没有能量，如悬挂着的重物虽不做功但具有重力势能
    - 误认为能量就是力，认为力越大能量越多，忽略了能量是做功本领，与力有本质区别
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:能量守恒定律
  type: Concept
  subject: 物理
  title: 能量守恒定律
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为能量守恒意味着能源取之不尽，不理会能量品质下降
    - 能指出并纠正这一错误：说摩擦生热是创造了能量，实际是机械能转化为内能总量不变
  aliases:
    - 能量守恒
  category: 物理定律
  explanation: 能量既不会凭空产生也不会凭空消失，只会从一种形式转化为其他形式或从一个物体转移到其他物体，总量保持不变。
  misconceptions:
    - 认为能量守恒意味着能源取之不尽，不理会能量品质下降
    - 说摩擦生热是创造了能量，实际是机械能转化为内能总量不变
    - 把能量守恒误以为各种形式能量数量必须相等，忽略转化过程
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:能量转化
  type: Concept
  subject: 物理
  title: 能量转化
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为发电机将电能转化为机械能，实际是机械能转化为电能
    - 能指出并纠正这一错误：认为电动机将机械能转化为电能，实际是电能转化为机械能
  aliases: []
  category: 物理概念
  explanation: 能量可以从一种形式转化为另一种形式，在转化过程中总量保持不变。发电机将机械能转化为电能。
  misconceptions:
    - 认为发电机将电能转化为机械能，实际是机械能转化为电能
    - 认为电动机将机械能转化为电能，实际是电能转化为机械能
    - 认为电磁感应现象中能量凭空产生，总能量增加，违反能量守恒定律
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:能量转化效率
  type: Concept
  subject: 物理
  title: 能量转化效率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：计算效率时把额外损失的能量也算作有用输出，导致结果偏大
    - 能指出并纠正这一错误：认为能量守恒所以效率能达到100%，忽略散失不可避免
  aliases:
    - 效率
    - 能量转换效率
  category: 物理概念
  explanation: 能量转换装置输出的有用能量与输入的总能量之比，用公式η = E有用输出 / E总输入 × 100%表示，由于能量损失不可避免，效率不可能达到100%。
  misconceptions:
    - 计算效率时把额外损失的能量也算作有用输出，导致结果偏大
    - 认为能量守恒所以效率能达到100%，忽略散失不可避免
    - 认为损失的那部分能量消失了，忘了转化为其他形式能量
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S4.md
- id: concept:物理:能量转移和转化的方向性
  type: Concept
  subject: 物理
  title: 能量转移和转化的方向性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为内能可全部自动转化为机械能而不引起任何其他变化
    - 能指出并纠正这一错误：以为只要存在温差，热量就能自发从低温传到高温
  aliases:
    - 能量转化和转移的方向性
    - 能量耗散
  category: 物理规律
  explanation: 自然界中自发进行的能量转移和转化都是有方向的，例如热量自发地从高温物体传递到低温物体，机械能可以自发地转化为内能，但内能无法自动地转化为机械能。
  misconceptions:
    - 认为内能可全部自动转化为机械能而不引起任何其他变化
    - 以为只要存在温差，热量就能自发从低温传到高温
    - 把方向性理解为能量只能单向转移，不能逆向转移（如电热可反向）
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:臭氧层
  type: Concept
  subject: 物理
  title: 臭氧层
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为臭氧层吸收红外线，其实吸收的是太阳紫外线。
    - 能指出并纠正这一错误：误以为臭氧层越厚越好，但近地面臭氧超标会造成污染。
  aliases: []
  category: 环境科学
  explanation: 臭氧层是平流层中臭氧集中的层次，能吸收绝大部分太阳紫外线，保护地球生物。
  misconceptions:
    - 误以为臭氧层吸收红外线，其实吸收的是太阳紫外线。
    - 误以为臭氧层越厚越好，但近地面臭氧超标会造成污染。
    - 误以为臭氧层是全地球最厚的大气层，实际总厚度仅约3毫米。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S3.md
- id: concept:物理:色光的混合
  type: Concept
  subject: 物理
  title: 色光的混合
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将色光混合与颜料混合混淆，认为红光加绿光会得到黑色。
    - 能指出并纠正这一错误：认为色光混合后亮度减弱，实际加色混合亮度增强。
  aliases:
    - 光的混合
  category: 物理现象
  explanation: 将两种或多种色光混合可以得到新的色光，如红、绿、蓝三原色按不同比例混合能产生各种颜色。
  misconceptions:
    - 将色光混合与颜料混合混淆，认为红光加绿光会得到黑色。
    - 认为色光混合后亮度减弱，实际加色混合亮度增强。
    - 误以为红、绿、蓝三种色光任意混合都得到白色，忽略比例不同产生不同颜色。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:色散
  type: Concept
  subject: 物理
  title: 色散
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为色散是光的反射引起的，因为三棱镜表面会反光。
    - 能指出并纠正这一错误：认为色散后出现的各种色光是棱镜创造出来的，白光本身是单纯的。
  aliases:
    - dispersion
  category: 物理概念
  explanation: 白光通过三棱镜后分解成各种色光的现象。
  misconceptions:
    - 认为色散是光的反射引起的，因为三棱镜表面会反光。
    - 认为色散后出现的各种色光是棱镜创造出来的，白光本身是单纯的。
    - 认为色散只发生在太阳光通过三棱镜时，其他白光不会发生色散。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:莫尔斯电码
  type: Concept
  subject: 物理
  title: 莫尔斯电码
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为莫尔斯电码中的点表示长信号、画表示短信号，实际点短画长
    - 能指出并纠正这一错误：认为莫尔斯电码是直接传输英文字母，实际是通过点画组合编码传输
  aliases: []
  category: 物理史实
  explanation: 莫尔斯电码是由美国发明家莫尔斯发明的，用点、画和间隔组成的电码，用于电报通信。
  misconceptions:
    - 认为莫尔斯电码中的点表示长信号、画表示短信号，实际点短画长
    - 认为莫尔斯电码是直接传输英文字母，实际是通过点画组合编码传输
    - 认为莫尔斯电码中间隔没有意义，实际间隔的长短也代表信息
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:蒸发
  type: Concept
  subject: 物理
  title: 蒸发
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为蒸发必须达到沸点才能发生，实际任何温度下都会蒸发
    - 能指出并纠正这一错误：认为蒸发只会使液体温度升高，实际蒸发吸热会使液体温度降低
  aliases:
    - evaporation
  category: 物态变化
  explanation: 只在液体表面发生的汽化现象，在任何温度下都能发生，蒸发时吸热。
  misconceptions:
    - 认为蒸发必须达到沸点才能发生，实际任何温度下都会蒸发
    - 认为蒸发只会使液体温度升高，实际蒸发吸热会使液体温度降低
    - 认为蒸发只有在有风或阳光下才进行，实际任何条件下都蒸发，只是快慢不同
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:蓄电池
  type: Concept
  subject: 物理
  title: 蓄电池
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为充电时是化学能转化为电能（实际是电能转化为化学能）
    - 能指出并纠正这一错误：认为蓄电池是一次性电池，用完就扔
  aliases:
    - 充电电池
  category: 物理概念
  explanation: 蓄电池是一种放电后经充电能复原续用的电池，放电时化学能转化为电能，充电时电能转化为化学能。
  misconceptions:
    - 认为充电时是化学能转化为电能（实际是电能转化为化学能）
    - 认为蓄电池是一次性电池，用完就扔
    - 认为蓄电池放电时没有能量转化
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:虚像
  type: Concept
  subject: 物理
  title: 虚像
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为虚像是实际光线会聚形成的，能用光屏承接
    - 能指出并纠正这一错误：认为虚像就是影子，是光没有照到的区域
  aliases: []
  category: 物理概念
  explanation: 由反射光线的反向延长线相交形成的像，不是实际光线会聚而成，不能在光屏上呈现。
  misconceptions:
    - 认为虚像是实际光线会聚形成的，能用光屏承接
    - 认为虚像就是影子，是光没有照到的区域
    - 认为平面镜后能看到虚像，所以虚像是实际存在的发光点
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:螺线管
  type: Concept
  subject: 物理
  title: 螺线管
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：用安培定则时握错手或四指方向搞反，导致磁极判断错误
    - 能指出并纠正这一错误：认为螺线管的磁极只由线圈绕向决定，与电流方向无关
  aliases:
    - solenoid
  category: 物理元件
  explanation: 螺线管是绕成螺旋形的导线，通电后具有磁性。
  misconceptions:
    - 用安培定则时握错手或四指方向搞反，导致磁极判断错误
    - 认为螺线管的磁极只由线圈绕向决定，与电流方向无关
    - 认为螺线管没有铁芯时通电也不会产生磁性
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S2.md
- id: concept:物理:裂变
  type: Concept
  subject: 物理
  title: 裂变
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将裂变误认为小的原子核结合成大的核，混淆了聚变与裂变
    - 能指出并纠正这一错误：认为所有原子核都能发生裂变，实际只有少数重核易于裂变
  aliases:
    - 核裂变
  category: 物理概念
  explanation: 质量较大的原子核分裂为两个或以上中等质量原子核的过程，同时释放能量和中子。
  misconceptions:
    - 将裂变误认为小的原子核结合成大的核，混淆了聚变与裂变
    - 认为所有原子核都能发生裂变，实际只有少数重核易于裂变
    - 认为裂变释放能量不遵守能量守恒，其实质量亏损转化为能量
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C4/sections/S2.md
- id: concept:物理:视角
  type: Concept
  subject: 物理
  title: 视角
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为视角就是物体本身的大小
    - 能指出并纠正这一错误：认为视角只与物体大小有关，忽略距离影响
  aliases: []
  category: 物理概念
  explanation: 视角是从物体两端发出的光线在眼的光心交叉形成的夹角，视角越大，物体看起来越清晰。
  misconceptions:
    - 误认为视角就是物体本身的大小
    - 认为视角只与物体大小有关，忽略距离影响
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:解释
  type: Concept
  subject: 物理
  title: 解释
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为解释就是把实验数据原样念出，不进行任何归纳分析
    - 能指出并纠正这一错误：为了得到预期的结论，随意忽略或修改与猜想不符的证据
  aliases:
    - 科学解释
  category: 科学方法
  explanation: 实验后要根据实验证据进行分析和归纳，得出结论，并由此解释原先提出的问题或更多的现象。
  misconceptions:
    - 认为解释就是把实验数据原样念出，不进行任何归纳分析
    - 为了得到预期的结论，随意忽略或修改与猜想不符的证据
    - 认为解释只能针对原问题，不能推广到其他类似现象
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:触电
  type: Concept
  subject: 物理
  title: 触电
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只要不接触大地就不会触电，同时接触火线和零线也会形成电流
    - 能指出并纠正这一错误：认为只有碰到高压线才触电，220V家庭电路碰到火线就没事
  aliases:
    - 电击
  category: 安全用电
  explanation: 一定强度的电流通过人体引起的伤害事故，分为单线触电和双线触电。
  misconceptions:
    - 认为只要不接触大地就不会触电，同时接触火线和零线也会形成电流
    - 认为只有碰到高压线才触电，220V家庭电路碰到火线就没事
    - 认为站在绝缘凳上双手分别接触火线和零线不会触电，因为没接地
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S4.md
- id: concept:物理:证据
  type: Concept
  subject: 物理
  title: 证据
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为一次实验结果即可验证猜想，不需要重复和多方验证
    - 能指出并纠正这一错误：认为只有支持猜想的证据才有效，与猜想矛盾的数据是错误
  aliases:
    - 实验证据
  category: 科学方法
  explanation: 证据是验证猜想的关键，实验是收集证据最主要的途径之一，需要多角度收集证据。
  misconceptions:
    - 误认为一次实验结果即可验证猜想，不需要重复和多方验证
    - 认为只有支持猜想的证据才有效，与猜想矛盾的数据是错误
    - 把主观感觉或道听途说当作证据，不经实验验证就下结论
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:误差
  type: Concept
  subject: 物理
  title: 误差
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为误差可以完全消除，通过改进测量工具或方法就能做到，实际误差只能减小，不能消除。
    - 能指出并纠正这一错误：认为多次测量取平均值可以避免误差，实际只能减小误差，不能避免，因为平均值仍可能偏离真实值。
  aliases: []
  category: 物理概念
  explanation: 误差是测量值与真实值之间的差异，任何测量都存在误差，误差不能消除但可以减小，错误是可以避免的。
  misconceptions:
    - 认为误差可以完全消除，通过改进测量工具或方法就能做到，实际误差只能减小，不能消除。
    - 认为多次测量取平均值可以避免误差，实际只能减小误差，不能避免，因为平均值仍可能偏离真实值。
    - 把错误与误差混为一谈，认为错误是误差的一种，实际错误是操作不当造成的，可以避免，而误差是不可避免的。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:质子
  type: Concept
  subject: 物理
  title: 质子
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为质子带负电，与电子电荷混淆。
    - 能指出并纠正这一错误：认为原子核只由质子组成，忽略了中子。
  aliases: []
  category: 物理粒子
  explanation: 质子是原子核的组成部分，带正电。
  misconceptions:
    - 误认为质子带负电，与电子电荷混淆。
    - 认为原子核只由质子组成，忽略了中子。
    - 认为质子是绕原子核运动的，实际上质子位于原子核内。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:费力杠杆
  type: Concept
  subject: 物理
  title: 费力杠杆
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将费力杠杆的动力臂和阻力臂大小关系记反，误认为动力臂大于阻力臂
    - 能指出并纠正这一错误：认为费力杠杆虽然费力但能省功，实际任何机械都不省功
  aliases: []
  category: 杠杆分类
  explanation: 动力臂小于阻力臂的杠杆，使用时动力大于阻力，费力但省距离。
  misconceptions:
    - 将费力杠杆的动力臂和阻力臂大小关系记反，误认为动力臂大于阻力臂
    - 认为费力杠杆虽然费力但能省功，实际任何机械都不省功
    - 误认为费力杠杆费距离，实际费力杠杆省距离
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:超声探伤仪
  type: Concept
  subject: 物理
  title: 超声探伤仪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将探伤原理理解为超声波直接穿透物体显示缺陷，忽略反射回波分析。
    - 能指出并纠正这一错误：误认为探伤仪发射可听声波，通过人耳听反射声判断缺陷。
  aliases:
    - 超声检测
  category: 技术应用
  explanation: 利用超声波在物体中的传播和反射检测内部缺陷的工业设备。
  misconceptions:
    - 将探伤原理理解为超声波直接穿透物体显示缺陷，忽略反射回波分析。
    - 误认为探伤仪发射可听声波，通过人耳听反射声判断缺陷。
    - 认为探伤仪在空气中也能正常工作，无需接触物体表面。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S4.md
- id: concept:物理:超声波
  type: Concept
  subject: 物理
  title: 超声波
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为超声波是传播速度大于340m/s的声波，把频率与速度混淆。
    - 能指出并纠正这一错误：认为超声波在真空中也能传播，因为“超”声波不同于普通声波。
  aliases:
    - 超声
  category: 物理概念
  explanation: 频率高于20000Hz的声音叫作超声波，具有方向性好、穿透能力强等特点，可用于声呐、B超等。
  misconceptions:
    - 误认为超声波是传播速度大于340m/s的声波，把频率与速度混淆。
    - 认为超声波在真空中也能传播，因为“超”声波不同于普通声波。
    - 认为超声波就是电磁波，可用金属罩屏蔽。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S1.md
- id: concept:物理:超声清洗机
  type: Concept
  subject: 物理
  title: 超声清洗机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为超声清洗是靠超声波的直接冲刷作用，像水流一样，忽略空化作用。
    - 能指出并纠正这一错误：误认为清洗机利用超声波的穿透性清洗物件内部，不局限于表面。
  aliases:
    - 超声波清洗机
  category: 技术应用
  explanation: 利用超声波在液体中的空化作用清洗物体的设备。
  misconceptions:
    - 认为超声清洗是靠超声波的直接冲刷作用，像水流一样，忽略空化作用。
    - 误认为清洗机利用超声波的穿透性清洗物件内部，不局限于表面。
    - 认为超声清洗机工作时发出人耳听得见的声音，因为清洗过程有噪音。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S4.md
- id: concept:物理:超声电机
  type: Concept
  subject: 物理
  title: 超声电机
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为超声电机靠电磁感应驱动，与普通电机原理相同。
    - 能指出并纠正这一错误：认为超声电机不需电源，仅靠超声振动就能转动。
  aliases:
    - 超声波电机
  category: 技术应用
  explanation: 利用超声振动转换为移动形式的电机，具有体积小、低速高精度等优点。
  misconceptions:
    - 误认为超声电机靠电磁感应驱动，与普通电机原理相同。
    - 认为超声电机不需电源，仅靠超声振动就能转动。
    - 认为超声电机是高速电机，因为频率高所以转速快。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S4.md
- id: concept:物理:超声诊断仪
  type: Concept
  subject: 物理
  title: 超声诊断仪
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为B超会有电离辐射，混淆超声波与X射线。
    - 能指出并纠正这一错误：认为B超成像是超声波穿透人体后直接成像，不需反射。
  aliases:
    - B超
    - 超声成像
  category: 技术应用
  explanation: 利用超声波在人体组织中的反射获取图像进行诊断的医疗设备，如B超。
  misconceptions:
    - 误认为B超会有电离辐射，混淆超声波与X射线。
    - 认为B超成像是超声波穿透人体后直接成像，不需反射。
    - 认为超声诊断仪发射的是次声波，因为对人体无害。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S4.md
- id: concept:物理:超导体
  type: Concept
  subject: 物理
  title: 超导体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误以为超导体在任何温度下电阻都为零，忽略需在特定临界温度以下
    - 能指出并纠正这一错误：认为超导体应用时不需要考虑电流大小，实际超过临界电流会失去超导性
  aliases:
    - superconductor
  category: 物理概念
  explanation: 在特定温度以下电阻变为零的导体称为超导体，具有广阔的应用前景。
  misconceptions:
    - 误以为超导体在任何温度下电阻都为零，忽略需在特定临界温度以下
    - 认为超导体应用时不需要考虑电流大小，实际超过临界电流会失去超导性
    - 把超导体等同于绝缘体，以为电阻为零就不导电，混淆两者本质
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:超导现象和超导体
  type: Concept
  subject: 物理
  title: 超导现象和超导体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将超导现象与超导体混为一谈，认为超导现象是一种材料，而不是过程
    - 能指出并纠正这一错误：误以为所有导体降温到临界温度时都会发生超导，实际某些材料不具备此特性
  aliases:
    - 超导
  category: 物理概念
  explanation: 某些物质在温度降到临界温度以下时，电阻突然变为零的现象叫超导现象，具有这种特性的材料叫超导体。
  misconceptions:
    - 将超导现象与超导体混为一谈，认为超导现象是一种材料，而不是过程
    - 误以为所有导体降温到临界温度时都会发生超导，实际某些材料不具备此特性
    - 认为电阻完全消失后不会有热量产生，忽略超导体在磁场中可能失去超导性
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C4/sections/S1.md
- id: concept:物理:轮轴
  type: Concept
  subject: 物理
  title: 轮轴
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为轮轴一定省力，当动力作用在轴上时反而费力
    - 能指出并纠正这一错误：分不清轮轴中的轮和轴，导致判断动力臂和阻力臂时出错
  aliases: []
  category: 简单机械
  explanation: 由具有共同转轴的大轮和小轮组成，实质是杠杆的变形，通常省力。
  misconceptions:
    - 误认为轮轴一定省力，当动力作用在轴上时反而费力
    - 分不清轮轴中的轮和轴，导致判断动力臂和阻力臂时出错
    - 把轮轴当作滑轮，忽略其是杠杆变形这一本质
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C1/sections/S1.md
- id: concept:物理:载人航天工程
  type: Concept
  subject: 物理
  title: 载人航天工程
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为载人航天工程只包括发射载人飞船，不包括空间站建设。
    - 能指出并纠正这一错误：认为中国载人航天还没有实现航天员出舱活动，实际上已实现。
  aliases:
    - 载人航天
  category: 科技成就
  explanation: 载人航天工程是中国航天事业的重要组成部分，实现了中国人进入太空的梦想。
  misconceptions:
    - 误认为载人航天工程只包括发射载人飞船，不包括空间站建设。
    - 认为中国载人航天还没有实现航天员出舱活动，实际上已实现。
    - 误以为载人航天工程只送人，不肩负货物运输任务。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S5.md
- id: concept:物理:过载
  type: Concept
  subject: 物理
  title: 过载
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把过载等同于短路，认为过载是导线直接相连导致电流巨大
    - 能指出并纠正这一错误：认为过载时用电器电压升高，实际家庭电路电压几乎不变，是干路电流过大
  aliases:
    - 超负荷
  category: 电路故障
  explanation: 电路中用电器的总功率过大，导致电流超过导线安全载流量。
  misconceptions:
    - 把过载等同于短路，认为过载是导线直接相连导致电流巨大
    - 认为过载时用电器电压升高，实际家庭电路电压几乎不变，是干路电流过大
    - 认为过载只与用电器本身有关，与同时使用的数量无关
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:运动的相对性
  type: Concept
  subject: 物理
  title: 运动的相对性
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为物体运动是绝对的，静止是相对的，没有意识到在机械运动中运动也需选择参照物。
    - 能指出并纠正这一错误：误以为参照物不同，物体运动状态一定不同，实际可能相同。
  aliases:
    - 运动相对性
  category: 物理概念
  explanation: 对于同一个物体，由于选取的参照物不同，可以说它是运动的，也可以说它是静止的，这种性质叫作运动的相对性。
  misconceptions:
    - 误认为物体运动是绝对的，静止是相对的，没有意识到在机械运动中运动也需选择参照物。
    - 误以为参照物不同，物体运动状态一定不同，实际可能相同。
    - 误以为地面上的静止物体相对所有参照物都静止，不知可能相对运动。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:近视眼
  type: Concept
  subject: 物理
  title: 近视眼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为近视眼是像落在视网膜后方，实际是前方
    - 能指出并纠正这一错误：用凸透镜矫正近视眼，实际应用凹透镜
  aliases: []
  category: 视力缺陷
  explanation: 近视眼看不清远处物体，是由于晶状体凸度过大或眼球前后径过长，像落在视网膜前方，需用凹透镜矫正。
  misconceptions:
    - 误认为近视眼是像落在视网膜后方，实际是前方
    - 用凸透镜矫正近视眼，实际应用凹透镜
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S6.md
- id: concept:物理:远视眼
  type: Concept
  subject: 物理
  title: 远视眼
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把远视眼成因误认为晶状体凸度过大，像落在视网膜前。
    - 能指出并纠正这一错误：误选凹透镜矫正远视眼，实际应戴凸透镜。
  aliases: []
  category: 视力缺陷
  explanation: 远视眼看不清近处物体，是由于晶状体凸度过小或眼球前后径过短，像落在视网膜后方，需用凸透镜矫正。
  misconceptions:
    - 把远视眼成因误认为晶状体凸度过大，像落在视网膜前。
    - 误选凹透镜矫正远视眼，实际应戴凸透镜。
    - 认为远视眼看不清远处物体，实际是看不清近处物体。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S6.md
- id: concept:物理:连通器
  type: Concept
  subject: 物理
  title: 连通器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为上下开口的容器就是连通器，忽略底部必须连通，如底部不相通的两个开口杯不是连通器。
    - 能指出并纠正这一错误：误以为连通器必须各容器粗细相同，如茶壶与壶嘴粗细不同仍是连通器。
  aliases: []
  category: 物理概念
  explanation: 上端开口、底部相连通的容器叫作连通器。
  misconceptions:
    - 认为上下开口的容器就是连通器，忽略底部必须连通，如底部不相通的两个开口杯不是连通器。
    - 误以为连通器必须各容器粗细相同，如茶壶与壶嘴粗细不同仍是连通器。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S2.md
- id: concept:物理:连通器原理
  type: Concept
  subject: 物理
  title: 连通器原理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为连通器液面在任何情况下都相平，忽略“同种液体”和“液体静止”条件，如装水和油的连通器液面不平…
    - 能指出并纠正这一错误：误以为液体流动时各液面仍相平，实际流动时液面不相平。
  aliases:
    - 连通器特点
  category: 物理规律
  explanation: 向连通器中注入同种液体，当液体静止时，连通器各部分中的液面总是相平的。
  misconceptions:
    - 认为连通器液面在任何情况下都相平，忽略“同种液体”和“液体静止”条件，如装水和油的连通器液面不平。
    - 误以为液体流动时各液面仍相平，实际流动时液面不相平。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:透镜
  type: Concept
  subject: 物理
  title: 透镜
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为透镜两个表面必须都是球面，实际一个平面一个球面也是透镜
    - 能指出并纠正这一错误：认为透明的玻璃砖是透镜，但平行光通过它不会聚或发散
  aliases: []
  category: 物理概念
  explanation: 由透明材料制成的、至少一个表面为球面的光学元件，分为凸透镜和凹透镜。
  misconceptions:
    - 认为透镜两个表面必须都是球面，实际一个平面一个球面也是透镜
    - 认为透明的玻璃砖是透镜，但平行光通过它不会聚或发散
    - 认为透镜材质必须是玻璃，塑料也能制成透镜
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:通信
  type: Concept
  subject: 物理
  title: 通信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为通信必须依靠电磁波，忽略古代书信、烽火等非电磁波通信方式
    - 能指出并纠正这一错误：把通信等同于通信设备，认为没有手机、电话就无法进行通信
  aliases: []
  category: 物理概念
  explanation: 人们以特定的手段和方式进行的信息传播活动称为通信。
  misconceptions:
    - 认为通信必须依靠电磁波，忽略古代书信、烽火等非电磁波通信方式
    - 把通信等同于通信设备，认为没有手机、电话就无法进行通信
    - 认为通信只是单向传递信息，忽略通信过程中存在双向交流和信息反馈
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:通电螺线管的磁场
  type: Concept
  subject: 物理
  title: 通电螺线管的磁场
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：安培定则时右手握错方向，将螺线管极性判断相反（如电流向右时误判N极在左）
    - 能指出并纠正这一错误：认为通电螺线管内部没有磁场，只分析外部磁场，造成对磁场分布理解错误
  aliases: []
  category: 物理概念
  explanation: 通电螺线管外部的磁场与条形磁体周围的磁场相似，其磁极极性可用安培定则判断。
  misconceptions:
    - 安培定则时右手握错方向，将螺线管极性判断相反（如电流向右时误判N极在左）
    - 认为通电螺线管内部没有磁场，只分析外部磁场，造成对磁场分布理解错误
    - 忽略线圈绕法对磁极的影响，认为电流方向相同则磁极一定相同，未考虑正向绕和反向绕的区别
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:通路
  type: Concept
  subject: 物理
  title: 通路
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为断路时用电器仍能工作，因为开关断开还有电流
    - 能指出并纠正这一错误：把断路和短路混淆，认为断路会烧坏电源
  aliases: []
  category: 物理概念
  explanation: 闭合开关，电路中有电流通过，用电器工作的状态称为通路。
  misconceptions:
    - 认为断路时用电器仍能工作，因为开关断开还有电流
    - 把断路和短路混淆，认为断路会烧坏电源
    - 认为电路中有电流就是通路，忽略短路时也有电流但不是通路
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:速度
  type: Concept
  subject: 物理
  title: 速度
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为速度大小由路程和时间共同决定，路程越大速度越大，时间越短速度越大。
    - 能指出并纠正这一错误：把速度公式逆用错误，如已知速度和时间求路程写成速度除以时间。
  aliases:
    - velocity
  category: 物理概念
  explanation: 速度是描述物体运动快慢的物理量，定义为路程与时间之比，公式为v=s/t。
  misconceptions:
    - 认为速度大小由路程和时间共同决定，路程越大速度越大，时间越短速度越大。
    - 把速度公式逆用错误，如已知速度和时间求路程写成速度除以时间。
    - 比较速度时，单位不统一，直接比较数值大小，如1m/s和3.6km/h。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:速度公式
  type: Concept
  subject: 物理
  title: 速度公式
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：变形时张冠李戴，求路程写成s=v/t，求时间写成t=v/s。
    - 能指出并纠正这一错误：计算时不统一单位，用km和h直接算出m/s，忽略换算。
  aliases: []
  category: 物理公式
  explanation: 速度等于路程与时间之比，即v=s/t，可变形为s=vt和t=s/v。
  misconceptions:
    - 变形时张冠李戴，求路程写成s=v/t，求时间写成t=v/s。
    - 计算时不统一单位，用km和h直接算出m/s，忽略换算。
    - 计算平均速度时，误将速度公式中的路程和时间取不同段的数值，如总路程除以某一段的时间。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:速度单位
  type: Concept
  subject: 物理
  title: 速度单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：搞错换算进率，认为1m/s=36km/h或1km/h=3.6m/s。
    - 能指出并纠正这一错误：换算时方向混淆，把m/s换算成km/h时除以3.6，km/h换算成m/s时乘以3.6。
  aliases: []
  category: 物理单位
  explanation: 速度的单位有米/秒（m/s）和千米/时（km/h），换算关系为1 m/s=3.6 km/h。
  misconceptions:
    - 搞错换算进率，认为1m/s=36km/h或1km/h=3.6m/s。
    - 换算时方向混淆，把m/s换算成km/h时除以3.6，km/h换算成m/s时乘以3.6。
    - 在速度计算中，长度和时间单位不统一导致结果单位错误。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:重力
  type: Concept
  subject: 物理
  title: 重力
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为重力就是地球对物体的吸引力，实际上重力是万有引力的一个分力，方向大小有差异。
    - 能指出并纠正这一错误：误认为重力的方向总是指向地心，实际竖直向下并不总指向地心，除赤道和两极外有偏差。
  aliases:
    - 物重
  category: 物理概念
  explanation: 物体由于地球吸引而受到的力，用G表示，方向竖直向下。
  misconceptions:
    - 误认为重力就是地球对物体的吸引力，实际上重力是万有引力的一个分力，方向大小有差异。
    - 误认为重力的方向总是指向地心，实际竖直向下并不总指向地心，除赤道和两极外有偏差。
    - 误认为物体在月球上重力消失，实际月球对它也有引力，相当于月球重力，只是大小不同。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S5.md
- id: concept:物理:重力与质量的关系
  type: Concept
  subject: 物理
  title: 重力与质量的关系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为g=9.8N/kg是固定不变，忽略在地球不同纬度和高度g略有差别。
    - 能指出并纠正这一错误：误认为质量与重力成正比，说‘质量与重力成正比’颠倒了因果关系，质量是物体属性。
  aliases: []
  category: 物理规律
  explanation: 物体所受的重力与它的质量成正比，公式为G=mg，其中g约等于9.8N/kg。
  misconceptions:
    - 误认为g=9.8N/kg是固定不变，忽略在地球不同纬度和高度g略有差别。
    - 误认为质量与重力成正比，说‘质量与重力成正比’颠倒了因果关系，质量是物体属性。
    - 计算时把质量‘克’直接代入G=mg，如500g的物体误得G=500×9.8N，应换算成0.5kg。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:重力势能
  type: Concept
  subject: 物理
  title: 重力势能
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为重力势能只与高度有关，忽略质量，如比较被举高的物体时只看高度，不看质量。
    - 能指出并纠正这一错误：误认为重力势能是绝对的，没有选定零势能面，实际同一物体在不同零势能面下重力势能不同。
  aliases: []
  category: 物理概念
  explanation: 被举高的物体具有的能量，如高处的水、落下的重锤。
  misconceptions:
    - 误认为重力势能只与高度有关，忽略质量，如比较被举高的物体时只看高度，不看质量。
    - 误认为重力势能是绝对的，没有选定零势能面，实际同一物体在不同零势能面下重力势能不同。
    - 误认为重力势能就是重力，说物体具有重力势能等于受到重力，混淆了能量与力的概念。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S5.md
- id: concept:物理:重力的方向
  type: Concept
  subject: 物理
  title: 重力的方向
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为竖直向下就是垂直于接触面向下，如斜面物体误认为重力垂直斜面向下，实际竖直向下是垂直于水平面…
    - 能指出并纠正这一错误：误认为竖直向下总是指向地心，其实在地球其他位置竖直向下与万有引力方向有微小夹角。
  aliases: []
  category: 物理概念
  explanation: 重力的方向总是竖直向下的，即与水平面垂直。
  misconceptions:
    - 误认为竖直向下就是垂直于接触面向下，如斜面物体误认为重力垂直斜面向下，实际竖直向下是垂直于水平面。
    - 误认为竖直向下总是指向地心，其实在地球其他位置竖直向下与万有引力方向有微小夹角。
    - 误认为重力方向随物体运动状态改变，如物体抛出后认为重力方向沿运动方向，实际任何时刻都是竖直向下。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S5.md
- id: concept:物理:重心
  type: Concept
  subject: 物理
  title: 重心
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为重心一定在物体上，如圆环的重心在圆环中心，不在环体材料上。
    - 能指出并纠正这一错误：误认为重心就是几何中心，只有质量均匀分布且形状规则的物体重心才在几何中心。
  aliases: []
  category: 物理概念
  explanation: 物体各部分受到的重力作用等效于集中在一个点上，这个点叫重心。
  misconceptions:
    - 误认为重心一定在物体上，如圆环的重心在圆环中心，不在环体材料上。
    - 误认为重心就是几何中心，只有质量均匀分布且形状规则的物体重心才在几何中心。
    - 误认为重心是物体上最重的一点，实际上重心是等效替代点，物体各点都可能等效。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C2/sections/S1.md
- id: concept:物理:量子通信
  type: Concept
  subject: 物理
  title: 量子通信
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为量子通信可超越光速瞬间传递信息。
    - 能指出并纠正这一错误：把量子通信等同于用量子计算机破解密码。
  aliases: []
  category: 通信技术
  explanation: 利用量子态进行信息传输的通信方式，理论上非常安全。
  misconceptions:
    - 认为量子通信可超越光速瞬间传递信息。
    - 把量子通信等同于用量子计算机破解密码。
    - 把量子通信等同于传统通信，仅认为其速度更快。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:量筒的使用
  type: Concept
  subject: 物理
  title: 量筒的使用
  conceptType: 程序型
  masteryCriteria:
    - 能指出并纠正这一错误：读数时俯视量筒，液面凹面不在视线平齐处，读数偏大
    - 能指出并纠正这一错误：把量筒当烧杯加热液体或溶解物质，会使量筒刻度不准确甚至破裂
  aliases:
    - 量杯
  category: 实验技能
  explanation: 量筒用于测量液体体积，读数时视线应与液面凹面底部相平，单位是毫升（mL），1mL=1cm³。
  misconceptions:
    - 读数时俯视量筒，液面凹面不在视线平齐处，读数偏大；仰视偏小
    - 把量筒当烧杯加热液体或溶解物质，会使量筒刻度不准确甚至破裂
    - 读数时对量筒进行估读，量筒不需估读，应读至最小分度值
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C1/sections/S3.md
- id: concept:物理:银河系
  type: Concept
  subject: 物理
  title: 银河系
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为光年是时间单位，将“银河系直径10万光年”理解为10万年。
    - 能指出并纠正这一错误：认为银河系就是宇宙，实际上宇宙中还有无数其他星系。
  aliases: []
  category: 天文学
  explanation: 银河系是一个由群星和弥漫的星际物质集合而成的庞大天体系统，直径约10万光年。
  misconceptions:
    - 误认为光年是时间单位，将“银河系直径10万光年”理解为10万年。
    - 认为银河系就是宇宙，实际上宇宙中还有无数其他星系。
    - 认为太阳系位于银河系中心，实际上太阳系在银河系边缘。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S5.md
- id: concept:物理:镜面反射
  type: Concept
  subject: 物理
  title: 镜面反射
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为只有平面镜才能发生镜面反射，光滑金属面也被说成‘漫反射’。
    - 能指出并纠正这一错误：误以为镜面反射时反射光一定平行，忽略入射光必须是平行光。
  aliases:
    - mirror reflection
  category: 物理概念
  explanation: 平行光入射到平整光滑的表面（如平面镜）时，反射光仍平行，这种反射称为镜面反射。
  misconceptions:
    - 认为只有平面镜才能发生镜面反射，光滑金属面也被说成‘漫反射’。
    - 误以为镜面反射时反射光一定平行，忽略入射光必须是平行光。
    - 说‘镜面反射遵守反射定律，漫反射不遵守’，二者其实都遵守。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C2/sections/S4.md
- id: concept:物理:长度单位
  type: Concept
  subject: 物理
  title: 长度单位
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为1cm等于10mm，所以1厘米等于0.01米，但在换算时误写成1cm=0.1m，忽略数量级。
    - 能指出并纠正这一错误：进行长度单位换算时，只改变数字，不改变单位，如把25厘米写成25米，忘记除以100。
  aliases: []
  category: 物理单位
  explanation: 长度的国际单位是米（m），常用单位有千米、分米、厘米、毫米等，换算关系为1 km=10³ m，1 dm=10⁻¹ m，1
    cm=10⁻² m，1 mm=10⁻³ m。
  misconceptions:
    - 认为1cm等于10mm，所以1厘米等于0.01米，但在换算时误写成1cm=0.1m，忽略数量级。
    - 进行长度单位换算时，只改变数字，不改变单位，如把25厘米写成25米，忘记除以100。
    - 混淆'分米'和'米'，认为1分米等于10米，实际1分米=0.1米。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S1.md
- id: concept:物理:长度（路程）
  type: Concept
  subject: 物理
  title: 长度（路程）
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为路程就是位移，如从家到学校绕路，路程大于直线距离，但误认为两者相等。
    - 能指出并纠正这一错误：计算路程时直接代入速度和时间，但未注意单位统一，如速度用km/h，时间用s，导致结果错误。
  aliases:
    - 路程
  category: 物理量
  explanation: 表示物体运动轨迹的长度，常用单位有千米、分米、厘米、毫米等。
  misconceptions:
    - 认为路程就是位移，如从家到学校绕路，路程大于直线距离，但误认为两者相等。
    - 计算路程时直接代入速度和时间，但未注意单位统一，如速度用km/h，时间用s，导致结果错误。
    - 认为路程可以是负数，实际路程是实际运动轨迹的长度，总是正值，但位移可以是负值。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:问题
  type: Concept
  subject: 物理
  title: 问题
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为问题可以凭空产生，不需要观察现象或基于已有知识
    - 能指出并纠正这一错误：认为猜想和假设就是随意乱猜，无需联系相关知识或经验
  aliases:
    - 科学问题
  category: 科学方法
  explanation: 科学探究从问题开始，科学家提出科学问题时，通常还会根据相关知识或经验进行猜想和假设，从而明确探究方向。
  misconceptions:
    - 认为问题可以凭空产生，不需要观察现象或基于已有知识
    - 认为猜想和假设就是随意乱猜，无需联系相关知识或经验
    - 认为有了问题就能直接做实验，不需要先进行猜想明确方向
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:阿基米德原理
  type: Concept
  subject: 物理
  title: 阿基米德原理
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为铁块浸没越深浮力越大，忽略排开液体体积不变，浮力只与排开液体体积和液体密度有关。
    - 能指出并纠正这一错误：计算漂浮物体浮力时误用物体总体积代替排开液体体积，导致结果偏大。
  aliases: []
  category: 物理规律
  explanation: 浸在液体中的物体所受浮力大小等于物体排开的液体所受的重力，即F浮=G排。
  misconceptions:
    - 认为铁块浸没越深浮力越大，忽略排开液体体积不变，浮力只与排开液体体积和液体密度有关。
    - 计算漂浮物体浮力时误用物体总体积代替排开液体体积，导致结果偏大。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S1.md
- id: concept:物理:静摩擦
  type: Concept
  subject: 物理
  title: 静摩擦
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为静摩擦力大小一定等于外力，实际上不超过最大静摩擦力。
    - 能指出并纠正这一错误：认为静止的物体不受摩擦力，如斜面上静止物体受静摩擦。
  aliases: []
  category: 物理概念
  explanation: 两个相对静止的物体间产生的摩擦力叫做静摩擦，其大小随外力的增大而增大，但有一个最大值。
  misconceptions:
    - 认为静摩擦力大小一定等于外力，实际上不超过最大静摩擦力。
    - 认为静止的物体不受摩擦力，如斜面上静止物体受静摩擦。
    - 认为静摩擦力方向与运动方向相反，实际与相对运动趋势方向相反。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:静电现象
  type: Concept
  subject: 物理
  title: 静电现象
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为静电现象只有摩擦起电，忽略了放电等现象。
    - 能指出并纠正这一错误：认为静电只在干燥环境中产生，潮湿环境完全没有静电，实际潮湿时也存在但易导走。
  aliases: []
  category: 物理现象
  explanation: 静电现象包括摩擦起电、放电等现象，在自然界和生活中常见，既有应用也有危害。
  misconceptions:
    - 误认为静电现象只有摩擦起电，忽略了放电等现象。
    - 认为静电只在干燥环境中产生，潮湿环境完全没有静电，实际潮湿时也存在但易导走。
    - 认为静电现象一定有害，忽视了静电复印、除尘等应用。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C5/sections/S1.md
- id: concept:物理:非晶体
  type: Concept
  subject: 物理
  title: 非晶体
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为非晶体熔化时温度保持不变，有固定熔化温度，如蜡熔化时温度持续升高却以为不变
    - 能指出并纠正这一错误：认为非晶体没有熔点所以熔化时不吸热，实际上非晶体熔化也吸热只是温度升高
  aliases: []
  category: 物理概念
  explanation: 没有固定熔化温度的固体，熔化过程中温度持续升高。
  misconceptions:
    - 认为非晶体熔化时温度保持不变，有固定熔化温度，如蜡熔化时温度持续升高却以为不变
    - 认为非晶体没有熔点所以熔化时不吸热，实际上非晶体熔化也吸热只是温度升高
    - 认为非晶体就是没有固定形状的固体，其实所有固体都有固定形状，只是非晶体无固定熔点
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C5/sections/S2.md
- id: concept:物理:非清洁能源
  type: Concept
  subject: 物理
  title: 非清洁能源
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为煤只要脱硫加工后就不再产生污染物，属于清洁能源。
    - 能指出并纠正这一错误：认为石油燃烧只产生二氧化碳，不算污染物，所以是清洁能源。
  aliases: []
  category: 能源分类
  explanation: 在使用时会产生污染物的能源，如煤、石油等。
  misconceptions:
    - 认为煤只要脱硫加工后就不再产生污染物，属于清洁能源。
    - 认为石油燃烧只产生二氧化碳，不算污染物，所以是清洁能源。
    - 认为天然气不是污染物排放源，属于清洁能源。
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C3/sections/S1.md
- id: concept:物理:面积
  type: Concept
  subject: 物理
  title: 面积
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为面积单位是米，实际面积的国际单位是平方米，但常用单位还有平方厘米、平方分米等。
    - 能指出并纠正这一错误：计算面积时只乘两边长度，未统一单位，如长2米、宽30厘米，直接相乘得60，但单位不明确，应为0.…
  aliases: []
  category: 物理量
  explanation: 表示物体表面或平面图形的大小，国际单位是平方米。
  misconceptions:
    - 认为面积单位是米，实际面积的国际单位是平方米，但常用单位还有平方厘米、平方分米等。
    - 计算面积时只乘两边长度，未统一单位，如长2米、宽30厘米，直接相乘得60，但单位不明确，应为0.6平方米。
    - 认为1平方米等于100平方厘米，实际1平方米=10000平方厘米，因为1m=100cm，面积换算需平方。
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C4/sections/S5.md
- id: concept:物理:音色
  type: Concept
  subject: 物理
  title: 音色
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为音色由振幅决定，振幅越大音色越好
    - 能指出并纠正这一错误：认为音调响度相同的两个声音音色一定相同，忽略材料结构
  aliases:
    - timbre
  category: 声音特性
  explanation: 声音的品质特征，由声源的材料、结构等决定，不同声源音色不同。
  misconceptions:
    - 认为音色由振幅决定，振幅越大音色越好
    - 认为音调响度相同的两个声音音色一定相同，忽略材料结构
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:音调
  type: Concept
  subject: 物理
  title: 音调
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为音调由振幅决定，以为用力越大音调越高
    - 能指出并纠正这一错误：把音调高低与响度大小混淆，说'声音尖'就是响度大
  aliases:
    - pitch
  category: 物理概念
  explanation: 声音的高低，称为音调，与声源振动的频率有关。
  misconceptions:
    - 认为音调由振幅决定，以为用力越大音调越高
    - 把音调高低与响度大小混淆，说'声音尖'就是响度大
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:频率
  type: Concept
  subject: 物理
  title: 频率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：将频率与周期混淆，认为频率等于一次振动需要的时间，如振动一次用0.5s就说频率是0.5Hz
    - 能指出并纠正这一错误：单位换算出错，如把2.5kHz写成2500Hz漏写单位，或误认为1MHz=1000Hz
  aliases:
    - frequency
  category: 物理概念
  explanation: 物体振动的次数与时间之比叫作频率，单位是赫兹（Hz）。频率越高，音调越高。
  misconceptions:
    - 将频率与周期混淆，认为频率等于一次振动需要的时间，如振动一次用0.5s就说频率是0.5Hz
    - 单位换算出错，如把2.5kHz写成2500Hz漏写单位，或误认为1MHz=1000Hz
    - 认为频率与振幅有关，觉得振动幅度越大音调越高，实际振动快慢（频率）决定音调
  sourceRef: content/八年级/上册/物理/SK-8-1-Physics/chapters/C1/sections/S2.md
- id: concept:物理:额定功率
  type: Concept
  subject: 物理
  title: 额定功率
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为额定功率随实际电压改变，实际电压低时额定功率也变小
    - 能指出并纠正这一错误：认为实际功率总是等于额定功率，如220V灯泡接110V实际功率仍为额定功率
  aliases:
    - 额定电功率
  category: 物理概念
  explanation: 用电器在额定电压下工作时的电功率叫做额定功率，是用电器正常工作时的功率。
  misconceptions:
    - 认为额定功率随实际电压改变，实际电压低时额定功率也变小
    - 认为实际功率总是等于额定功率，如220V灯泡接110V实际功率仍为额定功率
    - 认为额定功率大的用电器一定比额定功率小的更耗电，忽略工作时间
  sourceRef: content/九年级/下册/物理/SK-9-2-Physics/chapters/C1/sections/S5.md
- id: concept:物理:额定电压
  type: Concept
  subject: 物理
  title: 额定电压
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：把标有“220V”的用电器接在110V电源上，仍认为其两端电压是220V，忽略实际电压由电路决定
    - 能指出并纠正这一错误：误把额定电压当成电压上限，认为低于额定电压用电器就会烧坏，实际只是不能正常工作
  aliases:
    - rated voltage
  category: 物理概念
  explanation: 用电器正常工作时规定的电压值。
  misconceptions:
    - 把标有“220V”的用电器接在110V电源上，仍认为其两端电压是220V，忽略实际电压由电路决定
    - 误把额定电压当成电压上限，认为低于额定电压用电器就会烧坏，实际只是不能正常工作
    - 认为电源电压必须等于用电器的额定电压，而忽略串联分压导致实际电压可能更低
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S1.md
- id: concept:物理:额定电流
  type: Concept
  subject: 物理
  title: 额定电流
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为通过用电器的电流始终等于额定电流，如把“0.5A”的小灯泡接在任何电路中电流都是0.5A
    - 能指出并纠正这一错误：计算实际功率时，用额定电流乘实际电压，如P=U实I额，导致结果偏大
  aliases:
    - rated current
  category: 物理概念
  explanation: 用电器正常工作时的电流值。
  misconceptions:
    - 认为通过用电器的电流始终等于额定电流，如把“0.5A”的小灯泡接在任何电路中电流都是0.5A
    - 计算实际功率时，用额定电流乘实际电压，如P=U实I额，导致结果偏大
    - 把额定电流误认为最大允许电流，认为低于它就完全不工作，高于它才损坏
  sourceRef: content/九年级/上册/物理/SK-9-1-Physics/chapters/C3/sections/S4.md
- id: concept:物理:马德堡半球实验
  type: Concept
  subject: 物理
  title: 马德堡半球实验
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：认为马德堡半球实验测出了大气压的具体数值，实际它只证实大气压存在且很大，测数值的是托里拆利实验。
    - 能指出并纠正这一错误：误以为两半球被拉开说明大气压只作用于水平方向，实际大气压向各个方向都有压强。
  aliases: []
  category: 物理实验
  explanation: 1654年格里克用两个铜半球抽出空气后，用多匹马才拉开，证实了大气压的存在且很大。
  misconceptions:
    - 认为马德堡半球实验测出了大气压的具体数值，实际它只证实大气压存在且很大，测数值的是托里拆利实验。
    - 误以为两半球被拉开说明大气压只作用于水平方向，实际大气压向各个方向都有压强。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C3/sections/S3.md
- id: concept:物理:验电器
  type: Concept
  subject: 物理
  title: 验电器
  conceptType: 概念型
  masteryCriteria:
    - 能指出并纠正这一错误：误认为验电器能直接检验物体带正电还是负电，实际它只能检验是否带电。
    - 能指出并纠正这一错误：认为验电器的工作原理是异种电荷相互吸引，实际是同种电荷相互排斥。
  aliases: []
  category: 物理仪器
  explanation: 验电器是用来检验物体是否带电的仪器，利用同种电荷相互排斥的原理工作。
  misconceptions:
    - 误认为验电器能直接检验物体带正电还是负电，实际它只能检验是否带电。
    - 认为验电器的工作原理是异种电荷相互吸引，实际是同种电荷相互排斥。
    - 用手接触带电验电器的金属小球后，误认为金属箔张角不变，实际人体导走电荷使张角减小或闭合。
  sourceRef: content/八年级/下册/物理/SK-8-2-Physics/chapters/C4/sections/S2.md
