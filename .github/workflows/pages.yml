name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖（沿用 ci.yml 的 npm 方案）
        run: cd tools/kg && npm install
      - name: 生成图谱产物与 demo 数据
        run: |
          cd tools/kg
          npx tsx src/build.ts -- ../..
          npx tsx src/build_demo.ts -- ../..
      - name: 组装站点（demo 置根，content 供原文链接）
        run: |
          mkdir -p _site
          cp -r demo/. _site/
          cp -r content _site/content
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
