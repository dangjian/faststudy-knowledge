<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凸透镜成像 · 闯关</title>
<!--
  单文件、零依赖。数据来自本仓：
    concept:物理:凸透镜成像规律
    covered_by: SK-8-1-Physics-C3 第三章 光的折射 透镜  p.61–90
    引文出自 content/八年级/上册/物理/SK-8-1-Physics/chapters/C3/sections/S1.md
  公式：1/v − 1/u = 1/f
-->
<style>
  :root{
    --paper:#fdfbf6; --ink:#2a2620; --sub:#8b8378;
    --line:#e6e1d6; --green:#2c6e57; --amber:#b26a2c; --red:#a8432c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px; background-position:-1px -1px;
    font:15px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:26px 22px 90px}

  /* 关卡条 */
  .hud{display:flex;align-items:center;gap:14px;margin-bottom:6px;font-size:13px;color:var(--sub)}
  .dots{display:flex;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--sub);opacity:.45}
  .dot.done{background:var(--green);border-color:var(--green);opacity:1}
  .dot.now{border-color:var(--amber);opacity:1;box-shadow:0 0 0 3px rgba(178,106,44,.18)}
  h1{font-size:26px;line-height:1.35;margin:4px 0 2px;font-family:Georgia,"Songti SC",serif;font-weight:600;letter-spacing:.01em}
  .goal{color:var(--amber);font-weight:600}
  .sub{color:var(--sub);font-size:13px;margin-bottom:16px}

  /* 舞台 */
  .stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;
         box-shadow:0 1px 0 #fff inset, 0 10px 24px -18px rgba(0,0,0,.35);overflow:hidden}
  canvas{display:block;width:100%;height:400px;cursor:grab;touch-action:none}
  canvas.dragging{cursor:grabbing}
  .hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--sub);pointer-events:none}

  /* 达成卡 */
  .win{position:absolute;right:14px;top:14px;width:322px;background:#fff;border:1px solid var(--green);
       border-radius:12px;padding:14px 16px;box-shadow:0 16px 40px -22px rgba(44,110,87,.7);
       transform:translateY(-8px);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1)}
  .win.show{transform:none;opacity:1;pointer-events:auto}
  .win .tag{display:inline-block;font-size:11px;letter-spacing:.06em;color:var(--green);
            border:1px solid var(--green);border-radius:99px;padding:0 8px;margin-bottom:8px}
  .win .quote{font-family:Georgia,"Songti SC",serif;font-size:14.5px;line-height:1.8;color:#33302a;
              border-left:3px solid var(--green);padding-left:10px;margin:6px 0 10px}
  .win .src{font-size:11.5px;color:var(--sub);margin-bottom:10px}
  .win button{font:inherit;font-size:13px;padding:5px 14px;border:0;border-radius:8px;
              background:var(--green);color:#fff;cursor:pointer}
  .win button:hover{filter:brightness(1.08)}

  /* 参数 */
  .panel{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
  .ctl{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .ctl .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:2px}
  .ctl .val{font-family:Georgia,serif;font-size:17px;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--green)}

  /* 读数 */
  .reads{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;
         background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px}
  .reads div{color:var(--sub)}
  .reads b{color:var(--ink);font-family:Georgia,serif;font-size:15px;margin-left:5px}

  footer{margin-top:26px;font-size:12.5px;color:var(--sub)}
  footer ul{margin:6px 0 0;padding-left:18px}
  .bad{border-color:var(--red)!important}
  @media(max-width:860px){
    .panel{grid-template-columns:1fr}
    .win{position:static;width:auto;margin:10px;transform:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hud">
    <span class="dots" id="dots"></span>
    <span id="lv">第 1 关 / 共 3 关</span>
  </div>

  <h1>让像<span class="goal" id="goalWord">清晰地落在光屏上</span></h1>
  <p class="sub" id="goalSub">拖动蜡烛改变物距，拖动光屏承接像。</p>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hint">拖蜡烛 ←→ 改变物距　·　拖光屏 ←→ 承接像</div>
    <div class="win" id="win">
      <span class="tag">达成</span>
      <div class="quote" id="quote"></div>
      <div class="src" id="more"></div>
      <div class="src" id="src"></div>
      <button id="next">下一关 →</button>
    </div>
  </div>

  <div class="panel">
    <div class="ctl">
      <div class="lab"><span>焦距 f</span><span class="val" id="fv">10</span></div>
      <input id="f" type="range" min="6" max="16" step="1" value="10">
    </div>
    <div class="ctl">
      <div class="lab"><span>物距 u</span><span class="val" id="uv">30</span></div>
      <input id="u" type="range" min="4" max="56" step="1" value="30">
    </div>
    <div class="ctl">
      <div class="lab"><span>光屏位置</span><span class="val" id="sv">42</span></div>
      <input id="s" type="range" min="2" max="70" step="1" value="42">
    </div>
  </div>

  <div class="reads">
    <div>像距<b id="vv">—</b></div>
    <div>放大率<b id="mv">—</b></div>
    <div>正倒<b id="ev">—</b></div>
    <div>大小<b id="szv">—</b></div>
    <div>光屏<b id="scv">—</b></div>
  </div>

  <footer>
    <b>教材里最容易错的两处</b>（取自本仓 <code>misconceptions</code>）：
    <ul>
      <li>「物距等于焦距时也能成像」——实际不成像，光屏上无像。</li>
      <li>「物距大于 2f 时成倒立等大的像」——实际是倒立<b>缩小</b>实像。</li>
    </ul>
  </footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id)
  const cv = $('cv'), ctx = cv.getContext('2d')
  const dpr = window.devicePixelRatio || 1

  const S = { f: 10, u: 30, s: 42, level: 0, solved: false }
  let W = 0, H = 0, scale = 5

  // 三关：目标条件 + 达成后的教材依据
  const LEVELS = [
    {
      goal: '让像清晰地落在光屏上',
      sub: '拖蜡烛把物距拉到 2f 以外，再拖光屏找到清晰的像。',
      check: (v, u, f, s) => v > 0 && Math.abs(v - s) < 1.2 && u > 2 * f,
      quote: '二倍焦距处，是成缩小像与放大像的分界点。',
      more: '因此物体在二倍焦距以外时，成倒立、缩小的实像；像落在焦距与二倍焦距之间。',
    },
    {
      goal: '把像从缩小变成放大',
      sub: '物距改到焦距与二倍焦距之间，重新找到清晰的像。',
      check: (v, u, f, s) => v > 0 && Math.abs(v - s) < 1.2 && u > f && u < 2 * f,
      quote: '一倍焦距处，是成倒立实像与正立虚像的分界点。',
      more: '物体在一倍焦距与二倍焦距之间时，成倒立、放大的实像；像在二倍焦距以外。',
    },
    {
      goal: '做出一个光屏接不住的像',
      sub: '把物距调到焦距以内，看看光屏上还剩什么。',
      check: (v) => v < 0,
      quote: '一倍焦距处是成倒立实像与正立虚像的分界点。',
      more: '物体在一倍焦距以内时，成正立、放大的虚像。虚像不是实际光线会聚成的，光屏接不到。',
    },
  ]

  const SRC = '教材 p.61–90 · 第三章 光的折射 透镜（本仓 content/八年级/上册/物理/SK-8-1-Physics）'

  // ── 物理 ──
  function solve() {
    const { f, u } = S
    if (Math.abs(u - f) < 1e-6) return { none: true }
    const v = 1 / (1 / f - 1 / u)
    return { v, m: -v / u }
  }

  function resize() {
    const r = cv.getBoundingClientRect()
    W = Math.round(r.width); H = Math.round(r.height)
    cv.width = W * dpr; cv.height = H * dpr
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    scale = Math.min(W / (2 * Math.max(S.u, 2 * S.f) + 36), 7)
    draw()
  }

  const X = (cm) => W / 2 + cm * scale
  const Y = () => H * 0.54
  const OBJ_H = 34

  function arrow(x, y0, h, color, dashed, lw) {
    ctx.strokeStyle = color; ctx.fillStyle = color
    ctx.lineWidth = lw || 2.2
    ctx.setLineDash(dashed ? [5, 4] : [])
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 - h); ctx.stroke()
    ctx.setLineDash([])
    const d = h > 0 ? -1 : 1
    ctx.beginPath(); ctx.moveTo(x, y0 - h)
    ctx.lineTo(x - 4.5, y0 - h + d * 9); ctx.lineTo(x + 4.5, y0 - h + d * 9)
    ctx.closePath(); ctx.fill()
  }

  // 手绘感的线：分两段画，带轻微抖动
  function handLine(x1, y1, x2, y2) {
    const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * 0.6
    const my = (y1 + y2) / 2 + (Math.random() - 0.5) * 0.6
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2); ctx.stroke()
  }

  function draw() {
    const y0 = Y(), { f, u, s } = S
    const res = solve()
    ctx.clearRect(0, 0, W, H)

    // 主轴
    ctx.strokeStyle = '#d9d4c8'; ctx.lineWidth = 1
    ctx.beginPath(); ctx.moveTo(18, y0); ctx.lineTo(W - 18, y0); ctx.stroke()

    // 焦点
    ctx.font = '11px -apple-system,sans-serif'; ctx.textAlign = 'center'
    ;[[-2 * f, '2F'], [-f, 'F'], [f, "F′"], [2 * f, "2F′"]].forEach(([cm, t]) => {
      ctx.fillStyle = '#b3ab9e'
      ctx.beginPath(); ctx.arc(X(cm), y0, 2.2, 0, 7); ctx.fill()
      ctx.fillText(t, X(cm), y0 + 15)
    })

    // 透镜
    ctx.fillStyle = 'rgba(44,110,87,.08)'
    ctx.strokeStyle = '#2c6e57'; ctx.lineWidth = 1.6
    ctx.beginPath(); ctx.ellipse(X(0), y0, 10, 64, 0, 0, Math.PI * 2)
    ctx.fill(); ctx.stroke()

    // 物
    const ox = X(-u)
    arrow(ox, y0, OBJ_H, '#b26a2c')

    // 光屏
    ctx.strokeStyle = '#cfc8ba'; ctx.lineWidth = 3.5
    ctx.beginPath(); ctx.moveTo(X(s), y0 - 76); ctx.lineTo(X(s), y0 + 76); ctx.stroke()
    ctx.fillStyle = '#b3ab9e'; ctx.font = '11px sans-serif'
    ctx.fillText('光屏', X(s), y0 - 84)

    if (res.none) {
      setReads(null)
      return
    }

    const v = res.v, m = res.m
    const tip = { x: ox, y: y0 - OBJ_H }
    const imgTip = { x: X(v), y: y0 - OBJ_H * m }

    // 光线
    ctx.strokeStyle = '#c9a06f'; ctx.lineWidth = 1.35
    handLine(tip.x, tip.y, X(0), tip.y)
    ctx.setLineDash(v < 0 ? [5, 4] : [])
    handLine(X(0), tip.y, imgTip.x, imgTip.y)
    ctx.setLineDash([])

    ctx.strokeStyle = '#7fa595'
    handLine(tip.x, tip.y, X(0), y0)
    ctx.setLineDash(v < 0 ? [5, 4] : [])
    handLine(X(0), y0, v < 0 ? Math.max(24, imgTip.x) : imgTip.x,
             v < 0 ? y0 + (tip.y - y0) * 0.55 : imgTip.y)
    ctx.setLineDash([])

    // 像
    const solvedNow = !S.solved && LEVELS[S.level].check(v, u, S.f, s)
    if (v > 0) arrow(X(v), y0, OBJ_H * m, '#2c6e57', false, 2.2)
    else arrow(X(v), y0, OBJ_H * m, '#8b8378', true, 1.8)

    // 光屏上是否清晰
    const sharp = v > 0 && Math.abs(v - s) < 1.2
    if (sharp) {
      ctx.save()
      ctx.globalAlpha = .55
      arrow(X(s), y0, OBJ_H * m, '#2c6e57', false, 3)
      ctx.restore()
    }

    setReads({ v, m, sharp })
    if (solvedNow) win()
  }

  function setReads(r) {
    if (!r) {
      ;['vv', 'mv', 'ev', 'szv', 'scv'].forEach(k => $(k).textContent = '—')
      return
    }
    const { v, m, sharp } = r
    $('vv').textContent = v.toFixed(1) + ' cm'
    $('mv').textContent = m.toFixed(2) + '×'
    $('ev').textContent = m < 0 ? '倒立' : '正立'
    $('szv').textContent = Math.abs(m) > 1.02 ? '放大' : Math.abs(m) < 0.98 ? '缩小' : '等大'
    $('scv').textContent = v > 0 ? (sharp ? '清晰' : '未对准') : '接不到'
    $('scv').style.color = sharp || v < 0 ? 'var(--green)' : 'var(--red)'
  }

  function renderHud() {
    $('lv').textContent = `第 ${S.level + 1} 关 / 共 ${LEVELS.length} 关`
    $('goalWord').textContent = LEVELS[S.level].goal
    $('goalSub').textContent = LEVELS[S.level].sub
    $('dots').innerHTML = LEVELS.map((_, i) =>
      `<span class="dot ${i < S.level ? 'done' : i === S.level ? 'now' : ''}"></span>`).join('')
  }

  function win() {
    S.solved = true
    const L = LEVELS[S.level]
    $('quote').textContent = L.quote
    $('src').textContent = SRC
    $('more').textContent = L.more
    $('win').classList.add('show')
  }

  function nextLevel() {
    if (S.level >= LEVELS.length - 1) {
      $('win').innerHTML = '<span class="tag">全部完成</span><div class="quote">三关都过了：缩小实像 → 放大实像 → 虚像接不住。</div><div class="src">' + SRC + '</div>'
      $('win').classList.add('show')
      return
    }
    S.level++; S.solved = false
    $('win').classList.remove('show')
    // 每关给一个合理的起点，但不直接给答案
    if (S.level === 1) { S.f = 10; S.u = 16; S.s = 25 }
    if (S.level === 2) { S.f = 10; S.u = 14; S.s = 30 }
    syncInputs(); renderHud(); resize()
  }

  function syncInputs() {
    $('f').value = S.f; $('u').value = S.u; $('s').value = S.s
    $('fv').textContent = S.f; $('uv').textContent = S.u; $('sv').textContent = S.s
  }

  // ── 拖拽 ──
  let drag = null
  const toCm = (px) => (px - W / 2) / scale
  const px = (e) => {
    const r = cv.getBoundingClientRect()
    const p = e.touches ? e.touches[0] : e
    return p.clientX - r.left
  }
  const pick = (x) => {
    const ux = X(-S.u), sx = X(S.s)
    if (Math.abs(x - ux) < 28) return 'u'
    if (Math.abs(x - sx) < 26) return 's'
    return null
  }

  function down(e) {
    const x = px(e)
    drag = pick(x)
    if (drag) cv.classList.add('dragging')
    e.preventDefault()
  }
  function move(e) {
    if (!drag) return
    const cm = -toCm(px(e))
    if (drag === 'u') S.u = Math.max(4, Math.min(56, Math.round(cm)))
    else S.s = Math.max(2, Math.min(70, Math.round(-toCm(px(e)) * -1)))
    syncInputs(); resize()
    e.preventDefault()
  }
  function up() { drag = null; cv.classList.remove('dragging') }

  cv.addEventListener('mousedown', down)
  cv.addEventListener('mousemove', move)
  window.addEventListener('mouseup', up)
  cv.addEventListener('touchstart', down, { passive: false })
  cv.addEventListener('touchmove', move, { passive: false })
  window.addEventListener('touchend', up)

  // ── 滑块 ──
  ;['f', 'u', 's'].forEach(k => {
    $(k).addEventListener('input', e => {
      S[k] = Number(e.target.value)
      S.solved = false
      $('win').classList.remove('show')
      syncInputs(); resize()
    })
  })

  $('next').onclick = nextLevel
  window.addEventListener('resize', resize)
  renderHud(); syncInputs(); resize()
})()
</script>
</body>
</html>
